{
  id: "fund-drawdown-is-not-index-drawdown",
  track: "risk",
  level: "applied",
  title: "Your super fund fell 24% in the GFC while the ASX accumulation index fell 41%, and only one of those is your sequence exposure",
  source: "Australian Government Treasury, Retirement Income Review Final Report, November 2020, Chapter 2 (Adequacy), section 2C, Box 2C-6 and Chart 2C-22, using APRA and Market Index data",
  evidence: "Between September 2007 and March 2009 the ASX accumulation index, which includes dividend payments, fell 41%. The fall in superannuation fund returns over the same period was 24%, about 58% of the index move. Index set to 100 at December 2006. Treasury attributes the gap to diversification: superannuation funds help protect members from investment risk through prudent and diversified investment strategies, so falls in fund returns are typically significantly lower than those in equity markets. The box offers no other mechanism.",
  replication: "single",
  gateIntro: "You are trying to size how bad a crash could be for the money you will retire on. The obvious reference point is the worst peak-to-trough fall in the Australian share market. Before reading on: how close is that number to what a default super option actually lost over the same period, and would using the index number make you too pessimistic or too optimistic?",
  idea: "Headline index drawdowns are not portfolio drawdowns. Over the worst eighteen months of the GFC, September 2007 to March 2009, the ASX accumulation index fell 41% while superannuation fund returns fell 24%, roughly 58% of the index move. If you are stress-testing your retirement plan against the index number, you are testing a portfolio you do not own.",
  why: "The gap comes from what a default option actually holds. A MySuper balanced option is a mix of Australian and international equities, fixed interest, unlisted property and infrastructure, and cash. Only part of it tracks the ASX, and some assets rose while equities fell. Treasury's stated explanation is diversification and nothing else - that funds protect members through prudent and diversified investment strategies, so fund falls are typically significantly lower than equity market falls, and the 41% against 24% figures are the measurement of that protection over one episode. A second explanation is widely offered, that unlisted valuations lag listed markets and so flatter the reported drawdown in the short run. That one is not Treasury's. It appears nowhere in the box, the chart or the note, so treat it as a hypothesis to check against your own fund's valuation policy rather than as part of the finding.\n\nWhy this matters for sequence risk specifically: sequence risk is driven by how many units you are forced to liquidate at depressed prices, so the input is the drawdown of the thing you actually sell. Overstate it and you will over-insure, holding years of cash you did not need and paying for that in forgone compounding across a thirty-year retirement. Understate it and you will be short of buffer at the only moment a buffer matters. Neither error is cheap, and the index number produces the first one by default.\n\nThere is still a trap in taking comfort from the smaller number. A 24% fall in a portfolio you are drawing 4% a year from is a substantial permanent unit loss, and it is a fall you will experience while also selling into it. The right conclusion is to use your own option's realised drawdown as the input, not to conclude that diversification has solved sequence risk.\n\nThis is one measurement of one episode from one source, so it is filed as single. It also predates significant changes to how default options are constructed and how unlisted assets are valued, so the 41-to-24 ratio observed across 2007 to 2009 is not a constant you can apply to the next crash. What generalises is the method: get the drawdown of the option you hold, not the market you read about.",
  failureMode: "You size your cash buffer against a 41% equity fall when your option realistically falls half that, and you carry three or four extra years of cash into a thirty-year retirement. At a four percentage point return gap between cash and your growth option, that is a compounding drag on a large balance for decades, paid to insure against a scenario your portfolio does not face. The opposite error is less common but worse: sizing a buffer off a reported fund drawdown without asking how much of the option sits in assets that are not marked daily, which is a question for your fund's valuation policy rather than something this chart answers.",
  experiment: "Go to your fund's website and find the calendar-year or monthly return history for the specific investment option you are in, not the fund's headline balanced option. Find the worst peak-to-trough cumulative fall in that series. That percentage, applied to your projected retirement balance and combined with your planned annual dollar withdrawal, is your actual first-year sequence exposure. Compare it to what you would have assumed using the ASX number, and size your cash or defensive buffer off the first figure. While you are there, note what share of the option sits in unlisted assets and how often the fund revalues them.",
  reflection: "What is the worst peak-to-trough fall your specific investment option has actually recorded, and how many years of your planned withdrawals does your current cash holding cover against a fall that size?",
  recall: {
    q: "Why is the ASX accumulation index drawdown the wrong input for sizing your own sequence risk, and what should you use instead?",
    a: "Because you do not own the index. Between September 2007 and March 2009 the ASX accumulation index fell 41% while superannuation fund returns fell 24% over the same period, about 58% of the index move. Treasury attributes that gap to diversification: a default option holds international equities, fixed interest, unlisted property and infrastructure and cash alongside Australian shares, so only part of it tracks the ASX. Sequence risk is driven by the price at which you are forced to liquidate units, so the input has to be the drawdown of the thing you actually sell.\n\nUsing the index number makes you over-insure. Carrying several extra years of cash across a thirty-year retirement is a real compounding cost paid against a scenario your portfolio does not face. But do not swing the other way: a 24% fall on a portfolio you are drawing from is still a substantial permanent unit loss. The right method is to pull the realised peak-to-trough series for your specific investment option, apply it to your projected balance alongside your planned annual withdrawal, and size the defensive buffer off that. The 41-to-24 ratio is one measurement of one episode and predates changes to how default options are built, so do not treat it as a constant. And if your option holds a large unlisted allocation, ask the fund how often those assets are revalued - that is a real question about what a reported drawdown means, but it is your question to ask, not something Treasury's chart establishes."

{
  id: "long-run-housing-return-contested",
  track: "property",
  level: "core",
  title: "Two credible teams put the long-run real return on housing about three times apart",
  source: "Jordà, Knoll, Kuvshinov, Schularick & Taylor, \"The Rate of Return on Everything, 1870-2015\", NBER WP 24112 (December 2017), Table 3; Chambers, Spaenjers & Steiner, \"The Rate of Return on Real Estate: Long-Run Micro-Level Evidence\", Review of Financial Studies 34(8), 2021",
  evidence: "Jordà et al: 16 advanced economies, 1870-2015, 1,739 country-year observations. Real housing total return 7.05% p.a. (arithmetic mean, sd 9.98); real equity 6.89% p.a. (sd 21.94). Geometric means 6.61% housing, 4.64% equity. Mean real excess return over bills, equity 5.91%. Chambers et al: hand-collected property-level accounts from the institutional portfolios of four large Oxbridge colleges, 1901-1983; annualised real total return net of operating costs of approximately 2.3% for residential and 4.5% for agricultural real estate. The two residential estimates differ by 4.75 percentage points on Jordà et al's arithmetic mean, and by 4.31 points comparing like with like on their geometric mean.",
  replication: "contested",
  gateIntro: "You have absorbed, from somewhere, that housing has beaten shares over the long run. Two teams of serious economists have measured that exact question over more than a century. Before you read further, commit to a number: what real return per year do you think residential property has actually delivered? Then commit to a second number - how far apart could two competent, peer-reviewed teams possibly land on the same question?",
  idea: "The famous result that housing out-returned equities over 1870-2015 comes from national aggregate indices stitched together across 16 countries. A second team, reading the actual books of four institutional property portfolios, puts the annualised real total return on residential at roughly 2.3%. The two estimates differ by 4.75 percentage points a year, which is most of the size of the entire equity risk premium over bills in the first team's own data.",
  why: "The two studies are not measuring the same object, and that is the whole lesson. Jordà and co-authors build a total return from a national house price index plus a net rental yield, so the number is price change plus income. The yield is net of maintenance, ground rent and depreciation, which is more honest than most property arithmetic you will see, but it is still a yield applied to an index. No individual ever owned the index.\n\nChambers, Spaenjers and Steiner went the other way. They read property-level financial records from real institutional portfolios and found gross income yields that started around 5% and trended down for residential, with long-term real income growth close to zero. After the operating and management costs recorded in those accounts, residential landed near 2.3%. Their own summary of the result is blunt: real estate, housing in particular, is a less profitable investment in the long run than previously thought. Note what neither study deducts - an individual buyer's stamp duty and an agent's selling commission come off both figures, not just one.\n\nBefore you adopt 2.3% as the honest number, look at the window. It runs 1901 to 1983, which covers essentially the whole era of UK statutory residential rent control, in force from 1915 into the 1980s. That is a first-order candidate explanation for real rental income growth near zero, and it limits how far the figure travels to an uncontrolled Australian market in 2026. So neither estimate is your expected return. What you have is a range, and the width of that range is the finding.\n\nNotice also what happens to the aggregate comparison when you switch from arithmetic to geometric means. On arithmetic means housing wins narrowly, 7.05% to 6.89%. On geometric means - which is what a buy-and-hold investor actually compounds - housing wins by nearly two full points, 6.61% to 4.64%, purely because equities are far more volatile and volatility drags compounded returns down. The same table supports a narrow win or a wide win depending on which mean you quote. That is a warning about the table, not a fact about housing.",
  failureMode: "You anchor on something near 7% real for housing, then build a twenty-year plan on it. Compound the two estimates like with like - 6.61% geometric against 2.3% annualised - and twenty years apart they differ by about 2.3 times in terminal real wealth. That is not a plan that is slightly optimistic, it is a plan whose central assumption is unresolved in the literature. You will not settle it from your own data, because a single property over one holding period is far too noisy to distinguish those two hypotheses. You will find out when you sell.",
  experiment: "Take your own property, or the one you are considering, and compute a real total return, because that is what both papers measure. Net rent for the period - rent received minus every operating cost that actually left your account - plus the change in the property's value, all over the price you paid. Income alone is not comparable to either benchmark; a yield is roughly half the object. Deflate by CPI over your holding period, then compare the result to 6.61% and to 2.3%. Finally, subtract stamp duty at entry and estimated agent and legal costs at exit to get the number that applies to you rather than to a paper, since neither study deducts them.",
  reflection: "Which of these two measurements is closer to the asset you actually own or intend to own, and what specifically about your situation makes you say so?",
  recall: {
    q: "Two peer-reviewed teams estimate the long-run real return on residential property. What do they find, and why do they disagree so badly?",
    a: "Jordà, Knoll, Kuvshinov, Schularick and Taylor find 7.05% per year real on an arithmetic mean and 6.61% geometric, across 16 advanced economies over 1870-2015, from 1,739 country-year observations built as national house price indices plus net rental yields. Chambers, Spaenjers and Steiner find approximately 2.3% per year real net of operating costs for residential, from hand-collected property-level accounts of four Oxbridge college portfolios over 1901-1983. The gap is 4.75 percentage points on arithmetic means, 4.31 like for like.\n\nThey disagree because they measure different objects: an aggregate index with no idiosyncratic property risk, against the actual financial records of specific buildings with their recorded costs deducted. Neither deducts an individual purchaser's stamp duty or selling commission. It is filed as contested because both estimates stand in the literature and the field has not converged on one. Two cautions before you adopt either: the 1901-1983 window sits almost entirely inside UK statutory rent control, and the aggregate figure changes character depending on whether you quote its arithmetic or geometric mean."
  },
  deepDive: "Walk me through exactly how Jordà et al construct their housing total return from house price indices and net rental yields, and show me precisely which cost categories Chambers et al deduct from the college portfolio accounts."
},
{
  id: "australian-housing-window-dependence",
  track: "property",
  level: "core",
  title: "Whether Australian housing beat Australian shares depends entirely on which start date you pick",
  source: "Jordà, Knoll, Kuvshinov, Schularick & Taylor, \"The Rate of Return on Everything, 1870-2015\", NBER WP 24112 (December 2017 version), Table 5",
  evidence: "Average annual real returns for Australia. Full sample: equity 7.81%, housing 6.37%. Post-1950: equity 7.57%, housing 8.29%. Post-1980: equity 8.78%, housing 7.16%. Same dataset, same country, same authors, three windows, and the ranking flips twice. Sixteen-country unweighted averages over the same three windows: equity 6.60/8.24/10.68, housing 7.25/7.46/6.42. Table numbering is specific to the December 2017 working paper; later revisions and the published version renumber it.",
  replication: "single",
  gateIntro: "You are about to compare Australian residential property against Australian shares over the long run. There is a single authoritative dataset that reports exactly this, for three different start dates. Before you look: how much do you think the answer moves between a start date of 1870, 1950 and 1980? Commit to a number of percentage points, and commit to whether you think the winner changes.",
  idea: "In the Jordà et al country table, Australian equities beat housing over the full sample, housing beats equities from 1950, and equities beat housing again from 1980. The ranking reverses twice inside one table produced by one team from one dataset. Any confident statement about which asset wins in Australia is a statement about a chosen start date, not about the assets.",
  why: "This is the single most useful thing in the whole property-versus-shares argument, and almost nobody quotes it. The debate is conducted as though there is a fact of the matter that one side is refusing to see. There is not. The gap between the two assets in Australia is smaller than the sensitivity of that gap to where you start counting.\n\nLook at the magnitudes. Full sample, equities lead by 1.44 points. Post-1950, housing leads by 0.72 points. Post-1980, equities lead by 1.62 points. Those are all small numbers relative to the year-to-year variation in either series. What is being detected here is mostly which decades happened to fall inside the window, not a durable property of the assets.\n\nThere is a structural reason this happens and it is worth internalising. Housing and equity returns diverged sharply after the Second World War. Before it, real returns on housing, equities and safe assets moved together to a remarkable degree. After it they decoupled. So any window that straddles 1945 is averaging two different regimes, and the answer you get depends on the mix.\n\nAs an engineer you already know this failure mode by another name. It is the same thing as tuning a threshold on a backtest and reporting the in-sample result. The start date is a free parameter. If moving that free parameter flips your conclusion, you have not found a signal, you have found the width of your error bars, and you should report that width rather than the point estimate.",
  failureMode: "You read one article quoting one window, and you carry the conclusion for a decade. It costs you in two directions. If you concluded housing wins, you gear into an asset on evidence that reverses under a different start date. If you concluded shares win, you dismiss the one asset class an ordinary Australian can borrow five times their equity against on favourable terms. Both errors are large and both are avoidable by simply noticing that the source table reports three answers, not one.",
  experiment: "Pull the ASX All Ordinaries Accumulation Index and a capital city dwelling price index, both back as far as you can get them and both deflated by CPI. Before comparing, fix the mismatch that ruins most versions of this exercise: the accumulation index includes dividends, and the dwelling price index includes no rent at all. Build a housing total return the way the source does, price change plus a net rental yield for each year. Then compute the annualised real return for every possible ten-year start year in both series and plot the two distributions on the same axes. You are not looking for which mean is higher. You are looking at how much the two distributions overlap, and that overlap is the honest answer.",
  reflection: "When you last formed a view on property versus shares, what start date was implicitly baked into the evidence you were reading, and would you have noticed if it had been different?",
  recall: {
    q: "In the Jordà et al dataset, does Australian residential property beat Australian equities on long-run real returns?",
    a: "There is no single answer, and that is the finding. Over the full sample Australian equities return 7.81% real per year against housing at 6.37%. From 1950 housing leads, 8.29% against 7.57%. From 1980 equities lead again, 8.78% against 7.16%. One dataset, one country, one team, and the ranking reverses twice depending on the start date.\n\nThe practical lesson is that the gap between the two assets in Australia is smaller than the sensitivity of that gap to the measurement window. Any confident claim that one asset wins is really a claim about a chosen start date. It is filed as single because the three-window comparison comes from one team's dataset and has not been independently re-run, though the Australian inputs are not un-crosschecked - the authors take the modern net rent-price ratio from Fox and Tulip and build on Stapledon's Australian price work, and long-run Australian equity returns are independently produced by Dimson, Marsh and Staunton."
  },
  deepDive: "Show me the full Jordà et al country table for Australia across all three windows alongside the other 15 countries, and tell me how many of those countries also flip ranking between windows."
},
{
  id: "leverage-destroys-the-risk-adjusted-case",
  track: "property",
  level: "applied",
  title: "Housing's risk-adjusted advantage exists only ungeared, and gearing is the entire point of buying it",
  source: "Jordà, Knoll, Kuvshinov, Schularick & Taylor, \"The Rate of Return on Everything, 1870-2015\", NBER WP 24112 (December 2017), Table 3",
  evidence: "Full sample 1870-2015, 16 countries, 1,739 country-year observations. Mean real total return: housing 7.05% (sd 9.98), equity 6.89% (sd 21.94). Mean real excess return over bills: housing 6.07%, equity 5.91%. On the paper's own Sharpe definition - excess return over bills divided by the standard deviation of the risky asset - housing is 6.07/9.98 = 0.61 and equity is 5.91/21.94 = 0.27, so housing looks more than twice as good risk-adjusted. The paper contains no leverage analysis; the levered figures used in this entry are derived here from those inputs, not taken from the paper.",
  replication: "single",
  gateIntro: "The strongest genuine argument for residential property is not that it returns more. It is that it returns almost as much with less than half the volatility. Before reading on, answer this: if an asset has more than twice the risk-adjusted return of shares, and you can borrow 80% of its price at a mortgage rate, what happens to that risk-adjusted advantage once you have borrowed?",
  idea: "Ungeared, housing genuinely does look better than equities on a risk-adjusted basis in the Jordà et al data - a Sharpe of about 0.61 against 0.27, driven almost entirely by housing's much lower volatility. But leverage multiplies both the excess return and the volatility by the same factor, so it cannot improve a Sharpe ratio. Because you borrow at a mortgage rate rather than the bill rate, gearing strictly reduces it.",
  why: "Work the arithmetic rather than the intuition. A Sharpe ratio is excess return divided by standard deviation. Lever a position by a factor of L, funding at the risk-free rate, and both numerator and denominator multiply by L. The ratio is unchanged. You have bought more of the same trade, not a better one. This is the part people skip when they say leverage is what makes property work.\n\nNow fund it at a real mortgage rate instead of the bill rate. The numerator becomes L times the asset excess return minus (L minus 1) times the borrowing spread over bills. The denominator still just multiplies by L. Every dollar of that spread comes straight out of the Sharpe ratio, and it comes out five times over at 80% LVR. Gearing does not make housing a better risk-adjusted investment than shares. It converts a low-volatility, moderate-return asset into a high-volatility, moderate-return asset, and hands the difference to the lender.\n\nThe magnitudes are worth carrying. At 80% loan-to-value your equity stake is multiplied five times, so the index-level 9.98% standard deviation scales to roughly 50%. Ungeared equity volatility in the same table is 21.94%. That arithmetic is done here, not in the paper, but it uses the paper's own inputs and it is the calculation the paper's readers never do. What gearing genuinely delivers is higher expected absolute wealth, provided the asset return exceeds the borrowing cost and provided you are never forced to sell. Those two provisos do enormous work.\n\nOne caution about the 9.98% figure. It is the standard deviation of a national aggregate index, and an index is an average across many dwellings. Unless individual dwellings move together perfectly, the index is less volatile than the typical dwelling inside it, so whatever the true volatility of one house in one suburb is, it is higher than 9.98% and the levered figure above is a floor rather than an estimate. The paper does offer a hedged remark that cross-country housing returns have remained relatively uncorrelated, perhaps because housing is less globally tradable or more exposed to country-level shocks, but that is an observation about national indices, not a measurement of single-dwelling risk.",
  failureMode: "You justify an 80% LVR purchase on the grounds that property is the low-volatility asset. You have then constructed a position roughly 2.3 times as volatile as an ungeared share portfolio, funded by debt you must service out of salary, in an asset you cannot sell in pieces. The failure does not arrive as a bad return. It arrives as a job loss or a rate rise in the same quarter as a price fall, when the only available action is a forced sale at the worst possible price into an illiquid market.",
  experiment: "Take your actual or proposed loan. Compute your true exposure multiple as property value divided by your equity in it. Multiply that by 10% to get a rough floor on the annual volatility of your net position, then compare it against the volatility of the share portfolio you rejected as too risky. Then run the specific number that matters: what percentage fall in the property price takes your equity to zero? At 80% LVR it is 20%, before selling costs. Write that number down where you will see it before you next increase the loan.",
  reflection: "If you would not hold a share portfolio with 50% annual volatility, what is the argument for holding a geared property position with the same or higher volatility?",
  recall: {
    q: "Housing shows more than twice the Sharpe ratio of equities in the Jordà et al data. Why does that not survive a mortgage?",
    a: "Ungeared, housing's mean real excess return over bills is 6.07% against a total-return standard deviation of 9.98%, while equity is 5.91% against 21.94%. On the paper's own definition that is a Sharpe of 0.61 versus 0.27, and the advantage comes almost entirely from housing's lower volatility rather than from higher returns. Leverage multiplies both excess return and volatility by the same factor, so it leaves a Sharpe ratio exactly unchanged when you borrow at the risk-free rate.\n\nSince you borrow at a mortgage rate, not the bill rate, the borrowing spread is subtracted from the numerator while the denominator still scales in full, so gearing strictly reduces the risk-adjusted return. At 80% LVR you multiply exposure five times, taking the index-level 9.98% volatility to roughly 50%, more than double ungeared equities. That levered arithmetic is derived from the paper's inputs, not performed in it. And because a national index averages across many dwellings, one dwelling is more volatile than 9.98%, so 50% is a floor rather than an estimate."
  },
  deepDive: "Derive the levered Sharpe ratio algebraically with a borrowing rate above the risk-free rate, then compute it for my actual LVR and mortgage rate against the Jordà et al housing figures."
},
{
  id: "holding-costs-before-interest",
  track: "property",
  level: "core",
  title: "Non-interest costs of owning a dwelling run to 3.3% of its value a year, more than its long-run real price growth",
  source: "Fox & Tulip, \"Is Housing Overvalued?\", Reserve Bank of Australia Research Discussion Paper 2014-06, Table 1",
  evidence: "RBA user cost decomposition, April 2014. Running costs 1.5% of dwelling price per year, annualised transaction costs 0.7%, depreciation 1.1%, totalling 3.3% before the real interest rate of 3.3%. Of that 3.3%, 2.2 percentage points are cash costs and 1.1 is imputed physical decay. Buying and selling costs together are about 7.25% of property value, amortised over the ten-year median owner-occupier tenure from the ABS Survey of Income and Housing. Real constant-quality house prices, measured net of depreciation, rose 2.4% per year on average over 1955-2014. Average rental yield 4.2%. The framework is owner-occupier: it explicitly excludes property agent fees and land tax and carries no income tax term. On the paper's post-1955 expectations column, total user cost of 4.2% equals the 4.2% rental yield, from which the authors conclude housing was fairly valued in April 2014.",
  replication: "single",
  gateIntro: "Ignore the mortgage entirely. Imagine you own a dwelling outright, with no debt at all. Before you read on, write down what percentage of that dwelling's value it costs you to keep owning it for a year - rates, insurance, maintenance, the physical decay of the building, and the amortised cost of having bought it and eventually selling it. One number, as a percentage of the property's price.",
  idea: "The Reserve Bank's own decomposition puts the non-interest cost of owning an Australian dwelling at 3.3% of its price per year: 1.5% running costs, 1.1% depreciation, and 0.7% being the round-trip transaction cost of about 7.25% spread over the ten-year median tenure. Against constant-quality real capital appreciation of 2.4% a year, the cost of holding the asset exceeds the real growth in its price. Only 2.2 points of that 3.3 is cash leaving your account; the rest is decay you pay for later.",
  why: "Read those two numbers next to each other, because almost no property discussion ever does. Constant-quality real capital appreciation over 1955-2014 averaged 2.4% per year. Non-interest holding costs are 3.3% per year. Capital gain is not what pays for owning property. Rent is what pays for owning property, and the RBA puts the average rental yield at 4.2%.\n\nHandle the 1.1% depreciation line carefully, because Fox and Tulip say plainly that their estimates of depreciation have no net effect on the user cost. It appears twice in their arithmetic: once as a cost, and once added back when they build the appreciation figure, which is measured on a constant-quality net-of-depreciation basis. So do not read 3.3 against 2.4 as though the decay were counted only once and only against you. And do not blame depreciation for constant-quality growth being slower than the raw median, which grew 3.1%. The components that pull it down are alterations and additions at 1.1 points and the higher quality and size of new houses at 0.9 points. The raw price you read in the paper includes money owners spent on their houses and includes newer, bigger stock.\n\nThe transaction figure deserves attention, because the 0.7% is an artefact of an assumption. It is 7.25% amortised over ten years, the ABS median tenure. Hold for five years instead and the annual drag is 1.45%. Hold for three and it is 2.4%, which by itself equals the entire long-run real appreciation. The shorter your holding period, the more of your return the entry and exit eat, and the effect is hyperbolic rather than linear.\n\nTwo things about basis and vintage. This is an owner-occupier framework: it excludes expenses an investor pays and an owner-occupier does not, specifically property agent fees and land tax, and it has no income tax term at all. It is also April 2014, and interest rates have moved a great deal since, though the three cost components are structural rather than cyclical. It is worth knowing where the paper actually lands, because it is not where this entry's framing might suggest: with total user cost at 4.2% and the rental yield at 4.2%, Fox and Tulip conclude the cost of owning equalled the cost of renting and houses were fairly valued. The 3.3% is not an argument that buying loses. It is the part of the cost most people leave out of the arithmetic entirely.",
  failureMode: "You model ownership as rent, or imputed rent, minus interest, and treat everything else as noise. The omitted 3.3% is larger than the margin most Australian property arithmetic runs on. You will not notice year by year, because the cash half arrives irregularly as a strata special levy, a hot water system, a vacancy, a re-letting fee, and the depreciation half never arrives as a bill at all - it arrives as a discount from the buyer when the condition of the dwelling is finally priced. If you are an investor rather than an owner-occupier, your true figure is higher than 3.3%, because agent fees and land tax sit outside the RBA's basis entirely.",
  experiment: "Total every dollar that left your account for the property in the last twelve months on the same basis the RBA uses: council rates, water, insurance, strata and every repair. Deliberately leave out agent management and letting fees and land tax, not because they are not real, but because the 1.5% benchmark excludes them and you cannot compare across bases. Divide by the property's current value and compare to 1.5%. Then take your actual purchase costs plus estimated selling costs, divide by the number of years you realistically expect to hold, and compare that to 0.7%. If you are an investor, add agent fees and land tax back as a separate line the RBA figure never counted.",
  reflection: "What holding period did you assume when you bought, and how much would your annualised transaction cost rise if you actually sold in half that time?",
  recall: {
    q: "What does the Reserve Bank estimate it costs each year to own an Australian dwelling, excluding interest, and how does that compare to long-run capital growth?",

  idea: "On the 2026/27 NSW schedule, transfer duty on a $1.2 million purchase is $48,187, or 4.02% of the price. The schedule is progressive, so the percentage rises with price: 4.56% at $2 million and 5.46% at $5 million once premium property duty applies to residential purchases above $3,870,000. None of it is deductible against your income - it goes into the cost base and you recover it, in nominal terms, only when you sell.",
  why: "The reason this number deserves its own entry is that it is a cost you pay in year zero, in cash, out of savings that were otherwise earning a return. At 4.02% of the price, the property has to appreciate by more than 4% before you are back where you started, and that is before conveyancing, inspections and the eventual agent commission. Convert it into your own units rather than borrowing anyone's average yield: divide $48,187 by the annual net rent you actually expect on that specific property, and you have the number of years of rent your entry ticket consumes.\n\nBe careful about the bracket structure, because it is the specific thing people get wrong. The rate schedule is marginal, not a flat rate applied to the whole value. The $387,001 to $1,290,000 bracket charges $11,602 plus $4.50 per $100 over $387,000. Only the slice above the threshold attracts the higher rate. The same is true of premium property duty at $3,870,000: the 7% applies to the excess, not to the whole price. Every bracket boundary in this schedule is continuous, which is a useful check - if your calculation jumps discontinuously at a threshold, you have applied a rate to the whole value.\n\nThe thresholds are indexed to CPI annually, which is why quoting a premium duty threshold from memory or from an article written two years ago is a reliable way to be wrong. The 2026/27 premium threshold is $3,870,000. It was a different number last year and will be a different number next year.\n\nThe treatment matters as much as the amount. Duty is a capital cost, not a deduction. It joins your cost base and reduces your eventual capital gain. That makes its real value to you dependent on the capital gains regime in force when you sell, and that regime is changing from 1 July 2027 - which turns a settled question into an open one.",

  evidence: "Announced in the 2026-27 Budget, delivered on 12 May 2026: negative gearing limited to new builds from 1 July 2027. The Budget states existing arrangements remain unchanged for all properties held before Budget night, and that affected investors \"will be able to carry forward unused losses to future years but won't be able to deduct them against other income like wages\". New builds acquired after Budget night also retain full deductibility. The Budget does not define whether \"held\" is tested at contract or at settlement, and does not state what income the carried-forward losses may be offset against. Treasury's Tranche 2 exposure draft was open for consultation 4-21 August 2026 and the measure was not law as at 8 August 2026.",

  idea: "The 2026-27 Budget limits negative gearing to new builds from 1 July 2027. For an affected established dwelling, rental losses can still be carried forward to future years but can no longer be deducted against other income such as wages. Properties held before Budget night on 12 May 2026 are unaffected, as are new builds acquired after it.",
  why: "The mechanical change is narrower than the headlines suggest and the practical change is larger. Nothing is destroyed. The losses still exist, they are still yours, and the Budget says they carry forward. What the Budget does not say is what pool they can be set against. The natural reading, and the way quarantining normally works elsewhere in the tax code, is that they offset residential rental income and gains from the property. Treat that as an inference rather than a stated rule until the final Act says so, because the exposure draft was still open when this was written.\n\nThe timing consequence is the part worth modelling and it holds under any reading. Under the old arrangement, a $12,000 loss at a 47% marginal rate returned about $5,640 in cash in the year it arose. Under the new one, the same loss is banked until you have something to absorb it against. That deferral is worth strictly less, and how much less depends on how long you wait and what inflation does in the interim. If you hold for a decade, you receive the same nominal credit in much cheaper dollars.\n\nThe grandfathering line is drawn at properties held before Budget night. \"Held\" is not the same word as \"acquired\", and the difference is load-bearing for anyone who exchanged near 12 May 2026: for CGT purposes acquisition is at contract date, while a property is arguably held from settlement. The Budget does not resolve it and the draft legislation had not been passed. What is clear enough to act on is that the line exists and it creates a genuine two-tier market, in which the same apartment carries a different after-tax cost depending on which side of Budget night its owner sits.\n\nThe new-build carve-out is the policy's stated intent, focusing tax support on new supply. Whether it achieves that is an empirical question nobody can answer yet. What you can act on is the differential: from 1 July 2027 a new build and an established dwelling with identical rents and identical prices have materially different after-tax returns for a high-income buyer.",
  failureMode: "You buy an established dwelling in 2026 or early 2027 on a spreadsheet that books the annual loss against your salary in the year it arises, because that is how every article you have read for twenty years described it. The error is not the whole deduction - the credit survives and carries forward. The error is the timing, and its size is the present-value difference between a refund of roughly $5,640 in year one and the same nominal credit received years later, possibly not until sale. On a marginal property that difference is frequently what separates a deal that works from one that does not, and it is entirely invisible in a model that never discounts.",

  id: "cgt-indexation-replaces-discount",
  track: "property",

  title: "The 50% CGT discount is replaced by inflation indexation plus a minimum 30% tax on gains",
  source: "Australian Government, Budget 2026-27, tax reform measures; exposure draft \"Capital Gains Tax and Negative Gearing - Tranche 2 Legislation\", Treasury consultation open 4-21 August 2026",
  evidence: "Announced in the 2026-27 Budget, delivered 12 May 2026: from 1 July 2027 the 50% CGT discount is replaced with a discount based on inflation, together with a minimum 30% tax on gains. The Budget states the intent is that \"investors will only pay tax on their real capital gain, restoring the original intent of the CGT arrangements\". The reforms apply only to gains arising after 1 July 2027. Investors in new builds may choose either the existing 50% discount or the new arrangements. The Budget does not specify whether the 30% minimum applies to the nominal gain or to the indexed gain, and entity scope was still being settled in Treasury's Tranche 2 exposure draft, open 4-21 August 2026. The measure was not law as at 8 August 2026.",
  replication: "statute",
  asAt: "2026-08-08",
  sourceUrl: "https://budget.gov.au/content/04-tax-reform.htm",
  gateIntro: "You hold an asset for fifteen years. It doubles in nominal terms. Inflation over that period was 2.5% a year. Before reading on: under a 50% discount, and under a regime that indexes your cost base for inflation instead, which one taxes you less? Then answer a harder one - if the asset had tripled instead of doubled, would your answer change? The comparison depends on three variables, and most commentary quotes two.",
  idea: "From 1 July 2027 the flat 50% capital gains discount is replaced by a discount based on inflation, with a minimum 30% tax on gains. Indexation taxes only the real gain rather than a fixed half of the nominal gain, so the change is not uniformly a tax rise. Which regime treats you better depends on your holding period, on inflation, and on how much the asset actually grew - and on one design detail the Budget does not specify.",
  why: "The two regimes have completely different shapes, and that is the thing to understand before anyone tells you whether the change is good or bad for you. A 50% discount is indifferent to holding period and to inflation: hold for thirteen months or thirty years, you are taxed on half the nominal gain either way. Indexation is the opposite. It scales your cost base up with prices, so the longer you hold and the higher inflation runs, the more of your nominal gain is exempted as illusory.\n\nThe comparison is exact and you can run it yourself. Indexation produces a lower taxable amount than the 50% discount precisely when (1+π)^n is greater than 0.5 × (S/C) + 0.5, where π is inflation, n is your holding period and S/C is the gross nominal multiple on the asset. That third term is the one every commentary drops, and it is often the term that decides. An asset that doubles needs the inflation factor to clear 1.5, which at 2.5% takes about seventeen years. An asset that triples needs it to clear 2.0, which at 3% inflation takes about twenty-four years. A high-growth asset does not benefit from indexation at any plausible holding period, regardless of what inflation does.\n\nThe minimum 30% tax is layered on top, and the Budget says only \"a minimum 30 per cent tax on gains\" without saying which gain. That ambiguity is not cosmetic. If the floor applies to the nominal gain, it caps how much benefit a long hold in a high-inflation period can extract from indexation. If it applies to the indexed real gain, it caps nothing of the sort and binds only on taxpayers whose marginal rate sits below 30%, a group that includes many retirees and low-income earners holding a single investment property. Those are materially different measures. Any calculation you encounter that resolves this quietly is guessing, and as at 8 August 2026 the exposure draft had not settled it.\n\nTwo further details change the planning. The reforms apply only to gains arising after 1 July 2027, so gains accrued before that date are not retrospectively caught. And new build investors may elect the existing 50% discount instead which, combined with the negative gearing carve-out for new builds, means the tax code is now pushing hard in one direction. Entity scope was also unsettled, so anything you read about trusts, companies or super funds should be checked against the final legislation rather than against commentary.",
  failureMode: "You conclude this is simply a tax rise and bring a sale forward into 2026-27, or you conclude indexation is generous and hold on. Both are coin flips until you have put your own gross multiple, holding period and inflation assumption into the inequality, and the coin is further weighted by a design detail - the base of the 30% floor - that was not settled when you decided. The cost is a large, irreversible transaction driven by a regime you did not model and, on the published information, could not fully specify.",
  experiment: "Take one asset. Write down C, your cost base, and S, a realistic sale value. Compute 0.5 × (S/C) + 0.5 - that is the inflation factor indexation must beat. Then compute (1+π)^n for your actual holding period at 2%, 3% and 5%. If none of them clear the bar, indexation is worse for that asset at any plausible inflation rate and the 30% floor cannot rescue it. If one does clear it, compute the tax both ways at your marginal rate, then compute it again assuming the 30% minimum applies to the nominal gain, and see whether your conclusion survives both readings of the floor.",
  reflection: "For your largest holding, what gross multiple are you sitting on, and does that number alone put you on the wrong side of the indexation bar regardless of what inflation does?",

{
  id: "timing-cost-is-one-tenth-of-a-percent",
  track: "behaviour",
  level: "core",
  title: "Bad timing costs fund investors 0.10% a year, not the 1.2% that gets quoted",
  source: "Fulkerson, Jordan, Riley & Yan, \"Bad Timing Does Not Cost Investors 15% of Their Funds' Returns: An Examination of Morningstar's 'Mind the Gap' Study\", Financial Analysts Journal 82(3), pp. 34-42, 12 May 2026",
  evidence: "Re-analysis of Morningstar's Mind the Gap sample over 2015-2024. The authors report Morningstar's published estimate as a 1.2% annual shortfall, described there as equivalent to around 15% of those funds' gains over that span, and find that using the identical sample, suboptimal timing by mutual fund investors results in only 0.10% annual underperformance - roughly one twelfth the size. The paper's full text is paywalled; the figures here come from the published abstract, and the underlying Morningstar report could not be retrieved directly.",
  replication: "overclaimed",
  gateIntro: "You have seen the claim that investors surrender a chunk of their funds' returns to bad timing - buying high, selling low, chasing performance. It is one of the most repeated findings in retail finance. Before reading on, commit to a number: how many percentage points per year do you think the average fund investor actually loses to their own timing decisions?",
  idea: "Morningstar's Mind the Gap reports a 1.2% annual timing shortfall for 2015-2024, framed as investors forfeiting around 15% of their funds' gains. Fulkerson, Jordan, Riley and Yan re-ran the analysis on the identical sample and found the timing cost is 0.10% per year. The effect is real and correctly signed, it is just roughly a twelfth of the advertised size.",
  why: "This is the cleanest example in personal finance of a real effect being correct in sign and wrong by an order of magnitude in size. Nobody is claiming investors have perfect timing. The paper's own title concedes there is a cost. What it disputes is that the cost is anywhere near large enough to justify the use the industry makes of it, which is overwhelmingly as an argument for paying someone to stop you from doing something.\n\nWhat this entry will not tell you is why the two numbers differ. The published abstract states the result and not the driver, and the full text sits behind a paywall. There are plausible candidates - the counterfactual the investor return is benchmarked against, how the sample is weighted, how funds that close mid-window are handled - and you will find commentary asserting each of them confidently. Attributing a mechanism you have not read is exactly the move this site exists to stop. What you can rely on is that two sets of authors ran the same sample and got numbers a factor of twelve apart, and that the smaller one comes from a team writing in a peer-reviewed journal specifically to correct the larger.\n\nThe practical significance of 0.10% versus 1.2% is enormous and runs in a specific direction. At 1.2%, behavioural coaching plausibly pays for a full advice fee. At 0.10%, it does not come close to covering the fee charged to deliver it. That is why the number matters commercially, and it is worth knowing which side of that trade the widely quoted figure originates from.\n\nThere is a structural lesson underneath. The gap is the small difference between two large return numbers, each built from choices about samples, weighting and counterfactuals. A statistic of that form inherits the full assumption risk of both inputs, which is why an apparently solid 1.2 can collapse to 0.10 without anyone finding a data error. Whenever you see a headline that is one big number minus a slightly smaller big number, ask for both constructions before you spend anything on the difference.",
  failureMode: "You accept the 1.2% figure and use it to justify a recurring cost - an adviser retainer, a managed account, a behavioural-coaching wrapper - on the grounds that it prevents a larger loss. If the true timing cost is 0.10%, you are paying a fee many times the size of the problem it solves, every year, compounding, for decades. The cost of this error is not the timing gap. It is the fee you agreed to because you believed the gap was twelve times bigger than it is.",
  experiment: "Measure your own timing cost rather than your own gap. Pull every contribution and withdrawal on your largest holding with its date and compute the internal rate of return on those actual cash flows. Then recompute the IRR with identical amounts but every date moved to the first business day of its month, so the schedule is mechanical and no judgement remains in it. The difference between the two numbers is your timing decisions, isolated. Do not instead subtract the fund's reported time-weighted return from your IRR and call the remainder behaviour: those two figures answer different questions over different cash flows, and the sign of the difference depends on the shape of the return path rather than on anything you did.",
  reflection: "What have you paid for, or changed, on the strength of the 1.2% figure - and would you still pay for it at 0.10%?",
  recall: {
    q: "Morningstar reports a 1.2 percentage point annual investor return gap. What did the independent re-analysis find?",
    a: "Fulkerson, Jordan, Riley and Yan, writing in Financial Analysts Journal 82(3) in May 2026, re-analysed Morningstar's Mind the Gap sample for 2015-2024 and found that poor timing costs fund investors 0.10% per year. Morningstar's published figure for the same period and sample was 1.2%, framed as roughly 15% of those funds' gains, so the corrected estimate is about one twelfth the size.\n\nThe reason for the discrepancy is not something to assert. The paper's abstract reports the corrected number without identifying the driver, and the full text is paywalled, so any confident mechanism you read about it is commentary rather than source. It is filed as overclaimed rather than failed because the effect is real and correctly signed - it is simply far smaller than the popular version. The structural point stands regardless: the gap is the small difference between two large return figures, so it carries the assumption risk of both, which is how 1.2 becomes 0.10 without anyone finding a data error."

  deepDive: "Find the full text of Fulkerson, Jordan, Riley and Yan and tell me exactly which methodological choice accounts for the difference between 1.2% and 0.10%, quoting the paper rather than commentary about it."

{
  id: "disposition-effect-odean",
  track: "behaviour",
  level: "core",
  title: "Investors sell winners at one and a half times the rate they sell losers, and the winners beat the losers over the following year",
  source: "Odean, \"Are Investors Reluctant to Realize Their Losses?\", Journal of Finance 53(5), October 1998, pp. 1775-1798",
  evidence: "Trading records for 10,000 randomly selected accounts at a nationwide US discount brokerage, January 1987 to December 1993. Entire year: proportion of gains realised 0.148 against proportion of losses realised 0.098, a difference of 0.050 with a t-statistic of 35, from 13,883 realised gains, 79,658 paper gains, 11,930 realised losses and 110,348 paper losses. In December the ordering reverses: PGR 0.108 against PLR 0.128, t-statistic 4.3. Measured account by account, average PGR 0.57 and PLR 0.36. Restricting to sales with no new purchase within three weeks, PGR 0.449 against PLR 0.281, so the effect is not rebalancing. Winners sold outperformed losers held by 1.03 percentage points in excess return over the following 84 trading days, 3.41 over 252 and 3.58 over 504.",
  replication: "replicated",
  gateIntro: "You hold two stocks. One is up 30%, one is down 30%, and you need to raise cash. Before reading on: which do you sell, and what do you predict happens to the two of them over the following year? Be honest about the first answer before you look at the second.",
  idea: "Odean found investors realise gains at about 1.5 times the rate they realise losses, and the pattern survives controls for rebalancing. It is not merely costly in tax: the winners that get sold go on to beat the losers that get kept by 3.41 percentage points over the following year. The single exception is December, when the tax incentive briefly flips the behaviour.",
  why: "The size of the asymmetry is what makes this finding hard to dismiss. A proportion of gains realised of 0.148 against a proportion of losses realised of 0.098 is not a subtle tilt - it is a t-statistic of 35, computed across more than 215,000 position observations. Whatever is driving it is not noise, and it is not a small minority of accounts. Measured account by account rather than trade by trade, the average PGR is 0.57 and the average PLR is 0.36.\n\nThe December reversal is the detail that turns a correlation into something close to a natural experiment. If selling winners were driven by rational portfolio management, December should look like every other month. It does not. In December, when realising losses delivers a tax benefit, the ordering flips: PGR falls to 0.108 and PLR rises to 0.128. Investors demonstrably can sell losers when they are given a concrete reason to. The other eleven months they mostly do not.\n\nThe obvious defence is that selling winners is just rebalancing, and Odean tests it directly rather than arguing about it. Controlling for rebalancing and for share price, the effect is still observed, and when he restricts the sample to sales with no new purchase within three weeks - which removes rebalancing almost by construction - the asymmetry gets stronger, PGR 0.449 against PLR 0.281. Whatever this is, it is not portfolio maintenance.\n\nThen the returns, which remove the last respectable defence. The usual justification for holding losers is mean reversion. Odean finds the opposite: the winners investors sold beat the losers they held by 3.41 percentage points over the subsequent 252 trading days. Read the horizon carefully, because it is the part most retellings mangle. The differential is 1.03 points at 84 trading days, 3.41 at 252 and 3.58 at 504. It opens up over the first year and then essentially stops. Odean himself sets this against Jegadeesh and Titman's momentum at horizons up to eighteen months and DeBondt and Thaler's reversals at three to five years. The winners keep winning for about a year; beyond that this data says nothing. The mechanism usually offered is prospect theory, with gains and losses evaluated against a purchase-price reference point, but that explanation is plausible rather than established by this data. What the data establishes is the behaviour and its cost.",
  failureMode: "You need cash, and you choose which position to sell by looking at your purchase price. The one that is up feels like a gain to lock in; the one that is down feels like something you should not crystallise. On Odean's numbers you are disposing of the asset that beats the one you keep by 3.4 points over the next year, and paying capital gains tax for the privilege. Do not annualise that 3.4 - it is a one-off divergence on the pair that has largely stopped growing by the second year, adding only 0.17 points between year one and year two. It is still a real cost, repeated every time you raise cash the same way, and it stays invisible because you never see the portfolio you would have had.",
  experiment: "List every position you have sold in the last two years and every position you still hold. For each, record whether it was above or below your purchase price at the point you decided. Compute your own PGR and PLR the way Odean does: realised gains divided by realised plus paper gains, and the same for losses. If your PGR meaningfully exceeds your PLR, you have the effect. Then pull the twelve-month return on everything you sold and everything you kept from the date of each decision, and price it - twelve months, because that is the horizon over which the divergence in the paper actually opens up.",
  reflection: "When you last needed to raise cash from your portfolio, did you choose which position to sell based on your purchase price or based on your view of its future?",
  recall: {
    q: "What is the disposition effect, how large is it in Odean's data, and what makes it clearly a mistake rather than a strategy?",
    a: "Odean, in the Journal of Finance in 1998, analysed 10,000 discount brokerage accounts over 1987-1993 and found investors realised gains at a proportion of 0.148 against 0.098 for losses - roughly 1.5 times the rate, with a t-statistic of 35. It is not rebalancing: controlling for rebalancing and share price the effect persists, and restricted to sales with no new purchase within three weeks it strengthens to PGR 0.449 against PLR 0.281.\n\nTwo further results establish it is a mistake rather than a strategy. In December, when tax-loss selling is advantageous, the ordering flips to PGR 0.108 against PLR 0.128, showing investors can sell losers when given a reason. And the winners investors sold outperformed the losers they held by 3.41 percentage points in excess return over the following 252 trading days, which kills the mean-reversion defence. That differential is a one-off divergence, not a recurring annual drag: it is 1.03 points at 84 trading days and only 3.58 at 504, so it should not be compounded across a decade. Filed as replicated because the effect has been independently reproduced on new data across other markets and countries in the decades since."
  },
  deepDive: "Compute my own PGR and PLR from my trading history using Odean's definitions, and show me the twelve-month returns on what I sold versus what I held."
}
);

<script>
/*
 * A four-operator arithmetic evaluator over named profile fields.
 *
 * Entries declare their sum as a string, so something has to turn that string
 * into a number. Not eval, and not a Function constructor: this runs in a page
 * that holds the reader's own financial figures, and an expression is content
 * rather than code. The grammar is an allowlist - decimal numbers, declared
 * identifiers, the four operators, brackets, and a leading sign. Anything else
 * fails to tokenise, so a call, a subscript, a semicolon or a property access
 * never reaches an evaluator at all.
 *
 * Both halves of the toolchain use this. build.js compiles every expression at
 * build time and checks its identifiers against the declared profile, which is
 * what stops a typo from surfacing as a silent NaN months later on the one day
 * that entry comes up.
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.EXPR = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  var NUM = /^\d+(?:\.\d+)?/;
  var NAME = /^[A-Za-z_][A-Za-z0-9_]*/;
  var PREC = { '+': 1, '-': 1, '*': 2, '/': 2 };

  function tokenize(src) {
    var s = String(src), out = [], i = 0;
    while (i < s.length) {
      var rest = s.slice(i), c = rest.charAt(0), m;
      if (c === ' ' || c === '\t' || c === '\n') { i++; continue; }
      if ((m = NUM.exec(rest))) { out.push({ t: 'num', v: parseFloat(m[0]) }); i += m[0].length; continue; }
      if ((m = NAME.exec(rest))) { out.push({ t: 'name', v: m[0] }); i += m[0].length; continue; }
      if (c === '(' || c === ')') { out.push({ t: c }); i++; continue; }
      if (PREC[c]) { out.push({ t: 'op', v: c }); i++; continue; }
      throw new Error('unexpected "' + c + '" at position ' + i);
    }
    if (!out.length) throw new Error('empty expression');
    return out;
  }

  /* Shunting-yard. `expectOperand` is what rejects the shapes that tokenise
     cleanly but are not arithmetic: two values in a row, a doubled operator
     such as **, or a bracket opening straight after a value, which is how a
     function call would have to look. */
  function toRPN(tokens) {
    var out = [], ops = [], expectOperand = true, i, tk, top;
    for (i = 0; i < tokens.length; i++) {
      tk = tokens[i];
      if (tk.t === 'num' || tk.t === 'name') {
        if (!expectOperand) throw new Error('two values in a row near "' + tk.v + '"');
        out.push(tk);
        expectOperand = false;
      } else if (tk.t === 'op') {
        if (expectOperand) {
          if (tk.v !== '-' && tk.v !== '+') throw new Error('"' + tk.v + '" needs a value before it');
          out.push({ t: 'num', v: 0 });          // unary: -x becomes 0 - x
          ops.push(tk);
        } else {
          while (ops.length) {
            top = ops[ops.length - 1];
            if (top.t === 'op' && PREC[top.v] >= PREC[tk.v]) out.push(ops.pop());
            else break;
          }
          ops.push(tk);
        }
        expectOperand = true;
      } else if (tk.t === '(') {
        if (!expectOperand) throw new Error('a bracket cannot follow a value');
        ops.push(tk);
        expectOperand = true;
      } else {
        if (expectOperand) throw new Error('empty brackets');
        while (ops.length && ops[ops.length - 1].t !== '(') out.push(ops.pop());
        if (!ops.length) throw new Error('unbalanced brackets');
        ops.pop();
        expectOperand = false;
      }
    }
    if (expectOperand) throw new Error('expression ends with an operator');
    while (ops.length) {
      top = ops.pop();
      if (top.t === '(') throw new Error('unbalanced brackets');
      out.push(top);
    }
    return out;
  }

  function compile(src) { return toRPN(tokenize(src)); }

  function names(src) {
    var seen = {}, out = [];
    tokenize(src).forEach(function (tk) {
      if (tk.t === 'name' && !seen[tk.v]) { seen[tk.v] = 1; out.push(tk.v); }
    });
    return out;
  }

  /* Returns null rather than NaN for a missing field or a division by zero.
     A NaN would render as "NaN" and read as a computed answer. */
  function run(src, vars) {
    var rpn = compile(src), st = [], i, tk, a, b, v;
    for (i = 0; i < rpn.length; i++) {
      tk = rpn[i];
      if (tk.t === 'num') { st.push(tk.v); continue; }
      if (tk.t === 'name') {
        v = vars ? vars[tk.v] : undefined;
        if (typeof v !== 'number' || !isFinite(v)) return null;
        st.push(v);
        continue;
      }
      b = st.pop();
      a = st.pop();
      if (tk.v === '+') st.push(a + b);
      else if (tk.v === '-') st.push(a - b);
      else if (tk.v === '*') st.push(a * b);
      else if (b === 0) return null;
      else st.push(a / b);
    }
    v = st.pop();
    return (typeof v === 'number' && isFinite(v)) ? v : null;
  }

  return { compile: compile, names: names, run: run, tokenize: tokenize };
});
