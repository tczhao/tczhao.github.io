  worked: "第十一条在当月就变成了全会的规定。据人民网中国共产党新闻网的一篇报道，西柏坡纪念馆的展板写着：根据毛泽东的提议，全会作出六条规定，即不做寿，不送礼，少敬酒，少拍掌，不以人名作地名，不要把中国同志同马恩列斯平列。据求是网二〇二〇年的一篇文章，党中央三月二十三日离开西柏坡，毛泽东在这时提出“进京赶考”，并说“我们决不当李自成”。\n\n后来的做法有两头。一头是没有守住。一九八一年六月，十一届六中全会通过《关于建国以来党的若干历史问题的决议》，谈到一九六六年五月至一九六九年四月的“文化大革命”时写道：毛泽东同志的左倾错误的个人领导实际上取代了党中央的集体领导，对毛泽东同志的个人崇拜被鼓吹到了狂热的程度。\n\n另一头是重申。一九八〇年二月二十九日，十一届五中全会通过《关于党内政治生活的若干准则》，其中“坚持集体领导，反对个人专断”一部分写道：书记是党的委员会中平等的一员，不允许搞“一言堂”、家长制；禁止给领导人祝寿、送礼、发致敬函电，禁止用党的领导人的名字作街名、地名、企业和学校的名字。后一组禁令同一九四九年六条规定里的不做寿、不送礼、不以人名作地名相同，又增加了对活着的人不许设纪念馆、领导人外出时不得组织迎送等项；前一句则是把第一条里书记和委员之间“少数服从多数”的关系，写成了制度条文。一九八二年十二大通过的党章又写入“党禁止任何形式的个人崇拜”。本篇没有核实十二条里其余各条的后续情况，这里不作评价。",
  experiment: "找出你团队里一个以某个人或某个小组的名字叫开的平台、约定或 runbook，也可以是你自己定下的那一个。给它写一页纸：它被设计来解决什么问题，如果它不再管用，最先会在哪个指标上看出来，什么条件出现时就该弃用它。把这一页放进它的文档首页，写明一个公开的复查日期。到那一天，只按这一页上的条件判断它去留，不看是谁定的。",
  reflection: "你负责的系统里，哪一件东西是因为是谁定的而不是因为它管用，才一直留着没人动？",
  recall: {
    q: "《党委会的工作方法》第十一条要求领导者力戒骄傲，它在条文里给出了哪些具体做法？",
    a: "禁止给党的领导者祝寿，禁止用党的领导者的名字作地名、街名和企业的名字，保持艰苦奋斗的作风，制止歌功颂德现象。\n\n容易忘的是适用的对象：它说的是没有犯过大错误、工作有了很大成绩的人也不要骄傲。成绩大的人最需要这条，因为他周围最先少掉的是实话。"
  },
  deepDive: "这是我们团队里目前定下的十二项做法，以及我对每一项执行得怎么样的判断。帮我对照党委会十二条方法逐项打分并要我拿出证据，指出哪一项我是在凭印象，以及我这个团队里有哪些东西是因为谁定的才留下来的。"
},
{
  id: "right-then-we-correct",
  track: "leadership", level: "v3",
  title: "“只要你说得对，我们就改正”：批评看内容，不看是谁说的",
  source: "《为人民服务》（一九四四年九月八日），第三卷",
  idea: "领导者对批评的态度，由他为谁工作决定，不由他的脾气决定。既然是为人民服务的，就不怕别人批评指出缺点，不管谁指出都行，标准只有一个：说得对不对，对人民有没有好处。对了就改正，办法好就照办。",
  why: "这是毛泽东在中共中央警备团追悼张思德的会上的讲演，日期是一九四四年九月八日。据题注，张思德是警备团的战士，九月五日在陕北安塞县山中烧炭，炭窑崩塌而牺牲。讲演不长，开头先讲死的意义有轻重，引司马迁的话说“人固有一死，或重于泰山，或轻于鸿毛”，为人民利益而死就比泰山还重。\n\n第二段由这个前提推出一条做法：因为我们是为人民服务的，所以如果有缺点，就不怕别人批评。这里的“所以”是论证的核心。接受批评的理由不是谦虚，而是目的：队伍存在的理由是人民的利益，一条意见只要对人民有好处，不论出自谁的口，都比维护自己的面子更符合这个目的。原话把这一点写得很具体：“不管是什么人，谁向我们指出都行”，“只要你说得对，我们就改正”。\n\n他举的例子是“精兵简政”。这条意见是党外人士李鼎铭提出的，“他提得好，对人民有好处，我们就采用了”。讲演接着说，只要为人民的利益坚持好的、改正错的，队伍就一定会兴旺起来。后面几段讲的是同一个目的的另一面：要“尽量地减少那些不必要的牺牲”，干部要关心每一个战士，不管死的是炊事员还是战士，只要做过有益的工作，都要开追悼会，并且要成为一个制度。这篇讲演真正要求的是：标准定在内容上，而且要有人去判断说得对不对；它说明了态度，没有说明程序。",
  failureMode: "这篇讲演没有点名反对谁，它立的是一条规矩，对着的是一种常见的做法：先看是谁说的，再决定要不要听。对批评的取舍取决于说话的人是上级、同级、党外人士还是新来的人，而不取决于话本身。\n\n在今天的工程团队里，它的样子是：另一个团队的工程师在评审里指出，这个平台的告警有一半从来没有人处理，建议砍掉。团队的第一反应是问他有没有值过这个班，然后把意见搁置。三个月后，值班的人换成了新人，告警疲劳成了离职面谈里的常见原因。",
  worked: "李鼎铭的例子在文本之外有后续。据《为人民服务》的题注，李鼎铭一九四一年十一月在陕甘宁边区第二届参议会上提出“精兵简政”的提案，并在这次会议上当选为边区政府副主席。一年之后，毛泽东在陕甘宁边区高级干部会议的报告（一九四二年十二月，《抗日时期的经济问题和财政问题》）里写道，这次会议以后就要实行精兵简政，必须是严格的、彻底的、普遍的，目标是精简、统一、效能、节约和反对官僚主义五项。这一条意见从边区参议会进入了边区的财政方针，这是文本里“采用”一词的实际含义。\n\n这条规矩后来在毛泽东自己手里经受过更难的考验。一九五七年春天，中共发起整风，号召党外人士提批评。一九八一年六月十一届六中全会通过的《关于建国以来党的若干历史问题的决议》对这件事作了定性：整风本身是正常的，极少数人乘机向党和社会主义制度发动进攻，予以反击是正确和必要的；但“反右派斗争被严重地扩大化了，把一批知识分子、爱国人士和党内干部错划为‘右派分子’，造成了不幸的后果”。决议的结论是，一批人被错划，也就是他们说的话被错判了性质，而“说得对不对”正是要判断的事。被划成右派的人数，官方数字和独立研究相差很大，本篇没有核实，这里不引。\n\n两件事摆在一起能看出，“只要你说得对”这条标准本身没有错，缺的是判断对错的程序和判断人的约束：李鼎铭的提案有一个参议会来表决，一九五七年的批评交给谁、按什么标准去判断，讲演里没有写。",
  experiment: "找出过去一个季度里，别的团队的人在评审、事故复盘或工单里对你的系统提过、而你们没有采纳或没有回应的五条意见。把提意见的人的名字、职位、团队全部去掉，只留下意见本身，写在一页纸上。对每一条写出：如果它是对的，哪一个可观察的现象会出现；检查这个现象最便宜的办法是什么。挑一条最便宜的现在就检查，把结果写回那条意见下面。",
  reflection: "你最近没有采纳的一条批评，换一个说话的人，你会不会采纳？你拿什么来判断它说得对不对？",
  recall: {
    q: "《为人民服务》里，毛泽东说党和军队不怕批评，理由是什么？批评被采纳的标准是什么？他举了谁的哪条意见作例子？",
    a: "理由是“因为我们是为人民服务的”，所以不怕别人批评指出缺点，不管是什么人都行。标准是说得对不对、对人民有没有好处：对了就改正，办法好就照办。例子是党外人士李鼎铭提出的“精兵简政”。\n\n容易忘的是这是一个推理，不是一种美德：理由放在目的上，标准放在内容上。讲演只定了标准，没有写由谁、按什么程序判断说得对不对。"
  },
  deepDive: "这是我们团队最近收到的几条批评，以及我们各自的处理。帮我去掉提意见的人是谁这个信息，只按内容判断每一条对不对，指出我是在哪几条上因为说话的人而打了折扣，并为每条设计一个最便宜的检验。"
},
{
  id: "who-carries-the-heavy-load",
  track: "leadership", level: "v2",
  title: "不“拈轻怕重”：谁挑重担子，是对工作负责任的检验",
  source: "《纪念白求恩》（一九三九年十二月二十一日），第二卷",
  idea: "对工作负责任和对同志热忱，不是内心的状态，而是看得见的行为：重担子谁在挑，一件事当前先替谁打算，出了力是不是要人人知道，对同志是热心还是漠不关心。同一篇文章还要求对自己的技术精益求精，不要鄙薄技术工作。",
  why: "这是毛泽东为纪念诺尔曼·白求恩写的文章。据题注，白求恩是加拿大共产党员、医生，一九三八年初率领医疗队来到中国，三月底到延安，后在晋察冀边区工作一年多，一九三九年十一月十二日在河北唐县因救治伤员时受感染逝世。文章写在他去世之后四十天左右。毛泽东在文中说，他和白求恩只见过一面，后来白求恩给他写过许多信，他因为忙，只回过一封，还不知道对方是否收到。\n\n文章有三层。第一层是国际主义：一个外国人毫无利己的动机，把中国人民的解放事业当作自己的事业，这是国际主义的精神，也是共产主义的精神，每个中国共产党员都要学习。第二层最具体，也是这里要读的：他“毫不利己专门利人”的精神，表现在对工作的“极端的负责任”和对同志对人民的“极端的热忱”。文章没有停在褒奖上，而是接着列出反面的行为：对工作不负责任，“拈轻怕重”，把重担子推给人家；“一事当前，先替自己打算，然后再替别人打算”；出了一点力就觉得了不起，喜欢自吹；对同志对人民冷冷清清，漠不关心。第三层讲白求恩的职业：医术在八路军医务系统中很高明，这对于一班“鄙薄技术工作”的人是一个极好的教训。\n\n把一种精神写成几条可以逐项对照的行为，是这篇文章对领导者有用的地方：它可以拿来检查人，也可以拿来检查自己。要注意它是一篇纪念文章，写的是一个已故者的品质，没有给出怎样衡量和怎样纠正的办法。这个方法真正要求的是，品质要落到分担的具体事情上去看，而不是靠宣布。",
  failureMode: "文中针对的是不少共产党员身上的这几种行为，原文都写得很具体：拈轻怕重，把重担子推给人家，自己挑轻的；先替自己打算；出一点力就自吹，生怕人家不知道；对同志对人民冷冷清清。技术方面的毛病是见异思迁，鄙薄技术工作，以为不足道、没有出路。\n\n在今天的工程团队里，它的样子是：一次大的迁移分出两份活，一份是新系统的设计，一份是清理旧系统、处理遗留的告警和夜里的值班。设计写成了文档，发了邮件，成了季度总结里的一条；清理的活没有人认领，最后落到团队里最资深的一位工程师头上，而这件事在晋升材料里写不出一行。",
  worked: "文中说的技术工作，白求恩自己是怎样对待的，各种叙述不完全一致。英文维基百科的“白求恩”条目称，他多次向晋察冀军区司令员兼政委聂荣臻建议办医学校，以解决部队医务人员短缺的问题，随后成立了培训队，一九三九年九月十八日卫生学校成立；同一条目没有把学校单独记在他名下。本篇只引这一点；他在战场上连续做手术的具体数字，各来源在时间和地点上说法不一，没有采用。\n\n文章提出的“鄙薄技术工作”这一条，后来在中共自己的历史上也有记录。一九八一年六月十一届六中全会通过的《关于建国以来党的若干历史问题的决议》写道：一九五六年一月中央召开的知识分子问题会议和随后提出的“百花齐放、百家争鸣”方针，规定了对知识分子和教育科学文化工作的正确政策；反右派斗争扩大化之后，在对待知识分子问题、教育科学文化问题上发生了愈来愈严重的左的偏差，后来发展成为“文化大革命”的导火线；“文化大革命”对所谓“反动学术权威”的批判，使许多有才能、有成就的知识分子遭到打击和迫害。决议还提出要坚决扫除那种“长期间存在而在‘文化大革命’期间登峰造极”的轻视教育科学文化和歧视知识分子的观念，并明确肯定知识分子同工人、农民一样是社会主义事业的依靠力量。\n\n文章的态度和后来的做法之间的距离，是这里最值得读的：一九三九年的文本把技术当作值得精益求精的事，把鄙薄它的人当作该受教育的对象；一九八一年的决议讲的是同一件事，只是它记下的是这个态度没有守住。本篇没有核实这期间各项政策的具体内容，也不对白求恩一生的其他方面作评价。",
  experiment: "把你团队上个季度所有的工作按“重”和“轻”分一下。重的标准你自己定，并写下来，例如：夜里会被叫醒的、没有人认领的、写不进季度总结的、拖了超过两个季度的遗留迁移。从工单、值班记录和事故复盘里数出每一类工作由谁承担，包括你自己。如果你承担的重活比团队平均份额少，选一项现在就接下来，并把原来的负责人从这件事上放出来。",
  reflection: "这个季度团队里最重的一件事是什么，是谁在做？你在这件事上花了多少小时？",
  recall: {
    q: "《纪念白求恩》里，毛泽东说白求恩“毫不利己专门利人”的精神表现在哪两个方面？文章列了哪些反面的行为？",
    a: "表现在对工作的极端的负责任，和对同志对人民的极端的热忱。反面的行为是：拈轻怕重，把重担子推给人家；一事当前先替自己打算；出一点力就自吹；对同志对人民冷冷清清，漠不关心。\n\n容易忘的是文章的第三层：白求恩是个医生，对技术精益求精，这对鄙薄技术工作的人是个教训。负责任和精通业务在文中是同一个人身上的两件事。"

{
  id: "develop-the-base-not-the-budget-line",
  track: "leadership", level: "v3",
  title: "“发展经济，保障供给”：不在收支上打圈子，也不空嚷大计划",
  source: "《抗日时期的经济问题和财政问题》（一九四二年十二月），第三卷",
  idea: "财政困难不能只在收支上打圈子，也不能靠收缩必要的开支来解决，要从发展经济上解决。但发展要看此时此地的具体条件，不能空嚷大计划，两种错误要同时反对。向下面取东西的时候，要同时帮助对方增长，使对方有所失同时有所得，并且所得大于所失。",
  why: "这是毛泽东在陕甘宁边区高级干部会议上所作报告《经济问题与财政问题》的第一章，原题《关于过去工作的基本总结》，时间是一九四二年十二月。据题注，一九四一年和一九四二年是抗战期间根据地最困难的时期：日军进攻，国民党包围封锁，财政极其困难。报告里说，最困难的一次在一九四〇年和一九四一年，曾经几乎没有衣穿、没有油吃、没有纸、没有菜，战士没有鞋袜，工作人员冬天没有被盖。边区只有一百五十万人口，要供养几万军队和工作人员，人民缴纳的公粮是一九四〇年九万担，一九四一年二十万担，一九四二年十六万担。\n\n论证从一个判断开始：“财政政策的好坏固然足以影响经济，但是决定财政的却是经济。”所以，忘记发展经济、忘记开辟财源，而企图从收缩必要的开支去解决困难的保守观点，“不能解决任何问题”。办法是自己动手：边区政府办自给工业，军队大规模生产，机关学校也发展自给经济。他特意说明这种自给经济是“特殊条件下的特殊产物”，在别的历史条件下是不合理的，眼下却完全合理并且必要，也就是说，这个办法不是普遍原则，而是此时此地的解。\n\n同一份报告同时划了另一条线。有些同志不顾具体条件空嚷发展，要求建设重工业，提出大盐业计划、大军工计划，他说这些都是“不切实际的”。他把它们和保守观点并列，称为党在财政经济工作中两条战线上的斗争。第三个问题是对人民：单纯强调政府施“仁政”是错误的，不顾人民困难、“竭泽而渔”也不行，要使人民“有所失同时又有所得，并且使所得大于所失”，在公私关系上是“公私兼顾”。他还说，自给经济愈发展，加在人民身上的赋税就可以愈减轻。这个方法真正要求的是：每一个解决办法都先问此时此地的条件具不具备，向下取的每一份都要说得出怎样补回去。",
  failureMode: "报告点名的有三种做法：脑子终日在单纯的财政收支上打圈子，用收缩开支来堵窟窿；不顾此时此地的条件，空嚷发展，提大计划；以及两个极端的对人民的态度，一边强调施“仁政”，一边在困难时只顾向人民要东西。\n\n在今天的工程团队里，它的样子是：云账单比预算高了四成。一种回应是冻结招人，砍掉测试环境，推迟工具建设，结果发布变慢、事故变多，被砍掉的恰是本可以把单位成本降下来的东西。另一种回应是宣布一个两年的自研调度平台计划，没有一张工作负载的数据表支撑。第三种发生在平台对各业务团队的收费或配额上：只提高价格、压低配额，没有同时提供迁移的办法，让他们得到点什么。",
  worked: "这一章的方针后来在边区大规模推行。据选集题注，在“发展经济，保障供给”的方针下发展起来的陕甘宁边区和敌后各根据地的生产运动，取得了巨大的成绩，使根据地军民渡过了抗战最困难的时期，题注还把《开展根据地的减租、生产和拥政爱民运动》和《组织起来》列为当时领导生产运动的基本纲领。本篇没有核实后来的产量和公粮数字：几种来源给出的自给比例互相出入，例如同一年的数字就有两个版本，所以不引。\n\n文章点名反对的那一种错误，后来出现在毛泽东主持的运动里。一九八一年六月十一届六中全会通过的《关于建国以来党的若干历史问题的决议》写道，一九五八年“没有经过认真的调查研究和试点，就在总路线提出后轻率地发动了‘大跃进’运动和农村人民公社化运动”，使以高指标、瞎指挥、浮夸风和“共产风”为主要标志的左倾错误严重泛滥；主要由于“大跃进”和“反右倾”的错误，加上自然灾害和苏联政府撕毁合同，国民经济在一九五九年到一九六一年发生严重困难。决议同时记录了纠正：一九六〇年冬，党中央和毛泽东开始纠正农村工作中的左倾错误，一九六二年一月召开七千人大会，初步总结经验教训。决议还说，毛泽东在领导纠正时提出了不能剥夺农民、不能超越阶段、反对平均主义。\n\n把两个文本摆在一起可以看到，一九四二年的报告里写下的两个检验，在一九五八年的做法里缺位了：一个是具体条件具不具备，一个是对人民所得是否大于所失。这是决议的概括，决议的评价本身也有它的立场，细节要读当时的材料，本篇不展开。",
  experiment: "拿你们现在面临的一项成本或容量缺口，写下团队里已经提出的所有解决办法，每个一行。把每个办法归到三类里：收缩开支，提高单位产出，上新的大平台。对每一项写两句：它依赖的此时此地的条件现在是否具备，证据是什么；如果它向业务团队收取什么（价格、配额、强制改造），业务团队得到什么，所得是否大于所失。把写不出证据的两项各换成一个一周内能验证条件的最小实验。",

  recall: {

{
  id: "break-through-one-point-then-spread",
  track: "leadership", level: "v3",
  title: "一般号召之后，要“突破一点，取得经验”",
  source: "《关于领导方法的若干问题》（一九四三年六月一日），第三卷",
  idea: "任何工作都要有一般的号召，但只有号召，领导者就无法检验它对不对，也无法充实它。号召之后，领导者要自己选二三个单位深入进去，把事情做通，取得经验，再用这点经验去指导其余单位。没有从个别单位的具体事件里得到过经验的人，没有资格向所有单位作普遍的指导。",
  why: "这是一九四三年六月毛泽东为中共中央起草的领导方法决定的第二条，第一条把它同“领导和群众相结合”并列为必须采用的两个方法。当时延安整风进入第二年，决定里的证据也取自整风：一九四二年各地整风，凡有成绩的，都采用了一般号召和个别指导相结合的方法，凡没有成绩的，都没有采用。\n\n论证是这样的。没有一般的普遍的号召，就不能动员广大群众。但如果只限于号召，领导人员没有具体地直接地从若干组织把所号召的工作深入实施，“突破一点，取得经验”，然后利用这种经验去指导其它单位，就“无法考验自己提出的一般号召是否正确”，也无法充实号召的内容，号召就有归于落空的危险。决定还规定了做法：各中央局、分局、区党委和地委，除了提出全年整风计划，还要在自己机关和附近的机关、学校、部队里选二三个单位（不要很多），详细了解整风学习在那里的发展过程，了解其中几个有代表性的工作人员的政治经历、思想特点、学习勤惰和工作优劣，并亲自指导这些单位的负责人解决具体问题。\n\n这一条的分量落在最后一句：任何领导人员，凡不从下级个别单位的个别人员、个别事件取得具体经验的，“必不能向一切单位作普遍的指导”。第六条说的是另一个方向：一般意见要从许多个别指导里形成，再拿到许多单位里去考验，然后总结新的经验。它真正要求的是：号召只是假设，领导者自己下到一个具体的点上去做一遍，是对这个假设的检验，不能由下面去替他检验。",
  failureMode: "决定第五条点出的错误是：许多同志满足于工作任务的一般号召，号召之后不注重、不善于紧接着从事个别的具体的指导，因而使自己的号召“停止在嘴上、纸上或会议上”，变成官僚主义的领导。\n\n在今天的平台团队里，它的样子是：一个新的部署规范在全员会上宣布，写进了维基，在频道里发了三次提醒，采纳率停在三成。没有人陪一个团队走完整个迁移，所以没有人知道它对有状态的服务根本走不通，也没有人知道文档里的第四步是写错的。八个月之后，采纳率仍旧停在三成，团队把这归因为各团队不配合。",
  worked: "同一时期延安有一个相近的做法，不是这份决定写的，但用的是同一个思路：树一个具体的典型，再拿典型去带动全体。据陕西政协网和人民网传媒频道的介绍，一九四二年五月前后，边区公营工厂因工资、工时问题出现相当普遍的罢工风潮，中央职工运动委员会派人到边区农具厂处理，在调查中发现了坚守岗位的工人赵占魁；毛泽东称他为“中国式的斯达汉诺夫”，同年九月起，边区广泛开展了“赵占魁运动”。这些叙述也记下，一九四三年二月中央职工运动委员会书记邓发还要撰文处理运动在一些地方发展不平衡的问题，说明从点到面不是一次号召就能完成的。\n\n这个办法在后来的应用里出现过另一种结果：点被当成唯一的样板。一九六〇年代起，“农业学大寨”把山西大寨大队作为全国农业的典型。一九八〇年十一月二十三日，中共中央转发山西省委《关于农业学大寨运动中经验教训的检查报告》并加批语，此后它被基本定性为“左”倾错误的产物。国史网的研究述评记录了评价上的分歧：有研究者认为运动的问题在于被纳入“文化大革命”的轨道、把一个典型推向全国，并指出各地条件千差万别，只学一个典型就不实事求是；也有学者指出，运动后期有所调整，一些自然条件恶劣的地方借鉴了大寨艰苦奋斗的作风，摆脱了贫困。\n\n把两件事和这一条对照，差别在于“点”的用途：一九四三年的决定要求领导人员自己下去，从二三个单位取得经验，再回头修改一般号召；样板被固定下来、要求各地照学，经验就不再回流，号召也就不再被检验。决定里关于一九四二年整风的结论，由毛泽东在文件中作出，文中没有给出数字，本篇也没有另行核实。",
  experiment: "找出你们团队正在推行或准备推行的一项全局要求，比如新的部署规范、可观测性标准或值班规则。不要先发公告。选两个团队，其中一个条件最难，陪他们完整做一遍，记录过程里每一个卡点，并了解他们里面两三个有代表性的人的实际处境。把你原来要写进公告的内容，按卡点逐条改一遍，再拿这份修改过的版本去带其余团队，同时写明哪一个可观察的结果将说明它走得通。",
  reflection: "你最近发出的一项全局要求，你有没有亲手在一个具体的团队里从头做过一遍？做完之后你改了它的哪一部分？",
  recall: {

    a: "只有一般号召，就无法考验自己提出的号召是否正确，也无法充实它，号召有落空的危险。号召之后，领导者要选二三个单位（不要很多），深入了解那里的发展过程和几个有代表性的人，亲自指导负责人解决具体问题，取得经验，再用它去指导其余单位。\n\n容易忘的是两点：选的点不要多；而且经验要回头修改号召本身，最后总结新的经验，再向下作普遍指导。"

{
  id: "foresee-the-change-shrink-what-you-built",
  track: "leadership", level: "v3",
  title: "“事先看到”情况变了：机构是为过去建的，要亲手缩小",
  source: "《一个极其重要的政策》（一九四二年九月七日），第三卷",
  idea: "一个组织的大小，不看绝对的大小，看它和眼前的情况合不合。情况变了，原来为过去建的庞大机构就同新情况发生矛盾，领导者要事先看到这一点，并且由当初建它的人亲手把它缩小。最难的不是道理，而是人被现状和习惯束缚。",
  why: "这是毛泽东为延安《解放日报》写的社论，日期是一九四二年九月七日。据题注，精兵简政是一九四一年十一月李鼎铭等在陕甘宁边区第二届参议会上提出的，同年十二月中共中央发出指示，要求整顿党政军各级机构，精简机关，充实连队，加强基层，提高效能，节约人力物力。社论写在这之后九个月：晋冀鲁豫边区抓得紧，做出了模范，但还有若干根据地的同志认识不够，没有认真进行。\n\n社论先讲时机。抗战进入第五年以后，接近胜利，但又有极端的困难，也就是“黎明前的黑暗”。他说，这种特点，领导人员必须“事先看到”；如果看不到，就只会跟着时间迁流，虽然也在努力工作，却不能取得胜利，反而有使事业受到损害的危险。他拿航船作比方：今后的暗礁，是物质方面极端严重的困难，党中央指出了它，要大家提起注意绕过去。\n\n然后是机构本身。庞大的战争机构是适应过去的情况建的，那时的情况容许这样，也应该这样；现在根据地缩小了，还可能再缩小，“战争的机构和战争的情况之间已经发生了矛盾”。敌人的“三光”政策正是要扩大这个矛盾，如果还维持庞大的机构，就正中敌人的计。他把这叫做“鱼大水小”的矛盾。最后他讲到人：庞大的机构是自己亲手创造的，又要由自己的手缩小，就觉得勉强、困难，这是为现状和习惯所束缚，就像季节交替时人往往不会换衣服。这篇社论真正要求的是：判断机构该多大的标准是它和情况合不合，而判断要在情况变坏之前作出，由建它的人来动手。",
  failureMode: "社论针对两种毛病。一种是没有事先看到：觉得今后也不过如此，处之泰然，缺乏事先看出航船将遇到暗礁的能力。另一种是看到了也下不了手：机构是自己创造的，缩小就觉得兵少不足以应敌，为习惯所束缚。\n\n在今天的工程团队里，它的样子是：一个变更评审委员会，建于每周都出事故的那一年，每次发布要排两周的队。后来自动化测试和灰度发布成熟了，事故降到每季度一两起，但委员会还在，建它的人是现在的团队负责人，他每次被问到都回答：它正是事故少的原因。没有人拿得出去掉它之后会怎样的数据，因为从来没有人试过。",
  worked: "边区的实际做法有记录可查。据陕西省图书馆的陕甘宁边区红色记忆资源库和上海市机构编制研究的回顾文章，边区政府一九四二年十二月通过《简政实施纲要》，一九四三年三月十三日正式公布，规定政府系统人员由一万一千五百人减到七千五百人，整编到一九四四年一月结束。各来源在结果的数字上不一致：边区直属机关由三十五个减为二十二个，另有资料写作二十个；区以上机关精简人数和比例的口径也不同，所以这里只引计划数，不引结果。\n\n社论提的问题后来又出现了。一九八二年三月，五届全国人大常委会第二十二次会议通过国务院机构改革的决议，据人民网、改革大数据服务平台等的叙述，国务院所属部委、直属机构和办公机构由一百个调整为六十一个，编制由五万多人减到三万多人（魏礼群的口述访谈给的编制数是三万八千人，各来源不一致）。此后国务院又有多次机构改革，说明机构大小和情况是否相合，要不断重新判断，不是一次精简能够解决的。\n\n本篇没有核实一九四三年以后边区机构有没有再度增加，也没有核实一九八二年以后各次改革的结果。这两处只能说明社论提出的问题在后来的历史里一再出现，不能说明它被解决了。",
  experiment: "找出一个你亲手建立的流程、评审关卡、值班分级或服务。写下它当初为了应付的情况，用数字写，例如每周事故数、团队规模、变更量。再写今天的数字，以及它现在每个月花掉多少人的时间。如果情况已经变了，设计一个“夏服”版本：去掉它，或者只留最要紧的一步。选一个团队试两周，并事先写明什么现象出现就恢复原样。另外写一条你预期未来半年到一年里会变的条件，以及哪一个现有的结构到那时会装不下。",
  reflection: "你们团队里有哪个结构，是你自己当初建的，现在每次有人问起，你的回答里有多少是数据，多少是习惯？",

    a: "因为庞大的战争机构是适应过去的情况建的，现在根据地缩小了，机构和情况之间发生了矛盾，就是“鱼大水小”；敌人的“三光”政策要扩大这个矛盾，所以必须缩小机构，使兵精政简。障碍是为现状和习惯所束缚：机构是自己亲手建的，缩小时觉得勉强、困难。\n\n容易忘的是前提：领导人员必须事先看到情况的变化，否则只会跟着时间迁流。"
  },
  deepDive: "这是我亲手建立的一个流程或结构，当初为了应付的情况，以及现在的数字。帮我判断它和现在的情况还合不合，设计一个去掉它或只留最要紧一步的两周试验和恢复条件，并指出我哪些理由是数据、哪些是习惯。"

{
  id: "no-bridge-no-crossing",
  track: "leadership", level: "v1",
  title: "任务要配方法：“不解决桥或船的问题，过河就是一句空话”",
  source: "《关心群众生活，注意工作方法》（一九三四年一月二十七日），第一卷",
  idea: "领导者不能只提出任务，还要解决完成任务的方法问题。任务是过河，没有桥或船就过不去，方法不解决，任务只是“瞎说一顿”。方法也要具体：用实际的具体的工作方法，不用官僚主义的方法；用耐心说服，不用命令主义。",
  why: "这是毛泽东在一九三四年一月二十二日至二月一日于江西瑞金召开的第二次全国工农兵代表大会上所作结论的一部分（据题注）。他开头说，有两个问题，同志们在讨论中没有着重注意：一个是群众生活，另一个就是工作方法。当时敌人正在筑碉堡，推进第五次“围剿”，中心任务是动员群众参加革命战争。\n\n论证很短。苏维埃政府的两大任务，一是组织革命战争，二是改良群众生活，所以工作方法的问题“就严重地摆在我们的面前”。接着是过河的比方：任务是过河，但没有桥或船就不能过，不解决方法问题，任务就是空话。他举的例子是扩大红军：不注意扩大红军的领导，不讲究扩大红军的方法，“尽管把扩大红军念一千遍，结果还是不能成功”。查田、经济建设、文化教育、新区边区的工作，道理相同。\n\n另一半是正面的做法。他表扬了兴国和赣东北的同志，说他们把群众生活和革命战争联系起来了，把工作方法问题和工作任务问题同时解决了；又要求先进地方帮助薄弱的地方，“要造成几千个长冈乡，几十个兴国县”。这一条真正要求的是：每一项任务交下去的时候，要同时交下去一座桥，也就是具体到谁、用什么办法、走哪几步的做法，而且这座桥由提任务的人负责去想，不能留给接任务的人。",
  failureMode: "文中点的毛病是：提出任务，念了又念，却不讲究怎样做。扩大红军只靠一遍遍地号召，其它各项工作也只提任务，不注意实行时的方法，用官僚主义的方法，用命令主义的方法，不用耐心说服的方法，结果是“什么任务也是不能实现的”。\n\n在今天的工程团队里，它的样子是：一条要求发到全员邮件里，要所有服务本季度完成向新网关的迁移，附一个截止日期和一张采纳率表格。没有迁移脚本，没有对有状态服务的处理办法，也没有给各团队留出排期的时间。季度末采纳率停在四成，表格上最后几行被标成红色，每周例会上轮流有人解释为什么还没做完。",
  worked: "这篇讲话里点名的两个对照，都来自毛泽东自己的叙述。他说汀州市政府只管扩大红军和动员运输队，群众缺柴、缺盐、缺房、米贵的问题一概不讨论，一百多个代表因为几次会都只谈扩红，不高兴到会，会议也召集不成，扩红因此成绩极少；长冈乡和才溪乡则把救济、办米、募捐帮助火灾户同扩红、销公债一起做。这些是讲话人的一面之词，文本里没有第三方的核对。\n\n选集自己的注释能核对其中的数字。注三引用了毛泽东一九三三年十一月写的《才溪乡调查》：长冈乡十六岁至四十五岁的青年壮年男子四百零七人，“出外当红军、做工作”的三百二十人，占百分之七十九；上才溪五百五十四人中四百八十五人，占百分之八十八；下才溪七百六十五人中五百三十三人，占百分之七十。正文说长冈乡“百个人中有八十个当红军去了”，才溪乡是八十八个，对照注释可见，正文的数字是四舍五入的，八十八只是上才溪一个村，下才溪是百分之七十，而且调查里统计的是“当红军、做工作”的人，不单是红军。注五记载，到一九三四年一月底，江西已筑碉堡四千多座。\n\n这座桥后来承受的压力有史家的记录。黄道炫在《张力与限界：中央苏区的革命（1933至1934）》（社会科学文献出版社，二〇一一年）里的结论是，第五次反“围剿”前后，中央苏区的人力、物力和管理已经到了“限界”。据《中华读书报》二〇一二年一月四日对这本书的报道，书中的例子包括新兵最短只训练六天就上前线，有的地方为筹备军粮，税赋比苏区成立前增加了一倍。讲话里的方法解决的是怎样动员，书里记录的是动员本身有上限：模范乡的做法可以推广，但它能供应的人力和粮食不会因为方法好就无限增加。",
  experiment: "把过去两个季度里你或你上面的人发出的全部硬性要求列出来，比如迁移、升级、新的值班规则、新的评审关卡。对每一项写出这座桥的四个部件：工具或脚本在哪里，文档里卡点最多的是哪一步，一个典型团队完成它要花多少人天，这些人天从哪个计划里扣。四项写不全的要求，要么补上缺的部件，要么正式撤回，不要继续挂在表格里。把补桥的活排进你自己下个月的工作。",
  reflection: "你上一次提出的要求，有没有哪一项接任务的人拿到的只有任务本身？如果现在让你亲自去完成它，你要花多少天，第一个卡住你的是什么？",

    a: "比方是过河：任务是过河，没有桥或船就不能过，不解决桥或船的问题，过河就是一句空话；不解决方法问题，任务只是瞎说一顿。例子是扩大红军，不讲究方法，把它念一千遍也不能成功。\n\n容易忘的是正面的一半：他要的是实际的具体的工作方法和耐心说服，同时要先进的地方去帮助薄弱的地方，把兴国那样的县推广开。"

  id: "task-boundary-conduct-in-one-handoff",
  track: "leadership", level: "v5",
  title: "交代任务的时候，政策界限和工作作风要一起交代",
  source: "《反对官僚主义、命令主义和违法乱纪》（一九五三年一月五日），第五卷",
  idea: "下面出了危害群众的事，不能只归咎于个别坏人。指示指出的一个原因在上面的领导方法：任务交下去了，政策界限和工作作风没有联系在一起交代，没有“反复地指示给中下级干部”。交一件工作，要把做什么、不许做什么、怎样做三件事一起交，并且反复交，另外还要审查接任务的人。",
  why: "这是毛泽东为中共中央起草的党内指示（据题注），日期是一九五三年一月五日。指示先承认“三反”已经基本解决了中央到专区四级工作人员中的贪污、浪费，以及领导者同被领导的机关人员相脱离的官僚主义；没有解决的，是不了解离自己的机关稍远一点的下情，不了解县、区、乡三级干部中有许多命令主义和违法乱纪的坏人坏事，或者知道了也“熟视无睹”。例子是人民来信，据报有的省人民政府就积压了七万多件没有处理。\n\n接着指示列出这类问题的几个来源，每一条都以“这是”开头。第一条是社会根源：反动统治阶级对待人民的作风的残余，反映在党和政府里。其余几条是领导方法：交代工作任务与交代政策界限、交代工作作风没有联系在一起；对县、区、乡三级干部没有审查，或审查做得不好；这三级还没有开展整党，没有在整党中反对命令主义；专区以上的高级机关里，有人不了解、不关心群众的痛苦和基层的情况。他的判断是，如果领导任务加强、领导方法改进，危害群众的官僚主义和命令主义就可以逐步减少。\n\n这里选第二条来读，因为它是一条上级能自己动手的责任：下面做坏事的人固然要处理，但只交任务不交界限的交法本身就是一个制度性的缺口。这条真正要求的是，一次交办包含三个部分，一部分写任务，一部分写界限，一部分写作风，而且不是交一次就算完。",
  failureMode: "指示针对的是一种看问题的省事办法：出了事就说下面有坏人，上面的交代是否完整，不在检查之列。它列出的另外几条，包括对干部缺少审查和上面不了解下情，都落在上级一边。\n\n在今天的工程团队里，它的样子是：平台负责人给每个小组下了同一个任务，要把云成本削减三成，附一个季度截止日期。其中一个小组把共享开发集群的节点缩了一半，正好在另一个团队发布的那一周。复盘找到了那位操作的工程师，没有人去看当初的任务里有没有写哪些环境不能动、缩容之前要通知谁、怎样回滚。",
  worked: "这份指示有一个具体的来源。据山东省档案馆馆长李世华二〇二五年六月二十日发表在《学习时报》、转载于中国共产党新闻网的文章，中共中央山东分局纪律检查委员会一九五二年十一月向中央提交了《关于反对官僚主义、反对命令主义、反对违法乱纪的意见的报告》，认为官僚主义作风是干部强迫命令、违法乱纪的温床；毛泽东审阅后起草了这份指示，要求各地仿照山东，从处理人民来信入手检查。\n\n山东的检查结果可以回答一个问题：这些案件里有多少是任务交代之外的恶意，有多少是作风问题。据同一篇文章，山东共发现违法乱纪案件四千二百五十三起，严重的是少数，约百分之六十属于思想作风不纯，基本上是一般性违法乱纪和工作中严重的强迫命令错误。一九五三年三月中央对山东经验的通报评价说，这样做“既迅速改善和密切了党与群众的关系，又切实保护和教育了大多数仅在作风上有毛病而本质上尚好的基层干部”（李世华文引）。就是说，在山东查出来的案件里，多数不是需要清除的人，而是需要被教育和被约束的人。\n\n这个统计有它的限度：它是事后对案件分类，数据里看不出这些干部当初是否被交代过界限和作风，所以它支持的是指示的一半判断，即多数问题出在作风上，没有证明另一半，即交代方式造成了这些问题。全国的案件统计，这里没有查到。",
  experiment: "找出你最近三次向别人交办的事：一次降本，一次迁移，一次事故后的整改项。把当时发出去的交办原文贴出来，对每一份检查三个部分有没有写：任务和期限，界限（哪些环境、数据、客户不能动，出了问题怎么回滚），作风（动之前要通知谁，对用户怎样说）。三部分齐全的有几份。把最缺的那份补写完整，再把三个部分做成工单模板里的固定栏目。一个月以后，数一数这期间出的事故里，有几起可以追到一条没有写进交办里的界限。",
  reflection: "你上一次交办的事，接任务的人知道哪些东西绝对不能碰吗？这一条是你写下来的，还是你以为他们本来就知道？",

    a: "交代工作任务与交代政策界限、交代工作作风没有联系在一起，也就是没有和工作任务一道，同时把政策界限和工作作风反复指示给中下级干部。其余几条是：对县、区、乡三级干部没有审查或审查不好，三级没有开展整党，专区以上高级机关里有人不了解、不关心群众的痛苦和基层的情况。\n\n容易忘的是这些都是上级一边的责任，指示把它们放在要处理坏人的要求前面一并列出。"
  },

  id: "start-from-the-unanswered-letters",
  track: "leadership", level: "v5",
  title: "离得远看不见，就“从处理人民来信入手”",
  source: "《反对官僚主义、命令主义和违法乱纪》（一九五三年一月五日），第五卷",
  idea: "领导机关看不见离自己远一点的下情，又要检查它，办法是找一条本来就通到自己手里的渠道，从它开始查。指示选的是人民来信：积压了多少，积压了多久，其中有没有控告干部的，都可以数出来，也都是下面的人亲手写给上面的。上面连积压了多少都“不知道”，这本身就是要先查的第一件事。",
  why: "这是毛泽东为中共中央起草的党内指示（据题注），日期是一九五三年一月五日。它先说明问题在哪里：许多领导机关不了解县、区、乡三级干部中的命令主义和违法乱纪，或者了解了也熟视无睹，不引起义愤。接着给了一个可以数的例子：据报有的省人民政府积压了七万多件人民来信没有处理；省以下各级积压了多少，“则我们还不知道”，可以想象是不少的。\n\n他说明了为什么拿来信作入口：这些来信大都是有问题要求解决的，其中许多是控告干部无法无天罪行的，应当迅速处理。所以指示要求各级领导机关一九五三年结合整党建党和其他工作，“从处理人民来信入手”，检查一次官僚主义、命令主义和违法乱纪的情况，并向他们展开斗争；典型事例在报纸上揭发，违法严重的给以法律制裁，党员执行党纪。到斗争达到适当阶段，还要调查表扬典型的好人好事，使全党向这些典型看齐。\n\n有用的地方在选入口的逻辑。要检查的东西太大、太散，领导者没法一下子看全，就找一件有三个特点的东西：已经集中到了自己这里，可以数出件数和时间，每一件背后有一个具体的人在等。这个方法真正要求的是，先承认自己不知道积压了多少，然后去数。",
  failureMode: "指示针对的是两种状态：不了解下情，和了解了而不当一回事。后一种在文中写得很具体，叫做不引起义愤，不感觉问题的严重，不采取积极办法去支持好人、惩治坏人。\n\n在今天的工程团队里，它的样子是：平台团队的支持频道和工单队列每周有几十条来自其它团队的请求，没有一个人知道有多少条还没有回应，最老的一条挂了多久。每个季度的用户满意度调查给出一个平均分，大家讨论的是这个分数，而队列里躺着一条三个月前的、关于数据丢失的报告，没有人认领。",
  worked: "这一类渠道在一九五三年之前已经有制度。据王炳毅在中国法学网发表的《信访制度的奠基》一文，一九五一年五月十六日毛泽东批示，要求重视人民来信，来信多的地方应设专门机关或专人，批示发到县以上机关党委和党组；同年六月七日，政务院发布《关于处理人民来信和接见人民工作的决定》，要求县（市）以上各级人民政府责成一定部门，指定专人处理群众来信，设立问事处或接待室（据该文，决定文本刊于一九五一年六月八日《人民日报》）。一九五三年的指示因此说明了另一件事：设了专人，不等于来信得到了处理，一年多以后仍有省份积压七万多件。\n\n指示中的“从处理人民来信入手”在山东有具体的做法。据山东省档案馆馆长李世华二〇二五年六月二十日发表在《学习时报》、转载于中国共产党新闻网的文章，山东省一九五二年七月成立处理人民来信来访办公室，十二月升格为省级委员会；各地建立了人民接待日，大部分县以上机关配备了专人；黄县县长在每月农历初一、十五、三十亲自接待群众，山东分局推广了这个做法。一九五三年二月，山东通过检查和处理人民来信确定二百五十件专案，从省市抽调二百六十七人组成工作组办案。\n\n这两处记载给出的是做法和规模，没有给出结果：这里没有查到山东或哪一个省的积压件数后来降到了多少，也没有查到专案的处理结论，所以不能说这个入口带来了多大的改变。能说的只有它的运作方式：先立一个专门的机构，再把数出来的案子变成有人负责的专案。",
  experiment: "把你们团队所有接收外部请求的入口列出来：支持频道、工单队列、评审请求、值班升级。选一个，导出全部还没有关闭的条目，按提出的日期画一张分布图：多少条超过一周，多少条超过一个月，最老的一条是什么。从中找出其中类似“控告”的那一类：报告数据丢失、权限错误、反复出现的故障的条目。给这一类立一条规则：每条要有一个名字，限定几天内第一次回应，并在每周例会上只念这一类的件数和最老的一条的年龄。",
  reflection: "你的团队有哪个收件口，你能说出里面积压了多少条、最老的一条多久了吗？如果说不出，是因为从来没有人去数，还是因为数出来不好看？",
  recall: {
    q: "一九五三年一月五日的指示为什么要求从处理人民来信入手？它举的积压数字是多少？",
    a: "因为来信大都是有问题要求解决的，其中许多是控告干部无法无天罪行的，应当迅速处理，又是下面的人直接写给上面的，可以数出来。数字是据报有的省人民政府积压了七万多件没有处理；省以下各级积压多少，指示说还不知道。\n\n容易忘的是指示的顺序：先查来信和违法乱纪的事例，揭发典型，到斗争达到适当阶段，再调查表扬各地典型的好人好事。"
  },
  deepDive: "这是我们团队几个接收外部请求的入口，以及我所知道的每个入口里的积压情况。帮我选一个入口导出未关闭条目，设计怎样按日期和类型分布，指出哪一类相当于控告，并帮我定一条每周只看件数和最老条目年龄的规则。"
},
{
  id: "formal-unanimity-is-not-real-unanimity",
  track: "leadership", level: "v4",
  title: "委员会的一致，不能只是“形式上的一致”",
  source: "《关于健全党委制》（一九四八年九月二十日），第四卷",
  idea: "重要问题要交委员会讨论，让到会的委员充分发表意见，做出明确的决定再去执行，不能由一个人包办。分歧不能听任它长期搁着，否则委员之间留下的只是“形式上的一致”，而不是“实质上的一致”。集体领导和个人负责两头都要有，作战或情况紧急时，首长有临机处置之权。",
  why: "这是毛泽东为中共中央起草的决定，日期是一九四八年九月二十日（据题注）。决定开头说，党委制是保证集体领导、防止个人包办的重要制度，但近来查出有些领导机关（“当然不是一切”）个人包办和个人解决重要问题的习气很浓：重要问题不是由党委会议做决定，而是由个人做决定，党委委员等于虚设；委员间有分歧的事无从解决，还任它长期放着。\n\n决定的办法分四个层次。范围上，从中央局到地委，从前委到旅委，军区、政府党组、民众团体党组、通讯社和报社党组，都要建立党委会议制度；高级领导机关的部、委、校、室也要有领导分子的集体会议。事项上，只有重要问题才交委员会，小问题和已经讨论决定、只等执行的问题不用。会议本身有三条：每次时间不能太长，次数不能太频繁，不能沉溺于细小问题的讨论；会前对复杂的、有分歧意见的重要问题，要有个人商谈，让委员们有思想准备，以免会议决定“流于形式”或者做不出决定；委员会要分常委会和全体会两种，不能混在一起。最后一条是两头平衡：集体领导和个人负责，二者“不可偏废”。\n\n有用的地方在于它把一个口号拆成了几道可以检查的工序：哪些事要进会议，会前有没有先谈，会上有没有人说出不同意见，决定是否明确，会后谁去执行。这个方法真正要求的是，一致要经过分歧才算数：没有说出来的分歧不会消失，只是移到会议之外。",
  failureMode: "决定点出的是两种相连的毛病：个人包办，使党委委员等于虚设；分歧不解决，使一致停留在形式上。它同时没有走向另一头，没有要求什么都开会，会议太长、太频繁、沉溺于细小问题，同样被列为要避免的。\n\n在今天的工程团队里，它的样子是：每周的架构评审，资深工程师在会前已经定了方案，会上讲一遍，大家点头，纪要写着已对齐。两位工程师对存储选型有分歧，谁也没有在会上讲，各自带着自己的假设去做，两个团队按两套假设建了半年，直到集成测试才发现接口对不上。",
  worked: "决定的意义，在选集题注里由后来的党的文件作了评价。题注引了邓小平一九五六年九月十六日在中共八大所作《关于修改党的章程的报告》中的话：中央在一九四八年九月关于健全党委制的决定，“对于加强党的集体领导，尤其起了重大的作用”，它的重要意义“在于它总结了党内认真实行集体领导的成功的经验，促使那些把集体领导变为有名无实的组织纠正自己的错误，并且扩大了实行集体领导的范围”；这个决定在全党实行了，“并且直到现在仍然保持着它的效力”。邓小平在同一段里还承认，违背集体领导原则的现象在党内经常发生，只是一经发现就受到中央的批判和纠正。\n\n十年后，同一个原则又以另一种形式写进了文件。据《中国组织人事报》二〇二四年八月五日、共产党员网转载的文章，毛泽东主持起草的《工作方法六十条（草案）》（一九五八年一月）提出党委领导的八句话：“大权独揽，小权分散。党委决定，各方去办。办也有决，不离原则。工作检查，党委有责。”文章解释，“大权独揽”指主要权力集中在中央和地方党委这个集体手里，“不离原则”的原则包括民主集中制和集体领导与个人作用的统一（党委和第一书记的统一）。一九四八年所说的个人一头，在一九五八年被写成了第一书记，这个提法在一九四八年的决定里没有出现。\n\n这两份记载都是党对制度的陈述，一份是八年后的总结，一份是十年后的新文件；它们没有给出任何一次会议实际是怎样开的、分歧是怎样被提出来又怎样解决的。这里没有查到这类会议层面的记录，所以只能说制度被一再重申，不能说它在多大程度上被做到了。",
  experiment: "找出你们团队最近做的五个技术决定，来自架构评审或设计文档。对每一个写出：实际是谁定的；会上有没有人讲出不同意见，记在纪要里没有；分歧是被解决了，还是只被搁置了。再做一个小测验：会后请每位参会的人各自用一句话写下这个决定，并写一条会让自己改变主意的理由。如果几个人写的决定不一样，就说明一致只是形式上的。选下一个要评审的决定，会前一天先分别和有分歧的两个人谈一次，会上只留决定和分歧的两栏。",
  reflection: "你们上一次的评审会上，谁的不同意见是在会后才在走廊里或私聊里说出来的？这个意见最后进了纪要没有？",
  recall: {
    q: "《关于健全党委制》说哪种“一致”是不够的？决定对会议规定了哪几条，让一致变成实质上的？",
    a: "只是形式上的一致，委员间的分歧长期听任不解决，不能算数。办法：重要问题交委员会，让到会委员充分发表意见，做出明确决定再执行；会议不要太长、太频繁、不沉溺于小问题；会前对有分歧的复杂问题先作个人商谈；常委会和全体会要分开。\n\n容易忘的是两头的限制：小问题和已定只待执行的问题不进会议，而且集体领导和个人负责不可偏废，作战时首长有临机处置之权。"
  },
  deepDive: "这是我们团队最近几个技术决定，以及纪要里记下的分歧。帮我看每个决定是实质上的一致还是形式上的一致，找出哪些分歧被搁置了，并为下一次评审设计会前个人商谈和会上的记录方式。"
},
{
  id: "rules-the-majority-can-keep",
  track: "leadership", level: "v5",
  title: "办不到的事不要写进章程：“应当是那样，实际是这样，中间有个距离”",
  source: "《青年团的工作要照顾青年的特点》（一九五三年六月三十日），第五卷",
  idea: "章程里的要求，要定在多数人做得到的地方。只有少数人办得到、多数人办不到的事，不要写进去，因为规定和实际之间总有距离，距离太大，规定就没有人当真。重点要放在多数，不能只看少数先进分子；要抓住几条大的，别的让它慢慢上轨道。",
  why: "这是毛泽东接见中国新民主主义青年团第二次全国代表大会主席团的谈话（据题注），日期是一九五三年六月三十日。谈话分几块：青年团要配合党的中心工作，同时要有自己的独立工作，要照顾青年的特点；要保证青年睡好、玩好；要选青年干部当团中央委员；最后讲到团章草案。这里读的是团章草案那一块。\n\n他提了几处具体的修改。草案规定四个月不参加组织生活就算自动脱团，他认为太严，党章规定六个月，团章也可以六个月。草案规定的义务多、权利少，要放宽一点，使多数人能跟上去。他的标准是：办不到的事，“或者只有一百万人能办到，八百万人办不到的”，都不要在团章上规定。“不要背后乱讲”这一条，原则上是对的，但不必写在团章上，因为不准人家在背后骂一句话，事实上办不到，他说主要是要把敌我界限划分明，不要把框子搞得太小。\n\n他用两个例子说明为什么。一个是法律：有些条文要真正实行也还得几年，比如婚姻法的许多条文带着纲领性，要彻底实行至少要三个五年计划。另一个是军队：过去军队里有人编歌谣骂人，不禁也不查，军队没有垮，只抓住一些大的，比如三大纪律八项注意，队伍就慢慢上了轨道。这一块真正要求的是：定规则的人要先问有多少人做得到，然后把执行集中在几条最要紧的上面，原则性可以灵活执行，但原则本身不能降。",
  failureMode: "谈话针对的是写章程的人容易犯的一种毛病：为了显得严格，把先进分子的标准写成对全体的要求，结果多数人达不到，规定成了摆设。谈话里也提到另一种人，“先进分子不过瘾”，要求对全体都严一些，他认为不适当，要说服。\n\n在今天的工程团队里，它的样子是：值班手册规定，任何告警五分钟内必须有人响应，每个服务都必须有最新的 runbook，每个 PR 必须在四小时内完成评审。上个季度的数据显示，达到这三条的工程师不到三成。没有人去改这些数字，只是每逢事故，复盘里挑出一条没有做到的，作为原因。",
  worked: "团二大通过的新团章，可以和这次谈话对照。据中文维基文库收录的《中国新民主主义青年团团章（1953年）》文本（未与印刷本核对），自动脱团一条定的是六个月：团员六个月不过团的组织生活，不执行团组织分配的工作，又不缴纳团费，经团支部委员会考察确实没有正当理由的，才算自动脱团，并报上级团委批准除名。这同谈话里提的“六个月”一致，而且附了三个并列的条件和一道批准手续。文本里没有查到不准背后乱讲的条文。\n\n他自己举的婚姻法的例子，则是同一个距离的另一面。谈话里说得很清楚，那些条文是带着纲领性写下的，要真正实行，需要三个五年计划。也就是说，他区分了两种东西：写下来是为了方向，大家一起做到才算规则。区分这两种的办法，谈话里只给了一个粗的：看有多少人办得到。\n\n这些记载只说明规则条文怎样改的，没有给出团员实际按这些条文脱团或被除名的人数，这里没有查到这类数字，所以无法判断降低门槛之后多数人是否真的跟上了。",
  experiment: "把你们团队书面规定的要求列出来：值班响应时间、评审时限、runbook、变更冻结、标签规范。对每一条，从数据里算出上个季度实际达到的比例，比如多少个 PR 在规定时限内被评审，多少个服务有最新的 runbook。把低于一半的标出来。对每一条标出的，选一种处理：把要求降到多数人做得到的水平，或者先投入做出让多数人做得到的工具，两者之间不要留空。最后只选三条，写下“无论怎样都执行”，并确认这三条上个季度的达标率。",
  reflection: "你们的规定里，有哪一条是大家都知道没有人照着做、却一直没有改的？它留在那里，对另外那些有人遵守的规定有什么影响？",
  recall: {
    q: "《青年团的工作要照顾青年的特点》里，毛泽东对团章草案提了什么标准？他举了哪两个例子说明规定和实际之间有距离？",

  idea: "明知不对而不说，当面不说而背后说，看上去是在维持和气，实际上让组织失去了纠正错误的能力。有意见要当面说，在会上说；争论的目的是把事情弄好，而不是攻击个人。",
  why: "这篇短文写于一九三七年九月七日，抗日战争全面爆发两个月后，红军正在改编为八路军。毛泽东在这里说的“自由主义”，不是政治哲学里的那个词，而是一种作风：取消思想斗争，主张无原则的和平，结果是腐朽庸俗的作风滋长，团体和个人在政治上腐化。\n\n文章列了十一种表现，每种一两句话，其中两种在今天的组织里最常见。一种是不负责任的背后批评，不积极地向组织建议，“当面不说，背后乱说；开会不说，会后乱说”。一种是事不关己，高高挂起，“明知不对，少说为佳”，明哲保身，但求无过。他说这类作风是腐蚀剂，使团结涣散，关系松懈，工作消极，政策不能贯彻到底；它的来源是把个人利益放在第一位。\n\n他要的也不是无休止的争吵。文章开头就说，积极的思想斗争是达到团结、利于战斗的武器；第五种自由主义恰恰是借争论搞个人攻击、闹意气、泄私愤。争论要“为了团结，为了进步，为了把事情弄好”。",
  failureMode: "它针对的是一种不吵架的组织病：熟人之间明知不对也不争，轻描淡写说一顿了事；会上不说，会后乱说；事不关己就不开口。文章把这些和命令不服从、摆老资格等一起列为自由主义，认为它们的共同结果是组织松懈，政策贯彻不下去。\n\n在今天的工程团队里，它的样子是：设计评审上没有人反对，散会后有人在私聊里说这个方案撑不过下一次流量高峰；明知迁移计划漏了回滚步骤，因为是别的组的项目，评审意见里一个字也没写；复盘会上一片和气，真正的原因到了会后的饭桌上才说出来。",
  worked: "二十年后，党自己做了一次检验。一九五七年四月二十七日，中共中央发出《关于整风运动的指示》，整顿官僚主义、宗派主义和主观主义，请党外人士提意见。五月十五日，毛泽东写《事情正在起变化》发给党内干部，说“还要让他们猖狂一个时期”。六月八日，他为中央起草党内指示，要高等学校组织教授座谈、向党提意见，尽量让右派把话说出来并登在报上；同一天《人民日报》发表社论《这是为什么？》，反右派斗争开始。七月一日，他为《人民日报》写的社论说明，五月八日至六月七日各党报按中央指示少登正面意见、对错误意见不作反批评，并说：“有人说，这是阴谋。我们说，这是阳谋。”这三篇都收在《毛泽东选集》第五卷。\n\n一九八一年的《关于建国以来党的若干历史问题的决议》说，反右派斗争“被严重地扩大化了”，把一批知识分子、爱国人士和党内干部错划为右派分子，“造成了不幸的后果”。后来改正右派时通行的数字是，被划为右派的约五十五万人，一九七八年以后绝大多数得到改正。同一份决议在评价两年后的“反右倾”斗争时说，它使党内从中央到基层的民主生活遭到严重损害。",
  experiment: "找一条你在私下聊天里说过、却没有在评审或会上说过的技术意见：一个你认为撑不过流量高峰的设计，或者一份漏了回滚步骤的迁移计划。今天把它写成正式的评审意见或一封邮件，发到决定这件事的地方，附上理由和证据。只谈方案和风险，不评价写方案的人。",

{
  id: "unload-the-burden-start-the-machine",
  track: "discipline", level: "v3",
  title: "“放下包袱”，“开动机器”",
  source: "《学习和时局》（一九四四年四月十二日），第三卷",
  idea: "同一件事实，既可以压成往下沉的包袱，也可以压成往上飘的包袱：犯过错误的人从此“萎靡不振”，有了成绩的人“趾高气扬”。包袱来自对这些事实缺乏自觉，所以要先检查自己背着什么，把它放下来；放下之后还要“开动机器”，也就是多想苦想，学会分析。",
  why: "《学习和时局》是毛泽东一九四四年四月十二日在延安高级干部会议上的讲话，五月二十日他又在中央党校讲了一次（据题注）。当时高级干部从上一年冬季起在学习党内的两条路线问题，中央政治局为此作了几条结论：对历史上犯过错误的同志取宽大的方针，对任何问题取分析的态度。讲话的第二部分总结七年的工作：一九三七年党员约四万，到一九四〇年发展到八十万，一九四一年和一九四二年根据地缩小、人口降到五千万以下，到这时党员又有九十多万。第三部分接着提出：为了争取新的胜利，要在党的干部中间提倡放下包袱和开动机器。\n\n他给包袱下的定义很宽：许多东西，“只要我们对它们陷入盲目性，缺乏自觉性”，就可能成为包袱。他一对一对地列举：犯过错误和未犯错误，工作无成绩和工作有成绩，斗争历史短和斗争历史长，工农出身和知识分子，各种业务专长，直到年龄。每一对里两头都可能出毛病，有的压成消沉，有的压成骄傲，所以同一件事实在不同的人身上长出相反的毛病。他把后果说得很直接：有些同志高高在上，脱离群众，屡犯错误，背上这类包袱是一个重要原因，检查自己背上的包袱，是联系群众和少犯错误的“必要前提之一”。他用党的历史作证：一九二七年上半年、一九三〇年、一九三一年和一九三八年，形势有利、打了胜仗之后都有一些同志骄傲起来，自以为了不得，各自引出一次路线错误；一九三一年那一次，革命力量损失了百分之九十左右。讲话里提到，近日印发了郭沫若论李自成的文章，也是要同志们引为鉴戒，“不要重犯胜利时骄傲的错误”。\n\n第二件事是开动机器。他说有两种人：一种背上没有包袱，也有联系群众的长处，但不愿多想苦想，做不成事业；另一种人的聪明被包袱压缩了，不肯使用脑筋。所以两件事不能拆开，要“既是轻装，又会思索”。这一条真正要求的，是先把自己的资历、成绩和过错逐项摆出来看清楚，再用同样的办法去分析眼前的问题；只下决心不检查，包袱放不下，只检查不思索，轻了也没有用。",
  failureMode: "文章针对的是干部不自觉地背着自己的经历做事：犯过错误就萎靡，有了成绩就骄傲，资历长就自以为是，出身、专长和年龄都成了看轻别人的资本；还有一种人不愿用脑筋，结果仍然做不成事。包袱的特点是它从事实里长出来，持有人往往不觉得那是包袱。\n\n在今天的工程团队里，它的样子是：上个季度一次迁移按期完成了，下一次迁移就沿用同一套计划，不再复盘；同一个团队里，另一位工程师在一次事故里被问责过，此后每个涉及生产的改动都加三层审批，自己也不再提反对意见。两种做法都是用上一次的结果代替了对这一次的分析。",
  worked: "讲话提到的《甲申三百年祭》，此后几年里被一再提起。据《毛泽东选集》第三卷的注释，郭沫若的《甲申三百年祭》先在重庆《新华日报》发表，后来在延安《解放日报》转载，并且在各解放区印成单行本。据中国共产党新闻网和共产党员网二〇二二年的文章，一九四四年十一月二十一日，毛泽东在复信里告诉郭沫若，这篇文章被当作整风文件看待。据求是网二〇二〇年的一篇文章，一九四九年三月二十三日党中央离开西柏坡，毛泽东提出“进京赶考”，并说“我们决不当李自成”。\n\n后来的评价把同一个词用在了另一件事上。一九八一年的《关于建国以来党的若干历史问题的决议》谈到一九五八年的“大跃进”，写道：由于对社会主义建设经验不足，对经济发展规律和中国经济基本情况认识不足，更由于毛泽东同志、中央和地方不少领导同志在胜利面前滋长了骄傲自满情绪，急于求成，夸大了主观意志和主观努力的作用，没有经过认真的调查研究和试点，就在总路线提出后轻率地发动了“大跃进”运动和农村人民公社化运动。决议同一段还写到，从一九五八年底到一九五九年七月庐山会议前期，毛泽东同志和党中央曾经努力纠正已经觉察到的错误，庐山会议后期却错误地发动了对彭德怀同志的批判。决议在这一段里没有引用《学习和时局》；它在评价毛泽东的建党学说时，把这篇列为主要著作之一。\n\n两处的对应是读者读出来的：一九四四年的讲话把胜利之后的骄傲当作要预防的包袱，一九八一年的决议把一九五八年的错误部分归于同一种情绪，并且把没有经过认真调查研究和试点列为另一个原因，它同开动机器要求的东西相近。讲话要求的是个人和党的自觉，没有规定谁来检查、用什么程序检查。",
  experiment: "这个季度你团队里有哪一次明显的成功或失败，之后改变了你们做同类事情的方式？把它写下来，然后分成两栏：这次的结果真正能说明什么，以及它被当作了什么。前一栏要附上数据或日志，后一栏是你们现在的默认做法。对后一栏里每一条问：如果换一个全新的团队接手同样的问题，他们会不会这么做？不会的那几条，就是包袱，把它们列成一份清单，发到团队的复盘文档里，附上你打算用来检验的下一个小实验。",
  reflection: "你现在沿用的哪一种做法，是因为它上一次成功了，而不是因为你分析过这一次的情况？",

    a: "一个是往下沉：犯过错误、工作无成绩的人萎靡不振、悲观丧气；一个是往上飘：未犯错误、有成绩、资历长、有专长的人骄傲、趾高气扬、傲视旁人。\n\n容易忘的是后半：背上没有包袱，也有联系群众的长处，但不愿用脑筋多想苦想，仍然做不成事。所以要“既是轻装，又会思索”，两件事缺一不可。"

{
  id: "democracy-under-centralised-guidance",

  title: "“集中指导下的民主生活”",
  source: "《关于纠正党内的错误思想》（一九二九年十二月），第一卷",
  idea: "讨论要充分，决定一旦作出就要执行，两件事要分开安排。把讨论的权利扩大成“先交下级讨论，再由上级决议”，或者在执行时勉强应付，都是极端民主化。决议开出的办法有两头：领导机关要“遇事要拿出办法”，上级要摸清下级和群众的情况；下级对指示要详尽讨论，弄懂它的意思，再决定怎样执行，但“一成决议，就须坚决执行”。",
  why: "这是古田会议决议里讲极端民主化的一节。红四军第九次党代表大会开在一九二九年十二月下旬，此前半年，军内围绕建军主张的争论一直没有停。据中国日报网二〇二一年转载的荔枝网文章，六月二十二日的第七次党代表大会改选前委，中央指定的前委书记毛泽东没有继续当选，由陈毅接任；古田会议则选出新的前委，毛泽东当书记。决议写的是这场争论留下的组织习惯，不是某一个人的主张。\n\n决议的判断是：接受中央指示之后，极端民主化的现象减少了，例如党的决议比较能执行了，“由下而上的民主集权制”这类主张也没有人再提；但这只是“一时的和表面的现象”，根苗还深种在许多同志的思想中，对决议案表示种种勉强的态度就是证据。它指出的危险是损伤以至完全破坏党的组织，削弱以至毁灭党的战斗力，使党担负不起斗争的责任；来源是小资产阶级的自由散漫性。\n\n药方是在组织上厉行集中指导下的民主生活，共五条：领导机关有正确的指导路线，遇事拿出办法，建立领导的中枢；上级了解下级和群众的情况，作为指导的客观基础；各级解决问题不要太随便，一成决议就坚决执行；重要的决议迅速传达到下级和党员群众中去；下级和党员对指示经过详尽的讨论，弄懂意义，并决定执行的方法。这个方法真正要求的是两头都有责任：讨论留给理解和执行办法，不留给事后翻案；而集中要有东西可集中，也就是领导机关先要有办法、有情报。",
  failureMode: "它针对的是把平等讨论一路延伸到执行阶段的习惯：决议下来不动手，或者表示种种勉强，等着下一次会再把整件事推翻。决议认为这样会使组织本身担负不起任务，根子是自由散漫。\n\n在今天的工程团队里，它的样子是：设计评审已经定稿，选了统一的接口协议；三个月后仍有两个服务以还没被说服为由继续用自己的封装，每次迭代会都把协议选型再讨论一遍，评审结论变成可以被每个团队单独否决的建议。反过来的样子也存在：评审只有一个人说了算，没人看过其他团队的真实情况，所谓拍板只是没有情报的命令，这同样没有做到五条里的前两条。",
  worked: "这一节的两头都有后来的记录。先说反着的一头：据中国日报网二〇二一年转载的荔枝网文章，一九二九年六月红四军七大以后，毛泽东离开红军主要领导岗位，去闽西协助地方工作；同年九月二十八日中央给前委的指示信肯定了毛泽东提出的红军建设基本原则，要求前委和全体干部战士维护朱德、毛泽东的领导，毛泽东仍为前委书记。分歧由中央表态加以裁定，随后在古田会议上写成决议。\n\n另一头是集中过了头。邓小平一九八〇年八月十八日在中央政治局扩大会议上作《党和国家领导制度的改革》的讲话，收入《邓小平文选》第二卷，列举的弊端有官僚主义现象、权力过分集中的现象、家长制现象、干部领导职务终身制现象和形形色色的特权现象。据刘玉瑛二〇一二年在《人民论坛》上的文章引述，他说权力过分集中于个人或少数人手里，多数办事的人无权决定，“必然要损害各级党和政府的民主生活、集体领导、民主集中制、个人分工负责制等等”。这段话批评的不是集中本身，而是集中而没有制度约束。\n\n决议里的方法对这两种情况都适用，但文本没有说明怎样判断什么时候讨论已经足够，也没有给出下级在决议错误时的办法。一九二九年的办法是教育和组织上的厉行，文本里没有设计申诉的程序。",
  experiment: "找出你们最近一次评审定稿的技术决定，检查它之后的三个月：有几个团队按它做了，有几个没有，没有的都给了什么理由。然后问两个问题：这个决定在定稿以前，有没有写明由谁在什么条件下可以重开；领导这件事的人，当时掌握了多少这些团队的实际情况。把两个问题的答案和不执行的理由放在一起看，判断问题出在执行这一头，还是出在决定之前的讨论和情报这一头。",
  reflection: "最近一次你对一个已经定稿的决定“表示勉强”，你是在会上提出了反对，还是在执行时放慢了？",
  recall: {
    q: "古田会议决议为纠正极端民主化开出的组织办法是什么？它对下级讨论和执行各提了什么要求？",
    a: "厉行集中指导下的民主生活：领导机关要有正确的指导路线、遇事拿出办法；上级要了解下级和群众的情况；重要决议迅速传达；下级对指示要经过详尽讨论，弄懂意义并决定执行方法；一成决议，就须坚决执行。\n\n容易忘的是前两条，它们是对上级提的要求：领导者自己没有办法、不了解情况，集中就没有内容。"
  },
  deepDive: "这是我们团队最近一次评审定稿的决定，以及之后三个月各团队的执行情况。帮我判断问题出在决定之前的讨论和情报，还是出在定稿之后的执行，指出决议里的五条办法我们缺了哪几条，并设计一个小改动来补上。"
},
{
  id: "fighting-is-not-for-fighting",
  track: "discipline", level: "v1",
  title: "打仗不是“为了打仗而打仗”",
  source: "《关于纠正党内的错误思想》（一九二九年十二月），第一卷",
  idea: "手里最硬的那项能力，容易被当成目的本身。红军的打仗，是为了宣传群众、组织群众、武装群众、帮助群众建设革命政权；离开这些目标，就“失去了打仗的意义”，也就“失去了红军存在的意义”。所以军事只是完成政治任务的工具之一，管目的的机构不能隶属于管工具的机构。",
  why: "这是古田会议决议的第一节，讲单纯军事观点。红军这时已经打了两年多的仗，队伍里有相当数量的被俘士兵，决议把这种观点的表现分成八条：认为军事和政治对立，甚至说“军事好，政治自然会好”；以为红军只是单纯地打仗；在组织上把政治工作机关隶属于军事机关，提出“司令部对外”的口号；忽视宣传队和士兵会；打胜仗就骄傲，打败仗就消极；本位主义，决议称这是“放大了的小团体主义”；囿于四军的局部环境，保存实力；不顾条件的急性病。\n\n它给出的来源有四个：政治水平低，不认识军队里政治领导的作用；历次作战俘虏兵很多，带来了雇佣军队的思想；由此产生“过分相信军事力量，而不相信人民群众的力量”；党对军事工作没有积极的注意和讨论。第三条由前两条推出：一支军队只信自己的力量，就会以为战斗打赢了任务就完成了。决议认为这样发展下去，有走到脱离群众、以军队控制政权的危险，像国民党军队所走的军阀主义道路一样。\n\n药方也分五条：从教育上提高政治水平，认清红军和白军的根本区别；加紧官兵特别是俘虏兵的政治训练，并尽可能由地方政权选派有斗争经验的工农分子加入红军；发动地方党和群众政权机关批评红军；党对军事工作要有积极的注意和讨论，一切工作在党的讨论和决议之后再经过群众去执行；编制红军法规，规定军事工作系统和政治工作系统的关系、红军和人民群众的关系。这个方法真正要求的是两件事：做任何一项工作之前，先说出它为哪个任务服务；并且在组织上把管目的的位置放在管手段的位置之上，不靠个人的自觉。",
  failureMode: "它针对的是把手段当目的的毛病：把打仗当作红军的全部，把政治工作当作可有可无的附属，指挥系统对外说话，宣传和群众工作被取消。决议点出的后果是“宣传和组织工作，都成了被取消的状态”。\n\n在今天的工程团队里，它的样子是：平台团队把稳定性和迁移进度当作全部，仪表盘一片绿，业务团队接入新平台的周期却从两周变成了六周，因为文档、示例、开通流程这些让人用得起来的工作，被排在可用性指标后面，也没有人负责。组织上的样子是，对外说话的是基础设施负责人，管接入体验的人要向他汇报，这就是“司令部对外”。",
  worked: "这一条后来成了一条明文规定。一九三八年十一月六日，毛泽东在六届六中全会的结论里说：“我们的原则是党指挥枪，而决不容许枪指挥党。”同一段里他还说，共产党员不争个人的兵权，“再也不要学张国焘”。据人民网《人民论坛》转载的党史材料，中央政治局一九三五年九月十二日在俄界会议上通过《关于张国焘同志的错误的决定》；同年十月五日，张国焘在理番县卓木碉另立“中央”。据共产党员网的党史材料，他又在一九三八年四月出走。毛泽东的这句话，是对这段经历的回应。\n\n一九八一年《关于建国以来党的若干历史问题的决议》在总结毛泽东思想时，把“是党指挥枪而不是枪指挥党的原则”列为他对人民军队建设的规定之一，并在列举他的军事著作时提到了《关于纠正党内的错误思想》。同一份决议讲“文化大革命”时说，派人民解放军实行三支两军，“在当时的混乱情况下是必要的，对稳定局势起了积极的作用，但也带来了一些消极的后果”；在讲今后任务时又写道，要恢复和发扬军队内部和军政之间、军民之间紧密团结的优良传统。决议没有具体说明消极后果是什么。\n\n这里要分清文本和后来的做法。一九二九年的决议要求红军做群众工作，没有说军队可以替代地方政权；它要防的恰恰是军队控制政权。决议提出的组织办法，是把军事和政治两个系统的关系用法规写明，而不是靠领导人的威望维持。这些规定在文本里有，但文本没有回答一个问题：当党的讨论和军事上的紧急判断冲突时，谁来裁决，用什么程序。",
  experiment: "把你们平台团队上个季度的五项主要工作列出来，每一项写一句话：它为哪个业务目标服务，由谁来判断这个目标有没有达到。写不出答案的，标出来，判断它是不是在为指标打仗。再看一下组织上的安排：负责接入体验、文档和培训的人，向谁汇报，在哪个评审里有位置。如果这些人要向稳定性的负责人汇报，选其中一个用户可见的指标，让它进入和可用性同一张评审表。",
  reflection: "你们团队里，哪一个指标一直是绿的，但用平台的人并没有因此过得更好？",
  recall: {
    q: "古田会议决议说，单纯军事观点把红军看成什么？决议在组织上点了哪一条做法？",
    a: "把红军看成只是单纯地打仗的队伍，不知道它还要宣传群众、组织群众、武装群众、帮助群众建设革命政权；离了这些，就失去了打仗的意义，也失去了红军存在的意义。组织上点的做法是把政治工作机关隶属于军事工作机关，提出“司令部对外”的口号。\n\n容易忘的是它的来源之一：雇佣军队的思想来自大量俘虏兵，所以药方里有对俘虏兵的政治训练，以及从地方选派工农分子加入红军。"
  },
  deepDive: "这是我们平台团队上个季度的五项主要工作、它们对应的指标，以及接入体验相关工作的汇报关系。帮我判断哪几项是在为指标服务而不是为用户的结果服务，指出组织上哪里有“司令部对外”的影子，并设计一个小调整让用户可见的指标进入同一张评审表。"
},
{
  id: "equal-only-as-far-as-the-task-needs",
  track: "discipline", level: "v1",
  title: "反对“不问一切理由的绝对平均主义”",
  source: "《关于纠正党内的错误思想》（一九二九年十二月），第一卷",
  idea: "分配可以平均，但平均要有理由，理由是斗争的需要。红军官兵薪饷平等，是因为现时的斗争环境需要，所以要做到“大体上的平均”；把每一件事都分得完全一样，不问谁的工作需要，结果是妨碍斗争。决议要的是按“各尽所能按劳取酬”的原则和工作的需要分配，没有绝对的平均。",
  why: "这是古田会议决议里讲绝对平均主义的一节。决议说，红军中的绝对平均主义有一个时期发展得很厉害，并且一连举了七件事：发给伤兵的用费反对分伤轻伤重，要求平均；官长骑马，不认为是工作需要，而认为是不平等制度；分物品要求极端平均；背米不问大人小孩、体强体弱，要平均背；住房子要分得一样大，司令部住了一间大点的房子也要挨骂；派勤务要派得一样平，多做一点就不肯；甚至一副担架上有两个伤兵，“宁愿大家抬不成，不愿把一个人抬了去”。\n\n决议给的来源是：它和政治上的极端民主化一样，是“手工业和小农经济的产物”，一个出现在政治生活里，一个出现在物质生活里。这个判断只涉及思想的社会基础，没有解释为什么这些事件在同一时期发生；决议在别处承认红军的物质生活过差，说这是官兵离队的原因之一。\n\n它的纠正办法不是主张差别，而是给平均划界。绝对平均主义在资本主义没有消灭的时候，只是农民小资产者的一种幻想；就是在社会主义时期，物质的分配也要按“各尽所能按劳取酬”和工作的需要，“决无所谓绝对的平均”。同时红军人员的物质分配仍然要做到“大体上的平均”，例如“官兵薪饷平等”，因为这是现时斗争环境所需要的。判断的标准只有一个：这样分，是不是斗争的需要。这个方法真正要求的是，每条平均的规则都要能说出它服务的任务，并且在它服务不了的地方有办法改。",
  failureMode: "它针对的是把平均当作目的的做法：官兵中有人把官长骑马、司令部的房子大一点，都看成不平等；有人宁愿两个伤兵都抬不成，也不肯先抬一个。决议要反对的，是“不问一切理由”的平均，因为它不是斗争的需要。\n\n在今天的工程团队里，它的样子是：紧急修复和例行迁移共用同一个变更窗口，规则是按提交顺序平均排队，一个影响线上的热修复在一排迁移后面等了半天；每个团队的集群配额完全一样，批处理团队天天撞上限，几个实验团队的配额一直闲着；值班不管谁熟悉哪个系统，一律轮到同样多的班，出事时叫起来的是最不了解它的人。每一条规则看上去都公平，却没有一条回答它服务什么任务。",
  worked: "这一条在后来的党史里以另一种面目出现。一九五八年十一月二日至十日在郑州开了一次会议，会前毛泽东已觉察到“大跃进”和人民公社化运动中出了问题，其中有浮夸风和“共产风”（据中国新闻网二〇〇八年的报道）。据新华网二〇二一年的文章，从一九五八年十一月的第一次郑州会议到一九五九年七月庐山会议前期，党中央整顿人民公社，调整高指标，作了初步纠正左倾错误的努力。一九八一年《关于建国以来党的若干历史问题的决议》写到，毛泽东在领导纠正“大跃进”和人民公社化运动的错误时，提出了不能剥夺农民、不能超越阶段、反对平均主义，强调发展商品生产、遵守价值规律等观点。\n\n同一份决议接着说，庐山会议后期，毛泽东错误地发动了对彭德怀的批判，进而在全党开展“反右倾”斗争，“在经济上打断了纠正左倾错误的进程，使错误延续了更长时间”。所以一九二九年的那个标准，后来既被用来纠偏，也被中断过。决议没有逐项说明“共产风”里哪些做法是平均主义，历史学界对这些做法的叙述，不在本条目的范围里。\n\n这里要分清文本和后来的做法。文本没有说平均有害：它明说红军官兵薪饷平等是必要的，反对的是不问理由。它也没有回答由谁来判断“工作需要”：这一节只给了原则和事例，没有给出核对需要的办法。",
  experiment: "挑一样你们平均分配的东西：值班轮次、集群配额、评审时间、变更窗口。写出这个平均是为哪个任务服务，然后拿上个季度的真实数据做一次反事实：如果按工作需要分配，谁会多拿，谁会少拿，哪一件关键工作被平均挡住了。最后写下哪一部分平均要保留，原因是什么，类似文本里的官兵薪饷平等。障碍是两种做法之间的取舍，不是哪个人：公平的规则和按需的规则各有道理，要用数据而不是立场来比。",
  reflection: "你们团队里，哪一条平均分配的规则，上个季度挡住了真正紧急的事？",

  worked: "这类要求后来党在别的文献里也对自己提过。一九四五年四月二十四日，毛泽东在《论联合政府》里说，有无认真的自我批评，也是共产党和其他政党互相区别的显著标志之一，并说整风运动之所以发生了很大的效力，是因为大家在这个运动中展开了“正确的而不是歪曲的、认真的而不是敷衍的批评和自我批评”。这是党对自己提的标准，是否做到，要看后来的记录。\n\n一九八一年《关于建国以来党的若干历史问题的决议》里有两处可以对照。一处写到，一九六二年一月召开的有七千人参加的扩大的中央工作会议，“初步总结了‘大跃进’中的经验教训，开展了批评和自我批评”，会议前后又为“反右倾”运动中被错误批判的大多数同志进行了甄别平反。另一处写到，同年九月的八届十中全会上，毛泽东把社会主义社会中一定范围内存在的阶级斗争扩大化和绝对化。决议没有说这两件事之间有没有因果关系，也没有评论七千人大会上自我批评的内容是否充分。\n\n决议自己也是一次对己的检验。它写道，对于“文化大革命”这一全局性的、长时间的左倾严重错误，毛泽东“负有主要责任”，同时又认为，他的错误终究是一个伟大的无产阶级革命家所犯的错误。这是党在一九八一年对自己的评价，评价是否到位，各人看法不同，本条目只记录文本和这些记录。文章本身没有规定由谁来检查一个人是否对己用了同一把尺，它靠的是每个人的自觉和同志之间当面说。",
  experiment: "拿出你在最近两次评审或复盘里对别人提出的整改要求，比如运行手册、回滚演练、压测、变更必须附测试。把同一张清单原样套在你自己团队最关键的三个系统上，逐项打勾。有缺口的，选一项放进和别的团队同一个追踪表，写上负责人和日期，不要另开一个只有你自己看的清单。这里要比较的是两种做法：给自己的系统留例外，还是和别人用同一把尺。",

  source: "《关于建立报告制度》（一九四八年一月七日），第四卷",
  idea: "下级向上级报告，要报的是影响方针和政策的事，不是技术性的小事；要定期，要短，要由负责人自己动手，并且“要指出问题或争论之所在”。上级需要的不是什么都知道，而是在事前或事后能及时帮到下面，使它“不犯或少犯错误”。",
  why: "这是毛泽东为中央起草的党内指示，一九四八年一月发出。它规定的报告分两路：各中央局和分局，由书记负责，“自己动手，不要秘书代劳”，每两个月向中央和中央主席作一次综合报告，内容包括军事、政治、土地改革、整党、经济、宣传和文化各项活动的动态、发生的问题和倾向，以及解决的办法；各野战军和军区首长，除了战绩、损耗和实力三种报告之外，每两个月再作一次政策性综合报告，内容有纪律、物质生活、指战员情绪、偏向和克服的办法、军民关系等，其中政治工作的部分由政治部主任起草，司令员和政治委员审查并共同署名。篇幅也规定死了，每次“一千字左右为限”，至多不超过两千字，一次写不完就分两次，每次突出几个问题，其余略带几笔。\n\n理由写得很直白。党的七大以后，仍有一些，文中特别加了括号，“不是一切”中央局和分局的同志不认识事先或事后向中央作报告的必要，或者只作一些技术性的报告和请示，结果中央不明了他们“重要的（不是次要的或技术性的）”活动和政策的内容，发生了“不可挽救的、或难以挽救的、或能够挽救但已受了损失的事情”；而那些事前请示、事后报告的，则避免了或减少了这样的损失。所以他要求从这一年起，全党各级领导机关，必须改正对上级事前不请示、事后不报告的不良习惯。\n\n文本选择了什么不规定，也值得看：它不要求事无巨细地汇报，字数有上限，写法要求扼要，要指出争论所在，把判断的负担放在写报告的人身上；而写报告的人必须是负责人本人。这个方法真正要求的是三件事：报重要的而不是容易写的，报问题和倾向而不只是进度，报告由真正做决定的人署名。",
  failureMode: "文中指出了两种毛病：一种是对上级事前不请示、事后不报告；另一种是仅仅作了一些技术性的报告和请示，上面还是不明了重要的活动。结果是上级看不到会出事的地方，等到出事，已经晚了。\n\n在今天的工程团队里，它的样子是：每周给总监发一份状态邮件，里面是工单数、仪表盘截图和已完成的清单，一切正常；而一个会拖垮季度目标的依赖、一次被悄悄推迟的迁移、一个已经知道但没人认领的设计缺陷，都没有写进去，直到事故发生才第一次被人看到。另一种样子是，报告由助理或模板生成，没有一个具体的人对每句话负责。",
  worked: "这一条后来的记录，要分文本、编者注和后来的做法三层看。选集编者注说，这个指示中的报告制度，是中央坚持民主集中制、反对无纪律无政府倾向的长期斗争在新条件下的一个发展，当时解放区已连成一片，许多城市已经解放或即将解放，解放战争的正规性程度大为提高，党需要迅速克服党内和军队内的无纪律无政府状态，并参看本卷《中共中央关于九月会议的通知》的第四点。这是编者对指示背景的说明，指示正文只讲了制度和理由。\n\n中文马克思主义文库还刊载了毛泽东一九五三年五月十九日对刘少奇、杨尚昆的两次书面批评。第一次写道：嗣后凡用中央名义发出的文件、电报，均须经我看过方能发出，否则无效。第二次要求负责检查自上一年八月一日到当年五月五日用中央和军委名义发出的电报和文件，是否有未经他看过的，并说过去数次中央会议决议不经他看就擅自发出，是错误的，是破坏纪律的。页面标题称这是对二人破坏纪律的批评，没有说明它同一九四八年的指示之间有什么关系，这一点本条目不下结论。\n\n后来党自己也检讨过集中的另一头。一九八一年《关于建国以来党的若干历史问题的决议》在讲“文化大革命”前期时说，毛泽东的左倾错误的个人领导实际上取代了党中央的集体领导；它提出的建党要求是把党建设成为具有健全的民主集中制的党，在高度民主的基础上实行高度的集中。报告制度的文本规定的是下对上的义务，没有规定上级怎样回应。这是文本本身没有的部分。",
  experiment: "拿出你每周或每两周发给上级的那份状态更新，改写成一页：先写三项，影响方针的问题和倾向、你的判断和解决办法、需要上面决定的事；技术性的进度另放附件，或者不写。字数卡在一页以内，署你自己的名字，不让模板代你写。发出去之后，问上级一句：这份和以前的相比，哪一行让你改变过一个决定。障碍是两种汇报方式的取舍，不是哪个人：仪表盘能自动给出事实，叙述性的报告才能给出判断，两者都要保留各自的用处。",

  source: "《关于纠正党内的错误思想》（一九二九年十二月），第一卷",
  idea: "争论怎样结束，要在争论开始之前就定好规矩。开会时让到会的人尽量发表意见，有争论的问题“把是非弄明白”，不用折中把分歧盖过去；一次解决不了，可以再议一次，但要“以不妨碍工作为条件”。表决之后，意见被否决的少数必须拥护多数通过的决议，只有“必要时”才可以在下一次会议上重新提出，在行动上不得有任何反对的表示。",
  why: "这是古田会议决议里“非组织观点”一节的第一条，针对的表现很具体：少数人的提议被否决，他们就“不诚意地执行党的决议”。决议写在红四军党内一再争论之后，它没有谈哪一次争论谁对谁错，而是给争论定了一套收口的办法。\n\n办法有两条，一条管会上，一条管会后。会上：让到会的人尽量发表意见；有争论的问题，要把是非弄明白，“不要调和敷衍”；一次不能解决的，二次再议，以不妨碍工作为条件，求得明晰的结论。会后：党的纪律之一是少数服从多数；少数人在自己的意见被否决之后，必须拥护多数人通过的决议；除必要时得在下一次会议再提出讨论外，不得在行动上有任何反对的表示。\n\n两条合起来是一个交换。多数一方负责把争论摊开、把结论说明晰，少数一方才有理由在会后真正去执行；少数一方放弃的只是行动上的反对，没有放弃再提的权利，再提的出口只有下一次会议。这个方法真正要求的是两头都守规矩：多数不能拿含糊的结论换一时的一致，少数不能拿慢执行代替表决。",
  failureMode: "它针对的有两头：一头是会上把分歧用折中盖过去，结论含糊；一头是少数在表决之后“不诚意地执行党的决议”。两头的结果相同，决议下来了，分歧原封不动留在执行里。\n\n在今天的工程团队里，它的样子是：评审会上两种方案各有道理，会议纪要写成两种方案都支持、各团队按需选择，没有人被说服，也没有人知道哪一种是标准；方案落选的一方回到自己的服务里照旧按原来的做法写，进度总比结论慢一个迭代，下一次评审又把同一个争论从头提一遍。",
  worked: "这一条后来有一份制度性的记录，处理的是争论收口时由谁拍板的问题。据李东朗（中央党校党史教研部教授）二〇〇七年发表在《北京日报》的文章，成立中央书记处处理日常工作，是刘少奇向政治局提议的；三月二十日，中央政治局会议通过《中共中央关于中央机构调整及精简的决定》，推定毛泽东为政治局主席，并为书记处主席，书记处由毛泽东、刘少奇、任弼时三人组成，其“会议中所讨论的问题，主席有最后决定之权”。\n\n这条规定的范围很窄。李东朗引用决定的原文说，重大的思想、政治、军事、政策和组织问题，必须在政治局会议上讨论通过；书记处只在政治局的方针下处理日常性质的问题。他的统计是，这项“最后决定权”只有一年多：一九四四年五月，书记处和政治局在六届七中全会期间停止行使职权，一九四五年七大选出的新书记处不再有这样的规定。\n\n同一篇文章也指出了这条规定的缺口：最后的决定，是根据大家的讨论和多数人的意见，还是主席根据自己的判断，并没有明确规定。一九二九年的决议只规定了多数和少数的关系，没有规定意见不分明时谁来收口；一九四三年的规定补上了收口的人，覆盖面只到书记处的日常事务，同样没有说明最后决定是否必须随多数。李东朗认为这一规定有悖于民主集中制原则。这是他的判断，本条目只记录他引用的规定和他指出的缺口。",
  experiment: "找出你们最近一次有争论的设计评审，翻出会议记录，回答四个问题：最后的结论，有没有写成别人能照着做的一句话；落选的意见记在哪里，写的是理由还是只有一个名字；落选一方之后三个月是否按结论做了；有没有写明重开这个决定的条件，一个日期、一个指标的阈值或一个事件。缺哪一项，就为下一次评审的决策记录补上哪一行。要比较的是两种收口方式，折中和明确选一个，障碍是方式，不是哪一位同事。",
  reflection: "你最近一次在会上被否决的意见，之后你在行动上是按结论做的，还是按自己的方案做的？",
  recall: {

    a: "开会时让到会的人尽量发表意见，有争论的问题把是非弄明白，不要调和敷衍；一次不能解决，二次再议，以不妨碍工作为条件。表决之后，少数必须拥护多数通过的决议，除必要时在下一次会议再提出外，在行动上不得有任何反对的表示。\n\n容易忘的是前半：它不只要少数服从，也要求多数先把是非弄明白，不拿折中把分歧盖过去。"

{
  id: "attrition-is-not-only-personal",
  track: "discipline", level: "v1",
  title: "“也不完全是个人的”",
  source: "《关于纠正党内的错误思想》（一九二九年十二月），第一卷",
  idea: "人懈怠、想走，先别把账全记在个人头上。决议把消极怠工和离队思想都列在个人主义下面，分析原因时却分了两栏：个人缺乏教育是一栏，另一栏是领导者的做法和队伍的条件。离队的原因，“也不完全是个人的”，还有物质生活过差、长期斗争感觉疲劳，以及领导者处理问题、分配工作、执行纪律不适当。所以纠正有两头，对个人加强教育，对组织要“处理问题、分配工作、执行纪律要得当”，并设法改善物质条件。",
  why: "这是古田会议决议“关于个人主义”一节的最后两条。这一节一共列了六种表现：报复主义、小团体主义、雇佣思想、享乐主义、消极怠工、离队思想。前四种写的是个人的立场和习气，后两种的写法不同。消极怠工是稍不遂意就消极起来，不做工作，原因主要是缺乏教育，但也有领导者处理问题、分配工作或执行纪律不适当；离队思想表现为要求脱离队伍调地方工作的“与日俱增”。\n\n决议给离队列了三项原因，其中两项不在个人身上：红军物质生活过差；长期斗争，感觉疲劳；领导者处理问题、分配工作或执行纪律不适当。纠正的办法也跟着分成几条：主要是加强教育，从思想上纠正个人主义；处理问题、分配工作、执行纪律要得当；设法改善红军的物质生活，利用一切可能的时机休息整理，以改善物质条件。决议同时说明，个人主义的社会来源是小资产阶级和资产阶级思想在党内的反映，教育的时候必须说明这一点。\n\n这个方法真正要求的是先分账再下药：同一个现象，哪一部分属于个人的认识，哪一部分属于领导方式和条件，要分别查，再分别处理。只做教育这一栏，领导者的处理和队伍的疲劳就原封不动，只做条件这一栏，个人的认识问题也没有人谈。",
  failureMode: "它针对的是把怠工和离队一律当作个人品质的看法：人不想干了，就是觉悟不够，办法就是谈话和教育。决议里这一类问题的原因，有相当一部分写在领导者的做法和队伍的条件上。\n\n在今天的工程团队里，它的样子是：一位工程师连续两个季度夜间值班最多，复盘里把他记成积极性下降，绩效谈话谈的是态度；排班规则、告警噪声、任务分配没有人查。半年里同组三个人先后申请转组，离职面谈里写的理由各不相同，共同点是同一条告警链路每周都在半夜叫醒他们，而这一点没有出现在任何一份记录里。",
  worked: "这一条可以和作者一年前的记录对照。《井冈山的斗争》（一九二八年十一月二十五日，收入《毛泽东选集》第一卷）记着当时红军的生活：除粮食外，每天每人只有五分大洋的油盐柴菜钱，全军五千人的冬衣还缺布，许多士兵天冷了还穿两层单衣，医院里有八百多人，药品和医生都缺。但是“从军长到伙夫，除粮食外一律吃五分钱的伙食”，发零用钱，两角的一律两角，四角的一律四角，文中说，“因此士兵也不怨恨什么人”。\n\n报告接着说，物质生活这样菲薄，战斗这样频繁，红军仍能维持下来，除了党的作用，就是靠实行军队内的民主主义：官长不打士兵，官兵待遇平等，士兵有开会说话的自由，废除烦琐的礼节，经济公开，士兵自己管理伙食。选集编者对这种平均的办法加了一条注：它在红军里施行了很长一个时期，当时是必要的，后来改为按等级略有一些区别。这份记录说的是待遇无法改善的时候，哪些组织上的做法让人留得下来。\n\n一年后的决议记录的是另一面：要求离队的与日俱增，原因里有物质生活过差和长期斗争的疲劳，也有领导者处理问题、分配工作、执行纪律不适当。同一份决议在盲动主义残余一节里，还把枪毙逃兵的制度和肉刑制度列为带有盲动主义性质的做法，要求从制度和政策上纠正。决议没有给出离队的人数，本条目也不引用未经核实的数字，所以纠正之后离队有没有减少，这里不下结论。",
  experiment: "取过去两个季度里离开团队或申请转组的人，再加上夜间值班和告警负担最重的两位工程师，做一张两栏表。一栏写个人的因素，比如对职业方向的想法；另一栏写条件的因素，比如排班规则、每周夜间被叫醒的次数、告警里没有人处理的噪声占比、任务分配是否事先讲清楚。条件一栏的每一项都配一个数字。挑数字最大的一项做一个小改动，两周后再看同一个数。要比较的是两种解释，是个人的问题还是条件的问题，障碍是解释，不是哪个人。",
  reflection: "上一次有人在你的团队里变得消极，你是先找他个人的原因，还是先查了排班、分工和你自己处理问题的方式？",
  recall: {

    a: "三项：红军物质生活过差；长期斗争，感觉疲劳；领导者处理问题、分配工作或执行纪律不适当。决议说这种现象的原因“也不完全是个人的”，所以纠正除了加强教育，还要处理问题、分配工作、执行纪律得当，设法改善物质生活，利用时机休息整理。\n\n容易忘的是三项原因里有两项不在个人身上：决议没有把离队当作单纯的觉悟问题。"

{
  id: "grow-from-the-ranks-not-by-buying-in",
  track: "discipline", level: "v1",
  title: "不走“招兵买马”“招降纳叛”的路线",
  source: "《关于纠正党内的错误思想》（一九二九年十二月），第一卷",
  idea: "队伍靠什么渠道补人，补进来的人就把什么习惯带进队伍。决议里的流寇思想，有一条是扩大红军时不走由扩大地方赤卫队、地方红军到扩大主力红军的路线，而走“招兵买马”“招降纳叛”的路线。药方也分两头：对现有的人加紧教育，同时改变补充的来源，争取有斗争经验的工农积极分子加入，并“从斗争的工农群众中创造出新的红军部队”。",
  why: "流寇思想是古田会议决议里单独的一节。它的开头先交代成分：红军中游民成分占了很大的数量，南方各省又有广大的游民群众，所以红军中产生了流寇主义的政治思想。表现有三条：不愿意做艰苦工作建立根据地和人民群众的政权，只想用流动游击的方法扩大政治影响；扩大红军走招兵买马、招降纳叛的路线；不耐烦和群众在一块作艰苦的斗争，只希望跑到大城市去大吃大喝。决议把肃清流寇思想，说成红军党内思想斗争的一个重要目标，并说历史上黄巢、李闯式的流寇主义，已经为今日的环境所不许可。选集编者在注里写道，黄巢和李自成都没有建立过比较稳固的根据地，总是流动作战。\n\n纠正有四条：加紧教育，批评不正确的思想；对现有的红军基本队伍和新来的俘虏兵，加紧反流氓意识的教育；争取有斗争经验的工农积极分子加入红军队伍，改变红军的成分；从斗争的工农群众中创造出新的红军部队。头两条处理存量，后两条处理增量的来源。\n\n这个方法真正要求的是把补人的路径设计成台阶：每一级的人从下一级里来，在上一级之前已经在地方经过了斗争的检验，而不是从外面一次性买进来直接放到前线。买进来的人带着原来的习惯，来得越多越快，原来的习惯就越是队伍的习惯，所以对进来的人要有教育，对进来的渠道要有选择。",
  failureMode: "它针对的是用收编代替培养、用流动代替扎根的增长方式：队伍的数字靠招兵买马和招降纳叛撑起来，核心部分却没有长大。决议把这一点写成不愿意做艰苦工作、不耐烦和群众在一块作艰苦的斗争。\n\n在今天的工程团队里，它的样子是：平台团队为了接入数字好看，一次合并了三个小团队，又一口气补了一批外包人员，直接排进值班；季度数字漂亮，三个月后值班手册、发布规范、评审习惯各说各话，真正能处理事故的还是原来的那几个人，新来的人没有一级一级往上走的台阶。",
  worked: "这条路线后来有一份历史学者整理的反面记录。黄道炫在《逃跑与回流：苏区群众对中共施政方针的回应》（中国社会科学院近代史研究所网站刊载）中写道，一九三三年初，福建省委代理书记罗明提出，机械地规定要扩大多少红军是不好的，应当重视地方武装的斗争。罗明的意见被当作“罗明路线”受到猛烈批判。此后中央苏区大规模扩大红军。\n\n为完成指标，许多地方采取强迫的办法，随之出现逃跑。黄道炫引用当时的《斗争》杂志，记录了不少新兵中途逃跑的事例。一九三四年九月，苏区日益缩小，人力已基本耗竭，中央仍在提出新的扩红任务。黄道炫的评价是，盲目扩红既削弱了地方武装，使红军不得不独任巨艰，又损害了苏维埃政权与群众的关系，得不偿失；他把这一时期的做法归到当时“左”倾中央的高指标和强迫命令上。\n\n两份材料对照来看，一九二九年的路线是逐级往上长，一九三三年至一九三四年的做法是由指标倒推。古田的文本给的是路线，没有给各级之间的比例，每一级该留多少人，这条路线本身回答不了。",
  experiment: "把过去一年新进入你团队的人手和服务，按来源分成四类：内部培养、外部招聘、合并过来的团队、外包。对每一类回答三个问题：他们接手值班、发布、评审这些核心职责之前经历了几步，每一步由谁带；三个月后留下来的比例；参与事故的次数。找出一个直接放到前线的渠道，为它设计一级台阶，比如先跟班两周，再做次要职责，然后才主值班。要比较的是两种增长方式，快速补人和逐级培养，障碍是速度和质量的取舍，不是哪位新人。",
  reflection: "你们团队这一年新增的人手里，有多少是经过一级一级台阶上来的，有多少是直接放到前线的？",
  recall: {

    a: "表现为不走由扩大地方赤卫队、地方红军到扩大主力红军的路线，而走招兵买马、招降纳叛的路线。处理来源的两条是：争取有斗争经验的工农积极分子加入红军队伍，改变红军的成分；从斗争的工农群众中创造出新的红军部队。\n\n容易忘的是另外两条处理存量：加紧教育，对现有基本队伍和新来的俘虏兵加紧反流氓意识的教育。决议要的是来源和教育两头一起管。"

  deepDive: "这是我们团队过去一年新增人手的来源、他们接手核心职责之前的步骤，以及三个月后的留存和事故参与情况。帮我判断哪一个渠道最像直接放到前线，应该设计怎样的台阶，并指出哪些数据还缺。"

  idea: "规矩传得多了，就会出现各地各队“略有出入”的版本，每个版本都有道理，却没有一个人能说出全军的底线是什么。训令的做法是把全军的规矩收成十一条，统一规定，重新颁布，要求以此为准，“深入教育，严格执行”；超出这十一条的事项，由各地各军最高首长根据具体情况另以命令规定。",
  why: "训令写于一九四七年十月十日，以解放军总部的名义发出，同一天公布的还有《中国人民解放军宣言》。训令开头说得很平实：本军的三大纪律八项注意实行多年，内容各地各军略有出入，现在统一规定，重行颁布。要求只有三个动作：以此为准，深入教育，严格执行。\n\n条文本身很短：三大纪律是一切行动听指挥，不拿群众一针一线，一切缴获要归公；八项注意是说话和气，买卖公平，借东西要还，损坏东西要赔，不打人骂人，不损坏庄稼，不调戏妇女，不虐待俘虏。每一条写的都是可以观察的行为，而不是一种品质，被对待的人自己就能看出来是否做到：东西还没还，庄稼坏没坏，人有没有挨骂。\n\n训令还留了一条边界：其他应当注意的事项，各地各军最高首长可以根据具体情况，规定若干项目，以命令施行。底线统一，补充有出口，也有明确的权限。这个方法真正要求的是三件事：底线短到每个人都记得住，条文是别人能验证的行为，而补充的权力放在哪一级要说清楚。",
  failureMode: "它针对的是规矩越传越多、各处不一的状态：同一件事，这个部队一种说法，那个部队另一种说法，条文再好，没有人说得清哪一版是准的，也就没有人能被问责。训令把原因写得很直白，就是各地各军内容略有出入，所以要先统一，再教育，再执行。\n\n在今天的工程团队里，它的样子是：每个团队有自己的一份变更规范，十几页，彼此有细小差别；新人入职时拿到的是最近一次修订的版本，老人记的是上一个版本；事故发生时，没有人能当场说出哪几条是所有团队都必须遵守的，复盘时只好去翻文档，而文档里的条目没有一条有人定期抽查是否被执行。",
  worked: "这份训令的注释，记录了规矩本身是怎样一步一步定下来的。选集编者注说，三大纪律八项注意是毛泽东等人在第二次国内革命战争中为红军制订的，具体内容在不同时候和不同部队略有出入。一九二八年春在井冈山，规定了三项纪律：行动听指挥，不拿工人农民一点东西，打土豪要归公；同年夏提出六项注意：上门板，捆铺草，说话和气，买卖公平，借东西要还，损坏东西要赔。一九二九年以后，三项纪律里的第二条改为不拿群众一针一线，第三条改为筹款要归公，后来又改为一切缴获要归公；六项注意增加了洗澡避女人和不搜俘虏腰包两项。把这份注释和一九四七年的八项逐条对照：说话和气、买卖公平、借东西要还、损坏东西要赔四项保留，上门板、捆铺草、洗澡避女人、不搜俘虏腰包没有再列，新列了不打人骂人、不损坏庄稼、不调戏妇女、不虐待俘虏。注释说明了条文的演变，没有说明取舍的理由。\n\n训令允许各地各军另行补充，各部队当时确有自己的补充规定。据中央电视台《国家记忆》节目的报道，上海党史网二〇二三年转载：一九四七年十月，刘伯承、邓小平率领的晋冀鲁豫野战军司令部到达湖北黄冈的总路咀，发生了警卫团一名副连长私拿百姓财物的事件。当时大别山部队订立的“约法三章”里写明“掠夺财物者枪毙”，司令部讨论时有人认为是小事，处分一下就可以；节目中黄冈市史志研究中心副主任陈军转述，邓小平认为部队的纪律关系到部队的生存，不是小事。赵桂良被公判枪决。报道说，同年十月的高山铺战役，当地百姓组成支前队伍送干粮、抬伤员。各来源对事件的具体日期说法不一，这里只取十月这一说。\n\n同一篇报道还记录了另一次补充：一九四九年五月入上海之前，部队在江苏丹阳整训，反复学习三大纪律八项注意，以及《入城纪律十二条》《入城三大公约十项守则》；陈毅特别强调不住民房店铺。五月二十七日清晨，上海市民发现马路两边睡满了解放军战士。底线十一条没有变，随情况增加的条文，由有权限的一级补上。",
  experiment: "把你们平台上所有要求工程师遵守的规则全数列出来，包括变更规范、评审要求、值班约定、事故响应步骤，统计一共几条、各团队的版本有几处不同。然后压缩出一份不超过十一条的共同底线，每条写成一个别人能验证的动作，而不是一种态度。其余的作为各团队可以补充的条目，写明由谁有权增加。最后随机问五位工程师，不看文档，能默写出几条。要比较的是两种做法，一份又长又全的手册，和一份短而硬的底线，障碍是手册的篇幅，不是哪位同事。",

  title: "犯过错误的人怎么处理，“他们要看这个榜样”",
  source: "《增强党的团结，继承党的传统》（一九五六年八月三十日），第五卷",
  idea: "对一个犯过错误的人怎么处理，不只是对他一个人的事，所有容易动摇的人都在看。毛泽东在八大预备会议上解释，为什么还要提名犯过路线错误的王明和李立三：“不是王明、李立三改不改的问题”，关系大的是成百万容易动摇的人看党怎样对待他们。有人担心这等于奖励错误，他的回答是看事实，七大选了他们之后十一年“毫无损失”，别人也没有故意去犯错误，反而“鉴于他们的错误，自己更谨慎一些”。他同时划了界：这种人同反革命分子和分裂派有区别。",
  why: "这是一九五六年八月三十日八大预备会议第一次会议上的讲话，第三点讲中央委员会的选举。争议最大的是王明和李立三。毛泽东回顾，王明在七大时写过书面声明，承认中央路线正确，后来又翻了；二中全会上希望他讲自己的错误，他不讲；这次大会他又因病不能出席。他也说，谅解李立三的人比较多，谅解王明的人比较少。\n\n他给的理由分三层。第一层是方法：王明、李立三当年对犯错误的人是“一经宣布你是机会主义，就不要了”，如果党也这样办，“就是走他们的路线”。第二层是信号：他们犯路线错误是全国著名、全世界著名的，在小资产阶级广大的国家，他们是旗帜，党内知识分子里有许多动摇的人，“他们要看这个榜样”；他用土地改革作比方，不动富农，中农就安心。第三层回答对奖励错误的担心：七十几个中央委员，没有人为了再当中央委员而故意犯错误。\n\n他同时把界限划在另一处：王明、李立三搞主观主义、宗派主义，是明火执仗，拿出自己的政治纲领；陈独秀搞托派、在党外搞反党活动，张国焘搞阴谋、搞分裂、跑到国民党那里去，这两个人同高岗、饶漱石一起，被他放在反革命分子和分裂派一类。这个方法真正要求的是先分类，是判断错了还是在破坏，再公开选择处理的方式，并且要按它给所有旁观者的信号来设计，而不是按对当事人一个人的态度。",
  failureMode: "它针对的是一经认定犯了错误就整个拿掉的做法：不管是真犯错误还是假犯错误，宣布了就不要了。毛泽东说，这是王明路线和立三路线对待党内关系的办法。\n\n在今天的工程团队里，它的样子是：一次事故复盘之后，当事人被调出值班轮换，从下个季度的关键项目上撤下，这件事全组的人都看见了。之后团队的反应不是少出事故，而是出了问题先自己悄悄修，上报晚一天，复盘材料里的时间线越写越短，因为大家从这个例子里读出来的规则是，被发现就要被拿掉。",
  worked: "八大的选举留下了记录。八大选举中，王明和李立三都当选为八届中央委员。据中央党史出版社《王明传》（戴茂林、曹仲彬著）的节录，刊于二〇〇九年七月一日的《人民文摘》，王明在九十七名中央委员中得票最少，排列最后一名；他一九五六年一月三十日出发去莫斯科治病，没有出席八大，一九五七年表示不愿再回国。同一段文字记载，一九五〇年七届三中全会作过《关于王明同志的决定》，毛泽东批示他的声明书应在七届四中全会前写好，他拖延；他在苏联期间，每月照领全部工资，所需药品和物品政府都予以满足。\n\n这条做法的另一头，在同一篇节录里也有记录：一九六六年“文化大革命”开始后，王明被公开批判；曾经负责给他寄钱物的秘书田书元被撤职，有人批判他里通外国；从一九六六年下半年起，国内不再给王明夫妇寄工资和物品。王明一九七四年三月二十七日在莫斯科病逝。\n\n这些记录说明了做过什么，说明不了信号是否起了作用。毛泽东把理由放在党内动摇分子的反应上，并且说王明改不改关系不大；他在讲话里点名的另一类人，陈独秀、张国焘、高岗、饶漱石，是他划在界限另一侧的例子。这里没有查到对党内反应的可核实的记录，所以他说的效果，本条目只能记作他的判断。",
  experiment: "回看你们团队过去一年里一次事故，查当时对当事人做了什么：调岗、移出值班、加审批，还是照常。再看之后三个月里，团队里这几个数字有没有变化：主动上报的事故和险情的数量、变更前来问你的次数、复盘文档的平均篇幅。把处理方式和这几个数字放在一起看。要比较的是两种处理，拿掉当事人和留下并帮他修，障碍是两者给其他人的信号不同，不是哪一个人的态度。",

  idea: "让下面的人说话，同时把每一项权限写清楚。士兵选出的代表可以“协助（不是超过）”连队首长管理给养和伙食；打仗时连队开会讨论怎样攻克敌阵，要在连队首长指导下开；士兵可以揭发干部中坏分子的错误和罪恶，也可以推选下级干部候选人，但“不是普遍的推选，而是某些必要时的推选”。民主在这里不是同集中对立的另一套办法，而是在集中领导之下，逐项给下面划出的权限。",

  why: "一九四二年二月八日，毛泽东在延安干部会上作这篇讲演。会议的宗旨由凯丰先讲，他接着讲的是：主观主义和宗派主义怎样拿党八股做“宣传工具”，或表现形式。他的理由是，不连党八股一起清算，那两样东西就“还有一个藏身的地方”。他还算了一笔传播的账：党八股只给自己看，倒不要紧；送给第二个人看，人数多了一倍，已属害人不浅；贴墙、油印、登报、印成书，就影响许多人。\n\n八条的内容各有分寸。第一条，反对的是空话，不是长度：他说自己反对的是“空话连篇言之无物”的八股调，不是说任何东西都以短为好，《资本论》那样的长文，有内容，看下去就是了。第二条，装腔作势吓人，对敌人没有用处，对同志只有损害，他区分了两种对象：混进党内的坏人可以用残酷斗争和无情打击，偶然犯错误的同志要用批评和自我批评。第三条是不看对象，上一篇已经讲过。第四条，语言要向群众、外国语言和古人语言中有生命的东西这三处学。第五条，开中药铺：他说甲乙丙丁这些符号不是不能用，错在方法，是按事物的外部标志分类，不是按内部联系分类，使人“不用脑筋想问题”；问题就是事物的矛盾，文章要提出问题、分析问题、指明性质、给出办法。第六条，他拿洗脸作比方：每天洗脸，洗完还要照镜子，写文章做演说影响别人的思想和行动，更该这样负责，拿不出来的东西就不要拿出来。第七、八条他只用一句话带过，说意义自明。\n\n这个检查方法真正要求的是三件事：拿一篇真实的文章逐条去对，不拿印象去对；判断的依据是有没有内容、读者是谁、写的人有没有核对过，不是长短和符号；讲演最后他让每个人先想想自己，再跟知心的朋友商量，就是说检查从自己的稿子开始，由第二个人来读。",
  failureMode: "这份讲演针对的是党内流行的一类文字：长而空，吓人，不看对象，干瘪，罗列，随手发表。他的诊断是，这些写法给主观主义和宗派主义提供了藏身之处；他也说，党八股“中国有，外国也有，可见是通病”。\n\n在今天的工程团队里，它的样子是：一份事故复盘按背景、影响、根因、改进四栏填满，每栏三句话，读完不知道到底是哪个条件造成了故障、谁该改什么；设计文档有十个小节，每节都有标题，没有一节写明做了哪个取舍；评审意见一律是建议考虑，没有人说赞成哪一个、反对哪一个。每一份都发出去了，没有一份写完后被作者自己读第二遍。",
  worked: "这篇讲演是整风运动的一环。据有关党史材料的叙述，延安整风从一九四一年五月毛泽东作《改造我们的学习》报告开始，到一九四五年四月六届七中全会通过《关于若干历史问题的决议》结束；《反对党八股》在其中段。原文也记载了会场上的做法：当天散发了一本题名《宣传指南》的小册子，收四篇文章，毛泽东逐篇讲了该怎么读，一篇讲列宁怎样写传单，一篇是季米特洛夫关于用群众懂得的话讲话的规则，一篇是鲁迅复《北斗》杂志社的信，一篇是六中全会关于宣传民族化的论述。讲演的结尾，他要每个人把自己想清楚，再跟知心的朋友商量。\n\n第二条罪状的界线，在一九四三年被另一场运动检验了。高华《红太阳是怎样升起的》记载，一九四三年七月十五日，康生在中央机关的动员大会上作《抢救失足者》的报告，审干中的“抢救”随后展开；据党史大事记，七月三十日毛泽东指示停止这个运动。讲演原文给了两条规则：对混进党内的敌人可以残酷斗争，对偶然犯错误的同志用批评和自我批评。这条界线要靠有人先判定谁是哪一类，文中没有规定谁来判定、依据什么判定。\n\n这篇讲演本身也值得对照。它借八股的格式列了八条，并说明是仿其笔法以毒攻毒；第七、八两条各只一句话，这符合它自己的要求，没有内容的地方不写。",
  experiment: "找出你最近发出的三份文档：一份迁移通知，一份事故复盘，一份 RFC 或设计文档。对每一份，逐条回答前六条罪状：有没有一段删掉之后没有人会发现；有没有用词只为显得权威；写的时候想的读者是谁；有没有一个读者不认识的名词；有没有一个按栏目填空的结构代替了你的判断；发出前你自己完整读过第二遍没有。每个“有”都摘下文档里的原句作证据。然后选发送范围最大的那份，把前一屏重写成：问题是什么，分析的结论是什么，决定是什么，读者要做什么，总长缩到原来的一半，且不能丢掉任何一个决定。",

  title: "先问为什么人，再谈普及和提高",
  source: "《在延安文艺座谈会上的讲话》（一九四二年五月），第三卷",
  idea: "毛泽东说文艺工作的问题基本上有两个：为什么人，和怎样为。他的回答是为人民大众，首先是工农兵。接着才谈怎样为：普及是向工农兵普及，提高是从工农兵提高；眼下普及更迫切，但两者不能截然分开，提高要在普及的基础上，普及要有提高的指导。",
  why: "这个座谈会在一九四二年五月开了三次，到会发言的有党内和党外的几十个人，毛泽东在第一次作“引言”，在五月二十三日作“结论”。结论一开头他就说，讨论问题要从实际出发，不是从定义出发，并把问题的中心定为“一个为群众的问题和一个如何为群众的问题”。他说，根据地文艺作品的接受者是工农兵和革命的干部；他举了一个数字作对比：国民党统治区一本书一版平常只有两千册，延安单是能看书的干部就有一万多。\n\n“为什么人服务的问题解决了，接着的问题就是如何去服务”，他是这样转到普及和提高上的。他先批评有些同志轻视和忽视普及，不适当地太强调了提高；又说因为没有弄清楚为什么人，这些同志所说的普及和提高就都“没有正确的标准”。他的方式是把两个词都落到对象上：普及是向工农兵普及，用工农兵自己所需要、所便于接受的东西；提高是从工农兵的基础上提高，沿着工农兵自己前进的方向，而不是把他们提到别的阶层的“高度”去。因此，在教育工农兵之前，先有一个学习工农兵的任务。他又说，对于正在流血斗争、不识字无文化的工农兵，第一步需要不是“锦上添花”，而是“雪中送炭”，所以眼下普及的任务更迫切。\n\n但他随即说，两者不能截然分开。普及如果永远停在一个水平上，一年两年三年总是一样的货色，教育者和被教育者就是半斤八两；人民要求普及，跟着就要求提高，要求逐年逐月地提高。他的公式是“我们的提高，是在普及基础上的提高；我们的普及，是在提高指导下的普及”。还有一种间接为群众所需要的提高，是干部所需要的提高，因为只有经过干部才能教育和指导群众；如果给干部的东西不能帮他们去教育群众，这种提高就是“无的放矢”。这个方法真正要求的是：先弄清楚用的人是谁、现在在什么水平，从他们的做法里长出下一步，并且拿能不能帮到他们来检验每一步。",
  failureMode: "文中点名的错误有两个方向。一个是轻视和忽视普及、不适当强调提高的同志，他们的普及和提高都没有对象，也就找不到两者的关系；另一个是把普及做成原地踏步，总是一样的货色，“有什么意义呢”这个问题他是以反问提出的。专门家如果把自己当作群众的主人，在他看来，不管才能多大，也是群众所不需要的。\n\n在今天的工程团队里，它的样子是：平台团队按自己设想的终点做了一套最先进的抽象，业务团队还在用复制粘贴的脚本，采纳率上不去，被解读成对方不愿意进步；或者相反，三年来只写 runbook 和脚本，问题一个一个地接，没有把重复出现的做法收成一项平台能力，每个新来的团队仍然从头摸索。",
  worked: "秧歌剧可以看作这套关系在延安的一次实践。据中国作家网等刊发的回顾文章，一九四三年春节，鲁艺的秧歌队在延安城南门外广场演出新秧歌剧《兄妹开荒》，受到各界欢迎，随后又出现了《夫妻识字》等小型秧歌剧，以及《周子山》《血泪仇》等大型的。一九四五年初，鲁艺集体创作歌剧《白毛女》，据这些回顾，它的构思受到秧歌剧的启发，作为献给七大的作品，一九四五年四月七大期间在延安上演，毛泽东和代表一起观看。首演的具体日期，有的材料写四月二十八日，有的只写四月，这里不作定论。从普及的形式长出大型的新作，大致就是他说的“在普及基础上的提高”。\n\n这篇讲话的文本本身也有一段历史。据有关文献的回顾，它于一九四三年十月十九日在《解放日报》全文发表，后来收入《毛泽东选集》时作过修订；今天通行的是选集第三卷的文本，改动不少。引用它的哪个提法，要先确认是哪一个版本。\n\n它的“为什么人”的回答后来被党自己重新表述。据一篇回顾文章，一九八〇年七月，《人民日报》发表社论，以“文艺为人民服务、为社会主义服务”取代此前“为工农兵服务、为无产阶级政治服务”的提法；这篇社论的原文没有查到，上面是转述。这里要把两件事分开：讲话文本提出的是为谁和怎样为，以及政治和艺术两个标准同时要求，既反对政治观点错误的作品，也反对只有政治观点而没有艺术力量的“标语口号式”作品；讲话同时把政治标准放在第一位、艺术标准放在第二位；怎样判定一部作品够不够格，由谁来判定，文本没有规定程序。",

  source: "《〈农村调查〉的序言和跋》（一九四一年三月、四月），第三卷",
  idea: "毛泽东为《农村调查》写序，重申的是一件容易被忽略的事：这批材料印出来，是为了给同志们“指出一个如何了解下层情况的方法”，不是让人去记里面的具体材料和结论。情况在变，了解变化中的情况这件事，任何党也不能依靠别人预备，所以搞实际工作的人必须自己向下做调查。",
  why: "序写于一九四一年三月十七日，跋写于四月十九日，都在延安整风正式开始之前。序一上来就交代了背景：党的农村政策已经不是十年内战时期的土地革命政策，而是抗日民族统一战线的政策。在这个背景下印十年前的调查材料，他先把用途说死：帮同志们找一个研究问题的方法。他批评的是当时党内“粗枝大叶、不求甚解”的作风，有人甚至全然不了解下情，却在那里担负指导工作，他称之为“异常危险的现象”。\n\n他对方法的要求有两层。一层是取样：对担负指导工作的人，“有计划地抓住几个城市、几个乡村”，用阶级分析的方法作几次周密的调查，这是了解情况的最基本的办法，不是靠一大堆粗略的统计。另一层是不能外包：中国的资产阶级没有替我们预备较完备的社会材料，实际工作者要随时了解“变化着的情况”，这是任何国家的共产党也不能依靠别人预备的。他还交代了一个细节：自己用开调查会得来的材料，湖南的几个，井冈山的几个，“都失掉了”。结论会丢，会过时，留得住的只有做法。\n\n跋把同样的区分用在经验上。他说十年内战时期的经验是现在抗日时期“最好的和最切近的参考”，但这是指如何联系群众和动员群众这一面，不是指策略路线这一面；策略路线在过去和现在有原则区别。这个方法真正要求的是：每引用一份旧材料，先问其中哪一部分是找到答案的做法，哪一部分是只在当时当地成立的答案；做法可以沿用，答案要用眼前的情况重新核实。",
  failureMode: "文中点名的错误是两种人：一种粗枝大叶、不求甚解，不了解下情却在指导工作；一种下车伊始就发议论、提意见，“钦差大臣”到处都有。他的判断是，这样的议论或批评没有经过周密调查，不过是无知妄说。第三种错误是这篇序言要预防的：把印出来的结论当成现成答案，拿去套眼前的事。\n\n在今天的工程团队里，它的样子是：照搬一家大公司在技术大会上讲的架构结论，没有人问他们当时的流量、团队规模和故障历史是什么；两年前的容量评估报告至今还被当作数字引用，没有人重测；新来的平台负责人凭一张上季度的看板，就对一个团队的痛点下结论。",
  worked: "这篇序言之后，调查研究在党内被做成了制度。据中央党史和文献研究院网站的回顾，一九四一年七月七日中央发出《关于设立调查研究局的通知》，八月一日发布《关于调查研究的决定》和《关于实施调查研究的决定》，随后成立的中央调查研究局由毛泽东任局长兼政治研究室主任，任弼时任副局长。这是党第一次就调查研究发布中央文件。\n\n二十年后，同一个方法被重新拿起来。据中国共产党新闻网的党史回顾，毛泽东在一九六一年向全党倡议“今年搞一个实事求是年”，并派出调查组下到农村；三月，中共中央在广州工作会议上通过《农村人民公社工作条例（草案）》，即“农业六十条”（具体日期叙述不一，有三月十五日和三月二十二日两说）；此后常委们带着草案下乡再调查，中央据此再次修改，六月发出了修正草案。草案在调查之后被改，正是序里说的变化着的情况不能靠别人预备的意思。\n\n破例的是中间那几年。一九八一年《关于建国以来党的若干历史问题的决议》写道，由于对经济发展规律和中国经济基本情况认识不足，更由于毛泽东同志、中央和地方不少领导同志在胜利面前滋长了骄傲自满情绪，“没有经过认真的调查研究和试点，就在总路线提出后轻率地发动了‘大跃进’运动和农村人民公社化运动”。同一份决议也写到，他早在一九三〇年就提出反对本本主义。这篇序言交代了怎样调查、为什么要自己调查，没有交代的是：调查得来的情况和上面已经定下的判断冲突时，谁说了算，用什么程序裁决。",
  experiment: "挑一条你团队里被当作常识反复引用的结论，比如一个容量上限、一个典型延迟数字、一条“这类故障大多出在某处”。先找到它的出处，写下两行：当初是怎么得到这个结论的（做法），结论本身是什么（答案）。然后抓两三个现在的实例，从头到尾追一遍，例如各挑一个调用链完整走一次，亲手查日志和配置，不看别人的汇总。最后把结论按眼前的情况重写一遍，标出哪一处和旧结论不同，并写明下次什么条件出现时需要重测。",
  reflection: "你团队里被反复引用的哪条结论，最后一次有人亲手核实是什么时候？",

{
  id: "wont-or-cant-read-their-own-document",
  track: "writing", level: "v4",
  title: "对方不做某事，先分清是不愿意，还是有顾虑",
  source: "《别了，司徒雷登》（一九四九年八月十八日），第四卷",
  idea: "一份文件如果说明了一方为什么没有做某件事，读它的人要先分清两种理由：是不想做，还是做不了。毛泽东读美国国务院的白皮书和艾奇逊的信，抓住的是这一点：美国没有大规模出兵，“不是因为美国政府不愿意，而是因为美国政府有顾虑”。他把信里公开写出的顾虑逐条摆出来，再指出信里没写的那一条。",
  why: "一九四九年八月五日，美国国务院发表题为《美国与中国的关系》的白皮书，艾奇逊七月三十日给杜鲁门的信附在前面；毛泽东为新华社写了五篇评论，这是其中第二篇。开头他先讲了白皮书发表的时间：司徒雷登离开南京、快到华盛顿、尚未到达的日子，他说这样发表，对“以脱卸责任为目的的白皮书”是适宜的。\n\n正文的方法是引用对方的话，再推回去。艾奇逊在信里列出美国面前的三种选择：一干二净地撤退，大规模军事干涉帮助国民党消灭共产党，或帮助国民党建立权力同时促成双方妥协。对第二种，信里说从理论上看令人神往，但行不通：国民党已经削弱、失去民心，只有靠美国的武力才可能打跑共产党，这样庞大的责任，美国人民显然不会批准。毛泽东的读法是：这段话说出了理由，理由不是不想干，而是干不成。他把顾虑归成三条：中国人民反对，怕陷在泥潭里；美国人民反对，不敢下动员令；苏联、欧洲和各国人民反对，要冒天下之大不韪。信里只讲了前两条，“这第三个顾虑他不愿意说”。\n\n这个读法有两个用处。一是分清了判断依据：不靠对方自我描述的善意，靠对方在自己文件里承认的约束条件。二是提出了用法：他在结尾处说，先进的人们“应当很好地利用白皮书”对中国人民进行教育工作，也就是拿对方自己的文字当共同的证据，不拿自己的断言当证据。这个方法真正要求的是：对方拒绝某个选项时，先把他自己给的理由抄下来，一条一条标成偏好或约束，再找他没有写的那一条。",
  failureMode: "文中点名的错误有两种：对美国抱幻想，设想它有仁义道德；认为“不要国际援助也可以胜利”，因而不去读对方的文件。毛泽东把这封信当作对方自己写出的材料，说艾奇逊“毫无隐讳地说出了全篇的真理”，不必去猜。\n\n在今天的工程团队里，它的样子是：上游团队回复这个需求本季度排不进去，下游读成对方不重视，吵了一轮，没有人去看对方的工单、容量或合规说明里到底写了什么约束；云厂商回复某个配额不能提高，被当成永久的事实写进架构，没有人问是哪一个条件使它现在提不了，什么条件出现它就能提。",
  worked: "这篇评论自己就是一个实例，同时也交代了方法的来源。白皮书和信都是美国政府公开的文件，据《毛泽东选集》第四卷《丢掉幻想，准备斗争》的注释，白皮书共八章，叙述从一八四四年《望厦条约》到一九四九年的中美关系，信写于七月三十日；五篇评论都是毛泽东为新华社写的。毛泽东在文中承认，艾奇逊的坦白有限度，所以他读的是信里写了的和没写的两部分。\n\n这个读法在半年内遇到了条件变化。据杜鲁门图书馆保存的记录，一九五〇年一月五日杜鲁门在记者招待会上说，美国不愿在台湾取得基地，也不会向那里的中国军队提供军事援助或建议；据维基百科《第一次台海危机》条目引述的声明，六月二十七日、朝鲜战争爆发后，杜鲁门宣布已命令第七舰队阻止对台湾的任何攻击。顾虑还在，只是它们各自的分量变了，行为也就变了。大规模出兵中国大陆确实没有发生，但是依据约束条件做出的判断，要随条件重读，文章本身没有给出重读的时间或程序。\n\n还要看到这类文件的性质。据维基百科《中国白皮书》条目，白皮书是艾奇逊为回答指责政府“丢失中国”的批评者而下令编写的，信也是为政府的政策辩护。所以信里写的约束条件既是承认，也是主张；毛泽东自己也在文中说这份文件的目的是脱卸责任。读这样的文件，得到的是一份可检验的假设，要拿别处的证据对一遍。",
  experiment: "找一次你最近收到的拒绝：上游团队的“不做”，厂商的“不支持”，云服务的配额拒绝。找到对方解释原因的原文，然后写四行：对方说考虑过哪些选项；每个被拒绝的选项给的理由原话是什么；把每条理由标成偏好或约束；对方没有写、但你根据别处的证据认为存在的那一条约束是什么。对每一条约束，写出一个你能观察到的信号，表示它松动了，设一个每月看一次的提醒。最后决定：你的设计现在要不要假设这条约束会一直在。",
  reflection: "你团队里哪一条被当成对方“不愿意”的拒绝，其实可能只是对方的一条约束？",
  recall: {
    q: "毛泽东读艾奇逊的信，是怎样推出美国没有大规模出兵的原因的？他补充了信里没有写的哪一条？",
    a: "他把信里对第二种选择的说明当作约束条件来读：美国之所以没有大量出兵，不是因为不愿意，而是有顾虑，一怕中国人民反对，二怕美国人民反对，三怕苏联、欧洲和各国人民反对。信里没写的是第三条。\n\n容易忘的是这种读法的限度：白皮书是为政府辩护而编的，信里的理由既是承认也是主张；约束条件也会变，一九五〇年一月和六月美国在台湾问题上的做法就不同。"

  source: "《丢掉幻想，准备斗争》（一九四九年八月十四日），第四卷",
  idea: "毛泽东在这篇评论里区分了一类人：有些人“口头上说拥护，骨子里是看”，想的是“看一看再说”。对他们的办法是“用善意去帮助他们，批评他们的动摇性，教育他们”；他还预先说明，这类人会“坚定了又动摇，一遇困难就要动摇”，所以胜利之后也不能停，“不要以为胜利了，就不要做工作了”。",
  why: "这篇评论写于一九四九年八月十四日，是毛泽东为新华社评美国白皮书和艾奇逊信件的五篇之一。白皮书发表在八月五日，艾奇逊在信里承认中国内战的结局超出美国政府控制的能力，却仍然提出要继续“鼓励”中国的“民主个人主义”。毛泽东的读法是，这说明美国还指望国内一部分人：有一类知识分子对共产党还在观望，对美国还存着幻想，艾奇逊们的做法在中国“还有一层薄薄的社会基础”。\n\n因此他把这类人当作一项要持续做的工作，不当作一个已经分出去的阵营。他列出的对象很宽：中间阶层、中间派、各阶层中的落后分子、一切还在动摇犹豫的人们；他承认这些人“还要长期地动摇着”。他分了两种态度：对帝国主义不能指望它回头，要组织力量斗争；对这些动摇的人，要用善意去帮助，批评他们的动摇性，教育并争取他们。至于“准备斗争”这个口号，他说是对那些还在这个问题上被动、“还没有下决心”的人说的。\n\n这个方法真正要求的是三件事：不把口头上的拥护当作已经做出的决定；预料到动摇会在每次遇到困难时重来，因而在困难出现的地方做工作，不只在表态的时候做；第一次胜利以后，还要做很多的耐心的工作才能真正争取这些人。",
  failureMode: "文中点名的错误是想当然：以为胜利了就不用再做工作，以为表态的人已经站过来了，以为还在观望的人可以靠一次说服了事。毛泽东的判断相反，要做的是长期的、耐心的、跟着对方的困难走的工作。\n\n在今天的工程团队里，它的样子是：架构评审上八个团队都同意迁移到新平台，文档上有他们的签字，平台团队宣布采纳完成，转去做下一个项目；第一次出现配额不够、延迟抖动或成本超支，其中几个团队悄悄退回旧路径，因为没有人在那个时点出现过。",
  worked: "这篇评论之后，党对知识分子的工作经历了几个阶段。据《周恩来年谱》和党史材料的回顾，一九五一年九月二十九日，周恩来在京津高校教师学习会上作《关于知识分子的改造问题》的报告，强调知识分子从民族立场转到人民立场的必要；十一月三十日中央发出《关于在学校中进行思想改造和组织清理工作的指示》，运动此后扩展到文艺界等领域，一九五二年秋基本结束。各家对这场运动的评价不一，这里只记它的做法：由党发动、全体教师参加、以学习和自我检讨为主要形式。\n\n一九五六年一月，据一九八一年《关于建国以来党的若干历史问题的决议》，中央召开知识分子问题会议，随后提出“百花齐放、百家争鸣”的方针；决议评价这些规定了正确的政策。同一份决议也写到，一九五七年的反右派斗争“被严重地扩大化了，把一批知识分子、爱国人士和党内干部错划为‘右派分子’，造成了不幸的后果”。这些做法同这篇评论的关系，要分开读：评论讲的是善意、批评和教育，后来的运动怎样判定对象、怎样处理，不是评论的内容。\n\n这篇评论本身留下了一个空缺：它说了对动摇的人怎么做，没有说谁来判定一个人是在动摇、还是在反对，判定的依据是什么，批评他们的动摇性时，被批评的人有没有异议的渠道。对动摇者要用善意，这是文本的主张；一九五七年的归类怎样做出，是另一件事。",
  experiment: "列出最近两个季度里点头同意你们某项平台变更的团队，每个团队一行。对每一行，不看签字，只看行为：过去三十天有没有真正用新路径，最近一次故障时走的是哪条路径。把它们分成三类：在用，嘴上说好、实际在看，没有参与。对第二类，写下它们最可能退回旧路径的那个时点，比如第一次配额不够，第一次延迟抖动，第一次成本告警。针对其中最大的一个，在那个时点之前安排一次你主动提供的具体帮助，并写明你用什么信号来判断它是继续用，还是在退回。",

  idea: "毛泽东说，“化”是“彻头彻尾彻里彻外”的意思，有些人连“少许”还没有实行，却在那里提倡“化”。他的劝告是先办“少许”，再去办“化”，否则仍是教条主义和党八股。检验一个人是不是真想“化”，要看他有没有下决心实地跟老百姓学，能不能讲出三句老百姓的话。",
  why: "这是《反对党八股》后半段里的一小节。一九四二年二月八日，延安的干部会上，毛泽东列完八条罪状，转到当时流行的口号：“现在许多人在提倡民族化、科学化、大众化了，这很好”。他不反对口号，反对的是口号走在事实前面：口讲大众化而实是小众化的人，说得多，做得少，他给的评语是“眼高手低，志大才疏”。\n\n他的检验办法很具体。他设想，如果有一天大众中的一个人在路上对这样的人说“先生，请你化一下给我看”，就会“将起军”，拿不出东西来。他的判断标准也落在行为上：天天喊大众化的人，如果连三句老百姓的话都讲不来，可见他没有下过决心跟老百姓学，他的意思仍是小众化。真想实行的人，就要“实地跟老百姓去学”，否则仍然“化”不了。\n\n这个方法真正要求的是：一个带“化”字的口号，先要有几件做完了、做透了的事作证，再去铺开；这几件事是不是做透了，要由使用它的人来看，不由喊口号的人来判断。",

  worked: "这类口号在延安不是新东西。据党史回顾，一九三八年十月六届六中全会上，毛泽东在《论新阶段》的报告中讲到使马克思主义在中国具体化、使其每一表现都带有中国的特性；到一九四二年二月，他在这篇讲演里谈的是民族化、科学化、大众化。同一类口号已经提了三年多，他才说要先办“少许”。\n\n后来的一个对照是人民公社化。据各家叙述，一九五八年四月河南嵖岈山的公社常被当作起点，八月二十九日中央北戴河会议通过《关于在农村建立人民公社问题的决议》；到十月底，约有两万六千多个公社、一亿二千万户农户，占全国农户的百分之九十九以上，一份学术论文给出的年底数字是两万三千五百三十个，数字不一致，这里取范围。从决议到几乎全部农户加入，大约是两个月。一九八一年《关于建国以来党的若干历史问题的决议》把这个过程归因于领导人“急于求成”等原因，同时记载毛泽东在纠正这些错误时提出了“不能超越阶段”。\n\n这段讲演没有回答的问题是：“少许”要有多少才够，由谁来判断做透了；文中给的标准是行为性的，如讲得出三句老百姓的话，没有给出数量。",
  experiment: "选一个你们正在用的带“化”字的口号：标准化、平台化、自动化、AI 化都行。先写一句话，说明这个“化”现在到底覆盖了什么、不覆盖什么。再列出“少许”：有几个服务或团队已经从头到尾完成，每个附一条证据，最好是使用的人自己说过变得更省事的话。如果少于三个，就把口号的说法缩到这几个实例上。然后做语言检验：用三句话，用使用这套东西的团队自己的词，说明它对他们每天的工作改变了什么，请其中一个团队的人复述，对不上的地方就是你还没学会他们的话。最后写下下一次宣布之前必须再做透的三个实例。",

  idea: "毛泽东说，多年来共产党人讲帝国主义的本性，在许多中国人听来总是“将信将疑”。美国国务院发表白皮书以后，艾奇逊以国务卿的资格说话，所讲的就某些材料和某些结论来说同共产党人如出一辙，这一下“可不能不信了”。他由此认定：对方公开发表的文件，可以用作教育材料，也是展开一场迟迟没有机会进行的讨论的由头。同时他提醒，那份文件的坦白是选择过的。",
  why: "这篇评论写于一九四九年八月二十八日，是批评白皮书的第四篇文章。他先说了这个讨论的规模：各民主党派、人民团体、报社、学校和各界民主人士都在谈，涉及中美关系、中苏关系、百年来的中外关系，以及知识分子在对内对外关系中该取什么态度。他的解释是，革命基本胜利了，中国人却一直没有机会详尽讨论革命和内外各方面的相互关系；以前没有机会，是因为大城市和人民解放区被隔绝，各个矛盾的侧面也还没有充分暴露，白皮书给了这个机会。\n\n接着是这篇评论的核心判断。白皮书是美国政府内两派争论的产物，一派把用过的办法摊出来，去答复另一派的攻击，因此公开暴露代替了遮藏掩盖；他说在这以前，帝国主义政府在嘴上、在官方文书上总是满篇的仁义道德。对中国读者来说，变化在于说话的人换了：同样的话出自共产党人，人们说“怕未必吧”，出自美国国务卿，就没有这个余地，“使成群的人打开了眼界”。\n\n他同时给这种用法划了线。艾奇逊说他的白皮书是“坦白记录”，毛泽东的回答是，坦白是有的，也是没有的：对他们自己认为有利的东西，他们是坦白的，反之则没有，“装作坦白，是为了作战的目的”。这个方法真正要求的是：拿对方自己写下的东西去说服第三方，比拿自己的断言有效得多；但引用时要同时问两件事，哪些话是对方没有选择的，哪些话是选择过才放进去的。",
  failureMode: "文中点名的错误是在帝国主义的本性和社会主义的本性这类问题上，只靠自己的论断，听的人便将信将疑。这篇评论还指出了对方文件里的一个错：艾奇逊把两国人民和两国反动派混为一谈，把两国反动派之间的“友谊”说成了两国人民的。\n\n在今天的工程团队里，它的样子是：平台团队反复向业务团队讲某个托管服务的可用性靠不住，对方每次都当作平台团队的偏见；半年后这家服务商自己发了事故报告，写明了同样的故障模式，平台团队仍然拿自己的统计数字去争，没有想到把对方的报告原文发给那些半信半疑的人。",

  experiment: "找一个团队里对你的某个判断半信半疑的场合：比如你认为某个厂商的服务不可靠，某个上游接口有稳定性问题。先写下你的判断。然后去找对方自己发布过的东西：状态页的历史记录、事故报告、变更日志、公开的服务等级承诺，摘出三段原文，要求每一段都能让不认同你的人自己去点开核对。把这三段按“对方自己说的”和“我推出来的”分成两栏；只把第一栏发给半信半疑的人，不加评论，问他们怎么看。再问自己：这些东西为什么会写出来，哪些该写却没写。",

  idea: "毛泽东读艾奇逊的信，抓住信里自己举出的证据：庚子赔款办教育，废除治外法权，战时和战后的援助。他把每一项拆开，放回当时的事实旁边，再拿对方声明的三项原则，同这些行动的实际结果对照。方法是不争对方的用意，只检查对方拿来证明用意的那些事。",
  why: "这篇评论写于一九四九年八月三十日，是批评白皮书和艾奇逊信件的第五篇。艾奇逊在信里说，美国人民和政府从很早起就关心中国，教会、慈善事业和文化方面的纽带加深了美国对中国的友谊，证据是用庚子赔款教育中国学生、在第二次世界大战期间废除治外法权、战时和战后的大规模援助；又说美国始终维持对华外交政策的基本原则，包括门户开放、尊重中国行政和领土的完整、反对任何外国控制中国。\n\n毛泽东的做法是，对信里每一项证据都配一条事实。一八四四年的望厦条约，美国取得治外法权和传教的条款；美国教会和慈善机关在华投资，据他引的统计，总额四千一百九十万美元，其中医药费占百分之十四点七，教育费占百分之三十八点二，宗教活动费占百分之四十七点一，出处是雷麦的《外人在华投资》；燕京、协和、圣约翰等十所院校是美国人设立的，司徒雷登因办这类事业出名而做了驻华大使。治外法权“废除”了，沈崇案的犯人却回到美国被宣布无罪释放。援助的数目，他写“据白皮书说是四十五亿余美元，据我们统计是五十九亿一千四百余万美元”。\n\n三项原则他用结果去验：门户开放，现在只有广州、台湾等处还向艾奇逊们开放，上海这样的地方却被军舰封锁；领土完整和反对外国控制，同样只在这几处“依然维持”着。这个方法真正要求的是：对方拿什么证明自己，就去查那一件事，要求每一项都有日期、数目、出处；两个数目对不上，先弄清各自数的是什么。他自己的两个援助数字没有说明口径，要对齐，先要对齐口径。",
  failureMode: "文中点名的错误是用自己列的善意清单代替结果：艾奇逊用一串事例和原则，为自己的政策寻找根据。毛泽东的判断是，这些事例拿到历史里一对，指向的是另一个结论。\n\n在今天的工程团队里，它的样子是：平台团队的季度总结列了开了多少场培训、写了多少篇文档、上线了多少个模板，作为赋能业务团队的证据，没有一项去对业务团队的上线周期、故障数、值班负担有没有变；供应商的合作说明里写了一串联合优化项目，没有人把它和账单上的实际用量放在一起看。",

  experiment: "挑你们团队或平台最近一份总结或对外介绍，列出里面当作成果的所有项：培训多少场，上线多少功能，迁移多少服务。每一项后面写两栏：一栏是它声称要改变的那个结果，比如业务团队的上线周期、事故次数、值班负担；另一栏是你能找到的、这一项做完前后的实际数字，写明时间段和口径。数字对不上或者口径不同的，先在旁边写清楚各自数的是什么。最后划掉所有写不出第二栏的项，看剩下的成果还有几项，再决定下一份总结里这些事项怎么写。",

  idea: "艾奇逊用两个原因解释中国革命：人口增加，土地不堪负担；西方思想输入，激起骚动。毛泽东的办法是把这个原因放到别的案例里试：美国的独立战争、中国历代的改朝换代、俄国的二月革命和十月革命、蒙古，有的人口过剩根本不成立，革命照样发生。他再把“西方的影响”拆成渠道和原因两层，说引起反抗的是“帝国主义的侵略”，不是思想本身。",
  why: "这篇评论写于一九四九年九月十六日，是批评白皮书和艾奇逊信件的最后一篇。他先引艾奇逊的话：中国人口在十八、十九两个世纪里增加了一倍，土地受到不堪负担的压力，国民政府的窘况很大程度上因为没有让中国有足够的东西吃。他说在不明事理的人看来，很有点像，然后连发几问：“革命的发生是由于人口太多的缘故吗？”古今中外的革命都是由于人口太多吗？他列的案例是：美国独立战争起于英国人的压迫和剥削，不是美国人口过剩；中国历次推翻封建朝廷，起于朝廷压迫剥削；俄国是土地多过人口很远，仍然有二月革命和十月革命；蒙古地广人稀，革命也早已发生。\n\n他还看出这个解释隐含的结论：如果原因是人口太多，那中国是毫无出路的，革命不革命都不得了，只有靠美国的面粉。这个希望艾奇逊没有说出来，是美国新闻记者经常透露的。第二个原因也是同一种处理：艾奇逊说西方的新观念输入中国，引起了骚动和不安，毛泽东把过程分成三步，帝国主义侵略，造就洋奴和反抗者两类人，反抗者里出了革命，结论是“帝国主义的侵略引起了反抗”；他还说，任何思想要起作用，要有客观存在的需要，要联系实际，要被人民群众所掌握。\n\n这个方法真正要求的是：一个解释摆出来，先问它在别的案例里是否同样成立，尤其要找那种原因没有出现、结果却出现了的案例；再问这个解释接受了以后，留下什么出路，谁给这出路。",
  failureMode: "文中点名的错误是用一个现成的单一原因，包办一场历史事件的解释，并且这个原因恰好指向解释者想要的结论。毛泽东说艾奇逊的历史知识等于零，这话是评论的修辞，具体到论证，用的是列案例这件事：把同一个原因放进其他案例，它就不成立。\n\n在今天的工程团队里，它的样子是：事故复盘的根因一栏写流量翻倍，结论是加机器；没有人去看，去年流量翻倍的那两次为什么没出事，上个月流量只有平时一半的那次为什么出了事。或者人手不足被写成每一次延期的原因，结论永远是申请编制，没有人去对照别的团队用同样的人手交付了什么。",
  worked: "这篇评论里最容易被忘掉的是，毛泽东自己给的替代答案也是一句话。他说“中国人口众多是一件极大的好事”，“再增加多少倍人口也完全有办法”，“这办法就是生产”，还说根据“革命加生产”即能解决吃饭问题的真理；上海等处的失业问题，即吃饭问题，在人民政府下只消几年工夫，就可以像华北、东北等处一样完全地解决。\n\n这个判断遇到的记录，有三位研究者的估计。杨继绳的《墓碑》估计一九五八年至一九六二年全国非正常死亡约三千六百万人；冯客（Frank Dikötter）的《毛泽东的大饥荒》估计同期至少四千五百万人；曹树基的研究估计一九五九年至一九六一年为三千二百五十万人。时段和方法不同，学界对具体数字也有争论，这里只记三个数的范围，不把它们合成一个数，也不在这里判定数字谁对。这三个数字衡量的是死亡，不是产量，不能直接拿来检验生产这一条；要读的只是时间上的距离：三个估计的时段，都落在这篇评论发表之后的十几年里，而评论宣告的是几年内解决，评论对哪些因素会改变这个结果没有讲。\n\n评论里选来做反例的蒙古，在《毛泽东选集》的注释里有交代：一九二一年至一九二四年外蒙古的人民革命，是蒙古人民革命党领导的，注释写明是在苏俄的支持和帮助下，驱逐日本帝国主义所支持的白俄军队、推翻封建统治、脱离当时的北洋政府。拿它来证明革命不需要人口过剩，是成立的；拿它当一个没有外部因素的对照组，注释本身不支持。这个方法能证明一个原因不是必要的，不能证明另一个原因是充分的。",
  experiment: "挑一份你们团队最近的事故复盘或延期复盘，把写在根因一栏的那一句话抄下来。然后做两件事：第一，去找过去半年里同一个原因出现、结果却没有出现的两个案例，比如流量同样翻倍却没出事；第二，找结果出现、原因却不在的一个案例，比如低流量时的同类故障。每个案例各写一行：日期、原因在不在、结果在不在。如果两类案例都找得到，把根因那一句改写成它在什么条件下才会引起这个结果。最后问一句：按这条根因，唯一的出路是什么，谁来提供。",
  reflection: "你团队里哪一条常用的根因，只要换成别的案例去试，就会立刻不成立？",

  title: "序言“已经过时了”，就重写一篇，并交代为什么",
  source: "《中国农村的社会主义高潮》的序言（一九五五年九月、十二月），第五卷",
  idea: "毛泽东给一本农村材料汇编写了两篇序言。十二月的第二篇开头就说，九月写好的那篇过了三个月，已经过时了，“只好重新写一篇”，然后交代：书编了两次，材料从一百二十一篇改成一百七十六篇，中间发生的根本变化是什么，编者的按语怎样同原编者的按语区分。一份文件的结论跟着事实变了，就把变了什么写出来，不悄悄改。",
  why: "这本书先叫《怎样办农业生产合作社》，公开出版时改名《中国农村的社会主义高潮》。九月二十五日的序言一，是要回答党内对农业合作化速度的分歧：他说有些人看到冬季发展、春季反冒进的循环，春季的反冒进甚至是成批地强迫解散已经建成的合作社，引起干部和农民不满。他的判断是，出乱子的地方都是党委没有好好去指导，这本材料书的作用，是让消极的人积极起来，让不知道怎么办合作社的人找到办法。\n\n十二月二十七日的序言二，先交代为什么重写：这本书编辑了两次，第一次在九月，收集一百二十一篇材料，印成样本，发给参加一九五五年十月四日至十一日党的七届六中全会（扩大）的各省、市、自治区党委和地委的负责同志，请他们提意见；他们认为要补充，会后大多数省、市、自治区送来补充材料，其中许多反映下半年的情况。于是从原来的一百二十一篇里删去三十篇，留九十一篇，再从新材料里选八十五篇，共一百七十六篇，约九十万字。材料只在文字上作修改，不易看懂的名词加注解，又按问题性质作了分类索引；批判错误思想的按语署“本书编者”，同原来刊物编者的按语区分开，还说明按语是九月和十二月两次写的，语调有差别。\n\n序言二说，问题不只在材料，而在一九五五年下半年中国的情况起了根本的变化：他写的数字是，一亿一千万农户中，到十二月下旬已有百分之六十以上、七千多万户加入半社会主义的合作社；他七月三十一日的报告里提到的是一千六百九十万户。结论随之改写，他说只需要一九五六年一个年头，就可以基本完成半社会主义合作化。这个方法真正要求的是：文件有日期，数字有日期，事实变了就改结论，并把变的部分、增删的材料和署名的区分写在明处，让读者知道眼前这一版同上一版差在哪里。",
  failureMode: "文中针对的是思想落在情况后面：他说现在的问题，是经过努力本来可以做到的事情，却有很多人认为做不到，“人们的思想必须适应已经变化了的情况”。他同时划了反方向的界线：不可以无根据地胡思乱想，不可以超越客观情况所许可的条件去计划自己的行动。\n\n在今天的工程团队里，它的样子是：半年前写的容量评估，数字到现在没人更新，却仍被当成立项依据；设计文档在评审之后又改了三次，页首仍写着第一次评审的日期；一份迁移进度表，旧版本的结论被新数字推翻了，却没有人说明，读的人只知道有两个互相矛盾的版本。",
  worked: "序言写成之后的几个月，数字确实在动。据中国共产党新闻网转载的新华网材料《农业合作化运动》，一九五五年四月合作社发展到六十七万个；七月，经过整顿，巩固下来的是六十五万个；六月中旬政治局批准了到一九五六年发展到一百万个社的计划，不久毛泽东从南方考察回来，主张修改计划、加速发展，农村工作部部长邓子恢不赞成，毛泽东认为他思想右倾；七月三十一日毛泽东作《关于农业合作化问题》的报告，十月四日至十一日开七届六中全会，会后三个月左右基本实现了农业合作化。同一页写到，一九五六年底，参加合作社的农户占总农户的百分之九十六点三，其中参加高级社的占百分之八十七点八（该页把前一个数写作“参加初级社”，从数字关系看，前者应当包含后者，这里按官方统计的通行写法改正）。序言二预测的是一九五六年一年内基本完成半社会主义合作化、一九五九年或一九六〇年基本完成向全社会主义的转变，记录里的进度比这个预测还快。\n\n序言本身也有对不上记录的地方。序言一把一九五五年春季的收缩叫作反冒进，认为出乱子是党委没有指导；同一页党史材料却记载，中央在一九五五年初发现了强迫命令、违反自愿互利原则的现象，一月十日发出《关于整顿和巩固农业合作社的通知》，要求停止发展、在少数地区收缩，三月上旬毛泽东自己提出了“停、缩、发”的方针。这两件是同一时期的事，序言没有交代它们的关系。\n\n序言二说明了删去三十篇材料之后留下九十一篇，却没有说删去的标准，也没有说被删去的是哪一类材料。这是一份把编辑过程写明的序言，还留着一处没有写明的地方。",
  experiment: "挑你们团队里一份写了超过一个季度、仍在被引用的文档：容量评估、迁移计划或设计文档。先在页首写三行：成文日期；当时依据的三个关键数字；这三个数字现在是多少。凡是变了的，重新推一遍受影响的结论，把旧结论保留在下面并标明作废，新结论写在上面，并写明是哪个数字的变化导致它改变。然后在文档里区分两种声音：原文是什么，你现在加的批注是什么，用不同的署名或标签。把改过的版本发给原来引用它的两个人，问他们哪个决定会因此变。",

  title: "“欠债是要还的”：自我批评要列到条目，原因要同后果相称",
  source: "《文汇报的资产阶级方向应当批判》（一九五七年七月一日），第五卷",
  idea: "这篇社论评的是一家报纸六月十四日写的检讨。毛泽东检验它的办法有三条：原因的大小同后果是否相称，检讨有没有替错误辩护，有没有把错在哪里一项项列出来、一项项更正。他的结论是“根本上没有作自我批评”，并拿另一家报纸一发现错误就更正的做法作对照。这里只取这套检验检讨的标准，社论对报纸性质和人物的政治判断不在这篇讨论的范围内。",
  why: "这是毛泽东为《人民日报》写的社论，发表于一九五七年七月一日，距本报编辑部六月十四日发表《文汇报在一个时间内的资产阶级方向》已两个多星期。文汇报在六月十四日作了检讨，说自己片面地错误地理解了党的鸣放政策，头脑中还残存着资产阶级办报思想。社论对这篇检讨逐点回应：它承认犯了一些错误，作自我批评是好的，但检讨在替自己的错误作了辩护，所以不够，这个不够带着根本性质。\n\n他的第一条批评是原因同后果不相称。报纸的方向改成了他所说的资产阶级的方向，替他所说的右派做了几个月的喉舌，检讨却只说是“残存着一点资产阶级思想，够用吗？”他要求把“残存着”改成“充满着”。他把这叫作“个别性的前提得到了一个普遍性的结论”，是文汇报的逻辑。第二条是没有条目：文汇报至今不准备批判自己大量报道过的违反事实的新闻、大量刊发的言论和大量采用过的编排，三类各是一笔账。第三条是对照：新民报已经作了比较认真的自我批判，它一发现自己犯了错误，就认真更正，所以社论说“欠债是要还的”，文汇报该做的是“以新民报为师”。\n\n这套检验真正要求的是三件事：检讨里写出来的原因，要大到足以解释它造成的后果；要把做过的事情一项项列出来，每一项都有对应的更正；检讨不要同时替做法辩护。还要求检讨本身可以被检查：条目具体到日期和篇目，别人才有办法逐项对照。",

  worked: "这篇文章本身经过了大幅修改。据中共中央文献研究室和中央档案馆主办的《党的文献》一九八九年第一期沙鹤闻的文章，它最早发表在国民革命军第二军司令部主办的《革命》半月刊第四期（一九二五年十二月一日），一九二六年又在《中国农民》和《中国青年》上刊出，各有改动；抗日战争和解放战争时期各地出版的毛泽东选集、文集都没有收它。一九五〇年编《毛泽东选集》时，毛泽东以《中国青年》本为底本作了多次修改，一九五一年十月作为开卷篇出版。同期刊出的初版附有一张各阶级人数表，结论是真正的朋友三万万九千五百万，真正的敌人一百万，可友可敌的中间派四百万；选集版删去了这张表。初版称工业无产阶级为民族革命运动的“主力”，选集版作“领导力量”。中产阶级右翼将倒向帝国主义的判断，初版里已经有了。\n\n后来，这套按经济地位划分的做法变成了档案上的成分和家庭出身，并且传给了下一代。一九六七年一月十八日，遇罗克在《中学文革报》第一期发表《出身论》，批驳当时流行的对联“老子英雄儿好汉，老子反动儿混蛋”，文中写道，出身不好的青年一般不能参军，不能做机要工作。他一九六八年一月被捕，一九七〇年三月五日在北京工人体育场的宣判大会之后被处决（王锐《谁签署了遇罗克的处决令》）。一九七九年一月十一日，中共中央决定：地主富农家庭出身的社员，本人成份一律定为社员，今后在入学、招工、参军、入团、入党和分配工作方面“不得歧视”；这些社员的子女，家庭出身也一律改为社员。同年十一月二十一日，北京市中级人民法院再审宣告遇罗克无罪。\n\n文章说的是态度随处境而变，中间阶级必定分化；成分制度做的，是把一次划分的结果固定下来，传给子女，再传给孙辈。",

  why: "这是毛泽东在一九三七年五月二日至十四日延安召开的中共全国代表会议上的结论，是对五月三日那份报告的讨论所作的回应。西安事变之后、国民党三中全会之后，党的判断是争取和平的阶段已经过去，新任务是巩固和平，并且要用争取民主去巩固它。会上有同志不同意：他们说日本后退了，南京更动摇了，民族矛盾下降，国内矛盾上升。照这个估计，情况就回到了旧阶段，新阶段和新任务无从谈起。\n\n毛泽东的回答分两步。第一步是区分：和平实现与和平巩固是两件事，和平没有巩固，是因为日本帝国主义和亲日派还在；但西安事变之后和平的实现是多方面促成的，不是蒋介石一个人能够决定或者推翻的。第二步是指出对方的毛病：这些同志观察时局不从根本之点出发，而从佐藤外交、苏州审判、压制罢工、东北军东调、杨虎城出洋这些“局部和一时的现象”出发，画出了一幅暗淡的图。他的判断是国民党已经开始转变，但并没有彻底转变，旧毒要靠长期的斗争和努力才能清除。他还提醒，对方破坏的方式变了，从军事政策转向了政治政策，从硬的变成了软的。\n\n结论不是退回去，而是前进：把“巩固和平”“争取民主”“实现抗战”并成三位一体的口号，因为否认新阶段，就是把自己“停顿在旧位置”。这个方法真正要求的是两件事：承认已经达成的，并且清楚它还没有稳固；眼前的坏消息先分清是局部的还是根本的，再决定要不要改变阶段的判断。",
  failureMode: "文中批评的是两头。一头是被一时的现象牵着走：几件不顺的事凑在一起，就得出情况回到了旧阶段的结论。另一头是对达成抱有不切实际的期望：有些人在西安事变时主张杀蒋，和平刚实现，又发现苏州审判一类的事，就惊诧地问为什么蒋介石又这样干。两头都忘了，和平的实现和巩固是两件事。\n\n在今天的工程团队里，它的样子是：一次迁移的第一阶段刚刚上线，灰度期出了几个告警，有人就说这条路走不通，要回到旧架构重开旧目标；也有人宣布迁移成功，季度计划里还留着旧目标，而把上线变成默认路径、删除旧系统这个下一步没人立项，几个月后旧路径又悄悄长了回来。",
  worked: "这次判断的第二部分，几乎立刻被时局检验。毛泽东在结论里说佐藤外交是大战的准备，大战在我们面前；七月七日卢沟桥事变，全面抗战爆发。他在一九四五年的《论联合政府》里回顾这一段：从卢沟桥事变到一九三八年十月武汉失守，国民党政府的对日作战比较努力，全国人民和共产党人希望它趁此时机厉行民主改革，“可是，这个希望是落空了”，国民党政府仍旧不给各党派平等地位，许多爱国政治犯没有释放，也没有建立举国一致的民主的联合政府。也就是说，按他两年后的叙述，争取民主的任务在那个时期没有完成。\n\n和平不巩固的另一面，也在他的叙述里。同一篇《论联合政府》列举了此后国民党方面发出的几道所谓政令军令：一九三九年的《限制异党活动办法》，一九四一年的解散新四军和退至旧黄河以北，一九四三年的所谓解散中国共产党，一九四四年的限期取消十个师以外的全部军队。以上是毛泽东在报告里的说法。\n\n选集的注释给出了结论里提到的几件事的结局：苏州审判的两次开庭在六月，七个救国会领袖到七月才获释；张学良把蒋介石送回南京后即被长期囚禁；杨虎城一九三七年四月被迫辞职，六月出国“考察”，十一月回国后不久被蒋介石逮捕，长期监禁到一九四九年。就是说，被认作局部和一时的现象中，有些确实延续了很久。",
  experiment: "选一件你团队最近宣布完成的事：一次迁移的某个阶段，一轮事故整改，或者一项新标准的推行。写下两栏：达成的是什么（有证据）；怎样才算巩固（旧路径已删除，默认值已强制，值班手册已更新，没有人还能走回头路）。再把最近三个让你怀疑它的坏消息列出来，逐个判断它是局部和一时的，还是来自根本的条件。最后写下新阶段的一句口号，并把旧目标从计划里划掉。",

  idea: "一个联合体说自己代表谁、为谁决定，是它的名；谁真正能参与决定、决定怎样作出，是它的实。名是联合，实却由一方说了算，就是名实不副。要按名去检查实，缺什么补什么。",
  why: "这是毛泽东一九四〇年一月九日在陕甘宁边区文化协会第一次代表大会上的讲演，原题是《新民主主义的政治与新民主主义的文化》。其中谈政治的一部分，先把国家分成三种：资产阶级专政的共和国，无产阶级专政的共和国，和几个革命阶级联合专政的共和国。他认为殖民地半殖民地国家的革命，在一定历史时期里只能采取第三种；在当时的中国，这种形式就是抗日统一战线的形式。\n\n接着他区分了国体和政体。国体指的是“社会各阶级在国家中的地位”，他的说法是各革命阶级联合专政；政体指政权组织的形式，他主张从乡到全国的人民代表大会系统，由各级代表大会选举政府，选举不分男女、信仰、财产、教育，实行民主集中制。他还指出，资产阶级总是隐瞒自己的阶级地位，用“国民”这个名词达到一个阶级专政的实际。他引用一九二四年国民党一大宣言里的话，民权要为一般平民所共有，“非少数人所得而私”，并说这个精神必须表现在政府和军队的组成里；没有真正的民主制度，达不到这个目的，就叫做“政体和国体不相适应”。\n\n他的判断是：当时的中国“虽有中华民国之名，尚无中华民国之实”，今天的工作就是“循名责实”。同一段里还有一个观察：抗战许久，除了共产党领导下的根据地，大部分地区的国家民主化工作基本上还没有着手。这个方法真正要求的是两步：先把联合体的名说清楚，再拿它的决策方式去对照，差在哪里，就补哪里。",
  failureMode: "文中批评的是名实不符的两种形态。一种是旧民主主义共和国，用“国民”这样的统称掩盖实际由哪个阶级掌权；另一种是国民党，自己通过的宣言说权利为平民所共有，十六年来却违背这个声明。\n\n在今天的工程组织里，它的样子是：一个内部平台的章程写着所有使用方共同拥有路线图，而实际的排期在平台团队的季度规划会上定下来，使用方只是被征求意见；或者一个架构评审委员会名义上代表全体团队，实际上由两个人拍板。章程没有错，错的是没有人拿最近十个决定去对照章程。",
  worked: "《论政策》在一九四〇年十二月提出政权实行三三制，边区的参议会是这个原则的一次实践。据党史文章的叙述，一九四一年十一月第二届参议会上，陕北的士绅李鼎铭和另外几名参议员（叙述说是十一人联名）提出精兵简政的议案，并获得通过。这些来自党史叙述，原始名单没有查到，各方所占的比例也没有核实。\n\n名实相符的检验，在后来的年代也落在了党自己身上。一九八一年的《关于建国以来党的若干历史问题的决议》认为，对极少数资产阶级右派分子的进攻进行反击是必要的，但一九五七年的反右派斗争被严重地扩大化了，把一批知识分子、爱国人士和党内干部错划为右派分子。这是党自己对一个案例的评价，决议没有就联合体的整体结构作结论。",

  why: "一九四五年八月二十八日毛泽东到重庆，谈了四十三天，十月十日双方签订了《会谈纪要》，也就是《双十协定》。十月十七日他回到延安，在干部会上作了这个报告。他先说收获：国民党承认了和平团结的方针和人民的某些民主权利，承认避免内战；又说没有达成协议的是解放区和军队这两个问题。已经达成的协议，他说，还只是纸上的东西，“纸上的东西并不等于现实的东西”。他举的证据是，谈判的同时，国民党直接进攻解放区的军队已经有八十万人。\n\n报告的核心是回答一个问题：既然对方靠不住，为什么还要谈，对方又为什么肯签？他承认在重庆有不少人说蒋介石是骗人的，谈不出结果，并说这些话有理由，积十八年的经验也确实如此，但这只是事情的一个方面。另一个方面是三个因素：解放区的强大，大后方人民反对内战，国际形势。有了这三条，蒋介石“不能不讲讲现实主义”。他的方法是看问题要从各方面去看，不能只从单方面看。\n\n由此得出的做法是谈和打并行：谈判有谈判的“针锋相对”，不去是针锋相对，去也是；去了，击破了对方说共产党不要和平的说法，国民党再动手，就在全国和全世界面前输了理。但他同时说，人家打来了，就打，“打是为了争取和平”，不给进攻的人以很大的打击，和平是不会来的。这个方法真正要求的是两件事：把签字的协议当成还没有完成的东西，并且弄清楚对方是被哪些力量推着签的，这些力量你能不能保持。",

  why: "这是新华日报记者提问、毛泽东回答的谈话，时间在一九三九年九月一日，苏德互不侵犯协定订立之后的第九天。他判断国际局势进入新阶段，欧洲的全面战争迫在眉睫；对中国，他说战略退却阶段已经完结，战略相持阶段已经到来，也就是准备反攻的阶段。\n\n紧接着是这一节的核心：“正面相持和敌后相持是成反比例的”，“正面相持的局面出现，敌后斗争的局面就要紧张”。所以武汉失守后敌人在沦陷区的大规模“扫荡”，不但会继续，还会加紧；再加上敌人的主要政策是“以华制华”的政治进攻和“以战养战”的经济侵略，英国的东方政策是远东慕尼黑，这就“极大地加重了中国大部投降和内部分裂的危险”。他还估计，日本对中国正面大规模军事进攻的可能性“或者不很大了”。\n\n由此他提出三条立场：坚持抗战，坚持团结，坚持进步，并把全国的总任务定为“准备反攻”：一方面支持正面的防御、援助敌后的战争，另一方面实行改革，积聚力量。这个方法真正要求的是三件事：阶段一变，先问压力往哪里去；资源按新的压力分布重新配置；给这个阶段一个一句话的总任务。",
  failureMode: "它针对的是把阶段的转换当成压力的消失。正面稳住了，就松一口气，不去想对方会换一个地方施压；或者把全部力量继续压在已经稳住的那一处。文中的提醒是，坚持抗战的任务仍然非常严重，“千万不要丝毫大意”。\n\n在今天的工程团队里，它的样子是：主服务经过半年治理，告警终于降下来，团队就把人抽去做新功能。又过半年，事故集中出现在边缘：没人认领的批处理任务、内部工具、迁移留下的兼容层。治理主路径的时候，变更和负载并没有消失，它们去走了最便宜的另一条路。",
  worked: "谈话说的这次转移，选集自己的注释有记录。注释七说，从一九三九年起，日本对蒋介石的军队停止大规模的战略进攻，着重从政治上鼓励他反共，这是以华制华政策的实施；注释九说，一九三八年十月武汉失守后，日本逐渐集中主要兵力进犯敌后抗日根据地。这是选集的编注。一九四五年的《论联合政府》还给出了比例：到一九四三年，侵华日军的百分之六十四和伪军的百分之九十五为解放区军民所抗击。这是毛泽东在报告里的说法，这里没有查到独立的核算。\n\n谈话里“或者不很大了”的判断，半个月之内就遇到了反例。据抗日战争纪念网的《第一次长沙会战》条，一九三九年九月十四日日军第一〇六师团在赣北发动牵制攻势，九月十八日湘北主战场打响，日方集中十万兵力三路进攻长沙，十月十四日双方恢复战前态势。伤亡数字各说各的：日方声称国军死伤被俘四万八千余人，自己的伤亡为三千六百人；中方称日军死伤三万余人，第九战区伤亡四万余人。一九四四年的打通大陆交通线作战，则是《论联合政府》自己承认的：几个月内，河南、湖南、广西、广东等省的广大区域沦于敌手。\n\n所以反比例更接近一个倾向，不是定律：压力可以转移，对手也保留着回到正面的选择。谈话里的判断自己带着“或者”两个字；它给出的是该往哪里多看一眼，没有说每一边各要留多少人。",
  experiment: "挑一个你们刚刚治理稳住的系统或指标：告警量降下来了，一次迁移完成了，容量缓冲补上了。写下：压力原来从哪几条路进来，现在堵住了哪几条；如果压力总量没有变，它最便宜的下一条路是什么，列三条（批处理，旁路接入，人工操作都算）；每条路找一个今天就能看到的信号，一个指标或一类日志。再给这个阶段起一个一句话的总任务名，然后拿半天，只盯那条最便宜的路。",
  reflection: "你们最近稳住的那个指标，压力是真的消失了，还是转移到了你没有在看的地方？",

{

  idea: "一个机制失败过，再办的时候，要把失败读成关于基础的信息：上一次错在桌上坐了谁、凭什么有权作决定。名字可以保留，基础要换掉，并且说明换掉的是什么。",
  why: "这是毛泽东在中国人民政治协商会议第一届全体会议上的开幕词。会议有六百多位代表，代表各民主党派、人民团体、人民解放军、各地区、各民族和国外华侨，他说这指明会议是“一个全国人民大团结的会议”。\n\n会议为什么叫政治协商会议，他的解释是：三年以前曾和国民党一道开过一次，结果被国民党及其帮凶破坏了。他的结论是，和对方一道“是不能解决任何有利于人民的任务的”，“即使勉强地做了决议也是无益的”，因为“一待时机成熟他们就要撕毁一切决议”，那次会议的唯一收获是教育了人民。现在的会议则“在完全新的基础之上召开”，具有代表全国人民的性质，并宣布自己执行全国人民代表大会的职权；议程里排着组织法、政府组织法、共同纲领、选举、国旗国徽、国都和年号。\n\n名字沿用，基础换了：桌上换了一批人，会议的权力来自自己的宣告。这个方法真正要求的是两步：先说清上一次是在基础的哪一处失败的，再写明新的基础换掉了哪一处。",

  worked: "开幕词所说的新基础，《共同纲领》第十三条把它写成了条文：在普选的全国人民代表大会召开以前，由政协全体会议执行全国人民代表大会的职权，制定中央人民政府组织法，选举中央人民政府委员会。纲领于九月二十九日在会上通过。这个机构从一开始就带着自己的期限：一九五四年九月二十日，第一届全国人民代表大会通过了宪法。\n\n构成方面，据《人民周刊》刊载的赵连稳《人民政协是怎样创立的》，李维汉主持的筹备工作同民主人士反复协商，把新政协代表定为六百六十二人，其中特邀代表七十五人，与开幕词所说的六百多位相符；《共同纲领》由周恩来主持起草，一九四八年十月底有了初稿，九月会议前毛泽东和周恩来又多次修改，该文称毛泽东改了二百多处，周恩来一百多处，前后至少十稿。这些数字出自这一篇文章，这里没有查到另一来源核对。\n\n这个构成保证了决议不会被会内的一方撕毁，代价是对手不在场：开幕词把不在场的一方说成没有妥协余地的敌人，在场各方之间有什么分歧、怎样处理，开幕词没有说，这里也没有查到会议记录。",
  experiment: "找一个你们办过又沉寂的跨团队机制：评审会、周会或者迁移工作组。写三行：它上一次是在哪一点上失效的（决议没人执行，席位不对，还是没有授权）；如果重开，要换掉的基础是哪一项（成员、授权、期限、违约后果）；它的到期条件是什么，也就是什么时候由哪个正式机制接替它。三行写不出来，先不要重开。",
  reflection: "你们那个沉寂的机制，上一次是在基础的哪一处失效的？重开时要换掉的，是同一处吗？",
  recall: {

  worked: "毛泽东点名的几个骂人的人，有一个可以查到结果。据抗日战争纪念网所载龙云的生平，他一九五七年被划为右派，一九五八年被撤销国防委员会副主席职务，他随后作了检讨；一九八〇年中共中央为他平反（摘帽的时间这里没有核实）。龙云是《论十大关系》里点名的几个人之一，距那次讲话约一年。\n\n同一段讲话里的另一句观察，也有记录。毛泽东说民主党派“说《共同纲领》好得不得了，不想搞社会主义类型的宪法，但是宪法起草出来了，他们又全都举手赞成”。一九五四年九月二十日，第一届全国人民代表大会第一次会议通过宪法，据云南人大网和新浪新闻的报道，一千一百九十七名代表无记名投票，一千一百九十七票赞成。一致的票数既可以读成共识，也可以读成他所说的又反对又不反对的一种表现；票数本身分不出这两种读法。\n\n这条回应规则一年多之后有了一个程序版本。一九五七年六月八日的党内指示《组织力量反击右派分子的猖狂进攻》（选集第五卷）要求，到了适当时机，组织党团员分组开会，“分别那些是建设性的批评，加以接受，并改正自己的错误缺点；那些是破坏性批评，予以反驳”。判断的是党团员的小组，标准换成了建设性和破坏性，而不再是有理和无理。",

  why: "这是一九五三年三月毛泽东为中共中央起草的党内指示。这一年是第一个五年计划的头一年，中央在一月五日刚刚发出反对官僚主义、命令主义和违法乱纪的指示。在农村，区、乡干部和农民积极分子被任务、会议、集训、表格和兼职压着，一个乡有几十种委员会。\n\n指示的论证从一句自我检讨开始：中央以前就其中一些问题发过指示，问题不但没有解决，反而越来越严重。原因有两个：没有把整个问题系统地提出来；更重要的是，没有在中央、大区、省市、专区、县这五级领导机关里反对分散主义和官僚主义。区、乡的“五多”是从上面产生的：各级党、政、民组织的工作部门各自独立地向下分派任务、随便召集下级开会、滥发表格、随便要报告；还有一部分是战争和土改时期的制度，条件变了，没有改。所以办法也在上面：由县以上党委和政府的主要负责人按照实际可行的情况统一规定，有些由中央统一规定；过去需要、现在不需要的制度一律改掉；各中央局仿照西北局，派检查组下去看一两个区、乡的实际情况。\n\n最后一节划了一条界限。中国的农业基本上还是用旧式工具的分散小农经济，和苏联用机器的集体农业大不相同，所以除国营农场外，还不可能施行统一的有计划的生产，不能对农民施以过多的干涉，只能用价格政策和必要可行的经济、政治工作去指导。超过这个限度的“计划”和“任务”必然行不通，而且会引起农民反对。",
  failureMode: "它针对的是分散主义和官僚主义：上级的每一个部门都向下要东西，每一项单看都有理由，没有人负责它们加在一起的总量，最底下的一层被压得没法做本职工作。文件还点出另一个来源：为过去的情况设立的制度，情况变了以后没有人去撤。\n\n在今天的平台团队里，它的样子是：安全、合规、降本、可靠性各自向同一个服务团队要季度报告、填表格、开评审会，每一个流程都有负责人，没有人负责它们的总和；三年前为一次事故加上的人工审批，事故的根因早已修好，审批还在。",
  worked: "文件对农业计划划下的限度，同一年就被越过了。据澎湃新闻刊载的时青昊的党史文章，一九五三年十月十六日中共中央作出《关于实行粮食的计划收购与计划供应的决议》，十一月十九日政务院下达命令，粮食由国家计划收购、计划供应，也就是统购统销。此后是一九五五年的合作化高潮和一九五八年的人民公社化。\n\n到了大跃进，从上面压下来的已经不只是表格和会议。据共产党员网的党史文章，大跃进期间干部中出现共产风、浮夸风、强迫命令风、生产瞎指挥风和生活特殊化风，一九六〇年十一月中共中央发出《关于彻底纠正“五风”问题的指示》。一九八一年的历史决议把高指标、瞎指挥、浮夸风和“共产风”列为大跃进中左倾错误的主要标志，并把责任放在领导上。\n\n六十六年后，同一类负担又被单独发文处理。二〇一九年三月，中共中央办公厅发出《关于解决形式主义突出问题为基层减负的通知》，把这一年定为“基层减负年”，要求发给县级以下的文件和召开的会议减少百分之三十到五十，专门要求解决督查检查考核过多过频、过度留痕的问题，并规定不得用在工作群里上传截图、录制视频来代替对实际工作的评价。",
  experiment: "列出过去一个季度里从团队外部压到你团队的所有周期性要求：报告、表格、评审会、审批、检查。每一项旁边写上来源和它当初要解决的问题，再标出哪些问题已经不存在了。把这张单子交给能同时管到这些来源的那一级负责人，请他统一决定哪些保留、哪些合并、哪些取消，而不是由你逐项去谈。",
  reflection: "压在你团队身上的周期性要求里，哪一项最初要解决的问题已经不存在了？",

    a: "因为它基本上不是从区、乡产生的，而是从上面产生的：县以上各级党政民各部门各自向下派任务、开会、要报告，还有一些是战争和土改时期留下来、没有改掉的制度。所以要由上级主要负责人统一规定，并废止过时的制度。\n\n容易忘的是开头那句自我检讨：中央以前就其中一些问题发过指示，问题却越来越严重，因为没有把它当作一个系统问题提出来，也没有在上面改。"

  idea: "胜利以后，对胜利者的主要威胁不再是武力，而是捧场。不曾被拿枪的敌人征服过的人，可能在糖衣裹着的炮弹面前打败仗，所以要在这种情况出现之前预防。",
  why: "这一段在七届二中全会报告的最后一节，紧接着胜利只是第一步的论断。毛泽东的推理是：敌人的武力征服不了共产党，这一点已经得到证明；可是因为胜利，人民会感谢，资产阶级也会出来捧场，而捧场可能征服队伍中的意志薄弱者。\n\n他点出的受害者很具体：不曾被拿枪的敌人征服过、在这些敌人面前不愧英雄称号的人。考验换了形式。战争中的危险看得见，由整个队伍一起抵抗；胜利以后的危险以感谢、礼物、恭维和舒适的样子出现，一个一个地作用在个人身上，而最不设防的，恰恰是经受过最难考验的人。\n\n他给的处方是预防：现在就向党内讲明白，保持艰苦奋斗的作风，用批评和自我批评去掉不良作风。报告把危险的来源放在党外，即资产阶级的捧场。",
  failureMode: "它针对的是胜利者对自己的信任：经受过最难考验的人，以为自己不会被更容易的东西打败。报告认为，被捧场征服的是队伍里的“意志薄弱者”，而他们事先往往并不知道自己是。\n\n在今天的工程组织里，它的样子是：一次大迁移之后，平台团队成了各方争取的对象，供应商请吃饭、送大会门票，业务方先夸一句专业再请求插队；资深工程师在评审里得到的赞同越来越多、追问越来越少，自己却没有察觉评审已经不再检验他的方案。",
  worked: "报告说的危险，三年后有了第一个大案。据新华网二〇一七年转载共产党员网的文章，在三反运动中，曾任天津地委书记、时任石家庄市委副书记的刘青山，和曾任天津地区专员、时任天津地委书记的张子善，贪污、盗用机场建筑款、治河款、救灾粮和民工粮等，违法金额合旧币一百七十一亿六千多万元（折合新币一百七十一万六千多元），一九五二年二月十日在保定被枪决。有人为他们求情，毛泽东的回答是：正因为他们地位高、功劳大、影响大，才要下决心处决，这样才可能挽救二十个、二百个、两千个、两万个犯有不同程度错误的干部。\n\n报告把危险的来源放在资产阶级的捧场上。十一年后，据共产党员网的党史文章，中共中央在一九六〇年十一月发出《关于彻底纠正“五风”问题的指示》，五风之一是干部自己的生活特殊化风；按一九八一年历史决议的说法，那正是国民经济发生严重困难的年份。",
  experiment: "列出过去半年里你因为职位或资历得到的方便：评审里没人追问就通过的方案、供应商的邀请、别的团队请你帮忙插队的请求。每一项旁边写上：如果是刚入职的工程师提出同样的东西，会得到同样的对待吗？挑出一项，下一次按普通流程走，并请评审的人像对待新人的方案那样追问。",
  reflection: "你最近一次没有被追问就通过的决定，是因为它对，还是因为提出它的人是你？",
  recall: {
    q: "七届二中全会报告认为，全国胜利以后最可能打败共产党人的是什么？为什么偏偏是那些不曾被武力征服的人？",
    a: "是资产阶级的捧场，即“糖衣裹着的炮弹”。拿枪的敌人已经证明征服不了他们，而捧场在胜利以后一个一个地作用在个人身上，正好落在经受过最难考验、因而不设防的人身上。\n\n容易忘的是报告的处方是事前预防。后来的三反运动用的是严厉的事后惩处：处决刘青山、张子善，是为了警戒更多的人。"

  id: "power-heavy-industry-and-agriculture",
  track: "power", level: "v5",
  title: "重工业的账，要“几十年后算总账”",
  source: "《论十大关系》（一九五六年四月二十五日），第五卷",
  idea: "重工业仍然是建设的重点，这一点不动；但粮食和生活资料不够，连工人都养不活，重工业也就无从谈起。所以重工业和轻工业、农业的关系，要当作一个投资比例来调整：重工业为主，农业和轻工业的比例加重一点。理由是在当时的条件下，农业和轻工业积累得更多更快，回过头来又能让重工业发展得更多更快。",
  why: "这是毛泽东一九五六年四月二十五日在中央政治局扩大会议上的讲话。讲话的材料来自此前几个月政治局听取的三十四个部门的汇报，涉及工业、农业、运输业、商业、财政等；他把看到的问题归成十个关系，说它们都围绕一个基本方针，即把国内外一切积极因素调动起来。排在第一位的就是重工业和轻工业、农业的关系。他拿苏联和一些东欧国家作对照，说它们片面发展重工业，市场上货物不够，货币不稳定，而中国在这个关系上没有犯原则性的错误，眼下要做的是把投资比例再调整一次。一九八一年的《关于建国以来党的若干历史问题的决议》给出的数字是，一九五三年到一九五六年全国工业总产值平均每年递增百分之十九点六，农业总产值平均每年递增百分之四点八。\n\n论证分三步。第一步是依赖关系：“决不可以因此忽视生活资料尤其是粮食的生产”，没有足够的粮食和日用品，首先养不活工人。第二步是算账：重工业也能积累，但在现有的经济条件下农业和轻工业积累得更多更快，加重它们的投资，一可以更好地供给人民生活，二可以更快地增加资金积累，反过来支持重工业。第三步是他提的一个问题，“你对发展重工业究竟是真想还是假想”：假想的人会压低农业和轻工业的投资，真想的人会去扶持它们。两种办法摆在一起，前一种办法会使重工业发展得少些、慢些，基础不稳，“几十年后算总账是划不来的”。\n\n这一节真正要求的是：重点和依赖要同时成立。说一个部门是重点，不等于其余部门可以压到最低，要问它的基础从哪里来；账也不能只算当年，要把两个部门之间的投入产出关系摊开，按长期的总账算。",
  failureMode: "文中点名的错误是别人的：“片面地注重重工业，忽视农业和轻工业”，结果市场货物不够，货币不稳。它的另一种说法是借“重点”的名义，把基础部门的投入压到刚好不垮。\n\n在今天的工程团队里，它的样子是：平台团队把全部容量放在新能力上，比如多租户隔离的重写或新的调度器，而把流水线稳定性、升级工具和值班手册当作可以先缓一缓的杂务。两个季度之后，重写的进度被每周的升级事故和不稳定的流水线吃掉，因为做重写的人，正是被这些事故叫醒的人。",
  worked: "讲话当时只在党内高层传达。邱巍在《光明日报》（二〇一二年五月二日）发表的《〈论十大关系〉传播史考略》说，毛泽东本人的注意力和观点不久就有变化，讲话长期没有公开；一九七六年十二月二十六日《人民日报》全文发表，随后收入一九七七年四月出版的《毛泽东选集》第五卷。同一篇文章还引了一九七八年十一届三中全会公报的话：一九五六年报告中提出的基本方针，既是经济规律的客观反映，也是社会政治安定的重要保证，“仍然保持着重要的指导意义”。\n\n一九五八年的做法和这一节的次序相反。一九八一年的《决议》写道，党的八大二次会议通过的总路线“其缺点是忽视了客观的经济规律”，随后“没有经过认真的调查研究和试点，就在总路线提出后轻率地发动了‘大跃进’运动”。据澎湃新闻上一篇整理大炼钢铁史料的图文，一九五八年八月十七日通过了《全党全民为生产一千零七十万吨钢而奋斗》的决议，目标是把钢产量翻一番；到八月底全国产钢只有四百五十万吨；《人民日报》社论称钢铁工业是“整个工业的纲”，要“其他部门停车让路，让钢铁元帅升帐”。《决议》认为，一九五九年到一九六一年国民经济发生严重困难，主要由于“大跃进”和“反右倾”的错误，加上自然灾害和苏联政府撕毁合同。\n\n饥荒的死亡人数没有定论。据一篇书评概括，依据人口普查数据的研究多得出一千五百万到三千二百万；曹树基在二〇〇五年得出三千二百五十万；冯客（Frank Dikötter）在《毛泽东的大饥荒》（二〇一〇年）中主张至少四千五百万，并说此前的估计偏低。纠正从一九六〇年冬开始，方针是“调整、巩固、充实、提高”；《决议》还写到，毛泽东在领导纠正“大跃进”错误时，主张以农轻重为序安排国民经济计划，这个次序和一九五六年的讲话是一致的。",
  experiment: "把你的平台团队过去四个季度的工程时间，分成两类：一类是新能力，一类是让现有能力保持可用的工作（流水线、升级、值班、文档）。再找出三个最慢的重复步骤，比如一次集群升级、一次租户接入、一次从测试环境推到生产的滚动发布，估计它们每月各吃掉多少人时。然后写下两种办法的预测：照现在的比例继续，和把下个季度新能力容量的一成挪去消除最大的那一个步骤；各预测哪个季度交付会更快，并写明一个可以在季度末核对的数字。到时候拿实际数字回来对账。",

  title: "行动之前，先把政策讲明白",
  source: "《关于工商业政策》（一九四八年二月二十七日），第四卷",
  idea: "每一个行动都在实行某种政策，不是正确的，就是错误的，不是自觉的，就是盲目的。所以政策要在行动之前向执行的人和被影响的人讲明白，否则他们会脱离政策的领导而盲目行动。上级的责任还有一半：方针发出以后，要靠密切联系随时掌握进程、随时纠正，不要等半年一年以后才开总结会算总账。",
  why: "这是毛泽东一九四八年二月二十七日为中共中央起草的党内指示，选集题注这样写。它针对的是一个具体的错误：某些地方的党组织违反中央的工商业政策，把农村里斗争地主富农、消灭封建势力的办法搬到城市，造成严重破坏工商业的现象。指示要求区分两件事，消灭地主富农的封建剥削，和保护地主富农经营的工商业；还要区分两种方针，发展生产、繁荣经济、公私兼顾、劳资两利的方针，和只顾眼前救济、实际上破坏工商业的所谓拥护工人福利的方针。\n\n指示的第四条把这件具体的事升成一般的道理。毛泽东说，现在敌人已经彻底孤立了，但“敌人的孤立并不就等于我们的胜利”；在战争、整党、土地改革、工商业和镇压反革命五个政策问题里，任何一个问题犯了原则的错误，不加改正，就会失败。接着是论证：政策是革命政党一切实际行动的出发点，并且表现于行动的过程和归宿；所谓经验，就是实行政策的过程和归宿；政策是否正确，要在实践也就是经验中检验。人们的实践没有不同这种或那种政策相联系的，因此“在每一行动之前，必须向党员和群众讲明我们按情况规定的政策”。\n\n第三条讲的是领导方法，同第四条互相补充。方针定了、指示发了，中央局和分局要同下面用电报、电话、口头谈话和报纸密切联系，随时交流经验、纠正错误，因为随时纠正损失较少，等数月、半年以至一年之后才总的纠正，损失太大。这一条真正要求的是两件事：行动之前，政策要写明白并让执行的人知道；行动之中，要有一条能随时把偏差报上来、随时纠正的渠道。",
  failureMode: "文中点名的错误是把一个领域里行得通的办法原样搬到另一个领域，同时没有人把政策向下面讲清楚，下面只能凭自己的理解行动。指示还点出另一种偏差，只看到眼前片面的福利，忘记了长远的利益。\n\n在今天的工程团队里，它的样子是：开发环境里有一套清理闲置资源的办法，闲置几天就回收，效果很好；有人把同一套办法接到生产租户上，没有写明哪些租户不适用、回收前通知谁、出了错怎么恢复。执行的人按自己理解的规则做，每个人理解的不一样；到季度复盘时才发现一批租户的数据已经没了，这时纠正的代价已经很大。",
  worked: "这份指示是纠偏文件，错误发生在它前面。据选集收入的《纠正土地改革宣传中的“左”倾错误》（一九四八年二月十一日，同样是毛泽东为中央起草的党内指示），当时新华社和各地报纸发表了许多过左的通讯，其中一条是，对于某些解放区在工商业和工人运动方针上存在的严重的“左”的倾向，“或者加以赞扬，或者熟视无睹”。也就是说，错误政策不仅在下面执行，还在被宣传。\n\n毛泽东自己后来讲了一个具体的地区。一九四八年四月一日他在晋绥干部会议上说，晋绥的党组织纠正了运动中的三个“左”的偏向，第二个是对待工商业的：土地改革中侵犯了属于地主富农所有的工商业，清查经济反革命时超出了应当清查的范围，税收政策里又打击了工商业；纠正之后，工商业才“获得了恢复和发展的可能”。这是毛泽东本人对一个地区的概括，数字和个案没有给出，其他地区的情况这里没有查证，各家史学研究对这一阶段的评价也不相同，这里不作判断。\n\n这个方法没有写明的是：下面的党委怎样在不违反上级的前提下对政策提出异议，上面发现政策本身有问题时怎样复核。指示要求的联系渠道是自上而下的检查，而不是双向的核对。五个政策问题里，哪一个算原则性的错误，由中央判定；这篇文章给出的是执行中纠偏的要求，不是判定的程序。",
  experiment: "找出你团队最近三次在压力下做出的决定，例如要不要回滚、要不要叫醒别的团队、要不要冻结变更。对每一次写下：这个决定实际依据的规则是什么，这条规则写在哪里，下一个遇到同样情况的人会不会作出同样的决定。如果三次依据的规则互相冲突，或者没有写下来，选一条写成半页纸，说明什么情况下适用、什么情况下不适用、谁来决定。下一次生产变更开始之前，把这半页纸发给所有会执行或被影响的人，并在变更的第一个检查点（不是结束之后）约好一次核对：执行中有没有遇到这半页纸没有覆盖的情况。",
  reflection: "上一次你的团队做了一件事、事后才发现各人依据的规则并不一样，那条规则本来应该在行动前写在哪里？",
  recall: {
    q: "《关于工商业政策》为什么说政策必须在每一行动之前向党员和群众讲明？上级在方针发出之后还要做什么？",
    a: "因为一个革命政党的任何行动都是实行政策，不是正确的，就是错误的，不是自觉的，就是盲目的；不事先讲明，党员和群众就会脱离政策的领导而盲目行动，执行错误的政策。上级还要靠电报、电话、口头谈话和报纸同下面密切联系，随时掌握进程、随时纠正，不要等数月、半年以至一年后才总的纠正。\n\n容易忘的是开头的那句：敌人孤立并不等于胜利，五个政策问题中任何一个犯了原则错误又不改正，就会失败。"
  },
  deepDive: "这是我团队最近三次在压力下做出的决定，以及我所知道的当时依据的规则。帮我找出这些规则之间在哪里冲突、哪一条根本没有写下来，并帮我起草一份行动之前发给执行者的半页政策，写明它在什么情况下不适用。"
},
{
  id: "learn-what-you-do-not-know",
