     is exercising judgement, which is the point - Nomogram refuses to let the
     author grade their own evidence, and the cheatsheet must not be the hole
     in that.

     Where it does not, there is nothing to derive from, so the row is opt-in:
     `cheatsheet: true`, and an entry appears if the author wrote it a line.
     That is editorial and the page says so rather than dressing a selection up
     as a filter. */
  var CHEAT = SITE.cheatsheet || null;
  var CHEAT_VERDICTS = CHEAT && CHEAT.verdicts ? CHEAT.verdicts : null;
  var HAS_CHEAT = !!CHEAT && (!CHEAT_VERDICTS || HAS_EVIDENCE);

  function onCheatsheet(l) {
    return CHEAT_VERDICTS ? CHEAT_VERDICTS.indexOf(l.replication) !== -1 : !!l.cheat;
  }

  /* Expiry retires a claim the author already knew would rot. This retires the
     author's confidence in a claim they thought was settled, which is where
     checking actually finds the failures. Nothing leaves the sequence: a stale
     citation is still true more often than not, it is just no longer checked. */
  var REVERIFY_DAYS = SITE.reverifyDays || 0;

  function stale(l) {
    if (!REVERIFY_DAYS || !l.verifiedOn) return false;
    return shift(l.verifiedOn, REVERIFY_DAYS) < today();
  }

  function evidenceHTML(l) {
    var h = '<div class="evidence" data-rep="' + esc(l.replication) + '"' +
      (stale(l) ? ' data-stale="1"' : '') + '>';
    h += '<p class="block__label">' + esc(COPY.labelEvidence || 'The evidence') + '</p>';
    h += '<p class="evidence__cite" data-speak="evidence">' + esc(l.evidence) + '</p>';
    if (l.interval && typeof l.interval.lo === 'number' && typeof l.interval.hi === 'number') {
      h += '<p class="evidence__interval">' +
        esc(say('intervalRange', l.interval.measure, l.interval.lo, l.interval.hi)) + '</p>';
    }
    h += '<p class="evidence__meta">';
    h += '<span class="rep-chip">' + esc(REP_LABEL[l.replication] || l.replication) + '</span>';
    if (l.replication === 'statute' && l.asAt) {
      h += '<span class="evidence__asat">' + esc(say('evidenceAsAt', shortDate(l.asAt))) + '</span>';
    }
    if (stale(l)) {
      /* A string staleNote is the undated form of this line, and is shown
         exactly as written. */
      h += '<span class="evidence__stale">' + esc(typeof COPY.staleNote === 'string' && COPY.staleNote ||
        say('staleNote', shortDate(l.verifiedOn))) + '</span>';
    }
    h += '</p></div>';
    return h;
  }

  var REP_LABEL = {
    replicated:  COPY.repReplicated || 'Replicated',
    single:      COPY.repSingle || 'One study, never repeated',
    contested:   COPY.repContested || 'Contested',
    failed:      COPY.repFailed || 'Failed to replicate',
    overclaimed: COPY.repOverclaimed || 'Real, but overclaimed',
    craft:       COPY.repCraft || 'Craft, no trial behind it',
    statute:     COPY.repStatute || 'Statute'
  };

  /* ------------------------------------------------------------------------
     THE POLICY DIAL

     This one function decides the whole rhythm of retention: how long an
     entry rests before it comes back, and how badly a miss sets you back.
     Leitner boxes, intervals from the site config.

     Three alternatives, if the default does not fit how you learn:

       Forgiving   — a miss drops you one box instead of all the way to 1.
                     Kinder, but genuinely-forgotten material resurfaces
                     slowly, which is the failure mode you care about.
       Aggressive  — intervals 1/2/4/8/16. Roughly twice the review load for
                     noticeably better recall. Costs you minutes a day.
       Long tail   — add a sixth box at 90 days so solid material still gets
                     checked twice a year rather than disappearing.

     Change the arithmetic here and the whole schedule follows; nothing else
     in the engine hardcodes an interval.
     --------------------------------------------------------------------- */
  var INTERVALS = SITE.intervals || [1, 3, 7, 16, 35];
  var MAX_BOX = INTERVALS.length;

  function reviewInterval(box, grade) {
    var next;
    if (grade === 'miss') next = 1;
    else if (grade === 'close') next = box;
    else next = Math.min(box + 1, MAX_BOX);
    return { box: next, days: INTERVALS[next - 1] };
  }

  /* --- Dates: local, not UTC. A logbook runs on the reader's clock. ------- */
  function dayKey(d) {
    var y = d.getFullYear();
    var m = String(d.getMonth() + 1).padStart(2, '0');
    var day = String(d.getDate()).padStart(2, '0');
    return y + '-' + m + '-' + day;
  }
  function today() { return dayKey(new Date()); }
  function parseKey(k) {
    var p = String(k).split('-');
    return new Date(+p[0], +p[1] - 1, +p[2], 12, 0, 0);
  }
  function shift(k, days) {
    var d = parseKey(k);
    d.setDate(d.getDate() + days);
    return dayKey(d);
  }
  function daysBetween(a, b) {
    return Math.round((parseKey(b) - parseKey(a)) / 86400000);
  }
  /* A page that declares its language has its dates written in it. One that
     does not leaves the choice to the reader's browser. */
  var LOCALE = SITE.lang || undefined;
  function longDate(k) {
    return parseKey(k).toLocaleDateString(LOCALE, { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
  }
  function shortDate(k) {
    return parseKey(k).toLocaleDateString(LOCALE, { day: 'numeric', month: 'short', year: 'numeric' });
  }

  /* --- Expiry -------------------------------------------------------------
     Fast-moving material carries a date past which it is more likely to be
     folklore than fact. A lapsed entry leaves the sequence and the review
     deck rather than being quietly reinforced forever. It stays visible in
     the library, marked, because knowing what went stale is itself useful. */
  function lapsed(l) {
    return HAS_EXPIRY && !!l.expires && daysBetween(l.expires, today()) > 0;
  }
  function live() {
    return LESSONS.filter(function (l) { return !lapsed(l); });
  }

  /* --- Sequence -----------------------------------------------------------
     Round-robin across tracks, rotating the track order each cycle. Because
     each track file is ordered foundational first, the opening cycle serves
     the most foundational entry from every track before anything advanced. */
  function buildSequence() {
    var pool = live();
    var byTrack = TRACKS.map(function (t) {
      return pool.filter(function (l) { return l.track === t.id; });
    });
    var out = [];
    var cycle = 0;
    var guard = pool.length + TRACKS.length + 1;
    while (out.length < pool.length && cycle < guard) {
      for (var i = 0; i < TRACKS.length; i++) {
        var bucket = byTrack[(i + cycle) % TRACKS.length];
        var lesson = bucket[cycle];
        if (lesson) out.push(lesson.id);
      }
      cycle++;
    }
    // Anything a ragged track length left behind.
    pool.forEach(function (l) { if (out.indexOf(l.id) === -1) out.push(l.id); });
    return out;
  }

  var SEQ = buildSequence();
  var BY_ID = {};
  LESSONS.forEach(function (l) { BY_ID[l.id] = l; });

  /* --- State ------------------------------------------------------------- */
  var blank = {
    v: 1,
    startedOn: today(),
    log: {},
    days: {},
    streak: { count: 0, best: 0, lastOn: null },
    forecasts: {},
    profile: {},
    theme: null,
    autoplay: false
  };

  /* Everything here depends on being able to write locally. If a browser or
     an embedding blocks storage, say so plainly rather than losing a month of
     someone's notes without telling them. */
  function storageWorks() {
    try {
      localStorage.setItem(KEY + '.probe', '1');
      localStorage.removeItem(KEY + '.probe');
      return true;
    } catch (e) {
      return false;
    }
  }

  var STORAGE_OK = storageWorks();
  var state = load();

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return clone(blank);
      var parsed = JSON.parse(raw);
      if (!parsed || parsed.v !== 1) return clone(blank);
      // Merge onto the blank so a partial or older record still boots.
      var s = clone(blank);
      Object.keys(parsed).forEach(function (k) { s[k] = parsed[k]; });
      s.log = parsed.log || {};
      s.days = parsed.days || {};
      s.streak = parsed.streak || clone(blank.streak);
      s.forecasts = parsed.forecasts || {};
      return s;
    } catch (e) {
      return clone(blank);
    }
  }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); }
    catch (e) { toast(COPY.toastSaveFailed || 'Could not save — browser storage is full or blocked'); }
  }

  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  function record(id) {
    if (!state.log[id]) {
      state.log[id] = { box: 0, due: null, note: '', reviews: [], completedOn: null, gate: null, attempts: [] };
    }
    var r = state.log[id];
    if (!r.reviews) r.reviews = [];
    if (!r.attempts) r.attempts = [];
    return r;
  }

  /* --- The daily pick ----------------------------------------------------
     Written once per date, then read back. Stable across reloads, honest as
     a history, and a missed day pushes the corpus forward instead of
     silently dropping an entry. You cannot refresh to skip ahead, which is
     the property that makes a commitment mean anything. */
  function lessonForToday() {
    var t = today();
    if (state.days[t] && BY_ID[state.days[t]]) return BY_ID[state.days[t]];
    if (!SEQ.length) return null;

    var served = {};
    Object.keys(state.days).forEach(function (d) { served[state.days[d]] = true; });

    var pick = null;
    for (var i = 0; i < SEQ.length; i++) {
      if (!served[SEQ[i]]) { pick = SEQ[i]; break; }
    }
    // Corpus exhausted: begin a second pass from the top of the sequence.
    if (!pick) pick = SEQ[Object.keys(state.days).length % SEQ.length];

    state.days[t] = pick;
    save();
    return BY_ID[pick];
  }

  function entryNumber(id) {
    var n = SEQ.indexOf(id);
    return n === -1 ? '—' : String(n + 1).padStart(3, '0');
  }

  function dueList() {
    if (!HAS_REVIEW) return [];
    var t = today();
    return Object.keys(state.log)
      .filter(function (id) {
        var r = state.log[id];
        return BY_ID[id] && !lapsed(BY_ID[id]) && r.due && r.box > 0 && daysBetween(r.due, t) >= 0;
      })
      .sort(function (a, b) {
        var d = state.log[a].box - state.log[b].box;   // shakiest first
        return d !== 0 ? d : (state.log[a].due < state.log[b].due ? -1 : 1);
      });
  }

  function completedToday() {
    var t = today();
    var l = state.days[t];
    return !!(l && state.log[l] && state.log[l].completedOn === t);
  }

  function markComplete(id) {
    var t = today();
    var r = record(id);
    if (r.completedOn === t) return;
    r.completedOn = t;
    if (HAS_REVIEW && r.box === 0) { r.box = 1; r.due = shift(t, INTERVALS[0]); }

    var s = state.streak;
    if (s.lastOn === t) { /* already counted */ }
    else if (s.lastOn && daysBetween(s.lastOn, t) === 1) s.count += 1;
    else s.count = 1;
    s.lastOn = t;
    s.best = Math.max(s.best || 0, s.count);

    save();
  }

  function gradeCard(id, grade) {
    var r = record(id);
    var next = reviewInterval(r.box || 1, grade);
    r.box = next.box;
    r.due = shift(today(), next.days);
    r.reviews.push({ on: today(), grade: grade });
    save();
  }

  /* --- The gate -----------------------------------------------------------
     A commitment device. Where a site sets one, the body of the entry stays
     withheld until something has been written, and what was written is
     frozen the moment the answer appears. An editable answer is not a
     commitment, it is a draft, and the whole value is in being able to read
     back what you actually thought before you knew. */
  /* ------------------------------------------------------------------------
     THE ARITHMETIC GATE

     A text gate proves you thought about the question. This proves you did the
     sum. The site holds a small profile of your own figures, each entry
     declares its answer as an expression over them, and the entry stays shut
     until you have written your own number to be compared against.

     What it keeps is the signed gap rather than a right/wrong mark, because
     the useful quantity is which direction you are consistently wrong in. A
     reader who is reliably optimistic about their own tax position learns more
     from that than from a score. */

  var PROFILE = SITE.profile || null;
  var PROFILE_FIELDS = (PROFILE && PROFILE.fields) || [];

  function byId(id) {
    for (var i = 0; i < LESSONS.length; i++) {
      if (LESSONS[i].id === id) return LESSONS[i];
    }
    return null;
  }

  function profileField(id) {
    for (var i = 0; i < PROFILE_FIELDS.length; i++) {
      if (PROFILE_FIELDS[i].id === id) return PROFILE_FIELDS[i];
    }
    return null;
  }

  /* Which declared fields this entry's sum actually needs. Asking for the whole
     profile up front is how a settings page gets abandoned; asking for the two
     numbers today's entry needs is a question someone will answer. */
  /* No try/catch. build.js compiles every expression and checks every
     identifier against the declared profile, so a throw here means the page was
     assembled wrong - and a gate that silently asks for nothing would render as
     an entry that opens itself, which is the one outcome worth crashing over. */
  function computeNeeds(l) {
    if (!l || !l.compute || !l.compute.expr) return [];
    return EXPR.names(l.compute.expr).filter(function (n) { return !!profileField(n); });
  }

  function computeMissing(l) {
    return computeNeeds(l).filter(function (n) {
      return typeof state.profile[n] !== 'number';
    });
  }

  /* null rather than NaN when a field is missing or a divisor is zero. NaN
     would render as "NaN" and read as an answer. */
  function computeAnswer(l) {
    return EXPR.run(l.compute.expr, state.profile);
  }

  function saveProfile(vals) {
    var wrote = false;
    for (var k in vals) {
      var f = profileField(k);
      if (!f) continue;
      var n = parseFloat(vals[k]);
      if (!isFinite(n)) continue;
      if (typeof f.min === 'number' && n < f.min) continue;
      if (typeof f.max === 'number' && n > f.max) continue;
      state.profile[k] = n;
      wrote = true;
    }
    if (wrote) save();
    return wrote;
  }

  function commitCompute(id, raw) {
    var l = byId(id);
    if (!l || !l.compute) return false;
    if (computeMissing(l).length) return false;
    var r = record(id);
    if (r.compute) return false;                 // first number stands
    var yours = parseFloat(raw);
    if (!isFinite(yours)) return false;
    var computed = computeAnswer(l);
    if (computed === null) return false;
    r.compute = {
      yours: yours,
      computed: computed,
      gap: yours - computed,
      on: today()
    };
    save();
    return true;
  }

  function gapStats() {
    var gaps = [];
    for (var id in state.log) {
      var c = state.log[id].compute;
      if (c && typeof c.gap === 'number') gaps.push(c.gap);
    }
    if (!gaps.length) return { n: 0, medianAbs: null, signedMean: null };
    var abs = gaps.map(Math.abs).sort(function (a, b) { return a - b; });
    var mid = Math.floor(abs.length / 2);
    var medianAbs = abs.length % 2 ? abs[mid] : (abs[mid - 1] + abs[mid]) / 2;
    var mean = gaps.reduce(function (a, b) { return a + b; }, 0) / gaps.length;
    return { n: gaps.length, medianAbs: medianAbs, signedMean: mean };
  }

  function computeDone(id) {
    var r = state.log[id];
    return !!(r && r.compute);
  }

  function gateOpen(id) {
    var l = byId(id);
    if (l && l.compute) return computeDone(id);
    if (!GATE) return true;
    var r = state.log[id];
    return !!(r && r.gate && r.gate.answer);
  }

  function unlockGate(id, text) {
    var r = record(id);
    if (r.gate && r.gate.answer) return false;
    var body = String(text || '').trim();
    if (body.length < (GATE.minChars || 1)) return false;
    r.gate = { answer: body, on: today() };
    save();
    return true;
  }

  /* --- Copy that carries a value ------------------------------------------
     A string with a count, a date or a name inside it is a function in
     SITE.copy rather than a string, because where the value sits and what a
     plural looks like belong to the site's language, not to the engine. Each
     function here is the engine's own English, used whenever a site supplies
     no function of its own.

     Two return markup rather than text: computeResult and cheatCount are
     handed their numbers already escaped and set in bold, and what they return
     goes into the page as it is. Everything else is escaped where it is used. */
  var ENGLISH = {
    // The evidence block, shared with the cheatsheet
    intervalRange: function (measure, lo, hi) { return (measure || 'interval') + ' ' + lo + ' to ' + hi; },
    evidenceAsAt: function (date) { return 'as at ' + date; },
    staleNote: function (date) { return 'not re-checked since ' + date; },

    // Today
    dueCount: function (n) { return n + ' due'; },
    dueCards: function (n) { return n + (n === 1 ? ' card is' : ' cards are') + ' due from earlier entries.'; },

    // The entry
    readTime: function (minutes) { return minutes + ' min'; },
    lapsedOn: function (date) { return 'lapsed ' + date; },
    gateCommittedOn: function (date) { return 'Committed ' + date; },
    computeResult: function (yours, computed) { return 'You wrote ' + yours + '. It computes to ' + computed + '.'; },
    computeUnder: function (gap) { return gap + ' under.'; },
    computeOver: function (gap) { return gap + ' over.'; },
    fcRecorded: function (pct, date) { return 'Recorded at ' + pct + '%, resolves ' + date + '.'; },
    loggedFor: function (date) { return 'Logged for ' + date; },
    nextUp: function (date) { return 'In the review deck. Next up ' + date + '.'; },

    // The deep-dive prompt
    promptEntry: function (title) { return 'ENTRY: ' + title; },
    promptIdea: function (idea) { return 'IDEA: ' + idea; },
    promptMechanism: function (why) { return 'MECHANISM: ' + why; },
    promptFailure: function (failureMode) { return 'FAILURE MODE: ' + failureMode; },
    promptCommitted: function (date, answer) { return 'WHAT I COMMITTED TO BEFORE READING IT (' + date + '): ' + answer; },
    promptSituation: function (text) { return 'MY SITUATION: ' + text; },

    // Review, and the meta line on journal and attempt notes
    reviewNextOn: function (date) { return 'Nothing due. The next card comes back on ' + date + '.'; },
    deckCleared: function (n) { return 'Deck cleared — ' + n + (n === 1 ? ' card' : ' cards') + ' done. That is the part that compounds.'; },
    entryMeta: function (number) { return 'Entry ' + number; },
    cardBox: function (box) { return 'box ' + box; },

    // The library
    libraryNote: function (n) { return 'All ' + n + ' entries, in the order they will arrive. Read ahead freely — logging stays a daily act.'; },
    pipReview: function (box) { return 'in review, box ' + box; },

    // The cheatsheet
    cheatCount: function (shown, total) { return shown + ' of ' + total + ' entries.'; },
    cheatOther: function (n, reason) { return 'The other ' + n + ' ' + reason; },

    // Forecasts
    fcBrierOver: function (n) { return 'over ' + n + ' resolved'; },
    fcReady: function (n) { return n + ' ready to resolve'; },
    fcHappenedPct: function (pct) { return pct + '% happened'; },
    calibrationDot: function (lo, hi, hits, n) { return lo + '-' + hi + '%: ' + hits + ' of ' + n + ' happened'; },
    fcSaidOn: function (pct, date) { return 'You said ' + pct + '% on ' + date; },
    fcResolvesOn: function (date) { return 'resolves ' + date; },
    fcSaidOutcome: function (pct, outcome) { return 'Said ' + pct + '%, ' + (outcome ? 'it happened' : 'it did not'); },
    fcSquaredError: function (error) { return 'squared error ' + error; },

    // Progress, and restoring a backup
    statStreakUnit: function (n) { return (n === 1 ? 'day' : 'days') + ' running'; },
    statLoggedUnit: function (total) { return 'of ' + total; },
    statRecalled: function (pct) { return pct + '% recalled'; },
    statAttemptsUnit: function (n) { return 'across ' + n + ' entries'; },
    statDaysUnit: function (date) { return 'since ' + date; },
    statSums: function (n) { return 'across ' + n + (n === 1 ? ' sum' : ' sums'); },
    toastImportBad: function (name) { return 'That is not a ' + name + ' backup — check you pasted the whole file'; }
  };

  function say(key) {
    var f = typeof COPY[key] === 'function' ? COPY[key] : ENGLISH[key];
    return f.apply(null, Array.prototype.slice.call(arguments, 1));
  }

  /* --- Small helpers ----------------------------------------------------- */
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function paras(text) {
    return String(text).split(/\n\n+/).map(function (p) { return '<p>' + esc(p) + '</p>'; }).join('');
  }
  function trackName(id) {
    var t = TRACKS.filter(function (x) { return x.id === id; })[0];
    return t ? t.name : id;
  }
  /* Chinese and Japanese characters, full-width punctuation included. Both are
     written without spaces between words. Korean is not here: it spaces its
     words the way English does. */
  var CJK = /[\u2E80-\u9FFF\uF900-\uFAFF\uFE30-\uFE4F\uFF00-\uFFEF]/;

  /* Words where spaces separate them, at 200 a minute, and Chinese or Japanese
     characters, which have no spaces to count, at 300 a minute; a mixed entry
     is the sum of both. Cutting the text at each such character leaves the
     rest to be counted as words, and the number of cuts is the number of
     characters. */
  function readMinutes(l) {
    var text = [l.idea, l.why, l.failureMode, l.experiment, l.reflection].join(' ');
    var rest = text.split(CJK);
    var words = rest.join(' ').split(/\s+/).length;
    return Math.max(3, Math.round(words / 200 + (rest.length - 1) / 300) + 2);
  }

  /* The space the engine sets between two pieces of copy, or none. Chinese and
     Japanese set no space between characters, so where both sides of a join
     are theirs, punctuation such as 。《》“” included, a space here would be a
     gap the text never had. Markup is looked through, because some copy opens
     or closes with a tag. A join with English on either side keeps its space. */
  function spaceBetween(left, right) {
    var ends = [
      String(left).replace(/<[^>]*>/g, '').slice(-1),
      String(right).replace(/<[^>]*>/g, '').charAt(0)
    ];
    return ends.every(function (c) { return CJK.test(c) || c === '“' || c === '”'; }) ? '' : ' ';
  }
  function el(id) { return document.getElementById(id); }

  var toastTimer = null;
  function toast(msg) {
    var t = el('toast');
    if (!t) return;
    t.textContent = msg;
    t.setAttribute('data-open', 'true');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.removeAttribute('data-open'); }, 2600);
  }

  /* --- Deep-dive prompt --------------------------------------------------
     Folds whatever was written into the prompt, so the conversation arrives
     already about a real situation rather than about the abstraction. This
     is the only bridge from a page with no model in it to one that has. */
  function deepDivePrompt(l) {
    var r = state.log[l.id] || {};
    var note = (r.note || '').trim();
    var lines = [
      PROMPT.intro || 'I am working through a daily entry and want to apply it to my actual situation.',
      '',
      say('promptEntry', l.title),
      say('promptIdea', l.idea),
      say('promptMechanism', l.why),
      say('promptFailure', l.failureMode)
    ];
    if (GATE && r.gate && r.gate.answer) {
      lines.push('', say('promptCommitted', shortDate(r.gate.on), r.gate.answer));
    }
    lines.push('', l.deepDive, '',
      say('promptSituation', note || COPY.promptNoNote ||
        '(I have not written this up yet — ask me for it first, one question at a time.)'),
      '',
      PROMPT.closing || 'Push back on my reasoning rather than agreeing with me. Name the thing I am avoiding. Be concrete and brief.');
    return lines.join('\n');
  }

  function copyText(text, okMsg) {
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      toast(ok ? okMsg : COPY.toastCopyBlocked || 'Copy blocked here — select the text below instead');
      return ok;
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast(okMsg); }, fallback);
    } else {
      fallback();
    }
  }

  /* ==========================================================================
     Forecast book

     The only self-scoring mechanic here. A site that cannot detect its own
     inertness will feel productive while teaching nothing; a Brier score
     going sideways for three months is the one signal that cannot be
     rationalised. Brier is the mean squared error of a probability against
     a binary outcome, so lower is better and an always-fifty-percent
     forecaster scores 0.25.
     ========================================================================== */
  function forecastList() {
    return Object.keys(state.forecasts).map(function (fid) {
      var f = state.forecasts[fid];
      return { id: fid, q: f.q, p: f.p, made: f.made, resolvesOn: f.resolvesOn, outcome: f.outcome, resolvedOn: f.resolvedOn, source: f.source || null };
    }).sort(function (a, b) { return a.resolvesOn < b.resolvesOn ? -1 : 1; });
  }

  function brier() {
    var resolved = forecastList().filter(function (f) { return f.outcome === 0 || f.outcome === 1; });
    if (!resolved.length) return null;
    var sum = resolved.reduce(function (n, f) { return n + Math.pow(f.p - f.outcome, 2); }, 0);
    return { score: sum / resolved.length, n: resolved.length };
  }

  function calibration() {
    var buckets = [];
    for (var i = 0; i < 10; i++) buckets.push({ lo: i / 10, hi: (i + 1) / 10, n: 0, hits: 0 });
    forecastList().forEach(function (f) {
      if (f.outcome !== 0 && f.outcome !== 1) return;
      var idx = Math.min(9, Math.floor(f.p * 10));
      buckets[idx].n += 1;
      buckets[idx].hits += f.outcome;
    });
    return buckets;
  }

  function addForecast(q, p, resolvesOn, source) {
    var fid = 'f' + Date.now().toString(36) + Math.floor(Math.random() * 1e4).toString(36);
    state.forecasts[fid] = {
      q: q, p: p, made: today(), resolvesOn: resolvesOn,
      outcome: null, resolvedOn: null, source: source || null
    };
    save();
    return fid;
  }

  function resolveForecast(fid, outcome) {
    var f = state.forecasts[fid];
    if (!f || f.outcome === 0 || f.outcome === 1) return;
    f.outcome = outcome;
    f.resolvedOn = today();
    save();
  }

  function calibrationSVG() {
    var b = calibration();
    var W = 320, H = 200, PAD = 34;
    var x = function (v) { return PAD + v * (W - PAD - 8); };
    var y = function (v) { return H - PAD - v * (H - PAD - 12); };

    var s = '<svg class="cal" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' +
      esc(COPY.calibrationLabel || 'Calibration: predicted probability against observed frequency') + '">';
    s += '<line class="cal__ref" x1="' + x(0) + '" y1="' + y(0) + '" x2="' + x(1) + '" y2="' + y(1) + '"/>';
    s += '<line class="cal__axis" x1="' + x(0) + '" y1="' + y(0) + '" x2="' + x(1) + '" y2="' + y(0) + '"/>';
    s += '<line class="cal__axis" x1="' + x(0) + '" y1="' + y(0) + '" x2="' + x(0) + '" y2="' + y(1) + '"/>';

    b.forEach(function (bk) {
      if (!bk.n) return;
      var mid = (bk.lo + bk.hi) / 2;
      var obs = bk.hits / bk.n;
      var r = Math.min(9, 3 + Math.sqrt(bk.n) * 1.6);
      s += '<circle class="cal__dot" cx="' + x(mid).toFixed(1) + '" cy="' + y(obs).toFixed(1) +
        '" r="' + r.toFixed(1) + '"><title>' +
        esc(say('calibrationDot', Math.round(bk.lo * 100), Math.round(bk.hi * 100), bk.hits, bk.n)) +
        '</title></circle>';
    });

    s += '<text class="cal__t" x="' + x(0.5) + '" y="' + (H - 8) + '" text-anchor="middle">' +
      esc(COPY.calibrationX || 'you said') + '</text>';
    s += '<text class="cal__t" x="10" y="' + y(0.5) + '" text-anchor="middle" transform="rotate(-90 10 ' + y(0.5) + ')">' +
      esc(COPY.calibrationY || 'it happened') + '</text>';
    s += '</svg>';
    return s;
  }

  /* ==========================================================================
     Views
     ========================================================================== */
  var VIEWS = ['today', HAS_REVIEW ? 'review' : 'attempts', 'library'];
  if (HAS_CHEAT) VIEWS.push('cheatsheet');
  if (HAS_FORECAST) VIEWS.push('forecast');
  VIEWS.push('journal', 'progress');

  var VIEW_LABEL = {
    today: COPY.tabToday || 'Today',
    review: COPY.tabReview || 'Review',
    attempts: COPY.tabAttempts || 'Attempts',
    library: COPY.tabLibrary || 'Library',
    cheatsheet: COPY.tabCheatsheet || 'Cheatsheet',
    forecast: COPY.tabForecast || 'Forecasts',
    journal: COPY.tabJournal || 'Journal',
    progress: COPY.tabProgress || 'Progress'
  };

  var view = 'today';
  var reviewIdx = 0;
  var reviewQueue = [];
  var revealed = false;
  var libFilter = { q: '', track: null, level: null, lapsed: false };
  var libOpen = null;

  function mountShell() {
    el('wordmark').textContent = SITE.name || 'Daily';
    el('eyebrow').textContent = SITE.eyebrow || 'Logbook';
    el('spine-sub').textContent = SITE.tagline || '';
    if (SITE.name) document.title = SITE.name + (SITE.tagline ? ' - ' + SITE.tagline : '');

    var nav = el('nav');
    nav.innerHTML = VIEWS.map(function (v) {
      return '<button class="nav__item" data-view="' + v + '">' +
        '<span class="nav__key">' + esc(VIEW_LABEL[v]) + '</span>' +
        '<span class="nav__badge" id="badge-' + v + '" hidden></span></button>';
    }).join('');

    el('gauge').innerHTML = [
      ['streak', COPY.gaugeStreak || 'Streak'],
      ['logged', COPY.gaugeLogged || 'Logged'],
      ['retained', COPY.gaugeRetained || 'Retained']
    ].map(function (g) {
      return '<div class="gauge__cell"><dt>' + esc(g[1]) + '</dt><dd id="gauge-' + g[0] + '">0</dd></div>';
    }).join('');

    el('field').innerHTML = VIEWS.map(function (v) {
      return '<section class="view" id="view-' + v + '" aria-label="' + esc(VIEW_LABEL[v]) + '"' +
        (v === 'today' ? '' : ' hidden') + '></section>';
    }).join('');
  }

  function renderChrome() {
    var l = lessonForToday();
    el('stamp-num').textContent = l ? entryNumber(l.id) : '—';
    el('stamp-date').textContent = longDate(today());

    el('gauge-streak').textContent = state.streak.count || 0;
    el('gauge-logged').textContent = Object.keys(state.log).filter(function (id) {
      return state.log[id].completedOn;
    }).length;
    el('gauge-retained').textContent = HAS_REVIEW
      ? Object.keys(state.log).filter(function (id) { return state.log[id].box >= 4; }).length
      : Object.keys(state.log).reduce(function (n, id) { return n + (state.log[id].attempts || []).length; }, 0);

    if (HAS_REVIEW) {
      var due = dueList().length;
      var bR = el('badge-review');
      if (due) { bR.textContent = due; bR.hidden = false; } else { bR.hidden = true; }
    }

    var bT = el('badge-today');
    if (!completedToday()) { bT.textContent = COPY.badgeNew || 'new'; bT.hidden = false; } else { bT.hidden = true; }

    if (HAS_FORECAST) {
      var ripe = forecastList().filter(function (f) {
        return f.outcome === null && daysBetween(f.resolvesOn, today()) >= 0;
      }).length;
      var bF = el('badge-forecast');
      if (ripe) { bF.textContent = ripe; bF.hidden = false; } else { bF.hidden = true; }
    }

    Array.prototype.forEach.call(document.querySelectorAll('.nav__item'), function (b) {
      if (b.dataset.view === view) b.setAttribute('aria-current', 'page');
      else b.removeAttribute('aria-current');
    });

    var dark = document.documentElement.getAttribute('data-theme') === 'dark' ||
      (!document.documentElement.getAttribute('data-theme') &&
        window.matchMedia('(prefers-color-scheme: dark)').matches);
    el('theme-label').textContent = dark ? (COPY.themeLight || 'Daylight') : (COPY.themeDark || 'Lamplight');
  }

  /* --- Gate block -------------------------------------------------------- */
  function num(n) {
    var r = Math.round(n * 100) / 100;
    return String(r);
  }

  function computeHTML(l) {
    var missing = computeMissing(l);
    var r = state.log[l.id] || {};
    var unit = l.compute.unit ? ' ' + l.compute.unit : '';

    var h = '<div class="compute' + (r.compute ? ' compute--done' : '') + '">';
    h += '<p class="block__label">' + esc(COPY.labelCompute || 'Work it out first') + '</p>';
    // Same setup the text gate shows. Without this an entry that switched to
    // the arithmetic gate would silently drop the situation it was written for.
    if (l.gateIntro) h += '<div class="gate__intro">' + paras(l.gateIntro) + '</div>';
    h += '<p class="compute__q">' + esc(l.compute.question) + '</p>';

    if (r.compute) {
      h += '<p class="compute__result">' + say('computeResult',
        '<b>' + esc(num(r.compute.yours) + unit) + '</b>',
        '<b>' + esc(num(r.compute.computed) + unit) + '</b>') + '</p>';
      var amount = num(Math.abs(r.compute.gap)) + unit;
      h += '<p class="compute__gap" data-dir="' + (r.compute.gap < 0 ? 'under' : r.compute.gap > 0 ? 'over' : 'exact') + '">' +
        esc(r.compute.gap === 0 ? COPY.computeExact || 'Exact.'
          : r.compute.gap < 0 ? say('computeUnder', amount) : say('computeOver', amount)) +
        '</p>';
      return h + '</div>';
    }

    if (missing.length) {
      h += '<p class="compute__note">' + esc((PROFILE && PROFILE.note) ||
        'Held in this browser only, and never sent anywhere.') + '</p>';
      h += '<div class="compute__fields">';
      missing.forEach(function (id) {
        var f = profileField(id);
        h += '<label class="compute__lab" for="prof-' + esc(id) + '">' + esc(f.label) +
          (f.unit ? spaceBetween(f.label, f.unit) + '<span class="compute__unit">' + esc(f.unit) + '</span>' : '') + '</label>';
        h += '<input class="compute__input" id="prof-' + esc(id) + '" type="number" inputmode="decimal">';
      });
      h += '</div>';
      h += '<button class="btn" data-act="profile-save" data-id="' + esc(l.id) + '">' +
        esc(COPY.profileSave || 'Save and continue') + '</button>';
    } else {
      h += '<div class="compute__row">';
      h += '<input class="compute__input" id="compute-field" type="number" inputmode="decimal" ' +
        'placeholder="' + esc(COPY.computePlaceholder || 'Your number') + '">';
      h += '<button class="btn" data-act="compute-commit" data-id="' + esc(l.id) + '">' +
        esc(COPY.computeCta || 'Commit it') + '</button>';
      h += '</div>';
    }

    h += '<p class="gate__curtain">' + esc(COPY.computeCurtain ||
      'The entry opens once you have written your own number above.') + '</p>';
    return h + '</div>';
  }

  function gateHTML(l) {
    var r = state.log[l.id] || {};
    var answered = !!(r.gate && r.gate.answer);

    var h = '<div class="gate' + (answered ? ' gate--done' : '') + '">';
    h += '<p class="block__label">' + esc(GATE.label) + '</p>';

    if (l.gateIntro) h += '<div class="gate__intro">' + paras(l.gateIntro) + '</div>';
    h += '<p class="gate__prompt">' + esc(l.gatePrompt || GATE.prompt) + '</p>';

    if (answered) {
      h += '<div class="gate__locked"><p class="gate__stamp">' + esc(say('gateCommittedOn', shortDate(r.gate.on))) + '</p>';
      h += '<div class="gate__answer">' + paras(r.gate.answer) + '</div></div>';
    } else {
      if (l.fallback) {
        h += '<details class="gate__fallback"><summary>' + esc(GATE.fallbackLabel || 'Nothing of your own to hand') +
          '</summary><div class="gate__fallbacktext">' + paras(l.fallback) + '</div>' +
          '<button class="btn btn--quiet" data-act="gate-fallback" data-id="' + esc(l.id) + '">' +
          esc(COPY.gateUseFallback || 'Use this one') + '</button></details>';
      }
      h += '<textarea class="reflect__field gate__field" id="gate-field" data-id="' + esc(l.id) + '" placeholder="' +
        esc(GATE.placeholder || '') + '"></textarea>';
      h += '<div class="actions" style="border-top:0;padding-top:0">';
      h += '<button class="btn" data-act="gate-unlock" data-id="' + esc(l.id) + '">' + esc(GATE.cta || 'Commit and read on') + '</button>';
      h += '</div>';
      h += '<p class="gate__note">' + esc(GATE.note || 'Once you commit, this is frozen and the entry opens. That is the point.') + '</p>';
    }
    h += '</div>';
    return h;
  }

  /* Both halves carry the destination title. "Next" alone tells you a next
     exists; the title tells you whether it is the one you wanted, which is the
     question that sent you back to the list in the first place. */
  function pagerHTML(id) {
    var nb = libNeighbours(id);
    if (!nb.prev && !nb.next) return '';

    function side(dir, l, end) {
      if (!l) return '<span class="pager__end">' + esc(end) + '</span>';
      return '<button class="pager__btn pager__btn--' + dir + '" data-act="lib-open" data-id="' + esc(l.id) + '">' +
        '<span class="pager__dir">' + esc(dir === 'prev' ? COPY.pagerPrev || 'Previous' : COPY.pagerNext || 'Next') + '</span>' +
        '<span class="pager__title">' + esc(l.title) + '</span></button>';
    }

    return '<nav class="pager" aria-label="' + esc(COPY.pagerLabel || 'Nearby entries') + '">' +
      side('prev', nb.prev, COPY.pagerFirst || 'First entry') +
      side('next', nb.next, COPY.pagerLast || 'Last entry') +
      '</nav>';
  }

  /* --- The reader ---------------------------------------------------------
     Which marked parts of a rendered entry get spoken, as a set. Document
     order decides the sequence, so a name added here cannot reorder the read.

     Fail-closed on purpose. A block carrying no data-speak, or one whose name
     is missing from this set, is silent. A block added later therefore stays
     out of the audio until somebody decides it belongs, which is the right
     default on a page built around withholding things until the reader has
     committed to an answer of their own.

     Marked but deliberately unread: 'source' is a citation and lands as an
     interruption between the title and the idea, 'evidence' is intervals and
     verdicts that are read with the eye rather than the ear, and 'worked' and
     'reflection' are prose that could reasonably belong. All four are one word
     away from being in. */
  var SPEAK_PARTS = ['title', 'idea', 'why', 'failure', 'experiment'];

  function readerHTML(l, canAdvance) {
    var h = '<div class="reader">';
    h += '<button class="btn btn--quiet reader__btn" data-act="speak" data-id="' + esc(l.id) + '">' +
      esc(COPY.listenCta || 'Listen') + '</button>';
    h += '<button class="btn btn--quiet reader__btn" data-act="speak-stop" hidden>' +
      esc(COPY.listenStop || 'Stop') + '</button>';

    /* Library only, on exactly the reasoning that keeps the pager there: Today
       is deliberately one entry, and anything that walks to the next one would
       undo the mechanic the whole page is built around. Reading ahead is
       already free here, so a run of entries is only fewer clicks than the
       pager, not a new permission. */
    if (canAdvance) {
      h += '<button class="chip reader__auto" data-act="autoplay" aria-pressed="' +
        (!!state.autoplay) + '">' + esc(COPY.autoplayCta || 'Keep playing') + '</button>';
    }

    h += '<span class="reader__note">' + esc(COPY.listenNote ||
      'Read aloud by this browser. Nothing is downloaded and nothing is sent anywhere.') +
      '</span></div>';
    return h;
  }

  /* A beat between entries. Without it the next title begins on the last
     syllable of the previous entry and a run turns into one undifferentiated
     stream, which is the thing that makes it hard to notice you stopped
     listening two entries ago. Long enough to register as a break, short
     enough not to read as the run having ended. */
  var AUTOPLAY_GAP = 1200;
  var autoTimer = null;

  /* Forwards only, in the order the library is showing, which is the order the
     pager already offers. It stops at the end rather than wrapping: the corpus
     is a sequence with a last entry, and looping to the start would quietly
     restart a run somebody thought was winding down. */
  function playNext(id) {
    var nb = libNeighbours(id);
    if (!nb.next) { toast(COPY.autoplayEnd || 'That was the last entry'); return; }

    libOpen = nb.next.id;
    renderLibrary();
    el('field').scrollIntoView({ block: 'start', behavior: 'auto' });
    syncHash();

    var btn = el('view-library').querySelector('[data-act="speak"]');
    if (btn) startReading(btn);
  }

  /* Collected from the rendered DOM rather than from the entry object, so what
     is spoken is what is on the screen and the two cannot drift apart. A
     locked entry has no body to collect, which is why the gate needs no
     handling here. */
  function speakableParts(entry) {
    var out = [];
    Array.prototype.forEach.call(entry.querySelectorAll('[data-speak]'), function (node) {
      if (SPEAK_PARTS.indexOf(node.getAttribute('data-speak')) === -1) return;
      var text = (node.innerText || node.textContent || '').trim();
      if (text) out.push({ node: node, text: text });
    });
    return out;
  }

  /* The button drives itself from the reader's callbacks instead of going
     through render(), because a re-render mid-read would replace the element
     the reader is highlighting. */
  function startReading(btn) {
    var entry = btn.closest('.entry');
    if (!entry) return;

    var parts = speakableParts(entry);
    if (!parts.length) { toast(COPY.listenEmpty || 'Nothing to read on this one'); return; }

    /* A new read supersedes any advance still waiting out its gap. Without
       this, pressing Listen again during the pause leaves two timers armed for
       the same entry and the run jumps two entries instead of one. */
    clearTimeout(autoTimer);
    autoTimer = null;

    var id = btn.dataset.id;
    var stopBtn = entry.querySelector('[data-act="speak-stop"]');
    var lit = null;

    var started = SPEECH.speak(parts, {
      onPart: function (i) {
        if (lit) lit.removeAttribute('data-reading');
        lit = i >= 0 ? parts[i].node : null;
        if (lit) lit.setAttribute('data-reading', 'true');
      },
      onState: function (s) {
        btn.textContent = s === 'playing' ? (COPY.listenPause || 'Pause')
          : s === 'paused' ? (COPY.listenResume || 'Resume')
            : (COPY.listenCta || 'Listen');
        if (stopBtn) stopBtn.hidden = s === 'idle';
      },
      /* Without this the button just resets and the reader is left to guess
         whether they mis-clicked. Neither message asks them to check their
         connection, because the reader cannot tell a dropped one from a
         captive portal or an endpoint that is simply down. */
      onFail: function (why) {
        toast(why === 'network'
          ? (COPY.listenNetworkGone || 'That voice is served over the network and it did not answer')
          : (COPY.listenStopped || 'The voice stopped and would not start again'));
      },
      /* The conditions are tested when the gap expires rather than when it is
         scheduled. A second is long enough to leave the library in, open a
         different entry in, or switch the toggle off in, and all three should
         call the run off - so what was true when the entry finished is not
         what decides whether the next one starts. */
      onDone: function () {
        if (!state.autoplay) return;
        autoTimer = setTimeout(function () {
          autoTimer = null;
          if (state.autoplay && view === 'library' && libOpen === id) playNext(id);
        }, AUTOPLAY_GAP);
      }
    });

    if (!started) toast(COPY.listenNoVoice || 'This browser has no voice installed to read with');
  }

  /* --- Entry (shared by Today and Library reader) ------------------------ */
  function entryHTML(l, opts) {
    opts = opts || {};
    var r = state.log[l.id] || {};
    var done = r.completedOn === today();
    var computed = !!(l.compute && PROFILE);
    var locked = (computed || GATE) && opts.canComplete && !gateOpen(l.id);

    var h = '';
    h += '<article class="entry">';
    h += '<header class="entry__head">';
    h += '<div class="tags">';
    h += '<span class="tag">' + esc(trackName(l.track)) + '</span>';
    if (LEVELS[l.level]) h += '<span class="tag tag--level">' + esc(LEVELS[l.level]) + '</span>';
    h += '<span class="tag tag--time">' + esc(say('readTime', readMinutes(l))) + '</span>';
    if (lapsed(l)) h += '<span class="tag tag--lapsed">' + esc(say('lapsedOn', shortDate(l.expires))) + '</span>';
    h += '</div>';
    h += '<h2 class="entry__title" data-speak="title">' + esc(l.title) + '</h2>';
    h += '<div class="entry__rule"></div>';
    var prefix = COPY.sourcePrefix || 'After';
    h += '<p class="entry__source" data-speak="source">' + esc(prefix) + spaceBetween(prefix, l.source) +
      '<em>' + esc(l.source) + '</em></p>';
    /* Offered only past the gate. Below it the entry is the gate, and a button
       promising to read the entry aloud would be reading out a form. */
    if (SPEECH.available && !locked) h += readerHTML(l, !opts.canComplete);
    h += '</header>';

    /* An entry that declares a sum uses the arithmetic gate. Anything else on
       the same site falls back to the text gate if one is configured. */
    if (opts.canComplete) {
      if (computed) h += computeHTML(l);
      else if (GATE) h += gateHTML(l);
    }

    if (locked) {
      // The arithmetic gate draws its own curtain, because what it says depends
      // on whether it is still asking for profile figures or for the answer.
      if (!computed) {
        h += '<p class="gate__curtain">' + esc(GATE.curtain || 'The entry opens once you have committed an answer above.') + '</p>';
      }
      h += '</article>';
      return h;
    }

    if (lapsed(l)) {
      h += '<div class="block block--failure"><p class="block__label">' + esc(COPY.labelLapsed || 'Past its date') +
        '</p><div class="block__body"><p>' +
        esc(COPY.lapsedNote || 'This entry carried an expiry and it has passed. Treat it as history rather than as current fact. It has left the sequence and the review deck.') +
        '</p></div></div>';
    }

    h += '<div class="block"><p class="block__label">' + esc(COPY.labelIdea || 'The idea') + '</p>';
    h += '<div class="block__body" data-speak="idea"><p class="lead">' + esc(l.idea) + '</p></div></div>';

    /* Above the mechanism rather than below it. The prose is what drifts past
       the citation, so the citation has to be read first to be a check on it. */
    if (HAS_EVIDENCE && l.evidence) h += evidenceHTML(l);

    h += '<div class="block"><p class="block__label">' + esc(COPY.labelWhy || 'Why it holds') + '</p>';
    h += '<div class="block__body" data-speak="why">' + paras(l.why) + '</div></div>';

    h += '<div class="block block--failure"><p class="block__label">' + esc(COPY.labelFailure || 'What goes wrong without it') + '</p>';
    h += '<div class="block__body" data-speak="failure">' + paras(l.failureMode) + '</div></div>';

    /* Immediately after the diagnosis, because broken then repaired is the pair
       the reader is actually comparing. Only reachable past the gate: this is
       the answer a site promised not to show first, so everything above returns
       early while the entry is locked. */
    if (l.worked) {
      h += '<div class="worked"><p class="block__label">' + esc(COPY.labelWorked || 'One good repair') + '</p>';
      h += '<div class="worked__body" data-speak="worked">' + paras(l.worked) + '</div></div>';
    }

    h += '<div class="experiment"><p class="experiment__label">' + esc(COPY.labelExperiment || 'Try this today') + '</p>';
    h += '<div class="experiment__body" data-speak="experiment">' + paras(l.experiment) + '</div></div>';

    if (HAS_FORECAST && l.forecast) {
      var already = forecastList().filter(function (f) { return f.source === l.id; })[0];
      h += '<div class="fc-seed"><p class="block__label">' + esc(COPY.labelForecast || 'Put a number on it') + '</p>';
      h += '<p class="fc-seed__q">' + esc(l.forecast.q) + '</p>';
      if (already) {
        h += '<p class="reflect__state">' +
          esc(say('fcRecorded', Math.round(already.p * 100), shortDate(already.resolvesOn))) + '</p>';
      } else {
        h += '<div class="fc-seed__row">';
        h += '<label class="fc-seed__lab">' + esc(COPY.fcProbability || 'Probability') +

  /* Display order for the whole corpus: the sequence, then anything the
     sequence left out. A lapsed entry leaves SEQ but stays in the library
     marked, so it lands at the end rather than disappearing. */
  function libraryOrder() {
    var ordered = SEQ.map(function (id) { return BY_ID[id]; });
    LESSONS.forEach(function (l) { if (ordered.indexOf(l) === -1) ordered.push(l); });
    return ordered.filter(Boolean);
  }

  /* Shared by the shelf and by the reader's pager, because they have to agree
     on what comes next. Two copies of this filter is how you get a Next button
     that walks off the list you were reading. */
  function libraryRows() {
    var q = libFilter.q.trim().toLowerCase();
    return libraryOrder().filter(function (l) {
      if (libFilter.lapsed && !lapsed(l)) return false;
      if (libFilter.track && l.track !== libFilter.track) return false;
      if (libFilter.level && l.level !== libFilter.level) return false;
      if (q) {
        var hay = (l.title + ' ' + l.idea + ' ' + l.source + ' ' + trackName(l.track)).toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });
  }

  function idIndex(rows, id) {
    for (var i = 0; i < rows.length; i++) { if (rows[i].id === id) return i; }
    return -1;
  }

  /* What the pager offers either side of the entry being read. Ends are stops
     rather than wraps: the corpus is finite and ordered, so running out of it
     is worth being told. */
  function libNeighbours(id) {
    var rows = libraryRows();
    var i = idIndex(rows, id);
    /* An entry can be open while sitting outside the current filter - a
       cheatsheet row opens one directly and the filter it left behind is still
       set. Falling back to the unfiltered order keeps the pager working
       instead of stranding the reader on an entry with no way onward. */
    if (i === -1) {
      rows = libraryOrder();
      i = idIndex(rows, id);
    }
    return {
      prev: i > 0 ? rows[i - 1] : null,
      next: i !== -1 && i < rows.length - 1 ? rows[i + 1] : null
    };
  }

  /* The one view that is not a study aid. Everything else here is built to slow
     you down; this is built to be read at speed, which is why it is restricted
     to the verdict that survived being re-run. A cheatsheet of contested and
     single-study findings would be a list of things to be confidently wrong
     about, and the corpus is mostly those - so the count of what was left off
     is stated rather than quietly dropped. */
  function renderCheatsheet() {
    var host = el('view-cheatsheet');
    /* live() rather than LESSONS. A lapsed entry stays in the library marked,
       because knowing what went stale is useful, but a cheatsheet row is the
       purest form of the quiet reinforcement that expiry exists to stop. */
    var pool = live();
    var solid = pool.filter(onCheatsheet);

    var h = '<div class="section__head"><h2 class="section__title">' + esc(VIEW_LABEL.cheatsheet) + '</h2>';
    var note = COPY.cheatNote || '';
    var count = say('cheatCount', '<b>' + solid.length + '</b>', pool.length);
    /* The withheld count is generated and the reason is the site's to write,
       because the reasons differ: a verdict-filtered site withheld what did not
       replicate, an opt-in site withheld what does not compress. Stating the
       count either way stops a short page reading as the whole corpus. */
    var other = COPY.cheatWithheld ? say('cheatOther', pool.length - solid.length, COPY.cheatWithheld) : '';
    h += '<p class="section__note">' + esc(note) + spaceBetween(note, count) + count +
      spaceBetween(count, other) + esc(other) + '</p></div>';

    TRACKS.forEach(function (t) {
      var rows = solid.filter(function (l) { return l.track === t.id; });
      if (!rows.length) return;

      h += '<section class="cheat">';
      h += '<h3 class="cheat__track">' + esc(t.name) + '</h3>';
      rows.forEach(function (l) {
        h += '<button class="cheat__row" data-act="cheat-open" data-id="' + esc(l.id) + '"' +
          (l.replication ? ' data-rep="' + esc(l.replication) + '"' : '') +
          (stale(l) ? ' data-stale="1"' : '') + '>';
        h += '<span class="cheat__do">' + esc(l.cheat) + '</span>';
        h += '<span class="cheat__claim">' + esc(l.title) + '</span>';
        h += '<span class="cheat__meta">';
        /* A page carrying more than one verdict has to say which is which, or a
           legislated fact and a replicated finding read as the same kind of
           thing. One verdict needs no chip: the section note already said it. */
        if (CHEAT_VERDICTS && CHEAT_VERDICTS.length > 1) {
          h += '<span class="rep-chip">' + esc(REP_LABEL[l.replication] || l.replication) + '</span>';
        }
        if (l.interval && typeof l.interval.lo === 'number' && typeof l.interval.hi === 'number') {
          /* Both bounds or neither. Half an interval is the single most common
             way a number gets laundered into sounding settled, and a cheatsheet
             is exactly where that happens. */
          h += '<span class="cheat__interval">' +
            esc(say('intervalRange', l.interval.measure, l.interval.lo, l.interval.hi)) + '</span>';
        }
        h += '<span class="cheat__source">' + esc(l.source) + '</span>';
        // Statute is true as at a date and not before or necessarily after it.
        if (l.replication === 'statute' && l.asAt) {
          h += '<span class="cheat__stale">' + esc(say('evidenceAsAt', shortDate(l.asAt))) + '</span>';
        }
        /* The row states the date a check lapsed, so it takes only the function
           form of staleNote, which can carry one. A string staleNote is an
           undated line for the evidence block alone. */
        if (stale(l)) {
          h += '<span class="cheat__stale">' + esc(say('staleNote', shortDate(l.verifiedOn))) + '</span>';
        }
        h += '</span></button>';
      });
      h += '</section>';
    });

    host.innerHTML = h;
  }

    h += '<div class="fc-seed__row">';
    h += '<label class="fc-seed__lab">' + esc(COPY.fcProbability || 'Probability') +
      ' <input class="fc-seed__p" id="fc-p" type="number" min="1" max="99" step="1" value="50">%</label>';
    h += '<label class="fc-seed__lab">' + esc(COPY.fcResolves || 'Resolves') +
      ' <input class="fc-seed__d" id="fc-d" type="date" value="' + esc(shift(today(), 30)) + '"></label>';
    h += '<button class="btn" data-act="fc-add">' + esc(COPY.recordCta || 'Record it') + '</button>';
    h += '</div></div>';

    if (pending.length) {
      h += '<div class="fc-group"><p class="block__label">' + esc(COPY.fcOpen || 'Open') + '</p>';
      pending.forEach(function (f) {
        h += '<div class="fc-row"><div class="fc-row__body"><p class="fc-row__q">' + esc(f.q) + '</p>';
        h += '<p class="fc-row__meta">' + Math.round(f.p * 100) + '% &middot; ' +
          esc(say('fcResolvesOn', shortDate(f.resolvesOn))) + '</p></div></div>';
      });
      h += '</div>';
    }

    if (closed.length) {
      h += '<div class="fc-group"><p class="block__label">' + esc(COPY.fcResolved || 'Resolved') + '</p>';
      closed.slice().reverse().forEach(function (f) {
        var err = Math.pow(f.p - f.outcome, 2);
        h += '<div class="fc-row fc-row--' + (err < 0.09 ? 'good' : err > 0.36 ? 'bad' : 'mid') + '">';
        h += '<div class="fc-row__body"><p class="fc-row__q">' + esc(f.q) + '</p>';
        h += '<p class="fc-row__meta">' + esc(say('fcSaidOutcome', Math.round(f.p * 100), f.outcome)) +
          ' &middot; ' + esc(say('fcSquaredError', err.toFixed(2))) + '</p></div></div>';
      });
      h += '</div>';
    }

    host.innerHTML = h;
  }

  function renderJournal() {
    var notes = Object.keys(state.log)
      .filter(function (id) {
        var r = state.log[id];
        return BY_ID[id] && ((r.note || '').trim() || (r.gate && r.gate.answer));
      })
      .sort(function (a, b) {
        var da = state.log[a].completedOn || '', db = state.log[b].completedOn || '';
        return db < da ? -1 : db > da ? 1 : 0;
      });

    var h = '<div class="section__head"><h2 class="section__title">' + esc(VIEW_LABEL.journal) + '</h2>' +
      '<p class="section__note">' + esc(COPY.journalNote ||
        'Everything you have written down. In a year this is the most valuable thing here — it is a record of your own judgement changing.') + '</p></div>';

    if (!notes.length) {
      h += '<p class="empty">' +
        esc(COPY.journalEmpty || 'Nothing logged yet. The reflection field on any entry writes here.') + '</p>';
    } else {
      notes.forEach(function (id) {
        var l = BY_ID[id], r = state.log[id];
        h += '<div class="note">';
        h += '<div class="note__meta"><span>' + esc(say('entryMeta', entryNumber(id))) + '</span>' +
          (r.completedOn ? '<span>' + esc(shortDate(r.completedOn)) + '</span>' : '') +
          '<span>' + esc(trackName(l.track)) + '</span></div>';
        h += '<p class="note__title">' + esc(l.title) + '</p>';
        if (r.gate && r.gate.answer) {
          h += '<p class="note__label">' + esc(GATE && GATE.journalLabel || 'Before reading') + '</p>';
          h += '<p class="note__body note__body--gate">' + esc(r.gate.answer) + '</p>';
        }
        if ((r.note || '').trim()) {
          if (r.gate && r.gate.answer) h += '<p class="note__label">' + esc(COPY.journalAfter || 'After') + '</p>';
          h += '<p class="note__body">' + esc(r.note) + '</p>';
        }
        h += '</div>';
      });
    }
    el('view-journal').innerHTML = h;
  }

  function cell(label, value, unit) {
    return '<div class="readout__cell"><span class="readout__label">' + esc(label) + '</span>' +
      '<span class="readout__value">' + esc(value) + '</span>' +
      '<span class="readout__unit">' + esc(unit) + '</span></div>';
  }

  function renderProgress() {
    var ids = Object.keys(state.log);
    var logged = ids.filter(function (i) { return state.log[i].completedOn; }).length;
    var reviews = ids.reduce(function (n, i) { return n + (state.log[i].reviews || []).length; }, 0);
    var hits = ids.reduce(function (n, i) {
      return n + (state.log[i].reviews || []).filter(function (v) { return v.grade === 'got'; }).length;
    }, 0);
    var accuracy = reviews ? Math.round((hits / reviews) * 100) : null;
    var daysActive = Object.keys(state.days).length;

    var h = '<div class="section__head"><h2 class="section__title">' + esc(VIEW_LABEL.progress) + '</h2>' +
      '<p class="section__note">' + esc(COPY.progressNote ||
        'Streaks measure showing up. Retention measures whether it stuck. The second one is the one that matters.') + '</p></div>';

    h += '<div class="readout">';
    h += cell(COPY.statStreak || 'Streak', state.streak.count || 0, say('statStreakUnit', state.streak.count || 0));
    h += cell(COPY.statBest || 'Best streak', state.streak.best || 0, COPY.statBestUnit || 'days');
    h += cell(COPY.statLogged || 'Entries logged', logged, say('statLoggedUnit', LESSONS.length));
    if (HAS_REVIEW) {
      h += cell(COPY.statReviewed || 'Cards reviewed', reviews,
        accuracy === null ? COPY.noDataYet || 'no data yet' : say('statRecalled', accuracy));
      h += cell(COPY.statSolid || 'Solid', ids.filter(function (i) { return state.log[i].box >= 4; }).length,
        COPY.statSolidUnit || 'box 4 or 5');
    } else {
      var attempts = ids.reduce(function (n, i) { return n + (state.log[i].attempts || []).length; }, 0);
      h += cell(COPY.statAttempts || 'Attempts recorded', attempts,
        say('statAttemptsUnit', ids.filter(function (i) { return (state.log[i].attempts || []).length; }).length));
    }
    h += cell(COPY.statDays || 'Days on the books', daysActive, say('statDaysUnit', shortDate(state.startedOn)));
    if (HAS_EXPIRY) {
      h += cell(COPY.statLapsed || 'Lapsed', LESSONS.filter(lapsed).length, COPY.statLapsedUnit || 'out of rotation');
    }
    if (GATE) {
      var gated = ids.filter(function (i) { return state.log[i].gate && state.log[i].gate.answer; }).length;
      h += cell(GATE.statLabel || 'Committed', gated, COPY.statCommittedUnit || 'answers frozen before reading');
    }
    /* Two cells rather than one. The median says how far off you are; the
       signed mean says which side you are wrong on, and a reader who is
       reliably optimistic about their own position learns more from the
       direction than from the size. */
    if (PROFILE) {
      var g = gapStats();
      h += cell(COPY.statMedianGap || 'Median gap', g.n ? num(g.medianAbs) : '-',
        g.n ? say('statSums', g.n) : COPY.statNoSums || 'nothing computed yet');
      if (g.n) {
        h += cell(COPY.statDirection || 'Typical direction', (g.signedMean > 0 ? '+' : '') + num(g.signedMean),
          g.signedMean > 0 ? COPY.statHigh || 'you read high'
            : g.signedMean < 0 ? COPY.statLow || 'you read low' : COPY.statNoLean || 'no lean');
      }
    }
    h += '</div>';

    h += '<div class="coverage"><p class="block__label">' + esc(COPY.labelCoverage || 'Coverage by track') + '</p>';
    TRACKS.forEach(function (t) {
      var all = LESSONS.filter(function (l) { return l.track === t.id; });
      var done = all.filter(function (l) { return state.log[l.id] && state.log[l.id].completedOn; }).length;
      var pct = all.length ? Math.round((done / all.length) * 100) : 0;
      h += '<div class="cov">';
      h += '<span class="cov__name">' + esc(t.name) + '</span>';
      h += '<span class="cov__bar"><span class="cov__fill" style="width:' + pct + '%"></span></span>';
      h += '<span class="cov__n">' + done + '/' + all.length + '</span>';
      h += '</div>';
    });
    h += '</div>';

    h += '<div class="deepdive">';
    h += '<p class="block__label">' + esc(COPY.labelRecord || 'Your record') + '</p>';
    h += '<p class="deepdive__note">' + esc(COPY.recordNote || 'Everything lives in this browser only. Clearing site data wipes it, ' +
      'so take a copy occasionally — especially the journal.') + '</p>';
    h += '<div class="actions" style="border-top:0;padding-top:0">';
    h += '<button class="btn btn--quiet" data-act="export">' + esc(COPY.exportCta || 'Download a backup') + '</button>';
    h += '<button class="btn btn--quiet" data-act="export-show">' + esc(COPY.exportShowCta || 'Show as text') + '</button>';
    h += '<button class="btn btn--quiet" data-act="import-open">' + esc(COPY.importOpenCta || 'Restore from backup') + '</button>';
    h += '</div>';
    h += '<pre class="deepdive__text" id="export-text" hidden></pre>';
    h += '<div id="import-box" hidden>';
    h += '<textarea class="reflect__field" id="import-field" placeholder="' +
      esc(COPY.importPlaceholder || 'Paste a backup here') + '"></textarea>';
    h += '<div class="actions" style="border-top:0"><button class="btn" data-act="import-run">' +
      esc(COPY.importCta || 'Restore') + '</button></div>';
    h += '</div>';
    h += '</div>';

    el('view-progress').innerHTML = h;
  }

  /* Any re-render replaces the elements the reader is speaking from and
     highlighting, so the read ends with them rather than carrying on against a
     page that has moved underneath it. renderLibrary stops separately because
     the filter and pager actions call it without coming through here. */
  function render() {
    SPEECH.stop();
    renderChrome();
    VIEWS.forEach(function (v) { el('view-' + v).hidden = v !== view; });
    if (view === 'today') renderToday();
    else if (view === 'review') renderReview();
    else if (view === 'attempts') renderAttempts();
    else if (view === 'library') renderLibrary();
    else if (view === 'cheatsheet') renderCheatsheet();
    else if (view === 'forecast') renderForecast();
    else if (view === 'journal') renderJournal();
    else renderProgress();
  }

  /* --- The URL ------------------------------------------------------------
     The hash names the open tab and, in the library, the open entry: #journal,
     #library, #library/beta-two. A fragment rather than a path because the
     built page is one static file on GitHub Pages, and a real subpath would
     404 on reload with no server to rewrite it.

     Navigating in the page writes the hash, which pushes a history entry, so
     Back walks out of an entry to the list and out of the list to the tab
     before it. The hashchange listener only reads - it is how Back, Forward
     and a hand-edited URL reach the page. It never writes: a listener that
     corrected a hash it disliked would push again on every Back and trap the
     button. */
  function route() {
    return view === 'library' && libOpen ? 'library/' + libOpen : view;
  }

  function parseRoute(hash) {
    var parts = String(hash).replace(/^#/, '').split('/');
    if (VIEWS.indexOf(parts[0]) === -1) return null;
    return { view: parts[0], id: parts[0] === 'library' && parts[1] || null };
  }

  function applyRoute(v, id) {
    view = v;
    if (v === 'review') { reviewQueue = dueList(); reviewIdx = 0; revealed = false; }
    /* Cleared unless an entry is named, including when v is already the
       library. Clearing only on the way out left the open entry in place, so
       pressing Library while reading one re-rendered that entry and the tab
       looked dead - the one way back to the list was the entry's own close
       button. Going to a view means the top of it. A stale bookmark can name
       an entry the corpus no longer has, and the list is where that lands. */
    libOpen = id && BY_ID[id] ? id : null;
  }

  function syncHash() {
    var h = '#' + route();
    if (window.location.hash !== h) window.location.hash = h;
  }

  function go(v, id) {
    if (VIEWS.indexOf(v) === -1) return;
    applyRoute(v, id);
    render();
    el('field').scrollIntoView({ block: 'start', behavior: 'auto' });
    syncHash();
  }

  /* ==========================================================================
     Wiring
     ========================================================================== */
  document.addEventListener('click', function (ev) {
    var nav = ev.target.closest('.nav__item');
    if (nav) { go(nav.dataset.view); return; }

    var b = ev.target.closest('[data-act]');
    if (!b) return;
    var act = b.dataset.act;
    var id = b.dataset.id;

    if (act === 'go') { go(b.dataset.view); return; }

    if (act === 'complete') {
      markComplete(id);
      toast(HAS_REVIEW ? COPY.toastLoggedReview || 'Entry logged. It comes back for review tomorrow.'
        : COPY.toastLogged || 'Entry logged.');
      render();
      return;
    }

    if (act === 'gate-fallback') {
      var ff = el('gate-field');
      var lf = BY_ID[id];
      if (ff && lf && lf.fallback) { ff.value = lf.fallback; ff.focus(); }
      return;
    }

    if (act === 'gate-unlock') {
      var gf = el('gate-field');
      if (!gf || !unlockGate(id, gf.value)) {
        toast(GATE && GATE.tooShort || 'Write something first — that is the whole mechanism');
        return;
      }
      render();
      return;
    }

    if (act === 'profile-save') {
      var l = byId(id);
      var vals = {};
      computeNeeds(l).forEach(function (n) {
        var f = el('prof-' + n);
        if (f) vals[n] = f.value;
      });
      if (!saveProfile(vals)) {
        toast(COPY.toastProfileMissing || 'Put a number in each field first');
        return;
      }
      render();
      return;
    }

    if (act === 'compute-commit') {
      var cf = el('compute-field');
      if (!cf || !commitCompute(id, cf.value)) {
        toast(COPY.computeRefused || 'Write your own number first — that is the whole mechanism');
        return;
      }
      render();
      return;
    }

    if (act === 'attempt-add') {
      var af = document.querySelector('.attempt__field[data-id="' + id + '"]');
      var txt = af ? af.value.trim() : '';
      if (!txt) { toast(COPY.toastNothingToRecord || 'Nothing to record'); return; }
      record(id).attempts.push({ on: today(), text: txt });
      save();
      renderChrome();
      renderAttempts();
      return;
    }

    if (act === 'seed-forecast') {
      var sp = el('seed-p'), sd = el('seed-d');
      var lz = BY_ID[id];
      var pv = sp ? Math.max(1, Math.min(99, parseInt(sp.value, 10) || 50)) : 50;
      if (!sd || !sd.value) { toast(COPY.toastNeedDate || 'Give it a resolution date'); return; }
      addForecast(lz.forecast.q, pv / 100, sd.value, id);
      toast(COPY.toastForecastSeeded || 'Recorded. It lands in the forecast book.');
      render();
      return;
    }

    if (act === 'fc-add') {
      var q = el('fc-q').value.trim();
      var p = Math.max(1, Math.min(99, parseInt(el('fc-p').value, 10) || 50));
      var d = el('fc-d').value;
      if (!q) { toast(COPY.toastNeedQuestion || 'Write the question first'); return; }
      if (!d) { toast(COPY.toastNeedDate || 'Give it a resolution date'); return; }
      addForecast(q, p / 100, d, null);
      renderForecast();
      renderChrome();
      return;
    }

    if (act === 'fc-resolve') {
      resolveForecast(b.dataset.fid, parseInt(b.dataset.outcome, 10));
      renderForecast();
      renderChrome();
      return;
    }

    if (act === 'reveal') { revealed = true; renderReview(); return; }

    if (act === 'grade') {
      gradeCard(id, b.dataset.grade);
      reviewIdx += 1;
      revealed = false;
      renderChrome();
      renderReview();
      return;
    }

    if (act === 'copy-prompt') {
      copyText(deepDivePrompt(BY_ID[id]), COPY.toastPromptCopied || 'Prompt copied — paste it into Claude');
      return;
    }
    if (act === 'show-prompt') {
      var pt = el('prompt-text');
      pt.textContent = deepDivePrompt(BY_ID[id]);
      pt.hidden = !pt.hidden;
      return;
    }

    if (act === 'speak') {
      var sp = SPEECH.state();
      if (sp === 'playing') SPEECH.pause();
      else if (sp === 'paused') SPEECH.resume();
      else startReading(b);
      return;
    }
    if (act === 'speak-stop') { SPEECH.stop(); return; }

    /* The attribute is set in place rather than re-rendered, because every
       render path stops the reader - flipping this mid-entry would silence the
       thing it is about to keep playing. */
    if (act === 'autoplay') {
      state.autoplay = !state.autoplay;
      save();
      b.setAttribute('aria-pressed', String(state.autoplay));
      return;
    }

    if (act === 'lib-open') { libOpen = id; renderLibrary(); el('field').scrollIntoView({ block: 'start' }); syncHash(); return; }
    if (act === 'lib-close') { libOpen = null; renderLibrary(); syncHash(); return; }
    if (act === 'lib-track') { libFilter.track = b.dataset.track || null; renderLibrary(); return; }
    if (act === 'lib-level') { libFilter.level = b.dataset.level || null; renderLibrary(); return; }
    if (act === 'lib-lapsed') { libFilter.lapsed = !libFilter.lapsed; renderLibrary(); return; }

    /* A cheatsheet row is a summary of an entry, so following one hands you the
       entry itself rather than a second, longer summary. */
    if (act === 'cheat-open') { go('library', id); return; }

    if (act === 'export') {
      var json = JSON.stringify(state, null, 2);
      try {
        var url = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
        var a = document.createElement('a');
        a.href = url;
        a.download = (SITE.slug || 'daily') + '-' + today() + '.json';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        toast(COPY.toastExported || 'Backup downloaded');
      } catch (e) {
        el('export-text').textContent = json;
        el('export-text').hidden = false;
        toast(COPY.toastExportBlocked || 'Download blocked here — copy the text instead');
      }
      return;
    }
    if (act === 'export-show') {
      var et = el('export-text');
      et.textContent = JSON.stringify(state, null, 2);
      et.hidden = !et.hidden;
      return;
    }
    if (act === 'import-open') {
      var ib = el('import-box');
      ib.hidden = !ib.hidden;
      return;
    }
    if (act === 'import-run') {
      var txt2 = el('import-field').value.trim();
      if (!txt2) { toast(COPY.toastImportEmpty || 'Paste a backup first'); return; }
      try {
        var next = JSON.parse(txt2);
        if (!next || next.v !== 1 || typeof next.log !== 'object') throw new Error('shape');
        state = next;
        state.log = state.log || {};
        state.days = state.days || {};
        state.forecasts = state.forecasts || {};
        state.streak = state.streak || clone(blank.streak);
        save();
        toast(COPY.toastImported || 'Restored');
        go('today');
      } catch (e) {
        toast(say('toastImportBad', SITE.name || 'Daily'));
      }
      return;
    }
  });

  // Autosave the reflection field. Debounced so it does not thrash storage.
  var noteTimer = null;
  document.addEventListener('input', function (ev) {
    if (ev.target.id === 'lib-search') {
      libFilter.q = ev.target.value;
      var pos = ev.target.selectionStart;
      renderLibrary();
      var again = el('lib-search');
      if (again) { again.focus(); again.setSelectionRange(pos, pos); }
      return;
    }

    if (ev.target.id !== 'note-field') return;
    var nid = ev.target.dataset.id;
    var val = ev.target.value;
    var st = el('note-state');
    if (st) st.textContent = COPY.noteSaving || 'Saving…';
    clearTimeout(noteTimer);
    noteTimer = setTimeout(function () {
      record(nid).note = val;
      save();
      var s = el('note-state');
      if (s) s.textContent = COPY.noteSaved || 'Saved to this browser';
    }, 500);
  });

  /* Back, Forward and a hand-edited URL. The page's own hash writes echo here
     too, a tick later, and must find nothing to do. */
  window.addEventListener('hashchange', function () {
    var r = parseRoute(window.location.hash);
    if (!r || (r.view === view && r.id === libOpen)) return;
    applyRoute(r.view, r.id);
    render();
    el('field').scrollIntoView({ block: 'start', behavior: 'auto' });
  });

  /* ==========================================================================
     Boot
     ========================================================================== */
  mountShell();

  el('theme-toggle').addEventListener('click', function () {
    var root = document.documentElement;
    var dark = root.getAttribute('data-theme') === 'dark' ||
      (!root.getAttribute('data-theme') && window.matchMedia('(prefers-color-scheme: dark)').matches);
    root.setAttribute('data-theme', dark ? 'light' : 'dark');
    state.theme = dark ? 'light' : 'dark';
    save();
    renderChrome();
  });

  if (state.theme) document.documentElement.setAttribute('data-theme', state.theme);

  if (!LESSONS.length) {
    el('view-today').innerHTML = '<p class="empty">' +
      esc(COPY.contentMissing || 'No entries loaded. The content files did not run.') + '</p>';
  } else {
    var landing = parseRoute(window.location.hash);
    if (landing) applyRoute(landing.view, landing.id);
    render();
  }

  // Exposed for the test harness only. The page itself never reads this.
  window.__daily = {
    reviewInterval: reviewInterval, buildSequence: buildSequence, lessonForToday: lessonForToday,
    dueList: dueList, markComplete: markComplete, gradeCard: gradeCard, unlockGate: unlockGate,
    gateOpen: gateOpen, lapsed: lapsed, brier: brier, calibration: calibration,
    addForecast: addForecast, resolveForecast: resolveForecast, deepDivePrompt: deepDivePrompt,
    gapStats: gapStats, commitCompute: commitCompute, saveProfile: saveProfile,
    speakableParts: speakableParts,
    state: function () { return state; }, seq: function () { return SEQ; }, go: go, render: render
  };
})();

</script>
