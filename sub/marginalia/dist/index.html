<html lang="zh-CN">
<title>批注 - 毛选里的方法，与它们在实践中的记录</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* ==========================================================================
   Practicum — a daily logbook for management practice

   Identity: an engineering lab notebook. Pale technical paper stock, a 28px
   graph field locked to the prose baseline, drafting blue for structure and
   oxide red-pen for anything that asks you to act.

   Theming is token-level. Components read tokens and never reach inside a
   media query, so the viewer's explicit toggle can win in both directions.
   ========================================================================== */

/* --- Light tokens (the default ground) ----------------------------------- */
:root {
  --paper:        #F5F6F3;
  --paper-raised: #FFFFFF;
  --paper-sunk:   #EBEEE8;

  --grid:         rgba(20, 26, 34, 0.055);
  --grid-major:   rgba(20, 26, 34, 0.10);
  --rule:         #DBDFD7;
  --rule-strong:  #B6BEB4;

  --ink:          #141A22;
  --ink-muted:    #545F6A;
  --ink-faint:    #8B949D;

  --accent:       #1D4E80;
  --accent-ink:   #163D66;
  --accent-soft:  rgba(29, 78, 128, 0.09);
  --accent-line:  rgba(29, 78, 128, 0.30);

  --action:       #9E3A26;
  --action-soft:  rgba(158, 58, 38, 0.075);
  --action-line:  rgba(158, 58, 38, 0.32);

  --solid:        #2F6B4F;
  --shaky:        #8A6A1F;

  --shadow-card:  0 1px 0 rgba(20, 26, 34, 0.05), 0 8px 22px -14px rgba(20, 26, 34, 0.30);
  --shadow-lift:  0 1px 0 rgba(20, 26, 34, 0.06), 0 16px 34px -18px rgba(20, 26, 34, 0.38);

  /* Type roles. No CDN fonts: the Artifact CSP blocks font hosts, and a
     linked webfont would fail silently, so every role resolves locally. */
  --face-display: Superclarendon, Rockwell, "Bookman Old Style", "Roboto Slab", Georgia, serif;
  --face-text:    Charter, "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --face-ui:      "Helvetica Neue", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  --face-mono:    "SF Mono", SFMono-Regular, Menlo, "Cascadia Mono", Consolas, monospace;

  /* 28px baseline. The graph field is a 28px minor / 140px major multiple of
     it, so body lines land on grid lines rather than near them. */
  --lead:  28px;
  --u:     7px;
  --rail:  17rem;
  --measure: 66ch;
}

/* --- Dark tokens: a negative blueprint under lamplight -------------------
   Retuned rather than inverted. The blue lifts to hold contrast on a dark
   ground; the red-pen warms so it still reads as ink, not as an error state. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper:        #101418;
    --paper-raised: #171D24;
    --paper-sunk:   #0B0E12;

    --grid:         rgba(158, 190, 214, 0.055);
    --grid-major:   rgba(158, 190, 214, 0.085);
    --rule:         #232C34;
    --rule-strong:  #37444E;

    --ink:          #DCE3E9;
    --ink-muted:    #96A2AD;
    --ink-faint:    #68737D;

    --accent:       #6EA8D4;
    --accent-ink:   #9AC4E4;
    --accent-soft:  rgba(110, 168, 212, 0.13);
    --accent-line:  rgba(110, 168, 212, 0.34);

    --action:       #D9755C;
    --action-soft:  rgba(217, 117, 92, 0.12);
    --action-line:  rgba(217, 117, 92, 0.36);

    --solid:        #63B08A;
    --shaky:        #C9A651;

    --shadow-card:  0 1px 0 rgba(0, 0, 0, 0.4), 0 8px 22px -14px rgba(0, 0, 0, 0.7);
    --shadow-lift:  0 1px 0 rgba(0, 0, 0, 0.45), 0 16px 34px -18px rgba(0, 0, 0, 0.8);
  }
}

:root[data-theme="dark"] {
  --paper:        #101418;
  --paper-raised: #171D24;
  --paper-sunk:   #0B0E12;

  --grid:         rgba(158, 190, 214, 0.055);
  --grid-major:   rgba(158, 190, 214, 0.085);
  --rule:         #232C34;
  --rule-strong:  #37444E;

  --ink:          #DCE3E9;
  --ink-muted:    #96A2AD;
  --ink-faint:    #68737D;

  --accent:       #6EA8D4;
  --accent-ink:   #9AC4E4;
  --accent-soft:  rgba(110, 168, 212, 0.13);
  --accent-line:  rgba(110, 168, 212, 0.34);

  --action:       #D9755C;
  --action-soft:  rgba(217, 117, 92, 0.12);
  --action-line:  rgba(217, 117, 92, 0.36);

  --solid:        #63B08A;
  --shaky:        #C9A651;

  --shadow-card:  0 1px 0 rgba(0, 0, 0, 0.4), 0 8px 22px -14px rgba(0, 0, 0, 0.7);
  --shadow-lift:  0 1px 0 rgba(0, 0, 0, 0.45), 0 16px 34px -18px rgba(0, 0, 0, 0.8);
}

/* --- Ground -------------------------------------------------------------- */
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--face-text);
  font-size: 17px;
  line-height: var(--lead);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

h1, h2, h3, h4, p, ul, ol, dl, dd, dt, figure, blockquote {
  margin: 0;
  padding: 0;
}
ul, ol { list-style: none; }
button { font: inherit; color: inherit; }

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
  border-radius: 1px;
}

.skip {
  position: absolute;
  left: -9999px;
  top: 0;
  z-index: 50;
  padding: var(--u) calc(var(--u) * 2);
  background: var(--accent);
  color: #fff;
  font-family: var(--face-ui);
  font-size: 0.8125rem;
  text-decoration: none;
}
.skip:focus { left: var(--u); top: var(--u); }

/* --- Shared type roles --------------------------------------------------- */
.eyebrow {
  font-family: var(--face-ui);
  font-size: 0.6875rem;
  font-weight: 600;
  letter-spacing: 0.13em;
  text-transform: uppercase;
  color: var(--ink-faint);
}

.num { font-family: var(--face-mono); font-variant-numeric: tabular-nums; }

/* ==========================================================================
   Layout: a bound page. Spine rail carries identity and position; the field
   is the paper itself.
   ========================================================================== */
.logbook {
  display: grid;
  grid-template-columns: var(--rail) minmax(0, 1fr);
  min-height: 100vh;
}

/* --- Spine --------------------------------------------------------------- */
.spine {
  position: sticky;
  top: 0;
  align-self: start;
  height: 100vh;
  display: flex;
  flex-direction: column;
  gap: calc(var(--u) * 4);
  padding: calc(var(--u) * 5) calc(var(--u) * 4);
  background: var(--paper-sunk);
  border-right: 1px solid var(--rule);
  overflow-y: auto;
}

.spine__head { display: flex; flex-direction: column; gap: calc(var(--u) * 0.5); }

.wordmark {
  font-family: var(--face-display);
  font-size: 1.75rem;
  font-weight: 400;
  letter-spacing: -0.015em;
  line-height: 1.1;
}

.spine__sub {
  font-family: var(--face-ui);
  font-size: 0.75rem;
  line-height: 1.45;
  color: var(--ink-muted);
  max-width: 15ch;
}

/* The entry stamp: position in the sequence, set like a plate number. */
.stamp {
  display: flex;
  flex-direction: column;
  padding-top: calc(var(--u) * 2);
  border-top: 2px solid var(--ink);
}
.stamp__label {
  font-family: var(--face-ui);
  font-size: 0.625rem;
  font-weight: 600;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--ink-faint);
}
.stamp__num {
  font-family: var(--face-mono);
  font-variant-numeric: tabular-nums;
  font-size: 2.75rem;
  line-height: 1.05;
  letter-spacing: -0.03em;
  color: var(--accent);
}
.stamp__date {
  font-family: var(--face-mono);
  font-size: 0.6875rem;
  letter-spacing: 0.04em;
  color: var(--ink-muted);
  text-transform: uppercase;
}

/* --- Nav ----------------------------------------------------------------- */
.nav { display: flex; flex-direction: column; }

.nav__item {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--u);
  width: 100%;
  padding: calc(var(--u) * 1.4) 0;
  background: none;
  border: 0;
  border-bottom: 1px solid var(--rule);
  font-family: var(--face-ui);
  font-size: 0.875rem;
  text-align: left;
  color: var(--ink-muted);
  cursor: pointer;
  transition: color 0.12s ease;
}
.nav__item:first-child { border-top: 1px solid var(--rule); }
.nav__item:hover { color: var(--ink); }
.nav__item[aria-current="page"] {
  color: var(--ink);
  font-weight: 600;
  box-shadow: inset 2px 0 0 var(--accent);
  padding-left: var(--u);
}

.nav__badge {
  font-family: var(--face-mono);
  font-variant-numeric: tabular-nums;
  font-size: 0.6875rem;
  padding: 1px 6px;
  border-radius: 2px;
  background: var(--action);
  color: #fff;
}

/* --- Gauge: the small instrument panel ---------------------------------- */
.gauge {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: var(--u);
  margin-top: auto;
}
.gauge__cell { display: flex; flex-direction: column; gap: 2px; }
.gauge dt {
  font-family: var(--face-ui);
  font-size: 0.5625rem;
  font-weight: 600;
  letter-spacing: 0.11em;
  text-transform: uppercase;
  color: var(--ink-faint);
}
.gauge dd {
  font-family: var(--face-mono);
  font-variant-numeric: tabular-nums;
  font-size: 1.125rem;
  color: var(--ink);
}

.spine__foot { padding-top: calc(var(--u) * 1.5); border-top: 1px solid var(--rule); }

.ghost {
  padding: calc(var(--u) * 0.7) var(--u);
  background: none;
  border: 1px solid var(--rule-strong);
  border-radius: 2px;
  font-family: var(--face-ui);
  font-size: 0.75rem;
  color: var(--ink-muted);
  cursor: pointer;
  transition: border-color 0.12s ease, color 0.12s ease;
}
.ghost:hover { border-color: var(--ink-muted); color: var(--ink); }

/* --- Field: the graph paper ---------------------------------------------- */
.field {
  padding: calc(var(--u) * 8) calc(var(--u) * 7) calc(var(--u) * 14);
  background-color: var(--paper);
  background-image:
    linear-gradient(to right,  var(--grid-major) 0 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid-major) 0 1px, transparent 1px),
    linear-gradient(to right,  var(--grid) 0 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid) 0 1px, transparent 1px);
  background-size: 140px 140px, 140px 140px, 28px 28px, 28px 28px;
  background-position: 0 0;
}
.field:focus { outline: none; }

.view { display: flex; flex-direction: column; gap: calc(var(--u) * 5); max-width: 78ch; }

/* ==========================================================================
   Entry: the daily lesson
   ========================================================================== */
.entry { display: flex; flex-direction: column; gap: calc(var(--u) * 4); }

.entry__head { display: flex; flex-direction: column; gap: calc(var(--u) * 2); }

.tags { display: flex; flex-wrap: wrap; gap: var(--u); align-items: center; }

.tag {
  font-family: var(--face-ui);
  font-size: 0.625rem;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 3px 7px;
  border-radius: 2px;
  background: var(--accent-soft);
  color: var(--accent-ink);
}
.tag--level {
  background: none;
  border: 1px solid var(--rule-strong);
  color: var(--ink-muted);
}
.tag--time {
  background: none;
  color: var(--ink-faint);
  font-family: var(--face-mono);
  letter-spacing: 0.04em;
  text-transform: none;
  padding-left: 0;
}

.entry__title {
  font-family: var(--face-display);
  font-size: clamp(2.125rem, 4.6vw, 3.125rem);
  font-weight: 400;
  line-height: 1.07;
  letter-spacing: -0.022em;
  text-wrap: balance;
  max-width: 26ch;
}

/* The one orchestrated moment: the rule under the title draws itself. */
.entry__rule {
  height: 2px;
  background: var(--ink);
  transform-origin: left;
  animation: draw 0.55s cubic-bezier(0.22, 0.61, 0.36, 1) both;
}
@keyframes draw { from { transform: scaleX(0); } to { transform: scaleX(1); } }

.entry__source {
  font-family: var(--face-ui);
  font-size: 0.8125rem;
  color: var(--ink-muted);
}
.entry__source em { font-style: italic; }

/* --- Prose blocks -------------------------------------------------------- */
.block { display: flex; flex-direction: column; gap: calc(var(--u) * 1.5); }

.block__label {
  font-family: var(--face-ui);
  font-size: 0.6875rem;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-faint);
}

.block__body { max-width: var(--measure); display: flex; flex-direction: column; gap: var(--lead); }
.block__body p { line-height: var(--lead); }

.lead { font-size: 1.1875rem; line-height: 32px; }
.lead strong { font-weight: 600; }

/* Failure mode gets a quiet sunk panel — it is a warning, not an action. */
.block--failure .block__body {
  padding: calc(var(--u) * 2.5) calc(var(--u) * 3);
  background: var(--paper-sunk);
  border-left: 2px solid var(--rule-strong);
}

/* --- The experiment: a stamped action item in red pen -------------------- */
.experiment {
  display: flex;
  flex-direction: column;
  gap: calc(var(--u) * 1.5);
  padding: calc(var(--u) * 3.5);
  background: var(--action-soft);
  border: 1px solid var(--action-line);
  border-left: 3px solid var(--action);
  border-radius: 2px;
}
.experiment__label {
  font-family: var(--face-ui);
  font-size: 0.6875rem;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--action);
}
.experiment__body { max-width: var(--measure); }

/* --- Reflection: a ruled writing surface --------------------------------- */
.reflect { display: flex; flex-direction: column; gap: calc(var(--u) * 1.5); }
.reflect__prompt {
  max-width: var(--measure);
  font-style: italic;
  color: var(--ink-muted);
}

.reflect__field {
  display: block;
  width: 100%;
  max-width: var(--measure);
  min-height: calc(var(--lead) * 4);
  padding: 0 calc(var(--u) * 1.5);
  border: 0;
  border-radius: 0;
  background-color: var(--paper-raised);
  background-image: linear-gradient(to bottom, transparent calc(var(--lead) - 1px), var(--rule) calc(var(--lead) - 1px));
  background-size: 100% var(--lead);
  box-shadow: inset 0 0 0 1px var(--rule);
  color: var(--ink);
  font-family: var(--face-text);
  font-size: 17px;
  line-height: var(--lead);
  resize: vertical;
}
.reflect__field:focus { box-shadow: inset 0 0 0 1px var(--accent-line); outline: none; }
.reflect__field::placeholder { color: var(--ink-faint); font-style: italic; }

.reflect__state {
  font-family: var(--face-mono);
  font-size: 0.6875rem;
  color: var(--ink-faint);
  min-height: var(--lead);
}

/* --- Actions row --------------------------------------------------------- */
.actions {
  display: flex;
  flex-wrap: wrap;
  gap: calc(var(--u) * 1.5);
  align-items: center;
  padding-top: calc(var(--u) * 2);
  border-top: 1px solid var(--rule);
}

.btn {
  padding: calc(var(--u) * 1.3) calc(var(--u) * 2.5);
  background: var(--ink);
  border: 1px solid var(--ink);
  border-radius: 2px;
  font-family: var(--face-ui);
  font-size: 0.8125rem;
  font-weight: 600;
  color: var(--paper);
  cursor: pointer;
  transition: opacity 0.12s ease;
}
.btn:hover { opacity: 0.86; }
.btn[disabled] { opacity: 0.4; cursor: default; }

.btn--quiet {
  background: none;
  border-color: var(--rule-strong);
  color: var(--ink-muted);
  font-weight: 500;
}
.btn--quiet:hover { border-color: var(--ink-muted); color: var(--ink); opacity: 1; }

.btn--done {
  background: var(--accent-soft);
  border-color: var(--accent-line);
  color: var(--accent-ink);
}

/* --- The reader ----------------------------------------------------------
   Sits under the source line, in the header rather than in the actions row at
   the foot: it is an offer about how to take the entry in, so it has to be
   there before you have read it. */
.reader {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--u);
  margin-top: var(--u);
}

.reader__btn {
  padding: calc(var(--u) * 0.8) calc(var(--u) * 1.6);
  font-size: 0.75rem;
}

.reader__note {
  font-family: var(--face-ui);
  font-size: 0.75rem;
  color: var(--ink-faint);
}

/* The tint is bled outwards with a spread shadow rather than padding, so the
   block being spoken lights up without the prose reflowing under it. */
[data-reading] {
  background: var(--accent-soft);
  box-shadow: 0 0 0 6px var(--accent-soft);
  border-radius: 1px;
  transition: background 0.2s ease;
}

/* --- Library pager -------------------------------------------------------
   Two equal columns so the next entry keeps the right-hand side whether or not
   there is a previous one to balance it. auto-fit rather than a breakpoint:
   the titles are clipped to one line, and below roughly 14rem a column shows
   too few characters of a title to be worth reading, so it stacks instead. */
.pager {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr));
  gap: calc(var(--u) * 1.5);
  margin-top: calc(var(--u) * 4);
}

.pager__btn {
  display: flex;
  flex-direction: column;
  gap: calc(var(--u) * 0.5);
  min-width: 0;
  padding: calc(var(--u) * 1.5) calc(var(--u) * 2);
  background: none;
  border: 1px solid var(--rule-strong);
  border-radius: 2px;
  cursor: pointer;
  text-align: left;
  transition: border-color 0.12s ease, background 0.12s ease;
}
.pager__btn:hover { border-color: var(--ink-muted); background: var(--accent-soft); }
.pager__btn--next { align-items: flex-end; text-align: right; }

.pager__dir {
  font-family: var(--face-ui);
  font-size: 0.625rem;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-faint);
}

/* One line, clipped. A long title wrapping to three lines turns a navigation
   control into the largest thing on the screen after the entry itself. */
.pager__title {
  max-width: 100%;
  overflow: hidden;
  font-family: var(--face-text);
  font-size: 0.9375rem;
  line-height: 1.3;
  color: var(--ink);
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* Holds the column so a missing neighbour does not slide the other button
   across, and says which end you reached rather than leaving a gap. */
.pager__end {
  display: flex;
  align-items: center;
  padding: calc(var(--u) * 1.5) calc(var(--u) * 2);
  font-family: var(--face-ui);
  font-size: 0.625rem;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-faint);
}
.pager__end:last-child { justify-content: flex-end; }

/* --- Deep dive ----------------------------------------------------------- */
.deepdive {
  display: flex;
  flex-direction: column;
  gap: calc(var(--u) * 1.5);
  padding: calc(var(--u) * 3);
  border: 1px dashed var(--accent-line);
  border-radius: 2px;
}
.deepdive__note {
  max-width: var(--measure);
  font-size: 0.9375rem;
  color: var(--ink-muted);
}
.deepdive__text {
  max-width: var(--measure);
  max-height: 40vh;
  overflow: auto;
  padding: calc(var(--u) * 2);
  background: var(--paper-sunk);
  border: 1px solid var(--rule);
  font-family: var(--face-mono);
  font-size: 0.8125rem;
  line-height: 1.6;
  white-space: pre-wrap;
  overflow-wrap: break-word;
}

/* ==========================================================================
   Review: index cards
   ========================================================================== */
.card {
  display: flex;
  flex-direction: column;
  gap: calc(var(--u) * 2);
  max-width: 62ch;
  padding: calc(var(--u) * 4);
  background: var(--paper-raised);
  border: 1px solid var(--rule);
  border-top: 3px solid var(--accent);
  border-radius: 2px;
  box-shadow: var(--shadow-card);
}

.card__meta {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: var(--u);
  font-family: var(--face-mono);
  font-size: 0.6875rem;
  color: var(--ink-faint);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.card__q {
  font-family: var(--face-display);
  font-size: 1.4375rem;
  font-weight: 400;
  line-height: 1.28;
  letter-spacing: -0.01em;
  text-wrap: balance;
}

.card__a {
  padding-top: calc(var(--u) * 2);
  border-top: 1px solid var(--rule);
  animation: settle 0.28s ease both;
}
@keyframes settle { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

.grades { display: flex; flex-wrap: wrap; gap: var(--u); }
.grade {
  flex: 1 1 auto;
  padding: calc(var(--u) * 1.3) calc(var(--u) * 2);
  background: none;
  border: 1px solid var(--rule-strong);
  border-radius: 2px;
  font-family: var(--face-ui);
  font-size: 0.8125rem;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.12s ease, border-color 0.12s ease;
}
.grade__hint {
  display: block;
  font-weight: 400;
  font-size: 0.6875rem;
  color: var(--ink-faint);
}
.grade--miss:hover  { border-color: var(--action); background: var(--action-soft); }
.grade--close:hover { border-color: var(--shaky); background: color-mix(in srgb, var(--shaky) 9%, transparent); }
.grade--got:hover   { border-color: var(--solid); background: color-mix(in srgb, var(--solid) 9%, transparent); }

/* ==========================================================================
   Library
   ========================================================================== */
.filters { display: flex; flex-wrap: wrap; gap: var(--u); align-items: center; }

.search {
  flex: 1 1 18ch;
  min-width: 0;
  padding: calc(var(--u) * 1.2) calc(var(--u) * 1.5);
  background: var(--paper-raised);
  border: 1px solid var(--rule);
  border-radius: 2px;
  color: var(--ink);
  font-family: var(--face-ui);
  font-size: 0.875rem;
}
.search:focus { border-color: var(--accent-line); outline: none; }

.chip {
  padding: calc(var(--u) * 0.8) calc(var(--u) * 1.4);
  background: none;
  border: 1px solid var(--rule-strong);
  border-radius: 2px;
  font-family: var(--face-ui);
  font-size: 0.75rem;
  color: var(--ink-muted);
  cursor: pointer;
}
.chip[aria-pressed="true"] {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--paper);
}

.shelf { display: flex; flex-direction: column; }

.shelf__row {
  display: grid;
  grid-template-columns: 4.5ch minmax(0, 1fr) auto;
  gap: calc(var(--u) * 2);
  align-items: baseline;
  width: 100%;
  padding: calc(var(--u) * 1.7) var(--u);
  background: none;
  border: 0;
  border-bottom: 1px solid var(--rule);
  text-align: left;
  cursor: pointer;
  transition: background 0.1s ease;
}
.shelf__row:hover { background: var(--accent-soft); }
.shelf__num {
  font-family: var(--face-mono);
  font-variant-numeric: tabular-nums;
  font-size: 0.75rem;
  color: var(--ink-faint);
}
.shelf__title { font-family: var(--face-text); font-size: 1rem; line-height: 1.4; }
.shelf__track {
  font-family: var(--face-ui);
  font-size: 0.625rem;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-faint);
}

.pip {
  display: inline-block;
  width: 6px;
  height: 6px;
  margin-right: var(--u);
  border-radius: 50%;
  background: var(--rule-strong);
  vertical-align: 1px;
}
.pip--logged { background: var(--accent); }
.pip--solid  { background: var(--solid); }
.pip--shaky  { background: var(--shaky); }

/* ==========================================================================
   Journal
   ========================================================================== */
.note {
  display: flex;
  flex-direction: column;
  gap: var(--u);
  max-width: var(--measure);
  padding-bottom: calc(var(--u) * 3);
  border-bottom: 1px solid var(--rule);
}
.note__meta {
  display: flex;
  flex-wrap: wrap;
  gap: calc(var(--u) * 1.5);
  align-items: baseline;
  font-family: var(--face-mono);
  font-size: 0.6875rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--ink-faint);
}
.note__title { font-family: var(--face-display); font-size: 1.1875rem; font-weight: 400; line-height: 1.3; }
.note__body { white-space: pre-wrap; }

/* ==========================================================================
   Progress
   ========================================================================== */
.readout {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(11rem, 1fr));
  gap: 1px;
  background: var(--rule);
  border: 1px solid var(--rule);
  border-radius: 2px;
}
.readout__cell {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: calc(var(--u) * 2.5);
  background: var(--paper-raised);
}
.readout__label {
  font-family: var(--face-ui);
  font-size: 0.625rem;
  font-weight: 600;
  letter-spacing: 0.11em;
  text-transform: uppercase;
  color: var(--ink-faint);
}
.readout__value {
  font-family: var(--face-mono);
  font-variant-numeric: tabular-nums;
  font-size: 1.875rem;
  line-height: 1.15;
  letter-spacing: -0.02em;
}
.readout__unit { font-family: var(--face-ui); font-size: 0.75rem; color: var(--ink-muted); }

.coverage { display: flex; flex-direction: column; gap: calc(var(--u) * 2); }
.cov { display: grid; grid-template-columns: minmax(9rem, 14rem) minmax(0, 1fr) 5ch; gap: calc(var(--u) * 2); align-items: center; }
.cov__name { font-family: var(--face-ui); font-size: 0.8125rem; }
.cov__bar { height: 8px; background: var(--paper-sunk); box-shadow: inset 0 0 0 1px var(--rule); }
.cov__fill { height: 100%; background: var(--accent); }
.cov__n {
  font-family: var(--face-mono);
  font-variant-numeric: tabular-nums;
  font-size: 0.75rem;
  color: var(--ink-muted);
  text-align: right;
}

/* ==========================================================================
   Shared furniture
   ========================================================================== */
.section__head {
  display: flex;
  flex-direction: column;
  gap: var(--u);
  padding-bottom: calc(var(--u) * 2);
  border-bottom: 2px solid var(--ink);
}
.section__title {
  font-family: var(--face-display);
  font-size: 1.875rem;
  font-weight: 400;
  line-height: 1.15;
  letter-spacing: -0.018em;
}
.section__note { max-width: var(--measure); font-size: 0.9375rem; color: var(--ink-muted); }

.empty {
  max-width: var(--measure);
  padding: calc(var(--u) * 5) 0;
  color: var(--ink-muted);
  font-style: italic;
}

.toast {
  position: fixed;
  bottom: calc(var(--u) * 3);
  left: 50%;
  transform: translate(-50%, calc(100% + var(--u) * 6));
  z-index: 40;
  padding: calc(var(--u) * 1.4) calc(var(--u) * 3);
  background: var(--ink);
  color: var(--paper);
  border-radius: 2px;
  font-family: var(--face-ui);
  font-size: 0.8125rem;
  box-shadow: var(--shadow-lift);
  transition: transform 0.24s cubic-bezier(0.22, 0.61, 0.36, 1);
}
.toast[data-open="true"] { transform: translate(-50%, 0); }

/* ==========================================================================
   Chinese

   Chinese has no italic. A browser asked for one slants the glyphs by a fixed
   angle, which reads as a rendering fault rather than as emphasis, so on a
   page whose language is Chinese every italic in these sheets stands upright,
   and so do em and i, which the browser italicises on its own. :lang() reads
   the html tag the build writes, so a page that declares no language never
   matches. Each selector carries it, which also outranks the rule being undone
   wherever that rule sits, components.css included.
   ========================================================================== */
em:lang(zh),
i:lang(zh),
.entry__source em:lang(zh),
.reflect__prompt:lang(zh),
.reflect__field:lang(zh)::placeholder,
.empty:lang(zh),
.gate__answer:lang(zh),
.note__body--gate:lang(zh),
.cheat__claim:lang(zh) { font-style: normal; }

/* ==========================================================================
   Narrow: the spine unbinds into a top bar
   ========================================================================== */
@media (max-width: 60rem) {
  .logbook { grid-template-columns: minmax(0, 1fr); }

  .spine {
    position: static;
    height: auto;
    gap: calc(var(--u) * 3);
    padding: calc(var(--u) * 3.5) calc(var(--u) * 3);
    border-right: 0;
    border-bottom: 1px solid var(--rule);
    overflow: visible;
  }
  .spine__sub { display: none; }
  .spine__head { flex-direction: row; align-items: baseline; gap: calc(var(--u) * 2); }

  .stamp { flex-direction: row; align-items: baseline; gap: calc(var(--u) * 1.5); padding-top: var(--u); }
  .stamp__num { font-size: 1.75rem; }

  .nav { flex-direction: row; overflow-x: auto; gap: calc(var(--u) * 2.5); }
  .nav__item { width: auto; flex: 0 0 auto; border: 0; padding: var(--u) 0; }
  .nav__item:first-child { border-top: 0; }
  .nav__item[aria-current="page"] {
    box-shadow: inset 0 -2px 0 var(--accent);
    padding-left: 0;
  }

  .gauge { margin-top: 0; grid-template-columns: repeat(3, auto); gap: calc(var(--u) * 3); }
  .spine__foot { border-top: 0; padding-top: 0; }

  .field { padding: calc(var(--u) * 5) calc(var(--u) * 3) calc(var(--u) * 12); }
  .cov { grid-template-columns: minmax(0, 1fr) 5ch; }
  .cov__bar { grid-column: 1 / -1; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

/* ==========================================================================
   Daily — components the base sheet does not carry

   Everything here belongs to a mechanic that only some sites turn on: the
   commitment gate, expiry, the attempts log, the forecast book. Tokens only,
   no literal colours, so a site theme retunes these along with everything
   else.
   ========================================================================== */

/* --- The gate ------------------------------------------------------------
   Deliberately heavy. It is the one thing on the page that stops you, and a
   stop that looks like a form field gets skipped. */
.gate {
  max-width: var(--measure);
  margin: calc(var(--u) * 4) 0;
  padding: calc(var(--u) * 3);
  background: var(--action-soft);
  border: 1px solid var(--action-line);
  border-left-width: 3px;
  border-radius: 2px;
}
.gate--done {
  background: var(--paper-sunk);
  border-color: var(--rule);
  border-left-color: var(--rule-strong);
}
.gate__intro {
  margin-bottom: calc(var(--u) * 2);
  padding-bottom: calc(var(--u) * 2);
  border-bottom: 1px solid var(--action-line);
}
.gate__intro p + p { margin-top: var(--lead); }
.gate__prompt {
  font-family: var(--face-display);
  font-size: 1.25rem;
  line-height: 1.35;
  margin-bottom: calc(var(--u) * 2);
}
.gate__field { min-height: calc(var(--lead) * 4); }
.gate__note {
  margin-top: var(--u);
  font-family: var(--face-ui);
  font-size: 0.8125rem;
  color: var(--ink-muted);
}
.gate__stamp {
  font-family: var(--face-mono);
  font-size: 0.6875rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-faint);
  margin-bottom: var(--u);
}
.gate__answer { white-space: pre-wrap; color: var(--ink-muted); font-style: italic; }
.gate__answer p + p { margin-top: var(--lead); }

.gate__fallback { margin-bottom: calc(var(--u) * 2); }
.gate__fallback summary {
  cursor: pointer;
  font-family: var(--face-ui);
  font-size: 0.8125rem;
  color: var(--ink-muted);
}
.gate__fallbacktext {
  margin: var(--u) 0;
  padding: calc(var(--u) * 2);
  background: var(--paper-raised);
  border: 1px dashed var(--rule-strong);
  font-size: 0.9375rem;
}

.gate__curtain {
  max-width: var(--measure);
  padding: calc(var(--u) * 4) 0;
  font-family: var(--face-ui);
  font-size: 0.9375rem;
  color: var(--ink-faint);
  border-top: 1px dashed var(--rule-strong);
}

/* --- Worked example ------------------------------------------------------ */
/* Sits directly under the failure mode, and has to read as the answer to it
   rather than as one more block of commentary. The accent rule and the raised
   stock do that; the first paragraph is the repair itself, so it gets the
   weight and the rest of the block stays quiet. */
.worked {
  max-width: var(--measure);
  margin: calc(var(--u) * 4) 0;
  padding: calc(var(--u) * 3);
  background: var(--paper-raised);
  border: 1px solid var(--rule);
  border-left: 3px solid var(--accent);
  border-radius: 2px;
}
.worked__body {
  margin-top: var(--u);
}
.worked__body p + p {
  margin-top: var(--lead);
}
/* The repair. Set in the reading face at full size so it can be compared
   against the specimen without the eye having to change gear. */
.worked__body p:first-child {
  font-size: 1.0625rem;
  line-height: 1.6;
  color: var(--ink);
}
/* What it changed, and what it cost. */
.worked__body p:last-child:not(:first-child) {
  font-family: var(--face-ui);
  font-size: 0.875rem;
  line-height: 1.55;
  color: var(--ink-muted);
  padding-top: calc(var(--u) * 1.5);
  border-top: 1px solid var(--rule);
}

/* --- Arithmetic gate ----------------------------------------------------- */
/* Same visual weight as the text gate, because it does the same job one notch
   harder. The gap is the only part that earns colour: over and under are
   different mistakes and the reader should be able to see which one they keep
   making without reading the number. */
.compute {
  max-width: var(--measure);
  margin: calc(var(--u) * 4) 0;
  padding: calc(var(--u) * 3);
  background: var(--action-soft);
  border: 1px solid var(--action-line);
  border-left-width: 3px;
  border-radius: 2px;
}
.compute--done {
  background: var(--paper-sunk);
  border-color: var(--rule);
  border-left-color: var(--rule-strong);
}
.compute__q {
  margin-top: var(--u);
  font-size: 1.0625rem;
  line-height: 1.5;
}
.compute__note {
  margin-top: var(--u);
  font-family: var(--face-ui);
  font-size: 0.8125rem;
  color: var(--ink-faint);
}
.compute__fields {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  gap: var(--u) calc(var(--u) * 2);
  margin: calc(var(--u) * 2) 0;
}
.compute__lab {
  font-family: var(--face-ui);
  font-size: 0.875rem;
  color: var(--ink-muted);
}
.compute__unit { color: var(--ink-faint); }
.compute__row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: calc(var(--u) * 2);
  margin: calc(var(--u) * 2) 0;
}
.compute__input {
  font-family: var(--face-mono);
  font-size: 1rem;
  font-variant-numeric: tabular-nums;
  padding: calc(var(--u) * 1.25) calc(var(--u) * 1.5);
  background: var(--paper-raised);
  color: var(--ink);
  border: 1px solid var(--rule-strong);
  border-radius: 2px;
  min-width: 10ch;
}
.compute__input:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}
.compute__result {
  margin-top: calc(var(--u) * 1.5);
  font-variant-numeric: tabular-nums;
}
.compute__gap {
  margin-top: var(--u);
  font-family: var(--face-ui);
  font-size: 0.875rem;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.compute__gap[data-dir="exact"] { color: var(--solid); }
.compute__gap[data-dir="over"],
.compute__gap[data-dir="under"] { color: var(--action); }

/* --- Evidence gate ------------------------------------------------------- */
/* Seven verdicts, four colours. The colour answers only "how much weight does
   this carry", which is the question the reader is actually asking; the label
   carries the distinction between, say, never-repeated and disputed. Giving
   each verdict its own hue would imply seven degrees of trust and there are
   not seven. */
.evidence {
  max-width: var(--measure);
  margin: calc(var(--u) * 3) 0;
  padding: calc(var(--u) * 2) calc(var(--u) * 2.5);
  background: var(--paper-sunk);
  border-left: 3px solid var(--rule-strong);
}
.evidence__cite {
  margin: calc(var(--u) * 0.75) 0 0;
  font-family: var(--face-mono);
  font-size: 0.875rem;
  line-height: 1.5;
  color: var(--ink);
}
.evidence__interval {
  margin: calc(var(--u) * 0.5) 0 0;
  font-family: var(--face-mono);
  font-size: 0.8125rem;
  font-variant-numeric: tabular-nums;
  color: var(--ink-muted);
}
.evidence__meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: calc(var(--u) * 1.5);
  margin: calc(var(--u) * 1.5) 0 0;
}
.rep-chip {
  font-family: var(--face-ui);
  font-size: 0.6875rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 2px 7px;
  border: 1px solid currentColor;
  color: var(--ink-muted);
}
.evidence__asat,
.evidence__stale {
  font-family: var(--face-ui);
  font-size: 0.75rem;
  color: var(--ink-faint);
}

.evidence[data-rep="replicated"] { border-left-color: var(--solid); }
.evidence[data-rep="replicated"] .rep-chip { color: var(--solid); }

.evidence[data-rep="single"],
.evidence[data-rep="contested"] { border-left-color: var(--shaky); }
.evidence[data-rep="single"] .rep-chip,
.evidence[data-rep="contested"] .rep-chip { color: var(--shaky); }

.evidence[data-rep="failed"],
.evidence[data-rep="overclaimed"] { border-left-color: var(--action); }
.evidence[data-rep="failed"] .rep-chip,
.evidence[data-rep="overclaimed"] .rep-chip { color: var(--action); }

.evidence[data-rep="statute"] { border-left-color: var(--accent); }
.evidence[data-rep="statute"] .rep-chip { color: var(--accent); }

/* Staleness is about the check, not the claim, so it marks the block without
   overriding the verdict colour the claim earned. */
.evidence[data-stale="1"] { border-left-style: dashed; }
.evidence[data-stale="1"] .evidence__stale { color: var(--action); }

/* --- Expiry -------------------------------------------------------------- */
.tag--lapsed {
  background: none;
  border: 1px solid var(--action-line);
  color: var(--action);
}
.pip--lapsed {
  background: none;
  border: 1px solid var(--rule-strong);
  width: 5px;
  height: 5px;
}

/* --- Attempts log -------------------------------------------------------- */
.attempt {
  display: flex;
  flex-direction: column;
  gap: var(--u);
  max-width: var(--measure);
  padding-bottom: calc(var(--u) * 3);
  margin-bottom: calc(var(--u) * 3);
  border-bottom: 1px solid var(--rule);
}
.attempt__past {
  padding-left: calc(var(--u) * 2);
  border-left: 2px solid var(--accent-line);
  white-space: pre-wrap;
}
.attempt__past span {
  font-family: var(--face-mono);
  font-size: 0.6875rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--ink-faint);
  margin-right: var(--u);
}
.attempt__new { display: flex; flex-direction: column; gap: var(--u); align-items: flex-start; }
.attempt__field { min-height: calc(var(--lead) * 2); }

/* --- Journal, gated entries --------------------------------------------- */
.note__label {
  font-family: var(--face-ui);
  font-size: 0.6875rem;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-faint);
}
.note__body--gate {
  color: var(--ink-muted);
  font-style: italic;
  padding-left: calc(var(--u) * 2);
  border-left: 2px solid var(--action-line);
}

/* --- Forecast seed, inside an entry -------------------------------------- */
.fc-seed {
  max-width: var(--measure);
  margin: calc(var(--u) * 4) 0;
  padding: calc(var(--u) * 3);
  background: var(--paper-sunk);
  border: 1px solid var(--rule);
  border-radius: 2px;
}
.fc-seed__q {
  font-family: var(--face-display);
  font-size: 1.125rem;
  line-height: 1.35;
  margin-bottom: calc(var(--u) * 2);
}
.fc-seed__row {
  display: flex;
  flex-wrap: wrap;
  gap: calc(var(--u) * 2);
  align-items: center;
}
.fc-seed__lab {
  font-family: var(--face-ui);
  font-size: 0.8125rem;
  color: var(--ink-muted);
  display: inline-flex;
  align-items: center;
  gap: var(--u);
}
.fc-seed__p, .fc-seed__d {
  font-family: var(--face-mono);
  font-size: 0.875rem;
  padding: 5px 7px;
  color: var(--ink);
  background: var(--paper-raised);
  border: 1px solid var(--rule-strong);
  border-radius: 2px;
}
.fc-seed__p { width: 4.5rem; }

/* --- Forecast book ------------------------------------------------------- */
.fc-group {
  max-width: var(--measure);
  margin-bottom: calc(var(--u) * 5);
  display: flex;
  flex-direction: column;
  gap: var(--u);
}
.fc-new__q { min-height: calc(var(--lead) * 2); }
.fc-row {
  display: flex;
  flex-wrap: wrap;
  gap: calc(var(--u) * 2);
  justify-content: space-between;
  align-items: flex-start;
  padding: calc(var(--u) * 2);
  background: var(--paper-raised);
  border: 1px solid var(--rule);
  border-left: 3px solid var(--rule-strong);
  border-radius: 2px;
}
.fc-row--ripe { border-left-color: var(--action); background: var(--action-soft); }
.fc-row--good { border-left-color: var(--solid); }
.fc-row--mid  { border-left-color: var(--shaky); }
.fc-row--bad  { border-left-color: var(--action); }
.fc-row__body { flex: 1 1 18rem; }
.fc-row__q { line-height: 1.4; }
.fc-row__meta {
  margin-top: 4px;
  font-family: var(--face-mono);
  font-size: 0.75rem;
  color: var(--ink-faint);
}
.fc-row__acts { display: flex; gap: var(--u); flex-wrap: wrap; }

/* --- Calibration plot ----------------------------------------------------
   Inline SVG because the CSP blocks every chart library, and because a
   ten-bucket scatter against a diagonal does not need one. */
.calwrap {
  max-width: var(--measure);
  margin-bottom: calc(var(--u) * 5);
}
.cal {
  display: block;
  width: 100%;
  max-width: 22rem;
  height: auto;
  margin: calc(var(--u) * 2) 0;
}
.cal__ref { stroke: var(--rule-strong); stroke-width: 1; stroke-dasharray: 3 3; }
.cal__axis { stroke: var(--rule-strong); stroke-width: 1; }
.cal__dot { fill: var(--accent); fill-opacity: 0.75; }
.cal__t {
  fill: var(--ink-faint);
  font-family: var(--face-ui);
  font-size: 9px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

/* --- Cheatsheet ----------------------------------------------------------
   Inverted from every other list in the engine. The shelf leads with the
   claim because you are choosing what to read; here you have already read it,
   so the row leads with what to do and demotes the claim to the line that
   justifies it. The solid rule down the left is the same one the evidence
   block uses for a replicated verdict, because that is the only verdict on
   this page and the colour should mean the same thing in both places. */

  font-family: var(--face-ui);
  font-size: 0.625rem;
  font-weight: 600;

}

/* A row carries the same colour its verdict earns in the evidence block, so
   the meaning of the rule is one thing across the whole site. Sites with no
   verdicts keep the default solid rule set above. */
.cheat__row[data-rep="statute"] { border-left-color: var(--accent); }
.cheat__row[data-rep="statute"] .cheat__interval,
.cheat__row[data-rep="statute"] .rep-chip { color: var(--accent); }
.cheat__row[data-rep="replicated"] .rep-chip { color: var(--solid); }

   claim, so the row keeps the verdict colour and changes only the rule. */
.cheat__row[data-stale="1"] { border-left-style: dashed; }
.cheat__row[data-stale="1"] .cheat__stale { color: var(--action); }

/* Track: 实践与调查. Ordered foundational first. */
(window.LESSONS = window.LESSONS || []).push(
{
  id: "no-investigation-no-right-to-speak",
  track: "practice", level: "v1",
  title: "没有调查，没有发言权",
  source: "《反对本本主义》（一九三〇年五月），第一卷",
  cheat: "对没调查过的系统先不发言：找至少三个真正干这件事的人开调查会，带着提纲，亲自问，自己记。",
  idea: "对一个问题没有调查，就没有对它发言的资格。结论产生在调查的末尾，而不是开头。",
  why: "这篇文章写于一九三〇年五月，原题《调查工作》，针对的是红四军里的一种风气：讨论问题时开口闭口“拿本本来”，以为上了书的、出自上级的就一定对。毛泽东的回答是，上级的指示正确，不是因为它出自上级，而是因为它适合实际情况；不加审察、表面上毫无异议地照办，看起来最服从，其实是对上级指示“怠工的最妙方法”。\n\n他把调查当作解决问题本身，而不是解决问题之前的手续。遇到难题只会叹气、要求调动工作的干部，他要他们“迈开你的两脚”，到工作范围的各处走走，像孔子那样“每事问”；出不了门，就把明了情况的人请来开调查会。调查像十月怀胎，解决问题像一朝分娩。\n\n最后一节讲调查的技术，具体得像一份操作手册：开讨论式的调查会，而不是只听一个人讲经验；到会的人至少三个，否则“囿于见闻”；事先定好调查纲目，有大纲也有细目；担负指导工作的人，从乡政府主席到中央政府主席，都要亲身出马，不能单靠书面报告；先把一个地方或一个问题调查到底；记录要自己做，“假手于人是不行的”。",
  failureMode: "它针对两种人。一种是本本主义者，用书本和上级文件代替对实际情况的了解。另一种是文中点名的巡视员、游击队领导者和新接任的干部，“喜欢一到就宣布政见”，看到一点表面、一个枝节，就指手画脚，说这也不对、那也错误。毛泽东说，这种人一定会弄坏事情，失掉群众。\n\n在今天的工程团队里，它的样子是：只看架构图就在设计评审上下结论；事故处理到一半才加入，没读时间线就开始抛理论；上任第一周还没看过团队怎么干活，就开始调整团队结构。",
  worked: "这套方法本身是扎实的。毛泽东一九二七年到一九三三年间在湖南、寻乌、兴国、长冈乡、才溪乡做的调查，记下了田地、租佃、借贷和商铺的细节；其中的寻乌调查一九九〇年由斯坦福大学出版社出了英译本，题为 Report from Xunwu。\n\n记录的断裂出现在一九五八年。大跃进中各地层层上报根本不可能达到的亩产，粮食征购又按虚报的数字下达。一九五九年七月十四日，国防部长彭德怀在庐山会议期间给毛泽东写了一封私人信，批评大跃进中的问题。毛泽东把信印发与会者，随后的八届八中全会通过决议，认定存在“以彭德怀同志为首的反党集团”，九月由林彪接任国防部长。杨继绳在《墓碑》中认为，庐山会议之后的“反右倾”运动使各级干部更不敢如实报告缺粮，饥荒因此加剧。这场饥荒的非正常死亡人数，各家估计相差很大，杨继绳在《墓碑》中的估计是三千六百万。\n\n一九六一年一月的八届九中全会上，毛泽东号召全党大兴调查研究之风，要把这一年搞成实事求是年。这篇写于三十年前的文章曾在战争中散失，后来重新找到，一九六四年以《反对本本主义》为题收入《毛泽东著作选读》，一九九一年收入《毛泽东选集》第二版第一卷。",
  experiment: "挑一个你有意见、但没有仔细看过的系统或团队：评审里你总在批评的那个服务，或者你觉得值班安排很糟的那个团队。在你再发表任何意见之前，约三到五个真正维护它的人谈三十分钟，其中包括最新加入的人。事先写好五个问题，自己提问，自己记录，然后把听到的和你原来的看法逐条对照。",
  reflection: "你现在对别的团队工作的哪些看法，经得起和真正干活的人开一次调查会？",

{
  id: "knowledge-begins-in-practice",
  track: "practice", level: "v1",
  title: "要知道梨子的滋味，就得亲口吃一吃",
  source: "《实践论》（一九三七年七月），第一卷",
  idea: "认识从亲身参加实践得来的感觉材料开始。感觉材料积累得足够丰富、足够真实，才会飞跃成抓住本质的概念和判断；材料零碎或者失真，在它上面推出的结论也靠不住。",
  why: "《实践论》原是一九三七年四月到七月毛泽东在延安抗日军事政治大学讲哲学课的提纲中的一节，新中国成立后经他较大修改才单独发表，今天读到的是修改过的文本。选集的题解说，它针对党内两种人：拒绝中国革命的经验、只会搬用书本词句的教条主义者，和拘守片断经验、看不见全局的经验主义者。\n\n他用当时的一个场面讲认识的两个阶段。外面的人到延安考察，头一两天看到地形、街道、房屋，参加宴会、晚会和群众大会，听到各种说话，看到各种文件，这是感性认识，只是现象、片面和外部联系。这样的感觉和印象反复多次，脑子里才发生一个突变，产生概念，抓住事物的本质和内部联系，再用判断和推理得出结论。前提是感觉材料“十分丰富”而且“合于实际”，既不零碎，也不是错觉。\n\n感觉材料只能从实践中来。“你要知道梨子的滋味，你就得变革梨子，亲口吃一吃。”常有同志接受任务时说“没有把握”，他的解释是这些人没有接触过这类工作；在工作里经过一个时期，又肯虚心体察情况，就能自己得出应该怎样做的结论。",
  failureMode: "文中批评两头。一头是哲学上的“唯理论”，以为理性可以不从感性得来，结果理性成了无源之水。另一头是拿着片面印象就下结论的人：“跑到一个地方，不问环境的情况，不看事情的全体”，也不触到事情的本质，就发号施令，文中说这样的人“是没有不跌交子的”。\n\n在今天的工程团队里，它的样子是：只看过仪表盘上的平均值，就给一个系统的稳定性下结论；自己没值过一次班、没处理过一次告警，就去设计值班制度和告警规则。",
  worked: "这个方法在毛泽东亲自下去的时候起过作用。据中共中央党史研究室编的《中国共产党大事记》，一九五八年十一月第一次郑州会议之前，他视察河北、河南的一些农村，发现人民公社问题上存在许多混乱现象，开始着手纠正已经认识到的错误。一九六一年中央号召大兴调查研究之后，五六月间的中央工作会议在中央和各地负责人调查研究的基础上，从农村人民公社工作条例里取消了公共食堂和供给制的规定。\n\n断裂出在感觉材料的来路上。文中的认识者是亲身参加实践的人，而治理一个国家的人，手里的“现象”多半是层层上报的数字。据同一部大事记，一九五八年六月华东地区农业协作会议提出，两年内把粮食产量提高到每人平均一千斤到一千五百斤，而当年全国实际是每人四百零六斤。一九五九年四月二十九日，毛泽东给省、地、县、公社、队、小队六级干部写信，要他们收获多少就讲多少，并承认“有许多假话是上面压出来的”。《实践论》要求感觉材料合于实际，却没有讨论上级的期待会怎样改变送到上级面前的材料。",
  experiment: "选一个你要对它下判断、但一直只通过仪表盘和周报了解的系统。这周找一个机会亲手碰它：跟一次值班，亲手做一次发布，或者把一条告警从触发跟到处理完。动手之前写下你现在对它的三个判断，事后逐条标出哪些被证实、哪些被推翻、哪些是你原来根本没看到的。",
  reflection: "你对哪个系统的判断，完全来自别人汇报给你的数字？这些数字是谁、为了回答什么问题整理出来的？",
  recall: {

    a: "感觉材料要十分丰富，不能零碎不全；要合于实际，不能是错觉。在这样的材料上去粗取精、去伪存真、由此及彼、由表及里，才能造出正确的概念和理论。\n\n容易忘的是材料的来路。文中的认识者是亲身参加实践的人；在一个大组织里，决策者手里的材料多半是层层汇报，汇报可能已经按上面想听的改造过了。"

{
  id: "practice-is-the-test-of-truth",
  track: "practice", level: "v1",
  title: "结论要回到实践中去检验",
  source: "《实践论》（一九三七年七月），第一卷",
  idea: "一个结论推理出来了，还不等于证明了。它对不对，不看自己觉得如何，也不看是谁说的，要拿回实践中去，看能不能达到预想的结果。",
  why: "《实践论》前半部分讲认识怎样从感觉上升到概念和理论。讲到这里，毛泽东说只说了问题的一半，而且是“非十分重要的那一半”。理论是否符合客观实际，在由感性到理性的过程中没有完全解决，也不能完全解决；只有把理论再拿回实践中去，看它能不能达到预想的目的，才能判定。所以他说，从理性认识到实践的那一次飞跃更重要。\n\n判定的标准因此不在人的脑子里：“不是依主观上觉得如何而定”，而是依社会实践的结果。失败也是这个标准的一部分：思想不合规律，就会在实践中失败；从失败取得教训，改正思想，才能变失败为胜利。文中引了“失败者成功之母”和“吃一堑长一智”。\n\n这条标准没有给任何理论留例外。文中说马克思列宁主义被称为真理，也是因为它被后来的革命实践所证实；马克思主义看重理论，“正是，也仅仅是”因为它能指导行动。选集的题解说，这篇文章是为揭露党内的教条主义而写的，那些人拒绝中国革命的经验，只会搬用马克思主义书籍里的只言片语。",
  failureMode: "它针对两种做法：一种是用主观上的确信判定理论的对错；一种是有了理论，“空谈一阵，束之高阁，并不实行”，从来不拿去碰实际。两者的共同点，是理论从没接受过结果的检验。\n\n在今天的工程团队里，它的样子是：设计评审通过了，大家就当这个设计已经被证明是对的，上线以后没人回头看它承诺的延迟和成本有没有兑现；复盘的改进项都关了，也没人检查同类事故是否真的少了。",
  worked: "毛泽东自己没有守住这条标准。据中共中央党史研究室编的《中国共产党大事记》，全国粮食产量从一九五八年的两亿吨降到一九五九年的一亿七千万吨，一九六一年是一亿四千七百五十万吨。一九六二年一月的七千人大会上，毛泽东作了自我批评；同年九月的八届十中全会上，他严厉指责所谓“黑暗风”，大事记对这个词的解释是：对当时严重困难形势作充分估计的观点。\n\n这条标准后来被用在了毛泽东自己的话上。一九七七年二月七日，《人民日报》、《红旗》杂志和《解放军报》的联合社论提出，凡是毛泽东作出的决策都要维护，凡是他的指示都要遵循，后来被概括为“两个凡是”。一九七八年五月十一日，《光明日报》以特约评论员名义发表《实践是检验真理的唯一标准》，新华社当天转发，第二天《人民日报》和《解放军报》转载。据人民网《中国共产党新闻》的党史条目，汪东兴指责这篇文章“实际上是把矛头指向主席思想的”，华国锋要宣传部门“不表态”、“不卷入”，邓小平、叶剑英、陈云等人则支持讨论。\n\n同年十二月的十一届三中全会高度评价了这场讨论。一九八一年的《关于建国以来党的若干历史问题的决议》把“两个凡是”定为错误方针，并说以为毛泽东说过的话都是不可移易的真理、只能照抄照搬，这种态度“也是完全错误的”。",
  experiment: "找一个三个月以前上线、当时在设计评审里通过的改动。翻出评审文档里写的预期效果，比如延迟、成本或者事故数，再拉出上线以来的真实数据，逐条对照，写三行：预期是什么，实际是什么，差距从哪里来。如果当初根本没写预期，这就是这次检验的第一条发现，把它补进团队的评审模板。",

{

  cheat: "计划对不上实际时两头都查：是不是落在了实际后面，是不是跑到了阶段和条件具备之前，别只查其中一头。",

  why: "《实践论》的最后几段讲认识运动为什么没有终点。人们根据认识定出思想、理论、计划、方案，拿去实践；文中说，原定的计划毫无改变地实现出来的事“是很少的”，因为做事的人受科学和技术条件的限制，客观过程的本质也还没有充分暴露。部分地改，全部地改，都是常有的，许多时候要反复失败多次才能纠正。\n\n即使一个阶段的计划完成了，过程本身还在往前走，认识也要跟着走。这里他划了两条界线。一边是思想落后于实际：看不出过程已经推进到新阶段，“跟在车子后面怨恨车子走得太快了”，在历史上表现为右倾机会主义。另一边是“左”翼空谈：有些人把幻想当作真理，有些人把只在将来有现实可能性的理想勉强放到现在来做，离开了当前大多数人的实践，在行动上表现为冒险主义。两种错误的共同点，是主观和客观分裂、认识和实践脱离。\n\n最后他把整个过程归结为一个循环：实践、认识、再实践、再认识，每一轮都比上一轮高一级。计划在这里不是一次性的决定，而是一个反复被实践修改的东西。",
  failureMode: "文中点了两种人。一种是革命队伍中的顽固派，认识停在旧阶段，看不见情况已经变了。另一种是“左”翼空谈主义者，把将来才可能的事拿到现在来做。它们方向相反，文中把它们归为同一类错误：认识脱离了当前的实践。\n\n在今天的工程团队里，前一种是：系统已经从单体拆成几十个服务，容量规划和值班手册还停在单体时代。后一种是：现有系统还没跑稳，就把三年后的目标架构当作这个季度的迁移计划，要求所有团队同时切换。",
  worked: "一九五六年，中央按实际情况修改过一次计划。据人民网“网上党校”介绍反冒进的文章，一九五五年底起各地层层抬高指标，到一九五六年四月，钢材、水泥、木材严重不足，许多工地停工待料。周恩来一月间就提出计划要“实事求是”，不能“盲目冒进”；六月四日刘少奇主持中央会议，确定既反保守又反冒进；六月二十日《人民日报》社论说，下面的急躁冒进有很多是上面逼出来的。这一年工业总产值比上年增长百分之二十八点一。\n\n这次修改随后被定为错误。据中共中央党史研究室编的《中国共产党大事记》，一九五八年一月南宁会议上，毛泽东再次批评一九五六年的反冒进，说它使六亿人民泄了气，是方针性错误；大事记的评价是，这次会议使党内急于求成的“左”倾思想迅速发展起来。同年八月北戴河会议的人民公社决议说，共产主义在我国的实现“已经不是什么遥远将来的事情了”，正是文中说的把将来的理想勉强放到现在来做。\n\n一九八一年的历史决议说，从一九五八年底到一九五九年七月庐山会议前期，毛泽东和党中央曾努力纠正已经觉察到的错误；庐山会议后期，毛泽东发动对彭德怀的批判，进而在全党开展“反右倾”斗争。大事记说，这场斗争在经济上使“左”倾错误更加发展，并延续了更长时间。",
  experiment: "拿出你正在推进的一次迁移或改造的计划，对照这两周实际发生的事，逐项标出：哪些假设已被证实，哪些被推翻，哪些还没碰到。为被推翻的几项写下计划要怎么改；再检查一遍，计划里有没有把将来才具备条件的步骤排进了本季度。改完的版本发给参与的人，写明改了什么、依据是哪条实际情况。",
  reflection: "你手上的计划，最近一次因为实际情况而修改是什么时候？如果一直没改，是情况没变，还是没人去看？",
  recall: {
    q: "《实践论》说认识落后于实际和超越阶段是两种方向相反的错误。它们的共同点是什么？",
    a: "都是主观和客观分裂、认识和实践脱离。前一种认识停在旧阶段，表现为右倾；后一种把只在将来才有现实可能的事勉强放到现在来做，表现为冒险主义。\n\n容易忘的是两头要同时防。只把落后当作错误的地方，超越阶段会被当成积极；一九五八年对一九五六年反冒进的批判，就是这样发生的。"
  },
  deepDive: "这是我正在推进的计划和这两周的实际进展。帮我找出哪些步骤落在了实际后面，哪些步骤跑到了条件具备之前，并建议各自怎么改。"
},
{
  id: "trace-indirect-knowledge-to-practice",
  track: "practice", level: "v1",
  title: "间接的知识，要问是谁亲身得来的",
  source: "《实践论》（一九三七年七月），第一卷",
  idea: "一切真知都从某个人的直接经验发源，但任何人的知识大部分是间接得来的。一条间接知识可不可靠，要看它在最初那个人那里，是不是从实践中科学地抽象出来的。",
  why: "这一段在《实践论》说完“一切真知都是从直接经验发源的”之后。毛泽东紧接着收了一步：人不能事事直接经验，事实上多数知识都是间接经验的东西，古代的和外域的知识都是。这些知识在古人、外人那里是直接经验，如果当时符合“科学的抽象”，科学地反映了客观事物，就可靠，否则就不可靠。所以一个人的知识只有两部分，直接经验的和间接经验的；而就知识的总体说，没有哪种知识能离开某个人的直接经验。\n\n他用一句老话说明这一点：“秀才不出门，全知天下事”。在技术不发达的古代这是空话，在技术发达的现代可以实现；但真正亲知的仍是天下实践着的人，他们的知识经过文字和技术传到秀才手里，秀才才能间接地知天下事。\n\n反面是他说的“知识里手”（湖南话，内行的意思）：有了道听途说的一知半解，便自封为天下第一。文中说，知识的问题来不得半点虚伪和骄傲，需要的是诚实和谦逊。",
  failureMode: "它针对两种做法。一种是“知识里手”，把听来的东西当成自己的内行。另一种方向相反，以为只有亲眼见过的才算数；文中的回答是，多数知识本来就是间接的，要问的只是它最初怎样得来。\n\n在今天的工程团队里，前一种是：读过一篇厂商的博客或者别家公司的事故复盘，就在评审里当作定论引用，没人问那些数字是在什么规模、什么负载下得出来的。后一种是：别的团队已经踩过的坑，非要自己再踩一遍才肯信。",
  worked: "这篇文章本身就是用间接知识做成的。据中共中央党史和文献研究院龚格格的版本考证，一九三六年十一月到一九三七年四月，毛泽东在苏联学者西洛可夫、爱森堡等人著的《辩证法唯物论教程》的两个版本上，写下近一万三千字的批注，随后在抗日军政大学讲哲学课。按文中的标准，这是正当的做法：从别人的实践和抽象里学，再拿到中国的实际里去用。今天读到的《实践论》，是新中国成立后经他较大修改、一九五〇年底才发表的文本。\n\n反面的例子来自一九五八年的农业。据中共中央党史研究室编的《中国共产党大事记》，一九五九年四月二十九日，毛泽东给省、地、县、公社、队、小队六级干部写了一封《党内通信》，谈包产、密植等六个问题。信里说，一个劲要求密植的，是缺少经验的青年干部和某些上级机关，老农怀疑，中年人也有怀疑；密度应当请这几种人一起开会商量，由生产队、生产小队决定，上面下达的硬性密植命令没有用处，而且害人。",
  experiment: "挑一条你们团队当作依据的间接知识：一份厂商的基准测试、一份别家公司的事故复盘，或者一条从上一个团队带来的经验。追到它的出处，写下三件事：最初是谁、在什么规模和负载下亲身得来的；他们的条件和你们差在哪里；你们自己有没有哪一次直接经验支持或者反驳它。追不到出处的，在文档里标成未经验证。",
  reflection: "你最近在评审里引用过的一条“常识”，你知道它最初是谁亲身得来的吗？",
  recall: {
    q: "《实践论》既说一切真知都从直接经验发源，又说多数知识是间接的。它用什么标准判断一条间接知识可不可靠？",
    a: "看它在最初那个人那里是不是直接经验，而且当时是否符合“科学的抽象”，即科学地反映了客观事物。符合就可靠，不符合就不可靠。\n\n容易忘的是这条标准两头都管：间接知识不因为来自书本、外国或者权威就可靠，也不因为不是自己亲见就不可靠；要追的是它最初的实践和抽象。"
  },
  deepDive: "这是我们团队做技术决定时依赖的几条外部经验和基准数据。帮我逐条追问：它最初来自谁的什么实践，和我们的条件差在哪里，我们该用什么样的小规模直接经验去验证它。"
},
{
  id: "seek-truth-from-facts",
  track: "practice", level: "v3",
  title: "“实事求是”拆开读：事实、规律、去研究",
  source: "《改造我们的学习》（一九四一年五月），第三卷",
  idea: "毛泽东把“实事求是”拆成三个字来定义：“实事”是客观存在的一切事物，“是”是这些事物的内部联系，也就是规律性，“求”是我们去研究。照这个定义，做法是从当地的实际情况出发，详细占有材料，引出“固有的而不是臆造的规律性”，把它当作行动的向导；凭主观想象、一时的热情、死的书本，都不算数。",
  why: "这是一九四一年五月毛泽东在延安干部会上所作的报告。篇首的题注说，它和《整顿党的作风》《反对党八股》是整风运动的基本著作。他先回顾党的二十年，说马克思列宁主义的普遍真理和中国革命的具体实践日益结合，然后指出还有很大的缺点，并分三方面讲：不注重研究现状，不注重研究历史，不注重马克思列宁主义的应用。第一方面，党收集的材料零碎，研究没有系统，“缺乏调查研究客观实际状况的浓厚空气”；第二方面，许多学者“言必称希腊，对于自己的祖宗，则对不住，忘记了”，近百年的经济史、政治史、军事史、文化史，他说简直还没有人认真动手去研究。\n\n报告的第三部分把两种态度并排放在一起。主观主义的态度，是对周围环境不作系统周密的研究，只懂得希腊，不懂得中国，为学理论而学理论，“无的放矢”。另一种态度是有的放矢：“的”是中国革命，“矢”是马克思列宁主义，学它是为了从里面找立场、观点和方法，去射中国革命这个靶子。“实事求是”的三字解释就放在这一段里，后面紧跟着一句要求：不凭主观想象，不凭一时的热情，不凭死的书本，而凭客观存在的事实，在一般原理的指导下，从材料里引出正确的结论。这种结论不是“甲乙丙丁”的现象罗列，也不是夸夸其谈的滥调。\n\n报告最后提了三条：向全党提出系统地周密地研究周围环境的任务；组织力量分工研究近百年的中国史；干部教育以研究中国革命的实际问题为中心。这个方法真正要求的是两件事：先把对象描述清楚，再选理论；结论要能从手里的材料推出来，而不是从一份现成的清单上抄来。",
  failureMode: "报告点名的错误有几种：“闭塞眼睛捉麻雀”和“瞎子摸鱼”，是对环境不作调查就去工作；“想当然”，是仅凭一知半解就发号施令；“钦差大臣”满天飞，是自以为是、拿着现成的东西到处指点；还有把感想当政策，以及学了一套理论却不会用，在延安学了，到富县就不能应用。\n\n在今天的工程团队里，它的样子是：团队看了一场大厂的架构分享，决定引入同样的多集群调度方案，却没有人翻过自己过去一年的事故记录，也没有人量过自己的负载分布。方案上线以后，解决的是别人的问题，团队自己最常出的那类故障原封不动。",
  worked: "这个词不是毛泽东造的。多个来源一致说，“修学好古，实事求是”出自《汉书》，是班固对河间献王刘德的评语；颜师古的注释在不同来源里措辞不一，这里不引。毛泽东在这篇报告里给了三字拆解的定义。一九八一年的《关于建国以来党的若干历史问题的决议》把实事求是列为毛泽东思想“活的灵魂”三个基本方面之首，定义为“从实际出发，理论联系实际”，并写到他“在延安整风运动前夕指出，主观主义是共产党的大敌，是党性不纯的一种表现”，这句话和本篇的论断相同。\n\n这篇报告自己也有一处需要对照的地方。它批评“只懂得希腊”的学风，却在提议（三）里把《苏联共产党（布）历史简要读本》定为研究马克思列宁主义的中心材料，称它是理论和实际结合的典型，“在全世界还只有这一个完全的典型”。报告的理由是，要看列宁、斯大林怎样把普遍真理和苏联的具体实践结合起来，才知道在中国应该怎样工作；这是文本里原有的张力，原因和用意以报告自己的说法为准。\n\n这一条后来被违背的记录也在《决议》里。它写道，一九五八年的“大跃进”是“没有经过认真的调查研究和试点”就“轻率地发动”的，并说，对毛泽东的言论采取教条主义态度，“甚至不愿实事求是地承认毛泽东同志晚年犯了错误”，这种态度也是完全错误的。《决议》又写到，一九七八年十二月的十一届三中全会高度评价了关于真理标准问题的讨论，确定了“解放思想、开动脑筋、实事求是、团结一致向前看”的指导方针。",
  experiment: "这个练习只用你自己的环境。选一个你们团队近两年从外部引进的方案，比如一种扩缩容策略、一套告警框架或一种发布流程。分三栏写：“事”，你们过去六个月真实发生的事故和工单，按类别各有多少；“理”，这个方案声称能解决哪一类问题，机制是什么；“求”，拿“事”那一栏去对“理”那一栏，这个方案本来能挡住其中多少件。如果挡不住的比挡得住的多，写一个一周内能做完的小实验，用你们自己的数据判断它该留、该改还是该退。",
  reflection: "你上一次为一个技术决定去查的，是别人的案例，还是自己系统的记录？两者的比例如何？",
  recall: {
    q: "按《改造我们的学习》，“实事求是”的“实事”“是”“求”各指什么？它要求怎样得出结论？",
    a: "“实事”是客观存在的一切事物，“是”是事物的内部联系即规律性，“求”是我们去研究。结论要从详细占有的材料里引出，依据是客观事实，而不是主观想象、一时的热情或死的书本。\n\n容易忘的是后半句：引出的规律性必须是“固有的而不是臆造的”，而且结论不能是“甲乙丙丁”的现象罗列。另外，报告批评的是只懂外国、不懂自己，不是不要学外国的理论，学它是为了有的放矢。"
  },
  deepDive: "这是我们团队近两年引进的一个外部方案，以及过去六个月我们自己的事故和工单记录。帮我按事、理、求三栏检验：这个方案声称解决的问题，在我们自己的记录里有多少证据；我有没有把别人的案例当成我们的事实；以及一周内最小的、能用我们自己的数据证伪它的实验是什么。"
},
{
  id: "split-the-verdict-into-itemised-facts",
  track: "practice", level: "v1",
  title: "一句“糟得很”，要拆成逐件的账",
  source: "《湖南农民运动考察报告》（一九二七年三月），第一卷",
  idea: "同一件事有相反的两种看法，就有相反的两种议论。面对一句笼统的总评，毛泽东的办法是三步：到现场去，向亲历的人开调查会；把对象做过的事分类总计，逐件检查；再分层看各类人的态度，看每一种议论站在谁的位置上。总评是结论，逐件的账才是证据。",
  why: "这篇报告写于一九二七年三月，题注说，写它是为了答复当时党内党外对农民革命斗争的责难。他从一月四日到二月五日，共三十二天，走了湘潭、湘乡、衡山、醴陵、长沙五县，在乡下和县城召集有经验的农民和农运工作同志开调查会，“仔细听他们的报告”。开头他就说，许多农民运动的道理，和在汉口、长沙从绅士阶级那里听来的完全相反。\n\n他先把相反的议论摆出来：从中层以上社会到国民党右派，一言以蔽之曰“糟得很”；有人说农会要办，但是做得“过分”；右派说这是“痞子运动”。拆这些议论，他用了两种办法。一种是看它站在谁的位置上：他把“糟得很”定为站在地主利益方面的理论，说乡村的情形在农民和在绅士看来正好相反。另一种是逐件检查：为了答复指摘，“我们须得把农民所有的行动过细检查一遍”，结果分类总计为十四件，从把农民组织进农会、在政治上和经济上打击地主，到禁牌赌鸦片、清匪、办夜学、办合作社、修路修塘坝，每一件都写出做法、地点和数字，最后问一句“哪一件不好”。\n\n他还把农民分了层。富农、中农、贫农的态度各别：富农先是反对，后来才慢慢入会，中农的态度是“游移”的，贫农最积极。文中给的数字是，长沙的调查里贫农占乡村人口百分之七十，中农百分之二十，地主和富农百分之十；衡山的乡农会职员里，赤贫占百分之五十，次贫占百分之四十。这个方法真正要求的是三件事：先听当事人怎么说，再把总评拆成逐项的账，最后分清每一类人各自的处境，因为同一件事落在不同的人头上，是不同的事。",
  failureMode: "报告针对的是三种议论，“糟得很”、“过分”和“痞子运动”，它们共同的毛病是只给结论，不给账。文中还点出一种更一般的位置：不下去看，“站在他们的后头指手画脚地批评他们”。\n\n在今天的工程团队里，它的样子是：平台团队推了一次强制迁移，收回旧集群，关掉没有登记的定时任务。管理层从几个业务负责人那里听到平台太激进了的说法，要求暂停，没有人把这次迁移做过的事列成清单：迁了多少个服务，回滚了几次，哪些抱怨来自被收回了权限的一方，哪些来自真的丢了数据的一方。反过来的样子同样常见：平台团队自己的汇报里只有一句整体顺利。",
  worked: "这篇报告发表时，它的论点正处在争议中。据中文马克思主义文库瞿秋白《序》页的注释，报告的前半部分曾在《向导》周报上刊出，没有刊完；瞿秋白对它很重视，把全文交给中共在武汉办的长江书局，以《湖南农民革命》为书名出版，并写了序，序言的日期是一九二七年四月十一日。序里把“匪徒，惰农，痞子”这几个词当作反动绅士给农民协会的称呼，和报告里的议论是同一个拆法。《战士》周报和《向导》哪一家先刊，各处说法不一，这里不判断。\n\n大约七周后，五月二十一日长沙发生马日事变。中共中央党史网站（12371.cn）上的条目说，它使中共湖南党组织受到严重破坏；毛泽东被派去重建省委，称它是上海事件的继续。报告里描写的农会权力，按文中的话是湘潭、湘乡、衡山等县“地主权力完全推翻”，这种状态在报告写成两个多月之后就被扭转。选集的编者注也记下了一处：文中说的挨户团，在一九二七年革命失败以后，许多地方被地主所夺取，变成了反革命的武装组织。\n\n读这篇报告，还要分清方法和成品。方法是逐件检查，成品是一份答辩，题注已经说明写作的目的在先。文中的材料有它自己写下的范围：去年十一月省农民协会的统计是七十五县中三十七县有组织，湘西还在开始组织，而作者走的是五个最发达的县，却写“我想这些情形，很多地方都有”，并预言几万万农民将要起来。数字有的注明出自省农会统计，有的写“据长沙的调查”“据衡山的调查”，没有交代样本和核对办法。对“过分”举动的辩护，其中一句断言“罚不当罪的极少”，文中没有逐案的材料。选集编者注[9]在富农入会一处写明：“不应当容许富农加入农会。”",
  experiment: "挑一条这个季度在团队或管理层里流传的总评，比如“迁移太激进了”“值班一团糟”“新的准入检查太严了”。把这条总评涉及的做法逐件列出来，至少十件，每件一行：做了什么，涉及多少服务或租户，有什么记录可查（工单、回滚、告警、延迟数据）。再加一列：这条抱怨主要出自哪一类人，是受影响最重的、受益最多的，还是只听说的。最后逐件标“站得住、站不住、没有证据”，数一数，写一句话说明这条总评有几成成立。",
  reflection: "你们团队里流传最广的一句总评，你知道它是由哪几件具体的事累积出来的吗？说这句话的人，是亲历者还是转述者？",
  recall: {
    q: "面对“糟得很”“过分”“痞子运动”这些议论，《湖南农民运动考察报告》用什么办法检验？",
    a: "三十二天走五个县，向亲历的人开调查会；把农民的行动分类总计，列成十四件大事，逐件问好不好；再把富农、中农、贫农分开，看各自的态度并给出比例。\n\n容易忘的是它的限度：报告是为答复责难而写，样本是五个最发达的县，而全省七十五县中当时只有三十七县有组织；数字的核对办法文中没有交代。"
  },
  deepDive: "这是我们团队里流传的一句总评，以及我手上能找到的具体事实。帮我把总评拆成逐件的账，指出哪几件缺证据，这句话主要是谁在说，他们各自站在什么位置，以及我在哪些地方是把转述当成了调查。"

{
  id: "two-incomplete-kinds-of-knowledge",
  track: "practice", level: "v3",
  title: "两种不完全的知识，各向缺的那一边走",
  source: "《整顿党的作风》（一九四二年二月一日），第三卷",
  idea: "书本上的知识和偏于感性、局部的实际经验，毛泽东都称为不完全的知识，各有片面性。教条主义和经验主义看上去相反，却同属主观主义，“只看到片面，没有看到全面”。办法不是选边，而是让有书本知识的人向实际方面走，让有经验的人向理论方面走，再把两者结合起来；衡量一个人的理论水平，看他能说明几个实际问题，而不看他背了多少。",
  why: "这是一九四二年二月一日毛泽东在中共中央党校开学典礼上的演说，题注只有这一句。他先说党的总路线正确，工作有成绩，但学风、党风、文风有不正的地方，毛病分别是主观主义、宗派主义和党八股，这三样现在已不占统治地位，不过是一股“歪风”。学风被他列为“第一个重要的问题”。他的判断是理论落后于实践：鸦片战争到现在一百年，“还没有产生一本合乎中国经济发展的实际的、真正科学的理论书”。篇末注释说明，他提到的中央决定，是一九四一年八月一日的《中央关于调查研究的决定》。\n\n论证的核心是一个划分。“有两种不完全的知识”：一种是现成书本上的知识，它是前人总结出来的，“这种知识是人家证明了，而在他们则还没有证明的”；另一种是偏于感性和局部的知识，属于有经验的实际工作者，缺的是理论。两者都有片面性，只有结合才产生比较完全的知识。所以有书本知识的人要去参加实际工作，有经验的人要认真读书，使经验“带上条理性、综合性”，才不会把局部经验误认为普遍真理。教条主义和经验主义“是从不同的两极发生的东西”，两者都是主观主义。他又认为眼下教条主义更危险，理由是它“容易装出马克思主义的面孔”，吓唬工农干部。\n\n他给党校定了一条评分的规矩：看一个学生学了马克思列宁主义以后怎样看中国问题，能说明一两个实际问题就算有几分成绩，说明的越多、越普遍、越深刻，成绩越大。这个方法真正要求的是三件事：给自己的知识标明来源和范围，是前人证明过的还是自己证明过的，是局部的还是普遍的；让两类人各自朝缺的那一边走；用能说明几个实际问题来衡量，而不用读了多少书或干了多少年来衡量。",
  failureMode: "文中点名的是两种做法。一种是教条主义：把书本上的某些个别字句看作“现成的灵丹圣药”，从第一章到第十章背得烂熟，却“完全不能应用”。另一种是经验主义：以自己的经验为满足，把局部经验误认为“普遍真理”。两种都是主观主义。\n\n在今天的工程团队里，它的样子是：一位刚从大公司来的工程师带着一份最佳实践清单，在设计评审里逐条对照，每条都有出处，却没有一次解释过这个团队上个月那场事故是怎么发生的。另一位在一个存储集群上值了五年班的工程师，把这个集群上一直有效的重启顺序当成通用规则，推广到一致性模型不同的另一套系统里。两人互相看不起，一个说对方不懂原理，一个说对方不懂生产，团队分成两派，各守着一半的知识。",
  worked: "这篇演说里的区分，三年后进入了党的正式结论。一九四五年四月二十日六届七中全会扩大会议通过的《关于若干历史问题的决议》（这里用的是维基文库收录的文本）写道：教条主义的特点是不从实际情况出发，而从书本上的个别词句出发；经验主义不从书本出发，而从狭隘的经验出发；“经验主义和教条主义的出发点虽然不同，但是在思想方法的本质上，两者却是一致的”。决议还说，六届四中全会以后，以陈绍禹、秦邦宪为首的教条主义分子使“左”倾路线在党内统治了四年之久，其代表者曾污蔑毛泽东是“狭隘经验主义者”，而毛泽东在土地革命时期再三强调“没有调查就没有发言权”。这是党对自己历史的结论，不是第三方的研究，也说明两个标签在党内的斗争里都被当作武器用过。\n\n决议还把演说里的排序改了一次。一九四二年二月的演说说，现在还是教条主义更危险。一九四五年的决议写道，教条主义者缺乏经验主义者的合作就不易“流毒全党”，而在教条主义被战胜以后，经验主义更成为党内马克思列宁主义发展的主要障碍；对经验主义“还缺乏足够的批判”，所以“不但要克服主观主义的教条主义，而且也要克服主观主义的经验主义”。同一个党在三年里给两种偏差的危险重新排了位，理由是一端被压下去之后，另一端自己长出来。演说里只讲了两者要结合，没有预告这一点。\n\n演说给的测试，看能说明几个实际问题，没有交代由谁判定一个问题已经被说明，说错了怎么办。党校后来是否按这条规矩评过分，各处的结果如何，这里没有查到记录，不作判断。",
  experiment: "挑一个你们团队眼下正在争论的技术决定。把双方的论据各列出来，每条标出来源：A 是书本（文档、论文、厂商基准、别人的复盘），B 是亲手（你们自己系统上的测量、事故、实验）；再标范围，局部（一个集群、一类负载）还是普遍。数一数哪一方只有 A，哪一方只有 B。然后为每一方缺的那一半各写一个一周内能做完的小任务：只有书本论据的，在自己的系统上做一次测量；只有经验论据的，找一份最可能推翻自己结论的外部材料读完，写下它的适用条件。最后用你们最信的那套理论去解释团队过去半年的三次事故，数它能说明几次。",
  reflection: "你上一次说“按理应该”的时候，依据的是书上写的，还是你自己测过的？",
  recall: {
    q: "《整顿党的作风》为什么把教条主义和经验主义归为一类？克服它们的办法是什么？",

  },
  deepDive: "这是我们团队正在争论的一个技术决定，双方各自依据的材料，以及我对每条材料来源的判断。帮我分清哪些是别人证明过的、哪些是我们自己证明过的，指出每一方缺的那一半是什么，并设计一个一周内能补上它的最小任务。"

{
  id: "roll-out-in-batches-each-must-beat-the-old-way",
  track: "practice", level: "v5",
  title: "一批一批推，每一批都要比旧办法更好",
  source: "《关于农业合作化问题》（一九五五年七月三十一日），第五卷",
  idea: "推广一件新办法，毛泽东在这篇报告里讲的是一套节奏：每一步都按自愿和互利的原则，让愿意的人先来；每一批都拿结果验收，合作社必须比单干户和互助组增产，更不能减产；一批办完要停下来整顿，不许一路不停；控制数字每年按实际情况定一次，一年检查几次；还没想通的人不去拉，等示范的产量超过他们自己的，他们就会来。",
  why: "这是一九五五年七月三十一日毛泽东在中共中央召集的省委、市委、自治区党委书记会议上的报告。它的主调是加快：开头批评某些同志像“小脚女人”，东摇西摆地走路，老是埋怨走快了，要求领导不要落在群众运动的后头。这一条只读它里面的另一部分，也就是怎样推进的方法，读法上要把两部分分开。\n\n方法的骨架是三步和一套验收。三步是互助组、小型半社会主义合作社、大型社会主义合作社，每一步都“按照自愿和互利的原则”，让农民从自己的经验里提高认识。每一步都必须保证每年增产，合作社的产量要超过单干户和互助组，因为“如果这样就失败了，何必要合作社呢”。他举出当时六十五万个社的情况：百分之八十以上增产，增产幅度在百分之十到三十，百分之十几不增不减，百分之几减产，减产的最不好，要用大力整顿。他还说，办社之前要做五项准备，“不打无准备的仗，不打无把握的仗”；每年按实际情况定一次控制数字，一年检查几次，“不要使问题成了堆才去作一次总解决”；各地发展一批之后，必须有一段停下来整顿的时间，“不许有停顿、不许有间歇”的想法是错误的。\n\n对还没想通的人，他的办法是不拉。先让贫农和下中农里的积极分子组织起来，暂时不积极的“不要勉强地拉进来”，富裕中农暂时也不吸收，等到合作社的单位面积产量提高到同他们相等甚至更高，他们才会下决心入社，这样可以避免命令主义。河北一个只有六户的小社，三户老中农坚决要走，让他们走了，留下三户贫农，社也保存下来。这个方法真正要求的是三件事：验收标准要在推广之前就定得比旧办法好，批与批之间的停顿要写进计划，愿意的先来，不愿意的靠结果去拉，而不靠指标去压。",
  failureMode: "报告点名的偏差有三种。一种是“前怕龙，后怕虎”，浙江出现过一个“坚决收缩”的方针，一下子从五万三千个合作社中解散了一万五千个，报告说这是“惊惶失措的情绪”支配下定出来的。一种是“专门追求合作社和农户的数目字”，不顾质量。还有一种是强迫命令，一方面排斥贫农入社，另一方面强迫富裕中农入社。\n\n在今天的工程团队里，它的样子是：平台团队年初定了迁移完成率九成的目标，每周只看一条完成率曲线，没有人看迁完之后的错误率和成本有没有比旧方案好；第一次事故以后又把所有迁移冻结三个月，没有分清是哪一批、哪个环节出了问题。两种做法的共同点是只看数字，不看每一批各自的结果。",
  worked: "这套节奏在报告自己的数字里就有一处裂缝。报告列出的计划数字被一再超过：一九五三年十二月的决议计划到一九五四年秋收发展到三万五千八百多个社，实际发展到十万个；一九五四年十月计划六十万个，实际完成六十七万个。报告把这当作群众的积极性，同时批评专门追求数目字的偏向。它又指出，这些社大部分在北方几个解放较早的省份，却用前三批共十万个社都巩固了，来推论后面的五十五万个社没有理由不巩固。样本是最早、条件最好的一批，这是报告自己写下的前提。\n\n报告之后的进度，据中国共产党新闻网“网上党校”转载新华网的介绍，是这样的：一九五五年初，由于速度过猛，不少地方出现强迫命令、违反自愿互利原则的现象，中央发出整顿和巩固的通知，三月提出“停、缩、发”的方针；五月提出一九五六年发展到一百万个社，六月政治局批准了这个计划，毛泽东随后主张修改计划，加速发展，农村工作部部长邓子恢不赞成，认为不宜发展过快，被毛泽东认为思想右倾；七月三十一日这份报告也批评了邓子恢等人的“右倾”。十月七届六中全会要求到一九五八年春在全国大多数地方基本普及初级社，会后三个月左右就基本实现了合作化，到一九五六年底，参加合作社的农户占总农户的百分之九十六点三，其中参加高级社的占百分之八十七点八。\n\n对照报告自己的时间表，一九五八年春约有一半农户（五千五百万户左右）加入半社会主义的合作社，其余一半在一九六〇年，大规模由半社会主义转为全社会主义则放在一九六〇年以后；一九五六年底的数字远远超出了这个时间表。报告规定了控制数字每年定一次，也规定了发展一批要停下来整顿，但没有说明，当地的整顿结果达不到标准而控制数字又在加大时，由谁、凭什么可以不执行。这里引用的进度数字来自这一页转载的介绍，没有另外核对原始统计，不同来源的口径可能不同。",
  experiment: "针对你们现在要推广的一件事（迁移、新的发布流程、新的准入检查），写一份分批方案，与现有的“限期全部完成”方案对照。方案要写出：一，一个单一的验收指标和门槛，例如每批至少八成的服务不差于旧方案，且没有一个明显变差；二，第一批只收自愿的团队，列出名单和他们能拿到的好处；三，每批之后固定一个整顿窗口，窗口内不开新批；四，对不愿意的团队，写出你要拿出什么样的数字，他们才会自己来；五，一个叫停的条件，写明由谁、凭什么叫停，包括数字好看的时候。最后各估一估两种方案在第三批会是什么样子。",
  reflection: "你们上一个推广项目里，有没有哪一批被允许比旧办法更差？是谁发现的，用了多久？",

{

  title: "纠偏纠到根：先把分类的标准写明",
  source: "《在晋绥干部会议上的讲话》（一九四八年四月一日），第四卷",
  idea: "一场大运动做完，毛泽东给晋绥一年的土地改革和整党工作作总结，成绩和错误放在同一份账里：效果用当地人自己的话来验证，错误按类列出，再追到共同的根，也就是“离开了当时当地的实际情况，主观地决定自己的工作方针”。纠的时候，不只改个案，也把分类的标准、已经造成的后果和机构里的比例一起改掉。",
  why: "这是一九四八年四月一日毛泽东在晋绥干部会议上的讲话。他开头就判断，过去一年晋绥的土地改革和整党工作是成功的，理由有两面：一面是反对了右的偏向，发动了群众斗争；一面是纠正了运动中的几个“左”的偏向。效果他用当地人的话来验证：“再也不敢封建了，再也不敢厉害了，再也不敢贪污了”，并说这些反映“合乎实际”。\n\n三个“左”的偏向分别是：划阶级成分时，把许多并无封建剥削或只有轻微剥削的劳动人民划进地主富农的圈子，“错误地扩大了打击面”，忘了应当团结农村户数约百分之九十二、人数约百分之九十的劳动人民；侵犯地主富农的工商业，清查经济反革命超出范围，税收打击工商业；没有明确坚持严禁乱打乱杀，某些地方不必要地处死了一些地主富农，坏分子乘机报复，杀死了若干劳动人民。他追根，说这些错误“都是由于我们离开了当时当地的实际情况，主观地决定自己的工作方针”，并回头检查前一年六月的地委书记会议：它基本上成功，缺点是没有按老区半老区和新区的不同情况定方针，划成分过左，笼统提出“群众要怎样办就怎样办”的口号，助长了尾巴主义错误，也就是跟在群众自发要求的后面走。他的区分是：群众的正确意见，党要领导实现；不正确的意见，必须教育群众加以改正。\n\n讲话说，分局今年一月采取了纠偏的步骤，执行得迅速和彻底。据选集注释，一月十三日分局发出五项指示：划成分的标准不明确，在农民自发要求下错订了成分，要把划分标准定为以剥削关系为唯一标准；错订的要改正，已经取出的财物适当退还；农会领导机关里使中农占三分之一左右；要通过群众去改正。讲话还给了一个上限：土地改革的总打击面一般不能超过农村户数的百分之八左右、人数的百分之十左右，“离开实际情况，错误地扩大打击面，是危险的”。这个方法真正要求的是三件事：总结把成绩和错误写进同一份账；错误要分类，并追到共同的根；改正要落在标准、后果和机构里的比例三处，同时给分类的结果设一个由调查得来的上限，超出它本身就是一个警报。",
  failureMode: "讲话点名的偏向有几种：把不该打击的人划进打击的圈子，“错误地扩大了打击面”；对群众的要求没有分辨，只是跟在后面走，也就是“尾巴主义”；执行中没有明确坚持禁令，让事情在某些地方失控。其中错划成分一条，据选集注释，出在划分的标准不明确。\n\n在今天的工程团队里，它的样子是：平台团队发起一次清理闲置租户的专项，规则只写了长期低利用率。各团队为了完成清理数，各自理解这几个字，结果把调用很少、但每月跑一次关键批处理的租户也标成闲置，配额被收回，第二个月才有人发现。事后复盘只处理了这几个个案，规则里那几个字原样留在文档里。",
  worked: "讲话本身就是一份由党自己写下的记录。按讲话和选集注释，一九四七年六月晋绥分局的地委书记会议批判右的偏向，决定认真发动土地改革和整党；一九四八年一月分局同志参加中央十二月会议回来后，发出五项指示和关于保护工商业的指示；二月二十二日中央又发出指示，注释说它着重纠正了某些地区在这两项工作中发生过的“左”的偏向；四月一日有了这篇讲话。这是毛泽东和选集编者的叙述，不是第三方的研究。\n\n第三方研究者对这一时期的整体情形也有研究，但这里没有核对到他们的原文，不引用具体概括；讲话本身也没有给出晋绥错订成分的户数，或处死和被报复杀死的人数，这里也不补一个估计。\n\n讲话宣布偏向已经纠正（“现在，这项偏向已经纠正了”），同时又宣布整个工作成功，两者出自同一份总结，纠偏到底触及了多少受害的人，已经取出的财物退还了多少，讲话和选集注释都没有记录。效果的证据也主要是晋绥人民的话和同志的话，由讲话者转述，没有交代它们是怎样采集的。读它要把方法和结论分开：把错误分类、追根、改标准的做法可以单独拿来看，“已经纠正”这个判断需要另有材料去核对。",
  experiment: "取你们最近一次专项清理或标记行动的结果清单，比如清理闲置资源、标记高风险租户、事故分级。随机抽二十条，逐条对照文档里写明的标准复核，数一数标错了几条。再找出标准里哪几个词让不同的人读出了不同的意思，把它改成一条能用数据判定的标准。给标错的几条写补救办法，包括恢复被收回的资源，并为这类行动定一个错标率上限：抽查超过它，就暂停，先改标准再继续。",
  reflection: "你们上一次纠正一个错误，改的是那几个个案，还是产生它们的那条标准？",

    a: "错误按类列出：错划成分、扩大打击面，侵犯工商业，乱打乱杀；共同的根是离开当时当地的实际情况，主观地决定工作方针。去年六月会议笼统提出的“群众要怎样办就怎样办”被说成助长了尾巴主义。\n\n容易忘的是纠偏的做法：据选集注释，要把划成分的标准写成以剥削关系为唯一标准，错订的改正，财物适当退还，农会里给中农留三分之一左右，另外总打击面有一个上限。讲话没有给出晋绥错订的户数，也没有记录纠偏实际触及了多少人。"

{
  id: "which-deviation-to-guard-depends-on-the-state",
  track: "practice", level: "v4",
  title: "该防“左”还是防右，要看你所处的状态",
  source: "《关于目前党的政策中的几个重要问题》（一九四八年一月十八日），第四卷",
  idea: "“左”和右都是真实的错误，但这一刻该防哪一个，由所处的状态决定，不由立场决定：军队打胜仗时防“左”，打败仗或未能多打胜仗时防右；土地改革在群众还没有发动的地方反右，在已经发动、展开了斗争的地方防“左”。两种错误也有各自的定义：在全体上过高估计对手，不敢胜利，是右；在局部和具体问题上不谨慎，是“左”。",
  why: "这是毛泽东为中共中央起草的决定草案，日期是一九四八年一月十八日，题注只交代了这一点。它的前一站是一九四七年九月的全国土地会议，会上通过了主张平分土地的《中国土地法大纲》，三个多月后的十二月，中央在陕北杨家沟开会。草案第一部分谈党内反对错误倾向，先谈对对手的估计：全体上应当轻视，因为对方的统治已经腐烂；但在每一个局部、每一个具体问题上，“决不可轻视敌人”。如果在全体上过高估计，“不敢推翻他们，不敢胜利”，是右倾机会主义；如果在局部上不谨慎，不讲究斗争艺术，不集中全力，不争取该争取的同盟者，是“左”倾机会主义。这是战争和土地改革的文本，转到别处能用的是它给错误下定义的办法：不凭态度，看估计在哪个层次上偏了。\n\n紧接着是这一条的核心：反对“左”、右倾向，“必须依据具体情况决定方针”，随后给了两个例子，就是上面所说的军队和土地改革。这条规则的意思是，同一句要大胆或者要谨慎，对不同状态的单位是相反的药，不能一个方向喊到底。后面十二条具体政策，多数是在防“左”：不要对中农采取冒险政策，订错了成分的一律改正，分了的东西尽可能退还；不要对中小工商业者采取冒险政策；坚持少杀，严禁乱杀；“贫雇农打江山坐江山”的口号是错误的，应当是各劳动阶层联合起来。\n\n这个方法真正要求的是两件事：先判断自己此刻处在什么状态，再决定今天的提醒往哪一边说；而且同一个组织里不同的地方可以需要相反的提醒，同一个地方在不同阶段也会换方向。草案写了规则，也写了两个状态的标志，没有写由谁、用什么办法发现转向的时刻已经到了。",
  failureMode: "文中点出的是两种错误，而且都出在估计偏了：全体上高估，不敢胜利；局部上轻视，在具体问题上不谨慎。草案还点了一个口号，“贫雇农打江山坐江山”，它在一个阶段里也许说得通，推广到各处就成了错误。共同点是用一个固定的方向去对付所有的状态。\n\n在今天的工程团队里，它的样子是：平台负责人每个月在全员会上讲同一句话，别怕出错，先上线。对还没有开始迁移的团队，这句话是对的；对已经连着三次改动绕过评审就上线的团队，同一句话是在助长冒进。事故之后他把话换成所有变更先过两道评审，对已经被事故吓得不敢动的团队，又是火上浇油。一句话没有错，错在对所有团队说同一句。",
  worked: "这条规则在这份草案前后的几个月里，被党自己用了一遍。据选集注释，全国土地会议一九四七年九月在河北平山西柏坡召开，会上通过的《中国土地法大纲》规定，乡村一切地主的土地和公地，连同其他土地，按乡村全部人口统一平均分配。毛泽东一九四八年四月一日的晋绥讲话说，土地会议决定新方针之后，各解放区批判了党内的右倾思想；其后在许多地区，又采取适当步骤，纠正了或者正在纠正“左”的偏向。选集注释说明，一九四八年二月中央的指示规定，在封建制度已被推翻的老区和半老区，不再平分土地，只在必要时抽多补少、抽肥补瘦，并容许中农保有比一般贫农所得更多的土地。从九月到二月不到半年，党在两个方向上各纠了一次。以上来自党自己的文献和选集编者的注释，转向在多大程度上由状态判断引起，这些文献没有交代。\n\n同一套两头防的说法，一九五五年七月三十一日的《关于农业合作化问题》里又出现了一次：“在胜利面前，我认为有两种不好”，一种是胜利冲昏头脑，犯“左”的错误，一种是胜利吓昏头脑，来一个“坚决收缩”，犯右的错误，他判断当时属于后一种。据中国共产党新闻网“网上党校”转载新华网的介绍，这份报告之后，到一九五六年底，参加合作社的农户占总农户的百分之九十六点三，其中参加高级社的占百分之八十七点八，速度远在报告自己的时间表之前。判断当时处在哪个状态的，是作报告的人自己，报告里没有说明这个判断怎样被复核。\n\n所以这条规则的记录是两面的：它说明了纠偏要看状态，也说明了状态由谁判断是规则里没有填上的一格。草案自己给的是两个状态的标志，打胜仗还是败仗，群众是否发动，它们是可以观察的；到了别的场合，标志要自己找出来，写下来，让别人能检查。",
  experiment: "给你负责的几个团队或系统各标一个当前状态：已经冲在前面、还没开始、刚被事故打击、连续顺利。对每一个写一句话：现在最该防的是过急还是过缓，凭哪项可观察的指标，比如绕过评审的变更比例、回滚率、迁移停滞了几周。然后把你下个月本来要发的一条通用提醒，拆成两三句，分别发给不同状态的团队。最后为每一个团队写一个翻转点：哪项指标越过什么线，对同一个团队就该换一个方向说。",
  reflection: "你上个月给整个团队的一条通用提醒，对哪一个团队其实是错的方向？",
  recall: {
    q: "这份草案怎样定义“左”和右？该防哪一种，取决于什么？",
    a: "全体上过高估计对手，不敢推翻、不敢胜利，是右；在局部和具体问题上不谨慎、不集中全力、不争取同盟者，是“左”。该防哪一种，“必须依据具体情况决定方针”：打胜仗防“左”，打败仗防右；群众没有发动的地方反右，已经发动的地方防“左”。\n\n容易忘的是缺的那一格：草案没有写由谁、凭什么去判断此刻处在哪个状态、转向的时刻是否已到。它只给了可以观察的两个标志。"
  },
  deepDive: "这是我负责的几个团队各自眼下的状态，以及我最近一次给整个组织发的通用提醒。帮我判断每个团队此刻该防过急还是过缓，凭什么指标，我的那条提醒对哪几个团队方向是反的，并设计一个能让别人复核我的状态判断的办法。"

{
  id: "strategic-contempt-needs-a-tactical-check",
  track: "practice", level: "v4",
  title: "说它是纸老虎之前，先分清你在判断哪一层",
  source: "《和美国记者安娜·刘易斯·斯特朗的谈话》（一九四六年八月六日），第四卷",
  idea: "对一个看上去很强的对手，毛泽东在这篇谈话里只回答一层问题：从长远看，它的力量是不是真的。他的回答是不是，理由是历史上看起来可怕的政权后来都垮了，而“决定战争胜败的是人民，而不是一两件新式武器”。这个判断是用来定战略的，它本身没有回答对手明年能不能伤到你。",
  why: "这是一九四六年八月毛泽东在延安杨家岭对斯特朗的谈话。当时内战已经打起来，美国在装备国民党军，美国舆论里又在大谈反苏战争。斯特朗问了一串具体问题：和平有没有希望，蒋介石在美国不再帮助的情况下还能打多久，美国会不会打苏联，原子弹怎么办。毛泽东答蒋介石“一年以上”，经济上也支持得住；答反苏战争的宣传一半是真的准备，一半是烟幕，用来掩盖美国国内和美国同其他国家之间的矛盾。问到原子弹，他说它是美国反动派用来吓人的纸老虎，“看样子可怕，实际上并不可怕”。\n\n接着是这篇谈话的论证。他举了四个例子：沙皇，从表面上看是有力量的，二月革命的一阵风就把他吹走了，“沙皇不过是一只纸老虎”；希特勒、墨索里尼、日本帝国主义，也都曾被人们看作很有力量。结论是“一切反动派都是纸老虎”，真正强大的力量属于人民。落到中国，他说自己这边依靠的不过是小米加步枪，但历史最后会证明它比蒋介石的飞机加坦克还要强些，同时承认中国人民将要受到长时间的苦难。选集编者的题注把这个判断放进一个更大的框架：战略上、全体上藐视敌人，战术上、每一个具体问题上重视敌人。\n\n读这篇谈话，要把它回答的问题和它没回答的问题分开。它回答的是本质和长期：这类力量为什么终究会失败。它没有回答的是眼下：原子弹会不会被使用，用了会怎样，蒋介石一年里能打到哪里。所以方法真正要求的是两件事：判断一个威胁时分两层写，长期上它能不能赢，短期内它能造成什么；用来支持第一层的例子，也要去找反例，看有没有看上去强大、最后也确实没倒的。",
  failureMode: "谈话针对的是一种吓人的说法，中国的反动派正在拿美国的“强大”来吓唬中国人民。这种说法的错误是把对手手里的器物当成力量的全部。它的反面是把“纸老虎”四个字当作结论，不再去看对手这一年里能做什么，选集编者的题注正是为了防止这一点才补上了战术上重视敌人的那一半。\n\n在今天的工程团队里，它的样子是：一个大厂宣布了竞品，或者一个云厂商出了一次大故障，团队的反应是冻结路线图、重写架构，没有人去问它对自己的客户这个季度有什么实际影响。反过来的版本是：评审里有人说多区域同时故障属于小概率，是纸老虎，于是切换演练被一再推迟，直到真的发生那一天。",
  worked: "毛泽东自己后来把这个判断补成了两头。选集编者在本篇题注里引了他一九五八年十二月一日在八届六中全会期间写的《关于帝国主义和一切反动派是不是真老虎的问题》：反动派“是真老虎又是纸老虎”，一面它们吃人，成百万人成千万人地吃，中国人民花了一百多年、死了大概几千万人才取得一九四九年的胜利；另一面它们终究转化成了纸老虎。从本质上、长期上、战略上看，要把它们看成纸老虎，战略思想由此建立；它们又是会吃人的真老虎，策略和战术思想由此建立。这说明一九四六年的这篇谈话只讲了前一半，后一半是十二年以后才写成文字的，而且写在编者题注里，不在谈话原文里。\n\n原子弹是最清楚的检验。一九五六年四月二十五日《论十大关系》里，毛泽东一面说，认为原子弹已经在我们头上、几秒钟就要掉下来的形势估计“是不合乎事实的”，不能因此对沿海工业采取消极态度；一面说“我们现在还没有原子弹”，以后“不但要有更多的飞机和大炮，而且还要有原子弹。在今天的世界上，我们要不受人家欺负，就不能没有这个东西”。这两句和一九四六年的谈话并不冲突，一句不慌，一句不轻视，各管一层。一九五六年他说“我们现在还没有原子弹”，八年之后的一九六四年十月十六日，中国第一颗原子弹爆炸成功（《中国共产党大事记·1964年》）。\n\n谈话自己的证据也有限度。四个例子都是后来倒掉的政权，没有一个看上去强大而最后没倒的；蒋介石一年以上的估计以美国援助继续为前提，选集注释[2]记下的援助规模是，到一九四六年六月美国共装备国民党军四十五个师，据一九四九年八月美国国务院白皮书，一九三七年到一九四八年的援助总数共达四十五亿多美元。谈话把这些放在“小米加步枪”的另一边，却没有给出一个办法，说明在什么情况下，这只纸老虎的牙齿会比纸更重要。",
  experiment: "挑一条你们团队近来用“不太可能”打发掉的风险，比如多区域同时故障、一个核心依赖停止维护、一次大规模数据丢失。分两栏写：长期那一层，列出你们自己系统的历史里这类事件至少三次发生和三次没发生，看“不太可能”的依据是否站得住；眼下那一层，写它如果在下个季度发生，最先坏的三件事，和一个一周内能做完的最小对冲，比如一次切换演练或一份恢复手册。如果长期那一层没有证据，只有感觉，就把这一栏标成“未检验”，不要让它替短期那一栏作结论。",

  deepDive: "这是我们团队近来用“不太可能”打发掉的几个风险，以及我们自己系统里相关的历史记录。帮我把每个风险分成长期和眼下两层：长期那层的依据是什么，有没有反例；眼下那层最先坏什么；以及哪一个一周内能做完的对冲最划算。"

  id: "a-correction-has-its-own-misfire-rate",
  track: "practice", level: "v5",
  title: "纠偏也会误伤：误倒的要查出来，讲清楚",
  source: "《关于农业互助合作的两次谈话》（一九五三年十月十五日、十一月四日），第五卷",
  idea: "毛泽东在这篇谈话里说，“纠正急躁冒进”像一股风，吹下去了，也吹倒了一些不应当吹倒的合作社。纠偏本身有误伤率，所以纠偏之后要有一笔账，专记误倒的：“倒错了的，应当查出来讲清楚，承认是错误”。衡量一次纠偏做得对不对，不看它朝哪个方向，看两件事：要办的事是否切合需要与可能，做法是不是命令主义。",
  why: "这是一九五三年十月二十六日至十一月五日第三次农业互助合作会议前后，毛泽东同中央农村工作部负责人的两次谈话，第二次在十一月四日。会议要解决的，是这一年春天纠正急躁冒进以后互助合作运动“缩了一下”的局面。他先给了一个总标准：“切合实际就是要看需要与可能”，可能又包括政治条件、经济条件和干部条件。有条件成立的合作社，强迫解散，“不管哪一年，都是错的”。\n\n然后他给“干涉过多”下了定义，用来检查工作。干涉过多是：“不顾需要和可能、不切实际、主观主义的计划”，或者计划合于实际、却用命令主义的方法去做；反过来，需要做、可能做、做法又不是命令主义的事，不能也叫干涉过多。他把两头放在一起判断：“冒进是错误的，可办的不办也是错误的，强迫解散更是错误的”；稳步不前和超过实际可能勉强去办，同属主观主义。接着说到春天的纠偏：那是“一股风”，“也吹倒了一些不应当吹倒的农业生产合作社”，倒错了的要查出来，讲清楚，否则乡干部和积极分子会“憋着一肚子气”。\n\n他还给了一条可以拿来对照的线。据检查，当时有百分之五到百分之十的社减了产，他说这是没有积极领导的结果，少数社没办好、减了产难免；但如果有百分之二十甚至更多的社减了产，“那就是问题”。这篇谈话里的“需要”是由总路线定的，这一条只读它给判断设的标准。它真正要求的是三件事：判断一个动作，先问切合需要与可能没有，再问做法是不是命令；纠偏之后单独记一笔误伤的账；报警线事先写成数字，不等出了事再商量。",
  failureMode: "谈话针对的是两头：一头是“五多”和强迫命令，另一头是为了纠偏连有条件办好的社也一风吹掉，以及“稳步而不前进”，本来可以发展的不让发展，不批准。两者共同的毛病，是只看动作的方向，不看它合不合实际。\n\n在今天的工程团队里，它的样子是：一次没走评审的发布引起事故，随后全组冻结变更，并且把一批看起来有风险的定时任务和服务一起下线。其中有几个是健康的、和这次事故没有关系的，它们的负责人只收到一句通知，没有人列出哪些是误停的，也没有人恢复。负责人心里“憋着一肚子气”，下一次出了问题，他们会先想怎样不被点到。反过来的版本是：冻结解除以后，也没有人去查，冻结期间被耽误的改动里，有多少本来是可以做的。",
  worked: "春天的纠偏有清楚的记录。据中共中央党史研究室《中国共产党历史》第二卷（中共党史出版社，二〇一一年），一九五三年春，华北、东北、华东等局部地区出现急躁冒进，三月八日邓子恢向中央汇报，中央当天发出《对各大区缩减农业增产和互助合作发展的五年计划数字的指示》，十六日、十七日、十九日又连发三个指示，包括《关于解决区乡工作中“五多”问题的指示》。三月二十六日《人民日报》公布有关文件并发表社论，社论经毛泽东审阅修改；四月一日中央把文件汇编成《当前农村工作指南》，毛泽东为它写了按语。也就是说，后来他说“吹倒了一些”的那场纠偏，是他自己审阅、写过按语的。\n\n同一部党史记了这次纠偏的净结果：互助组由一九五二年底的八百零二万六千个，整顿后减到七百四十五万个，参加农户反而有所增加；初级农业生产合作社整顿后有一万五千多个，参加农户二十七万五千户，平均每社十八点三户；当年百分之九十以上的互助组和合作社增产。同时它也说明，一九五三年和一九五四年农村连续两年遭受严重自然灾害，农业总产值只比上年增长百分之三点一和百分之三点四，所以增产的比例不能单独归给哪一项政策。这些是净结果，毛泽东谈话里说的是误伤，两者不在一个层面，也不互相否定。\n\n误伤的记录没有留下数字。两年之后，毛泽东一九五五年七月三十一日的报告引了中央当年四月的一句警告：“不要重犯一九五三年大批解散合作社的那种错误，否则又要作检讨。”这说明一九五三年的大批解散，在党自己的文件里是被当作一次错误记下的；但这里查到的材料，包括这部党史，都没有给出当年被误解散的合作社数目，也没有记录谈话里要求的“查出来讲清楚”后来是怎样做的。这条记录能证明的是纠偏的过程和净结果，误伤那一栏是空的。",
  experiment: "找出你们最近一次事故之后的纠偏动作：全组冻结、批量下线、收紧权限、禁用一批告警。拉出这个动作实际碰到的清单，抽二十条，逐条标成三类：该停的、误停的、说不清的。算出误停的比例，和一条事先写好的报警线对照，比如超过百分之十就要修规则，超过百分之二十就要整体撤回重做。把误停的逐条恢复，并告诉它们的负责人为什么停过、现在为什么恢复。如果清单本身都拉不出来，这就是这次练习的第一条发现。",
  reflection: "你们上一次纠偏之后，有没有人专门去找过被误伤的那一批？如果没有，它们现在是什么状态？",
  recall: {
    q: "毛泽东在一九五三年十一月四日的谈话里，怎样看春天的“纠正急躁冒进”？他给了什么标准和什么数字？",
    a: "他说那是一股风，吹下去了，也吹倒了一些不应当吹倒的合作社，倒错了的要查出来讲清楚、承认是错误，否则基层干部会憋着一肚子气。标准是两条：切合需要与可能，做法不是命令主义。数字是：百分之五到百分之十的社减产难免，百分之二十甚至更多就是问题。\n\n容易忘的是记录的缺口：那场纠偏是他自己审阅、写过按语的，党史记了净结果，没有记误倒了多少。"
  },
  deepDive: "这是我们最近一次事故之后做的纠偏动作，以及它实际碰到的对象清单。帮我设计一次抽样复核：怎样抽，怎样分类，误停率的报警线设多少，误停的怎样恢复和通知，以及我怎样判断这次纠偏是切合需要与可能，还是只是朝着相反的方向用力。"

  id: "judge-by-conduct-not-by-profession",

  title: "看人看他做什么，不看他自称信什么",
  source: "《青年运动的方向》（一九三九年五月四日），第二卷",
  idea: "毛泽东对延安青年说，辨别一个青年革命不革命，他提出的是一个他认为“唯一的标准”：看他愿意不愿意、并且实行不实行和工农群众结合。嘴上信仰什么主义，“这是不算数的”。这个标准还带着日期：他今天结合，他今天是革命的，明天不去结合了，就不是了。它判断的是眼下看得见的行为，不是一次定论。",
  why: "这是一九三九年五月四日，延安青年群众为纪念五四运动二十周年开的大会，毛泽东讲了六个问题。选集的注释说，陕甘宁边区的青年组织当年三月规定五月四日为中国青年节，国民党先同意，后来又觉得危险，改定三月二十九日，而共产党领导的根据地继续用五月四日。这个标准在第四部分。前一部分他先做了一个总结：五十年的革命只得到暂时的部分的胜利，原因是敌人太强、自己太弱，主要是占全国人口百分之九十的工农还没有动员起来，经验归结起来就是“唤起民众”。知识青年和学生青年是一支“方面军”，不是“主力军”，所以要到工农中去。\n\n标准就是从这里来的。他引了几天前一篇短文里的话：知识分子革命、不革命或者反革命的最后分界，看其是否愿意并且实行和工农民众相结合。然后举例说明为什么口头信仰不够：希特勒也讲信仰社会主义，墨索里尼二十年前还是社会主义者，陈独秀信仰过马克思主义，张国焘也信仰过；有些人自称老牌三民主义者，实际是“口是心非的三民主义者”。所以看人，只看他和工农群众的关系，“只有这一个辨别的标准，没有第二个标准”。\n\n这是一篇战争年代对青年的讲话，里面的阶级对象在今天的团队里没有对应物，能转过来的是办法本身：只用一个别人也能看到的行为指标，不用自我陈述；指标带日期，按时间重新测；对自己用同样的尺子。它真正要求的是三件事：先把要看的行为写明白，再去查记录，最后允许结论随新的记录改变。文中没有说“实行”要观察多久、由谁来观察，这是它给的标准里没有填的格子。",
  failureMode: "文中点了两种人。一种是嘴上讲信仰的，自称信仰三民主义或马克思主义，做的事却相反，毛泽东称他们口是心非。另一种是不愿意和工农大众联合、甚至反对工农运动的青年，被他称作青年运动里的一股逆流。\n\n在今天的工程团队里，它的样子是：团队的价值观写着对生产负责、事故不追责，晋升材料里引的是这些词，没有人去查这个人过去半年有没有真的接过值班、事故之后有没有补过手册、有没有读过客户的工单。反过来的样子是一次定论：某个人在一次评审里表现很好，从此被当作可靠的人，之后的记录再没人对照。",
  worked: "这条标准出现的前后，党在做的事有记录。一九三九年十二月一日毛泽东为中央起草的《大量吸收知识分子》决定写道，没有知识分子的参加，革命的胜利是不可能的。\n\n一九四三年十二月二十二日的书记处会议，讨论的是另一件事。据中共中央党史研究室《中国共产党历史》第一卷下册（中共党史出版社，二〇〇二年）：一九四三年四月三日的中央决定对敌情作了夸大的估计；七月十五日康生作报告，提出开展“抢救失足者运动”，党史记，在延安仅半个月就挖出所谓特嫌分子一千四百多人；七月三十日毛泽东指示停止这个运动，十月九日又指示坚持“一个不杀，大部不抓”；十二月二十二日书记处会议认为“抢救运动”应予否定。党史对错误的描述是：把一些干部思想上、工作上的缺点错误，或者历史上尚未弄清楚的问题，轻易怀疑为政治问题以致反革命问题，并采取“逼、供、信”的方法。\n\n一九三九年的标准看的是可观察的行为，这场运动用的是口供和对历史问题的怀疑，两者放在一起，是同一个队伍在四年里用了两种不同的证据。党史记了毛泽东的两段话：一九四四年五月二十四日在延安大学开学典礼上说，“抢救”了好些人，许多是搞错了的，“今天要行脱帽礼，脱去给人戴错的帽子”；同年十月二十五日在中央党校的报告中说，“抢救运动”的基本错误是缺乏调查研究和缺乏分别对待。这些史料能说明纠偏的步骤和他自己对错误性质的判断；被错判的人数，各种来源差得很远，这里不采用任何一个。",
  experiment: "挑一条你们组织声称看重的品质：对生产负责、重视事故复盘、尊重客户。选三个团队或三个人，只用一个行为指标去查最近九十天的记录，指标事先写好并且别人也能复查，比如谁被呼叫后真正处理了、事故之后补了几份手册、读了几张客户工单。把查到的和文档、宣讲里说的并排放着看。再写一句话：什么样的记录会让你承认原来的看法是错的。下个月用同一个指标再查一次，看结论动没动。",
  reflection: "你对身边某个人的评价，最后一次依据新的记录修改是什么时候？",
  recall: {

  },

{
  id: "review-in-three-columns-lessons-tied-to-losses",
  track: "practice", level: "v2",
  title: "复盘分三栏：结果、成绩、教训，教训要追到丢了什么",
  source: "《和英国记者贝特兰的谈话》（一九三七年十月二十五日），第二卷",
  idea: "抗战打了三个多月，记者问他有什么结果、有什么成绩、教训在哪里。毛泽东把三样分开答：结果是已经发生的事，成绩是有的，“而且是伟大的”，要一条一条列；教训是“用土地和血肉换来的”，每一条要追到具体丢了什么，再往下列出必需的条件。证据差的地方他自己标出来：“听说”，“尚无统计”。",
  why: "这是一九三七年十月二十五日毛泽东对英国记者贝特兰的谈话，卢沟桥事变已经过去三个多月，华北的战局正在恶化。问题一个接一个：战争有了什么结果，日本的目的和实现的程度，抗战有没有成绩、教训在哪里，政治上军事上必需的条件是什么，共产党怎样去做。他的回答顺序和问题一致，也就是一份复盘的结构。\n\n结果分两面：日本的占领和屠杀，把亡国的危险加在中国人身上；中国多数人从此知道非团结和全民抗战不能挽救危机。成绩他列了五条：这是全国性的、革命性的战争；全国从分裂变得比较团结；国际舆论的同情；对日军的很大消耗；以及从战争得来的教训。第四条里他写“听说日寇资财的消耗是每天二千万日元”，又写人员的消耗“尚无统计”，把传闻和统计分开，没有当作数字报告。\n\n教训他放在两个地方，每一处都连着丢失的土地。政治上，参战的地域是全国的，参战的成分却不是：抗战还只是政府和军队的抗战，“不是人民的抗战”，几个月来土地的丧失、军队的失利，“主要的原因就在这里”。军事上，打的多是被动的仗，也就是“单纯防御”，这样打没有可能胜利。接着是条件清单：政治上六条，从改造政府、给人民自由、改良民生，到外交、文化教育和严厉镇压汉奸，军事上是一整套改革。方法真正要求的是三件事：把发生了什么、什么有效、该改什么分开写；每条教训连着一项具体的损失；证据的等级在句子里标出来。",

  why: "这是毛泽东在一九五七年二月二十七日最高国务会议第十一次扩大会议上的讲话，六月十九日经他整理和补充后在《人民日报》发表，题注说明了这一点。文中谈到当时的背景：匈牙利事件，一九五六年个别地方的罢工罢课和合作社社员闹社，合作化刚刚完成，肃反工作需要总结。他判断，革命时期大规模的急风暴雨式的群众阶级斗争基本结束，但阶级斗争还没有完全结束，在这个时候划清两类矛盾的界限，用意是团结全国各族人民，把力量转到经济和文化建设上去。\n\n论证分两步。第一步分类：敌我之间的矛盾，要靠专政来解决，包括逮捕判罪、一个时期内不给某些人选举权，这一类是“分清敌我的问题”；人民内部的矛盾，“是在人民利益根本一致的基础上的矛盾”，包括工农之间、知识分子同工农之间、政府同群众之间、国家利益同个人利益之间的矛盾，它们属于“分清是非的问题”，用的是民主的办法。他强调“专政的制度不适用于人民内部”，企图用行政命令的方法和强制的方法解决思想问题和是非问题，“不但没有效力，而且是有害的”。但他也说，为维持社会秩序发布的行政命令是必要的，同说服教育相辅相成。第二步给了一个公式：一九四二年整风时，对党内教条主义者采用的新办法，团结批评团结，也就是惩前毖后，治病救人，要求推广到工厂、合作社、商店、学校、机关、团体。\n\n分类本身是不固定的。他举民族资产阶级为例：工人阶级同它之间的剥削和被剥削的矛盾，本来是对抗性的，在中国的具体条件下，处理得当，可以转变为非对抗性的，处理不当，就会变成敌我之间的矛盾。他还承认，这两类矛盾“有时是容易混淆的”，肃反中错把好人当坏人，“从前有过，现在也还有”，因此提出“有反必肃，有错必纠”，并建议今年或者明年对肃反工作全面检查一次，“错了就要平反”。这个方法真正要求的是：先给矛盾定性，定性之后选办法；定性要靠事实，要能被检查，被发现错了要能改；同时承认人民内部确实存在矛盾，否则就只能在矛盾面前“缩手缩脚”。",

{
  id: "internal-cause-is-the-basis",
  track: "contradiction", level: "v1",
  title: "外因是条件，内因是根据",
  source: "《矛盾论》（一九三七年八月），第一卷",
  idea: "事物发展的根本原因在事物内部，在于内部的矛盾性；它同别的事物的联系和互相影响，只是第二位的原因。外因并没有被排除，但“外因是变化的条件，内因是变化的根据，外因通过内因而起作用”。所以解释一次成败，先问内部有什么使它可能这样成败，再问外部是什么触发了它。",
  why: "这是《矛盾论》第一节“两种宇宙观”里的论证。全文写于一九三七年八月，题注说写作目的是克服党内严重的教条主义。这一节要批的是形而上学的宇宙观：它把发展的原因放在事物外部，认为变化是外力推动的数量增减，说到社会的发展，就拿地理、气候一类外部条件来解释。毛泽东把这种看法叫作“外因论或被动论”。\n\n他的论证用比较法。许多国家的地理和气候差不多，发展的差异却非常大；同一个国家，地理和气候没有变，社会却发生了很大的变化，他举的是俄国变成苏联、日本变成帝国主义的日本、以及近百年的中国。外部条件几乎不变，结果却大不相同，所以变化的主要原因不在那里。但他同时划出外因的位置：鸡蛋得到适当的温度能变成鸡子，同样的温度不能使石头变成鸡子，因为二者的根据不同。十月革命影响了中国，这种影响也是通过中国内部自己的规律起作用的。他还说到战争，两军相争，一胜一败，胜败都决于内因，外因通过内因起作用。他对中国革命的两次挫折都这样解释，一九二七年大资产阶级战败无产阶级，是通过共产党内部的机会主义起作用的，后来又受到严重打击，是因为党内产生了冒险主义，清算之后事业就重新发展。由此他得出结论：一个政党要引导革命到胜利，必须依靠自己政治路线的正确和组织上的巩固。\n\n这个方法真正要求的是三件事：把一个原因分成触发它的条件和使它能够发生的根据，两层都要写下来；检验的办法是看同样的外部条件落到别的对象身上，结果是否一样；把解释的重心放在自己能改变的那一边，因为外因只有落在内部的矛盾上才起作用。",
  failureMode: "文中针对的错误，是把发展的原因都放到外部，结果只能说明数量的增减和场所的变更，不能说明为什么有“质的多样性”，也不能说明一种质怎样变成另一种质。这种看法使人只能等外力来推动，所以被称作被动论。\n\n在今天的工程团队里，它的样子是：复盘报告的根因一栏写着上游云厂商某可用区故障或流量突增，行动项是给厂商开工单、等下一次通报。同一天里同一个厂商的故障落在另外两个团队的服务上，那两个没有出事，因为它们有多可用区部署和超时预算。第一个团队的事故，条件在外面，根据是自己没有这两样东西。只写外部那一半，下一次同样的触发还会同样地奏效。",
  worked: "毛泽东在这一节举的中国例子，党自己后来也作过说明，说法可以对照。一九八一年《关于建国以来党的若干历史问题的决议》谈一九二七年的失败，写的是党当时还比较幼稚，又处在陈独秀右倾投降主义的领导下，“致使革命在强大敌人的突然袭击下遭到惨重失败”，党员从六万多人只剩下一万多。谈一九三一年至一九三四年，决议把第五次反“围剿”的失败归于王明左倾冒险主义的领导，第一方面军因此不得不进行二万五千里长征。一九三五年一月的遵义会议，决议说它确立了毛泽东在红军和党中央的领导地位，使红军和党中央在极其危急的情况下保存下来。这几处都是两层并写，强大的敌人是触发的条件，党内的领导和路线是使失败成为可能的根据，同《矛盾论》的分层相合。\n\n两个文本的权重并不一样。《矛盾论》说两军相争胜败都决于内因，决议则把强敌的突然袭击和党内的领导并列为一九二七年失败的原因。这两种写法是否矛盾，以及史学界对大革命失败的几个原因怎样排序，这里没有核对，不作判断。\n\n文中没有交代的是，怎样检验一个“败于内因”的判断不是事后的归因。文中的两个中国例子，都是在路线改变、事业重新发展之后，回头指认当时的内部毛病，这是作者自己的叙述；一个解释若在任何失败之后都能找到内部原因，它就很难被推翻。这一节给出的是分层的方法，没有给出如何在事前、在证据不全时判定哪一层是根据。",
  experiment: "找出过去半年里三次有外部触发的事故或险情（上游故障、流量突增、依赖升级、客户的异常用法都算）。对每一次写两行：触发它的外部条件是什么，使它能够造成损害的内部根据是什么（缺的预算、缺的隔离、缺的回退、被忽略的假设）。然后做对照：同一个外部条件，是否在同一时期也落到了别的服务、别的租户或别的集群上，那里为什么没有出事？如果找不到对照，写下你还缺什么数据。挑一次事故，只针对内部根据写一条行动项，并写一句能被推翻的预测：下一次同样的触发出现时，应该看到什么。",

  idea: "矛盾的两方面既互相依存，又在一定条件下互相转化，这叫同一性；同一性是有条件的、暂时的、相对的，而斗争贯穿过程的始终，是无条件的、绝对的。“有条件的相对的同一性和无条件的绝对的斗争性相结合，构成了一切事物的矛盾运动。”看上去的平衡和僵持，只是斗争处在量变阶段的样子，条件一变，它会转到另一种状态。",
  why: "这是《矛盾论》第五节。作者先说同一性有两层意思：第一层，矛盾的双方各以对方为自己存在的前提，没有地主就没有佃农，没有困难也无所谓顺利，双方共处于一个统一体中；第二层，双方依据一定的条件，各自向相反的方面转化，无产阶级经过革命转化为统治者，资产阶级转化为被统治者。后一层他认为更重要，“事情不是矛盾双方互相依存就完了”。他举的中国例子是国民党：它在一九二七年以后转化为反革命，又由于中日矛盾的尖锐化和共产党的统一战线政策，被迫赞成抗日，他把这些都叫作条件。战争与和平也是这样，一九二七年的国共合作转化成了战争，世界和平的局面也可能转化为世界大战。\n\n转化不是随意的。他批评神话里的孙悟空七十二变，那只是幻想的同一性，转化要靠具体的、必要的条件，“缺乏一定的必要的条件，就没有任何的同一性”。再看斗争性：事物的运动有两种状态，相对静止的和显著变动的。第一种状态里只有数量的变化，看上去是统一、团结、均势、相持、僵局、平衡；到了某一个最高点，统一物分解，发生质的变化，这些状态就被破坏。矛盾的斗争存在于两种状态中，所以同一性是相对的，斗争性是绝对的。他引用中国人常说的“相反相成”：相反是互相排斥、互相斗争，相成是在一定条件下互相联结，而斗争性就寓于同一性之中。\n\n这个方法真正要求的是三件事：看到一个稳定的局面时，同时写下双方各自需要对方什么，以及在什么条件下它会翻转；把相持和僵局当作斗争的一种状态，去找正在积累的那个量；不要拿一般的矛盾会转化当作结论，转化要靠这一对矛盾的具体条件来说明。",

  worked: "这一节举的几个转化，在党自己的叙述里都有对应。一九八一年《关于建国以来党的若干历史问题的决议》写道，一九二七年蒋介石和汪精卫控制的国民党背叛了孙中山所决定的国共合作政策，“残酷屠杀共产党人和革命人民”；在日本加紧侵略、民族危机空前严重的关头，党中央决定和实行了抗日民族统一战线政策；抗日战争结束后，蒋介石政府拒绝和平民主的要求，“悍然发动全面内战”。这三次转换，合作到分裂、分裂到合作、合作到内战，决议每一处交代的都是当时的具体处境，与文中说转化要靠具体条件相合。\n\n这一节的两个命题，后来成了一场公开争论的焦点。一九六四年发生过一场关于“合二而一”的批判。杨献珍在中央党校讲课时提出了“合二而一”的说法，起始时间有一九六二年十一月和一九六三年两种说法；一九六四年五月二十九日《光明日报》刊出艾恒武、林青山的批评文章，《红旗》杂志后来的报道把它当作公开论战的起点。杨献珍的说法被看作反对毛泽东的“一分为二”，他本人受到批判，后来得到平反。《矛盾论》本身既写了斗争的绝对性，也写了同一性包含互相依存的一层；这场批判逐篇怎样引用这一节，这里没有核对，也不作判断。这场论战的规模，不同来源的数字出入很大，这里不引用。\n\n文中没有说明的是，在具体事务里怎样判断一个相持局面处在量变的哪个位置、离翻转还有多远。“斗争是绝对的”这个命题本身不告诉人该在什么时候、用什么形式处理；它只指出了不能把平衡当作终点。",

  why: "这是《矛盾论》的第六节，也是正文的最后一个问题。它紧接着斗争性是绝对的这个结论，防止这个结论被用成万能公式。作者先讲对抗为什么存在：阶级社会里，剥削阶级和被剥削阶级长期并存于一个社会中，互相斗争着，要等矛盾发展到一定的阶段，双方才取外部对抗的形式，发展为革命；由和平转向战争也是这样。他用炸弹作比，没有爆炸的时候，矛盾物因一定的条件共居于一个统一体中，待到新的条件出现，也就是发火，才发生爆炸。他据此说明，在阶级社会里革命和革命战争不可避免，共产党人要揭露反动派所谓社会革命不必要、不可能的宣传。\n\n接着是限定。他说必须具体地研究各种矛盾斗争的情况，“不应当将上面所说的公式不适当地套在一切事物的身上”。有的矛盾具有公开的对抗性，有的不是；有的由非对抗性发展成对抗性，也有的由对抗性发展成非对抗性。他举了两个例子。一个是党内正确思想和错误思想的矛盾，它是阶级矛盾在党内的反映，开始时不一定表现为对抗，苏联党内列宁、斯大林同托洛茨基、布哈林等人的矛盾，中国党内同陈独秀、张国焘等人的矛盾，都是先不对抗、后来发展成对抗的。对眼下党内的矛盾，他的意见是，如果犯错误的同志能改正自己的错误，就不会发展为对抗性的，因此党一方面必须进行严肃的斗争，另一方面“又必须充分地给犯错误的同志留有自己觉悟的机会”，在这种情况下过火的斗争显然不适当；如果犯错误的人坚持错误并扩大下去，就存在发展为对抗的可能。另一个例子是城乡矛盾：在资本主义社会和国民党统治区，城市掠夺乡村，是极其对抗的矛盾，在社会主义国家和革命根据地，这种矛盾变成非对抗的，到共产主义社会才会消灭。文中引用列宁的话，对抗和矛盾断然不同，对抗消灭了，矛盾还存在。\n\n这个方法真正要求的是三件事：先判断眼前的矛盾处在哪一种形式，是公开对抗，还是仍在量变阶段；弄清楚是哪些条件在推它向对抗发展，哪些条件能让它不发展到那一步；对犯错误的一方，留下一条能够改正的路，并说明改不改的后果。",
