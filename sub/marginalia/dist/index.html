  title: "“不懂就是不懂，不要装懂”",
  source: "《论人民民主专政》（一九四九年六月三十日），第四卷",
  idea: "胜利在望的时候，手里熟习的东西快要闲下来，不熟习的东西却被现实推到面前。办法是承认自己不懂，向一切内行的人学，不管他是什么人，不摆架子，钻进去花几年工夫。这一条的前提是先把不懂说出口。",
  why: "这是毛泽东为纪念中国共产党二十八周年写的文章，一九四九年六月三十日发表。文章的主体是论证人民民主专政：人民内部实行民主，对反动派实行专政，二者结合；对付外部压力的几条回答，包括“一边倒”，也在这一部分。本条只取最后一段，它讲的是另一件事。\n\n最后一段先承认了一个难处：党二十八年里做成的只是革命战争的基本胜利，好比万里长征走完了第一步，面前是严重的经济建设任务，“我们熟习的东西有些快要闲起来了，我们不熟习的东西正在强迫我们去做”。他还提到外部的观望，帝国主义者算定共产党办不好经济，站在一旁等它失败。接着给了办法：必须克服困难，必须学会自己不懂的东西，向一切内行的人学经济工作，“不管什么人”，“拜他们做老师，恭恭敬敬地学，老老实实地学”。不懂就是不懂，不要装懂，不要摆官僚架子。他估计的学习时间是“钻进去，几个月，一年两年，三年五年，总可以学会的”。文中还举了苏联共产党的例子：开头也有人不大会办经济，后来学会了，所以苏联共产党是我们最好的先生。\n\n这一段真正要求的有两件事：第一，把哪些东西不懂列出来，而不是靠熟习的办法去套；第二，承认谁是内行不看职位和出身，看他是不是真的懂。同时要看到，它给出的学习期限是一个乐观的估计，这个估计后来怎样，要看后面的记录。",
  failureMode: "文中点名防的是装懂和官僚架子，也就是用身份和熟习的办法去替代对一个新领域的学习。它同时针对另一个倾向：以为靠熟习的办法就足够，不必向内行学。\n\n在今天的工程团队里，它的样子是：一个擅长无状态服务的团队，被推着接手一个有状态的存储或数据库平台。设计评审里，资深的人用熟悉的服务经验类比着拍板，不承认自己没有运维过一次存储故障；真正做过这件事的人，可能在隔壁团队，也可能只是一位入职不久的工程师，他的意见被当作需要被说服的对象，而不是需要被请教的人。",
  worked: "文章发表前后的一年里，新政权就遇到了文中说的那种“不熟习的东西”。据中央党史和文献研究院网站刊载的党史文章，一九四九年六月上海打了银元之战，十一月底到十二月初国营公司在全国主要城市集中抛售粮棉，打了米棉之战；一九五〇年三月三日政务院作出统一国家财政经济工作的决定，三个月后财政收支实现平衡，物价基本稳定。这条路径到底在多大程度上出于文中讲的向内行学习，没有找到可以核对的材料，这里不作判断；能确认的只是，文章提到的帝国主义者等着看经济失败的预言，在这个领域一年内没有出现。\n\n毛泽东自己也在后来修正了这条要求里的一个部分。一九五六年的《论十大关系》写道，一切国家的长处都要学，“但是，必须有分析有批判地学，不能盲目地学，不能一切照抄，机械搬用”；关于技术，他说大部分先要照办，因为那些我们现在还没有，还不懂，但是已经清楚的那一部分，“就不要事事照办了”。一九四九年的文章把苏联共产党称为最好的先生，七年后的这句话给学习加了一个条件。\n\n一九六二年一月三十日，毛泽东在扩大的中央工作会议（七千人大会）上讲话。据网上转载的版本，他说对社会主义建设还有很大的盲目性，社会主义经济对我们来说还有许多没有认识的必然王国，需要下苦功夫调查研究。各转载本的措辞略有出入，这里只转述大意，没有核对《毛泽东文集》第八卷。三年五年的估计，到这时已过了十三年。文章没有讲，学习的结果由谁来检验，以及检验不通过时怎么办。",
  experiment: "列出你们团队眼下被业务推着做、而你并不真正熟悉的三件事（一个新的存储引擎、一项合规要求、一套新的调度器都可以）。对每一件写下：我现在的判断主要是靠类比哪一个我熟悉的东西得来的？这个领域里最内行的人是谁，他在不在公司里，职位高低都不要紧？约其中一位，用一个小时请他当老师，准备五个你真的不知道答案的问题。会后写下：如果没有这一小时，我原本会怎样决定；现在改了什么。",
  reflection: "你上一次在评审里说“这个我不太懂”是什么时候？如果想不起来，你最近一次替没有把握的事拍板，依据的是什么？",
  recall: {

    a: "承认“我们熟习的东西有些快要闲起来了，我们不熟习的东西正在强迫我们去做”，然后向一切内行的人学，不管什么人，恭恭敬敬、老老实实地学，不懂就是不懂，不要装懂，不要摆官僚架子。\n\n容易忘的是两点：一是这一段在文章最后，文章的主体是论证人民民主专政；二是文中估计的学习期限是几个月到三五年，而后来的记录表明，对社会主义建设的盲目性并没有在这个期限里消除。"

{
  id: "unify-what-must-be-unified",
  track: "power", level: "v5",
  title: "统一和特殊，一件一件地划",
  source: "《论十大关系》（一九五六年四月二十五日），第五卷",
  idea: "中央和地方的关系是一个矛盾，两头都会出错：把什么都集中到中央，“把地方卡得死死的”，或者放得没有统一。办法是在巩固中央统一领导的前提下“扩大一点地方的权力”，并且一件事一件事地划线：可以和应当统一的必须统一，不可以和不应当统一的不能强求统一。同一条规则对省市和它下面的地、县、区、乡同样适用。",
  why: "这是毛泽东一九五六年四月二十五日在中央政治局扩大会议上讲的十个关系里的第五个。他先给了一个理由：国家这样大、人口这样多、情况这样复杂，“有中央和地方两个积极性，比只有一个积极性好得多”；中央要巩固，就要注意地方的利益；中央直属的工业也要靠地方协助，农业和商业更要依靠地方。他拿苏联作对照，说中国不能像苏联那样把地方一点机动权也不留。\n\n接着是中国自己的经验，这是论证的核心。建国初期的大区制度当时有必要，也有缺点，后来的高饶反党联盟多少利用了这个缺点；取消大区、各省直属中央是正确的，但由此走到取消地方必要的独立性，结果也不那么好。他还引了宪法：立法权集中在中央，但在不违背中央方针的条件下，地方可以搞章程、条例、办法，宪法并没有约束。他对两头都划了线：“破坏这种必要的统一，是不允许的”，同时各地都要有适合当地情况的特殊，这种特殊是为了整体利益、为了加强全国统一所必要的，而不是高岗那种特殊。\n\n讲话里还有两条操作性的内容。一是对上下级同样适用：省市对中央部门有意见，地、县、区、乡对省市也会有意见，省市要注意发挥它们的积极性，“都不能够框得太死”。二是对争权的定性：从全国整体利益出发的争权，不是从本位利益出发的争权，“不能叫做地方主义”。这一节真正要求的是：统一和特殊不能一次划定，要逐项划，要写明理由，并且每过一个时期要总结一次；他自己也说，在这个问题上经验还不多，还不成熟。",
  failureMode: "文中点名的偏差有两个方向。一个是集中到卡死：中央各部各自向下给命令，地方没有机动余地。另一个是以特殊为名破坏必要的统一，也就是以本位利益出发的争权。\n\n在今天的工程团队里，它的样子是：平台团队要求所有租户团队用同一条部署流水线和同一套告警规则，一个有合规要求、需要多加一步审批的团队，申请被一句不支持挡回，于是它悄悄复制了一份自己的流水线，平台再也看不见它。反过来的样子是：每个团队各选一种日志格式和追踪方式，事故来了，没有办法跨团队把一次请求串起来。两种情况的根源相同：没有人按事项回答过，哪一件事必须统一，为什么。",
  worked: "这篇讲话发表以后，放权很快走到远超“一点”的程度。据中华人民共和国国史网和国企史研究文章转引的统计，一九五八年底，中央直属的工业企业从一九五七年的约九千三百个降到约一千二百个，下放了约百分之八十七到八十八，不同出处的数字略有出入；中央企业的工业产值在全部工业总产值中的比重，由百分之三十九点七降到百分之十三点八。放权不限于企业，计划、基本建设审批和财权也一并下放。讲话里写的是“扩大一点地方的权力”，实际发生的幅度，这个词没有对应。\n\n一九六一年一月，中共中央发出《关于调整管理体制的若干暂行规定》，强调高度集中统一，克服无计划状态和分散主义，把一批下放不当的企业收回中央。据上述文章，收回的原因包括：有的面向全国产供销的大型骨干企业下放给地方以后，地方很难保证它们的生产条件；也有研究把这个时期国民经济比例的严重失调同各地自行决定建设项目联系起来。这是一种解释，各家研究对放权在这场失调中占多大分量并不一致，这里不作判断。\n\n这篇讲话没有给出的是判定哪些事项“应当统一”的程序，也没有规定谁来判定：讲话说从整体利益出发的争权不是地方主义，而整体利益由谁认定，要看实际的政治结构。它给的方法是逐项划线和定期总结，一九五八年到一九六一年的放和收，都发生在这个方法所要求的逐项划线之外。",
  experiment: "列出你们平台目前向租户团队提出的强制要求，十五条上下：部署方式、日志格式、密钥管理、告警规则、版本升级窗口都算。对每一条写一句话：如果它不统一，会出什么具体的事故、成本或安全问题？写不出来的，标成按习惯统一。再列出你知道的、现在已经存在的没有批准的偏离（例如某个团队的自建流水线），对每一个判断它对应上面哪一条：是这一条本来就不该强制，还是这个团队确实在破坏必要的统一。挑出一条放开、一条收紧，约好一个季度后复查。",
  reflection: "你们平台强制要求的事项里，哪一条最后一次被人问“为什么必须这样”已经是一年以前了？",
  recall: {

  title: "条文可以有，事实先要有",
  source: "《新民主主义的宪政》（一九四〇年二月二十日），第二卷",
  idea: "宪法是在民主的事实已经存在之后，把它承认下来的文件。事实还不存在的时候，颁布一部宪法、开一次大会、选出一位总统，都不等于事实有了。判断一个人是不是真要这件事，不看他说什么，看他“一面谈宪政，一面却不给人民以丝毫的自由”。事实没有的时候，要做的是研究和推动，去争取它。",
  why: "这是毛泽东一九四〇年二月二十日在延安各界宪政促进会成立大会上的演说。选集题注说明了背景：当时党内有一些同志被蒋介石实行宪政的宣传迷惑，以为国民党真会实行；毛泽东在演说里揭露这种宣传，把促进宪政变成启发人民觉悟、向国民党要求民主自由的一个武器。上一年九月，国民参政会通过了定期召集国民大会实行宪政的决议，十一月国民党宣布一九四〇年十一月十二日召集国民大会，这件事被拿来作宣传。\n\n论证先回答宪政是什么：“就是民主的政治”。他把要的东西同两种现成的样子分开，既不是欧美式的资产阶级专政的民主，也还不是苏联式的无产阶级专政的民主，而是他称为新民主主义的宪政，也就是几个革命阶级联合起来对汉奸反动派的专政。这是演说自己给出的定义，它划定了谁在这个民主之内、谁在之外，这个部分是战时统一战线的政治主张，不是这一课要取的方法。\n\n方法在后面一段：世界上历来的宪政，不论英国、法国、美国还是苏联，“都是在革命成功有了民主事实之后，颁布一个根本大法，去承认它”；中国则是革命尚未成功，除边区等地外还没有民主政治的事实，颁布一部好宪法也会被封建势力和顽固分子阻挠，所以现在的宪政运动是“争取尚未取得的民主，不是承认已经民主化的事实”。因此不能因为开了会、打了电报、颁了宪法、选了总统就“百事大吉”，要提醒自己“不要把你们的脑筋闹昏了”，也要向老百姓讲清楚。他还给促进会定了两个作用：研究和推动。要促别人，别人会问为什么，就得先把道理研究清楚。这一课真正要求的是：看一条规定，先问它描述的事实在不在；事实不在，就把文件当成要争取的目标，而不是已经完成的东西。",
  failureMode: "演说点名的是两种相关的错：把文件当成事实，以为宪法一颁布、总统一选出、会一开就万事大吉；还有那种两面派，嘴里一套，手里一套，用谈宪政的名义，实际并不给人民以自由。演说用“挂羊头卖狗肉”形容它。\n\n在今天的工程团队里，它的样子是：公司规定每个服务都要有服务等级目标、值班手册和演练过的灾备方案，合规看板全部变绿，因为每一项文档都存在。实际上告警没有人看，手册上的命令已经在上次迁移后失效，灾备方案从来没有真正恢复过一次。看板统计的是文档，不是事实；越是显示全绿，越没有人再去查事实。",
  worked: "演说自己提到的两个例子，选集注释写明了结局。注释说，国民党宣布一九四〇年十一月十二日召集国民大会，后来这些决议都没有实行。注释还写了一九二三年的曹锟宪法：曹锟用五千银元一票贿买国会议员当选大总统，随后颁布了这些议员制定的宪法，当时被称为贿选宪法。这是党编的注释，对国民党的评价自然是一方的立场。\n\n一九四六年十一月十五日，国民党在南京召开制宪国民大会，十二月二十五日通过中华民国宪法；据各来源一致的记载，中国共产党和民盟拒绝出席，宪法一九四七年十二月二十五日施行。对这次大会的性质，大陆的官方叙述认为是国民党单方面召集的，另有来源指出，代表人数仍超过法定人数，会议程序上是合法的，两种评价并存，这里不作裁定。\n\n共产党自己面对这个问题时，次序同演说一致。据报告全文，一九五四年九月十五日刘少奇在第一届全国人民代表大会第一次会议上作关于宪法草案的报告，报告的第一部分标题是“中华人民共和国宪法草案是历史经验的总结”；九月二十日，宪法通过。这是一部在革命成功之后写下的文件，同演说里讲的先后次序一致。一九八一年的历史决议后来写道：“种种历史原因又使我们没有能把党内民主和国家政治社会生活的民主加以制度化、法律化，或者虽然制定了法律，却没有应有的权威。”演说给了一个检验别人的办法，看事实有没有；它没有给检验自己的程序，这个办法能不能用在自己身上，决议里有党自己的回答，是否充分，各家看法不同。",
  experiment: "挑一条你们公司有看板或勾选框来显示完成的承诺：每个服务有值班手册、每次变更有评审、灾备每年演练一次，都可以。随机抽十个服务，对每一个不看文档在不在，只查事实：上一次事故里有没有人用过那份手册，那份评审是不是真的改变了变更，灾备恢复在抽查时能不能跑通。数出文档在而事实不在的那几个，写下差距。然后在两条路里选：把事实补齐，或者把文档改成实际有的样子，不要让文件继续声明一件不存在的事。",

  title: "这里做成了，别处为什么不行",
  source: "《〈中国农村的社会主义高潮〉的按语》（一九五五年九月、十二月），第五卷",
  idea: "有人说一件事做不成，最有力的回应是一个已经做成的地方，然后问：“为什么这个地方可以这样做，别的地方就不可以这样做呢？”不行的理由必须说得出来。遇到不懂和麻烦，有的人“绕开”，有的人干脆一刀砍掉，两者都是回避，办法是自己动手，“从不懂到懂”。",
  why: "一九五五年毛泽东编了一本地方报告的汇编《中国农村的社会主义高潮》，为其中的文章写了一百零四篇按语，选集收了四十三篇。当时党内对农业合作化的速度有分歧；同一本书的序言写到，每到春季就有人反冒进，不但停止发展，还成批地强迫解散已经建成的合作社。所以这些按语是一场争论里的文字，它们的写法是拿一个地方的事实去反驳一种一般性的说法。\n\n第一篇按语评论的是河北遵化县一个区的材料。文中引的数字是：从一九五二年到一九五四年，十一个乡四千三百四十三户，三年内入社农户占百分之八十五，粮食产量增加百分之七十六。他据此提出那个问题：“为什么这个地方可以这样做，别的地方就不可以这样做呢？”并且自己回答：只有一条理由，就是怕麻烦。他把当时的做法分成两种，一种是自己不懂、怕人问而“绕开社走”，一种是借口冒进、手里拿着刀大批“砍掉”合作社，两种都是回避麻烦问题；遵化的办法是“书记动手，全党办社”，结果是“从不懂到懂”。\n\n第二篇按语把一批说法列成一张单子：三年合作化是幻想、南方无法快、山区不能办、灾区不能办、农民没有文化找不到会计、合作社办得越多乱子越多、发展速度超过了群众觉悟水平和干部经验水平，等等，结论是“总之都是迷信”；一九五五年十月党的七届六中全会（扩大）批判之后，这些说法都被事实打破。他得出的教训是，领导机关为什么几个月前没有感觉到群众中的积极性，今后应当“不要脱离群众”。这个方法真正要求的是：每一个不行都要有一个具体的理由，每一个做成了都要说明它的条件是否可比，两者缺一不可。",
  failureMode: "文中点名的错误有两种。一种是自己不懂、怕人问，就“绕开社走”；另一种是积极地回避，大批解散，也就是“砍掉”。按语认为这两种做法的共同点是借一个一般的困难，不去看一个具体的例子。\n\n在今天的工程团队里，它的样子是：一个迁移项目遇到阻力，评审会上有人说我们的环境不适合多租户隔离，会议于是决定先冻结。隔壁团队已经在类似的集群上跑了半年，没有人去问他们是怎么做的，也没有人写下这个环境和那个环境到底差在哪里。冻结本身成了一种不用懂的办法。",
  worked: "按语之后很快有了数字。据几份研究和资料引用的统计，到一九五六年底，全国入社农户约占农户总数的百分之九十六点三，其中加入高级社的约占百分之八十七点八，这是合作化的峰值。一九五六年底至一九五七年各地出现农民闹社、要求退社的事件，人民网党史频道有专文记述。\n\n毛泽东自己后来修正了其中的两处。一九五八年三月他为重印部分按语写了说明（选集保留了全文）：说一九五五年是社会主义同资本主义决战取得基本胜利的一年，这样说不妥当，应当说是在生产关系的所有制方面取得基本胜利的一年；还说没有预料到一九五六年会发生打击群众积极性的反冒进事件。他同时说，其中一些按语现在还没有丧失它们的意义。一九八一年的历史决议对合作化后期的评语是，工作过粗，改变过快，形式过于简单划一，留下了一些问题（各来源转引的原句措辞略有出入，这里只取大意）。决议对合作化整体的评价不止这一条，这里只取与速度和做法有关的一点。文中把发展速度超过了群众觉悟水平和干部经验水平这一说法列为应当破除的迷信，决议则对速度和做法得出了相反的判断。\n\n这套办法有三个没有写明的地方。一，遵化的数字出自文章自己，引用时没有独立核对，它也没有讲明那里的条件和别处相比差在哪里。二，文中先问理由，又替对方给出了唯一的理由，没有留出对方回答的位置。三，一个地方做成了可以说明做得成，不能说明在别处要用多快的速度、花多大的代价做成。",
  experiment: "找出你团队里最近一个被说成做不成的事：某个有状态系统的零停机升级、一次跨区域迁移、一项合规自动化，都可以。先在公司内外找至少一个已经做成它的例子，写下它成功的条件，一条一条列出。然后列出你们这里的不同：规模、数据特性、人手、工具，对每一条判断它真的改变结论吗，如果不确定，设计一次最便宜的试验。最后写一页纸，题目是为什么这里不行，每一条理由要么有证据，要么划掉。",

  why: "这是毛泽东为纪念中国共产党二十八周年写的文章，一九四九年六月三十日发表。文章中间有一长段，逐条回答当时对新政权外交方针的质疑，质疑用引号列出：“你们一边倒”“你们太刺激了”“我们要做生意”“不要国际援助也可以胜利”“我们需要英美政府的援助”。本条取的是后三条。\n\n论证是这样走的。关于做生意，他先承认：完全正确，生意总是要做的，他只反对妨碍做生意的内外反动派。关于援助，他说帝国主义存在的时代，任何国家的真正的人民革命，没有国际力量在各种方式上的援助，取得胜利和巩固胜利都是不可能的，所以“不要国际援助也可以胜利”是错误的想法。接着他把买卖和援助分开：英美的统治者还是帝国主义者，现在同这些国家做生意，将来在互利条件下向它们借钱，是因为它们的资本家要赚钱、银行家要赚利息，借以解救自己的危机，“并不是什么对中国人民的援助”。他把这些国家共产党和进步党派的做法放在另一类：这些党派促使本国政府同中国做生意、建立外交关系，是善意的，才算援助。\n\n他拿孙中山的经历作证据：孙中山一生无数次向资本主义国家呼吁援助，结果一切落空，只得过一次国际援助，就是苏联的援助。由此他的结论是，真正友谊的援助只能向以苏联为首的一方去找。这一段真正要求的是两件事：把一段关系拆成买卖和援助两个账，买卖按价格算，援助要问对方的利益是否同你一致；判断靠对方过去的行为，不靠对方现在的态度。同时要看到，结论里“只能向这一方面去找”这句话，成立的条件是那一方的利益一直不变，这个条件文章没有展开。",
  failureMode: "它针对两种方向相反的想法：一是把买卖当成援助，觉得“我们需要英美政府的援助”，有人肯做生意就当作有人肯帮忙；二是以为不需要任何外部力量，“不要国际援助也可以胜利”。文章对两者的回答是同一个：先问对方凭什么这样做，再决定把多少重量压在这段关系上。\n\n在今天的工程团队里，它的样子是：云厂商或某个托管服务的客户经理很友好，给了折扣、额度和一位专属工程师，团队就把这当成伙伴关系，把核心路径建在只有这一家才有的功能上，没有写退出办法。厂商调整价格、停止维护某个功能、被收购之后，团队才发现对方的利益从来不等于自己的利益，而换掉它要一年。反方向的样子是：团队什么外部服务都不敢用，把本该买的东西全部自己写，把人力耗在没有差别的工作上。",
  worked: "文章写下的外交判断，先在一九五〇年得到条约上的支撑。据《毛泽东选集》第五卷对《为争取国家财政经济状况的基本好转而斗争》一文所作的注释，一九五〇年二月十四日签定了中苏友好同盟互助条约；毛泽东在同年六月的这篇报告里说，这个条约使中国能够放手地、较快地进行国内建设。选集的注释只记了条约的日期，没有给援助的数量，具体的贷款和项目数字这里没有查证。\n\n十一年后，文章里说的那一方撤走了专家。据人民网刊载的几篇史料文章，一九六〇年七月十六日，苏联方面通知中国，决定召回在华的全部苏联专家；据爱思想刊载的一篇研究文章，苏方七月二十五日又通知专家自七月二十八日起撤离，九月一日撤完。文章对随后被取消的合同数写法不一，有的写三百四十三项，有的只写几百个，这里不取数字。对撤走的原因，两国的叙述不同，这里只记事件，不作判断。\n\n这个记录能说明的有限。它说明以一方的援助为主要依靠的安排，在对方决定改变时没有缓冲；它不能说明一九四九年的判断在当时是对还是错，因为文章当时对比的是英美的买卖关系，并没有预言苏联的援助会在何时中止。要问的是，当年那条判断里没有展开的条件，也就是对方的利益是否一直不变，有没有人在条约签定之后继续去核对。",
  experiment: "列出你们平台最依赖的三个外部来源：一家云服务或托管服务厂商，一个只有一位维护者的开源项目，一个别的组织提供的内部平台，都可以。对每一个写四行：它从你们这里得到什么；它让你们继续使用的理由是什么；它的什么变化会改变条款，比如涨价、停止维护、被收购、优先级调整；真换掉它，需要多久。挑出对方利益同你们最不一致、而你们又最依赖的那一个，做一次限时的退出演练：把一个组件的数据导出，在第二家或自建环境上跑通，记下实际花了多少时间，并把结果同第四行的估计对比。",

{
  id: "use-the-force-do-not-hand-it-the-lead",
  track: "power", level: "v4",
  title: "用它的力量，但不交给它领导",
  source: "《论人民民主专政》（一九四九年六月三十日），第四卷",
  idea: "一个对你有用的力量，可以团结，可以利用，可以限制，但不一定应当让它掌舵。能不能担任领导，由它的位置和习性决定，不由它的用处大小决定。同时这个安排有期限：文章说的是“现阶段”“现在的方针是节制资本主义，而不是消灭资本主义”。",
  why: "这一段在《论人民民主专政》的后半部分，讲的是人民民主专政里各个阶级的位置。一九四九年六月，新政权还没有成立，要回答的是民族资产阶级放在哪里。毛泽东的回答分三步。\n\n第一步是需要它。他承认中国的现代工业在整个国民经济里比重很小，据他引的估计，抗日战争以前现代工业产值不过占全国国民经济总产值的百分之十左右，同时他说现在没有可靠的数目字。帝国主义站在旁边，所以中国必须利用一切“于国计民生有利而不是有害”的城乡资本主义因素，团结民族资产阶级，共同奋斗；方针是节制资本主义，而不是消灭资本主义。第二步是不让它领导。人民民主专政的基础是工人和农民的联盟，因为这两个阶级占了中国人口的百分之八十到九十；领导权要给工人阶级，因为只有它最有远见，大公无私，最富于彻底性。民族资产阶级“不应当在国家政权中占主要地位”，理由是它的社会经济地位规定了它的软弱性：缺乏远见，缺乏足够的勇气，还有不少人害怕民众。第三步是历史证据：小资产阶级和民族资产阶级曾经多次领导过革命，都失败了，孙中山的四十年就是例子。\n\n这一段真正要求的是把三个问题分开问：需不需要它的力量，由谁来领导，限制到什么程度。三个问题的答案可以不同，需要不等于领导，也不等于永远保留。文章里的措辞都带着时间：“现阶段”“现在”。至于这个阶段何时结束，文章没有写。",
  failureMode: "文中点名的错误是把领导权交给不适合的阶级：中国的小资产阶级和民族资产阶级“曾经多次领导过革命，都失败了”。文章同时反对另一头，不去利用一切有利的资本主义因素，因为工业太弱，对手又站在旁边。\n\n在今天的工程团队里，它的样子是：一次大迁移缺人，请来咨询公司和外包团队，他们人手多，交付快，于是他们写的参考架构和选型一步一步变成了平台自己的架构；合同到期，人走了，留下一个没有人完全看得懂的核心。相反方向的样子是：因为怕失控，拒绝一切外部人手，迁移推迟两年，团队在没有差别的工作上耗尽。",
  worked: "文章里的“现在”和“现阶段”，在几年内就换了内容。《毛泽东选集》第五卷收了他一九五〇年六月六日在七届三中全会上的讲话，其中说：“民族资产阶级将来是要消灭的，但是现在要把他们团结在我们身边，不要把他们推开。”同一天的书面报告还说，有些人认为可以提早消灭资本主义实行社会主义，这种思想是错误的，不适合中国的情况。\n\n据人民网党史频道刊载的资料，一九五三年六月十五日，中央政治局扩大会议讨论统战部提交的有关文件，毛泽东明确提出过渡时期总路线，对资本主义工商业的政策定为利用、限制、改造；同年九月向全国公布。一九五四年六月十四日，他在宪法草案的讲话里还说，国家资本主义不是只有公私合营一种形式，实行是“逐步”的，形式是“各种”的。到一九五六年一月，据党史大事记，一月十五日北京各界二十多万人集会，庆祝全国第一个实现资本主义工商业的全行业公私合营；据人民网和民建系统文献的记述，全国到第一季度末，私营工业约百分之九十九、私营商业约百分之八十五纳入了全行业公私合营，另一种说法是到年底私营商业为百分之八十二点二，各资料的商业比例略有出入。对原来的资本家，实行定息，统一为年息五厘，原定七年，后来延长，一九六六年九月停发。\n\n这个记录说明的是时间表：一九四九年的“不消灭”，按文章自己的写法是现阶段的方针；七年之后，私营工商业的所有制已经基本改变，而赎买用的定息一直发到一九六六年。一九四九年写下“节制”的时候是否已经有这个时间表，这里没有查到把一九四九年的节制同一九五三年的改造衔接起来的毛泽东本人论述，不作判断。",
  experiment: "列出你们目前使用的外部力量：外包或咨询团队、厂商的驻场工程师、托管服务、被并购进来的团队。对每一个，把它手里的决定按三层分开：怎么实现，接口怎么定，目标架构和选型。写一页纸，规定哪些决定可以交给它，哪些必须留在内部有名有姓的人手里，并标出现在已经越过这条线的一项。选一项收回，约好交接日期，同时写下收回之前需要补多少人手，这是限制它的真实成本。",

{
  id: "keep-the-comments-you-do-not-adopt",

  title: "没有采用的意见，也要搜集",
  source: "《关于中华人民共和国宪法草案》（一九五四年六月十四日），第五卷",
  idea: "少数人起草的东西，要拿到更多人面前去检验。收回来的意见分成三类：不正确的，不适当不采用的，采用的。不采用的也要收，因为从中能知道这些人是怎么想的，“有个比较”。起草靠的是“领导和群众相结合”，并且“一切重要的立法都要采用这个方法”。",
  why: "这是毛泽东一九五四年六月十四日在中央人民政府委员会第三十次会议上的讲话。宪法草案的初稿，已经在北京五百多人的讨论中、各省市积极分子的讨论中过了一遍，也就是在全国有代表性的八千多人中讨论过；这次会议之后草案要公布，再由全国人民讨论，几个月后交全国人民代表大会通过。\n\n讲话先回答为什么要组织这样广泛的讨论，给了几个好处。第一，少数人议出来的东西，大家是不是赞成，要检验；经过讨论，证实基本条文和基本原则大家赞成，“少数领导人的意见，得到几千人的赞成”，这样就有信心了。第二，讨论里搜集到五千九百多条意见，不包括疑问。他把这些意见分成三部分：一部分不正确；一部分不见得很不正确，但不适当，以不采用为好；一部分是采用的。他自己提出疑问：既然有的不采用，为什么还要搜集？回答是，从中可以了解八千多人的思想里对宪法有哪些看法，可以做一个比较。第三，采用的那部分让草案更完全、更周密，他还说现在的草案也许还有缺点，所以还要向全国人民征求意见。\n\n由此得出的方法是：起草采取领导机关意见和广大群众意见相结合的做法。真正要求的有三件事：把意见全部收回来，而不是只收赞成的；每一条意见都要归到某一类，哪怕归入不采用；不采用的意见也留着，用来判断读者的认识分布。讲话没有说这三类怎样划分，也没有给出各类的数量。",
  failureMode: "它针对的是少数人闭门议出的东西没有经过检验就定下来，以及收了意见只留下顺耳的那一部分。他承认收回的意见里有一部分是不正确的，所以搜集不等于全部采用；他的要点是，不采用的那一部分也有用处。\n\n在今天的工程团队里，它的样子是：三位资深工程师写出一份设计文档，贴到频道里，收到几个说没问题的回复，就当作评审通过；有人提出的反对意见在文档的评论串里被一句暂不考虑带过，没有记下理由。三个月后，同一个反对意见在一次事故里重新出现，没有人记得它早就被提过。",
  worked: "讲话自己给出的数字是它能说明的全部：八千多人、五千九百多条意见。三类各占多少、由谁来归类、归类的标准是什么，讲话里没有写，这里没有查到可核对的材料。\n\n后来的研究从另一个方向看这次讨论。Neil Diamant 和 Xiaocai Feng 在《The China Journal》第七十三期（二〇一五年）发表《The PRC's First National Critique: The 1954 Campaign to Discuss the Draft Constitution》，称这是对一九五四年全国讨论的第一项详细研究，依据档案和党内刊物。他们的结论是：对普通人来说，这次讨论是第一次全国范围的、半公开的对共产党执政做法的批评，可以看作一九五六年百花运动的预演；对官员来说，则是借国家法律的语言去克服对集体化的抵触、管理难以管束的公民；这场讨论为此后从五十年代到今天的宪法批评定下了格局，范围广，但终究有限。这是两位作者的论断，其他研究者是否同意，这里没有查到。\n\n这两种读法并不矛盾。讲话说的是起草方怎样处理收回来的意见；研究者看的是意见是怎样被引出来的、又被用在什么地方。同一套收集意见的办法，既可以用来检验草案，也可以用来推动一项政策，两者在记录里可以分开看。",
  experiment: "找出你最近发出去征求意见的一份设计文档或提案。把所有评论导出来，一条一条归入三类：判断错了的，有道理但没有采用的，采用的。中间那一类每一条补写一句理由。数一数三类各有多少，再看反复出现的主题：哪些主题总落在前两类，说明读者对这个系统有哪些误解或没有说出来的约束。把三类的汇总发回给提意见的人，请他们指出归错的类。",
  reflection: "你上一次提出设计时，没有被采用的意见留下了记录吗？如果没有，下一个提同样意见的人怎么知道它被考虑过？",

<script>
/*
 * A four-operator arithmetic evaluator over named profile fields.
 *
 * Entries declare their sum as a string, so something has to turn that string
 * into a number. Not eval, and not a Function constructor: this runs in a page
 * that holds the reader's own financial figures, and an expression is content
 * rather than code. The grammar is an allowlist - decimal numbers, declared
 * identifiers, the four operators, brackets, and a leading sign. Anything else
 * fails to tokenise, so a call, a subscript, a semicolon or a property access
 * never reaches an evaluator at all.
 *
 * Both halves of the toolchain use this. build.js compiles every expression at
 * build time and checks its identifiers against the declared profile, which is
 * what stops a typo from surfacing as a silent NaN months later on the one day
 * that entry comes up.
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.EXPR = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  var NUM = /^\d+(?:\.\d+)?/;
  var NAME = /^[A-Za-z_][A-Za-z0-9_]*/;
  var PREC = { '+': 1, '-': 1, '*': 2, '/': 2 };

  function tokenize(src) {
    var s = String(src), out = [], i = 0;
    while (i < s.length) {
      var rest = s.slice(i), c = rest.charAt(0), m;
      if (c === ' ' || c === '\t' || c === '\n') { i++; continue; }
      if ((m = NUM.exec(rest))) { out.push({ t: 'num', v: parseFloat(m[0]) }); i += m[0].length; continue; }
      if ((m = NAME.exec(rest))) { out.push({ t: 'name', v: m[0] }); i += m[0].length; continue; }
      if (c === '(' || c === ')') { out.push({ t: c }); i++; continue; }
      if (PREC[c]) { out.push({ t: 'op', v: c }); i++; continue; }
      throw new Error('unexpected "' + c + '" at position ' + i);
    }
    if (!out.length) throw new Error('empty expression');
    return out;
  }

  /* Shunting-yard. `expectOperand` is what rejects the shapes that tokenise
     cleanly but are not arithmetic: two values in a row, a doubled operator
     such as **, or a bracket opening straight after a value, which is how a
     function call would have to look. */
  function toRPN(tokens) {
    var out = [], ops = [], expectOperand = true, i, tk, top;
    for (i = 0; i < tokens.length; i++) {
      tk = tokens[i];
      if (tk.t === 'num' || tk.t === 'name') {
        if (!expectOperand) throw new Error('two values in a row near "' + tk.v + '"');
        out.push(tk);
        expectOperand = false;
      } else if (tk.t === 'op') {
        if (expectOperand) {
          if (tk.v !== '-' && tk.v !== '+') throw new Error('"' + tk.v + '" needs a value before it');
          out.push({ t: 'num', v: 0 });          // unary: -x becomes 0 - x
          ops.push(tk);
        } else {
          while (ops.length) {
            top = ops[ops.length - 1];
            if (top.t === 'op' && PREC[top.v] >= PREC[tk.v]) out.push(ops.pop());
            else break;
          }
          ops.push(tk);
        }
        expectOperand = true;
      } else if (tk.t === '(') {
        if (!expectOperand) throw new Error('a bracket cannot follow a value');
        ops.push(tk);
        expectOperand = true;
      } else {
        if (expectOperand) throw new Error('empty brackets');
        while (ops.length && ops[ops.length - 1].t !== '(') out.push(ops.pop());
        if (!ops.length) throw new Error('unbalanced brackets');
        ops.pop();
        expectOperand = false;
      }
    }
    if (expectOperand) throw new Error('expression ends with an operator');
    while (ops.length) {
      top = ops.pop();
      if (top.t === '(') throw new Error('unbalanced brackets');
      out.push(top);
    }
    return out;
  }

  function compile(src) { return toRPN(tokenize(src)); }

  function names(src) {
    var seen = {}, out = [];
    tokenize(src).forEach(function (tk) {
      if (tk.t === 'name' && !seen[tk.v]) { seen[tk.v] = 1; out.push(tk.v); }
    });
    return out;
  }

  /* Returns null rather than NaN for a missing field or a division by zero.
     A NaN would render as "NaN" and read as a computed answer. */
  function run(src, vars) {
    var rpn = compile(src), st = [], i, tk, a, b, v;
    for (i = 0; i < rpn.length; i++) {
      tk = rpn[i];
      if (tk.t === 'num') { st.push(tk.v); continue; }
      if (tk.t === 'name') {
        v = vars ? vars[tk.v] : undefined;
        if (typeof v !== 'number' || !isFinite(v)) return null;
        st.push(v);
        continue;
      }
      b = st.pop();
      a = st.pop();
      if (tk.v === '+') st.push(a + b);
      else if (tk.v === '-') st.push(a - b);
      else if (tk.v === '*') st.push(a * b);
      else if (b === 0) return null;
      else st.push(a / b);
    }
    v = st.pop();
    return (typeof v === 'number' && isFinite(v)) ? v : null;
  }

  return { compile: compile, names: names, run: run, tokenize: tokenize };
});

<script>
/* ==========================================================================
   Daily — the reader

   Speaks a rendered entry aloud through the browser's own synthesiser. Nothing
   is fetched and nothing is stored, which is the only way a corpus this size
   gets an audio track at all: narrated as files the shared corpus runs to tens
   of hours, and a built page has to stay one self-contained file that works
   offline.

   The reader is handed text and speaks it. It never reads the corpus itself,
   and that division is load-bearing. app.js hands it only blocks that are on
   screen, and a locked entry returns before its body is built, so gated prose
   is not withheld here - it does not exist to be read. The recall answer is
   never part of an entry at all. Neither rule is enforced in this file and
   neither needs to be.

   Every utterance is short. Chrome stops synthesising after roughly fifteen
   seconds of a single utterance, reports no error, and leaves the queue
   looking healthy, so a paragraph handed over whole goes quiet halfway and
   nothing says why. Splitting to sentences keeps every utterance well inside
   that limit, which fixes it without a timer fighting the browser for control.
   ========================================================================== */
(function () {
  'use strict';

  var API = window.speechSynthesis;
  var Utterance = window.SpeechSynthesisUtterance;
  var NAV = window.navigator;
  var AVAILABLE = !!(API && Utterance);

  /* Only ever asked in this direction. navigator.onLine reports whether a
     network interface exists, not whether anything is reachable, so a true is
     worth nothing: a captive portal, a router with no uplink and a dead
     endpoint all report it. A false is the one answer it gets right, and it is
     the only one needed here. Compared against false explicitly so a browser
     that does not implement the property reads as online rather than as
     permanently offline. */
  function offline() {
    return !!NAV && NAV.onLine === false;
  }

  /* Long enough that the splits fall on real sentence ends most of the time,
     short enough that even the slowest voice finishes one inside the limit. */
  var MAX_CHUNK = 200;

  /* The same budget for Chinese and Japanese, counted in their characters.
     Mandarin synthesis runs at about four and a half characters a second, so
     sixty is roughly the thirteen seconds two hundred English letters take.
     Full-width punctuation is in the count, so a chunk of pure Chinese never
     runs past sixty characters. Korean is left out: it spaces its words and
     uses Latin punctuation, which the English rules already split on. */
  var MAX_CJK = 60;
  var CJK = /[\u2E80-\u9FFF\uF900-\uFAFF\uFE30-\uFE4F\uFF00-\uFFEF]/;

  var voice = null;
  var queue = [];
  var at = 0;
  var mode = 'idle';                    // idle | playing | paused
  var hooks = {};

  /* Bumped by everything that ends a read. A cancelled utterance still fires
     onend or onerror, and without this the handler advances a queue that has
     already been replaced, which starts the next entry reading itself. */
  var gen = 0;

  /* --- Splitting ---------------------------------------------------------- */
  function split(text) {
    var clean = String(text == null ? '' : text).replace(/\s+/g, ' ').trim();
    var out = [];
    if (!clean) return out;

    /* Chinese ends a sentence with a full-width mark and leaves no space after
       it, so those marks are sentence ends too, or a Chinese paragraph reaches
       the synthesiser as one utterance. The full-width semicolon is among them
       because Chinese prose strings long runs of clauses on it. None of these
       occur in English text, so English splits on its own marks alone. */
    var re = /[^.!?。！？；]+[.!?。！？；]*/g;
    var m;
    while ((m = re.exec(clean)) !== null) {
      var s = m[0].trim();
      if (s) push(out, s);
    }
    return out;
  }

  /* A sentence long enough to trip the limit is broken again at its last
     clause boundary. Cutting mid-clause is audible as a stumble, so a sentence
     with nowhere good to break goes over whole: a rare long utterance beats a
     reliable wrong pause.

     Chinese and Japanese past MAX_CJK break the same way, at the last
     full-width comma, semicolon, colon or enumeration comma that fits. A run
     with none of those is the one thing cut at the budget itself, because a
     gap between two of these characters is always a gap between syllables,
     where a cut in English text could land inside a word. */
  function push(out, s) {
    var over = cjkOver(s);
    if (over !== -1) {
      var pause = -1;
      ['，', '；', '：', '、'].forEach(function (mark) {
        pause = Math.max(pause, s.lastIndexOf(mark, over - 1));
      });
      var end = pause === -1 ? over : pause + 1;
      out.push(s.slice(0, end).trim());
      push(out, s.slice(end).trim());
      return;
    }

    if (s.length <= MAX_CHUNK) { out.push(s); return; }

    var cut = -1;
    ['; ', ': ', ', ', ' - '].forEach(function (mark) {
      var found = s.lastIndexOf(mark, MAX_CHUNK);
      if (found !== -1 && found + mark.length > cut) cut = found + mark.length;
    });

    if (cut === -1) { out.push(s); return; }
    out.push(s.slice(0, cut).trim());
    push(out, s.slice(cut).trim());
  }

  /* Where the first Chinese or Japanese character past MAX_CJK sits in s, or
     -1 when all of s fits. */
  function cjkOver(s) {
    var n = 0;
    for (var i = 0; i < s.length; i++) {
      if (CJK.test(s.charAt(i)) && ++n > MAX_CJK) return i;
    }
    return -1;
  }

  /* --- Voice --------------------------------------------------------------
     Nothing in the API reports how good a voice sounds, so the name is the
     only evidence there is. The tiers matter more than they look: a Mac offers
     around forty-seven English voices, most of them the 1990s concatenative
     set and a dozen of them novelty toys, so taking the first of anything is a
     coin flip that can land on Zarvox.

     Neural voices say so in their names. macOS ships its good ones as Premium
     or Enhanced downloads, Chrome's network voices are the Google family, and
     Edge exposes Microsoft's as Natural or Online. Anything unmarked falls
     through to whatever the browser itself calls default, which is at least a
     choice rather than a stumble, and then to no preference at all. Guessing
     is what produces the toys, so the last tier declines to guess. */
  var TIERS = [
    /premium|enhanced|neural|natural/i,
    /^(google|microsoft)\b/i
  ];

  /* A voice in the wrong language does not read badly, it reads nothing a
     listener can follow, so the page's language decides which voices are in
     the running before any tier gets a say. An exact tag wins over a regional
     sibling: zh-HK is Cantonese, and would read a Mandarin page in the wrong
     spoken language. Tags compare with - and _ alike and case ignored, because
     Android reports zh_CN where everything else says zh-CN. A page that
     declares nothing is read as English.

     Read from SITE directly because the first choice is made as this file
     loads, before app.js exists to hand anything over. */
  var DECLARED = (window.SITE && window.SITE.lang) || '';
  var LANG = norm(DECLARED);
  var PRIMARY = LANG ? LANG.split('-')[0] : 'en';

  function norm(tag) {
    return String(tag || '').replace(/_/g, '-').toLowerCase();
  }

  function inLanguage(voices) {
    var exact = LANG ? voices.filter(function (v) { return norm(v.lang) === LANG; }) : [];
    if (exact.length) return exact;
    return voices.filter(function (v) { return norm(v.lang).split('-')[0] === PRIMARY; });
  }

  function pickVoice() {
    var all = API.getVoices() || [];
    if (!all.length) return;

    /* A voice that is served over the network cannot work with the network
       down, so it is dropped from the running rather than chosen and then
       failed on. This is what keeps the tiers below from trading away the one
       property these pages are built on. It runs before the language match, so
       an offline page whose own language is only served over the network can
       still find a regional sibling installed locally. */
    if (offline()) all = all.filter(function (v) { return v.localService; });
    var own = inLanguage(all);
    if (!own.length) { voice = null; return; }

    /* Local wins inside a tier but never across one. A downloaded Premium beats
       a Google voice that needs the network, and a Google voice beats the local
       1990s set: these pages are built to work offline, but not at the price of
       sounding like a train announcement when something better is installed. */
    function best(pool) {
      var local = pool.filter(function (v) { return v.localService; });
      return (local.length ? local : pool)[0];
    }

    for (var i = 0; i < TIERS.length; i++) {
      var tier = own.filter(function (v) { return TIERS[i].test(v.name); });
      if (tier.length) { voice = best(tier); return; }
    }

    voice = own.filter(function (v) { return v.default; })[0] || null;
  }

  /* getVoices() is empty until the list loads, and browsers disagree about
     whether voiceschanged fires when it was already populated. Both paths ask. */
  if (AVAILABLE) {
    pickVoice();
    API.addEventListener('voiceschanged', pickVoice);
  }

  /* --- Queue --------------------------------------------------------------- */
  function announce(next) {
    mode = next;
    if (hooks.onState) hooks.onState(next);
  }

  function finish() {
    gen += 1;
    queue = [];
    at = 0;
    if (hooks.onPart) hooks.onPart(-1);
    announce('idle');
  }

  function step() {
    /* The one place a read is known to have reached the end, and so the only
       place onDone fires. stop() and a refused utterance both land in finish()
       as well, and neither of those means the entry was heard through -
       collapsing the three would have pressing Stop start the next entry. */
    if (at >= queue.length) {
      finish();
      if (hooks.onDone) hooks.onDone();
      return;
    }

    var mine = gen;
    var item = queue[at];
    if (at === 0 || item.part !== queue[at - 1].part) {
      if (hooks.onPart) hooks.onPart(item.part);
    }

    var u = new Utterance(item.text);
    if (voice) { u.voice = voice; u.lang = voice.lang; }
    /* With no voice chosen the browser picks one. Not every browser weighs the
       page's language when it does, and its default voice is usually English,
       so a declared language is named on the utterance itself. A page that
       declares none leaves the utterance's language unset. */
    else if (DECLARED) u.lang = DECLARED;
    u.onend = function () {
      if (gen !== mine) return;
      at += 1;
      step();
    };
    /* Cancellations arrive here too and the generation check has already
       swallowed those, so anything reaching the body is a voice that will not
       speak. The read ends rather than stuttering through the rest of the
       queue in silence, and the caller is told which kind of failure it was.

       Worth separating because only one of the two has anything the reader can
       act on. A network voice fails whenever the endpoint does not answer, and
       navigator.onLine cannot see most of the ways that happens - a captive
       portal reports itself as online - so this is where those cases surface
       rather than in the guard above. */
    u.onerror = function () {
      if (gen !== mine) return;
      var networked = !!(voice && !voice.localService);
      finish();
      if (hooks.onFail) hooks.onFail(networked ? 'network' : 'voice');
    };
    API.speak(u);
  }

  /* --- Public ------------------------------------------------------------ */
  function stop() {
    if (!AVAILABLE) return;
    gen += 1;
    queue = [];
    at = 0;
    API.cancel();
    if (mode !== 'idle') {
      if (hooks.onPart) hooks.onPart(-1);
      announce('idle');
    }
  }

  /* parts is [{ text }] in the order they should be heard. Anything else on
     those objects is the caller's and is passed back untouched by index.

     Returns false rather than starting where nothing would come out. A browser
     can carry the whole synthesis API and have no voice behind it - Chrome on
     a Linux box with no speech-dispatcher is the usual one - and in that state
     speak() is accepted, never finishes, and never errors. Left alone the
     button sits on Pause for a read that was never going to happen, so the
     caller is told instead. */
  function speak(parts, opts) {
    if (!AVAILABLE) return false;
    stop();
    if (!(API.getVoices() || []).length) return false;

    /* Re-chosen at the moment of use rather than watched for. Connectivity and
       the voice list can both have moved since boot, and one filter over a few
       dozen voices per click is cheaper than keeping online, offline and
       voiceschanged handlers honest between them. */
    pickVoice();

    hooks = opts || {};
    queue = [];
    (parts || []).forEach(function (p, i) {
      split(p.text).forEach(function (text) { queue.push({ text: text, part: i }); });
    });
    if (!queue.length) return false;

    at = 0;
    announce('playing');
    step();
    return true;
  }

  function pause() {
    if (mode !== 'playing') return;
    API.pause();
    announce('paused');
  }

  function resume() {
    if (mode !== 'paused') return;
    API.resume();
    announce('playing');
  }

  /* Chrome can restore a page with the synthesiser still parked in the paused
     state it was in when the page left, and every later speak() lands in it
     silently. Clearing on the way in and on the way out costs nothing. */
  if (AVAILABLE) {
    API.cancel();
    window.addEventListener('pagehide', stop);
  }

  window.SPEECH = {
    available: AVAILABLE,
    speak: speak,
    stop: stop,
    pause: pause,
    resume: resume,
    state: function () { return mode; },
    split: split,                       // exposed for the test harness only
    voice: function () { return voice; }
  };
})();

<script>
/* ==========================================================================
   Daily — shared engine

   One engine, many sites. Everything that differs between sites lives in
   window.SITE: the storage key, the tracks, the second facet, every string
   of visible copy, the review model, the commitment gate and whether the
   forecast book exists at all.

   State lives in localStorage under one versioned key. Nothing here talks to
   the network, so a built page works offline and forever.
   ========================================================================== */

  'use strict';

  var SITE = window.SITE || {};

  var EXPR = window.EXPR;                    // engine/expr.js, loaded before this

  var KEY = SITE.key;
  var TRACKS = SITE.tracks || [];
  var LEVELS = SITE.levels || {};
  var COPY = SITE.copy || {};
  var GATE = SITE.gate || null;
  var PROMPT = SITE.prompt || {};

  var HAS_REVIEW = SITE.review !== 'none';
  var HAS_EXPIRY = SITE.expiry === true;
  var HAS_FORECAST = SITE.forecastBook === true;
