  idea: "社会主义社会同样是对立统一的，一个工厂、一个合作社、一个学校里都有对立的方面，所以少数人闹事“年年都会有”。一件不应有的事反复出现，说明它是应有之事。对策是不怕、不捂：按最坏的可能做准备，让矛盾暴露出来，再分情况处理，闹得有道理的就承认和改正，没有道理的就驳回，不要轻易用强制手段。",
  why: "这篇讲话是一九五七年一月在省、市、自治区党委书记会议上讲的，选集收的是一月十八日和一月二十七日两次讲话。背景是前一年的匈牙利事件，国内也有学生闹事，合作社社员闹社，会议要讨论的问题主要是三个：思想动向、农村、经济。闹事问题是他在二十七日那次讲话里讲的第五点，说它在社会主义社会是个新问题，很值得研究。\n\n他的论证从哲学出发：社会上的事情总是对立统一的，社会主义社会里有人民内部的对立统一，也有敌我之间的对立统一，社会上仍有正面和反面，仍有对立的阶级、对立的人、对立的意见，所以闹事的根本原因在这里。他列出了几种具体成因：领导上的官僚主义和主观主义，政策上的错误；政策没错，但工作方法生硬；反革命分子和坏分子的存在。因此，“少数人闹事要完全避免是不可能的”。对这种情况只能准备，他说，怕是没有出路的，越怕，鬼就越来，“你准备出大事，就可能不出，你不准备出大事，乱子就出来了”。准备的办法是从最坏的可能设想，他举了党的七大时估计到十七条困难。\n\n处置上他给了几条：不提倡，但有人硬要闹就让他闹，让问题充分暴露；“闹得有道理，是应当闹的；闹得无道理，是闹不出什么名堂的”，分对的、不对的、有对有不对的三种处理；除了真正的反革命暴乱必须武装镇压之外，“不要轻易使用武力，不要开枪”；对闹事的人要分化，区分多数和少数，对少数坏人，除了最严重的犯罪，也不抓、不关、不开除，留在原单位。他还说，各种怪议论、怪事、矛盾，以揭露为好，“要揭露矛盾，解决矛盾”，又说坏事有两重性，坏事里头包含着好的因素。这个方法真正要求的是三件事：把反复出现的问题当作常态，在它出现之前就写好第一个小时怎么办；先分类再处置，分类要看道理，不看闹的动静；不把问题捂住，让它在可控的地方暴露。",
  failureMode: "文中点名的毛病是对闹事又怕，又简单处理，他认为根本原因是思想上不承认社会主义社会是对立统一的，不承认其中存在矛盾。具体的做法是一发怪议论、一罢工、一请愿就一棍子打回去，不许罢工，不许请愿，不许讲坏话，压到一个时候就要出事。\n\n在今天的工程团队里，它的样子是：把告警、客户投诉、值班升级当作不应有之事。告警太吵，就把阈值调高、把频道静音；租户反复报同一个问题，工单被一次次关闭；事故不对外披露，怕影响评价。每一次都是简单处理，指标看上去干净了，同一个矛盾却没有出口，直到一次大的故障把几个月积压的信号一起放出来。",
  worked: "这次讲话对闹事会反复出现的估计，有一项后来可以对照。美国学者裴宜理（Elizabeth Perry）在《中国季刊》一九九四年的文章《Shanghai’s Strike Wave of 1957》里写道，一九五七年春天，上海有五百八十七家企业发生了严重的劳工骚动，涉及近三万名工人，另有七百多家企业出现较轻的不安。骚动的数字依赖对骚动的界定，各研究给的时间范围也不同，这里只取裴宜理的数字。这些材料能说明的是，讲话说的少数人闹事会出现，在上海确实出现了；它们没有检验讲话所给的处置办法有没有效果。\n\n这次讲话之后，同一年的夏天开始了反右派斗争。一九八一年《关于建国以来党的若干历史问题的决议》认为，整风中极少数资产阶级右派分子乘机鼓吹大鸣大放，对这种进攻进行反击是完全正确和必要的，但是反右派斗争被严重地扩大化了。这是党自己的结论。讲话中提出的几条，比如对少数坏人也不开除、让反面教员留在原单位，具体在各地怎样执行、执行了多少，这里没有核对，不作判断。\n\n读者拿到的是选集里的文本。选集第五卷一九七七年出版，收了一月十八日和二十七日两次讲话；原始记录与这一版逐句有什么出入，这里没有核对。文中没有说明的是，“闹得有道理”由谁判断，依据什么证据，判断错了怎样纠正。方法的前提是判断者愿意让自己被反驳，这一条文中没有制度上的保证。",
  experiment: "列出你们平台过去十二个月里反复出现的三类事情：租户超配额、发布回滚、证书或凭据过期、同一个告警被静音、某个依赖的升级再次延期，选三类就行。对每一类写四行：过去十二个月出现了几次；每次当时的处理是压（静音、关闭、延期、不披露）还是暴露（追查、公开复盘、改工具）；它的原因属于我们自己的政策或工具有毛病、流程太生硬，还是确有滥用；如果它明年还会出现，第一个小时的处理步骤是否已写下来、有没有人演练过。挑最频繁的一类，写下最坏情形的第一个小时处置单，并安排一次演练，演练后把处置单改一遍。",

  id: "one-sidedness-is-absolutising",
  track: "contradiction", level: "v5",
  title: "片面性是思想上的绝对化",
  source: "《在中国共产党全国宣传工作会议上的讲话》（一九五七年三月十二日），第五卷",
  idea: "对工作的看法，肯定一切或者否定一切，都是片面性。“片面性就是思想上的绝对化，就是形而上学地看问题”，克服它的办法是分析，而“所谓分析，就是分析事物的矛盾”：好的和坏的各是什么，它们之间有什么联系。不能要求所有人都不带一点片面性，但可以也应该要求人们一年比一年看得全面一些。",
  why: "这篇讲话是一九五七年三月十二日在中国共产党全国宣传工作会议上讲的，共八点，第六点讲片面性。当时党中央已作出决定，准备在这一年党内开始整风，讲话的第五点专讲整风，要批判主观主义、官僚主义、宗派主义，方法是批评和自我批评，既要严肃认真，又要“惩前毖后，治病救人”。片面性问题是接着整风提出来的：既然要大家提意见，意见怎样才算站得住。\n\n他把片面性分成两种。肯定一切，是只看到好的，看不到坏的，只能赞扬，不能批评；否定一切，是不加分析地认为事情都做得不好，一团糟，这种看法使人丧失信心。两者的毛病相同，都是把一件事看成绝对的好或绝对的坏。他的说法是，“不是一切都好，还有缺点和错误”，“但是也不是一切都坏”，要加以分析。他也预先回答了一个反对意见：有人说既然要提意见，就必然带片面性，提出克服片面性等于不让人讲话。他的回答是，要求所有的人都不带一点片面性是困难的，人总是根据自己的经验看问题，难免带上一些，但应该要求逐步克服，不这样要求，就是肯定片面性，同整风的要求背道而驰。\n\n他把分析的要求落到文章的写法上：有些文章神气十足，没有货色，讲不出道理，写文章要“对事物有分析，写文章有说服力，不要靠装腔作势来吓人”。分析不是文章长短的问题，几百字的杂文也能分析，鲁迅后期的杂文深刻有力，是因为这时候他学会了辩证法。但分析的前提是了解对象：“不熟悉生活，对于所论的矛盾不真正了解，就不可能有中肯的分析”。这个方法真正要求的是三件事：每一个整体判断，都拆成好的和坏的两边，各写证据；写出两边之间的联系，也就是矛盾；写不出来的时候，承认这是因为不了解，去补材料，不是去补语气。",
  failureMode: "文中点名的毛病是两个相反的绝对化：把工作说成一切都好，只能赞扬，不能批评；或者说成一团糟，一切都坏。他还指出，有些文章神气十足，但是讲不出道理，没有说服力，是靠架子，不是靠分析。\n\n在今天的工程团队里，它的样子是：季度平台汇报里全是上线的项目和绿色的指标，没有一行讲欠下的可靠性债务；一次严重事故之后，同一批人又说调度系统根本不可维护，要整个重写。两个说法都没有拆开看：调度系统的哪一部分出了问题，哪一部分在稳定地服务几十个团队，它的哪一个设计取舍同这次事故有关。结果是前一种说法没有人敢反对，后一种说法没有人能反驳。",
  worked: "这篇讲话的发表情况，选集第五卷注明是一九七七年四月出版，收在第四百零三页至四百一十八页。讲话没有说明由谁来判断一篇批评是不是片面的。它自己预先说过，说要求人人看问题都必须很全面，会阻碍批评的发展；但这条边界靠什么保证，文中没有交代。选集发表的是后来的整理稿，同当时现场发言逐句有什么出入，这里没有核对，不作判断。\n\n同一年的夏天开始了反右派斗争。一九八一年《关于建国以来党的若干历史问题的决议》对此的结论是，反击整风中少数右派分子的进攻完全正确和必要，但是反右派斗争被严重地扩大化了，把一批知识分子、爱国人士和党内干部错划为右派分子。这是党自己的结论，决议正文里没有提到这篇讲话。\n\n另一处记录是决议对毛泽东本人的评价。决议写道，他在“文化大革命”中犯了严重的错误，但就他的一生来看，他对中国革命的功绩远远大于他的过失，功绩是第一位的，错误是第二位的；同时决议批评了两种态度：一种是因为他晚年犯了错误，就否认毛泽东思想的科学价值；另一种是把凡是他说过的话都当作不可移易的真理，不愿实事求是地承认他晚年犯了错误。决议说这两种态度都是完全错误的。这是党的官方结论，写法是把功绩和错误分成两边并排出主次。这同讲话里的主张在形式上是一致的，但决议没有提到它依据的是这篇讲话，这里只作对照，不作因果的判断。",
  experiment: "找出你们平台最近一份带有整体判断的文件（季度汇报、事故复盘、架构评审都行），把其中带有整体判断的句子圈出来：运行稳定、过于复杂、难以维护、完全可以替代之类，圈三条。对每一条写四行：它好的一面和证据，坏的一面和证据，这两面之间的联系，也就是为了得到好的一面付出了什么，以及你还缺什么材料才能写得更准确。如果写不出联系，那就说明还不了解，写下你要去测的东西。最后把这三条判断改写成带两面的句子，交给一位熟悉另一套方案的人，让他指出你把哪一面写轻了。",

  source: "《矛盾论》（一九三七年八月），第一卷",
  idea: "不但矛盾之间有主次，一个矛盾的两个方面之间也有主次：双方的发展是不平衡的，有时似乎势均力敌，那只是暂时和相对的情形。起主导作用的是主要方面，事物的性质主要由它规定。主要方面不是固定的，双方力量此长彼消，就会“互易其位置”，事物的性质随之改变。所以一对矛盾里谁在起主导作用，要用力量的增减去判断，不能凭一般印象，也不能当作永远不变。",
  why: "这是《矛盾论》第四节的后半部分，写于一九三七年八月，题注说写作目的是克服党内严重的教条主义。前半部分讲的是矛盾之间的主次，后半部分接着问：在每一个矛盾内部，两个方面是否可以平均看待。回答是不可以：“无论什么矛盾，矛盾的诸方面，其发展是不平衡的”，有时似乎势均力敌，然而这只是暂时的和相对的情形，“基本的形态则是不平衡”。矛盾着的两方面中，“必有一方面是主要的，他方面是次要的”，主要的方面就是起主导作用的方面。\n\n这个主次不固定。他的说法是，这要“依靠事物发展中矛盾双方斗争的力量的增减程度来决定”。他举的例子很多：新的方面由小变大，上升为支配的东西，旧的方面由大变小，旧事物的性质就变成新事物的性质，资本主义取代封建主义就是这样；革命斗争中有的时候困难是矛盾的主要方面，顺利是次要方面，一九二七年失败之后和红军长征的时候都是如此，后来困难让位于顺利，反过来，革命党人犯了错误，一九二四年至一九二七年的胜利就变成了失败。最容易被忽略的是最后一个例子：有人觉得生产力和生产关系、理论和实践、经济基础和上层建筑这几对矛盾，前一方永远是主要的，不会易位，他的评语是，这是机械唯物论的见解，不是辩证唯物论的见解。生产力、实践、经济基础一般起决定作用，这一点必须承认；但是当不变更生产关系生产力就不能发展的时候，生产关系的变更就起了主要的决定作用，当上层建筑阻碍经济基础发展的时候，政治和文化上的革新就成为主要的决定的东西。\n\n不研究这两种情形，在他看来，就会“陷入抽象的研究”，不能具体地懂得矛盾，也找不出解决矛盾的正确办法，这两种情形的差别都是矛盾力量的不平衡性，因此必须反对“平衡论，或均衡论”。这个方法真正要求的是三件事：对每一对矛盾，先说清楚眼下是哪一方起主导作用，并且拿得出它力量增减的证据；同时写下易位的条件，什么变了，主次就会换；对一般认为总是占上风的一方，不预设它永远是主要的。",
  failureMode: "文中针对的错误有两个方向：一个是对矛盾的两方面平均看待，也就是“平衡论，或均衡论”，另一个是把某一方的主要地位当作固定不变的，也就是文中说的机械唯物论，认为主次的地位不互相转化。两者都使人不去研究具体的力量对比。\n\n在今天的工程团队里，它的样子是：平台团队五年前定下一条规矩，稳定性永远优先于交付速度。当时每次变更都可能带来大故障，这条规矩是对的。后来金丝雀、自动回滚和容量护栏都建好了，事故率降得很低，评审门槛却没有变，业务团队的发布要排两周。业务团队开始绕过平台，自己写部署脚本，真正影响系统性质的主要方面已经换成了速度，团队还在按旧的主次分配精力。另一种样子是季度目标里写着稳定性和速度各占一半，没有人判断眼下由哪一方主导，评审时谁的声音大就听谁的。",
  worked: "中共中央一九四七年十二月二十五日至二十八日在陕北米脂县杨家沟开会，毛泽东在会上的报告《目前形势和我们的任务》，可以对照这一节的方法。选集的题注说明了会议的时间和地点。报告开头判断，中国人民的革命战争“已经达到了一个转折点”：第一年（一九四六年七月至一九四七年六月），解放军在几个战场上打退进攻，迫使国民党军转入防御；一九四七年七月至九月，解放军转入全国规模的进攻，战争主要地已经不是在解放区内进行，而是在国民党统治区内进行了。报告列出的数字是，十七个月（一九四六年七月至一九四七年十一月）共歼灭正规军和非正规军一百六十九万人，其中打死打伤六十四万人，俘虏一百零五万人。这些数字是毛泽东本人在党的会议上的报告，这里没有找到独立的统计来核对，不能当作第三方的结论引用。\n\n同一份报告也显示，这个判断没有把力量对比看成单一的数字。一九四六年七月，国民党方面有正规军二百万、非正规军一百余万，后方机关和部队一百余万，总共四百余万人，还接收了日军一百万人的全部装备，并有美国的军事和财政援助。毛泽东的论断是，蒋介石军事力量的优势“只是暂时的现象”，是临时起作用的因素，而战争的反人民性质和人心的向背才是经常起作用的因素。在军事原则里，他又把优劣分开讲：全体上我军在数量上是劣势，但在每一个具体战役上集中两倍到六倍于敌的兵力，“在每一个局部上”是绝对的优势。也就是说，主次的判断要在不同的层面各做一次，全局的和局部的可以不一致。这是毛泽东自己的叙述。\n\n他也记录了一次因为没有随阶段调整而出的毛病。报告说，一九三一年至一九三四年实行过“地主不分田，富农分坏田”的过左政策，不应重复；抗战时期为了建立统一战线，党把没收地主土地改为减租减息，日本投降以后，又在一九四六年五月四日的指示里改回没收，一九四七年九月通过的《中国土地法大纲》对《五四指示》的不彻底性作了改正。选集注〔9〕还记下，一九四八年二月，新解放区的土地改革又改为分两个阶段，第一阶段中立富农，专门打击地主。同一个问题，在力量对比不同的阶段，处理的办法改了三次以上，这是按阶段换办法的一个具体记录。它没有说明的是，主次易位要积累到什么程度才算数：文中只给出方向，说取决于双方斗争力量的增减程度，没有给出可以量的标准。",
  experiment: "列出你们平台里三对长期对立的力量，比如速度和稳定、自助和管控、标准化和定制。对每一对写四行：眼下哪一方在决定这个系统的性质，凭哪个可以量的证据（比如走标准路径的变更占多少，绕过去的占多少，评审的排队时间，例外的数量）；过去四个季度这个量往哪个方向走；如果它再走四个季度，哪个量会先越过哪条线，主次就算易位；你们现在的规矩、评审门槛或目标，是照着哪个季度的主次定的。挑规矩最老的那一对，写下一条可以被推翻的预测：到下个季度末，这个量应该在哪里。",

{
  id: "a-difference-is-already-a-contradiction",
  track: "contradiction", level: "v1",
  title: "差异就是矛盾，不是等到激化才有",
  source: "《矛盾论》（一九三七年八月），第一卷",
  idea: "矛盾的普遍性有两层意思：矛盾存在于一切事物的发展过程中，并且每一过程里都存在着自始至终的矛盾运动。所以“差异就是矛盾”，不能说过程到了某个阶段才冒出矛盾，在那以前只有差异。两个阶级从发生的时候起就互相矛盾，只是还没有激化。看到一处只是有点不同的事，要先承认其中有矛盾，再去问它是什么性质，会不会发展成对抗。",
  why: "这是《矛盾论》第二节。作者在文中说明，普遍性已经被很多人承认，所以讲得简短，真正要用力讲的是特殊性，但全文的顺序是先讲普遍性，再着重讲特殊性，最后仍然回到普遍性。普遍性这一节引了恩格斯和列宁的话，也举了他自己的例子：战争中的攻守、进退、胜败是矛盾着的现象，失去一方，他方就不存在；党内不同思想的对立和斗争经常发生，是社会的阶级矛盾和新旧事物的矛盾在党内的反映，党内如果没有矛盾和解决矛盾的思想斗争，“党的生命也就停止了”。他的结论是：“没有矛盾就没有世界”。\n\n这一节的论战对象是德波林学派。据他转述，这个学派认为，矛盾不是一开始就在过程中出现，要等过程发展到一定阶段才出现；在那以前，过程发展的原因就只能是外部的，所以又回到了外因论。他们拿这个见解去分析具体问题，就看到苏联条件下富农和一般农民之间只有差异，并无矛盾，同布哈林的意见一致；在法国革命之前的第三等级里，也只有差异，并无矛盾。他的反驳是，每一个差异中就已经包含着矛盾：劳资之间，从两个阶级发生的时候起，就是互相矛盾的，“仅仅还没有激化而已”；工农之间，即使在苏联的社会条件下也有差异，这个差异就是矛盾，只是不会激化成为对抗，不取阶级斗争的形态。他的说法是：“这是矛盾的差别性的问题，不是矛盾的有无的问题”。新过程发生时，旧的统一让位于新的统一，新过程又包含着新的矛盾，开始它自己的矛盾发展史。\n\n这一节还引了列宁对《资本论》的评语：马克思从最简单、最普通、碰到亿万次的关系，也就是商品交换这个资产阶级社会的细胞入手，在其中暴露了现代社会的一切矛盾和矛盾的胚芽。这个方法真正要求的是三件事：对一个眼下只是“差异”的事情，先判断它里面有没有矛盾的两方，各自需要对方什么；再问它的性质，是会激化成对抗的，还是可以长期共存、逐步解决的；研究复杂的局面时，先找最简单、最常见的那个细胞，在那里把矛盾看清楚。",
  failureMode: "文中批的是德波林学派的看法：以为矛盾要等到一定阶段才出现，在此之前发展靠的是外因，所以只看见差异，看不见矛盾。这种看法把一个已经在积累的矛盾，当作不存在的东西，直到它激化才被承认。\n\n在今天的工程团队里，它的样子是：平台团队和数据团队谈共享队列的容量预留，各自说只是理解有点不同，没有人把它写成一个待解决的问题。接下来三个季度，数据团队的预留量一直在涨，平台团队的人工审批一直在积压，双方都在用例外绕过口头约定。到一次扩容失败的时候，这就成了一场责任之争。同一处差异，如果在第一次被注意到的时候就被记成矛盾，写下双方各自需要什么，成本只有一次对话。",
  worked: "这一节举的例子里，有一个能同后来的记录对照：苏联的富农。要说明的是，这里的“德波林学派认为富农和一般农民之间只有差异”，是毛泽东转述苏联哲学界批判文章里的说法。选集注〔3〕只说，三十年代初苏联哲学界批判这个学派，认为它犯了理论脱离实践、哲学脱离政治等唯心主义性质的错误；德波林本人的著作，这里没有核对，不能把转述当作他的原话。\n\n这个例子后来在苏联有了实际的结局，要同文本分开读。斯大林一九二九年十二月二十七日在全苏联马克思主义土地问题研究者会议的闭幕会上讲话（英文标题 Concerning Questions of Agrarian Policy in the U.S.S.R.，马克思主义文库有英文全文），宣布党已经从限制富农剥削倾向的政策，转到把富农当作一个阶级消灭的政策。美国历史学家维奥拉（Lynne Viola）在 The Unknown Gulag（牛津大学出版社，二〇〇七年）里记述了随后的流放：一九三〇年和一九三一年有近两百万农民被送往边远地区。另一份引用苏联档案的数字是一百八十万零三千三百九十二人，两个口径不同，这里只取量级，数字没有对照原书核对。《矛盾论》没有说苏联的富农问题应当怎样处理，它只说差异中就含着矛盾，并且矛盾的性质要具体分析；一九二九年以后的做法，是在这个判断之后又加了一步，这一步不是这一节的结论，不能算在它头上。\n\n毛泽东自己把这一节的命题用到了社会主义社会，记在一九五七年二月二十七日的讲话里。他说，许多人承认矛盾这个规律是一回事，应用这个规律去观察和处理问题是另一回事；许多人不承认社会主义社会还有矛盾，结果在矛盾面前缩手缩脚；他还把年度经济计划的平衡解释为矛盾的暂时的相对的统一，过了一年平衡就被打破，要再作一次。这是当时的文本，讲话发表时经他整理和补充过。这几处能证明的是，他在这篇文章里写下的普遍性后来被用来分析当时的计划工作；这里没有核对当时的经济部门是否真的这样运用了它。",
  experiment: "找出你们平台里五件被说成“只是”的事：只是风格不同、只是优先级不同、只是术语不统一、只是文档没跟上、只是两个团队的理解不一样。对每一件写四行：矛盾的两方各是谁，各自需要对方什么，眼下它采取什么形式（口头默契、文档里的例外、人工审批、悄悄的绕行），如果它激化，会由哪个触发条件推出来。挑存在时间最长的那一件，写出它如果被当作矛盾处理，第一步最便宜的动作是什么，做一次，把结果写下来。",

  source: "《关于正确处理人民内部矛盾的问题》（一九五七年二月二十七日），第五卷",
  idea: "对一个已经处理过大半的问题，估计剩下的部分，有两种相反的错误：说已经没有了，就会松懈；说还很多，就会搞乱。他给的估计是两句话：“还有反革命，但是不多了”。同时，处理办法要跟着阶段变，“过去的政策适合于过去的情况”，今天的政策适合今天的情况，不能拿后一种去否定前一种当时的成绩；但对工作的评价也要两头都算，既有成绩，也有错误，“过火的，漏掉的，都有”。",
  why: "这是一九五七年二月二十七日讲话的第二个小题目“肃反问题”。它先交代两类人的意见同他不一样：右倾的人不分敌我，认敌为我，“左”倾的人把敌我矛盾扩大化。这两种偏向在讲话的第一部分已经讲过。这一节接着做的是另一件事：怎样估计肃反工作，以及怎样估计眼下还剩多少。他用匈牙利事件的影响来估计：事件发生后，国内一部分知识分子有些动荡，但没有引起什么风浪，原因之一是相当彻底地肃清了反革命。但他马上排了次序，国家的巩固“首先不是由于肃反”，首先是由于有经过几十年锻炼的共产党和解放军、劳动人民，其次是经济措施基本正确，人民生活稳定并有所改善，对民族资产阶级等的政策正确，肃反的成功只是重要原因之一。\n\n接着是阶段的区别。他说，解放以后肃清了一批反革命分子，一些罪行严重的被处死刑，这是完全必要的，是为了解放长期受压迫的群众，也就是解放生产力；从一九五六年以来情况根本改变，就全国说来，反革命分子的主要力量已经肃清，根本任务由解放生产力变成在新的生产关系下保护和发展生产力。所以，有人想用今天的政策去翻过去的案，想否定过去肃反工作的巨大成绩，这是完全错误的。同一段里他也说，肃反工作成绩是主要的，但是也有错误，过火的，漏掉的，都有，方针是“有反必肃，有错必纠”。\n\n最后是对眼下残余的估计。他说可以用两句话说明：还有反革命，但是不多了。先说“还有”：有人说已经没有了，天下太平了，可以把枕头塞得高高地睡觉了，这是不合事实的，因为没有肃清的暗藏的反革命分子不会死心，美帝国主义者和蒋介石集团还在派特务进来，原有的肃清了还可能出现新的，丧失警惕就会吃大亏。再说“不多”：如果说现在全国还有很多，这个意见也是错误的，“如果接受这种估计，结果也会搞乱”。这个方法真正要求的是三件事：估计残余时先排原因的次序，别把一个措施的功劳排到第一；对剩下的部分既不说零，也不说很多，要拿得出一个量；政策随阶段换，评价工作时错的和漏的两头都算。",
  failureMode: "文中点名的是两种相反的估计：一种是认为已经没有了，可以高枕而卧，另一种是认为现在全国还有很多。第一种使人丧失警惕，第二种使人把局面搞乱。还有一种混合的毛病，是用今天的政策去翻过去的案，把一个阶段的办法拿去评另一个阶段的账。\n\n在今天的工程团队里，它的样子是：一次严重的凭据泄露之后，团队把所有告警都升到值班呼叫级别，把每一个变更都改成三人评审，到处是草木皆兵的做法。半年后值班疲劳，阈值悄悄调回去，评审变成点一下批准。又过了一年没有出事，有人在周会上宣布隐患已经清零，演练被取消，扫描任务也停掉。真正的状态是还有一些，但不多，而这个数没有人量过，团队的姿态只是在两头来回摆。",
  worked: "这种两头来回摆，在党的公安部门自己的公开讲话里有记录。公安部部长罗瑞卿在中共八大上的发言（一九五六年九月十八日，文本取自劳改研究基金会网站上的扫描件，这里没有同八大的发言集核对）说，肃反斗争有一个规律：敌人没有出现破坏的迹象时，人们容易麻木不仁；一旦出现，又容易惊惶失措，“感到特务如麻，草木皆兵”，把思想错误或工作错误同反革命破坏混为一谈；麻痹严重的地方一发动斗争就容易过火，纠正之后麻痹又会重新抬头，这种转换“有时是很快的”。他接着列了几次偏差：一九五○年十月以前的大半年，发生过“宽大无边”的右倾错误；一九五一年镇压反革命高潮的后期，在若干地方捕了一些可捕可不捕的人，杀了极少数可杀可不杀的人，甚至错捕了个别好人；约在一九五四年春到一九五五年春的一年左右，由于过高地估计了已经打击的程度，对残余势力还有相当数量估计不足，一度放松了打击；一九五五年下半年开始的肃反运动中也有缺点和错误。这是当事部门首长自己的叙述，他把这些错误定性为局部的、暂时的、一般及时得到纠正的，这个定性出自他本人。\n\n发言还说，党中央最近决定，对运动中错斗、错捕、错关、错判的人要认真检查，做好甄别和平反工作。这同毛泽东几个月后在讲话里说的，原来在什么范围内弄错的，也应该在什么范围内宣布平反，是同一个方向。发言里没有给出错案的数量，这里也没有找到别的可以核对的统计，所以不引用任何错案数字。\n\n这两份文本能互相印证的是，对残余的估计确实在两头摆过，一九五四年到一九五五年是估计不足，而一九五一年后期和一九五五年的偏差是过火。它们没有给出的是“不多”到底是多少。讲话和发言谈残余时都只用定性的词，没有给出一个量，也没有给出什么数字出现时姿态要改变。把两头来回摆管住，需要的恰恰是这个量，这是方法里缺的一块。",
  experiment: "把过去十八个月里你们平台的六次事故或险情列出来。对每一次写三项：事后加了什么规矩或检查；六个月后这条规矩的状态（仍在执行、被绕过、悄悄取消）；这次事故之后团队的姿态是收紧还是放松。画出姿态随时间的摆动。然后选一类剩余风险，比如过期凭据、没有负责人的服务、没人演练过的恢复流程，不靠印象，用一次扫描或统计量出眼下还有多少，并写下两个数：低于哪个数可以撤掉一部分检查，高于哪个数要重新收紧。把这两个数连同日期写进你们的运行手册。",

  title: "统筹兼顾，不嫌人多",
  source: "《关于正确处理人民内部矛盾的问题》（一九五七年二月二十七日），第五卷",
  idea: "做计划、办事、想问题，要从全体人口出发，不能把圈子越缩越小。人多是“本钱”，也带来困难，“又发展又困难，这就是矛盾”，而任何矛盾都应当解决，也可以解决。办法是“统筹兼顾、适当安排”：对每一类问题，就当时当地的实际可能条件，同各方面协商，作出适当的安排，不因为人多、落后、事情麻烦就推出门外。但这不等于一切由政府包下来，许多事可以由社会团体和群众自己想办法，要去指导他们这样做。",
  why: "这是讲话十二个小题目中的第七个。前面几节依次讲了农业合作化、工商业者、知识分子、少数民族，每一节都是人民内部的一类矛盾；这一节把它们放进一个总的原则里。他一上来就说，统筹兼顾是指对于六亿人口的统筹兼顾，“千万不要忘记这一点”。他的理由是，有些人办起事来就忘了，似乎人越少越好，圈子紧缩得越小越好，这种“小圈子主义”同“调动一切积极因素”的要求是抵触的。他希望这些人承认六亿人口是一个客观存在，“这是我们的本钱”。\n\n论证很短。人多是好事，但也有困难，建设事业在蓬勃发展，困难问题还是很多，这两方面同时存在，就是矛盾。粮食、灾荒、就业、教育、知识分子、各种爱国力量的统一战线、少数民族，以及其他各项问题，都要从对全体人民的统筹兼顾这个观点出发，就当时当地的实际可能条件，同各方面协商，作出各种适当的安排。他明确划出两个边界：一是决不可以嫌人多、嫌人落后、嫌事情麻烦难办而“推出门外了事”，二是不是把一切人一切事都由政府包下来，许多人和许多事可以由社会团体想办法，可以由群众直接想办法，这也包括在统筹兼顾、适当安排的方针之内，要指导社会团体和各地群众这样做。\n\n这个方法真正要求的是三件事：先把所有相关的群体列全，不先按麻烦程度删掉一部分；每一类都问一遍，是只有自己能做，还是可以交给对方自己想办法；安排要写明“当时当地的实际可能条件”，也就是在资源有限的情况下，今年给谁什么，不给谁什么，为什么。",
  failureMode: "文中点名的是“小圈子主义”：办事时嫌人多、嫌人落后、嫌事情麻烦，把圈子越缩越小，把一部分人推出门外了事。紧挨着它的另一个毛病，是把一切人一切事都包下来，这同样不是这个方针。\n\n在今天的工程团队里，它的样子是：平台团队把受支持的用户限定在三个同标准路径吻合的团队，其余的因为栈不一样、要求特殊、沟通成本高，被划成不受支持。这些团队没有消失，它们各自搭了影子工具，凭据、监控、发布都不在平台的视野里，一次事故时才发现平台对它们几乎看不见。反方向的毛病是平台答应了所有需求，排期永远满，每一个团队都在等同一个队列。",
  worked: "这一节谈到的几项安排里，有一项留下了可以对照的记录，就是西藏。这篇讲话里说，按照中央和西藏地方政府的十七条协议，社会制度的改革必须实行，但何时实行，要待西藏大多数人民群众和领袖人物认为可行的时候才作决定，不能性急；现在已决定在第二个五年计划期间不进行改革，第三个五年计划期内是否进行，到那时看情况才决定。美国人类学家戈尔茨坦（Melvyn Goldstein）在《现代西藏史》第三卷（加州大学出版社，二〇一三年）里把一九五七年的这个决定写成一次转向：已调到拉萨、为改革作准备的汉族干部被撤回，干部被告知，藏族上层没有准备好之前不要开始改革，即便传统的寺院和庄园制度因此再保留多年。这一说法取自出版社和书商的内容介绍及一篇书评，没有核对原书的页码；一九五七年以后这个安排怎样演变，这里没有核对，不在这一节的范围内。\n\n这一节的方针同讲话几个月之后的党内文件相对照，也能看出一处张力。一九五七年六月八日，毛泽东为中共中央起草的党内指示《组织力量反击右派分子的猖狂进攻》里有一句：在这个期间，不要提出福利工资等问题，一致对付反动派。这是文件里的原话，指的是大鸣大放期间如何处理工厂里的情绪。它说明在运动的紧要时候，这类各方面的具体要求被放到了一边，同上面“同各方面协商”的要求不是同一个做法。文件没有说这些要求之后怎样补上。\n\n文中没有给出的是资源不够时的取舍规则。统筹兼顾、适当安排这八个字规定了态度和方向，没有说一个预算一年只够安排三件事时，哪三件，依据什么。西藏的例子里，推迟的是改革的时间，不是资源的分配；这一节也没有举出一个在资源上真正做了取舍的案例。",
  experiment: "列出你们平台服务过或本应服务的所有群体，至少八类：标准栈的业务团队、有状态存储的团队、批处理和数据团队、小团队、外部合作方、遗留系统的维护者等等。对每一类写四行：眼下平台为它做了什么；它因为什么被排在外面（栈不同、要求特殊、人少、麻烦）；它为此绕开平台做了什么（影子工具、自建脚本，能数出来的数）；这件事是只有平台能做，还是可以给它一条自助的路径让它自己想办法。然后在本季度的容量上，写出一个实际的安排：给谁什么，不给谁什么，为什么，并写下一句可以被推翻的预测，即两个季度后绕开平台的数应当减少到多少。",

  why: "这是讲话十二个小题目中的第八个，讲百花齐放、百家争鸣、长期共存、互相监督。他说这几个口号是根据中国的具体情况提出来的，前提是承认社会主义社会仍然存在各种矛盾，目的是国家迅速发展经济和文化。在艺术和科学上，他的判断是，用行政力量强制推行一种风格、一种学派，禁止另一种，会有害于艺术和科学的发展，是非问题应当通过自由讨论和实践去解决。理由有一条很具体：“为了判断正确的东西和错误的东西，常常需要有考验的时间”，哥白尼的学说、达尔文的进化论，都曾经被看作错误的东西。他还承认，在社会主义社会里，压抑新生力量、压抑合理的意见仍然是常有的事，“不是由于有意压抑，只是由于鉴别不清”，也会妨碍新事物成长。\n\n对待错误思想，他分了两种情形。对于明显的反革命分子和破坏社会主义事业的分子，剥夺他们的言论自由就行了；对于人民内部的错误思想，禁止行不行，回答是当然不行，用简单的方法去处理，不但不会收效，而且非常有害。他用了一个比喻：“同错误思想作斗争，好比种牛痘”，经过疫苗的作用，人身上就增强免疫力，“在温室里培养出来的东西，不会有强大的生命力”。他也说了反面：不加批评，看着错误思想到处泛滥，当然不行，“有错误就得批判，有毒草就得进行斗争”，只是批评不应当是教条主义的，要有科学的分析，要有充分的说服力。\n\n最后他给了鉴别香花和毒草的六条政治标准，依据是宪法的原则、最大多数人民的意志和各党派历次宣布的共同主张，归结起来最重要的是社会主义道路和党的领导两条，并说明提出标准是为了帮助人民发展自由讨论，不是为了妨碍它，不赞成这些标准的人仍然可以提出意见来辩论。这个方法真正要求的是三件事：对一个看上去错误的想法，先让它表现出来，用论据和试验去回答它，不用禁令；批评之前，把判断的标准写出来，并且允许对标准本身提意见；承认自己的鉴别也可能出错，给新想法留一段试验的时间。",
  failureMode: "文中点名的做法是用简单的方法处理思想问题：禁止，不让发表，或者用教条主义的批评一棍子打下去。他还说了相反的毛病：对错误思想不加批评，看着它们到处泛滥，任凭它们去占领市场。\n\n在今天的工程团队里，它的样子是：架构评审把所有非标准的方案一概否决，一个团队想用另一种语言写一个小服务，被告知平台不支持，没有人要求他们做一次有时限的试验。这个想法没有消失，转到了私下的脚本里，而标准方案从来没有受过真实的挑战，遇到压力时才暴露出没有人知道它的弱点。反方向的毛病是评审没有写明的准入标准，谁的声音大，谁的方案就进来，下一次又被另一个人推翻。",
  worked: "这一节的方针和随后的记录之间，可以从毛泽东自己的两份文件对照。一份是一九五七年五月十五日写的《事情正在起变化》，发给党内干部阅读（选集第五卷第四百二十三页至四百二十九页）。其中说，毒草是要锄的，这是意识形态上的锄毒草，“整”人是另一件事，不到某人严重违法乱纪，是不会受整的，严重违法乱纪指的是国家和人民的利益受到严重损害，而且是在屡戒不听、一意孤行的情况下引起的。另一份是六月八日为中共中央起草的党内指示《组织力量反击右派分子的猖狂进攻》，其中说省市级机关和高等学校的大鸣大放，大约十五天左右即足，并估计反动分子人数不过百分之几，最积极的不过百分之一。两份文件都是毛泽东的自述；二月讲话说判断是非常常需要有考验的时间，六月文件给大鸣大放定了大约十五天；两个时间讲的不是同一件事，一个是判断对错需要多久，一个是鸣放持续多久，这里只是把两处写在纸上的时间并排放出来。\n\n后来的数字，见于中共中央党史研究室第二研究部编著的《〈中国共产党历史〉第二卷注释集》（中共党史出版社，二〇一二年）。党史文献研究院网站上登载的相关一节说，反右派斗争的错误波及五十五万余人，一九八一年在全面复查的基础上，全国共改正五十四万余人，占原划右派的百分之九十八。这一页没有分年度的数字，也没有给出这五十五万余人是依据什么标准划定的；他们是否符合五月十五日文件里写的严重违法乱纪那一条，这里没有核对，不作判断。另有一些非官方的说法，数字不同，这里不引用。\n\n读者拿到的讲话，是六月十九日经作者整理和补充后发表的文本，不是二月二十七日的现场发言。当时美国国务院中国事务办公室主任克劳（Ralph Clough）在一九五七年六月二十日给助理国务卿罗伯逊的备忘录里，记下全文已于六月十八日由北京电台广播；备忘录注释里引用的一份情报报告认为，毛泽东在修订发表时，在一定程度上削弱了他关于社会主义国家内部矛盾这个论点的新意（《美国对外关系文件集》一九五五年至一九五七年第三卷，文件二六四）。这是一份外国政府当时的判断，不是对两个文本的逐句比较，这里没有逐句比较过两个文本。",
  experiment: "找出你们平台过去半年里被否决或被搁置的十个非标准提议：用另一种语言、另一个框架、另一种部署方式、另一条升级路径。对每一个写三项：当时是怎么决定的（直接否决、讨论后否决、有时限的试验后否决）；决定依据的标准有没有写下来；被否决的想法后来有没有以别的形式出现（私下的脚本、影子服务）。然后写一页准入标准，不超过六条，每一条都是可以验证的，并写明谁可以对标准本身提意见。挑一个被直接否决的提议，给它一次有时限的试验：试验多长，看哪几个指标，什么结果算它通过。",

  idea: "即使一个矛盾被定为敌我矛盾、不可调和，处置也要定一条底线：对最后不能转变的人，只要他们不再进行破坏活动，“也给他们一点事做”，“也不剥夺他们的公民权”。理由是“许多历史事件采取了极端政策的后果，并不良好”，要“看得远一些”。另一半是给对象的叫法和分类也要留余地：不叫反动派，而叫右派，为的是便于争取中间派，便于分化对方，使一部分人有可能转变过来。",
  why: "这篇文章是毛泽东一九五七年七月在青岛召开的省市委书记会议期间写的，会上印发，八月又印发给党内领导干部阅读。当时反右派斗争正在展开。文章一开头就把性质定下来：反共反人民反社会主义的资产阶级右派同人民的矛盾，是敌我矛盾，是对抗性的、不可调和的“你死我活的矛盾”。紧接着他解释为什么不直接叫反动派、反革命派，而叫右派：一是为了便于争取中间派，二是为了便于分化右派，使一部分右派分子有可能转变过来。\n\n下一段是这一篇里最值得单独拿出来的部分。他说，最后不能转变的那一部分是死硬派，只要他们不当特务，不再进行破坏活动，也给他们一点事做，也不剥夺他们的公民权，理由是历史上采取极端政策的后果并不良好，应该看得远一些，几十年后看这个事件，会看到这样对待资产阶级右派分子，对无产阶级革命事业有深远影响和巨大利益。也就是说，处置一个对抗性矛盾，也要先定出一个不能越过的下限。\n\n文章其余部分谈整风和目标：他想造成一个又有集中又有民主、又有纪律又有自由、又有统一意志又有个人心情舒畅的政治局面，方法是实事求是和群众路线；性质不同的两类问题，资产阶级和知识分子是接受社会主义改造的问题，党的基本队伍是整顿作风的问题，通用整风这个口号，是因为这个口号较易被多数人接受。这个方法真正要求的是三件事：给对方下定义和叫法的时候，要想到这个叫法会不会堵死转变的路；处置之前，写下什么是无论如何不拿走的；写明什么条件下一个人可以走出这个类别。",
  failureMode: "文中暗含的错误，是对不能转变的那一部分采取极端政策，把能做的事做到头，不留事做，不留权利，也不留出路。文章对此的评语是后果并不良好。另一边的毛病，文中说的是对无产阶级力量估计过低、对右派力量估计过高，因而不敢去分化、争取中间。\n\n在今天的工程团队里，它的样子是：平台对一个反复违规的团队或租户，处理手段是永久封禁，没有申诉渠道，没有复查日期，也没有写明什么条件下可以恢复。结果是真正的滥用者换一个账号重新注册，而被误判的正当用户永久流失。另一种样子是定性太宽，把一次配置错误的团队同恶意滥用的租户放在同一张黑名单上，名单越来越长，没有人知道里面哪些条目已经过时。",
  worked: "这一条下限和出路，在后来的党史记录里有相应的内容。中共中央党史和文献研究院网站上登载的《全部摘掉“右派分子”帽子》一文（据中共中央党史研究室第二研究部编著的《〈中国共产党历史〉第二卷注释集》，中共党史出版社，二〇一二年）说，反右派斗争被划定为右派的共五十五万余人；从一九五九年到一九六四年，全国先后分五批为三十余万人摘掉了右派帽子，此后这项工作陷于停滞。也就是说，摘帽这个出口在一九五九年就有了，五年里让五十五万余人中的三十余万人走了出去。这一页没有说明各批摘帽的标准，也没有记录在摘帽之前这些人的工作和公民权实际是什么状况，这两点这里没有查到。\n\n同一页接着记录了一九七八年的经过。四月，中央统战部和公安部提出《关于全部摘掉右派分子帽子的请示报告》，四月五日中央批转；六月十四日至二十二日五部门在烟台开会，会上出现两种意见，一种认为摘帽并适当安置就可以，不必搞甄别平反，另一种主张错多少改多少；会后李维汉写信给胡耀邦，主张对错划的人复查平反；九月十七日中央转发的实施方案指出，已经发现划错的，尽管事隔多年，亦应改正。一九八〇年中央批转了爱国人士中右派的复查报告，一九八一年全国改正了五十四万余人，占原划右派的百分之九十八；对被划为中右分子和反社会主义分子的三十一万五千人也一律平反；对维持原案、只摘了帽子的三千多人，恢复了政治权利并适当安置。这些是党史机构的官方叙述，历史学家的研究在数字和评价上另有出入，这里没有逐一核对。\n\n这份记录说明的是，出口作为一个制度，先后出现了两次：一九五九年到一九六四年是摘帽，一九七八年以后是改正。一九五七年的文章写下的是下限的意图，成文的出口条件，要到二十一年后才在文件里读到。文章里没有给出的是一个出口应当附带什么条件、多久复查一次，这一点在后来的记录里也没有查到有哪份文件在最初就写明过。",

  why: "这是毛泽东和延安的几位同志在一九三九年冬季合写的一本课本，第二章《中国革命》是他自己写的，这里讲的是其中分析革命动力的一节。他把资产阶级分成两部分。带买办性的大资产阶级，直接为帝国主义国家的资本家服务，同农村中的封建势力有“千丝万缕的联系”，所以“历来不是中国革命的动力，而是中国革命的对象”。但这个阶级是分属于几个帝国主义国家的，在这几个国家之间的矛盾尖锐对立的时候，在革命主要反对某一个帝国主义的时候，属于别的帝国主义系统的买办阶级，也有可能在一定程度上和一定时间内参加当前的反帝国主义战线，只是一到他们的主子起来反对中国革命，他们就立即反对革命。\n\n抗日战争里，他按这个标准把大资产阶级又分成两种。亲日派（投降派）已经投降或准备投降，对他们的政策是当作敌人，坚决打倒；欧美派（顽固派）还留在抗日营垒里，但非常动摇，一面抗日，一面反共。对后一种，政策是“革命的两面政策”：一方面联合他们，“还应该利用他们和日本帝国主义的矛盾”，另一方面和他们作坚决的斗争，因为他们执行破坏抗日和团结的高压政策，没有斗争就会危害抗日和团结。对民族资产阶级，他的分析是：他们受帝国主义压迫，又受封建主义束缚，所以同两者有矛盾，是革命的力量之一；但他们在经济上和政治上软弱，同帝国主义和封建主义没有完全断绝联系，所以没有彻底的勇气，“民族资产阶级是带两重性的阶级”，这种两重性使他们在一定时期、一定程度上能够参加革命，在另一个时期又有跟在买办大资产阶级后面作反革命助手的危险，因此对他们“采取慎重的政策”，是完全必要的。\n\n这个方法真正要求的是三件事：不把一个称呼下的所有人当一块处理，先问这块里面各部分同外部的什么力量有矛盾；对态度不稳的一部分，同时写下联合的理由和斗争的理由，各自对应什么行为；分类不是一次定下的，要根据后来观察到的态度修改。",

  why: "这是第五章第五节“反攻开始问题”，即所谓“初战”或“序战”。毛泽东用江西五次反“围剿”的经验来说明。第一次反“围剿”时，敌约十万人分八路进攻，红军约四万人。他列出十条理由，说明为什么第一仗打龙冈的张辉瓒：张、谭两师是“围剿”的主力，张又是前线总指挥；那里靠近红军集中地，人民条件好，有优良阵地，能集中最大兵力，中间突破后敌人东西两群就被分开。结果俘获张辉瓒的两个旅和一个师部，连师长在内九千人，五天两仗，这次“围剿”就结束了。第二次反“围剿”，红军开到东固，为了等王金钰离开富田的巩固阵地，冒着走漏消息的危险等了二十五天，拒绝一切“性急快打”的建议。\n\n反例是第五次反“围剿”。领导者震惊于黎川一城之失，北上就敌，在洵口打了一个没有预期的胜仗，消灭敌人一个师，却不把它当作第一仗，不想它必然引起的变化，接着去打不能必胜的硝石，“开脚一步就丧失了主动权”。由此得出第二条：没有好的全战役计划，就没有真正好的第一仗；打第一仗之前，要想到第二、第三以至最后一仗大体怎么打，胜了全局怎么变，败了又怎么变。“没有全局在胸，是不会真的投下一着好棋子的。”\n\n第三条要求再往前看一个阶段。“走一步看一步”的指导方式，对政治和战争都不利；但每走一步，又要看那一步的具体变化，据此修改计划，否则会冒险直冲。两者合起来，是一个大体想通、贯通几个阶段的长期方针，加上随时的修改：退却阶段要算到反攻，反攻阶段要算到进攻，进攻阶段又须计算到退却阶段。",

  worked: "一九五〇年十月，中国人民志愿军入朝，第一次战役基本合乎前两条。十月二十五日的两水洞遭遇战是志愿军入朝后的第一仗，这一天后来定为抗美援朝纪念日；到十一月五日，第一次战役把联合国军从鸭绿江边推回清川江以南，按中方统计歼敌一万五千余人，这是中方单方面的数字。\n\n第三条在第三次战役前受到考验。据沈志华《毛泽东、斯大林与朝鲜战争》，彭德怀在十二月八日的电报里主张暂不越过三八线：部队连续两次战役，疲劳、病员增多，补给难以保障，宜停在线北，待来年春天再打。毛泽东十二月十三日复电，坚持必须越过三八线，理由是英美正希望志愿军停在线北，以便整军再战，停下来政治上很不利。第三次战役十二月三十一日发起，一九五一年一月四日进入汉城，一月八日前后停止追击。三月十四日到十五日夜间，联合国军重新占领汉城（Military Times 的史事记录）。刘统二〇〇九年在《瞭望东方周刊》上的文章写到，前三次战役之后部队缺粮缺弹、冻伤和疾病严重；第四、第五次战役中，美军先固守、后反攻，利用机动优势包抄志愿军；此后中央决定作战不求大胜，“积小胜为大胜”。\n\n按一九三六年的这一节，进攻阶段时又须计算到退却阶段。一九五〇年十二月，这笔账前线指挥员和最高统帅算得不一样，最后按毛泽东的政治计算执行。",
  experiment: "下一次分批上线或分批迁移之前，不要按“最能说明问题”挑第一批，而按三条挑：这一批有把握成功；它是整个计划的开头，而不是一次孤立的演示；它成功以后、失败以后，第二批各自怎么走，你都写得出来。写不出第二批的走法，就先别开第一批。做完的标志是计划文档里有了这三条的答案。",

{
  id: "plan-fixed-within-a-stage",
  track: "strategy", level: "v2",
  title: "计划只在一个阶段内相对固定",
  source: "《论持久战》（一九三八年五月），第二卷",
  idea: "战争的确实性很低，所以计划不可能完全固定，也不能没有。要先画出战争发展的轮廓，并准备让事实来校正它；轮廓之内，战术计划常一日数变，战役计划部分改变，战略计划在一个战略阶段内保持相对的固定，阶段推移了才改。变动只限于“数的流动，不是质的流动”。",
  why: "《论持久战》是毛泽东一九三八年五月二十六日至六月三日在延安抗日战争研究会的讲演（题注）。七月七日的一周年快到了，文章要同时回答亡国论和速胜论两种说法，结论是这场战争将是持久战，要经过三个阶段。第一阶段是敌之战略进攻、我之战略防御；第二阶段是敌之战略保守、我之准备反攻，他称为战略的相持阶段，我方作战的主要形式是游击战；第三阶段是我之战略反攻、敌之战略退却。他在这一节里先声明，三个阶段的具体情况不能预断，“谁也不能造出一本中日战争的‘流年’来”，但给战争趋势描画一个轮廓“为战略指导所必需”，描画的东西“将为事实所校正”。\n\n讲主动性、灵活性、计划性的那一节，计划性排在最后。主动性指军队行动的自由权，是军队的命脉；灵活性是把主动性具体实现于作战中，要在时机、地点、部队三个关节上用对办法，并且及时变换；计划性要面对战争的不确实性。他承认战争只有程度颇低、时间颇暂的确实性，但引古话说“凡事预则立，不预则废”，没有事先的计划和准备就不能取胜。计划的固定程度随范围而不同：小兵团和小部队的战术计划常一日数变；战役计划大体能管到战役结束，部分改变常有，全部改变间或有之；战略计划基于战争双方总的情况，只在一定的战略阶段内适用，战争推移到新阶段，战略计划就要改变。\n\n文中同时驳了两种相反的意见。一种基于战争的流动性，把相对固定的计划或方针说成“机械的”东西；他认为这样做，连战争本身都被否认了，会变成毫无定见的“战争相对主义”。另一种是不根据情况的变化更换计划，那就成了机械主义者。他举的例子是八路军“基本的是游击战，但不放松有利条件下的运动战”这个方针：它在一定阶段内必须相对固定，流动只发生在这个方针之内的各种作战行动之间，是“数的流动，不是质的流动”。这个方法真正要求的是两件事：一个阶段内的方针要固定到足以执行，同时要分得清什么变化只是数的变化，什么变化意味着阶段已经换了。",
  failureMode: "文中点名的错误有两个方向。一个是把战争的流动性推到底，否认计划有相对的固定性，结果毫无定见，这也不是、那也不是；另一个是不根据情况的变化更换计划，成了机械主义者。文章也不接受把战争进程像“流年”那样排定的做法，所以只肯给轮廓。\n\n在今天的工程团队里，它的样子是：一份为期半年的迁移路线图，要么每周改写一次，到季度末没有人说得清该交付什么；要么写定之后不再动，旧集群的下线日期早已推迟，第二阶段仍按原来的顺序排。",
  worked: "文章给敌人占领广州、武汉、兰州三点估计的时间是一年半至两年。据《中国时报》二〇一五年七月的一篇文章，日军一九三八年十月二十一日占领广州，十月二十五日国军放弃武汉，两点都在讲演后不到五个月丢失。多数中文叙述把武汉失守看作第一阶段的结束，相持阶段从此开始。文中对三点的估计，和后来的时间对不上；文章自己说过，轮廓将为事实所校正。\n\n一九八一年《关于建国以来党的若干历史问题的决议》在谈毛泽东军事思想时，把《论持久战》列在他总结长期革命战争经验的军事著作之中，并概括说，他论述了要随着敌我力量对比的变化和战争发展的进程，正确地实行军事战略的转变，为革命军队制定了在敌强我弱的形势下实行战略的持久战和战役、战斗的速决战。官方的总结把重点放在随阶段转变战略上。\n\n同一份决议对一九五八年的评价是另一回事。它写道，由于对经济发展规律和中国经济基本情况认识不足，更由于毛泽东、中央和地方不少领导同志在胜利面前滋长了骄傲自满情绪，急于求成，夸大了主观意志和主观努力的作用，没有经过认真的调查研究和试点，就轻率地发动了“大跃进”运动，使以高指标、瞎指挥、浮夸风和“共产风”为主要标志的左倾错误严重泛滥。《论持久战》里的主动性是以战争力量的优势为客观基础的，主观指导只能在这个基础上把劣势转成优势；一九五八年按决议的说法，是把主观的作用放到了客观条件的前面。",
  experiment: "拿一份你正在执行、周期超过半年的计划，比如迁移路线图或容量规划。分三栏写：哪些内容一周内就会改，哪些应当在这个阶段里不动，中间层是什么；这个阶段成立所依赖的三个前提，比如旧集群的下线日期、预算、某个依赖的交付；每个前提变到什么程度就算阶段换了，必须重写战略部分，而不是继续微调。做完的标志是文档里有一栏写明换阶段的触发条件，每个前提的下次检查日期已经进了日历。",

    a: "战术计划常一日数变；战役计划大体管到战役结束，部分改变常有，全部改变间或有之；战略计划只在一个战略阶段内适用，战争推移到新阶段才改。否认相对固定的计划，就成了毫无定见的战争相对主义。\n\n容易忘的是：流动有限制，是数的流动，不是质的流动，方针的根本性质在一定时间内不变。另一头也同样错：不根据情况的变化更换计划，就成了机械主义者。"

{
  id: "form-follows-the-enemy-situation",
  track: "strategy", level: "v2",
  title: "战略形式的转变，两头都会出错",
  source: "《战争和战略问题》（一九三八年十一月六日），第二卷",
  idea: "同一场战争里，主要的作战形式会随时期更换：先是游击战，后是正规战，再换回去。每换一次，都有两头的错误等着：一头是留恋旧形式，一头是抢跑到下一个形式。判断的标准只有一条，形式要“同敌情和任务相符合”。当敌情和任务变了，正确的转变在“现象上”可能是一个“倒退的转变”，最难的恰恰是这一种。",
  why: "这是毛泽东在一九三八年十一月六日中共六届六中全会上所作结论的一部分。按题注，全会要对付的是党内的右倾机会主义：一些同志否认统一战线中的独立自主，对党在战争和战略问题上的方针也抱怀疑态度。这一部分先讲武装斗争在中国的地位，再回顾国民党和共产党各自的战争史，第四节讲党的军事战略怎样转变。\n\n他的计数是这样的：国内战争分前后两个战略时期，前期主要是游击战，后期主要是正规战；抗日战争也分两个时期，前期主要是游击战，后期主要是正规战；两个过程四个时期之间，共有三个战略转变。第一个转变是从国内游击战到国内正规战，两头的错误同时存在：一头是“沉溺于游击性而不愿向正规性转变”的右的倾向，一头是不看实情、“机械地搬用外国经验”、过分看重正规化的“左”的倾向。第二个转变在一九三七年秋季卢沟桥事变之后：敌人换成了日本，友军是过去的敌人国民党，战场是华北。这时必须把过去的正规军和运动战，转变成游击军和游击战，同敌情和任务才相符，而这在现象上正是倒退。他说，国民党从国内战场转到民族战场时，出现了轻敌，也出现了“恐日病”，吃了许多不应有的亏；中共自己则转变得相当顺利，原因是干部适时接受了中央的指导并“灵活地观察情况”，虽然中央和一部分军事干部之间发生过严重的争论。第三个转变，即从抗日游击战到抗日正规战，他留给了将来。\n\n这个方法真正要求的是：转变之前先问眼下的敌情和任务是什么，让形式跟着它走，不跟着习惯、也不跟着面子走；并且事先把两头的错误都点出名来，因为领导转变的人要同时防着留恋和冒进，防住一头，容易滑向另一头。",
  failureMode: "文中说的错误有两头。右的一头对已经变化的敌情和任务估计不足，留在旧形式里；“左”的一头对敌情和任务估计过分，不看实情地搬外国的做法。第二个转变里还有第三种：因为转变看上去是后退，要么轻敌，要么怕。\n\n在今天的工程团队里，它的样子是：团队从二十个租户长到四百个，仍在用一套靠熟人手动操作、说改就改的办法，出一次事故就换一个人盯着；或者反过来，才十五个租户就照着大公司的博客搭了控制器、审批流程和评审委员会，每次变更先花三天排队。还有一种更隐蔽的：一个有状态存储的迁移，正确的做法是退回到按租户逐个手动切换，因为看上去像是倒退，团队宁可坚持自动化的批量推进。",
  worked: "第二个转变在党的记录里有一个可以对上的会议。一九三七年八月二十二日至二十五日，中共中央在陕北洛川开政治局扩大会议。据中共中央党史研究室著《中国共产党历史》第一卷上册（二〇〇二年），毛泽东在会上作军事问题的报告，说红军在国内革命战争中已经发展成能打运动战的正规军，但在新的形势下，兵力使用和作战原则必须有所改变；红军的作战方针定为独立自主的山地游击战争，独立自主是相对的，是在共同抗日的统一战略目标下的独立自主。同一部书写道，由于时间紧迫，游击战与运动战的主次关系问题没有能充分讨论。这和《战争和战略问题》里说的“严重的争论”并不矛盾，也说明官方的党史对这场争论写得很简短；争论的参加者和具体经过没有查到，这里不作补充。\n\n第一个转变的代价，党自己的叙述是遵义会议。据遵义会议一九三五年一月八日通过的《中央关于反对敌人五次“围剿”的总结决议》，会议批判了以博古、李德为代表的第五次反“围剿”中的单纯防御路线；决议对这条路线前途的判断是，它的出路“或者是不顾一切的拚命主义，或者是逃跑主义”。毛泽东的文章说这个错误在遵义会议以前持续了三年，“付出了极大的牺牲”。这是胜出一方后来写下的历史，两头的错误由谁划定、划在哪里，当时并不是没有争议。\n\n还有一点要分清：这篇文章对第二个转变的评价，是毛泽东在转变发生一年后、在党的会议上自己作的总结，他说转变“相当顺利”，同时又说这是“一个极其严重的转变”。文章没有给出可以核对的损失数字，第三个转变则明说“现在可以不去说它”。",
  experiment: "选一个你们团队正在用的做事形式：变更流程、迁移方式、值班办法或者发布节奏。先写下现在的三个事实：规模（租户数、服务数）、变更频率、出错时的影响范围。再写一句：对这三个数字，合适的形式应该是什么样。把它和现在用的比，找一处正确的做法看上去像是退一步的地方，比如给有状态的迁移加一个手动的闸门，或者把一类低风险变更的审批拿掉。最后给这一步写出两头的错误各是什么、各自靠什么信号发现。做完的标志是一页文档，里面有三个数字、一个形式和两个信号。",
  reflection: "你们现在用的那套做事办法，是为眼下的规模和风险选的，还是为两年前的？",
  recall: {
    q: "按这篇文章，第二个战略转变为什么难，它的难处在哪里？转变要以什么为标准？",
    a: "第二个转变发生在一九三七年秋季，从国内的正规军运动战转到抗日的游击战，在现象上是一个倒退，所以容易出两种错：轻敌，和恐日病。标准是同敌情和任务相符合，不是同形式的高低相符合。\n\n容易忘的是：这篇文章里每一个转变都有两头的错误，第一个转变里既有留恋游击性的，也有过分追求正规化的；转变得对，是要同时防住两头。"
  },
  deepDive: "这是我们团队现在的规模、变更频率和出错时的影响范围，以及我们现在用的做事形式。帮我判断哪些地方的形式和眼下的情况已经不相符，是留恋旧形式还是抢跑到新形式；找出一处正确做法在外人看来像倒退的地方，并告诉我我最可能往哪一头滑。"
},
{
  id: "attitude-before-technique",
  track: "strategy", level: "v2",
  title: "兵民是胜利之本，要害在根本态度",
  source: "《论持久战》（一九三八年五月），第二卷",
  idea: "装备要现代化，战略战术要灵活，但这些都要有个底子：“军队的基础在士兵”，“战争的伟力之最深厚的根源，存在于民众之中”。官兵关系、军民关系搞不好，多数人以为是方法不对，毛泽东说是“根本态度”的问题，这态度就是“尊重士兵和尊重人民”；各种政策和方法都从它出发，离了它，方法也一定是错的。",
  why: "《论持久战》是一九三八年五月二十六日至六月三日在延安的讲演。讲到“怎样做”的部分，第一百一十二节说中国制胜日本的主要条件是全国的团结和各方面十百倍的进步，并选了最根本的两方面：军队的进步和人民的进步。第一百一十三节先承认军制要现代化、战略战术要灵活，没有这些不能胜利，接着说军队的基础在士兵，没有进步的政治精神贯注军队，没有进步的政治工作去执行，官长和士兵就不能一致，一切技术和战术就没有好的基础去发挥效力。他在这里主张废除打骂制度、官兵同甘苦，并把官兵一致说成抗日军队政治工作的基础。\n\n民众这一头，他说日本敢欺负中国，主要原因是民众无组织；兵源要靠广泛热烈的政治动员，下面通行的“捉兵法”“买兵法”必须禁止；财政也一样，动员了民众，钱就不成问题。第一百一十五节是全节的要点：政治工作有三大原则，官兵一致、军民一致、瓦解敌军，要让它们有效，都要从尊重士兵、尊重人民、尊重放下武器的俘虏的人格这个根本态度出发，把它看成技术问题的人是想错了。这一段写在武汉保卫战前夕，第一百一十六节紧接着说，能不能保住武汉不取决于主观愿望，而取决于具体条件，政治上动员全军全民是最重要的条件之一。\n\n这个方法真正要求的是：把每一条规章、每一个办法追到它背后的态度上去看；当某条办法和这个态度相抵触时，改的是办法。他在第一百一十八节反复说明，没有这一点就没有胜利，而且这不是几个党派党部的事，是全军全民的事。",
  failureMode: "文中针对的是两种想法：一种以为官兵关系、军民关系出问题是方法问题，找一个技巧来补；另一种靠“捉兵法”“买兵法”，用强制和花钱去补兵源，不去做政治动员。与之相邻的错误是只靠技术：技术条件再好，没有进步的政治精神贯注军队，也发挥不了。\n\n在今天的工程团队里，它的样子是：平台团队推一项迁移，租户团队不愿意用，于是平台团队改文档、做更好看的命令行、发更多公告，最后设一个截止日期，加一个例外申请表，让不迁的团队去排队求批。这几样办法都是技术问题的做法，也都在回答同一个没有被说出来的问题：租户团队是平台的用户，还是平台推进计划的阻力。",
  worked: "这个原则的一个大规模用例，是中共官方叙述里的淮海战役。据中国共产党新闻网党史频道二〇二二年的文章，战役期间出动支前民工五百四十三万人，陈毅说过：“淮海战役的胜利，是人民群众用小车推出来的。”这个总数本身回答不了一个关键问题：民众是自愿出力，还是被动员、被分派出力。这恰恰是这条原则要分辨的，而总数不分辨。\n\n党自己的记录里，也有这条原则被压力顶住的时候。毛泽东一九四二年十二月在陕甘宁边区高级干部会议上的报告说，一九四一年国民党停发经费并实行经济封锁，边区最困难，人民的负担加重了；报告给出的各年公粮（农业税）总数是一九四〇年九万担、一九四一年二十万担、一九四二年十六万担，同时精兵简政，并展开大生产运动。这是毛泽东当时在报告里的自述，没有第三方的核对；各年的数字是粮食总数，不是每户的负担。\n\n至于农民为什么支持共产党，史学界并无一致意见。查默斯·约翰逊（Chalmers Johnson）一九六二年的《农民民族主义与共产党政权》把日本入侵激起的民族主义放在中心；马克·塞尔登（Mark Selden）一九七一年的《中国革命中的延安道路》则把共产党战时的政策，尤其是土地政策，看作关键。有评论认为，两派的分歧更多在着重点，不在互相排斥。《论持久战》这一节站在哪一边，文本里看得出来：它把政治动员和根本态度放在第一位，同时承认技术和战略战术也不可少。",
  experiment: "挑一项你们平台团队正在推的迁移或下线，把推进它用的每一个机制列出来：公告、文档、截止日期、例外申请、办公时间、值班交接。每一项旁边写一句：它假定租户团队是什么。找出一个其实假定的是“要被管住的对象”的机制，写出另一种做法：不设截止日期，只让新路径比旧路径更省事，并定一个可以量的指标，比如每周自愿迁移的团队数。做完的标志是一张表，里面有每个机制的假定，和一个已经被替换的机制。",
  reflection: "你们的平台上，哪一条规则最让使用者觉得自己是被管理的对象，而不是被服务的对象？",

{
  id: "plan-on-few-enemy-mistakes",
  track: "strategy", level: "v2",
  title: "计划放在对方少犯错误的假定上",
  source: "《论持久战》（一九三八年五月），第二卷",
  idea: "客观条件只给胜负的可能性：“仅有这些，还只是有了胜负的可能性”，要分胜负还须加上主观的努力，也就是“自觉的能动性”。这种努力不能超出条件许可的限度，也不能因为条件不利就坐着不动。决定的因素是“多打胜仗，少犯错误”。对方的错误可以利用，但计划要建立在对方少犯错误的假定上。",
  why: "《论持久战》一九三八年五月在延安讲演，“怎样做”的部分从“能动性在战争中”说起。他列了决定战争胜负的几类条件：军事、政治、经济、地理、战争性质、国际援助。这些具备了，只是有了胜负的可能，本身不分胜负；要分胜负，还要有指导战争和实行战争的主观努力。他给这种努力划了两道边界。一道是不能超出客观条件许可的限度，指挥员活动的舞台要建筑在客观条件的许可之上，不赞成变成“乱撞乱碰的鲁莽家”；另一道是在限度之内必须能动地争取，他要的是“勇敢而明智的将军”，并说“坐着不动，只有被灭亡”。\n\n后面第七十七节说，战争是力量的竞赛，力量在战争过程中变化形态，主观的努力、多打胜仗、少犯错误是决定的因素：客观因素具备变化的可能，实现这种可能，要有正确的方针和主观的努力。“乘敌之隙的可能性”一节把这个思路用到对方身上。他列出日本在十个月战争里的五个错误：逐渐增兵，没有主攻方向，没有战略协同，失去战略时机，包围多歼灭少，并说这些是敌人自己弄错的，不是我们使之错的。自己也可以有意制造对方的错误，例如声东击西。然后是一句限定：不应把对方的错误作为战略计划的重要基础，“我之计划宁可放在敌人少犯错误的假定上，才是可靠的做法”；同时，我们乘敌之隙，敌人也可以乘我之隙，“少授敌以可寻之隙”也是指挥方面的任务。\n\n这个方法真正要求的是：任何一份计划里，把三样东西分开写，条件允许什么，你自己的努力能加多少，你只是希望对方出错的地方；计划只能从前两样算出来，第三样只当作意外收获。",
  failureMode: "文中批评的错误有两头：一头是离开客观条件、“乱撞乱碰”，另一头是条件不利便“坐着不动”。此外还有一种夹在中间的：把对方的错误当作计划的基础，等着对方出岔子。\n\n在今天的工程团队里，它的样子是：一份迁移计划之所以能在季度末完成，是因为假定供应商的修复按时发布、上游团队的接口不再改、冻结期里不出事故，三个假定都不在自己手里；或者相反，因为容量和人手都不够，就断定这个季度的目标做不成，没有去算在现有条件的限度之内还能做到什么。",
  worked: "这条界线，党自己的记录里有一个反面的例子。一九四五年的《关于若干历史问题的决议》写到，一九三〇年六月十一日，由李立三领导的中央政治局通过了“左”倾的决议案，决议说他们认为条件已经具备，定出了组织全国中心城市武装起义和集中全国红军进攻中心城市的冒险计划。《毛泽东选集》第三卷《学习和时局》的注释五写道，一九三〇年八九月间红军第一方面军进攻长沙，久攻不克，毛泽东说服红一方面军中的干部撤退，接着又说服干部放弃夺取九江等中心城市的意见，分兵攻取茶陵、攸县、醴陵、萍乡、吉安等地，“使红一方面军获得很大的发展”。这是《选集》编者写的注释，不是一九四五年决议的本文，对毛泽东自己的作用写得很正面，没有独立的史料可以对照；但它说明了这一节要划的界：条件许可之外的计划，换一个地方就要重算。\n\n对方的错误确实可以改变结果。挪威历史学家文安立（Odd Arne Westad）二〇〇三年的《Decisive Encounters: The Chinese Civil War》（斯坦福大学出版社），据书评的概括，强调共产党的胜利并非必然，国民党自己的决策失误是结果的重要原因。这里只能说明对方的失误是事实，是否因为共产党的计划是按对方少犯错误来做的，这些材料回答不了。\n\n文章没有给出一个办法来判断“客观条件许可的限度”画在哪里，只要求指挥员别越过它。边界由谁来画，依据什么，是留给使用者的问题。",
  experiment: "拿一份你手上有交付日期的计划，比如迁移、上线、容量扩充，分三栏写：条件允许什么，已经核实的事实；你的团队的努力能加多少，并写下依据；你只是希望别人不出错的地方，比如供应商、上游团队、冻结期没有事故。把第三栏全部删掉重算一遍交付日期和风险，看计划是否仍然成立。再列三处自己的系统里别人可以“乘隙”的地方，补上其中一处。做完的标志是一页三栏表，一个重算过的日期，和一处补上的缺口。",
  reflection: "你手上这份计划里，哪一个假定是你只是希望别人不要出错？",
  recall: {
    q: "按《论持久战》，决定战争胜负的客观条件给了什么？还要加上什么才能分出胜负？这种努力的两道边界是什么？",
    a: "客观条件只给胜负的可能性，要分胜负，还须加上主观的努力，即指导战争和实行战争的自觉的能动性。边界一是不能超出客观条件许可的限度，二是在限度之内不能坐着不动。\n\n容易忘的是对对方错误的态度：对方的错误可以利用，也可以有意制造，但计划宁可放在对方少犯错误的假定上，并且自己要少给对方可乘之隙。"

{
  id: "name-the-aim-before-the-verdict",
  track: "strategy", level: "v1",
  title: "说胜说败，先指明按哪一方面算",
  source: "《论反对日本帝国主义的策略》（一九三五年十二月二十七日），第一卷",
  idea: "同一件事，按一个目标算是失败，按另一个目标算可以是胜利。红军在“保持原有阵地的方面”是失败了，在“完成长征计划的方面”是胜利了。下结论的人要同时说出是按哪一个目标算的：只看一部分，就像坐在井里的虾蟆，以为“天有一个井大”；“马克思主义者看问题，不但要看到部分，而且要看到全体”。损失要照实承认，不因为另一栏有收获而抹去。",
  why: "这是毛泽东一九三五年十二月二十七日在陕北瓦窑堡党的活动分子会议上的报告，在瓦窑堡政治局会议之后。题注说，那次会议决定建立抗日民族统一战线，报告要说明这个新策略。讲到民族革命营垒里的情形，他先谈红军：差不多一年半以来，三支主力红军都在作阵地的大转移，放弃了原有阵地，旧区域变成游击区，红军本身又有很大的削弱。他说，如果只看这一方面，敌人得到了暂时的部分的胜利，我们遭遇了“暂时的部分的失败”，这个说法是对的，因为是事实。\n\n接着他驳了一种说法。有人（例如张国焘）说中央红军失败了。他说这不对，因为不是事实。理由是分两栏记账：红军在保持原有阵地这一栏是失败了，在完成长征计划这一栏是胜利了；敌人在占领我军原有阵地这一栏是胜利了，在实现“围剿”“追剿”计划这一栏是失败了。这样说才恰当，因为长征完成了。然后他列出长征的另外几种结果：长征是宣言书，是宣传队，是播种机。\n\n这个方法真正要求的是：对一件事下结论之前，写下它是按哪个目标衡量的；第一栏的损失先写，写足；再写另外的栏里产生了什么，并给出证据。两栏都有，才算看到了全体。",
  failureMode: "文中针对的是两种看法：一种只看见一栏就断言整体，说中央红军失败了；另一种，以井口看天，把看到的一块当成全部。他自己没有走到另一头：报告承认了放弃阵地和红军的削弱，没有拿长征的别的意义去抵消它。\n\n在今天的工程团队里，它的样子是：一个迁移项目因为按期没有上线被取消，复盘会上整个项目被记作失败，它留下的工具、运行手册和对旧系统的理解，一并被忘掉，下一个团队从头来过；或者相反，团队用一句我们学到了很多来盖住一个目标没有达成的事实，第一栏从来没有被认真写过。",
  worked: "这篇报告里承认的损失，可以对上人数。中央红军一九三四年十月出发时，多数资料采用约八万六千人的说法。据人民网党史频道“解读长征”系列文章，红军过湘江后已锐减到三万余人，到一九三五年十月抵达陕北时更少，各种资料给的具体数字不一。各种说法的分歧主要来自统计的范围：算的是走完全程的核心部队，还是包括途中并入和后来补充的部队。报告本身没有给出数字，只说“很大的削弱”。\n\n党自己后来对第一栏的处理，是写足，并且把原因指给一条路线。一九四五年的《关于若干历史问题的决议》写道，第三次“左”倾路线在革命根据地的最大恶果，是中央所在地区第五次反“围剿”的失败和红军主力的退出，“左”倾路线在退出江西和长征的军事行动中又犯了逃跑主义的错误，使红军继续受到损失。同一份决议又说，遵义会议后党才能胜利地结束长征，并保存并锻炼了党和红军的基干。这是胜出一方在十年后写的，两栏都有，但第一栏的责任划给了对立的一方，这一点需要读者自己记得。\n\n还有一点要分清：报告里长征“宣言书”“宣传队”“播种机”的说法，是在党的活动分子会议上的讲话，说它向十一个省内约两万万人民宣布了红军的道路；这些效果没有当时的测量，后来的成败是官方党史拿来佐证的材料。这一栏有没有收益，要靠独立的证据，不靠这一句话。",
  experiment: "挑一个你们上个季度被取消、推迟或没有达到目标的项目。画两栏账：第一栏写它按什么目标衡量，以及按这个目标的结果，先写，写足，不加但是；第二栏写它在别的方面产生了什么：留下的工具、运行手册、对旧系统的新认识、和别的团队建立的接口，每一项后面写一个证据，比如某份文档后来被谁用过。最后写一句：第二栏的哪一项会改变下一次的决定。做完的标志是一页两栏的账，和一个已经因此改变的决定。",
  reflection: "你们团队最近被记作失败的那个项目，有没有一栏从来没有人写过？",

    a: "他说这不是事实：红军在保持原有阵地这一栏是失败了，在完成长征计划这一栏是胜利了；敌人在占领原有阵地这一栏胜了，在实现围剿追剿计划这一栏败了。长征是宣言书，是宣传队，是播种机。\n\n容易忘的是：他先承认了暂时的部分的失败，三支主力红军放弃了原有阵地，红军本身有很大的削弱；两栏的账要同时记，不能拿第二栏抵销第一栏。"
  },

{
  id: "owed-versus-holdable",
  track: "strategy", level: "v4",
  title: "应得的和守得住的，要分开算",
  source: "《抗日战争胜利后的时局和我们的方针》（一九四五年八月十三日），第四卷",
  idea: "“抗战胜利的果实应该属于人民”是一个问题，“胜利果实究竟落到谁手”是另一个问题，“不要以为胜利的果实都靠得住落在人民的手里”。他把成果按实力分成三批：对方一定拿走的，双方要争的，自己“靠得住”的；对中间一批只讲两个字，“力争”。针锋相对，寸土必争，不等于不放弃一寸土地：放弃以后还可以收回。",
  why: "这是一九四五年八月十三日毛泽东在延安干部会议上的讲演，日本投降的大势已定。题注说，战后中国有两种命运、两个前途，共产党一面争取和平，一面要对蒋介石发动内战的计划有充分准备。他先用桃树作比：桃子该由栽树、浇水的人摘，蒋介石一担水也没挑，不能凭所有权去摘。这解决的是应得的问题。\n\n接着他讲第二个问题，也就是谁拿得到。一批大桃子，上海、南京、杭州等大城市，会被蒋介石抢去，因为蒋介石勾结美国，在那里力量占优势，革命的人民基本上只能占领乡村。另一批是双方要争夺的，同蒲、平绥中段、北宁、平汉、正太、白晋等线上的中小城市，是解放区人民浇灌起来的，能不能落到人民手里，现在还不能说，只能讲“力争”。第三批是“靠得住”的，河北、察哈尔、热河、山西大部、山东、江苏北部的大片乡村和成百的城市，连成三四五六块。他拿一九三一年下半年江西中央区作比较，那时联在一起有二十一个县城，最多时二百五十万人口，没有中等城市，已经撑了很久。他还说，这个时期如果有机会主义，那就是不力争，自愿地把人民应得的果实送给蒋介石。\n\n“寸土必争”他也限定了范围。他说这不是像过去“左”倾路线那样“不放弃根据地的一寸土地”；不久前国民党调六个师打关中分区，三个师打进来占了宽一百里、长二十里的地方，我方放弃了这块地方，七月底放弃，八月初收回。这个方法真正要求的是：按实际力量把每一项成果归进三个栏，不按应得；对第一栏不耗力气，第二栏集中力气，第三栏稳稳拿住，并为第二栏准备好先放后收的办法。",
  failureMode: "文中针对两个方向的错误。一个是把应得当成已得，以为成果都靠得住；一个是该争的不争，主动把应得的送出去，他拿一九二七年陈独秀的做法作例子。中间还夹着一个教条：不分情况地不放弃一寸土地。\n\n在今天的工程团队里，它的样子是：平台团队合并了几套内部工具以后，路线图上列了六十个服务，每个都写着待接入，优先级一样，理由是平台是我们建的，大家理应来用。结果那些本来就会来的服务做完了，几个有自己工具链、负责人又强硬的关键服务只收到一封带截止日期的邮件，没有人去做那场该打的仗；另一些其实不可能接入的，也占着每周的时间。",
  worked: "文中点名的第二批里，有一块很快见了分晓。一九四五年九月十日至十月十二日，刘伯承、邓小平指挥的晋冀鲁豫军区部队在山西上党地区作战，对象是阎锡山部进入该地区的部队；毛泽东这时正在重庆谈判。各种叙述里的数字不一：毛泽东一九四五年十月十七日的讲话说，阎锡山部进攻的军队共计三万八千人，被消灭三万五千；《毛泽东选集》第四卷同篇的注释写的是歼灭十一个师及一个挺进纵队三万五千余人；中共党史网站另有写“歼灭三万余人”的。这里引用的材料以中共的党史和军史为主，数字应当按这个来源理解。\n\n分类本身也在很快地更新。这次讲演点名的“靠得住”的地区里没有东北。五周后的九月十九日，刘少奇为中央起草了《目前任务和战略部署》的指示，提出向北发展，向南防御，目标是控制东北。据河北省政协编的文史材料和其他几份资料，一九四五年八月至十一月，各解放区抽调约十一万部队、两万干部去东北；各份资料对干部的细分说法略有出入。这说明三栏账不是一次写成就不动，是随新的事实改的。\n\n“力争”不等于守到底。文中第二批的平绥线上，有张家口。党史材料说，一九四六年十月，晋察冀军区主动撤出张家口，十月十一日傅作义部占领，各份材料对撤出的具体日期说法差一天，对撤出的评价也出自中共的叙述，称作战略撤退。这和讲演里的限定相符：寸土必争，并不是不放弃。",
  experiment: "拿一份你们团队的待办清单，二十到四十项，比如要接入的服务、要下线的旧组件、要推广的做法。逐项按证据而不是按应得归入三栏：靠得住，也就是用现有力量就能做完；要争的，也就是结果取决于你们的投入和对方的决定；会被拿走的，也就是代价远超收益。对第二栏每一项，写出争的具体动作，以及如果不得不退，退到哪里、哪天收回。做完的标志是一张三栏表、每栏的数量，和一个写明了收回日期的退让方案。",

    a: "大桃子，即上海、南京、杭州等大城市，会被蒋介石抢去；中间一批，同蒲、平绥中段等线上的中小城市，双方要争，只讲“力争”；靠得住的，是河北、察哈尔、热河、山西大部、山东、江苏北部的大片乡村和城市。寸土必争不是不放弃，不是“不放弃根据地的一寸土地”，关中分区放弃了一百里乘二十里，八月初收回。\n\n容易忘的是：应得和落到谁手是两个问题，文中说不力争、把应得的果实自愿送给对方，才是这个时期的机会主义。"

  source: "《迎接中国革命的新高潮》（一九四七年二月一日），第四卷",
  idea: "这份党内指示判断大革命的新阶段“现在是它的前夜”，没有停在形容词上，而是给出了一笔可以事后对账的军事账：已经歼灭多少，总共有多少，调得动多少，再歼多少，形势就会变。判断连同基数、分母、时限和“变化”的定义一起写下，才有人能在几个月后拿结果来核对它。",
  why: "这是毛泽东为中共中央起草的对党内的指示，写于一九四七年二月一日，下一个月国民党军就要进攻延安。第二条先报已有的战果：去年七月至今年一月的七个月，歼灭蒋介石进犯解放区的正规军五十六个旅，平均每月八个旅；被歼灭的伪军和保安部队、被击溃的正规军“都未计算在内”。口径在这里就写明了。\n\n第二笔是分母。蒋军正规军步骑九十三个师（军）、二百四十八个旅（师）、一百九十一万六千人；进攻解放区的七十八个师、二百一十八个旅、一百七十一万三千人，约占百分之九十；留在后方的十五个师、三十个旅、二十万三千人，约占百分之十。由此他推出：蒋介石“不可能再从他的后方调动很多有战斗力的军队”进攻解放区。进攻的二百一十八个旅里，被歼灭的已超过四分之一，补充恢复的部队战斗力很弱。于是给出带时限和数目的预料：今后数月内可能达到歼灭连前共计一百个旅的目的；如能再歼四十至五十个旅，“军事形势必将发生重大的变化”。第十一条再把它压成一句：再歼四十至五十个旅，“这是决定一切的关键”。\n\n同一份文件的第十二条把可能让判断落空的事也写了出来：解放区的某些部分将暂时变为沦陷区或游击区，部分革命力量可能暂时受损，人力物力将受到消耗。这个方法真正要求的是四样东西同时写：基数和口径，分母，时限，以及达到什么算数；外加一条写明什么情况会让它不成立。",
  failureMode: "文中针对的错误有两个方向。一个是把对方的强大当成不可改变的事实，文中说“所谓反动派进攻不能粉碎的神话”，在队伍中不应有位置；另一个是看到有利的形势，就以为面前没有困难，所以第十二条专门声明，有把握不等于没有困难。两种错误有同一个特点：判断都停在感觉上，没有数字，没有人能核对。\n\n在今天的工程团队里，它的样子是：季度计划写本季度大幅降低事故，既没有说上季度的基数和事故的口径，也没有说总事故里有多少与这项工作有关；到季度末，事故少了或多了，谁都能说自己是对的。另一种样子是反过来，把这个迁移已经快做完了当作进度汇报，没有人说过分母是什么。",
  worked: "这份文件的数字，可以用毛泽东自己后来的统计对账。一九四八年十二月三十日的新年献词《将革命进行到底》报告：歼敌营以上正规军（包括起义的敌军在内），战争第一年（一九四六年七月至一九四七年六月）九十七个旅，内有四十六个整旅。二月一日的预料是连前共计一百个旅左右，数目相差三个旅。要注意，两个数字出自同一位作者，口径并不相同：前者说的是歼灭，后者包括起义部队，并且分整旅和非整旅；两者之外没有第三方的核对，这里没有查到。\n\n写进第十二条的那一部分，应验得很快。《毛泽东选集》第四卷这篇文章的注释八记载：一月十六日，国民党政府通过美国驻华大使要求派代表到延安谈判，中共提出两个最低条件，国民党政府见“和平”骗术无法实施，二月二十七日、二十八日通知中共驻南京、上海、重庆的代表全部撤退，谈判完全破裂。注释到此为止，没有写延安的失守。一九四七年三月，中共中央机关撤离延安，国民党军胡宗南部进占延安。据《求是》网刊载的延安革命纪念馆馆长访谈，一九四七年三月蒋介石命令胡宗南部二十三万人从南、西、北三个方向进攻陕北，当时西北野战军两万多人；其他文章的数字不尽相同，这里不取其中任何一个。文件没有点延安的名，说的是“暂时变为沦陷区或游击区”，延安属于这一类。\n\n这份文件的判断经得起对账，原因是它自己写出了对账的办法。对账之后是否还有别的因素，比如数字之外的政治和经济因素，起了多大作用，这里的材料没有回答。",
  experiment: "挑一个你下个季度要对团队说出口的判断，比如“迁移做完以后值班事故会少一半”。把它写成五行：基数是多少，以及这个数字怎么算出来；总量里有多少受这件事影响，有多少无论如何不受影响；到哪一天；达到什么变化才算对；一条最可能让它不成立的事，和它发生时你怎么办。把到期日放进日历，到期那天只做一件事：拿结果和这五行对账。",
  reflection: "你上一次对同事说“形势在好转”的时候，手里有没有一个分母？",
  recall: {
    q: "这份指示是怎样把“军事形势将有重大变化”这一判断写成可以核对的？第十二条为什么还要写困难？",
    a: "它给了已有的战果（七个月歼灭五十六个旅，月均八个旅，并说明未计入什么），分母（蒋军正规军总数，进攻解放区的数目和后方的数目），时限和数目（数月内再歼四十至五十个旅，连前约一百个旅），并说这是决定一切的关键。第十二条写困难，是因为有把握不等于没有困难，解放区的某些部分将暂时变为沦陷区或游击区。\n\n容易忘的是：口径和分母同样要写。文中明说伪军、保安部队和被击溃的正规军没有计入，也说明了进攻解放区的占蒋军正规军约百分之九十，留在后方的只有约百分之十。"
  },
  deepDive: "这是我下个季度准备对团队说出口的一个判断。帮我把它改写成基数加口径、分母、时限、达到什么算数、可能让它不成立的情况五项，指出我哪一项最可能是凭感觉填的，并设计到期那天的对账方法。"
},
{
  id: "capability-is-learned-on-hard-targets",
  track: "strategy", level: "v4",
  title: "没有的能力，在一连串硬目标里学出来",
  source: "《将革命进行到底》（一九四八年十二月三十日），第四卷",
  idea: "一支军队缺的那一样能力，会决定它哪些目标打得下来。这篇献词的回顾里，解放军没有飞机和坦克，但在连续攻克九座设防城市的作战中“学会了攻坚战术”，又组成了自己的炮兵和工兵，于是对方的“防御体系，连同他的飞机和坦克就显得渺小了”。能力缺口要当作战略问题单列出来，靠一个个真实的硬目标去补，并把每次学到的写成一套能复述的做法。",
  why: "这是毛泽东为新华社写的一九四九年新年献词，写于一九四八年十二月三十日。它按战争的三个年头回顾：第一年（一九四六年七月至一九四七年六月），国民党军的数量约为解放军的三倍半，装备和资源远远超过解放军，所以表现为国民党进攻、解放军防御；第二年，解放军由防御转入进攻，收复了大部分失地；第三年的头半年，解放军在数量上由长期的劣势转入优势，能够一次包围歼灭成十万甚至几十万人的兵团。\n\n第二年里有一句专讲能力：解放军在攻克石家庄、运城、四平、洛阳、宜川、宝鸡、潍县、临汾、开封等城市的作战中学会了攻坚战术，组成了自己的炮兵和工兵；于是已经不但能打运动战，而且能打阵地战。注释三把这九座城市和日期逐个列了出来，从一九四七年十一月十二日攻克石家庄，到一九四八年六月二十二日攻克开封，并说这些城市都有大量的碉堡群或者高大的城墙，设有多层外壕、铁丝网等副防御设备，解放军当时既无飞机又无坦克，没有或仅有少量炮兵。学到的战术在注释里列成五项：连续爆破，坑道作业，对壕作业，抛射炸药包，以及集中兵力火力突破一点、穿插分割的“尖刀战法”。\n\n这个方法真正要求的是三件事：先承认缺的是哪一样，并把它单独写成一项任务；然后拿真实的硬目标去练，一个接一个；每一轮之后把学到的写成别人也能照着做的一套。一九四七年二月的《迎接中国革命的新高潮》已经把加强炮兵和工兵定为军事建设的中心任务，并点出要解决的是训练干部和制造弹药两个问题，这份献词是近两年后的自我报告。注释没有说这九座城市为什么按这个顺序选，这里也不推测。",
  failureMode: "这篇献词没有点名它针对谁。它的回顾隐含着两种相反的做法：一种是把自己现有的能力当成固定的，由此推出这个目标打不下来，于是只打能打的；另一种是以为缺的能力可以靠别处买来，不用在战场上学。\n\n在今天的工程团队里，它的样子是：团队从来没有做过有状态存储的跨区域迁移，于是它在路线图上一直是以后再说，直到某次事故逼着团队去做，才在最糟的时候开始学；或者买了一套迁移工具，就以为团队有了迁移的能力，工具里的假设和自己的系统对不上，也没有人去总结。",
  worked: "这三场攻城战，用时差别很大。石家庄于一九四七年十一月十二日攻克（《毛泽东选集》第四卷《将革命进行到底》注释三），据河北新闻网的文章，战役打了六昼夜，这是解放军攻占的第一座大城市。一九四八年三月至五月的临汾战役历时七十二天，歼敌约两万三千人；据中国共产党新闻网的文章，攻城部队缺乏攻坚经验，装备较差，主要靠坑道爆破，守军也大量挖了反坑道，双方在地下“以挖对挖”。济南战役从一九四八年九月十六日打到二十四日，八昼夜；据中国军网的文章，守军约十万人，其中吴化文部两万余人起义。这些都是中方党史和军史材料的数字。\n\n这三个数字不能连成一条学习曲线。石家庄和临汾是不同的军区部队，临汾反而更慢，党史文章给的理由是前述缺乏经验和装备较差，守军的防御也更坚。同一份记录也说明，注释三里那五项战术并不是在一个战场上一次学成的，而是在九次作战里陆续积累。把学到的东西从一个战场传到另一个战场用了什么办法，这里没有查到可核对的材料。\n\n献词也没有写这些攻坚战的伤亡，这里同样没有查到可靠的汇总数字，所以学得快不快，只能按用时说，不能按代价说。回顾里的所有数字，包括一百四十七个师的歼敌统计，都是毛泽东当年为新华社写的自我报告，没有第三方的核对。",
  experiment: "找出你们路线图里一类因为还不会而一直绕开的硬任务：有状态存储的迁移，跨区域的故障演练，或者全量容量压测。把它写成能力缺口：缺的是人、工具还是演练环境。然后排三次真实的目标，每一次比上一次难一点，每次结束后写一页这次学会的做法，不超过五条，像注释三那样一条一个名字。做完的标志是三页纸，第三页上的条目里至少有一条是前两页没有的。",
  reflection: "你们团队一直绕开的那个任务，是真的做不了，还是还没有练过？",
  recall: {
    q: "这篇献词怎样回顾解放军在没有飞机和坦克的情况下取得攻坚能力？注释三列出了哪五项战术？",
    a: "解放军在攻克石家庄、运城、四平、洛阳等九座城市的作战中学会了攻坚战术，又组成了自己的炮兵和工兵，所以能打阵地战，对方的防御体系连同飞机坦克就显得渺小了。五项战术是连续爆破、坑道作业、对壕作业、抛射炸药包，以及集中兵力火力突破一点的尖刀战法。\n\n容易忘的是：这些是在九次实际作战里学到的，注释还写明当时解放军没有或仅有少量炮兵；而且献词是自我报告，没有给出这些作战的伤亡。"
  },
  deepDive: "这是我们团队一直绕开的几类硬任务，以及我们现在缺的人、工具和演练环境。帮我判断其中哪一类缺的是能力、哪一类只是没有练过，设计三次由浅入深的真实目标，并为每次结束后的一页做法总结定一个格式。"
},
{
  id: "part-yields-to-whole-in-both-directions",
  track: "strategy", level: "v2",
  title: "局部服从全局，两个方向都算数",
  source: "《中国共产党在民族战争中的地位》（一九三八年十月十四日），第二卷",
  idea: "这一节要党员有“照顾全局，照顾多数及和同盟者一道工作的观点”。局部服从全局有两个方向：局部看来可行、全局看来不可行的，不做；局部看来不可行、全局看来可行的，也要做。同时不能脱离多数，不能“率领少数先进队伍单独冒进”。",
  why: "这是毛泽东一九三八年十月十二日至十四日在中共六届六中全会上所作政治报告《论新阶段》的一部分，十月十四日讲。按题注，全会确定坚持抗日民族统一战线的方针，批判了统一战线问题上的迁就主义，同时明确全党要负起领导抗日战争的责任。这一节排在爱国主义、模范作用、统一战线和独立性、阶级斗争和民族斗争的关系之后，干部政策和党的纪律之前。\n\n他先立一条规则：以局部需要服从全局需要。规则是对称的：某项意见在局部的情形看来是可行的，而在全局的情形看来是不可行的，就以局部服从全局；反之，在局部看来不可行，在全局看来可行，也以局部服从全局。第二条是照顾多数：不可脱离群众的多数，置多数人的情况于不顾，而率领少数先进队伍单独冒进，要注意组织先进分子和广大群众之间的密切联系。第三条是同盟者：在有愿意合作的民主党派和民主人士的地方，要同他们一道商量问题、一道工作，独断专行、把同盟者置之不理，是不对的。他还说，过去在这些方面存在着很大的缺点，必须改进。\n\n这个方法真正要求的是三个问题，在每一个决定面前都要问：这对全局意味着什么，多数人此刻在哪里，该一起商量的人有没有被商量到。局部的牺牲要两头算：既拒绝对全局不利的局部好处，也接受对全局有利的局部代价。",
  failureMode: "文中点出的做法有三种：只从局部着眼，少数先进队伍单独冒进，独断专行不理同盟者。三种都是看得见的做法，但都让人觉得自己是对的：局部的数字在涨，先进队伍在前进，决定下得很快。\n\n在今天的工程团队里，它的样子是：平台团队宣布迁移成功，依据是最先接入的二十个积极团队的数据，其余几百个团队仍在用旧路径，也没有人问他们为什么不来；或者一个团队为了自己的延迟指标，在调用链里加了一层缓存，全局的成本和一致性问题由别人承担。反过来的样子同样常见：一项改动会让某个团队损失一个迭代，却让整个平台的事故少一半，这个团队以对自己不划算为由拒绝了。",
  worked: "这一节的第二条，党自己在十年后留下了一份记录。毛泽东一九四八年四月一日在晋绥干部会议上的讲话（收入《毛泽东选集》第四卷）说，晋绥的土地改革和整党总体上是成功的，同时纠正了运动中发生的几个“左”的偏向。第一个偏向是：在划分阶级成分时，把许多并无封建剥削或者只有轻微剥削的劳动人民划进了地主富农的圈子，错误地扩大了打击面，忘记了土地改革中可能和必须团结农村户数约百分之九十二、人数约百分之九十的劳动人民这个战略方针。他还说，一个总的打击面，一般不能超过农村户数百分之八左右、人数百分之十左右。\n\n选集的注释三记录了纠偏的具体动作：一九四八年一月十三日，中共中央晋绥分局发出《关于改正错订成分与团结中农的指示》，要点包括，由于划分阶级成分的标准不明确，在农民自发的要求下，不少人被错订为破产地主和富农，特别是富裕中农被错订为富农；已取出的财物应作适当退还；农民代表会议和农会领导机关里，中农要占三分之一左右。同一篇讲话还指出，一九四七年六月晋绥分局的地委书记会议笼统地提出过“群众要怎样办就怎样办”的口号，助长了某些地区的尾巴主义。这说明多数不等于最响的那部分声音，一个脱离标准的口号，也能带来同样的后果。\n\n这些材料都是党在事后的总结，出自当事一方。被错划的人数、被处死的人数，讲话里没有给出数字，独立研究的数字这里没有查到。",
  experiment: "拿你们正在推的一项改动，写下三栏。第一栏：它对整个平台意味着什么，列出受益的和受损的团队。第二栏：目前采用它的团队占全部团队的多少，没有采用的那一批为什么没有采用，写下你的猜测，并找两个团队去核对。第三栏：该一起商量的人，包括会被这项改动改变工作方式的人，有没有被商量过。再挑出一个局部成本最高的团队，写明你打算怎样补偿或者怎样解释。做完的标志是三栏表和一次核对过的谈话。",

{
  id: "after-we-win-or-a-condition-of-winning",
  track: "strategy", level: "v2",
  title: "等打赢了再改，先问它是不是打赢的条件",
  source: "《为动员一切力量争取抗战胜利而斗争》（一九三七年八月二十五日），第二卷",
  idea: "有人说“待抗战胜利后再实行政治改革吧”。提纲的回答是：这个战争靠单纯的政府抗战，“只能取得某些个别的胜利”，要“彻底地战胜日寇”必须是全面的民族抗战，而全面抗战要以政策的转变为条件。对每一件被排到胜利之后的事，要先问它是胜利的条件，还是胜利的果实；条件不能往后放。",
  why: "这是毛泽东为中央宣传部起草的关于形势与任务的宣传提纲，一九三七年八月二十二日至二十五日在陕北洛川召开的政治局扩大会议通过。提纲先承认国民党在卢沟桥事变后的转变，称蒋介石七月十七日在庐山关于抗日的谈话和他在国防上的许多措施是值得赞许的；但紧接着说，国民党当局又依然继续妥协和让步，压制了爱国军队的积极性和爱国人民的救国运动。今后的任务是动员一切力量争取抗战胜利，“这里的关键是国民党政策的全部的和彻底的转变”。\n\n他列出了尚未转变的几处：在发动民众和改革政治上没有转变，对人民抗日运动基本上依然不肯开放，对政府机构依然不愿作原则的改变，对人民生活依然没有改良的方针，对共产党的关系也没有到真诚合作的程度。接着是被引用的那一段：有些国民党人说待抗战胜利后再实行政治改革，他们以为单纯的政府抗战便可以战胜日寇，这是错误的；单纯的政府抗战只能取得某些个别的胜利，要彻底战胜日寇是不可能的，“只有全面的民族抗战才能彻底地战胜日寇”。十大救国纲领就是这些条件的清单：军事和人民的总动员，改革政治机构，改良人民生活，以及“召集真正人民代表的国民大会”等。\n\n这个方法真正要求的是一个判断，而不是一句口号：把每件被推后的事放到目标的路径上看，没有它，目标的哪一步走不通。判断本身是需要检验的。这里只给出了一个论证：全面抗战比政府抗战更能彻底取胜，所以改革是条件。",
  failureMode: "文中批评的是两种态度：一种把改革排到胜利之后，因为眼前有更要紧的事；一种因循坐误，等着政府抗战自己证明不够。提纲对后果的措辞是，因循上述政策，将使抗日战争蒙受绝大的不利。\n\n在今天的工程团队里，它的样子是：一次迁移的计划里，回滚演练、监控覆盖、数据所有权的梳理、值班交接，都排在切换完成之后，理由是现在最要紧的是把切换做完。切换中第一次出事故时，才发现回滚路径从来没有演练过，没有人知道该看哪块面板。这些事其实是切换成败的条件，被当成了切换成功后的收尾。",
  worked: "这条分界，党和国民党都在各自的记录里留下了证据。国民党一方：《抗战建国纲领》规定设立国民参政会，第一次会议一九三八年七月六日至十五日在汉口开。据人民网党史频道，公布的参政员名单共二百名，其中有共产党员，国民党员的人数各来源写法不一，这里不取其中任何一个。参政员不是普选产生的。官方党史把它定性为咨询机关。它是政治上的一步，但提纲要求的是政府机构的原则性改变，这一步只走了其中的一小段。\n\n共产党一方，留下的记录更直接。同一份提纲的十大纲领里，土地政策是减租减息。一九四六年十月一日，毛泽东在《三个月总结》第十四条里写道：凡对五月四日指示执行得不坚决，或布置太晚，或“借口战争忙而忽视土地改革”的地方，农民即站在观望地位。《选集》注释五说明，日本投降后，中共中央根据农民对土地的迫切要求，决定改变抗战时期的土地政策，由减租减息改为没收地主土地分配给农民。就是说，党自己在一九四六年也遇到了战争忙这个理由，并且在总结里把它记作错误。\n\n这两条记录说明，被推迟的改革是否构成条件，要看对象和时点，不能当作通则。提纲的判断，即只有全面的民族抗战才能彻底战胜日寇，同一九四五年八月日本宣布投降这一结局之间的关系，这里的材料没有回答。",
  experiment: "把你们某个进行中的迁移或上线计划里，所有排在完成之后的事项列出来：回滚演练、监控覆盖、数据所有权梳理、值班交接、文档。每一项问一个问题：如果没有它，切换过程中的哪一步会走不通，或者出事故时哪一步没法止损？答案是会的，移到切换之前，排进日历；答案是不会的，写明它为什么真的可以等。做完的标志是一张两栏表，一栏条件，一栏果实，条件那一栏里每一项都有了日期。",

  idea: "对方递来一份“和平”条件，有两种省力的反应：当笑话看，或者当冒犯看。文章要求第三种：逐条读，把每个条件翻译成接受它就保住了谁的什么。条件的措辞越体面，越要问它保护的是哪一样东西，其中哪一条是对方的“命根”，那一条才是谈判真正的内容。",
  why: "这是毛泽东为新华社写的一系列评论的第一篇，写于一九四九年一月四日，对象是蒋介石一月一日的新年求和声明。声明里的条件是：无害于国家的独立完整，有助于人民的休养生息，宪法不被违反、国体和法统不致中断，军队有确实的保障，人民能维持目前最低的生活水准。文章开头先说，人们不要把求和当作滑稽，也不要当作可恶，因为由对方首脑出面求和，对认识对方的计划“有一种显然的利益”。\n\n接着是逐条翻译，这是他自己的解读，措辞带有强烈的立场。独立完整，指的是保住中美商约等条约和美国在华的各项特权；休养生息，指的是让已被击败但尚未消灭的一方休整，以便卷土重来；宪法和法统不中断，指的是保住统治地位，法统一断，整个阶级将被消灭，战犯将被捉拿；军队有确实的保障，他称之为这个阶级的命根，虽已被歼灭几百万，还剩一百几十万；最低生活水准，则是维持现有的剥削关系不变。他还把对方自己的说法推到底：声明称政府的力量超过共党几倍乃至几十倍，而解放军有三百多万人，几十倍就是几千万人，那又何必求和。\n\n文章最后换了一种证据：不看说辞，看外部可观察的反应，北平元旦物价上午略跌、下午复原，外国通讯社说上海对致词的反应冷淡。这个方法真正要求的是三步：条件逐条翻译成利益；检查对方自己的说法是否前后一致；再找一个不依赖对方的外部信号。",

  worked: "文章里的对应关系，可以拿后来的文件对账。一九四九年一月十四日，《中共中央毛泽东主席关于时局的声明》提出八项条件：惩办战争罪犯，废除伪宪法，废除伪法统，依据民主原则改编一切反动军队，没收官僚资本，改革土地制度，废除卖国条约，召开没有反动分子参加的政治协商会议。其中宪法、法统、军队三项，正好和对方声明里的三点一一对应：宪法不被违反、法统不致中断、军队有确实的保障。也就是说，对方要保的，就是这边要拆的。\n\n《选集》注释记录了后面的经过：这八项条件成为一九四九年四月中共代表团和以张治中为首的国民党政府代表团谈判的基础。四月一日代表团到达北平，经过半个月谈判，四月十五日中共代表团提出《国内和平协定》最后修正案，四月二十日被南京政府拒绝；四月二十日夜起，人民解放军开始渡江，四月二十三日占领南京。协定的第七款对军队写得最细：南京政府所属一切武装力量依民主原则改编为人民解放军，设全国整编委员会，七至九人，中共一方派四至五人，南京方面派三至四人。\n\n要说明的是，这些文件和注释都出自中共一方。南京方面拒绝的理由，这里没有查到第一手的材料；中共的文献说，拒绝是因为南京政府仍服从美国和蒋介石的命令，这同样只是一方的说法。",
  experiment: "找一份别的团队或供应商提出的同意迁移或接入的前提条件清单，三到六条。每一条旁边写两句：接受它就保住了他们的什么，让你们失去什么。找出其中最不可能让步的一条，也就是他们的命根，并写下你的依据，是他们过去哪次排期、哪个事故的处理方式。然后写你方的条件，必须和他们的命根那一条直接对应。最后找一个不依赖他们说法的外部信号，比如他们上个季度实际交付的日期，用来检验他们说的话。做完的标志是一张两栏翻译表和一个写进日历的信号。",

  failureMode: "它针对的是按想要的顺序、而不是按做得到的顺序进攻：一开始就去碰最集中、最强大的对手，去攻守备强固的大城市，打成得不偿失或者得失相当的消耗战。同一组原则的第四条明说，要力求避免这样的仗。\n\n在今天的工程团队里，它的样子是：一次数据库迁移从流量最大、依赖最多的核心服务开始，理由是先啃最硬的骨头才有说服力；工具、回滚流程和经验都还没有，第一仗就拖成了几个月的消耗战。",
  worked: "这个顺序写明了它会过期：后取大城市，指的是条件成熟之后。一九四八年秋天，条件到了。据《毛泽东选集》一九九一年版《关于淮海战役的作战方针》的注释，一九四八年九月十六日晚，华东野战军以七个纵队约十四万人攻城，另以八个纵队约十八万人准备阻击北援之敌，经过八昼夜，攻下有十万余人守备的济南，俘虏王耀武，徐州的援军没有敢来。一个月后，东北野战军经过三十一小时激战攻克锦州；一九四九年一月，又经过二十九小时激战攻克天津。按同卷的注释，到辽沈战役结束，解放军在数量上也转入了对国民党军的优势。\n\n毛泽东本人后来也没有把这十条当作不变的东西。据同一版本的注释，一九五八年六月二十三日他在中央军委扩大会议的小组长座谈会上说，十大军事原则是根据十年内战、抗日战争和解放战争前期的经验，在反攻时期提出来的，今后还要根据战争的实际情况加以补充和发展，有的可能要修正。",
  experiment: "把你手上一项多步骤工作（迁移、升级或接入）涉及的目标列出来，每个目标标上两项：它和其他部分耦合得多紧，出了问题有多难回退。按先孤立后集中、先小后大的顺序重新排列，把最大、牵连最多的那一个放到最后，并写下开始它之前必须先具备的条件。",

{

  source: "《中国革命战争的战略问题》（一九三六年十二月），第一卷",
  idea: "防御有两种。积极防御，又叫攻势防御、决战防御，是为了反攻和进攻的防御；消极防御，又叫专守防御、单纯防御，是“假防御”。判断一次防御是哪一种，看它准备了什么样的反攻，而不看它守得多紧。",
  why: "文章为什么从防御说起，开头就交代了：敌人是全国的统治者，红军只有一点小部队，一开始就是同敌人的“围剿”奋斗，发展的命运全看能不能打破“围剿”。所以首先而且严重的问题，是如何保存力量，待机破敌，“战略防御问题成为红军作战中最复杂和最重要的问题”。\n\n他把十年内战里常见的失误归成两种偏向：轻视敌人，和“为敌人所吓倒”。前者看不见自己弱，一味只讲进攻，不讲防御和退却，“在精神上解除了防御的武装”。后者把敌人看得太强，畏敌如虎，处处设防，节节抵御，不敢打向敌人后方，也不敢放手诱敌深入，聚而歼之。两者在精神上都解除了防御的武装，而且他认为轻敌往往先行：一九三二年进攻中心城市的冒险，正是后来第五次反“围剿”时消极防御路线的前奏。\n\n他同时回答了一个反对意见：德日的军事家说防御不能振奋人心。他说这只适用于战争利益仅属于统治阶层的国家；在保卫根据地和保卫中国的口号下，防御反而能够团结最大多数人民，动员落后的群众。他还补了一句限制条件：红军的力量一旦超过敌人，一般就用不着战略防御了。这条原则要求的是一件可以逐项核对的事：每一项防御措施，都写得出它为哪一次反攻服务，什么时候转入。",
  failureMode: "它针对的是消极防御：把守住当成目的，守得越严越觉得安全。文中把这归为“保守主义在军事上的表现”，并说古今中外聪明的军事家没有不反对它的。\n\n在今天的工程团队里，它的样子是：一套老系统正在被迁移，团队给它加了限流、人工审批、额外告警和越来越厚的运行手册，每一层都合理，却没有一项和新系统的切换日期挂钩。老系统因此越来越稳，也越来越不可能被下线，团队的精力一直花在守，没有人在准备反攻。",
  worked: "文中举的失败例子，本篇注释里有记录。据注释，一九二七年十月广东海陆丰农民起义建立的红军，到一九二八年三月因优势敌军围攻和领导指挥上的“左”倾盲动而失败；红四方面军一部一九三六年十月下旬西渡黄河，十一月起称西路军，据注释，“孤军奋战四个月，歼敌二万余人，终因敌众我寡”，于一九三七年三月失败。文章把前一类归于轻敌，把西路军归于被敌人吓倒的退却主义。这是毛泽东的归类，西路军失败的原因另有各家讨论，本篇不展开。\n\n最大的一例，是党自己的结论。一九四五年《关于若干历史问题的决议》把第五次反“围剿”的失败列为第三次“左”倾路线在根据地的最大恶果，并把这一时期的军事指导概括成三步：先是进攻中的冒险主义，主张“御敌于国门之外”；继而防御中的保守主义，主张分兵防御、“短促突击”、同敌人“拚消耗”；最后在退出江西根据地时变成真正的逃跑主义。这三步，和本篇说的先轻敌、后畏敌的顺序大体一致，不过决议是一九四五年写的，立场和用词已是事后的总结。\n\n正面的记录在十年后。据《以自卫战争粉碎蒋介石的进攻》（一九四六年七月二十日）的题注，人民解放军以约一百二十万人对国民党一百九十三个旅，约八个月消灭正规军六十六个旅，连同非正规军共七十一万多人，停止了敌人的全面进攻。《三个月总结》的注释说，敌我形势开始转变，是在一九四七年六月底刘邓大军强渡黄河、进军大别山的时候。防御有终点，反攻有日期，这是文章对积极防御的全部要求。这个定义本身有一个弱点：凡是后来赢了的防御都可以说成积极的，凡是输了的都可以说成消极的，所以实际用起来，要看事先有没有写下反攻的条件。",
  experiment: "把你负责的系统里所有防御性的措施列出来：限流、审批闸门、冗余容量、额外监控、人工兜底。对每一项写一句：它在为哪一次反攻争取时间，那次反攻是什么变更，预计哪天做。写不出来的，就是消极防御。挑其中一项，要么给它挂上一个明确的下线或替代日期，要么承认它是长期成本，把它从“临时措施”改记为常设项目。",
  reflection: "你系统里哪一层防御，已经存在了很久，却没有任何一次反攻在等它？",

{

  title: "退却要有终点，终点由条件决定",
  source: "《中国革命战争的战略问题》（一九三六年十二月），第一卷",
  cheat: "退却阶段要争取六个条件，至少取得两种再反攻：人民援助，有利阵地，主力集中，发现敌之弱点，敌人疲劳，敌人出错。",
  idea: "战略退却是弱军面对优势之敌，为了保存力量、待机破敌而采取的有计划的步骤，不是败退。它的目的是转入反攻，所以每一次退却都要事先回答两个问题：从什么时候退，退到哪里为止。终点不是一个地点，而是一组条件：退却阶段里至少取得其中两种，才算有利于我、不利于敌。",
  why: "文章把战略防御分成退却和反攻两个阶段，说“战略退却的全部的作用，在于转入反攻”。当时的对立面是主张“御敌于国门之外”的人，他们认为退却丧失土地，危害人民，也有不良的对外影响。毛泽东的回答是：只有丧失才能不丧失，这是“将欲取之必先与之”；他把得失算成买卖，不丢掉一部分土地，就换不来战胜敌人、恢复并扩大土地。\n\n终点怎样定，文章列了六个条件：积极援助红军的人民，有利作战的阵地，红军主力的全部集中，发现敌人的薄弱部分，使敌人疲劳沮丧，使敌人发生过失。他逐条说明为什么需要：拣弱的打，要先侦察出敌军各路孰强孰弱，这本身要时间；敌军大大超过红军的时候，要等它深入根据地、“避其锐气，击其惰归”之后，对比才会改变；任何敌军指挥员相当长时间不出一点过失是不可能的，找不到可乘之隙，就再退几步。他又说，这些条件不必同时具备，也不可能同时具备，退却阶段里取得至少二种以上，就可以反攻。\n\n终点还要放在整个形势里判断，而不是只看局部：局部形势对我有利，整体上并不有利时，据此决定终点就是错的，因为反攻总是从局部开始，却要计算到以后的变化。开始退却的时机同样要判断，退得过早和过迟都有损失，一般说来过迟的损失比过早大。这个方法真正要求的是：退却之前，先把终点写成条件，而不是写成地名。",
  failureMode: "它针对的是两种方向相反的毛病。一种是拒绝一切退却，“御敌于国门之外”，处处不肯让，结果丢掉全部。另一种是退了却不知道退到哪里为止，也不知道等什么，退成了没有终点的败退，或者一直守着不反攻。文中说第五次反“围剿”时，红军“全然不讲退却”，原因是对局部形势和整个形势都不注意。\n\n在今天的工程团队里，它的样子是：线上出事故，团队关掉了几项功能、切到只读模式，这是合理的退却；但没有人写下什么时候恢复、凭什么信号恢复，降级状态于是一周一周地延长，最后成了默认状态。反过来的样子是：任何功能都不肯降级，宁可让整个服务一起变慢。",
  worked: "文中最完整的一个例子，是一九三一年的第三次反“围剿”。文章记载：蒋介石亲自出马，“进剿”军三十万人，红军三万左右，苦战后没有休息也没有补充；这一次红军实行了极端的退却，集中到根据地后部，因为围剿军超过红军十倍以上。红军转到莲塘，三战皆胜，接着在敌人集中视线于黄陂时从间隙里穿出，回到兴国境内休息了半个月；等敌人再向西进时，“饥疲沮丧，无能为力，下决心退却了”，红军再乘其退却打了几仗。文章写缴枪“逾万”，而同一版本的注释说这三个胜仗共歼敌一万余人，缴枪六千多支，两处数字对不上，没有找到别的来源可以核对。\n\n这个方法的另一半记录，是说服。文章自己写道，第一次反“围剿”时，吉安、兴国、永丰等县的地方党组织和人民群众无不反对红军的退却，干部的意见在被说服以前不是退却而是进攻；第四次初期干部反对准备；第五次开头是继续军事冒险主义，后来变成军事保守主义。这些困难是毛泽东一九三六年写的总结，并不是当时的会议记录。\n\n他也承认方法有未经验证的部分。讲到把退却终点选在白区的几种设想，他明说“这些说明都是假定，没有经验”，只能当作特殊情况，不能当作一般原则。一般原则只有一条：诱敌深入，退到根据地作战。六个条件也是从江西根据地的经验里概括出来的，文章说人民是其中最重要的一项，因为敌人的弱点、疲劳和过失也靠它更容易造成或发现；离开了根据地，条件之间怎样取舍，文章只有上面那几条没有经验的假定。",
  experiment: "挑一个你们已有的降级或回退方案：只读模式、关掉某项功能、切到单区域、回滚到上一个版本。写下三件事：什么信号触发它（开始时机），它退到的状态是什么（终点），恢复需要满足哪些条件。把文中六个条件翻成你的环境里的说法，比如已定位出故障的那一部分、能复现的测试、主力工程师已到位、压力已经过去、对方（依赖或流量）已经暴露出弱点。规定至少两个成立才恢复，然后在预发布环境里演练一次，计时。",

  idea: "要战胜比自己强的对手，作战方法一般是运动战，运动战就意味着暂时放弃若干地方和城市。这种放弃“不但是不可避免的，而且是必要的”，是为了取得最后胜利；而且必须在放弃之前，让全党和全地区的人民都明白，都有精神准备。",
  why: "这是毛泽东为中央起草的党内指示，写在国民党军队大举进攻解放区、全国规模内战爆发之后不久。据本篇题注，当时国民党用于进攻的正规军有一百九十三个旅，约一百六十万人，人民解放军总兵力约一百二十万人，在数量上居于劣势。指示一共六条，第三条讲作战方法。\n\n这一条的论证次序是：先定方法，再推出代价。方法是运动战，不死守一城一地；因此若干地方、若干城市的暂时放弃就不是例外，而是方法本身的一部分。放弃为的是取得最后胜利，不放弃就取不到。这和《中国革命战争的战略问题》里“将欲取之必先与之”算的是同一笔账：用地盘换对方有生力量的消耗和自己力量的保存。\n\n这一条还多说了一件事，是对内的：此点应使全党和全解放区人民都能明白。按我的读法，这等于承认放弃一座城很容易被读成失败，所以要先解释，后行动。这个方法真正要求的是两件事：放弃是事先选定的，而不是被打出来的；承受放弃代价的人，要在放弃发生之前就知道这是计划的一部分。",
  failureMode: "它针对的是两种反应。一种是死守，每个地方都不肯让，兵力被钉在各处，机动部队越来越少。另一种是把任何一次放弃都当作失败，在党内和人民中引起悲观情绪，使本来有计划的转移变成惊慌。后来的《三个月总结》里，毛泽东还专门要求各地领导向“对于斗争前途怀抱悲观情绪”的同志作充分解释。\n\n在今天的工程团队里，它的样子是：为了集中人手完成一次迁移，团队决定在三个月里不再修旧系统里一类低优先级的缺陷，或者接受某个次要区域的延迟变差。这是一项有计划的放弃；但没有人事先告诉受影响的团队，他们是在工单被拒绝的那一天才发现，把它读成了平台团队的失职。",
  worked: "《三个月总结》（一九四六年十月一日）给了这一条的第一份检查。其中写道，过去三个月丢失了淮阴、菏泽、承德、集宁等几十个中小城市，多数是“不可避免地要放弃和应当主动地暂时放弃的”，一部分是“仗打得不好被迫放弃的”。同一份文件把两类放弃分开记账，并说今后还可能有一部分地方在不得已时被敌占去，只要仗打得好，将来均可收复。它又说，凡民兵、游击队、武装工作队组织得好的地方，虽然被敌人暂时占领许多点线，仍能控制广大乡村；地方武装薄弱的地方，就给敌人很大的便利。\n\n结果在两个层面上可以核对。据《以自卫战争粉碎蒋介石的进攻》的题注，解放军约八个月消灭正规军六十六个旅，连同非正规军共七十一万多人，停止了敌人的全面进攻。但放弃换不换得到东西，要看后面的仗打得怎样，《三个月总结》自己也这样写：只要今后仗打得好，失地即可收复。\n\n延安是最著名的一次。据党史网站12371.cn转载的回顾文章，一九四七年三月，胡宗南部队从南、西、北三个方向进攻陕北，兵力约二十三万人，西北野战军只有两万多人；毛泽东三月十八日离开延安，决定主动撤离，转战陕北。这些数字出自党史普及文章，不同研究对兵力的统计可能不同，没有查到更权威的出处。",
  experiment: "找出你们团队下个季度为了集中力量而打算放弃的东西：不再支持的旧接口，推迟的低优先级缺陷，暂时接受变差的某项指标。每一项写三行：它是我们选定的，还是被迫的；谁来承担它的代价；他们现在知道吗。把选定的和被迫的分开记账，挑出受影响最大的一项，在放弃发生之前把理由、范围和恢复它的条件写成一页，发给受影响的人，让其中一位用自己的话复述一遍，看复述和你的意思差多少。",

  why: "文章写在全面抗战开始后不到一年。据题注，当时党内党外有许多人轻视游击战争的重大战略作用，只把希望寄托于正规战争。毛泽东的立场是：正规战争是主要的，游击战争是辅助的，但中国是大而弱的国家，被小而强的国家攻击，敌人占地很广而兵力不足，游击战争因此不只是战术配合，还有自己的战略问题。\n\n他把全部战略纲领归成六项，中心的一项是主动地、灵活地、有计划地执行防御中的进攻、持久中的速决、内线中的外线。其中先讲主动权。争取它的条件，是抓住敌人的三个弱点：兵力不足，异国作战，指挥笨拙。欺他兵力不足，游击队可以放手争取广大的活动地区；欺他是异民族，可以争取人民的拥护；欺他指挥笨拙，可以发挥自己的聪明。游击队自己的弱小也能成为条件：正因为弱小，才利于在敌后神出鬼没，这样大的自由是庞大的正规军得不到的。\n\n主动权在敌人数路围攻时“难于掌握和容易丧失”。如果已经被迫处于被动，任务就是努力脱出：“走”是主要的方法，游击队的会走正是其特点，但不限于此，往往敌人十分起劲、自己十分困难的时候，正是对方开始不利的时候，有利的情况产生于“再坚持一下”的努力之中。这个方法真正要求的是：先把估计做对，再谈处置；被动时先问是估计错了，还是处置错了。",

  experiment: "把你团队上个月的工作条目列出来，每一条标上发起方：我们自己选的，还是外部事件（故障、请求、他人的截止日期）带来的。算出前者占多少。挑一类反复出现的被动事项，先写两种估计：悲观版（这件事我们没法改变），乐观版（两周就能根治）。再用过去八周这类事项实际出现的次数和耗时，写出第三种估计，据此定一个处置：走（把它交出去，或停止承担），还是再坚持一下（继续观察，并写明观察多久、看什么信号）。",

  idea: "一份作战计划要同时写两样东西：最理想的结果是什么，以及即使其余目的都落空，只做成哪一件事也算赢。后者必须具体，能在较短的时间内判定，并且做成之后能带来主动权。全部注意力先压在它身上，其余目标是顺带争取的。",
  why: "本篇收入的是毛泽东为中央军委起草、发给东北野战军林彪、罗荣桓等人的两份电报，一份发于九月七日，一份发于十月十日。九月七日的电报先算全局：准备五年左右（从一九四六年七月算起）根本上打倒国民党，各野战军分摊歼敌任务，东北方面要配合华北的两个兵团歼灭卫立煌、傅作义两军三十五个旅左右。具体打法是九、十两月歼灭锦州至唐山一线的敌人，主力用在这条线上，“置长春、沈阳两敌于不顾”。理由有两条：锦、榆、唐三点及其附近的敌人互相孤立，攻歼取胜比较确实可靠；主力如果停在新民以北，沈阳的敌人受威胁太大，可能不敢出来，锦、榆、唐一头的敌人又可能收缩，变成“不甚好打而又不得不打”。\n\n同一份电报把期望分了层。“最理想的情况”是：主力位于锦州附近，卫立煌才敢来援，于是不离开这条线，连续歼灭援敌，把卫立煌全军就地歼灭。为此电报要求确立三个决心：攻占并全部控制锦、榆、唐一线，打前所未有的大歼灭战，并据此重新筹办粮食、弹药、新兵和俘虏事宜。十月十日的电报则划出了底线：战局很可能发展得极为有利，但“这一切的关键是争取在一星期内外攻克锦州”；中心注意力必须放在锦州方面，“即使一切其它目的都未达到”，只要攻克了锦州，“就有了主动权”，“就是一个伟大的胜利”。电报还规定了信息节奏：从开始攻击锦州之日起，每两日或三日把敌情和己方情况电告一次；头几天东西两路援敌不会大动，要用全部精力放在锦州。\n\n这个底线有三个特点：它是一座具体的城市，有一个以天计的时限，而且它改变的是谁握有主动，而不只是多拿到一点战果。这个方法真正要求的是：把最理想的情况和底线分开写，最理想的情况用来安排准备，底线用来决定主攻方向；两者冲突时，先保底线。",

  worked: "这个方法留下了文电记录。据《中国共产党大事记·1948年》，十月三日中央军委和毛泽东批评并纠正了东北野战军司令员林彪在攻锦打援上的犹豫动摇，并一再阐明攻锦州的战略意义。军委要求集中主力迅速打下锦州，不再动摇。选集本篇只收了九月七日和十月十日两份，十月三日的电报不在其中。\n\n结果记在本篇注释里。十月十四日人民解放军对锦州发起进攻，三十一小时激战全歼守敌，俘范汉杰以下约九万人，远在电报要求的“一星期内外”之内。最理想的情况只实现了一部分：蒋介石飞到东北，从华北调来五个师，连同锦西原有的四个师，共九个师，十月十日起猛攻塔山阵地，始终没有突破；从沈阳来援的廖耀湘兵团十一个师又三个骑兵旅，被阻在彰武、新立屯一带；锦州解放之后，长春的一个军起义，其余投降；东北野战军随即回师，十月二十六日把廖兵团包围，两日一夜全部歼灭，俘十万余人。全役共歼敌四十七万二千余人。九月七日电报设想的不离开锦、榆、唐一线就地歼灭援敌，实际是锦州打下以后回师另打一仗。\n\n这份记录有一个缺口：底线在这次战役里没有被用上。锦州不但打下了，后面的战局也比九月七日的估计更顺，文电里没有留下只拿到锦州、其余落空的例子，所以“一个伟大的胜利”这个判断是事前写下的，没有被事后检验过。头几天东西两路援敌不会大动，同样是事前的估计，注释只记录了援敌后来被阻住，没有说明这个估计是怎样得出的。",
  experiment: "挑一项你正在推进、有截止时间的变更：一次迁移、一次替换或一次大规模升级。动手之前写三行：最理想的结果；底线，也就是其余目标全部落空时仍然值得做的那一件事，它要能在一两周内用一个可以观察的信号判定，做成之后你能主动选择下一步，而不是被动应付；为这件事可以停掉的其他目标。再定一个信息节奏：进入紧张阶段后，每两三天按固定的几栏（进度、阻碍、损耗）写一次状态，底线达成之前，其他事项只报一行。把这三行发给一位熟悉系统的同事，请他指出你的底线是否真的能带来主动权。",

  why: "这是毛泽东给西北野战兵团的电报。据同卷《蒋介石政府已处在全民的包围中》的题注，本篇和那一篇都是他在陕北靖边县王家湾写的，这时中共中央已经撤出延安，国民党胡宗南部在陕北追赶西北野战兵团。电报先估计对方的状态：敌人“相当疲劳”，但“尚未十分疲劳”；粮食相当困难，但还没到极端困难。接着说对方的企图：不顾疲劳和缺粮，把解放军主力赶到黄河以东，然后封锁绥德、米脂，分兵“清剿”。\n\n回答是继续过去的办法，在现地区同对方再周旋一个月左右，目的在使它达到十分疲劳、十分缺粮的程度，然后寻机歼击。电报把两个很有吸引力的做法都点名否决了：主力“不急于北上打榆林，也不急于南下打敌后路”。路线也一并规定：先引敌向瓦窑堡以北，再向对方较弱的一部攻击，把它引向东，然后折向安塞方向，再把它引向西。同时要求三五九旅在数日内做好南下袭击的准备，一星期后去切断延安至延长一线以南、宜川洛川一线以北的粮运。\n\n这个办法看上去像迟迟不打，电报因此要求向指战员和人民群众说明，这是“最后战胜敌人必经之路”，并给了理由：“如不使敌十分疲劳和完全饿饭，是不能最后获胜的”。这个方法真正要求的是三样东西：给等待定一个时限，给动手定一个可以观察的阈值，并向承担等待代价的人讲清楚等待为什么不是退缩。",

  worked: "记录显示这个办法在随后几周里兑现了。电报提到的青化砭一仗发生在一九四七年三月二十五日，据本篇注释，国民党军整编第二十七师三十一旅旅部和一个团共二千九百余人被全歼。据中国共产党新闻网转载的《学习时报》二〇二四年二月文章（李志新、钱均鹏），此后胡宗南数万人在延安以北的沟壑里辗转，找不到解放军主力，只占了几座空城，粮食补给不上，官兵疲劳，开小差和落伍的人越来越多；主力四月五日南撤蟠龙、青化砭休整（光明日报刊载的新华社稿写作四月六日，两处相差一天）。同一篇文章说，解放军派小部队实施“蘑菇”战术，主力则隐蔽集结在蟠龙西北休整，四月十四日在羊马河全歼整编第一三五旅四千七百余人，自己伤亡四百七十余人；这个伤亡数字只见于这一篇。\n\n电报预计的时间也可以核对。电报写于四月十五日，说再周旋一个月左右。据光明日报刊载的新华社稿，蒋介石误以为中共中央和解放军主力要东渡黄河，令胡宗南、邓宝珊南北夹击；胡宗南集中九个旅，于四月二十六日分两路向绥德方向前进，只留一六七旅旅部和一个团等守备蟠龙这个补给基地；西北野战兵团调整部署，一部诱敌北上，主力围攻蟠龙，五月三日发起攻击，四日结束，全歼守敌六千七百人，缴获大量粮食和军需物资。从电报到蟠龙之战是十八九天，没有等到一个月；这篇稿子叙述的战机，来自蒋介石的误判和胡宗南随之分兵；疲劳和缺粮在多大程度上促成了这一步，稿子没有分开讲。电报没有提四月十四日的羊马河一仗，两者怎样衔接，这里没有查到。\n\n光明日报刊载的新华社稿用“五战五捷”概括这一时期，并说西北野战兵团以不足对方十分之一的兵力作战。这是事后的总结，不是电报的内容。电报自己的判断是“相当疲劳，尚未十分疲劳”，这个判断靠观察，没有一个独立的度量，后来能核对的只有结果：对方疲劳到了什么程度，这里没有查到独立的度量。",
  experiment: "挑一个你一直想尽快解决的外部拖累：一次被某个依赖卡住的迁移，一个必须等的供应商交付，或者一个越来越不稳的旧组件。写四行：现在的状态，用可以观察的量表示（事故次数、延期天数、成本）；你们的动手阈值，到什么程度才动手；等待的时限，最多多久；等待期里在做什么，比如预先演练切换、备好回滚，只留一小部分人保持观察。再写两行：被明确否决的两个冲动（现在就硬上，或者绕开它另起炉灶）以及各自的理由。时限到了，对照阈值，决定动手还是延长，并写明延长的依据。",

  title: "把对方的一个大合围，拆成自己的许多个小合围",
  source: "《中国革命战争的战略问题》（一九三六年十二月），第一卷",
  idea: "在整体上处于劣势、被对方合围，不等于每一次交手都处于劣势。第一种办法是在每一次战役和战斗里集中兵力，把对方对自己的一个大合围，拆成自己对它的许多个小合围，让整体上的弱者在局部成为强者。第二种办法是，如果在合围之内始终解决不了，就用主力突破合围线，打到对方的内线去，逼它回援。",
  why: "这篇著作是毛泽东为总结第二次国内革命战争的经验写的，据题注，当时曾在陕北的红军大学讲过。讲战略防御时，他先谈主动：军事指导者无论处在多复杂严重的环境，首先需要独立自主地组织和使用自己的力量；被逼到被动是常有的事，重要的是迅速恢复主动。主动不是空想，是具体的、物质的，最重要的是保存并集结最大而有活力的军队。集中兵力、运动战、速决战、歼灭战都是必要的条件，其中集中兵力“是首先的和主要的”。\n\n集中兵力要改变三种形势：进退，攻守，内外线。第三种是红军的特殊处境。红军在战略上处于内线，被对方合围，蒙受许多不利，但可以而且应该在战役或战斗上把它改变过来：把对方对自己的一个大合围，改成自己对对方的许多各别的小合围；把对方战略上的分进合击，改成自己在战役或战斗上的分进合击；把对方战略上的优势，改成自己在战役或战斗上的优势，同时把自己战略上的弱者地位，改成战役或战斗上的强者地位。他把这叫作“内线作战中的外线作战”，也就是“弱者中的强者”。算式是：战略上“以一当十”，战术上“以十当一”。对方并不是不知道红军的这个习惯，但不知道何时何地红军这样做，所以防不住。\n\n第二种办法写在速决战一节：当合围已经证明无法在内线解决时，应当用红军主力突破对方的围攻线，转入自己的外线，也就是对方的内线去解决，他认为在堡垒主义发达的时候，这种手段将成为经常的作战手段。这个方法真正要求的是两个尺度同时记账：整体上是几比几，局部上是几比几，行动之前要把局部的比例算出来，并且保证主要的方向在同一个时间内只有一个。",
  failureMode: "它针对的是把整体上的劣势，当成每一次交手的劣势。文中点名的做法有“全线出击”，一九三三年的“两个拳头打人”，一九三四年的“六路分兵”和“全线抵御”：处处都有兵力，处处都不占优势，处处被对方各个击破。另一种相反的毛病，是困在合围里，只在原地逐点抵御，没有人考虑跳出去。\n\n在今天的工程团队里，它的样子是：上游一个服务的重试风暴，每周都拖垮下游十个服务。十个团队各自在自己的服务里加限流、加缓存、加告警，每一个都合理，每一个都是在合围之内逐点抵御，没有人去改产生风暴的那一个协议。",

{
  id: "four-situations-you-do-not-fight",
  track: "operations", level: "v1",
  title: "“打得赢就打，打不赢就走”：先写下不打的四种情形",
  source: "《中国革命战争的战略问题》（一九三六年十二月），第一卷",
  cheat: "不好打的四种情形：当面敌人多；敌人虽少，但同邻近之敌十分密接；敌人不孤立，又占有十分巩固的阵地；打了不能解决战斗时，不再继续打。遇到就走。",
  idea: "运动战的规则不是想打就打，而是事先知道哪些情形不打。文章把“打得赢就打，打不赢就走”具体化为四种不好打的情形，遇到其中一种就走。走是为了下一次打，不是为了躲。",
  why: "运动战一节从一个问题开始：运动战，还是阵地战？回答是运动战。理由是没有广大兵力，没有弹药补充，每个根据地打来打去只有一支红军，阵地战对红军基本上无用，防御时不能用，进攻时同样不能用。由此带来一连串的流动：红军没有固定的作战线，根据地的领土时大时小，各种建设工作也跟着流动，所以文章说若干年月的建设计划是不能设想的，要“准备坐下，又准备走路，不要把干粮袋丢掉了”。\n\n“打得赢就打，打不赢就走”，是他对运动战的通俗解释。他承认走的时间通常多于打的时间，“平均每月打得一个大仗就算是好的”，同时说一切的走都是为着打，一切战略战役方针都建立在打这个基本点上。接着列出四种不好打的情形：当面的敌人多；敌人虽不多，但同邻近的敌人十分密接；凡不孤立而占有十分巩固阵地的敌人；打了而不能解决战斗时，不好再继续打。碰到这些情形，准备走。他说这样的走是许可的、必须的，因为承认必须的走，是以首先承认必须的打为条件。\n\n这个规则有边界。文章并不拒绝必要的和可能的阵地战：战略防御时钳制方面某些支点的固守，战略进攻时遇到孤立无援的敌人，都应当用阵地战；反对的只是在今天采取一般的阵地战，或者把阵地战和运动战平等看待。他还把规则绑在阶段上：将来红军的技术和组织条件改变了，阵地战要增加，流动性要大大减少。这个方法真正要求的是，把不打的条件在行动之前写成规则，让撤出成为按规则做的动作，而不是事后要有人来承担的一次失败。",
  failureMode: "它针对的是把走当成失败：遇到不好打的局面也要打到底，固守一个地方，同对方比火力，或者去攻对方设防巩固的阵地。文章说，反对流动的人要装作一个大国家的统治者来办事，结果得到的是一个异乎寻常的大流动。\n\n在今天的工程团队里，它的样子是：一次数据库主版本升级在预发布环境里第三次失败，团队已经投入了三周，每个人都觉得再试一次就能过。没有人事先写过，失败几次、卡在哪一类问题上就停下来换做法，于是大家继续在同一个地方打，没有人去走。",
  worked: "反面的记录是一九三四年四月的广昌战役。据人民网党史频道二〇一六年的文章和国防部网站的叙述，博古信赖的军事顾问李德坚持用“堡垒对堡垒”的办法固守广昌，中央以《保卫广昌之政治命令》要求红军同对方决战；国防部网站记载，毛泽东、张闻天等人不主张同对方死打硬拼，彭德怀说，如果固守广昌，少则两天，多则三天，三军团一万二千人将全部毁灭。战斗持续十八天，红军撤出。人民网的文章写红军伤亡五千零九十三人，约占参战总人数的四分之一，毙伤俘对方二千六百二十六人；国防部网站写伤亡五千多人，占参战总兵力的五分之一。两处占比不一致，数字都是后来的统计。按文章的标准，它至少落在第四种情形里：红军固守一个不能机动的位置，打下去解决不了问题；人民网的文章写对方以十个师在飞机大炮掩护下步步推进，也接近第一、第三种。文章对第五次反围剿开头的记述也是同类：企图恢复黎川，去打黎川以北对方设防巩固的硝石，一战不胜，又打东南的资溪桥，同样是巩固阵地，又不胜，此后辗转寻战于对方的主力和堡垒之间，完全陷入被动。\n\n正面的记述同样出自这篇文章，只有作者一方的叙述。第一次反围剿时，红军先想打谭道源，因为对方不离开居高临下的阵地，两度开进，两度忍耐撤回，几天后找到了好打的张辉瓒；第二次反围剿时，红军开到东固，等王金钰离开富田的巩固阵地，等了二十五天。国家保密局网站转载的《红色往事》能核对的只有后面的结果：十二月三十日龙冈、一月三日东韶两战。两度开进、两度撤回和二十五天的等待，这里没有查到另一来源。\n\n这个规则也随条件而变。文章自己预告，条件改变后阵地战会增加；一九四八年十月的锦州攻坚，据《关于辽沈战役的作战方针》的注释，经过三十一小时激战攻克，是在守敌被隔绝、援兵被阻住之后打的一次攻城战，正是文章留出的例外之一：战略进攻时遇到孤立无援的敌人。文中“平均每月打得一个大仗”的说法，也是作者的概括，这里没有找到统计。",

  idea: "估量形势要看实质，不看现象。一场败仗、一次被围，或者一时看起来很小的力量，都容易被当成全局。把自己的力量估大或估小，把对方的力量估大或估小，都是错估。判断的办法是察看引起变化的各种矛盾是否真正在向前发展，并且只给方向，不给日期。",
  why: "这是毛泽东一九三〇年一月五日写给林彪的信，答复林彪散发的一封询问红军前途应该怎样估计的信（题注）。信里批评的是党内一部分同志：他们相信革命高潮必来，却不相信会迅速到来，所以不赞成争取江西的计划，只赞成在福建、广东、江西之间的三个边界区域流动游击，等到各地的群众工作做好了，再来一个全国武装起义。毛泽东把这套“先争取群众后建立政权”的理论看作不合中国实情，来源是没有认清中国是许多帝国主义国家互相争夺的半殖民地：统治阶级内部长期混战，红军和小块红色区域才能在四围的白色政权中存在和发展。\n\n接着他提出判断形势要认识的几个要点。第一，中国革命的主观力量虽然弱，立足于落后脆弱的社会经济组织之上的反动统治也弱，所以走向高潮会比西欧快。第二，一九二七年之后剩下的力量确实小，但“星星之火，可以燎原”，它在中国的环境里不仅有发展的可能性，而且有发展的必然性；看事情要看实质，现象只是入门的向导。第三，估量对方也一样：一九二八年五月至六月，湖南省委形容湖南的统治者“十分动摇”、“恐慌万状”，到同年十一月起第三次“会剿”井冈山的时候，又有同志问“红旗到底打得多久”，两次估量相隔半年，方向相反。第四，红军里的人遇到败仗、四面被围或强敌跟追，往往把这种一时的小环境一般化、扩大化。\n\n判断高潮是否快要到来，他的标准是详细察看引起高潮的各种矛盾是否真正向前发展了。他列举了帝国主义之间、军阀之间、负担赋税的人和统治者之间、地主和农民之间等一连串矛盾，结论是中国全国都布满了干柴，很快会燃成烈火。同时他不让“快要”变成日期：马克思主义者不是算命先生，只应该也只能说出大的方向，不可能机械地规定时日。这个方法真正要求的是两件事：把每一项判断挂在几个可以去察看的矛盾上；说“快要”的时候，说明它是一个方向，而不是一个日子。",

  why: "《共产党人》是中央办的党内刊物，发刊词写于一九三九年十月四日，抗战进入第三年。他列出的当时形势有两面：抗日民族统一战线里投降、分裂、倒退的危险日益发展；同时党已经走出狭隘的圈子，变成全国性的大党。刊物的任务是帮助建设一个全国范围的、广大群众性的、思想上政治上组织上完全巩固的布尔什维克化的党。他承认党在某种程度上已经是这样一个党，要提出新任务，是因为有大批新党员形成了很多新组织，这些新组织还不是广大群众性的，还不是思想上、政治上、组织上都巩固的；老党员也有提高水平的问题。\n\n论证靠党十八年的历史展开。他认为统一战线、武装斗争、党的建设是中国共产党战胜敌人的“三个法宝”，三者的关系是：统一战线是实行武装斗争的统一战线，党的组织则是掌握这两个武器、对敌冲锋陷阵的战士。党的建设也分三个阶段。第一个阶段是党的幼年时期，路线正确，党员群众积极性很高，获得了第一次大革命的胜利，但终究没有经验；他逐条列出这个阶段的毛病：新党员非常多，没有给予必要的教育；工作经验不少，不能好好总结；混入了大批投机分子，没有清洗出去；处在敌人和同盟者阴谋的包围中，没有警觉性；涌出很多活动分子，没有来得及造成中坚骨干；手里有了一批武装，不能掌握。第二个阶段是土地革命战争，党能够紧紧依靠农民，组织重新发展并得到巩固，驱逐了暗害分子，但仍遭受过几次“左”倾错误的危害，到遵义会议以后党才彻底走上布尔什维克化的道路。\n\n这篇文章没有给出指标，它给的是一张可以逐条对照的失败清单。这个方法真正要求的是：增长的数字上去的时候，同时问清楚这六条里哪一条还欠着，并且把补上它当作一项有名字、有刊物或者别的专门工具的工作，而不是指望时间自己把它补上。",
  failureMode: "文章针对的是把壮大当作巩固：党员和组织的数目增加了，教育、总结、清理、警觉、骨干和对武装的掌握都没有跟上。\n\n在今天的工程团队里，它的样子是：一个平台团队一年内从六个人长到二十五个人，接入的服务从几十个涨到两百个，看板上全是向上的曲线；新人没有做过事故演练，值班手册靠最早的六个人口口相传，几年积累的复盘没有人汇总，临时放开的例外一直没有人清理。第一次大故障来的时候，仍然是最早的六个人在处理。",
  worked: "毛泽东自己后来给出了检验的数字。一九四五年四月二十四日，他在七大的政治报告《论联合政府》里说，党在北伐战争时期不超过六万党员，后来大部分被当时的敌人打散了；土地革命战争时期不超过三十万党员，后来大部分也被打散了；现在有了一百二十多万党员，“这一回无论如何不要被敌人打散”。这些是他的概数，不是独立的统计。同一篇报告还说，这一百二十一万党员绝大多数是在抗日时期入党的，在他们之中存在着各种不纯正的思想，几年来的整风工作收到了巨大的成效，今后要继续，用“惩前毖后、治病救人”的精神。\n\n一九四四年四月十二日的《学习和时局》给出了中间的一站：党员发展到九十多万，同一段话说，一九四三年以来整顿三风和发展生产发生了根本性质的效果，又说去年学会了或开始学会了审查干部和反对特务的政策。按这些叙述，党员数从九十多万到一百二十一万的这一年里，巩固靠的是整风和审干这样的专门工作，而不是靠刊物本身。\n\n同一件事在研究者那里有另一种写法。高华在《红太阳是怎样升起的》中记述了一九四三年延安和各根据地的“抢救”运动，对审查干部这项巩固工作的评价，和毛泽东这里说的“学会了”不一样。这篇文章没有讨论巩固工作自己会不会变成问题，发刊词里的清单只覆盖党欠了什么，没有覆盖补的办法本身该怎样受检查。",
  experiment: "这是一次对你自己环境的审计，不是对别人的批评。写下过去十二个月你们团队增长了什么：人数、接入的服务、托管的集群、新增的工具。再把第一阶段的六条改写成六个你能数出来的数：新人和新接入的团队里受过必要培训的比例；过去十二个月的事故复盘里被汇总成共享清单的比例；临时放开的例外和绕过规范的做法里已清理的比例；你们有没有定期的故障演练；离开最早的几个人，还有几个人能独立处理最严重的一类故障；最关键的自动化工具有没有明确的负责人。找出最低的一个数，写出这个季度由谁、用什么办法把它补上去。",

  id: "their-grain-first-then-yours",

  title: "先解决对方自己的问题，再提你的要求",
  source: "《组织起来》（一九四三年十一月二十九日），第三卷",
  idea: "你向对方要的东西，应该从你先帮他解决的问题里长出来。毛泽东给的比例是：首先用百分之九十的精力帮助群众解决他们自己的“救民私粮”，然后只用百分之十的精力，就可以解决公家要的粮。只向对方要、不给对方什么的做法，在他看来不是技术问题，是脱离群众的作风；同样，把经济工作看成补救财政不足的“临时手段”，也是错误的方针。",
  why: "这是毛泽东一九四三年十一月二十九日在中共中央招待陕甘宁边区劳动英雄大会上的讲话。根据前一年冬天西北局高级干部会议的决议，边区这一年搞了生产运动：军队、机关、学校、工厂都动员起来，打仗的军队同时当劳动的军队用。他先给出这一年的成绩，然后回到方针上，说有两种相反的方针：一种是把一切群众的力量组织起来；另一种只注意组织财政机关、供给机关、贸易机关的一小部分人，不把经济工作当作一个广大的运动，只当作一个用来补救财政不足的临时手段。他说边区过去存在过后一种方针，经过历年的指正，特别是去年的高级干部会议和今年的群众运动，这样想的人少了。\n\n接着是组织的办法。在农民方面，他说几千年来一家一户的个体经济是封建统治的经济基础，克服的办法是逐渐集体化，而道路是合作社；边区现有的是建立在个体经济基础上的初级形式，其中变工队、扎工队这类劳动互助组织，只要是群众自愿参加的，就是好的，括号里特别写着“决不能强迫”；这种办法是群众自己发明、干部综合出来的。他要求每个党员学会组织群众的劳动，知识分子出身的党员也要学，半年一年就可以学好。\n\n讲话里分量最重的一段在干部作风上。他说，做地方工作的同志如果脱离了群众，只知道向他们要救国公粮，而不知道“首先用百分之九十的精力”去帮助群众解决“救民私粮”的问题，那就是沾染了国民党的作风，因为国民党就是只问老百姓要东西、不给老百姓任何东西的。这个方法真正要求的是：每一次向对方提要求之前，先看你给了他什么；并且这种检查要像“天天洗脸”那样天天做，因为官僚主义和军阀主义的灰尘天天都在扑来。",
  failureMode: "文章针对的是只要不给：做地方工作的同志只知道向群众要救国公粮，不去帮群众解决他们自己的生产和生活问题；另一头则是只组织少数机关，把广大群众排除在经济工作之外。他把这两种做法都归到缺乏群众观点，并且说这类毛病华北华中各根据地都有，陕甘宁边区也有。\n\n在今天的工程团队里，它的样子是：平台团队每个季度给各业务团队发三项要求，补成本标签、升级基础镜像、按期迁移到新的发布系统；各团队自己最疼的是预发环境排队和测试不稳定，这些不在平台团队的季度计划里。季度末要求的完成率低，平台团队把原因记为对方配合不够，下个季度再添一项要求。",
  worked: "讲话里列的成绩是毛泽东在劳动英雄大会上的陈述，没有独立的核对：凡有地的军队今年每个战士平均种地十八亩，每个战士一年只用三个月生产、其余九个月训练和作战，机关学校的蔬菜去年自给百分之五十、今年自给百分之一百，许多变工队的收成比去年多了一倍。他同时承认前方的条件更困难，华北华中的生产运动还没有广泛展开，要靠十月一日中央的指示在明年发动。\n\n这个“百分之九十对百分之十”的要求，是在负担最重的几年之后提出的。毛泽东一九四二年十二月在陕甘宁边区高级干部会议上的报告（选集题为《抗日时期的经济问题和财政问题》）里说，边区的粮食负担，一九四〇年九万担，一九四一年二十万担，一九四二年十六万担，而边区只有一百五十万人口；他承认这个负担不小，一九四〇年到一九四二年是人民负担加重的阶段，同时批评竭泽而渔、诛求无已是国民党的思想，并说发展自给经济以后，加在人民身上的赋税就可以愈减轻。选集为这篇报告写的题注，也把批判“只注意向人民要东西的错误作风”列为报告的重点。也就是说，报告把一九四三年以后列为可以走上减轻负担的第三阶段，这是一个方向，报告里没有给后来的数字。\n\n“自愿”这条要求后来被放到大得多的规模上检验过。一九八一年《关于建国以来党的若干历史问题的决议》写道，对个体农业，党遵循自愿互利、典型示范和国家帮助的原则，经过互助组、初级社到高级社；同一份决议认为，一九五五年夏季以后，农业合作化以及对手工业和个体商业的改造要求过急，工作过粗，改变过快，形式也过于简单划一，以致在长期间遗留了一些问题。这些问题是后来的做法造成的，不能算在《组织起来》这篇讲话的账上；讲话里的“自愿”和决议所说的自愿互利，是同一个要求。",
  experiment: "把你们团队上个季度向其他团队提出的要求列成一张表，每一项估计对方要花多少人天：补标签、升级、迁移、填问卷。再另列一张表：这些团队在你们最近一次访谈、问卷或事故复盘里，自己说最疼的三个问题是什么，你们上个季度有多少比例的人力用在这些问题上。算出两边的比例，再挑一项你们要的东西，看它能不能用解决其中一个他们自己的问题来换，而不是靠一条截止日期。现实的约束是你们的人手有限，所以最后只写一件下个季度要换的事，以及换到的标准。",

  idea: "愚公的话是一条论证，不只是一股决心：我死了有儿子，儿子死了有孙子，子子孙孙没有穷尽；山不会再增高，“挖一点就会少一点”，所以总有挖平的一天。这条论证有前提，能成立是因为存量在减、人手不断。毛泽东用它给全党建立信心，同时说光是先锋队下决心不够，必须使广大人民群众觉悟，甘心情愿一起来挖。",
  why: "这是一九四五年六月十一日毛泽东在党的七大上的闭幕词，大会从四月下旬开到六月十一日，做了三件事：决定了党的路线，通过了新党章，选举了中央委员会。他说，宣传大会路线是要使全党和全国人民建立起一个信心，即革命一定要胜利。这一步分两层：首先要使先锋队觉悟，下定决心，不怕牺牲，排除万难；“但这还不够”，还必须使全国广大人民群众觉悟，甘心情愿和我们一起奋斗。\n\n他讲了《愚公移山》。北山愚公家门前有太行、王屋两座大山挡路，他下决心率领儿子们用锄头挖去；智叟笑他愚蠢，说不可能挖掉。愚公回答的核心是两条：人是代代接着挖的，山却不会再增高。愚公以此批驳了智叟的错误思想，毫不动摇，每天挖山不止。现在压在中国人民头上的两座山，他说是帝国主义和封建主义，中国共产党早已下了决心要挖掉它们，要坚持、要不断地工作，“我们也会感动上帝的”，这个上帝就是全中国的人民大众。\n\n这个读法对原文做了两处改动，选集的注释把原文附在后面，可以对照。《列子·汤问》里，感动的是天帝，派夸蛾氏二子背走二山；这里换成人民大众。另一处是，原文里愚公的妻子问挖出来的土石放到哪里，回答是运到渤海边去，闭幕词没有提这一问，也没有论证现实里的这两座山会不会再长。这个方法真正要求的是：先把为什么挖得平的前提写出来，检查存量是不是真的在减；再把能一起挖的人算进计划，而不是只靠先锋队的决心。",
  failureMode: "文章针对的是两种态度。一种是智叟式的：用现在的人手去量整座山，断定完全不可能，所以不开始。另一种在文中只是一句“但这还不够”：以为先锋队下了决心就行，没有让广大群众觉悟和愿意一起干。\n\n在今天的工程团队里，它的样子是：一个五人小组承诺三年内迁完两百个遗留任务，每周按时挖掉几个，而业务团队每周仍在旧框架上新建任务；三年后旧任务的数量比开始时更多。小组每一周都很努力，但没有人算过每周新增和每周迁走哪一个更大，也没有让写旧任务的人觉得迁移对自己有好处。",
  worked: "同一次大会里，毛泽东给出了人手的数字。四月二十四日的政治报告《论联合政府》里，他说党在北伐战争时期不超过六万党员，土地革命战争时期不超过三十万党员，都大部分被打散了，现在有了一百二十多万党员；军队发展到九十一万人，乡村里不脱离生产的民兵二百二十万人以上。这些是他在报告里的叙述，不是独立的统计。这些数字说明闭幕词讲的第二层，不是只靠决心：挖的人确实增加了。\n\n“山”这一边，闭幕词自己就写到它在变。同一篇讲话里，他说美国政府扶蒋反共的政策说明了美国反动派的猖狂，但一切阻止中国人民胜利的企图注定要失败，并且说国民党第六次代表大会和共产党第七次代表大会各有完全不同的目的。山是不是不再增高，这篇讲话没有论证，它给的是一个判断。\n\n这个寓言后来被放进过更大的计划里，评价则不属于这篇闭幕词。一九八一年《关于建国以来党的若干历史问题的决议》评价一九五八年的“大跃进”时说，毛泽东和不少领导同志在胜利面前滋长了骄傲自满情绪，急于求成，“夸大了主观意志和主观努力的作用”，没有经过认真的调查研究和试点就发动了运动。决议说的是另一个时期的另一些决定，不是对愚公移山这篇文章的评论；但它指出的错误，正是这个寓言里被略过的那个问题：决心是不是替代了对前提的检查。",
  experiment: "挑一座你们已经决定要挖的山：一批遗留任务、一个旧集群、一类重复的手工操作。先算两个数：过去三个月每周新增了几件，每周迁走或消除了几件。如果新增不比迁走小，写下这座山现在是在变高，先写出能让新增降下来的一件事，再谈挖的速度。再写两件事：被挖走的东西，也就是旧系统里的数据、旧接口和旧约定，最后放到哪里；哪些团队如果感觉到好处，会愿意一起挖，他们得到的第一件好处是什么。",
  reflection: "你们这个季度的迁移，是存量真的在变少，还是新增一直在补回去？",
  recall: {
    q: "愚公怎样回答智叟？毛泽东在这篇闭幕词里，除了先锋队的决心之外，还加了什么条件？",
    a: "愚公说，他死了有儿子，儿子死了有孙子，子子孙孙没有穷尽；山虽然很高，却不会再增高，挖一点就会少一点，为什么挖不平呢。毛泽东加的条件是：光是先锋队觉悟、下决心还不够，必须使全国广大人民群众觉悟，甘心情愿一起奋斗；文中说的会被感动的“上帝”，指全中国的人民大众。\n\n容易忘的是，愚公的论证靠两个前提，山不再长和人手不断，而闭幕词只落实了第二个，第一个没有讨论。《列子》原文里愚公的妻子问土石放到哪里，这一问在闭幕词里也没有出现。"
  },
  deepDive: "这是我们打算挖的一座山，以及最近三个月每周新增和每周消除的数量。帮我判断山现在是在变高还是变低，指出愚公这条论证里我们哪一个前提不成立，并设计一个办法让新增先降下来，同时算出还有哪些人可以一起挖。"
},
{
  id: "one-goal-three-tiers-by-environment",
  track: "growth", level: "v3",
  title: "同一个指标，按环境分三档",
  source: "《必须学会做经济工作》（一九四五年一月十日），第三卷",
  idea: "同一个目标，在不同的环境里不能用同一个数。毛泽东要求部队自给，但按所处的环境定三档：边区的部队百分之百，巩固区约百分之五十，边沿区和游击区百分之十五到二十五，并说最后一档“能够这样，也就很好”。每一档的数从那里的约束推出来，同时用一个趋势检验是否真的学会了：农业、工业、贸易不是一年一年上涨，而是停止不进甚至下降，就是还没有学会。",
  why: "这是毛泽东一九四五年一月十日在陕甘宁边区劳动英雄和模范工作者大会上的讲话。他先讲劳动英雄有带头、骨干、桥梁三种作用，提醒他们不可骄傲，再转到经济工作：近几年开始学会了，但这还只是开始，要在两三年内使陕甘宁边区和敌后各解放区做到粮食和工业品全部或大部自给并有盈余。\n\n他的出发点是环境。边区是农村，建立在个体经济基础上，被敌人分割，又是游击战争的环境，很多同志天天处在农村，却没有真正了解它，带着城市观点处理农村，主观地作出许多不适当的计划，强制施行，常常碰壁。他的判断是，从实际环境出发的工作，看起来收效很慢，并不轰轰烈烈，实际上反而很快，从别处出发则是老碰钉子，根本没有效果。由此推出了具体办法：人力物力分散，所以生产和供给采取“统一领导，分散经营”；农民分散、工具落后、地租沉重，所以减租减息加劳动互助；部队和机关人数相对边区人口太多，如果不自己生产就是军民有一方要饿饭。他给的数字是：边区部队和机关每年需小米二十六万担，取之于民十六万担，自己生产十万担。\n\n三档标准就是这一串推理的结果。第一档，边区的部队全部自给，不领政府一点东西，这是几年内逐渐达到的最高标准；前方要作战，不能采取这个标准，所以第二档是粮食被服由政府供给，油、盐、菜、肉、柴炭费等一概自给，约占全部用费的一半，两三年内逐渐做到，在巩固区可以实行；第三档在边沿区和游击区，不可能自给一半，但可能自给百分之十五到二十五。这个方法真正要求的是：先把环境的几个约束写出来，让每一档的数从约束里长出来，再给每一档一个时间，并且只用一个能看出方向的趋势去检查，而不是全局用一把尺。",
  failureMode: "文章点名的错误有两个。一个是带着城市观点处理农村：脱离实际环境，制定主观的计划并强制施行，结果不是效率快慢的问题，而是老碰钉子、根本没有效果。另一个在前方一些新开辟的地区：颇为富足，工作人员自恃富足，不肯节省，也不肯生产，没有从开始工作的那一年就计算到将来的很多年。\n\n在今天的工程团队里，它的样子是：公司统一规定本季度所有团队可用性达到百分之九十九点九、百分之百接入新发布系统，不管这个团队是在维护三年前的支付系统，有合规冻结期，还是一个刚孵化的内部工具，没有值班也没有用户。前者做不到，后者做到了也没有意义；看板上一片红，没有人知道哪些红是真的问题，团队开始想办法让数字好看。",
  worked: "这些数字是毛泽东在大会上的陈述，不是独立的统计。他说，由于展开了生产运动，军民两方面都吃得很好；前方去年一年进行了大规模的生产运动，作战方面也有很大的成绩，并且开始了练兵运动；他还转述华北华中各地的材料，说减租之后农民愿意组织像变工队一样的互助团体，三个人的劳动效率抵过四个人。这些材料他在讲话里没有出示。\n\n三档的区分也不是固定的。一九四四年四月十二日的《学习和时局》里，他说一九四一年和一九四二年日军集中主力在根据地周围连续“扫荡”，党的根据地缩小了，人口降到五千万以下，八路军缩小到三十多万，财政经济极端困难。一块地区属于哪一档，随战争的形势移动；讲话里没有说一块地区从一档移到另一档时，标准怎样调整。\n\n反过来的例子在这篇文章之后。一九八一年《关于建国以来党的若干历史问题的决议》评价一九五八年的“大跃进”，说它的主要标志是高指标、瞎指挥、浮夸风和“共产风”，读来和这篇讲话批评的“主观地作出许多不适当的计划，强制施行”相近。决议评的是另一个时期的另一些决定，不是这篇讲话。这篇讲话在个体农民互助的问题上说的是，应当采取耐心说服、典型示范，而不是强迫命令、欲速不达。",
  experiment: "这是一次对你们组织的审计。挑一个已经向所有团队发出的统一指标：迁移完成率、可用性、测试覆盖率、值班覆盖。把团队按约束分成三组：新的和有自由的、中间的、有冻结期或合规限制或人手极少的。为每一组写出一个这个指标下现实的数字，以及一个时间，再给最差的一组写一个最低线：做到这一点就够了。最后写一个你每季度都能看的趋势问题：这个指标是在一年一年上涨，还是停止不进甚至下降。再写出哪一档最容易被读成降低标准，你用什么数字来回答。",
  reflection: "你们统一规定的那个数，在哪一组团队那里根本不是衡量，而只是一个要想办法应付的数字？",

    a: "三档。第一档边区的部队全部自给，不领政府一点东西；第二档用在巩固区，粮食被服由政府供给，其余一概自给，约占全部用费的百分之五十，两三年内逐渐做到；第三档用在边沿区和游击区，自给百分之十五到二十五，能够这样也就很好。检验的办法是趋势：农业、工业、贸易是不是一年一年地上涨，停止不进甚至下降，就是还没有学会。\n\n容易忘的是，三档的前提是对环境的判断：农村、个体经济、被敌人分割、游击战争；以及一块地区所在的档，会随战争形势移动，这篇讲话没有说怎样调整。"
  },

{
  id: "take-in-widely-refuse-on-evidence",
  track: "growth", level: "v2",
  title: "大量吸收新人，拒绝和清理都要有真凭实据",
  source: "《大量吸收知识分子》（一九三九年十二月一日），第二卷",
  idea: "怕混进坏人，不是把入口关小的理由。这份决定的做法分三层：入口放宽，凡愿意抗日、比较忠实、能吃苦耐劳的都多方吸收；入口处对敌人和对方派来的人严肃拒绝，已经混进来的，“依靠真凭实据，坚决地有分别地洗刷出去”，同时“严防反革命分子陷害好人”；人进来以后要教育、分配适当的工作、带着干，使新人和老干部、工农党员融洽起来。",
  why: "这是毛泽东为中共中央起草的决定，写于一九三九年十二月一日，抗战进入第三年。它的前提是：长期残酷的战争里，要组织抗战力量、组织千百万农民、发展革命的文化运动和统一战线，都离不开知识分子，“没有知识分子的参加，革命的胜利是不可能的”。三年来已经吸收了大批，但决定指出，许多军队干部“还存着恐惧知识分子甚至排斥知识分子的心理”，许多学校不敢放手大量招收青年学生，许多地方党部不愿意吸收知识分子入党。\n\n决定把原因列成五条：不懂得知识分子对革命的重要性；不懂得殖民地半殖民地国家的知识分子和资本主义国家的知识分子不同；不懂得为地主资产阶级服务的和为工农服务的不同；不懂得资产阶级政党正在同党争夺知识分子，日本帝国主义也在收买和麻醉；最后一条是，不懂得党和军队已经造成了“中坚骨干”，有了掌握知识分子的能力。最后这一条说明，放手吸收有一个前提，就是自己已经有一批能带人的核心。\n\n办法有五项：大量吸收，吸收之后教育和磨练；拒绝敌人派来的和不忠实的分子，清理以真凭实据为准，并且不因此怀疑其余的人；给每个人分配适当的工作，在长期斗争中帮助他们克服弱点；对反对知识分子参加工作的干部，要切实说服，同时鼓励工农干部加紧学习，使“工农干部的知识分子化和知识分子的工农群众化，同时实现起来”；在国民党统治区和日占区原则相同，但入党时更多注意忠实程度。决定的最后一段说，土地革命时期许多地方许多军队对知识分子的不正确态度，今后不应重复，无产阶级自己的知识分子，也不能离开利用社会原有知识分子的帮助。这个方法真正要求的是三件事：入口放宽，筛选靠证据不靠猜疑，进来的人和原有的人双向改变，而不是一方单方面适应另一方。",
  failureMode: "决定针对的首先是恐惧和排斥：把新来的人当作风险，学校不敢招，党部不愿收，干部看不起也不信任他们。同一段文字也防另一头：不分青红皂白地怀疑一切新人，等于把“比较忠实”的人推走，还会让真正的坏人藏得更深，所以才写了“严防反革命分子陷害好人”。\n\n在今天的工程团队里，它的样子是：一次生产事故由一个新接入团队的配置错误引起，之后合并权限只留给最早的五个人，新人半年内不进值班表，评审排在最早那五个人的日程后面；三个月后团队没有长大，负载涨了两倍。另一头的做法是，一次权限异常之后，有人只凭他最近改过这个配置就把一名新人从值班表上拿下来，没有去看审计日志。两种做法都没有证据，一个靠恐惧，一个靠怀疑。",
  worked: "决定写出以前，人已经在往延安去。红旗文稿二〇一五年的一篇文章（新华网转载，没有署作者名）引八路军西安办事处的统计：一九三八年全年获准去延安的青年有一万多名（该文的分月数字这里没有核到）。这些数字说的是去延安的青年，不是入党或入伍的人数，文章也没有把它们和这份决定联系起来。决定本身承认三年来已经吸收大批，它要纠正的是军队、学校和地方党部里不敢放手的一面。\n\n“真凭实据”这条标准在一九四三年受到了检验。中共中央党史研究室著《中国共产党历史》第一卷下册（中共党史出版社二〇〇二年版）写道，党的队伍迅速扩大、国民党顽固派加紧特务活动的情况下，审查干部一般说来“是必要的”；但是审干中对敌情估计过分，把干部思想上、工作上的缺点错误或历史上没有弄清的问题轻易怀疑为政治问题，采取“逼、供、信”的方法，出现了以“抢救运动”为代表的反特斗争严重扩大化。一九四三年七月十五日，康生在延安干部大会上作深入审干的动员报告，书中转引的说法是“在延安，仅半个月就挖出了所谓特嫌分子一千四百多人”，没有注明出处。七月三十日毛泽东指示停止“抢救失足者运动”，八月十五日中央通过《关于审查干部的决定》，十月九日又指示坚持“一个不杀，大部不抓”，十二月二十二日中央书记处认为“抢救运动”应予否定，开始甄别。一九四四年五月二十四日，毛泽东在延安大学开学典礼上说，‘抢救’了好些人，许多是搞错了的，“今天要行脱帽礼，脱去给人戴错的帽子”。决定要求清理靠真凭实据，没有写证据由谁来审、按什么程序审；一九四三年出的事，恰好发生在这个空白里。\n\n后来的另一个节点是一九五六年。《中国共产党一百年大事记》（农业农村部网站转载）记载，一月十四日至二十日中央召开关于知识分子问题的会议，周恩来代表中央作《关于知识分子问题的报告》，宣布知识分子的绝大部分已经是工人阶级的一部分，并提出制定科学技术发展远景规划。这里没有查到一九三九年决定之后知识分子入党或入伍的统计数字，所以这个办法的效果，只能从上面几件事看，不能用数字衡量。",
  experiment: "把你们团队对新人和新接入团队设的入口限制列出来：权限、合并审批人、值班门槛、评审排队、必须先经过的培训。对每一条写出它对应的是哪一件有记录的事故或审计发现，还是一种担心。对只有担心的，改写成一个可以靠日志或审计检验的条件，并写明出现什么证据就收紧、出现什么证据就放开。再写一条反方向的：如果要撤销某个人的权限，需要什么证据，由谁来看，证据放在哪里。现实的约束是评审人手有限，所以最后只留三条要改的，按每周能省下多少评审时间排序。",
  reflection: "你们对新人设的门槛里，哪一条背后有一件具体的事故，哪一条只是一种担心？",
  recall: {
    q: "这份决定怎样处理“大量吸收”和“防止混进坏人”这对矛盾？",
    a: "两头都管：入口放宽，凡愿意抗日、比较忠实、能吃苦耐劳的都多方吸收；对敌人派来的和不忠实的分子严肃拒绝，已经混进来的依靠真凭实据有分别地洗刷出去，同时严防陷害好人；进来之后分配适当的工作，教育和带领。\n\n容易忘的是两点。第一，放手吸收的前提是党和军队已经有了中坚骨干，能掌握新来的人；第二，改变是双向的，工农干部要加紧学习，知识分子也要工农群众化。一九四三年的抢救运动说明，只写“真凭实据”不够，还要写清楚由谁、按什么程序判定证据。"

  deepDive: "这是我们团队对新人和新接入团队设的入口限制，以及每一条背后的事故或担心。帮我分清哪些有记录、哪些只是担心，把后者改写成能用日志检验的条件，再设计一个撤销权限的证据标准，避免它变成凭怀疑处理人。"

{
  id: "a-concession-handed-down-does-not-last",
  track: "growth", level: "v3",
  title: "减租是群众自己的斗争，不是上面的恩赐",
  source: "《开展根据地的减租、生产和拥政爱民运动》（一九四三年十月一日），第三卷",
  idea: "一项好处如果是上面发下去的，站不住。毛泽东的说法是：减租是农民的群众斗争，党的指示和政府的法令只是领导和帮助这个斗争，“而不是给群众以恩赐”；不发动群众积极性的“恩赐减租”，“其结果是不巩固的”。落实的办法有三项：成立或改造农民团体；党委亲手检查几个乡村，找出模范去推动别处；政府站在执行法令、调节东佃双方利益的位置上。",
  why: "这是毛泽东为中共中央写的党内指示，一九四三年十月一日发出，分三部分，第一部分讲减租。当时根据地已经缩小，指示说，党在根据地内“细心地认真地彻底地”争取群众、和群众同生死共存亡的任务，比过去六年更加迫切。具体要求是：秋收已到，各级领导机关要责成党政机关检查减租政策的执行，没有认真减租的，今年一律减租，减得不彻底的，今年彻底减。\n\n指示把减租放进一条因果链里：今秋彻底减租，就能发扬农民的积极性，加强明年的对敌斗争，推动明年的生产运动；后面第二部分又把明年的大规模生产运动，称为继续坚持根据地的物质基础。也就是说，减租在这里不是一项孤立的福利，它是下一步增长的发动机，所以只有农民自己动起来的减租才有资格做发动机。办法上，党委要按中央土地政策和当地情况发出指示，同时亲手检查几个乡村，发现模范，推动别处，并在报纸上发表社论和模范经验的报道；农民团体要成立，已有的要改造；政府的位置是执行减租法令、调节东佃双方的利益。\n\n这个方法真正要求的是：每推行一项变动，先问受益的人有没有自己的组织、能不能自己提出主张，并且上级的角色是领导、帮助和调节，不是代替他们去得到好处。",
  failureMode: "指示点名的错误是“恩赐减租”：上面发指示、下面发通知，减租的结果由干部给，不由农民争。指示同时点名的另一种情况是“减而不彻底”，要求当年补上。\n\n在今天的工程团队里，它的样子是：平台团队在共享集群上推出按团队公平分配配额的新规则，目的是给小团队让出一部分被大团队长期占着的容量。规则由平台团队写、平台团队宣布，小团队没有开过会，也看不到分配数据。一个季度后，几个大团队靠升级到副总裁那里拿到例外，名义上规则还在，实际容量没动，没有人提出异议，因为受益的一方不知道自己该提。",
  worked: "毛泽东自己后来对这项运动的评价偏保守。抗日战争纪念网刊载的刘学礼的文章（原载环球视野的党史文汇，没有注明出处）引了他在中共中央西北局高级干部会议上的话（会议日期这里没有核实）：“减租减息。许多根据地开展得不彻底，边区有些地方也没有做好，还要继续搞。”这是一篇转述文章里的引文，没有查到原始讲话文本，只能当作毛泽东当时的判断，不能当作各根据地的统计。\n\n两年后的文件显示了同一个问题在往前走。一九四五年十二月十五日，毛泽东为中央起草的《一九四六年解放区工作的方针》（《毛泽东选集》第四卷）要求，一九四六年在一切新解放区发动大规模的、群众性的、“但是有领导的”减租减息运动，使群众在运动中翻身并组织起来，成为解放区自觉的主人翁；说如果没有这项坚决的措施，新区的群众“不能区别国共两党的优劣”，会动摇于两党之间。对老解放区，同一份文件的要求是复查减租减息工作，进一步巩固。这份指示没有说复查查出了什么。\n\n指示本身也有一处没有写通。它既说减租是农民自己的斗争，又规定“今年一律”减租，并且要求每个根据地把几万党政军的劳动力和几十万人民的劳动力组织起来生产，同时写明组织要在自愿和等价的原则下进行。一个中央规定了日期和规模的“自己的斗争”，到底有多少是自己的，指示里没有说明；这里也没有查到按地区分列的减租落实统计，所以无法判断有多少地方最后仍是上面发下去的。",
  experiment: "挑一项你们在过去两个季度推下去的规则：配额、模板、值班要求、标签规范。写出四件事：谁是受益的一方；他们有没有自己的、能看到原始数据的渠道，能自己提出例外；两方有分歧时由谁仲裁；平台团队停止盯着它一个月，谁会发现它被绕开了。挑受益方最弱的那一项，设计一个每月十五分钟的固定会面加一块看得到分配数据的看板，两个月后检查：受益方有没有自己提过一个案例。现实的约束是这些小团队没有人手来开会，所以会面要小，案例由看板触发。",
  reflection: "你们推下去的那条规则，受益的人知道它存在吗，他们能自己提出例外吗？",
  recall: {
    q: "毛泽东为什么认为“恩赐减租”不对？他给出的替代做法是什么？",
    a: "他说减租是农民的群众斗争，党的指示和政府的法令是领导和帮助这个斗争，不是给群众恩赐；不发动群众积极性的恩赐减租，结果是不巩固的。替代做法是：成立或改造农民团体，党委亲手检查几个乡村、发现模范推动别处，政府站在执行减租法令和调节东佃利益的立场上。\n\n容易忘的是两点。减租在指示里是下一步增长的发动机：彻底减租，才有明年的对敌斗争和生产运动。指示同时规定了“今年一律”减租，一个由中央定日期的群众斗争，自己的程度有多少，文件里没有说。"
  },
  deepDive: "这是我们团队过去两个季度推下去的几条规则，以及每一条的受益方。帮我判断哪些受益方有自己的组织和数据、能自己提出主张，哪些只是被通知；再为最弱的一项设计一个小而固定的渠道，并写出仲裁的规则，避免平台团队既是规则制定者又是唯一的执行人。"

{
  id: "each-side-reviews-only-itself-each-year",
  track: "growth", level: "v3",
  title: "两方各检讨自己，每年定期一次",
  source: "《开展根据地的减租、生产和拥政爱民运动》（一九四三年十月一日），第三卷",
  idea: "一支靠地方养活的力量，同地方的关系要靠固定的日期和公开的做法来维持，不能靠自觉。指示规定每年正月举行一次：军队一方重新宣布“拥政爱民公约”，自己开检讨会，请居民联欢，有损害群众利益的，“赔偿、道歉”；群众一方重新宣布拥军优抗公约，慰劳军队；检讨时“各方面只批评自己，不批评对方”，公约要“再三再四”地宣读，检查出来的缺点在下一年改正。",
  why: "这是同一份指示的第三部分。写它的目的，是使党政军和人民打成一片，有利于明年的对敌斗争和生产运动。指示要求各根据地党委和军政领导机关，准备在阴历正月普遍地、无例外地举行一次拥政爱民和拥军优抗的广大规模的群众运动，而且以后每年正月一次。\n\n它的结构有几处值得看。两方不对称：军队方面的动作写得最具体，有公约、有检讨会、有联欢、有赔偿和道歉，群众方面是宣布公约和劳军。检查的范围也不对称：是军队方面和党政方面“各自”检查一九四三年的缺点错误，在一九四四年坚决改正，公开的群众性的自我批评里，只许批评自己。文件还点了要检讨的内容：军队欺压党政民，以及党政民关心军队不足。文件规定以后每年正月一次，公约要再三再四地宣读，没有写为什么要重复。\n\n这个方法真正要求的是：一个固定的日期；一份写出来的公约，反复念；力量大的一方先动、动作具体，并且带着赔偿；双方都只讲自己这一边的错，不讲对方的。文件没有写为什么只许批评自己，可以这样读：互相指责的检讨会，会把每一方的注意力放在对方的缺点上，没有人去改自己的行为。",
  failureMode: "指示针对的是两个方向的缺口：一边是军队欺压党政民，一边是党政民对军队关心不足。两边的毛病一旦拿来互相指责，结果就是各自把责任推给对方。\n\n在今天的工程团队里，它的样子是：平台团队和业务团队每个季度各开一次复盘。平台团队的复盘里列的是业务团队迟迟不升级、绕过规范；业务团队的复盘里列的是平台变更没有提前通知、评审排队太久。两份清单各自都准确，但每一条都是对方的错，没有一条写着自己这一边下个季度改什么；两个团队也没有坐在同一个会议室里，读到对方的那份清单。",
  worked: "这个做法不是这份指示凭空设计的。人民网转载的徐平的文章（原载中国军网，二〇二六年二月二十七日）列出，一九四三年五月八日的《解放日报》社论《拥军运动和拥政爱民运动的经验》早于这份指示；指示之后，北方局、华中局和八路军、新四军又各自发了指示，文章没有给日期；一九四四年春节期间各根据地的双拥运动“更广泛、更热烈”，《解放日报》作了声势浩大的宣传报道；文章的评价是运动显著改善了军政、军民关系。这是后来文章的评价，没有给数字，也没有写部队的具体案例。\n\n两年后的文件说明这件事被当作长期工作。一九四五年十二月十五日，毛泽东为中央起草的《一九四六年解放区工作的方针》（《毛泽东选集》第四卷）把拥政爱民和拥军优抗列为第七项，要求这两项工作一九四六年“必须比过去几年做得更好些”，并且说军队中应当从每个指战员的思想上解决问题，“只要军队方面做好了，地方对军队的关系必会跟着改善”。方向仍然是力量大的一方先改。文件没有说明过去几年哪里做得不够。\n\n选集为这篇指示加的注释只解释了两个口号的含义，没有交代落实情况。这里也没有查到具体部队的检讨、赔偿或道歉记录，所以公约宣读之后行为变了多少，只有上面两条间接的材料可以参考。",
  experiment: "把平台团队和一个业务团队上个季度各自给对方造成的损失分开列：平台一侧，比如变更没有提前通知、维护窗口压缩、评审排队过长；业务一侧，比如迟迟不升级、绕过规范、事故报告晚发。只写本侧的，不写对方的。约定一条规则：控制变更入口的一方先发，一页纸，每一条带一个补偿动作和一个期限，例如退回的工时、延期的迁移截止日、服务额度。发出之前不要修饰最难看的那一条。再约定下一次的日期，一年一次。现实的约束是两边都觉得对方先错，所以先动的一方只有一条纪律：不评论对方。",

  },

{
  id: "settle-ownership-before-asking-for-output",

  title: "先把归属定下来，产出才会回来",
  source: "《我们的经济政策》（一九三四年一月），第一卷",
  idea: "新秩序建立的头一二年，产出往往先掉下去。文章写的是：“红色区域在建立的头一二年，农业生产往往是下降的”，恢复靠把归属定下来，再提倡和奖励生产，即“经过分配土地后确定了地权”，农民的劳动热情才起来。对照面是旧制度：“在国民党时代，土地是地主的，农民不愿意也不可能用自己的力量去改良土地”。一个人肯不肯为一块地投入，取决于他是否确信这块地是他的。",
  why: "这是毛泽东在一九三四年一月二十二日至二月一日江西瑞金第二次全国工农兵代表大会上的报告的一部分，题注说这部分报告作于一月二十四日至二十五日。敌人军事“围剿”之外还实行经济封锁，报告回答的是怎样在封锁下建设经济。原则是进行一切可能的和必须的经济建设，集中经济力量供给战争，同时极力改良民众的生活；中心是发展农业、工业、对外贸易和合作社，而在目前条件下“农业生产是我们经济建设工作的第一位”。\n\n报告给了农业这一块的一串材料。一九三三年的农产，赣南闽西比一九三二年增加了百分之十五，闽浙赣边区增加了百分之二十，这是他在大会上的陈述。恢复的办法分两层：地权确定之后，提倡生产，农民的劳动热情增长；再逐项解决生产的必要条件，劳动力、耕牛、肥料、种子、水利。劳动力靠劳动互助社和耕田队来调剂，并推动妇女参加生产；不少的一部分农民（大约百分之二十五）缺乏耕牛，办法是组织犁牛合作社，让无牛人家合股买牛共同使用。同时报告划了一条界线：“目前自然还不能提出国家农业和集体农业的问题”，当前做的是在小农经济的基础上，为某些重要农产作出生产计划。\n\n选集为这句话加的注释，把原因写成分配土地期间地权还没有确定，新的经济秩序没有走上轨道，农民的生产情绪有些波动。这个方法真正要求的是：改组之后先预期有一段下降，不把它读成人的懒惰；先把归属定下来，并让当事人相信它不会被反复改动；然后再去逐项量出制约产出的几个条件，一条一条解决。",
  failureMode: "文章对照的是旧制度下的情形：土地是别人的，耕种的人既不愿意也不可能自己出力改良。这个逻辑同样适用于归属刚刚分配完的时候：如果当事人看到归属仍然可能被改动，他们会观望。\n\n在今天的工程团队里，它的样子是：一次重组之后，三十个服务划给了新成立的四个小组，之后每个季度做一次所有权复核，其中有几个服务在复核中又被划走。新负责人不敢重构，不愿还技术债，不写运行手册，因为不知道下个季度还是不是自己的。两个季度后部署频率和事故响应都下降，复盘把原因写成新小组不够主人翁，没有人把它和复核的频率联系起来。",
  worked: "报告里的数字是毛泽东在代表大会上的陈述，没有独立的统计可以对照；这里也没有查到按县、按年份分列的产量材料。\n\n同一时期的另一件事，在反方向上给了记录。中共中央党史研究室著《中国共产党历史》第一卷上册（中共党史出版社二〇〇二年版）写道，一九三三年二月起，中央根据地在大约一年里开展查田运动，目的是清查漏划的地主富农，六月起广泛开展，“许多地方把大量中农特别是富裕中农错划为地主、富农而加以打击”。九月八日，苏区中央局作出第二次决议，承认查田运动犯了某些错误。十月十日，临时中央政府通过《关于土地斗争中一些问题的决定》，规定富裕中农一年的剥削收入不超过全家年总收入的百分之十五，富农则超过，并要求各级政府复查成分，十月十日以前处置不合此决定的，一律变更。\n\n这本书接着写：这份决定刚在各地执行并取得一定成效，一九三四年三月十五日，新选出的中央人民委员会又发出继续开展查田运动的训令，认为纠正过左的错误是错误的，规定暴动后查田运动前已经决定的地主与富农，“不论有任何证据不得翻案，已翻案者作为无效”。书的结论是，查田运动中“左”倾政策的推行破坏了农业生产，损伤了农民的生产积极性，造成根据地严重缺粮，扩大红军遇到困难。也就是说，这篇报告在一月讲确定地权、让农民放心投入，不到两个月后的训令要求继续查田，并且规定已经定为地主富农的不得翻案；党史书把后一种做法的后果写成破坏农业生产。书里没有给产量下降的具体数字，所以这个结论只能当作党史写作的判断，不能当作量化的结果。",
  experiment: "列出过去十二个月里你们改动过归属的服务、集群或值班范围，每一项写四件事：归属最后一次确定的日期；之后又被重新复核或改动了几次；新负责人的部署频率、事故响应时间，在改动前后各是多少，用你们自己的数据；改动之后他们有没有投入过一项长期的事，例如重构、运行手册、告警调优。挑一个投入最少的，查它的负责人是否相信下个季度它还是自己的。现实的约束是重组出于业务原因，停不下来，所以只要求归属表有版本，改动只在固定的季度日期公布，并写明在途工作怎么处理。",

{
  id: "early-stabilisation-is-not-the-fundamental-turn",
  track: "growth", level: "v5",
  title: "“开始好转”还不是“根本好转”",
  source: "《为争取国家财政经济状况的基本好转而斗争》（一九五○年六月六日），第五卷",
  idea: "最先动起来的指标，往往只说明局面稳住了，不说明结构变了。毛泽东把两件事分开：财政收支接近平衡、通货停止膨胀、物价趋向稳定，是“开始好转”，“但这还不是根本的好转”。根本好转要三个条件，每一个都写明，并且给了时间：大约三年，或者还要多一点。",
  why: "这是毛泽东在一九五○年六月六日中共七届三中全会上的书面报告，新中国成立后的第一次中央全会。报告先列出已经取得的成绩：全国财政经济工作统一管理、统一领导，财政收支争取到平衡，通货膨胀制止了，物价稳定了。接着他把国家分成两块：老解放区约一亿六千万人口，土地改革已经完成，社会秩序安定，经济建设开始走上轨道；新解放区约三亿一千万人口，解放的时间只有几个月到一年，土地问题没有解决，工商业没有得到合理调整，失业严重，社会秩序没有安定，“一句话，还没有获得有计划地进行经济建设的条件”。\n\n所以才有“开始好转”和“根本好转”的区分。根本好转需要三个条件：土地改革的完成，现有工商业的合理调整，国家机构所需经费的大量节减。他估计要争取这三个条件，大约需要三年时间，或者还要多一点，并相信这些条件“完全有把握地”能在三年左右实现。报告随后列了八项工作，前三项大体对着三个条件：有步骤有秩序地进行土改；巩固统一管理，调整税收，合理调整工商业；复员一部分军队，整编行政系统。\n\n政策也随着条件的变化而变。战争在大陆上基本结束，国家可以用贷款帮助贫农，补他们少分一部分土地的缺陷，所以对富农的政策由征收富农多余的土地财产，改为保存富农经济，早日恢复农村生产。这个方法真正要求的是：分清哪些指标是已经动了的，哪些条件还没有动；把条件逐条写出来，并给一个时间预算；条件变了，做法跟着变。",
  failureMode: "报告同时防着两头。一头是看到物价稳住了、收支接近平衡就以为已经好了，放松了去做土改、工商业调整和节减开支。另一头是性急：报告说，有些人认为可以“提早消灭资本主义实行社会主义”，这种思想是错误的，不适合国家的情况。\n\n在今天的工程团队里，它的样子是：一轮成本压缩之后，云账单两个月降下来，成本看板全绿，团队宣布优化完成，把成本专项解散。造成账单高的三个结构性原因，没有标签的共享集群、一直开着的预发环境、没有人认领的实例，都还在，两个季度之后账单回升，没有人记得当初的结论只是开始好转。",
  worked: "毛泽东这个判断，在这篇报告之前五周已经说过。谢春涛主编、人民网中国共产党新闻网“中国共产党连载”刊载的“十一、恢复和发展国民经济”一章引了他一九五○年四月三十日在中央人民政府委员会第七次会议上的话：“我们国家的财政情况已开始好转，这是很好的现象。但整个财政经济情况的根本好转需要有三个条件，即：土地改革的完成、现有工商业的合理调整和国家军政费用的大量节减。”第三个条件在四月三十日写作“国家军政费用”，六月的报告改成“国家机构所需经费”。同一章给出了物价数据：以三月为一百，全国批发物价指数四月下降到七十五，五月下降到六十九，十二月为八十五点四。书中另列的六大城市三十二种主要商品价格指数在七月以后回升，书中归因于朝鲜战争爆发后部分进口物资的价格波动。\n\n先动起来的指标，立刻带来了新问题。同一章写道，一九五○年三、四月间，全国出现市场萧条、工厂倒闭、工人失业增多等新的经济困难，陈云的说法是政府挑的是“两筐鸡蛋”，不要碰破一头：既要稳定物价，又要维持生产。六月之后，国家全面展开私营工商业的调整；书中引的数字是，一九五二年与一九四九年比较，私营工业的总产值增加了三十六点九八亿元，增长百分之五十四点二，书中没有注明价格口径。\n\n三个条件各自的结局不同。第一个，选集为这篇报告加的注释写道，一九五○年冬起全国新解放的地区陆续展开大规模土地改革，到一九五二年冬，除一部分少数民族地区外基本完成，约三亿无地、少地的农民分得了约七亿亩土地。第三个条件，节减国家经费，遇到了战争：同一章写，抗美援朝带来庞大的军费开支，一九五一年十月中共中央政治局扩大会议提出“精兵简政，增产节约”的方针，一九五一年年底又开展了“三反”“五反”运动。这里没有查到中央在什么时间、用什么指标宣布国家财政经济状况已经根本好转，所以三年这个时间预算最后有没有兑现，不能在这里下结论。",
  experiment: "挑一项你们在过去两个季度里很快改善的指标：成本、尾部延迟、告警噪声、工单积压。把这次改善拆成两部分：一次性动作带来的（清理、调参），和结构变化带来的（所有权、默认配置、自动化）。再写出三个条件：它们都成立，这个改善才算根本的，也就是清理的人离开之后还保得住。每个条件写一个负责人、一个时间预算（几个季度）和一个能看出它落后的数。最后写一个这次快速改善可能带来的新问题，像一九五○年春天的市场萧条那样，并写明你会先看到它的哪个信号。现实的约束是上级想宣布成功，所以最后交一页纸，写明哪些是开始好转，哪些还没有。",

{
  id: "expand-only-where-all-three-conditions-hold",

  source: "《一九四八年的土地改革工作和整党工作》（一九四八年五月二十五日），第四卷",
  idea: "一项做法要铺到新的地方，先写出能不能进去的条件，条件全部具备才列入当年的范围，缺任何一个就不列入。这份指示写了三个：敌人的武装已经消灭、环境安定，不是“动荡不定的游击区域”；基本群众的绝大多数有了要求，“而不只是少数人有此要求”；党的干部在数量和质量上确能掌握，而不是“听任群众的自发活动”。条件不具备的地方不是什么都不做，而是改用较轻的政策。",
  why: "这是毛泽东为中共中央起草的党内指示，一九四八年五月二十五日发出。它把一九四八年秋冬七个月排成一条顺序：先调查乡村，按正确政策初步整党，工作团先团结当地支部里的积极分子；再组织贫农团和农会，划分阶级成分，分配土地，建立人民代表会议，发土地证确定地权，调整农业税负担；最后把工作的方向转到恢复和发展生产。指示要求干部了解这个由土改到生产的全过程，避免工作的片面性。\n\n范围怎样划，是这份指示最硬的一段。六月至八月三个月内先要划定土地改革的范围，必须同时具备三个条件，“如果某一地区，在上述三个条件中，有任何一个条件不具备，即不应当将该地区列入一九四八年进行土地改革的范围”。文中举例：华北、华东、东北、西北各解放区的接敌区域，和中原局所属江淮河汉区域的绝大部分地区，因为不具备第一个条件，不列入今年的计划，明年是否列入，还要看情况才能决定。对这类地区，办法是利用抗日时期的经验，实行减租减息和酌量调剂种子食粮的社会政策，以及合理负担的财政政策，“既不要分土地，也不要分浮财”，以便联合或中立一切可能联合或中立的社会力量，帮助人民解放军消灭国民党武装。\n\n同一份指示的第三条说，必须教育干部从不同地区、不同历史条件的具体情况出发，区别城市和农村，区别老区、半老区、接敌区和新区，“否则就要犯错误”。这个方法真正要求的是：先把进入的条件写成可以检查的几条；条件不具备的地方用较轻的办法保持联系，并写明何时再评估。",
  failureMode: "这份指示针对的是把一种做法一律铺到所有地方：不分老区和新区，不分环境是否安定，不问群众是否有要求，也不问干部能不能掌握。\n\n在今天的工程团队里，它的样子是：平台团队宣布本季度把两百个服务全部迁到新的发布系统。其中十几个服务仍然依赖一个还没有退役的旧队列，没有稳定的环境可以迁；不少服务的负责团队没有碰到过这个系统要解决的问题，也没有人要求；平台团队自己的值班人手只够带二十个。迁移开了头，在没有条件的服务上停在一半，新旧两套并存，比原来的任何一套都难维护。",
  worked: "这三个条件有一个具体的案例在前。冷溶（中共中央文献研究室）在《中共党史研究》一九八九年第六期的文章里写道，一九四七年十月十日，邓小平代中原局起草《中原局关于进入大别山后地方工作的指示》，要求在有初步基础的地区立即放手分浮财、分田地，中央认为完全正确。之后大别山出现“一手拿枪，一手分田，打到哪里，分到哪里”这类口号；文章列了几种情形：分田地只有少数积极分子敢要，多数基本群众不敢要；有的在干部劝说下假要，白天分了，夜里又送还，还向地主赔礼道歉；有的一度分到土地，在敌情严重和地富威胁下，又秘密还给地富。邓小平后来总结，在军事上还没有取得面的控制、地富武装还没有被肃清、大多数农民还没有提出要求、本地正派的区村干部还没有大批涌现、外来干部又不熟悉情况的时候就实行土改，“不仅是主观主义的，而且是冒险主义的”（《邓小平文选》，转引自冷溶）。这几句几乎就是三个条件的反面。\n\n文章记下的转折有具体日期。一九四八年一月十四日，毛泽东致电邓小平，就新区土改情况提了六个问题；邓小平一月十五日和二十二日回电，说大别山一千二百万人口，可分巩固区和游击区，巩固区可以土改，游击区不能急于平分土地。五月二十四日，毛泽东致电邓小平，提出新区暂时实行减租减息；五月二十五日发出这份指示；六月六日，邓小平起草的中原局指示（党内称“六六指示”）要求全区停止分土地、停止打土豪分浮财，并说暂时改为减租减息，是因为土改的条件尚不成熟。毛泽东对这份近两万字的指示十分重视，称有了它，中央不需要再发这类文件。\n\n条件什么时候满足，后来的文件给了两个时间点。冷溶转述毛泽东的话：到一九四九年下半年，全国战局有了重大发展，新区土改才有步骤地开展起来，那时中原区已经是有较好工作基础的巩固的解放区。一九五〇年六月六日的报告里，毛泽东说新解放区约有三亿一千万人口，还有四十余万分散在偏僻地方的土匪待剿灭，土地问题没有解决，“一句话，还没有获得有计划地进行经济建设的条件”；选集为那篇报告加的注释说，全国新解放的地区从一九五○年冬开始陆续展开大规模土地改革，到一九五二年冬基本完成。两个说法对应的地区和规模不同，这里没有查到一张统一的时间表。冷溶的文章写的是中原区，这里没有查到华北、东北的接敌区在一九四八年秋冬按这三个条件实际划出了多少县。",

  source: "《一九四六年解放区工作的方针》（一九四五年十二月十五日），第四卷",
  idea: "一个地方的领导岗位上外来的人很多时，根要靠本地的人扎下去。指示的要求是：领导机关告诫外来干部，“以充分的热情和善意，爱护本地干部”，并把“识别、培养和提拔本地干部”当作自己的重要任务，理由是“我党在解放区才能生根”；“外来人轻视本地人的作风，应当受到批评”。",
  why: "这是毛泽东为中共中央起草的对党内的指示，一九四五年十二月十五日发出，抗战胜利后四个月，交代一九四六年尤其是上半年的十项工作：粉碎国民党新的进攻，开展高树勋运动，练兵，减租，生产，财政，拥政爱民，救济，爱护本地干部，一切作持久打算。爱护本地干部排在第九项，前面几项都是急的事，这一项讲的是根。\n\n第九项的出发点是一个事实：现在每个解放区都有大批外来干部做各级领导工作，东北各省尤其显著。对这些外来干部，各地领导机关要谆谆告诫，对本地干部有热情和善意，把识别、培养和提拔本地干部当作自己的重要任务，轻视本地人的作风要受到批评。同一份文件的最后一项说，面前还有许多困难，例如新区域、新部队还不巩固，所以一切工作布置要作持久打算。\n\n这个方法真正要求的是三件事：把培养本地人写成外来领导者自己的任务，不留给个人的好意；要求落到识别、培养、提拔三个动作上，而不止是态度；轻视的作风要有人在场时批评，不等到人走了以后。",
  failureMode: "指示针对的是外来人轻视本地人。外来的人带着标准、经验和上级的信任，本地的人知道地方的情况，两者的差距最容易被读成资格的差距。\n\n在今天的工程团队里，它的样子是：平台团队派了几个资深工程师，去带一个刚并入的业务线的技术栈迁移。所有设计评审都按平台团队的标准开，当地工程师因为不熟悉标准，只做具体的实现；十八个月里没有一个当地工程师被指定为设计负责人。到第十八个月，平台工程师轮换走了，没有人能独立改动这套系统，知道数据来历的几位当地工程师已经在这期间离职。",
