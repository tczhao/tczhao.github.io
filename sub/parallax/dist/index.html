<title>Parallax - what you sent and what they received</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* ==========================================================================
   Practicum — a daily logbook for management practice

   Identity: an engineering lab notebook. Pale technical paper stock, a 28px
   graph field locked to the prose baseline, drafting blue for structure and
   oxide red-pen for anything that asks you to act.

   Theming is token-level. Components read tokens and never reach inside a
   media query, so the viewer's explicit toggle can win in both directions.
   ========================================================================== */

/* --- Light tokens (the default ground) ----------------------------------- */
:root {
  --paper:        #F5F6F3;
  --paper-raised: #FFFFFF;
  --paper-sunk:   #EBEEE8;

  --grid:         rgba(20, 26, 34, 0.055);
  --grid-major:   rgba(20, 26, 34, 0.10);
  --rule:         #DBDFD7;
  --rule-strong:  #B6BEB4;

  --ink:          #141A22;
  --ink-muted:    #545F6A;
  --ink-faint:    #8B949D;

  --accent:       #1D4E80;
  --accent-ink:   #163D66;
  --accent-soft:  rgba(29, 78, 128, 0.09);
  --accent-line:  rgba(29, 78, 128, 0.30);

  --action:       #9E3A26;
  --action-soft:  rgba(158, 58, 38, 0.075);
  --action-line:  rgba(158, 58, 38, 0.32);

  --solid:        #2F6B4F;
  --shaky:        #8A6A1F;

  --shadow-card:  0 1px 0 rgba(20, 26, 34, 0.05), 0 8px 22px -14px rgba(20, 26, 34, 0.30);
  --shadow-lift:  0 1px 0 rgba(20, 26, 34, 0.06), 0 16px 34px -18px rgba(20, 26, 34, 0.38);

  /* Type roles. No CDN fonts: the Artifact CSP blocks font hosts, and a
     linked webfont would fail silently, so every role resolves locally. */
  --face-display: Superclarendon, Rockwell, "Bookman Old Style", "Roboto Slab", Georgia, serif;
  --face-text:    Charter, "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --face-ui:      "Helvetica Neue", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  --face-mono:    "SF Mono", SFMono-Regular, Menlo, "Cascadia Mono", Consolas, monospace;

  /* 28px baseline. The graph field is a 28px minor / 140px major multiple of
     it, so body lines land on grid lines rather than near them. */
  --lead:  28px;
  --u:     7px;
  --rail:  17rem;
  --measure: 66ch;
}

/* --- Dark tokens: a negative blueprint under lamplight -------------------
   Retuned rather than inverted. The blue lifts to hold contrast on a dark
   ground; the red-pen warms so it still reads as ink, not as an error state. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper:        #101418;
    --paper-raised: #171D24;
    --paper-sunk:   #0B0E12;

    --grid:         rgba(158, 190, 214, 0.055);
    --grid-major:   rgba(158, 190, 214, 0.085);
    --rule:         #232C34;
    --rule-strong:  #37444E;

    --ink:          #DCE3E9;
    --ink-muted:    #96A2AD;
    --ink-faint:    #68737D;

    --accent:       #6EA8D4;
    --accent-ink:   #9AC4E4;
    --accent-soft:  rgba(110, 168, 212, 0.13);
    --accent-line:  rgba(110, 168, 212, 0.34);

    --action:       #D9755C;
    --action-soft:  rgba(217, 117, 92, 0.12);
    --action-line:  rgba(217, 117, 92, 0.36);

    --solid:        #63B08A;
    --shaky:        #C9A651;

    --shadow-card:  0 1px 0 rgba(0, 0, 0, 0.4), 0 8px 22px -14px rgba(0, 0, 0, 0.7);
    --shadow-lift:  0 1px 0 rgba(0, 0, 0, 0.45), 0 16px 34px -18px rgba(0, 0, 0, 0.8);
  }
}

:root[data-theme="dark"] {
  --paper:        #101418;
  --paper-raised: #171D24;
  --paper-sunk:   #0B0E12;

  --grid:         rgba(158, 190, 214, 0.055);
  --grid-major:   rgba(158, 190, 214, 0.085);
  --rule:         #232C34;
  --rule-strong:  #37444E;

  --ink:          #DCE3E9;
  --ink-muted:    #96A2AD;
  --ink-faint:    #68737D;

  --accent:       #6EA8D4;
  --accent-ink:   #9AC4E4;
  --accent-soft:  rgba(110, 168, 212, 0.13);
  --accent-line:  rgba(110, 168, 212, 0.34);

  --action:       #D9755C;
  --action-soft:  rgba(217, 117, 92, 0.12);
  --action-line:  rgba(217, 117, 92, 0.36);

  --solid:        #63B08A;
  --shaky:        #C9A651;

  --shadow-card:  0 1px 0 rgba(0, 0, 0, 0.4), 0 8px 22px -14px rgba(0, 0, 0, 0.7);
  --shadow-lift:  0 1px 0 rgba(0, 0, 0, 0.45), 0 16px 34px -18px rgba(0, 0, 0, 0.8);
}

/* --- Ground -------------------------------------------------------------- */
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--face-text);
  font-size: 17px;
  line-height: var(--lead);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

h1, h2, h3, h4, p, ul, ol, dl, dd, dt, figure, blockquote {
  margin: 0;
  padding: 0;
}
ul, ol { list-style: none; }
button { font: inherit; color: inherit; }

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
  border-radius: 1px;
}

.skip {
  position: absolute;
  left: -9999px;
  top: 0;
  z-index: 50;
  padding: var(--u) calc(var(--u) * 2);
  background: var(--accent);
  color: #fff;
  font-family: var(--face-ui);
  font-size: 0.8125rem;
  text-decoration: none;
}
.skip:focus { left: var(--u); top: var(--u); }

/* --- Shared type roles --------------------------------------------------- */
.eyebrow {
  font-family: var(--face-ui);
  font-size: 0.6875rem;
  font-weight: 600;
  letter-spacing: 0.13em;
  text-transform: uppercase;
  color: var(--ink-faint);
}

.num { font-family: var(--face-mono); font-variant-numeric: tabular-nums; }

/* ==========================================================================
   Layout: a bound page. Spine rail carries identity and position; the field
   is the paper itself.
   ========================================================================== */
.logbook {
  display: grid;
  grid-template-columns: var(--rail) minmax(0, 1fr);
  min-height: 100vh;
}

/* --- Spine --------------------------------------------------------------- */
.spine {
  position: sticky;
  top: 0;
  align-self: start;
  height: 100vh;
  display: flex;
  flex-direction: column;
  gap: calc(var(--u) * 4);
  padding: calc(var(--u) * 5) calc(var(--u) * 4);
  background: var(--paper-sunk);
  border-right: 1px solid var(--rule);
  overflow-y: auto;
}

.spine__head { display: flex; flex-direction: column; gap: calc(var(--u) * 0.5); }

.wordmark {
  font-family: var(--face-display);
  font-size: 1.75rem;
  font-weight: 400;
  letter-spacing: -0.015em;
  line-height: 1.1;
}

.spine__sub {
  font-family: var(--face-ui);
  font-size: 0.75rem;
  line-height: 1.45;
  color: var(--ink-muted);
  max-width: 15ch;
}

/* The entry stamp: position in the sequence, set like a plate number. */
.stamp {
  display: flex;
  flex-direction: column;
  padding-top: calc(var(--u) * 2);
  border-top: 2px solid var(--ink);
}
.stamp__label {
  font-family: var(--face-ui);
  font-size: 0.625rem;
  font-weight: 600;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--ink-faint);
}
.stamp__num {
  font-family: var(--face-mono);
  font-variant-numeric: tabular-nums;
  font-size: 2.75rem;
  line-height: 1.05;
  letter-spacing: -0.03em;
  color: var(--accent);
}
.stamp__date {
  font-family: var(--face-mono);
  font-size: 0.6875rem;
  letter-spacing: 0.04em;
  color: var(--ink-muted);
  text-transform: uppercase;
}

/* --- Nav ----------------------------------------------------------------- */
.nav { display: flex; flex-direction: column; }

.nav__item {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--u);
  width: 100%;
  padding: calc(var(--u) * 1.4) 0;
  background: none;
  border: 0;
  border-bottom: 1px solid var(--rule);
  font-family: var(--face-ui);
  font-size: 0.875rem;
  text-align: left;
  color: var(--ink-muted);
  cursor: pointer;
  transition: color 0.12s ease;
}
.nav__item:first-child { border-top: 1px solid var(--rule); }
.nav__item:hover { color: var(--ink); }
.nav__item[aria-current="page"] {
  color: var(--ink);
  font-weight: 600;
  box-shadow: inset 2px 0 0 var(--accent);
  padding-left: var(--u);
}

.nav__badge {
  font-family: var(--face-mono);
  font-variant-numeric: tabular-nums;
  font-size: 0.6875rem;
  padding: 1px 6px;
  border-radius: 2px;
  background: var(--action);
  color: #fff;
}

/* --- Gauge: the small instrument panel ---------------------------------- */
.gauge {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: var(--u);
  margin-top: auto;
}
.gauge__cell { display: flex; flex-direction: column; gap: 2px; }
.gauge dt {
  font-family: var(--face-ui);
  font-size: 0.5625rem;
  font-weight: 600;
  letter-spacing: 0.11em;
  text-transform: uppercase;
  color: var(--ink-faint);
}
.gauge dd {
  font-family: var(--face-mono);
  font-variant-numeric: tabular-nums;
  font-size: 1.125rem;
  color: var(--ink);
}

.spine__foot { padding-top: calc(var(--u) * 1.5); border-top: 1px solid var(--rule); }

.ghost {
  padding: calc(var(--u) * 0.7) var(--u);
  background: none;
  border: 1px solid var(--rule-strong);
  border-radius: 2px;
  font-family: var(--face-ui);
  font-size: 0.75rem;
  color: var(--ink-muted);
  cursor: pointer;
  transition: border-color 0.12s ease, color 0.12s ease;
}
.ghost:hover { border-color: var(--ink-muted); color: var(--ink); }

/* --- Field: the graph paper ---------------------------------------------- */
.field {
  padding: calc(var(--u) * 8) calc(var(--u) * 7) calc(var(--u) * 14);
  background-color: var(--paper);
  background-image:
    linear-gradient(to right,  var(--grid-major) 0 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid-major) 0 1px, transparent 1px),
    linear-gradient(to right,  var(--grid) 0 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid) 0 1px, transparent 1px);
  background-size: 140px 140px, 140px 140px, 28px 28px, 28px 28px;
  background-position: 0 0;
}
.field:focus { outline: none; }

.view { display: flex; flex-direction: column; gap: calc(var(--u) * 5); max-width: 78ch; }

/* ==========================================================================
   Entry: the daily lesson
   ========================================================================== */
.entry { display: flex; flex-direction: column; gap: calc(var(--u) * 4); }

.entry__head { display: flex; flex-direction: column; gap: calc(var(--u) * 2); }

.tags { display: flex; flex-wrap: wrap; gap: var(--u); align-items: center; }

.tag {
  font-family: var(--face-ui);
  font-size: 0.625rem;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 3px 7px;
  border-radius: 2px;
  background: var(--accent-soft);
  color: var(--accent-ink);
}
.tag--level {
  background: none;
  border: 1px solid var(--rule-strong);
  color: var(--ink-muted);
}
.tag--time {
  background: none;
  color: var(--ink-faint);
  font-family: var(--face-mono);
  letter-spacing: 0.04em;
  text-transform: none;
  padding-left: 0;
}

.entry__title {
  font-family: var(--face-display);
  font-size: clamp(2.125rem, 4.6vw, 3.125rem);
  font-weight: 400;
  line-height: 1.07;
  letter-spacing: -0.022em;
  text-wrap: balance;
  max-width: 26ch;
}

/* The one orchestrated moment: the rule under the title draws itself. */
.entry__rule {
  height: 2px;
  background: var(--ink);
  transform-origin: left;
  animation: draw 0.55s cubic-bezier(0.22, 0.61, 0.36, 1) both;
}
@keyframes draw { from { transform: scaleX(0); } to { transform: scaleX(1); } }

.entry__source {
  font-family: var(--face-ui);
  font-size: 0.8125rem;
  color: var(--ink-muted);
}
.entry__source em { font-style: italic; }

/* --- Prose blocks -------------------------------------------------------- */
.block { display: flex; flex-direction: column; gap: calc(var(--u) * 1.5); }

.block__label {
  font-family: var(--face-ui);
  font-size: 0.6875rem;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-faint);
}

.block__body { max-width: var(--measure); display: flex; flex-direction: column; gap: var(--lead); }
.block__body p { line-height: var(--lead); }

.lead { font-size: 1.1875rem; line-height: 32px; }
.lead strong { font-weight: 600; }

/* Failure mode gets a quiet sunk panel — it is a warning, not an action. */
.block--failure .block__body {
  padding: calc(var(--u) * 2.5) calc(var(--u) * 3);
  background: var(--paper-sunk);
  border-left: 2px solid var(--rule-strong);
}

/* --- The experiment: a stamped action item in red pen -------------------- */
.experiment {
  display: flex;
  flex-direction: column;
  gap: calc(var(--u) * 1.5);
  padding: calc(var(--u) * 3.5);
  background: var(--action-soft);
  border: 1px solid var(--action-line);
  border-left: 3px solid var(--action);
  border-radius: 2px;
}
.experiment__label {
  font-family: var(--face-ui);
  font-size: 0.6875rem;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--action);
}
.experiment__body { max-width: var(--measure); }

/* --- Reflection: a ruled writing surface --------------------------------- */
.reflect { display: flex; flex-direction: column; gap: calc(var(--u) * 1.5); }
.reflect__prompt {
  max-width: var(--measure);
  font-style: italic;
  color: var(--ink-muted);
}

.reflect__field {
  display: block;
  width: 100%;
  max-width: var(--measure);
  min-height: calc(var(--lead) * 4);
  padding: 0 calc(var(--u) * 1.5);
  border: 0;
  border-radius: 0;
  background-color: var(--paper-raised);
  background-image: linear-gradient(to bottom, transparent calc(var(--lead) - 1px), var(--rule) calc(var(--lead) - 1px));
  background-size: 100% var(--lead);
  box-shadow: inset 0 0 0 1px var(--rule);
  color: var(--ink);
  font-family: var(--face-text);
  font-size: 17px;
  line-height: var(--lead);
  resize: vertical;
}
.reflect__field:focus { box-shadow: inset 0 0 0 1px var(--accent-line); outline: none; }
.reflect__field::placeholder { color: var(--ink-faint); font-style: italic; }

.reflect__state {
  font-family: var(--face-mono);
  font-size: 0.6875rem;
  color: var(--ink-faint);
  min-height: var(--lead);
}

/* --- Actions row --------------------------------------------------------- */
.actions {
  display: flex;
  flex-wrap: wrap;
  gap: calc(var(--u) * 1.5);
  align-items: center;
  padding-top: calc(var(--u) * 2);
  border-top: 1px solid var(--rule);
}

.btn {
  padding: calc(var(--u) * 1.3) calc(var(--u) * 2.5);
  background: var(--ink);
  border: 1px solid var(--ink);
  border-radius: 2px;
  font-family: var(--face-ui);
  font-size: 0.8125rem;
  font-weight: 600;
  color: var(--paper);
  cursor: pointer;
  transition: opacity 0.12s ease;
}
.btn:hover { opacity: 0.86; }
.btn[disabled] { opacity: 0.4; cursor: default; }

.btn--quiet {
  background: none;
  border-color: var(--rule-strong);
  color: var(--ink-muted);
  font-weight: 500;
}
.btn--quiet:hover { border-color: var(--ink-muted); color: var(--ink); opacity: 1; }

.btn--done {
  background: var(--accent-soft);
  border-color: var(--accent-line);
  color: var(--accent-ink);
}

/* --- The reader ----------------------------------------------------------
   Sits under the source line, in the header rather than in the actions row at
   the foot: it is an offer about how to take the entry in, so it has to be
   there before you have read it. */
.reader {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--u);
  margin-top: var(--u);
}

.reader__btn {
  padding: calc(var(--u) * 0.8) calc(var(--u) * 1.6);
  font-size: 0.75rem;
}

.reader__note {
  font-family: var(--face-ui);
  font-size: 0.75rem;
  color: var(--ink-faint);
}

/* The tint is bled outwards with a spread shadow rather than padding, so the
   block being spoken lights up without the prose reflowing under it. */
[data-reading] {
  background: var(--accent-soft);
  box-shadow: 0 0 0 6px var(--accent-soft);
  border-radius: 1px;
  transition: background 0.2s ease;
}

/* --- Library pager -------------------------------------------------------
   Two equal columns so the next entry keeps the right-hand side whether or not
   there is a previous one to balance it. auto-fit rather than a breakpoint:
   the titles are clipped to one line, and below roughly 14rem a column shows
   too few characters of a title to be worth reading, so it stacks instead. */
.pager {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr));
  gap: calc(var(--u) * 1.5);
  margin-top: calc(var(--u) * 4);
}

.pager__btn {
  display: flex;
  flex-direction: column;
  gap: calc(var(--u) * 0.5);
  min-width: 0;
  padding: calc(var(--u) * 1.5) calc(var(--u) * 2);
  background: none;
  border: 1px solid var(--rule-strong);
  border-radius: 2px;
  cursor: pointer;
  text-align: left;
  transition: border-color 0.12s ease, background 0.12s ease;
}
.pager__btn:hover { border-color: var(--ink-muted); background: var(--accent-soft); }
.pager__btn--next { align-items: flex-end; text-align: right; }

.pager__dir {
  font-family: var(--face-ui);
  font-size: 0.625rem;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-faint);
}

/* One line, clipped. A long title wrapping to three lines turns a navigation
   control into the largest thing on the screen after the entry itself. */
.pager__title {
  max-width: 100%;
  overflow: hidden;
  font-family: var(--face-text);
  font-size: 0.9375rem;
  line-height: 1.3;
  color: var(--ink);
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* Holds the column so a missing neighbour does not slide the other button
   across, and says which end you reached rather than leaving a gap. */
.pager__end {
  display: flex;
  align-items: center;
  padding: calc(var(--u) * 1.5) calc(var(--u) * 2);
  font-family: var(--face-ui);
  font-size: 0.625rem;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-faint);
}
.pager__end:last-child { justify-content: flex-end; }

/* --- Deep dive ----------------------------------------------------------- */
.deepdive {
  display: flex;
  flex-direction: column;
  gap: calc(var(--u) * 1.5);
  padding: calc(var(--u) * 3);
  border: 1px dashed var(--accent-line);
  border-radius: 2px;
}
.deepdive__note {
  max-width: var(--measure);
  font-size: 0.9375rem;
  color: var(--ink-muted);
}
.deepdive__text {
  max-width: var(--measure);
  max-height: 40vh;
  overflow: auto;
  padding: calc(var(--u) * 2);
  background: var(--paper-sunk);
  border: 1px solid var(--rule);
  font-family: var(--face-mono);
  font-size: 0.8125rem;
  line-height: 1.6;
  white-space: pre-wrap;
  overflow-wrap: break-word;
}

/* ==========================================================================
   Review: index cards
   ========================================================================== */
.card {
  display: flex;
  flex-direction: column;
  gap: calc(var(--u) * 2);
  max-width: 62ch;
  padding: calc(var(--u) * 4);
  background: var(--paper-raised);
  border: 1px solid var(--rule);
  border-top: 3px solid var(--accent);
  border-radius: 2px;
  box-shadow: var(--shadow-card);
}

.card__meta {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: var(--u);
  font-family: var(--face-mono);
  font-size: 0.6875rem;
  color: var(--ink-faint);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.card__q {
  font-family: var(--face-display);
  font-size: 1.4375rem;
  font-weight: 400;
  line-height: 1.28;
  letter-spacing: -0.01em;
  text-wrap: balance;
}

.card__a {
  padding-top: calc(var(--u) * 2);
  border-top: 1px solid var(--rule);
  animation: settle 0.28s ease both;
}
@keyframes settle { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

.grades { display: flex; flex-wrap: wrap; gap: var(--u); }
.grade {
  flex: 1 1 auto;
  padding: calc(var(--u) * 1.3) calc(var(--u) * 2);
  background: none;
  border: 1px solid var(--rule-strong);
  border-radius: 2px;
  font-family: var(--face-ui);
  font-size: 0.8125rem;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.12s ease, border-color 0.12s ease;
}
.grade__hint {
  display: block;
  font-weight: 400;
  font-size: 0.6875rem;
  color: var(--ink-faint);
}
.grade--miss:hover  { border-color: var(--action); background: var(--action-soft); }
.grade--close:hover { border-color: var(--shaky); background: color-mix(in srgb, var(--shaky) 9%, transparent); }
.grade--got:hover   { border-color: var(--solid); background: color-mix(in srgb, var(--solid) 9%, transparent); }

/* ==========================================================================
   Library
   ========================================================================== */
.filters { display: flex; flex-wrap: wrap; gap: var(--u); align-items: center; }

.search {
  flex: 1 1 18ch;
  min-width: 0;
  padding: calc(var(--u) * 1.2) calc(var(--u) * 1.5);
  background: var(--paper-raised);
  border: 1px solid var(--rule);
  border-radius: 2px;
  color: var(--ink);
  font-family: var(--face-ui);
  font-size: 0.875rem;
}
.search:focus { border-color: var(--accent-line); outline: none; }

.chip {
  padding: calc(var(--u) * 0.8) calc(var(--u) * 1.4);
  background: none;
  border: 1px solid var(--rule-strong);
  border-radius: 2px;
  font-family: var(--face-ui);
  font-size: 0.75rem;
  color: var(--ink-muted);
  cursor: pointer;
}
.chip[aria-pressed="true"] {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--paper);
}

.shelf { display: flex; flex-direction: column; }

.shelf__row {
  display: grid;
  grid-template-columns: 4.5ch minmax(0, 1fr) auto;
  gap: calc(var(--u) * 2);
  align-items: baseline;
  width: 100%;
  padding: calc(var(--u) * 1.7) var(--u);
  background: none;
  border: 0;
  border-bottom: 1px solid var(--rule);
  text-align: left;
  cursor: pointer;
  transition: background 0.1s ease;
}
.shelf__row:hover { background: var(--accent-soft); }
.shelf__num {
  font-family: var(--face-mono);
  font-variant-numeric: tabular-nums;
  font-size: 0.75rem;
  color: var(--ink-faint);
}
.shelf__title { font-family: var(--face-text); font-size: 1rem; line-height: 1.4; }
.shelf__track {
  font-family: var(--face-ui);
  font-size: 0.625rem;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-faint);
}

.pip {
  display: inline-block;
  width: 6px;
  height: 6px;
  margin-right: var(--u);
  border-radius: 50%;
  background: var(--rule-strong);
  vertical-align: 1px;
}
.pip--logged { background: var(--accent); }
.pip--solid  { background: var(--solid); }
.pip--shaky  { background: var(--shaky); }

/* ==========================================================================
   Journal
   ========================================================================== */
.note {
  display: flex;
  flex-direction: column;
  gap: var(--u);
  max-width: var(--measure);
  padding-bottom: calc(var(--u) * 3);
  border-bottom: 1px solid var(--rule);
}
.note__meta {
  display: flex;
  flex-wrap: wrap;
  gap: calc(var(--u) * 1.5);
  align-items: baseline;
  font-family: var(--face-mono);
  font-size: 0.6875rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--ink-faint);
}
.note__title { font-family: var(--face-display); font-size: 1.1875rem; font-weight: 400; line-height: 1.3; }
.note__body { white-space: pre-wrap; }

/* ==========================================================================
   Progress
   ========================================================================== */
.readout {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(11rem, 1fr));
  gap: 1px;
  background: var(--rule);
  border: 1px solid var(--rule);
  border-radius: 2px;
}
.readout__cell {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: calc(var(--u) * 2.5);
  background: var(--paper-raised);
}
.readout__label {
  font-family: var(--face-ui);
  font-size: 0.625rem;
  font-weight: 600;
  letter-spacing: 0.11em;
  text-transform: uppercase;
  color: var(--ink-faint);
}
.readout__value {
  font-family: var(--face-mono);
  font-variant-numeric: tabular-nums;
  font-size: 1.875rem;
  line-height: 1.15;
  letter-spacing: -0.02em;
}
.readout__unit { font-family: var(--face-ui); font-size: 0.75rem; color: var(--ink-muted); }

.coverage { display: flex; flex-direction: column; gap: calc(var(--u) * 2); }
.cov { display: grid; grid-template-columns: minmax(9rem, 14rem) minmax(0, 1fr) 5ch; gap: calc(var(--u) * 2); align-items: center; }
.cov__name { font-family: var(--face-ui); font-size: 0.8125rem; }
.cov__bar { height: 8px; background: var(--paper-sunk); box-shadow: inset 0 0 0 1px var(--rule); }
.cov__fill { height: 100%; background: var(--accent); }
.cov__n {
  font-family: var(--face-mono);
  font-variant-numeric: tabular-nums;
  font-size: 0.75rem;
  color: var(--ink-muted);
  text-align: right;
}

/* ==========================================================================
   Shared furniture
   ========================================================================== */
.section__head {
  display: flex;
  flex-direction: column;
  gap: var(--u);
  padding-bottom: calc(var(--u) * 2);
  border-bottom: 2px solid var(--ink);
}
.section__title {
  font-family: var(--face-display);
  font-size: 1.875rem;
  font-weight: 400;
  line-height: 1.15;
  letter-spacing: -0.018em;
}
.section__note { max-width: var(--measure); font-size: 0.9375rem; color: var(--ink-muted); }

.empty {
  max-width: var(--measure);
  padding: calc(var(--u) * 5) 0;
  color: var(--ink-muted);
  font-style: italic;
}

.toast {
  position: fixed;
  bottom: calc(var(--u) * 3);
  left: 50%;
  transform: translate(-50%, calc(100% + var(--u) * 6));
  z-index: 40;
  padding: calc(var(--u) * 1.4) calc(var(--u) * 3);
  background: var(--ink);
  color: var(--paper);
  border-radius: 2px;
  font-family: var(--face-ui);
  font-size: 0.8125rem;
  box-shadow: var(--shadow-lift);
  transition: transform 0.24s cubic-bezier(0.22, 0.61, 0.36, 1);
}
.toast[data-open="true"] { transform: translate(-50%, 0); }

/* ==========================================================================
   Narrow: the spine unbinds into a top bar
   ========================================================================== */
@media (max-width: 60rem) {
  .logbook { grid-template-columns: minmax(0, 1fr); }

  .spine {
    position: static;
    height: auto;
    gap: calc(var(--u) * 3);
    padding: calc(var(--u) * 3.5) calc(var(--u) * 3);
    border-right: 0;
    border-bottom: 1px solid var(--rule);
    overflow: visible;
  }
  .spine__sub { display: none; }
  .spine__head { flex-direction: row; align-items: baseline; gap: calc(var(--u) * 2); }

  .stamp { flex-direction: row; align-items: baseline; gap: calc(var(--u) * 1.5); padding-top: var(--u); }
  .stamp__num { font-size: 1.75rem; }

  .nav { flex-direction: row; overflow-x: auto; gap: calc(var(--u) * 2.5); }
  .nav__item { width: auto; flex: 0 0 auto; border: 0; padding: var(--u) 0; }
  .nav__item:first-child { border-top: 0; }
  .nav__item[aria-current="page"] {
    box-shadow: inset 0 -2px 0 var(--accent);
    padding-left: 0;
  }

  .gauge { margin-top: 0; grid-template-columns: repeat(3, auto); gap: calc(var(--u) * 3); }
  .spine__foot { border-top: 0; padding-top: 0; }

  .field { padding: calc(var(--u) * 5) calc(var(--u) * 3) calc(var(--u) * 12); }
  .cov { grid-template-columns: minmax(0, 1fr) 5ch; }
  .cov__bar { grid-column: 1 / -1; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

/* ==========================================================================
   Daily — components the base sheet does not carry

   Everything here belongs to a mechanic that only some sites turn on: the
   commitment gate, expiry, the attempts log, the forecast book. Tokens only,
   no literal colours, so a site theme retunes these along with everything
   else.
   ========================================================================== */

/* --- The gate ------------------------------------------------------------
   Deliberately heavy. It is the one thing on the page that stops you, and a
   stop that looks like a form field gets skipped. */
.gate {
  max-width: var(--measure);
  margin: calc(var(--u) * 4) 0;
  padding: calc(var(--u) * 3);
  background: var(--action-soft);
  border: 1px solid var(--action-line);
  border-left-width: 3px;
  border-radius: 2px;
}
.gate--done {
  background: var(--paper-sunk);
  border-color: var(--rule);
  border-left-color: var(--rule-strong);
}
.gate__intro {
  margin-bottom: calc(var(--u) * 2);
  padding-bottom: calc(var(--u) * 2);
  border-bottom: 1px solid var(--action-line);
}
.gate__intro p + p { margin-top: var(--lead); }
.gate__prompt {
  font-family: var(--face-display);
  font-size: 1.25rem;
  line-height: 1.35;
  margin-bottom: calc(var(--u) * 2);
}
.gate__field { min-height: calc(var(--lead) * 4); }
.gate__note {
  margin-top: var(--u);
  font-family: var(--face-ui);
  font-size: 0.8125rem;
  color: var(--ink-muted);
}
.gate__stamp {
  font-family: var(--face-mono);
  font-size: 0.6875rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-faint);
  margin-bottom: var(--u);
}
.gate__answer { white-space: pre-wrap; color: var(--ink-muted); font-style: italic; }
.gate__answer p + p { margin-top: var(--lead); }

.gate__fallback { margin-bottom: calc(var(--u) * 2); }
.gate__fallback summary {
  cursor: pointer;
  font-family: var(--face-ui);
  font-size: 0.8125rem;
  color: var(--ink-muted);
}
.gate__fallbacktext {
  margin: var(--u) 0;
  padding: calc(var(--u) * 2);
  background: var(--paper-raised);
  border: 1px dashed var(--rule-strong);
  font-size: 0.9375rem;
}

.gate__curtain {
  max-width: var(--measure);
  padding: calc(var(--u) * 4) 0;
  font-family: var(--face-ui);
  font-size: 0.9375rem;
  color: var(--ink-faint);
  border-top: 1px dashed var(--rule-strong);
}

/* --- Worked example ------------------------------------------------------ */
/* Sits directly under the failure mode, and has to read as the answer to it
   rather than as one more block of commentary. The accent rule and the raised
   stock do that; the first paragraph is the repair itself, so it gets the
   weight and the rest of the block stays quiet. */
.worked {
  max-width: var(--measure);
  margin: calc(var(--u) * 4) 0;
  padding: calc(var(--u) * 3);
  background: var(--paper-raised);
  border: 1px solid var(--rule);
  border-left: 3px solid var(--accent);
  border-radius: 2px;
}
.worked__body {
  margin-top: var(--u);
}
.worked__body p + p {
  margin-top: var(--lead);
}
/* The repair. Set in the reading face at full size so it can be compared
   against the specimen without the eye having to change gear. */
.worked__body p:first-child {
  font-size: 1.0625rem;
  line-height: 1.6;
  color: var(--ink);
}
/* What it changed, and what it cost. */
.worked__body p:last-child:not(:first-child) {
  font-family: var(--face-ui);
  font-size: 0.875rem;
  line-height: 1.55;
  color: var(--ink-muted);
  padding-top: calc(var(--u) * 1.5);
  border-top: 1px solid var(--rule);
}

/* --- Arithmetic gate ----------------------------------------------------- */
/* Same visual weight as the text gate, because it does the same job one notch
   harder. The gap is the only part that earns colour: over and under are
   different mistakes and the reader should be able to see which one they keep
   making without reading the number. */
.compute {
  max-width: var(--measure);
  margin: calc(var(--u) * 4) 0;
  padding: calc(var(--u) * 3);
  background: var(--action-soft);
  border: 1px solid var(--action-line);
  border-left-width: 3px;
  border-radius: 2px;
}
.compute--done {
  background: var(--paper-sunk);
  border-color: var(--rule);
  border-left-color: var(--rule-strong);
}
.compute__q {
  margin-top: var(--u);
  font-size: 1.0625rem;
  line-height: 1.5;
}
.compute__note {
  margin-top: var(--u);
  font-family: var(--face-ui);
  font-size: 0.8125rem;
  color: var(--ink-faint);
}
.compute__fields {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  gap: var(--u) calc(var(--u) * 2);
  margin: calc(var(--u) * 2) 0;
}
.compute__lab {
  font-family: var(--face-ui);
  font-size: 0.875rem;
  color: var(--ink-muted);
}
.compute__unit { color: var(--ink-faint); }
.compute__row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: calc(var(--u) * 2);
  margin: calc(var(--u) * 2) 0;
}
.compute__input {
  font-family: var(--face-mono);
  font-size: 1rem;
  font-variant-numeric: tabular-nums;
  padding: calc(var(--u) * 1.25) calc(var(--u) * 1.5);
  background: var(--paper-raised);
  color: var(--ink);
  border: 1px solid var(--rule-strong);
  border-radius: 2px;
  min-width: 10ch;
}
.compute__input:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}
.compute__result {
  margin-top: calc(var(--u) * 1.5);
  font-variant-numeric: tabular-nums;
}
.compute__gap {
  margin-top: var(--u);
  font-family: var(--face-ui);
  font-size: 0.875rem;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.compute__gap[data-dir="exact"] { color: var(--solid); }
.compute__gap[data-dir="over"],
.compute__gap[data-dir="under"] { color: var(--action); }

/* --- Evidence gate ------------------------------------------------------- */
/* Seven verdicts, four colours. The colour answers only "how much weight does
   this carry", which is the question the reader is actually asking; the label
   carries the distinction between, say, never-repeated and disputed. Giving
   each verdict its own hue would imply seven degrees of trust and there are
   not seven. */
.evidence {
  max-width: var(--measure);
  margin: calc(var(--u) * 3) 0;
  padding: calc(var(--u) * 2) calc(var(--u) * 2.5);
  background: var(--paper-sunk);
  border-left: 3px solid var(--rule-strong);
}
.evidence__cite {
  margin: calc(var(--u) * 0.75) 0 0;
  font-family: var(--face-mono);
  font-size: 0.875rem;
  line-height: 1.5;
  color: var(--ink);
}
.evidence__interval {
  margin: calc(var(--u) * 0.5) 0 0;
  font-family: var(--face-mono);
  font-size: 0.8125rem;
  font-variant-numeric: tabular-nums;
  color: var(--ink-muted);
}
.evidence__meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: calc(var(--u) * 1.5);
  margin: calc(var(--u) * 1.5) 0 0;
}
.rep-chip {
  font-family: var(--face-ui);
  font-size: 0.6875rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 2px 7px;
  border: 1px solid currentColor;
  color: var(--ink-muted);
}
.evidence__asat,
.evidence__stale {
  font-family: var(--face-ui);
  font-size: 0.75rem;
  color: var(--ink-faint);
}

.evidence[data-rep="replicated"] { border-left-color: var(--solid); }
.evidence[data-rep="replicated"] .rep-chip { color: var(--solid); }

.evidence[data-rep="single"],
.evidence[data-rep="contested"] { border-left-color: var(--shaky); }
.evidence[data-rep="single"] .rep-chip,
.evidence[data-rep="contested"] .rep-chip { color: var(--shaky); }

.evidence[data-rep="failed"],
.evidence[data-rep="overclaimed"] { border-left-color: var(--action); }
.evidence[data-rep="failed"] .rep-chip,
.evidence[data-rep="overclaimed"] .rep-chip { color: var(--action); }

.evidence[data-rep="statute"] { border-left-color: var(--accent); }
.evidence[data-rep="statute"] .rep-chip { color: var(--accent); }

/* Staleness is about the check, not the claim, so it marks the block without
   overriding the verdict colour the claim earned. */
.evidence[data-stale="1"] { border-left-style: dashed; }
.evidence[data-stale="1"] .evidence__stale { color: var(--action); }

/* --- Expiry -------------------------------------------------------------- */
.tag--lapsed {
  background: none;
  border: 1px solid var(--action-line);
  color: var(--action);
}
.pip--lapsed {
  background: none;
  border: 1px solid var(--rule-strong);
  width: 5px;
  height: 5px;
}

/* --- Attempts log -------------------------------------------------------- */
.attempt {
  display: flex;
  flex-direction: column;
  gap: var(--u);
  max-width: var(--measure);
  padding-bottom: calc(var(--u) * 3);
  margin-bottom: calc(var(--u) * 3);
  border-bottom: 1px solid var(--rule);
}
.attempt__past {
  padding-left: calc(var(--u) * 2);
  border-left: 2px solid var(--accent-line);
  white-space: pre-wrap;
}
.attempt__past span {
  font-family: var(--face-mono);
  font-size: 0.6875rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--ink-faint);
  margin-right: var(--u);
}
.attempt__new { display: flex; flex-direction: column; gap: var(--u); align-items: flex-start; }
.attempt__field { min-height: calc(var(--lead) * 2); }

/* --- Journal, gated entries --------------------------------------------- */
.note__label {
  font-family: var(--face-ui);
  font-size: 0.6875rem;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-faint);
}
.note__body--gate {
  color: var(--ink-muted);
  font-style: italic;
  padding-left: calc(var(--u) * 2);
  border-left: 2px solid var(--action-line);
}

/* --- Forecast seed, inside an entry -------------------------------------- */
.fc-seed {
  max-width: var(--measure);
  margin: calc(var(--u) * 4) 0;
  padding: calc(var(--u) * 3);
  background: var(--paper-sunk);
  border: 1px solid var(--rule);
  border-radius: 2px;
}
.fc-seed__q {
  font-family: var(--face-display);
  font-size: 1.125rem;
  line-height: 1.35;
  margin-bottom: calc(var(--u) * 2);
}
.fc-seed__row {
  display: flex;
  flex-wrap: wrap;
  gap: calc(var(--u) * 2);
  align-items: center;
}
.fc-seed__lab {
  font-family: var(--face-ui);
  font-size: 0.8125rem;
  color: var(--ink-muted);
  display: inline-flex;
  align-items: center;
  gap: var(--u);
}
.fc-seed__p, .fc-seed__d {
  font-family: var(--face-mono);
  font-size: 0.875rem;
  padding: 5px 7px;
  color: var(--ink);
  background: var(--paper-raised);
  border: 1px solid var(--rule-strong);
  border-radius: 2px;
}
.fc-seed__p { width: 4.5rem; }

/* --- Forecast book ------------------------------------------------------- */
.fc-group {
  max-width: var(--measure);
  margin-bottom: calc(var(--u) * 5);
  display: flex;
  flex-direction: column;
  gap: var(--u);
}
.fc-new__q { min-height: calc(var(--lead) * 2); }
.fc-row {
  display: flex;
  flex-wrap: wrap;
  gap: calc(var(--u) * 2);
  justify-content: space-between;
  align-items: flex-start;
  padding: calc(var(--u) * 2);
  background: var(--paper-raised);
  border: 1px solid var(--rule);
  border-left: 3px solid var(--rule-strong);
  border-radius: 2px;
}
.fc-row--ripe { border-left-color: var(--action); background: var(--action-soft); }
.fc-row--good { border-left-color: var(--solid); }
.fc-row--mid  { border-left-color: var(--shaky); }
.fc-row--bad  { border-left-color: var(--action); }
.fc-row__body { flex: 1 1 18rem; }
.fc-row__q { line-height: 1.4; }
.fc-row__meta {
  margin-top: 4px;
  font-family: var(--face-mono);
  font-size: 0.75rem;
  color: var(--ink-faint);
}
.fc-row__acts { display: flex; gap: var(--u); flex-wrap: wrap; }

/* --- Calibration plot ----------------------------------------------------
   Inline SVG because the CSP blocks every chart library, and because a
   ten-bucket scatter against a diagonal does not need one. */
.calwrap {
  max-width: var(--measure);
  margin-bottom: calc(var(--u) * 5);
}
.cal {
  display: block;
  width: 100%;
  max-width: 22rem;
  height: auto;
  margin: calc(var(--u) * 2) 0;
}
.cal__ref { stroke: var(--rule-strong); stroke-width: 1; stroke-dasharray: 3 3; }
.cal__axis { stroke: var(--rule-strong); stroke-width: 1; }
.cal__dot { fill: var(--accent); fill-opacity: 0.75; }
.cal__t {
  fill: var(--ink-faint);
  font-family: var(--face-ui);
  font-size: 9px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

/* --- Cheatsheet ----------------------------------------------------------
   Inverted from every other list in the engine. The shelf leads with the
   claim because you are choosing what to read; here you have already read it,
   so the row leads with what to do and demotes the claim to the line that
   justifies it. The solid rule down the left is the same one the evidence
   block uses for a replicated verdict, because that is the only verdict on
   this page and the colour should mean the same thing in both places. */
.cheat { margin-bottom: calc(var(--u) * 5); }
.cheat__track {
  font-family: var(--face-ui);
  font-size: 0.625rem;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-faint);
  padding-bottom: var(--u);
  border-bottom: 1px solid var(--rule);
}
.cheat__row {
  display: flex;
  flex-direction: column;
  gap: calc(var(--u) * 0.75);
  width: 100%;
  padding: calc(var(--u) * 2) calc(var(--u) * 2);
  background: none;
  border: 0;
  border-left: 2px solid var(--solid);
  border-bottom: 1px solid var(--rule);
  text-align: left;
  cursor: pointer;
  transition: background 0.1s ease;
}
.cheat__row:hover { background: var(--accent-soft); }
.cheat__do {

<script>
/* Parallax - what you sent and what they received.
 *
 * Named after the apparent shift of an object against its background when the
 * observer moves, because that is the whole claim: the message you sent and the
 * message they received are two different objects, and the difference is not
 * noise. It is geometry. You are standing somewhere else, holding context they
 * do not have, and the gap opens whether or not you were careless.
 *
 * The seam with its two nearest siblings is deliberate and worth stating.
 * Compositor works on how a sentence reads and drills on paragraphs you wrote.
 * Andon works on whether you say the unwelcome thing at all. This one starts
 * after both: the thing is worth saying, the prose is fine, and the reader
 * still took away something you did not send. The unit here is a whole message
 * and the axis is the reader's position rather than the prose.
 *
 * The gate is predict-the-misread rather than rewrite-it, and that choice is
 * the site. A rewrite gate teaches the fix for the entry in front of you. The
 * misread is the part that generalises, because in six months you will not
 * remember the moves and you will still have to look at your own draft from the
 * other chair. Getting the misreading down in writing, before the rewrite
 * opens, is the only version of that skill you can practise alone.
 *
 * The evidence gate is on. This subject is more heavily colonised by confident
 * folklore than almost any other - the seven per cent figure, the myth that
 * tone survives text, the tapping study quoted as a measurement when it is one
 * unpublished dissertation - so a site about being misread cannot itself run on
 * claims nobody checked. Most verdicts will be `craft`, and that is the honest
 * answer rather than an embarrassment.
 *
 * requireInterval is off. What research exists here reports effects over survey
 * scales and small lab tasks, and the ordering claims that make up most of the
 * corpus have never been isolated by anyone. Demanding an interval would buy
 * invented numbers rather than rigour.
 */
window.SITE = {
  key: 'parallax.v1',
  slug: 'parallax',
  name: 'Parallax',
  eyebrow: 'Send log',
  tagline: 'what you sent and what they received',

     decide what goes first, you settle what the message says about the reader,
     you draw the boundary, you land it on the specific case. Then the three
     that get skipped - what it will read as, who is reading it, and what you
     owe afterwards.

     Planned: question, order, standing, boundary, specific, reads, distance,
     commitment, after. Only the populated ones are declared, because the build
     refuses a track with no entries and a declared empty track would ship as a
     hole in the sequence. */

    { id: 'question', name: 'The live question' },
    { id: 'order', name: 'Where the answer goes' },

  cheatsheet: true,

  }

  gatePrompt: "Write what happens in this person's head when they get the number and nothing else.",
  evidence: "No trial. The presenting-problem distinction comes out of consulting and clinical practice, where it is taught as a matter of course and has never been isolated experimentally. Block's formulation is the one usually cited in a business setting and it rests on practitioner observation across a career rather than on a study. Treat it as a heuristic with a long service record and no measurement behind it.",

  why: "A request arrives compressed. The sender has already done the work of turning a worry into something answerable, and that compression loses the part you needed: what survives is a figure they can ask for, not the decision that made them want it. You then answer the compressed form exactly, which feels like good service and frequently is not, because the thing that produced the message is still sitting there untouched.\n\nThe repair is not to guess at motives or to reply with a question about their feelings. It is to spend one line naming the decision you believe this is for, and to answer that too. Guess right and you have saved a round trip and taught them that you think rather than fetch. Guess wrong and they correct you in a sentence. That asymmetry is the entire argument: being wrong about the underlying question costs one clarifying reply, and never asking costs a fortnight of two people solving different problems and not noticing.",
  failureMode: "You become the person who answers precisely and unhelpfully. Nobody complains, because you did answer, and requests keep arriving in the same compressed form because you have taught everyone that compressed is what you take. Two quarters later you are a query service, and you are surprised to find you are not in the room where the thing gets decided.",

  track: "question", level: "reply",

  gateIntro: "A senior engineer on a customer-facing team has spent a week pulling cost anomalies across four tenants and posted them in your channel. You are about to reply with this:\n\n\"For runtime, we proactively look at app cost at an overall level. Trying to attack the broad patterns as a priority. For tenant specific issues - they give signal on what could be a larger pattern - we look at them reactively due prioritising larger pattern. Signal like what you give is very important us, and we will go deep\"\n\nEvery clause in it is true. You do work fleet-first, those reports genuinely do feed the pattern work, and you genuinely do want more of them.",

  why: "A report like this carries two questions and only one of them is written down. The first is about the finding: is it real, is it already known, what becomes of it. The second is about the reporter, and it runs roughly, was that week worth spending, and does bringing you things like this actually do anything. The second question is the one that decides whether a third report ever arrives, and it gets answered by the shape of your reply rather than by any sentence in it.\n\nAn account of how you prioritise, arriving first, is read as the reason you will not be acting. That is not what it says and it does not matter, because a reader scanning for a verdict on their own week takes the first thing you gave them as the answer, and you gave them a triage policy. Appreciation in the closing line does not undo it either. By then the reading has formed, and warmth arriving last is the softener people attach to a refusal, which is exactly where they have learned to expect it. Put the verdict on the contribution in the opening sentence and everything after it is heard as method instead of as excuse.",

  worked: "Standing first, then the rule with its reason, then the boundary, then this specific case, then what you owe back.\n\n\"Signals like this are exactly what we want, please keep sending them.\n\nHow we work runtime cost: the default is fleet level. We track app cost across all tenants and go after the patterns that repeat, since that's where the compounding spend is.\n\nTenant-specific reports are the fastest way we find those patterns, so we treat them as leads rather than one-offs. What we don't do is open a separate workstream per tenant before checking whether it generalises.\n\nOn tenant-4471, tenant-4482, tenant-5103 and tenant-5119 - the pattern and dashboard link would let us tell quickly whether these are four instances of one thing or four separate ones. Either way we'll go deep and come back.\"\n\nNothing about the policy changed. What changed is that the reader learns their week counted before they learn how you triage, and their four tenants come back to them as a specific request with a reason attached rather than as an illustration of the category you deprioritise.",

  evidence: "The underlying effect is well established. Camerer, Loewenstein and Weber showed in market experiments that better-informed participants could not discount what they knew when predicting the judgements of less-informed others, and the finding has held across two decades of work on perspective taking and hindsight. The famous tappers-and-listeners demonstration, in which tappers expected around half of listeners to name the tune and roughly one in forty did, is a single unpublished dissertation study. It illustrates the effect memorably and it is not a measurement of it.",

  why: "Knowledge is not something a mind can set aside on request. Once you hold a model of how something works, your judgements about what a person without that model will understand are made by starting from your own understanding and adjusting downward, and the adjustment is reliably too small. This is not carelessness, and it does not respond to being told to try harder, because it is the ordinary operation of a mind that cannot simulate its own ignorance.\n\nFor a broadcast the consequence is specific. Categories are cheap for the writer and expensive for the reader. You know which services sit behind the old credential path because you spent three weeks assembling that list, so a phrase naming the group feels complete when you write it. To a reader it is a lookup they have to perform, against a system they do not know, to answer a question whose stakes they cannot estimate, while thirty other messages arrive. The cheapest resolution available is to decide it is not about them. That resolution is free, immediate, and wrong for exactly the four teams who needed to read it.",

  idea: "Sort the message into one of three kinds before drafting, a decision you need, an action other people must take, or genuinely nothing, and put that label in the opening line rather than leaving the reader to infer it from the prose.",
  why: "A reader scans an update to answer one question, which is whether it generates work for them. Until that is settled they cannot read the content properly, because they are doing two jobs at once: following what you are saying, and monitoring for the sentence that turns out to be aimed at them. Answering it in the first line frees the rest of the message to be read as information rather than as a minefield.\n\nThe more expensive half is what happens when a real ask goes in unlabelled. A decision request phrased as a status observation, sitting in paragraph three, has been made deniable in both directions. You believe you raised it, and you did. They did not register it as a request, and reasonably, because it arrived in the shape of a thing being reported rather than a thing being asked for. When Thursday passes, nobody was negligent, which is the property that makes this failure repeat indefinitely instead of getting fixed after the first time.\n\nThe honest FYI matters as much. A message that says up front it needs nothing is read more carefully than one that leaves the question open, because the reader can stop guarding.",
  failureMode: "You write consistently good updates that consistently do not produce decisions, and you conclude that the organisation is slow. The decisions you needed were all in the middle of paragraphs, formatted identically to the things you were merely reporting, and nobody had a way to tell them apart.",
  worked: "The type goes first, with the deadline and the owner attached, and the status becomes context for it rather than the other way round.\n\n\"One decision needed this week, from Priya, by Thursday. Everything else here is FYI.\n\nDecision: storage is running 40 per cent above forecast and the cause is retention, not growth. We can hold the current policy and absorb roughly 60k over the quarter, or cut retention on event data from 90 days to 30 and stay inside the number. Both are defensible. I would take the cut and I need somebody who owns the compliance side to say whether 30 days breaks anything.\n\nStatus, no action needed: the migration finished tranche two on Tuesday, three services left, on track for the 28th. Next week is tranche three.\"\n\nNote what the label bought. The status paragraph is unchanged in substance and is now read faster and more accurately, because the reader already knows it is not going to turn into work halfway through.",
  experiment: "Take the last four updates you sent and classify every paragraph as a decision, an action for somebody, or information. Then check where each one physically sat in the message. The gap between what you thought you asked for and what a reader could have detected is usually visible without any interpretation at all.",

  id: "question-the-one-they-did-not-ask",

  title: "The question they left out is usually the one driving the message",

  gateIntro: "Your skip-level messages you on a Friday afternoon: \"Quick one - do you know when the headcount plan for next quarter gets finalised?\" Nothing else, no context, and they have never asked you anything about headcount before.\n\nYou know the date. You also know their team is the one the reorg conversation has been circling, and that nothing has been decided.\n\nThe draft sitting in the box says: \"Should be locked by the 14th, it goes to the leadership review on the 11th.\"",
  gatePrompt: "Write what this person does with the rest of their weekend after reading the draft.",
  evidence: "No trial. Argyris built the left-hand column from case observation and it is taught as a reflective exercise rather than as a tested intervention. The narrower claim made here, that people route a question they cannot ask through one they can, is unmeasured and close to unmeasurable, since the phenomenon is defined by not being stated. Its standing rests entirely on how consistently practitioners report the same pattern, which is weak evidence and is the only evidence available.",
  replication: "craft",
  idea: "Treat a procedural question from somebody who has never asked one as the signal itself, answer what was asked, then say the one true thing you can say about what it is probably for, and make the guess explicitly retractable.",
  why: "People send the question they are permitted to send. When the real one cannot be asked without admitting a fear, or without implying a distrust they do not want on the record, it gets routed through something adjacent and answerable, and the timing question is the most common vehicle because it is legitimate on its face and its answer is diagnostic. Somebody who wants to know whether they are safe cannot ask that. They can ask when the plan is finalised, and then read your answer for what it implies about how much you know.\n\nThis is why a fast, correct, nine-word answer is the worst available move. It is indistinguishable from the reply of somebody who knows something and is not saying it, and the reader has no way to tell the two apart. Silence on the underlying question is not neutral, because they were already assuming an answer before they wrote to you and your reply either disturbs that assumption or confirms it. Saying nothing confirms it.\n\nThe move is not to name their fear for them. That is presumptuous, it is sometimes wrong, and it puts a thought into writing that they deliberately kept out of writing. It is to state your guess as a guess, answer it honestly including the parts you cannot answer, and give them a costless way to say you read it wrong.",
  failureMode: "You answer the date, correctly, in nine words. They take it as confirmation that you know something and are managing them, which is the worst of the three possible states because it is indistinguishable from the true version and you will never find out which one they landed on. The next time they want to know something they ask somebody else, or they ask nobody.",
  worked: "The date, then the guess, then the retraction clause.\n\n\"The 14th, after leadership review on the 11th.\n\nIf you are asking because of what has been going around about the reorg: I do not have a decision to give you and I am not sitting on one. What I can tell you is that nothing about your team has been settled, that I will know a day before you at most, and that if it changes I will come and find you rather than let you read it in a plan.\n\nIf I have read that completely wrong and you just wanted the date, ignore the middle paragraph.\"\n\nThe last line is doing more work than it looks like. It makes the guess retractable, which is the thing that lets you respond to somebody's unstated fear without imposing it on them or requiring them to confirm it.",

  id: "order-answer-first",
  track: "order", level: "reply",
  title: "Lead with the answer, not the road you took to it",
  source: "Barbara Minto, The Pyramid Principle",
  gateIntro: "The VP of engineering asked exactly one question in a thread this morning: can we ship Thursday. Your draft reply runs to four paragraphs.\n\nIt opens with what you found when you looked at the test failures, moves through which of them were flakes and which were real, explains the dependency on the vendor's staging window, and covers what happened when you tried the workaround on Tuesday.\n\nThe answer is in the final sentence. It is no, and the earliest is the following Monday.",
  gatePrompt: "Write what the VP does after reading the first two paragraphs, which is as far as they get.",
  evidence: "No trial. Minto developed the pyramid as a house standard at McKinsey and taught it as craft; it has never been tested against an alternative ordering under controlled conditions. It has been the default in consulting and much of technical writing for four decades, which is evidence about adoption rather than about effect. The adjacent claim that readers of professional prose scan rather than read linearly is better supported and is not the same claim.",
  replication: "craft",
  cheat: "Put the answer in the first sentence and the derivation under it. A reader who stops after one line should still be holding the answer.",
  idea: "State the conclusion first and make everything after it optional, so that a reader who stops early stops holding your finding rather than holding your working.",
  why: "You wrote it in the order you discovered it, which is the order that makes sense only to somebody who already knows the ending. The investigation felt like the substance because that is where the week went, so it arrives first and the finding arrives last, and that sequence is a faithful record of your effort rather than a message.\n\nThe reader is doing something else entirely. They arrived holding a question and they are scanning for the shape of an answer, so everything before it is cost. If they stop early, and they usually do, what they leave with depends on where you put the conclusion. At the top they leave with the answer and no detail. At the bottom they leave with detail and no answer, which is worse than sending nothing, because it consumed their attention and left them still not knowing. Putting the conclusion first also changes what the detail is for: it stops being an argument they have to follow and becomes support they can audit if they choose, which is a much lower demand on somebody who was only ever going to spend forty seconds.",

  worked: "\"No, Thursday is not achievable. Earliest is Monday the 24th.\n\nWhy: the vendor's staging window does not open until Friday and we cannot run the integration suite without it. That is the whole blocker. Everything else is now fixed.\n\nDetail if you want it: of the eleven test failures, nine were flakes from the parallel runner and are gone. The two real ones were the serialisation bug, fixed Tuesday. We tried a workaround for the staging dependency and it needs a credential we will not have by Thursday.\n\nIf Monday is a problem, the lever is the vendor rather than us, and I would need you to make that call today.\"\n\nStill four paragraphs. The reader who stops after seven words has the answer, the reader who stops after two has what to escalate, and the reader who wants the working has it.",

    a: "Because a reader who stops early leaves with detail and no answer, having spent attention and gained nothing, whereas stopping early on a conclusion-first message still leaves them correct. Moving it also changes what the detail is for: it stops being an argument that must be followed and becomes support that can be audited, which is a far lower demand on somebody spending forty seconds."

{
  id: "order-bury-the-lede",
  track: "order", level: "record",
  title: "The load-bearing sentence drifts into the middle on its own",
  source: "The newsroom convention of the lede, and the standing instruction against burying it",
  gateIntro: "You have written a 900-word update on the payments migration. It is well organised: background, current state, the three workstreams, risks, next steps.\n\nUnder risks, fourth bullet, sits this sentence: \"We have not yet found a way to reconcile the historical ledger, and if we cannot, the cutover cannot be reversed once it starts.\"\n\nYou are aware this is the most important sentence in the document. You filed it under risks because that is where risks go.",
  gatePrompt: "Write what the three people who read this to the end believe about whether the migration is safe.",
  evidence: "No trial. The instruction comes from newsroom practice, where it is enforced by editors rather than derived from research, and it entered technical and business writing by transfer. What supports it indirectly is the better-established finding that readers of professional prose scan rather than read linearly, which makes position load-bearing whether or not anybody has measured this particular rule.",
  replication: "craft",
  cheat: "Find the sentence that would change somebody's plans, then check whether it is in the first three lines or in a bullet under risks.",
  idea: "Locate the sentence that would change what somebody does and put it where the structure cannot absorb it, which usually means breaking the structure you were taught.",
  why: "A conventional structure is a filing system, and filing systems sort by category rather than by importance. Background goes first because it is background. Risks go near the end because that is where risks go. So a sentence that should stop the room ends up stored beside four sentences that should not, formatted identically, and the reader's eye grants it exactly the weight the format assigns.\n\nThe author almost always knows which sentence it is, and that is the part worth noticing, because it means this is not a failure of judgement about content. It is a failure to let the judgement override the template. What keeps it in place is that a tidy document feels finished, and hoisting the frightening line to the top makes it feel alarmist. The discomfort of appearing alarmist is immediate and lands on you. The cost of being ignored is deferred and lands on somebody else, which is a trade people make without ever seeing it as one.",
  failureMode: "Nobody is surprised afterwards, because it was in the document, and nobody acted at the time, because it was in the document under risks. The retrospective finds the sentence, quotes it, and concludes the information was available. Being able to point at where you wrote it is the consolation available to people who did the other half badly.",
  worked: "The document keeps its structure. What it acquires is a first paragraph the structure had no slot for.\n\n\"One thing before the detail: we do not currently have a way to reconcile the historical ledger, and until we do, the cutover is irreversible once it starts. That is a change from what this group was told in June, when the plan assumed a rollback path.\n\nI am not asking for a decision today. I am asking that nobody plans around a rollback until I confirm we have one, and that we do not commit to a date in front of the customer this week.\n\nBackground, current state and the three workstreams are below, unchanged from last week.\"\n\nThe other 900 words are untouched. What was added names the change, says what it invalidates, and states what it does and does not ask for, which is the thing that stops a hoisted line from reading as alarm.",
  experiment: "Take a document you wrote in the last month and ask one question of it: which single sentence, if the reader missed it, would leave them planning wrongly? Then find where it sits. Do this for three documents before concluding anything, because one instance is a lapse and three is a habit.",
  reflection: "What did you write down, correctly, that nobody acted on?",
  recall: {

    a: "Because the structure sorts by category rather than importance, so a sentence that should stop the room is filed beside routine ones and formatted identically, and the eye grants it the weight the format assigns. Authors leave it because hoisting it feels alarmist, and the discomfort of appearing alarmist is immediate and theirs while the cost of being ignored is deferred and somebody else's."
  },
  deepDive: "Here is a document I wrote. Tell me which sentence would change a reader's plans, where it currently sits, and how to hoist it without sounding alarmist."

{
  id: "order-stopping-points",
  track: "order", level: "broadcast",
  title: "What you know about how people scan is overclaimed, and the robust move does not need it",
  source: "Serial position effects in recall, and the eye-tracking scanning claims that outran them",
  gateIntro: "You are posting to the engineering channel about changes to the on-call handover. Six points: the new rota tool, the escalation path, weekend cover, the paging threshold for the ingest service dropping so it now fires on one failed batch rather than three, where the runbooks moved to, and how to raise problems.\n\nThey are in that order because that is the order the working group covered them in. The fourth is the one that will wake somebody at three in the morning.",
  gatePrompt: "Write what an on-call engineer remembers about this post a week later, at three in the morning.",
  evidence: "Real, and sold well past what it supports. Serial position effects, where the start and end of a list are recalled better than the middle, are among the most replicated findings in memory research, but they were established on lists of unrelated items recalled immediately, which is not what reading a work announcement is. The popular version, that readers scan in an F-shaped pattern and skip the middle, comes from Nielsen Norman eye-tracking work on early web pages that were largely unstructured text: a real observation on a narrow sample, routinely quoted as a law of reading. The direction of both is probably right and the confidence attached to them is borrowed rather than earned.",
  replication: "overclaimed",
  cheat: "Check that a reader who stops after the first line, and again after the first paragraph, is left holding something true rather than something partial.",
  idea: "Build the message so that stopping at any point leaves the reader with a true and useful picture, instead of optimising the layout against a model of where their attention goes.",
  why: "The models are weaker than their reputation, and the weakness is specific. Findings about recall of word lists were never measured for the medium you are writing in, and the eye-tracking work everybody quotes was done on a kind of page that no longer exists. Designing your announcement around a claim about where an eye travels means designing around a number nobody collected for your case, and being confidently wrong about it is worse than having no model, because it produces a layout you trust.\n\nWhat survives the uncertainty is a weaker rule that turns out to be more useful. If you cannot know where a reader stops, make every stopping point safe: the first line true on its own, the summary true without the detail, and anything that changes what somebody does lifted out of the sequence rather than left at position four. This costs nothing if the scanning research holds and still works if it does not, which is the property you want in a rule you will apply several times a day without thinking about it.",
  failureMode: "The post is complete, correctly ordered, and read by everybody, and at three in the morning an engineer pages on a single batch and does not know why. Nobody misread anything. The item sat in the position where things go to not be recalled, and the format gave it the same weight as where the runbooks moved to.",
  worked: "One item is lifted out of the list. The rest keeps its order.\n\n\"On-call changes, effective Monday. One of these will affect you at three in the morning, so it is first.\n\nIngest now pages on a single failed batch, down from three. If you are on call for ingest, expect more pages, and the first thing to check is whether the batch retried on its own before you escalate anything. Runbook section 4 covers it.\n\nEverything else is administrative: new rota tool, escalation path unchanged, weekend cover moves to two people, runbooks have moved, problems to this channel. Detail in the thread.\"\n\nAll six points survive. What changed is that one of them stopped being an item in a list.",
  experiment: "Take your next multi-point announcement and ask, for each item, what happens if the reader misses this one. Most lists have exactly one item where the answer is serious. Lift that one out and leave the others as a list, and notice how much you wanted to preserve the tidy parallel structure.",
  reflection: "What did you announce in the middle of a list that somebody later said they had not known about?",
  recall: {
    q: "Why is designing a message around where readers scan a weaker move than making every stopping point true?",
    a: "Because the scanning claims carry more confidence than they earned: serial position was established on immediate recall of unrelated word lists, and the F-pattern comes from eye-tracking on early unstructured web pages, so neither was measured for the medium you write in. Making each stopping point true costs nothing if those findings hold and still works if they do not."
  },
  deepDive: "Here is a multi-point announcement. Tell me which single item is serious if missed, and rewrite it so that item is not in the list."

{
  id: "order-name-the-problem-part",
  track: "order", level: "reply",
  title: "Say which part is the problem, because a third of feedback conversations make things worse",
  source: "Kluger and DeNisi's meta-analysis of feedback interventions",
  gateIntro: "You are replying to a design document from an engineer two levels below you. The architecture is fine. The data model has a problem that becomes expensive in about eighteen months, and they have not seen it.\n\nYour draft opens with two sentences on how thorough the document is, moves into the data model concern, and closes by saying the overall direction is right and you are glad they picked this up.\n\nAll of it is sincere. You do think it is thorough and you do think the direction is right.",
  gatePrompt: "Write what this engineer tells their manager the review said.",
  evidence: "Kluger and DeNisi's meta-analysis of 607 effect sizes found feedback interventions raised performance by around 0.4 of a standard deviation on average, and that more than a third of them lowered it. That result is well established and has held up. What it does not establish is the remedy offered here. Their proposed mechanism, that harm comes from feedback drawing attention to the self rather than to the task, is well argued and much less well tested, and the specific prohibition on wrapping criticism in praise is craft with no trial behind it at all.",
  replication: "replicated",
  cheat: "Say which sentence is the request and which is the compliment. If the reader has to work it out, they will pick the flattering reading.",
  idea: "Mark the critical part explicitly as the thing you want changed and keep the praise out of contact with it, because a reader deciding how seriously to take a review resolves ambiguity in whichever direction costs them least.",
  why: "The average effect conceals the finding worth having, which is that feedback is not reliably helpful and a substantial minority of it makes performance worse. The proposed explanation is that direction depends on where attention lands: feedback pointing at the task improves the task, and feedback pointing at the self, favourably or otherwise, competes with it. That is a mechanism rather than a demonstrated law, and it remains the most useful available account of why well-intentioned reviews so often change nothing.\n\nThe practical form of the failure is ambiguity about which part was the point. When a criticism sits between two compliments and all three arrive in the same register, the reader has to decide how much weight the middle carries, and they decide under an incentive: one reading requires eighteen months of rework and the other requires nothing. People do not resolve that neutrally, and it is not dishonesty when they do not. The fix is not removing the praise. It is stopping the praise and the problem from being the same kind of sentence, so that no interpretation is called for.",
  failureMode: "You leave believing you raised it. They leave believing they got a positive review with a note attached. Eighteen months later the data model is expensive and both of you can produce the document showing it was mentioned, which is the property that keeps this failure invisible for exactly as long as it takes to become unfixable.",
  worked: "The praise and the problem are separated and given different shapes.\n\n\"One thing to change before this goes ahead, then some smaller notes.\n\nThe change: the model keys events on the tenant identifier rather than on an internal id. That holds until a tenant is renamed or merged, and both happen. When it does, every historical event for that tenant becomes unattributable and there is no migration that recovers it. I want this keyed on an internal id before we build anything on top. If you think that is wrong, tell me why and I will look again.\n\nSeparately, and not a qualification of the above: this is the most thorough design document I have read this quarter, the failure-mode section especially, and I am glad you picked the problem up.\"\n\nThe compliment survives intact and now reads as a compliment rather than as a cushion, because it has been moved out of contact with the request and labelled as separate.",
  experiment: "Take your last three written reviews and give each to somebody uninvolved, asking them to tell you what the author is meant to change. Where they cannot say, the review contained no request, whatever you believed you were doing when you wrote it.",
  reflection: "What did you raise in a review that came back unchanged, and how was it phrased?",
  recall: {
    q: "What does the feedback meta-analysis actually establish, and what is it commonly stretched to support?",
    a: "It establishes that feedback interventions raise performance by roughly 0.4 of a standard deviation on average and that over a third of them lower it, which is well replicated. It is stretched to support specific delivery techniques, including the ban on sandwiching criticism in praise, which has no trial behind it and rests on the proposed self-versus-task attention mechanism rather than on the meta-analytic result."
  },
  deepDive: "Here is a review I am about to send. Tell me whether a reader could mistake which part is the request, and rewrite it so they cannot."

{
  id: "order-first-line-preview",
  track: "order", level: "broadcast",

  source: "Notification and preview conventions, where the first line is what the reader is actually shown",
  gateIntro: "You are sending to twelve people about a security patch that has to be applied by Friday. The draft opens: \"Hi all, hope everyone had a good week. Following up on the discussion in Tuesday's platform sync and the thread that came out of it, I wanted to circulate some detail on the CVE that was raised.\"\n\nThe deadline and the action appear in the fourth sentence. Six of the twelve will see this as a notification preview on a phone.",

  replication: "craft",
  cheat: "Read your first line with everything after it deleted. If it does not say who does what by when, the preview has been spent on nothing.",
  idea: "Write the opening line to survive being the only line the reader is shown, because in most clients the preview is what they are given before deciding whether to open anything at all.",
  why: "There is a rendering step between what you wrote and what the reader receives, and it truncates. A greeting, a context sentence and a reference to the meeting where this came up will consume the entire preview in most clients, so what the reader is shown appears to be a message about a meeting. They then triage that against everything else on the screen, and a message about a meeting loses.\n\nWhat makes this different from ordinary burying is that the reader has not read your message badly. They have not read it at all, and the decision not to was made on a fragment the software chose. The greeting was politeness and the context was diligence, and both were spent on the only real estate you were guaranteed. The move is not to be abrupt. It is to put the greeting after the load-bearing line, which reads perfectly well and which almost nobody does, because the ordering of a message feels like it belongs to etiquette rather than to the delivery mechanism.",
  failureMode: "Six of the twelve do not apply the patch, and when you check, they say they saw it and took it for a summary of the platform sync. You did send it, they did see it, and no part of the exchange was unreasonable, which is why the same thing happens again next Friday.",
  worked: "\"Action needed by Friday: apply the platform patch, ten minutes, steps below.\n\nHi all. This is the CVE raised in Tuesday's platform sync and in the thread afterwards. It affects the auth sidecar on any service still running 2.14.\n\nWhat to do: bump to 2.16 and redeploy. About ten minutes per service. If you are on 2.16 already there is nothing to do.\n\nIf you cannot make Friday, tell me before Thursday and I will arrange cover rather than find out about it on Monday.\"\n\nThe greeting survived. It moved down one line, which costs nothing, and the preview now carries the action and the deadline.",

  },
  deepDive: "Here is a message I am about to send. Tell me what its notification preview will show, and rewrite the opening so the preview carries the action and the deadline."
