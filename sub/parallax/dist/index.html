{
  id: "reads-bad-is-stronger-than-good",
  track: "reads", level: "reply",
  title: "The one critical line is the message, whatever else is in it",
  source: "Baumeister, Bratslavsky, Finkenauer and Vohs, Bad is stronger than good",
  gateIntro: "You are reviewing a colleague's document and your comments run to eleven notes. Nine are minor, one is a genuine compliment about the risk section, and one says the cost model assumes linear scaling and will be out by roughly an order of magnitude at their target volume.\n\nYou spent about the same time on each. In your head this is a positive review with one substantive issue in it.",
  gatePrompt: "Write what this colleague says the review was, a week later, when somebody asks how it went.",
  evidence: "The asymmetry is one of the better-supported generalisations in social psychology. Baumeister and colleagues assembled evidence across impression formation, memory, learning, relationships and emotion, and Rozin and Royzman made the parallel case for negativity dominance in the same year. It reproduces across many domains and methods, which is what makes it credible. That breadth is also its limitation as a citation: it is a review across literatures rather than one effect with one size, so it supports the direction robustly and supports no particular ratio at all.",
  replication: "replicated",
  idea: "Assume the critical line is what the message delivered and everything else was packaging, and if that is not the balance you intended, state the balance rather than distributing it across the notes.",
  why: "Negative information carries more weight than positive information of comparable size, consistently, across impression formation and memory and learning. This is one of the better-supported generalisations available, though it is a pattern assembled from many literatures rather than a single measured effect, so it supports a direction and no particular ratio. The direction is enough. Eleven notes containing one serious criticism is not received as a document with one problem. It is received as a criticism, with ten pieces of packaging around it.\n\nThe practical consequence is that you cannot fix this by adjusting proportions. Adding more positive notes does not dilute the negative one, it only makes the message longer, and the reader still leaves holding the criticism. What works is stating the verdict outright, because the verdict is the one thing a reader cannot reconstruct from the notes: the difference between this is nearly there and one thing has to change, and this has a problem serious enough that I am not sure about it, is encoded nowhere in eleven individual comments.\n\nWriting the verdict also forces you to have one. Reviewers frequently discover, at the moment of composing that sentence, that they do not actually know whether they think the document is good.",
  failureMode: "They rewrite the whole thing. You get back a substantially different document that has also addressed nine trivial notes and lost the section you praised, and you will read that as an overreaction rather than as the reasonable response to a review that never said what it thought.",
  worked: "\"Summary before the notes: this is good and I think it ships, with one thing that has to change first. The other ten notes are optional.\n\nThe one that matters: the cost model assumes linear scaling and it will not be linear at your target volume. My guess is it is out by roughly an order of magnitude at the top end. That has to be redone before anybody plans against these numbers, and I am happy to sit down and go through it.\n\nThe risk section is the best I have read on this system and I would not change a line of it.\n\nThe remaining nine notes are in the document and are all minor. Take them or leave them.\"\n\nEleven notes, unchanged. What was added is a verdict, which is the one thing the notes cannot carry between them.",
  experiment: "Before sending your next review, write the one-sentence verdict first and check the notes against it. Where they disagree, either the notes are right and the verdict was a courtesy, or the verdict is right and you have been distributing an opinion across comments instead of stating it.",
  reflection: "What review did you send that got a bigger reaction than you expected?",
  recall: {

    a: "Because negative information outweighs positive information of comparable size, so extra positive notes lengthen the message without changing what the reader leaves holding. Only a stated verdict works, since the difference between nearly there with one fix and serious enough that I am unsure is not encoded anywhere in the individual notes."
  },

{
  id: "reads-silence-is-read",
  track: "reads", level: "reply",
  title: "Not replying is a reply, and you do not choose what it says",
  source: "Craft, and the observation that an unanswered message is interpreted continuously rather than held in suspense",
  gateIntro: "On Tuesday a product manager sent you a long message making the case for reprioritising the quarter. It is thoughtful, and you need two or three days to think about it properly and to talk to two people first.\n\nIt is now Friday. You have not replied, because you do not have an answer yet and a holding message felt like noise.\n\nThey have seen you post in three other channels since Tuesday.",
  gatePrompt: "Write what this person concludes by Friday afternoon about what you think of their proposal, and about them.",
  evidence: "No study, and the quantity of interest is not observable: what would need measuring is an interpretation the sender never states and never raises. What can be said is that the charitable explanation is the one that decays under evidence of you being active elsewhere, which is a matter of ordinary inference rather than psychology. Everything past that is craft.",
  replication: "craft",
  cheat: "Send the holding reply with a date on it. A holding message without a date is a second silence in a polite envelope.",
  idea: "Send the holding reply and put a date in it, because silence gets interpreted continuously and the interpretation worsens the longer it runs while staying entirely invisible to you.",
  why: "An unanswered message does not sit in a neutral state. The sender checks, finds nothing, and constructs an explanation, and they repeat this over days with each pass reinforcing the one before. The available explanations are not evenly weighted: you are busy, you did not think it worth answering, or you disagree and are avoiding saying so. The first is the charitable one and it decays fastest, because evidence accumulates against it every time they see you active somewhere else.\n\nWhat separates this from other misreads is that the sender knows you may simply be busy, so they do not raise it, so it never gets corrected. They also cannot chase without appearing impatient about something you have not actually refused. The interpretation therefore runs unopposed for exactly as long as the silence does, and the first thing you will notice is a change in what they bring you.\n\nA holding message costs one line and removes the whole ambiguity, provided it carries a date. Without one it is a second silence with a courteous opening on it, and it postpones the identical problem by a week.",

  experiment: "Go through your inbox for anything unanswered for more than three days that somebody put real effort into, and send each a holding reply with a date, now. The discomfort of doing this is a fair measure of how long the silence had already been saying something.",

(window.LESSONS = window.LESSONS || []).push(
{
  id: "distance-writing-up",

  source: "Craft, and the convention that a report to a decision-maker carries state and exceptions",
  gateIntro: "You are writing the monthly update that goes to the CTO. The migration is going well. You have written six paragraphs covering what went right, three things that were harder than expected and how you worked around each, the two open questions on the reconciliation approach, and your current thinking on both.\n\nYou consider this an honest and complete account. It is also the longest update in the pack.",
  gatePrompt: "Write what the CTO concludes about whether this migration needs their attention.",
  evidence: "No study. The convention that upward reporting carries state and exception rather than deliberation is standard in operational and military practice and is taught as craft. The specific claim here, that volume of detail is read as a confidence signal, is an observation reported consistently by people who have been on both ends of it and has never been isolated. Treat it as a description of a widely shared convention rather than as a finding.",
  replication: "craft",
  cheat: "Report state and exceptions upward and leave your working in the document. Volume reads as uncertainty, not as diligence.",
  idea: "Report upward at the level of state and exception and keep your deliberation out of it, because a senior reader treats the volume of detail as a signal about your confidence rather than about your thoroughness.",
  why: "A reader at that distance is not evaluating your reasoning. They are allocating attention across twenty things, and the question they bring to your update is whether this one needs them. Everything in the message is evidence toward that question, including its length. Six paragraphs of considered nuance about something going well reads as somebody working a problem out in public, and the natural response is to look more closely, which is precisely what the update existed to prevent.\n\nWhat catches careful people is that the detail was included out of honesty. You do have open questions, hiding them would be worse, so you write them down along with your thinking about them. But disclosing an open question and narrating your deliberation over it are different acts, and only the first is owed. Two open questions with owners and a date by which each resolves is a report. The same two with your current thinking attached is an invitation to be helped, and you will be.\n\nThis is not an argument for concealing problems. It is an argument that the escalation signal has to be carried by an explicit sentence rather than by word count, because otherwise you cannot report a healthy project without sounding worried, or a worrying one without being disbelieved.",
  failureMode: "The CTO asks for a session on the reconciliation approach, three of your next two weeks disappear into preparing for it, and the migration slows down. Nothing was wrong. You wrote six paragraphs about a project that needed one, and the system did exactly what it is built to do.",
  worked: "\"Migration: on track for the 28th. Nothing needed from you.\n\nTwo open questions, both with owners and dates. Reconciliation approach for the historical ledger, decision by the 14th, mine. Cutover window sign-off, needs Ana, asked, expected this week.\n\nOne thing I would escalate if it does not resolve: if the reconciliation question is still open on the 14th, the irreversibility problem I flagged in June comes back, and I will bring that to you rather than absorb it.\n\nDetail is in the document if you want it.\"\n\nThe open questions are still disclosed and the risk is still named. What was removed is your deliberation, and what was added is an explicit trigger, which is what lets the update be short without being merely reassuring.",
  experiment: "Take your last upward update and mark every sentence as state, exception, or working. Delete the working. Then check whether anything true was lost, and whether what remains would have made you look less on top of it or more.",
  reflection: "What did you explain upward that you should simply have reported?",

{
  id: "distance-writing-down",
  track: "distance", level: "broadcast",
  title: "Your thinking out loud is somebody else's roadmap",
  source: "Craft, and the observation that authority converts speculation into signal",
  gateIntro: "In a team meeting you say, as an aside while discussing something else, that you have been wondering whether the notification service should really sit with this team at all.\n\nYou meant it as a live thought. You have decided nothing, you are planning nothing, and you moved to the next agenda item within twenty seconds.\n\nThere are nine people in the room and two of them work primarily on the notification service.",
  gatePrompt: "Write what those two people do in the week after this meeting.",
  evidence: "No study. That authority changes how an utterance is received is uncontroversial and unmeasured in this specific form, and the mechanism proposed here is an inference rather than a finding: the listener cannot distinguish a live thought from an early decision, and preparing for the second is the safer error. The asymmetry of cost, seconds for the speaker against a week for the listener, is craft and is reported consistently by people who have been on the receiving end.",
  replication: "craft",
  cheat: "Label the speculation as speculation and promise who hears it first if it becomes real. The promise is what makes the label credible.",
  idea: "State the status of a speculation out loud when you outrank the room, because a thought voiced downward is received as an early signal of a decision rather than as thinking.",
  why: "Authority changes what an utterance is. The same sentence from a peer is a conversational move, and from somebody who could actually make it happen it is evidence about the future, because the listener cannot distinguish a live thought from a decision in its early stages and has every reason to prepare for the second. They are not overreacting. They are correctly noting that the person who would make this call has said it aloud, and that people rarely say such things entirely at random.\n\nThe cost is asymmetric and invisible to you. You spend no further seconds on the remark. They spend a week: reading it against other signals, wondering whether their work is being wound down, and mentioning it to two other people, which is how it becomes something the team believes. When you eventually find out, it arrives as a question about a reorganisation you never planned, and you will not connect it to a sentence you cannot remember saying.\n\nLabelling costs one clause. This is me thinking aloud and it is not a plan, and if it becomes one you hear it from me first. The second half is what makes the first half credible, because a label with no commitment behind it is only a disclaimer.",
  failureMode: "Two months later somebody asks you directly whether the notification service is being moved, you say no, and they do not entirely believe you, because they have been carrying the other version since a meeting you cannot recall.",
  worked: "Said in the meeting, immediately after the remark.\n\n\"I want to label that, because I said it out loud in front of the people it affects. That was thinking aloud. It is not a plan, and there is no conversation about it happening anywhere else.\n\nIf it ever becomes a real question, Priya and Sam hear it from me before it is discussed in any room they are not in. That is a commitment rather than a reassurance.\n\nAnd if either of you wants to tell me why the thought is wrong, I would much rather have that now than have it be the thing nobody says.\"\n\nTwenty seconds, spent immediately. The alternative is a week of somebody else's attention and a belief you cannot locate in order to correct.",
  experiment: "For a fortnight, note every speculative thing you say in front of people more junior than you. Not in order to stop saying them, which would be worse, but to see the volume. Most people are surprised by the count and by how few they can recall the same afternoon.",
  reflection: "What did you wonder aloud recently in front of the people it affects?",
  recall: {
    q: "Why is a speculative remark from somebody senior received as an early signal, and why is the cost invisible to the speaker?",
    a: "Because the listener cannot tell a live thought from a decision in its early stages, and the person who would make the call has said it aloud, so preparing for the second reading is correct rather than an overreaction. It is invisible because the speaker spends no further time on it while the listener spends a week, and it resurfaces months later as a question about a plan that never existed."
  },
  deepDive: "I said something speculative in front of the people it affects. Help me write the label that stops it becoming a plan in their heads."
},
{
  id: "distance-across-incentives",
  track: "distance", level: "reply",
  title: "A peer team reads your request through what they are measured on",
  source: "Craft, and the observation that a cross-team request is evaluated against the recipient's scoreboard",
  gateIntro: "You are asking the data platform team to prioritise a schema change you need. Your message explains why it matters: it unblocks three customer commitments and removes a class of incident you have hit twice.\n\nAll of that is true and none of it is what they are measured on. Their quarter is graded on query latency and on migrating the warehouse, and your change makes both slightly worse before it makes anything better.",
  gatePrompt: "Write what this team's lead thinks after reading a message that is entirely about your quarter.",
  evidence: "No study. That teams evaluate incoming work against their own objectives is a structural fact of how organisations set goals rather than a psychological claim, and needs no evidence beyond the existence of quarterly commitments. The second half, that naming the cost yourself buys more credibility than any argument about your own priorities, is craft, and it is defended here by the observation that an uncosted request is functionally unbounded.",
  replication: "craft",
  cheat: "Name what the request costs them, in their units, before you explain why it matters to you.",
  idea: "State the cost to them and what the change does for the things they are graded on, because a request justified entirely by your own objectives asks somebody to take a loss for a benefit they do not book.",
  why: "Every team reads an incoming request against its own scoreboard, and the scoreboard is neither hidden nor cynical. It is what they will be asked about at the end of the quarter and what their own commitments are written in. A request that explains at length why it matters to you is supplying evidence for a case nobody is evaluating: they already accept that it matters to you, which is why you sent it.\n\nWhat they cannot tell from your message is the cost to them and whether you know what it is. The second part carries most of the weight, because a requester who has evidently not worked out what they are asking for is asking for an unbounded amount, and the safe response to an unbounded request is to defer it. Naming the cost yourself, accurately, is the cheapest credibility available, and it persuades better than any argument about your own priorities, because it demonstrates that you looked.\n\nThe honest version sometimes has no answer in it. Occasionally the request really is worse for them and better overall, in which case saying so plainly and taking it to whoever owns both is a real move, and a much stronger one than a longer message about your customer commitments.",
  failureMode: "The request is accepted in principle, scheduled late in the quarter, and quietly displaced twice. Nobody refused you. It simply never won a prioritisation conversation, because it was never entered into one on terms that could win.",
  worked: "\"I need the schema change, and I know it makes your quarter worse before it makes it better. Here is what I think it costs you.\n\nThe cost: about a week of somebody's time, which puts the warehouse migration back by roughly the same. It also adds a join to two hot query paths, which I think is a two to three per cent latency hit until the index lands. If those numbers are wrong they are probably wrong low, and I would like to be told.\n\nWhat it does for you: the incident class it removes is one your team gets paged for as often as mine does. Four times last quarter between us. That is the only part of this that touches your scoreboard rather than mine.\n\nIf the trade is not worth it from where you sit, I think this is a genuine prioritisation call between two teams rather than something you should absorb, and I am happy to take it to Ana with both sides written down. I would rather do that than have it sit at the bottom of your list for a quarter.\"\n\nThe request did not change. What changed is that it is stated in the currency the recipient is graded in, and the escalation is offered rather than threatened.",
  experiment: "Before your next cross-team request, write down what the other team is measured on this quarter. If you cannot, that is the work to do first, and it will take less time than the message you were about to send.",
  reflection: "What did you ask another team for recently, and do you know what it cost them?",
  recall: {
    q: "Why does explaining why a request matters to you fail to persuade another team, and what is the cheapest credibility available?",
    a: "Because they already accept that it matters to you, which is why you sent it, and they are evaluating it against their own scoreboard where your objectives are not booked. The cheapest credibility is naming the cost to them accurately yourself, since a requester who has not worked out the cost is implicitly asking for an unbounded amount and the safe response to that is deferral."
  },
  deepDive: "Here is a request I am sending to another team. Help me work out what it costs them in their own terms and say that before I say why I need it."
},
{
  id: "distance-the-customer",
  track: "distance", level: "record",
  title: "Anything you write to a customer is what the company said",
  source: "Craft, and the convention that external claims are written in the tense of what exists",
  gateIntro: "A customer has asked whether the new region will support their compliance requirement. You believe it will, because the design covers it and the work is scheduled.\n\nYour draft reply says: \"Yes, that's supported in the new region.\"\n\nThe region is not live, the certification has not been applied for, and you are the fourth person on this thread, three of whom do not work at your company.",
  gatePrompt: "Write what this customer's compliance officer puts in their own risk register on the strength of your sentence.",
  evidence: "No study, and none is needed for the mechanism: an external message loses its author, so the reader cannot weight it by who wrote it. The rest is convention from contract and compliance practice, where the distinction between designed, delivered and certified is load-bearing precisely because it is the distinction auditors test. This is craft in the sense of professional convention rather than in the sense of folklore.",
  replication: "craft",
  cheat: "Write external claims in the tense the thing is actually in. Designed to, not does, until it is in production for them.",
  idea: "Write to a customer in the tense the thing is actually in, because a present-tense sentence from anybody inside the company is received as a statement of what exists rather than of what is planned.",
  why: "An external message loses its author. Internally a claim carries the person who made it and everybody knows how to weight it, so shorthand works: yes that is supported means yes the design covers it and I am confident. Externally the same sentence arrives as a company position, gets copied into a document by somebody you will never meet, and is read months later by a third party with no access to your confidence level or your tense.\n\nThe compression that produces this is not carelessness. It is the ordinary habit of describing designed things in the present tense, which is how engineers talk to each other about systems that mostly exist. Crossing the boundary, that habit converts a plan into a commitment, and the conversion is invisible at the moment of writing, because the sentence is entirely true in the sense you meant it.\n\nThe cost lands on somebody else and much later. Your sentence goes into their risk register, their auditor reads it, their own commitments get built on it, and the correction when it comes is not a clarification. It is a company having said something that was not so.",
  failureMode: "Four months on, their auditor asks for the certification, it does not exist, and the conversation is no longer about a region. It is a trust conversation with your account team in it, and the sentence underneath it took nine seconds to write.",
  worked: "\"Short answer: it is designed to support it and it is not certified yet. I want to be precise about which is which.\n\nWhat is true today: the region is not live. The architecture covers your requirement and that was a design input rather than something being retrofitted.\n\nWhat is not true yet: certification has not been applied for. I do not have a date and I would not want you planning against one from me.\n\nWhat I will do: get the certification timeline from the person who owns it and come back to you by the end of next week with either a date or an honest statement that there is not one.\n\nIf you need something in writing for your own compliance process, tell me what it has to say and I will find out whether we can say it rather than guess.\"\n\nThe answer is still substantially yes. What changed is that the customer can now tell which part is architecture and which part is a certificate, which is the entire distinction their auditor cares about.",
  experiment: "Take your last three external messages and mark every present-tense claim about the product. For each, ask whether it is true today, in production, for this customer. The ones that are not are commitments you made without deciding to make them.",
  reflection: "What did you tell a customer was supported, in the present tense, that is not live?",
  recall: {
    q: "Why does an internal shorthand turn into a commitment when it crosses to a customer?",
    a: "Because an external message loses its author, so the sentence arrives as a company position rather than as one person's confidence, and it is copied into documents read months later by third parties with no access to either. The habit that causes it is describing designed systems in the present tense, which is normal internally and converts a plan into a commitment on the way out."
  },
  deepDive: "Here is a reply I am sending to a customer. Mark every present-tense claim and tell me which are not true in production today."
},
{
  id: "distance-the-forward",
  track: "distance", level: "record",
  title: "Write the internal message as though the team in it will read it",
  source: "Craft, and the observation that the sentence which travels furthest is the sharpest one",
  gateIntro: "You are writing to your manager about why the integration slipped. The honest account involves another team missing two commitments, and you have written: \"We lost three weeks waiting on the platform team, who have consistently under-delivered on their commitments this quarter.\"\n\nIt is accurate. You are also aware that your manager pastes these summaries into the weekly leadership note without editing them.",
  gatePrompt: "Write what happens when the platform team's director reads this in the leadership note on Monday.",
  evidence: "No study. That internal messages travel is a matter of observation rather than research, and the distinction argued here, between an event and a characterisation of the team that caused it, is craft. What supports it is that the two survive different audiences: dates and missed commitments are checkable by anybody, and a judgement about a team is defensible only where the context is shared.",
  replication: "craft",
  cheat: "Separate the fact from the characterisation and send only the fact. The characterisation adds no information and carries all the risk.",
  idea: "Describe another team's failure in terms you would use in front of them, because internal messages travel and a characterisation that was defensible in private becomes a claim you have to hold in public.",
  why: "An internal message has no natural boundary. It gets forwarded, pasted into a summary, quoted in a review and occasionally read aloud, and the part that travels furthest is usually the sharpest sentence in it, because that is the quotable one. You are not writing to your manager. You are writing to your manager and to an unknown set of people downstream of them, and you do not control who is in that set.\n\nThe distinction worth holding is between the event and the characterisation. Two missed commitments is a fact and it survives any audience. A phrase describing a team's general performance is a judgement, and it is the kind of judgement you can defend in a private conversation with somebody who shares the context and cannot defend in a leadership note where that team's own director is reading it cold. The first costs nothing to write in public. The second costs you a relationship and, more practically, costs your account of the slip its credibility, because a reader who works with that team will discount the whole message on the strength of the one sentence they can see is unfair.\n\nThis is not an argument for softening. The facts should be exactly as hard as they are. It is an argument that the characterisation adds no information to the facts and carries all of the risk.",
  failureMode: "The platform director reads it on Monday, replies in the thread with context you did not have about why their dates moved, and your account of the slip is now in dispute. The three weeks were real and they are no longer what the conversation is about.",
  worked: "\"The integration slipped three weeks. The cause was a dependency on the platform team's credential work, which was committed for the 8th and landed on the 29th.\n\nWhat I did about it: escalated on the 12th, agreed a workaround on the 15th that did not survive testing, and moved two people onto the reconciliation work so the time was not entirely lost.\n\nWhat I would do differently: I planned as though the 8th was firm when it had already moved once, and I should have carried contingency from the point it first moved rather than from the point it moved again.\n\nIf the pattern matters, this is the second quarter running that we have been blocked on that dependency, and that is worth a conversation between me and Ravi rather than a line in an update.\"\n\nThe facts are harder than in the original rather than softer: two specific dates and a named repeat. The pattern is raised as a conversation to have instead of a verdict already delivered, which is the version that survives being read by the person it is about.",
  experiment: "Take your last three internal messages describing another team's failure and mark each sentence as fact or characterisation. Then imagine each read aloud with that team's lead in the room. The facts survive it and the characterisations do not, which is a reliable enough test to run while you are still writing.",
  reflection: "What did you write about another team that you would not have written with them reading?",
  recall: {
    q: "What distinction determines whether an internal account survives being forwarded, and why does a characterisation cost you the facts as well?",
    a: "The distinction between the event and the characterisation: dates and missed commitments are checkable and survive any audience, while a judgement about a team is defensible only where the context is shared. The characterisation costs you the facts too, because a reader who works with that team discounts the entire message on the strength of the one sentence they can see is unfair."
  },
  deepDive: "Here is an internal message describing another team's failure. Mark what is fact and what is characterisation, and rewrite it as though they will read it."
}

(window.LESSONS = window.LESSONS || []).push(
{
  id: "commitment-estimative-words",
  track: "commitment", level: "record",
  title: "Likely is a number, and everyone reading is using a different one",
  source: "Sherman Kent on words of estimative probability, and the replications that followed",
  gateIntro: "You are writing the risk section of a launch readiness document that goes to four teams and to the exec sponsor.\n\nYour draft says: \"There is a real possibility that the migration will need to be rolled back, and it is unlikely that we would be able to do this without customer-visible downtime.\"\n\nYou meant roughly a one in four chance of rollback, and roughly one in ten of doing it cleanly if it happens.",
  gatePrompt: "Write what each of the four teams puts into their own contingency planning after reading this.",
  evidence: "Kent's complaint at CIA in the 1960s was that estimative words were read as very different numbers by different readers, and the observation has been reproduced many times since. Modern demonstrations ask people to assign percentages to terms like likely, probable and real possibility, and consistently find ranges spanning tens of points for the same word, with some terms read as both more and less than even by different people. Sample composition varies and so do the exact ranges. That the ranges are wide is not in dispute. The particular numbers attached to any given word are.",
  replication: "replicated",
  cheat: "Put a number or a range on any probability word that carries weight. Likely is read as anything from a coin flip to near certainty.",
  idea: "Attach a number or a range to any probability word that carries weight, because the same word is converted into a wide spread of different values and you never find out which one your reader used.",
  why: "Estimative words feel precise to the writer because the writer converted a number into the word and can convert it back. The reader is performing a different operation, turning a word into a number with no access to the original, and the conversions people make are spread across enormous ranges. The same term is read as both more and less likely than even by different readers of one sentence, which means a room can agree on your wording and disagree completely about what you said.\n\nThis is most expensive in a risk section, where the ranges matter most and are widest. A phrase doing the work of a decision input gets converted privately by each team, who then plan against their private conversion and never state it. You get consensus on the document and divergence in the plans, and the divergence surfaces during the rollback, which is the worst available moment to discover that four teams were working to four different numbers.\n\nThe objection to numbers is that they imply a precision you do not have. That objection is answered by a range with its basis attached. Roughly one in four, from two comparable migrations, is not a claim to precision. It is a claim to having thought about it, and it is auditable in a way that a phrase is not.",
  failureMode: "Rollback happens. Two teams had planned for it and two had read the qualifier as effectively not going to happen, and the argument in the incident channel is about who should have been ready rather than about the system. Everybody read the same sentence.",
  worked: "\"Rollback risk: I put it at roughly one in four, based on two comparable migrations, one of which rolled back.\n\nIf we do roll back, I put the chance of doing it without customer-visible downtime at well under one in ten. Treat downtime as the planning assumption rather than as the bad case.\n\nBoth of those are judgements rather than measurements and I am happy to be argued out of either. What I am not comfortable with is four teams planning against four different readings of a phrase, which is what the previous draft of this section produced.\n\nWhat I need from each team: a contingency that assumes rollback with downtime, by the 20th. If you think one in four is wrong, say so before the 20th rather than after.\"\n\nThe uncertainty is unchanged and is now shared. The last paragraph is what converts a probability statement into something teams can be held to.",
  experiment: "Take a document you wrote containing likely, unlikely, possible or probable, and ask three colleagues separately what percentage each word meant, without letting them discuss it. The spread you get back is the spread you have been shipping.",
  reflection: "What did you describe as likely or unlikely recently, and what number did you mean?",
  recall: {
    q: "Why does an estimative word feel precise to the writer and not to the reader, and what answers the objection that numbers imply false precision?",
    a: "Because the writer converted a number into the word and can convert it back, while the reader converts a word into a number with no access to the original, and those conversions span enormous ranges. The objection is answered by a range with its basis attached: roughly one in four from two comparable migrations claims no precision, only that you thought about it, and it is auditable in a way a phrase is not."
  },
  deepDive: "Here is a risk section with probability words in it. For each, ask me what number I meant, then rewrite it with ranges and their basis."
},
{
  id: "commitment-the-conditional-heard-as-a-promise",
  track: "commitment", level: "reply",
  title: "If all goes well is dropped in transit and the second half is kept",
  source: "Craft, and the observation that a conditional does not survive being restated",
  gateIntro: "A customer success manager asks whether the export fix will be in before their customer's quarter-end.\n\nYour draft: \"If the review goes smoothly and we don't hit anything unexpected in staging, we should be able to get that out the week before.\"\n\nYou consider this appropriately conditional. There are two conditions in it and you believe each is about eighty per cent likely.",
  gatePrompt: "Write the sentence this manager says to the customer on their call tomorrow.",
  evidence: "No study. That conditions are stripped in retelling is an observation rather than a finding, and it is the kind of thing that would be difficult to measure outside a lab and uninteresting inside one. The arithmetic half needs no evidence: two independent conditions at eighty per cent give roughly two in three, and the gap between that and what the phrasing conveys is a matter of calculation.",
  replication: "craft",
  cheat: "Split the commitment from the conditions. Whatever sits in the main clause is what survives three retellings.",
  idea: "State what you are committing to unconditionally in one sentence and put the conditions in another with what happens if they fail, because a conditional is stored by the reader as its second half and the conditions are discarded in transmission.",
  why: "A conditional is a compact object for the person who built it and a fragile one for everybody downstream. The reader is not going to carry your conditions forward, because they are about to restate this to somebody who wants an answer, and conditions do not survive restatement. What survives is the date. Each retelling strips a little more, and by the third the sentence has become a commitment with your name attached to it.\n\nThe arithmetic makes it worse than it feels. Two conditions you each believe at eighty per cent give you roughly a two in three chance, which is nothing like what a phrase such as should be able to conveys, and it is certainly not what a customer hears through two intermediaries. You have expressed a two-thirds probability in language that gets filed as a plan.\n\nThe move is not to refuse conditionals, which are often the honest shape of an answer. It is to separate the commitment from the conditions structurally, so that the part surviving transmission is a part you would defend, and to say what happens if a condition fails, because that is the sentence that makes the conditions worth carrying at all.",
  failureMode: "The customer is told the week before. Review takes four days longer, the date moves, and the conversation is now about a missed commitment rather than about a condition that failed, because nobody outside your head ever held the conditions.",
  worked: "\"What I will commit to: it is out before their quarter-end. I am confident about that and you can say it.\n\nWhat I will not commit to: the specific week. My best case is the week before, and that needs the review to go cleanly and staging to be uneventful. I would put both together at about two in three, which is not good enough for a customer date.\n\nIf either slips you hear from me the same day rather than the week after, and the fallback is still inside their quarter.\n\nSo the sentence to use on the call is that it lands before quarter-end and we are aiming for the week before. Please do not give them the week before as the date.\"\n\nThe conditions are still there. What changed is that the sentence which will survive three retellings is one you would defend, and the last paragraph hands the intermediary the exact wording.",
  experiment: "Take three conditional commitments you made this month, estimate each condition, and multiply them. Compare the product with the confidence your phrasing conveyed. Most people find they have been expressing something near a coin flip in the language of a plan.",
  reflection: "What did you say you should be able to do, and what did the other person write down?",
  recall: {
    q: "Why do the conditions in a conditional commitment fail to survive, and what does the arithmetic of two conditions actually look like?",
    a: "Because the reader is about to restate it to somebody who wants an answer and conditions do not survive restatement, so each retelling strips more until the second half is a date with your name on it. Two conditions you each put at eighty per cent give roughly two in three overall, which is nothing like what should be able to conveys, let alone what a customer hears through two intermediaries."
  },
  deepDive: "Here is a conditional commitment I am about to make. Tell me what survives three retellings and help me split the commitment from the conditions."
},
{
  id: "commitment-say-what-you-cannot-say",
  track: "commitment", level: "record",
  title: "Name the limits of what you know, or your confidence is applied to all of it",
  source: "Craft, and the convention in incident reporting that scope is stated rather than implied",
  gateIntro: "You are writing the preliminary incident summary two hours after recovery. You know the trigger and you know the blast radius, and you do not yet know whether any customer received an incorrect response during the window.\n\nYour draft covers the first two in detail and does not mention the third, because you have no answer and you did not want to speculate.",
  gatePrompt: "Write what a reader who needs to brief a customer concludes about data correctness from this summary.",
  evidence: "No study. Stating scope explicitly is convention in incident and analytical reporting, adopted because the alternative failure is common and expensive rather than because anybody measured it. The mechanism argued here, that a reader cannot see the shape of an omission and therefore extends the confidence of what is present, is an inference from how any authoritative document is read and is not itself evidenced.",
  replication: "craft",
  cheat: "State the open questions and when they close. An omission reads exactly like a clean result to anybody who was not there.",
  idea: "State what you do not know as explicitly as what you do, because a reader cannot distinguish an unaddressed question from a settled one and will extend the confidence of the parts you wrote to the parts you left out.",
  why: "An account written with authority transfers that authority to everything inside its boundary, including the parts that are not there. A reader cannot see the shape of what you omitted. They see a detailed, competent summary and infer that anything genuinely alarming would have been in it, which is a reasonable inference and precisely the one you did not intend to invite.\n\nLeaving out the unknown feels like restraint. You did not want to speculate, and speculation in an incident summary is a real error, so omission looks like the disciplined choice. There is a third option that is neither speculation nor silence: state the question, state that it is open, and state when it closes. That is scope rather than speculation, and it is the only thing that stops a reader assuming the question was asked and answered.\n\nGetting this wrong compounds, because the person most likely to act on your summary is the one furthest from it. Somebody briefing a customer needs to know which parts of your account are load-bearing, and an omission reads identically to a clean result.",
  failureMode: "Somebody tells a customer that no data was affected, on the reasonable basis that the summary did not say otherwise. Three days later the analysis finds two hundred incorrect responses, and it is now a correction to a customer rather than a finding, which is a different category of event.",
  worked: "\"Preliminary, two hours after recovery. Two things are established and one is open. Please read the open one before briefing anybody.\n\nEstablished: the trigger was the connection pool exhausting after the config change at 14:02. Blast radius was the two EU shards, roughly forty minutes.\n\nOpen, and this is the one that matters: I do not yet know whether any customer received an incorrect response during the window. It is possible and I cannot currently rule it out. I expect an answer by Thursday morning.\n\nWhat that means today: do not tell anybody data was unaffected. If you need to say something now, say the incident is contained, the cause is known, and the data question is still being checked.\n\nI will post the answer in this thread on Thursday either way, including if it is still open.\"\n\nNothing was speculated. What was added is the shape of the gap, which is what stops the confident parts from being extended to the part with no answer yet.",
  experiment: "Take the last summary you wrote of something in progress and list the questions a reader might reasonably think it answered. Then check which you actually addressed. The difference is confidence you lent to things you had not established.",
  reflection: "What did you leave out of a summary because you did not have an answer?",
  recall: {
    q: "Why does omitting an unknown from an authoritative summary mislead, and what is the third option between speculating and staying silent?",
    a: "Because the reader cannot see the shape of the omission and reasonably infers that anything alarming would have been included, so the confidence of the written parts extends to the missing one. The third option is scope rather than speculation: state the question, state that it is open, and state when it closes."
  },
  deepDive: "Here is a summary I wrote of something still in progress. Tell me what a reader would assume it answers that it does not."
},
{
  id: "commitment-name-who-decided",
  track: "commitment", level: "broadcast",
  title: "A decision has been made is read as nobody will own this",
  source: "Craft, and the observation that an unattributed decision produces a search rather than a response",
  gateIntro: "You are announcing that the team will stop supporting the legacy API at the end of the quarter. It is a good decision, you agree with it, and it was made by you and two other people in a meeting last week.\n\nYour draft: \"A decision has been made to sunset the legacy API at the end of Q3. The team will be focusing on the v2 surface going forward.\"\n\nThere is no name anywhere in it.",
  gatePrompt: "Write what a reader who disagrees with this does next, and who they think they should be talking to.",
  evidence: "No study. That the passive removes the information a dissenter needs is a matter of what the sentence contains rather than a psychological claim. The downstream effects described here, a search for the real decider and a decision treated as provisional, are craft, reported consistently and measured by nobody, and the second is genuinely hard to separate from the ordinary politics of any contested decision.",
  replication: "craft",
  cheat: "Put a name on the decision, your own included, and say what would change your mind. Unattributed decisions get reopened by whoever pushes hardest.",
  idea: "Name who made the decision and who can be argued with, because an unattributed decision is read as one nobody will defend and produces a search for the real decider rather than a response to the decision.",
  why: "The passive voice in an announcement removes the one piece of information a reader needs in order to do anything other than comply. Somebody who disagrees, or who holds information you did not have, cannot act on a decision with no author. What they do instead is go looking, asking around to establish who actually decided, and that search costs more than the conversation would have and happens entirely outside your view.\n\nThe second effect is on how the decision gets weighted. A named decision has somebody standing behind it, which signals that it was made deliberately and can be defended. An unattributed one reads as having emerged, and things that emerge are treated as reversible by whoever pushes hardest, because there is no visible cost to reopening them. The anonymity you reached for in order to make the announcement sound institutional instead makes it sound provisional.\n\nWriters use the passive here for an understandable reason: naming yourself as the decider on something unpopular feels like inviting the argument. It is inviting the argument, and the argument is going to happen either way. The only variable is whether it happens with you, in the open, this week, or without you, in other channels, for a month.",

  gateIntro: "Six weeks ago you told a support lead you would go deep on four tenant cost anomalies they reported, and that you would come back to them.\n\nYou did go deep. It turned out to be one cause rather than four, the fix shipped a fortnight ago, and you never sent the message, because by the time it was done it felt like old news.\n\nThey have not asked.",

  replication: "craft",
  cheat: "Send the return even when it is late and stale. The reporter can observe your silence and cannot observe your fix.",

  worked: "\"Closing the loop on the four tenant anomalies you sent in June. This is late and I should have sent it two weeks ago when the fix went out.\n\nWhat it turned out to be: one cause, not four. All four were hitting the same unbounded query on the audit path, which only appears for tenants above a certain object count, which is why it looked tenant-specific. Yours were the first four to cross that line.\n\nWhat happened: fix shipped on the 14th. Cost on those four is back to roughly where it was in April, and the same fix removes the problem for about thirty other tenants before they reach it.\n\nWhat I want you to take from this: your report is what made it findable. Four instances across four tenants is what turned an oddity into a pattern, and none of us would have got there from one. Please keep sending them.\"\n\nThe last paragraph is the actual message. Everything above it is the evidence that makes it credible.",

  idea: "Work out which of the four failure points the message hit before resending anything, because a second attempt repairs only one of them and a reference to the first attempt makes two of them worse.",
  why: "A message that produced no change failed at one of four places, and they need different repairs. It was not seen, which is a channel and timing problem. It was seen and not read, which is an opening problem. It was read and not understood as applying to the reader, which is the category-versus-name problem. Or it was read, understood and not acted on, which means the action is harder than you think or something else is blocking it. Resending repairs only the first.\n\nPointing out that you said it three weeks ago does damage of its own. It converts an information problem into an accusation, and everybody who genuinely did not see it, which is most of them, now knows you believe they ignored you. It also tells anybody blocked by a real obstacle that reporting the obstacle will be received as an excuse, which closes the one channel through which you would have discovered what is actually wrong.\n\nThe cheapest diagnostic is to ask three people still on the old path what happened, individually, with no implication that they were at fault. In practice the answer is usually the fourth failure: the new path does not work for some case you did not know about, and the message was fine all along.",
  failureMode: "You send the second announcement. Old-path deploys drop slightly and then recover, and you conclude the team is resistant to change. The actual cause is that the new path does not support the one service that deploys most often, and the person who knows this has decided that saying so now would sound like an excuse.",

  replication: "craft",

  failureMode: "The next design forum gets less argument rather than more. The people who were right last time are still there and still competent, and have concluded that winning on the merits produces no visible outcome, so they say the thing once and let it go. That is precisely the failure the forum exists to prevent.",

      if (c === '(' || c === ')') { out.push({ t: c }); i++; continue; }
      if (PREC[c]) { out.push({ t: 'op', v: c }); i++; continue; }
      throw new Error('unexpected "' + c + '" at position ' + i);
    }
    if (!out.length) throw new Error('empty expression');
    return out;
  }

  /* Shunting-yard. `expectOperand` is what rejects the shapes that tokenise
     cleanly but are not arithmetic: two values in a row, a doubled operator
     such as **, or a bracket opening straight after a value, which is how a
     function call would have to look. */
  function toRPN(tokens) {
    var out = [], ops = [], expectOperand = true, i, tk, top;
    for (i = 0; i < tokens.length; i++) {
      tk = tokens[i];
      if (tk.t === 'num' || tk.t === 'name') {
        if (!expectOperand) throw new Error('two values in a row near "' + tk.v + '"');
        out.push(tk);
        expectOperand = false;
      } else if (tk.t === 'op') {
        if (expectOperand) {
          if (tk.v !== '-' && tk.v !== '+') throw new Error('"' + tk.v + '" needs a value before it');
          out.push({ t: 'num', v: 0 });          // unary: -x becomes 0 - x
          ops.push(tk);
        } else {
          while (ops.length) {
            top = ops[ops.length - 1];
            if (top.t === 'op' && PREC[top.v] >= PREC[tk.v]) out.push(ops.pop());
            else break;
          }
          ops.push(tk);
        }
        expectOperand = true;
      } else if (tk.t === '(') {
        if (!expectOperand) throw new Error('a bracket cannot follow a value');
        ops.push(tk);
        expectOperand = true;
      } else {
        if (expectOperand) throw new Error('empty brackets');
        while (ops.length && ops[ops.length - 1].t !== '(') out.push(ops.pop());
        if (!ops.length) throw new Error('unbalanced brackets');
        ops.pop();
        expectOperand = false;
      }
    }
    if (expectOperand) throw new Error('expression ends with an operator');
    while (ops.length) {
      top = ops.pop();
      if (top.t === '(') throw new Error('unbalanced brackets');
      out.push(top);
    }
    return out;
  }

  function compile(src) { return toRPN(tokenize(src)); }

  function names(src) {
    var seen = {}, out = [];
    tokenize(src).forEach(function (tk) {
      if (tk.t === 'name' && !seen[tk.v]) { seen[tk.v] = 1; out.push(tk.v); }
    });
    return out;
  }

  /* Returns null rather than NaN for a missing field or a division by zero.
     A NaN would render as "NaN" and read as a computed answer. */
  function run(src, vars) {
    var rpn = compile(src), st = [], i, tk, a, b, v;
    for (i = 0; i < rpn.length; i++) {
      tk = rpn[i];
      if (tk.t === 'num') { st.push(tk.v); continue; }
      if (tk.t === 'name') {
        v = vars ? vars[tk.v] : undefined;
        if (typeof v !== 'number' || !isFinite(v)) return null;
        st.push(v);
        continue;
      }
      b = st.pop();
      a = st.pop();
      if (tk.v === '+') st.push(a + b);
      else if (tk.v === '-') st.push(a - b);
      else if (tk.v === '*') st.push(a * b);
      else if (b === 0) return null;
      else st.push(a / b);
    }
    v = st.pop();
    return (typeof v === 'number' && isFinite(v)) ? v : null;
  }

  return { compile: compile, names: names, run: run, tokenize: tokenize };
});

</script>
<script>
/* ==========================================================================
   Daily — the reader

   Speaks a rendered entry aloud through the browser's own synthesiser. Nothing
   is fetched and nothing is stored, which is the only way a corpus this size
   gets an audio track at all: narrated as files the shared corpus runs to tens
   of hours, and a built page has to stay one self-contained file that works
   offline.

   The reader is handed text and speaks it. It never reads the corpus itself,
   and that division is load-bearing. app.js hands it only blocks that are on
   screen, and a locked entry returns before its body is built, so gated prose
   is not withheld here - it does not exist to be read. The recall answer is
   never part of an entry at all. Neither rule is enforced in this file and
   neither needs to be.

   Every utterance is short. Chrome stops synthesising after roughly fifteen
   seconds of a single utterance, reports no error, and leaves the queue
   looking healthy, so a paragraph handed over whole goes quiet halfway and
   nothing says why. Splitting to sentences keeps every utterance well inside
   that limit, which fixes it without a timer fighting the browser for control.
   ========================================================================== */
(function () {
  'use strict';

  var API = window.speechSynthesis;
  var Utterance = window.SpeechSynthesisUtterance;
  var NAV = window.navigator;
  var AVAILABLE = !!(API && Utterance);

  /* Only ever asked in this direction. navigator.onLine reports whether a
     network interface exists, not whether anything is reachable, so a true is
     worth nothing: a captive portal, a router with no uplink and a dead
     endpoint all report it. A false is the one answer it gets right, and it is
     the only one needed here. Compared against false explicitly so a browser
     that does not implement the property reads as online rather than as
     permanently offline. */
  function offline() {
    return !!NAV && NAV.onLine === false;
  }

  /* Long enough that the splits fall on real sentence ends most of the time,
     short enough that even the slowest voice finishes one inside the limit. */
  var MAX_CHUNK = 200;

  var voice = null;
  var queue = [];
  var at = 0;
  var mode = 'idle';                    // idle | playing | paused
  var hooks = {};

  /* Bumped by everything that ends a read. A cancelled utterance still fires
     onend or onerror, and without this the handler advances a queue that has
     already been replaced, which starts the next entry reading itself. */
  var gen = 0;

  /* --- Splitting ---------------------------------------------------------- */
  function split(text) {
    var clean = String(text == null ? '' : text).replace(/\s+/g, ' ').trim();
    var out = [];
    if (!clean) return out;

    var re = /[^.!?]+[.!?]*/g;
    var m;
    while ((m = re.exec(clean)) !== null) {
      var s = m[0].trim();
      if (s) push(out, s);
    }
    return out;
  }

  /* A sentence long enough to trip the limit is broken again at its last
     clause boundary. Cutting mid-clause is audible as a stumble, so a sentence
     with nowhere good to break goes over whole: a rare long utterance beats a
     reliable wrong pause. */
  function push(out, s) {
    if (s.length <= MAX_CHUNK) { out.push(s); return; }

    var cut = -1;
    ['; ', ': ', ', ', ' - '].forEach(function (mark) {
      var found = s.lastIndexOf(mark, MAX_CHUNK);
      if (found !== -1 && found + mark.length > cut) cut = found + mark.length;
    });

    if (cut === -1) { out.push(s); return; }
    out.push(s.slice(0, cut).trim());
    push(out, s.slice(cut).trim());
  }

  /* --- Voice --------------------------------------------------------------
     Nothing in the API reports how good a voice sounds, so the name is the
     only evidence there is. The tiers matter more than they look: a Mac offers
     around forty-seven English voices, most of them the 1990s concatenative
     set and a dozen of them novelty toys, so taking the first of anything is a
     coin flip that can land on Zarvox.

     Neural voices say so in their names. macOS ships its good ones as Premium
     or Enhanced downloads, Chrome's network voices are the Google family, and
     Edge exposes Microsoft's as Natural or Online. Anything unmarked falls
     through to whatever the browser itself calls default, which is at least a
     choice rather than a stumble, and then to no preference at all. Guessing
     is what produces the toys, so the last tier declines to guess. */
  var TIERS = [
    /premium|enhanced|neural|natural/i,
    /^(google|microsoft)\b/i
  ];

  function pickVoice() {
    var all = API.getVoices() || [];
    if (!all.length) return;

    var en = all.filter(function (v) { return /^en([-_]|$)/i.test(v.lang); });
    /* A voice that is served over the network cannot work with the network
       down, so it is dropped from the running rather than chosen and then
       failed on. This is what keeps the tiers below from trading away the one
       property these pages are built on. */
    if (offline()) en = en.filter(function (v) { return v.localService; });
    if (!en.length) { voice = null; return; }

    /* Local wins inside a tier but never across one. A downloaded Premium beats
       a Google voice that needs the network, and a Google voice beats the local
       1990s set: these pages are built to work offline, but not at the price of
       sounding like a train announcement when something better is installed. */
    function best(pool) {
      var local = pool.filter(function (v) { return v.localService; });
      return (local.length ? local : pool)[0];
    }

    for (var i = 0; i < TIERS.length; i++) {
      var tier = en.filter(function (v) { return TIERS[i].test(v.name); });
      if (tier.length) { voice = best(tier); return; }
    }

    voice = en.filter(function (v) { return v.default; })[0] || null;
  }

  /* getVoices() is empty until the list loads, and browsers disagree about
     whether voiceschanged fires when it was already populated. Both paths ask. */
  if (AVAILABLE) {
    pickVoice();
    API.addEventListener('voiceschanged', pickVoice);
  }

  /* --- Queue --------------------------------------------------------------- */
  function announce(next) {
    mode = next;
    if (hooks.onState) hooks.onState(next);
  }

  function finish() {
    gen += 1;
    queue = [];
    at = 0;
    if (hooks.onPart) hooks.onPart(-1);
    announce('idle');
  }

  function step() {
    /* The one place a read is known to have reached the end, and so the only
       place onDone fires. stop() and a refused utterance both land in finish()
       as well, and neither of those means the entry was heard through -
       collapsing the three would have pressing Stop start the next entry. */
    if (at >= queue.length) {
      finish();
      if (hooks.onDone) hooks.onDone();
      return;
    }

    var mine = gen;
    var item = queue[at];
    if (at === 0 || item.part !== queue[at - 1].part) {
      if (hooks.onPart) hooks.onPart(item.part);
    }

    var u = new Utterance(item.text);
    if (voice) { u.voice = voice; u.lang = voice.lang; }
    u.onend = function () {
      if (gen !== mine) return;
      at += 1;
      step();
    };
    /* Cancellations arrive here too and the generation check has already
       swallowed those, so anything reaching the body is a voice that will not
       speak. The read ends rather than stuttering through the rest of the
       queue in silence, and the caller is told which kind of failure it was.

       Worth separating because only one of the two has anything the reader can
       act on. A network voice fails whenever the endpoint does not answer, and
       navigator.onLine cannot see most of the ways that happens - a captive
       portal reports itself as online - so this is where those cases surface
       rather than in the guard above. */
    u.onerror = function () {
      if (gen !== mine) return;
      var networked = !!(voice && !voice.localService);
      finish();
      if (hooks.onFail) hooks.onFail(networked ? 'network' : 'voice');
    };
    API.speak(u);
  }

  /* --- Public ------------------------------------------------------------ */
  function stop() {
    if (!AVAILABLE) return;
    gen += 1;
    queue = [];
    at = 0;
    API.cancel();
    if (mode !== 'idle') {
      if (hooks.onPart) hooks.onPart(-1);
      announce('idle');
    }
  }

  /* parts is [{ text }] in the order they should be heard. Anything else on
     those objects is the caller's and is passed back untouched by index.

     Returns false rather than starting where nothing would come out. A browser
     can carry the whole synthesis API and have no voice behind it - Chrome on
     a Linux box with no speech-dispatcher is the usual one - and in that state
     speak() is accepted, never finishes, and never errors. Left alone the
     button sits on Pause for a read that was never going to happen, so the
     caller is told instead. */
  function speak(parts, opts) {
    if (!AVAILABLE) return false;
    stop();
    if (!(API.getVoices() || []).length) return false;

    /* Re-chosen at the moment of use rather than watched for. Connectivity and
       the voice list can both have moved since boot, and one filter over a few
       dozen voices per click is cheaper than keeping online, offline and
       voiceschanged handlers honest between them. */
    pickVoice();

    hooks = opts || {};
    queue = [];
    (parts || []).forEach(function (p, i) {
      split(p.text).forEach(function (text) { queue.push({ text: text, part: i }); });
    });
    if (!queue.length) return false;

    at = 0;
    announce('playing');
    step();
    return true;
  }

  function pause() {
    if (mode !== 'playing') return;
    API.pause();
    announce('paused');
  }

  function resume() {
    if (mode !== 'paused') return;
    API.resume();
    announce('playing');
  }

  /* Chrome can restore a page with the synthesiser still parked in the paused
     state it was in when the page left, and every later speak() lands in it
     silently. Clearing on the way in and on the way out costs nothing. */
  if (AVAILABLE) {
    API.cancel();
    window.addEventListener('pagehide', stop);
  }

  window.SPEECH = {
    available: AVAILABLE,
    speak: speak,
    stop: stop,
    pause: pause,
    resume: resume,
    state: function () { return mode; },
    split: split,                       // exposed for the test harness only
    voice: function () { return voice; }
  };
})();

</script>
<script>
/* ==========================================================================
   Daily — shared engine

   One engine, many sites. Everything that differs between sites lives in
   window.SITE: the storage key, the tracks, the second facet, every string
   of visible copy, the review model, the commitment gate and whether the
   forecast book exists at all.

   State lives in localStorage under one versioned key. Nothing here talks to
   the network, so a built page works offline and forever.
   ========================================================================== */
(function () {
  'use strict';

  var SITE = window.SITE || {};
  var LESSONS = window.LESSONS || [];
  var EXPR = window.EXPR;                    // engine/expr.js, loaded before this
  var SPEECH = window.SPEECH;                // engine/speech.js, same

  var KEY = SITE.key;
  var TRACKS = SITE.tracks || [];
  var LEVELS = SITE.levels || {};
  var COPY = SITE.copy || {};
  var GATE = SITE.gate || null;
  var PROMPT = SITE.prompt || {};

  var HAS_REVIEW = SITE.review !== 'none';
  var HAS_EXPIRY = SITE.expiry === true;
  var HAS_FORECAST = SITE.forecastBook === true;
  var HAS_EVIDENCE = SITE.evidenceGate === true;
  /* Two ways to earn a cheatsheet row, because the sites disagree about what
     "worth acting on from memory" can even mean.

     Where the corpus carries a replication verdict, the filter is derived:
     `cheatsheet: { verdicts: ['replicated'] }` and the corpus decides. Nobody
     is exercising judgement, which is the point - Nomogram refuses to let the
     author grade their own evidence, and the cheatsheet must not be the hole
     in that.

     Where it does not, there is nothing to derive from, so the row is opt-in:
     `cheatsheet: true`, and an entry appears if the author wrote it a line.
     That is editorial and the page says so rather than dressing a selection up
     as a filter. */
  var CHEAT = SITE.cheatsheet || null;
  var CHEAT_VERDICTS = CHEAT && CHEAT.verdicts ? CHEAT.verdicts : null;
  var HAS_CHEAT = !!CHEAT && (!CHEAT_VERDICTS || HAS_EVIDENCE);

  function onCheatsheet(l) {
    return CHEAT_VERDICTS ? CHEAT_VERDICTS.indexOf(l.replication) !== -1 : !!l.cheat;
  }

  /* Expiry retires a claim the author already knew would rot. This retires the
     author's confidence in a claim they thought was settled, which is where
     checking actually finds the failures. Nothing leaves the sequence: a stale
     citation is still true more often than not, it is just no longer checked. */
  var REVERIFY_DAYS = SITE.reverifyDays || 0;

  function stale(l) {
    if (!REVERIFY_DAYS || !l.verifiedOn) return false;
    return shift(l.verifiedOn, REVERIFY_DAYS) < today();
  }

  function evidenceHTML(l) {
    var h = '<div class="evidence" data-rep="' + esc(l.replication) + '"' +
      (stale(l) ? ' data-stale="1"' : '') + '>';
    h += '<p class="block__label">' + esc(COPY.labelEvidence || 'The evidence') + '</p>';
    h += '<p class="evidence__cite" data-speak="evidence">' + esc(l.evidence) + '</p>';
    if (l.interval && typeof l.interval.lo === 'number' && typeof l.interval.hi === 'number') {
      h += '<p class="evidence__interval">' + esc(l.interval.measure || 'interval') + ' ' +
        l.interval.lo + ' to ' + l.interval.hi + '</p>';
    }
    h += '<p class="evidence__meta">';
    h += '<span class="rep-chip">' + esc(REP_LABEL[l.replication] || l.replication) + '</span>';
    if (l.replication === 'statute' && l.asAt) {
      h += '<span class="evidence__asat">as at ' + esc(shortDate(l.asAt)) + '</span>';
    }
    if (stale(l)) {
      h += '<span class="evidence__stale">' +
        esc(COPY.staleNote || 'not re-checked since ' + shortDate(l.verifiedOn)) + '</span>';
    }
    h += '</p></div>';
    return h;
  }

  var REP_LABEL = {
    replicated:  'Replicated',
    single:      'One study, never repeated',
    contested:   'Contested',
    failed:      'Failed to replicate',
    overclaimed: 'Real, but overclaimed',
    craft:       'Craft, no trial behind it',
    statute:     'Statute'
  };

  /* ------------------------------------------------------------------------
     THE POLICY DIAL

     This one function decides the whole rhythm of retention: how long an
     entry rests before it comes back, and how badly a miss sets you back.
     Leitner boxes, intervals from the site config.

     Three alternatives, if the default does not fit how you learn:

       Forgiving   — a miss drops you one box instead of all the way to 1.
                     Kinder, but genuinely-forgotten material resurfaces
                     slowly, which is the failure mode you care about.
       Aggressive  — intervals 1/2/4/8/16. Roughly twice the review load for
                     noticeably better recall. Costs you minutes a day.
       Long tail   — add a sixth box at 90 days so solid material still gets
                     checked twice a year rather than disappearing.

     Change the arithmetic here and the whole schedule follows; nothing else
     in the engine hardcodes an interval.
     --------------------------------------------------------------------- */
  var INTERVALS = SITE.intervals || [1, 3, 7, 16, 35];
  var MAX_BOX = INTERVALS.length;

  function reviewInterval(box, grade) {
    var next;
    if (grade === 'miss') next = 1;
    else if (grade === 'close') next = box;
    else next = Math.min(box + 1, MAX_BOX);
    return { box: next, days: INTERVALS[next - 1] };
  }

  /* --- Dates: local, not UTC. A logbook runs on the reader's clock. ------- */
  function dayKey(d) {
    var y = d.getFullYear();
    var m = String(d.getMonth() + 1).padStart(2, '0');
    var day = String(d.getDate()).padStart(2, '0');
    return y + '-' + m + '-' + day;
  }
  function today() { return dayKey(new Date()); }
  function parseKey(k) {
    var p = String(k).split('-');
    return new Date(+p[0], +p[1] - 1, +p[2], 12, 0, 0);
  }
  function shift(k, days) {
    var d = parseKey(k);
    d.setDate(d.getDate() + days);
    return dayKey(d);
  }
  function daysBetween(a, b) {
    return Math.round((parseKey(b) - parseKey(a)) / 86400000);
  }
  function longDate(k) {
    return parseKey(k).toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
  }
  function shortDate(k) {
    return parseKey(k).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
  }

  /* --- Expiry -------------------------------------------------------------
     Fast-moving material carries a date past which it is more likely to be
     folklore than fact. A lapsed entry leaves the sequence and the review
     deck rather than being quietly reinforced forever. It stays visible in
     the library, marked, because knowing what went stale is itself useful. */
  function lapsed(l) {
    return HAS_EXPIRY && !!l.expires && daysBetween(l.expires, today()) > 0;
  }
  function live() {
    return LESSONS.filter(function (l) { return !lapsed(l); });
  }

  /* --- Sequence -----------------------------------------------------------
     Round-robin across tracks, rotating the track order each cycle. Because
     each track file is ordered foundational first, the opening cycle serves
     the most foundational entry from every track before anything advanced. */
  function buildSequence() {
    var pool = live();
    var byTrack = TRACKS.map(function (t) {
      return pool.filter(function (l) { return l.track === t.id; });
    });
    var out = [];
    var cycle = 0;
    var guard = pool.length + TRACKS.length + 1;
    while (out.length < pool.length && cycle < guard) {
      for (var i = 0; i < TRACKS.length; i++) {
        var bucket = byTrack[(i + cycle) % TRACKS.length];
        var lesson = bucket[cycle];
        if (lesson) out.push(lesson.id);
      }
      cycle++;
    }
    // Anything a ragged track length left behind.
    pool.forEach(function (l) { if (out.indexOf(l.id) === -1) out.push(l.id); });
    return out;
  }

  var SEQ = buildSequence();
  var BY_ID = {};
  LESSONS.forEach(function (l) { BY_ID[l.id] = l; });

  /* --- State ------------------------------------------------------------- */
  var blank = {
    v: 1,
    startedOn: today(),
    log: {},
    days: {},
    streak: { count: 0, best: 0, lastOn: null },
    forecasts: {},
    profile: {},
    theme: null,
    autoplay: false
  };

  /* Everything here depends on being able to write locally. If a browser or
     an embedding blocks storage, say so plainly rather than losing a month of
     someone's notes without telling them. */
  function storageWorks() {
    try {
      localStorage.setItem(KEY + '.probe', '1');
      localStorage.removeItem(KEY + '.probe');
      return true;
    } catch (e) {
      return false;
    }
  }

  var STORAGE_OK = storageWorks();
  var state = load();

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return clone(blank);
      var parsed = JSON.parse(raw);
      if (!parsed || parsed.v !== 1) return clone(blank);
      // Merge onto the blank so a partial or older record still boots.
      var s = clone(blank);
      Object.keys(parsed).forEach(function (k) { s[k] = parsed[k]; });
      s.log = parsed.log || {};
      s.days = parsed.days || {};
      s.streak = parsed.streak || clone(blank.streak);
      s.forecasts = parsed.forecasts || {};
      return s;
    } catch (e) {
      return clone(blank);
    }
  }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); }
    catch (e) { toast('Could not save — browser storage is full or blocked'); }
  }

  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  function record(id) {
    if (!state.log[id]) {
      state.log[id] = { box: 0, due: null, note: '', reviews: [], completedOn: null, gate: null, attempts: [] };
    }
    var r = state.log[id];
    if (!r.reviews) r.reviews = [];
    if (!r.attempts) r.attempts = [];
    return r;
  }

  /* --- The daily pick ----------------------------------------------------
     Written once per date, then read back. Stable across reloads, honest as
     a history, and a missed day pushes the corpus forward instead of
     silently dropping an entry. You cannot refresh to skip ahead, which is
     the property that makes a commitment mean anything. */
  function lessonForToday() {
    var t = today();
    if (state.days[t] && BY_ID[state.days[t]]) return BY_ID[state.days[t]];
    if (!SEQ.length) return null;

    var served = {};
    Object.keys(state.days).forEach(function (d) { served[state.days[d]] = true; });

    var pick = null;
    for (var i = 0; i < SEQ.length; i++) {
      if (!served[SEQ[i]]) { pick = SEQ[i]; break; }
    }
    // Corpus exhausted: begin a second pass from the top of the sequence.
    if (!pick) pick = SEQ[Object.keys(state.days).length % SEQ.length];

    state.days[t] = pick;
    save();
    return BY_ID[pick];
  }

  function entryNumber(id) {
    var n = SEQ.indexOf(id);
    return n === -1 ? '—' : String(n + 1).padStart(3, '0');
  }

  function dueList() {
    if (!HAS_REVIEW) return [];
    var t = today();
    return Object.keys(state.log)
      .filter(function (id) {
        var r = state.log[id];
        return BY_ID[id] && !lapsed(BY_ID[id]) && r.due && r.box > 0 && daysBetween(r.due, t) >= 0;
      })
      .sort(function (a, b) {
        var d = state.log[a].box - state.log[b].box;   // shakiest first
        return d !== 0 ? d : (state.log[a].due < state.log[b].due ? -1 : 1);
      });
  }

  function completedToday() {
    var t = today();
    var l = state.days[t];
    return !!(l && state.log[l] && state.log[l].completedOn === t);
  }

  function markComplete(id) {
    var t = today();
    var r = record(id);
    if (r.completedOn === t) return;
    r.completedOn = t;
    if (HAS_REVIEW && r.box === 0) { r.box = 1; r.due = shift(t, INTERVALS[0]); }

    var s = state.streak;
    if (s.lastOn === t) { /* already counted */ }
    else if (s.lastOn && daysBetween(s.lastOn, t) === 1) s.count += 1;
    else s.count = 1;
