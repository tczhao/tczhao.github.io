  worked: "On Tuesday the architecture forum reviewed our change to how long we keep workflow execution history for each tenant. Nobody owns the path that alerts us when the ingestion pipeline in the customer data platform fails. The draft timeline for telling customers we are deprecating the connector is still with the product marketing team.\n\nThree strings unpacked, and the relationships that were compressed out are now written down: retention is how long we keep, the tenant is a per-tenant scope rather than a kind of workflow, and the failure belongs to the ingestion pipeline, not to the notification path. This one gets longer, forty-three words to fifty-four, and that is the trade the move makes - you pay words to stop the reader searching through bracketings. Two things to be honest about. \"Ingestion pipeline failure notification path\" had two readings and this rewrite picks one, alerts about pipeline failures rather than a path that itself fails; the entry is right that those are owned by different teams, so it is a question for the author, not a repair. And \"communication\" named no audience, so \"telling customers\" is a guess. \"Workflow execution history\" is still three nouns deep and stays that way, because the team that owns workflows parses it on sight. If a doc's noun strings cannot be expanded without asking someone, the string was never shorthand, it was an unwritten sentence.",
  experiment: "Search a doc you wrote for any run of four or more nouns with no preposition between them. Expand each with prepositions and a verb, then keep the compressed form only where you can name the specific audience that already parses it. Count how many survive that test.",
  reflection: "Which noun string turned out to be ambiguous once you tried to expand it, and did you have to ask someone which reading was right?",
  recall: {
    q: "What is the specific cost a long noun string imposes, and why does it feel free to the writer?",
    a: "The cost is modifier attachment: nothing marks which nouns modify which, so the reader searches through possible bracketings. It feels free to the writer because they already know the referent and are recognising the string rather than parsing it.\n\nThe string is a fine shorthand inside the team that coined it and unreadable one desk over."
  },
  deepDive: "Pull out every noun string of four or more from this doc, expand each one with prepositions, and tell me which expansions were ambiguous."
},
{
  id: "characters-zombie-density",
  track: "characters", level: "paragraph",
  title: "Zombie nouns travel in packs, so measure density rather than instances",
  source: "Helen Sword, \"Zombie Nouns\" (The New York Times, 2012)",
  gatePrompt: "Highlight every abstract noun in your paragraph, meaning anything you cannot point at or picture. Count them, count the total words, and write the percentage at the top of the paragraph.",
  fallback: "Alignment on the operational readiness criteria remains an area of ambiguity, and the absence of clear accountability has contributed to variability in the quality of handover documentation. Improvement in this area will require a commitment to consistency in the application of the standard across all teams, alongside greater visibility into adherence at the service level.",
  idea: "Measure abstract-noun density across a whole paragraph, because one nominalization is a sentence problem and a cluster is a register problem.",
  why: "Sword's argument is that these nouns cannibalise: they consume the verbs and adjectives around them and then consume the human beings, until the passage describes states of affairs with nobody in them. A single abstract noun in an otherwise concrete paragraph is usually a term of art doing its job. A paragraph that is mostly abstract nouns gives the reader nothing to picture, so they process it as tone rather than content and come away with an impression instead of information.\n\nDensity is the right instrument because instances are arguable and counts are not. You can defend any one of \"alignment\", \"ambiguity\", \"accountability\" and \"variability\" on its own terms. You cannot defend four of them in twenty-eight words.",
  failureMode: "\"Alignment on the operational readiness criteria remains an area of ambiguity, and the absence of clear accountability has contributed to variability in the quality of handover documentation.\" Twenty-seven words, no people, no events, and nothing a reader could act on tomorrow morning.",
  worked: "Abstract nouns: 3 in 53 words, 6 per cent. Was 14 in 55, 25 per cent.\n\nWe have never agreed what counts as operationally ready, and nobody owns the question, so each team writes its handover doc to a different bar. If we want that to change, every team has to apply the same standard, and we have to be able to see, service by service, who actually does.\n\nAlignment, readiness, ambiguity, absence, accountability, variability, quality, documentation, improvement, commitment, consistency, application, visibility and adherence went out together, and what replaced them is people doing things: we have not agreed, nobody owns, each team writes, every team has to apply. The percentage is the whole diagnostic - each of those nouns is defensible one at a time, and fourteen of them in fifty-five words is not. The cost is register, and it is a real one. \"We have never agreed what counts as operationally ready\" is a specific, falsifiable claim somebody in the room can dispute, where \"alignment remains an area of ambiguity\" could go to any audience without anyone objecting. You have also lost the ability to send this upward unchanged. That is the point of the count rather than a side effect of it: the policy register was buying you deniability, and you were paying for it with a paragraph nobody could act on.",
  experiment: "Take a page you wrote and highlight every noun ending in -tion, -ment, -ity, -ness, -ance or -ency. Work out the percentage of total words. Under about 5 per cent still reads as prose; past 10 per cent it reads as policy. Then run the same count on a page you actually enjoyed reading, because the comparison is the real instrument and the thresholds are only a rough guide.",
  reflection: "Was the densest paragraph in your doc the one where you had the least to say, or the one where you were least willing to say it?",
  recall: {
    q: "Why is counting abstract nouns per hundred words more useful than flagging individual nominalizations?",
    a: "Because individual nominalizations are often correct: a field term, a back-reference, the object of a verb of knowing. Each one can be defended in isolation and the argument goes nowhere.\n\nDensity is not arguable in the same way. A paragraph that is 12 per cent abstract nouns has lost its characters regardless of whether each noun survives on its own."
  },
  deepDive: "Compute the abstract-noun density of each paragraph in this document and tell me which one has lost its characters entirely."
},
{
  id: "characters-abstraction-as-character",
  track: "characters", level: "sentence",
  title: "An abstraction can be your character, as long as it is the same abstraction every time",
  source: "Joseph M. Williams, Style: Lessons in Clarity and Grace",
  gatePrompt: "If your paragraph's subjects are abstract, write them in a column and mark every place you used a different word or phrase for the same underlying idea. Pick one wording and apply it to all of them.",
  fallback: "Retention policy is the real constraint here. The rules governing how long we keep execution history were written before the multi-tenant split, and this data lifecycle question now touches three services. What we keep and for how long has never had a named owner, and the storage retention approach still differs per cluster.",
  idea: "An abstract subject works when the abstraction is genuinely what the passage is about and you name it with the same words every time.",
  why: "Williams does not ban abstract subjects, and a track that taught otherwise would be useless for design docs, where the topic really is a policy or a system rather than a team. The condition is consistency. The reader is tracking a topic across sentences, and a stable noun phrase in subject position is the thing that makes it trackable.\n\nSynonym variation breaks that outright. When \"retention policy\" becomes \"this data lifecycle question\" and then \"the storage retention approach\", the reader has to decide whether a new entity has entered the passage. They usually decide it has, because that is what a new noun phrase normally signals, and from then on they are tracking three things instead of one.",
  failureMode: "Four sentences, one topic, four names for it: retention policy, the rules governing how long we keep execution history, what we keep and for how long, the storage retention approach. Each rewording was an attempt to avoid repetition and each one cost the reader a decision about whether the subject had changed.",
  worked: "Retention policy is the real constraint here. The retention policy was written before the multi-tenant split, and it now touches three services. It has never had a named owner, and it still differs per cluster.\n\nThe column was: retention policy, the rules governing how long we keep execution history, what we keep and for how long, the storage retention approach. Four subject slots, four names, one topic, and every rename asked the reader to decide whether a new entity had walked in. It now reads retention policy, the retention policy, it, it, which is the abstraction working as a character exactly as this entry allows. Fifty-three words to thirty-five, because three of the four names were paraphrases carrying nothing the first one did not. What went with them is the gloss. \"The rules governing how long we keep execution history\" told a newcomer what retention policy actually means, and that reader now gets no definition. If your audience is new to the system, put it back once as an appositive on first mention, not as a second name in subject position, which is the thing that broke the tracking.",
  experiment: "Pick a doc whose topic is genuinely a system or a policy rather than a team. List the subject of every sentence and count how many distinct noun phrases refer to the same one thing. Collapse them to a single wording, then check whether the doc got shorter as well as clearer.",
  reflection: "Where you varied the wording, were you avoiding repetition or hedging because you were not sure the two phrases meant the same thing?",
  recall: {
    q: "Williams does not ban abstract subjects. What is the condition under which they work?",
    a: "The abstraction has to be what the passage is genuinely about, and it has to be named with the same noun phrase every time it appears in subject position.\n\nConsistency is what lets the reader track it as a character. Elegant variation destroys the tracking, because a new noun phrase signals a new entity."
  },
  deepDive: "This doc is about a system rather than a team; list every noun phrase I used for the main topic and tell me which single wording I should standardise on."
},
{
  id: "characters-keep-the-nominalization",
  track: "characters", level: "sentence",
  title: "Some nominalizations are the right word, and Williams tells you which",
  source: "Joseph M. Williams, Style: Lessons in Clarity and Grace",
  gatePrompt: "Find one nominalization in your paragraph you should keep. Write a single sentence saying which of the three reasons applies: back-reference, established field term, or object of a verb of knowing.",
  fallback: "We throttled the connector and we rewrote the deduplication step. Because we did both of those, syncs stopped failing overnight. The review will look at whether we ought to have throttled first. Nobody has worked out yet how much it would cost if we moved off the legacy scheduler, and that not being worked out is what is blocking the plan.",
  idea: "Keep a nominalization when it refers back to a previous sentence, names a concept your field already owns, or serves as the object of a verb of knowing.",
  why: "A nominalization can package an entire previous clause into a single noun phrase that fits in subject position, and that is the only mechanism English offers for making an event the topic of the next sentence. \"Both changes cut the failure rate\" works; \"because we did both of those\" is the same idea with the packaging refused and four words spent on deixis instead.\n\nThe other two cases are simpler. Field terms are nouns because the field agreed to treat them as things: backpressure, eventual consistency, amortisation. Unpacking them into verbs makes you sound like you do not know the vocabulary. And verbs of knowing take nominal objects naturally, so \"nobody understands the failure\" is not improved by any transformation available to you.",
  failureMode: "\"That not being worked out is what is blocking the plan.\" Someone has learned the rule and applied it past the point where it helps. \"The missing estimate is what is blocking the plan\" uses the nominalization the sentence was crying out for.",
  worked: "We throttled the connector and rewrote the deduplication step. Both changes stopped syncs failing overnight. The review will look at whether we should have throttled first. Nobody knows the cost of moving off the legacy scheduler, and the missing estimate is what is blocking the plan.\n\nThree nominalizations went back in, and only two of the three licensed reasons apply here. \"Both changes\" and \"the missing estimate\" are back-references: they package a previous clause into a noun phrase that fits in subject position, which is the only mechanism English gives you for making an event the topic of the next sentence, and it is why \"because we did both of those\" and \"that not being worked out is\" were spending words on deixis. The third, \"the cost\", is the object of a verb of knowing, and no transformation available to you improves \"nobody knows the cost\". No established field term appears in this specimen, so the remaining reason does not come up - say that rather than manufacture one. Sixty-one words to forty-six, which is the direction that surprises people about this entry. The cost is that \"both changes\" only works while the two changes are still in the reader's head, so it does not survive a paragraph break, and \"the missing estimate\" names a thing that does not exist and still does not say who owes it. That is the ordinary nominalization fault, kept here because the sentence is about the blockage, not the assignment.",
  experiment: "Go back to a doc you already de-nominalised. Find every sentence that opens by pointing at what you just said. If any of them uses \"because of this\", \"as a result of that\" or \"doing so\", replace it with a specific summarising noun and decide which version you would rather read.",
  reflection: "Did the summarising noun you chose force you to name what the previous sentences added up to, and was that harder than expected?",
  recall: {
    q: "Name the three cases where a nominalization is the right word.",
    a: "One, it packages a previous clause so an event can be the topic of the next sentence: \"Both changes cut the failure rate.\" Two, it is an established term the field already owns: backpressure, eventual consistency.\n\nThree, it is the object of a verb of knowing or explaining: \"nobody understands the failure\", \"the doc explains the tradeoff\"."
  },
  deepDive: "I over-corrected this draft by removing nominalizations; find the places where one should go back in and tell me which of the three reasons applies to each."
},
{
  id: "characters-long-subjects",
  track: "characters", level: "sentence",
  title: "A subject that runs past eight words makes the reader hold their breath",
  source: "Joseph M. Williams, Style: Lessons in Clarity and Grace",
  gatePrompt: "For each sentence in your paragraph, count the words before the main verb and write the number in the margin. Circle every count above eight and rewrite the worst one so the verb arrives early.",
  fallback: "The decision by the platform team to defer the multi-region failover work until after the connector migration completes, which was communicated at last week's architecture review, has consequences for the recovery commitments we made to two enterprise accounts. Any change to the sequencing of those two workstreams that would bring the failover forward requires sign-off from both leads.",
  idea: "Keep the grammatical subject short and get the reader to the main verb early.",
  why: "A reader cannot begin interpreting a clause until the verb arrives, because the verb determines what roles the preceding material plays. Everything before it is held in working memory unattached and unassigned. A twenty-eight word subject is twenty-eight words of held material, and the cost is paid before any of it becomes meaningful.\n\nThis is also why an interruption between subject and verb hurts more than a merely long subject. \"The decision, which was communicated at last week's architecture review, has consequences\" splits the exact pair the reader is waiting to join, and forces them to keep the subject live through a whole relative clause that is not about the same thing.",
  failureMode: "\"The decision by the platform team to defer the multi-region failover work until after the connector migration completes, which was communicated at last week's architecture review, has consequences for the recovery commitments.\" Twenty-nine words before \"has\". By the time the verb lands the reader has forgotten which noun it belongs to.",
  worked: "The platform team has deferred the multi-region failover work until the connector migration completes. They announced that at last week's architecture review. The deferral has consequences for the recovery commitments we made to two enterprise accounts. Bringing the failover forward needs sign-off from both leads.\n\nThe counts before the main verb were 29 and 15. They are now 3, 1, 2 and 4. The twenty-nine-word subject came apart in two moves: the actor and the action were promoted out of \"the decision by the platform team to defer\" into \"the platform team has deferred\", and the relative clause wedged between subject and verb was cut loose into its own sentence. \"The deferral\" is a back-reference nominalization doing legitimate work, keeping the third subject to two words. Fifty-eight words to forty-five. The cost is emphasis. \"Which was communicated at last week's architecture review\" was a parenthetical aside and is now a whole sentence, so the paragraph gives the announcement venue more weight than the original did. If the venue does not matter, delete it rather than promote it - splitting a long subject tempts you into keeping material that only survived because it was cheap to bury.",
  experiment: "Take one page you wrote. For every sentence, count the words before the main verb and write the counts in a column. Rewrite anything over eight; anything over fifteen probably needs to become two sentences. Recount afterwards and compare the two columns.",
  reflection: "In the sentences you split, was the material you moved out of the subject actually a second claim you had smuggled in?",
  recall: {
    q: "Why is a long subject costly in a way that an equally long object is not?",
    a: "The reader cannot assign roles to any material until the verb arrives, so everything before the verb is held unattached in working memory. After the verb, each new phrase attaches as it arrives.\n\nThe same twenty words cost far more in front of the verb than behind it, and an interruption between subject and verb costs more still."
  },
  deepDive: "Count the words before the main verb in every sentence of this draft, list the ones over eight, and show me how you would split the worst one."
},
{
  id: "characters-choosing-the-character",
  track: "characters", level: "sentence",
  title: "When a sentence has two candidate characters, the one you choose is the story",
  source: "Joseph M. Williams, Style: Lessons in Clarity and Grace",
  gatePrompt: "Find one sentence in your paragraph with more than one possible actor. Write both versions with the subjects swapped, then mark the one you would be comfortable reading aloud to the person named in it.",
  fallback: "The on-call engineer missed the failover step during the first thirty minutes of the incident. The runbook had not been updated since the multi-region change, and gaps in review coverage allowed it to go stale. Customers experienced degraded search for ninety minutes before the correct procedure was found.",
  idea: "Deciding which of several possible characters occupies the subject is a claim about responsibility, so make it on purpose.",
  why: "Readers attribute causal responsibility to the grammatical subject even when the sentence makes no explicit causal claim. \"The engineer missed the failover step\" and \"the runbook did not cover the failover path\" can describe the same thirty minutes and land completely differently on the person who was on call, because subjecthood carries agency whether or not the writer intended it.\n\nThe tell is inconsistency inside a single paragraph. Human subjects for the failures you are willing to attribute, abstract or agentless subjects for the ones you are not. That pattern is legible to every reader who was involved, and it is the reason a technically blameless write-up can still read as an accusation.",
  failureMode: "One paragraph, three subject choices: \"the on-call engineer missed\", \"gaps in review coverage allowed\", \"customers experienced\". A person is named for the failure inside the incident and nobody is named for the failure that set it up. Nothing in the paragraph is false and the allocation of blame is complete.",
  worked: "The on-call engineer missed the failover step during the first thirty minutes of the incident. The platform team had not updated the runbook since the multi-region change, and nobody there owned keeping it current. Customers experienced degraded search for ninety minutes before the correct procedure was found.\n\nThe subject column was: the on-call engineer, the runbook, gaps in review coverage, customers. A person for the failure inside the incident and an abstraction for the failure that set it up. It now reads: the on-call engineer, the platform team, nobody there, customers. The same facts, no sentence made false, and the allocation of responsibility is consistent rather than selective. It costs almost nothing in length, forty-eight words to forty-seven, and a great deal in exposure: \"gaps in review coverage\" was free, and a named team in the subject slot for a contributing factor is a claim you have to be able to defend, in a document that team will now want to read before it circulates. The last sentence keeps \"was found\", because customers are the right subject there and the missing actor is the next entry's move. Notice the exchange - the engineer's sentence reads less like an accusation than it did, precisely because it is no longer the only sentence in the paragraph with a person in it.",
  experiment: "Take an incident write-up you wrote. List the subject of every sentence in the contributing-factors section and mark each one as person, team, system or abstraction. If people appear only in the sentences about mistakes, you have written a blame document with a blameless header.",
  reflection: "Which subject choice would you defend in front of the person it names, and which one would you quietly change first?",
  recall: {
    q: "Two sentences describe the same event with different subjects. What is the reader taking from the choice?",
    a: "Causal responsibility. Readers attribute agency to the grammatical subject regardless of whether the sentence asserts causation.\n\nThe diagnostic is consistency across a paragraph: if human subjects appear only where you were willing to attribute fault, and systems or abstractions elsewhere, the allocation is visible to everyone who was there."
  },
  deepDive: "Classify the subject of every sentence in the contributing-factors section of this write-up as person, team, system or abstraction, and tell me what the pattern says about who I blamed."
},
{
  id: "characters-agentless-passive",
  track: "characters", level: "sentence",
  title: "An agentless passive is a decision about who disappears",
  source: "Joseph M. Williams, Style: Lessons in Clarity and Grace",
  gatePrompt: "Find every passive in your paragraph. For each one with no \"by\" phrase, write the missing actor in the margin, and mark the ones where you could not say who it was.",
  fallback: "The retention setting was changed in production without a corresponding update to the runbook. The change was not reviewed, and the alert that would have caught it had been disabled some months earlier. It has since been re-enabled, and the policy is being revisited ahead of the next audit.",
  idea: "Every agentless passive removes an actor from the sentence, so ask each time whether the removal serves the reader or only the writer.",
  why: "The passive itself is a legitimate construction that promotes the thing acted on into subject position, and the next four entries are about when that is the right call. Dropping the \"by\" phrase is a separate and optional move, and it is the one that loses information. The sentence stays grammatical and readable; what the reader loses is the ability to audit it.\n\nIn incident and review prose that loss is the whole point of the document. A reader following a causal chain needs each link to name who or what acted, and an agentless passive breaks the chain while leaving the sentence looking complete. That is why it survives review: nothing about it looks wrong.",
  failureMode: "\"The alert that would have caught it had been disabled some months earlier.\" By whom, and did they know what it protected? The sentence is grammatically complete, stylistically unobjectionable and forensically useless.",
  worked: "[The engineer named on the commit] changed the retention setting in production and did not update the runbook. Nobody reviewed the change. The alert that would have caught it had been disabled months earlier, and we have not established who disabled it. We have re-enabled the alert, and we are revisiting the policy ahead of the next audit.\n\nFive agentless passives, five margin notes. Three had a recoverable actor and got one: the change is attributed in git, and the re-enabling and the policy review are yours, so \"has since been re-enabled\" and \"is being revisited\" become \"we\". \"Was not reviewed\" was already honest and becomes \"nobody reviewed\", which says the same thing with the actor named. \"Had been disabled\" stays passive, because the agent genuinely is not known, and the sentence now says so out loud instead of leaving a smooth, complete-looking clause where the missing link is. The bracket is deliberate: a worked example cannot invent the name, and neither can you - go and read the commit. The costs are real. The paragraph runs from forty-nine words to about seventy, it is less comfortable to circulate, and an engineer is named for a production change in a document that read as blameless mainly because it read as authorless. It also carries an explicit admission of ignorance that will draw a question in review, which is the correct outcome - that question belongs in the follow-up list, and the agentless passive was what kept it off.",
  experiment: "Take an incident review you wrote. Find every agentless passive and write the missing actor above it. Count the ones where you genuinely do not know who acted. Those are gaps in the investigation rather than gaps in the prose, and they belong in the follow-up list.",
  reflection: "Of the actors you supplied in the margin, how many were you, your team, or someone whose name you did not want in the document?",
  recall: {
    q: "What exactly is lost in an agentless passive, and what is not?",
    a: "The actor is lost. Nothing else is: the passive still names the action and the thing acted on, and it still puts the topic in subject position where the reader wants it.\n\nThe problem is the deleted \"by\" phrase, which is optional and entirely separable from the choice of voice. Blaming the passive for it misdiagnoses the fault."
  },
  deepDive: "Find every agentless passive in this incident review and tell me, for each, whether the missing actor is recoverable from the rest of the document."
},
{
  id: "characters-passive-misdiagnosis",
  track: "characters", level: "sentence",
  title: "Most of the sentences people call passive are not passive",
  source: "Geoffrey K. Pullum, \"Fear and Loathing of the English Passive\" (Language and Communication, 2014)",
  gatePrompt: "Find every sentence in your paragraph you would have called passive. Apply the two-part test to each: a form of \"be\" or \"get\" plus a past participle, with the subject as the thing acted on. Cross out the ones that fail.",
  fallback: "Nit on the design doc: there is too much passive voice throughout. \"There are three services affected\" should be active. \"The system is dependent on the scheduler\" is passive too, and so is \"the migration is complete\". Can you do a pass and make these all active before it goes to the wider group?",
  cheat: "Run the two-part test before flagging a passive: be or get plus a past participle, subject as the thing acted on - otherwise name the real fault.",
  idea: "Verify a passive before you flag one: it needs an auxiliary plus a past participle, with the subject corresponding to the object of the active version.",
  why: "Pullum's paper documents that the advice literature, Strunk and White included, routinely misidentifies its own examples, and that the label has drifted to mean roughly \"prose I find flat\". That drift matters to you specifically because you review other people's writing. A reviewer whose diagnoses do not hold up loses the authority of the correct advice sitting next to the wrong one.\n\nThe three usual false positives are copula plus adjective (\"the migration is complete\"), verb-derived adjectives (\"is dependent on\"), and existential clauses (\"there are three services affected\"). Each one has a real fault available to name: no character in the subject, a verb hiding in an adjective, a placeholder where the actor should be. Those names are more useful than \"passive\" and they are also true.",
  failureMode: "A review comment flagging \"the migration is complete\" as passive. It is a copula and an adjective, there is no participle and no demoted agent, and the author now has to choose between a wrong instruction and a disagreement with their reviewer.",
  worked: "Nit on the design doc: I was going to flag three sentences as passive and none of them is. Two have a real fault, one is fine.\n\n\"There are three services affected\" is an existential clause - no auxiliary plus participle, and the subject is not the thing acted on. The real fault is the placeholder subject: name the services, or name the system they hang off.\n\n\"The system is dependent on the scheduler\" is a copula plus an adjective made out of a verb. \"The system depends on the scheduler\" is three words shorter and puts the action in the verb.\n\n\"The migration is complete\" is a copula plus a plain adjective. Nothing to fix, leave it.\n\nNo blanket pass needed before this goes to the wider group.\n\nThe two-part test - a form of \"be\" or \"get\" plus a past participle, with the subject corresponding to the object of the active version - crossed out all three flags, and each one had a different real fault available to name. That is the trade this move makes: you give up one line of general disapproval and spend five lines being specific. You also give up \"throughout\". Three sentences checked will not support a document-wide claim, so the sweeping instruction to \"make these all active\" goes with it. The comment is longer and slower to write, and it is the version that survives the author checking it.",
  experiment: "Pull up the last five review comments you wrote about voice. Apply the two-part test to every sentence you flagged and count how many were genuinely passive. Rewrite the comments that were wrong so they name what you actually objected to, which is usually a missing character or a copula in the verb slot.",
  reflection: "When you named the real fault instead of saying \"passive\", did the comment get more specific or did you discover you had no objection at all?",
  recall: {
    q: "What are the two conditions a clause must meet to be passive in English?",
    a: "It has an auxiliary, normally a form of \"be\" or \"get\", followed by the past participle of a transitive verb. And its subject corresponds to the object of the active version.\n\nCopulas with adjectives, existential \"there\" clauses and adjectival participles fail one or both, which is why so much of what gets flagged as passive is not."
  },
  deepDive: "Here are review comments I wrote about passive voice; check each flagged sentence against the two-part test and tell me which flags were wrong and what I should have said instead."
},
{
  id: "characters-passive-topic",
  track: "characters", level: "sentence",
  title: "Passive is correct when the receiver of the action is what the sentence is about",
  source: "Geoffrey K. Pullum, \"Fear and Loathing of the English Passive\" (Language and Communication, 2014)",
  gatePrompt: "Find a sentence in your paragraph where the thing acted on is what you are actually writing about. Write it both ways, then read the whole paragraph twice and keep the version whose subject matches the paragraph's topic.",
  fallback: "We provisioned the new ingestion cluster in March. The capacity planning team sized it for double the current peak. A misconfigured node pool starved it of memory during the first week. The SRE on-call eventually rebuilt it with the correct instance type, and the platform team now owns it.",
  idea: "When the thing acted on is your topic, the passive puts it in the subject slot where the reader is already looking for the topic.",
  why: "Subject position is topic position in English. If a paragraph is about the ingestion cluster, then writing every sentence in the active voice moves the cluster into the object slot each time and installs a different actor as the apparent topic, so the reader re-establishes what the paragraph is about four times over.\n\nThe passive is the grammatical device English provides for exactly this problem. It changes which participant is the subject without changing who did what. Refusing it on principle means accepting a scattered topic in every paragraph whose subject matter is a thing rather than a team, which in infrastructure writing is most of them.",
  failureMode: "Four active sentences about one cluster: we provisioned it, the capacity team sized it, a node pool starved it, the on-call rebuilt it. The subject column reads we, the capacity team, a node pool, the on-call. The cluster is the topic of every sentence and the subject of none.",
  worked: "The new ingestion cluster was provisioned in March and sized by the capacity planning team for double the current peak. In its first week it was starved of memory by a misconfigured node pool. It was rebuilt with the correct instance type by the SRE on-call, and it is now owned by the platform team.\n\nThe subject column was we, the capacity planning team, a node pool, the on-call, the platform team - five actors for a paragraph about one cluster, which was the object of every sentence and the subject of none. It now reads: the cluster, it, it, it. Nobody's contribution was deleted, because the \"by\" phrases keep every actor on the page, in the stress position where the new information belongs. Forty-nine words to fifty-five, which is what the passive costs, and four passives in a row read flatter than four actives - if the paragraph ran any longer, break the run with one active sentence at the point where the actor genuinely is the news. One actor did get dropped: \"we provisioned\" became \"was provisioned\", because \"by us\" is unusable at the front of a sentence. That is an agentless passive, and it is only defensible if the doc says elsewhere whose cluster this is.",
  experiment: "Find a paragraph you wrote about a system or an artefact rather than a team. List the subjects. If the thing you are writing about is the object of most sentences, convert those sentences to passive and read both versions aloud, then decide which one you would send.",
  reflection: "In the passive version, did any \"by\" phrase turn out to carry information you would have lost by deleting it?",
  recall: {
    q: "Your paragraph is about a system, but every sentence has a different team as its subject. What does the passive fix?",
    a: "It puts the system into subject position, which is where English readers look for the topic, without changing who did what.\n\nThe active version scatters the topic across four object slots and forces the reader to re-establish what the paragraph is about at every sentence boundary."
  },
  deepDive: "This paragraph is about a system but every sentence has a different actor as its subject; show me the passive version and tell me whether it reads better."
},
{
  id: "characters-passive-agent-unknown",
  track: "characters", level: "sentence",
  title: "Passive is correct when the agent is unknown, generic, or nobody's business",
  source: "Geoffrey K. Pullum, \"Fear and Loathing of the English Passive\" (Language and Communication, 2014)",
  gatePrompt: "Find one sentence in your paragraph where you named an actor you are not actually certain about. Rewrite it as a passive and check whether the sentence lost anything the reader needed.",
  fallback: "Someone disabled the staleness alert at some point last year. A person or process modified the tenant quota shortly after the migration. An engineer set the retention window to seven days, though the commit that did it is unattributed. Users are able to trigger the reconciliation job manually, which one of them appears to have done twice.",
  idea: "Use the passive when the agent is unknown, generic, or genuinely irrelevant to what the reader needs.",
  why: "An invented actor is a claim the sentence makes and cannot support. \"Someone disabled the alert\" asserts a human agent; \"the alert was disabled\" asserts only that it happened. In a system with automation, config sync and Terraform apply jobs, that difference is material, and the active version is not more honest for having a subject in it.\n\nThe generic case is smaller but constant. \"Users are able to trigger the job manually\" and \"one can configure the timeout\" put a word in subject position that the reader processes and discards. If the identity of the agent adds nothing, the passive removes it cleanly rather than substituting a placeholder that looks like information.",
  failureMode: "\"A person or process modified the tenant quota shortly after the migration.\" The writer has been told to prefer the active voice and has invented a subject to comply with. The passive says the same thing without the hedge and without the fabricated actor.",
  worked: "The staleness alert was disabled at some point last year. The tenant quota was modified shortly after the migration. The retention window was set to seven days in an unattributed commit. The reconciliation job can be triggered manually, and it was triggered twice.\n\nFour invented or throwaway agents deleted. \"Someone\", \"a person or process\" and \"an engineer\" each asserted a human actor the evidence does not support - in a system with config sync and apply jobs, \"the tenant quota was modified\" is the stronger sentence because it claims only what happened. \"A person or process\" is the tell: the writer knew they could not name an agent and manufactured one anyway to satisfy a rule about active voice. \"Users are able to trigger\" is the generic case, where the subject is a word the reader processes and discards, so the passive removes it cleanly. Fifty-seven words to forty-three. Two costs. Four passives in a row read flat, and a reader who wants to know who now gets not even a bad guess. More seriously, deleting an agent is honest only when the agent is genuinely unrecoverable - if git or the audit log would name whoever disabled that alert, this rewrite has converted a fabrication into a smooth-looking evasion, and the sentence should say the search has not been done.",
  experiment: "Take an incident timeline you wrote. Circle every actor you named and say, for each one, how you know. Convert to passive the ones where the honest answer is that you inferred the actor from the outcome, and count how many that turns out to be.",
  reflection: "Of the actors you could not justify, did any of them make it into the write-up because a template or a reviewer asked you to avoid the passive?",
  recall: {
    q: "Name the three conditions under which deleting the agent is the honest choice rather than an evasion.",
    a: "The agent is unknown and inventing one would assert something you cannot support. The agent is generic, so naming it adds a word the reader discards. Or the agent is genuinely irrelevant to what the reader is trying to work out.\n\nThe test is whether the reader would act differently knowing who. If not, the \"by\" phrase is noise."
  },
  deepDive: "Go through this incident timeline, flag every named actor I cannot justify from the evidence in the document, and show me the passive version of the worst one."
},
{
  id: "characters-passive-old-first",
  track: "characters", level: "sentence",
  title: "Passive is correct when it lets old information come first",
  source: "Joseph M. Williams, Style: Lessons in Clarity and Grace",
  gatePrompt: "Take two consecutive sentences in your paragraph. Check whether the opening of the second picks up something already established in the first. If it opens on something entirely new, flip it to passive and read the pair again.",
  fallback: "The scheduler now emits a completion event for every run. A downstream consumer in the billing service reads that event. An hourly reconciliation job owned by the finance team audits the resulting billing records. Occasional duplicate charges have prompted several support tickets over the last fortnight.",
  idea: "Choose the passive when the active would force brand new information into the opening slot where the reader expects something familiar.",
  why: "English readers expect a sentence to begin with something they already know and end with the new, stressed material. Williams calls it the old-to-new principle, and it is why a paragraph of individually clear sentences can still feel like a series of jolts: every sentence opens a new topic before the reader has finished attaching the last one.\n\nThe passive is the main device English gives you for reversing the order of a clause's participants without changing its meaning, which is exactly what you need when the active puts the new participant first. \"That event is read by a downstream consumer in the billing service\" opens on the event you just introduced and closes on the consumer you have not, which is the order the reader is built for.",
  failureMode: "\"The scheduler now emits a completion event for every run. A downstream consumer in the billing service reads that event.\" The second sentence opens on eight words of brand new material and delivers the known item at the end. Both sentences are clear and the join between them is not.",
  worked: "The scheduler now emits a completion event for every run. That event is read by a downstream consumer in the billing service. The billing records it writes are audited hourly by a reconciliation job the finance team owns. Occasional duplicate charges in those records have prompted several support tickets over the last fortnight.\n\nTwo sentences flipped to passive, and every sentence now opens on something the one before it just delivered: completion event, that event, the billing records it writes, duplicate charges in those records. In the original, sentence two opened on a brand new consumer before handing back the event you already knew, and sentence three did the same with the reconciliation job. Who does what is unchanged - the passive only reverses which participant holds the subject slot - though the join in sentence three needed one new fact, that the consumer writes the records. The \"by\" phrases landing at the end is the point rather than an accident: the consumer and the reconciliation job are the new information, and the end of the clause is the stress position. It costs seven words, forty-six to fifty-three, and it costs the finance team their prominence - they were the subject of a sentence and now trail a \"by\" phrase. If this paragraph exists to establish ownership rather than to trace the data path, that is the wrong trade and the active version was right.",
  experiment: "Take a paragraph you wrote. Underline the first six words of every sentence and mark each one that contains nothing the reader has already met. For every mark, try the passive version and check whether the opening now connects to the sentence before it.",
  reflection: "Where the passive fixed the join, did the \"by\" phrase at the end land on the word you actually wanted stressed?",
  recall: {
    q: "What ordering principle makes the passive the right choice here, and what does it say about where the \"by\" phrase belongs?",
    a: "Old information before new. Readers expect a sentence to open on something already established and close on the new, stressed material.\n\nThat also explains the \"by\" phrase: at the end of the clause it sits in the stress position, so when the agent is the new information, trailing it is not clutter but the point."
  },
  deepDive: "Check the first six words of every sentence in this paragraph for something the reader already knows, and show me which sentences should be passive to fix the joins."
}
);

<script>
/* Track: Cohesion and coherence. Ordered foundational first. */
(window.LESSONS = window.LESSONS || []).push(
{
  id: "cohesion-old-before-new",
  track: "cohesion", level: "sentence",
  title: "Begin a sentence with what the reader already knows and end it with what is new",
  source: "George Gopen and Judith Swan, \"The Science of Scientific Writing\"",
  gatePrompt: "Take your paragraph and mark the first six words of every sentence. For each one, write G if that material has already appeared or is obviously shared context, and N if it is new here. Count the Ns.",
  fallback: "A per-namespace concurrency cap of forty was introduced in the 1.9 scheduler release. Backpressure signalling from the queue depth metric, which the cap reads on every admission decision, is emitted only by workers running the new sidecar. Sidecar rollout to the remaining three regions is scheduled for the sprint after next.",
  idea: "Open each sentence on material the reader already holds, and put the new material at the end.",
  why: "Reading is incremental. A reader builds one structure in working memory and attaches each new sentence to it, so the first thing they do with your opening words is look for the hook. If the opening words are new, there is nothing to attach them to, and the reader has to hold them unresolved until the connection arrives somewhere later in the sentence.\n\nThe cost is not confusion, which the reader would notice and reread. The cost is a small unpaid tax per sentence that shows up as the vague sense that a technically correct document is heavy going.",
  failureMode: "Every sentence lands a fresh noun phrase in the first slot and the reader reverses into the link afterwards. \"Backpressure signalling from the queue depth metric, which the cap reads on every admission decision, is emitted only by workers running the new sidecar.\" The connection to the previous sentence exists, but it arrives eleven words late.",
  worked: "The 1.9 scheduler release introduced a per-namespace concurrency cap of forty. The cap reads queue depth on every admission decision, and queue depth is only emitted by workers running the new sidecar. That sidecar reaches the remaining three regions in the sprint after next.\n\nThree openings, three Ns: a concurrency cap, backpressure signalling, sidecar rollout. The openings now are the 1.9 release, which anyone on this team holds, then the cap and then that sidecar, each introduced one sentence earlier, and each sentence ends on its new material. Almost nothing was added, only moved, but two things were paid for. \"Backpressure signalling\" is gone, because nothing else in the paragraph used it and keeping it meant giving it an opening slot it had not earned. If that term is load-bearing elsewhere, you have to reintroduce it and spend a stress position on it. And the first sentence now puts the release in the subject, an entity the paragraph never mentions again, so a slot goes to something inert to buy an anchor for the cap.",
  experiment: "Open the last thing you wrote that ran longer than three paragraphs. Mark the opening six words of every sentence as given or new. If more than a third are new, rewrite those sentences so the given part comes first, and note whether you had to add information or only move it.",
  reflection: "Which sentence needed the most reordering, and was the given material already in the sentence or did you have to supply it?",
  recall: {
    q: "What does a reader do with the first few words of a sentence, and what happens when those words are new?",
    a: "They use them to attach this sentence to the structure they have already built. New material in that slot has nothing to attach to, so it is held in working memory until the link turns up.\n\nThe symptom is not confusion but effort. Correct prose that reads as heavy usually opens too many sentences on the unfamiliar."
  },
  deepDive: "Take this draft of mine and mark the opening words of each sentence as given or new, then show me the two worst offenders reordered."
},
{
  id: "cohesion-where-readers-look",
  track: "cohesion", level: "sentence",
  title: "These are facts about where readers look, not rules about what is correct",
  source: "George Gopen and Judith Swan, \"The Science of Scientific Writing\"",
  gatePrompt: "Run your paragraph through whatever grammar or style checker you have to hand. Write down what it flagged. Then mark, by hand, the one sentence whose point you think a reader would miss, and check whether the checker said anything about it.",
  fallback: "There are a number of considerations that were taken into account by the working group when the retention policy was drafted. Compliance requirements, cost, and the recovery needs of the support team were among them, although cost was the deciding factor in the end. It should be noted that no exceptions to the ninety day window have been granted to date.",
  idea: "Reader expectation principles describe fixed positions where readers hunt for particular kinds of meaning, which is why they catch faults that no correctness check can see.",
  why: "Readers do not scan a sentence evenly. They look for the topic in the subject slot, for the action in the verb, and for the emphasis just before a full stop. Those habits are structural, not stylistic preferences, so they hold whether or not the writer knew about them.\n\nThis is why the diagnosis is different in kind from grammar. A grammar checker asks whether the sentence is well formed. A reader expectation reading asks whether the material the writer cares about is sitting in the slot the reader will search. A sentence can pass the first test perfectly and fail the second completely, and the second failure is the one that loses the argument.",
  failureMode: "Prose with nothing to correct in it that still fails to land. The deciding factor in the fallback is \"cost\", and it appears inside a concessive clause after \"although\", which is the least emphatic position in the sentence. No checker will ever flag that, and no reader will remember it.",
  worked: "The working group weighed compliance requirements, cost, and the recovery needs of the support team when it drafted the retention policy. The deciding factor was cost. To date the ninety day window has had no exceptions.\n\nA checker flags what you expect: \"There are\" as an expletive opening, \"were taken into account by\" as passive, \"It should be noted that\" as padding. Fix all three and the paragraph still fails, because the fault no checker can see is that the deciding factor sat in a concessive clause after \"although\", the least emphatic position in the sentence. Cost now has its own sentence and the last word in it. The price is that the original was doing something real with that concessive. Listing cost as one consideration among several and then quietly ranking it kept the working group looking even-handed, and the repair commits to the ranking in three words. If the group wanted the softer version, it is gone. \"A number of considerations\" also implied there were more than the three named, and that implication went with it.",
  experiment: "Find a document of yours that came back with no substantive comments but did not get the decision you wanted. For each paragraph, write the one thing you needed the reader to take away, then find where in the sentence that thing actually sits. Count how many are in a subordinate clause.",
  reflection: "Where did your important material end up sitting, and what kind of check would ever have caught that?",
  recall: {
    q: "Why can a sentence be flawless by every correctness standard and still fail?",
    a: "Because correctness and reader expectation are different tests. Correctness asks whether the sentence is well formed; reader expectation asks whether the writer's important material is sitting where the reader will look for it.\n\nReaders search the subject for the topic and the position before the full stop for emphasis. Material placed elsewhere is grammatically fine and functionally invisible."
  },
  deepDive: "Read this document as a reader-expectation analysis rather than a copy edit, and tell me which points are sitting in positions where they will not be found."
},
{
  id: "cohesion-stress-position",
  track: "cohesion", level: "sentence",
  title: "The end of the sentence is the stress position, so spend it on purpose",
  source: "George Gopen and Judith Swan, \"The Science of Scientific Writing\"",
  gatePrompt: "In your paragraph, underline the last five words of every sentence. Beside each, write in three words or fewer what that sentence was actually for. Circle every sentence where the two do not match.",
  fallback: "The migration cut p99 scheduling latency from 4.2 seconds to 900 milliseconds, according to the dashboards we reviewed on Tuesday. The rollout completed across every cluster, with the exception of ap-south-1, where a separate ticket is open. We will continue to monitor the metrics over the coming weeks as usual.",
  idea: "Put the material you want emphasised immediately before the full stop, because that is where the reader will place emphasis regardless of your intention.",
  why: "A reader arriving at a full stop has finished holding the structure open and can finally discharge it. That moment of closure is where emphasis lands, in the same way a spoken sentence rises to its last stressed syllable. The reader does not choose to do this and cannot switch it off.\n\nThe consequence is that the stress position is always spent. If you end on a hedge, a date, a source or a piece of throat-clearing, the reader emphasises the hedge. Your real point, sitting comfortably in the middle of the sentence, is read as background.",
  failureMode: "The number that justifies the whole project is delivered mid-sentence and the emphasis goes to the housekeeping. \"The migration cut p99 scheduling latency from 4.2 seconds to 900 milliseconds, according to the dashboards we reviewed on Tuesday.\" The reader leaves that sentence thinking about Tuesday.",
  worked: "According to Tuesday's dashboards, the migration cut p99 scheduling latency from 4.2 seconds to 900 milliseconds. Every cluster has completed the rollout except ap-south-1.\n\nRead the original endings as a list and the document is about Tuesday, an open ticket and business as usual: \"dashboards we reviewed on Tuesday\", \"where a separate ticket is open\", \"over the coming weeks as usual\". None of the three matches what its sentence was for. The source and date now sit in front, so 900 milliseconds takes the first stress position and ap-south-1 takes the second. Two costs. A sceptical reader has to accept the source before the number lands rather than getting it as corroboration afterwards, which is the wrong trade if your reader distrusts the dashboards. And the third sentence is gone along with the ticket reference, because neither had a payload worth a stress position. Put the ticket back and it needs its own sentence, competing with your result for the reader's memory.",
  experiment: "Take the summary section of your most recent write-up. For each sentence, write down the last five words on their own, then read that list back as if it were the whole document. If the list is a set of caveats, sources and dates, move one payload into the final position in each sentence and reread.",
  reflection: "What did your list of sentence endings say the document was about, and how far was that from what you meant?",
  recall: {
    q: "Why does the material just before a full stop get emphasised even when the writer did not intend it?",
    a: "Because the reader has been holding the sentence structure open and the full stop is the point of release. Emphasis attaches to that moment of closure automatically.\n\nSo the slot is always spent on something. Ending on a date, a source or a caveat makes that the emphasised element and demotes the real point to background."
  },
  deepDive: "List the final five words of every sentence in this draft and tell me which endings are wasted on housekeeping."
},
{
  id: "cohesion-given-new-contract",
  track: "cohesion", level: "sentence",
  title: "The given and new contract is a comprehension mechanism, not a preference",
  source: "Herbert Clark and Susan Haviland, \"Comprehension and the Given-New Contract\"",
  gatePrompt: "Pick the sentence in your paragraph that you think is hardest to read. Identify the definite noun phrases in it, the ones with \"the\" or \"this\" or a name, and mark each as already introduced or not. Count the unintroduced ones.",
  fallback: "The second-order effect of the leader election timeout is what actually caused the outage. Etcd's compaction pause exceeded the lease renewal window, so the API server lost its lock and every controller stalled for ninety seconds. We had raised that timeout in March for unrelated reasons.",
  idea: "Write so that every sentence offers the reader something already known to attach the new material to, because comprehension measurably slows when no anchor is available.",
  why: "Clark and Haviland showed that readers process a sentence in two steps: find the given information, locate it in memory, then attach the new information to it. When the given information is present, the search succeeds immediately. When it is missing, the reader has to construct a bridging inference, and that construction is slow enough to measure in reading time.\n\nThis matters because bridging usually succeeds. The reader works out what you must have meant, so nothing looks broken. What you have done is charge them for the reconstruction, sentence after sentence, and the bill arrives as fatigue rather than as a question.",
  failureMode: "A confident opening about an entity the reader has never been given. \"The second-order effect of the leader election timeout is what actually caused the outage.\" There is no first-order effect on the page and no leader election timeout introduced, so the reader manufactures both before the sentence can be understood.",
  worked: "The outage traces back to a leader election timeout we raised in March for unrelated reasons. That timeout sets the lease renewal window inside which the API server must refresh its lock. The window turned out to be shorter than Etcd's compaction pause, so the lock lapsed and every controller stalled for ninety seconds.\n\nThe original opened with three definite noun phrases the reader had never been given: the second-order effect, the leader election timeout, and by implication a first-order effect that appears nowhere. Only \"the outage\" was genuinely given. Each definite is now introduced before it is used as given. The timeout arrives indefinite and becomes \"that timeout\", and the lease renewal window is defined by the clause that first names it, so no bridging inference is required. The cost is directness. The original's first sentence named a cause and characterised it in one stroke, where the repair opens on a looser \"traces back to\" and holds the mechanism and the ninety seconds until the third sentence, so a skimmer now leaves with less. \"Second-order effect\" also went, and it was compressing something real: it told the reader there was a chain rather than a single cause. It just charged them for a first-order effect that was never on the page.",
  experiment: "Take an incident write-up or design doc of yours and list every definite noun phrase in the first two paragraphs. Mark each one as introduced earlier or assumed. For every assumed one, either introduce it in a preceding clause or make it indefinite, then reread the opening cold.",
  reflection: "How many entities were you treating as given, and where had you actually introduced them, if anywhere?",
  recall: {
    q: "What is the experimental finding behind putting old information before new?",
    a: "Clark and Haviland found that readers first locate the given information in memory and then attach the new information to it. Where no given anchor exists, the reader builds a bridging inference, which measurably slows reading.\n\nThe inference usually succeeds, so the prose does not look broken. The cost shows up as effort rather than as confusion."
  },
  deepDive: "Go through this draft and list every noun phrase I treat as given that I never actually introduced."
},
{
  id: "cohesion-topic-position",
  track: "cohesion", level: "sentence",
  title: "Readers take whatever sits in the subject as the topic, whether or not you meant it",
  source: "George Gopen, The Sense of Structure",
  gatePrompt: "Write out the grammatical subject of every sentence in your paragraph as a bare list, in order. Cross out any that are \"it\", \"there\", \"the fact that\", or a noun that names no real actor.",
  fallback: "There are several reasons why the queue depth alert fired twice on Sunday. It is worth noting that the deduplication window is currently set to five minutes. The fact that both firings referenced the same shard suggests a single underlying cause rather than two.",
  idea: "Whatever occupies the grammatical subject becomes the sentence's topic in the reader's mind, so put the thing the sentence is about there.",
  why: "The topic position is assigned by grammar, not by intention. A reader reaching a subject commits to it as the thing being discussed and reads the rest of the sentence as a comment on it. That commitment happens before the reader knows what the sentence will say.\n\nSo a subject spent on \"there\", \"it\" or \"the fact that\" does not simply waste words. It tells the reader that this sentence is about nothing in particular, and the real topic, which arrives later as an object or inside a clause, gets read as detail. Do that three sentences in a row and the paragraph has no discernible subject even though every sentence is about something.",
  failureMode: "Subjects that name no actor while the real actors hide in the predicate. In the fallback the subject list reads \"There\", \"It\", \"The fact\", so the reader is told the paragraph is about nothing three times, while the alert, the deduplication window and the shard all sit downstream.",
  worked: "The queue depth alert fired twice on Sunday for several reasons. The deduplication window is currently set to five minutes. Both firings referenced the same shard, which points to a single underlying cause rather than two.\n\nThe bare subject list was \"There\", \"It\", \"The fact\", so the paragraph told the reader three times that it was about nothing in particular while the alert, the deduplication window and the shard all sat downstream as objects. The list now reads: the alert, the deduplication window, both firings. Three things that can act, in the slot where the reader takes the topic. Two costs. \"The fact that both firings referenced the same shard suggests\" made a fact do the suggesting, which is a hedge, and with the firings as subject the paragraph asserts the inference in its own voice, a stronger claim than you may have meant. And \"It is worth noting that\" was flagging the deduplication window as the important detail, so the window now has to earn attention by where it sits rather than by being announced. Fixing the subjects also exposes what the move does not solve: three sentences, three unrelated topics, which is a sequence problem rather than a subject problem.",
  experiment: "Take a page of your own writing and list the subjects of all its sentences in order. Count how many are placeholders or abstractions. Rewrite five of them so the subject names something that could actually act, and check whether the list now reads as a topic sequence.",
  reflection: "What did your bare subject list turn out to be about, and was that the paragraph you thought you had written?",
  recall: {
    q: "Who decides what a sentence is about, the writer or the grammar?",
    a: "The grammar. Readers take whatever occupies the subject position as the topic and read everything after it as a comment on that topic.\n\nA placeholder subject therefore reassigns the sentence to nothing in particular, and the real topic, arriving later as an object or in a clause, is downgraded to detail."
  },
  deepDive: "Pull out the grammatical subjects of every sentence in this piece and tell me what the sequence says the piece is about."
},
{
  id: "cohesion-old-means-in-the-reader",
  track: "cohesion", level: "sentence",
  title: "\"Old\" means already in the reader's head, not already on the page",
  source: "George Gopen, The Sense of Structure",
  gatePrompt: "Name the actual reader of your paragraph in one line, including how much of your project they have seen. Then mark every term in the paragraph that is given only because you have been living in this problem.",
  fallback: "Following the PLAT-118 cutover, marketplace packages no longer resolve through the legacy path. Tenants on the shared plane should see no change to package installation. The remaining tenant-facing workflows will move in the next maintenance window.",
  idea: "Treat information as given only if this particular reader already holds it, not if it merely appeared earlier in your document or your week.",
  why: "The given and new contract is scored in the reader's memory, not in the text. Shared context, earlier sections they actually read, and background the audience genuinely has all count as given. A ticket number you have typed forty times this week counts as given to you and as new to everyone else.\n\nThis is why the same opening paragraph works in a team channel and fails in a customer note, with no word changed. You have not written worse; you have swapped the memory the sentence was calibrated against. Deciding who the reader is therefore is not a courtesy step before writing, it is the input that determines which words are allowed in the opening slot.",
  failureMode: "An opening that is anchored for the author's team and unanchored for everyone else. \"Following the PLAT-118 cutover, marketplace packages no longer resolve through the legacy path.\" For the six people in the migration channel that is a given; for a tenant it is three unfamiliar things in twelve words.",
  worked: "If your workspace runs on our shared infrastructure, nothing changes about how you install marketplace packages. Behind the scenes, packages now resolve through a new service instead of the older one we are retiring. A few remaining workflows move across at the next maintenance window.\n\nName the reader first: a tenant admin who installs packages, has never seen your ticket tracker, and does not know there are two resolution paths. Against that memory, \"PLAT-118\", \"cutover\", \"the legacy path\" and \"the shared plane\" are given only to the six people in the migration channel, and three of the four sat in the opening sentence. The opening slot now holds installing packages, the one thing this reader definitely holds. The cost is that this version cannot double as the internal note. The ticket handle is gone, so nobody can trace the paragraph back to the work, and the exact system names went with it, which means you maintain two versions of the same announcement. \"Shared plane\" became \"shared infrastructure\", which is looser and still not something a tenant can check against their own account, so the scope of the promise is softer than it was.",
  experiment: "Take something you wrote for your team and rewrite the first two sentences for a reader one step further out, a new starter or a customer. Change only what sits in the opening slot of each sentence. Then list the terms you had to move or gloss.",
  reflection: "Which terms turned out to be given only to you, and how many of them were in the first sentence?",
  recall: {
    q: "Where is the given and new contract actually scored?",
    a: "In this reader's memory, not in the document. Context they hold from elsewhere counts as given, and material you repeated earlier in your own draft may still be new to them.\n\nThat is why an unchanged paragraph can read cleanly internally and badly externally. The text did not change; the memory it was calibrated against did."
  },
  deepDive: "Assume the reader of this draft is a customer rather than my team, and tell me which openings stop being anchored."
},
{
  id: "cohesion-syntactic-closure",
  track: "cohesion", level: "sentence",
  title: "Every point of syntactic closure opens another stress position",
  source: "George Gopen and Judith Swan, \"The Science of Scientific Writing\"",
  gatePrompt: "Count the full stops, semicolons and colons in your paragraph. That is how many emphasis slots you have. Write down what currently occupies each one.",
  fallback: "The new scheduler reduces tail latency and it also removes the dependency on the shared Redis lock and we were able to delete about nine hundred lines of coordination code as a result, which the team was pleased about.",
  idea: "Colons, semicolons and full stops each create a moment of closure that carries emphasis, so use punctuation to manufacture the landing places you need.",
  why: "Emphasis attaches to closure, and closure happens wherever the syntax finishes a unit rather than only at the end of the sentence. A colon closes the frame and hands the following material a spotlight. A semicolon closes one full clause and starts another, giving you two stress positions where a comma splice would have given you one.\n\nThis turns punctuation into a placement tool rather than a correctness question. If a sentence contains three things worth emphasising, it currently has one stress position and two of the three will be lost. You either split it or repunctuate it so that each has somewhere to land.",
  failureMode: "Several genuine results strung together with \"and\" so that only the last one is emphasised, and that last one is the least important. In the fallback, three real outcomes compete for one slot and the slot goes to how the team felt about it.",
  worked: "The new scheduler changes three things: it cuts tail latency; it drops the dependency on the shared Redis lock; and it let us delete about nine hundred lines of coordination code.\n\nThe original had one point of closure for three real results, and the slot went to how the team felt about the third one. There are now four. The colon closes the frame and spotlights the list, and each semicolon closes a clause, so tail latency, the Redis lock and the nine hundred lines each get a landing place. What you give up is the aside about the team being pleased, the only human note in the sentence. Put it back and it needs a sentence of its own, which takes a stress position away from one of the results. The other cost is uniformity: three clauses now open with \"it\", and buying emphasis with punctuation is what produces that rhythm. If it grates, vary the clause openings, not the punctuation.",
  experiment: "Find your longest sentence from the past week. List the things in it that deserve emphasis. If there is more than one, repunctuate with a colon or a semicolon, or split it, until each has its own point of closure, then count the stress positions before and after.",
  reflection: "How many things were competing for one stress position, and which one had been winning?",
  recall: {
    q: "Why is punctuation a tool for emphasis rather than only a correctness question?",
    a: "Because emphasis attaches to syntactic closure, and colons, semicolons and full stops each create one. Each mark therefore manufactures an additional place a point can land.\n\nA sentence with three worthwhile claims and one full stop has one stress position, so two of the claims will be read as background."
  },
  deepDive: "Find the sentences in this draft where several claims are competing for a single stress position, and show me one repunctuated."
},
{
  id: "cohesion-long-opening-clause",
  track: "cohesion", level: "sentence",
  title: "A long opening clause spends the slot where the reader looks for the link",
  source: "George Gopen, The Sense of Structure",
  gatePrompt: "Count the words before the main subject of each sentence in your paragraph. Circle every sentence where that count is above about eight.",
  fallback: "In the event that a workflow exceeds its configured deadline and no terminal event has been recorded within the grace window, the executor marks the run as timed out. As of the March release, following the change to the heartbeat interval described above, the grace window is thirty seconds. Where a tenant has opted into extended retention, timed-out runs are preserved for audit.",
  idea: "Keep the material before the main subject short, because the reader is using that space to find the connection back to the previous sentence.",
  why: "The opening of a sentence does two jobs at once: it links backwards and it announces the topic. A short introductory phrase can do the first without displacing the second. A long one takes over the whole space, so the reader spends the linking slot processing a condition or a date and only meets the topic once the qualifier finally releases them.\n\nThe qualifier is usually not wrong, just badly placed. Conditions, timestamps and scope caveats are almost always safe to move behind the subject and verb, where they read as refinements of a claim the reader has already grasped rather than as a hurdle before it.",
  failureMode: "Sentences that make the reader wait through the conditions before learning what is being discussed. \"In the event that a workflow exceeds its configured deadline and no terminal event has been recorded within the grace window, the executor marks the run as timed out.\" Twenty-three words arrive before the executor does.",
  worked: "The executor marks a run as timed out when the workflow exceeds its configured deadline and no terminal event arrives within the grace window. The grace window has been thirty seconds since the March release, when the heartbeat interval changed. Timed-out runs are preserved for audit where a tenant has opted into extended retention.\n\nThe counts before the main subject were twenty-three, fourteen and eight. They are all zero now, and each sentence opens on the thing it is about rather than on the conditions under which that thing applies. The qualifiers were not wrong, only in front. The cost depends on which document you are writing. A reader scanning a runbook for their own case uses the front of the sentence to decide whether to keep reading, and a front-loaded condition does that navigation work. If that is the actual use, keep the condition first and shorten it instead of moving it. The third sentence was only borderline at eight words, and moving its condition to the back handed the stress position to scope rather than to \"audit\". That is a fair trade here, but it is a trade.",
  experiment: "Take a policy or runbook paragraph you have written. For each sentence, count the words before the main subject. Move every qualifier longer than about eight words to a position after the verb, then reread and note which ones genuinely had to stay in front.",
  reflection: "Which qualifiers actually needed to come first, and what made those different from the ones you moved?",
  recall: {
    q: "What does a long introductory clause cost, given that it is usually grammatically fine?",
    a: "It occupies the space the reader uses to link this sentence to the last one and to find the topic. The topic then arrives late, after the reader has already processed a condition they had no frame for.\n\nMost such qualifiers read better after the subject and verb, as refinements of a claim already understood."
  },
  deepDive: "Flag every sentence here with more than eight words before its main subject and show me two of them with the qualifier moved."
},
{
  id: "cohesion-subject-verb-gap",
  track: "cohesion", level: "sentence",
  title: "Separating subject from verb makes the reader carry everything in between",
  source: "George Gopen and Judith Swan, \"The Science of Scientific Writing\"",
  gatePrompt: "In each sentence of your paragraph, draw a line from the main subject to its verb. Count the words on that line. Mark any gap over about six words.",
  fallback: "The reconciler, which was rewritten last quarter to use the shared informer cache rather than polling the API server directly and which now runs one goroutine per namespace, drops events when the cache is cold. Our on-call runbook, updated after the February incident, says to restart the pod.",
  idea: "Keep the main verb close to its subject, and move any interruption that does not earn its place out of the gap.",
  why: "A reader who has taken a subject is waiting for its verb, because until the verb arrives the sentence has made no assertion. Everything placed in that gap is held in working memory alongside the unresolved subject, at full cost, while the reader continues to wait.\n\nThat cost is sometimes worth paying. An interruption in the subject-verb gap is conspicuous precisely because the reader is holding something open, so it can be used deliberately for a qualification the reader must have before the claim. What it cannot be is a convenient place to park background you did not want to give its own sentence.",
