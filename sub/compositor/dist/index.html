<title>Compositor - sentence craft, drilled on your own drafts</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* ==========================================================================
   Practicum — a daily logbook for management practice

   Identity: an engineering lab notebook. Pale technical paper stock, a 28px
   graph field locked to the prose baseline, drafting blue for structure and
   oxide red-pen for anything that asks you to act.

   Theming is token-level. Components read tokens and never reach inside a
   media query, so the viewer's explicit toggle can win in both directions.
   ========================================================================== */

/* --- Light tokens (the default ground) ----------------------------------- */
:root {
  --paper:        #F5F6F3;
  --paper-raised: #FFFFFF;
  --paper-sunk:   #EBEEE8;

  --grid:         rgba(20, 26, 34, 0.055);
  --grid-major:   rgba(20, 26, 34, 0.10);
  --rule:         #DBDFD7;
  --rule-strong:  #B6BEB4;

  --ink:          #141A22;
  --ink-muted:    #545F6A;
  --ink-faint:    #8B949D;

  --accent:       #1D4E80;
  --accent-ink:   #163D66;
  --accent-soft:  rgba(29, 78, 128, 0.09);
  --accent-line:  rgba(29, 78, 128, 0.30);

  --action:       #9E3A26;
  --action-soft:  rgba(158, 58, 38, 0.075);
  --action-line:  rgba(158, 58, 38, 0.32);

  --solid:        #2F6B4F;
  --shaky:        #8A6A1F;

  --shadow-card:  0 1px 0 rgba(20, 26, 34, 0.05), 0 8px 22px -14px rgba(20, 26, 34, 0.30);
  --shadow-lift:  0 1px 0 rgba(20, 26, 34, 0.06), 0 16px 34px -18px rgba(20, 26, 34, 0.38);

  /* Type roles. No CDN fonts: the Artifact CSP blocks font hosts, and a
     linked webfont would fail silently, so every role resolves locally. */
  --face-display: Superclarendon, Rockwell, "Bookman Old Style", "Roboto Slab", Georgia, serif;
  --face-text:    Charter, "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --face-ui:      "Helvetica Neue", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  --face-mono:    "SF Mono", SFMono-Regular, Menlo, "Cascadia Mono", Consolas, monospace;

  /* 28px baseline. The graph field is a 28px minor / 140px major multiple of
     it, so body lines land on grid lines rather than near them. */
  --lead:  28px;
  --u:     7px;
  --rail:  17rem;
  --measure: 66ch;
}

/* --- Dark tokens: a negative blueprint under lamplight -------------------
   Retuned rather than inverted. The blue lifts to hold contrast on a dark
   ground; the red-pen warms so it still reads as ink, not as an error state. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper:        #101418;
    --paper-raised: #171D24;
    --paper-sunk:   #0B0E12;

    --grid:         rgba(158, 190, 214, 0.055);
    --grid-major:   rgba(158, 190, 214, 0.085);
    --rule:         #232C34;
    --rule-strong:  #37444E;

    --ink:          #DCE3E9;
    --ink-muted:    #96A2AD;
    --ink-faint:    #68737D;

    --accent:       #6EA8D4;
    --accent-ink:   #9AC4E4;
    --accent-soft:  rgba(110, 168, 212, 0.13);
    --accent-line:  rgba(110, 168, 212, 0.34);

    --action:       #D9755C;
    --action-soft:  rgba(217, 117, 92, 0.12);
    --action-line:  rgba(217, 117, 92, 0.36);

    --solid:        #63B08A;
    --shaky:        #C9A651;

    --shadow-card:  0 1px 0 rgba(0, 0, 0, 0.4), 0 8px 22px -14px rgba(0, 0, 0, 0.7);
    --shadow-lift:  0 1px 0 rgba(0, 0, 0, 0.45), 0 16px 34px -18px rgba(0, 0, 0, 0.8);
  }
}

:root[data-theme="dark"] {
  --paper:        #101418;
  --paper-raised: #171D24;
  --paper-sunk:   #0B0E12;

  --grid:         rgba(158, 190, 214, 0.055);
  --grid-major:   rgba(158, 190, 214, 0.085);
  --rule:         #232C34;
  --rule-strong:  #37444E;

  --ink:          #DCE3E9;
  --ink-muted:    #96A2AD;
  --ink-faint:    #68737D;

  --accent:       #6EA8D4;
  --accent-ink:   #9AC4E4;
  --accent-soft:  rgba(110, 168, 212, 0.13);
  --accent-line:  rgba(110, 168, 212, 0.34);

  --action:       #D9755C;
  --action-soft:  rgba(217, 117, 92, 0.12);
  --action-line:  rgba(217, 117, 92, 0.36);

  --solid:        #63B08A;
  --shaky:        #C9A651;

  --shadow-card:  0 1px 0 rgba(0, 0, 0, 0.4), 0 8px 22px -14px rgba(0, 0, 0, 0.7);
  --shadow-lift:  0 1px 0 rgba(0, 0, 0, 0.45), 0 16px 34px -18px rgba(0, 0, 0, 0.8);
}

/* --- Ground -------------------------------------------------------------- */
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--face-text);
  font-size: 17px;
  line-height: var(--lead);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

h1, h2, h3, h4, p, ul, ol, dl, dd, dt, figure, blockquote {
  margin: 0;
  padding: 0;
}
ul, ol { list-style: none; }
button { font: inherit; color: inherit; }

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
  border-radius: 1px;
}

.skip {
  position: absolute;
  left: -9999px;
  top: 0;
  z-index: 50;
  padding: var(--u) calc(var(--u) * 2);
  background: var(--accent);
  color: #fff;
  font-family: var(--face-ui);
  font-size: 0.8125rem;
  text-decoration: none;
}
.skip:focus { left: var(--u); top: var(--u); }

/* --- Shared type roles --------------------------------------------------- */
.eyebrow {
  font-family: var(--face-ui);
  font-size: 0.6875rem;
  font-weight: 600;
  letter-spacing: 0.13em;
  text-transform: uppercase;
  color: var(--ink-faint);
}

.num { font-family: var(--face-mono); font-variant-numeric: tabular-nums; }

/* ==========================================================================
   Layout: a bound page. Spine rail carries identity and position; the field
   is the paper itself.
   ========================================================================== */
.logbook {
  display: grid;
  grid-template-columns: var(--rail) minmax(0, 1fr);
  min-height: 100vh;
}

/* --- Spine --------------------------------------------------------------- */
.spine {
  position: sticky;
  top: 0;
  align-self: start;
  height: 100vh;
  display: flex;
  flex-direction: column;
  gap: calc(var(--u) * 4);
  padding: calc(var(--u) * 5) calc(var(--u) * 4);
  background: var(--paper-sunk);
  border-right: 1px solid var(--rule);
  overflow-y: auto;
}

.spine__head { display: flex; flex-direction: column; gap: calc(var(--u) * 0.5); }

.wordmark {
  font-family: var(--face-display);
  font-size: 1.75rem;
  font-weight: 400;
  letter-spacing: -0.015em;
  line-height: 1.1;
}

.spine__sub {
  font-family: var(--face-ui);
  font-size: 0.75rem;
  line-height: 1.45;
  color: var(--ink-muted);
  max-width: 15ch;
}

/* The entry stamp: position in the sequence, set like a plate number. */
.stamp {
  display: flex;
  flex-direction: column;
  padding-top: calc(var(--u) * 2);
  border-top: 2px solid var(--ink);
}
.stamp__label {
  font-family: var(--face-ui);
  font-size: 0.625rem;
  font-weight: 600;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--ink-faint);
}
.stamp__num {
  font-family: var(--face-mono);
  font-variant-numeric: tabular-nums;
  font-size: 2.75rem;
  line-height: 1.05;
  letter-spacing: -0.03em;
  color: var(--accent);
}
.stamp__date {
  font-family: var(--face-mono);
  font-size: 0.6875rem;
  letter-spacing: 0.04em;
  color: var(--ink-muted);
  text-transform: uppercase;
}

/* --- Nav ----------------------------------------------------------------- */
.nav { display: flex; flex-direction: column; }

.nav__item {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--u);
  width: 100%;
  padding: calc(var(--u) * 1.4) 0;
  background: none;
  border: 0;
  border-bottom: 1px solid var(--rule);
  font-family: var(--face-ui);
  font-size: 0.875rem;
  text-align: left;
  color: var(--ink-muted);
  cursor: pointer;
  transition: color 0.12s ease;
}
.nav__item:first-child { border-top: 1px solid var(--rule); }
.nav__item:hover { color: var(--ink); }
.nav__item[aria-current="page"] {
  color: var(--ink);
  font-weight: 600;
  box-shadow: inset 2px 0 0 var(--accent);
  padding-left: var(--u);
}

.nav__badge {
  font-family: var(--face-mono);
  font-variant-numeric: tabular-nums;
  font-size: 0.6875rem;
  padding: 1px 6px;
  border-radius: 2px;
  background: var(--action);
  color: #fff;
}

/* --- Gauge: the small instrument panel ---------------------------------- */
.gauge {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: var(--u);
  margin-top: auto;
}
.gauge__cell { display: flex; flex-direction: column; gap: 2px; }
.gauge dt {
  font-family: var(--face-ui);
  font-size: 0.5625rem;
  font-weight: 600;
  letter-spacing: 0.11em;
  text-transform: uppercase;
  color: var(--ink-faint);
}
.gauge dd {
  font-family: var(--face-mono);
  font-variant-numeric: tabular-nums;
  font-size: 1.125rem;
  color: var(--ink);
}

.spine__foot { padding-top: calc(var(--u) * 1.5); border-top: 1px solid var(--rule); }

.ghost {
  padding: calc(var(--u) * 0.7) var(--u);
  background: none;
  border: 1px solid var(--rule-strong);
  border-radius: 2px;
  font-family: var(--face-ui);
  font-size: 0.75rem;
  color: var(--ink-muted);
  cursor: pointer;
  transition: border-color 0.12s ease, color 0.12s ease;
}
.ghost:hover { border-color: var(--ink-muted); color: var(--ink); }

/* --- Field: the graph paper ---------------------------------------------- */
.field {
  padding: calc(var(--u) * 8) calc(var(--u) * 7) calc(var(--u) * 14);
  background-color: var(--paper);
  background-image:
    linear-gradient(to right,  var(--grid-major) 0 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid-major) 0 1px, transparent 1px),
    linear-gradient(to right,  var(--grid) 0 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid) 0 1px, transparent 1px);
  background-size: 140px 140px, 140px 140px, 28px 28px, 28px 28px;
  background-position: 0 0;
}
.field:focus { outline: none; }

.view { display: flex; flex-direction: column; gap: calc(var(--u) * 5); max-width: 78ch; }

/* ==========================================================================
   Entry: the daily lesson
   ========================================================================== */
.entry { display: flex; flex-direction: column; gap: calc(var(--u) * 4); }

.entry__head { display: flex; flex-direction: column; gap: calc(var(--u) * 2); }

.tags { display: flex; flex-wrap: wrap; gap: var(--u); align-items: center; }

.tag {
  font-family: var(--face-ui);
  font-size: 0.625rem;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 3px 7px;
  border-radius: 2px;
  background: var(--accent-soft);
  color: var(--accent-ink);
}
.tag--level {
  background: none;
  border: 1px solid var(--rule-strong);
  color: var(--ink-muted);
}
.tag--time {
  background: none;
  color: var(--ink-faint);
  font-family: var(--face-mono);
  letter-spacing: 0.04em;
  text-transform: none;
  padding-left: 0;
}

.entry__title {
  font-family: var(--face-display);
  font-size: clamp(2.125rem, 4.6vw, 3.125rem);
  font-weight: 400;
  line-height: 1.07;
  letter-spacing: -0.022em;
  text-wrap: balance;
  max-width: 26ch;
}

/* The one orchestrated moment: the rule under the title draws itself. */
.entry__rule {
  height: 2px;
  background: var(--ink);
  transform-origin: left;
  animation: draw 0.55s cubic-bezier(0.22, 0.61, 0.36, 1) both;
}
@keyframes draw { from { transform: scaleX(0); } to { transform: scaleX(1); } }

.entry__source {
  font-family: var(--face-ui);
  font-size: 0.8125rem;
  color: var(--ink-muted);
}
.entry__source em { font-style: italic; }

/* --- Prose blocks -------------------------------------------------------- */
.block { display: flex; flex-direction: column; gap: calc(var(--u) * 1.5); }

.block__label {
  font-family: var(--face-ui);
  font-size: 0.6875rem;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-faint);
}

.block__body { max-width: var(--measure); display: flex; flex-direction: column; gap: var(--lead); }
.block__body p { line-height: var(--lead); }

.lead { font-size: 1.1875rem; line-height: 32px; }
.lead strong { font-weight: 600; }

/* Failure mode gets a quiet sunk panel — it is a warning, not an action. */
.block--failure .block__body {
  padding: calc(var(--u) * 2.5) calc(var(--u) * 3);
  background: var(--paper-sunk);
  border-left: 2px solid var(--rule-strong);
}

/* --- The experiment: a stamped action item in red pen -------------------- */
.experiment {
  display: flex;
  flex-direction: column;
  gap: calc(var(--u) * 1.5);
  padding: calc(var(--u) * 3.5);
  background: var(--action-soft);
  border: 1px solid var(--action-line);
  border-left: 3px solid var(--action);
  border-radius: 2px;
}
.experiment__label {
  font-family: var(--face-ui);
  font-size: 0.6875rem;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--action);
}
.experiment__body { max-width: var(--measure); }

/* --- Reflection: a ruled writing surface --------------------------------- */
.reflect { display: flex; flex-direction: column; gap: calc(var(--u) * 1.5); }
.reflect__prompt {
  max-width: var(--measure);
  font-style: italic;
  color: var(--ink-muted);
}

.reflect__field {
  display: block;
  width: 100%;
  max-width: var(--measure);
  min-height: calc(var(--lead) * 4);
  padding: 0 calc(var(--u) * 1.5);
  border: 0;
  border-radius: 0;
  background-color: var(--paper-raised);
  background-image: linear-gradient(to bottom, transparent calc(var(--lead) - 1px), var(--rule) calc(var(--lead) - 1px));
  background-size: 100% var(--lead);
  box-shadow: inset 0 0 0 1px var(--rule);
  color: var(--ink);
  font-family: var(--face-text);
  font-size: 17px;
  line-height: var(--lead);
  resize: vertical;
}
.reflect__field:focus { box-shadow: inset 0 0 0 1px var(--accent-line); outline: none; }
.reflect__field::placeholder { color: var(--ink-faint); font-style: italic; }

.reflect__state {
  font-family: var(--face-mono);
  font-size: 0.6875rem;
  color: var(--ink-faint);
  min-height: var(--lead);
}

/* --- Actions row --------------------------------------------------------- */
.actions {
  display: flex;
  flex-wrap: wrap;
  gap: calc(var(--u) * 1.5);
  align-items: center;
  padding-top: calc(var(--u) * 2);
  border-top: 1px solid var(--rule);
}

.btn {
  padding: calc(var(--u) * 1.3) calc(var(--u) * 2.5);
  background: var(--ink);
  border: 1px solid var(--ink);
  border-radius: 2px;
  font-family: var(--face-ui);
  font-size: 0.8125rem;
  font-weight: 600;
  color: var(--paper);
  cursor: pointer;
  transition: opacity 0.12s ease;
}
.btn:hover { opacity: 0.86; }
.btn[disabled] { opacity: 0.4; cursor: default; }

.btn--quiet {
  background: none;
  border-color: var(--rule-strong);
  color: var(--ink-muted);
  font-weight: 500;
}
.btn--quiet:hover { border-color: var(--ink-muted); color: var(--ink); opacity: 1; }

.btn--done {
  background: var(--accent-soft);
  border-color: var(--accent-line);
  color: var(--accent-ink);
}

/* --- The reader ----------------------------------------------------------
   Sits under the source line, in the header rather than in the actions row at
   the foot: it is an offer about how to take the entry in, so it has to be
   there before you have read it. */
.reader {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--u);
  margin-top: var(--u);
}

.reader__btn {
  padding: calc(var(--u) * 0.8) calc(var(--u) * 1.6);
  font-size: 0.75rem;
}

.reader__note {
  font-family: var(--face-ui);
  font-size: 0.75rem;
  color: var(--ink-faint);
}

/* The tint is bled outwards with a spread shadow rather than padding, so the
   block being spoken lights up without the prose reflowing under it. */
[data-reading] {
  background: var(--accent-soft);
  box-shadow: 0 0 0 6px var(--accent-soft);
  border-radius: 1px;
  transition: background 0.2s ease;
}

/* --- Library pager -------------------------------------------------------
   Two equal columns so the next entry keeps the right-hand side whether or not
   there is a previous one to balance it. auto-fit rather than a breakpoint:
   the titles are clipped to one line, and below roughly 14rem a column shows
   too few characters of a title to be worth reading, so it stacks instead. */
.pager {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr));
  gap: calc(var(--u) * 1.5);
  margin-top: calc(var(--u) * 4);
}

.pager__btn {
  display: flex;
  flex-direction: column;
  gap: calc(var(--u) * 0.5);
  min-width: 0;
  padding: calc(var(--u) * 1.5) calc(var(--u) * 2);
  background: none;
  border: 1px solid var(--rule-strong);
  border-radius: 2px;
  cursor: pointer;
  text-align: left;
  transition: border-color 0.12s ease, background 0.12s ease;
}
.pager__btn:hover { border-color: var(--ink-muted); background: var(--accent-soft); }
.pager__btn--next { align-items: flex-end; text-align: right; }

.pager__dir {
  font-family: var(--face-ui);
  font-size: 0.625rem;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-faint);
}

/* One line, clipped. A long title wrapping to three lines turns a navigation
   control into the largest thing on the screen after the entry itself. */
.pager__title {
  max-width: 100%;
  overflow: hidden;
  font-family: var(--face-text);
  font-size: 0.9375rem;
  line-height: 1.3;
  color: var(--ink);
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* Holds the column so a missing neighbour does not slide the other button
   across, and says which end you reached rather than leaving a gap. */
.pager__end {
  display: flex;
  align-items: center;
  padding: calc(var(--u) * 1.5) calc(var(--u) * 2);
  font-family: var(--face-ui);
  font-size: 0.625rem;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-faint);
}
.pager__end:last-child { justify-content: flex-end; }

/* --- Deep dive ----------------------------------------------------------- */
.deepdive {
  display: flex;
  flex-direction: column;
  gap: calc(var(--u) * 1.5);
  padding: calc(var(--u) * 3);
  border: 1px dashed var(--accent-line);
  border-radius: 2px;
}
.deepdive__note {
  max-width: var(--measure);
  font-size: 0.9375rem;
  color: var(--ink-muted);
}
.deepdive__text {
  max-width: var(--measure);
  max-height: 40vh;
  overflow: auto;
  padding: calc(var(--u) * 2);
  background: var(--paper-sunk);
  border: 1px solid var(--rule);
  font-family: var(--face-mono);
  font-size: 0.8125rem;
  line-height: 1.6;
  white-space: pre-wrap;
  overflow-wrap: break-word;
}

/* ==========================================================================
   Review: index cards
   ========================================================================== */
.card {
  display: flex;
  flex-direction: column;
  gap: calc(var(--u) * 2);
  max-width: 62ch;
  padding: calc(var(--u) * 4);
  background: var(--paper-raised);
  border: 1px solid var(--rule);
  border-top: 3px solid var(--accent);
  border-radius: 2px;
  box-shadow: var(--shadow-card);
}

.card__meta {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: var(--u);
  font-family: var(--face-mono);
  font-size: 0.6875rem;
  color: var(--ink-faint);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.card__q {
  font-family: var(--face-display);
  font-size: 1.4375rem;
  font-weight: 400;
  line-height: 1.28;
  letter-spacing: -0.01em;
  text-wrap: balance;
}

.card__a {
  padding-top: calc(var(--u) * 2);
  border-top: 1px solid var(--rule);
  animation: settle 0.28s ease both;
}
@keyframes settle { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

.grades { display: flex; flex-wrap: wrap; gap: var(--u); }
.grade {
  flex: 1 1 auto;
  padding: calc(var(--u) * 1.3) calc(var(--u) * 2);
  background: none;
  border: 1px solid var(--rule-strong);
  border-radius: 2px;
  font-family: var(--face-ui);
  font-size: 0.8125rem;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.12s ease, border-color 0.12s ease;
}
.grade__hint {
  display: block;
  font-weight: 400;
  font-size: 0.6875rem;
  color: var(--ink-faint);
}
.grade--miss:hover  { border-color: var(--action); background: var(--action-soft); }
.grade--close:hover { border-color: var(--shaky); background: color-mix(in srgb, var(--shaky) 9%, transparent); }
.grade--got:hover   { border-color: var(--solid); background: color-mix(in srgb, var(--solid) 9%, transparent); }

/* ==========================================================================
   Library
   ========================================================================== */
.filters { display: flex; flex-wrap: wrap; gap: var(--u); align-items: center; }

.search {
  flex: 1 1 18ch;
  min-width: 0;
  padding: calc(var(--u) * 1.2) calc(var(--u) * 1.5);
  background: var(--paper-raised);
  border: 1px solid var(--rule);
  border-radius: 2px;
  color: var(--ink);
  font-family: var(--face-ui);
  font-size: 0.875rem;
}
.search:focus { border-color: var(--accent-line); outline: none; }

.chip {
  padding: calc(var(--u) * 0.8) calc(var(--u) * 1.4);
  background: none;
  border: 1px solid var(--rule-strong);
  border-radius: 2px;
  font-family: var(--face-ui);
  font-size: 0.75rem;
  color: var(--ink-muted);
  cursor: pointer;
}
.chip[aria-pressed="true"] {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--paper);
}

.shelf { display: flex; flex-direction: column; }

.shelf__row {
  display: grid;
  grid-template-columns: 4.5ch minmax(0, 1fr) auto;
  gap: calc(var(--u) * 2);
  align-items: baseline;
  width: 100%;
  padding: calc(var(--u) * 1.7) var(--u);
  background: none;
  border: 0;
  border-bottom: 1px solid var(--rule);
  text-align: left;
  cursor: pointer;
  transition: background 0.1s ease;
}
.shelf__row:hover { background: var(--accent-soft); }
.shelf__num {
  font-family: var(--face-mono);
  font-variant-numeric: tabular-nums;
  font-size: 0.75rem;
  color: var(--ink-faint);
}
.shelf__title { font-family: var(--face-text); font-size: 1rem; line-height: 1.4; }
.shelf__track {
  font-family: var(--face-ui);
  font-size: 0.625rem;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-faint);
}

.pip {
  display: inline-block;
  width: 6px;
  height: 6px;
  margin-right: var(--u);
  border-radius: 50%;
  background: var(--rule-strong);
  vertical-align: 1px;
}
.pip--logged { background: var(--accent); }
.pip--solid  { background: var(--solid); }
.pip--shaky  { background: var(--shaky); }

/* ==========================================================================
   Journal
   ========================================================================== */
.note {
  display: flex;
  flex-direction: column;
  gap: var(--u);
  max-width: var(--measure);
  padding-bottom: calc(var(--u) * 3);
  border-bottom: 1px solid var(--rule);
}
.note__meta {
  display: flex;
  flex-wrap: wrap;
  gap: calc(var(--u) * 1.5);
  align-items: baseline;
  font-family: var(--face-mono);
  font-size: 0.6875rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--ink-faint);
}
.note__title { font-family: var(--face-display); font-size: 1.1875rem; font-weight: 400; line-height: 1.3; }
.note__body { white-space: pre-wrap; }

/* ==========================================================================
   Progress
   ========================================================================== */
.readout {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(11rem, 1fr));
  gap: 1px;
  background: var(--rule);
  border: 1px solid var(--rule);
  border-radius: 2px;
}
.readout__cell {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: calc(var(--u) * 2.5);
  background: var(--paper-raised);
}
.readout__label {
  font-family: var(--face-ui);
  font-size: 0.625rem;
  font-weight: 600;
  letter-spacing: 0.11em;
  text-transform: uppercase;
  color: var(--ink-faint);
}
.readout__value {
  font-family: var(--face-mono);
  font-variant-numeric: tabular-nums;
  font-size: 1.875rem;
  line-height: 1.15;
  letter-spacing: -0.02em;
}
.readout__unit { font-family: var(--face-ui); font-size: 0.75rem; color: var(--ink-muted); }

.coverage { display: flex; flex-direction: column; gap: calc(var(--u) * 2); }
.cov { display: grid; grid-template-columns: minmax(9rem, 14rem) minmax(0, 1fr) 5ch; gap: calc(var(--u) * 2); align-items: center; }
.cov__name { font-family: var(--face-ui); font-size: 0.8125rem; }
.cov__bar { height: 8px; background: var(--paper-sunk); box-shadow: inset 0 0 0 1px var(--rule); }
.cov__fill { height: 100%; background: var(--accent); }
.cov__n {
  font-family: var(--face-mono);
  font-variant-numeric: tabular-nums;
  font-size: 0.75rem;
  color: var(--ink-muted);
  text-align: right;
}

/* ==========================================================================
   Shared furniture
   ========================================================================== */
.section__head {
  display: flex;
  flex-direction: column;
  gap: var(--u);
  padding-bottom: calc(var(--u) * 2);
  border-bottom: 2px solid var(--ink);
}
.section__title {
  font-family: var(--face-display);
  font-size: 1.875rem;
  font-weight: 400;
  line-height: 1.15;
  letter-spacing: -0.018em;
}
.section__note { max-width: var(--measure); font-size: 0.9375rem; color: var(--ink-muted); }

.empty {
  max-width: var(--measure);
  padding: calc(var(--u) * 5) 0;
  color: var(--ink-muted);
  font-style: italic;
}

.toast {
  position: fixed;
  bottom: calc(var(--u) * 3);
  left: 50%;
  transform: translate(-50%, calc(100% + var(--u) * 6));
  z-index: 40;
  padding: calc(var(--u) * 1.4) calc(var(--u) * 3);
  background: var(--ink);
  color: var(--paper);
  border-radius: 2px;
  font-family: var(--face-ui);
  font-size: 0.8125rem;
  box-shadow: var(--shadow-lift);
  transition: transform 0.24s cubic-bezier(0.22, 0.61, 0.36, 1);
}
.toast[data-open="true"] { transform: translate(-50%, 0); }

/* ==========================================================================
   Narrow: the spine unbinds into a top bar
   ========================================================================== */
@media (max-width: 60rem) {
  .logbook { grid-template-columns: minmax(0, 1fr); }

  .spine {
    position: static;
    height: auto;
    gap: calc(var(--u) * 3);
    padding: calc(var(--u) * 3.5) calc(var(--u) * 3);
    border-right: 0;
    border-bottom: 1px solid var(--rule);
    overflow: visible;
  }
  .spine__sub { display: none; }
  .spine__head { flex-direction: row; align-items: baseline; gap: calc(var(--u) * 2); }

  .stamp { flex-direction: row; align-items: baseline; gap: calc(var(--u) * 1.5); padding-top: var(--u); }
  .stamp__num { font-size: 1.75rem; }

  .nav { flex-direction: row; overflow-x: auto; gap: calc(var(--u) * 2.5); }
  .nav__item { width: auto; flex: 0 0 auto; border: 0; padding: var(--u) 0; }
  .nav__item:first-child { border-top: 0; }
  .nav__item[aria-current="page"] {
    box-shadow: inset 0 -2px 0 var(--accent);
    padding-left: 0;
  }

  .gauge { margin-top: 0; grid-template-columns: repeat(3, auto); gap: calc(var(--u) * 3); }
  .spine__foot { border-top: 0; padding-top: 0; }

  .field { padding: calc(var(--u) * 5) calc(var(--u) * 3) calc(var(--u) * 12); }
  .cov { grid-template-columns: minmax(0, 1fr) 5ch; }
  .cov__bar { grid-column: 1 / -1; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

/* ==========================================================================
   Daily — components the base sheet does not carry

   Everything here belongs to a mechanic that only some sites turn on: the
   commitment gate, expiry, the attempts log, the forecast book. Tokens only,
   no literal colours, so a site theme retunes these along with everything
   else.
   ========================================================================== */

/* --- The gate ------------------------------------------------------------
   Deliberately heavy. It is the one thing on the page that stops you, and a
   stop that looks like a form field gets skipped. */
.gate {
  max-width: var(--measure);
  margin: calc(var(--u) * 4) 0;
  padding: calc(var(--u) * 3);
  background: var(--action-soft);
  border: 1px solid var(--action-line);
  border-left-width: 3px;
  border-radius: 2px;
}
.gate--done {
  background: var(--paper-sunk);
  border-color: var(--rule);
  border-left-color: var(--rule-strong);
}
.gate__intro {
  margin-bottom: calc(var(--u) * 2);
  padding-bottom: calc(var(--u) * 2);
  border-bottom: 1px solid var(--action-line);
}
.gate__intro p + p { margin-top: var(--lead); }
.gate__prompt {
  font-family: var(--face-display);
  font-size: 1.25rem;
  line-height: 1.35;
  margin-bottom: calc(var(--u) * 2);
}
.gate__field { min-height: calc(var(--lead) * 4); }
.gate__note {
  margin-top: var(--u);
  font-family: var(--face-ui);
  font-size: 0.8125rem;
  color: var(--ink-muted);
}
.gate__stamp {
  font-family: var(--face-mono);
  font-size: 0.6875rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-faint);
  margin-bottom: var(--u);
}
.gate__answer { white-space: pre-wrap; color: var(--ink-muted); font-style: italic; }
.gate__answer p + p { margin-top: var(--lead); }

.gate__fallback { margin-bottom: calc(var(--u) * 2); }
.gate__fallback summary {
  cursor: pointer;
  font-family: var(--face-ui);
  font-size: 0.8125rem;
  color: var(--ink-muted);
}
.gate__fallbacktext {
  margin: var(--u) 0;
  padding: calc(var(--u) * 2);
  background: var(--paper-raised);
  border: 1px dashed var(--rule-strong);
  font-size: 0.9375rem;
}

.gate__curtain {
  max-width: var(--measure);
  padding: calc(var(--u) * 4) 0;
  font-family: var(--face-ui);
  font-size: 0.9375rem;
  color: var(--ink-faint);
  border-top: 1px dashed var(--rule-strong);
}

/* --- Worked example ------------------------------------------------------ */
/* Sits directly under the failure mode, and has to read as the answer to it
   rather than as one more block of commentary. The accent rule and the raised
   stock do that; the first paragraph is the repair itself, so it gets the
   weight and the rest of the block stays quiet. */
.worked {
  max-width: var(--measure);
  margin: calc(var(--u) * 4) 0;
  padding: calc(var(--u) * 3);
  background: var(--paper-raised);
  border: 1px solid var(--rule);
  border-left: 3px solid var(--accent);
  border-radius: 2px;
}
.worked__body {
  margin-top: var(--u);
}
.worked__body p + p {
  margin-top: var(--lead);
}
/* The repair. Set in the reading face at full size so it can be compared
   against the specimen without the eye having to change gear. */
.worked__body p:first-child {
  font-size: 1.0625rem;
  line-height: 1.6;
  color: var(--ink);
}
/* What it changed, and what it cost. */
.worked__body p:last-child:not(:first-child) {
  font-family: var(--face-ui);
  font-size: 0.875rem;
  line-height: 1.55;
  color: var(--ink-muted);
  padding-top: calc(var(--u) * 1.5);
  border-top: 1px solid var(--rule);
}

/* --- Arithmetic gate ----------------------------------------------------- */
/* Same visual weight as the text gate, because it does the same job one notch
   harder. The gap is the only part that earns colour: over and under are
   different mistakes and the reader should be able to see which one they keep
   making without reading the number. */
.compute {
  max-width: var(--measure);
  margin: calc(var(--u) * 4) 0;
  padding: calc(var(--u) * 3);
  background: var(--action-soft);
  border: 1px solid var(--action-line);
  border-left-width: 3px;
  border-radius: 2px;
}
.compute--done {
  background: var(--paper-sunk);
  border-color: var(--rule);
  border-left-color: var(--rule-strong);
}
.compute__q {
  margin-top: var(--u);
  font-size: 1.0625rem;
  line-height: 1.5;
}
.compute__note {
  margin-top: var(--u);
  font-family: var(--face-ui);
  font-size: 0.8125rem;
  color: var(--ink-faint);
}
.compute__fields {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  gap: var(--u) calc(var(--u) * 2);
  margin: calc(var(--u) * 2) 0;
}
.compute__lab {
  font-family: var(--face-ui);
  font-size: 0.875rem;
  color: var(--ink-muted);
}
.compute__unit { color: var(--ink-faint); }
.compute__row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: calc(var(--u) * 2);
  margin: calc(var(--u) * 2) 0;
}
.compute__input {
  font-family: var(--face-mono);
  font-size: 1rem;
  font-variant-numeric: tabular-nums;
  padding: calc(var(--u) * 1.25) calc(var(--u) * 1.5);
  background: var(--paper-raised);
  color: var(--ink);
  border: 1px solid var(--rule-strong);
  border-radius: 2px;
  min-width: 10ch;
}
.compute__input:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}
.compute__result {
  margin-top: calc(var(--u) * 1.5);
  font-variant-numeric: tabular-nums;
}
.compute__gap {
  margin-top: var(--u);
  font-family: var(--face-ui);
  font-size: 0.875rem;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.compute__gap[data-dir="exact"] { color: var(--solid); }
.compute__gap[data-dir="over"],
.compute__gap[data-dir="under"] { color: var(--action); }

/* --- Evidence gate ------------------------------------------------------- */
/* Seven verdicts, four colours. The colour answers only "how much weight does
   this carry", which is the question the reader is actually asking; the label
   carries the distinction between, say, never-repeated and disputed. Giving
   each verdict its own hue would imply seven degrees of trust and there are
   not seven. */
.evidence {
  max-width: var(--measure);
  margin: calc(var(--u) * 3) 0;
  padding: calc(var(--u) * 2) calc(var(--u) * 2.5);
  background: var(--paper-sunk);
  border-left: 3px solid var(--rule-strong);
}
.evidence__cite {
  margin: calc(var(--u) * 0.75) 0 0;
  font-family: var(--face-mono);
  font-size: 0.875rem;
  line-height: 1.5;
  color: var(--ink);
}
.evidence__interval {
  margin: calc(var(--u) * 0.5) 0 0;
  font-family: var(--face-mono);
  font-size: 0.8125rem;
  font-variant-numeric: tabular-nums;
  color: var(--ink-muted);
}
.evidence__meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: calc(var(--u) * 1.5);
  margin: calc(var(--u) * 1.5) 0 0;
}
.rep-chip {
  font-family: var(--face-ui);
  font-size: 0.6875rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 2px 7px;
  border: 1px solid currentColor;
  color: var(--ink-muted);
}
.evidence__asat,
.evidence__stale {
  font-family: var(--face-ui);
  font-size: 0.75rem;
  color: var(--ink-faint);
}

.evidence[data-rep="replicated"] { border-left-color: var(--solid); }
.evidence[data-rep="replicated"] .rep-chip { color: var(--solid); }

.evidence[data-rep="single"],
.evidence[data-rep="contested"] { border-left-color: var(--shaky); }
.evidence[data-rep="single"] .rep-chip,
.evidence[data-rep="contested"] .rep-chip { color: var(--shaky); }

.evidence[data-rep="failed"],
.evidence[data-rep="overclaimed"] { border-left-color: var(--action); }
.evidence[data-rep="failed"] .rep-chip,
.evidence[data-rep="overclaimed"] .rep-chip { color: var(--action); }

.evidence[data-rep="statute"] { border-left-color: var(--accent); }
.evidence[data-rep="statute"] .rep-chip { color: var(--accent); }

/* Staleness is about the check, not the claim, so it marks the block without
   overriding the verdict colour the claim earned. */
.evidence[data-stale="1"] { border-left-style: dashed; }
.evidence[data-stale="1"] .evidence__stale { color: var(--action); }

/* --- Expiry -------------------------------------------------------------- */
.tag--lapsed {
  background: none;
  border: 1px solid var(--action-line);
  color: var(--action);
}
.pip--lapsed {
  background: none;
  border: 1px solid var(--rule-strong);
  width: 5px;
  height: 5px;
}

/* --- Attempts log -------------------------------------------------------- */
.attempt {
  display: flex;
  flex-direction: column;
  gap: var(--u);
  max-width: var(--measure);
  padding-bottom: calc(var(--u) * 3);
  margin-bottom: calc(var(--u) * 3);
  border-bottom: 1px solid var(--rule);
}
.attempt__past {
  padding-left: calc(var(--u) * 2);
  border-left: 2px solid var(--accent-line);
  white-space: pre-wrap;
}
.attempt__past span {
  font-family: var(--face-mono);
  font-size: 0.6875rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--ink-faint);
  margin-right: var(--u);
}
.attempt__new { display: flex; flex-direction: column; gap: var(--u); align-items: flex-start; }
.attempt__field { min-height: calc(var(--lead) * 2); }

/* --- Journal, gated entries --------------------------------------------- */
.note__label {
  font-family: var(--face-ui);
  font-size: 0.6875rem;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-faint);
}
.note__body--gate {
  color: var(--ink-muted);
  font-style: italic;
  padding-left: calc(var(--u) * 2);
  border-left: 2px solid var(--action-line);
}

/* --- Forecast seed, inside an entry -------------------------------------- */
.fc-seed {
  max-width: var(--measure);
  margin: calc(var(--u) * 4) 0;
  padding: calc(var(--u) * 3);
  background: var(--paper-sunk);
  border: 1px solid var(--rule);
  border-radius: 2px;
}
.fc-seed__q {
  font-family: var(--face-display);
  font-size: 1.125rem;
  line-height: 1.35;
  margin-bottom: calc(var(--u) * 2);
}
.fc-seed__row {
  display: flex;
  flex-wrap: wrap;
  gap: calc(var(--u) * 2);
  align-items: center;
}
.fc-seed__lab {
  font-family: var(--face-ui);
  font-size: 0.8125rem;
  color: var(--ink-muted);
  display: inline-flex;
  align-items: center;
  gap: var(--u);
}
.fc-seed__p, .fc-seed__d {
  font-family: var(--face-mono);
  font-size: 0.875rem;
  padding: 5px 7px;
  color: var(--ink);
  background: var(--paper-raised);
  border: 1px solid var(--rule-strong);
  border-radius: 2px;
}
.fc-seed__p { width: 4.5rem; }

/* --- Forecast book ------------------------------------------------------- */
.fc-group {
  max-width: var(--measure);
  margin-bottom: calc(var(--u) * 5);
  display: flex;
  flex-direction: column;
  gap: var(--u);
}
.fc-new__q { min-height: calc(var(--lead) * 2); }
.fc-row {
  display: flex;
  flex-wrap: wrap;
  gap: calc(var(--u) * 2);
  justify-content: space-between;
  align-items: flex-start;
  padding: calc(var(--u) * 2);
  background: var(--paper-raised);
  border: 1px solid var(--rule);
  border-left: 3px solid var(--rule-strong);
  border-radius: 2px;
}
.fc-row--ripe { border-left-color: var(--action); background: var(--action-soft); }
.fc-row--good { border-left-color: var(--solid); }
.fc-row--mid  { border-left-color: var(--shaky); }
.fc-row--bad  { border-left-color: var(--action); }
.fc-row__body { flex: 1 1 18rem; }
.fc-row__q { line-height: 1.4; }
.fc-row__meta {
  margin-top: 4px;
  font-family: var(--face-mono);
  font-size: 0.75rem;
  color: var(--ink-faint);
}
.fc-row__acts { display: flex; gap: var(--u); flex-wrap: wrap; }

/* --- Calibration plot ----------------------------------------------------
   Inline SVG because the CSP blocks every chart library, and because a
   ten-bucket scatter against a diagonal does not need one. */
.calwrap {
  max-width: var(--measure);
  margin-bottom: calc(var(--u) * 5);
}
.cal {
  display: block;
  width: 100%;
  max-width: 22rem;
  height: auto;
  margin: calc(var(--u) * 2) 0;
}
.cal__ref { stroke: var(--rule-strong); stroke-width: 1; stroke-dasharray: 3 3; }
.cal__axis { stroke: var(--rule-strong); stroke-width: 1; }
.cal__dot { fill: var(--accent); fill-opacity: 0.75; }
.cal__t {
  fill: var(--ink-faint);
  font-family: var(--face-ui);
  font-size: 9px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

/* --- Cheatsheet ----------------------------------------------------------
   Inverted from every other list in the engine. The shelf leads with the
   claim because you are choosing what to read; here you have already read it,
   so the row leads with what to do and demotes the claim to the line that
   justifies it. The solid rule down the left is the same one the evidence
   block uses for a replicated verdict, because that is the only verdict on
   this page and the colour should mean the same thing in both places. */
.cheat { margin-bottom: calc(var(--u) * 5); }
.cheat__track {
  font-family: var(--face-ui);
  font-size: 0.625rem;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-faint);
  padding-bottom: var(--u);
  border-bottom: 1px solid var(--rule);
}
.cheat__row {
  display: flex;
  flex-direction: column;
  gap: calc(var(--u) * 0.75);
  width: 100%;
  padding: calc(var(--u) * 2) calc(var(--u) * 2);
  background: none;
  border: 0;
  border-left: 2px solid var(--solid);
  border-bottom: 1px solid var(--rule);
  text-align: left;
  cursor: pointer;
  transition: background 0.1s ease;
}
.cheat__row:hover { background: var(--accent-soft); }
.cheat__do {

<script>
/* Track: Characters and actions. Ordered foundational first. */
(window.LESSONS = window.LESSONS || []).push(
{
  id: "characters-character-in-subject",
  track: "characters", level: "sentence",
  title: "Every sentence tells a story, so put the character in the subject and the action in the verb",
  source: "Joseph M. Williams, Style: Lessons in Clarity and Grace",
  gatePrompt: "Take the longest sentence in your paragraph. Write down its grammatical subject and its main verb as a bare two-word pair. If that pair is not the actor and the action you meant, rewrite the sentence until it is.",
  fallback: "Consideration of a phased cutover was given by the platform team after the discovery of a dependency between the ingestion workers and the legacy scheduler. The expectation is that completion of the migration will occur before the end of Q3, assuming the availability of review capacity from the data team.",
  cheat: "Write a hard sentence's subject and main verb as a bare two-word pair - if that pair is not the actor and the action, rewrite.",
  idea: "Put the main character of the sentence in the grammatical subject and the main action in the main verb.",
  why: "Readers assign agency to whatever occupies the subject slot, whether or not you meant them to, and they hold that subject in working memory unattached until the verb tells them what it did. When the subject names the actor and the verb names the action, the reader resolves the clause at the earliest possible point and every remaining phrase has an obvious place to attach.\n\nThis is the move the rest of this track is made of. Nominalization, empty subjects, light verbs and agentless passives are all the same failure seen from different angles: the actor is somewhere other than the subject, or the action is somewhere other than the verb. Fix the alignment and most of them disappear without being addressed individually.",
  failureMode: "\"Consideration of a phased cutover was given by the platform team.\" The subject is an abstraction, the verb is \"was given\", and the two things a reader wants - who, and what they did - are parked in a prepositional phrase and a noun. Six words of the sentence exist only to hold the structure together.",
  worked: "The platform team considered a phased cutover after finding a dependency between the ingestion workers and the legacy scheduler. They expect to finish the migration before the end of Q3, provided the data team can spare review capacity.\n\nThe two-word pairs were \"consideration / was given\" and \"expectation / is\". They are now \"team / considered\" and \"they / expect\", so each sentence names an actor in the subject and the action in the verb. Fifty words became thirty-eight, and nearly all of the loss was scaffolding: \"was given by\", \"the discovery of\", \"completion of\", \"will occur\", \"the availability of\". The cost is commitment. \"The expectation is\" reported an expectation without saying whose, and \"they expect\" pins it on the platform team, so you have to be able to say they said it. \"Provided the data team can spare review capacity\" is blunter too - it names a team that can now block you, and if that vagueness was deliberate, it is gone.",
  experiment: "Take the three longest sentences from something you wrote this week. For each, write the grammatical subject and the main verb as a two-word pair, nothing else. Count how many pairs name a person, team or system doing something. Below three out of three is the day's work.",
  reflection: "Which sentence resisted the rewrite, and was it because you did not know who the actor was, or because you did not want to name them?",
  recall: {
    q: "You are handed a sentence you find hard to follow. What two things do you locate first, and what do you check about each?",
    a: "Locate the grammatical subject and the main verb. Check whether the subject names the main character of the sentence and whether the verb names the main action.\n\nAlmost all difficulty in professional prose is one or both of those slots being occupied by something else: an abstraction in the subject, a copula or a light verb in the verb."
  },
  deepDive: "Here is a paragraph from a design doc I am writing; for each sentence, tell me its subject and main verb as a pair, and name which sentences have the character and the action misaligned."
},
{
  id: "characters-nominalization",
  track: "characters", level: "sentence",
  title: "Nominalization is where your verbs go to die",
  source: "Joseph M. Williams, Style: Lessons in Clarity and Grace",
  gatePrompt: "Circle every noun in your paragraph ending in -tion, -ment, -ance, -ence, -ity or -al. Take the first one you circled and rewrite that sentence with the buried verb as the main verb.",
  fallback: "The implementation of retry logic in the Snowflake connector resulted in a reduction of failed syncs, but the introduction of additional latency was an observation made during the rollout. Further investigation of that tradeoff is a requirement before the enablement of the change for the remaining tenants.",
  idea: "A nominalization is a verb turned into a noun, so find it and turn it back into the verb of its clause.",
  why: "A nominalization does not just relocate the action, it strips information. A verb obliges you to mark tense and aspect and, in practice, to supply a subject. The noun form makes all of that optional. \"We implemented retry logic\" says who and when; \"the implementation of retry logic\" says neither, and the writer never has to notice the omission.\n\nThe knock-on effect is that something has to fill the vacated verb slot, and the candidates are all empty: was, occurred, resulted in, took place. The reader arrives at the position where English delivers the action and finds a word that describes nothing, then has to reach forward into a noun phrase to recover it.",
  failureMode: "\"The application of the new quota resulted in the suppression of retries.\" Two nominalizations and a verb phrase that names no event anybody performed. The sentence is eleven words and contains no people, no tense that means anything, and one actual action.",
  worked: "We implemented retry logic in the Snowflake connector. Failed syncs dropped, but we noticed added latency during the rollout. We need to investigate that tradeoff before we enable the change for the remaining tenants.\n\nThe first circled noun was \"implementation\", and turning it back into \"we implemented\" forced the two things the noun form let you skip: who, and when. Four more went the same way - reduction to dropped, observation to noticed, investigation to investigate, enablement to enable. Forty-seven words to thirty-four, a 28 per cent cut, which is the range a genuine fix lands in rather than an actor bolted onto the front of the old noun. The cost is four uses of \"we\" in thirty-four words, and your team now owns an investigation the original left floating as \"a requirement\". If you did not want to own it, the nominalization was doing exactly what you hired it for.",
  experiment: "Search a doc you wrote for \"-tion\". Take the five sentences with the most hits and rewrite each so an actor is the subject and the buried verb is the verb. Record the word count before and after. A genuine fix usually cuts 20 to 30 per cent; if a rewrite gets longer, you probably kept the nominalization and added an actor in front of it.",
  reflection: "In the sentences you rewrote, did the actor you had to supply turn out to be you, your team, or someone you had been avoiding naming?",
  recall: {
    q: "What grammatical information does a verb carry obligatorily that a nominalization makes optional?",
    a: "Tense, aspect, and in practice the actor. A finite verb forces you to say when it happened and requires a subject; the noun form lets you omit both.\n\nThat is why nominalizing loses information rather than merely changing style, and why writers reach for it when they do not want to commit to who or when."
  },
  deepDive: "Take this paragraph, list every nominalization in it, and for each one tell me the buried verb and who the missing actor most likely is."
},
{
  id: "characters-subject-column",
  track: "characters", level: "paragraph",
  title: "Read only your subjects, in a column, and you will see who the paragraph is about",
  source: "Joseph M. Williams, Style: Lessons in Clarity and Grace",
  gatePrompt: "Write the grammatical subject of each sentence in your paragraph on its own line, in order, nothing else. Read the column top to bottom, then mark every line that is a different character from the line above it.",
  fallback: "The migration was scheduled for the second week of March. Capacity headroom on the shared cluster turned out to be the real constraint. There was also concern from the data team about overlapping backfill windows. A decision to split the cutover into two waves was eventually reached in the architecture forum.",
  idea: "List the grammatical subjects of consecutive sentences in a column; that column is the paragraph's cast list, and a column with no repeat character is a paragraph with no subject.",
  why: "Readers build a model of a passage by attaching each new sentence to a topic they are already holding, and the subject slot is where they look for that topic. Change the occupant every sentence and the reader restarts the model four times in four sentences, which is felt as difficulty long before it is identified as a structural problem.\n\nThe reason to do this as a column rather than by reading is that it removes judgement from the diagnosis. You are not asking whether the paragraph flows. You are looking at a list and counting repeats, which you can do on your own prose at 5pm without any taste at all.",
  failureMode: "The column reads: the migration, capacity headroom, there, a decision. Four sentences, four unrelated occupants, one of them a placeholder. Every sentence is defensible on its own and the paragraph is about nothing in particular.",
  worked: "The migration was scheduled for the second week of March. It ran up against the capacity headroom on the shared cluster, which turned out to be the real constraint. It also overlapped backfill windows the data team was worried about. It now ships in two waves, a split the architecture forum eventually agreed on.\n\nThe column was: the migration, capacity headroom, there, a decision. Four sentences, four occupants, one of them a placeholder. It now reads: the migration, it, it, it. Nothing was deleted and no sentence changed its claim - the same material was reordered so the migration holds the subject slot every time and everything else attaches to it as an object or a modifier. The cost is that the data team and the architecture forum have been demoted out of subject position. If the paragraph's real job was to record who decided rather than what happened to the migration, this rewrite buries the decision-makers to buy the topic string.",
  experiment: "Do the column on the last three paragraphs of a doc you wrote. Count distinct subjects per paragraph. Any paragraph of four or more sentences with four different subjects gets rewritten so that at least three of them share a character, and note whether the rewrite forced you to drop a sentence that did not belong.",
  reflection: "When you forced a consistent subject, did any sentence refuse to fit, and was that sentence actually about something else?",
  recall: {
    q: "Why run the subject list as a column rather than just rereading the paragraph?",
    a: "Because it converts a judgement call into a counting task. Reading tells you the paragraph feels choppy; the column tells you it has four subjects in four sentences.\n\nThe diagnostic also survives your own familiarity with the draft, which ordinary rereading does not."
  },
  deepDive: "Take these three paragraphs and give me the subject of every sentence as a plain column per paragraph, then tell me which paragraph has no consistent character."
},
{
  id: "characters-expletive-openings",
  track: "characters", level: "sentence",
  title: "\"There is\" and \"it is\" announce that a character has gone missing",
  source: "Joseph M. Williams, Style: Lessons in Clarity and Grace",
  gatePrompt: "Search your paragraph for \"there is\", \"there are\", \"there was\" and \"it is\". Rewrite each hit so the sentence opens with whoever or whatever is doing something, then count the words you saved.",
  fallback: "There is a need for clearer ownership of the alerting rules that the on-call rotation currently inherits. It is also the case that there are several dashboards in the reliability folder with no named maintainer. There was agreement in last week's review that this should be addressed before the next planning cycle.",
  idea: "An expletive opening fills the subject slot with a placeholder, so name the actor instead.",
  why: "The \"there\" and \"it\" in these constructions are grammatical filler with no referent. They occupy the position the reader reads as the topic and hand over nothing, so the reader has to carry the entire clause unresolved until the real noun arrives after the verb. Naming the actor puts something in that slot and, as a side effect, usually deletes three or four words that existed only to hold the placeholder up.\n\nThe construction is not always wrong. Expletives exist to assert existence, and \"There are three ways to bound the blast radius\" is doing real work introducing a list. The test is whether you are genuinely announcing that something exists, or postponing the moment you name who is responsible.",
  failureMode: "\"There is a need for the team to complete an assessment of the failure modes.\" Nine words before an actor appears, a nominalization where the action should be, and a \"need\" that nobody owns. \"The team must assess the failure modes\" is seven words and says who.",
  worked: "Nobody owns the alerting rules the on-call rotation inherits. Several dashboards in the reliability folder have no named maintainer either. Last week's review agreed to fix both before the next planning cycle.\n\nFour expletives out - \"there is\", \"it is also the case that\", \"there are\", \"there was\" - and twenty words saved from fifty-two. Each rewrite pulled a real noun into the subject slot and took the placeholder's supporting words with it: \"there is a need for\" left with \"clearer ownership of\". The middle one is the closest call, because \"there are several dashboards\" genuinely introduces items the reader has not met, which is the legitimate use. It goes anyway, because the paragraph is about ownership and the missing maintainer is the news, not the dashboards. Two costs. \"Nobody owns\" is a harder claim than \"there is a need for clearer ownership\", which was hedged between no owner and an unclear one, and you now have to know which is true. And \"last week's review agreed\" makes a meeting the actor, which is still not a person - that expletive was hiding a decision nobody signed, and the sentence now looks owned when it is not.",
  experiment: "Grep a doc you wrote for \"there is\", \"there are\", \"there was\" and \"it is\". Rewrite every hit with a real subject, then count how many you put back because you were genuinely introducing something new. In engineering prose it is usually under a fifth.",
  reflection: "Of the expletives you removed, how many were hiding a requirement with no owner?",
  recall: {
    q: "When is \"There is\" the right opening rather than a symptom?",
    a: "When you are genuinely asserting that something exists or introducing an item the reader has not met, particularly ahead of a list: \"There are three ways to bound the blast radius.\"\n\nEverywhere else it is a placeholder standing in the position where the reader is looking for the actor."
  },
  deepDive: "Find every expletive construction in this draft, rewrite one of them for me as a demonstration, and tell me which ones you think are legitimate."
},
{
  id: "characters-be-in-disguise",
  track: "characters", level: "sentence",
  title: "\"Was\" is often a real verb wearing a disguise",
  source: "Joseph M. Williams, Style: Lessons in Clarity and Grace",
  gatePrompt: "Underline every form of \"be\" used as a main verb in your paragraph: is, are, was, were, been. For each one, find the noun or prepositional phrase nearby that holds the real action, and rewrite one sentence with that action promoted to the verb.",
  fallback: "The root cause was a mismatch between the connector's retry budget and the upstream rate limit. Our response was the addition of jittered backoff, and the effect on p99 latency was minimal. The team's assumption is that this is sufficient cover until the rate limiter itself is replaced next quarter.",
  idea: "When the main verb is a form of \"be\", the real action is usually sitting in a nearby noun or prepositional phrase and should be promoted into the verb slot.",
  why: "A copula asserts identity or state. That is a legitimate thing to assert, and \"the root cause was a mismatch\" is a fine sentence because identity is genuinely the claim. But when something actually happened, the copula tells the reader \"X equals Y\" at the exact point where they are parsing for an event, and they then have to unpack Y to find out what occurred.\n\nThe promotion is nearly always available and nearly always shortens. \"Our response was the addition of jittered backoff\" becomes \"We added jittered backoff\": four words shorter, and it names who responded, which the original never did.",
  failureMode: "\"Our response was the addition of jittered backoff, and the effect on p99 latency was minimal.\" Two copulas, two events described as nouns, and no agent in either clause. Nothing in the sentence happens; two things merely are.",
  worked: "The root cause was a mismatch between the connector's retry budget and the upstream rate limit. We added jittered backoff, and p99 latency barely moved. The team assumes that holds until the rate limiter itself is replaced next quarter.\n\nThe first copula stays. \"The root cause was a mismatch\" asserts identity, that is genuinely the claim, and there is no action nearby to promote. The other four were hiding events: \"our response was the addition of\" is \"we added\", \"the effect on p99 latency was minimal\" is \"p99 latency barely moved\", \"the team's assumption is\" is \"the team assumes\", and \"this is sufficient cover\" is \"that holds\". Fifty words to thirty-nine, and one agent appears who was not in the original at all. \"Is replaced next quarter\" is a passive rather than a copula and the agent is irrelevant, so it stays. The cost is on record. \"The team's assumption is that\" let you report an assumption without standing behind it. \"Barely moved\" also commits to a direction where \"minimal\" was safely unfalsifiable, so if you have not looked at the number, that verb is writing a cheque.",
  experiment: "Count the forms of \"be\" used as main verbs on one page you wrote, and divide by the sentence count. Above roughly one per sentence, go through and convert every instance where something is actually happening, leaving the ones that genuinely assert identity or state. Recount and write down both ratios.",
  reflection: "How many of your copulas turned out to be asserting identity, and how many were hiding an event?",
  recall: {
    q: "A copula is not automatically a fault. What distinguishes the ones worth keeping?",
    a: "Keep it when identity or state is genuinely the claim: \"The root cause was a schema mismatch.\" Nothing is happening there and no promotion is available.\n\nReplace it when an event is being described as a noun, which the neighbouring noun phrase or \"of\" phrase will reveal: \"our response was the addition of\" is \"we added\"."
  },
  deepDive: "Go through this draft, list every copula used as a main verb, and separate the ones asserting identity from the ones hiding an event."
},
{
  id: "characters-light-verbs",
  track: "characters", level: "sentence",
  title: "\"Conduct\", \"perform\", \"provide\" and \"make\" are verbs with the meaning taken out",
  source: "Joseph M. Williams, Style: Lessons in Clarity and Grace",
  gatePrompt: "Search your paragraph for conduct, perform, provide, make, give, take and undertake. For each hit, look at the noun immediately following it and rewrite the sentence with that noun as the verb.",
  fallback: "The SRE group will conduct a review of the escalation policy and provide recommendations to the platform leads by Friday. We also intend to perform an analysis of paging volume by service and make a determination about whether the current thresholds are doing any useful work.",
  idea: "A light verb hands the real action to the noun that follows it, so turn that noun back into the verb of the clause.",
  why: "\"Conduct a review\" is one action split across a meaningless verb and a nominalized object. The reader parses the verb, gets nothing, and has to read on into the object to find out what happened. That is a small cost per instance and a large one at density, because it happens at the precise position where the reader is trying to close the clause.\n\nThe structural damage is worse than the delay. \"Review the escalation policy\" attaches the thing reviewed directly to the verb. \"Conduct a review of the escalation policy\" has to reattach it with \"of\", because the object slot is already occupied by the nominalization. Every light verb construction generates at least one extra preposition, and prepositions are where sentences go to sprawl.",
  failureMode: "\"Make a determination about whether the thresholds are useful.\" The verb is \"decide\", and the sentence has spent four words avoiding it. These forms survive because they sound institutional, and institutional is the register people default to when they are not certain they are allowed to simply say the thing.",
  worked: "The SRE group will review the escalation policy and recommend fixes to the platform leads by Friday. We also intend to analyse paging volume by service and decide whether the current thresholds are doing any useful work.\n\nFour light verbs, four nouns promoted into the verb slot: conduct a review of becomes review, provide recommendations becomes recommend, perform an analysis of becomes analyse, make a determination about becomes decide. Forty-six words to thirty-seven, and three prepositions went with them - \"of the escalation policy\", \"of paging volume\", \"about whether\" - each of which existed only because a nominalization was already sitting in the object slot. \"We also intend to\" stays, because that hedge is a commitment level, not a light verb, and stripping it is a different edit from the one this entry asks for. Two costs. \"Recommend fixes to the platform leads\" invites a half-second misreading as fixes applied to the leads, which \"provide recommendations to\" never did. And \"decide\" names a decision somebody now owes by a date, which is precisely what \"make a determination about\" was built to avoid.",
  experiment: "Grep your last design doc for \"conduct\", \"perform\", \"provide\", \"undertake\" and \"make a\". Rewrite each hit as a single verb and record the words saved. Under ten hits a page is normal noise; over twenty means the whole document is written in a register, not that you wrote a few sloppy sentences.",
  reflection: "Did the light verbs cluster in the sections written for a particular audience, and if so, which one?",
  recall: {
    q: "Beyond delaying the action, what structural cost does a light verb impose on the rest of the sentence?",
    a: "It occupies the object slot with a nominalization, so the real object has to be reattached with a preposition, usually \"of\".\n\n\"Review the policy\" becomes \"conduct a review of the policy\", and every added preposition is another attachment the reader has to resolve and another place the sentence can grow."
  },
  deepDive: "Find every light verb construction in this document, rewrite the worst one as a demonstration, and tell me whether the density suggests a sentence problem or a register problem."
},
{
  id: "characters-verb-adjectives",
  track: "characters", level: "sentence",
  title: "\"Dependent\", \"indicative\" and \"reflective\" are verbs pretending to be adjectives",
  source: "Joseph M. Williams, Style: Lessons in Clarity and Grace",
  gatePrompt: "Find every adjective in your paragraph followed by \"of\", \"on\" or \"with\". Rewrite the first one you find as a verb, and note whether the sentence lost anything.",
  fallback: "The rollout schedule is dependent on completion of the schema backfill, and the current error rate is indicative of a problem in the deduplication step rather than the connector. The team is supportive of a pause, but is doubtful that a pause is achievable without a customer-facing announcement.",
  idea: "Adjectives derived from verbs conceal actions exactly as nominalizations do, so revert them to the verb.",
  why: "\"Is dependent on\" is \"depends on\". \"Is indicative of\" is \"indicates\". \"Is reflective of\" is \"reflects\". Each form takes a perfectly good verb, adjectivises it, and then requires a copula in front and a preposition behind to hold the wreckage together. The reader gets a copula where the action should be and has to assemble a meaning from three words that one word carried.\n\nThe reason this is worth naming separately from nominalization is that the pattern is invisible if you are only scanning for nouns ending in -tion. It hides in the adjective, and the search string that finds it is \" is \" followed by a word ending in -ent, -ive or -ant.",
  failureMode: "\"The current error rate is indicative of a problem in the deduplication step.\" Eleven words, no action, and a copula holding the verb slot. \"The error rate points to the deduplication step\" is eight words and moves.",
  worked: "The rollout schedule depends on the schema backfill finishing, and the current error rate points to the deduplication step rather than the connector. The team backs a pause but doubts we can pause without a customer-facing announcement.\n\nFive adjectives reverted to verbs: is dependent on becomes depends on, is indicative of becomes points to, is supportive of becomes backs, is doubtful that becomes doubts, is achievable becomes can. Each took a copula and usually a preposition with it, which is where the eleven words came from - forty-eight down to thirty-seven - and supplying \"we can\" gave the last clause the subject the adjective form let you leave out. Only the first three turn up in a search for an adjective followed by of, on or with; doubtful and achievable were caught by the principle rather than the string. The cost is in \"backs\". \"Is supportive of a pause\" let the team be sympathetic without committing to anything, and that hedge may have been the accurate report - if the team has not voted, write \"leans towards\" rather than reaching back for the adjective. \"Points to\" is a firmer causal claim than \"is indicative of\", and the error rate has to support it.",
  experiment: "Search a folder of your docs for \"is dependent\", \"is indicative\", \"is reflective\", \"is supportive\", \"is applicable\" and \"is representative\". Rewrite each as its verb and check the word count. Every one of them should shorten; if one does not, you have found the rare case where the adjective is doing work the verb cannot.",
  reflection: "Which of these did you write on purpose to soften a claim, and did the verb form actually make the claim stronger than you meant?",
  recall: {
    q: "Why does scanning for nominalizations miss this pattern, and what do you search for instead?",
    a: "Because the buried verb has become an adjective, not a noun, so the -tion and -ment endings do not catch it.\n\nSearch for a form of \"be\" followed by a word ending in -ent, -ive or -ant and then a preposition: is dependent on, is indicative of, is reflective of."
  },
  deepDive: "Scan this draft for verbs hiding as adjectives, list them with their verb forms, and tell me if any of them are load-bearing as written."
},
{
  id: "characters-actor-in-of-by",
  track: "characters", level: "sentence",
  title: "The character is usually hiding in a prepositional phrase, wearing \"of\" or \"by\"",
  source: "Joseph M. Williams, Style: Lessons in Clarity and Grace",
  gatePrompt: "For every sentence in your paragraph with an abstract subject, scan forward to the first \"of\" or \"by\" phrase and underline the noun inside it. Rewrite one of those sentences with that noun as the subject.",
  fallback: "The prioritisation of reliability work over feature delivery by the platform group has led to a slowdown in the shipping cadence of two product teams. A reassessment of that tradeoff by the leadership group is expected during the next planning cycle, following collection of the relevant delivery metrics by the programme office.",
  idea: "When the subject is abstract, the human actor is nearly always downstream in an \"of\" or \"by\" phrase, and it belongs at the front.",
  why: "Nominalizing a verb strips the actor from the verb, but writers rarely delete the actor outright. They demote it into a modifier, because the sentence still has to say who and there is nowhere else to put it. The actor is therefore still on the page, sitting in a position the reader does not read as agentive, which is why the sentence feels ownerless even though the owner is named in it.\n\nThat makes the fix a move operation rather than an act of invention. \"of\" and \"by\" are where English parks the arguments a verb would otherwise take directly: \"the prioritisation of X by Y\" is \"Y prioritised X\" with both arguments relegated. Once you know to look there, most abstract-subject sentences repair themselves in one pass.",
  failureMode: "\"The prioritisation of reliability work over feature delivery by the platform group has led to a slowdown.\" Sixteen words before the verb, an abstraction in the subject, and the actual actor sitting in a \"by\" phrase two-thirds of the way through where nobody reads for agency.",
  worked: "The platform group prioritised reliability work over feature delivery, and two product teams are now shipping more slowly. The leadership group is expected to reassess that tradeoff during the next planning cycle, once the programme office has collected the delivery metrics.\n\nAll three actors were already on the page, parked in \"by\" phrases where nobody reads for agency: by the platform group, by the leadership group, by the programme office. Each moved to the front of its own clause and the nominalization it was attached to became the verb - prioritisation to prioritised, reassessment to reassess, collection to collected. Fifty-two words to forty-one, and no noun in the rewrite was invented. \"Is expected to reassess\" keeps the hedge on purpose, because promoting an actor into the subject slot tempts you into \"will reassess\", which asserts an agreement the original never claimed. What stays broken is the one actor that was never there. \"Is expected\" by whom is not recoverable from this paragraph. That person was not demoted into a phrase, they were left out, and moving nouns around will not produce them.",
  experiment: "Take a paragraph of yours with abstract subjects. For each sentence, write down the first noun appearing after \"of\" or \"by\". Mark how many of those nouns are the real actor. If it is most of them, you have a mechanical fix in front of you rather than a thinking problem.",
  reflection: "Once you promoted the actors, did any sentence turn out to have no actor anywhere in it, and what did you do about that one?",
  recall: {
    q: "You have a sentence with an abstract subject and you want the actor. Where do you look first, and why is it usually there?",
    a: "In the first \"of\" or \"by\" phrase after the subject. Nominalization removes the actor from the verb but the writer still has to say who, so the actor gets demoted into a prepositional modifier rather than deleted.\n\nThat means recovering it is moving a noun already on the page, not inventing one."
  },
  deepDive: "For each abstract-subject sentence in this draft, tell me which noun in an \"of\" or \"by\" phrase is the real actor, and flag the sentences where there is none."
},
{
  id: "characters-nominalization-chains",
  track: "characters", level: "sentence",
  title: "Stacked \"-tion of -tion of\" chains are the compound form of the disease",
  source: "Joseph M. Williams, Style: Lessons in Clarity and Grace",
  gatePrompt: "Find the longest run of \"X of Y of Z\" in your paragraph. Decide which of those nouns holds the real action, and rewrite the run as a clause with that noun as its verb.",
  fallback: "The delay in the completion of the validation of the migration scripts was a consequence of the reallocation of two engineers to the payments incident. The expectation of a resolution of the remaining backlog by the end of the sprint is no longer realistic given the reduction in available review capacity.",
  idea: "Two or three nominalizations linked by \"of\" collapse into a single clear clause once you decide which of them is the real action.",
  why: "\"of\" is the most semantically empty preposition in English. It can encode possession, agency, patient, composition, membership or partitivity, and nothing in the phrase says which. Each \"of\" in a chain is therefore a relationship the reader has to guess, and three of them in a row require three guesses before the verb arrives to confirm or overturn any of them.\n\nThe chain persists precisely because the fix requires a decision. \"The completion of the validation of the migration scripts\" contains three candidate actions and the writer never chose one. The stacked form preserves that indecision perfectly, which is why it feels safe to write and impossible to read.",
  failureMode: "\"The delay in the completion of the validation of the migration scripts was a consequence of the reallocation of two engineers.\" Five nominalizations, five \"of\" or \"in\" links, one copula, and a reader who now has to work out that two engineers moved and validation stopped.",
  worked: "We have not finished validating the migration scripts, because we moved two engineers to the payments incident. We will not clear the remaining backlog by the end of the sprint either, now that review capacity has dropped.\n\nThe chain ran delay, completion, validation, migration scripts - four nominalizations and three links the reader had to guess at before the verb arrived. Picking validation as the real action collapses the run into one clause, and delay and completion turn out to be carried by the tense of the verb rather than by nouns of their own. Fifty-one words to thirty-seven. What it cost is the decision the stacked form was preserving. \"We have not finished validating\" asserts that validation started, which the chain carefully never said. If it never started, the honest sentence is \"we have not started validating\", and you have to go and find out which. \"We\" also appears twice where the original had nobody, and \"we moved two engineers\" is a sentence somebody will read as an admission.",
  experiment: "Grep your last doc for \" of \" and pull out every sentence containing three or more. Rewrite each one. Note which sentence you could not fix without going back and deciding what you actually meant; that is where your thinking was unfinished, not your prose.",
  reflection: "Which chain did you have to resolve by making a decision you had been deferring, and what was the decision?",
  recall: {
    q: "Why is a chain of nominalizations harder on a reader than the same number of nominalizations spread across separate sentences?",
    a: "Because \"of\" encodes no specific relationship, so each link is an inference the reader must make and hold. Three links means three unresolved guesses stacked before the verb arrives.\n\nSpread across sentences, each nominalization gets its own verb to disambiguate it."
  },
  deepDive: "Find every nominalization chain of three or more in this document and tell me, for each, which noun should have been the verb."
},
{
  id: "characters-noun-strings",
  track: "characters", level: "sentence",
  title: "Four nouns in a row is a sentence somebody declined to write",
  source: "Joseph M. Williams, Style: Lessons in Clarity and Grace",
  gatePrompt: "Find the longest run of consecutive nouns in your paragraph. Say out loud what relates each noun to the next, then rewrite the run with those relationships written down as prepositions and a verb.",
  fallback: "The tenant workflow execution history retention policy change was reviewed at the architecture forum on Tuesday. Ownership of the customer data platform ingestion pipeline failure notification path remains unassigned, and the connector deprecation communication timeline draft is still with the product marketing team.",
  idea: "Unpack a long noun string into a clause with a verb and prepositions, because the string compresses relationships the reader is then made to guess.",
  why: "English noun compounding is left-branching and completely unmarked. Nothing inside \"tenant workflow execution history retention policy\" tells the reader which nouns modify which, so they try groupings until one coheres. With six nouns the number of plausible bracketings runs into the dozens, and the reader is doing that search while also holding the rest of the sentence.\n\nThe string is also a knowledge test. Anyone already inside the system parses it instantly, because they know the referent and are matching rather than parsing. That makes it excellent shorthand between four people and a wall for the fifth, which is usually the person the document was written for.",
  failureMode: "\"Ownership of the customer data platform ingestion pipeline failure notification path remains unassigned.\" Eight nouns before the verb. Is it the failure notification path of the ingestion pipeline, or the notification path for ingestion pipeline failures? The two are owned by different teams and the sentence does not say.",
