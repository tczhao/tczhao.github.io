  track: "architecture", level: "sentence",
  title: "Resumptive and summative modifiers let a sentence continue past its natural stop",
  source: "Joseph M. Williams, Style: Lessons in Clarity and Grace",
  gatePrompt: "Find every \"which\" in your paragraph. For each one, write two alternatives: one that repeats the noun it refers to, and one that names in a fresh noun what the whole preceding clause amounted to. Keep whichever of the three is clearest.",
  fallback: "We moved the retry budget into the sidecar, which meant the service no longer had to track attempts itself, which removed the last piece of shared mutable state, which had been the main obstacle to running more than one replica. This is something we should have done at the start of the year.",
  idea: "When a sentence needs to keep going, repeat a key noun or name what the clause just did, instead of hanging another relative clause off the end.",
  why: "A relative pronoun points backwards without saying where. The reader has to search for the antecedent, and the search space is everything before it: a noun, a phrase, or the whole clause. One \"which\" is a short search. A chain of them means each search starts from a position the reader is no longer sure about, and the sentence dissolves.\n\nA resumptive modifier repeats the noun, so the antecedent is supplied rather than searched for. A summative modifier goes further: it hands the reader a noun that names what the preceding clause amounted to, which both closes the search and advances the argument, because choosing the noun is an act of interpretation. \"...running more than one replica, a constraint that had shaped the service since 2022.\"",
  failureMode: "The which-chain, which is what a sentence does when it wants to continue and has no other mechanism. \"We moved the retry budget into the sidecar, which meant the service no longer had to track attempts, which removed the last piece of shared state, which had been the main obstacle to more replicas.\" By the third \"which\" the reader cannot say whether it points at the sidecar, the removal, or the whole preceding clause, and the sentence ends by trailing off rather than closing.",
  experiment: "Count the relative pronouns in your last long email or doc. Find the longest chain of them in a single sentence. Rewrite that sentence using one resumptive and one summative modifier, and count the pronouns again.",
  reflection: "When you wrote the summative noun, did you have to decide something you had been leaving vague?",
  recall: {
    q: "What is the difference between a resumptive and a summative modifier, and what does each fix?",
    a: "A resumptive modifier repeats a key noun from the clause just finished, then continues from it. It fixes an unclear antecedent by supplying the referent instead of pointing at it.\n\nA summative modifier introduces a new noun that names what the whole preceding clause amounted to, then modifies that. It fixes a clause-level \"which\" and forces you to interpret your own sentence rather than gesture at it."
  },
  deepDive: "Find the relative-pronoun chains in this draft of mine and show me one of them rewritten with a summative modifier."
},
{
  id: "architecture-level-diagram",
  track: "architecture", level: "paragraph",
  title: "Diagram a paragraph by levels and count how many sentences never leave level one",
  source: "Francis Christensen, A Generative Rhetoric of the Sentence",
  gatePrompt: "Write your paragraph out one sentence per line. Beside each line write the deepest modification level that sentence reaches: 1 for a bare base clause, 2 or 3 if it carries additions. Total the lines marked 1.",
  fallback: "The consumer lag alert fired at 02:14. The on-call engineer acknowledged it. The lag was caused by a slow downstream write. The write was slow because an index was missing. We added the index at 03:40. Lag cleared by 04:05.",
  idea: "Diagram a paragraph by modification level and treat a column of ones as a diagnosis rather than a style.",
  why: "A base clause asserts. It does not develop. A paragraph made only of base clauses hands the reader a sequence of propositions and leaves them to work out the relations, the weighting and the detail, because none of that has been written down. It reads as terse, which is often mistaken for clear, but the reader is doing the work you skipped.\n\nThe level diagram is useful precisely because it is mechanical. It does not ask whether the prose is good. It asks how much of what you know made it onto the page as development rather than assertion, and a column of ones answers that immediately.",
  failureMode: "Incident notes and status updates written as a list of facts with no subordination. Every fact arrives at the same rank, so the reader cannot tell which one was the cause, which was a symptom and which was incidental. The paragraph is accurate and almost useless to anyone who was not there.",
  experiment: "Diagram the last incident summary or status update you wrote. Write the level column. If more than two thirds are ones, rewrite the paragraph as three sentences, each with at least one level-2 addition, and diagram it again.",
  reflection: "When you merged the base clauses, which relation between them did you have to make explicit for the first time?",
  recall: {
    q: "What is a reader forced to do when a paragraph is nothing but base clauses?",
    a: "Supply the development themselves. Every proposition arrives at the same rank with no subordination, so the reader has to infer cause, weighting and relevance from adjacency alone.\n\nThe result reads terse rather than clear. The writer's knowledge of how the facts relate never reached the page."
  },
  deepDive: "Diagram this paragraph of mine by modification level and tell me which of the base clauses should have absorbed the ones around it."
},
{
  id: "architecture-texture",
  track: "architecture", level: "paragraph",
  title: "Texture: all base clauses is thin, all modification is mush",
  source: "Francis Christensen, A Generative Rhetoric of the Sentence",
  gatePrompt: "Count the words in your paragraph that sit inside free modifiers, meaning anything set off by commas before or after a main clause. Divide by the total word count and write the percentage at the top.",
  fallback: "The rollout, staged across three regions and paced by a canary that watched error rate and p99 latency, both of which had been recalibrated after the September incident, itself a consequence of thresholds set for a much smaller fleet, proceeded largely as expected, allowing for some noise in the Sydney region, where the smaller node pool has always made the percentiles jumpy.",
  idea: "Aim for a mix of assertion and development, because prose that is all base clauses is thin and prose that is all modification has nothing to hold on to.",
  why: "Texture is the ratio of assertion to development across a passage, and both extremes are diagnosable rather than a matter of preference. The base clause is where a reader commits a proposition to memory. Modification adjusts a proposition already committed. With too few base clauses, the reader is adjusting continuously without ever having stored anything, which is the specific sensation of reading dense prose and retaining none of it.\n\nAt the other extreme, all assertion and no development, the reader stores a lot and understands none of the relations. Neither failure is about sentence length. A short paragraph can be mush and a long one can be thin.",
  failureMode: "A single sentence carrying a whole paragraph of content, hinged on one weak verb. \"The rollout, staged across three regions and paced by a canary that watched error rate and p99 latency, both of which had been recalibrated after the September incident, proceeded largely as expected.\" The only thing asserted is that the rollout proceeded as expected: sixty words are hanging off an eight-word spine. The reader finishes with a lot of detail and no proposition worth keeping.",
  experiment: "Take two paragraphs you wrote, one that felt easy and one that felt like a slog. Compute the free-modifier percentage for both. If either is under 10 per cent or over 55 per cent, rewrite it towards the middle and note whether the reading changed.",
  reflection: "Which of your two paragraphs was closer to an extreme, and did the percentage match your instinct about which one was worse?",
  recall: {
    q: "What exactly is wrong with a paragraph that is nearly all modification?",
    a: "Base clauses are where a reader commits a proposition to memory; modifiers adjust a proposition already committed. With almost no base clauses, the reader is continuously adjusting without ever having stored anything.\n\nThat produces the specific experience of reading dense prose closely and retaining nothing from it, even though every phrase was comprehensible on its own."
  },
  deepDive: "Compute the assertion-to-modification balance in this passage of mine and tell me which paragraph is thin and which is mush."
},
{
  id: "architecture-stand-alone",
  track: "architecture", level: "sentence",
  title: "Klinkenborg's test is whether the sentence can stand up alone",
  source: "Verlyn Klinkenborg, Several Short Sentences About Writing",
  gatePrompt: "Copy your paragraph into a scratch file, then delete every sentence but one and read what is left. Do this for each sentence in turn and mark the ones that stop meaning anything on their own.",
  fallback: "This has been a problem for a while now. It gets noticeably worse whenever the batch size goes up, which it did last quarter. That is the main reason we are proposing the change. The alternative was considered and rejected earlier in the year.",
  idea: "Every sentence should carry enough of its own subject and claim that it still means something when lifted out of the paragraph.",
  why: "Readers do not read in order. They land mid-paragraph, skim back, re-read one line in a review comment, or quote a single sentence into a thread. A sentence propped up by its neighbours breaks the moment it is moved, and it gets moved constantly.\n\nThe mechanism inside the paragraph is the same one. \"This\", \"it\" and \"that approach\" each impose a backward lookup, and the lookups compound: by the fourth sentence the reader is resolving a pronoun whose antecedent was itself a pronoun. Naming the subject is not repetition, it is the thing that lets a reader enter anywhere.",
  failureMode: "Paragraphs where the subject is named once and then referred to for five sentences. \"That is the main reason we are proposing the change.\" Quoted into a Slack thread, that sentence conveys nothing at all, and quoting into a Slack thread is what happens to most sentences in a design doc.",
  experiment: "Take the last doc you wrote and pull out five sentences at random into a new file, in isolation. Count how many are comprehensible without the surrounding text. Rewrite the failures in place and re-run the pull.",
  reflection: "Which sentence did you have to name a subject in, and did the paragraph get worse for the repetition?",
  recall: {
    q: "Why does the stand-alone test matter, given that the sentence will in fact be read in its paragraph?",
    a: "Because it will not be. Readers skim, land mid-paragraph, re-read one line, and quote single sentences into reviews and threads, so sentences are routinely read out of position.\n\nAnd the same lookup cost applies in place: chains of \"this\", \"it\" and \"that\" compound, until the reader is resolving a pronoun whose antecedent was itself a pronoun."
  },
  deepDive: "Pull five sentences at random out of this doc of mine and tell me which ones collapse without their neighbours."
},
{
  id: "architecture-coordination-subordination",
  track: "architecture", level: "sentence",
  title: "Coordination claims two things are equal; subordination assigns rank",
  source: "Joseph M. Williams, Style: Lessons in Clarity and Grace",
  gatePrompt: "Circle every \"and\" in your paragraph that joins two full clauses. For each, decide which of the two clauses is the point, then rewrite the other as a subordinate clause.",
  fallback: "We upgraded the operator to 1.9 and the reconcile loop started dropping events under load and we rolled back within the hour. The team reviewed the changelog and there was no mention of the new rate limiter and we have filed an issue upstream.",
  idea: "Use \"and\" between clauses only when the two genuinely matter the same amount, and subordinate whenever one of them is the point.",
  why: "Grammatical rank is read as informational rank. Two clauses joined by \"and\" tell the reader they are peers: equally important, equally worth remembering. That is a claim, and most of the time it is false, because one of the clauses is the finding and the other is the circumstance.\n\nSubordination does the ranking for the reader. \"After we upgraded the operator to 1.9, the reconcile loop began dropping events under load\" says which fact is the news. A chain of coordinated clauses says nothing about relative weight, so the reader has to guess, and readers default to weighting the last one, which is often just the last thing that happened.",
  failureMode: "The and-chain, which is what writing under time pressure produces. \"We reviewed the changelog and there was no mention of the rate limiter and we have filed an issue upstream.\" Three facts at equal rank. The important one, that the vendor shipped an unannounced behavioural change, is not even stated: it is left as an inference between two coordinated clauses.",
  experiment: "Count clause-joining \"and\"s in your last two documents. For each one, write a single word in the margin naming which clause is the point. Convert every case where you could name one, and count the remaining \"and\"s.",
  reflection: "How many of your coordinated pairs turned out to be genuinely equal in weight?",
  recall: {
    q: "What claim is a writer making every time they join two clauses with \"and\"?",
    a: "That the two clauses are peers: equally important, equally worth remembering. Readers map grammatical rank onto informational rank.\n\nUsually the claim is false, because one clause is the finding and the other is circumstance. Subordinating the circumstance does the ranking for the reader rather than leaving them to infer it."
  },
  deepDive: "Find the and-chains in this draft of mine and tell me, for each, which clause I should have subordinated."
},
{
  id: "architecture-parallelism",
  track: "architecture", level: "sentence",
  title: "Parallel structure carries three ideas without making them a list",
  source: "Joseph M. Williams, Style: Lessons in Clarity and Grace",
  gatePrompt: "Find a bulleted list in something you wrote this week, or three consecutive short sentences on one theme. Rewrite them as a single sentence with three items in identical grammatical shape, then put the two versions side by side.",
  fallback: "The new scheduler reduces queue time. It also gives us per-tenant fairness, which the enterprise accounts have been asking for. Another benefit is that we can drain a node without cancelling running work.",
  idea: "When three ideas belong to the same frame, put them in one sentence in identical grammatical shape rather than splitting them into separate sentences or bullets.",
  why: "Repeated syntax lets the reader reuse a parse. Once the shape of the first item is established, the second and third are slotted into a frame that is already built, so the marginal cost of the third item is close to zero. That is why a well-formed triple reads faster than three separate sentences carrying the same content.\n\nParallelism also states the relation by form instead of asserting it. Three items in identical shape are visibly members of one set: you never have to write \"these three benefits are related\". A bulleted list does this too, but at a price. Bullets suppress the connective tissue between items and licence you to leave the relation unexamined, which is why a list of five bullets often turns out to contain two real points and three restatements.",
  failureMode: "Coordinate ideas dissolved into separate sentences with different shapes, so nothing marks them as a set. \"The new scheduler reduces queue time. It also gives us per-tenant fairness. Another benefit is that...\" The reader has to notice, unaided, that these three sentences are one argument, and the phrase \"another benefit is that\" is the writer admitting the structure was not there.",
  experiment: "Take the longest bulleted list in your most recent doc. Rewrite it as one or two sentences using parallel structure. Count the items before and after: if the count drops, the bullets were hiding duplicates.",
  reflection: "Did forcing your items into one shape reveal that one of them did not belong?",
  recall: {
    q: "Why is a three-item parallel sentence often better than three bullets carrying the same content?",
    a: "Repeated syntax lets the reader reuse the parse of the first item, so the second and third slot into a frame that is already built, and identical shape states the relation by form rather than asserting it.\n\nBullets suppress the connective tissue between items and let the relation go unexamined, which is how a five-bullet list ends up holding two real points and three restatements."
  },
  deepDive: "Take this bulleted list from my doc, rewrite it as parallel prose, and tell me which items collapsed into each other when you did."
},
{
  id: "architecture-faulty-parallelism",
  track: "architecture", level: "sentence",
  title: "Faulty parallelism breaks a promise the sentence already made",
  source: "Joseph M. Williams, Style: Lessons in Clarity and Grace",
  gatePrompt: "Find every sentence in your paragraph with two or more items joined by \"and\" or \"or\". Read the frame plus each item separately, out loud, and mark any item that does not fit the frame on its own.",
  fallback: "The runbook covers restarting the collector, how to drain a node, and escalation paths for a page after midnight. Reviewers should check that the change is reversible, tested in staging, and whether the metrics dashboard has been updated.",
  idea: "Once two coordinated items share a frame, every later item must fit that same frame.",
  why: "Coordination sets up a prediction. From the first item the reader infers a slot with a specific grammatical shape, and from then on they are pattern-matching rather than parsing from scratch. That prediction is the whole efficiency gain of a coordinate series.\n\nA mismatched item invalidates the prediction, so the reader has to abandon the partial parse and rebuild the frame around the exception. The cost is not that the sentence becomes ambiguous, because usually it does not. The cost is a stumble the reader notices and attributes to carelessness, which is expensive in a document whose job is to make you look like you thought this through.",
  failureMode: "The series that changes shape at the last item, which is where it almost always happens, because the last item was added in a later edit. \"Check that the change is reversible, tested in staging, and whether the dashboard has been updated.\" The frame is \"check that the change is X\". The third item does not fit it and the reader has to re-enter the sentence to work out what it attaches to.",
  experiment: "Search your last document for \"and\" and \"or\". For every coordinate series, write out the frame plus each item as a separate short sentence. Count how many series produce at least one sentence that does not work.",
  reflection: "In the faults you found, was the broken item the last one, and had you added it after the fact?",
  recall: {
    q: "Why does faulty parallelism read as an error even when the sentence is grammatical and unambiguous?",
    a: "Because coordination sets up a prediction. From the first item the reader infers a slot with a specific grammatical shape and switches from parsing to pattern-matching.\n\nA mismatched item invalidates that prediction and forces a rebuild of the frame. The reader registers the stumble and attributes it to carelessness, independent of whether the meaning was ever in doubt."
  },
  deepDive: "Check every coordinate series in this document of mine by expanding the frame plus each item, and list the ones that break."
},
{
  id: "architecture-end-weight",
  track: "architecture", level: "sentence",
  title: "English drags weight to the end, so put the heaviest element there",
  source: "Steven Pinker, The Sense of Style",
  gatePrompt: "For each sentence in your paragraph, underline the longest phrase and note whether it lands at the end. Pick one sentence where it does not, and rewrite so it does.",
  fallback: "The fact that the retention policy applies per workspace rather than per connector, which most customers only discover during their first audit, is documented. We flagged that the two clusters running on the older node pool, the ones scheduled for replacement in Q3 but still carrying about a third of production traffic, are affected.",
  idea: "Put the longest and most complex phrase last, and keep the opening of the sentence short.",
  why: "A heavy phrase early in a sentence has to be held while the rest of the frame is still open. The reader is carrying a large, fully parsed chunk with nowhere to attach it, because the verb has not arrived. Move the same phrase to the end and it arrives when the frame is nearly closed, so it can be discharged as it is read rather than stored.\n\nEnd weight and the stress position usually want the same thing, which is convenient. The end of a sentence is both the cheapest place to process complexity and the place a reader takes as most emphatic, so the element you most want remembered and the element that is hardest to parse are usually the same element. When they are not, you have a real choice to make, and that is worth noticing rather than resolving by reflex.",
  failureMode: "A subject that is a paragraph and a predicate that is two words. \"The fact that the retention policy applies per workspace rather than per connector, which most customers only discover during their first audit, is documented.\" Thirty words of subject and then \"is documented\". By the time the verb arrives the reader has forgotten what it is a verb for.",
  experiment: "Find the five longest subjects in your last document, counted in words from sentence start to main verb. Rewrite any over ten words so the heavy material moves after the verb. Re-measure and note the new maximum.",
  reflection: "In the sentence you rewrote, did moving the heavy phrase to the end also change what the sentence emphasised, and was that an improvement?",
  recall: {
    q: "What are the two separate reasons for putting the heaviest phrase at the end?",
    a: "Processing: a heavy phrase early has to be held while the syntactic frame is still open, whereas at the end it arrives when the frame is nearly closed and can be discharged as it is read.\n\nEmphasis: readers take the end of a sentence as its stress position. The two usually agree, and when they disagree you have a genuine choice to make rather than a rule to apply."
  },
  deepDive: "Measure the subject lengths in this piece of mine and show me the worst offender rewritten with the weight moved to the end."
},
{
  id: "architecture-length-variance",
  track: "architecture", level: "paragraph",
  title: "Vary sentence length deliberately and save the short one for the point",
  source: "Verlyn Klinkenborg, Several Short Sentences About Writing",
  gatePrompt: "Count the words in every sentence of your paragraph and write the numbers out in a row. If no number is under eight, rewrite your single most important sentence until one of them is.",
  fallback: "The design doc proposes moving the workflow history store off the shared Postgres instance and onto a dedicated cluster with its own retention policy. This would remove the noisy-neighbour behaviour we have seen during large backfills and would let us tune vacuum settings for a write-heavy workload. The cost is roughly eleven thousand dollars a year, which is materially less than the engineering time we currently spend on incident response for this one component.",
  idea: "Treat sentence length as an instrument: run long while you develop, then drop to a short sentence at the point you most want remembered.",
  why: "Readers build a running expectation of sentence length from the sentences they have just read. A sentence that breaks the pattern gets attention for free, and the sharpest break available is a short sentence after several long ones. Nothing in the wording has to do the work.\n\nThere is a second effect. A short sentence closes its syntax immediately, so the whole proposition lands as one chunk with no held material. That combination, cheap to process and unexpected, is why the shortest sentence in a paragraph is read as its most emphatic, whether or not you intended it. Which means uniform length is not neutral: it spends the emphasis on nothing.",
  failureMode: "Paragraphs where every sentence runs 25 to 35 words, competent and unreadable, the standard output of a careful engineer writing a design doc at 5pm. Nothing is wrong with any individual sentence. There is also no signal anywhere about which of the six claims is the one you should carry into the meeting.",
  experiment: "Take three paragraphs from your last doc and write the word count of each sentence as a row of numbers. Find the paragraph with the narrowest spread and rewrite it so the shortest sentence is under eight words and is the claim you most want kept.",
  reflection: "Once you had a short sentence in the paragraph, did it turn out to be the right sentence to emphasise?",
  recall: {
    q: "Why is the shortest sentence in a paragraph read as its most emphatic, regardless of intent?",
    a: "Readers build a running expectation of sentence length, and a break in that pattern draws attention on its own. A short sentence after long ones is the sharpest available break.\n\nIt also closes its syntax immediately, so the proposition lands in one chunk with nothing held open. Cheap to process and unexpected at once, which is why uniform length is not neutral: it spends the emphasis on nothing."
  },
  deepDive: "Give me the sentence-length profile of this piece of mine paragraph by paragraph, and tell me where a short sentence would be doing the most work."
},
{
  id: "architecture-periodic-sentence",
  track: "architecture", level: "sentence",
  title: "The periodic sentence earns its delay only when the delay is the payload",
  source: "Joseph M. Williams, Style: Lessons in Clarity and Grace",
  gatePrompt: "Find any sentence in your recent writing where the main verb arrives after twelve or more words. Write down, in a few words, what the reader gets when the delay finally ends. If it is ordinary, flatten the sentence.",
  fallback: "After eighteen months of running the two systems in parallel, three failed cutover attempts, and a good deal of argument about whether any of it was worth the effort, we finished the migration. Having weighed the options carefully and consulted the affected teams, we decided to proceed.",
  idea: "Suspend the main clause only when what arrives at the end is worth the wait.",
  why: "Suspension is borrowing. Holding the main clause back keeps a syntactic frame open, and the reader carries every intervening phrase unattached until it closes. They tolerate that because the delay is itself a signal: a writer who makes you wait is promising the wait is the point.\n\nSo the debt has to be repaid at the close. A periodic sentence whose main clause turns out to be \"we finished the migration\" or \"we decided to proceed\" has spent the reader's patience and returned nothing, and the reader learns to discount the next suspension you attempt. The technique is strong and self-limiting: it works because it is rare, so using it for ordinary content destroys it.",
  failureMode: "Ceremonial build-up to a flat landing. \"Having weighed the options carefully and consulted the affected teams, we decided to proceed.\" Fourteen words of preamble to reach a decision the reader assumed on the first line. Worse, the preamble is content-free: nobody claims to have weighed the options carelessly.",
  experiment: "Search your last two docs for sentences beginning with \"Having\", \"After\", \"Given\" or \"While\". For each, cover the opener and read the main clause alone. Count how many main clauses are strong enough that you would still delay them.",
  reflection: "Of the suspended sentences you found, how many were building tension and how many were just clearing their throat?",
  recall: {
    q: "What does a periodic sentence borrow from the reader, and what repays it?",
    a: "It borrows working memory and patience: the main clause is withheld, so the frame stays open and every intervening phrase is carried unattached.\n\nOnly a payload that could not have gone anywhere else repays it. A suspension that lands on an ordinary main clause spends the patience and returns nothing, and teaches the reader to discount your next one."
  },
  deepDive: "Find the suspended sentences in this draft of mine and tell me which ones have a payoff worth the delay."
},
{
  id: "architecture-colon",
  track: "architecture", level: "sentence",
  title: "A colon is a promise that what follows explains what came before",
  source: "Bryan Garner, Garner's Modern English Usage",
  gatePrompt: "Find every colon in something you wrote this week. Cover what comes after each one, write down what you predict should follow from the clause before it, then uncover and compare.",
  fallback: "There is one thing to note: the rollout is scheduled for Thursday and the runbook is in the usual place. We have three concerns about the vendor: capacity, and the fact that they have still not confirmed a maintenance window.",
  idea: "Use a colon when the material after it delivers on a specific expectation created by the clause before it.",
  why: "A colon is structural, not ornamental. It tells the reader to stop expecting a new proposition and to expect the completion of the current one, which narrows their prediction sharply: an amplification, a list, an example, a definition. That narrowing is the entire value, because it makes the next clause cheaper to read.\n\nWhich is also the failure mode. If the clause before the colon says \"one thing\" and two things follow, or says \"three concerns\" and two appear, the reader has committed to a prediction that the sentence then contradicts. A comma or a full stop would have made no promise and could not have broken one. The colon is worth using precisely because it can fail.",
  failureMode: "Colons that announce a shape the sentence does not deliver. \"There is one thing to note: the rollout is Thursday and the runbook is in the usual place.\" Two things, announced as one. Or a colon dropped in where a full stop belongs, so it promises explanation and delivers an unrelated fact.",
  experiment: "Grep your last three documents for colons. For each, write the prediction the left side creates in one phrase, and tick it if the right side matched. Report the ratio.",
  reflection: "Which of your colons was doing real structural work, and which was there because the sentence felt like it wanted one?",
  recall: {
    q: "What prediction does a colon create, and how does a colon fail?",
    a: "It tells the reader to stop expecting a new proposition and to expect the completion of the current one: an amplification, list, example or definition. The narrowed prediction is what makes the following clause cheap to read.\n\nIt fails when the right side does not deliver the announced shape - one thing promised and two supplied, three concerns promised and two listed. A comma makes no promise and so cannot break one."
  },
  deepDive: "Check every colon in this document of mine against what its left side promises, and flag the ones that do not deliver."
},
{
  id: "architecture-semicolon",
  track: "architecture", level: "sentence",
  title: "A semicolon claims that two sentences are one thought",
  source: "Bryan Garner, Garner's Modern English Usage",
  gatePrompt: "Find every semicolon in your recent writing. Replace each with a full stop and read the resulting pair aloud. Restore the semicolon only where the full stop clearly severed something.",
  fallback: "The backfill finished on Sunday; the dashboard has been updated. Capacity planning for next quarter is still open; please send your numbers to the shared doc by Friday; the template is linked in the channel topic.",
  idea: "Use a semicolon only where two independent clauses are close enough that a full stop would break the thought.",
  why: "Punctuation between clauses is an instruction about closure. A full stop tells the reader to close the proposition, clear the buffer and start fresh. A semicolon tells them to hold the first clause open because the second one completes or turns it, and the pair should be evaluated together.\n\nSo a semicolon between unrelated clauses leaves the reader holding something they have no use for. They keep the first clause active, read the second, find no relation, and discharge both, having paid the cost for nothing. This is why a semicolon chain is worse than a comma splice: the splice at least signals haste, whereas the chain claims a unity of thought that is not there.",
  failureMode: "The semicolon used as a slightly grander comma, usually in announcements and status updates. \"Capacity planning is still open; please send your numbers by Friday; the template is in the channel topic.\" Three unrelated instructions welded into one thought. The reader is being told these connect, and they do not.",
  experiment: "Count the semicolons in your last month of writing. For each, apply the full-stop swap and decide in one word whether anything broke. Report how many survived, and be suspicious if it is most of them.",
  reflection: "Of the semicolons you kept, what was the relation between the clauses, and could you name it in a word?",
  recall: {
    q: "What instruction does a semicolon give the reader that a full stop does not?",
    a: "Hold the first clause open. A full stop says close the proposition and start fresh; a semicolon says the second clause completes or turns the first, so evaluate the pair together.\n\nWhen the clauses are unrelated the reader holds the first for nothing. The semicolon claimed a unity of thought that was not there, which is why a chain of them is worse than a comma splice."
  },
  deepDive: "Apply the full-stop swap to every semicolon in this piece of mine and tell me which ones actually earned their place."
},
{
  id: "architecture-fragment",
  track: "architecture", level: "sentence",
  title: "A fragment works when the fragment is the emphasis",

  fallback: "It could be argued that our current approach to workflow retention may not be optimal. A number of considerations have been raised in recent discussions, and the team has spent some time weighing the tradeoffs involved. On balance we feel a broader review of the area might be warranted at some point in the coming quarter.",

  fallback: "As you probably already know, our workflow layer runs on Argo, which is a Kubernetes-native workflow engine - apologies if this is old news for some of you. Bear with me while I set out some background, because it took the team a while to get our heads around it too. Hopefully by the end of this section it should all make sense.",

  fallback: "In this section I will attempt to outline the shape of the rerouting change, though a full treatment is beyond our scope here. First, a quick caveat on terminology: what we call a \"route\" below is not quite the same as a route in the networking sense, for reasons that will hopefully become clear. With that throat-clearing out of the way, let us turn to the mechanism itself.",

{

  fallback: "Restoring the queue after a backlog event is straightforward. One drains the pending partitions, confirms the consumers have reconnected, and the system settles back into a healthy state within a few minutes. The operator will find that patience is generally rewarded here, since the reconciler prefers to converge on its own rather than be hurried.",
  idea: "Choose the stand from the reader's situation, and use classic style only where the reader is reading rather than doing.",
  why: "Thomas and Turner treat a style as a set of answers to questions about truth, presentation, the scene, the cast and the thought. Classic answers them one way: truth is knowable, the scene is one competent person showing another something, the occasion is disinterested. Practical style answers differently, because its reader has a job to finish and a boss waiting.\n\nA runbook reader is not being shown anything. They are executing under time pressure, possibly at 3am, and they need preconditions, ordered steps, expected output and a rollback. Classic style's smoothness actively hurts here: \"one drains the pending partitions\" hides the command, and \"patience is generally rewarded\" hides the timeout. Elegance and executability are different goals.",

  fallback: "Onboarding creates the tenant, and once that lands the crawl populates the catalogue. If the crawl stalls, the usual fix is to re-run onboarding, which clears the lineage state as a side effect. Most of the incidents we see in this area come down to onboarding and the crawl racing each other.",

  fallback: "The proposal is to leverage the existing eventing substrate to provide a first-class, opinionated abstraction over tenant lifecycle, so that downstream consumers get idiomatic primitives rather than bespoke glue. This gives us a principled seam to build on and keeps the surface area tractable as we scale.",

  gatePrompt: "Take a rule you enforce in review - no passives, short words, cut adverbs, whatever it is. Find three sentences in your own recent writing that break it. For each, decide whether the sentence is worse for breaking it.",

  why: "Pullum's observation is empirical and awkward: Orwell's own prose in that essay breaks the rules the essay states, repeatedly and in the same paragraphs that state them. The passives are there, the long Latinate words are there, the metaphors he condemns turn up in his own sentences. He is a fine writer, so the conclusion is not that he failed.\n\nThe conclusion is that the rules were never a description of what makes his prose good. They are a post-hoc rationalisation of a taste he had, and Orwell half-knew it, which is why rule six is an instruction to break the other five rather than say anything outright barbarous. This matters practically because the same is true of the rules you enforce in review. Stated as rules they are unfalsifiable and they travel badly; restated as mechanisms - this passive hides the actor a reader needs - they are checkable, and sometimes the check comes back saying the passive was right.",

{

{

  idea: "Draw the parts and their dependencies as a physical diagram, then permute the diagram rather than the prose.",
  why: "Order decides what the reader is holding in working memory when each claim arrives. A claim that lands before the thing it depends on forces a re-read, and re-reads are silent - the reader does not report them, they just come away thinking the document was heavy.\n\nOn a card, reordering costs a second. In prose, reordering costs a rewrite, because every transition and every back-reference is welded to the current sequence. So the medium you plan in determines how many orderings you will actually consider. Most documents get one, the order the writer happened to think of things in.",
  failureMode: "An incident write-up that opens with the fix. 'We have added a circuit breaker and raised the pool ceiling' is meaningless to a reader who does not yet know what broke or who it hurt, so they park it, read on, and reconstruct the meaning three sentences later. The document is not wrong anywhere. It is just being read backwards.",
  experiment: "Write each section of your current draft on its own line, one line per section, then deal the lines into two different orders. If no ordering is worse than the one you have, the document has no structure - it is a list, and you should say so or find the argument.",
  reflection: "Which arrow pointed backwards, and what did the reader have to hold in memory to survive it?",
  recall: {
    q: "Why plan structure on cards rather than by moving paragraphs in the draft?",
    a: "Because the cost of trying an ordering determines how many orderings you try. On cards it is free, in prose every move drags transitions and back-references with it, so you consider exactly one order: the one you thought of things in.\n\nThe reader's cost of a bad order is invisible to you - they re-read silently and report only that the document felt heavy."
  },
  deepDive: "Here are my sections as a bare list - propose two orderings other than mine and say what each one assumes about what the reader already knows."
},
{
  id: "revision-reverse-outline",
  track: "revision", level: "document",
  title: "Reverse outline: one line per paragraph, then read only the lines",
  source: "Joseph M. Williams, Style: Lessons in Clarity and Grace",
  gatePrompt: "Take something of yours longer than a page. In a separate file, write one line summarising each paragraph, in order. Then read only that list and mark every line that repeats an earlier one, and every paragraph whose line you could not write.",
  fallback: "The migration will be executed in three waves, grouped by tenant tier. Wave sequencing is by tier so that the smallest blast radius goes first. As described above, we sequence the waves by tenant tier in order to limit exposure early in the rollout. Rollback for each wave is independent, and each wave is gated on the previous wave holding for forty-eight hours.",
  idea: "Summarise each paragraph in one line and then evaluate the document from the lines alone.",
  why: "Local fluency masks global incoherence. Reading your own prose, each paragraph is well made and carries you into the next, so the sequence feels earned even when two paragraphs are the same paragraph. Stripping to one line per unit removes the fluency and puts the duplicates next to each other on a single screen, at a granularity where your eye can compare them.\n\nThe second yield is the paragraphs you cannot summarise. A paragraph that resists a one-line summary is doing two jobs or none, and both are structural faults you were never going to see while reading it in place.",
  failureMode: "A document that reads well and produces the same three reviewer questions every time. The answers are in there, spread across four paragraphs in three places, so no reader assembles them. Or the middle section that everyone skims: on the outline it summarises to 'context about the previous architecture', which is not a point, which is why nobody read it.",
  experiment: "Reverse-outline your current draft. Report two numbers: how many lines duplicate another line, and how many paragraphs you could not summarise at all. Merge the first group, and for the second, either write the missing point sentence or delete the paragraph.",
  reflection: "Which paragraph could you not write a line for, and was it doing two jobs or none?",
  recall: {
    q: "A reverse outline finds two distinct classes of fault. Name both.",
    a: "Duplication: paragraphs that summarise to the same line are the same paragraph written twice, and this is invisible in prose because local fluency carries you past both.\n\nEmptiness or overload: a paragraph you cannot summarise in one line is doing two jobs or none. Both need a structural decision, not a line edit."
  },
  deepDive: "Here is my reverse outline with the prose removed - tell me which lines are the same point and where the argument skips a step."
},
{
  id: "revision-box-doubtful-words",
  track: "revision", level: "sentence",
  title: "Box every word you are not sure of and look each one up",
  source: "John McPhee, Draft No. 4",
  gatePrompt: "Take a paragraph you wrote. Draw a box around every word you chose approximately rather than exactly. Look up two of them and write the definition next to the box.",
  fallback: "The service degraded gracefully under the load, and the failover was largely seamless. We mitigated the incident by throttling ingestion, which effectively resolved the customer impact, although a handful of tenants continued to see some latency for a period afterwards.",
  idea: "Run a pass whose only job is to interrogate the words you settled for.",
  why: "Approximate words survive every other pass because nothing is wrong with them. They are grammatical, idiomatic and roughly right, so a structural edit does not reach them and a rhythm edit likes them fine. The only thing that catches them is a pass that asks, of one word at a time, whether this is the word.\n\nOn the reader's side, the damage is quiet. 'Largely seamless' installs a picture, and it is the wrong picture, but the reader cannot locate the error because the sentence never made a checkable claim. They come away confidently misinformed, which is worse than being confused, because confusion at least prompts a question.",
  failureMode: "Incident prose that sounds precise and commits to nothing: 'we mitigated the impact and a handful of tenants saw some latency for a period'. How many tenants, how much latency, how long, and did mitigating mean fixing or hiding. Every one of those words was chosen at 5pm as the nearest available and never revisited.",
  experiment: "Take one paragraph of your last write-up, box every doubtful word, look each up, and count how many you replace. If you replaced fewer than one in ten of the boxed words, you did not box honestly - go again and box the ones you were defending.",
  reflection: "Which boxed word turned out to mean something other than what you were using it for?",
  recall: {
    q: "Why does a structural pass and a rhythm pass both fail to catch an approximate word?",
    a: "Because nothing is wrong with it. It is grammatical, idiomatic and roughly right, so neither pass has a trigger. Only a pass dedicated to word-by-word doubt has one.\n\nAnd the reader cannot flag it either: the sentence makes no checkable claim, so instead of being confused they are confidently given the wrong picture."
  },
  deepDive: "Here is a paragraph with the words I am unsure of marked - for each one, tell me what it currently claims and what I probably meant."
},
{
  id: "revision-greening",
  track: "revision", level: "paragraph",
  title: "Greening: cut a fixed percentage and let the constraint make the choices",
  source: "John McPhee, Draft No. 4",
  gatePrompt: "Take a paragraph you wrote and count the words. Cut it by fifteen percent without losing a single claim, and write the before and after counts.",
  fallback: "In order to ensure that we are able to provide adequate visibility into the health of the ingestion pipeline, we are proposing the addition of a small number of additional metrics, which will be emitted by the worker at the point at which each batch completes. It is worth noting that these metrics are intended to be complementary to the existing dashboards rather than a replacement for them, and that the additional cardinality involved is expected to be fairly minimal.",
  idea: "Commit to removing a set proportion, then find it, rather than cutting whatever you already disliked.",
  why: "Voluntary cutting only removes what you had already conceded was weak, which is a small and already-known set. A quota forces you to compare things you like against each other, and comparison is the only operation that produces a ranking. That is the whole mechanism: the constraint makes you rank, and ranking is what you were avoiding.\n\nThe term comes from Time, where cuts were marked with a green pencil and a writer was told to green a piece by a set number of lines with nothing of substance lost. The instruction sounds impossible and is routinely met, which is itself the evidence.",
  failureMode: "A paragraph that is not wrong anywhere and forty percent longer than its content: 'in order to ensure that we are able to provide adequate visibility'. Six words are doing the job of two, no single phrase is bad enough to trigger a cut, and the reader pays for all of it in attention they will not have for the paragraph that matters.",
  experiment: "Take the longest paragraph in your current draft, count the words, and cut fifteen percent. Then hand both versions to someone and ask which claim went missing. Usually none did, and that answer is what recalibrates you for the next draft.",
  reflection: "What did the quota make you cut that you would never have volunteered?",
  recall: {
    q: "Why does a percentage quota cut better than 'remove what is unnecessary'?",
    a: "Because 'remove what is unnecessary' only reaches material you had already judged weak, which you would have cut anyway. The set is small and known.\n\nA quota forces comparison between things you like, and comparison is the only operation that ranks them. The ranking is the work you were avoiding."
  },
  deepDive: "Cut this paragraph by fifteen percent, show me only the deletions rather than a rewrite, and tell me which claim you came closest to losing."
},
{
  id: "revision-read-aloud",
  track: "revision", level: "paragraph",
  title: "Read it aloud, because your ear catches what your eye forgives",
  source: "William Zinsser, On Writing Well",
  gatePrompt: "Read a paragraph you wrote out loud at normal speaking pace. Mark every place you ran out of breath, stumbled, or had to go back. Count the marks.",
  fallback: "The decision to move the scheduler off the shared cluster, which was taken after the March incident and which the platform team has been planning for since, is intended to reduce coupling between tenant workloads and control plane availability. The work required to move the scheduler off the shared cluster is estimated at six weeks. The risk associated with moving the scheduler off the shared cluster is that the migration window overlaps the reindex.",
  idea: "Read the draft aloud and treat every stumble as a defect report.",
  why: "Silent reading repairs. Your eye takes in a clause, the parser fixes the ordering, and you never register that the repair happened - especially in your own prose, where you are reading your intention rather than the words. Speech is real-time and physical, so the repair has nowhere to hide.\n\nBreath is the specific instrument. A thirty-word subject means you run out of air before the verb, which is exactly the load the reader is carrying silently. Repetition is the other one: the ear is far more sensitive to a repeated phrase than the eye, which is why three sentences opening with the same seven words are unbearable spoken and invisible on screen.",
  failureMode: "Prose nobody would ever say. 'The work required to move the scheduler off the shared cluster is estimated at six weeks. The risk associated with moving the scheduler off the shared cluster is...' On screen it reads as consistent terminology. Aloud it is a drone, and the drone is telling you those three sentences should be one sentence with a list.",
  experiment: "Read your current draft aloud, standing, at the pace you would use in a meeting. Mark every breath failure and every stumble, then fix only those. Count them before and after - the second reading should be clean, and if it is not you fixed the wrong thing.",
  reflection: "Where did you run out of breath, and what was the subject doing at that point?",
  recall: {
    q: "What does reading aloud detect that silent reading cannot, and why?",
    a: "Over-long subjects and unintended repetition. Silent reading repairs clause order and skips repeated phrases without reporting it, and in your own prose you are reading your intention rather than the words.\n\nSpeech is real-time and constrained by breath, so a thirty-word subject shows up as running out of air, which is a physical version of the load the reader carries silently."
  },
  deepDive: "Mark the places in this paragraph where a person reading aloud would run out of breath, and tell me what is wrong with each subject."
},
{
  id: "revision-last-pass",
  track: "revision", level: "document",
  title: "Know which pass is the last one",
  source: "William Zinsser, On Writing Well",
  gatePrompt: "Take a draft you keep returning to. Write in one sentence what would make it done, then list the changes still outstanding and cross out every one the sentence does not cover.",
  fallback: "We believe, on the basis of the current data, that the ingestion regression is most likely - though not certainly - attributable to the client library upgrade. Some reviewers have suggested the pool change as an alternative explanation, and while that remains possible, we are not currently persuaded by it. In any case our recommendation, which we would characterise as provisional, is to roll back the library first.",
  idea: "Decide in advance what would make the draft done, and stop when it is.",
  why: "Revision has a crossover point. Early passes remove errors, which is monotonic improvement. Later passes are trading between options that are close to equal, so each change fixes one thing and breaks another, and you cannot tell which direction you are moving because you have lost the ability to read the draft cold.\n\nWithout a stated done condition the draft is also open to every reviewer. Each comment reopens the whole document, and since it is easier to add a qualifier than to relitigate a claim, the draft accretes hedges. The register drifts from decision to defence, and the reader can hear it.",
  failureMode: "A recommendation that has survived four reviewers and now reads like a legal filing: 'most likely, though not certainly, attributable', 'while that remains possible', 'which we would characterise as provisional'. Every hedge was added to settle one comment. Together they say the author does not want to be held to anything, which is not what anyone meant.",
  experiment: "Before your next pass on your current draft, write the done condition in one sentence - something like 'a reader on the connectors team can state the recommendation and one risk after a single read'. Run the pass, then count the edits it produced that the sentence does not justify. Revert those.",
  reflection: "What was your done condition, and how many of this pass's edits failed to serve it?",
  recall: {
    q: "Beyond diminishing returns, what specifically goes wrong in late revision passes?",
    a: "Changes start trading one flaw for another, because the remaining problems are ties rather than errors, and you have lost the ability to read the draft cold enough to judge.\n\nWith no stated done condition, every reviewer comment reopens the document, and the cheapest way to settle a comment is a hedge. The draft accretes qualifiers until its register shifts from decision to defence."
  },
  deepDive: "Here is my draft and my one-sentence done condition - tell me which remaining changes are needed and which are me trading one flaw for another."
},
{
  id: "revision-own-fault-list",
  track: "revision", level: "document",
  title: "Keep a list of your own recurring faults and edit for them by name",
  source: "Verlyn Klinkenborg, Several Short Sentences About Writing",
  gatePrompt: "Take three things you wrote in the past month. Find one fault that appears in all three, name it in five words or fewer, and start the list.",
  fallback: "There is an expectation that the migration will require coordination with the connectors team. It is worth noting that the identification of affected tenants has not yet been completed. There are also several open questions around the sequencing of the schema change relative to the rollout of the new worker image.",
  idea: "Write down your five recurring faults and edit for them by name, one at a time.",
  why: "Unlisted self-editing is a search over an unbounded space, so what you find is whatever is most salient on that particular reading, which is usually whatever you fixed last time. The frequency distribution is ignored entirely.\n\nYour actual faults are a short closed set - most writers have four or five, and they are stable for years. Named, they convert editing from taste into a pass with a stop condition, which means you can finish. Several of them also have a literal textual signature, so the pass becomes a grep rather than a reading.",
  failureMode: "The same three tics in every document you have written since 2022. 'There is an expectation that', 'it is worth noting that', 'there are several open questions around' - three sentences, three empty openers, and the real subjects arrive at word five. You do not see them because they are your normal, and every reading of your own draft renormalises them further.",
  experiment: "Write your five faults down now, phrased as detectors rather than aspirations. Then grep your last document for the two with a textual signature - 'there is', 'it is worth noting', 'in order to' - and report the hit count. That number is your baseline.",
  reflection: "Which fault appeared in all three documents, and what does its presence tell you about how you start sentences?",
  recall: {
    q: "Why does a written list of your own faults beat editing carefully by feel?",
    a: "Editing by feel searches an unbounded space and surfaces whatever is salient that day, usually whatever you fixed most recently. Frequency is ignored.\n\nA list makes the search finite, so the pass terminates, and several faults have literal string signatures, which turns part of the pass into a grep with a countable result."
  },
  deepDive: "Read these three things I wrote and tell me the four faults that appear in all of them, phrased as detectors I can run myself."
},
{
  id: "revision-diagnose-root-fault",
  track: "revision", level: "document",
  title: "Diagnose before you prescribe: find the fault that causes the other faults",
  source: "George Gopen, Expectations: Teaching Writing from the Reader's Perspective",
  gatePrompt: "Take a draft you are about to review. List every problem you can see, then draw an arrow from each problem to any other problem it could have caused. Circle the one with the most arrows leaving it.",
  fallback: "Coordination with the connectors team was not established early, and as a result there was a period during which the schema change was being developed in parallel with the ingestion refactor. Duplication of validation logic occurred. The eventual reconciliation of the two implementations, which was carried out in June, required changes on both sides, and further delay was introduced by the need to re-run the backfill.",
  idea: "Find the single fault generating the symptoms and comment on that one.",
  why: "Prose faults cluster because they share a cause. A writer who never puts a person in the subject position produces passives, nominalisations, long subjects and missing agents all at once, and those look like four problems to a reviewer working symptom by symptom. Fix the cause and most of the list evaporates without being mentioned.\n\nThere is a reception mechanism too. Volume is read as severity: a page of small corrections says 'this is bad throughout' regardless of what any individual comment says. And a list of symptoms is applied mechanically, so the writer produces this document corrected and the next document identical.",
  failureMode: "Twelve comments on one paragraph - passive here, nominalisation there, this sentence is too long, unclear who did this. One cause: no sentence has a human or a system as its subject. 'Duplication of validation logic occurred' has no one in it, and neither does anything around it. The twelve comments teach nothing; the one diagnosis is portable.",
  experiment: "On the next draft you review, write out your full comment list, then fix the root fault yourself on one paragraph and re-read the rest. Count how many of your comments are now unnecessary. Delete those before sending, and send the diagnosis plus the one fixed paragraph.",
  reflection: "What was the root fault, and how many of your comments turned out to be symptoms of it?",
  recall: {
    q: "Two reasons a symptom-by-symptom comment list is worse than one diagnosis. Name both.",
    a: "It does not transfer: symptoms get applied mechanically, so this document improves and the next one is identical. The diagnosis is portable, the corrections are not.\n\nAnd volume reads as severity. A page of small comments tells the writer the document is bad throughout, which is both demoralising and, usually, false."
  },
  deepDive: "Here is a draft and my list of complaints about it - tell me which single fault is generating most of them."
},
{
  id: "revision-name-the-move",
  track: "revision", level: "paragraph",
  title: "A useful review comment names the move, not the symptom",
  source: "George Gopen, Expectations: Teaching Writing from the Reader's Perspective",
  gatePrompt: "Find a review comment you left in the past fortnight. Rewrite it so that it names the fault in terms that would also apply to a different document, then put the two versions side by side.",
  fallback: "This is confusing, maybe reword? Also this paragraph feels long. I would probably say something like 'the connection pool exhausted during the reindex and we did not catch it for forty minutes'. Rest of the section looks fine to me.",
  idea: "Name the fault in reusable terms rather than pointing at where it hurts.",
  why: "A symptom comment transfers one repair. A named fault transfers a detector, which the writer can run on every paragraph they write afterwards. The difference compounds across a team: one is a fix, the other is a capability.\n\nHanding over a rewritten sentence is the worst version, because it looks maximally helpful and teaches least - the writer accepts it, learns that you will supply the good sentence, and brings you the next draft in the same condition. A named fault is also arguable. The writer can say the subject is consistent and you have misread, and that argument is the evidence they engaged with the diagnosis rather than applying it.",
  failureMode: "'This is confusing, maybe reword?' followed by your rewritten version of the sentence. The writer takes your sentence, the paragraph improves, and nothing was learned by anyone. Compare: 'this paragraph has four different grammatical subjects, so the reader never settles on whose story it is' - which they can check themselves, disagree with, and apply next Tuesday.",
  experiment: "Take the last five comments you left on someone's document and classify each as named-fault, symptom, or rewrite. Write the three counts. If fewer than two are named-fault, your reviews are costing you an hour each and teaching nothing.",
  reflection: "Of your last five comments, how many named a fault the writer could detect for themselves next time?",
  recall: {
    q: "Why is handing over a rewritten sentence the least useful form of review comment?",
    a: "It looks maximally helpful and transfers the least. The writer gets the fix without the rule, so the next draft arrives in the same condition and now depends on you.\n\nA named fault transfers a detector instead, and it is arguable - the writer can push back, which is the evidence they engaged rather than complied."
  },
  deepDive: "Here are the comments I left on a colleague's draft - rewrite each one so it names a fault they could detect themselves, and flag any that were just my preference."
},
{
  id: "revision-report-the-reading",
  track: "revision", level: "paragraph",
  title: "Describe your experience as a reader instead of delivering a verdict",
  source: "George Gopen, Expectations: Teaching Writing from the Reader's Perspective",
  gatePrompt: "Take a paragraph someone else wrote. Write two comments on it: one verdict ('this is unclear') and one report ('I expected the point here and found the history instead'). Mark which of the two the writer could argue with.",
  fallback: "Unclear. This section does not work for me and the argument is not tight enough, so the conclusion does not really follow. Needs another pass before I can approve it.",
  idea: "When you cannot name the fault, report exactly what happened to you as you read, and where.",
  why: "A verdict is a claim about the text, so the writer's only options are to accept it or resist it, and neither tells them where to put their hands. A report is a fact about one reader at one position in the document, and facts about readers are not arguable - the writer cannot tell you that you did not experience that.\n\nThe report also carries the repair information for free. 'I expected the point here' says where the expectation was set and where it was violated, which is the pair of coordinates you need to fix it. This is the honest fallback for entries you cannot diagnose: name the move when you can, report the reading when you cannot, and never guess a diagnosis to sound authoritative.",
  failureMode: "'Unclear. This section does not work for me and the argument is not tight enough.' Three verdicts, no coordinates. The writer now knows a senior person is unhappy somewhere in eight paragraphs, which converts directly into an anxious rewrite of the parts that were fine.",
  experiment: "On the next document you review, convert every verdict-shaped comment into a report with a position: what you expected at that point, what you found instead. Count how many you could not convert - those are the ones where you had a reaction and no reading behind it.",
  reflection: "Which of your comments was a verdict you could not convert into something that actually happened to you as a reader?",
  recall: {
    q: "What makes 'I expected the recommendation here and found more history' more useful than 'this is unclear'?",
    a: "It is a fact about one reader rather than a claim about the text, so it cannot be resisted, only worked with.\n\nAnd it carries coordinates: where the expectation was set and where it was violated. That pair is what the repair needs, and a verdict supplies neither."
  },
  deepDive: "Read this document as a first-time reader and report where your expectations were set and where they were violated, without telling me whether it is good."
},
{
  id: "revision-edit-what-fails",
  track: "revision", level: "paragraph",
  title: "Edit what fails, not what merely differs from how you would have written it",
  source: "William Zinsser, On Writing Well",
  gatePrompt: "Open a document you edited for someone else. Mark each change you made F (a reader would have stumbled) or P (you would have written it differently). Count the P changes.",
  fallback: "We turned the reindex off at 9:40 and things settled down within a couple of minutes. Nobody had thought about what happens when two backfills overlap, so we are adding a lock. It is not clever but it will stop this exact thing happening again.",
  idea: "Change only what would make a reader stumble, and leave everything that is merely not your sentence.",
  why: "Readers stumble on real things: an ambiguous pronoun, a subject that does not match the topic, emphasis landing on the wrong word, a reference to something not yet introduced. They do not stumble on a word you would not have chosen, or on a plain sentence where you would have written a shaped one.\n\nEvery preference edit is a false positive, and false positives are expensive twice. They spend the writer's attention on nothing, and they teach the writer to predict your ear rather than the reader's, which is a worse target because you are one person and you are not the audience. Run that across a team for a year and every document sounds like you, which feels like a quality bar and is actually a loss of range.",
  failureMode: "A colleague writes 'it is not clever but it will stop this exact thing happening again' and you change it to 'the mitigation is unsophisticated but sufficient to prevent recurrence'. Nothing was wrong. You removed a person from the sentence and replaced them with a register, and the writer learns to arrive pre-flattened next time.",
  experiment: "Edit a colleague's paragraph as you normally would, then undo every change you cannot attach to a specific reader failure you could name. Count what survives. Under half means the pass was a rewrite wearing an edit's clothing.",
  reflection: "Which change did you have to undo, and what was the real reason you made it?",
  recall: {
    q: "What is the compounding cost of editing to preference rather than to failure?",
    a: "The writer starts optimising for your ear instead of the reader's, which is a worse target: you are one person, and you are not the audience.\n\nAcross a team it converges every document onto one voice, which reads like a quality bar and is a loss of range - and it consumes the review attention that should have gone to faults that actually break comprehension."
  },
  deepDive: "Here is my edit of someone else's paragraph - for each change, tell me whether a reader would have stumbled without it or whether I was imposing my ear."
},
{
  id: "revision-error-budget",
  track: "revision", level: "sentence",
  title: "Most of what you would flag, no reader ever noticed",
  source: "Joseph M. Williams, \"The Phenomenology of Error\"",
  gatePrompt: "Take a page of your own prose. Mark every error you would flag in someone else's writing, then mark the subset that would change what a reader understands. Write both counts.",
  fallback: "The worker retries the batch which failed, but we cap it at three attempts. Operations was asked to manually re-run anything over the cap. When the scheduler hands a batch to the poller it logs the attempt count, so we can tell them apart.",
  idea: "Spend your flagging budget on faults that change comprehension and ignore the rest.",
  why: "Williams demonstrated the point by planting errors throughout the essay in which he was discussing them, and reporting that readers who were explicitly hunting for errors found very few. What people notice is not what the rulebook lists - it is heavily determined by what they are reading for and who they think wrote it.\n\nSo the flags divide sharply. An ambiguous pronoun changes what the reader believes and they will never know it happened, which is exactly why you must catch it. A split infinitive changes nothing, and flagging it spends the same unit of the writer's attention and goodwill as the pronoun did, for zero return.",
  failureMode: "A review that flags 'which' for 'that' and a split infinitive, and misses that 'it logs the attempt count' could be the scheduler or the poller, and that 'tell them apart' has no antecedent at all. The rule faults were visible. The comprehension faults required reading for meaning, which the rule-hunting pass actively prevents.",
  experiment: "Take your last review. Sort the flags into rule-flags and comprehension-flags and write the ratio. If more than a third are rule-flags with no comprehension cost, delete them from the next review and see whether anyone notices the difference.",
  reflection: "Which comprehension fault did you miss on a page where you caught three rule faults?",
  recall: {
    q: "What did Williams do in 'The Phenomenology of Error', and what follows for your reviews?",
    a: "He planted errors throughout the article that was itself about error, and reported that readers looking for errors found very few of them. Noticing depends on what you are reading for and who you think wrote it, not on the rulebook.\n\nSo flags should be rationed to faults that change comprehension. A rule-flag costs the same attention and goodwill as an ambiguous pronoun and returns nothing."
  },
  deepDive: "Review this page twice - once hunting rule violations and once reading only for meaning - and show me what each pass caught that the other missed."
},
{
  id: "revision-hand-it-back",
  track: "revision", level: "document",
  title: "Hand the draft back when the fault is structural, and say which fault",
  source: "John McPhee, Draft No. 4",
  gatePrompt: "Find a document you fixed yourself rather than sending back. Write the one-sentence diagnosis you would have sent instead, and write down how long your fix took.",
  fallback: "The current orchestration setup has grown organically since 2022 and now spans two clusters, three scheduling mechanisms and a set of scripts that nobody owns. Various teams have raised concerns about it at different points. This document walks through the history, the current state, and some considerations for the future.",
  idea: "Return a structurally broken draft with the diagnosis and one worked example rather than repairing it yourself.",
  why: "Structure is the thinking. Deciding what the document claims, what the reader must hold first, and which sections earn their place is the same work as deciding what you believe. Doing it for someone removes the only part that transfers, and you will do it again on their next draft, and the one after.\n\nOwnership is the second mechanism, and it is the one that bites in a review meeting. An author who did not choose the structure cannot defend it under questioning, because they do not know why the third section is third. At that point you own the document and everyone in the room can tell.",
  failureMode: "A design doc whose opening promises a walk through 'the history, the current state, and some considerations for the future' and never states what is being proposed. No line edit reaches this. If you restructure it yourself you have written their design doc, and they will bring you the next one in the same shape, because nobody told them the shape was the problem.",

{
