<title>Daily</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--STYLES-->

<a class="skip" href="#field">Skip to today's entry</a>

<div class="logbook">
  <aside class="spine">
    <div class="spine__head">
      <p class="eyebrow" id="eyebrow">Logbook</p>
      <h1 class="wordmark" id="wordmark">Daily</h1>
      <p class="spine__sub" id="spine-sub"></p>
    </div>

    <div class="stamp" id="stamp">
      <span class="stamp__label">Entry</span>
      <span class="stamp__num" id="stamp-num">—</span>
      <span class="stamp__date" id="stamp-date"></span>
    </div>

    <nav class="nav" id="nav" aria-label="Sections"></nav>

    <dl class="gauge" id="gauge"></dl>

    <div class="spine__foot">
      <button class="ghost" id="theme-toggle" aria-label="Switch colour theme">
        <span id="theme-label">Lamplight</span>
      </button>
    </div>
  </aside>

  <main class="field" id="field" tabindex="-1"></main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!--SCRIPTS-->
