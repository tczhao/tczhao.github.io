  gateIntro: "You have done the sum and it says eleven percent. You would like twenty. Getting there out of what you already earn means finding nine percent of your income inside a life that currently consumes all of it, and each time you have sketched what that would take, the list has arrived at the car and the suburb and you have put the pen down. There is a bonus due in March and a review in May. You have decided nothing about either, and March is closer than it was.",
  gatePrompt: "Write the rule that applies to money that has not arrived yet, as a share and a deadline, not as an intention.",
  evidence: "No trial. The distinction between an average and a marginal rate is definitional, and the claim that the marginal one is easier to change is an argument about unwind costs rather than a measured result. What weight it has comes from adjacent evidence: pre-commitment schemes that bind future pay rises show high persistence, and the same schemes applied to current income do not exist in the literature to compare against. So the mechanism is plausible and the specific advantage of marginal over average has not been tested head to head by anybody.",
  replication: "craft",
  idea: "Your average savings rate is a summary of arrangements you have already made, and only the rate you apply to income that has not yet arrived can be changed by a decision this afternoon.",
  why: "The average rate is a report on commitments already entered: a lease signed, a loan taken, a car financed, a suburb chosen, a set of subscriptions that renew themselves. Moving it means unwinding one of those, and every one is slow, expensive and emotionally loaded. That is why the distance between the rate people have and the rate they say they want persists for years at a stretch. It is not a character problem. It is that the average is mostly a function of decisions with long unwind times.\n\nMoney that has not arrived has no commitments attached to it. Assigning a share of it costs nothing in the present and unwinds nothing, so the decision is available now in a way that the other one is not. A rule of the form half of anything new goes to the transfer takes a minute to write and then acts on every raise, bonus, refund and side payment from here on with no further attention. The average then rises on its own as income arrives, which is the only route to a substantially higher rate that has ever worked without a crisis behind it.\n\nThe drift arithmetic is worth having explicitly. Hold real spending flat and commit a marginal share above your current average, and every increment of income pulls the average upward, the two converging over years with no single painful step. Commit a marginal share equal to your average and the average never moves. Commit nothing and the average falls, because by default new income joins the spending side.",
  failureMode: "Twice a year you resolve to save more, both times about income you already have, and both resolutions are gone inside two months. The bonus lands in March with no rule attached to it and cannot be traced by June. A rule you could have written in sixty seconds in February would have caught that one, and it would also have caught the next four.",
  worked: "One standing rule, written so that it binds before the money is visible:\n\n\"Fifty percent of any increase in my pay, and fifty percent of any bonus, refund or one-off payment, goes to the transfer within seven days of it landing, and the recurring transfer amount is raised permanently rather than the money being swept across once.\"\n\nPermanently is the word doing the work. Sweeping half a bonus across is a pleasant thing to have done and changes nothing structural. Raising the recurring amount converts a single event into a change in the rate that outlives it.\n\nWhat is deliberately absent is a target for the average rate. The average is an outcome here rather than an input, and setting a target for it invites exactly the unwinding exercise that has already failed every time you have attempted it.",
  experiment: "Write the marginal rule down today, at a share you would genuinely accept on a raise nobody has promised you, and put it wherever your instructions live. Then find the next piece of income that is not your ordinary pay - a bonus date, a tax refund, a leave payout, a side invoice - and put a calendar entry on it with the split already worked out. One rule and one dated entry is the entire install.",
  reflection: "What share of the next dollar you receive is committed, and had you ever set that number before today?",
  forecast: { q: "Will the next payment I receive outside my ordinary pay be split according to the rule I just wrote?" },
  recall: {
    q: "Why is a rule about future income more likely to move your savings rate than a decision to save more out of what you already earn?",
    a: "Because the average rate summarises commitments already in place, and each of them has a long, expensive unwind, which is why the gap between the rate people have and the rate they want survives for years. Income that has not arrived carries no commitments, so assigning a share of it costs nothing today.\n\nAfter that the drift does the work. A marginal share above your current average pulls the average up with every increment of income and no single painful step. A marginal share of nothing lets the average fall, because new income joins the spending side unless something intercepts it."
  },
  deepDive: "Here is my income history for the last five years and my current rate. Tell me what marginal share of new income I would have needed to be where I wanted to be by now, and what it has to be from here."
},
{
  id: "rate-consumption-tracks-income",
  track: "rate", level: "judgement",
  title: "Your spending follows this month's income far more closely than any lifecycle model says it should",
  source: "The excess sensitivity literature on household consumption, running from Hall's random walk test through the tax rebate natural experiments of Johnson, Parker and Souleles, and Carroll, Buffer-Stock Saving and the Life Cycle/Permanent Income Hypothesis (Quarterly Journal of Economics, 1997)",
  gateIntro: "Your income this year will be close to what it was last year, you know that, and you knew it in January. There is nothing here to smooth. And yet the four days after pay look nothing like the four days before it, and you could describe the difference without opening a statement. A friend paid monthly says the same about their third week. You are on the transfer screen about to set an amount, and the two fortnights would give you two very different answers.",
  gatePrompt: "Write the instruction so the money is gone before spending sees it, and name the amount you would size against your leanest week.",
  evidence: "A large body of work rather than one study, which is why it sits here as replicated. The permanent income hypothesis predicts that consumption responds only to news about lifetime resources, so a payment you were told about in advance should move spending on the day you were told rather than the day it lands. Tested on household data the prediction fails in a consistent direction: anticipated payments produce large responses at the moment of receipt, and spending over a pay cycle shows a sawtooth no smoothing model generates. This has been reproduced across countries, datasets and natural experiments including tax rebates. What remains genuinely unsettled is the mechanism - liquidity constraints, precautionary buffers, mental accounting and plain inattention all fit the data - and the size of the response varies a great deal by household and by the size of the payment, so no single figure should be quoted from it.",
  replication: "replicated",
  cheat: "Assume your spending will track your pay rather than your plan: consumption responds to predictable income arriving far more than any smoothing model allows.",
  idea: "Households do not smooth consumption the way the theory requires, so spending moves when income arrives even when the arrival was fully expected.",
  why: "The permanent income hypothesis makes a sharp and testable prediction. Consumption responds to news about lifetime resources and to nothing else, which means a raise you learned about six months ago is already in your spending and the day the money first appears should be unremarkable. A rebate announced in advance should move behaviour on the announcement, not the deposit. Against household data that prediction fails, it fails in the same direction every time, and it has failed across many countries and datasets.\n\nThe name for the failure is excess sensitivity, and it has outlasted a great many attempts to explain it away. The proposed mechanisms differ and the argument between them is live: some households are liquidity constrained, some are running a precautionary buffer, some are doing mental accounting, and some are simply not paying attention. That disagreement is real and worth knowing about. The pattern itself is not what is in dispute.\n\nWhat follows is not a moral conclusion. It is that a plan resting on holding spending flat while income rises is resting on the single behaviour households reliably do not display. The design response is to shrink the income that reaches the account your spending draws on, because interception works with the finding while resolve works directly against it. Anything you build on the assumption that you are the exception should be sized so that being wrong is survivable.",
  failureMode: "You take a job paying twenty thousand more and intend to save the difference. Twelve months on, the difference is not identifiable in any account, and asked to name what it bought you could account for perhaps a third. Nothing was wasted in any way you would recognise as waste. The spending expanded into the space, which is what the evidence says spending does.",
  worked: "The instruction is written to accept the finding rather than argue with it:\n\n\"Any increase in my pay is split at the payroll or gross level before it reaches my everyday account, so the balance my spending sees does not rise by the full amount.\"\n\nWhere payroll cannot do that, the weaker version is still worth installing:\n\n\"On the day a pay increase first lands, raise the standing transfer by the same amount, on the same screen, in the same sitting.\"\n\nWhat is deliberately absent is any commitment about spending behaviour. There is no line here saying I will hold my costs flat, because that is precisely the promise the literature says people do not keep, and writing it into an instruction does not change the base rate.",
  experiment: "Total your transactions for the four days after each of your last two pay dates, then total the four days before each. Most people find a gap they can see without any analysis, and that gap is this finding in your own data. Then decide once whether your next pay increase will be visible in the everyday account at all, and set whatever it takes at the payroll or transfer level to make the answer no.",
  reflection: "What did the four days after pay look like against the four days before, and did the size of the gap surprise you?",
  recall: {
    q: "The theory says a pay rise you learned about months ago should not move your spending on the day it lands. What actually happens, and what should you build instead?",
    a: "Spending responds to income arriving rather than to news about it. Anticipated payments produce large responses at the moment of receipt and consumption over a pay cycle shows a sawtooth that no smoothing model generates, reproduced across countries, datasets and natural experiments. The explanations offered differ - liquidity constraints, precautionary buffers, mental accounting, inattention - and that argument is genuinely unsettled, but the pattern is not.\n\nSo a plan that assumes you will hold spending flat while income rises assumes the one behaviour households do not display. Build so the increase never reaches the account your spending draws on. Interception works with the finding and resolve works against it."
  },
  deepDive: "Here is my transaction history and my pay dates for the last six months. Show me how much of my spending is timed to income arriving rather than to anything I would call a need, and tell me what a gross-level split would have to be to make that pattern disappear."
},
{
  id: "rate-buffer-stock-target",
  track: "rate", level: "standing",
  title: "Below a cash buffer your savings rate is not a decision, because every shock has to be funded by not saving",
  source: "Christopher Carroll, Buffer-Stock Saving and the Life Cycle/Permanent Income Hypothesis (Quarterly Journal of Economics, 1997)",
  gateIntro: "The transfer has been running eight months at fifty dollars a week and you were pleased with it. Then the dentist quotes two thousand dollars for work that cannot wait until the new year. There is eleven hundred in the everyday account and nothing else liquid. The transfer is due to run on Thursday. You are looking at the cancel button and telling yourself it is temporary, and you have told yourself that before.",
  gatePrompt: "Write the two instructions in the order you would install them, and name the balance at which the first one hands over to the second.",
  evidence: "A theoretical model calibrated against household data rather than an experiment. Carroll showed that a consumer who is impatient but faces income risk they cannot insure behaves as though targeting a ratio of wealth to permanent income: below the target precaution dominates and saving is high, above it impatience dominates and spending rises. The model reproduces features of real household data that the standard lifecycle model does not, including consumption tracking income closely and wealth holdings that hover rather than climb steadily through working life. It is one paper, it is a calibration rather than a test against an intervention, and the target ratio it implies depends on parameters - impatience, risk aversion, the size and persistence of income shocks - that are estimated rather than observed.",
  replication: "single",
  idea: "Until there is a liquid buffer, a shock can only be funded out of that month's saving, so the rate reports what went wrong rather than what you chose.",
  why: "Carroll's consumers are impatient enough to prefer spending to accumulating, and exposed enough to income risk that they will not let their balance reach zero. Those two forces meet at a target ratio of liquid wealth to income. Below it, precaution wins and saving is high. Above it, impatience wins and spending rises until the ratio comes back down. The household therefore hovers around a buffer instead of accumulating steadily, which is what household data actually looks like and is not what the textbook model predicts.\n\nRead as a description of your own position, the useful part is what it says about the variance of your rate. If your liquid balance sits under your own target then the tyres, the vet and the insurance excess are all funded by not saving that month, because there is nowhere else for them to come from. The rate in any given month is then a report on what went wrong in it. That is the mechanism behind a savings history that looks like noise rather than like a policy.\n\nAbove the buffer, the identical shock is funded by the buffer and the transfer keeps running untouched. The rate becomes something you set. Which reorders the usual advice: the first job is not a high rate, it is a buffer large enough that the rate stops being a residual, and only after that is the rate worth pushing. How large the buffer should be is a separate question with its own literature and this entry does not settle it. What the model settles is the ordering.",
  failureMode: "Eight months of a fifty dollar weekly transfer, then a two thousand dollar bill, then a cancellation, then four months of nothing while you recover. The year totals roughly what six months of the transfer would have been. Worse, the arrangement now has a failure in its history, and a past failure is the single best predictor that the next version will not survive either.",
  worked: "Two instructions in sequence, and the sequence is the point:\n\n\"Until the buffer account reaches the amount I have written down, the entire transfer goes there and nothing goes anywhere else.\"\n\n\"On the first pay after the buffer reaches that amount, the whole transfer redirects to the long-term account, and the buffer is used for nothing except an unplanned expense.\"\n\nWhat is deliberately absent is any attempt to invest the buffer. Its job is to be there in the week the bill arrives, and every improvement to its return costs some of that. Also absent is permission to renegotiate the target amount in the middle of a bad month. Pick the number today, write it down, and revise it once a year, because a threshold you renegotiate under stress was never a threshold.",
  experiment: "Work out your liquid balance as a number of months of your own outgoings. If it is below the figure you would name as your own comfort point, redirect the entire transfer there this pay and stop splitting it. Splitting a small transfer between a buffer and a long-term account is the slowest available route to having either, and the buffer is the thing that stops the long-term one being cancelled in a bad month.",
  reflection: "How many months of outgoings are sitting liquid, and has a shock ever cancelled one of your transfers?",
  recall: {
    q: "Why does a household below its buffer have a savings rate it does not really control?",
    a: "Because with nothing liquid to absorb a shock, the only place a shock can be funded from is that month's saving. The rate then reports what went wrong during the month rather than what was decided at the start of it, which is why savings histories at low balances look like noise.\n\nCarroll's model reaches the same place from the other direction: an impatient consumer facing uninsurable income risk behaves as though targeting a ratio of wealth to income, saving hard below it and spending above it. It is a single calibrated model rather than a trial, but it explains why the first job is a buffer big enough for the rate to become a decision, and only then a higher rate."
  },
  deepDive: "Here are my monthly outgoings and my liquid balance. Tell me how many months I am carrying, what a shock the size of the largest one I have actually had in three years would do to my transfer, and whether I should be splitting the transfer at all yet."
},
{
  id: "rate-creep-moves-the-target",
  track: "rate", level: "standing",
  title: "A raise absorbed into your baseline moves the finish line further away, it does not merely fail to move you toward it",
  source: "The ratchet in household spending after an income increase, set against a target written as a multiple of spending; observation and arithmetic rather than a trial",
  gateIntro: "A recruiter has offered you a role at eighteen thousand more and you have accepted it. You start in five weeks. Between now and then you will make three or four choices that are each perfectly reasonable on their own: the better lease, replacing a car that is eleven years old, the childcare option you have been rationing. You have made none of them yet. Your transfer has not been touched since before the interview and you have not opened the app.",
  gatePrompt: "Write the instruction and the date it executes, both of them before the first pay at the new rate lands.",
  evidence: "No trial. That spending ratchets up after an income increase is close to universally observed and close to never measured cleanly, because the counterfactual household that got the same raise and did not absorb it is not available. The claim about timing, that absorption happens within a couple of pay cycles, is an impression rather than a finding and you should treat it as one. What is not an impression is the arithmetic: if the target is a multiple of spending then lifting baseline spending lifts the target by that multiple, and that part follows from the definition rather than from anybody's data.",
  replication: "craft",
  idea: "Because the target is a multiple of what you spend, absorbing a raise leaves the contribution flat while raising the amount you must accumulate, so the horizon gets longer than if the raise had never arrived.",
  why: "Everybody knows an absorbed raise fails to improve the rate. The part that gets missed is the double effect from the first entry in this track, running in reverse. If the target is a multiple of annual spending, then raising baseline spending raises the target by that same multiple. Twelve thousand dollars a year of new recurring outgoings does not just leave the annual contribution where it was, it adds twelve thousand times the multiple to the pile you have to build. Absorbing a raise leaves you further from the target than not receiving one would have.\n\nThe absorption itself is quick and it is not made of impulses. It is made of a handful of choices that are individually defensible and structurally permanent: a lease, a car payment, a school, a service tier, a suburb. Each is decided once and then recurs with no further decision, so the increase is committed long before anybody has thought about it as a pool of money. By the time you sit down to work out where it went, the answer is a set of standing arrangements rather than a set of purchases, and standing arrangements are not the sort of thing you can regret your way out of.\n\nThe ratchet is asymmetric, which is what makes it expensive. Adding a commitment takes an afternoon. Removing one takes months, usually involves a break fee or a sale, and feels like going backwards in a way that never having added it would not have. So the window in which new income is cheap to allocate is the few weeks before it starts arriving, and it closes without announcing itself. That is why the instruction here carries a date instead of an appeal to restraint.",
  failureMode: "Eighteen thousand more a year, of which around six thousand has become recurring commitments inside four months. The rate is unchanged, the income is higher, and the target, being a multiple of what you spend, has moved out by that multiple times six thousand, which on any plausible multiple is a six-figure addition to what you have to accumulate. The raise was real and it made the problem bigger.",
  worked: "The instruction is dated to the window rather than left as a principle:\n\n\"Before the first pay at the new rate lands, increase the standing transfer by sixty percent of the after-tax increase, effective that same pay.\"\n\nAnd the clause that keeps the window open long enough to matter:\n\n\"No new recurring commitment - lease, finance, subscription tier, ongoing service - for the first three months at the new income.\"\n\nWhat is deliberately absent is any limit on one-off spending. Buy the thing. A one-off purchase does not move the target, because the target is a multiple of what recurs, and a rule that bans both gets broken on the first weekend and then abandoned in full. The entire restriction sits on the recurring side, which is the side with the multiple attached to it.",
  experiment: "Take your last income increase, whenever it was, and list the recurring commitments that began within six months of it. Add up what they cost a year. That figure times whatever target multiple you use is the amount that raise added to your finish line. Then find the date of your next income change, whatever kind it is, and put the transfer increase in the calendar for the day before it with the new amount already typed into the title.",
  reflection: "Which recurring commitments started within six months of your last raise, and what do they cost you a year?",
  forecast: { q: "Will my next income increase pass without a single new recurring commitment starting in the three months after it?" },
  recall: {
    q: "In horizon terms, why is absorbing a raise worse than never having received it?",
    a: "Because the target is a multiple of what you spend. Absorbing the whole increase into recurring outgoings leaves the annual contribution exactly where it was while lifting the target by the multiple times the new spending, so the finish line moves away and the horizon is longer than it would have been with no raise at all.\n\nThe absorption is fast because it is built from a few individually defensible commitments, each decided once and then recurring without further decision. Adding one takes an afternoon and unwinding one takes months and a fee, so the money is only cheap to allocate in the weeks before it starts arriving."
  },
  deepDive: "Here is my current income, my spending and the increase I am about to receive. Tell me how far my horizon moves if I absorb all of it, half of it, or none of it, and which of my existing recurring commitments began within six months of a previous raise."
},
{
  id: "rate-cut-without-capture",
  track: "rate", level: "standing",
  title: "A spending cut only raises your savings rate if something moves the money the same day, and usually nothing does",
  source: "The compounding arithmetic behind the latte factor and its many relatives, examined for the step it skips between cutting and saving",
  gateIntro: "You have just cancelled four subscriptions in one sitting. Eighty dollars a month, gone, and the feeling is genuinely good. You close the laptop. Nothing else about the month has changed: same transfer on the same date, same everyday account, same card in the same wallet. There is now eighty dollars a month that has nowhere in particular to be, and the app you would need to open to give it somewhere is the one you have just closed.",
  gatePrompt: "Write the second half of what you just did, as an instruction with the same amount in it.",
  evidence: "No trial supports the causal step, and the causal step is where the entire claim lives. The compounding arithmetic is correct and nobody disputes it: a recurring amount removed and invested for decades reaches a large figure. What has never been shown is that the released money is saved rather than reabsorbed. The adjacent evidence runs the other way, since households spend a large fraction of income that becomes available to them, and nobody has separately measured what happens to an avoided cost, which is if anything less visible than a payment of the same size. Treating a cut as equivalent to a contribution assumes a marginal savings rate of one on the released money, and that is not a rate anybody has observed.",
  replication: "overclaimed",
  idea: "Cutting a cost releases cash into the account you spend from, and cash in the account you spend from is spending until an instruction moves it.",
  why: "The compounding sum is right and it is not the claim. Take a recurring cost, remove it, compound the amount over thirty years, and the number is genuinely large. Every arithmetic step of that holds. The unstated premise is that the released money entered the compounding, and the only mechanism ever offered for that is that you will notice it sitting there and do something about it. That is a claim about behaviour with nothing behind it, standing next to a literature that says the opposite about money which becomes available.\n\nCuts also have a salience problem that windfalls do not. A payment arriving is at least visible: it has a date, an amount and a line in the account. An avoided cost has none of those. It appears as a slightly larger balance at the end of a month that contained forty other things, which is precisely the form in which money gets absorbed without anybody deciding anything. If anything, a cut is easier to lose than a windfall of identical size.\n\nSo the correct version of the advice has two halves, and the second one is always the missing one. Cut the cost, and on the same day raise the standing transfer by what you cut. Do both or do neither. A cut with no capture is a small increase in your discretionary budget, which may be an entirely reasonable thing to want, but it should not be written down anywhere as saving and it will not show up in the rate at the end of the year.",
  failureMode: "Four subscriptions cancelled, eighty dollars a month, and nothing else touched. Twelve months later there is no trace of nine hundred and sixty dollars anywhere in the savings account, and the honest answer to where it went is that it never went anywhere. It stayed in the everyday account and did what money in the everyday account does.",
  worked: "Two clauses, and they have to run in the same sitting:\n\n\"Whenever I cancel or reduce a recurring cost, I raise the standing transfer by the same monthly amount before I close the app.\"\n\nAnd for a reduction that is annual rather than monthly:\n\n\"When a renewal comes in lower than last year, move the difference across as a single payment that day rather than intending to later.\"\n\nWhat is deliberately absent is any target for how much to cut. The size of the cut is not what this is about. The pairing is what it is about, and a small cut that is captured beats a large one that is not by an unbounded margin, because the second one is zero.",
  experiment: "List every recurring cost you have cancelled or reduced in the last two years and total the monthly amount. Then check whether your savings transfer ever went up by anything like that figure. For most people the two series are unrelated, which means the cutting was real and the saving was not. Fix it forwards rather than backwards: raise the transfer today by whatever share of those past cuts you can still afford, and pair every future one on the spot.",
  reflection: "What have you cut in the last two years, and did the transfer ever rise to match it?",
  recall: {
    q: "The compounding arithmetic behind cutting a small recurring cost is correct. Why is the advice still overclaimed?",
    a: "Because the arithmetic quietly assumes the released money entered the compounding, which requires a marginal savings rate of one on money that has become available. Nobody has measured such a rate on a household, and the evidence on income that becomes available runs the other way. Cash released into the account you spend from is spending.\n\nAn avoided cost is also harder to catch than a payment of the same size, because it has no date, no amount and no line in the account. It surfaces only as a slightly larger balance at the end of a busy month. The fix is to pair the cut with a transfer increase in the same sitting, or to stop calling the cut saving."
  },
  deepDive: "Here is a list of recurring costs I have cut in the last two years and my transfer history over the same period. Tell me how much of the cutting actually reached savings, and write me the pairing rule in a form I would plausibly follow."
},
{
  id: "rate-fixed-cost-ceiling",
  track: "rate", level: "annual",
  title: "Your maximum savings rate is one minus your fixed-cost share, and almost nobody has computed theirs",
  source: "Australian Bureau of Statistics household expenditure collections on the composition of household spending, read as a constraint on the achievable savings rate rather than as a description of it",
  gateIntro: "Somebody on a forum says they save half their income and you have just spent twenty minutes deciding whether to believe them. They are telling the truth, as it turns out: they rent a room, they do not own a car, and they earn roughly what you earn. You have a mortgage on a house chosen for the school catchment and two cars because of where that house is. You are sitting down to set a target for next year and you have never written down what those two things cost you.",
  gatePrompt: "Write the annual instruction that computes the ceiling before it sets the target, and name the month it runs.",
  evidence: "No trial, and the two halves of this entry rest on different things. The measurement half is descriptive national statistics: Australian household expenditure collections consistently show housing as the single largest category of household spending with transport among the next largest, and periodic collection means the composition is well described even where the latest figures are some years old. The published averages pool renters, mortgaged owners and outright owners, whose housing shares are not remotely comparable, so the average describes no actual household. The ceiling half is arithmetic laid on top: a survey measures what households did spend, never what they could have spent, so nothing in it establishes that any particular share is unavoidable for you. Compute your own and ignore the national figure.",
  replication: "craft",
  idea: "The most you can save is your income less the costs that recur without a decision, so your ceiling is set by where you live and how you travel rather than by anything a spending audit would find.",
  why: "Split your outgoings into two groups: things that recur whether or not you decide anything, and things you decide each time. The first group is your fixed cost, and the most you could possibly save is one minus that group as a share of income. It is a genuine ceiling, because reaching it would mean discretionary spending of exactly zero, and nobody operates at their ceiling. But it tells you the size of the room you are standing in, and it is the only number that distinguishes an ambitious target from an impossible one.\n\nIn wealthy countries housing is consistently the largest single line in household spending and transport is among the next largest, and between them they dominate the fixed group. Which means the ceiling is set almost entirely by two choices, where you live and how you get about, each made once every several years and then lived with. National averages will not help you locate your own, because they pool renters, people mid-mortgage and people who own outright, and those three have nothing in common on this measure.\n\nTwo people on identical incomes can have ceilings twenty points apart, and no quantity of discipline moves either of them toward the other. That is the honest reason a rate somebody else achieves may be genuinely unavailable to you. It is also the reason that a rate sitting well below your own ceiling is a choice you are making rather than a constraint you are under. Both are worth knowing and only the computed ceiling tells them apart.\n\nRaising the ceiling is a different sort of act from raising the rate. It happens at a lease end, a refinance, a move or a vehicle replacement, perhaps once every few years, and when it happens it is permanent. That is why it belongs on an annual list rather than a monthly one.",
  failureMode: "You set a target of thirty percent against a ceiling of twenty-six, miss it every month for a year, and conclude you have a discipline problem. You have an arithmetic problem, and fifteen minutes of adding up standing arrangements would have shown it in January. The year goes into the wrong intervention entirely: audits, apps and resolutions, none of which touch either of the two commitments that set the number.",
  worked: "An annual instruction that computes the ceiling before it allows a target:\n\n\"Every July, before setting any savings target, add up twelve months of housing, transport, insurance, utilities, loan payments and everything else that recurs without a decision. Divide by gross income. One minus that is the ceiling, and the target goes underneath it.\"\n\nThen the line that makes it actionable rather than merely deflating:\n\n\"If the ceiling is lower than I want it to be, write down the date of the next lease end, refinance window or vehicle replacement, because those are the only days in the year on which it can move.\"\n\nWhat is deliberately absent is a benchmark to compare the ceiling against. There is no published number worth comparing it to, because the averages pool households whose housing arrangements make them incomparable, and a benchmark you cannot trust is worse than having none.",
  experiment: "Do the fifteen minute version today. Add up one month of costs that recur without a decision, divide by one month of gross income, and subtract from one. That is roughly your ceiling. Write your current rate next to it. The distance between the two is the room you actually have, and it is almost always either much larger or much smaller than people guess, which is the entire reason to compute it rather than estimate it.",
  reflection: "What is your ceiling, and how far below it is the rate you are actually running?",
  recall: {
    q: "Why does computing your fixed-cost share tell you more about your achievable rate than a discretionary spending audit does?",
    a: "Because the maximum rate available to you is one minus the share of income committed to costs that recur without a decision. That share is a hard ceiling and the discretionary category is only the room underneath it. Housing and transport dominate the fixed group and both are set by choices made once every several years, which is not a horizon a monthly audit can reach.\n\nIt also separates two situations that feel identical from inside. A target above the ceiling is arithmetically impossible and no amount of discipline repairs it. A rate well below the ceiling is a decision you are making. Only the computed number tells you which one you are in."
  },
  deepDive: "Here are twelve months of transactions. Split them into costs that recur without a decision and costs I choose each time, compute my ceiling against gross income, and tell me which single commitment would move the ceiling most and when its next decision point falls."
},
{
  id: "rate-fifty-thirty-twenty",
  track: "rate", level: "standing",
  title: "The fifty thirty twenty rule is a communication device with no evidence behind it, and its twenty is somebody else's ceiling",
  source: "Elizabeth Warren and Amelia Warren Tyagi, All Your Worth: The Ultimate Lifetime Money Plan, and the fifty thirty twenty rule as it now circulates independently of the book",
  gateIntro: "You have opened the spreadsheet three times to split your income into fifty, thirty and twenty, and each time you have run into the same argument with yourself. The car is a need because it gets you to work and a want because you chose that car. Childcare fits none of the three in any way you can defend. The private health cover is either, depending on the sentence you use. This is the third attempt, the tabs are still open, and the twenty is still empty.",
  gatePrompt: "Write the single instruction that replaces all three categories, with a percentage in it that you got from your own numbers.",
  evidence: "No trial, no cohort study, no evaluation of any kind. The rule appeared in a popular book as a way of explaining a budget in one sentence and it succeeded completely at that, which is a different achievement from being right. Nobody has tested whether households given the rule end up wealthier than households given nothing, whether the three categories are stable enough to allocate against, or whether twenty percent is adequate for anybody in particular. Two structural problems compound the absence. The boundary between needs and wants is undefined and moves with income. And the fifty percent needs allowance is comfortably breached by housing plus transport plus utilities for a great many mortgaged and renting households, while being slack for a household that owns outright, which makes it one national number applied to a wide distribution.",
  replication: "overclaimed",
  idea: "A rule that allocates income into three named buckets fails at the boundaries between them, and its saving figure is one number applied to households whose ceilings are twenty points apart.",
  why: "The rule earned its popularity honestly. It is memorable, it fits in a sentence, and it gives somebody with no framework at all a place to begin, which is worth something real. The trouble starts the moment anybody tries to use it, because it requires a needs and wants distinction that nobody has defined and that moves with income. The car that gets you to work, the childcare that makes the job possible, the cover that is technically optional: none of these has an answer, and the hours spent manufacturing one are hours not spent installing anything.\n\nThe deeper failure is the third number. A single saving figure applied across a population is applied to households whose fixed-cost ceilings differ by twenty points or more, so it is out of reach for some and lazy for others at the same time. For a household whose housing and transport already take more than half of gross income it announces a failure that arithmetic guaranteed. For a household that owns outright and cycles to work it certifies a success that required nothing. Neither has learned anything.\n\nAnd the shape of the rule is wrong for the mechanism. It is a budget, which means it works by allocating spending in advance and then requiring compliance with the allocation for the rest of the month, which puts saving at the end of a chain of decisions. The finding this whole corpus rests on says to delete the chain: one transfer, dated, at a rate taken from your own ceiling, and no categories whatsoever.",
  failureMode: "Three weekends across two years building allocation spreadsheets, each abandoned inside a month, because the boundary arguments have no answers and the categories drift as soon as anything changes. Roughly eighteen hours, and not one standing instruction at the end of any of them. The twenty percent target was never checked against a ceiling either, so it may never have been reachable in the first place.",
  worked: "The replacement is one instruction with no categories in it at all:\n\n\"Transfer eighteen percent of each pay to the savings account the day after pay lands, and spend the rest without allocating it.\"\n\nThe eighteen comes from your own ceiling computed against your own fixed costs rather than from anybody's rule, and it sits below that ceiling deliberately.\n\nWhat is deliberately absent is every category. No needs figure, no wants figure, no bucket structure, because the boundary between the categories is exactly where the previous three attempts died. Once the saving has left the account, what happens to the remainder does not need governing, and that freedom on the spending side is most of why the instruction survives the month.",
  experiment: "If you have a bucket allocation running, delete the categories today and keep only the figure that was going to savings. Convert it to a share of pay, check it against the ceiling you computed, adjust it once, and set it as a single dated transfer. Then close the spreadsheet for good. If you have never had one, skip the exercise entirely and do the transfer, which was always the only part of it capable of doing anything.",
  reflection: "How many times have you built a category budget, and how long did the longest one survive?",
  recall: {
    q: "The fifty thirty twenty rule is memorable and easy to explain. Why does it still not work?",
    a: "Because it needs a needs and wants boundary that nobody has defined and that shifts with income, so the first hour of using it goes into arguments with no answers, and those arguments are where the attempt usually ends. No trial has ever tested whether households given the rule do better than households given nothing at all.\n\nThe saving figure is the deeper problem. One number applied across households whose fixed-cost ceilings differ by twenty points or more is unreachable for some and slack for others, and tells neither group anything true. It is also structurally a budget, which places saving at the end of a chain of monthly compliance decisions when the entire point is to remove the chain."
  },
  deepDive: "I have tried a category budget three times and abandoned it three times. Here are my income and my fixed costs. Give me the single transfer that replaces the whole thing, and tell me honestly what I lose by having no categories at all."
},
{
  id: "rate-budgeting-apps",
  track: "rate", level: "standing",
  title: "Nobody has shown that a budgeting app raises anybody's savings rate, at a scale of use where somebody should have",
  source: "The efficacy claims made for personal financial management applications, set against the evaluation literature that exists for them",
  gateIntro: "You have had the app fourteen months. The categorisation is good, the charts are legible, and last Sunday went on recoding a batch of transactions the algorithm had filed under the wrong heading. You know your restaurant spending to the dollar for every month since installation. The savings transfer is the same amount it was the week you set the app up, and the app has never once asked you to change it.",
  gatePrompt: "Write the instruction that makes the app cause something, including what happens if two quarters pass and it has not.",
  evidence: "No trial this entry can point to, which at this scale of use is itself the finding. Budgeting and personal financial management applications are used by enormous numbers of people and have been evaluated remarkably little: what exists tends to be short, small, run with the provider, and measured on engagement or self-reported behaviour rather than on a balance twelve months later. This is an absence of evidence rather than evidence of absence, and the honest position is that nobody knows. Two things make the absence suspicious rather than neutral. Tracking and feedback is an information intervention, and information interventions in household finance have a well documented habit of decaying. And the app can only reach a balance through a decision it does not make for you, which puts it on the wrong side of the distinction that opens this corpus.",
  replication: "overclaimed",
  idea: "An app produces measurement, and measurement only reaches a balance through a subsequent decision that nothing in the app makes on your behalf.",
  why: "The app is a measurement instrument and it is frequently a good one. The question is what measurement does on its own, and the answer from the wider literature is not encouraging. Knowing a number is an information intervention, and information interventions in household finance are the category with the smallest and least durable effects on record. The app sits squarely on the side of that line this corpus opens by dismissing. It tells you things. It does not move money.\n\nThere is also a failure mode that measurement tools have and defaults do not, which is that the work they generate feels like the work that matters. Recoding transactions, tuning categories and reviewing a dashboard all have visible output and none of them changes a balance. An hour on a Sunday spent recategorising felt productive and moved nothing, and it competes directly for attention with the eleven minutes that would have moved something.\n\nThe honest position is that the evidence is absent rather than negative. If you are someone for whom seeing the number reliably produces a change in the standing instruction, then the app has earned its place and this entry does not apply to you. That is a testable claim about yourself and testing it takes one line: has the transfer amount changed since you installed it? If it has not, the app is a hobby, and it is a harmless one right up to the point where it is being counted as the intervention.",
  failureMode: "Fourteen months of clean data, forty minutes a fortnight of maintenance, and a transfer amount unchanged since installation. That is somewhere around fifteen hours of work with a measurable output of zero dollars, sitting next to an eleven minute task that was available on any one of those Sundays.",
  worked: "The instruction converts the app from an intervention into a trigger:\n\n\"Once a quarter, open the app for ten minutes, and if the savings transfer has not increased since the last time I looked, increase it now by one percent of pay before closing the app.\"\n\nThen the honest fallback, which has to be written down in advance or it never happens:\n\n\"If two consecutive quarters pass with no change to the transfer, delete the app and keep the transfer.\"\n\nWhat is deliberately absent is any requirement to maintain the data. No recategorising, no reconciling, no monthly review. The app either causes the transfer to move or it does not, and the quality of the categorisation has never been the variable that decided which.",
  experiment: "Check one thing today: the date and amount of your last change to a savings transfer, against the date you installed whatever tracking tool you use. If the transfer has not moved since, the tool has not yet done anything, and you can establish that in under a minute. Then set the quarterly instruction with the increase written into it, so that the next time you open the app something is obliged to happen.",
  reflection: "When did you last change a transfer amount, and how long have you had the app?",
  recall: {
    q: "Budgeting apps are used at enormous scale. Why is that not evidence that they work?",
    a: "Because usage is not an outcome, and remarkably little credible evaluation exists at that scale. What there is tends to be short, small, run with the provider, and measured on engagement or self-report rather than on a balance a year later. The honest verdict is that nobody knows, which is a different thing from knowing the effect is zero.\n\nWhat makes the absence suspicious rather than neutral is the mechanism. An app produces measurement, and measurement only reaches a balance through a decision the app does not make for you, which puts it on the information side of the line this corpus opens with. The maintenance work it generates also feels like the work that matters while changing nothing."
  },
  deepDive: "Here is what my tracking app tells me and here is my transfer history over the same period. Tell me whether the app has ever caused a change in what I save, and if it has not, what single instruction should replace it."
},
{
  id: "rate-rich-save-more",
  track: "rate", level: "judgement",
  title: "Saving rates rise with permanent income, and the reason is fixed costs rather than virtue",
  source: "Karen Dynan, Jonathan Skinner and Stephen Zeldes, Do the Rich Save More? (Journal of Political Economy, 2004)",
  gateIntro: "A senior colleague mentions in passing, without making anything of it, that they put away about a third of what they earn. You are on eleven percent and you make perhaps sixty percent of what they make, and the immediate feeling is that they have something you do not. On the drive home it occurs to you that their mortgage is smaller than yours in dollars and not only as a share, because they bought nine years earlier. You are not sure what to do with that.",
  gatePrompt: "Write the rule that applies to your next income increase, as a share of the increase and a deadline, not as a target rate.",
  evidence: "One paper, and it is careful about a question much harder than it appears. Measuring saving rates against current income builds the answer in, because a high current income usually contains a transitory component and transitory income is mostly saved, so the rich look thrifty by construction. Dynan, Skinner and Zeldes used United States household survey data with instruments for permanent income, including education, consumption and lagged and future earnings, to strip that channel out, and a positive relationship between permanent income and the saving rate survived across several definitions of saving. It is one country, one period, survey data with the measurement error that implies, and instruments for permanent income are always arguable. Treat the direction as the result and not any magnitude.",
  replication: "single",
  idea: "Higher permanent income comes with a higher saving rate because the costs that recur do not scale with income, so the difference is available room rather than superior discipline.",
  why: "The finding is harder to establish than it sounds, which is what makes the paper worth knowing. Compare saving to current income and the wealthy appear thrifty automatically, since a good year is largely a transitory shock and transitory shocks are mostly saved. Instrumenting for permanent income removes that mechanical channel, and the positive relationship persisted, which is what turns it from an artefact into a result.\n\nThe mechanism is the ceiling argument run across people rather than across years. Food, utilities, one set of insurances, one commute and somewhere to live do not scale one for one with income. So as permanent income rises, the group of costs that recur without a decision falls as a share of it, and the ceiling rises. What reads as a difference in character is substantially a difference in the room available, and the arithmetic will produce that difference between two households with identical preferences.\n\nThe uncomfortable implication and the useful one are the same sentence. The uncomfortable half is that a rate somebody else achieves may not be available to you at your income, so comparing yourself to them measures your income more than your behaviour. The useful half is that the same mechanism is not person-specific: your own ceiling rises as your own income rises. The paper is cross-sectional and cannot establish that within-person version, so treat it as the mechanism pointing somewhere rather than as a measured result. But it is where the marginal rule earns its keep, and it is the only part of this finding you can act on.",
  failureMode: "You compare your eleven percent to a colleague's third, decide the difference is discipline, and spend a year working on discipline. Most of the gap was that their fixed costs are a smaller share of a larger income and their loan is nine years older than yours. That year could have gone into the two things that move your own number, which are the share you commit on new income and the date of your next housing or transport decision.",
  worked: "The instruction turns the population pattern into something that happens to you rather than around you:\n\n\"Every time my income rises, commit a share of the increase larger than my current savings rate, and write the new rate next to the old one on the same day.\"\n\nAnd the comparison rule, which is the other half of it:\n\n\"Before comparing my rate to anybody else's, find out their housing cost as a share of their income. If I do not know it, do not make the comparison.\"\n\nWhat is deliberately absent is any target rate borrowed from another household. The finding says rates differ with income for structural reasons, which is precisely why somebody else's rate is not a target. Your ceiling is yours, and the only comparison that carries information is against last year's version of yourself.",
  experiment: "Take the last income increase you received and work out what share of it you actually committed. Then work out what share you would have needed to commit for your overall rate to rise by one point. Most people find the second figure much smaller than expected and find that they committed less than it. Write the required share down as a rule for the next increase, while there is not one on the table.",
  reflection: "What share of your last income increase did you commit, and what would one point on your overall rate have needed?",
  recall: {
    q: "Why is it hard to establish that saving rates rise with permanent income, and what explains the relationship once it is established?",
    a: "Because measuring saving against current income builds the answer in. A high current income usually contains a transitory component, transitory income is mostly saved, so the rich appear thrifty by construction. Dynan, Skinner and Zeldes instrumented for permanent income to remove that channel and the positive relationship survived, which is what makes it a result rather than an artefact.\n\nThe explanation is structural rather than moral. Food, utilities, insurance, a commute and somewhere to live do not scale one for one with income, so as permanent income rises the costs that recur without a decision shrink as a share of it and the ceiling rises. Two households with identical preferences and different incomes will show different rates for that reason alone."
  },
  deepDive: "Here is my income, my housing cost and my rate, and here is what I know about the colleague I keep comparing myself to. Tell me how much of the gap is structural and how much is behaviour I could actually change."
},
{
  id: "rate-adequacy-contested",
  track: "rate", level: "judgement",
  title: "Whether your savings rate is too low is a question about a model, and the two main literatures answer it in opposite directions",
  source: "Scholz, Seshadri and Khitatrakun, Are Americans Saving Optimally for Retirement? (Journal of Political Economy, 2006), set against the large replacement-rate literature reporting widespread undersaving",
  gateIntro: "Two things landed in the same week. Your fund's projection says you are on track for a comfortable retirement. An article on Tuesday said most people your age are catastrophically behind, and it had a chart. Both were computed from real data by people who are not lying, and the gap between them amounts to something like eighteen years of contributions. Your review is in a fortnight and you were going to use one of the two to decide how much of the raise to commit.",
  gatePrompt: "Write the instruction that does not depend on which of the two is right, plus the two questions you will ask of the next projection anybody hands you.",
  evidence: "Two careful literatures reaching opposite conclusions from the same kind of data, where the disagreement is entirely about the model rather than the measurements. Scholz, Seshadri and Khitatrakun solved a lifecycle model with uncertain income, uncertain lifespan and uncertain medical expenses separately for each household in a large United States survey of older Americans, producing a household-specific optimal wealth target, and found the large majority holding wealth at or above their own target with most shortfalls small. Against that sits a substantial literature using replacement-rate benchmarks and simpler targets that reports widespread and severe undersaving. What separates them is what the model assumes about how far consumption falls when work stops, whether home equity counts, how much family and public provision substitutes for private saving, and what discount rate a household is entitled to. One country and one cohort, so no level transfers; what transfers is that the question has no answer independent of the model.",
  replication: "contested",
  idea: "Adequacy is a model output rather than a measurement, and the assumptions inside the model settle the answer before any data is consulted.",
  why: "Scholz, Seshadri and Khitatrakun did something unusually demanding. Rather than compare households against a rule of thumb, they solved a lifecycle model for each household separately, with its own earnings history, family structure, mortality risk and medical expense risk, generating an optimal wealth target specific to that household. Judged against those targets the great majority of their sample was saving enough, and most of the shortfalls that did exist were small. That sits directly against a large body of work using replacement-rate benchmarks which reports the opposite in strong terms.\n\nThe two are not arguing about the data. They are arguing about what retirement costs, and specifically about whether consumption falls when work stops, whether the house counts, whether family and public provision substitute for private saving, and what rate a household is entitled to discount its own future at. Move any one of those and the verdict on an identical household flips. So an adequacy figure handed to you without its assumptions is not information. It is somebody's model with the assumptions taken out.\n\nThe practical response is not to pick a side. It is to notice that the disagreement is about the target rather than about the rate. Whatever the target turns out to be, a higher rate reaches it sooner and a rate that is actually running reaches it at all, and both literatures agree on that completely. The decision available to you therefore does not require the question to be settled, which is the only good news in this entry: you can act while the field argues, as long as you act on the term nobody is disputing.\n\nWhen somebody does hand you a projection, two questions tell you what it is worth. What spending does it assume, and is the return nominal or real. A projection that will not answer either is a marketing document with a chart on it.",
  failureMode: "You take a projection at face value, conclude you are on track, and hold your rate flat for four years. The projection assumed your spending would fall by a quarter at retirement and used a return it never labelled as nominal or real. Neither assumption was exactly hidden from you. Neither was in the sentence you actually read, and four years of a rate you could have raised does not come back.",
  worked: "The instruction is a filter on projections and a floor on your own behaviour:\n\n\"Whenever I am given a retirement projection, ask two questions before believing any of it: what spending does it assume, and is the return nominal or real. If either answer is unavailable, discard the projection.\"\n\nThen the floor, which does not depend on the answer to anything:\n\n\"Regardless of what any projection says, the standing transfer never goes down, and it rises with every income increase.\"\n\nWhat is deliberately absent is a target balance. The field cannot agree on one, and adopting a stranger's number without their assumptions is how a plan ends up resting on somebody else's view of how much your spending will fall in retirement.",
  experiment: "Find the most recent projection anybody has given you, from a fund, a calculator or an adviser, and try to locate its two key assumptions: the spending it assumes in retirement, and whether its return is nominal or real. If you can find both inside five minutes, the projection is honest and worth keeping. If you cannot, that is your result, and the instruction that survives it is the transfer.",
  reflection: "Could you find the assumptions inside your last projection, and how long did it take you?",
  recall: {
    q: "Two careful literatures disagree about whether households save enough. What is the disagreement actually about, and how should you act while it stands?",
    a: "About the model rather than the data. Scholz, Seshadri and Khitatrakun solved a lifecycle model household by household, each with its own earnings history, family structure, mortality risk and medical expense risk, and found the large majority saving at or above their own optimal target. A large replacement-rate literature reports the opposite. What separates them is whether consumption falls when work stops, whether the house counts, whether family and public provision substitutes for private saving, and what discount rate a household is entitled to.\n\nSo an adequacy figure handed over without its assumptions is a model with the assumptions removed. The response is to notice that the argument is about the target and not about the rate. Whatever the target is, a higher rate reaches it sooner and a running rate reaches it at all, and both sides accept that, so act on the term nobody is disputing."
  },
  deepDive: "Here is my fund's projection and here is my actual position. Pull out what the projection assumes about my retirement spending and its return, tell me what the answer becomes under two less generous sets of assumptions, and then tell me the one thing worth doing under all three."
}

/* Track: Commitment and friction. Ordered foundational first.
 *
 * Defaults work on your inattention. This track works on the opposite case:

{
  id: "commitment-planner-and-doer",
  track: "commitment", level: "judgement",
  title: "A plan your later self will want to break needs a mechanism rather than more resolve",
  source: "Richard Thaler and Hersh Shefrin, An Economic Theory of Self-Control (Journal of Political Economy, 1981)",
  gateIntro: "It is the second week of January. The transfer you set up on New Year's Day has run once. Last night you moved eight hundred dollars back out of the savings account to cover a flight you had known about since October, and it took you under a minute on the train. The transfer runs again on Thursday. You are sitting with a coffee, aware that nothing in the arrangement objected and nothing in it will object in March either.",
  gatePrompt: "Write the instruction that would have made last night slower, not the resolution that would have made it wrong.",
  evidence: "No trial. Thaler and Shefrin propose a model rather than run an experiment: one person is treated as an organisation containing a farsighted planner and a myopic doer, and self-control is whatever the planner does to constrain the doer, either by changing the incentives it faces or by removing its options altogether. The framing is the contribution. Its weakness is that a two-selves model can be fitted to almost any behaviour after the event, which makes it very close to unfalsifiable as stated. Everything in this track that has real evidence behind it is a test of a device this paper described, not a test of the paper.",
  replication: "craft",
  idea: "Defaults work on your inattention, and commitment devices work on the opposite problem: the moments when you are paying full attention and want to defect.",
  why: "The defaults literature has a very specific shape. It works because you do not act, and it is measured on populations that reliably do not act. That is why its effect sizes are the largest in personal finance and also why it stops exactly where it stops. A default governs what happens in the absence of a decision. It has nothing at all to say about the Tuesday night when you sit down, look at the balance, decide the holiday matters more, and put the money back where it came from.\n\nThe planner and doer framing is what covers that gap. Treat yourself as two parties with different horizons. The one that sets up an arrangement in summer and the one that reverses it in winter are both you, both fully informed, and both acting on their preferences at the time. On that reading willpower is not the mechanism and neither is information. The mechanism is that the party with the longer horizon gets to shrink the option set of the party with the shorter one, in advance, while it still holds the pen.\n\nThat turns a psychological problem into an engineering one, which is the only reason it is useful. You are not trying to want it more in six months. You are trying to arrange today that the version of you in six months has fewer buttons available, or that the buttons cost something to press. That is a different design brief from the one a default answers, and almost every entry that follows is an attempt at it.\n\nThe honest cost of the framing is that it explains too much. Any lapse can be relabelled as the doer winning, and a story that fits every outcome has told you nothing about which device to build. So it earns its place only as a generator of testable arrangements, and the value of this track sits in the ones that got tested.",
  failureMode: "You save diligently for eleven months and take the lot back out in the twelfth to cover something you had known about since the start, and the balance ends the year roughly where it began. Nothing malfunctioned. The transfer ran twenty-four times, every one of them succeeded, and at no point in those eleven months did the money become any harder to reach than it was on day one.",
  worked: "The instruction is not about the amount. It is about who can reverse it, and how fast:\n\n\"Open the savings account at an institution I hold nothing else with, and set the transfer to run from my everyday account into it the day after each pay deposit.\"\n\nWhat is deliberately absent is every statement of intent. No target, no rule about what the money is for, no promise not to withdraw. All of those are instructions addressed to a party that will not be in the room in six months. The only clause that survives contact with that party is the one that makes a reversal take a day and a fresh login rather than a thumb on a train.",
  experiment: "Open your savings account history and find every withdrawal you made from it in the last twelve months. Beside each one write how long the withdrawal took you to execute, in minutes. If every answer is under two minutes, you do not have a commitment arrangement, you have a second everyday account, and the cheapest available change today is to move the balance somewhere that adds a day to the exit.",
  reflection: "What did you take back out of savings in the last year, and how long did executing it take?",
  recall: {
    q: "Defaults have the largest effects in personal finance, so what is left for a commitment device to do?",
    a: "Defaults operate on the absence of a decision, and they are measured on populations that reliably make none. They arrange what happens while you are not looking. They do nothing about the moment you are looking, know precisely what you are doing, and reverse the arrangement because the nearer want has won.\n\nThe planner and doer framing treats that moment as a negotiation between two parties inside one person with different horizons, which turns the job into shrinking your later self's option set while the earlier one still holds the pen. It is a model rather than a finding, and it explains any lapse after the fact, so its worth is the devices it suggests rather than anything it establishes."
  },
  deepDive: "Here is every account I hold and how fast I can move money out of each one. Tell me which balances my later self can raid in under two minutes, and what it would take to slow that down without leaving me short in a bad month."
},
{
  id: "commitment-restricted-account",
  track: "commitment", level: "standing",
  title: "An account you cannot withdraw from raised savings substantially, and most people offered one said no",
  source: "Nava Ashraf, Dean Karlan and Wesley Yin, Tying Odysseus to the Mast: Evidence from a Commitment Savings Product in the Philippines (Quarterly Journal of Economics, 2006)",
  gateIntro: "The emergency fund has sat between two and three thousand dollars for four years. It has been to four thousand twice. Both times something entirely reasonable happened, a dentist and a car battery, and both times you moved the money in the queue while the card machine waited. The account pays a decent rate. It is also the second row on the transfer screen you look at every day.",
  gatePrompt: "Write the instruction that puts a day between you and that balance, including where it goes and what releases it.",
  evidence: "A randomised offer, not a randomised product. Existing and former clients of a rural bank in the Philippines were randomly assigned to be offered a SEED account, which blocked withdrawals until either a date or a savings amount that the client chose had been reached, and which paid no more interest than the ordinary account. Balances after twelve months were substantially higher among those offered it than among controls, and a third group that got the same visit and the same encouragement to save without the product is what separates the restriction from the attention. Two limits bound the reading. Take-up was a minority of those offered, so the headline is an intention-to-treat estimate spread across many people who declined, and the effect on people who actually held one is larger but not cleanly identified. And the setting is a rural Philippine bank serving low-income clients with few alternative places to put money, which is a long way from a salaried Australian with an offset account and a phone.",
  replication: "single",
  idea: "A savings account whose only distinguishing feature is that you cannot get at the money raises balances, which means the restriction is the active ingredient rather than the return.",
  why: "Start with what the SEED account was. Same interest as the ordinary account, less access. On every dimension a standard model prices, it was strictly worse than the product the client already had. A person whose preferences today match their preferences next year should never choose it, and the ones who did were revealing something specific: that they expected to disagree with themselves, and would rather remove the option now than argue with it later. Demand for a dominated product is the diagnosis, and the balance increase is the evidence that the product treated the condition.\n\nThe third arm is what makes it more than a story. Being visited by a bank employee and told to save more is itself a treatment, and plenty of interventions in this field turn out to be attention wearing a product's clothes. Separating the encouragement from the restriction is what licenses the claim that the lock did the work.\n\nWhat transfers to you is not the magnitude, which belongs to that bank and those clients. It is the design. A restriction chosen by the saver rather than imposed on them, a release condition that is either a date or an amount, and no return penalty for accepting it. In Australia there is no product on the shelf shaped like that, so the equivalent has to be assembled: a different institution, no card attached, and no saved payee pointing back the other way.",
  failureMode: "Four years of an emergency fund that has never held above about three thousand dollars, because every time it does, something reasonable happens and the transfer takes eleven seconds at the counter. The interest rate on that account was never the constraint. Its position on the transfer screen was.",
  worked: "The Australian version has to be built rather than bought, and the release condition is the part people leave out:\n\n\"Open a savings account at an institution where I hold nothing else, transfer $500 the day after each pay, do not add it as a payee anywhere, and do not order a card for it. The money is released on 1 December or at $12,000, whichever comes first.\"\n\nThe release condition is doing real work. An open-ended restriction is one you eventually break with no rule covering it, and the first unruled breach is what teaches you the arrangement is decorative. A named date or a named amount gives it a legitimate ending, which is exactly the choice the clients in the trial were offered.",
  experiment: "Count the taps between your everyday banking screen and a completed transfer out of savings. If it is fewer than five, spend twenty minutes today opening an account at a second institution and move across the part of the balance you are confident you will not need this month. Write the release condition into the account nickname, as a date or an amount, so it is visible every time you log in.",
  reflection: "How many taps was it, and what release condition did you write into the nickname?",
  forecast: { q: "Will the balance I move to a separate institution today still be sitting there, untouched, in ninety days?" },
  recall: {
    q: "The SEED account paid the same interest as an ordinary account and gave up access. Why is the fact that anyone chose it informative?",
    a: "Because on any model where your preferences today match your preferences next year it is a dominated product and nobody should take it. Choosing it is a statement that you expect to disagree with yourself and would rather delete the option while you still can. The take-up is itself the diagnosis.\n\nThe twelve-month balance increase is the other half, and the arm that received the same visit without the product is what rules out attention as the explanation. But take-up was a minority and the estimate is averaged over everyone offered, so the effect on actual holders is larger and less cleanly identified, and the setting is a rural Philippine bank rather than anywhere with an offset account."
  },
  deepDive: "I want to build the Australian equivalent of an account I cannot withdraw from, without an interest penalty and without locking up money I might genuinely need. Here is what I hold and what my worst month looks like. Design the restriction and tell me where it breaks."
},
{
  id: "commitment-present-bias-over-money",
  track: "commitment", level: "judgement",
  title: "The impatience used to justify locking money away shows up clearly for effort and much less clearly for money",
  source: "David Laibson, Golden Eggs and Hyperbolic Discounting (Quarterly Journal of Economics, 1997), against Augenblick, Niederle and Sprenger, Working over Time: Dynamic Inconsistency in Real Effort Tasks (Quarterly Journal of Economics, 2015)",
  gateIntro: "You have a spreadsheet open comparing a five-year term deposit against your current savings rate, and the difference over the whole term comes to about four hundred dollars. It is Sunday afternoon. In another tab, unfinished since February, is the super rollover form from when you changed jobs. The spreadsheet is considerably more interesting than the form, and you have three hours.",
  gatePrompt: "Write the instruction that closes the gap between deciding something and it running, with a named day in it.",
  evidence: "Laibson's contribution is a model, not a trial: discounting that falls steeply between now and soon and gently between later and later still, which produces preferences that reverse as the near date arrives and makes an asset you cannot easily reach genuinely valuable. The empirical question is whether people show that pattern over money, and the cleanest test splits the answer. Augenblick, Niederle and Sprenger had the same participants allocate both unpleasant tasks and money across dates within one design, and found substantial present bias in the allocation of effort and very little in the allocation of money. One reading is that money is fungible with the rest of a person's budget, so an experimental monetary allocation can be undone outside the experiment and the design cannot see the bias. Another is that the bias is about doing things rather than about consumption timing. Either way the empirical claim under savings commitment is weaker than the model it is used to support, and this is one careful study rather than a settled literature.",
  replication: "contested",
  idea: "Your intertemporal problem is less about preferring money now and more about preferring to do nothing now, so put the commitment on the actions rather than on a general resolve to be patient.",
