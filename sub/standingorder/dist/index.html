  experiment: "Add up every commitment you could not exit inside three months: the mortgage or rent, fees, contracts, anything with a break cost. Write the annual figure, divide by twelve, and write how many months your liquidity would cover that figure alone. Then write the name of the commitment you would remove first and one sentence on what removing it needs. Most people have never named it, and the naming is most of the value here.",
  reflection: "Which commitment did you name as the first to go, and what would removing it actually take?",
  recall: {
    q: "Why can some of the largest household risks not be insured, and what takes the place of insurance when they cannot?",
    a: "Because insurance pools draws that are close to independent, and these risks fail the conditions pooling needs. An industry or a region contracting arrives for everyone who would have bought the cover at once, so there is nobody left to pay. A relationship ending is neither definable in advance nor independent of the insured's own conduct. A dependent needing lifelong support is a certainty rather than a risk for the households it affects, so the premium is the loss.\n\nWhat replaces transfer is structure: liquidity, which buys time rather than covering the loss; redundancy in income; flexibility about where you live and what you will do; and low fixed commitments, which lower the level you have to keep clearing. All four are paid for in current consumption, and none can be quoted as a premium, which is why they lose every argument to a product. The one you set deliberately and can revisit is the commitments."
  },
  deepDive: "Here are my fixed commitments and my liquidity. Tell me which of my biggest risks cannot be insured at all, and rank my commitments by how hard each one would be to exit."
}

<script>
/* Track: Where the money sits. Ordered foundational first.
 *
 * Account architecture is an install: you design it once and afterwards it
 * routes money without a decision. The claim is that most people's structure
 * was never designed at all, it accreted, and the accretion has a running
 * cost.
 *
 * Heavily craft, because almost nobody has run a trial on how many accounts a
 * household should have. Where there is real evidence it is about how people
 * choose inside a menu, and it is unflattering. */
(window.LESSONS = window.LESSONS || []).push(
{
  id: "structure-menu-drives-allocation",
  track: "structure", level: "standing",
  title: "People spread money evenly across whatever options they are shown, so the menu decides the portfolio",
  source: "Shlomo Benartzi and Richard Thaler, Naive Diversification Strategies in Defined Contribution Saving Plans (American Economic Review, 2001)",
  gateIntro: "The platform offers you eleven funds. You pick four that sound sensibly different from each other and put a quarter in each, which feels balanced and considered, and takes about six minutes. You have not looked at what any of the four holds, and you would have picked three at a quarter each and a bit over if there had been seven options instead of eleven.",
  gatePrompt: "Write the instruction that decides your allocation before you look at any menu. One line, and it should not name a product.",
  evidence: "Experimental and plan-level evidence that contributors allocate roughly evenly across the options presented rather than according to the characteristics of the options. The consequence is that the equity share of a portfolio can be shifted substantially by changing the mix of funds on the menu while holding the participant's preferences fixed: offer more equity funds and the average equity allocation rises, offer more bond funds and it falls. The experimental work uses stylised menus and modest stakes, and the plan-level evidence is observational, so the effect is well identified in the laboratory and its magnitude in a given real plan is not.",
  replication: "replicated",
  cheat: "Decide your stock and bond split before opening any product menu: people divide roughly evenly across whatever options they are shown.",
  idea: "An even split across the choices in front of you is not an allocation decision, it is a response to the number of boxes, so decide the split before you see the menu.",
  why: "The finding is uncomfortable because the behaviour feels like judgement. Dividing evenly across several plausibly different things is a reasonable heuristic in the absence of information, and it has the shape of prudence. What it is not is a statement about how much risk you want, because the number it produces is determined by how many funds somebody decided to list.\n\nThat hands control of your portfolio to whoever composed the menu. They did not do it maliciously, and in many cases they were required to offer breadth. But the menu is an input to your allocation with roughly the weight of your own preferences, and you did not choose it.\n\nThe fix is sequencing rather than sophistication. Decide the one number that actually reflects your situation, which is the share you want in growth assets, before you open anything that shows you products. Then the menu becomes an implementation problem, which is what it should have been, and the number of boxes is irrelevant.",
  failureMode: "Four funds at twenty-five percent each, two of which hold substantially the same large companies, adding up to an equity share you never chose and could not have stated. You review it in three years, find it roughly balanced-looking, and leave it, because nothing about the arrangement announces that its central number was set by a dropdown.",
  worked: "The instruction names a number and refuses to name a product:\n\n\"My allocation is eighty percent growth assets and twenty percent defensive, chosen for a horizon of about twenty-five years, and I decide this before I open any platform.\"\n\nAnd the implementation clause, which is where the menu is allowed back in:\n\n\"I then use the smallest number of funds that achieves that split, preferring one broad fund over four narrow ones that overlap.\"\n\nSmallest number is doing real work here. Every additional holding is another thing to rebalance, another fee line, and another opportunity for the even-split instinct to reassert itself at the next review.",
  experiment: "Write down your intended growth and defensive split now, before looking at any account. Then open your actual holdings and compute what the split really is. Also check how many of your holdings contain the same underlying companies, which for most people is more than they expect. The gap between the intended number and the real one is the menu's contribution to your portfolio.",
  reflection: "What was your intended split, and what did it turn out to actually be?",
  forecast: { q: "Will my allocation twelve months from now still match the split I just wrote down, rather than having drifted with a menu?" },
  recall: {
    q: "Why is dividing your contribution evenly across the funds on offer not an allocation decision?",
    a: "Because the number it produces is determined by the composition of the menu rather than by your preferences. Add equity funds to the list and the average equity share rises; add bond funds and it falls, with the participant's own views unchanged. Even division feels like prudent judgement and is actually a response to how many boxes somebody chose to list.\n\nSo whoever composed the menu has roughly as much influence on your portfolio as you do. The remedy is sequencing rather than sophistication: fix the growth-versus-defensive share first, from your own horizon, and only then treat the menu as an implementation problem where the number of options is irrelevant."
  },
  deepDive: "Here are my current holdings. Compute my real growth and defensive split, tell me where they overlap, and give me the smallest set that hits the split I want."
},
{
  id: "structure-liquidity-tiers",
  track: "structure", level: "standing",
  title: "Money needs a small number of homes distinguished by how fast you can reach it, and a rule for what routes where",
  source: "Practice in cash management: segregate balances by the horizon over which they may be needed, and define the transfer rules between them",
  gateIntro: "Everything sits in two places: the account your salary lands in and one savings account. When you need money you take it from wherever there is some. Last year the deposit you were building and the buffer for a bad month were the same balance, which meant that for a stretch in October you could not have told anyone how much of it was spoken for.",
  gatePrompt: "Write the tiers you would use and the one rule that decides what goes where. No more than four tiers.",
  evidence: "No trial. This is standard cash management practice applied at household scale: balances are separated by the horizon over which they may be called on, and the transfer rules between them are defined in advance rather than decided at the moment of need. The behavioural half of why it works is documented elsewhere in this corpus, in the earmarking and mental accounting evidence covered by the commitment track, which finds that labelled and partitioned money is spent differently from an equivalent undifferentiated balance.",
  replication: "craft",
  idea: "Separate balances by how quickly you might need them, and define the routing rules in advance, so that no balance is simultaneously your buffer and your deposit.",
  why: "A single pooled balance has a specific defect: it cannot tell you what is already committed. You can look at it and know the number, and you cannot know how much of it is the emergency buffer, how much is the holiday, and how much is genuinely spare. So every withdrawal decision requires reconstructing that from memory, at the moment you want the money, which is the worst possible time to be doing arithmetic about your own commitments.\n\nSeparating by horizon rather than by goal is the version that survives. Goal-based buckets multiply without limit and eventually nobody follows the rules. Horizon gives you a small closed set: money for this fortnight, money for a bad month, money for something in the next couple of years, and money you are not touching for a decade. Four is enough for almost everyone and the boundaries are decidable.\n\nThe routing rule then does the work that would otherwise require a decision. If new money has a default destination and moves outward on a schedule, the tiers maintain themselves, and you are only involved when something unusual happens.",
  failureMode: "One balance serving three purposes, drawn down in a tight month for the ordinary reason that it was there, and a deposit timeline that quietly moves back nine months without any moment at which you decided to delay it. The money was not wasted. It was reallocated by whoever needed cash on a Tuesday, and that was you, without a record.",
  worked: "Four tiers and one rule:\n\n\"Everyday account holds one pay cycle. Buffer holds my fixed costs for the number of months my notice period plus a job search would take. Medium account holds anything with a date inside three years. Long is the invested and superannuation balance and I do not touch it.\"\n\nAnd the routing rule, which is the part that removes the decisions:\n\n\"New money lands in everyday, an automatic transfer moves the standing amount to buffer or medium the day after pay, and nothing moves inward from long, ever.\"\n\nThe never-inward clause is worth stating explicitly. Without it the long tier is simply the largest balance available in a crisis, and its entire value depends on being unavailable.",
  experiment: "Write your four tiers and put a number on the buffer derived from your own fixed costs and your own notice period, not from a rule of thumb. Then look at where your money actually sits and identify any single balance currently serving two purposes. Splitting that one balance is the whole install, and it is usually one new account and one transfer.",
  reflection: "Which of your balances was doing two jobs, and what is your buffer number derived from?",
  forecast: { q: "Six months from now, will every balance I hold have exactly one stated purpose?" },
  recall: {
    q: "Why separate balances by horizon rather than by goal?",
    a: "Because horizon gives a small closed set with decidable boundaries: this fortnight, a bad month, something dated inside a few years, and money untouched for a decade. Goal-based buckets multiply without limit, and a structure with too many buckets stops being followed.\n\nThe underlying problem being solved is that a single pooled balance cannot tell you what is already committed, so every withdrawal requires reconstructing your own commitments from memory at the moment you want the money. Separated tiers plus a default routing rule means the structure maintains itself and you are only involved when something unusual happens."
  },
  deepDive: "Here is where my money currently sits. Design the smallest set of tiers that gives every balance one purpose, and write the routing rules."
},
{
  id: "structure-home-bias",
  track: "structure", level: "annual",
  title: "Investors everywhere hold far more of their own country than any theory recommends, including you",
  source: "Kenneth French and James Poterba, Investor Diversification and International Equity Markets (American Economic Review, 1991)",
  gateIntro: "Your portfolio is about three quarters Australian shares, which felt natural and which you have never explicitly chosen. Australia is a small share of world market capitalisation and a fairly concentrated one, heavy in banks and resources. Your salary is also Australian, your house is Australian, and you have not previously thought of those as portfolio positions.",
  gatePrompt: "Write the instruction that sets your domestic and international split deliberately. Include what you would count as already-domestic before you start.",
  evidence: "Documentation that investors in major markets hold domestic equity far in excess of their country's share of global market capitalisation, and far in excess of what mean-variance reasoning would suggest given available returns and correlations. The pattern has been found repeatedly across countries and decades since. Explanations offered include information asymmetry, currency and tax considerations and hedging of domestic consumption, and the debate over how much of the bias is rational is genuinely unsettled. What is not disputed is the magnitude of the deviation from market weights.",
  replication: "replicated",
  cheat: "Set your domestic and international split deliberately: investors everywhere hold far more of their own country than market weights or theory support.",
  idea: "Your country is a small and concentrated slice of the world's companies, and your salary and house are already bets on it, so the domestic share of your portfolio should be a decision rather than a default.",
  why: "Two things compound here. The first is the bias itself, which is robust and large and appears wherever anyone looks, so the prior that you personally are exempt is not well supported. The second is specific to a household rather than to an institution: you hold enormous undiversified domestic exposure outside the portfolio.\n\nWork through it. Your earnings depend on the local labour market. If you own property, its value depends on local rates and local employment. Both of those are large relative to your financial assets for most of a working life. A portfolio that is then also mostly domestic is not diversifying that exposure, it is doubling it, and the correlation shows up precisely in the scenario where you would need the portfolio, which is a local downturn that costs you your job.\n\nNone of that settles the right number, and the literature genuinely does not either, because tax treatment and currency exposure are real considerations that cut the other way. What it does settle is that the number should be chosen with your salary and your house counted as positions, and almost nobody does that.",
  failureMode: "A local recession that takes your industry down, reduces your house value, and cuts the portfolio you were going to draw on, all at once, because every one of the three was a bet on the same economy. Each position was individually reasonable and the three of them were the same position held three times.",
  worked: "The instruction counts what is already domestic before it sets a number:\n\n\"Treat my salary and my home equity as domestic exposure. Given that, hold the majority of my equity allocation internationally, and write the number down so it is a choice rather than a residue.\"\n\nAnd the annual check, because this drifts on its own:\n\n\"Each July, recompute the domestic share and correct it back, because a home market that has outperformed will have quietly increased it.\"\n\nThat drift clause matters. Even a correctly set split moves with relative performance, and it moves toward whichever market has done well, which is exactly the direction that feels like it should be left alone.",
  experiment: "Compute your actual domestic equity share. Then write down, roughly, your annual salary and your home equity if you have any, and look at the three numbers together. You are not obliged to change anything today; the point is to see the total domestic position rather than the portfolio slice, because the portfolio slice is the only part anyone normally looks at.",
  reflection: "What was your total domestic exposure once salary and property were counted?",
  recall: {
    q: "Why is home bias a bigger problem for a household than the portfolio numbers alone suggest?",
    a: "Because a household holds large undiversified domestic exposure outside the portfolio. Earnings depend on the local labour market and a home's value depends on local rates and employment, and both are large relative to financial assets for most of a working life.\n\nA mostly-domestic portfolio on top of that is not diversifying the exposure, it is doubling it, and the correlation appears exactly in the scenario where the portfolio is needed: a local downturn that also costs the job. The literature does not settle the right number, since tax and currency considerations cut the other way, but it does establish that the number should be set with salary and property counted as positions."
  },
  deepDive: "Here is my portfolio, my salary and my home equity. Compute my total domestic exposure and tell me what international share would actually diversify it."
},
{
  id: "structure-one-purpose-one-name",
  track: "structure", level: "standing",
  title: "An account called Savings and an account called House deposit behave differently, and the difference is not the interest rate",
  source: "The structural consequence of mental accounting and earmarking, as applied to how household accounts are labelled",
  gateIntro: "You have two savings accounts at the same bank, on the same rate, called Savings and Savings 2. One of them is notionally the emergency buffer and the other is notionally for a car, and you could not say today which is which without checking the balances and reasoning backwards from the amounts.",
  gatePrompt: "Rename them. Write the two names you would use, and say what makes a good name here.",
  evidence: "No trial on naming specifically. The relevant evidence is the earmarking and partitioning literature covered in the commitment track, which finds that money designated for a purpose is spent differently from an equivalent undifferentiated balance, in randomised settings among liquidity-constrained households. Extending that from a physically partitioned envelope to the label on a bank account is an extrapolation, not a finding, and the effect size in a salaried Australian household is unknown. The operational half is not in doubt: an account whose purpose is written on it does not require you to remember the purpose.",
  replication: "craft",
  idea: "Put the purpose and the date in the account name, so that the balance carries its own commitment and a withdrawal has to argue with something.",
  why: "There are two separate benefits and they are worth keeping apart, because one is soft and the other is not.\n\nThe soft one is the earmarking effect. Taking four thousand dollars out of House deposit, March 2029 requires overriding a stated commitment, whereas taking it out of Savings 2 does not, and the evidence that this changes behaviour is real but comes from settings quite unlike yours. Treat it as a plausible bonus rather than the reason.\n\nThe hard one is that the label removes a retrieval step. Every time you look at an unlabelled pair of accounts you have to reconstruct which is which, and that reconstruction is exactly the kind of small friction that gets skipped, after which the two balances become effectively one pool again. The name is not a motivational device, it is a note to yourself that persists, and it is the same reasoning as writing the purpose next to an instruction so that a review can be performed without memory.\n\nDates work better than amounts in the name because a date fixes what the account is for even after the target moves, and because it makes an overdue goal visible rather than merely unmet.",
  failureMode: "Two identically named accounts that were set up with distinct purposes, merged in practice within a year because nothing on the screen said what either was for, and drawn down in a tight quarter without any moment of deciding to abandon the car or the buffer. The structure was correct and unlabelled, which is the same as not having it.",
  worked: "Two names, and both carry a purpose and a horizon:\n\n\"Buffer: 4 months fixed costs\" and \"Car replacement, 2028\".\n\nAnd the naming rule, so the next account you open is not called Savings 3:\n\n\"Every account name states what it is for and when, and no account is named after what it is, only after what it is doing.\"\n\nThe distinction in that last clause is the whole thing. Savings describes the product. Buffer, four months of fixed costs describes the job, and the job is the part you need to see when you are deciding whether to raid it.",
  experiment: "Rename every account you hold right now, in the banking app, so each name states a purpose and where relevant a year. It takes about four minutes and requires no new accounts. Then note whether any account resists being named, because an account you cannot assign a single purpose to is either redundant or is quietly serving two.",
  reflection: "Which account could you not name with a single purpose, and what did that tell you?",
  forecast: { q: "Will every account I hold in six months still have a name that states its purpose and its horizon?" },
  recall: {
    q: "Separate the soft benefit of naming an account from the hard one.",
    a: "The soft benefit is earmarking: withdrawing from an account labelled with a purpose and a date means overriding a stated commitment, and designated money is spent differently from an undifferentiated balance. That evidence is real but comes from randomised settings among liquidity-constrained households, so it is an extrapolation to a salaried case and should be treated as a bonus rather than the reason.\n\nThe hard benefit is that the label removes a retrieval step. Unlabelled accounts require reconstructing which is which every time you look, that reconstruction gets skipped, and the balances collapse back into one pool. Dates beat amounts because a date survives the target moving and makes an overdue goal visible rather than merely unmet."
  },
  deepDive: "Here are my accounts and what I think each is for. Give me names that state the job and the horizon, and tell me which ones are redundant."
},
{
  id: "structure-duplicate-containers",
  track: "structure", level: "annual",
  title: "Four superannuation accounts means four sets of administration fees and possibly four insurance premiums",
  source: "The structural consequence of employer-linked default accounts accumulating across a career",
  gateIntro: "You have worked at five places. At three of them you filled in the super section quickly and let the employer use its default. You have a rough idea that there are old accounts somewhere with small balances in them, and you have thought about dealing with it perhaps four times, each time while doing something else and without the login details to hand.",
  gatePrompt: "Write the instruction that finds out how many exist and closes the extras, and say what you have to check before closing any of them.",
  evidence: "No trial. The structure is not in dispute: each superannuation account is a separate product charging its own administration fee, and many default arrangements attach insurance cover whose premium is deducted from the balance. Multiple accounts therefore duplicate both, and on a small balance the fixed component of a fee is a much larger proportion. Australia's account-stapling reform reduced the rate at which new accounts are created for people changing jobs, but it did not consolidate accounts opened before it. I state no fee or premium figure here because they vary by fund and change; find your own on your annual statement.",
  replication: "craft",
  idea: "Duplicate accounts each charge a fixed fee and may each deduct an insurance premium, so the cost of the duplication is roughly proportional to the number of accounts rather than to the money in them.",
  why: "The arithmetic of a fixed fee against a small balance is what makes this worth an afternoon. A dollar fee is a percentage that rises as the balance falls, so the accounts you care least about are the ones being charged most heavily in proportional terms. An old account with a small balance can be losing ground in real terms while the statement still reports a positive number, because the fee and any premium are working against a balance too small to outgrow them.\n\nThe insurance half is the part that catches people, and it catches them in both directions. Duplicated cover means paying several premiums for benefits you could not claim more than once, which is straightforwardly wasteful. But cover attached to an old account can also be the only cover you hold, and closing that account cancels it, which is why consolidation is not purely a tidying exercise and why the check has to come before the close.\n\nWhat makes this the highest return per minute available to most people is that it is bounded, one-off and requires no judgement about markets. You are not forecasting anything. You are removing a recurring charge for a duplicate container.",
  failureMode: "Three dormant accounts over nine years, each paying an administration fee and one of them a premium for cover that duplicates what your current fund provides. None of the balances ever alarmed you because each was small, and small is exactly the condition under which a fixed fee does the most damage.",
  worked: "The instruction is one lookup and one check before any closing:\n\n\"Log in to myGov, open the ATO section, and list every superannuation account held in my name.\"\n\n\"Before closing any of them, check what insurance cover it carries and whether I would still be covered afterwards. Only then consolidate into the one I am keeping.\"\n\nThe order is the whole instruction. Consolidating first and checking afterwards is how people discover they have cancelled income protection they could no longer obtain at the same price, which converts a good administrative decision into an expensive one.",
  experiment: "Open the ATO section of myGov today and get the count. This takes minutes and does not require any of the old funds' login details, which is the reason the task has been deferred four times. Note each account's balance and whether it lists insurance. You are not obliged to consolidate today, but the count and the insurance position are the two facts you have never had.",
  reflection: "How many accounts turned out to exist, and did any carry cover you did not know about?",
  forecast: { q: "Will I hold exactly one superannuation account ninety days from now?" },
  recall: {
    q: "Why is the cost of holding several superannuation accounts roughly proportional to the count rather than to the balances?",
    a: "Because each account is a separate product with its own administration fee, and many default arrangements deduct an insurance premium as well. Fixed charges do not scale down with the balance, so a small dormant account pays the most in proportional terms and can lose ground in real terms while still reporting a positive number.\n\nThe insurance duplication cuts both ways, which is why the sequence matters. Paying several premiums for benefits claimable once is waste, but cover on an old account may be the only cover held, and closing the account cancels it. So the check comes before the consolidation, not after."
  },
  deepDive: "Here is what the ATO portal shows for my super accounts. Tell me which to keep and what to verify about insurance before I close the others."
},
{
  id: "structure-where-cash-earns-most",
  track: "structure", level: "annual",
  title: "Cash sitting beside a debt earns the debt's rate, and that is usually the best risk-free return available to you",
  source: "The arithmetic of comparing an after-tax deposit return against a non-deductible borrowing rate",
  gateIntro: "You have a balance in a savings account paying some rate, and a home loan at a higher one. Both statements arrive in the same month and you have never put the two numbers beside each other, because they feel like different categories of thing: one is money you have and one is money you owe.",
  gatePrompt: "Write the comparison you would make, as a rule that names the two numbers rather than as an answer.",
  evidence: "No trial, because this is arithmetic rather than a finding. Interest earned on a deposit is generally assessable income, so the return you keep is the quoted rate less tax at your marginal rate. Interest avoided on a non-deductible personal debt is not income and is not taxed, so a dollar of debt not incurred is worth the full borrowing rate. The comparison is therefore between an after-tax deposit rate and a pre-tax borrowing rate, which is not the comparison the two statements invite you to make. I give no rates or thresholds here; the sibling site Tare covers Australian tax arithmetic and you should compute your own.",
  replication: "craft",
  idea: "Compare the after-tax return on a deposit against the untaxed saving from reducing a non-deductible debt, because the two statements are quoting numbers that are not comparable as printed.",
  why: "The asymmetry is entirely in the tax treatment and it is easy to miss because nothing on either statement mentions it. Interest you receive is income and is reduced by your marginal rate. Interest you avoid is not received, so there is nothing to tax, and the whole of it accrues to you. That means a borrowing rate and a deposit rate at the same headline number are not the same return, and the gap widens as your marginal rate rises.\n\nThe consequence for structure rather than for arithmetic is where this earns its place in this track. If the best risk-free return available to you is sitting against a debt, then the question of where your buffer lives has an answer that is not a savings account, and an offset arrangement gives you that return while keeping the money reachable. That is unusual: normally a higher return costs you liquidity, and here it does not.\n\nThe qualifications are real and structural rather than mathematical. The arrangement has to keep the money genuinely available, deductibility changes the calculation entirely for an investment debt, and a redraw is not the same instrument as an offset for tax purposes. Those are the things to check, and they are checks about the product rather than about the sums.",
  failureMode: "A buffer sitting for six years in a savings account paying less, after tax, than the loan beside it was charging. Nothing was lost in the dramatic sense and no decision was ever wrong. Two numbers on two statements were simply never compared, because the accounts were at different institutions and arrived in different envelopes.",
  worked: "The rule names the two numbers rather than asserting an answer:\n\n\"Once a year I write down my deposit rate less tax at my marginal rate, and my highest non-deductible borrowing rate, side by side. Cash beyond the everyday account sits wherever that comparison says.\"\n\nAnd the structural condition that has to hold before acting on it:\n\n\"The money has to stay reachable in a bad week. If moving it to the better rate makes it unavailable, the comparison does not apply and it stays where it is.\"\n\nThat condition is not a hedge, it is the point. The reason an offset arrangement is interesting is precisely that it does not cost liquidity. If a structure does cost liquidity, it is being compared against a different thing entirely.",
  experiment: "Write down two numbers today: the interest rate on your largest cash balance, reduced by your marginal tax rate, and the interest rate on your most expensive non-deductible debt. If you hold no debt, this entry costs you two minutes and the answer is that your buffer is already in the right place. If you do, you have just computed a comparison that most people never make.",
  reflection: "What were your two numbers, and which way did the comparison come out?",
  recall: {
    q: "Why are a deposit rate and a borrowing rate at the same headline number not the same return to you?",
    a: "Because of tax asymmetry. Interest received on a deposit is generally assessable income, so what you keep is the quoted rate less your marginal rate. Interest avoided by not carrying a debt is never received, so there is nothing to tax and the full rate accrues to you. The gap widens as the marginal rate rises, and neither statement mentions it.\n\nStructurally the interesting consequence is that the best risk-free return available may sit against a debt while remaining reachable through an offset arrangement, which is unusual because a higher return normally costs liquidity. The checks that matter are about the product - genuine availability, and whether the debt is deductible - rather than about the arithmetic."
  },
  deepDive: "Here are my cash balances, my marginal rate and my debts. Compute where my buffer should sit and tell me what to verify about the product before moving it."
},
{
  id: "structure-count-exposures-not-funds",
  track: "structure", level: "standing",
  title: "Six funds can be three exposures, and the number that matters is the one you cannot see on the statement",
  source: "The distinction between the number of holdings and the number of independent exposures, as a consequence of naive diversification",
  gateIntro: "The statement lists six holdings and the platform shows a tidy pie chart with six slices. Two of them are broad domestic funds from different managers, one is a domestic fund with a sustainability screen, and one is a technology fund. You have never opened any of their holdings lists, and the pie chart has been reassuring you for three years.",
  gatePrompt: "Write the check you would run on any portfolio before believing it is diversified. One line, and it should not involve the word count.",
  evidence: "No trial. This is the structural consequence of the naive-diversification evidence covered earlier in this track: if people allocate across the options presented, and several options hold substantially the same underlying assets, then the resulting portfolio has fewer independent exposures than holdings. The mechanism by which two differently-named broad funds tracking similar indices end up holding the same large companies is a matter of index construction rather than a finding, and the size of the overlap in any given pair is checkable from the funds' own holdings disclosures.",
  replication: "craft",
  idea: "Diversification is a property of how your holdings move together, not of how many of them there are, and a statement can only ever show you the count.",
  why: "A pie chart with six slices is a picture of how your money is administered rather than of what it is exposed to. Two broad domestic funds from different managers can hold nearly the same companies in nearly the same weights, in which case the second one adds a management fee, a rebalancing obligation and a line on your statement, and adds nothing whatsoever to diversification.\n\nWorse, the additions people make when they feel underdiversified tend to increase concentration. A technology fund added to a portfolio already dominated by large index constituents increases exposure to the largest companies in that index, because those companies are technology companies. The instinct is to add something that sounds different, and sounding different is not the same as moving differently.\n\nThe check that answers this is unglamorous and available. Every fund publishes its largest holdings. Reading four of those lists takes twenty minutes and tells you something the pie chart structurally cannot, which is whether your six slices are six things.",
  failureMode: "Six holdings, three overlapping heavily, and a top-ten list in which one company appears through four separate funds at a combined weight you would never have chosen deliberately. You discover it when that company has a bad year and the portfolio moves more than a diversified one should have, which is the expensive way to learn what you were holding.",
  worked: "The check is about overlap rather than count:\n\n\"Before adding any holding, I read the top ten of what I already own and the top ten of what I am adding, and I only add it if the lists barely intersect.\"\n\nAnd the simplifying default, which is what most people should actually do:\n\n\"Prefer one fund with thousands of holdings over several funds with hundreds, because the overlap problem does not arise and there is one fee and one line to maintain.\"\n\nThat default is doing more work than the check. The check catches a mistake; the default prevents the whole class of mistake, and it also removes the annual temptation to add a seventh thing that sounds different.",
  experiment: "Open the top-ten holdings list for each fund you own. Write out the combined list and add up any company that appears more than once. Twenty minutes, and most people find one or two names at a weight substantially above what they would have set on purpose. That combined weight is your real concentration, and it is not on any statement you receive.",
  reflection: "Which company turned out to have the largest combined weight across your holdings, and was it higher than you expected?",
  forecast: { q: "Will I add any new holding in the next twelve months without first checking its overlap against what I already own?" },
  recall: {
    q: "Why can a portfolio statement not tell you whether you are diversified?",
    a: "Because a statement reports how your money is administered, not what it is exposed to. Two broad funds from different managers can hold nearly the same companies at nearly the same weights, so the second contributes a fee, a rebalancing obligation and a line on the statement while adding nothing to diversification.\n\nThe instinct to fix this makes it worse: adding something that sounds different, like a technology fund, often increases exposure to the largest constituents already held, because those are the same companies. What answers the question is reading the funds' own top-ten holdings and checking overlap, and the better default is one fund with thousands of holdings rather than several with hundreds."
  },
  deepDive: "Here are the funds I hold. Work out my real concentration by combining their top holdings and tell me which additions were redundant."

{
  id: "structure-allocation-that-moves-itself",
  track: "structure", level: "standing",
  title: "A container that changes its own allocation over time removes a decision you would otherwise never make",
  source: "The design of lifecycle and target-date funds, considered as a structural mechanism rather than as a product recommendation",
  gateIntro: "You set your allocation eleven years ago when you were twenty-nine and had no dependants and a long horizon. It is still exactly what you set. You are now forty, there is a mortgage and a child, and the allocation is not wrong exactly, but nobody has looked at it against your current situation and nobody was ever going to.",
  gatePrompt: "Write the instruction that makes your allocation change without requiring you to decide. If your holdings cannot do that, write what would trigger a review instead.",
  evidence: "No trial that this improves outcomes for an individual. What is established is the behavioural premise it rests on, documented earlier in this track and in the defaults material: people overwhelmingly remain at whatever allocation they first set, so an allocation that never changes itself will in practice never change. A lifecycle fund shifts its own mix toward defensive assets as a target date approaches, which converts a decision nobody makes into a property of the container. Whether the specific glide path any given fund uses suits you is a separate question the design cannot answer.",
  replication: "craft",
  idea: "Since you will not revisit an allocation, prefer a structure that revises itself, and accept a generic glide path over a bespoke one you will never adjust.",
  why: "The argument here is comparative rather than absolute, and it depends on being honest about the alternative. A hand-set allocation tailored to your exact circumstances is better than a generic glide path, on the day you set it. The relevant question is what it is on average over the following twenty years, and the answer is that it is a tailored allocation for someone who no longer exists.\n\nThe defaults evidence is unambiguous that revisiting does not happen. So the real comparison is between a glide path that is approximately right and moves, and a bespoke allocation that was precisely right once and then stops tracking your life. Over a couple of decades the second is usually worse, and it is worse in a specific direction, because horizons shorten monotonically and nothing else about the drift is systematic.\n\nWhat this does not license is treating the glide path as correct for you. The date-based design assumes your horizon is your retirement date and that your risk capacity follows a standard shape, and either assumption can be wrong. The honest position is that automatic revision beats no revision, and that checking whether the path suits you is one of the few things worth an annual look.",
  failureMode: "An allocation chosen at twenty-nine, still running at fifty-two, four years from the point where a serious fall would matter enormously and with no mechanism that would have adjusted it. Nothing in the arrangement was ever wrong on the day it was set, and no day since has been the day anyone reviewed it.",
  worked: "The instruction prefers the self-revising container:\n\n\"Hold the long-horizon money in a fund whose allocation shifts with its target date, rather than in a fixed mix I would have to rebalance by decision.\"\n\nAnd the fallback, for holdings that cannot do that:\n\n\"If my allocation cannot revise itself, then each July I check it against my current horizon and dependants, and this is the one item on the annual list allowed to be a decision.\"\n\nThat exception is deliberate and it contradicts the general rule in the install track that decisions come off the checklist. It earns the exception because it is the only decision in the whole arrangement that becomes wrong through the passage of time alone, with no event to prompt it.",
  experiment: "Find out whether the vehicle holding your long-horizon money adjusts its own allocation, and if it does, find the glide path and look at what it will hold in ten years. If it does not adjust, write down your current horizon and your current dependants next to the allocation you set, and note the year you set it. For many people that gap is the entry.",
  reflection: "When did you set your allocation, and what has changed about your situation since?",
  forecast: { q: "Twelve months from now, will my allocation have been either automatically revised or deliberately reviewed against my current horizon?" },
  recall: {
    q: "Why can a generic glide path beat an allocation tailored precisely to your circumstances?",
    a: "Because the comparison is not on the day it is set, it is over the following decades. A bespoke allocation is better on day one and then stops tracking your life, and the defaults evidence is unambiguous that people do not revisit what they first chose, so it will not be updated.\n\nSo the real choice is between an approximately right allocation that moves and a precisely right one that freezes, and horizons shorten monotonically while nothing else about the drift is systematic. This does not make the glide path correct for you: it assumes your horizon is a retirement date and that risk capacity follows a standard shape, either of which can be wrong, which is why the path itself is worth an annual look."
  },
  deepDive: "Here is my long-horizon holding and my situation. Tell me whether its allocation revises itself and whether the path it follows suits my actual horizon."
},
{
  id: "structure-whose-money-is-visible",
  track: "structure", level: "judgement",
  title: "Whether accounts are joint or separate decides what each of you can see, and visibility is what makes agreements hold",
  source: "The structural question of account visibility in a household, distinguished from the relationship research on account structure",
  gateIntro: "You and your partner run three accounts: one joint for bills, and one each. The arrangement was never designed, it is just what you both had when you moved in together. Neither of you can see the other's balance, both of you contribute to the joint account by transfer, and neither of you could say what the household saved last year without asking the other to go and look.",
  gatePrompt: "Write what each of you needs to be able to see for a shared plan to work. Do not prescribe joint or separate.",
  evidence: "No trial on savings outcomes. There is randomised work assigning couples to joint versus separate account structures, but the outcome measured in that literature is relationship quality rather than wealth accumulation, and I am not confident enough of the specific citations to present them as established here. On the financial side the evidence is thin to absent: I am not aware of a trial showing that either structure produces a higher household savings rate. What follows is therefore an argument about information rather than a finding about outcomes.",
  replication: "craft",
  idea: "The structural question is not who owns which account but whether either of you can see the household's actual position, because an agreement neither party can verify is not an arrangement.",
  why: "Take the argument from the install track that a shared instruction only survives if both people know why it exists. That requires each of them to be able to see the effect, and a structure where neither can see the other's balance makes the household position something that has to be assembled by conversation. Assembly by conversation happens roughly never, and when it does happen it is usually because something has gone wrong.\n\nSo the failure is not that separate accounts are wrong. It is that a structure with no shared view has no way to answer the question a shared plan depends on: what did we save, and are we on track. Both people can be behaving well and neither can confirm it.\n\nThis is also why the joint-versus-separate framing is the wrong axis. A fully joint arrangement gives complete visibility and can leave neither person with autonomy over discretionary spending, which is its own failure mode and one people resent. A structure with individual accounts plus a shared view of the aggregate solves both, and it is a reporting question rather than an ownership question.",
  failureMode: "Four years in which both of you believed the other was saving more than they were, discovered during a conversation about a deposit that neither of you initiated deliberately. Nobody was concealing anything. The structure simply had no place where the answer existed, and each of you had been filling that gap with an assumption.",
  worked: "The instruction is about visibility, not ownership:\n\n\"Each of us keeps an individual account. We add a shared read-only view of the total across everything, updated once a month, and we both look at the same number.\"\n\nAnd the minimum viable version, for people who will not maintain a spreadsheet:\n\n\"On the first Sunday of each month, one of us writes two numbers in a shared note: total across all accounts, and change since last month. That is the whole report.\"\n\nTwo numbers is deliberately less than anyone would design. A monthly report with eight lines is one that lapses in April, and the question a shared plan actually needs answered is whether the total is going up.",
  experiment: "Write down, from memory, what you think your household total is and what it was a year ago. Then have your partner do the same independently. Compare the four numbers before looking anything up. The spread between your two guesses is the measurement, and for most couples with separate accounts it is large enough to settle the argument for a shared view.",
  reflection: "How far apart were your two guesses about the household total?",
  recall: {
    q: "Why is joint versus separate the wrong axis for this decision?",
    a: "Because the property a shared plan depends on is visibility, not ownership. A structure where neither person can see the other's balance means the household position has to be assembled by conversation, which happens almost never and usually only after something has gone wrong, so both people can be behaving well and neither can confirm it.\n\nFully joint gives complete visibility and can remove discretionary autonomy, which is its own resented failure mode. Individual accounts plus a shared view of the aggregate solves both at once, which makes this a reporting problem rather than an ownership one. There is no trial showing either structure produces a higher savings rate."
  },
  deepDive: "Here is how our accounts are arranged. Design the smallest monthly report that would let both of us see the household position without changing who owns what."
},
{
  id: "structure-too-many-containers",
  track: "structure", level: "judgement",
  title: "Past about four accounts the routing rules stop being followed, and an unfollowed rule is worse than no rule",
  source: "The practical ceiling on any manually-maintained categorisation scheme",
  gateIntro: "You built the structure properly: seven accounts, each named for a purpose, each with a rule about what goes in and when. That was in February. It is now September and you have been putting everything into two of them and meaning to sort it out, and the five well-named accounts contain the amounts they contained in April.",
  gatePrompt: "Collapse it. Write the smaller structure and say what you are giving up by collapsing.",
  evidence: "No trial. This is the ordinary observation that a categorisation scheme requiring manual sorting degrades as the number of categories rises, and that a scheme people stop following is worse than a coarser one they maintain, because it produces a structure whose labels no longer describe its contents. The mechanism connects to the earmarking evidence covered in the commitment track: a partition works because the label is a barrier, and a label that no longer matches what is in the account is not a barrier, it is stale information.",
  replication: "craft",
  idea: "Build the coarsest structure that still separates the things you must not confuse, because a finer one degrades into a coarse one with misleading labels.",
  why: "The degradation is not a failure of discipline so much as an arithmetic problem with how many decisions a structure demands. Every account past the essential ones adds a routing decision to each inflow, and the decisions arrive at the moment money lands, which is not a moment you have set aside for administration. The scheme with seven accounts asks for a judgement several times a fortnight, and the number of those judgements you will actually make is not seven-sevenths of them.\n\nWhat makes the collapse urgent rather than merely tidy is what a stale label does. An account named House deposit, 2029 holding a balance that has not moved since April is now actively misinforming you, because you will read the name and not the date of the last transaction. A coarse structure you maintain gives you true information. A fine structure you abandoned gives you false information with better names on it.\n\nThe corollary is a design rule. Add an account only when confusing two things would actually cost you something, and never to reflect a distinction that is merely conceptually tidy. Most households need to separate this fortnight's money, a buffer they must not spend, and long-horizon money they cannot reach. Everything beyond that is optional and should have to justify itself.",
  failureMode: "Seven accounts, two in use, five with names describing intentions from February and balances describing April, and a household position that now takes longer to establish than it did before the structure existed. The design was better than what preceded it and the maintained version of it is worse.",
  worked: "The collapse, and it names what is lost:\n\n\"Collapse to four: everyday, buffer, medium-term, long-term. The car, the holiday and the renovation share the medium-term account and I track their split in a note rather than in separate accounts.\"\n\nAnd the rule that stops it regrowing, because it will try to:\n\n\"A new account requires that confusing its contents with an existing account would cost me something specific. Conceptual tidiness is not a reason.\"\n\nThe note is doing the work the extra accounts were doing, and it is better at it, because a line in a note can be updated in four seconds and an account transfer cannot. The structure holds the constraints; the note holds the bookkeeping.",
  experiment: "Look at every account you hold and find the date of the last transaction you initiated in each. Any account whose last deliberate movement is more than three months old, and which is not a long-horizon account by design, is one the structure is no longer using. Collapse those and move the distinction into a note.",
  reflection: "How many of your accounts had not seen a deliberate transaction in three months?",
  forecast: { q: "Six months from now, will every account I hold have seen a deliberate transaction within the previous quarter?" },
  recall: {
    q: "Why is a fine-grained account structure that you have stopped maintaining worse than a coarse one?",
    a: "Because its labels stop describing its contents and become misinformation. An account named for a goal and a year, holding a balance that has not moved in months, will be read by its name rather than by its last transaction date, so a coarse structure you maintain gives true information while a fine one you abandoned gives false information with better names.\n\nThe degradation is arithmetic rather than a discipline failure: each additional account adds a routing decision to every inflow, arriving at the moment money lands rather than during set-aside administration time. The design rule that follows is to add an account only when confusing two things would cost something specific."
  },
  deepDive: "Here are all my accounts and when each last saw a deliberate transaction. Tell me which to collapse and how to hold the lost distinctions in a note."
},
{
  id: "structure-one-institution-one-failure",
  track: "structure", level: "standing",
  title: "Everything at one bank means one fraud freeze removes your ability to pay for anything",
  source: "Operational practice: avoid a single point of failure for a capability you cannot go without",
  gateIntro: "Consolidating everything to one bank was the right call and you are glad you did it. Four accounts, one app, one login, one set of details to remember. On a Thursday afternoon the bank freezes your access after a flagged transaction, and it will be resolved, and in the meantime you have a card that does not work and a hotel to pay for.",
  gatePrompt: "Write the minimum arrangement that survives losing access to your main institution for a week. Be specific about the amount.",
  evidence: "No trial. This is single-point-of-failure reasoning applied to household transacting: consolidation reduces cost and administrative load while concentrating the risk that any one institution-level event - a fraud freeze, an outage, a card reissue, a dispute, an account under review - removes your ability to transact entirely. Deposit protection arrangements exist in Australia for the solvency case and are a separate question from access; I state no threshold here because that is a statutory figure worth checking rather than recalling. The two failure modes are distinct and only one of them is about the bank being in trouble.",
  replication: "craft",
  idea: "Consolidation is right for cost and wrong for availability, so keep one small account at a second institution purely so that a freeze at the first is an inconvenience rather than an emergency.",
  why: "This track has spent ten entries arguing for fewer accounts, and this is the one place that argument reverses. The reason is that the accounts being collapsed elsewhere are all doing the same job at the same institution, so collapsing them loses nothing but a routing decision. A second institution is not a duplicate container. It is a different failure domain, and that is the entire product being purchased.\n\nThe events that trigger it are mundane and are not signs of anything being wrong with your bank. A flagged transaction while travelling, a card compromised and reissued, an app outage on a weekend, a dispute that puts an account under review. Each is temporary and each removes, for some number of days, the thing you need every single day.\n\nWhat makes this cheap is that the second account does not need to hold much or do anything. It needs a card that works and enough to cover a week of essentials. It is the only account in this structure whose purpose is to be unused, which is also why it is the one people close during a tidy-up.",
  failureMode: "Six days of no card access while travelling, resolved eventually and entirely the bank's normal process working as designed, paid for on a credit card at an exchange rate you did not choose because there was no alternative. The consolidation that caused it was a good decision that nobody had stress-tested against a week without access.",
  worked: "The arrangement is small and deliberately dull:\n\n\"Keep one account at a second institution with a working debit card and one month of essential spending in it. It receives a small automatic transfer so it stays active, and it does nothing else.\"\n\nAnd the clause that stops it being tidied away, which is the actual risk to it:\n\n\"This account is exempt from the rule about accounts with no recent deliberate transaction. Its purpose is to be unused.\"\n\nThat exemption has to be written down, because the previous entry in this track tells you to close exactly this account and a future reader of your own structure will follow that rule.",
  experiment: "Check whether you could pay for a week of essentials today if your main institution's app and cards stopped working. If the answer is a credit card at the same institution, that is the same failure domain. Opening a second account takes about fifteen minutes online and the transfer that keeps it alive is one instruction.",
  reflection: "Could you have covered a week without your main institution, and what would you actually have used?",
  forecast: { q: "Will I have a funded, card-active account at a second institution ninety days from now?" },
  recall: {
    q: "This track argues for fewer accounts. Why is a second institution an exception rather than a contradiction?",
    a: "Because the accounts being collapsed elsewhere all do the same job at the same institution, so merging them costs only a routing decision. A second institution is not a duplicate container, it is a separate failure domain, and that is the thing being bought.\n\nThe triggering events are mundane and imply nothing wrong with the bank: a flagged transaction while travelling, a reissued card, a weekend outage, an account under review. Each is temporary and each removes daily transacting ability. The account needs only a working card and about a month of essentials, and its exemption from the close-dormant-accounts rule has to be written down, because otherwise your own structure tells you to shut it."
  },
  deepDive: "Here is where I bank. Tell me what I could not do for a week if that institution froze my access, and the smallest arrangement that fixes it."
},
{
  id: "structure-income-never-lands-in-spending",
  track: "structure", level: "standing",
  title: "The strongest structural move is arranging that income never reaches the account you spend from",
  source: "The design difference between routing money out of a spending account and splitting it before it arrives, as implemented by payroll and by bank pay-splitting features",
  gateIntro: "Your salary arrives in one account. A transfer moves part of it out the following day, which works and has worked for months. For one day each fortnight, though, the whole amount is sitting in the account your card is attached to, and on two occasions something has been bought during that day that would not have been bought on any other day of the cycle.",
  gatePrompt: "Write the arrangement in which the money you intend to save is never visible to your card. Say who has to action it.",
  evidence: "No trial isolating the arrangement. What is established and covered elsewhere in this corpus is that automatic contributions taken before money reaches the household pass through to saving at a far higher rate than incentives aimed at people who already hold the cash, and that people overwhelmingly accept whatever the passive path delivers. Splitting at source is the household-scale version of the same mechanism. Whether it beats a next-day transfer by a measurable amount for a salaried professional has not been tested, and the argument here is structural rather than empirical.",
  replication: "craft",
  idea: "A transfer moves money you have already received, and a split at source means you never receive it, and only the second removes the window in which the money is spendable.",
  why: "Every routing arrangement in this track operates after the money has arrived, which means there is always an interval during which the full amount is in an account with a card attached. The interval is short and for most people most of the time it is harmless. It is also the only moment in the cycle when your spending capacity is at its maximum, and it recurs every pay period for your entire working life.\n\nSplitting at source removes the interval rather than shortening it. If payroll can pay a nominated amount into a second account, or your bank can split an incoming deposit on arrival, the money you intend to keep is never in a position to be spent, and no instruction has to fire correctly for that to be true. It is the difference between a rule that executes and a state of affairs that obtains.\n\nThe secondary benefit is that it survives things a transfer does not. A split configured at payroll does not fail because a balance was low, does not need re-dating when a pay cycle changes, and does not appear on the statement as an outflow you might question in a tight month. What it does need is somebody in payroll to action a form, which is the entire reason people use a transfer instead.",
  failureMode: "Two years of a correctly configured next-day transfer, and a handful of purchases made on the one day each cycle when the full pay was visible. None of them was large enough to notice individually and none of them would have happened on the eighth of the month. The arrangement worked exactly as designed and the design left a window open.",
  worked: "The arrangement names the actor, because this one is not self-service:\n\n\"Ask payroll to pay a fixed amount of each pay directly into my savings account, and the remainder into my everyday account, so the saved portion never lands where my card can reach it.\"\n\nAnd the fallback, which is what most people will actually end up with:\n\n\"If payroll will not split, check whether my bank can split an incoming deposit automatically on arrival. If neither is possible, keep the next-day transfer and accept the window.\"\n\nAccepting the window is a legitimate outcome and worth saying so. A next-day transfer captures most of the benefit, and the marginal gain from closing a one-day window is smaller than the gain from having any arrangement at all. This is an upgrade, not a prerequisite.",
  experiment: "Ask two questions this week. Ask payroll whether they can split your pay across two accounts, which many systems do as standard and nobody advertises. Ask your bank whether an incoming deposit can be automatically split or swept on arrival. Both are one email or one search. If either says yes, the upgrade takes one form and then never needs attention again.",
  reflection: "Could payroll or your bank split at source, and which did you set up?",
  forecast: { q: "Ninety days from now, will the money I intend to save be arriving without ever passing through the account my card is attached to?" },
  recall: {
    q: "A next-day transfer already moves the money. What does splitting at source add?",
    a: "It removes the window rather than shortening it. Any arrangement that routes money after arrival leaves an interval in which the full pay sits in an account with a card attached, and that interval is the point in the cycle when spending capacity is highest, recurring every pay period for a working life.\n\nA split at source means the money is never received, so no instruction has to fire correctly for the outcome to hold - it is a state of affairs rather than a rule that executes. It also cannot fail on a low balance, does not need re-dating when the pay cycle changes, and never appears as a questionable outflow in a tight month. The cost is that somebody in payroll has to action a form, which is why most people use a transfer instead, and a transfer captures most of the benefit anyway."
  },
  deepDive: "Tell me whether my employer and my bank can split my pay before it reaches my everyday account, and what to ask each of them."
},
{
  id: "structure-cheap-to-enter-costly-to-leave",
  track: "structure", level: "judgement",
  title: "Some structures are easy to get into and expensive to get out of, and that asymmetry should be priced before you enter",
  source: "The general design principle of accounting for exit cost at the point of entry, applied to account and entity structures",
  gateIntro: "Someone has explained a structure to you that would be better for your situation, and the arithmetic they have shown you is about the ongoing benefit. Setting it up costs a fee and an afternoon. You have not asked what unwinding it would cost if your circumstances changed in four years, and neither has the person explaining it, because the ongoing benefit is the part that makes it attractive.",
  gatePrompt: "Write the question you would ask before entering any new financial structure. It should be about exit, not about entry.",
  evidence: "No trial. This is ordinary reversibility reasoning: a decision whose cost of reversal is high deserves more scrutiny than one you can undo, and the scrutiny should be proportional to the exit cost rather than to the entry cost. In practice exit costs for household structures come in several forms - realising a taxable position in order to move, fees, minimum terms, loss of a grandfathered arrangement, or simply administrative complexity that makes the unwinding never happen. The Australian tax consequences of unwinding a structure are covered by the sibling site Tare and are deliberately not computed here.",
  replication: "craft",
  idea: "Judge a structure by what it costs to leave rather than by what it costs to join, because the entry cost is quoted to you and the exit cost is not.",
  why: "There is a systematic reason exit costs go unmentioned, and it is not usually dishonesty. The person explaining a structure is reasoning about whether it suits your situation, and your situation is the input they have. The exit cost only becomes relevant in a future where that input has changed, which is a scenario outside the frame of the conversation.\n\nMeanwhile the two costs behave very differently. Entry costs are visible, quoted, one-off and usually small. Exit costs are contingent, unquoted, and can include the realisation of a position you would otherwise never have had to crystallise. That is an asymmetry in what you can know at the moment of deciding, and the correct response to asymmetric information about cost is asymmetric caution.\n\nThe practical upshot is a two-tier approach. For reversible structures, the entry decision can be made quickly and revised, and this whole site argues for installing rather than deliberating. For structures that are expensive to unwind, the opposite applies: those are the small number of financial decisions that genuinely deserve weeks, and confusing the two categories is how people spend a month choosing a savings account and an afternoon choosing something they will carry for twenty years.",
  failureMode: "A structure entered for a good reason at thirty-four, no longer suited at forty-one, and carried anyway for another decade because unwinding it would crystallise something and require an accountant. Every individual year the answer to should I unwind this is not this year, and the aggregate of those answers is a structure you did not choose still running at fifty.",
  worked: "The question is about exit and it has to be asked before entry:\n\n\"If my circumstances changed in four years and this no longer suited me, what would it cost me to unwind, in fees, in tax, and in time?\"\n\nAnd the rule that follows from whatever answer you get:\n\n\"Structures I can exit cheaply I set up straight away. Structures that are expensive to exit get weeks, a second opinion, and a written note of why I entered them.\"\n\nThat written note matters more than it seems. In four years the question will be whether to unwind, and the only way to answer it is to know what the structure was for, which is exactly the information that will have evaporated.",
  experiment: "Take any structure you currently hold that is not a plain bank account or a broad fund, and find out what unwinding it would cost. If you cannot find out in twenty minutes, that difficulty is itself the answer and worth writing down. Then write, retrospectively, why you entered it, because that note does not currently exist and will be needed.",
  reflection: "What would it cost to unwind your least reversible arrangement, and could you still say why you entered it?",
  recall: {
    q: "Why should the scrutiny you apply to a financial structure scale with its exit cost rather than its entry cost?",
    a: "Because of an asymmetry in what you can know when deciding. Entry costs are quoted, one-off, visible and usually small. Exit costs are contingent, unquoted, and may include crystallising a position you would otherwise never have had to realise, plus administrative complexity that makes the unwinding simply never happen.\n\nThe person explaining a structure is reasoning about your current situation, so a future in which that has changed sits outside the frame of the conversation and the exit cost goes unmentioned without anyone being dishonest. The upshot is two tiers: install reversible things quickly, and give the small number of expensive-to-unwind decisions weeks and a written record of why."
  },
  deepDive: "Here is a structure I am considering. Work out what unwinding it would cost in four years and tell me whether it belongs in the fast or the slow category."
},
{
  id: "structure-architecture-cannot-fix-the-rate",
  track: "structure", level: "judgement",
  title: "A perfect account structure around an inadequate savings rate is a well-organised way of not saving",
  source: "The boundary of this track, stated explicitly",
  gateIntro: "The structure is genuinely finished. Four tiers, named accounts, routing rules, a percentage rule for irregular money, one account at a second institution, and a note recording what each is for. You spent three weekends on it and it is the best-organised part of your financial life. The amount moving through it each fortnight is the same amount that was moving before you started.",
  gatePrompt: "Write the one number you have been avoiding, and the instruction that changes it.",
  evidence: "No trial. This is the arithmetic point that the savings rate track establishes in detail: over realistic horizons the quantity that dominates the outcome is the share of income being saved, and account architecture does not appear in that expression at all. Structure changes where money sits, how reliably it stays there, and how much of it leaks to duplicate fees. Those are real and they are second-order. What follows is a boundary statement rather than a finding.",
  replication: "craft",
  idea: "Structure determines whether saving survives contact with you, and the rate determines whether there is anything to survive, and only one of those is worth three weekends.",
  why: "Architecture is genuinely productive up to a point, and this track has spent thirteen entries on what that point contains: money that cannot be confused with other money, fees that are not duplicated, allocations that revise themselves, a buffer that is reachable in the week you need it. Each of those is worth having and several of them are worth real money.\n\nBut none of them appears in the expression that determines the outcome. Years to a target is a function of the share of income saved and the return, and structure enters only through the small corrections it makes to both. So a structure project can absorb an arbitrary amount of attention while moving the first-order term not at all, and it will feel like progress the entire time, because it produces visible artefacts and a sense of order.\n\nWhich makes this the specific way a reader of this site fails. Not by ignoring the advice, but by executing the most enjoyable parts of it thoroughly. Naming accounts is pleasant, writing routing rules is pleasant, and raising the transfer amount is not, and the pleasant tasks are unbounded while the unpleasant one is a single number in a single field.",
  failureMode: "Three weekends of structure, a genuinely excellent arrangement, and a savings rate identical to the one you had in January. You will not experience this as a failure at any point, because every session produced something and the thing it produced was real. The counter that would have caught it is the measured rate, and it is the one counter a structure project does not move.",
  worked: "The instruction is short because the difficulty was never in the wording:\n\n\"Raise the fortnightly transfer from $500 to $650, effective next pay cycle.\"\n\nAnd the rule that stops structure work substituting for it in future:\n\n\"I do not do structure work in a session where I have not first checked whether the transfer amount could go up. Architecture is the second question, every time.\"\n\nOrdering the two is the whole install. Both are worth doing and only one is worth doing first, and left unordered the pleasant one will reliably consume the session.",
  experiment: "Compute your measured savings rate from records, as the savings rate track sets out, and write it beside the date you started building your structure. If the number has not moved, the structure was not the constraint. Then raise one transfer amount today, before doing anything else to any account.",
