  evidence: "No trial, and an overclaim rather than a finding. The rebalancing bonus is real in the arithmetic under conditions that marketing material leaves unstated: the assets need broadly similar long-run returns and enough independent movement, and the gain arrives by smoothing the compound path rather than by lifting anybody's expected return. Where one asset persistently out-earns the other, a mechanical rule sells the better asset to buy the worse one and the bonus becomes a cost. Simulation studies of rebalancing frequency exist in quantity and their answers swing on the period and the asset pair chosen, which is a reliable sign that no general result is available. What can be asserted without any study is what rebalancing definitely does, which is hold your risk exposure near the level you picked. That is a genuinely valuable service, and it is not the service being advertised.",
  replication: "overclaimed",
  idea: "Correcting a drift delivers the risk you chose with certainty and extra return only under conditions you cannot verify in advance, and the sales material has those two the wrong way round.",
  why: "Start with what is certain. Left alone, a portfolio drifts toward whatever has grown, which means your exposure to the risky asset rises after it has been rewarding and falls after it has fallen. That drift is not neutral. Following a long run in equities, the untouched portfolio is more aggressive than the one you signed up for, at the point in the cycle where you have the least margin for it to go wrong. Correcting the drift is the mechanism that keeps the allocation you wrote down and the allocation you own as the same thing, and that is the whole reliable benefit.\n\nNow the uncertain part. The arithmetic that produces the bonus requires the assets to have broadly similar long-run returns and to move somewhat independently, and it operates on the variance of the compound path rather than on expected return. Break either condition, which is to say let one asset systematically out-earn the other, and the rule becomes an instruction to sell the better asset in order to buy the worse one, repeatedly, for as long as you keep running it. Since you do not know in advance which regime you are in, the bonus is a forecast dressed in the clothes of arithmetic.\n\nThe mislabelling is expensive for a specific reason. If you believe the correction produces return, you do it often, because more of a good thing is better. If you believe it produces risk control, you do it rarely and with a band, because control is only needed once the drift is large enough to matter and every correction is paid for in tax and spread. The same portfolio and the same evidence generate opposite frequencies depending on which story you hold, and the story being sold is the expensive one.",
  failureMode: "Four corrections a year for six years, each one crystallising a gain and each one justified by the bonus. The portfolio finished within a point or two of where an annual band would have left it, and the difference between the two paths is almost entirely the tax and the spread on the fifteen extra trades.",
  worked: "A band rather than a date, and it names both numbers:\n\n\"I correct only when growth assets are more than ten percentage points away from seventy, and I close the gap with contributions first, selling only if contributions cannot do it inside a year.\"\n\nThen the sentence that stops the band being renegotiated:\n\n\"The band exists to hold my risk at the level I chose. It is not a return strategy, so a year in which leaving the drift alone would have done better is not evidence against it.\"\n\nWhat is deliberately absent is a frequency. Naming a date guarantees a trade in the years when nothing has drifted far enough to matter. The second sentence is there because in a good many years the band will look as though it cost you something, which is exactly what a risk control looks like from the inside.",
  experiment: "Work out your current drift from target in percentage points, then write your band down as a number rather than carrying it as a feeling. Ten points is a defensible default, and any band you will honour beats a cleverer one you will not. Then check whether your platform can direct incoming contributions to the underweight holding automatically. Several can, and switching that on converts this entry from an annual decision into something that happens without you.",
  reflection: "What is your band, and were you inside it or outside it when you checked?",
  forecast: { q: "Will my next rebalance be triggered by my own band rather than by a market movement I read about?" },
  recall: {
    q: "Rebalancing is sold as a source of extra return. What does it reliably provide instead, and under what condition does the return story reverse?",
    a: "It reliably holds your risk exposure near the level you chose. A portfolio left alone drifts toward whatever has grown, so after a long run in the risky asset the untouched version is more aggressive than the one you designed, at the point in the cycle with the least margin for error. That is the service being bought.\n\nThe return story reverses when the assets have persistently different long-run returns. The arithmetic behind the bonus needs roughly similar returns and some independence of movement, and it works by smoothing the compound path rather than raising expected return. If one asset systematically out-earns the other, the rule sells the better one to buy the worse one for as long as it keeps running."
  },
  deepDive: "Here is my target allocation and my actual balances. Set a band I will honour, tell me whether contributions alone can close my current drift, and tell me what fixing it by selling would cost me instead."
},
{
  id: "costs-hedging-is-a-cost",
  track: "costs", level: "standing",
  title: "Currency hedging is a price paid to remove a risk rather than a strategy, and for an Australian it can remove the one that was helping",
  source: "The pricing of forward exchange rates off the interest differential, together with the observed behaviour of the Australian dollar in global risk-off episodes",
  gateIntro: "There are two versions of the same global shares fund on your platform, hedged and unhedged, and the hedged one costs slightly more. You have no view on the Australian dollar and you feel faintly embarrassed about that. The regular contribution has to point at one of them by Friday, and whichever you choose you will not look at again for a decade.",
  gatePrompt: "Write the instruction that picks one of the two for the next decade, and name the thing that would make you change it.",
  evidence: "No trial, and two claims of very different strength. The first is close to arithmetic: forward exchange rates are priced off the interest differential between the two currencies, so hedging is not free and its running cost is roughly that differential plus whatever the manager charges to operate it. It removes variance rather than adding expectation, because there is no reason a currency should pay you for holding it across decades. The second claim is empirical and much weaker. The Australian dollar has behaved as a high-beta currency, tending to fall when global markets fall, so an unhedged foreign holding has historically seen part of its drawdowns offset by the currency translating in your favour. That is a regularity across the floating-rate era rather than a law, it depends on Australia's terms of trade and rate differentials continuing to behave as they have, and it could stop. Anybody quoting you a figure for the size of that offset is quoting one period.",
  replication: "craft",
  idea: "Hedging changes the variance of a foreign holding without changing its expected return, which makes it a purchase rather than a strategy, and the cover it sells may not be the cover you need.",
  why: "Hedging cannot add return, and the reason is structural rather than empirical. Forward rates are set by the interest differential, so locking one in is not a way to make money systematically, and over decades a currency is not an asset that pays you to hold it. What the hedge buys is the removal of the currency's contribution to variance. What it costs is the differential plus the fee for running the programme. So it is priced like insurance, and the right question is whether you want the cover, not whether the mechanism works.\n\nFor an Australian holding global equities the answer is genuinely not obvious, because the currency exposure has not historically behaved like added noise. It has behaved like a partial hedge. The dollar has tended to fall when global markets fall, which translates the foreign holding upward in your own currency at the moment you least want a large drawdown, so the unhedged version has had shallower falls in local terms than the underlying market did. Paying to remove that leaves you with a purer equity exposure and a worse worst case. Note the tense throughout: this is a regularity, not a mechanism guaranteed to persist.\n\nThe useful distinction is about which asset the hedge is wrapped around. On long-horizon foreign equity it is a preference and a reasonable person can go either way. On a foreign defensive holding it is closer to a requirement, because currency variance can be several times the variance of the asset itself, and an unhedged bond holding is mostly a currency position wearing a bond's name. And on money you intend to spend in Australian dollars within a few years, the question does not arise, because that money should not be offshore.",
  failureMode: "A decade in the hedged version of a global fund because the word hedged sounded like the prudent choice, paying the differential and the extra management charge every year, and ending with a portfolio whose worst case in your own currency is worse than the cheaper option would have given you. None of this shows up as an error in any single year, which is exactly why nobody goes back to it.",
  worked: "Two lines, and the second is the one that keeps it settled:\n\n\"Foreign equity goes in the unhedged version. Anything defensive that is denominated in a foreign currency goes in the hedged version. Money I intend to spend in Australian dollars within three years does not go offshore at all.\"\n\n\"This is a structural choice and not a currency view, so a year in which the dollar moves against me is not a reason to switch.\"\n\nWhat is deliberately absent is any forecast for the exchange rate, and the instruction is built so that it never requires one. The second line exists because the first will look wrong for entire years at a time, and switching after a bad run is how a settled decision becomes an expensive one.",
  experiment: "Check which version of each foreign holding you actually own, because a surprising number of people do not know and the difference is one word in the fund's name. Then check the fee gap between the two versions on your platform. If your foreign equity is hedged and there is no reason for it written down anywhere, that is a decision you made by accident, and it is one dropdown to change on future contributions without touching what you already hold.",
  reflection: "Which version were you in, and had you chosen it deliberately?",
  recall: {
    q: "Why can hedging not raise the expected return on a foreign holding, and what does that make it?",
    a: "Because forward exchange rates are priced off the interest differential between the two currencies, so locking a rate in is not a systematic source of gain, and a currency is not an asset that pays you to hold it over decades. The hedge removes the currency's contribution to variance and charges you the differential plus a management fee to do it, which makes it a purchase priced like insurance. The question is whether you want the cover.\n\nFor an Australian holding global equities the answer is not obvious, because the dollar has tended to fall when global markets fall, which translates a foreign holding upward in local currency exactly when that helps. Paying to strip that out buys a purer equity exposure and a worse worst case. On a foreign defensive holding the calculation flips, because currency variance can be several times the asset's own and defeats the reason for holding it."
  },
  deepDive: "Here are my foreign holdings and which version of each I own. Tell me where hedging is earning its price in my portfolio and where I am paying for cover I did not want, and give me one sentence to record so I stop revisiting it."
},
{
  id: "costs-advice-is-barely-customised",
  track: "costs", level: "judgement",
  title: "Which adviser you happen to get explains more about your portfolio's risk than anything about you does",
  source: "Stephen Foerster, Juhani Linnainmaa, Brian Melzer and Alessandro Previtero, Retail Financial Advice: Does One Size Fit All? (Journal of Finance, 2017)",
  gateIntro: "The recommendation arrives and it is a perfectly reasonable portfolio. In the waiting room you had spent twenty minutes on a questionnaire about your horizon, your dependants and how you would feel about a thirty percent fall. Your friend, who earns half what you do, has no children and is eleven years younger, saw the same adviser and came out with a document that looks remarkably like yours.",
  gatePrompt: "Write the instruction that would tell you, in one afternoon a year, whether the portfolio you were handed is the one your own circumstances call for.",
  evidence: "Administrative records from several Canadian financial institutions covering tens of thousands of clients and thousands of advisers, with each client's portfolio risk decomposed into the part explained by the client's own characteristics and the part explained by the identity of their adviser. Client attributes including age, stated risk tolerance, income and horizon accounted for a small share of the variation in portfolio risk. Which adviser a client happened to be assigned accounted for substantially more. The second result is what changes the interpretation: advisers' own personal portfolios closely resembled the ones they recommended, and advisers who took more risk with their own money had clients who took more risk. Limitations: one country, one distribution model, and a period in which most of these advisers were paid by commission, so it does not transport cleanly to a fee-for-service arrangement. It measures risk taken rather than outcomes, and it cannot say whether any particular recommendation was wrong for the person who received it.",
  replication: "single",
  idea: "Advice is far less customised than the intake process implies, and the pattern looks less like a conflict of interest than like one worldview being applied to everybody, the adviser included.",
  why: "The obvious reading of weak customisation is dishonesty, and the second finding rules it out. If advisers were steering clients into arrangements that suited the adviser while keeping something better for themselves, their own portfolios would look different from their recommendations. They did not. They mirrored them, and advisers who took more risk personally had clients who took more risk. The economical explanation is that each adviser holds a view about how a portfolio ought to look, applies it to every client and to their own money, and the questionnaire you filled in is largely a compliance artefact rather than an input to anything.\n\nThat is worse news than a conflict would have been. A conflict of interest is detectable and legislatable: you can ask who is paid what, and jurisdictions have. A sincerely held one-size view is invisible from outside, survives a ban on commissions entirely, and is delivered with complete conviction, which is precisely what makes it persuasive. The customisation is the part the process advertises most loudly and, on this evidence, delivers least.\n\nFor the controllable set the implication is direct. Allocation is the decision that carries the level of your return, and this says the allocation you receive is drawn substantially from a distribution over advisers rather than a distribution over clients. The facts that ought to drive it, which are how secure your income actually is, what your horizon actually is, and how much of your net worth sits in one illiquid asset, are the facts you have to bring in writing yourself. That is not an argument against taking advice. It is an argument that the allocation is yours, and that a second opinion is only worth having from somebody with a different worldview rather than the same one.",
  failureMode: "Eleven years in a portfolio suited to somebody with a different income, a different horizon and no dependants, because it is the portfolio that adviser gives everybody. You cannot detect this from the returns, because it will look like a normal portfolio doing normal things the entire time, and you find out when the horizon that was never yours arrives.",
  worked: "The instruction is a written brief that goes in before the recommendation comes out:\n\n\"Before any advice meeting, write one page: my horizon in years, what fraction of my net worth sits in one illiquid asset, how secure my income is, and the size of the fall that would actually make me sell. Hand it over, and ask which of those four changed the recommendation.\"\n\nThen the annual version, for advice you already hold:\n\n\"Once a year, re-read that page and ask whether the portfolio I own matches it. If two of the four have changed and the portfolio has not, that is the meeting to book.\"\n\nWhat is deliberately absent is any judgement about the adviser. The question is not whether they are good at the job. It is whether anything specific to you entered the recommendation, and asking which of the four moved it is answerable in one sentence.",
  experiment: "Write the one-page brief today, before you need it: horizon in years, illiquid concentration as a percentage, income security in a sentence, and the drawdown at which you would genuinely sell. It takes about fifteen minutes and it will be the only version of your own circumstances that exists in writing anywhere. Then hold it up against the portfolio you currently hold and see whether the two are related at all.",
  reflection: "Which of the four items on your page had anybody ever asked you about, and does your portfolio reflect any of them?",
  recall: {
    q: "Advisers' recommendations show little customisation to client circumstances. Why does the finding that advisers hold similar portfolios themselves make this more concerning rather than less?",
    a: "Because it rules out the explanation that would have been easiest to fix. If advisers were steering clients into arrangements while holding something better themselves, that is a conflict of interest, and conflicts are detectable and can be legislated against. Instead their own portfolios mirrored their advice, and advisers who took more risk personally had clients who took more risk.\n\nWhat is left is a sincerely held one-size view applied to everybody including the adviser. That survives a ban on commissions, is invisible from outside, and comes with total conviction, which is what makes it persuasive. The consequence is that the facts which should drive your allocation, meaning your real horizon, your income security and your illiquid concentration, are ones you have to bring in writing yourself."
  },
  deepDive: "Here is my one-page brief and here is the portfolio I hold. Tell me which of those four facts about me the portfolio actually reflects, and which of them nobody has ever asked about."

{
  id: "costs-decide-once-then-defend",
  track: "costs", level: "judgement",
  title: "Every decision in the controllable set is made once, and the whole remaining skill is refusing to remake it",
  source: "The practice of writing an investment policy statement and holding it against yourself, which institutional trustees are obliged to do and individuals almost never do",
  gateIntro: "It is the fourth week of a bad quarter. Your allocation is unchanged, your costs are the lowest they have ever been, and there is nothing on your list to do about any of it. Somebody on a podcast is making a specific and genuinely plausible argument about the next two years, the platform is open in another tab, and there is nothing at all stopping you.",
  gatePrompt: "Write the instruction that governs what you are allowed to do in a week like that one, and name who has to countersign it.",
  evidence: "No trial. This is the discipline that institutional investing formalised as a policy statement and that individuals almost never write down: the allocation, the cost ceiling, the band, the conditions under which any of them may change, and the date of the next review, all recorded before the conditions arrive. There is no randomised evidence that individuals who write one end up wealthier, and the design would be difficult, because people who write policy statements differ from people who do not in every way that matters. What is documented elsewhere in this corpus is the failure mode it targets, which is that changes made during a drawdown are made on worse information than the original decision and are rarely reversed on the way back up. Treat it as a practice with a plausible mechanism and nothing behind it.",
  replication: "craft",
  idea: "The controllable set is a short list of decisions each settled in a single afternoon, so after that afternoon the only skill left is declining to reopen them.",
  why: "Count the list. The savings rate and its escalation. The cost ceiling. The allocation. The correction band. Where each dollar sits. The hedging choice. The turnover rule. Seven decisions, all of them settleable in an afternoon or two, and all of them finished once settled. Not one improves by being revisited, and every one gets worse when revisited under pressure, because the pressure is correlated with the market rather than with any new information about you.\n\nThat is the strange asymmetry of this whole domain. The work is front-loaded to the point of being almost trivial, and then the job changes character completely. It stops being a decision problem, where being numerate is an advantage, and becomes a defence problem, where it is not. The forecastable half supplies the ammunition: there is always a plausible argument available, it is always specific and current, and it always arrives carrying more urgency than a written band does.\n\nWriting it down is the mechanism rather than the record, and this is the part people skip. A decision held in your head has no fixed earlier version, so when you revise it you cannot tell revision from drift, and you will reliably reconstruct your former self as having agreed with you. A dated page with the reason on it makes revision visible and therefore expensive. It does not require willpower. It only requires the earlier version to be legible.\n\nAnd the honest limit, which is why this is last in the track rather than first: none of it can be handed to an instruction. Every other entry here ends with something a system does while you are not watching. This one ends with a page you have to reread, which is the argument for writing it in a form that shames you slightly.",
  failureMode: "One decision reopened in the fourth week of a bad quarter and never closed again. The allocation came down five points, the reasoning was excellent at the time, and it did not go back up when the market did, because no page existed saying what it had been. Six years later the portfolio is more defensive than the one you designed and nobody ever chose that.",
  worked: "One page, dated, short enough to reread in two minutes:\n\n\"Savings rate: this amount, escalating on the day my pay changes. Cost ceiling: this percentage. Allocation: these percentages. Band: ten points. Hedging: unhedged for equity, hedged for defensive. Next review: the first of July. Any change needs a written reason and a date, and a market movement is not a reason.\"\n\nThen the countersignature, which is the only part of this with teeth:\n\n\"Any change to this page gets sent to my partner before it takes effect, with the reason written out.\"\n\nWhat is deliberately absent is anything at all about markets. The page contains only quantities you set, which is why it stays true on the worst day, and the requirement to send it to somebody exists because a rule you can amend silently is not a rule.",
  experiment: "Write the page today, in whatever form you will actually reread, and put the date on it. Seven lines is enough, and most people manage it in twenty minutes because every decision on the list has already been made and simply never recorded. Then send it to one other person. Not for their approval, for the record: the point of a second copy is that your future self cannot revise it without somebody noticing.",
  reflection: "How long did the page take, and which line did you discover you had never actually decided?",
  forecast: { q: "Will the page I write today still say the same thing in twelve months, and will I be able to prove it?" },
  recall: {
    q: "Every decision in the controllable set can be made in an afternoon, so why is this the hardest part of the track to actually run?",
    a: "Because after that afternoon the problem changes character. It stops being a decision problem, where being numerate helps, and becomes a defence problem, where it does not. The forecastable half supplies an endless stream of plausible, specific, current arguments for reopening a settled question, and they arrive with far more urgency than a written band ever does.\n\nWriting it down is the mechanism and not the record. A decision held only in your head has no fixed earlier version, so revision is indistinguishable from drift and you will reconstruct your former self as having agreed with you. A dated page with a reason on it makes revision visible and therefore costly, and sending a copy to somebody else is what stops the page from being amended quietly."
  },
  deepDive: "Here are my seven controllable decisions as they stand today. Turn them into a one-page policy I could reread in two minutes, and tell me which line I am most likely to break first and what would trigger it."
}

</script>
<script>
/* Track: Earnings and human capital. Ordered foundational first.
 *
 * The uncomfortable track. For most people under forty the dominant asset is
 * the discounted value of future earnings rather than anything sitting in an
 * account, and almost none of the personal finance attention budget goes
 * there. The evidence is also far weaker than the defaults literature, so the
 * verdicts here run to single, contested and craft, and the entries say so
 * rather than borrowing the confidence of the earlier tracks. */
(window.LESSONS = window.LESSONS || []).push(
{
  id: "income-human-capital-dominant",
  track: "income", level: "judgement",
  title: "The largest asset you own is your future earnings, and it gets almost none of your attention",
  source: "Human capital treated as an asset in the life-cycle tradition, after Gary Becker, Human Capital (1964), and the standard practice of putting the present value of labour income on the household balance sheet",
  gateIntro: "You gave most of Sunday to a spreadsheet comparing two funds whose fees differ by a few basis points, applied to a balance of forty thousand dollars. You are thirty-four, you earn a hundred and forty thousand, and you have not had a single conversation about what you are paid since the week you were hired. There is a review in eleven days and you have prepared nothing for it.",
  gatePrompt: "Write the instruction that puts one scheduled block of attention on the bigger number, with the date it runs and what will be written down at the end of it.",
  evidence: "No trial. This is an accounting statement rather than a finding, and it is worth separating the arithmetic in it from the assumptions. The arithmetic is that your wealth includes the present value of the labour income you have not yet received, and that early in a working life this quantity is large relative to anything you have accumulated, because the accumulating has had a few years and the earning has decades. The assumptions are everything needed to put a figure on it: a path for your earnings, a probability of still being employed and alive at each point along it, and a discount rate. Move the discount rate and the number moves a very long way. No study can compute yours, the life-cycle literature treats human capital as a modelling object rather than a measured quantity, and nothing here has an effect size behind it.",
  replication: "craft",
  idea: "The present value of what you will earn is the biggest item on your balance sheet for most of your working life, and it receives a rounding error of the attention that the small end receives.",
  why: "Start with why the ratio is so lopsided and stays lopsided for so long. A savings rate applies to income, so the accumulated balance is a fraction of a fraction of what you have earned so far, while the untouched asset is everything you have not earned yet. It takes a long run of years at a high savings rate before the portfolio is the larger of the two, and for most people the crossover arrives somewhere in the second half of a career. Until then the thing that dominates the balance sheet is the thing with no statement attached.\n\nThe misallocation of attention is not stupidity, it is legibility. A portfolio has a number, a daily change, a benchmark, an app and a comparison against what your colleague is doing. Earnings have none of that. They are negotiated once every few years in a conversation nobody rehearses, priced by a market you cannot observe, and reported to you as a percentage in a letter. Attention follows what is measurable rather than what is large, and this is the cleanest example of that in personal finance.\n\nSo the correction is not effort, it is reallocation. The acts that operate on the large asset are few, infrequent and short: knowing what your role is paid elsewhere, being able to say what you want, keeping the skill current, and not letting the growth rate of your earnings be set entirely by whoever is administering the review cycle. Four things, none of them weekly.\n\nThe honest limit is that being large does not make it available. You cannot sell your human capital, you cannot borrow much against it, it disappears if you are unable to work, and its value depends on a discount rate you are guessing at. It is a strange asset and the analogy with a portfolio breaks in several places. What survives the analogy is the ranking of magnitudes, and that is all this entry is asking you to act on.",
  failureMode: "Four years of close attention to a portfolio of thirty thousand dollars, where the total realised difference between everything you chose and the boring default is a few hundred dollars. Over the same four years your salary moved by whatever the annual review letter said, because that was the only mechanism operating on it. One twenty-minute conversation you did not have was worth more than the four years of ones you did.",
  worked: "The instruction is a scheduled block rather than a transfer, and it is deliberately annual:\n\n\"Book two hours in the last week of February every year, titled 'earnings review', and in that block write down three things: what I am paid now, what the same role is paid at two other employers, and the one thing I will ask for.\"\n\nNote that it does not contain a target, a benchmark or a research task. The output is three written lines, because the failure being engineered against is not asking for too little. It is arriving at the conversation having never established what the number should be, which is what happens every year that this block is not in the calendar.\n\nIf two hours is too much to protect, the shortened version is one line: \"Before any review, write down what I will ask for and the number.\"",
  experiment: "Put a rough figure on both assets today, badly and in five minutes. Add up your accounts for the first. For the second, take your current annual earnings, multiply by the years you expect to keep working, and then halve it to be conservative about growth and discounting. You are not trying to be right. You are trying to see the ratio, and then to notice how your last month of financial attention was divided between the two numbers.",
  reflection: "What was the ratio, and roughly what share of your financial attention this year went to the smaller side of it?",
  recall: {
    q: "Why does financial attention concentrate on the smaller side of a household balance sheet, and what does that imply about where to spend an hour?",
    a: "Because attention follows legibility rather than magnitude. A portfolio has a balance, a daily change, a benchmark and an app; future earnings have no statement, are priced by a market you cannot observe, and get reported to you once a year as a percentage in a letter. Nothing about the larger asset invites a Sunday afternoon, so it never gets one.\n\nThe implication is a reallocation rather than more effort, because the acts that operate on earnings are few and infrequent: knowing the outside price of your role, being able to state what you want, keeping the skill current, and not leaving the growth rate to the review cycle. The caveat is that human capital is illiquid, uninsurable in part and valued off a discount rate you are guessing at, so the ranking of magnitudes is the only part of the analogy to act on."
  },
  deepDive: "Here is my age, my earnings, my balances and roughly how long I expect to work. Put a number on both sides of my balance sheet, then tell me which four acts on the larger side are worth an hour each and which of them I have never done."
},
{
  id: "income-labour-flexibility-hedge",
  track: "income", level: "judgement",
  title: "Being able to work more is part of your portfolio, which is why secure earnings can carry more risk",
  source: "Bodie, Merton and Samuelson, Labor Supply Flexibility and Portfolio Choice in a Life Cycle Model (Journal of Economic Dynamics and Control, 1992)",
  gateIntro: "You are twenty-nine and every article you have read says that at your age you should be heavily in equities, so you are. Your entire income is commission on completed transactions in one cyclical industry, and your last two quarters were the best you have had. A colleague nine years older mentions, in passing, what happened to their book in 2009, and you find you have no answer to it.",
  gatePrompt: "Write the instruction that sets your allocation against the shape of your income rather than against your age, in one sentence you could hand to somebody else.",
  evidence: "A theoretical model rather than an experiment, and what is contested is the prescription rather than the mathematics. Bodie, Merton and Samuelson solve a life-cycle problem in which the agent chooses how much to work as well as how much to invest, and the flexibility raises the optimal holding of risky assets: a bad market outcome can be absorbed partly by working more, so the portfolio does not have to carry the whole shock. None of it is estimated on data. The disputed half is what it implies for a particular person, because the model treats labour income as comparatively safe and separable, while the empirical earnings literature finds that earnings risk is neither small nor independent of markets, that involuntary job loss clusters in the same periods as market falls, and that the correlation varies enormously by occupation and industry. The direction of the adjustment is widely agreed. Its size for you is not, and no study will supply it.",
  replication: "contested",
  idea: "Your capacity to earn more is a hedge sitting alongside the portfolio, so how secure and how flexible your earnings are is an input into how much portfolio risk you can hold.",
  why: "There are two ways to absorb a bad outcome and only one of them is usually counted. You can hold a less volatile portfolio, or you can hold the volatility and adjust the other side by working longer, working more, or delaying the thing the money was for. Anybody with a genuine flexible margin on the earnings side is holding a hedge that never appears in an allocation, and the model's result is simply that the hedge lets the portfolio carry more.\n\nWhich makes age a bad proxy for the thing that actually matters. What buys risk capacity is a long remaining earnings stream with a flexible margin on it, and age is only correlated with that. A tenured academic of forty-five and a commission salesperson of twenty-nine are not in the same position, and the standard advice hands them the same allocation because it is indexed on the only variable that is easy to look up.\n\nNow run it backwards, because the reverse case is the one that hurts. If your earnings are exposed to the same thing your portfolio is exposed to, the hedge is not merely absent, it is negative. The bad market and the bad income arrive in the same six months, which is precisely when a portfolio has to be sold to cover something, and selling into that is how a paper loss becomes a realised one. Employer equity, industry concentration and commission income all sit in this quadrant.\n\nThe useful output is not a number, because nobody can give you one. It is three questions with checkable answers: can you increase your earnings inside a month if you had to, is your income exposed to the same cycle as your portfolio, and how long could you cover your fixed costs without either. Those replace the age heuristic, and they are the whole of what this literature can honestly hand you.",
  failureMode: "A downturn takes a large bite out of the portfolio and a similar bite out of your commission book inside the same two quarters, and the mortgage payment does not adjust. You sell into the fall to cover four months of fixed costs, which converts a decline you would have recovered into a permanent one. Nothing about the allocation was wrong for a twenty-nine-year-old. It was wrong for a twenty-nine-year-old whose income was already long the same risk.",
  worked: "This one produces a written line kept beside the allocation, not a transfer:\n\n\"My income is commission in one cyclical industry, it falls at the same time equities fall, and I cannot increase it inside a month. My allocation is set against that sentence and not against my age.\"\n\nAnd then the instruction that does the work, because the line on its own changes nothing:\n\n\"Hold fixed costs for six months in cash rather than three, and review that number in the same block each year in which I write the sentence again.\"\n\nWhat is deliberately absent is a formula converting the sentence into a percentage. There is not one, the model will not supply one, and pretending otherwise is how a genuine insight becomes a fake precision. The sentence changes the buffer and it changes how much of a fall you are able to sit through, and both of those are the actual mechanism.",
  experiment: "Write the three answers today. Can you raise your earnings inside a month if you needed to, and by what mechanism specifically. Does your income fall when the market falls, and have you ever observed that happen. How many months of fixed costs could you cover from cash. Then look at your allocation and ask whether it was set from those three answers or from your birth year.",
  reflection: "Which of the three answers was worse than you expected, and had your allocation ever accounted for it?",
  recall: {
    q: "The model says labour supply flexibility permits a higher risky-asset holding. Why can the same argument point the other way for a real person?",
    a: "Because the model treats labour income as comparatively safe and separable from the portfolio, and for many people it is neither. If earnings fall when markets fall, the flexible margin is not available in exactly the period it is needed, and the two exposures compound instead of offsetting. Involuntary job loss clusters in the same periods as market falls, and the correlation varies a great deal by occupation, so the sign of the adjustment depends on facts about you that the model does not contain.\n\nThe consequence is that age is a poor proxy for risk capacity. What matters is a long remaining earnings stream with a genuine flexible margin, whether that stream is correlated with the portfolio, and how long fixed costs can be covered without either. Nothing in this literature converts those three answers into a percentage, and the honest use of it stops at changing the buffer rather than inventing an allocation."
  },
  deepDive: "Here is how my income actually arrives, how it behaved in the last downturn, and what my current allocation is. Tell me whether my earnings are hedging my portfolio or doubling it, and what to change first."
},
{
  id: "income-level-shift-versus-growth-rate",
  track: "income", level: "annual",
  title: "A raise shifts your level once, a promotion or a move changes the slope, and only the second one compounds",
  source: "Named practice rather than a paper: separating a one-off change in the level of earnings from a change in their growth rate, which is the distinction any earnings-path model is built on",
  gateIntro: "The letter says four percent and you are pleased, because last year was three. You have been here eight years and every letter has said something between three and five. A person who sat two desks away and left after your second year now earns a number you would need six more letters to reach, and you had assumed the difference was that they were better at the job.",
  gatePrompt: "Write the instruction that would tell you, once a year, whether anything changed about what next year's increase gets applied to.",
  evidence: "No trial. This is a distinction between two kinds of change rather than a claim about either, and the arithmetic half is exact: adding a fixed amount to your salary raises every later year by that amount, while moving onto a path that rises faster multiplies every later year, and over a working life the second dominates. That is not empirical and cannot fail to replicate. What is empirical, and what this entry cannot supply, is whether any particular promotion or employer change actually alters your growth rate rather than handing you a larger level once and returning you to the same percentage pool. The earnings literature can say that job changes carry a disproportionate share of early-career growth. It cannot tell you whether the offer in front of you is one of those, and there is no study that will.",
  replication: "craft",
  idea: "Most of what gets called a good year is a one-off shift in level, and the thing that compounds is a change in the slope, which arrives through a different role or a different employer rather than through a review.",
  why: "Two changes look identical in the month they happen and diverge completely afterwards. A four percent increase applied to the same base, by the same process, next year and the year after, is a level shift with a growth rate attached that somebody else owns. A move onto a path where the base is set differently and the increases are applied to a different number is a change in slope. In the first month the second one might even pay less. In year seven it is not close.\n\nThe review conversation is structurally a level conversation, and this is not anybody's fault. It is conducted inside a band, against a pool that was budgeted before you walked in, and calibrated against colleagues doing the same work. Everything about its machinery is designed to produce a percentage of your current number, which means the current number is the binding constraint and the conversation cannot reach it. That is why eight good reviews compound so much less than they feel like they should.\n\nSo the test is not what you got, it is what changed about the next one. Did the band change. Did the base your percentage is applied to get reset by something other than a percentage. Is the work you are now doing priced differently by the outside market than the work you were doing before. If all three answers are no, you had a good year at an unchanged slope, and that is worth knowing before you decide the strategy is working.\n\nThe honest counterweight is that a level shift is not worthless and slope-chasing is not free. Moving has costs the arithmetic does not carry: a manager who backs you, accumulated knowledge that is worth real money at this employer and nothing anywhere else, deferred compensation you forfeit, and the plain risk of landing somewhere with a worse slope than the one you left. The distinction tells you what to measure. It does not tell you to move.",
  failureMode: "Eight years of reviews between three and five percent, each one experienced as progress, all of them applied to a base set in the week you were hired at a salary you did not negotiate. The colleague who left in your second year and moved once more after that is on a number you would reach in six more letters, and their next percentage is applied to the larger figure. The compounding was never in the percentage. It was in whose number it multiplied.",
  worked: "The instruction is annual and it has two lines, and the second is the one that does the work:\n\n\"In the first week of February each year, write down what my earnings did last year in dollars, and then write down one thing that changed about what next year's increase will be applied to.\"\n\n\"If the second line is empty two years running, that year's instruction is three outside conversations rather than preparing for a review.\"\n\nWhat is deliberately absent is any threshold at which I would leave. The rule has to be runnable in a year when the answer is that nothing changed and you are staying anyway, because a rule that forces a decision is a rule you stop running. This one only forces a sentence.",
  experiment: "Find your starting salary at this employer and your current one, and work out the compound annual rate between them. Then find, if you can, what the same role pays for somebody hired externally today. The gap between your compounded number and the external number is what the review process has been unable to reach, and it has a date on it, which is the day you were hired.",
  reflection: "Over your whole time at this employer, what was the compound rate, and had you ever computed it before today?",
  recall: {
    q: "Why does a sequence of good annual reviews compound so much less than it feels like it should?",
    a: "Because a review is structurally a level conversation. It happens inside a band, against a pool budgeted before you arrived, calibrated against colleagues doing the same work, and its machinery is built to produce a percentage of your current number. The current number is therefore the binding constraint and the conversation cannot reach it, so eight good years multiply a base that was set once, probably in the week you were hired.\n\nA change in slope resets what the percentage is applied to, which is why it usually arrives with a different role or a different employer. The test is not what you were given but what changed about the next one: the band, the base, or the outside price of the work. The counterweight is that moving forfeits things the arithmetic does not carry, including firm-specific knowledge, deferred compensation and the risk of a worse slope, so the distinction tells you what to measure rather than what to do."
  },
  deepDive: "Here is my salary history at this employer, the role I am in now and what I think the external market pays for it. Tell me whether my slope has ever changed, and what a change in slope would actually look like from where I am."
},
{
  id: "income-growth-arrives-in-job-changes",
  track: "income", level: "standing",
  title: "A large share of early-career wage growth arrives on the day you change employer, not in the years between",
  source: "Topel and Ward, Job Mobility and the Careers of Young Men (Quarterly Journal of Economics, 1992)",
  gateIntro: "A recruiter you have never replied to sends a number on a Tuesday afternoon and it is well above yours. You have been at this employer six years and this is the first outside figure you have seen in all of them. They want an answer inside two weeks, you have never rehearsed this conversation, and you are now making one of the larger financial decisions of your year on somebody else's clock.",
  gatePrompt: "Write the standing instruction that would have given you an outside number long before a stranger handed you one, and say what it does not require you to decide.",
  evidence: "United States administrative earnings records for a cohort of young men followed from labour market entry, with quarterly earnings linked to employer identifiers so that a change of job is visible in the data rather than recalled by a respondent. Two facts come out of it: young workers change employer very frequently across their first decade, and a large share of the wage growth accumulated over that decade arrives at the moment of a change rather than accruing within a job. Topel and Ward read the pattern as search, with the early career a process of finding a better match and the wage gain being the match improving. The limitations are serious and they bear directly on using it. One country, one cohort, men only, and a labour market whose tenure norms and industrial composition differ from the one you are in. The design is descriptive, so it cannot separate moving causing the gain from movers being the people able to gain. The qualitative pattern that transitions carry a disproportionate share of early growth recurs in later work on job ladders. The share has never been established for your market or your decade.",
  replication: "single",
  idea: "If most early wage growth historically arrived at transitions, then staying put is not a neutral choice, it is a bet on your within-job path against a distribution you have stopped sampling.",
  why: "The mechanism is who your pay is being set against. Inside a job it is set against a band, a budget and your colleagues, all of which are anchored to what you were already earning. At a transition it is set against your alternatives by a counterparty who has no stake in your history and is bidding to acquire you. Those two processes have no reason to produce the same number, and the search reading of Topel and Ward is that the gap between them is the match improving.\n\nWhich means the thing you are short of is not courage, it is information. You cannot tell whether your current pay is good or bad without a sample, and if you have not taken a sample in six years you do not have an opinion, you have an assumption inherited from a negotiation you barely remember. This is the part that matters most, because it separates cleanly from the decision to move: sampling costs an hour and commits you to nothing, and not sampling costs you the ability to know.\n\nThe honest limits are large. The study is old, the cohort is narrow, and it cannot tell you that moving causes the gain. Mobility carries costs it does not price: a manager who backs you, firm-specific knowledge worth money here and nothing elsewhere, deferred compensation, a commute, and the real possibility that the new place is worse. There is also a survivorship problem sitting inside the result, because the workers whose gains were observed were the ones able to move at all.\n\nSo the install is deliberately not a moving rule. It is a sampling rule, and it is designed to be runnable in the year you have no intention of leaving, because that is the year it does the most work.",
  failureMode: "Six years with no outside number, and then a recruiter's figure arrives unsolicited and sits well above yours. The cost is not the gap. It is that you were unable to know for six years, and now have to make the decision inside a two-week window, in a conversation you have never practised, against a deadline set by somebody whose interests are not yours.",
  worked: "One standing instruction, and it runs whether or not you want to leave:\n\n\"Repeating calendar entry, first Monday of every quarter, titled 'one outside conversation'. Reply to one recruiter, or ask one person outside my employer what the role is paying. Write the number down in the same note each time.\"\n\nWhat is deliberately absent is any application, any target and any threshold at which I would resign. A rule that requires a decision is a rule you cancel in the first quarter you are busy and content. A rule that only requires a data point survives indifference, which is the state you will be in most quarters.\n\nThe same note is load-bearing, as it is with any annual or quarterly check. Four numbers in one place is a trend. Four numbers you cannot find is four wasted conversations.",
  experiment: "Create the repeating calendar entry now, then do the first one this week rather than next quarter. One message to a recruiter you ignored, or one direct question to somebody outside your employer doing your job. You are collecting a number, not opening a process, and the sentence to use is that you are not looking but you are trying to understand the market. Write the number in a note titled with today's date.",
  reflection: "When did you last see an outside number for your own role, and how did you come by it?",
  forecast: { q: "Will I have had four outside conversations about what my role pays in the next twelve months?" },
  recall: {
    q: "Topel and Ward is descriptive and cannot show that moving causes the wage gain. Why is it still worth acting on, and what should the action be?",
    a: "Because the usable claim is about information rather than causation. Inside a job your pay is set against a band, a budget and your colleagues, all anchored to what you already earn; at a transition it is set against your alternatives by a counterparty with no stake in your history. Those processes have no reason to agree, so without an outside number you do not have an opinion about your pay, you have an assumption left over from an old negotiation.\n\nWhich is why the action is sampling and not moving. Sampling costs an hour, commits you to nothing, and survives the years when you are content and busy, whereas a rule requiring a decision gets cancelled in the first such quarter. It also sidesteps the study's real weaknesses, being one old cohort of men in one country, a survivorship problem in who was able to move, and mobility costs the data never prices."
  },
  deepDive: "I have been at the same employer for several years and have no outside number for my role. Give me the exact message to send to one recruiter and one peer, phrased so it collects a figure without starting a process I am not ready for."
},
{
  id: "income-employer-premium",
  track: "income", level: "annual",
  title: "The same work is paid differently depending on who is buying it, and the gap has nothing to do with you",
  source: "Abowd, Kramarz and Margolis, High Wage Workers and High Wage Firms (Econometrica, 1999), and the matched employer and employee decompositions built on it across many national registers since",
  gateIntro: "A friend with your job title, your years and demonstrably less patience for the work has just told you what they are on, and it is a quarter above you. They are not better at it and you have watched them do it. The only visible difference is the logo on the building, and you spent last year on a certificate you hoped would close a gap that turns out not to have been about certificates.",
  gatePrompt: "Write the instruction that puts a price on the employer rather than on the skill, with the date it runs and the number it produces.",
  evidence: "Matched employer and employee administrative records, where every worker is linked to every firm they work at over time, decomposed into a worker component and a firm component using the wages of people who move between firms. The finding is that a substantial part of the variation in pay among observably similar workers is attributable to the firm rather than the person, so the same worker's wage depends materially on who is employing them. Abowd, Kramarz and Margolis established the method on French records and the qualitative result has since been recovered from the national registers of many other countries, which is what lifts it above one dataset. The limitations are real and well known inside the literature. Firm effects are identified only from movers, so with few movers per firm the estimates are noisy and the variance shares are biased, a problem the field calls limited mobility bias. The decomposition assumes the worker and firm components add, with no match-specific term, and that assumption is disputed. And it recovers an average firm premium rather than what any particular move would pay you, since high-paying firms also select who they hire.",
  replication: "replicated",
  cheat: "Price the employer as well as the role: matched employer and employee registers in many countries find a large firm-specific component in the pay of similar workers.",
  idea: "A large part of what you are paid is a property of your employer rather than of your skill, which makes the choice of counterparty an input you have been treating as fixed.",
  why: "The identification is what makes this credible and it is worth understanding, because it also tells you what the result means. The firm component is recovered from workers who move: if the same person's pay jumps when they change employer and falls when they change back, and this happens systematically across thousands of moves, then the difference belongs to the firms rather than to the people. That is a much stronger design than comparing salaries across companies, which cannot separate the firm from the sort of person who ends up there.\n\nWhat it does to your model of your own earnings is uncomfortable. You have probably been treating your pay as a readout of your skill, adjusted by how well you have performed, and treating your employer as the fixed setting in which that plays out. The decomposition inverts the two. The skill is the slow-moving part you spend years on, and the counterparty is the fast-moving part you have never priced, and the second one can be changed inside a quarter.\n\nThe geographic version is the same effect with a different label. The same skills are priced differently across cities and across national markets, high-wage cities historically claw a large share of the difference back through housing, and remote arrangements have partly decoupled the two, which is exactly the condition under which an arbitrage exists. That is not a firm effect and not from this literature, so treat it as a live question about your own market rather than as an established number.\n\nThe honest ceiling is that a firm premium is an average and it is not simply collectable. High-paying firms are selective, they pay more partly for people who are more productive inside them, and the premium comes bundled with hours, volatility, culture and a probability of not getting the offer. The result does not say you can capture the gap. It says the gap is real, it is not about your worth, and you have almost certainly never gone and measured it.",
  failureMode: "A year on a certificate to close a gap that was never about credentials, while the person who moved employer in the same twelve months and did no study closed a larger one in a fortnight. The certificate was not worthless. It was priced against the wrong variable, and the variable that mattered took four conversations and no evenings.",
  worked: "The instruction is annual, and it names the employer rather than the role:\n\n\"In the same February block, write down the three employers who most plausibly pay a premium for what I do, what each of them pays for my role, and the annual dollar difference against what I am on.\"\n\nThen the second line, which is what stops it being a fantasy:\n\n\"Beside each one, write the single thing I would need to be true to get an offer there, and whether it is a skill, a credential or an introduction.\"\n\nWhat is deliberately absent is any decision about applying. The output is a table with three rows and a dollar figure, and the reason to write the dollar figure down is that an unpriced gap gets rationalised away every year, while a number sits there and accrues interest in your head.",
  experiment: "Pick the highest-paying employer you could plausibly work for in your field and find out, today, what they pay for your role. A published band, a recruiter, a levels comparison, a former colleague, any of them. Write the annual difference against your current salary as a single number. If you have never seen that number, you have been optimising the part of your pay you can influence slowly and ignoring the part you can influence quickly.",
  reflection: "What was the annual dollar gap, and what had you assumed it was about before you looked?",
  recall: {
    q: "How do these studies separate the firm's contribution to your wage from your own, and why does that separation change what you should be working on?",
    a: "By tracking the same workers across employers. If a person's pay rises when they move to one firm and falls when they leave it, and that pattern holds systematically across very many moves, the difference belongs to the firms rather than to the people. Comparing salaries across companies cannot do this, because it confounds the firm with the sort of person who works there.\n\nIt changes the priority because it splits your pay into a slow variable and a fast one. Skill is the part you improve over years; the counterparty is a part you have never priced and could change in a quarter. The ceiling on that reading is that a firm premium is an average, high-paying firms select who they hire, and the premium arrives bundled with hours and volatility, so the finding says the gap is real and unmeasured rather than that it is simply collectable."
  },
  deepDive: "Here is my role, my field and what I am paid. Name the employers and the markets that price this work highest, tell me the plausible annual gap, and tell me what would actually have to be true for me to be hired at one of them."
},
{
  id: "income-negotiation-effects-are-modest",
  track: "income", level: "standing",
  title: "Asking is worth something and the advice about how to ask is worth much less than it is sold for",
  source: "The experimental negotiation literature on first offers and anchoring, the field-experiment strand that varied whether a job advertisement said the wage was negotiable, and the replication record of laboratory social psychology read against both",
  gateIntro: "The offer call is on Thursday. You have watched two videos, saved a thread of scripts, and written out a sentence about mirroring that you would be embarrassed to say aloud. Your last three jobs you accepted the first number inside ninety seconds. What you have prepared this time is technique, and what you still do not have is a figure you would be willing to hold for thirty uncomfortable seconds.",
  gatePrompt: "Write the instruction that governs what you do in the first ninety seconds after a number is named, in words you could actually say on a call.",
  evidence: "A large body of work whose strongest and weakest parts pull in different directions. The best-established piece is unglamorous: where wages are negotiable, people who ask do better than people who do not, and a large share of people never ask. That much survives across designs. The technique literature is where the trouble is. Most of it is laboratory work with student participants, hypothetical or trivial stakes, and short single-round exercises, on outcomes measured inside the experiment rather than in anybody's pay. It sits squarely in the part of social psychology whose replication record over the past decade has been poor, and the widely repeated results about anchoring with a first offer, framing and perspective-taking have not been re-established at anything like the confidence with which they are taught. The field experiments are far fewer, and the ones varying whether an advertisement stated the wage was negotiable find that the stated rules of the process change who asks, which is a result about the employer's design rather than about your script. Effect sizes throughout are modest, contested, and much smaller than the certainty of the advice implies.",
  replication: "contested",
  idea: "The reliable part of salary negotiation is that you ask at all and that you know your number, and almost everything sold as technique rests on evidence too weak to justify the preparation it consumes.",
  why: "Separate the two claims, because they have completely different evidentiary standing. That people who ask do better than people who do not, in settings where asking is permitted, is about as safe as anything in this track. That a particular sequence of words extracts more than another particular sequence of words is a laboratory finding with student subjects and no money at stake, taught with a confidence the underlying studies never earned.\n\nThe practical consequence is that preparation effort is being spent in the wrong place, and worse, the technique preparation actively substitutes for the useful kind. An hour on scripts feels like preparation and produces no number. An hour establishing what the role pays elsewhere produces the only input that matters, because the thing that fails in a real salary conversation is almost never the phrasing. It is that you have no figure you are willing to hold, so you converge on theirs within a minute of it being named.\n\nThere is one asymmetry worth taking from the field-experiment strand, and it is about the process rather than about you. When an employer states that the wage is negotiable, who asks changes. That means the question of whether asking is even on the table is a property of the arrangement you are in, and it is a question you can ask directly rather than infer, which is cheaper and more reliable than any technique.\n\nSo the honest position is that asking is worth installing as a rule and technique is not worth studying. A rule works on the failure mode that actually occurs, which is accepting immediately, and it works without you having to perform anything.",
  failureMode: "Three consecutive jobs where you accepted the first figure inside two minutes, each time because the number felt reasonable and you had nothing to compare it against. Every subsequent percentage at each of those employers was applied to a base you agreed to before you had finished being surprised. The videos you watched before the third one made no difference, because the failure was not in what you said.",
  worked: "One standing rule, and it removes the need to be good at anything:\n\n\"I do not accept or counter a number in the conversation in which it is first named. My words are: 'thank you, that is helpful, I will come back to you tomorrow morning.'\"\n\nAnd the precondition, which is the part the technique advice keeps replacing:\n\n\"Before any offer conversation, I write one figure on paper: the number I would say yes to without hesitating. If I do not have that figure, the instruction for that week is to get an outside number rather than to prepare.\"\n\nWhat is deliberately absent is any script beyond that one sentence. The rule works by removing the moment in which you would have needed technique, and it is robust to being nervous, unprepared and liked, which is more than any phrasing is.",
  experiment: "Write the single sentence you will say when a number is named, and put it somewhere you will find it under pressure: a note pinned in your phone, or the top of the document you keep salary figures in. Then write the figure you would accept without hesitation. If you cannot write the figure, that is the finding, and the work this week is an outside number rather than a rehearsal.",
  reflection: "How long did it take you to accept, the last time somebody named a number at you?",
  forecast: { q: "In the next conversation where somebody names a salary figure at me, will I decline to answer that day?" },
  recall: {
    q: "Which part of the negotiation literature would you act on and which part would you ignore, and why the asymmetry?",
    a: "Act on the part saying that where wages are negotiable, people who ask do better and many people never ask. That survives across designs. Ignore the technique literature, which is mostly laboratory studies with student participants, hypothetical stakes and single-round exercises, measured on outcomes inside the experiment, from the region of social psychology whose replication record has been poor. The famous results about anchoring, framing and phrasing are taught far more confidently than they were established.\n\nThe asymmetry matters because technique preparation crowds out the preparation that works. An hour of scripts produces no figure, and the thing that fails in a real conversation is not the wording but having no number you are willing to hold, which is why the useful install is a rule that removes the moment rather than a phrase to perform in it."
  },
  deepDive: "I have an offer conversation coming and I have been preparing scripts. Tell me what to stop doing, then help me establish the one figure I should walk in holding and where the outside evidence for it comes from."
},
{
  id: "income-volatility-has-a-price",
  track: "income", level: "standing",
  title: "Two incomes with the same average are not worth the same, because the lumpier one makes you hold more cash",
  source: "The buffer-stock saving literature: Deaton, Saving and Liquidity Constraints (Econometrica, 1991), and Carroll, Buffer-Stock Saving and the Life Cycle/Permanent Income Hypothesis (Quarterly Journal of Economics, 1997)",
  gateIntro: "The contract pays about eighteen percent more than the salaried role and you have already told two people you are taking it. Then you look at last year: two months with nothing in them, one invoice paid sixty-one days late, and a quarter where you moved money out of the investment account twice to cover the mortgage. Both of those months you were working.",
  gatePrompt: "Write the instruction that pays you a steady amount out of an unsteady income, naming the two accounts and the day it runs.",
  evidence: "Models rather than trials, and a contested empirical strand behind them. Deaton showed that a consumer who is impatient and cannot borrow freely will hold a buffer of liquid assets and will let consumption track current income far more closely than the permanent income hypothesis predicts. Carroll calibrated the consequence: households behave as though targeting a ratio of liquid wealth to permanent income, saving hard when below the target and spending freely above it, which reproduces the age and income patterns in the data better than the frictionless model. Neither is an experiment. The empirical work asking whether households actually save more when their income is riskier does find precautionary saving, but the estimated magnitudes vary widely with how income risk is measured and with how much of the measured variation households already knew about, so the size of the effect is genuinely contested. What no model supplies is your own target buffer, which depends on parameters nobody can estimate for one person.",
  replication: "contested",
  idea: "Income variance has a price, and you pay it in the extra months of cash you must hold at a low return, so a lumpier income needs a premium rather than parity to be the better deal.",
  why: "The comparison people make between two income arrangements is on the average, and the average is the part that does not matter much. What matters is that a lumpy income forces a larger liquid buffer, that buffer sits in cash earning close to nothing in real terms, and it sits there permanently rather than being drawn down and replaced. If a steady income needs three months of fixed costs held and a lumpy one needs eight, the difference is five months of your spending parked at a low return for the length of the arrangement, and that is the price of the variance. It is computable and almost nobody computes it.\n\nThere is a second cost and it is larger than the first. Below the buffer, decisions stop being yours. The buffer-stock reading is that a household beneath its target does not run a savings policy at all, because every surprise has to be absorbed by whatever is liquid, and if nothing is liquid it gets absorbed by the investment account or by credit. That is how a good year of lumpy income produces two forced sales and no wealth, and the forced sales tend to arrive at the worst possible moment because they are triggered by the same conditions that made income scarce.\n\nWhich is why the install for a lumpy income is not a bigger savings rate, it is a structural change in how money reaches you. Everything arrives in a holding account. A standing transfer pays you a fixed amount out of it on a fixed day, so downstream of that account your income is smooth and every ordinary instruction in this corpus works again. Only the surplus above the buffer leaves for anything long-term.\n\nThe honest limit is that the size of the buffer is a judgement the literature cannot make for you. The models produce a target from parameters that are not measurable on individuals, and the empirical magnitudes are contested. What is not contested is the direction, and the structure works at any buffer size you choose, which is why the structure is the install and the number is the annual argument.",
  failureMode: "A year at eighteen percent above your old salary that ends with less invested than the year before it, because two dry months and one invoice paid sixty-one days late were absorbed by selling units twice, both times in a month you would not have chosen. The average income was genuinely higher. The variance ate the difference and you never wrote the variance down as a cost.",
  worked: "Three instructions, and the first one is the structural change:\n\n\"Every payment I receive lands in a holding account that has no card attached to it and is not my everyday account.\"\n\n\"On the first and fifteenth of every month, a standing transfer moves a fixed amount from the holding account to the everyday account. That fixed amount is my salary and it does not change with what came in.\"\n\n\"On the first of each month, anything in the holding account above six months of that fixed amount transfers out to the long-term account automatically.\"\n\nWhat is deliberately absent is any rule that varies the fixed amount with a good month. That is the whole mechanism: the good month is supposed to be invisible downstream, because a fixed amount you can defend in a dry quarter is worth more than a larger one you have to cut. Set it at what survives your worst quarter, not your average one.",
  experiment: "Look at the last twelve months of income by month rather than as a total. Find the worst month, the worst consecutive pair, and the longest gap between payments. Then set your fixed self-paid amount at a level that would have survived that pair, and open the holding account today even if you only move the structure across next month. The number you want out of this is the size of the worst gap, because that is what your buffer has to cover.",
  reflection: "What was your worst consecutive two months last year, and what did you have to sell or borrow to get through it?",
  forecast: { q: "Will the fixed amount I pay myself still be unchanged, and still covered, six months from now?" },
  recall: {
    q: "Why is a lumpier income worth less than a steady one of the same average, and what is the structural response?",
    a: "Because the variance has to be carried somewhere. A lumpy income forces a permanently larger liquid buffer, which sits in cash at close to nothing in real terms for the life of the arrangement, and the difference in buffer months against your fixed costs is a computable price on the variance. The larger cost is that below the buffer your savings policy stops existing: every surprise is absorbed by whatever is liquid, and when nothing is, it is absorbed by the investment account or by credit, usually at the worst moment because the same conditions caused both.\n\nThe response is structural rather than a higher savings rate. Income lands in a holding account with no card, a standing transfer pays a fixed amount into the everyday account on fixed days regardless of what arrived, and only the surplus above the buffer leaves for the long term. Downstream of the holding account the income is smooth, so every ordinary instruction works again, and the buffer size stays an annual argument rather than a precondition."
  },
  deepDive: "Here is my income by month for the last year and here are my fixed costs. Tell me what fixed amount I could safely pay myself, how many months of buffer that implies, and what the variance in this income has actually cost me against a salaried alternative."
},
{
  id: "income-returns-are-personal",
  track: "income", level: "annual",
  title: "The return you earn on your wealth is a persistent feature of you, not a number the market hands out equally",
  source: "Fagereng, Guiso, Malacrino and Pistaferri, Heterogeneity and Persistence in Returns to Wealth (Econometrica, 2020)",
  gateIntro: "Somebody at work says the market did about nine percent last year and you nod, because you read the same number. You have never worked out what your own household actually earned on its wealth in any year, and you would not know where to start, and there are three accounts, one property and a superannuation balance involved. You could not name your worst year either.",
  gatePrompt: "Write the annual instruction that produces one number for what your own wealth actually earned, naming where each input comes from.",
  evidence: "Norwegian administrative records covering essentially the entire population, which is what makes it possible at all. Because the tax system reported individual asset holdings and the income from them, the authors could compute a return on wealth for each person in each year rather than inferring one from a survey of portfolios. Three findings. Returns differ substantially across individuals, including within the same broad asset class. The differences persist within a person over many years, behaving like an individual characteristic rather than a run of luck. And they correlate across generations, with parents' returns predicting their children's. The limitations are the ones you would expect from register data. One country, one tax system, one period, with an unusual amount of information reported because that tax system needed it. Returns are computed from reported asset values and income, so measurement is imperfect, and it is worst exactly where dispersion is largest, in private business wealth and unrealised gains. And the persistent component is never decomposed into skill, information, risk tolerance and access, so what is established is that a persistent personal return exists rather than what it is made of.",
  replication: "single",
  idea: "What a household earns on its wealth is dispersed across people and persistent within a person, so the market's number is not a forecast for you and you have probably never measured your own.",
