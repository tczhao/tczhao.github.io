{
  id: "evidence-meta-analysis-inclusion",
  track: "evidence", level: "judgement",
  title: "Two meta-analyses of the same literature disagreed by an order of magnitude, and the whole difference was who they let in",
  source: "Fernandes, Lynch and Netemeyer, Financial Literacy, Financial Education, and Downstream Financial Behaviors (Management Science, 2014), and Kaiser, Lusardi, Menkhoff and Urban, Financial Education Affects Financial Knowledge and Downstream Behaviors (Journal of Financial Economics, 2022)",
  gateIntro: "Someone in a thread has just posted the line about financial education explaining a tenth of one percent of behaviour, as a closing argument. You happen to know there is a later paper that found the opposite, and you also notice you have never looked at why they differ. You are about to reply, and the reply you are drafting cites the paper that agrees with you.",
  gatePrompt: "Write the rule you would follow, from now on, before citing either number. One sentence, phrased so you could actually apply it in a thread.",
  evidence: "Two syntheses of overlapping literatures with different admission rules. Fernandes, Lynch and Netemeyer pooled 168 papers and admitted both randomised interventions and correlational studies measuring literacy as a trait, recovering roughly a tenth of one percent of variance in downstream behaviour and finding the effect decayed toward zero inside about twenty months. Kaiser, Lusardi, Menkhoff and Urban restricted admission to randomised trials, 76 of them, and recovered an effect on behaviour of around a tenth of a standard deviation. Neither ran a new experiment. Neither is a fraud. The estimates are not really estimates of the same quantity.",
  replication: "contested",
  idea: "When two credible syntheses of one literature disagree by an order of magnitude, look at the inclusion criteria before you look at the result, because that is almost always where the disagreement lives.",
  why: "A meta-analysis is not a measurement, it is an aggregation, and every aggregation has an editorial policy. Admitting correlational designs into a pool changes what the pooled number means: a study measuring whether financially literate people behave better is answering a different question from a study measuring whether teaching someone changes what they do. The first is contaminated by everything that produces literacy in the first place, and by whatever unmeasured trait produces both. Pool the two and the resulting number is an average of answers to two questions.\n\nSo the honest reading is not that one team is right. It is that the randomised-only estimate is the one that speaks to the intervention question, and it is small. And the correlational studies are not worthless either; they are evidence about a trait, and they were being read as evidence about a treatment.\n\nWhich leaves you with a usable rule that generalises well past this dispute. When a striking pooled number is quoted at you, the question is not whether the authors are competent. It is what got admitted, and whether the things admitted were answering your question.",
  failureMode: "You spend two years citing the tenth-of-one-percent figure as proof that financial education is worthless, and then someone who has read the 2022 paper takes the argument apart in public. The underlying point you were making survives intact, because a tenth of a standard deviation is still an order of magnitude below a default change. You just cannot make it any more, because you attached it to the wrong number.",
  worked: "The rule, written so it survives a thread:\n\n\"Before I cite a pooled effect size, I check what designs the pool admitted, and I quote the randomised-only figure when one exists.\"\n\nAnd the version of the argument that does not depend on winning the methodology fight:\n\n\"Take the most generous estimate of the education effect. It is about a tenth of a standard deviation. A single default change moves participation by tens of percentage points. I do not need the null result to make the point.\"\n\nThat second move is the one worth learning. An argument that only works if the strongest counter-evidence is wrong is an argument you will eventually lose.",
  experiment: "Take the most striking statistic you personally repeat about money, the one you have quoted more than twice. Find where it came from, and find out whether the design was randomised, correlational, or a simulation. Twenty minutes. Then decide whether the sentence you have been saying is one the design can support, and if it is not, write the weaker sentence that it can.",
  reflection: "Which statistic did you check, and did the design support the sentence you had been saying?",
  recall: {
    q: "Two meta-analyses of financial education disagreed by roughly an order of magnitude. Where did the disagreement come from, and what does that imply about reading either number?",
    a: "From inclusion criteria. One pool admitted both randomised interventions and correlational studies of literacy as a trait; the other admitted only randomised trials. A study asking whether literate people behave better is answering a different question from one asking whether teaching changes behaviour, and pooling the two produces an average of answers to two questions.\n\nSo the randomised-only estimate is the one that speaks to whether an intervention works, and it is small but not zero. The practical conclusion survives either way, because even the generous estimate sits an order of magnitude below what a default change buys."
  },
  deepDive: "Here is a statistic about money I repeat often. Find what design it rests on and tell me the weakest sentence that design can actually support."

{
  id: "evidence-sampling-on-outcome",
  track: "evidence", level: "judgement",
  title: "A study of millionaires cannot tell you what produces one, because it never looked at anybody who tried and failed",
  source: "Thomas Stanley and William Danko, The Millionaire Next Door (1996), read as a research design rather than as advice",
  gateIntro: "A book has told you that the wealthy drive unremarkable cars, buy suits on sale and have never leased a vehicle. You recognise several of these habits in a relative who is not wealthy at all, and several more in a colleague who is. You are about to adopt two of them anyway, on the grounds that it cannot hurt, and you have not asked what the book would have found if it had surveyed anybody else.",
  gatePrompt: "Write the question you would have to answer before adopting any habit from a study of successful people. One sentence, general enough to reuse.",
  evidence: "A survey programme of high-net-worth American households, recruited on the basis of already being high-net-worth, reporting the frequency of various habits and attitudes within that group. There is no comparison group of households with the same habits and lower wealth, no randomisation, no time ordering to separate cause from consequence, and the sample was drawn in particular American neighbourhoods in a particular period. Everything it reports about the prevalence of a habit among millionaires may well be accurate. None of it identifies a habit that produces millionaires.",
  replication: "overclaimed",
  idea: "Selecting a sample on the outcome you want to explain destroys your ability to explain it, because the habits you find may be equally common among everyone who did not get the outcome.",
  why: "The structure of the error is easy to see once it is named. Suppose frugality is completely unrelated to becoming wealthy, and suppose seventy percent of all households are frugal. Survey only wealthy households and you will find that seventy percent of them are frugal, and you will write a book about it. The finding is real, the inference is empty, and nothing inside the data can tell you which you are looking at. What would tell you is a comparison group, and there is not one.\n\nWorse, the direction of causation is unconstrained. Wealth permits frugality to be comfortable rather than punishing. Someone with assets who buys a used car is exercising a preference; someone without who does the same is under a constraint. The observed habit is the same and its meaning is opposite, and a survey of outcomes cannot separate them.\n\nThis pattern is the single most common defect in popular writing about money, and it survives because the resulting advice is agreeable and nearly costless. Frugality is not bad advice. It is just not what this evidence establishes, and the confidence attached to it was borrowed rather than earned.",
  failureMode: "You adopt a set of habits copied from people who already succeeded, feel virtuous, and skip the one structural change that would actually have moved your position, because it was not on the list. The list could not contain it: a habit only appears in a survey of the wealthy if the wealthy still practise it after arriving, which systematically excludes anything you do once and then stop.",
  worked: "The question, written so you can reuse it on the next book:\n\n\"Who is the comparison group, and would this habit be just as common among the people who did not get this outcome?\"\n\nIf there is no comparison group, the honest downgrade is available and costs nothing:\n\n\"This is a description of what wealthy households do, not a mechanism for becoming one. I will treat it as a hypothesis, not as instruction.\"\n\nAnd then the useful redirect: the mechanisms in this corpus with real identification are almost all boring structural ones, because those are the ones you can run an experiment on.",
  experiment: "Pick the most recent piece of financial advice you took from a profile, interview or book about a successful person. Write down what the comparison group would have to be to test it. Then ask whether that comparison was available to the author, and whether the advice would survive it. Most will not survive, and the point of the exercise is that you can see this in about ninety seconds once you know to look.",
  reflection: "Which piece of advice did you test, and what happened when you asked who the comparison group was?",
  forecast: { q: "Over the next ninety days, will I notice myself catching the missing comparison group in something I read, without being prompted?" },
  recall: {
    q: "Why can a survey of wealthy households not identify the habits that produce wealth, even when the survey is accurate?",
    a: "Because the sample was selected on the outcome. If a habit is equally common in the general population, it will show up at that same rate among the wealthy and look like a cause, and nothing within the data distinguishes that case from a genuine one. Only a comparison group of people with the same habits and different outcomes can.\n\nCausal direction is also unconstrained: wealth makes frugality comfortable rather than punishing, so the same observed behaviour means opposite things in the two groups. And any habit practised once and then abandoned cannot appear in such a survey at all, which biases the list toward maintenance behaviours over the structural changes that did the work."
  },
  deepDive: "Here is advice I took from a profile of someone successful. Tell me what comparison group would test it and whether it would survive one."
},
{
  id: "evidence-behaviour-gap-number",
  track: "evidence", level: "judgement",
  title: "The behaviour gap everyone quotes is several times larger than the one anybody can reproduce",
  source: "Dalbar's Quantitative Analysis of Investor Behavior, against Morningstar's Mind the Gap series, and the published methodological criticism of the former",
  gateIntro: "A slide in a presentation has just told the room that investors underperform the funds they own by several percentage points a year through bad timing. The number is large enough that it would dominate every other decision in the room if true, and nobody has asked where it came from. You have seen a much smaller figure somewhere and cannot remember which one was which.",
  gatePrompt: "Write the one question you would ask the presenter, phrased so it is about method rather than about whether they are wrong.",
  evidence: "Two attempts at the same quantity that disagree by a large multiple. Dalbar's annual publication reports a gap of several percentage points a year between fund returns and investor returns, and it has been criticised repeatedly and in detail for how it computes the investor side, including its treatment of flows and of the period over which returns are annualised. Morningstar's Mind the Gap, which computes an asset-weighted investor return against fund total return, finds a gap far smaller, on the order of a fraction of a percentage point to about one and a half percentage points a year depending on the period and category. The Morningstar method is documented and reproducible from public data. The Dalbar method is not fully disclosed.",
  replication: "overclaimed",
  idea: "There is a real behaviour gap and it is small, and the large version survives because it is the number that sells the service being advertised beside it.",
  why: "Start with the fact that a gap must exist. Money arrives in a fund after good performance and leaves after bad, so the dollar-weighted return earned by the average dollar has to differ from the time-weighted return printed on the fact sheet. The direction is not in dispute and the mechanism is arithmetic.\n\nThe dispute is entirely about magnitude, and magnitude is where the method matters. Computing an investor return requires assumptions about when flows happened and over what horizon to annualise, and small changes in those assumptions move the answer a great deal. When one estimate is produced by a documented method that others can rerun, and a much larger estimate is produced by a method that has not been fully disclosed and has drawn sustained criticism, the reproducible one deserves the weight.\n\nWhat keeps the big number alive is that it is useful to somebody. A gap of several percentage points a year is precisely the size that justifies paying an adviser to stop you doing something, and it appears most often in material produced by people selling that. That is not proof it is wrong. It is a reason the burden of proof has not been met, and a reason it will keep circulating regardless.",
  failureMode: "You accept the large figure and conclude your own behaviour is the dominant term in your returns, so you buy a service to manage it and pay a fee that is larger than the real gap. The genuine version of the problem was worth a fraction of a percentage point a year and would have been solved by looking at your portfolio less often, for nothing.",
  worked: "One question, about method, which is much harder to deflect than an accusation:\n\n\"Is that the Dalbar number or the Morningstar one, and how is the investor return computed?\"\n\nAnd the position to hold afterwards, which concedes the real effect and refuses the inflated one:\n\n\"The gap is real, because flows chase performance and dollar-weighted returns therefore lag time-weighted ones. The reproducible estimates put it under two percentage points a year, and the fix is looking less often rather than paying someone.\"\n\nNote that you never have to claim the big number is fabricated. You only have to ask how it was computed, which is a question it has not answered in thirty years.",
  experiment: "Find your own dollar-weighted return. Most brokerages and super funds report a personal return alongside the fund's stated return, and where they do not, a spreadsheet with your contribution dates and an internal rate of return function will get you there in half an hour. Compare the two numbers. That difference is your actual behaviour gap, measured rather than assumed, and it is the only version of this statistic that is about you.",
  reflection: "What was your own gap between personal return and fund return, and was it closer to the large figure or the small one?",
  forecast: { q: "Will my own measured dollar-weighted return over the next twelve months lag my fund's stated return by less than one and a half percentage points?" },
  recall: {
    q: "A behaviour gap between fund returns and investor returns must exist. So what exactly is in dispute, and how should the dispute be resolved?",
    a: "Only the magnitude. A gap follows arithmetically from flows chasing performance, which makes dollar-weighted returns lag time-weighted ones. The dispute is over how large it is, and that turns entirely on how the investor-side return is computed - what is assumed about flow timing and about the annualisation horizon.\n\nIt resolves toward the reproducible estimate. Morningstar's method is documented and can be rerun from public data and finds a gap on the order of a fraction of a point to about a point and a half. The much larger figure comes from an undisclosed method that has drawn sustained criticism, and it persists because a large gap justifies paying someone to close it."
  },
  deepDive: "Help me compute my own dollar-weighted return from my contribution history and compare it honestly to my fund's stated return."
},
{
  id: "evidence-latte-fixed-costs",
  track: "evidence", level: "standing",
  title: "Blaming small purchases misattributes a fixed-cost problem to the only spending you can see",
  source: "The latte factor, as popularised in David Bach's personal finance writing, examined against the structure of household expenditure",
  gateIntro: "You have just finished an exercise that added up your discretionary spending for the month, and the total was genuinely uncomfortable. Your instinct is to cut it. You have not yet added up rent, insurance, transport, utilities and the loan, and you have a suspicion about what will happen to the proportions when you do. It is the third time you have run this exercise in two years.",
  gatePrompt: "Write the instruction that would let you stop running this exercise, by attacking the part of the budget that is actually large.",
  evidence: "No trial, and no evidence base at all for the causal claim. The arithmetic that small daily purchases compound to a large sum over decades is correct as arithmetic. What has never been established is that the elimination is achievable or sustained, or that the released money is saved rather than reabsorbed. Set against it is the well documented structure of household expenditure in wealthy countries, where housing and transport dominate and discretionary categories are a minority of outgoings. The direction of that structure is not in doubt; the exact shares vary by household and by country, and you should compute your own rather than accept a published average.",
  replication: "overclaimed",
  idea: "The largest items in your budget are the ones you decided once and then stopped seeing, and attacking the visible small ones is how you avoid touching them.",
  why: "Two things are true at once and they usually get collapsed. The compounding arithmetic on a daily purchase is real. And the daily purchase is a small share of a budget dominated by decisions you make every few years and then live with for the interval between.\n\nThe interesting asymmetry is in how much attention each attracts. A coffee is a transaction, and transactions are salient, repeated and easy to feel guilty about. A lease, a suburb, a car finance term and an insurance renewal are each a single event, and after the event they become the background against which everything else is measured. So the attention budget is allocated almost exactly inversely to the dollars.\n\nWhich means the useful move is not more discipline about small things. It is to convert the invisible large decisions into scheduled, visible ones. A renewal you actually shop is worth more than a year of denied coffees, and it takes an afternoon rather than three hundred and sixty-five acts of self-control. The self-control version also has a failure mode the structural version does not: it competes with everything else you are trying to be disciplined about.",
  failureMode: "Six weeks of tracking every small purchase, a genuine reduction, and then a quiet return to baseline by month three, with nothing structural changed. Meanwhile the insurance renewed on autopilot at a rate nobody shopped, the loan stayed on a rate nobody renegotiated, and both of those were larger than the entire discretionary category you spent six weeks on.",
  worked: "The instruction schedules the large decisions instead of policing the small ones:\n\n\"Every year in the first week of July, before anything else: shop the home and car insurance, ask the lender for a rate review, and check whether the phone and utility plans are still the ones I would choose today.\"\n\nAnd the one that stops the exercise recurring:\n\n\"I will compute my fixed-cost share once, and if it is above two thirds of outgoings, I will not run another discretionary spending audit until it is not.\"\n\nThe second is the load-bearing one. It gives you an explicit condition under which the guilt-driven exercise is the wrong tool, which is the only thing that reliably stops it coming back.",
  experiment: "Add up your last three months of outgoings in two buckets only: things you decided once and now recur without a decision, and things you decide each time. Compute the first as a share of the total. Then set a single calendar entry, dated to the week after 1 July, to shop the three largest recurring items. That is the whole install, and it replaces the tracking exercise rather than supplementing it.",
  reflection: "What share of your outgoings turned out to be decisions you had already made, and which three are you shopping in July?",
  recall: {
    q: "The compounding arithmetic behind the latte factor is correct. Why is the advice still overclaimed?",
    a: "Because the arithmetic is not the claim. What has never been established is that eliminating a small recurring purchase is sustained, or that the released money is saved rather than reabsorbed into the budget, and no trial supports the causal step from cutting to accumulating.\n\nStructurally it also points at the wrong target. Housing, transport, insurance and debt service dominate household outgoings and are set by decisions made once every few years, while discretionary transactions are salient, repeated and small. Attention gets allocated almost inversely to the dollars, so scheduling a review of the large recurring items beats policing the small visible ones and costs an afternoon instead of continuous self-control."
  },
  deepDive: "Here are my last three months of outgoings. Split them into decided-once and decided-each-time, and tell me which three recurring items are worth an afternoon."
},
{
  id: "evidence-multiple-testing-factors",
  track: "evidence", level: "judgement",
  title: "Hundreds of return premia have been published and most of them do not survive being counted as hundreds",
  source: "Campbell Harvey, Yan Liu and Heqing Zhu, ...and the Cross-Section of Expected Returns (Review of Financial Studies, 2016)",
  gateIntro: "A product sheet in front of you is built on a premium that was documented in a peer-reviewed journal, with a t-statistic above two and a backtest running to the 1960s. Everything about the document is technically accurate. You are trying to decide whether to tilt part of your portfolio toward it, and the only thing you have not asked is how many other things were tested by other people before this one was written up.",
  gatePrompt: "Write the standing rule you would apply to any published return premium before acting on it. One sentence, with a threshold in it.",
  evidence: "A census of the factors published in the finance literature, several hundred of them, combined with a multiple-testing framework that asks what significance threshold is appropriate once you account for how many hypotheses the profession collectively tested. The authors argue that the conventional t-statistic of two is far too permissive in this setting and that a threshold nearer three is defensible, and that on that basis a large share of published factors should be treated as likely false positives. The count of published factors is a documented census; the exact threshold depends on assumptions about how many unpublished tests were run, which is unobservable by construction and which the authors are explicit about.",
  replication: "replicated",
  cheat: "Raise the bar on any published return premium: with hundreds of factors tested across the profession, a t-statistic near three beats the conventional two.",
  idea: "Statistical significance is a claim about one test, and when a profession runs thousands of tests on the same data the conventional threshold stops meaning what it says.",
  why: "The logic is the one every practitioner already knows and almost nobody applies to published work. Run twenty independent tests at the five percent level against pure noise and you expect one to clear. The threshold was calibrated for a single test, and nothing in the arithmetic of a single test knows how many others were run.\n\nNow apply that to asset pricing, where a large profession tests candidate predictors against a small number of long return series that everybody shares. The tests are not independent, the data is largely common, and the incentive to publish rewards the ones that clear. What comes out the other end is a literature whose surviving members are selected for having cleared a bar that was never adjusted for the selection.\n\nThe honest consequence is not that factor investing is fraudulent. It is that a published premium, on its own, is weak evidence, and the things you should want before acting are out-of-sample survival after publication, a mechanism that explains why the premium should persist rather than be arbitraged away, and an effect large enough to survive implementation costs. Very few clear all three, and the ones that do are the ones already in the cheap broad index you were going to buy anyway.",
  failureMode: "You tilt a quarter of the portfolio toward a documented premium, pay a higher fee for the privilege, and spend eight years underperforming the plain index while telling yourself the premium is merely out of favour. The premium may be real and out of favour. You have no way to distinguish that from its never having existed, which is exactly the position the multiple-testing problem puts you in.",
  worked: "The standing rule, with a threshold so it is actually decidable:\n\n\"I will not tilt toward a published premium unless it has survived out of sample since publication, has a mechanism I can state in one sentence, and costs me under ten basis points to hold.\"\n\nAnd the fallback that makes the rule cheap to obey:\n\n\"When a premium fails any of those three, the default is the broad low-cost index, and no further decision is required.\"\n\nThe second clause matters because a rule that only tells you what to reject leaves you deciding again each time. A rule that names the fallback has already made the decision.",
  experiment: "Look at whatever you actually hold. For each holding that is not a plain broad-market index, write the one-sentence mechanism for why its premium should persist rather than be competed away. Where you cannot write the sentence, you are holding a backtest. You do not have to sell anything today; the point is to know which of your positions rest on a mechanism and which rest on a t-statistic.",
  reflection: "How many of your non-index holdings had a mechanism you could state in one sentence?",
  forecast: { q: "Will I still hold every current non-index tilt in twelve months, and will I have been able to state its mechanism each time I checked?" },
  recall: {
    q: "Why does a t-statistic of two mean less in the asset-pricing literature than it does in a single controlled experiment?",
    a: "Because the threshold is calibrated for one test and the profession has run an enormous number against largely shared data. Twenty independent tests at the five percent level against pure noise produce one apparent hit, and publication selects for the hits, so the surviving literature is filtered on a bar that was never adjusted for the filtering.\n\nHarvey, Liu and Zhu census several hundred published factors and argue a threshold nearer three is defensible once multiplicity is accounted for. The practical consequence is that publication alone is weak evidence, and what you should require instead is out-of-sample survival, a stateable mechanism, and an effect that survives costs."
  },
  deepDive: "Here is what I hold. For each non-index position, tell me the mechanism that would have to be true for its premium to persist, and whether it has survived out of sample."
},
{
  id: "evidence-backtest-overfitting",
  track: "evidence", level: "judgement",
  title: "A backtest is a search result, and nobody reports how many things were searched",
  source: "David Bailey, Jonathan Borwein, Marcos Lopez de Prado and Qiji Jeff Zhu, on backtest overfitting and the probability of false discovery in strategy selection",
  gateIntro: "Somebody has shown you a strategy with a smooth equity curve running back twenty years, a modest drawdown and a Sharpe ratio you would be pleased with. They are not selling anything and they built it themselves over a couple of months of evenings. You believe the chart is honestly computed, and you are trying to work out why you are still uneasy about it.",
  gatePrompt: "Write the question you would ask them, phrased so it is answerable and does not accuse them of anything.",
  evidence: "A body of methodological work arguing that when a researcher tries many strategy configurations against one historical series and reports the best, the reported performance is an extreme order statistic rather than an estimate, and that with enough trials an impressive in-sample Sharpe ratio can be produced from data with no signal in it at all. The authors formalise how the expected maximum Sharpe rises with the number of trials and propose reporting the trial count so a result can be discounted. The argument is analytical and demonstrated by simulation rather than by a field experiment, and the practical difficulty is that the trial count is almost never recorded, including by honest researchers who were not counting.",
  replication: "single",
  idea: "The performance a backtest reports is the best of everything that was tried, so without the number of things tried you cannot tell a discovery from the maximum of a pile of noise.",
  why: "The uncomfortable part is that this requires no dishonesty. Someone iterating in good faith adjusts a lookback window, tries a different rebalancing frequency, adds a volatility filter, moves the entry threshold. Each change is a considered judgement, not a fishing expedition, and by evening thirty they have quietly run several hundred configurations against the same twenty years. What they report is the one that worked, because that is what iteration means.\n\nSo the reported Sharpe is the maximum of a sample of several hundred draws, and the expected maximum of a sample rises with the sample size regardless of whether anything real is present. That is why the smooth curve is not reassuring. Smoothness is what the search was optimising for, and the search will find it in noise if given enough attempts.\n\nThe thing that would distinguish the two cases is data the search never touched: performance after the strategy was fixed, on a period nobody could have tuned against. That is expensive, slow and boring, which is why it is rarely there, and its absence is the single most informative fact about most backtests you will be shown.",
  failureMode: "You allocate real money to a strategy whose in-sample curve was the winner of four hundred silent trials. It performs like noise from the day you fund it, which is the correct prediction, and you spend a year attributing the gap to regime change and slippage rather than to the fact that the number you were shown was never an estimate of anything.",
  worked: "The question is about process, so it is answerable and carries no accusation:\n\n\"Roughly how many variants did you try before this one, and is there a period you fixed the rules on and then never looked at again?\"\n\nMost people answer the first honestly and are surprised by their own number. Almost nobody has the second, and its absence is the whole answer.\n\nThe version you apply to yourself is stricter, because you cannot ask yourself a question you will answer honestly:\n\n\"Before I test anything, I write down the rules and hold back the last five years, and I look at the held-back period exactly once.\"\n\nOnce is the operative word. A holdout you consult twice is no longer a holdout, it is just a slower part of the search.",
  experiment: "If you have ever built or seriously considered a rule-based strategy, reconstruct how many variants you tried. Count honestly, including the ones you abandoned in the first minute. Then ask whether any period of data survived untouched by that search. For most people the answer is that the count is far higher than remembered and the untouched period does not exist, and knowing both numbers is worth more than the backtest was.",
  reflection: "How many variants had you actually tried, and was there any data left that the search had never seen?",
  recall: {
    q: "Why is a smooth twenty-year equity curve from an honest researcher still weak evidence?",
    a: "Because it is the best of however many configurations were tried, and the expected maximum of a sample rises with the number of draws whether or not any signal is present. Iterating in good faith over lookback windows, filters and thresholds silently produces hundreds of trials, and smoothness is what the search was selecting for, so it will find it in noise given enough attempts.\n\nWhat would separate discovery from selection is data the search never touched: performance on a period fixed before testing and consulted once. Its absence is the most informative fact about a backtest, and the trial count is almost never recorded even by researchers who were not fishing."
  },
  deepDive: "I am about to evaluate a rule-based strategy. Design the holdout discipline before I start, including what I am allowed to look at and how many times."
},
{
  id: "evidence-literacy-correlation-causation",
  track: "evidence", level: "judgement",
  title: "Financially literate people do better, and that is not evidence that teaching literacy would help",
  source: "Annamaria Lusardi and Olivia Mitchell, on the Big Three financial literacy questions and their association with financial outcomes",
  gateIntro: "You have just taken a three-question quiz about interest compounding, inflation and diversification, and got all three right. The accompanying text tells you that people who answer correctly retire with substantially more, are less likely to hold expensive debt and are more likely to hold shares. You feel briefly pleased, and then notice you have no idea whether the quiz measured a cause or a symptom.",
  gatePrompt: "Write the alternative explanation you would need to rule out before treating the quiz as a lever rather than a thermometer.",
  evidence: "A large and well replicated body of survey work establishing that performance on three standard questions covering compound interest, inflation and risk diversification correlates strongly with retirement wealth, debt cost and portfolio participation, across many countries and survey waves. The correlations themselves are robust and reproduce widely. What the design cannot deliver is causal direction: the same underlying numeracy, education, cognitive ability, family background and interest in the topic plausibly produce both the quiz score and the outcomes, and people who already manage money learn its vocabulary by doing so. The randomised evidence on teaching literacy, covered elsewhere in this track, produces effects an order of magnitude smaller than the correlations imply.",
  replication: "contested",
  idea: "The correlation between literacy and outcomes is real and reproduces everywhere, and the intervention it appears to recommend does not work nearly as well as the correlation suggests it should.",
  why: "This is one of the cleanest natural examples of a gap between an association and the policy it seems to imply. The association is not fragile, not small and not confined to one country. If it were causal, teaching the three concepts would be one of the highest-return interventions available, and the randomised trials would show it. They do not; they show something an order of magnitude smaller.\n\nThe reconciliation is that the quiz is largely a thermometer. Numeracy and general cognitive ability produce both the score and the outcomes. Interest in money produces both. And the causal arrow runs backwards too: someone who has held shares for a decade knows what diversification means because they have been doing it, not the other way round.\n\nWhich leaves the score genuinely useful for one thing and useless for another. It is a decent marker for who is at risk, which is why the surveys are worth running. It is a poor guide to what to do about them, and the entire policy history of financial literacy education is what happens when a good thermometer is mistaken for a good lever.",
  failureMode: "An organisation spends a decade running financial literacy seminars because the correlation is strong, measures attendance and satisfaction rather than behaviour, and never learns that the effect on what people actually do was close to nothing. Everyone involved acted in good faith on a real and reproducible association.",
  worked: "The alternative explanation, written as a check you can reuse:\n\n\"Before I treat a measured trait as a lever, I ask what third thing could produce both the trait and the outcome, and whether the outcome could produce the trait.\"\n\nApplied here it reads:\n\n\"Numeracy and interest in money plausibly produce both the quiz score and the wealth, and holding investments for ten years teaches you the vocabulary. So the score is a thermometer, and I should look for the randomised evidence before believing it is a lever.\"\n\nThe general move is to demand the trial whenever an association is used to justify an intervention. In this field the trial usually exists and usually disagrees.",
  experiment: "Take one belief you hold about what causes good financial outcomes, ideally one you would act on. Write down the third factor that could produce both the supposed cause and the outcome, and write down whether the outcome could plausibly produce the cause. If both are available and you cannot rule either out, downgrade the belief from lever to marker and go looking for whether anyone has run the experiment.",
  reflection: "Which belief did you downgrade from lever to marker, and had you been acting on it?",
  recall: {
    q: "The link between financial literacy scores and financial outcomes is strong and replicates internationally. Why is it still not a case for teaching financial literacy?",
    a: "Because the design is correlational and two alternative explanations are wide open. Numeracy, cognitive ability, education and simple interest in the topic plausibly produce both the score and the outcomes, and the causal arrow also runs backwards, since people who have managed money for years learn its vocabulary by doing so.\n\nThe decisive check is the randomised evidence, which exists and finds effects an order of magnitude below what the correlation implies. So the score is a useful thermometer for identifying who is at risk and a poor lever for doing anything about it."
  },
  deepDive: "Here is something I believe causes good financial outcomes. Name the confounders and the reverse-causation story, and tell me whether a trial has been run."
},
{
  id: "evidence-external-validity-transport",
  track: "evidence", level: "judgement",
  title: "The best commitment-savings evidence comes from households facing constraints you do not face",
  source: "Eva Vivalt, on how much impact evaluation results generalise across settings, read against the commitment savings trials in the Philippines, Kenya and India",
  gateIntro: "You are persuaded by a randomised trial in which a restricted savings account raised balances substantially over a year. The participants were rural households with irregular cash income, no salaried employment and limited access to formal banking. You have a fortnightly salary, an offset account and a phone that can move money in nine seconds. You are about to adopt the finding at full strength.",
  gatePrompt: "Write what you would keep from that trial and what you would refuse to carry across. Two clauses, one sentence.",
  evidence: "Work assembling large numbers of impact evaluations of the same interventions across different settings and asking how well a result in one place predicts the result in another. The finding is substantial heterogeneity: effect sizes vary widely across contexts, and a single study is a weak predictor of what the same programme does elsewhere. Applied to this corpus, the strongest commitment-savings evidence comes from randomised trials among liquidity-constrained households in the Philippines, Kenya and India, where the binding constraint was often access and social claims on cash rather than self-control against a debit card. This is a meta-scientific literature about generalisation rather than a trial of transport itself, and how much it should discount any particular finding is a judgement it cannot make for you.",
  replication: "single",
  idea: "Carry the mechanism across contexts and refuse to carry the effect size, because the mechanism is usually about human beings and the effect size is usually about the constraint that was binding.",
  why: "An intervention works by relieving whatever was binding. A lockbox helps a household whose savings are eroded by relatives who can observe cash, and the size of that help is set by how much erosion there was. Move the same box to a salaried professional and the erosion term is close to zero, so the effect should be too, even though nothing about the psychology has changed.\n\nThis is why the mechanism transports better than the number. That people discount the future inconsistently, that they will pay for restriction, that a barrier between intention and defection changes behaviour: those are claims about people, and they show up in laboratory work, in high-income settings and in the developing-country trials alike. What differs is how much room the barrier had to work in.\n\nSo the correct use of these trials is directional. They tell you a restriction is worth installing and that you should expect to want to defect. They do not tell you your balance will rise by the amount they measured, and quoting their percentage at yourself is the error, not reading them.",
  failureMode: "You install a heavily restricted account expecting the headline improvement, get something much smaller because the leak the original trial was plugging never existed in your life, and conclude commitment devices do not work. The device worked exactly as its mechanism predicts. Your expectation was imported from a setting where the constraint it relieves was severe.",
  worked: "Two clauses, and the second is the one people skip:\n\n\"I will take from that trial that a restriction I cannot easily reverse changes behaviour, and I will not take the size of the change, because the constraint it relieved is not the one binding on me.\"\n\nThen the follow-on, which turns the discount into an action rather than a shrug:\n\n\"So I will install the restriction and measure my own effect over six months, rather than predicting it from theirs.\"\n\nThat last move is what stops external-validity scepticism collapsing into doing nothing. The correct response to an untransportable effect size is a local measurement, not inaction.",
  experiment: "Take the single finding in this corpus you found most persuasive. Write down the population it was measured on and one way their situation differs materially from yours. Then write what you still believe after that difference, in one sentence. If nothing survives, you have found a finding you were about to over-apply. If the mechanism survives and the number does not, that is the normal and correct result.",
  reflection: "Which finding did you discount, and what survived the discount?",
  forecast: { q: "Six months from now, will I have a measured number for the effect of a commitment device on my own saving, rather than a borrowed one?" },
  recall: {
    q: "Why does the mechanism of a commitment savings trial transport across contexts better than its effect size?",
    a: "Because an intervention works by relieving whatever constraint was binding, and the size of the effect is set by how severe that constraint was. A restricted account helps most where cash was being eroded by social claims and weak banking access, so moving it to a salaried professional with instant transfers should shrink the effect even though the psychology is unchanged.\n\nThe underlying claims about people - inconsistent discounting, willingness to pay for restriction, a barrier changing behaviour - show up across settings. So the trials are directional evidence that a restriction is worth installing, and the correct response to an untransportable magnitude is to measure your own rather than to do nothing."
  },
  deepDive: "Here is a study I want to act on and here is my situation. Tell me which part of the finding transports to me and which part does not."
},
{
  id: "evidence-survey-versus-register",
  track: "evidence", level: "judgement",
  title: "What people say they save and what the records show they saved are different numbers, and only one of them is measured",
  source: "The methodological literature comparing survey-reported household finances against administrative register data, and the register-based studies from Denmark and Norway that this corpus leans on",
  gateIntro: "A headline tells you the average household in your country saves a certain percentage of income, and you feel briefly better or worse about your own rate depending on which side of it you fall. The figure came from people being asked. You have never once been asked, and if you were, you are not certain what number you would give, or how long you would spend working it out before answering.",
  gatePrompt: "Write the instruction that would let you answer that question about yourself from records rather than from memory.",
  evidence: "Comparisons of household financial quantities measured by survey against the same quantities in tax, bank and pension registers show systematic rather than random disagreement. Assets and debts are under-reported, respondents round heavily, and the errors correlate with the characteristics being studied rather than cancelling out. This is the reason the strongest results in this corpus come from Danish and Norwegian register data covering whole populations rather than from surveys with better questionnaires. The pattern is documented across multiple countries and data linkages; the precise size of the discrepancy varies by country, by quantity and by survey instrument, so treat the direction as established and any specific gap as local.",
  replication: "replicated",
  cheat: "Prefer register-based findings to survey-based ones: self-reported assets and debts are systematically under-reported, and the errors correlate with what is being studied.",
  idea: "Self-reported financial data is biased in a direction, not merely noisy, which is why a whole-population register study outranks a larger and more carefully worded survey.",
  why: "Noise and bias have different consequences and get conflated constantly. If survey error were random, a large enough sample would average it away and the survey would be fine. The reason it is not fine is that the error has structure: people under-report debt more than assets, round to salient numbers, forget accounts they do not use, and misclassify what counts as saving. None of that averages out, and worse, the size of the error is related to the very characteristics under study, so it distorts relationships and not just levels.\n\nRegisters have their own limits. They see what is inside the reporting perimeter, so informal holdings and assets abroad are invisible, and they are only available where the state collects them, which is why so much of this literature is Scandinavian. But within the perimeter the measurement is not an estimate, and that is a categorically different kind of number.\n\nThe reason it matters for you personally is that you are a survey respondent to yourself. Asked what you save, you will produce a rounded, optimistic, quickly assembled figure, by exactly the mechanism the literature documents. The fix is the same one the researchers used: stop asking, and go to the records.",
  failureMode: "You believe you save around fifteen percent, plan a decade on that assumption, and discover from a year of actual statements that the real figure was closer to eight once the two months you dipped into savings are counted. The plan was not wrong because the arithmetic was wrong. It was wrong because its largest input was a self-report.",
  worked: "The instruction replaces the estimate with a query:\n\n\"Once a year in July, compute my savings rate from records only: total of every contribution and transfer into long-term accounts plus mortgage principal, divided by gross income from the tax return.\"\n\nAnd the clause that stops the number being quietly flattered:\n\n\"Net off anything I withdrew from those accounts during the year, including the transfers I made back out in a bad month.\"\n\nThat netting clause is where self-reports go wrong. People remember the contributions, which felt deliberate, and forget the withdrawals, which felt like exceptions.",
  experiment: "Compute your own savings rate from records for the last twelve months, netting out withdrawals. Use the tax return for the denominator so you are not estimating income either. Then compare it to the number you would have said off the top of your head before you started. The gap between those two figures is your personal version of the survey-register discrepancy, and it is the most useful measurement in this track.",
  reflection: "What was the gap between your remembered savings rate and your measured one, and in which direction?",
  forecast: { q: "Will my measured savings rate for the last twelve months come out lower than the figure I would have guessed before computing it?" },
  recall: {
    q: "Why does a whole-population register study outrank a large, carefully designed survey on the same question?",
    a: "Because survey error in household finances is biased rather than random. Debt is under-reported more than assets, answers are rounded to salient numbers, unused accounts are forgotten, and what counts as saving is misclassified. Bias does not average away with sample size, and the error correlates with the characteristics under study, so it distorts relationships as well as levels.\n\nRegisters are not estimates within their perimeter, which is a categorically different kind of measurement, though they miss informal and offshore holdings and exist mainly where the state collects them. The personal consequence is that you are a survey respondent to yourself, so your own savings rate should be computed from records rather than recalled."
  },
  deepDive: "Walk me through computing my savings rate from records rather than memory, including what to net off that I will be inclined to forget."
},
{
  id: "evidence-overlapping-windows",
  track: "evidence", level: "judgement",
  title: "Forty overlapping thirty-year windows out of a century are not forty independent tests",
  source: "The standard problem of overlapping-window inference in long-horizon financial time series, as it applies to historical simulation of savings and withdrawal strategies",
  gateIntro: "A chart shows that a particular strategy succeeded in every historical thirty-year period since 1926, and the caption says ninety-six out of ninety-six. That reads as overwhelming, and you notice it reads that way because of the number ninety-six. You are about to plan around it, and you have not asked how many genuinely separate thirty-year periods exist inside a hundred and twenty-five years of data.",
  gatePrompt: "Write the question you would put in the margin of that chart. One line, about the denominator.",
  evidence: "No trial, because this is an inference problem rather than a finding. A century and a quarter of returns contains only about four non-overlapping thirty-year periods, so a claim of ninety-six successful windows is ninety-six heavily correlated views of roughly four independent experiences, most of them sharing the great majority of their observations with their neighbours. Standard practice in time-series econometrics is to correct standard errors for exactly this overlap, and the correction is large at long horizons. The specific number of effectively independent observations depends on assumptions about return dependence, which is why the honest statement is an order of magnitude rather than a figure.",
  replication: "craft",
  idea: "Count the independent observations rather than the windows, because at a thirty-year horizon a long history contains only a handful of them and the impressive-sounding count is mostly the same decades reappearing.",
  why: "Slide a thirty-year window forward one year and you have changed one observation in thirty. The two windows agree on twenty-nine years, so whatever happened in those twenty-nine years is being counted twice, and by the time you have slid it ninety-six times a single unusual decade has been counted in thirty separate windows. The count of windows measures how finely you sliced, not how much evidence you have.\n\nThis matters most exactly where it is used most: long-horizon planning. The longer the horizon, the fewer independent periods a fixed history contains, and the more impressive the window count looks. Those two move in opposite directions, which is a reliable recipe for false confidence.\n\nAnd the independent periods that do exist are not a random sample of possible futures. They are the realised history of a small number of countries, mostly one, over a period that included the most favourable century that market has had. So the four-ish observations are not merely few. They are drawn from a distribution you have reason to think was unusually kind.",
  failureMode: "You treat a ninety-six-out-of-ninety-six historical record as if it were a ninety-nine percent probability, size a thirty-year plan accordingly, and have no margin for the case the sample never contained. The arithmetic behind the chart was correct throughout. The denominator was the problem, and nobody printed it.",
  worked: "One line in the margin, about the denominator:\n\n\"How many non-overlapping periods of this length are in the sample, and how many countries did they come from?\"\n\nThe answer is usually a single-digit number and usually one country, and both halves of that answer do work.\n\nThe planning consequence, written as a rule rather than a mood:\n\n\"For any horizon longer than ten years, I treat a historical success rate as a lower bound on what could go wrong, not as a probability, and I keep a decision I can still make if it fails.\"\n\nThe last clause is the one with teeth. Scepticism that does not change the plan is just a feeling about the plan.",
  experiment: "Find the most confident long-horizon claim you are currently relying on, whether about markets, property or your own income. Work out how many non-overlapping periods of that length its evidence actually contains, and how many countries. Write both numbers next to the claim. You are not looking to abandon it; you are looking to know whether you have been treating four observations as ninety-six.",
  reflection: "How many independent observations turned out to sit behind the long-horizon claim you rely on most?",
  recall: {
    q: "A strategy succeeded in ninety-six of ninety-six historical thirty-year windows. Why is that not ninety-six pieces of evidence?",
    a: "Because the windows overlap almost completely. Sliding forward one year changes one observation in thirty, so consecutive windows share twenty-nine years and a single unusual decade is counted in thirty of them. A century and a quarter of data contains only about four non-overlapping thirty-year periods, so the window count measures how finely the history was sliced rather than how much independent evidence exists.\n\nThe problem worsens with horizon, exactly where long-horizon planning uses it, because a longer window means fewer independent periods and a more impressive-sounding count. And those few periods come from one country's unusually favourable century, so they are neither numerous nor a fair draw."
  },
  deepDive: "Here is a long-horizon claim I am planning around. Work out how many independent observations are actually behind it and what plan survives if it fails."
},
{
  id: "evidence-scale-up-voltage-drop",
  track: "evidence", level: "judgement",
  title: "An intervention that worked in a trial routinely shrinks when it is rolled out, and the shrinkage has causes you can name in advance",
  source: "John List, on the voltage effect and why programmes that succeed at small scale lose their effect at large scale",
  gateIntro: "Your employer is about to roll out a savings programme to four thousand people, based on a pilot that ran with sixty volunteers from one team and produced a striking result. You are in the room where the rollout is being approved. Everyone has read the pilot report and nobody has asked what was true of those sixty that will not be true of the four thousand.",
  gatePrompt: "Write the one question you would ask before the rollout is approved, phrased so it improves the programme rather than blocking it.",
  evidence: "A body of work assembling cases where an intervention with strong trial evidence lost much or all of its effect on being scaled, and identifying recurring causes: the pilot population was not representative, the pilot was delivered by unusually motivated or skilled people who cannot be cloned, the effect depended on a supply that does not scale, and the original estimate was inflated by the same publication and selection pressures that get a pilot noticed at all. It is a synthesis of case evidence and theory rather than a randomised test of scaling itself, and how much any particular programme will lose is not predictable from it.",
  replication: "single",
  idea: "The question is not whether the pilot worked but which of the things that made it work will still be there at scale, and that list is short enough to write down before you commit.",
  why: "Every pilot has a delivery mechanism as well as a treatment, and the delivery mechanism is usually the part that does not survive. Sixty volunteers from one team are people who volunteered, which selects for exactly the disposition the programme is trying to create. The person running the pilot cared about it, which will not be true of whoever administers it to four thousand. Both of those inflate the pilot estimate and neither is dishonest.\n\nThen there is the selection that got you the pilot in the first place. Someone tried a version of this before, it did nothing, and you never heard about it. The pilots that reach a rollout meeting are the ones that worked, which means the estimate in front of you is drawn from the upper tail before anybody has done anything wrong.\n\nWhat makes this actionable rather than merely deflating is that the causes are enumerable. Representativeness of the pilot group, dependence on a specific person, dependence on a scarce input, and selection into being noticed. Four questions, askable in a meeting, and each one either has an answer or identifies the thing to fix before rolling out.",
  failureMode: "The programme ships to four thousand people, produces a fraction of the pilot effect, and is quietly judged a failure and withdrawn. The mechanism was real. What was rolled out was the treatment without the enthusiastic administrator and to a population that had not volunteered, and nobody wrote down in advance that those were load-bearing.",
  worked: "One question, framed to improve rather than block:\n\n\"What was true of the pilot group or the pilot delivery that will not be true at scale, and can we build that in deliberately rather than hoping it carries?\"\n\nAnd the version you apply to your own installs, which is the reason this entry is in a personal finance site at all:\n\n\"When something worked for me during a month I was paying attention, I ask whether it will still work during a month I am not, and if the answer is no I change the thing rather than the intention.\"\n\nThat is the same failure at n equals one. The enthusiastic administrator who cannot be cloned is you in week one.",
  experiment: "Take a financial habit that worked for you during a period of high attention and then faded. Write down which of four things was doing the work: that you were watching, that circumstances were unusually easy, that someone else was involved, or that you had just decided to. Then rebuild it so the load-bearing part is structural rather than attentional, and note what you had to change.",
  reflection: "Which of your habits was actually resting on you paying attention, and what did you replace that with?",
  forecast: { q: "Will the instruction I most recently installed still be running during a month when I am not thinking about my finances at all?" },
  recall: {
    q: "Name the recurring reasons a programme with good trial evidence loses its effect at scale.",
    a: "The pilot population was not representative, often because participants volunteered and volunteering selects for the disposition the programme is trying to produce. The delivery depended on unusually motivated or skilled people who cannot be cloned. The effect relied on an input that does not scale. And selection determines which pilots are ever seen, so the estimate on the table is drawn from the upper tail before anyone acts dishonestly.\n\nThe useful part is that all four are enumerable in advance, so each either has an answer or names the thing to build in deliberately before rolling out. At the scale of one person, the administrator who cannot be cloned is you during the week you were paying attention."
  },
  deepDive: "A habit worked for me and then faded. Help me work out which part was structural and which part was me watching, and rebuild it so it survives inattention."
},
{
  id: "evidence-survivorship-in-the-record",
  track: "evidence", level: "judgement",
  title: "The funds that closed are missing from the average, and they closed because they were bad",
  source: "The survivorship bias literature in mutual fund performance measurement, and the equivalent problem in long-run asset return series",
  gateIntro: "A table shows the ten-year average return of funds in a category, and it is respectable. You are choosing between two of them and using that average as your sense of what the category delivers. Somewhere in the last decade a number of funds in that category were merged away or wound up, and none of them appear in the table, and the table does not say how many there were.",
  gatePrompt: "Write the instruction you would follow when comparing any fund against a category average. One line, naming what you have to find first.",
  evidence: "Funds that perform poorly are disproportionately closed or merged into better-performing siblings, and their records leave the database when they do. Averages computed over surviving funds therefore overstate the category, and the size of the overstatement grows with the period and with the attrition rate. The direction and the mechanism are not disputed and reproduce wherever anyone has assembled a survivorship-free database; the magnitude depends on the category, the period and the attrition, so any single figure is local. The same structure appears in long-run asset return series, where the markets with continuous usable histories are disproportionately the ones that did not suffer a closure, expropriation or wipeout.",
  replication: "replicated",
  cheat: "Find the attrition rate before you trust a category average: funds that closed left the database, and they closed because they underperformed.",
  idea: "Any average computed over things that still exist is biased upward by whatever made the others stop existing, and the bias grows with the length of the window.",
  why: "The mechanism is entirely mundane, which is why it survives. A fund with a bad five years attracts no money and costs more to run than it earns, so it gets merged into a sibling. The merged record usually keeps the surviving fund's history, so the bad returns do not move to a different row of the table, they leave the table. Nobody deleted anything and no rule was broken.\n\nThe consequence is that the longer the window, the more attrition it has absorbed and the more flattering the average becomes. This runs precisely opposite to the intuition that a longer track record is more trustworthy, and it is why a ten-year category average can look reassuring while the experience of an investor who picked at random ten years ago was materially worse.\n\nThe same shape applies to the market histories underneath every long-horizon plan. Series that run continuously for a century belong to markets that stayed open for a century, and the ones that closed are not in the average for the same reason the dead funds are not. That is a second reason, on top of the overlapping-window problem, to treat a long historical record as a favourable draw rather than a representative one.",
  failureMode: "You pick a fund that beats its surviving-peer average, feel you have chosen well, and have actually chosen against a benchmark that quietly deleted its weakest members. The comparison you wanted was against everything available to you at the time you chose, and that comparison is the one the table cannot make.",
  worked: "One line, naming what has to be found first:\n\n\"Before comparing a fund to a category average, find how many funds were in that category at the start of the window and how many are left.\"\n\nAnd the practical default when that number is unavailable, which it usually is:\n\n\"Compare against a broad index rather than a peer average, because an index does not quietly drop its worst members.\"\n\nThe second line is doing most of the work. The attrition figure is often genuinely hard to get, and the point of knowing about survivorship is not to compute a correction. It is to stop using the contaminated comparison at all when a clean one is sitting right there.",
  experiment: "Take any fund you hold or are considering and find the benchmark index it is measured against in its own documentation. Compare the fund to that index rather than to a peer average, over the longest period the fund has existed. If the fund's material leads with peer comparisons rather than index comparisons, note that choice, because it was a choice.",
  reflection: "What happened to your fund's apparent performance when you compared it to an index rather than to its surviving peers?",
  recall: {
    q: "Why does a longer window make a fund category average less trustworthy rather than more?",
    a: "Because a longer window has absorbed more attrition. Poorly performing funds are disproportionately closed or merged into better siblings, and their records leave the database when that happens, so the surviving average is biased upward by exactly what made the others disappear. The longer the period, the more of that has accumulated.\n\nNothing was deleted improperly and no rule was broken, which is why it persists. The same structure affects long-run market series, since the markets with continuous century-long histories are the ones that never closed or were expropriated, so a long record is a favourable draw rather than a representative one."
  },
  deepDive: "Here is a fund I hold. Compare it to its own stated benchmark index rather than to a peer average and tell me what changes."
},
{
  id: "evidence-file-drawer-household",
  track: "evidence", level: "annual",
  title: "The interventions that did nothing were mostly never written up, so the literature is a list of things that appeared to work",
  source: "The publication bias and file-drawer literature, applied to household finance interventions where the null results are largely unpublished",
  gateIntro: "You have just read a paper reporting that a particular nudge raised savings, and it is competently done. It occurs to you that you have never in your life read a paper reporting that a nudge did nothing. You cannot tell whether that is because nudges reliably work, because you read selectively, or because those papers were written and then not published.",
  gatePrompt: "Write the habit you would adopt to stop a literature's shape from being read as a finding. One line you could actually keep.",
  evidence: "Publication bias is well documented across empirical fields: statistically significant results are more likely to be submitted, accepted and cited than null results, which distorts any assessment based on published work alone. In household finance specifically the problem is compounded because many interventions are run by firms and institutions with no obligation or incentive to publish, so a bank that tries a nudge and sees nothing simply stops. Preregistration and registered reports reduce the problem where they are used, and their use in this area is partial. The general finding is robust across fields; how severe it is for household finance in particular has not been well quantified, which is itself an instance of the problem.",
  replication: "single",
  idea: "You cannot estimate how well a class of intervention works by reading the papers about it, because the ones that found nothing are disproportionately not papers.",
  why: "The distortion compounds twice. First at submission, because an author with a null result has a harder paper to place and often better uses for the time. Then at citation, because the striking positive result gets repeated and enters the secondary literature while the published nulls that do exist sit unread. By the time a claim reaches a book or a slide, it has passed through two filters that both favour the same direction.\n\nHousehold finance has a third filter the academic fields do not. A large share of the interventions are run inside banks, super funds and employers, who test something, see nothing, and move on without writing anything down. Those trials are often larger and more representative than the published ones, and they are invisible by default rather than by decision.\n\nThe honest response is not to disbelieve everything. It is to weight differently: preregistered trials over unregistered ones, large administrative studies over small clever ones, and mechanisms that show up across several independent designs over striking single results. That is roughly the ordering this whole corpus tries to apply, and it is the reason the same handful of register-based studies keep reappearing in it.",
  failureMode: "You conclude from a decade of reading that behavioural interventions in personal finance reliably work, adopt six of them, and find that two do anything for you. Your reading was accurate and your inference was shaped by which studies existed, which was never something the studies themselves could tell you.",
  worked: "The habit, written so it is keepable rather than aspirational:\n\n\"Once a year, for the two or three claims I rely on most, I check whether the trial was preregistered and whether anyone has published a null on the same question.\"\n\nAnd the weighting rule that does the work in between:\n\n\"Preregistered over unregistered, administrative over survey, and a mechanism seen in three designs over a striking result seen in one.\"\n\nAnnual rather than continuous is deliberate. A check you promise to do every time you read something is a check you will abandon inside a month, and the claims worth auditing are few enough that once a year covers them.",
  experiment: "Pick the behavioural intervention you have most confidence in and spend fifteen minutes looking for a null result on the same question. Search for the intervention name with terms like no effect or null alongside it. What you find, or fail to find, is informative either way, and the exercise mostly teaches you how much harder it is to search for absence than for presence.",
  reflection: "Did you find a null result on the claim you checked, and how hard was it to look for?",
  recall: {

  gateIntro: "You have been coming back to this for a while now. The counters tell you how many entries you have logged and how many instructions you have written, and there is a Brier score sitting under them. You have never asked what result on that screen would mean the whole exercise is not working, and there is a version of the next six months in which you keep going regardless of what it says.",

{
  id: "install-one-per-session",
  track: "install", level: "standing",
  title: "A session that installs three things installs none, because the third one is where you stop and none of them get finished",
  source: "Operational practice in change management and deployment: one change at a time, verified before the next",
  gateIntro: "You have a free Saturday morning and a list of six things: open a second savings account, set up a transfer, consolidate two super accounts, review the insurance, cancel a subscription, and increase the salary sacrifice. It is nine o'clock and you feel capable of all of it. By eleven you will have three tabs open, two half-finished forms, and a verification email you cannot find.",
  gatePrompt: "Pick exactly one of the six and write it as an instruction. Then write what you will do with the other five.",
  evidence: "No trial. This is the deployment discipline used wherever a change has to be verified before the next one lands: ship one thing, confirm it took effect, then ship the next. The rationale is diagnostic rather than motivational. When three changes go out together and something is wrong a fortnight later, there is no way to tell which one did it without unpicking all three, and the same is true of a Saturday morning that touched six financial arrangements at once.",
  replication: "craft",
  idea: "Install one thing, verify it actually happened, and stop, because the value is in the verification and the verification is what gets dropped when the list is long.",
  why: "The failure is not that ambition runs out. It is that each of these acts has a tail. A transfer has to actually execute once before you know the account numbers were right. A consolidation has an insurance policy attached to the account you are closing, which you will only discover when it lapses. A salary sacrifice change has to appear on a payslip. Every one of them is unfinished at the moment the form is submitted, and the tail is where the errors live.\n\nSix submissions on one morning generates six tails, all landing over the following fortnight, mixed together and unlabelled. You will not track them. What actually happens is that the ones which worked are invisible and the one which silently did not is discovered a year later.\n\nOne per session inverts that. The single tail is short enough to hold in your head, and you can write down the date you expect confirmation. That is the whole discipline, and the reason it feels unsatisfying is exactly why it works: the constraint is on your appetite, not on your capability.",
  failureMode: "Nine months after a productive Saturday you find that the consolidation went through but took the income protection cover with it, the second transfer was set against a closed account and has been silently failing, and the salary sacrifice never reached payroll. Every one of those was recoverable in the week it happened. None was noticed, because six things landed at once and nothing was verified.",
  worked: "One instruction, and then the disposal of the rest:\n\n\"Today I set up the transfer, and nothing else. I will check on the fifteenth that it executed, and only then open the next item.\"\n\nAnd the other five, which need a home or they will be back next Saturday:\n\n\"The remaining five go into a single note titled 'next installs', in priority order, and I take exactly one per fortnight.\"\n\nThe list is not procrastination. It is what stops the appetite you have at nine o'clock from converting into six unverified changes by eleven, and it means the next session starts with a decision already made.",
  experiment: "Write your own list of pending financial changes, however long it is, and then pick one. Do that one today and set a reminder for the date you expect to see it confirmed, whether that is a payslip, a statement line or an email. Do not touch the others. The discipline being trained is stopping, not starting.",
