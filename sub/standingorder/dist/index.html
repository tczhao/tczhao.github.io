  why: "The design is the finding here. Every previous attempt at this question had to work from surveys of what people said they held, or from account-level data covering one institution, and neither can produce a person's actual return on total wealth. A population register with individual asset holdings and the income from them can, and that is why the dispersion showed up as large rather than as noise.\n\nPersistence is what makes it more than a curiosity. If the dispersion were luck it would average out, and a person's ranking one year would tell you nothing about the next. It does not average out. The individual component behaves like a fixed characteristic, which means the spread across people is not variation around a common return that everybody eventually gets. Some households systematically earn more on their wealth than others, for years.\n\nThe correct use of that is narrow and it is worth being strict about, because this result is easy to over-read. The paper does not tell you the persistent part is skill. It does not tell you it is fees, or timing, or access to private investments, or willingness to hold risk, and it explicitly does not decompose it. So the licensed conclusion is not that you can raise your personal return by trying harder. It is that your personal return is a real quantity, distinct from the index, stable enough to be worth knowing, and almost certainly unmeasured.\n\nThe cross-generational correlation is the part that will tempt you furthest past the evidence. It is consistent with inherited skill, inherited access, inherited risk tolerance, inherited advisers and inherited money, and register data cannot separate those. Read it as a reason to be suspicious of any story that explains returns purely by choice, in either direction.",
  failureMode: "Eleven years of quoting the long-run market average at barbecues while your own household compounded at something you have never computed, with two years of that eleven spent in cash after a scare you have half forgotten. The number you have been planning against is not your number, and the gap between them is the only one that has ever affected your balance.",
  worked: "One annual instruction, and the arithmetic is deliberately crude:\n\n\"In the first week of July every year, write down total household assets at the start of the year, total at the end, and everything I contributed or withdrew in between. Compute end minus start minus net contributions, divided by the average of start and end. Write that percentage in the same note as last year.\"\n\nWhat is deliberately absent is any benchmark and any action. You are not checking whether you beat an index, because one year against an index is noise and will only make you chase whichever is ahead. You are building a series, and a series of your own returns takes about seven years to say anything, which is why the instruction is annual and why it terminates in a note rather than a decision.\n\nThe crudeness is intentional too. A dollar-weighted return computed properly is better and will not get done. This one takes fifteen minutes and gets done.",
  experiment: "Do one year of it today, this year, badly. Opening balances, closing balances, net contributions, one division. Fifteen minutes, four numbers, one percentage. Then put next July in the calendar with the note's location in the title, because the value of this measurement is entirely in the series and the series only exists if the second entry happens.",
  reflection: "What did your own wealth actually earn last year, and how far was it from the number you had been assuming?",
  recall: {
    q: "Why does the persistence in individual returns matter more than the dispersion, and what does the paper not license you to conclude?",
    a: "Because dispersion alone is consistent with luck, and luck averages out: a person's ranking in one year would carry no information about the next. It does not average out. The individual component behaves like a stable characteristic over many years, which means the spread across households is not variation around a common return that everybody eventually receives, and the index is therefore not a forecast for any particular household.\n\nWhat it does not license is any story about what the persistent part is made of. The paper does not decompose it into skill, fees, information, access or risk tolerance, and the cross-generational correlation is equally consistent with inherited access, inherited advisers and inherited money. It is also one country, one tax system and one period, with the worst measurement exactly where dispersion is largest, in private business wealth. So the usable conclusion is that your own return is a real, stable and unmeasured quantity, not that you can raise it by trying."
  },
  deepDive: "Help me compute what my own household actually earned on its wealth over each of the last five years, using the balances and contributions I can reconstruct, and tell me honestly which parts of that number I have any control over."
},
{
  id: "income-skills-depreciate",
  track: "income", level: "standing",
  title: "Your largest asset has a maintenance cost, and the bill arrives as a surprise because nobody invoices you for it",
  source: "Named practice rather than a paper: treating a skill as a depreciating asset with an upkeep cost, after the Ben-Porath treatment of human capital investment across the life cycle (Journal of Political Economy, 1967), and the continuing-education hours that the medical, legal, accounting and engineering registration regimes all charge their members on the same assumption",
  gateIntro: "Thursday is your first interview in six years. In the screening round, two of the four technical questions were about a tool your employer standardised away from in 2019, which you have read three articles about and never once used on anything real. Nobody where you work has ever raised it, because nobody where you work needs it.",
  gatePrompt: "Write the recurring instruction that keeps the fast-decaying part of your skill alive, with the day, the length and the specific thing you would do in it.",
  evidence: "No trial. That skills lose value is not seriously disputed and also cannot be tested as one claim, because the rate differs by field, by skill and by decade, and the depreciation estimates in the labour literature range so widely that quoting one would be inventing precision. What can be said without a number is that the registration regimes for medicine, law, accounting and engineering all charge their members hours every year on exactly this assumption, and that technical fields visibly retire their tooling inside a decade. Everything past that point in this entry is craft. No experiment has compared a scheduled maintenance block against an unscheduled intention to keep up, the schedule below has no effect size behind it, and the only reason to believe the scheduled version wins is the defaults literature in the first track of this site.",
  replication: "craft",
  idea: "A skill is an asset with an upkeep cost, and you either pay it in scheduled hours or you pay it in a decline that stays invisible until somebody outside your employer prices you.",
  why: "The reason the decline is invisible is that your salary is not a measurement of your market value. It is a measurement of your value at this employer, negotiated at some point in the past and adjusted by a percentage since. Your value elsewhere can fall for years without that number moving, and the two only get reconciled at a transition, which is why the discovery is always sudden and always badly timed. There is no monthly statement for this asset, which is the same reason nobody looks at it in the first track of this site.\n\nThe depreciation is also very unevenly distributed across what you know, and this is what makes a maintenance schedule possible rather than hopeless. Deep fluency in one specific tool decays fast and is the most legible thing in an interview. General capability, judgement, knowing how work actually gets finished in an organisation, decays slowly and is nearly impossible to demonstrate to somebody who has not worked with you. So the durable half accrues by itself from doing the job, and the fragile half is the only part that needs a standing instruction pointed at it.\n\nWhy it never gets scheduled is the argument from the forgone employer match. Maintenance has no deadline and no counterparty. Nobody is waiting for it, nothing breaks in the week you skip it, and an act with no deadline loses to every act that has one, forever, which is a structural property rather than a character flaw. The fix is to give it a deadline by putting it in the calendar as a commitment with a start time.\n\nThe honest limit runs in both directions. Nobody can tell you your depreciation rate, so nobody can tell you the right number of hours, and over-maintaining is a genuine failure mode with its own name, which is the certificate treadmill. Which is why the instruction fixes the budget rather than the outcome: a small number of hours, permanently, aimed at the fragile half.",
  failureMode: "Six years of being genuinely valuable at one employer, on a stack that employer froze in 2019, then a screening round in which half the technical questions are about things you have only read about. Your salary rose the whole time and told you nothing, because a salary prices you here and an interview prices you anywhere, and the two numbers had been drifting apart since the year the tooling was chosen.",
  worked: "One standing instruction, and it is written as a meeting because that is the only form that survives:\n\n\"Recurring, Wednesday, seven to nine in the morning, titled 'ship one small thing in the tool I do not use at work'. It has a location, it is accepted, and it gets declined like a meeting rather than dragged to Friday.\"\n\nWhat is deliberately absent is a curriculum, a certificate and any target. The output for the week is one small finished thing, because finished is the only evidence that the skill is live, and a half-read course is indistinguishable from not having started. The budget is fixed at two hours whether the week is quiet or terrible, since a schedule that scales with your workload is a schedule that disappears in the quarter you most needed it.\n\nIf two hours will not survive, make it forty minutes. A small block that runs beats a large one that gets cancelled twice and then removed.",
  experiment: "Write down the two or three specific things a hiring manager in your field would expect you to have used in the last year, then mark honestly which of them you have actually used rather than read about. That list is your fragile half. Put one recurring block in the calendar this afternoon aimed at the top item, with a start time and an end time, and accept it.",
  reflection: "What is on your fragile list, and when did you last use the top item on something real?",
  forecast: { q: "Will the recurring block I created today still be in my calendar, unmoved, twelve weeks from now?" },
  recall: {
    q: "Why does skill depreciation stay invisible for years, and why does the maintenance instruction target only part of what you know?",
    a: "Because a salary prices you at your current employer, not in the market. It was set in a past negotiation and adjusted by percentages since, so your value elsewhere can fall for years without that number moving, and the two are only reconciled at a transition. There is no statement for this asset, which is exactly why nobody inspects it.\n\nThe instruction targets a part because depreciation is uneven. Deep fluency in a specific tool decays fast and is the most legible thing in an interview, while general capability and judgement decay slowly and are almost impossible to demonstrate to a stranger, so the durable half accrues from doing the work and only the fragile half needs a standing block. It also has to be scheduled rather than intended, because maintenance has no deadline and no counterparty, and an act with no deadline loses to every act that has one."
  },
  deepDive: "Here is my field, my role and the tools I actually touched in the last year. Tell me which parts of what I know are decaying fastest, and give me a two-hour weekly block that targets the fragile half rather than a course."
},
{
  id: "income-training-returns-overclaimed",
  track: "income", level: "annual",
  title: "The credible evidence that education pays is about years of schooling, not about the certificate you are considering",
  source: "The returns-to-schooling literature and its instrumental-variable designs, including Angrist and Krueger, Does Compulsory School Attendance Affect Schooling and Earnings? (Quarterly Journal of Economics, 1991), read against David Card's survey of the causal effect of education on earnings in the Handbook of Labor Economics",
  gateIntro: "The part-time qualification costs four thousand dollars and eighteen months of Sunday evenings, and the brochure opens with a figure about what its graduates earn. You have wanted to do it for two years. You have never asked one person who hires for the role you actually want whether they care whether you have it, and enrolment closes Friday.",
  gatePrompt: "Write the instruction that establishes whether a credential is required before any money is spent on it, naming who you would ask and how many of them.",
  idea: "The well-identified estimates of what education pays come from variation in childhood schooling that nobody chose, and they carry almost no information about a mid-career course you selected because you expected it to help.",
  evidence: "A well-identified finding being borrowed to justify something it was never estimated on, which is the definition of the verdict. The credible designs use variation in schooling that individuals did not choose: compulsory attendance laws, quarter of birth interacting with those laws, distance to the nearest college, changes in the school-leaving age. Angrist and Krueger's quarter-of-birth design is the canonical instance, and Card's survey concludes that the causal return to an additional year of schooling is real, on the order of several percent of earnings per year, and typically no smaller than the ordinary least squares estimate, which was the surprising part. None of that literature covers the mid-career short course, the bootcamp, the vendor certification or the part-time qualification taken by somebody already working. Those are chosen by exactly the people who expect to benefit, are almost never randomised, and the estimates that exist are dominated by that selection. The figure quoted at you in a course brochure comes from a body of work about how long somebody stayed at school as a child.",
  replication: "overclaimed",
  why: "Look at what the instruments are doing, because it explains why the number does not transfer. Quarter of birth changes how much schooling you receive without you having chosen anything, so the comparison is between people who differ in years of school and not in ambition, ability or expectation of benefit. Strip that out and you have a causal return. Now consider a mid-career certificate: the people who enrol are the people who already decided to change roles, who already had the energy, and who already believed it would pay. Every one of those predicts a higher future income on its own, and there is no instrument in the world sitting in a course brochure.\n\nWhich leaves the credential question empirically open, and that is genuinely the honest answer. It is not that courses do not pay. It is that nobody can tell you what yours pays, and the number being used to persuade you is on loan from a different question.\n\nWhat replaces an estimate is a fact you can obtain. Whether a credential is required for a role is not a matter of estimation, because there are people who make that decision and you can ask them. Two conversations settle it, they cost an hour, and they produce a yes or a no rather than a percentage. That is a better instrument than any study for the specific question of whether to spend four thousand dollars, and it is available this week.\n\nThe uncomfortable comparison is against the alternatives in this track. The employer premium and the transition premium are better evidenced and cheaper to test than any credential, and both are usually available to somebody who spends the same eighteen months having conversations instead of studying. That does not make the studying wrong. It makes it the third thing to try rather than the first.",
  failureMode: "Eighteen months of Sunday evenings and four thousand dollars on a qualification chosen because a graduate earnings figure was quoted at you, and then not one of the four employers you spoke to afterwards asked whether you held it. The learning was real and you do not regret it. The pricing was borrowed from a study about how long children stay at school.",
  worked: "One instruction, and it is a precondition rather than a decision:\n\n\"Before paying for any course or credential, I ask two people who currently hire for the role I want whether they require it, and I write both answers down beside the price. If I cannot find two such people, the answer is no.\"\n\nAnd the annual version, so it does not only fire when a brochure arrives:\n\n\"In the same February block, write the one capability gap that is actually costing me money, and the cheapest way to establish whether a credential closes it.\"\n\nWhat is deliberately absent is any judgement about whether the course is good. It probably is. The question the instruction answers is narrower and answerable: does the person who would hire you care. Two people is the number because one is an anecdote and five never happens.",
  experiment: "Take the course you have been considering and find two people who hire for the role it is meant to unlock. A hiring manager on a professional network, a recruiter in that specialty, a friend of a friend. Ask one question: is this required, preferred, or irrelevant for the people you hire. Write both answers beside the price and the hours. That is a one-hour exercise standing in front of an eighteen-month one.",
  reflection: "What did the two people say, and what had you been assuming before you asked them?",
  recall: {
    q: "Why does the causal return to a year of schooling not transfer to a mid-career certificate?",
    a: "Because the credible estimates depend on instruments that remove choice from the comparison. Compulsory attendance laws, quarter of birth and distance to a college change how much schooling somebody receives without them selecting it, so the comparison is between people who differ in years of school rather than in ambition, ability or expectation of benefit. A mid-career course has no such instrument: the enrollees are precisely the people who already decided to move, already had the energy and already believed it would pay, and every one of those predicts higher earnings on its own.\n\nThat leaves the question empirically open rather than answered in either direction, so the substitute for an estimate is a fact you can obtain. Whether a credential is required is decided by identifiable people, two of whom can be asked in an hour, and their yes or no is worth more for this decision than any published percentage."
  },
  deepDive: "Here is the course I am considering, its price in money and hours, and the role I want it for. Tell me what the evidence can and cannot say about it, then give me the two questions to ask a hiring manager that would settle it."
},
{
  id: "income-passive-income-is-not-passive",
  track: "income", level: "judgement",
  title: "Almost nothing sold as passive income is passive, and the part that genuinely is has a rate you can look up",
  source: "The passive income category as it is marketed, decomposed against the two components any income stream actually has: a return on capital, which is quoted publicly, and a return on labour, which is almost always left out of the headline",
  gateIntro: "Your brother-in-law has spent the barbecue on the rental he manages, and the number he keeps using is the rent. You watched him lose a fortnight of last summer to a bathroom and he takes about three tenant calls a month, and neither of those has ever appeared in any figure he has quoted you. He is now saying you should do the same, and he is not wrong that he owns a house.",
  gatePrompt: "Write the instruction that would tell you what an income stream actually pays you per hour, and name the two numbers you would have to collect first.",
  evidence: "No experiment underlies this and none is possible, because passive income is a marketing category rather than an asset class. What supports the verdict is a decomposition that is exact rather than estimated. Any income stream is a return on capital plus a return on labour, the first is quoted publicly and requires no strategy to obtain, and the second is what fills the gap between the quoted rate and the promised one. Deposit rates, bond yields and dividend yields are published, unglamorous and available to anybody. Anything offering materially more than those is doing one of two things: compensating you for risk, which is real and is not passivity, or paying you for labour that has not been counted. The overclaim is testable on your own numbers rather than in a study, by dividing the annual income by the capital employed and then counting the hours, which is the whole instruction in this entry.",
  replication: "overclaimed",
  idea: "Split any income stream into a return on capital, which is published and modest, and a return on labour, which is unpriced, and the passive part of almost every scheme is the smaller half.",
  why: "The decomposition does all the work, so it is worth doing slowly. If capital alone produces the income, the rate is the rate anybody gets for supplying capital at that risk, and it is quoted on a screen. Nobody needs a course to obtain a deposit rate or a dividend yield, and nobody sells one. So the moment a scheme promises a return well above those, either you are being paid for bearing risk, which is a legitimate trade but is the opposite of passive because a risk you cannot tolerate will force you to act at the worst time, or you are being paid for work.\n\nThe residential rental is the cleanest example because most people run it without noticing. Take the rent, subtract rates, insurance, strata, management, maintenance and vacancy, then divide by what the property cost including transaction duties. The remaining yield is usually low. Then count the hours: the tenant calls, the tradespeople, the inspections, the bathroom, the tax return. Those hours have a rate, which is whatever your own time earns, and once they are subtracted the arrangement usually turns out to be a modest yield plus a leveraged bet on the capital value plus an unpaid part-time job. All three of those can be worth having. None of them is described by the word passive.\n\nThe reason the word matters and is not merely sloppy is that it changes the comparison you make. Passive income gets compared against zero, because it sounds free, and on that comparison anything positive wins. Priced honestly it gets compared against the alternative uses of the same capital and the same hours, and the alternative use of your hours is often your own job, your own earnings negotiation, or the maintenance of the skill that produces your salary, all of which pay better per hour than most of the category.\n\nThe judgement this cannot make for you is whether the unpriced labour is a cost at all. Some of it is genuinely enjoyable, some of it builds a skill, some of it is time you would otherwise not use well. That is a real answer and it is yours to give. What is not available is giving that answer without having counted the hours.",
  failureMode: "A rental that clears about two hundred dollars a month after every cost, presented at every family gathering as passive income, running on roughly six hours a month of your attention plus one bad fortnight a year. That is about twenty-five dollars an hour before tax, against a day job paying three times it, and in the same year you turned down a work project because you had no time.",
  worked: "The instruction produces two numbers and one division:\n\n\"For every income stream I have or am considering, I write down the annual income after every cost, the capital employed including transaction costs, and the hours it takes in a year. Then I write income over capital as a percentage, and income over hours as a dollar rate.\"\n\nThe second number is the one nobody has:\n\n\"If the dollar rate per hour is below what my own working hour earns, I either say so out loud when I describe the arrangement, or I stop calling it passive.\"\n\nWhat is deliberately absent is any threshold at which you should sell. The instruction is not trying to talk you out of anything, because plenty of these arrangements are worth keeping on grounds that have nothing to do with the hourly rate. It exists so that the comparison you make is against the alternative rather than against zero.",
  experiment: "Take the most passive-sounding thing you own or have been pitched and do the two divisions today. Annual income after every cost, divided by capital including the duty and the fees to acquire it. Then the same income divided by the hours it took last year, counted honestly and including the tax return. Write both numbers down beside what your own working hour earns.",
  reflection: "What was the hourly rate on your most passive income stream, and how did it compare with your day job?",
  recall: {
    q: "How do you decompose an income stream to find out how passive it is, and why does the label change the decision rather than just the description?",
    a: "Split it into a return on capital and a return on labour. The return on capital at any given risk is quoted publicly and requires no strategy, so anything promising materially above deposit, bond and dividend rates is either compensating you for risk, which is not passivity because intolerable risk forces you to act at the worst time, or paying you for hours that have not been counted. Two divisions settle it: income after all costs over capital including acquisition costs, and the same income over the hours it actually took.\n\nThe label changes the decision because passive income sounds free and therefore gets compared against zero, where anything positive wins. Priced honestly, the comparison is against the alternative use of the same capital and the same hours, and your hours often have a higher-paying use in your own job, your own pay negotiation or your own skill upkeep. Whether the unpriced labour is a cost at all is a judgement only you can make, but not one you can make without counting."
  },
  deepDive: "Here is an income stream I own or have been offered, with what it earns, what it cost to acquire and roughly what it takes to run. Decompose it into a return on capital and a return on my labour, and tell me what the hourly rate actually is."
},
{
  id: "income-side-income-hourly-rate",
  track: "income", level: "annual",
  title: "Side income that pays less per hour than your own job is a pay cut you volunteered for",
  source: "The strand computing net hourly earnings for platform and self-employed work once vehicle and equipment costs, unpaid waiting time and self-employment obligations are deducted, and the persistent gap between platform-authored and independent estimates of the same figure",
  gateIntro: "The store has cleared about nine thousand dollars this year and you are pleased with it. You have never counted the hours, but it is most Saturday mornings, two evenings most weeks, and the entire week before Christmas. You earn a hundred and forty thousand at the day job, and last month you declined a project there because there was no room for it.",
  gatePrompt: "Write the instruction that produces a single after-tax hourly figure for your side income, with the date it runs and where the hours come from.",
  evidence: "A real measurement problem where the headline figure and the honest figure differ by a lot, and where the honest figure is itself disputed. Platform work is advertised on gross earnings per active hour, which is not a quantity anybody should act on. Independent estimates that deduct vehicle depreciation, fuel, insurance, unpaid time spent waiting for work, and the tax and retirement contributions an employer would otherwise have made land materially lower than the platform-authored figures, and the size of that gap remains contested, partly because the cost assumptions carry most of the result and partly because the samples differ. The limitations for your purposes are severe. Almost all of this work is ride-share and delivery, mostly in the United States, and it says nothing directly about a consultancy, an online store or a weekend trade. And none of it prices your marginal hour against your own alternative use of that hour, which is the comparison that decides the question and which only you can make.",
  replication: "overclaimed",
  idea: "Side income is quoted gross, per active hour, before tax and before the hours nobody counts, and the honest figure is often below what your existing job pays for the same hour.",
  why: "Three deductions separate the advertised number from the real one and they compound. The first is tax, and the relevant rate is your marginal one rather than your average one, because the side income sits on top of a salary. The second is the unpriced hours: the waiting, the admin, the packaging, the customer messages, the bookkeeping and the annual return, all of which are hours the headline figure treats as free. The third is capital and its costs, which for a vehicle or equipment is depreciation you will not notice until you replace the thing.\n\nWhat makes this an income question rather than a spending question is the comparison it displaces. The hour spent on side income is not taken from an empty slot. It comes out of the hours that could go to the things earlier in this track: the outside conversation that establishes your market price, the maintenance block on the fragile half of your skill, or straightforwardly the marginal hour at your own job where the rate is already known and already high. Those alternatives all pay, and they are what the side income is actually competing with.\n\nThere is a real case on the other side, and it is not the money. Side work can be genuinely diversifying, in the sense that it does not fall when your employer does, and it can build a skill or a network that raises your main income later. Both of those are legitimate reasons and neither of them is the hourly rate. The failure is not doing the side work. The failure is doing it while believing the hourly rate is fine, because you never computed it, and then declining a project at the job that pays three times as much.\n\nSo the honest ordering is to compute the number, then decide on whatever grounds you like. A side income at forty dollars an hour that you enjoy and that would survive a redundancy is a perfectly good thing to keep. A side income at forty dollars an hour you believe is at ninety is a decision made on a wrong number.",
  failureMode: "Nine thousand dollars over a year that took something like three hundred and fifty hours once the packaging, the messages and the tax return are counted, which is around twenty-six dollars an hour before your marginal tax rate touches it. Across the same year you declined a project at a job paying roughly seventy an hour, on the grounds that you had no time.",
  worked: "The instruction is annual and it terminates in one number:\n\n\"In the first week of July, using the same note every year, write four figures for each side income: gross received, every cost including depreciation on anything I bought for it, the hours it took, and my marginal tax rate. Then write the single after-tax hourly figure.\"\n\nAnd the second line, which is the comparison that makes it useful:\n\n\"Beside it, write what an hour at my main job earns after tax, and one sentence on why I am keeping the side income if the first number is lower.\"\n\nWhat is deliberately absent is any instruction to stop. The sentence is the mechanism: a reason written down survives scrutiny or it does not, and the reasons that survive are usually about diversification, enjoyment or a skill rather than the rate. What does not survive is a vague sense that it must be worth it.",
  experiment: "Estimate the hours honestly for the last twelve months rather than the last week, and include everything you would not have done otherwise: admin, messages, sourcing, travel, the return. Divide the money you actually kept by that number. If you have never tracked hours, take one representative fortnight and multiply by twenty-six, which will be wrong and will still be closer than the figure you are carrying now.",
  reflection: "What was your real after-tax hourly rate, and how far was it from what you had assumed?",
  forecast: { q: "Will I have computed the after-tax hourly rate on my side income, written down, before the end of this month?" },
  recall: {
    q: "Which three deductions separate advertised side income from the real figure, and what is the comparison that actually decides whether to keep it?",
    a: "Tax at your marginal rate rather than your average, because the income sits on top of a salary. The unpriced hours: waiting, admin, packaging, messages, bookkeeping and the annual return, all of which the headline treats as free. And capital costs, particularly depreciation on a vehicle or equipment, which is invisible until the thing has to be replaced. Those three compound, which is why the advertised figure and the honest one differ by so much.\n\nThe deciding comparison is against the alternative use of the hour, not against zero. That hour competes with the outside conversation that prices your role, the maintenance block on the fragile half of your skill, and the marginal hour at your existing job where the rate is already known and usually higher. Which does not mean stop: diversification, enjoyment and skill-building are all good reasons to keep a low-rate side income. They are just not the same reason as the rate, and only one of the two requires you to have computed it."
  },
  deepDive: "Here is what my side income earned last year, what I spent on it and roughly the hours it took. Compute the real after-tax hourly rate, compare it against an hour at my main job, and tell me which of my reasons for keeping it actually hold up."
},
{
  id: "income-second-earner-effective-rate",
  track: "income", level: "judgement",
  title: "A second earner's extra day is priced by three withdrawal schedules at once, and none of them is the tax scale",
  source: "Named practice rather than a paper: building the household's effective marginal rate on a second earner's additional hours out of the income tax scale, the childcare subsidy taper and the withdrawal of family payments, which is how workforce disincentive rates are constructed",
  gateIntro: "The conversation happens over the dishes on a Sunday. Going from three days to four means another day of care for both children, and somebody in your antenatal group said there is a point where the fourth day is basically free labour. Neither of you has opened a calculator, the arithmetic you are both half remembering came from a napkin in 2022, and enrolment for next year closes in a fortnight.",
  gatePrompt: "Write the instruction that produces one household number for the extra day, naming the three schedules you would have to look up and where you would get today's figures.",
  evidence: "No trial. Deliberately no figures either. The structure is real, documented and not controversial: when a second earner in a household with children in care increases their hours, three schedules move on the same additional dollar. Income tax applies to the extra earnings at that earner's own marginal rate. The childcare subsidy reduces as combined household income rises, and because the subsidy is a percentage of a fee for a number of days, extra hours add a cost and simultaneously cut the subsidy on the whole existing arrangement. Family payments taper against household income on a separate schedule again. Each of those is a rate on the same dollar, they add, and across some bands the sum is high enough that an additional day returns very little to the household. What this entry will not do is name a rate, a threshold or a taper, because every one of those is a legislated number that moves, and a figure quoted from memory is worse than no figure. The arithmetic belongs to your own numbers, done against a current source, on the day you do it.",
  replication: "craft",
  idea: "The rate that decides whether a second earner's additional day is worth working is a household number assembled from three separate withdrawal schedules, and it appears on nobody's payslip.",
  why: "The three schedules add because they all act on the same dollar and none of them knows about the others. Tax takes a share of the additional earnings. The subsidy withdrawal takes another share, indirectly, by raising what you pay for care you were already buying. The family payment taper takes a third. Each administering party quotes you only its own rate, correctly, and the sum is a number nobody is responsible for telling you. This is the reverse of the situation in the defaults track: there the state had quietly installed something good, and here it has quietly installed an interaction that no single agency owns.\n\nThe childcare piece is the sharp one and it is worth being precise about why. The subsidy is a percentage applied to a fee across a number of days, so an additional working day does two things at once. It adds a day of fee, and it lifts combined income, which reduces the percentage applied to every day you were already paying for. That second effect is not proportional to the extra day, it is applied to the whole existing arrangement, which is why the marginal day can be priced so much worse than the average day.\n\nWhich means the decision is a household decision being made as an individual one, and the wrong quantity is usually on the table. The number that matters is not either salary. It is the change in household take-home from one additional day of work, after all three schedules, against the change in cost from one additional day of care. That is arithmetic rather than judgement, it takes an afternoon, and it cannot be inherited from somebody else's household because it depends on your combined income, your care arrangement and your own marginal rate.\n\nAnd then the part that makes this an earnings entry rather than a tax entry, and it points the other way. The effective rate is a one-year quantity. The cost of years out is a human capital quantity: the skill maintenance that stops, the transitions not taken, and the return to a base that will be multiplied by percentages for the rest of a career. Those compound and the one-year rate does not. So a household can be entirely rational in working a day that returns almost nothing this year, because what it is buying is not this year's income, and a household can also be rational in the opposite choice. What is not defensible is making the call on remembered numbers that have moved twice since somebody quoted them at you.",
  failureMode: "A decision that the fourth day is not worth working, made on arithmetic somebody did on a napkin in 2022 against thresholds that have since moved twice. Four years later the second earner returns to a role two levels below the one they left, on a base that will be multiplied by percentages for the rest of their working life. The one-year sum may well have been correct. It was answering a one-year question about a decision that was not one.",
  worked: "The instruction is a computation done together, and it names its sources rather than its answers:\n\n\"Before any decision about a second earner's hours, we sit down for one afternoon and produce two columns for one additional day: the change in household take-home after income tax, after the change in childcare subsidy across the whole existing arrangement, and after any change in family payments, against the change in care cost. Every rate and threshold is read off the current official source that afternoon, not remembered.\"\n\nThen the second number, which is the one nobody computes:\n\n\"Beside it we write what the second earner's role is plausibly worth in five years under each option, and we make the decision on both numbers.\"\n\nWhat is deliberately absent is any figure at all. Not one rate, threshold or taper appears in the instruction, because they change and because this household's answer is a function of your combined income and your care arrangement. The instruction's whole job is to stop the decision being made from memory.",
  experiment: "Book the afternoon this week and do the two columns for one additional day, using the official calculators and the current published thresholds rather than anything you already believe. You are producing exactly two numbers: the change in household take-home and the change in cost. Write the date you did it beside them, because the figures behind them will have moved by the time this question comes up again.",
  reflection: "What was your household's actual change in take-home from one additional day, and how far was it from the figure you had been carrying?",
  recall: {
    q: "Why can a second earner's additional day be priced so much worse than their average day, and what makes the one-year answer insufficient?",
    a: "Because three schedules act on the same additional dollar and none accounts for the others. Income tax takes a share at that earner's marginal rate, family payments taper against household income, and the childcare subsidy reduces as combined income rises. The subsidy effect is the sharp one: the subsidy is a percentage of a fee across days, so an extra working day both adds a day of fee and cuts the percentage applied to every day already being paid for, which is why the marginal day can cost far more than the average one.\n\nThe one-year answer is insufficient because the effective rate is a one-year quantity while the cost of years out is a human capital quantity. Skill maintenance stops, transitions are not taken, and the eventual return is to a base that gets multiplied by percentages for the rest of a career, all of which compound. So either choice can be rational, and what is not defensible is making it on remembered thresholds rather than on current ones applied to your own combined income."
  },
  deepDive: "Here is our combined income, our care arrangement and the additional day we are considering. Walk me through the three schedules that apply, tell me exactly which current official sources to read the figures off, and then help me put the five-year career number beside the one-year one."
},
{
  id: "income-entrepreneurship-both-halves",
  track: "income", level: "judgement",
  title: "Business ownership dominates the top of the wealth distribution and the return to any given entrant is dispersed enough that the average forecasts nothing",
  source: "Cagetti and De Nardi, Entrepreneurship, Frictions, and Wealth (Journal of Political Economy, 2006), read against Moskowitz and Vissing-Jorgensen, The Returns to Entrepreneurial Investment: A Private Equity Premium Puzzle? (American Economic Review, 2002)",
  gateIntro: "The person telling you to start something owns a building and has told the story four times tonight. You know two other people who tried the same thing in the same city, one of whom closed after nineteen months and now works for somebody else, and neither of them is at this table or in any of the four tellings. Your own savings would cover about fourteen months.",
  gatePrompt: "Write the instruction that fixes, in advance and in dollars, the most this could cost your household, and name what stays untouched by it.",
  evidence: "Two findings that only mean something together. The descriptive one is robust across household wealth surveys and across countries: private business equity is heavily concentrated at the very top of the wealth distribution, with business owners a small share of households and a large share of top wealth. Cagetti and De Nardi build a life-cycle model in which entrepreneurs face borrowing constraints, calibrated against United States wealth data, and show that entrepreneurship plus those constraints can generate an upper tail that models without them cannot reach. The counterweight is Moskowitz and Vissing-Jorgensen, who ask what the return to holding private equity in a single business actually is and find it is not clearly higher than public equity despite carrying vastly more idiosyncratic risk, which they present as a puzzle. The limitations bind hard in both directions. The wealth data is conditional on survival, so it shows the businesses that still exist. Failure rates among new businesses are high and the outcome distribution is enormously dispersed, so the mean is not a description of a typical entrant. Entrepreneurs may differ in ability, risk tolerance and access to capital, none of which is randomly assigned. And the model is calibrated to match aggregates rather than tested against a prediction.",
  replication: "single",
  idea: "The concentration of business ownership at the top of the wealth distribution is real and is a survivorship fact, and the return distribution facing an entrant has a long right tail, a large mass at or below zero, and a mean nobody experiences.",
  why: "Both halves have to be held at once or the finding becomes propaganda in one direction or the other. The top of the wealth distribution genuinely is full of people who own businesses, and that is not a statistical artefact: concentrated equity in a single enterprise, held with leverage, is about the only asset an ordinary person can hold at enough concentration to reach an extreme outcome. But that is precisely why it produces both tails, and the wealth surveys only contain the businesses that are still there. You are looking at the survivors and inferring a return.\n\nMoskowitz and Vissing-Jorgensen is the corrective, and it is the more useful of the two papers for anybody deciding. If the return to a concentrated, illiquid, undiversified stake in one business is not clearly above what a diversified public portfolio pays, then on average the risk is not being compensated. That does not mean nobody should do it. It means the case cannot be made on expected return, and anybody making it on expected return is either quoting the survivors or has not looked.\n\nSo the decision has to be made on the shape of the distribution rather than its mean, and the shape has two features that matter. The upside is unbounded and is the reason the strategy exists. The downside includes a substantial probability of losing everything you put in, and for most entrants it also includes losing the income the household was living on, because in a small business the equity and the earnings and often the borrowing are one exposure. That is the negative hedge from earlier in this track taken to its logical end: your capital, your labour income and your debt all correlated with the same single outcome.\n\nWhich is why the only honest instruction is about the downside, and it is a number rather than a plan. What can you lose entirely without changing where you live or how your children are schooled, and how long can the household run on the other earner. Those two figures are computable in an afternoon, they are the only part of the distribution you control, and a venture sized inside them can fail without taking anything else with it.",
  failureMode: "Nineteen months, the savings, the offset account and the second earner's patience, and it closes. The venture failing was always a likely outcome and it was a survivable one. What made it not survivable was that the capital, the income the household was living on and the loan were all bets on the same thing, so all three resolved in the same fortnight and there was nothing left uncorrelated to land on.",
  worked: "The instruction is two numbers written before anything starts:\n\n\"Before starting or buying anything, we write down the amount whose complete loss would not change where we live or how the children are schooled, and the number of months this household could run on the other earner's income alone. Nothing goes in above the first figure and nothing starts unless the second is at least twelve.\"\n\nAnd the clause that keeps the exposures apart:\n\n\"The buffer for the household does not sit in the business, is not lent to the business, and is not security for anything the business borrows.\"\n\nWhat is deliberately absent is any expected return, any valuation and any milestone. Not because those are worthless, but because they are the part of the exercise that gets done enthusiastically and the downside sizing is the part that does not. A venture inside these two numbers can fail on schedule and leave the household intact, which is the only version of this bet you get to take more than once.",
  experiment: "Compute the two numbers today, whether or not you are considering anything. The total loss your household could absorb without changing housing or schooling, and the months it could run on one income. Then look at any concentrated position you already hold, including employer equity and a business you already own, and check whether it sits inside the first number and whether your buffer is genuinely independent of it.",
  reflection: "What are your two numbers, and does anything you currently hold sit outside them?",
  recall: {
    q: "Business owners are over-represented at the top of the wealth distribution. Why is that not an argument for starting a business, and what is the argument it does support?",
    a: "Because the wealth data is conditional on survival. It contains the businesses that still exist, and failure among new businesses is common, so the concentration at the top describes the winners rather than the return facing an entrant. Moskowitz and Vissing-Jorgensen sharpen the point by finding that the return to holding private equity in a single business is not clearly above public equity despite far more idiosyncratic risk, which means the case cannot honestly be made on expected return at all.\n\nWhat the concentration does support is that a single concentrated leveraged stake is one of the few positions an ordinary household can hold with enough concentration to reach an extreme outcome, and that produces both tails rather than one. The consequence is to decide on the downside, because in a small business the capital, the household's labour income and the borrowing are typically one exposure that resolves at the same moment. Two computable numbers control that: the loss that would not change housing or schooling, and the months the household could run on the other earner."
  },

{
  id: "income-when-not-to-optimise",
  track: "income", level: "judgement",
  title: "There are three checkable conditions under which working on your income is the wrong thing to be doing",
  source: "Named practice rather than a paper: naming the conditions under which the marginal hour has a higher-value use than raising earnings, read against what the rest of this track can and cannot establish",
  gateIntro: "The step up is available and it would cost two evenings a week and most of a Sunday for at least a year. Your eldest is eight. You have had two increases in the last three years, both arrived, and you could not now say what either of them changed about anything you own. The conversation is on Monday and you have already told your partner you want it.",
  gatePrompt: "Write the three questions you would answer in writing before Monday, and the rule that says what you do if any of the answers comes back badly.",
  evidence: "No trial. No experiment could answer this one either, because the question is what a particular hour is worth to a particular person rather than what an intervention does on average. What this track can supply is the raw material, and one observation in it is load-bearing: the acts that actually move your earnings are few and infrequent. Knowing the outside price of your role, holding a figure in an offer conversation, keeping the fragile half of a skill alive, and not leaving the growth rate to the review cycle. That is a handful of hours a year, not a practice that expands to fill a life. If the high-value acts on the large asset are that cheap, then spending every spare hour on income is not more of a good thing, it is a different thing with nothing behind it. Everything below is craft: three conditions, tested by nothing, offered because they are answerable rather than because anybody has established them.",
  replication: "craft",
  idea: "Beyond a small budget of hours the returns to working on income fall away sharply, and there are three conditions you can check that say the marginal hour belongs somewhere else.",
  why: "The first condition is that the savings rate is the binding constraint rather than the income. If additional earnings have historically been absorbed into your baseline, then more of them produces more spending and a finish line that moves away from you, and the honest reading is that the constraint is capture rather than earnings. This one is answerable from your own records: look at what your last two increases did to what you own, and if you cannot identify anything, income is not currently the scarce input.\n\nThe second is that your human capital is depreciating faster than your earnings are rising. The additional hours you would spend chasing income are not neutral hours. If they go into work that consumes the fragile half of your skill without renewing it, you can raise this year's earnings while lowering the price the market would pay for you in five, and that trade is invisible for exactly as long as you stay put. Answerable too: name the top item on your fragile list and say when you last used it on something real.\n\nThe third is a time-limited claim on the hour that money cannot substitute for. A child's particular age, a parent's remaining years, a relationship, your own health. These are not a soft addendum to a wealth site, they are a category error the site would be committing by omitting them, because the claim is non-substitutable and the window closes on a schedule you do not set. A dollar deferred to next decade is nearly as good. A year with an eight-year-old deferred to next decade does not exist. That is answerable in the only sense that matters: you can name the window and how much of it is left.\n\nAnd then the guard, because this is the most available excuse in the whole track. Every one of these three conditions can be recited by somebody who has never had an outside conversation, never negotiated, and never scheduled an hour of maintenance, and in that person's hands the reasoning is a licence rather than a judgement. The test is only available once the four cheap acts are actually running. If they are not, the answer is not that income is the wrong thing to work on. It is that you have not yet spent the handful of hours that would let you decide.",
  failureMode: "Three years of pursuing the step up, during which your savings rate fell because each increase raised the baseline, the top item on your fragile skill list went untouched, and your eldest went from eight to eleven. The step up arrived. In real terms the balance sheet is roughly where it started, and the three years are not returnable in the way the money would have been.",
  worked: "The instruction is three written answers and a stop rule:\n\n\"Once a year, and before any decision that would cost me evenings for a year, I write three answers. What my last two increases changed about what I own. When I last used the top item on my fragile skill list on something real. What time-limited claim on my hours is currently running and how much of it is left.\"\n\n\"If the first answer is nothing, this year's work is capture rather than income. If the third names a window closing inside five years, this year's income work is the four scheduled acts and nothing beyond them.\"\n\nWhat is deliberately absent is any statement of what the right answer is, because there is not one and anybody claiming otherwise is selling something. The instruction only forces the three answers to exist in writing before the decision, which is the difference between a judgement and a mood.",
  experiment: "Write the three answers today, before Monday's conversation rather than after it. One sentence each, and the first one has to name an actual account or asset rather than a feeling. Then read them together and notice whether the decision you had already made survives all three, because the value of this exercise is entirely in doing it before the decision rather than justifying one afterwards.",
  reflection: "Which of the three answers came back worst, and had you already decided before you wrote it?",
  recall: {

    a: "It is a judgement only when the cheap acts are already running. Knowing the outside price of your role, holding a figure in an offer conversation, maintaining the fragile half of your skill, and not leaving your growth rate to the review cycle cost a handful of hours a year between them. Somebody who has done none of those and recites the three conditions is using them as a licence, because they have not yet spent the hours that would let them decide.\n\nThe hardest to argue with is the time-limited claim, because it is the only one that is not substitutable. Money deferred to the next decade is very nearly as good as money now, and a year with a child at a particular age deferred to the next decade does not exist at all. The other two conditions, whether additional earnings were ever captured and whether the skill is decaying faster than the pay is rising, are answerable from your own records, which is what makes all three usable despite there being no evidence whatever behind the framing."
  },

<script>
/* Track: Shocks, windfalls and ruin. Ordered foundational first.
 *
 * The accumulation you never make is the one that gets erased, and the events
 * that do the erasing are a short list: income stopping, health failing, a
 * household splitting, and money arriving all at once. The evidence about what
 * actually happens comes first, then the instructions, because every

(window.LESSONS = window.LESSONS || []).push(
{
  id: "shocks-windfall-postpones-ruin",
  track: "shocks", level: "judgement",
  title: "A large win postpones bankruptcy by about two years and does not make it any less likely",
  source: "Hankins, Hoekstra and Skiba, The Ticket to Easy Street? The Financial Consequences of Winning the Lottery (Review of Economics and Statistics, 2011)",
  gateIntro: "Someone in your family has just been paid out. It is a redundancy settlement worth about eighteen months of their salary, it landed on a Thursday, and by Saturday they have sent you a photograph of a caravan. They are not reckless and they are not stupid, and their credit card has carried a balance for three years. At the barbecue they ask you what they should do with it, and everybody at the table has a view.",
  gatePrompt: "Write the instruction you would give them, phrased so that it names one payment the money could remove rather than one thing it could buy.",
  evidence: "Florida lottery winners linked to personal bankruptcy filings, comparing people who won a large prize against people who won a small one in the same lottery. That comparison is the design's whole value, because everybody in it bought a ticket, so the two groups differ in the size of the prize rather than in whatever makes a person play. Large winners, at prizes in the tens of thousands to the low hundreds of thousands of dollars, were less likely to file in the first couple of years after the win and more likely to file over the following few, and the cumulative filing rate across the whole window was indistinguishable between the groups. Large winners who did file arrived at the filing looking much like small winners who filed, which the authors read as the money having been spent rather than used to retire what was owed. One state, one lottery, and one very coarse outcome: bankruptcy is a legal event with its own thresholds rather than a measure of financial health. The prizes are also large against annual income and small against lifetime wealth, so nothing here speaks to what a genuinely life-changing sum does.",
  replication: "single",
  idea: "A windfall arrives on the balance sheet and what failed was the income statement, so the money buys a known number of months and then the clock starts again.",
  why: "A stock and a flow are different objects and the failure being averted is a flow failure. Insolvency is what happens when obligations arriving each month exceed money arriving each month for long enough. A lump sum raises the level of the pond without changing the rate at which water leaves it, so what it buys is the lump divided by the monthly gap, in months, and at the end of those months the gap is the same gap it always was.\n\nIn one respect it is worse than neutral. Committed spending ratchets, and the things people buy when a large sum arrives tend to arrive with recurring costs attached: registration, insurance, maintenance, a bigger place, help for a relative that becomes a monthly help. So a non-recurring receipt gets converted into a permanently higher outflow, which is precisely the signature you would expect to produce a couple of quiet years followed by more filings rather than fewer.\n\nWhich makes every windfall question a flow question first, and there are only three answers that change the flow. Retire a debt whose repayment was part of the outflow. Buy something that produces income. Replace something whose failure would have created an outflow you cannot absorb. Everything else is time, and time is worth having, but it should be bought knowingly and counted in months rather than felt as relief.",
  failureMode: "A ninety thousand dollar payout covers a household's monthly shortfall for about fourteen months. In month fifteen the shortfall is the same shortfall, the card balance is back where it started, and the only durable changes are that the payout is gone and there is a caravan on the driveway costing several hundred dollars a year to register before anybody has towed it anywhere.",
  worked: "The instruction is an order of operations, and it gets written before any money arrives:\n\n\"Any unexpected sum over $5,000: before deciding anything, I write down my monthly money in and my monthly money out, and the first call on the money is whichever outflow it can remove permanently.\"\n\nWhat is deliberately absent is any target for the money and any mention of what it could buy. The question is not what to do with the lump. It is which recurring payment the lump can delete, because deleting a payment changes the flow and every other use of the money changes only the level.\n\nIf the honest answer is that no outflow can be removed, then the instruction says so out loud: the money is buying months, here is how many, and here is the date they run out.",
  experiment: "Take the last unexpected sum you received of any size, a tax refund or a bonus or a rebate or a settlement, and work out where it went. Most people can account for the first third and not the rest. Then write your current monthly inflow and outflow on the same page and identify the one recurring payment that a lump could permanently remove. That payment is your answer to the next windfall, decided in advance of it.",
  reflection: "Where did the last unexpected money you received actually go, and could you account for all of it?",
  recall: {
    q: "Large Florida winners were less likely to go bankrupt for a couple of years and more likely afterwards. What does that pattern tell you about what the money did?",
    a: "That it bought time rather than solvency. Insolvency follows from a gap between obligations arriving each month and money arriving each month, and a lump sum covers that gap for as long as it lasts without changing its size. Cover the shortfall for two years and filings fall for two years. Run out and they resume.\n\nThe cumulative filing rate over the whole window was indistinguishable between large and small winners, and the large winners who did file looked much like the small winners who filed by the time they got there. A lump also tends to raise the outflow, because the things people buy with a windfall carry recurring costs, which is how a one-off receipt becomes a permanently higher run rate."
  },
  deepDive: "I have an unexpected sum arriving and here is my monthly income and my committed spending. Tell me which recurring payment it could permanently remove, and what it costs me to spend it on anything else instead."
},
{
  id: "shocks-buffer-stock-target",
  track: "shocks", level: "standing",
  title: "Saving behaves like a buffer aimed at a target, which makes the refill after a shock the part worth automating",
  source: "Christopher Carroll, Buffer-Stock Saving and the Life Cycle/Permanent Income Hypothesis (Quarterly Journal of Economics, 1997)",
  gateIntro: "The hot water system went in June and took two thousand three hundred dollars out of the account you keep for exactly that. It worked. The account did the job it was there to do. It is now September, the balance is still short by the whole amount, and you have not thought about it once since the plumber drove away.",
  gatePrompt: "Write the instruction that refills the account without you having to notice that it is low, including the condition that starts it and the condition that stops it.",
  evidence: "A theoretical model matched against United States household data rather than an experiment, which is the first thing to know about it. Carroll shows that a consumer who is impatient and faces income risk they cannot insure does not accumulate toward a retirement target at all; they hold a target ratio of liquid wealth to permanent income, saving hard when they are below it and letting it drift when they are above. The model reproduces features of the data that the frictionless permanent-income model gets wrong, including the hump in consumption over the life cycle and the very low wealth of younger households. What it is not is an identified causal estimate. The target is a model object nobody observes directly, the impatience and income-risk parameters are fitted rather than measured, and the class of model has been extended in many directions since without a single decisive test of the target itself.",
  replication: "single",
  idea: "Your buffer has a resting level rather than a destination, so what a shock actually costs you is the correction, and the correction is what nobody schedules.",
  why: "The content of the model is that the amount of cash you hold is not a goal you are travelling toward but a level you return to. Saving is error correction around a ratio rather than monotone accumulation: above the line you let it slide, below it you push back. Most people recognise the description immediately once it is pointed at, which is the main reason to trust a calibration this heavily.\n\nThe part that matters here is what error correction needs in order to run. It needs the error to be noticed. Pushing back happens through spending less, which is a diffuse behaviour spread across a few hundred small decisions, and every one of those decisions depends on you registering that the balance is low. A shock is loud exactly once. It is loud on the day of the tradesman's invoice and silent for every month afterwards, and the silent months are when the refill was supposed to happen.\n\nSo the install is to take the correction out of the diffuse channel and put it in a scheduled one. The level already exists, whether or not you have written it down. Write it down, then arrange for the system rather than your attention to be the thing that notices a balance below it. In the months when nothing has gone wrong the rule costs nothing and does nothing, which is the property you want, because those are most of the months.",
  failureMode: "The buffer absorbs a two thousand three hundred dollar repair in June and is never refilled, so an account that held five months of fixed costs in May holds four in September and three by the following winter. Nothing went wrong. Each individual month simply had somewhere better for the money to go, and the level ratcheted down through three shocks across two years until the fourth one landed on a credit card.",
  worked: "Two clauses, and the second one is the entire entry:\n\n\"Hold the buffer at $18,000. In any month the balance is below $18,000, the automatic transfer that normally goes to investments goes to the buffer instead, and it switches back the month the buffer is whole.\"\n\nWhat is absent is any judgement about whether the withdrawal was justified. The rule does not ask why the balance fell and it does not distinguish a hot water system from a weekend away. That is deliberate, because a rule with a judgement in it requires somebody to make the judgement, and the reason the buffer is not being refilled is that nobody is looking at it.\n\nIf your bank will not switch a transfer conditionally, the manual approximation is one monthly reminder that opens the account and asks a single question, which is whether the number in front of you is below the number you wrote down.",
  experiment: "Find the real balance of whatever account is doing buffer duty and write it beside the level you think it should hold. If those two figures differ, work out which shock did it and what month that was. The gap between that month and today is how long your refill has been waiting on your attention, and it is usually longer than people guess. Then set the redirect rule, or the monthly check if your bank cannot do conditions.",
  reflection: "How far below its level was the buffer, and which shock had taken it there?",
  recall: {
    q: "Buffer-stock saving says households hold a target ratio of liquid wealth to income. Why does that make the refill rather than the balance the thing to automate?",
    a: "Because in the model the buffer is a resting level rather than a destination. Below it the precautionary motive pushes saving up and above it impatience pulls it down, so the behaviour is error correction around a ratio instead of steady accumulation. The balance immediately after a shock is not the problem. The correction that is supposed to follow is.\n\nAnd the correction runs through spending less, which is diffuse and depends entirely on you registering a low balance. A shock is loud on the day and silent afterwards, so the registering is exactly what fails. A rule that redirects an existing transfer until the buffer is whole replaces the noticing with a condition, and costs nothing in the months when nothing has happened."
  },
  deepDive: "Here is my income, my fixed costs and the balance of the account I use as a buffer. Tell me what level it should hold and write me the redirect rule that refills it without me deciding anything."
},
{
  id: "shocks-derive-your-own-runway",
  track: "shocks", level: "standing",
  title: "Three to six months of expenses is a rule with no trial behind it, and your notice period gives you a better number",
  source: "The three-to-six-months emergency fund rule as it appears in consumer financial guidance, against the arithmetic of fixed costs, notice period and time to replacement income",
  gateIntro: "There is twelve thousand dollars in the account you think of as the emergency fund and you cannot remember how you arrived at twelve. Somebody said three to six months once, years ago, and it sounded about right. Your employment contract has a notice clause in it that you have not read since the day you signed it, and it is in a folder on a drive you would have to go looking for.",
  gatePrompt: "Write the instruction that sets the buffer to a number you derived rather than a number you inherited, with the two figures you multiplied together stated in it.",
  evidence: "No trial. The three-to-six-months figure is guidance rather than a finding: it appears across consumer education material, regulator pages and bank marketing with no study attached, and there is no randomised or quasi-experimental work establishing that a household holding three months of expenses fares better than one holding two or five. What is evidenced is adjacent and weaker than it sounds. Households with little liquid wealth show much larger consumption responses to income shocks and much higher rates of reported hardship, which supports holding a buffer and says nothing at all about how big it should be. The distribution of unemployment durations is also wide and strongly occupation-specific, so a single multiple of expenses cannot be right for everybody by construction. Notice what this entry is doing: asserting an absence of evidence, which is a claim about a literature rather than a result from one, and offering arithmetic in place of the missing trial rather than better evidence.",
  replication: "craft",
  idea: "The buffer you want is your fixed costs multiplied by the months between your last pay and your first replacement payment, and both of those figures are documents you already own.",
  why: "The rule multiplies the wrong quantity. Expenses for most households include a large discretionary component that stops in the same week income stops, because the second car sits still, the restaurants end and the holiday deposit does not get paid. A buffer sized on total spending is therefore sized for a month you will not be having. What has to be covered is the set of payments that arrive whether or not you are working: rent or mortgage, insurance, utilities, groceries, school fees, minimum repayments on anything owed.\n\nIt also multiplies by a duration nobody derived. The interval that matters is not a round number of months, it is the distance between your final pay and the first payment that replaces it, and that distance has components you can look up rather than guess. Your notice period. Any accrued leave paid out on exit. The waiting period on anything you hold that pays you when you cannot work. How long your last search actually took, which is the only number in the list with your own history behind it. Some of those shorten the interval and some lengthen it, and the answer is specific to you in a way that no multiple of expenses can be.\n\nDeriving it buys something larger than accuracy. A figure you computed from your own contract is one you can defend against yourself in a month when you would rather spend it, and a figure you inherited from guidance is not. The real failure of the three-to-six rule is not that it is wrong, because it is often close. It is that it belongs to nobody, and a number that belongs to nobody is soft the first time it is tested.",
  failureMode: "Twelve thousand dollars in an account you believe holds six months. Your fixed costs turn out to be four thousand one hundred a month, so it is under three, and your notice period is four weeks against a search that took you five months the last time you ran one. You have provided for roughly half the interval your own history says to expect, and you will find out which figure was right during the week you find out everything else.",
  worked: "One arithmetic sentence, then a transfer:\n\n\"My buffer is my fixed monthly costs times the months between my last pay and my first replacement payment. Fixed costs are rent, insurance, utilities, groceries, school fees and minimum repayments, which is $4,100. The interval is one month of notice plus the four months my last search took, so five. The buffer is $20,500, and the transfer that fills it is $500 the day after each pay until it gets there.\"\n\nWhat is deliberately absent is any allowance for discretionary spending, which the written cut order deals with instead, and any rounding up for comfort. The number is meant to be defensible rather than reassuring, and on this one those two properties pull in opposite directions.\n\nThe transfer is in there because a derived number with no instruction attached is a diary entry.",
  experiment: "Do the two lookups today. Both are documents you already have. Open your last three bank statements and add up only the payments that would still arrive if you stopped working on Friday. Then open your employment contract and read the notice clause, which takes about a minute and which most people have never done twice. Multiply the first figure by the second plus however long your last job search really took, and write the result beside what the account currently holds.",
  reflection: "What was your actual fixed monthly cost, and how far was it from what you had been assuming?",
  forecast: { q: "Will the buffer account hold the number I derived today, or more, in ninety days?" },
  recall: {
    q: "A derived buffer and the three-to-six-months rule often produce similar figures. Why is the derived one still better?",
    a: "Because the rule multiplies total expenses by a duration nobody derived, while the derived version multiplies the payments that arrive whether or not you are working by the actual interval between your last pay and your first replacement payment. Discretionary spending stops when income stops, so sizing a buffer on it provides for a month you will not be having, and the interval has components you can look up: notice period, leave paid out on exit, waiting periods on anything that pays you when you cannot work, and the length of your last search.\n\nThe second reason is ownership. There is no trial behind three to six months, and a figure inherited from guidance is one you will argue yourself out of in a month when you want the money for something else. A figure you computed from your own contract is one you can hold the line on."
  },
  deepDive: "Here are my fixed monthly costs, my notice period, my leave balance and how long my last job search took. Derive my buffer number, then tell me what it is that this number does not provide for."
},
{
  id: "shocks-pre-decided-cut-order",
  track: "shocks", level: "standing",
  title: "The order in which spending gets cut has to be written before income stops, because during the event you will cut nothing",
  source: "Pre-commitment and if-then planning applied to household spending, and the operational practice behind redundancy and financial hardship checklists",
  gateIntro: "Your area was restructured on a Tuesday and three people who sit near you were gone by Friday. Nothing has happened to you. You spend the weekend running numbers in your head at three in the morning, and by Monday you have concluded that if it comes to it you will cut back, which is the same phrase you used the last time a round of this went through.",
  gatePrompt: "Write the first three lines of the list, in the order you would actually run them, with a dollar amount or a phone call beside each one.",
