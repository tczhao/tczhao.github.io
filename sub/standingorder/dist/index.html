{
  id: "rate-savings-rate-dominates",
  track: "rate", level: "judgement",
  title: "Years to a target balance is set mostly by your savings rate, because the rate moves the finish line as well as the balance",
  source: "The annuity accumulation formula applied to a target written as a multiple of annual spending, which is standard algebra rather than anybody's finding",
  gateIntro: "A colleague has sent you a spreadsheet with one cell shaded yellow and labelled expected annual return. They have put eight percent in it. You think five is closer to honest. Twenty minutes of lunch goes into that argument. Neither of you touches the row three lines above it, which holds the amount that leaves your account on the fifteenth of each month and has not been changed since 2022. The file is still open in front of you and the cursor is in the yellow cell.",
  gatePrompt: "Write the instruction that changes the cell you actually control: the amount, the day it runs, and the account it lands in.",
  evidence: "No trial. This is the annuity accumulation formula with the target written as a multiple of annual spending, and it is arithmetic you can reproduce in a spreadsheet in about five minutes rather than a result anybody measured. It cannot tell you what rate is achievable for you, whether today's spending is a fair proxy for the spending you will have later, or what real return to assume. It only says how the terms trade against one another once you have supplied them, and every one of those inputs is doing more work than the formula is.",
  replication: "craft",
  idea: "Raising the savings rate shortens the horizon twice over, because it adds capital faster and lowers the amount of capital required at the same moment.",
  why: "Write the target as a multiple of annual spending rather than as a dollar figure and the double effect falls straight out. If you save some fraction of income you spend the rest, so the target is proportional to one minus the rate while the annual contribution is proportional to the rate. The number of contribution-years you need is therefore the multiple times one minus the rate, over the rate. At a tenth of income saved that factor is nine. At three tenths it is a shade over two. Tripling the rate cuts the contribution-years required by close to a factor of four, and no return has been credited yet.\n\nThe return then discounts that number and it compounds, so on a long enough horizon it wins. The honest claim is not that returns do not matter. It is that the two terms are different kinds of object. One is a decision you make on a Tuesday afternoon and can revise next month. The other is a draw from a distribution whose mean you will not know until the horizon has already passed, and which no amount of attention on your part will move. Arguing about the second is arguing about the width of a band you do not set.\n\nWhich leaves a rule that is stronger than it sounds. Plan against the rate, because it is the term you choose, and treat the return as a range you test the plan against rather than a number you pick. If the plan works at eight percent and fails at four, the assumption doing the work was never about markets. It was that you would save more than you are saving, and the return cell was quietly carrying that shortfall for you.",
  failureMode: "Three years of reading about asset allocation to add an expected point of return to a balance of ninety thousand dollars, which is nine hundred dollars a year. Over the same three years the transfer stayed at four hundred a month when it could have been six hundred, which was two thousand four hundred dollars a year forgone. The allocation work was real and it was worth roughly a third of the increase you did not make.",
  worked: "This one is a rule about what you are allowed to plan against, and then a transfer:\n\n\"State the plan as a savings rate written down as a percentage of gross pay, and re-run it at three percent real and at seven percent real. If it only works at the top of that band, raise the rate rather than the assumption.\"\n\n\"Increase the standing transfer to fifteen percent of each pay from next cycle, and do not touch the return cell for twelve months.\"\n\nWhat is deliberately absent is a chosen return. The plan has to survive a band rather than rest on a point estimate, because a point estimate is exactly where an optimistic assumption goes to hide. The twelve month freeze on the return cell is there because that cell is the one that is fun to adjust, and adjusting it feels like progress while changing nothing at all.",
  experiment: "Open whatever plan you have, in a spreadsheet or in your head, and find the return assumption. Set it to three percent real and see what breaks. Then replace the savings rate with what you actually saved last month against gross pay, not what you intend to save. Most people find that the plan was resting on an optimistic return and an aspirational rate at the same time, and that the two errors had been covering for each other for years.",
  reflection: "What return was your plan assuming, and what rate were you actually running last month?",
  recall: {
    q: "Why does raising the savings rate shorten the horizon by more than the extra contributions on their own would explain?",
    a: "Because the target is defined by your spending, and spending is what is left after saving. Raising the rate increases the annual contribution and shrinks the multiple of spending you have to reach, so the numerator falls while the denominator rises. The contribution-years required fall as one minus the rate over the rate, which is why going from a tenth to three tenths cuts them by around four rather than three.\n\nThe consequence is that the rate is the only term acting on both ends of the problem. The return acts on one end and you do not set it, so a plan that fails at a conservative return assumption is almost always telling you something about the rate instead."
  },
  deepDive: "Here is my gross income, my actual spending and what I transfer each pay. Compute my real savings rate, then show me how many years the plan moves if I raise the rate by five points, against how many it moves if the real return comes in two points under what I assumed."

{
  id: "rate-contributions-dominate-early",
  track: "rate", level: "annual",
  title: "For most of a working accumulation the balance is mostly money you put there, not money it earned",
  source: "The annuity accumulation identity, comparing cumulative contributions against cumulative earnings; arithmetic rather than a study",
  gateIntro: "Your super statement arrives and the line you go to first is investment earnings, because that is the interesting one. It says something in the low thousands. Two lines above it, employer contributions says something noticeably larger, and you have never put those two figures side by side. You are thirty-six. The fund has enclosed a form offering you a choice between two investment options, each with a different fee and a page of risk language, and the form is due in three weeks.",
  gatePrompt: "Write the annual instruction that decides, in order, which of contributions, fees and investment option you look at first and when you stop.",
  evidence: "No trial. Run the annuity sum with a level annual contribution and a constant real return and ask when accumulated earnings first exceed accumulated contributions. It is one equation, the contribution cancels out of it entirely, and the answer lands around the twenty-seventh year at a five percent real return, out past year forty at three percent, and around year twenty at seven percent. What the identity assumes away is everything real: contributions that rise with pay, returns that arrive in a sequence rather than as an average, fees, tax and withdrawals. It is a rough map of when the balance stops being mostly deposits, not a projection of anybody's account.",
  replication: "craft",
  idea: "Cumulative earnings only overtake cumulative contributions decades in, so for the first stretch of an accumulation the decisions worth your attention are the ones about how much goes in.",
  why: "The crossover calculation has a property that makes it unusually trustworthy: the size of the contribution drops out. Both sides scale with it, so what remains is an equation in the return and the number of years alone, and the answer is the same for someone putting in two hundred dollars a month and someone putting in five thousand. At a five percent real return the accumulated earnings pass the accumulated deposits somewhere around year twenty-seven. Almost everybody guesses much earlier.\n\nSo there is a long opening phase in which the balance is largely a record of your own deposits with a return decorating them. During that phase a point of extra return applies to a small balance while a point of extra savings rate applies to your entire income, and the second is larger by a wide margin. The ordering reverses later and reverses permanently, which is why the same person should be paying attention to different things at forty and at sixty.\n\nThe trap is that the return is the more interesting object from day one. Performance tables, option comparisons and allocation arguments are all available, all engaging, and all applied to a balance too small for any of them to move much. The contribution decision is dull and it is the one with the leverage. What the arithmetic buys you is permission to make the dull decision once a year and to stop feeling that ignoring the interesting one is negligence.",
  failureMode: "Two option switches in four years chasing half a percent on a balance of eighty thousand dollars, which is four hundred dollars a year, while the contribution rate sits at the legislated minimum for the entire period. One extra percent of a hundred thousand dollar salary would have been a thousand dollars in the first year and more in every year after, because it grows with your pay and half a percent of a small balance does not.",
  worked: "An annual instruction, and the ordering is the instruction:\n\n\"Every year in July, in this order: check the contribution rate and raise it if it can be raised, then look at fees, then look at the investment option. Stop after twenty minutes whether or not I have got to the third one.\"\n\nAll three are worth doing and they are not worth equal attention. Left alone, attention flows to the third, because that is the one with a chart attached and a form to fill in. Naming the order means the twenty minutes gets spent at the top of the list. The hard stop is there so the exercise stays small enough to actually recur, and because the third item is where an afternoon disappears without changing anything.",
  experiment: "Find your most recent super or brokerage statement and put two figures next to each other: total contributions for the period, and total investment earnings for the period. Whichever is larger tells you which lever you are currently standing on. If contributions are larger, and mid-career they usually are, then this year's decision is a contribution decision and you can close the performance table without guilt.",
  reflection: "Which figure was larger on your last statement, and which of the two had you been reading about?",
  forecast: { q: "Will I raise my contribution rate before I next change my investment option?" },
  recall: {
    q: "Why does the point where accumulated earnings overtake accumulated contributions not depend on how much you contribute?",
    a: "Because both sides scale linearly with the contribution. Cumulative deposits after some number of years are that number times the annual amount, and the balance is the same amount times the annuity factor, so the contribution cancels and what is left is an equation in the return and the years alone.\n\nWhich is why the answer sits so much further out than people expect: around the twenty-seventh year at a five percent real return, past forty at three percent. For most of a working accumulation the balance is a record of deposits, so the deposit is the term worth attention first."
  },
  deepDive: "Here is my balance, my annual contributions and the fee I pay. Work out where my own crossover point falls, and tell me whether changing investment option this year would move more or less than a two point rise in my contribution rate."

{
  id: "rate-residual-inversion",
  track: "rate", level: "standing",
  title: "Saving what is left over guarantees a variable savings rate, because a residual absorbs every shock in the budget",
  source: "Pay-yourself-first practice in retail banking and household budgeting, and the accounting identity underneath it",
  gateIntro: "It is the twenty-ninth. Pay landed on the fifteenth, and the plan on the fifteenth was to move whatever survived to the end of the month across to savings. What has survived is sixty-two dollars. Last month it was four hundred and ten. The month before that it was nothing at all, because the car needed two tyres. None of those three months contained a mistake. You are sitting with the transfer screen open and sixty-two dollars in mind.",
  gatePrompt: "Write the instruction that fixes the order rather than the amount, including what happens in a month when it does not fit.",
  evidence: "No trial. Pay-yourself-first is universal advice with no experiment isolating the ordering, and the strongest thing that can be said for it is that the identity behind it is not in dispute and that payroll deduction schemes, which are the institutional version of the same ordering, do show high persistence. What has not been established is how much a household's total saving actually rises when the order is reversed, as opposed to how much of it merely becomes predictable. Predictability is a real benefit and it is a smaller claim than the one usually made.",
  replication: "craft",
  idea: "Income equals spending plus saving, so one of the three is discovered rather than chosen, and choosing which one is the only real decision the identity allows.",
  why: "Income equals spending plus saving. That is an identity, not a theory, so any two of the three fix the third. What a household actually decides is which two it sets and which one it finds out about afterwards, and almost everyone finds out about the saving. The consequence is arithmetic rather than psychological. The discovered term inherits the entire variance of the other two, so every unexpected bill, every good weekend and every month with three birthdays in it lands on that term in full.\n\nReverse the order and the variance moves with it. Set the saving first and spending becomes the quantity you discover, and spending turns out to be surprisingly compressible when it has to be. This is not a claim that people can live on arbitrarily little. It is a claim about where the slack sits. A household running a fixed transfer finds the month's adjustment somewhere inside the part of its outgoings that was always flexible, without ever making an explicit decision about which part.\n\nThe second effect is measurement, and it matters more than it looks. A residual savings rate cannot be planned against, because you do not know it until the period has closed. Any horizon computed from it is a guess about a quantity nobody is controlling. A set rate is known in advance, which makes every other number downstream of it computable. You cannot forecast off a residual, and a plan built on one is a plan built on last month's weather.",
  failureMode: "A year of saving whatever survives produces four hundred and ten, then sixty-two, then nothing, then three hundred, then nothing, then ninety, and the twelve month total comes in under two thousand dollars. A flat two hundred a month across the same year would have been two thousand four hundred, and more usefully it would have been a number you could have built the rest of the plan on.",
  worked: "The instruction has to name the order and then defend it:\n\n\"Transfer $250 to the savings account the day after each pay lands, before any bill is paid, and if the month gets tight, take the shortfall out of the everyday account rather than reversing the transfer.\"\n\nThe second clause is the whole instruction. The first clause on its own is just a transfer, and a transfer with a reversal habit attached is a residual with extra steps. What actually makes spending the adjusting term is a standing rule that the transfer is not the thing that gives way.\n\nWhat is deliberately absent is any rule about what to cut when it is tight. That is on purpose. You do not decide in advance, because the household finds the slack somewhere different every month and it is better at that than any rule you would write now.",
  experiment: "Pull up your last three months of transfers into savings and write the three figures down. If the largest is more than about a fifth above the smallest, you are running a residual. Convert it today: take an amount at the low end of those three rather than the average, and set it as a fixed transfer dated the day after pay. The low end is the point. The number has to survive the worst of those three months without being touched.",
  reflection: "What were your last three months of saving, and how far apart were the highest and the lowest?",
  forecast: { q: "Will I get through the next three months without reversing or reducing the fixed transfer?" },
  recall: {
    q: "Why does a smaller fixed transfer beat saving the leftovers, even in months when the leftovers would have been larger?",
    a: "Because income equals spending plus saving is an identity, so whichever term is solved for last absorbs the variance of the other two. Leaving saving until last means every surprise in the month lands on it, and the resulting series averages down to whatever spending happened to permit.\n\nA fixed transfer moves that variance onto spending, which is where the compressible part of a household budget actually lives. It also makes the rate known in advance, and a known rate is the only kind you can compute a horizon from."
  },
  deepDive: "Here are my last six months of savings transfers and my pay dates. Tell me the largest fixed amount I could have run for all six months without a single reversal, and what that would have totalled against what I actually saved."

{
  id: "rate-gross-versus-net",
  track: "rate", level: "annual",
  title: "Most people compute their own savings rate wrong in both directions at the same time",
  source: "Household balance-sheet accounting: the distinction between a payment that reduces a liability and a payment that buys the use of somebody else's capital",
  gateIntro: "Somebody asks you at a barbecue what your savings rate is and you say about eight percent, because that is the transfer divided by your take-home pay and you did the sum standing up. On the drive home it occurs to you that you paid down eleven hundred dollars of loan principal last month, that your employer put twelve percent of your salary into super, and that neither of those appeared anywhere in the eight percent. It also occurs to you that you have no idea whether the fourteen hundred of interest belonged in there.",
  gatePrompt: "Write the annual instruction that fixes the definition: which lines go in the top, which go in the bottom, and which month you do it.",
  evidence: "No trial, because this is a definition rather than a finding. The balance-sheet test is the one national accounting bodies use in substance when they separate a reduction in liabilities from the purchase of a service, and it resolves every disputed line in a household budget consistently. What it cannot do is tell you which definition other people are using when they quote a rate, which is why comparing your number to a published average or to a colleague's is close to meaningless unless you know both definitions. Use it for your own series over time, not for comparison.",
  replication: "craft",
  idea: "Saving is the part of this period's income that ends the period as an asset you own or a debt you no longer owe, which puts loan principal and employer super in, and loan interest and market movements out.",
  why: "One definition settles every argument. Saving is the portion of this period's income that finishes the period as an asset you hold or a liability you have discharged. Run each line through that test and the disputes evaporate. A principal repayment discharges a liability, so it is saving. Interest buys the use of somebody else's money for a month and leaves nothing behind, so it is consumption in exactly the way rent is. An employer contribution to super is income you earned that happened to arrive already saved, so it belongs in both halves of the fraction. A capital gain on something you already owned is not saving at all, because it did not come out of this period's income.\n\nThe two common errors run in opposite directions and most people make both at once. Leaving out principal and employer contributions understates the rate, frequently by more than the entire voluntary transfer being counted. Counting the whole loan repayment, or counting a good year in the market, overstates it. Because the errors have opposite signs the net is unpredictable, which is worse than a bias. A consistently wrong number can at least be tracked.\n\nThe denominator gets chosen even more carelessly than the numerator. Measured against take-home pay, employer contributions are not in the bottom of the fraction, so counting them in the top inflates the result. Measured against total gross remuneration including super, both halves are consistent and the rate stays comparable across a pay rise, a change in tax rates and a change in the legislated contribution. That comparability is why gross is the better denominator, even though it produces a smaller and much less flattering number.",
  failureMode: "You believe you are saving eight percent when the balance-sheet figure is nearer twenty, conclude the horizon is hopeless, and stop planning entirely for two years. Or the mirror image: you count the whole loan repayment and a strong market year, believe you are at thirty-five, and the first flat year removes a saving that was never income in the first place. Both errors cost the same thing, which is a plan resting on a number that does not mean what you think it means.",
  worked: "One annual instruction with the contested lines named, because the argument is always about the same four:\n\n\"Every July, compute the savings rate as voluntary transfers, plus loan principal repaid, plus all superannuation contributions, divided by total gross remuneration including super. Exclude loan interest. Exclude market movements.\"\n\nThen write the answer next to last year's answer, in the same note.\n\nWhat is deliberately absent is any adjustment for offset balances, redraw, one-off bonuses or the value of the house. Every one of those is a place where the number can be improved by argument rather than by saving, and a metric you can argue with is a metric you eventually will.",
  experiment: "Compute it once, today, for the last twelve months. With a loan statement and a super statement in front of you it takes about fifteen minutes. The principal figure is the difference between the opening and closing loan balance, less any redraw. Put the result in a dated note somewhere you will find it. You will want last year's figure in a year and you will not be able to reconstruct it then.",
  reflection: "What was your rate before you added principal and super, and what was it after?",
  forecast: { q: "Will I compute this same number again, using the same definition, twelve months from now?" },
  recall: {
    q: "Why is a loan principal repayment saving while the interest on the same loan is not?",
    a: "Because saving is the part of this period's income that ends the period as an asset held or a liability discharged. Principal reduces the debt, so net worth rises by the amount paid. Interest buys the use of somebody else's capital for the month and leaves no balance-sheet trace, which makes it consumption in the same way rent is.\n\nThe same test settles the other disputed lines. Employer superannuation contributions are income that arrived already saved, so they belong in the top and the bottom of the fraction. A market gain on assets you already held is not saving, because it never passed through this period's income."
  },
  deepDive: "Here are my payslip, my loan statement and my super statement for the last year. Compute my savings rate on the balance-sheet definition and tell me how far my own estimate was off and in which direction."

{
  id: "rate-percent-not-dollars",
  track: "rate", level: "standing",
  title: "A savings rate is the only quantity in your plan that inflation cannot quietly erode",
  source: "The definitional property of a ratio of two nominal quantities measured over the same period, set against the way dollar targets and return assumptions each carry a hidden inflation term",
  gateIntro: "The figure in your head is a million dollars, and it has been a million dollars since you were twenty-eight. You are thirty-nine now. It survived the two years when everything got dearer at once, it survived three pay rises, and it survived the house you were pricing back then becoming a house you could not price now. The fortnightly transfer meant to get you there is still six hundred dollars, set in the same year as the figure. Your bank has just emailed asking whether you want to review your automatic transfers.",
  gatePrompt: "Write the instruction so that neither the amount nor the target needs revisiting when prices move.",
  evidence: "No trial, and none is needed, because this is a property of the arithmetic rather than a claim about behaviour. Saving over income in the same period puts the price level in both halves of the fraction, where it cancels. What is a behavioural claim, and is unsupported here, is that people actually re-index dollar figures if you leave them to it. The observation that they mostly do not is drawn from the fact that dollar targets survive for years without revision, which is an impression rather than a measurement, and you should treat it as one.",
  replication: "craft",
  idea: "A savings rate is a ratio of two nominal amounts measured over the same period, so the price level cancels out and the number keeps meaning the same thing without ever being revised.",
  why: "Every other quantity in a household plan carries an inflation term that has to be tracked, and most people track none of them. A dollar target is fixed in nominal terms and therefore shrinks in real terms every year it is left alone. A dollar transfer does the same. A return assumption is either nominal or real, the two differ by enough to move a horizon by a decade, and the label is frequently written down nowhere at all. A rate has none of this. It is this year's saving over this year's income, both in this year's dollars, and the units cancel.\n\nThe practical consequence is that a rate keeps working while nobody is paying attention, which is the property this whole site is organised around. Denominate the transfer as a share of pay and it rises with every increase, tracks prices to whatever extent your pay does, and never needs a review. Denominate it in dollars and it is a decision with a silent expiry date. Nothing will tell you when it passed.\n\nThe caveat is worth naming rather than skipping. A rate is inflation-neutral, not inflation-proof. If your pay lags prices then a constant share of a shrinking real income is shrinking real saving, and the target, which is a multiple of your real spending, has not moved to meet it. What the rate buys is not protection. It is one fewer number you have to remember to re-index, and how many things you have to remember is the constraint that actually binds.",
  failureMode: "A target set eleven years ago and never revised, chased by a transfer set in the same year. Both have been drifting the entire time and in opposite directions: the target has become easier to reach and less adequate once reached, while the transfer has become a smaller share of a larger salary. On paper nothing has changed. Neither number means what it meant when you wrote it.",
  worked: "The instruction is denominated in percent, with a named fallback for a bank that will not do percentages:\n\n\"Set the automatic transfer to twelve percent of each pay, and if the bank will only accept a dollar figure, set it to twelve percent of my current pay and add one line to the July checklist to recompute it.\"\n\nThe target gets the same treatment:\n\n\"State the target as a multiple of my current annual spending, and do not write the dollar figure down anywhere I will read it later.\"\n\nWhat multiple is a separate question and not this one. What is deliberately absent is any inflation forecast, because there is nothing here to forecast: both halves of a ratio are measured in the same year's dollars, so the adjustment happens without an assumption. That is the whole advantage, and it is worth more than a better forecast would have been.",
  experiment: "Check whether each of your recurring transfers is set as a dollar amount or a share of pay. Most banking apps only offer dollars, so do the two minute version: work out what percentage of your current gross pay each one represents and type that percentage into the transfer's description field so it travels with the instruction. Then take the dollar target you have been carrying around and convert it into a multiple of what you spend in a year.",
  reflection: "Was your transfer denominated in dollars or in percent, and when was the amount last set?",
  recall: {
    q: "Why does inflation leave a savings rate alone when it does not leave a dollar target or a return assumption alone?",
    a: "Because a rate is a ratio of two nominal quantities measured over the same period, so the price level appears in the numerator and the denominator and cancels. A dollar target is fixed in nominal terms and falls in real terms every year it is untouched, and a return assumption shifts by several points depending on whether it is stated in nominal or real terms, which often is not recorded anywhere.\n\nNeutral is not the same as protected. If your pay lags prices, a constant share of a shrinking real income is shrinking real saving against a target that has not moved. The gain is one fewer number to remember to re-index, and remembering is the thing that actually fails."
  },
  deepDive: "Here are my recurring transfers, my gross pay and the dollar target I have been carrying in my head for years. Convert all of it to percentages and multiples, and tell me what that target has actually been worth in each of the last five years."
},
{
  id: "rate-marginal-not-average",
  track: "rate", level: "standing",
  title: "The only savings rate available for a decision today is the one on money you have not received yet",
