  why: "The header exists because a single listener serves many sites and needs to know which one is wanted. That makes it the routing key, and it is entirely client-supplied. Three consequences follow. Routing can be steered toward backends the client should not reach, if any host value maps somewhere. Applications that build absolute URLs from the header will emit links and redirects pointing wherever the attacker chose, which is how password reset links end up on somebody else's domain. And caches keyed without the host, or keyed on it inconsistently, can serve one site's response for another's request.\n\nThe control is an explicit allowlist at the edge: a fixed set of known names, everything else refused rather than routed. This is the same default-deny argument as everywhere else, and the reason it gets skipped is that a catch-all is what makes adding a new hostname painless. The tell is the same as always: if adding a hostname requires no change at the edge, then the edge is accepting hostnames it has never been told about, and one of them will route somewhere interesting.",
  failureMode: "An attacker sends a request with a host header naming an internal service, and the edge routes it there because its rules match on path with a permissive default for unrecognised hosts. Alternatively they trigger a password reset with a host header pointing at their own domain, and the application emails the victim a link to the attacker's site containing a valid token.",
  experiment: "Send requests to your edge with three host headers: a name you do not serve, an internal service name, and a name with a port or trailing dot appended. Note which are refused and which are routed. Then grep your application for anywhere the host header is used to construct a URL. Twenty minutes.",
  reflection: "Can a new hostname be added to your estate without touching the edge configuration, and if so what is currently accepting it?",
  recall: {
    q: "Why is the host header dangerous, and what are its three failure modes?",
    a: "Because it is the routing key for virtual hosting and it is entirely client-supplied. Routing can be steered to backends the client should not reach; applications that build absolute URLs from it emit links and redirects to attacker-chosen domains, which is how reset tokens leak; and caches keyed inconsistently on it serve one site's response for another's request.\n\nThe control is an explicit allowlist at the edge with unrecognised names refused rather than routed to a default."
  },
  deepDive: "Test how my edge handles unexpected host headers and find everywhere my application builds a URL from the host header."
},
{
  id: "ingress-client-ip-is-a-header-downstream",
  track: "ingress", level: "wire",
  title: "Past the edge, the client address is a header, and everything downstream believes it",
  source: "RFC 7239, on the loss of transport-level source information at an intermediary",
  idea: "Terminating a connection at the edge destroys the real source address for everything behind it, so the client address downstream is whatever the edge chose to write down.",
  why: "This is a mechanical consequence rather than a misconfiguration. The edge opens its own connection to the backend, so the backend's transport-level peer is the edge, and the original address survives only as data in a header. That is fine, and it is the reason the forwarded header exists. What matters is how many things downstream consume that data without knowing it is data.\n\nThe list is longer than people expect and it spans teams. Rate limiters count against it. Geographic and fraud rules read it. Audit logs record it, which means the forensic record of an incident is built from a header. Allowlists for administrative access compare against it. Session binding, where a session is tied to the address that created it, is enforced on it. Each was written by someone who thought they were reading a network fact. And because the value is correct in the honest case, none of them has ever produced a wrong answer in testing. The mitigation is to derive it once, at a single trusted point, with correct hop counting, and to make that derived value the only one anything else may read.",
  failureMode: "An attacker defeats a rate limiter by varying a header field, appears to come from a permitted country by setting one, and writes a false address into the audit log for every request, all with the same trick. The controls are all functioning. They are reading a string that the edge was supposed to have made trustworthy and did not.",
  experiment: "Count the distinct places in your stack that consume a client address: rate limiting, logging, allowlists, session binding, analytics, fraud rules. For each, find out whether it reads the header directly or a value derived once at a trusted point. Twenty minutes.",
  reflection: "If the derivation of client address is wrong, how many controls break at once, and would any of them tell you?",
  recall: {
    q: "Why does the client address become untrustworthy behind an edge, and what is the mitigation?",
    a: "Because the edge terminates the connection and opens its own to the backend, so the backend's transport peer is the edge and the original address survives only as header data.\n\nMany controls then read that data as if it were a network fact: rate limiters, geographic and fraud rules, audit logs, admin allowlists, session binding. The mitigation is to derive the value once at a single trusted point with correct hop counting, and make that derived value the only one anything else reads."
  },
  deepDive: "Find every consumer of the client address in a stack I describe and tell me which read the raw header rather than a value derived at a trusted point."
},
{
  id: "ingress-smuggling-needs-a-reused-connection",
  track: "ingress", level: "wire",
  title: "Request smuggling needs two parsers and one reused connection, and you control the second",
  source: "James Kettle, HTTP Desync Attacks, 2019",
  idea: "Smuggling works when the edge and the origin disagree about where one request ends, and the damage requires the connection between them to be reused for another client's request.",
  why: "The disagreement comes from having two ways to state a body length, so a request carrying both can be read as one request by the edge and as two by the origin, or the reverse. The leftover bytes sit at the front of the connection buffer. That alone is a parsing bug. What turns it into a serious attack is the second condition: the edge pools its connections to the origin and puts the next client's request onto the same one, where it gets appended to the attacker's leftover fragment. The attacker has prefixed somebody else's request.\n\nSeparating the two conditions is what makes this actionable, because both are addressable and they belong to different teams. The parsing half is fixed by having one component decide: reject any request that specifies its length twice, normalise before forwarding, and keep the edge and origin on the same protocol version so their parsers agree. The reuse half is fixed by not multiplexing different clients onto one upstream connection, which costs performance and eliminates the impact entirely. Knowing that reuse is a precondition also tells you where to look first, because an estate that does not reuse upstream connections has a parsing bug rather than a smuggling vulnerability.",
  failureMode: "An attacker sends a crafted request that leaves a fragment in the edge-to-origin connection buffer. The next legitimate request on that connection is appended to the fragment, so the victim's request is executed with the attacker's method, path and headers prefixed to it. The victim receives a response to something they did not send, and the attacker can capture their credentials by choosing what the prefix does.",
  experiment: "Determine whether your edge reuses upstream connections across different client requests, which is the default in most proxies. Then check whether your edge rejects requests specifying a body length two ways, and whether the edge and origin negotiate the same protocol version. Twenty minutes.",
  reflection: "Would disabling upstream connection reuse be affordable for your highest-value path, and has anybody ever priced it?",
  recall: {
    q: "What are the two conditions for request smuggling, and why does separating them help?",
    a: "The edge and origin disagree about where a request ends, usually because it states its length two ways; and the edge reuses its upstream connection for a different client's request, so the leftover fragment prefixes theirs.\n\nSeparating them gives two independent fixes owned by different teams: reject requests that specify length twice, normalise before forwarding and keep versions aligned; or stop multiplexing different clients onto one upstream connection, which removes the impact entirely. Without reuse it is a parsing bug rather than a smuggling vulnerability."
  },
  deepDive: "Tell me whether the edge and origin configuration I paste in is exposed to request smuggling, addressing the parsing and the connection reuse conditions separately."
},
{
  id: "ingress-downgrade-reintroduces-parsing",
  track: "ingress", level: "wire",
  title: "Translating a newer protocol down to an older one at the edge rebuilds the old bugs",
  source: "RFC 9113, HTTP/2, on the message translation to and from HTTP/1.1",
  idea: "An edge speaking a modern protocol to clients and an older one to backends has to translate, and the translation reintroduces the ambiguities the newer protocol removed.",
  why: "The newer protocols removed a class of ambiguity by design: lengths are framed rather than described in text, so there is no way for a message to state its own length twice or inconsistently. That is a real improvement and it lasts exactly as far as the first component that converts back. Translating a framed message into a text protocol means writing length headers, and if the framed message contained header values that look like framing instructions in the older protocol, the conversion can produce something the backend parses differently from what the edge understood.\n\nThe practical point is about topology rather than protocol detail. Most estates run the newest version at the edge because clients and search rankings want it, and the older version to backends because that is what the application server speaks. That arrangement is a translation boundary, and translation boundaries are where parser disagreements live. It is worth knowing simply so that the question gets asked: which version does the edge speak to clients, which to backends, and if those differ, what normalises the difference. An estate speaking the same version end to end has removed a class of bug and usually did not do it deliberately.",
  failureMode: "An attacker sends a request over the newer protocol containing header values crafted to become framing instructions once translated. The edge sees one well-formed framed request; the backend receives text it parses as two. Every check the edge applied was applied to its own reading of the request, which is not the reading the backend acted on.",
  experiment: "Find out which protocol version your edge speaks to clients and which it speaks to backends. If they differ, find out whether the edge validates header values against being interpretable as framing after translation. Fifteen minutes.",
  reflection: "Is the version difference between your edge and your backends a decision, or is it whatever each component defaulted to?",
  recall: {
    q: "Why is a protocol version difference between edge and backend a security concern?",
    a: "Because the newer protocols remove length ambiguity by framing messages rather than describing lengths in text, and translating back to a text protocol reintroduces it. Header values can be crafted so that after translation the backend parses a different message than the edge understood.\n\nMost estates have this boundary without deciding to, running the newest version at the edge for clients and an older one to application servers, so the useful question is which version each hop speaks and what normalises the difference."
  },
  deepDive: "Given the protocol versions between my clients, edge and backends, tell me where translation happens and what it should be normalising."
},
{
  id: "ingress-normalisation-disagreement",
  track: "ingress", level: "wire",
  title: "The edge and the origin must agree on what a path means, or authorisation is bypassable",
  source: "RFC 3986, Uniform Resource Identifier: Generic Syntax, 2005, on normalisation",
  cheat: "Normalise the path once at the edge and forward the normalised form. Two components normalising differently is an authorisation bypass.",
  idea: "If the edge applies a rule to one reading of a path and the origin serves a different reading of the same bytes, the rule can be satisfied and evaded by the same request.",
  why: "A path can be written many ways that are equivalent after normalisation and different before it: encoded characters, double encoding, redundant separators, dot segments, mixed case where the backend is case-insensitive, semicolon parameters, and trailing characters some frameworks strip. The edge matches its rule against the form it produces, and the origin routes based on the form it produces, and there is no requirement anywhere that those be the same function.\n\nThis is worth holding as a network-layer concern rather than an application one because the rules that get bypassed are the ones written at the edge, and those are precisely the rules people rely on most: block the admin prefix from outside, require authentication on a route family, deny access to a metrics path. Each is a path comparison at a component that does not serve the path. The structural fix is to normalise once and forward the normalised form, so that only one function is in play. The weaker but useful fallback is to reject anything that changes under normalisation rather than trying to match every variant, which turns an open-ended matching problem into a closed one.",
  failureMode: "An attacker requests an administrative route with an encoded separator. The edge rule matching that prefix does not match, so the request is forwarded, and the origin decodes and normalises the path and serves the administrative route. One request satisfied the edge's rule and the origin's routing, which were reading the same bytes differently.",
  experiment: "Take one path-based rule at your edge and try to reach the protected route with encoded separators, double encoding, dot segments, and a trailing dot or semicolon. Any variant that reaches the origin is today's finding. Twenty minutes.",
  reflection: "Does your edge forward the path as received or as normalised, and does anybody know which without checking?",
  recall: {
    q: "How does a path normalisation difference become an authorisation bypass?",
    a: "The edge matches its rule against the form it normalises to and the origin routes on the form it normalises to, and nothing requires those to be the same function. Encoded characters, double encoding, redundant separators, dot segments, case, and trailing characters all produce divergence.\n\nIt matters because edge path rules are the ones most relied on: blocking admin prefixes, requiring authentication on a route family, denying metrics paths. Normalise once at the edge and forward the normalised form, or reject anything that changes under normalisation."
  },
  deepDive: "Test the path-based rules at my edge against encoding and normalisation variants, and tell me whether the edge forwards the raw or normalised path."
},
{
  id: "ingress-what-bypasses-the-edge",
  track: "ingress", level: "policy",
  title: "Find the path that skips the edge, because there always is one",
  source: "NIST SP 800-41 Rev. 1, on complete mediation of the network path",
  cheat: "List every address a backend listens on and every route that reaches it. Any path that does not traverse the edge makes every edge rule advisory.",
  idea: "Every control at the edge is worth exactly as much as the guarantee that traffic cannot arrive any other way, and that guarantee is usually untested and usually false.",
  why: "The edge is where the authentication, the rate limiting, the header stripping, the path normalisation and the logging live. All of it rests on one assumption: this is the only way in. That assumption erodes continuously and by ordinary means. A backend keeps its own public address from before the edge existed. A second load balancer is created for a migration. A batch job needs direct access and gets a route. A partner integration is pointed at the origin because the edge was adding latency. A mesh permits direct pod-to-pod traffic by default. A cloud provider assigns a public address to a resource because the template does.\n\nWhat makes this the most valuable entry in the track is the leverage. A direct path does not defeat one edge control, it defeats all of them simultaneously, and it produces no logs at the place where anybody looks. It is also findable without cleverness: enumerate what the backends listen on, enumerate the routes that reach them, and compare against the one path you meant to have. The answer is a list, and every item on it that is not the edge is a finding that outranks anything else in this track.",
  failureMode: "An attacker discovers the origin's own address, from a certificate transparency log, a stale DNS record or a response header, and connects directly. Every edge control is bypassed at once: no rate limit, no authentication gateway, no header stripping, no request logging where anybody is watching. The application receives requests it believes have already been filtered.",
  experiment: "For one service behind an edge, enumerate every address it listens on and every route that reaches it, then try to connect directly from outside the edge. Include public addresses assigned by templates and any legacy load balancer. Thirty minutes, and any success is the highest-priority finding in this track.",
  reflection: "How would you find out if a direct route were added next month, and does anything watch for it?",
  recall: {
    q: "Why is a path that bypasses the edge the most serious ingress finding?",
    a: "Because every edge control rests on the single assumption that traffic cannot arrive another way, so one direct path defeats authentication, rate limiting, header stripping, normalisation and logging simultaneously, and produces no records where anybody is looking.\n\nThe paths appear by ordinary means: legacy public addresses, a second load balancer from a migration, a direct route for a batch job, a partner pointed at the origin for latency, mesh defaults, provider templates assigning public addresses."
  },
  deepDive: "Help me enumerate every network path that reaches a backend I describe, and identify which of them bypass the edge entirely."
},
{
  id: "ingress-waf-is-signal-not-boundary",
  track: "ingress", level: "policy",
  title: "Treat a web application firewall as a signal generator, not as a boundary",
  source: "Marcus Ranum, The Six Dumbest Ideas in Computer Security, 2005, on enumerating badness",
  idea: "A rule set that matches known attack patterns is a denylist, so it stops the traffic it recognises and its value is mostly in telling you that somebody is trying.",
  why: "The mechanism is pattern matching against request content, which puts it in the enumerate-badness category: it blocks what it has seen before and what it can express. That is genuinely useful against automated scanning, mass exploitation of a published vulnerability, and buying time between disclosure and a patch. Those are real benefits worth paying for and they are all availability and tempo benefits rather than correctness ones.\n\nWhere it goes wrong is being counted as a boundary. A determined attacker rewrites the payload until it stops matching, because the space of encodings and equivalent constructions is much larger than the rule set. So a vulnerability behind one is still a vulnerability, and the honest accounting is that it raises the cost of exploitation without changing whether the bug is exploitable. The more valuable use of the same deployment is as detection: a rule firing means somebody is probing you, which is high-signal information that most teams throw away because the request was blocked. And there is a cost worth naming, which is that these products usually require terminating TLS, so adopting one puts another plaintext holder in your trust boundary.",
  failureMode: "An attacker encounters a rule that blocks their first attempt, spends twenty minutes on encoding variants until one passes, and exploits the underlying vulnerability. The block was recorded and nobody looked at it. The only lasting effect of the product was to delay the attacker slightly and to hold every request in plaintext at one more component.",
  experiment: "Look at what your rule set blocked in the last week and ask whether anybody read it. Then take one blocked pattern and see how many variants you can construct that pass. Twenty minutes, and the honest output is whether you are buying detection you are not consuming.",
  reflection: "Is your rule set counted as a mitigation anywhere in a risk register, and would you defend that position knowing it is a denylist?",
  recall: {
    q: "What is a web application firewall actually good for, and what should it not be counted as?",
    a: "Good for blunting automated scanning, mass exploitation of published vulnerabilities, and buying time between disclosure and patch. Those are tempo and availability benefits.\n\nIt should not be counted as a boundary, because it is a denylist and the space of equivalent encodings exceeds the rule set, so a bug behind it stays exploitable. Its underused value is detection: a rule firing means somebody is probing. And it usually requires TLS termination, adding another plaintext holder to the trust boundary."
  },
  deepDive: "Review what my rule set is blocking and tell me what detection value I am discarding, plus what it is being wrongly counted as mitigating."
},
{
  id: "ingress-rate-limit-needs-an-identity",
  track: "ingress", level: "policy",
  title: "A rate limit is only as good as the identity it counts against",
  source: "RFC 6585, Additional HTTP Status Codes, 2012, on the semantics of too many requests",
  cheat: "Rate limit on the strongest identity available, and make the cheap-to-rotate keys the tighter limits rather than the only ones.",
  idea: "Rate limiting is a security control that depends entirely on the attacker being unable to cheaply change the key it counts against, which makes the choice of key the whole design.",
  why: "Counting is trivial; choosing what to count is not. Each candidate key trades coverage against forgeability. A client address is available for every request and is cheap for an attacker to vary, especially from cloud infrastructure. A session or account is much harder to rotate but only exists after authentication, which is useless for protecting the login path itself. An API key is strong and identifies a customer rather than a user. A device or client fingerprint is moderately hard to change and moderately unreliable.\n\nThe design that works uses several keys at once with different limits, and puts the tightest limits on the strongest identity rather than relying on the weakest. It also needs the unauthenticated case thought through separately, because that is where the attacks are: credential stuffing, enumeration and password reset abuse all happen before there is an account to count against. And there is a failure direction to decide deliberately: when the counter store is unavailable, the limiter either allows everything or denies everything, and that choice is usually inherited from a library default rather than made.",
  failureMode: "An attacker runs credential stuffing from a few hundred cloud addresses, staying under the per-address limit on every one of them. The aggregate rate against the login endpoint is enormous and no limit is exceeded, because the only key available before authentication was the one that costs pennies to rotate.",
  experiment: "For one endpoint, write down what your rate limit counts against and estimate what it costs an attacker to change that value. Then check what happens when the counter backend is unavailable. Fifteen minutes.",
  reflection: "For your unauthenticated endpoints, what is the strongest identity available, and are you limiting on it or on the easiest one?",
  recall: {
    q: "What determines whether a rate limit works, and what is special about unauthenticated endpoints?",
    a: "Whether the attacker can cheaply change the key it counts against. Client addresses are universally available and cheap to rotate from cloud infrastructure; sessions and accounts are hard to rotate but only exist after authentication; API keys are strong but identify a customer.\n\nUnauthenticated endpoints are where the attacks are, and they have only the weakest keys, so credential stuffing spreads across addresses and exceeds no limit. Use several keys with different limits, and decide deliberately whether an unavailable counter store fails open or closed."
  },
  deepDive: "For the endpoints I describe, tell me what identity each rate limit should count against and what my unauthenticated paths are currently missing."
},
{
  id: "ingress-timeouts-must-agree",
  track: "ingress", level: "ops",
  title: "Timeouts that disagree across hops produce work nobody is waiting for",
  source: "RFC 9110, on message semantics and connection management",
  idea: "When an upstream timeout is shorter than a downstream one, the caller gives up while the work continues, which wastes the resource under exactly the conditions that caused the timeout.",
  why: "Consider an edge that waits ten seconds and an application that waits sixty. A slow request is abandoned by the edge at ten seconds, and the application keeps working for another fifty, holding a worker and a database connection for a response that nobody will read. If the client retries, that request now has two copies in flight. Under load, when timeouts are actually being hit, this multiplies rather than degrades gracefully, and it is why timeout misalignment turns a slow dependency into an outage.\n\nThe security relevance is that this is a denial-of-service amplifier an attacker can trigger deliberately and cheaply. Requests engineered to be slow, abandoned immediately by the attacker, leave the expensive work running. The attacker pays for a connection and a few bytes; you pay for a worker and a query. And it interacts with retries: a retry policy above a misaligned timeout produces several copies of every slow request, which is a system that converts latency into load. The rule is that timeouts should decrease going inward and every retry budget must be bounded, so that a slow dependency produces refusals rather than accumulating work.",
  failureMode: "An attacker sends requests designed to be slow and abandons them immediately. Each one occupies a backend worker and a database connection for the full downstream timeout, long after the edge and the attacker have both stopped caring. A trickle of cheap requests exhausts a pool, and every layer reports that it is behaving correctly.",
  experiment: "For one request path, write down the timeout at every hop from client to database, plus the retry counts. Check that they decrease inward and that the retries are bounded. Twenty minutes, and any inversion is today's finding.",
  reflection: "Under load, does your system shed requests or accumulate them, and which of the numbers you just wrote down decides that?",
  recall: {
    q: "What goes wrong when timeouts do not decrease inward, and why is it a security concern?",
    a: "The caller abandons the request while the downstream work continues, holding a worker and a connection for a response nobody will read, and retries add more copies. Under load this multiplies instead of degrading, turning a slow dependency into an outage.\n\nIt is a security concern because it is a cheap denial-of-service amplifier: an attacker sends deliberately slow requests and abandons them, paying for a connection while you pay for a worker and a query."
  },
  deepDive: "Map the timeouts and retry budgets across a request path I describe and tell me where they invert or multiply."
},
{
  id: "ingress-concurrency-is-the-target",
  track: "ingress", level: "wire",
  title: "The edge runs out of connection slots long before it runs out of processor",
  source: "RFC 9110, on connection management, read against how edge resource exhaustion actually happens",
  idea: "Attacks on availability at the edge usually target the number of concurrent connections or in-flight streams rather than computation, because those limits are much smaller and much cheaper to reach.",
  why: "The intuition that a denial-of-service attack requires volume is out of date. An edge has a bounded number of connection slots, file descriptors, worker threads and, in the newer protocols, concurrent streams per connection. Those bounds are reached by holding connections open slowly rather than by sending a lot of data: open many connections and send headers a byte at a time, or open the maximum number of streams and leave them idle, or open connections and never read the responses so that buffers fill. Each costs the attacker almost nothing to maintain.\n\nThis matters for two reasons. First, the defences are different from volumetric ones: rate limiting by request count does not help against a client making very few requests very slowly, and the controls that do help are concurrency caps per source, minimum data rate requirements, and aggressive header and idle timeouts. Second, it changes what to monitor. A saturated edge with low processor use and low request rate looks healthy on every dashboard built around throughput, so the metric worth having is concurrent connections against the configured maximum, which most teams do not display anywhere.",
  failureMode: "An attacker opens a few thousand connections from a handful of hosts and sends one header byte every few seconds on each. Request rate stays negligible, processor use stays flat, no rate limit is exceeded, and the edge stops accepting new connections because every slot is held. Every dashboard shows a healthy service that nobody can reach.",
  experiment: "Find the maximum concurrent connections and, for the newer protocol, maximum concurrent streams configured on your edge. Then find out whether either is graphed anywhere. Then check the header and idle timeouts. Fifteen minutes, and an ungraphed limit is the finding.",
  reflection: "If your edge were saturated by held connections right now, which of your dashboards would show it?",
  recall: {
    q: "Why do connection slots rather than processor time make the better target, and what defends against it?",
    a: "Because the limits are far smaller and reachable by holding connections open slowly rather than sending volume: many connections dripping header bytes, maximum idle streams per connection, or never reading responses so buffers fill. Each costs the attacker almost nothing.\n\nRate limiting by request count does not help. Concurrency caps per source, minimum data rate requirements and aggressive header and idle timeouts do. And the metric to graph is concurrent connections against the configured maximum, since throughput dashboards show a healthy service."
  },
  deepDive: "Tell me the concurrency limits on the edge I describe, whether they are monitored, and which slow-connection attacks they currently permit."
},
{
  id: "ingress-default-backend-catches-what-you-missed",
  track: "ingress", level: "policy",
  title: "The default backend serves everything you forgot to route",
  source: "NIST SP 800-41 Rev. 1, on default rules",
  idea: "An edge that routes unmatched requests to a fallback rather than refusing them has an allow-by-default routing table, and the fallback is serving requests nobody designed for.",
  why: "This is the routing-layer version of the default-deny argument, and it hides in a different place. Rules are reviewed carefully; the fallback is set once when the edge is installed and never looked at again. Whatever it points to receives every request whose host or path matched nothing, which is precisely the set of requests nobody has thought about: probes for paths that no longer exist, hostnames from a previous migration, requests to services that were decommissioned, and an attacker's enumeration.\n\nWhat is served depends on what the fallback is, and none of the common choices is good. Pointing it at the main application means unrouted requests reach real code, with the host header or path arriving in a form the application never expected. Pointing it at whichever backend happens to be first is worse and is a common accident of configuration ordering. Even pointing it at an error page leaks which requests produce a different response, which is a free enumeration oracle. The version that behaves is an explicit refusal at the edge with a uniform response, which turns unmatched requests into a signal rather than a service.",
  failureMode: "An attacker enumerates hostnames against your edge and finds that unmatched ones reach a real application, which processes the request with a host header it has never seen. Alternatively they map your estate by observing which unmatched paths return different responses, learning what exists without ever getting a successful request.",
  experiment: "Send your edge a request with a hostname you do not serve and a path that matches nothing, and see exactly what answers. Then find the fallback in the configuration and read what it points to. Fifteen minutes.",
  reflection: "Is your fallback an explicit decision with a uniform refusal, or whichever backend the configuration happened to list first?",
  recall: {
    q: "Why is the default backend a security concern, and what should it be?",
    a: "Because it makes the routing table allow-by-default: every request matching no host or path rule reaches it, which is exactly the set nobody designed for, including stale hostnames, decommissioned services and attacker enumeration.\n\nNone of the usual choices is safe. The main application receives requests with unexpected host headers; whichever backend is listed first is an accident; an error page still leaks a response-difference oracle. It should be an explicit refusal with a uniform response, so unmatched requests are a signal."
  },
  deepDive: "Tell me what my edge does with unmatched hosts and paths, and design an explicit refusal that does not leak an enumeration oracle."
},
{
  id: "ingress-admin-ports-on-the-edge",
  track: "ingress", level: "ops",
  title: "The edge has its own management interface and it is reachable more often than anyone thinks",
  source: "NIST SP 800-41 Rev. 1, on management interfaces for network devices",
  cheat: "Bind edge management, status and metrics listeners to loopback or a management interface, never to the address that serves traffic.",
  idea: "Proxies and load balancers expose configuration, status and metrics endpoints of their own, and those listeners are frequently bound to the same interface as production traffic.",
  why: "The edge is a piece of software with an administrative surface: a status page, a metrics endpoint, a configuration API, sometimes a full dynamic control interface. Those exist for legitimate operational reasons and they are extremely high value, because the edge holds plaintext for everything behind it and its configuration decides where traffic goes. An attacker with write access to that configuration can route any hostname anywhere, or add a copy destination.\n\nThe reason this recurs is defaults and templates. Many proxies bind status or admin listeners to all interfaces out of the box, container images expose them, and service meshes run administrative interfaces on the pod's own address where anything in the mesh can reach them. None of that is visible in the routing rules, because it is not routing, and it is invisible in a review that reads the request path rather than the listener list. The check is to enumerate every listener the edge process actually has open, compare against the ones meant to serve traffic, and confirm the rest are bound to loopback or to a management interface.",
  failureMode: "An attacker who has reached any workload inside the mesh queries a sidecar administrative interface bound to the pod address, reads the full cluster configuration including every service name and endpoint, and in the worse case changes routing. No application was exploited and the edge was doing what its default configuration said.",
  experiment: "On one edge or sidecar process, list every listening socket and the interface each is bound to. Compare that against the ports you believe serve traffic. Anything else bound to a routable address is today's finding. Fifteen minutes.",
  reflection: "For your service mesh, can an arbitrary workload reach another pod's administrative interface, and has anybody checked rather than assumed?",
  recall: {

{

  track: "browser", level: "wire",

{

  why: "This is the enumerability problem again, in its browser form. A policy permitting script from a content delivery network permits every file any customer of that network has ever put there, including ones that will execute whatever a parameter tells them to. A policy permitting script from your own domain permits any file an attacker can get onto your own domain, including an uploaded one served from the wrong host, or a response that reflects input. In both cases the allowlist is a set nobody can enumerate.\n\nA nonce replaces the question. The server generates a fresh unguessable value per response, puts it in the policy and on the script tags it intended, and the browser runs only tags carrying it. An injected script tag has no nonce and does not run, whatever host it names. A hash does the same for static content without needing per-response generation. This is the difference between a policy that constrains where script comes from and one that constrains which script runs, and it is why a host-based policy is often described as providing little real protection while a nonce-based one is a genuine control.",

{

  why: "The lifetime on a record is an instruction to caches, and instructions are followed with variation. Recursive resolvers respect it approximately, some impose their own minimums, operating systems cache separately, language runtimes cache independently and sometimes without any expiry at all, connection pools hold addresses resolved earlier, and long-lived processes may have resolved a name once at startup. The effective time for a change to take effect is the maximum across that chain, not the number you set.\n\nThis matters at the moment you most need it to be short, which is when you are moving traffic away from something. Cutting over from a compromised endpoint, withdrawing a name during an incident, or repointing after a takeover all depend on caches letting go. A common surprise is a runtime that caches indefinitely, so a long-running process keeps using an address for its entire lifetime regardless of the record, which turns a name change into a rolling restart. Knowing that in advance is the difference between a fifteen-minute containment and discovering mid-incident that your only lever is redeploying everything.",
  failureMode: "An attacker retains traffic after you have repointed a name away from infrastructure they control, because a long-running process resolved the name at startup and caches indefinitely. The record is correct, the change was made promptly, and the traffic continues to arrive at the attacker for as long as those processes run.",
  experiment: "Pick one internal name and add up every cache in the path: record lifetime, resolver behaviour, operating system cache, runtime cache, connection pool. Then check whether your primary language runtime caches resolutions indefinitely by default. Twenty minutes.",
  reflection: "If you had to move traffic off an endpoint in the next ten minutes, would changing the name do it, and what would you do instead?",
  recall: {
    q: "Why is the record lifetime a lower bound on how long a name change takes to take effect?",
    a: "Because the effective time is the maximum across every cache in the chain: recursive resolvers that approximate or impose minimums, operating system caches, runtime caches that sometimes never expire, connection pools holding earlier resolutions, and processes that resolved once at startup.\n\nIt matters when moving traffic away from something during an incident. A runtime caching indefinitely turns a name change into a rolling restart, which is worth knowing before rather than during."
  },
  deepDive: "Calculate the real propagation time for a name change in the estate I describe, and tell me whether my runtimes cache resolutions indefinitely."
},
{
  id: "naming-dangling-record-takeover",
  track: "naming", level: "ops",
  title: "A record pointing at something you no longer own is a subdomain somebody else can claim",
  source: "RFC 1035, on delegation, read against how cloud resources are deprovisioned",
  cheat: "Audit every record that points at a provider hostname. If the resource behind it is gone, delete the record before somebody claims the name.",
  idea: "When a record points at a provider resource that has been deleted, whoever next obtains that resource name controls a hostname in your domain.",
  why: "The mechanism is simple and the consequences are large. You point a name at a provider-assigned hostname for a storage bucket, an application platform, a content delivery endpoint or a load balancer. Later the resource is deleted and the record is not, because deleting the resource is done by whoever is decommissioning the service and deleting the record is done by whoever manages the zone, and those are different people with different tickets. The provider's namespace then makes that resource name available again, and anybody who claims it is serving content on your hostname.\n\nWhat makes this more serious than a defacement is everything else in this corpus that trusts a hostname. A subdomain in your domain is inside your cookie scope, may be inside your same-site cookie boundary, may be a permitted origin in a cross-origin configuration, may be on an internal allowlist, and can obtain a valid publicly trusted certificate for that name because the claimant genuinely controls it. So a stale record converts into cookie theft, session fixation, a permitted cross-origin reader, and a trusted host, all without touching anything you operate.",
  failureMode: "An attacker enumerates your subdomains, finds one pointing at a deleted provider resource, claims that resource name, and now serves content on a hostname inside your domain with a valid certificate. From there they receive any cookie scoped to your parent domain and are treated as same-site by browsers.",
  experiment: "List every record in your zones that points at a provider hostname rather than at an address. For each, confirm the resource still exists and is yours. Twenty minutes for a small zone, and every unclaimed one is a finding to fix today.",

  recall: {
    q: "How does a subdomain takeover happen, and why is it worse than defacement?",
    a: "A record points at a provider-assigned resource hostname, the resource is deleted while the record is not because those are different owners with different tickets, and the provider makes the resource name claimable again.\n\nIt is worse than defacement because a hostname in your domain sits inside your cookie scope and same-site boundary, may be a permitted cross-origin reader or on an internal allowlist, and can obtain a valid publicly trusted certificate, since the claimant genuinely controls the name."

{
  id: "naming-sni-is-what-policy-matches",
  track: "naming", level: "policy",
  title: "The name your policy matches is the one the client announced, not the one it reached",
  source: "RFC 6066, Transport Layer Security Extensions, 2011, on server name indication",
  idea: "A hostname-based network control reads the name from the handshake, which is a claim by the client, so the control must also verify that the certificate presented covers that name.",
  why: "This is the naming-track consequence of the plaintext hostname field. A proxy or firewall enforcing a hostname allowlist without terminating TLS has exactly one piece of information: the name the client said it wanted. It cannot know what the server actually is unless it also looks at the certificate the server returns, which it can do without terminating, because the certificate is presented in the clear in the older protocol version and requires more work in the newer one.\n\nThe practical distinction is between a control that reads the request and one that verifies the response. Reading the announced name is trivially defeated by a client under an attacker's control, which is the exact client you are worried about, since the workload is already compromised. Verifying that the presented certificate covers the announced name closes that, because the attacker would need a certificate for a name on your allowlist, which is a much higher bar than filling in a field. Whether your control does the second is worth knowing precisely, because the two look identical in a policy document and differ completely in what they resist.",
  failureMode: "An attacker on a compromised workload opens a connection announcing an allowed hostname while connecting to their own infrastructure, which presents a certificate for something else entirely and does not care. The egress control permits the connection on the strength of the announced name, and the channel is established through a hostname allowlist that was never checking the far end.",
  experiment: "Determine whether your hostname-based egress control verifies the presented certificate against the announced name. If the documentation is unclear, test it: connect to a host you control while announcing an allowed name, and see whether the connection is permitted. Twenty minutes.",
  reflection: "If your control only reads the announced name, is that a limitation of the product or a configuration you can change?",
  recall: {
    q: "What is the difference between a hostname control that reads the announcement and one that verifies it?",
    a: "Reading the announced name relies on a claim by the client, which is trivially forged by exactly the compromised workload you are defending against. Verifying that the presented certificate covers the announced name requires the attacker to hold a certificate for an allowlisted name, which is a much higher bar.\n\nThe two are indistinguishable in a policy document and completely different in what they resist, so it is worth testing rather than reading."
  },
  deepDive: "Test whether my egress hostname control verifies presented certificates against announced names, and tell me how to enable it if not."
},
{
  id: "naming-split-horizon-breaks-assumptions",
  track: "naming", level: "policy",
  title: "Split-horizon means the internal name is not the external name, and code assumes it is",
  source: "RFC 8499, DNS Terminology, 2022, on split-horizon DNS",
  idea: "Serving different answers to internal and external resolvers is a common and reasonable design, and it means any code that treats a name as having one meaning is wrong somewhere.",
  why: "The arrangement exists for good reasons: internal clients should reach a service directly rather than looping out through a public load balancer, and internal-only services should not have public records at all. What it produces is a name whose meaning depends on the resolver, and a set of second-order effects that catch people out. A validation that rejects internal addresses behaves differently depending on where it runs. A configuration value copied from one environment to another resolves somewhere unintended. A certificate issued for the external name may not match what an internal client connected to, or vice versa.\n\nThe security-relevant consequence is the direction of surprise. Internal resolution generally returns something more privileged: a direct address, an admin interface, a service that assumes its callers are internal. So a mistake in this area typically moves traffic toward the more sensitive answer rather than away from it, and it does so silently, because both answers are legitimate. The mitigation is naming discipline rather than a control: use distinguishable names for internal and external endpoints instead of the same name with two answers, so that a configuration mistake produces a resolution failure rather than a connection to something more privileged.",
  failureMode: "An attacker supplies a hostname that a validation running in production resolves to an internal address, having been tested in an environment where the same name resolved publicly to something harmless. The validation logic is identical in both places. The resolver is not, and the production answer is the privileged one.",
  experiment: "Find one name in your estate that resolves differently internally and externally. Note both answers and which is more privileged. Then check whether any validation or configuration treats that name as having one meaning. Twenty minutes.",
  reflection: "Would using distinct names for internal and external endpoints be feasible in your estate, or is the shared name load-bearing for something?",
  recall: {
    q: "What does split-horizon resolution cause, and which direction do its mistakes go?",
    a: "A name whose meaning depends on the resolver, so validations behave differently by environment, copied configuration resolves somewhere unintended, and certificates may not match what a client actually connected to.\n\nMistakes go toward the more privileged answer, because internal resolution typically returns a direct address or an admin interface that assumes internal callers, and both answers are legitimate so nothing signals the error. Distinguishable names make a mistake fail to resolve instead."
  },
  deepDive: "Identify the split-horizon names in an estate I describe and tell me which validations or configurations assume a single meaning."
},
{
  id: "naming-dnssec-signs-the-answer",
  track: "naming", level: "wire",
  title: "The signing extension authenticates the answer and not the channel, and covers less than you think",
  source: "RFC 4033, DNS Security Introduction and Requirements, 2005",
  idea: "Signing proves that a record is the one the zone owner published, and it does not encrypt the query, does not authenticate the resolver, and only applies where the whole delegation chain is signed.",
  why: "It is worth being precise about the guarantee because it is narrow and frequently overstated. What is provided is origin authentication and integrity for records: a validating resolver can tell that an answer came from the zone owner and was not modified. That defeats forged responses and cache poisoning for signed zones. What is not provided is confidentiality, so the query and the answer are still visible on the path, and it says nothing about the connection between your client and its resolver, which is usually the part of the path you actually share with an attacker.\n\nThe coverage limitation is the practical one. Validation only helps if the zone is signed and the delegation chain from the root is intact, and adoption is partial, so for a large fraction of names there is nothing to validate and the resolver returns an unsigned answer. There is also an operational cost that shapes adoption: signing introduces key management and a class of misconfiguration where a broken chain makes a zone unresolvable rather than merely unverified, which is a total outage. So the honest summary is a real but partial defence against forged answers, no help at all against a hostile resolver, and a separate mechanism needed for the confidentiality half.",
  failureMode: "An attacker who controls the network path between a workload and its resolver modifies answers freely, because signing protects the answer's origin and the workload's stub resolver is often not validating. Even where it is, the attacker targets an unsigned zone, of which there are many, and there is nothing to verify.",
  experiment: "Check whether your own zones are signed, and separately whether your workloads' resolvers validate signatures. Those are different questions with different owners and both are commonly no. Fifteen minutes.",
  reflection: "Is the path between your workloads and their resolver inside a boundary you trust, since that is the part signing does not help with?",
  recall: {
    q: "What does the signing extension guarantee, and what are its three limits?",
    a: "Origin authentication and integrity for records, so a validating resolver can tell an answer came unmodified from the zone owner, which defeats forged responses and cache poisoning for signed zones.\n\nIt does not encrypt the query, does not protect the client-to-resolver path where an attacker usually is, and only applies where the zone and the whole delegation chain are signed, which is partial. It also adds key management and a failure mode where a broken chain makes a zone unresolvable."
  },
  deepDive: "Tell me whether signing would help against the resolution threats in the estate I describe, and what the operational cost would be."
},
{
  id: "naming-encrypted-resolution-moves-trust",
  track: "naming", level: "policy",
  title: "Encrypting resolution moves the trust rather than removing it, and can move it out of your estate",
  source: "RFC 8484, DNS Queries over HTTPS, 2018",
  idea: "Encrypted resolution protects queries from observers on the path and gives the operator of the encrypted resolver complete visibility, which is a relocation of trust rather than a reduction.",
  why: "The privacy benefit is real: queries are no longer readable by anyone on the network between the client and the resolver. The trust does not disappear, it concentrates on whoever operates that resolver, who now sees every name every client looks up. If that is your own resolver, this is a straightforward improvement. If it is a public one configured by default in a browser or a library, you have moved your resolution trust to a third party and, more consequentially for this corpus, moved it outside your visibility.\n\nThat second effect is the one to plan for. Resolver query logs are the cheapest broad-coverage network telemetry most estates have, and they are the primary detection for resolution-based exfiltration. A workload or browser that resolves over an encrypted channel to an external provider produces no such logs, and its queries also bypass any resolution-level blocking you had. So the arrival of encrypted resolution in client defaults is simultaneously a privacy improvement for users and the loss of a detection capability for you. The response is to run your own encrypted resolver and require its use, which keeps both properties, rather than to try to prevent encryption.",
  failureMode: "An attacker on a compromised workload uses encrypted resolution to a public provider, exfiltrating over query names as before. Your resolver sees nothing because it was never asked, your resolution-level blocking never applies, and the queries appear on the network only as ordinary encrypted traffic to a reputable host that your egress policy permits.",
  experiment: "Determine whether your workloads and managed browsers can use encrypted resolution to an external provider, and whether anything forces them to your own resolvers. Fifteen minutes, and the browser answer is often yes by default.",
  reflection: "If your resolver logs are a primary detection source, what happens to that detection as encrypted resolution becomes the client default?",
  recall: {
    q: "What does encrypted resolution change, and why is it a detection problem?",
    a: "It protects queries from observers on the path and concentrates full visibility in whoever operates the encrypted resolver. With your own resolver that is an improvement; with a public one configured by default, resolution trust moves to a third party and outside your visibility.\n\nIt is a detection problem because resolver query logs are the broadest cheap telemetry most estates have and the primary detection for resolution-based exfiltration, and encrypted queries to an external provider produce none and bypass resolution-level blocking."
  },
  deepDive: "Help me work out whether workloads and browsers in the estate I describe can bypass my resolvers with encrypted resolution, and how to force them back."
},
{
  id: "naming-wildcard-one-key-many-names",
  track: "naming", level: "policy",
  title: "A wildcard certificate makes one private key cover a whole namespace",
  source: "RFC 6125, on wildcard matching in certificate names",
  cheat: "A wildcard key compromise is every subdomain at once. Use per-name certificates where automated issuance makes it cheap.",
  idea: "A wildcard certificate is accepted for every name at one level under a domain, so the key that holds it is a single credential covering everything in that namespace.",
  why: "The convenience is obvious: one certificate, one renewal, any number of hostnames. The cost is that the key becomes a credential for the whole namespace, and it usually ends up distributed to every host that needs to serve any name in it, which means many copies in many places, including places with weaker protection than the most sensitive service it covers. Compromise of any one of those copies is impersonation of all of them.\n\nThe matching rules add a second consideration people get wrong. A wildcard covers one label, so it matches a direct subdomain and not a deeper one, and it does not match the bare domain itself. That leads to deployments where a wildcard is believed to cover more than it does, and to the opposite case, where a wildcard issued at a high level covers far more names than the person requesting it had in mind. Since automated issuance made per-name certificates nearly free to operate, the balance has shifted: the operational argument for wildcards is much weaker than it was, and the remaining good uses are cases where names are created dynamically and cannot be enumerated in advance.",
  failureMode: "An attacker compromises a minor service serving one subdomain and obtains the wildcard key deployed there. They can now present a valid certificate for every name under that domain, including the primary application, an authentication endpoint and an internal admin host, none of which they touched.",
  experiment: "Find every wildcard certificate in your estate and, for each, list every host holding a copy of the key. Then note the least protected host on that list, because that is the security of the whole namespace. Twenty minutes.",
  reflection: "Would per-name certificates be operationally feasible now that issuance is automated, and what is the actual blocker?",
  recall: {
    q: "What is the cost of a wildcard certificate, and what do the matching rules add?",
    a: "The key becomes a credential for the whole namespace and is usually copied to every host serving any name in it, so compromise of the least protected copy is impersonation of all of them.\n\nThe matching rules mislead in both directions: a wildcard covers one label, so it does not match deeper subdomains or the bare domain, while a wildcard issued high in a namespace covers far more names than intended. Automated issuance has made per-name certificates cheap enough that the operational argument is weak."
  },
  deepDive: "Inventory the wildcard certificates in an estate I describe, list every host holding each key, and tell me which could move to per-name issuance."

{
  id: "naming-internal-names-in-public-logs",
  track: "naming", level: "ops",
  title: "Getting a public certificate for an internal name publishes that name forever",
  source: "RFC 6962, Certificate Transparency, 2013, read for its reconnaissance consequence",
  cheat: "Never obtain a publicly trusted certificate for an internal-only hostname. It enters a permanent public log.",
  idea: "Publicly trusted issuance is recorded in append-only public logs, so a certificate obtained for an internal hostname places that name in a permanent, searchable public record.",
  why: "The mechanism is the one covered in the TLS track and the consequence belongs here because it is a naming discipline problem. Somebody needs a certificate for an internal service, uses the same automated public issuance that everything else uses because it is right there and it works, and the hostname is logged. The certificate is fine. The disclosure is permanent and cannot be withdrawn, because the point of an append-only log is that entries do not leave it.\n\nWhat gets disclosed is more useful to an attacker than people expect, because internal names are descriptive. They say what a service is, which environment it belongs to, and often which team owns it, and a list of them is a map of the estate assembled with no packets sent to you. It also reveals things that are not otherwise inferable, such as the existence of a service that has no public presence at all. The discipline that avoids it is to use a private authority for internal names, which is the same conclusion the trust store entry reached from the other direction, and to keep internal names in a namespace that is separate from the public one so that the mistake is harder to make by accident.",

  reflection: "For the internal names already in the logs, is there anything to do besides assuming they are known, and does that change how you protect them?",
  recall: {
    q: "Why should internal hostnames never receive publicly trusted certificates?",
    a: "Because publicly trusted issuance is recorded in append-only public logs, so the hostname becomes a permanent searchable public record that cannot be withdrawn.\n\nInternal names are descriptive, so a list of them says what each service is, which environment it belongs to and often which team owns it, and reveals services with no public presence. Use a private authority for internal names and keep them in a separate namespace so the mistake is harder to make."
  },

{
  id: "naming-service-discovery-is-dns-with-trust",
  track: "naming", level: "wire",
  title: "Cluster service discovery is resolution with a short lifetime and much more trust placed in it",
  source: "The Kubernetes documentation on DNS for services and pods",
  idea: "Inside a cluster, names are resolved by a platform resolver that every workload shares, and the answers determine which service a workload actually talks to.",
  why: "The mechanics differ from public resolution in ways that matter. Lifetimes are very short because endpoints move constantly, the resolver is a workload in the cluster rather than external infrastructure, every namespace shares it, and the names are structured so that a workload in one namespace can resolve services in every other by default. That last point makes the resolver a map of the entire cluster available to anything running in it.\n\nTwo consequences follow. The first is reconnaissance: a compromised workload can enumerate services across namespaces through resolution alone, without a single connection attempt, which makes it the cheapest and quietest discovery step available. The second is that the cluster resolver is a high-value target that is easy to overlook because it is presented as platform plumbing rather than as a security component. Compromising it, or being able to influence the records it serves, redirects service-to-service traffic across the cluster. Both consequences argue for the same things: policy that prevents workloads reaching the resolver's own administrative surface, and not relying on namespace separation as a confidentiality boundary for the existence of services.",
  failureMode: "An attacker in a compromised pod enumerates every service in every namespace by resolving names against the cluster resolver, building a complete inventory of the estate's internal architecture without attempting a single connection and without appearing in any connection log.",
  experiment: "From a pod in one namespace, resolve a service name in a different namespace and see whether it answers. Then check whether any network policy restricts which workloads may reach the cluster resolver. Fifteen minutes.",
  reflection: "Is the existence and naming of your internal services something you treat as confidential, and if so does resolution respect that?",
  recall: {
    q: "How does cluster service discovery differ from public resolution, and what are the consequences?",
    a: "Very short lifetimes because endpoints move, a resolver that is itself a workload in the cluster, shared by every namespace, with structured names that let a workload in one namespace resolve services in all the others by default.\n\nSo a compromised workload can enumerate the whole cluster through resolution alone, with no connection attempts and no connection logs; and the resolver is a high-value target presented as plumbing, since influencing its records redirects service-to-service traffic."
  },

{
  id: "naming-search-suffix-leaks-lookups",
  track: "naming", level: "wire",
  title: "Search suffixes turn an unqualified name into several lookups, some of them off your network",
  source: "RFC 8499, DNS Terminology, 2022, on search lists and qualification",
  idea: "A resolver configured with search domains appends each in turn to an unqualified name, so a single lookup can become several queries, and the later ones may leave your estate.",
  why: "The behaviour exists to let people type a short name, and it produces a sequence of attempts. In a cluster, an unqualified name is tried against the namespace, then the service domain, then the cluster domain, then whatever else is in the list, which commonly includes the node's own configured domains. That means a name intended to be internal can end up being queried against a public suffix, which sends the name to an external resolver and, if somebody has registered the corresponding public name, gets an answer.\n\nThe security consequences run both ways. Outward, the queries themselves leak internal service names to whoever operates the resolvers they reach, which is a quiet disclosure nobody audits. Inward, a name that fails internally and succeeds externally resolves to somebody else's infrastructure, which is a redirection triggered by a typo or by a service that has been decommissioned. That second case is the more interesting one, because it means an attacker can register a plausible public name and wait for misqualified internal lookups to arrive, and the traffic that arrives comes from inside your estate with whatever credentials the client attaches.",
  failureMode: "An attacker registers a public domain matching a pattern that internal misqualified lookups fall through to. A service whose internal name has been decommissioned now resolves through the search list to the attacker's infrastructure, and clients connect to it carrying the credentials they would have sent to the internal service.",
  experiment: "In one container, read the resolver configuration and note the search list and the number of dots required before a name is treated as absolute. Then resolve a deliberately wrong short name and observe how many queries result and where the last one goes. Twenty minutes.",
  reflection: "Do your internal clients use fully qualified names, and if not, how many queries per lookup are you generating and where do the misses go?",
  recall: {
    q: "What does a search list do, and what are its two security consequences?",
    a: "It appends each configured domain in turn to an unqualified name, so one lookup becomes several queries, and the later ones may use a public suffix and leave your estate.\n\nOutward, internal service names leak to whoever operates the resolvers those queries reach. Inward, a name that fails internally can succeed externally against somebody else's infrastructure, so an attacker can register a plausible public name and receive connections from inside your estate carrying real credentials."
  },

{
  id: "naming-homographs-in-an-allowlist",
  track: "naming", level: "policy",
  title: "Two names that look identical are different names, and your allowlist compares bytes",
  source: "RFC 5890, Internationalized Domain Names for Applications, 2010",
  idea: "Names can contain characters that render identically to others, so a destination that looks like an approved one in a review can be a different name entirely.",
  why: "The encoding allows a large character repertoire, and many characters are visually indistinguishable from Latin letters at normal sizes. So a name can be constructed that renders the same as a legitimate one and is a completely different string, resolving to different infrastructure. The security-relevant point for this corpus is not phishing, which is the usual framing, but review: an allowlist entry, a configuration value or a pull request diff read by a human can contain such a name and pass, because the reviewer is comparing appearance and the system is comparing bytes.\n\nThe defences are mechanical rather than perceptual. Convert every name to its encoded form before comparing or storing it, so that what is written down is what will be resolved. Reject names mixing scripts where you do not need them. And where a name is being added to a list that grants something, display the encoded form in the interface that a human approves, since a review of a rendered name cannot catch this and a review of the encoded form can. It is worth mentioning that the same reasoning applies to case and to trailing dots, which are lesser versions of the same problem: the string a human reads and the string a resolver receives should be the same string.",
  failureMode: "An attacker submits an egress allowlist addition, or gets one accepted through a normal change process, using a name that renders identically to a permitted destination. The reviewer sees a familiar hostname and approves. The resolver sees a different name and returns the attacker's infrastructure.",
  experiment: "Take one hostname allowlist and convert every entry to its encoded form, then compare against what is displayed. Also check whether your change process shows reviewers the rendered or the encoded name. Fifteen minutes.",
  reflection: "Would your review process catch a visually identical hostname, and does anything in your tooling normalise before storing?",
  recall: {
    q: "Why can a hostname allowlist be defeated without any technical bypass?",
    a: "Because the character repertoire includes characters that render identically to Latin letters, so a different string can look the same to a reviewer while resolving to different infrastructure. The human compares appearance and the system compares bytes.\n\nThe defences are mechanical: normalise to the encoded form before comparing or storing, reject unnecessary mixed scripts, and display the encoded form in any interface where a human approves an addition."
  },
  deepDive: "Check the hostname allowlist I paste in for visually confusable entries and tell me where to normalise before storing."
},
{
  id: "naming-reverse-proves-nothing",
  track: "naming", level: "wire",
  title: "A reverse lookup proves nothing about the forward name",
  source: "RFC 8499, DNS Terminology, 2022, on reverse mapping",
  cheat: "Reverse lookups are controlled by whoever holds the address block. Never authorise on one without confirming the forward name resolves back.",
  idea: "The record mapping an address to a name is published by whoever controls that address block, so a reverse lookup returns whatever they chose to say and is not evidence of anything.",
  why: "The two directions are separate zones with separate owners. Whoever holds an address block publishes the reverse records for it, and can put any name there, including yours. So an access check that resolves the source address to a name and compares that name to an allowlist is trusting the attacker's own configuration. This is an old pattern, still present in log processing, in some access control lists, and in mail-handling rules.\n\nThe partial mitigation is a forward-confirmed lookup: resolve the address to a name, then resolve that name back to addresses, and require the original address to be among them. That closes the trivial version, because the attacker would need control of the forward zone too, which for a name in your domain they do not have. It is worth knowing this pattern by name because it is the correct way to use reverse lookups where you must, and because seeing it absent tells you a check is decorative. The stronger position, in an estate that has any of the identity mechanisms from earlier in this corpus, is not to use reverse lookups for authorisation at all and to reserve them for making logs readable.",
  failureMode: "An attacker configures the reverse record for an address they control to a hostname inside your domain. A service that resolves source addresses to names and permits anything in your domain grants access. Nothing was spoofed; the attacker published a record in a zone that was theirs to publish in.",
  experiment: "Grep for any place your code or configuration resolves an address to a name and uses the result in a decision. For each, check whether it confirms the forward direction. Fifteen minutes, and any that does not is today's finding.",
  reflection: "Are reverse lookups used anywhere in your estate for authorisation rather than for readability, and could that use be removed entirely?",
  recall: {
    q: "Why is a reverse lookup not evidence, and what is the partial fix?",
    a: "Because reverse records are published by whoever controls the address block, so the answer is whatever they chose to say, including a name in your domain. A check that authorises on it is trusting the attacker's configuration.\n\nThe partial fix is a forward-confirmed lookup: resolve the address to a name, resolve that name back, and require the original address to be present, which needs control of the forward zone too. Better still, use reverse lookups only for log readability."
  },
  deepDive: "Find every place an address is resolved to a name and used in a decision in a codebase I describe, and tell me which lack forward confirmation."

{
