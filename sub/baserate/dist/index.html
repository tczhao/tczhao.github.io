{
  id: "uncertainty-plus-four",
  track: "uncertainty", level: "applied",
  title: "Adding two successes and two failures fixes most of the small sample problem",
  source: "Alan Agresti and Brent A. Coull, Approximate Is Better Than Exact for Interval Estimation of Binomial Proportions, The American Statistician, 1998",
  idea: "Add two to the successes and two to the failures, then run the ordinary Wald formula on the adjusted counts, and you get near nominal coverage with arithmetic you can do in a spreadsheet.",
  why: "The adjustment is p-tilde equals x plus 2 over n plus 4, then p-tilde plus or minus 1.96 times the square root of p-tilde times one minus p-tilde over n plus 4. The two pseudo-successes and two pseudo-failures drag the centre towards one half, which is exactly where the Wald standard error stops collapsing. It approximates the Wilson centre with no extra algebra.\n\nAgresti and Coull's argument in the title is the one worth internalising: the approximate interval beats the exact one on average coverage, because exactness in the Clopper-Pearson sense buys a guarantee by being far too wide almost everywhere. Plus four is the interval to reach for when you are standing at a whiteboard with a numerator and a denominator and no statistics package.",
  failureMode: "Two of forty traces failed. Wald says 0.05 plus or minus 0.068, so minus 0.018 to 0.118, and you quietly clip the negative bound. Plus four says 4 over 44 equals 0.091, interval 0.006 to 0.176. The upper bound moved from 12 percent to 18 percent, which is the difference between shipping and running another forty traces.",
  experiment: "Take three real proportions your team quotes, ideally with different denominators, and compute Wald and plus four for each in a spreadsheet. Checkable output: for each one, the absolute difference in the upper bound. Note which of the three has a decision that flips. If none do, you have learnt that your intervals are not currently load-bearing, which is also worth knowing.",
  reflection: "For the tightest denominator you found, what would the plus four interval need to look like before you would sign off?",
  recall: {
    q: "State the plus four interval and say why the pseudo-counts help.",
    a: "Compute p-tilde as x plus 2 over n plus 4, then apply the usual Wald formula using p-tilde and n plus 4 throughout.\n\nThe pseudo-counts pull the centre away from zero and one, which is where the Wald standard error collapses towards zero and produces absurdly narrow or out-of-range intervals."
  },
  forecast: { q: "For the next eval batch I review, will the plus four upper bound on the failure rate exceed our stated tolerance?" },
  deepDive: "Give me a spreadsheet-ready formula for the plus four interval and check my arithmetic on these three proportions."
},
{
  id: "uncertainty-clopper-pearson",
  track: "uncertainty", level: "advanced",
  title: "The exact binomial interval is exact about the wrong thing",
  source: "C. J. Clopper and E. S. Pearson, The Use of Confidence or Fiducial Limits Illustrated in the Case of the Binomial, Biometrika, 1934",
  idea: "Clopper-Pearson guarantees coverage of at least 95 percent by being systematically wider than it needs to be, which is a real cost paid for a guarantee you probably did not need.",
  why: "Clopper and Pearson built the interval by inverting the exact binomial test: the bounds are the values of p at which the observed count sits at the tail cutoff. Because the binomial is discrete, you can almost never hit exactly 5 percent in the tails, so the construction takes the next conservative step. The result is coverage of at least 95 percent, often 97 or 98 percent, and never below.\n\nThe word exact refers to the use of the exact binomial distribution rather than a normal approximation. It does not mean the interval is exactly 95 percent, and in practice it is not. Wider intervals mean you fail to detect real differences you could have detected at the same sample size. If the cost of overstating your certainty is a regulator or a safety claim, take the guarantee. If the cost is another week of labelling because the interval straddled your threshold, you have bought insurance against a risk you were not carrying.",
  failureMode: "A team adopts exact intervals across the board because exact sounds rigorous. Every eval comparison now straddles zero, nothing ever reaches a conclusion, and the practical response is that people stop putting intervals on anything.",
  experiment: "For n equals 50 and x equals 10, compute Clopper-Pearson, Wilson and plus four. Clopper-Pearson bounds come from the beta quantiles: lower is the 0.025 quantile of Beta(x, n minus x plus 1), upper is the 0.975 quantile of Beta(x plus 1, n minus x). Checkable output: the three widths, ranked. Clopper-Pearson will be widest. Decide, in writing, which decision in your current quarter would justify that extra width.",
  reflection: "Name a number you report where you would genuinely rather be too wide than too narrow. If you cannot name one, that tells you which default to pick.",
  recall: {
    q: "What is exact about the exact binomial interval, and what is the price?",
    a: "It uses the exact binomial distribution rather than a normal approximation, and it guarantees coverage of at least the nominal level. It is not exactly 95 percent.\n\nThe price is systematic over-width, which reduces your ability to detect real differences at a fixed sample size."
  },
  deepDive: "Given the decision I am about to make and its asymmetric costs, argue for or against using Clopper-Pearson rather than Wilson here."
},
{
  id: "uncertainty-bootstrap",
  track: "uncertainty", level: "core",
  title: "The bootstrap turns any statistic into an interval by resampling your own data",
  source: "Bradley Efron, Bootstrap Methods: Another Look at the Jackknife, Annals of Statistics, 1979",
  idea: "Resample your observations with replacement, recompute the statistic on each resample, and the spread of those recomputed values estimates the sampling distribution of the statistic.",
  why: "The logic is a substitution. You want the distribution of your statistic under repeated sampling from the population, but you only sampled once. Efron's move is to treat the empirical distribution of your data as a stand-in for the population and sample from it. Draw n observations with replacement, compute the statistic, repeat a few thousand times, and take the 2.5th and 97.5th percentiles of the results.\n\nThe reason this matters for your work is that closed-form standard errors exist for means and proportions and essentially nothing else you care about. p95 latency, the ratio of two rates, the median cost per resolved ticket, the difference in trimmed means between two agent versions: none of these have a standard error you can look up, and all of them are one loop away from an interval. The bootstrap does not require you to know the shape of the underlying distribution, which is the whole point.",
  failureMode: "The p95 latency chart shows 22 seconds this week against 19 last week and someone declares a regression. Nobody has any idea how much a p95 over 3,000 runs moves week to week from noise alone. A bootstrap on last week's runs alone would have shown a p95 interval of 17 to 24 seconds.",
  experiment: "Pull one week of agent run durations from ClickHouse into a list. Resample with replacement 2,000 times, take the p95 of each resample, and read off the 2.5th and 97.5th percentiles of those 2,000 numbers. Checkable output: an interval around your p95. Compare its width to the week-on-week change your team last treated as a signal.",
  reflection: "Which recurring chart in your review would look different if every point on it carried a bootstrap interval?",
  recall: {
    q: "What population does the bootstrap actually sample from, and why is that legitimate?",
    a: "It samples from the empirical distribution of your data, drawing n observations with replacement. The substitution is legitimate when your sample is a reasonable stand-in for the population, which requires independent observations and a sample large enough for the empirical distribution to be a decent approximation.\n\nWhat you get back is the sampling variability of the statistic, which lets you build an interval for statistics that have no closed-form standard error."
  },
  deepDive: "Write me the twenty lines of code to bootstrap an interval for this specific statistic on this specific column, and tell me what could make it wrong."
},
{
  id: "uncertainty-bootstrap-limits",
  track: "uncertainty", level: "advanced",
  title: "The bootstrap fails at the tails, at the extremes and when the data are dependent",
  source: "Bradley Efron and Robert J. Tibshirani, An Introduction to the Bootstrap, 1993",
  idea: "Percentile bootstrap intervals are biased for skewed statistics and BCa corrects much of that, but no bootstrap variant rescues you for maxima, for very small samples, or for observations that are not independent.",
  why: "Three distinct failures. First, bias and skew: the plain percentile interval assumes the bootstrap distribution is centred and symmetric around the truth, which fails for things like variance ratios and correlations. BCa adjusts for bias and for how the standard error changes with the parameter, and Efron and Tibshirani treat it as the default rather than an optional refinement.\n\nSecond, extremes. The bootstrap estimate of the sample maximum is broken by construction: resampling can never produce a value larger than the largest observation you saw, so the bootstrap distribution of the maximum is a lump of atoms below a hard ceiling. Any statistic that depends on the far tail inherits some of this. Third, dependence. Resampling individual rows destroys the correlation structure, so if your traces come in bursts, or repeat per tenant, or share a prompt template, the plain bootstrap will report intervals that are far too narrow. The fix is to resample the independent unit: whole tenants, whole sessions, whole blocks of time.",
  failureMode: "You bootstrap 5,000 agent traces to get an interval on the failure rate and get plus or minus 0.6 points. But those traces came from 30 tenants and failures cluster hard by tenant schema. Resampling tenants instead of traces gives plus or minus 3 points, and only the second number is honest.",
  experiment: "Take your trace table and bootstrap the same statistic two ways: resampling rows, and resampling the assignment unit, whichever that is, tenant or session or workflow. Checkable output: the ratio of the two interval widths. If it is above about 1.5, every row-level interval your team has ever quoted on this metric is too narrow.",
  reflection: "What is the independent unit in your data, and can you actually name it, or have you been assuming it is the row?",
  recall: {
    q: "Name the three situations where the bootstrap does not save you, and the fix for each where one exists.",
    a: "Skewed or biased statistics, where BCa corrects for bias and for a standard error that changes with the parameter. Extreme-value statistics like the maximum, where there is no fix because resampling cannot exceed the largest observed value. Dependent data, where the fix is to resample the independent unit rather than the row: whole clusters, sessions or blocks.\n\nSmall samples are a fourth caveat: with very few observations the empirical distribution is a poor stand-in for the population and no resampling scheme repairs that."
  },
  deepDive: "Look at the structure of this dataset and tell me what the correct resampling unit is and whether BCa is worth the extra code here."
},
{
  id: "uncertainty-power-analysis",
  track: "uncertainty", level: "core",
  title: "Power analysis tells you the sample size you need before you look at the data",
  source: "Jacob Cohen, Statistical Power Analysis for the Behavioral Sciences, second edition, 1988",
  idea: "Power is the probability of detecting an effect of a stated size if it is real, and fixing the smallest effect worth detecting is what converts a vague ambition into a countable number of labelled examples.",
  why: "Four quantities are locked together: sample size, effect size, significance level and power. Fix any three and the fourth follows. The one that people skip is effect size, because naming it forces you to say out loud how much improvement would actually change your decision, and that is a product question rather than a statistical one.\n\nFor comparing two proportions the working rule is n per arm of roughly 16 times p times one minus p, divided by the squared difference you want to detect, for 80 percent power at the 5 percent level. Put your real numbers in. Going from an 80 percent pass rate to 85 percent needs about 900 items per arm. That is the honest answer, and it is almost always more than the eval set you have. Cohen's contribution was also cultural: he documented how routinely published work was underpowered, and the same is true of eval sets today.",
  failureMode: "You run 100 prompts against both agent versions, see 78 against 83 percent, and cannot conclude anything. With 100 per arm the design had roughly 15 percent power to detect a 5 point difference, so the result was uninformative before you started. The two days of labelling were spent to learn nothing.",
  experiment: "Take the comparison you most want to run this quarter. Write down the current rate and the smallest improvement that would change your decision. Compute 16 times p times one minus p divided by that difference squared. Checkable output: one number, the items needed per arm. Put it next to the size of the eval set you actually have.",
  reflection: "If the required n is more than you can label, which do you move: the effect size you will accept, the power you will accept, or the plan?",
  recall: {
    q: "What is the quantity people leave out of a power calculation, and why is leaving it out fatal?",
    a: "The minimum effect size worth detecting. Without it the calculation has no answer, because sample size, effect size, alpha and power are four quantities with three degrees of freedom.\n\nIt gets skipped because naming it is a product decision, not a statistical one: you have to state how much improvement would actually change what you do."
  },
  forecast: { q: "Will the eval set I plan to use for the next ship decision be at least half the size that a power calculation says I need?" },
  deepDive: "Here is my current rate, my target improvement and my labelling budget: tell me what power I actually have and what I should change."
},
{
  id: "uncertainty-type-s-and-m",
  track: "uncertainty", level: "advanced",
  title: "An underpowered study that reaches significance has overstated the effect",
  source: "Andrew Gelman and John Carlin, Beyond Power Calculations: Assessing Type S (Sign) and Type M (Magnitude) Errors, Perspectives on Psychological Science, 2014",
  idea: "When power is low, the estimates that clear the significance threshold are the exaggerated ones by construction, so the useful questions are the probability of getting the sign wrong and the expected inflation factor.",
  why: "Significance is a filter on the magnitude of the estimate. To reach it, the estimate must be at least about two standard errors from zero. If the true effect is small relative to the standard error, the only samples that pass that filter are the ones where noise happened to push the estimate up. So conditional on being significant, the estimate is inflated. This is a mechanical consequence of the filter, not a bias in anyone's conduct.\n\nGelman and Carlin name two quantities. The type S error rate is the probability that a significant estimate has the wrong sign. The type M error, or exaggeration ratio, is the expected magnitude of a significant estimate divided by the true effect. In their worked example, a design with power around 6 percent carries roughly a one-in-four chance of getting the sign backwards and inflates the effect by close to an order of magnitude. Both are computable from an assumed true effect and your standard error, before you have any data.",
  failureMode: "A 60-item eval shows the new prompt beating the old one by 12 points, significant. You ship it and the production metric moves by 1 point. Nobody committed fraud. A 60-item eval could only have produced a significant result if the observed gap was large, so the significant result was guaranteed to overstate whatever was really there.",
  experiment: "Take a recent significant eval result. Assume the true effect is the size you would consider a genuine win, say a third of what you observed. Simulate: draw 10,000 studies at your actual n with that true effect, keep only the significant ones, and take the mean of their estimates. Checkable output: the ratio of that mean to the true effect you assumed. If it is above 2, your significant results are not usable as effect size estimates.",
  reflection: "Which shipped change in the last year had a production impact far smaller than its eval result predicted, and was the eval underpowered?",
  recall: {
    q: "Why is a significant result from an underpowered study biased upward?",
    a: "Significance requires the estimate to be roughly two standard errors from zero. When the true effect is small relative to the standard error, only the samples where noise pushed the estimate away from zero clear that bar.\n\nConditioning on significance therefore selects the exaggerated estimates. The exaggeration ratio quantifies it, and the type S error rate gives the probability that the sign is wrong as well."
  },
  deepDive: "Given my sample size and a plausible true effect, compute the type S error rate and exaggeration ratio for the result I am about to present."
},
{
  id: "uncertainty-paired-comparison",
  track: "uncertainty", level: "applied",
  title: "Running both variants on the same inputs removes the between-item variance for free",
  source: "George E. P. Box, J. Stuart Hunter and William G. Hunter, Statistics for Experimenters, second edition, 2005",
  idea: "A paired design analyses the within-pair differences, so item difficulty cancels and you detect the same effect with far fewer items than an unpaired design needs.",
  why: "In an unpaired comparison, the variance you are fighting is the variance across items: some prompts are hard for every model and some are easy for every model, and that spread swamps the difference you care about. Pair the design, run both variants on the same item, and analyse the per-item difference. Item difficulty appears in both terms and subtracts out.\n\nThe arithmetic: the variance of a difference is Var(A) plus Var(B) minus twice the covariance. With equal variances and a correlation of 0.7 between the two variants' scores on the same item, the paired variance is 0.6 times sigma squared against 2 times sigma squared unpaired, a factor of more than three fewer items for the same precision. Box, Hunter and Hunter's classic illustration is two shoe sole materials tested on the left and right foot of the same ten boys, where the pairing removes the enormous variation in how hard individual boys are on their shoes. Your eval items are the boys. For pass or fail outcomes the analogue counts only the items where the two variants disagree, since the ones where both pass or both fail carry no information about the difference.",
  failureMode: "Someone splits the 400-item eval set into two halves, runs the old agent on one half and the new one on the other, and compares. The comparison now carries the full between-item variance plus whatever imbalance the split introduced, for no gain. Running both on all 400 costs twice the inference and buys several times the precision.",
  experiment: "Take your last A-versus-B eval where both variants saw the same items. Compute the difference two ways: as the difference of the two mean scores with an unpaired standard error, and as the mean of the per-item differences with its own standard error. Checkable output: the ratio of the two standard errors, and the correlation between the two variants' per-item scores. The higher that correlation, the bigger the free win.",
  reflection: "Is there anywhere in your current eval pipeline where the two arms do not see identical inputs, and is there a real reason for it?",
  recall: {
    q: "Where does the precision gain in a paired comparison come from?",
    a: "From the covariance term. The variance of a per-item difference is Var(A) plus Var(B) minus twice the covariance between them, so any variation shared by both arms, principally item difficulty, cancels out.\n\nThe more strongly the two variants' scores correlate across items, the larger the reduction. At a correlation of 0.7 the paired variance is under a third of the unpaired one."
  },
  deepDive: "Look at how my eval harness assigns items to variants and tell me whether I am leaving a paired analysis on the table."
},
{
  id: "uncertainty-cuped",
  track: "uncertainty", level: "applied",
  title: "Pre-period data shrinks your variance without changing your estimate",
  source: "Alex Deng, Ya Xu, Ron Kohavi and Toby Walker, Improving the Sensitivity of Online Controlled Experiments by Utilizing Pre-Experiment Data, WSDM, 2013",
  idea: "CUPED subtracts off the part of the metric that a pre-experiment covariate predicts, cutting variance by roughly the square of the correlation while leaving the treatment effect unbiased.",
  why: "Take your outcome Y and a covariate X measured before the experiment started, typically the same metric over the previous fortnight. Define Y adjusted as Y minus theta times X minus the mean of X, where theta is the covariance of Y and X divided by the variance of X. Because X was measured before assignment, it cannot be affected by treatment, so subtracting it removes variance without shifting the expected difference between arms. The variance of the adjusted metric is the original variance times one minus rho squared, where rho is the correlation between Y and X.\n\nThat squared relationship is worth internalising. A correlation of 0.5 buys you 25 percent variance reduction. A correlation of 0.9 buys 81 percent, which is a fourfold effective increase in sample size. Deng and colleagues reported large reductions on real Bing metrics using the same metric from the pre-period as the covariate, which is almost always the strongest available predictor.",
  failureMode: "A team wants to test a change to agent routing but per-tenant usage is wildly heterogeneous, so the metric is dominated by which large tenants landed in which arm. They conclude the experiment needs six weeks. The pre-period usage for those same tenants is available and correlates at 0.85 with the outcome, which would have cut the required duration by most of that.",
  experiment: "Pick a metric you track per tenant in ClickHouse. Pull it for two consecutive fortnights. Compute the correlation between the two periods. Checkable output: rho, and one minus rho squared, which is the fraction of variance a CUPED adjustment would leave you with. Anything above rho of 0.6 means you are currently running experiments substantially longer than necessary.",
  reflection: "Which of your experiment metrics has a pre-period version available, and has anyone ever checked its autocorrelation?",
  recall: {
    q: "Why does adjusting for a pre-experiment covariate not bias the treatment effect?",
    a: "Because the covariate was measured before randomisation, treatment cannot have influenced it. Its expected value is the same in both arms, so subtracting a multiple of it shifts both arms equally and leaves the difference unchanged.\n\nAdjusting for a covariate measured after assignment would not be safe, since treatment could have moved it and you would be conditioning on a collider or removing part of the effect."
  },
  forecast: { q: "When I compute the fortnight-to-fortnight correlation for our main per-tenant experiment metric, will it come out above 0.6?" },
  deepDive: "Help me pick a pre-period covariate for this experiment metric and estimate the variance reduction before I commit to a runtime."
},
{
  id: "uncertainty-clustering",
  track: "uncertainty", level: "applied",
  title: "Repeated measurements of the same unit are not independent observations",
  source: "A. Colin Cameron and Douglas L. Miller, A Practitioner's Guide to Cluster-Robust Inference, Journal of Human Resources, 2015",
  idea: "Treating a thousand traces from fifty tenants as a thousand independent samples understates the standard error by a factor set by the intra-cluster correlation, and the fix is to cluster at the level at which treatment was assigned.",
  why: "The standard error of a mean assumes independent draws. Traces from one tenant are not independent: they share a schema, a prompt style, a set of connectors and a user population, so if one fails there is elevated probability that others do too. The classic inflation factor is one plus m minus one times rho, where m is the average number of observations per cluster and rho is the intra-cluster correlation. With twenty traces per tenant and a modest rho of 0.1, that is 2.9, so your true standard error is about 1.7 times what you computed.\n\nCameron and Miller's practical guidance is to cluster at the level of treatment assignment, not at the finest level available, and to be wary when the number of clusters is small. With fifty tenants you are near the edge of where cluster-robust standard errors behave; with ten you are past it and need a wild cluster bootstrap or a design-based alternative. The number that matters for your precision is the number of clusters, not the number of rows.",
  failureMode: "An eval reports a 2.1 point improvement, standard error 0.5, computed over 4,000 traces. The traces come from 12 tenants. Clustered at the tenant, the standard error is 1.4 and the improvement is indistinguishable from nothing. The dashboard has been reporting the row-level number for six months.",
  experiment: "For your main quality metric, run the same aggregate twice in ClickHouse: once with the naive standard error over rows, once by first collapsing to one number per tenant and computing the standard error over those tenant means. Checkable output: the ratio, and the count of distinct tenants. If the tenant count is under 30, note that too, because it changes which method you should be using.",
  reflection: "How many independent clusters does your headline quality number actually rest on, as opposed to how many rows?",
  recall: {
    q: "You have 4,000 traces from 20 tenants with an intra-cluster correlation of 0.15. Roughly how wrong is the naive standard error?",
    a: "The average cluster size is 200, so the design effect is one plus 199 times 0.15, about 30. The standard error is understated by the square root of that, roughly a factor of five and a half.\n\nThe effective sample size is closer to 130 than to 4,000, and with only 20 clusters you should also be cautious about cluster-robust standard errors and consider a wild cluster bootstrap."
  },
  deepDive: "Given this table schema, tell me what my clusters are, how many I have, and whether cluster-robust standard errors are safe at that count."
},
{
  id: "uncertainty-eval-error-bars",
  track: "uncertainty", level: "applied",
  title: "Every eval number needs an error bar, and the arithmetic is not hard",
  source: "Evan Miller, Adding Error Bars to Evals: A Statistical Approach to Language Model Evaluations, arXiv 2411.00640, 2024",
  idea: "Treat the eval set as a sample from a distribution of questions you care about, report the standard error of the mean score, and use paired differences and clustered resampling when questions share a source.",
  why: "Miller's framing is the load-bearing part. An eval score is not a measurement of the model; it is an estimate of the model's expected score over a population of questions, computed from a finite sample. Once you accept that, the standard error of the mean is the obvious next line, and for a pass rate over n independent questions it is the square root of p times one minus p over n. On a 200-item eval at 80 percent, that is 2.8 points, so the interval is roughly 74 to 86.\n\nHe sets out several practical recommendations that go past the basic interval: cluster your standard errors when questions come in related groups, such as multiple items drawn from the same document; reduce within-question variance by using the model's answer probabilities or by resampling answers rather than taking a single draw; analyse paired differences when comparing two models on the same questions; and use power analysis to decide how many questions the comparison needs before running it. The recurring point is that the eval number and the eval difference are different estimands with different variances, and the difference is the one you usually care about.",
  failureMode: "A model card reports 82.4 percent on a 150-item benchmark and the next release reports 84.1 percent, presented as an improvement. The standard error on each is about 3 points, and the paired standard error on the difference, which is what should have been reported, was never computed.",
  experiment: "Take your team's current eval leaderboard. For every score on it, add the standard error of the mean using the square root of p times one minus p over n. Checkable output: the number of ranking positions on that leaderboard that are within two standard errors of each other. Report that count to whoever owns the leaderboard.",
  reflection: "How many of the model comparisons your team has made this quarter would survive their own error bars?",
  recall: {
    q: "What is the estimand behind an eval score, and what follows from naming it?",
    a: "The model's expected score over the population of questions the eval set is meant to represent. The eval set is a finite sample from that population.\n\nOnce it is a sample statistic it has a standard error, roughly the square root of p times one minus p over n for a pass rate, and comparisons between models should be analysed as paired differences on the same questions rather than as two independent scores."
  },
  forecast: { q: "After I add standard errors to our eval leaderboard, will at least two of the current rankings turn out to be within two standard errors of each other?" },
  deepDive: "Take our eval results file and add the standard errors and paired difference intervals Miller recommends, then tell me which comparisons no longer hold."
},
{
  id: "uncertainty-small-eval-clt",
  track: "uncertainty", level: "advanced",
  title: "Below a few hundred items the normal approximation stops protecting you",
  source: "Sam Bowyer, Laurence Aitchison and Desi R. Ivanova, Position: Don't Use the CLT in LLM Evals With Fewer Than a Few Hundred Datapoints, arXiv 2503.01747, 2025",
  idea: "For the small, skewed and clustered eval sets that are normal in practice, central limit theorem intervals quietly undercover and Bayesian or exact methods should be the default instead.",
  why: "The central limit theorem is an asymptotic result, and how fast it kicks in depends on the shape of what you are averaging. Bernoulli scores near zero or one are strongly skewed, so the sampling distribution of the mean is skewed too, and a symmetric normal interval sits in the wrong place. Bowyer, Aitchison and Ivanova argue that eval sets below a few hundred items sit squarely inside the regime where this matters, and that this is not an edge case but the common case: bespoke internal evals are routinely tens of items.\n\nTheir position is to use Bayesian methods, which give a posterior over the score that is well behaved at any n, rather than a normal interval whose coverage degrades silently. The same argument applies with more force to paired comparisons on small sets and to clustered eval sets, where both the skew and the dependence push in the same direction. The practical rule: below roughly a few hundred items, treat a plus-or-minus from a normal approximation as a lower bound on your real uncertainty.",
  failureMode: "A 40-item internal eval for a new agent skill reports 92.5 percent plus or minus 8 from a normal approximation. The upper bound exceeds 100 percent, someone clips it, and the interval is now asymmetric for the wrong reason. A beta posterior would have given a properly asymmetric interval without the clipping.",
  experiment: "Take your smallest internal eval set. Compute three intervals for its pass rate: normal approximation, Wilson, and the 95 percent credible interval from a Beta posterior with a uniform prior, which is Beta of x plus 1 and n minus x plus 1. Checkable output: the three lower bounds. Note whether the normal upper bound leaves the unit interval. Then count how many internal evals your team runs below 200 items.",
  reflection: "What is the median size of the eval sets your team makes decisions on, and is it above or below a few hundred?",
  recall: {
    q: "Why does the central limit theorem fail you specifically on small eval sets, rather than just being imprecise?",
    a: "The CLT is asymptotic and its convergence rate depends on skew. Bernoulli scores near zero or one are heavily skewed, so at small n the sampling distribution of the mean is skewed and a symmetric interval is misplaced, undercovering on one side.\n\nThe symptom is coverage below nominal without any warning, plus bounds that can leave the zero-to-one range. Bayesian posteriors and exact methods behave correctly at any n."
  },
  deepDive: "For this small eval set, give me the beta posterior interval and tell me how far off the normal approximation was."
},
{
  id: "uncertainty-twenty-five-misreadings",
  track: "uncertainty", level: "applied",
  title: "Twenty five ways to misread a p-value, an interval or a power calculation",
  source: "Sander Greenland, Stephen J. Senn, Kenneth J. Rothman, John B. Carlin, Charles Poole, Steven N. Goodman and Douglas G. Altman, Statistical Tests, P Values, Confidence Intervals, and Power: A Guide to Misinterpretations, European Journal of Epidemiology, 2016",
  cheat: "Non-significant is not no effect: read the interval's upper bound, because minus 1 to plus 9 points hides the year's biggest win.",
  idea: "Greenland and colleagues enumerate and correct twenty five specific misinterpretations, and two of them cause most of the damage in engineering review meetings.",
  why: "The first damaging one: a non-significant result means there is no effect. It does not. It means the data are compatible with no effect, and they are also compatible with every other value inside the interval, including large ones. The correct response to a non-significant result is to read the upper bound of the interval and ask whether an effect that size would matter. If it would, you have not ruled it out, you have failed to measure it.\n\nThe second: two studies disagree because one was significant and the other was not. Two results can be highly compatible while landing on opposite sides of a threshold, since a p of 0.04 and a p of 0.06 are almost the same evidence. The difference between significant and non-significant is not itself significant. The paper's broader framing is that a p-value measures compatibility between the data and a model that includes the test hypothesis plus every other assumption in the analysis, so a small p-value can indict any of those assumptions, not just the hypothesis you were interested in.",
  failureMode: "The eval comparison comes back at p equals 0.11 and the decision is recorded in Jira as no difference between the variants. The interval ran from minus 1 to plus 9 points. Nine points would have been the largest quality win of the year, and the ticket now says it does not exist.",

  why: "Senn's point is that the arms were drawn from the same distribution because you drew them that way. The test is therefore calibrated to reject at its nominal rate and every rejection is a false positive. A small p-value on a baseline covariate tells you a coin came up heads, not that the trial is compromised.\n\nThe decision that actually matters is whether to adjust for a covariate, and that should be made on prognostic grounds before the data exist. If tenant size predicts the outcome, adjust for it whether or not it looks balanced. If it does not predict the outcome, adjusting because a chance imbalance appeared makes the model choice a function of the realised data, which inflates the error rate and buys nothing.",
  failureMode: "The Table 1 with p-values habit. Twenty baseline covariates, one lands at p equals 0.03, and someone asks to rerun the randomisation. You have now conditioned the entire analysis on a coin flip, and the rerun is not a fresh randomisation, it is a search.",
  experiment: "Pull the assignment table from your most recent experiment. Compute standardised mean differences, the difference in means divided by the pooled standard deviation, for the five covariates you believe most strongly predict the outcome. Do not compute p-values. Then write the covariate adjustment list for the next experiment, commit it to the repo before that experiment starts, and check afterwards whether it survived contact with the readout.",
  reflection: "Which covariates made your prespecified adjustment list, and what evidence rather than intuition put each one there?",
  recall: {
    q: "Randomisation was executed correctly and a baseline covariate comes out at p equals 0.02. What has gone wrong?",
    a: "Nothing. Under correct randomisation the null of no baseline difference is true by construction, so a small p-value is a false positive arriving at exactly the advertised rate.\n\nThe right response is to keep to the prespecified adjustment set chosen on prognostic grounds, not to react to the imbalance."
  },
  deepDive: "Look at my experiment's baseline table and tell me which covariates deserve prespecified adjustment on prognostic grounds."
},
{
  id: "design-rct-not-automatically-top",
  track: "design", level: "core",
  title: "An RCT is not automatically better evidence than a well designed observational study",
  source: "Angus Deaton and Nancy Cartwright, Understanding and Misunderstanding Randomized Controlled Trials, Social Science and Medicine, 2018",
  idea: "Randomisation gives an unbiased estimate of an average effect in the trial sample and says nothing about precision, mechanism or transport.",
  why: "Deaton and Cartwright separate three things that get conflated. Unbiasedness is a property of the estimator over hypothetical repetitions and says nothing about the error in your one trial. Precision is a separate matter: randomising does not shrink variance, and with the skewed outcomes typical of latency, spend or token counts a single trial can be badly off while remaining perfectly unbiased. And the estimand is a sample average, which with heterogeneous effects can be a number that describes nobody in the sample.\n\nThe average effect also carries no mechanism. It does not tell you why the effect appeared, so it does not tell you whether it will appear in a different tenant, a different region or on the next model version. An observational study with a credible identification argument plus a known mechanism can support a stronger claim about what happens next than a clean trial with no theory attached. That is why a fixed hierarchy of evidence, with RCTs pinned at the top, misleads.",
  failureMode: "\"We ran an A/B, so this is settled.\" The A/B ran for two weeks on self-serve tenants with a median of four connected assets, the effect was carried by a handful of heavy users, and the feature now ships to enterprise accounts with hundreds of thousands of assets. Internally valid, externally irrelevant.",
  experiment: "Take the last A/B decision you signed off. Write three sentences: the exact population that was randomised, the estimand you actually estimated, and the population the decision now governs. Then query ClickHouse for the share of traffic under that decision which was represented in the randomised sample. Record the number.",
  reflection: "What fraction of the traffic your last decision governs was actually in the trial, and does that number bother you?",
  forecast: { q: "Will the share of currently governed traffic that was represented in my last A/B come out below fifty per cent?" },
  recall: {
    q: "Randomisation makes the estimate unbiased. Name three things it does not give you.",
    a: "Precision, mechanism and transportability. Unbiasedness is a property over repetitions, not a bound on the error in this trial, and randomising does nothing to reduce variance.\n\nIt also produces a sample average that may describe no individual unit, and it explains nothing about why the effect occurred, which is what you would need to predict whether it recurs elsewhere."
  },
  deepDive: "Given the population I randomised and the population my decision now covers, tell me which specific claim my A/B actually supports."
},
{
  id: "design-design-before-outcomes",
  track: "design", level: "core",
  title: "Design the observational study before you look at the outcomes",
  source: "Paul R. Rosenbaum, Design of Observational Studies, 2010",
  idea: "Every choice about comparison groups, matching and covariates must be fixed while the outcomes are still hidden.",
  why: "Rosenbaum's framing is that an observational study should be built to imitate the randomised experiment you cannot run. The design stage, meaning who is compared with whom, on which covariates, with what caliper and over what outcome window, corresponds exactly to the part of a trial that happens before any outcome exists. Do that part with outcomes visible and you can search, consciously or not, over specifications until the answer is agreeable. No interval computed afterwards accounts for that search.\n\nFixing the design first also makes the study checkable. A design settled in advance can be assessed against balance diagnostics, which use no outcome data, and can carry a prespecified sensitivity analysis. A design tuned against the outcome is indistinguishable from an untuned one when someone else reads the doc, which is precisely why the discipline has to be procedural rather than a matter of good intentions.",
  failureMode: "A \"did the new planner help?\" analysis where the analyst tries three definitions of the comparison cohort, keeps the one where the difference clears significance, and reports that one. The other two never appear in the document and nobody who reads it can tell.",
  experiment: "For an observational comparison you are about to run, say tenants who adopted a feature versus those who did not, write the design document first: cohort definitions, the covariates you will match or adjust on, the outcome window, and the sensitivity analysis you will report. Commit it before you run a single query touching the outcome column. Then run it once and report what comes out.",
  reflection: "Did you change anything in the design after seeing the first outcome number, and if so, exactly what?",
  recall: {
    q: "What does it mean to say an observational study has a design stage, and how do you know you are still in it?",
    a: "The design stage is every decision that a randomised trial would make before outcomes exist: cohorts, matching, covariates, calipers, outcome window, sensitivity analysis. You are still in it if all your diagnostics use covariates only.\n\nThe moment you look at an outcome, further design changes become an outcome-informed search that no downstream p-value corrects for."
  },
  deepDive: "Review my observational design document and tell me which of its choices could only have been made by someone who had already seen the outcome."
},
{
  id: "design-propensity-score-balancing",
  track: "design", level: "core",
  title: "The propensity score reduces a many-dimensional balancing problem to one number",
  source: "Paul R. Rosenbaum and Donald B. Rubin, The Central Role of the Propensity Score in Observational Studies for Causal Effects, Biometrika, 1983",
  idea: "The probability of treatment given the covariates is a balancing score: conditioning on it balances every covariate that went into it.",
  why: "Rosenbaum and Rubin's result is that if treatment assignment is strongly ignorable given a covariate vector X, it is also strongly ignorable given the single number e(X), the probability of treatment given X. So instead of hunting for comparison units that match on twenty covariates, which fails in high dimension because nothing matches on everything at once, you match on one number and the twenty balance in expectation.\n\nThe scope of the guarantee is exactly the covariates in the model. The score does nothing whatever about anything unmeasured. A propensity model with thirty predictors is not more robust to hidden confounding than one with three; it balances thirty things rather than three. Overlap matters too: units with fitted scores near zero or one have no counterparts, so dropping them silently redefines the estimand as the effect over the region of common support.",
  failureMode: "You match tenants on region, plan tier, seat count and connector count, then report the adopters' retention advantage. What actually drove adoption was one engaged data steward, which you never recorded. The propensity score cannot see her, so the estimate stays confounded no matter how tidy the balance table looks.",
  experiment: "Fit a logistic regression of \"adopted feature X\" on the tenant covariates you already have in ClickHouse. Take the fitted probability for each tenant and plot two histograms of it, treated and untreated, on the same axis. Read off the number of treated tenants whose score exceeds the largest untreated score. Those have no possible comparison unit and must leave the analysis; count them and say what fraction of the treated group they were.",
  reflection: "How many treated tenants fell outside common support, and what does dropping them do to the population your estimate describes?",
  recall: {
    q: "What exactly does conditioning on the propensity score buy you, and what does it leave untouched?",
    a: "It reduces balancing on many covariates to balancing on one number: given strong ignorability on X, conditioning on the scalar probability of treatment given X balances X in expectation.\n\nIt leaves untouched everything not in X. Unmeasured confounding is entirely unaffected by the size or sophistication of the propensity model."
  },
  deepDive: "Here are the covariates in my propensity model; name the confounder most likely missing from it and how I could proxy for it."
},
{
  id: "design-matching-is-a-design-choice",
  track: "design", level: "applied",
  title: "Matching is a design choice with named failure modes",
  source: "Elizabeth A. Stuart, Matching Methods for Causal Inference: A Review and a Look Forward, Statistical Science, 2010",
  idea: "The matching method is a decision with explicit trade-offs, and the only thing that validates it is covariate balance after matching.",
  why: "Stuart lays out the axes: with or without replacement, one-to-one or one-to-many, caliper or no caliper, nearest neighbour on the score or exact on a few key variables, greedy or optimal or full matching. Each buys balance at a price. A caliper improves balance but discards treated units, which changes the estimand from the effect on all treated to the effect on the matchable treated. Matching with replacement improves balance but cuts the effective sample size and needs a variance formula that accounts for reused controls.\n\nNone of this is settled by argument. The check is the balance table: standardised mean differences for every covariate before and after, plus variance ratios and something about the tails, because two distributions can share a mean and differ everywhere else. Because these diagnostics use no outcome data, you may iterate on the matching method as much as you like without contaminating anything. That is what the design stage is for.",
  failureMode: "One-to-one nearest neighbour matching with no caliper on a data set where the treated group is far smaller than the control pool. Every treated unit gets a \"match\", several of them absurd, and the balance table is never printed. The paired means look reassuring and the pairs are junk.",
  experiment: "Take the propensity model from the previous entry. Match one-to-one nearest neighbour twice: once with no caliper, once with a caliper of 0.2 standard deviations of the logit of the score. Print standardised mean differences for every covariate under both, plus the count of treated units retained. Note which covariates the caliper fixed and how much sample it cost.",
  reflection: "Which covariate had the worst standardised mean difference after matching, and is it one that predicts your outcome?",
  forecast: { q: "Will the calipered match bring every covariate's standardised mean difference below 0.1?" },
  recall: {
    q: "You cannot decide between two matching specifications. What do you compare, and why is it safe to keep iterating?",
    a: "Compare balance: standardised mean differences for every covariate, variance ratios, and the tails, along with how many treated units each specification retains.\n\nIt is safe to iterate because none of those diagnostics touch the outcome, so the search cannot bias the effect estimate. Iterating after you have seen the outcome is a different activity entirely."
  },
  deepDive: "Here is my post-matching balance table; tell me whether this match is good enough to interpret and which covariate worries you most."
},
{
  id: "design-propensity-matching-paradox",
  track: "design", level: "advanced",
  title: "Propensity score matching can increase imbalance the harder you try",
  source: "Gary King and Richard Nielsen, Why Propensity Scores Should Not Be Used for Matching, Political Analysis, 2019",
  idea: "Pruning observations to tighten a propensity score match can make covariate imbalance worse, and it gets worse the more you prune.",
  why: "King and Nielsen's argument turns on what the score approximates. Matching on the propensity score targets a completely randomised experiment, where covariates balance only on average, rather than a fully blocked experiment, where they balance within strata. Once pruning has taken you to the point where the remaining units resemble a completely randomised sample, every further pair you remove is removed essentially at random with respect to the covariates. Deleting units at random from an already balanced set does not improve balance; on average it degrades it, while also raising variance and model dependence.\n\nThe mechanism is dimension collapse. Two units with the same propensity score can differ wildly in the underlying covariates, because the score only summarises the probability of treatment, not the covariate profile. Methods that use the covariates directly, such as Mahalanobis distance matching, coarsened exact matching or full matching on covariates, target the blocked experiment instead and do not exhibit the paradox.",
  failureMode: "An analyst tightens the caliper from 0.2 to 0.05, reports that the match is now \"tighter\", and the balance table quietly degrades on two covariates while the pair count halves. The point estimate moves and nobody can say whether that was the better balance, the smaller sample, or noise.",
  experiment: "Rerun your match at a sequence of calipers: 0.5, 0.2, 0.1, 0.05, 0.02. For each one record the number of matched pairs and the mean absolute standardised difference across all covariates. Plot mean imbalance against units pruned. If the curve bottoms out and then turns upward, you have reproduced the paradox on your own data and you know where to stop.",
  reflection: "Where did your imbalance curve bottom out, and were you about to prune past that point?",
  recall: {
    q: "Why can pruning more aggressively on the propensity score make balance worse rather than better?",
    a: "Because propensity matching approximates a completely randomised experiment, not a blocked one. Past the point where the matched set already looks randomised, further pruning removes units at random with respect to covariates, which on average worsens balance and increases variance and model dependence.\n\nMatching on the covariates directly, for example Mahalanobis or coarsened exact matching, targets the blocked experiment and avoids this."
  },
  deepDive: "Plot my imbalance-versus-pruning curve from these caliper runs and tell me which caliper to fix on."
},
{
  id: "design-sensitivity-gamma",
  track: "design", level: "advanced",
  title: "State how strong the hidden confounder would have to be to overturn your result",
  source: "Paul R. Rosenbaum, Observational Studies, second edition, 2002",
  idea: "A sensitivity analysis reports the amount of hidden bias your conclusion can absorb before it stops holding.",
  why: "Rosenbaum's device is a parameter, conventionally Gamma, that bounds how much two units with identical measured covariates may differ in their odds of receiving treatment. Gamma equal to 1 is the randomised case. Gamma equal to 2 says one unit of a pair could be twice as likely to be treated for reasons you never observed. For each Gamma you compute the worst-case p-value across every hidden assignment pattern consistent with that bound, and you report the largest Gamma at which the worst case is still significant.\n\nThis converts \"but there could be confounding\" from an unanswerable objection into a quantity domain experts can argue about. Saying the conclusion survives to Gamma equal to 3.5 invites the useful question of whether any plausible unmeasured factor could triple the odds of treatment. That is a conversation about the world rather than about statistics, and it is one your reviewers are qualified to have.",
  failureMode: "An observational readout that ends \"we controlled for the main confounders\". A reviewer says \"what about self-selection\", the discussion goes in circles because neither side has a number, and the study dies of an objection that might have been worth 1.2 on the Gamma scale.",
  experiment: "Take a matched-pair observational comparison you already have, adopters versus matched non-adopters on a binary outcome. Count the discordant pairs, meaning the pairs where exactly one unit succeeded. Under a given Gamma the probability that a discordant pair favours treatment is bounded between 1/(1+Gamma) and Gamma/(1+Gamma). Recompute the one-sided binomial p-value using the unfavourable bound for Gamma equal to 1, 1.5, 2 and 3, and report the largest Gamma that still clears 0.05. Two counts and a spreadsheet.",
  reflection: "What Gamma did your result survive to, and can you name a real unmeasured factor of that strength?",
  recall: {
    q: "What does the sensitivity parameter Gamma quantify, and why is reporting it better than saying you adjusted for confounders?",
    a: "Gamma bounds how much two units with identical measured covariates could differ in their odds of treatment because of something unmeasured. You report the largest Gamma at which the worst-case p-value still clears your threshold.\n\nIt is better because it turns an unfalsifiable objection into a number, so the argument becomes whether any real factor is that strong rather than whether confounding is conceivable."
  },
  deepDive: "Walk me through computing a Rosenbaum sensitivity bound on my matched pairs and tell me what Gamma is defensible in my domain."
},
{
  id: "design-e-value",
  track: "design", level: "applied",
  title: "The E-value is a sensitivity analysis you can compute from a risk ratio alone",
  source: "Tyler J. VanderWeele and Peng Ding, Sensitivity Analysis in Observational Research: Introducing the E-Value, Annals of Internal Medicine, 2017",
  cheat: "E-value every observational claim at the confidence limit: a risk ratio of 1.2 needs only about 1.69 on both treatment and outcome.",
  idea: "The E-value is the minimum association an unmeasured confounder would need with both treatment and outcome to explain away your observed effect.",
  why: "For an observed risk ratio RR of at least 1, the E-value is RR plus the square root of RR times RR minus 1. It is the smallest value such that an unmeasured confounder associated with both the treatment and the outcome by at least that much, on the risk ratio scale and conditional on the measured covariates, could account for the whole observed association. If RR is below 1, take its reciprocal first and apply the same formula.\n\nCompute it twice: once for the point estimate and once for the confidence limit closest to the null, which is the number that should drive the decision. A risk ratio of 1.2 has an E-value of about 1.69. A risk ratio of 2 has an E-value of about 3.41. It requires no additional data and no assumption about the confounder's direction or distribution, which is exactly why it is cheap enough to make routine on every observational claim you publish internally.",
  failureMode: "A readout claims a twenty per cent relative lift in weekly active usage among tenants who enabled the agent. That is an E-value of about 1.69, which a mild unmeasured factor clears easily: engaged tenants both switch on new features and use the product more. Nobody computed it, so the twenty per cent went onto a QBR slide unqualified.",
  experiment: "Find the last observational relative-difference claim in one of your documents and express it as a risk ratio. Compute RR plus the square root of RR times RR minus 1 for both the point estimate and the confidence limit nearer the null. Write both numbers into the document beside the claim. A spreadsheet with two cells is enough.",
  reflection: "What was the E-value at the confidence limit, and can you name a covariate already in your data with an association that strong?",
  forecast: { q: "Will the E-value at the confidence limit for my next observational claim come out below 2?" },
  recall: {
    q: "State the E-value formula for a risk ratio above 1 and say precisely what quantity it describes.",
    a: "E-value equals RR plus the square root of RR times RR minus 1. For a risk ratio below 1, take the reciprocal first.\n\nIt is the minimum strength of association, on the risk ratio scale, that an unmeasured confounder would need with both the treatment and the outcome, conditional on measured covariates, to fully explain away the observed effect."
  },
  deepDive: "Compute E-values for the point estimate and confidence limit of this claim and tell me whether the number is defensible."
},
{
  id: "design-find-the-accident",
  track: "design", level: "applied",
  title: "Look for the accident in the world that assigned treatment for you",
  source: "Joshua D. Angrist and Jorn-Steffen Pischke, Mostly Harmless Econometrics, 2009",
  idea: "Identification comes first and estimation second, so the question to ask is what variation in the treatment is as good as randomly assigned.",
  why: "Angrist and Pischke open with four questions: what is the causal relationship of interest, what experiment could ideally measure it, what is your identification strategy, and what is your mode of statistical inference. The third is where most production analyses fall over. You need to name the accident: a rollout order set by a scheduler, a regional feature flag, a capacity limit, a pricing tier boundary, a migration wave. Once you can name it, the estimator follows almost mechanically.\n\nThe discipline protects you in the other direction too. Most causal claims in product analytics fail at the identification question, and discovering that in ten minutes is worth far more than three days of specification search that produces a confidently wrong coefficient. If there is no accident, the honest output is a descriptive claim, clearly labelled as one.",
  failureMode: "A regression of retention on \"used the agent at least once\" with fifteen controls. There is no accident anywhere in it, because tenants chose to use the agent. The coefficient describes who chose, dressed up as an effect of choosing.",
  experiment: "Pick a causal question your team currently answers with a controlled regression or a raw cohort comparison. Write out Angrist and Pischke's four questions and answer each in a sentence. Then go looking through your systems for one accident: a Temporal workflow rollout ordered by something unrelated to tenant quality, a flag enabled by region, a queue threshold, a scheduler tie-break. Either name it or write down that there isn't one.",
  reflection: "Did you find an accident, and if not, what does that mean for the claim you were about to make?",
  recall: {
    q: "What is the identification question, and what should you do when the honest answer is that there is no accident?",
    a: "It asks what variation in the treatment is as good as randomly assigned, and it must be answered before any estimator is chosen.\n\nWhen there is no such variation, no set of controls rescues the regression. Downgrade the claim to a description of who selected into treatment, and label it that way."
  },
  deepDive: "Here is my causal question and the systems I have; help me find any variation in treatment that is plausibly as good as random."
},
{
  id: "design-late-compliers",
  track: "design", level: "advanced",
  title: "An instrument estimates the effect on compliers only",
  source: "Joshua D. Angrist, Guido W. Imbens and Donald B. Rubin, Identification of Causal Effects Using Instrumental Variables, Journal of the American Statistical Association, 1996",
  idea: "Under relevance, exclusion, independence and monotonicity, instrumental variables recovers the average effect for the subgroup the instrument moved.",
  why: "Angrist, Imbens and Rubin partition the population by response to the instrument: always-takers, never-takers, compliers and defiers. Monotonicity is the assumption that there are no defiers. Always-takers and never-takers contribute nothing, because the instrument does not change their treatment status, so the Wald ratio, the difference in outcomes divided by the difference in take-up, is the average effect among compliers. That is the local average treatment effect.\n\nThe complier group is defined by the instrument rather than chosen by you, and no unit can be individually identified as one. What you can do is estimate its size, which is just the first-stage difference in take-up, and characterise it by comparing complier covariate means against the population. Do that before you report anything, because a LATE estimated off eight per cent of your users is a fact about those eight per cent.",
  failureMode: "You use \"was shown the upgrade banner\" as an instrument for \"enabled the agent\". The banner also changes what users expect the product to do, so it reaches the outcome through a channel other than enablement. Exclusion fails, and the whole banner effect gets divided by a small take-up difference, which inflates the estimate rather than merely biasing it.",
  experiment: "For any instrument you are considering, compute the first stage: take-up rate among instrumented units minus take-up rate among the rest. That difference is your complier share. If it is under about ten per cent, note that the estimate will be both narrow in scope and imprecise, since a small denominator magnifies everything. Then write one sentence naming the channel through which exclusion could fail, and one saying why you believe it does not.",
  reflection: "What is your complier share, and how do those users differ from the population on the covariates you have?",
  recall: {
    q: "Name the four IV assumptions and say what makes the estimand local rather than average.",
    a: "Relevance, exclusion, independence and monotonicity. Relevance means the instrument moves take-up, exclusion that it affects the outcome only through take-up, independence that it is as good as randomly assigned, monotonicity that nobody responds in the opposite direction.\n\nIt is local because the instrument only shifts compliers, so only their outcomes enter the ratio. Monotonicity is what makes that subgroup coherent by ruling out defiers."
  },
  deepDive: "Assess my proposed instrument against relevance, exclusion, independence and monotonicity, and tell me which one is weakest."
},
{
  id: "design-threshold-natural-experiment",
  track: "design", level: "applied",
  title: "A threshold in an existing policy is a natural experiment",
  source: "Donald L. Thistlethwaite and Donald T. Campbell, Regression-Discontinuity Analysis: An Alternative to the Ex Post Facto Experiment, Journal of Educational Psychology, 1960",
  idea: "Units just above and just below a cutoff are comparable, so a jump in the outcome at the cutoff identifies the effect there.",
  why: "Thistlethwaite and Campbell's original case was awards handed out above a test score cutoff. Whatever generally determines the running variable, close enough to the threshold the difference between 79 and 80 is noise. So if everything else is continuous at the cutoff and the outcome jumps, the jump is attributable to the treatment. You get an estimate without anyone having run an experiment.\n\nThe assumption with teeth is that nobody can precisely manipulate their position on the running variable. If units can place themselves just over the line, then the ones just above differ from the ones just below in exactly the way that matters. The standard diagnostic is the density of the running variable at the cutoff: a spike on one side, or a hole on the other, is evidence of sorting. Note also that the estimate is local to the cutoff, so a discontinuity at a hundred-seat threshold says nothing about ten-seat tenants.",
  failureMode: "Rate limits and quota tiers are full of thresholds and full of manipulation. If tenants approaching a thousand-asset limit trim assets to stay under it, then the ones just below the line are the careful ones and the ones just above are not. The discontinuity you measure is the effect of being careful.",
  experiment: "List the numeric thresholds already baked into your product and infrastructure: rate limits, quota tiers, retry caps, plan boundaries, autoscaling triggers, timeout values. Pick one and plot a fine-binned histogram of the running variable around the cutoff in ClickHouse. Look for a spike or a hole. A smooth density means you have a candidate natural experiment; a lumpy one means you have discovered that people game the threshold, which is worth knowing on its own.",
  reflection: "Which threshold had a smooth density, and what outcome would you compare either side of it?",
  forecast: { q: "Will the density of the running variable at the threshold I picked look smooth at the cutoff, with no visible spike or hole?" },
  recall: {
    q: "What single assumption does a regression discontinuity design stand on, and how do you check it?",
    a: "That nobody can precisely manipulate their position on the running variable, so assignment just either side of the cutoff is effectively arbitrary.\n\nYou check it by plotting the density of the running variable around the cutoff and looking for a spike or a hole, which would indicate sorting. The estimate is also local to the cutoff and does not extrapolate."
  },
  deepDive: "Here are the thresholds in my system; tell me which is the best regression discontinuity candidate and what would invalidate it."
},
{
  id: "design-parallel-trends",
  track: "design", level: "core",
  title: "Difference in differences works only if the untreated trend would have been parallel",
  source: "David Card and Alan B. Krueger, Minimum Wages and Employment: A Case Study of the Fast-Food Industry in New Jersey and Pennsylvania, American Economic Review, 1994",
  idea: "Subtracting the control group's change from the treated group's change removes fixed differences and common shocks, and nothing else.",
  why: "Card and Krueger compared fast food employment in New Jersey, where the minimum wage rose, with eastern Pennsylvania, where it did not, before and after the change. Differencing within each state removes anything fixed about that state; differencing across states removes anything that hit both in the same period. What survives is the treatment effect plus any difference in the underlying trends.\n\nThat last term is the whole game, and it is a counterfactual, so it is not testable. What you can do is look at pre-treatment periods and check whether the two series moved together before treatment. Parallel pre-trends are evidence, not proof, because something could have changed at exactly the moment treatment did. Note also that parallel trends is scale-dependent: two series parallel in levels are generally not parallel in logs, so the functional form is part of the assumption rather than a presentation choice.",
  failureMode: "You compare tenants who got the new agent runtime in the first wave against those who did not, before and after. The first wave was chosen because those tenants were growing and vocal. They were already on a steeper trajectory, and your difference in differences hands that trajectory to the rollout.",
  experiment: "Take a rollout you can put a date on. In ClickHouse, pull the weekly metric for treated and untreated groups for at least eight weeks before the rollout and plot both series. Do not compute the difference in differences yet. Look at the pre-period: are the lines parallel, and are they still parallel in logs as well as levels? Compute the estimate only if the answer is yes, and if it is no, say so instead of estimating.",
  reflection: "Were your pre-trends parallel in levels, in logs, in both or in neither?",
  recall: {
    q: "Difference in differences removes two things and assumes a third. Name all three.",
    a: "It removes time-invariant differences between the groups and shocks common to both groups over the period. It assumes the two groups' outcomes would have moved in parallel in the absence of treatment.\n\nThat assumption is a counterfactual and therefore untestable. Parallel pre-trends are supporting evidence only, and parallelism depends on scale, so levels and logs are different assumptions."
  },
  deepDive: "Look at my pre-period series for treated and control and tell me whether parallel trends is credible here in levels or in logs."
},
{
  id: "design-staggered-twfe",
  track: "design", level: "advanced",
  title: "Staggered rollouts break the standard difference in differences estimator",
  source: "Andrew Goodman-Bacon, Difference-in-Differences with Variation in Treatment Timing, Journal of Econometrics, 2021",
  idea: "With staggered timing the two-way fixed effects coefficient is a weighted average of every two-group comparison in the data, and some weights can be negative.",
  why: "Goodman-Bacon decomposes the two-way fixed effects estimate into every possible two-by-two comparison: early-treated against never-treated, late-treated against never-treated, early against late before the late group switches on, and the troublesome one, late-treated against already-treated early units used as controls. The weights come from group sizes and the variance of the treatment indicator within each pair, which peaks for cohorts treated near the middle of the panel.\n\nIf treatment effects are constant over time, the already-treated comparison is harmless because the early group's effect differences out. If effects grow or decay, which is the normal case for a product rollout where adoption ramps for weeks after enablement, the early group's changing effect enters that comparison with the opposite sign. The aggregate coefficient can then be smaller than every individual unit's effect, or the wrong sign entirely.",
  failureMode: "A phased rollout across tenants over six months, analysed with a tenant fixed effect, a week fixed effect and a treated dummy. Adoption ramps for three months after each tenant is switched on. The coefficient lands near zero and someone concludes the feature does nothing, when what happened is that late switchers were compared against early switchers mid-ramp.",

{
  id: "experiments-twymans-law",
  track: "experiments", level: "core",

  why: "This is Twyman's law, quoted throughout Kohavi, Tang and Xu, and it is a statement about prior odds rather than about pessimism. Ask how often a single change to a mature product moves a headline metric by twenty percent, and then ask how often a data pipeline has a bug in a given quarter. The second rate is much higher than the first. Conditional on seeing a twenty percent move, the bug hypothesis wins on the prior before you look at the p-value at all.\n\nThe intuition busters paper attacks the reflex that produces the opposite reaction. A small p-value says the data are unlikely under the null, not that the effect is large; effect size and significance are separate readings, and a huge estimate in a small sample is exactly the situation where the estimate is least reliable. Add the winner's curse - the experiments you decide to celebrate are selected on having large observed effects, so their estimates are biased upward - and the surprising result is the one you should trust least, not most.",

{

{

{
  id: "experiments-peeking",
  track: "experiments", level: "core",
  title: "A p-value you watch continuously is not a p-value",
  source: "Ramesh Johari, Pete Koomen, Leonid Pekelis and David Walsh, Peeking at A/B Tests: Why It Matters and What to Do About It, KDD, 2017",
  idea: "A fixed-sample p-value only controls error at the single sample size you committed to in advance, so checking it as data arrives inflates the false positive rate.",
  why: "The guarantee behind a five percent significance level is a statement about one test at one predetermined n. Watching the number as data accumulates turns the test statistic into a random walk and turns your decision into a stopping rule, and a random walk with no drift will wander across any fixed boundary eventually. Armitage, McPherson and Rowe showed in 1969 that testing at 0.05 after each of ten equally spaced looks gives a false positive rate of roughly nineteen percent. Let the looks continue without limit and the probability of eventually crossing goes to one, under the null, with certainty.\n\nThe practical problem is that nobody will stop looking. The dashboard exists, the VP has the link, and the incentive to stop as soon as the result is favourable is exactly what makes the inflation worst, because early crossings are dominated by noise. Johari and colleagues construct an always-valid p-value: a sequence whose running minimum still satisfies the error guarantee, so that the probability that it ever dips below alpha under the null is at most alpha. You give up some power at the planned sample size and buy the freedom to look whenever you like.",

{
  id: "experiments-anytime-valid",
  track: "experiments", level: "advanced",
  title: "Anytime-valid inference lets you stop whenever you like",
  source: "Aaditya Ramdas, Peter Grunwald, Vladimir Vovk and Glenn Shafer, Game-Theoretic Statistics and Safe Anytime-Valid Inference, Statistical Science, 2023",
  idea: "Evidence accumulated as a betting process gives error guarantees that hold at every stopping time, including stopping times chosen after seeing the data.",
  why: "Recast the test as a game. You bet against the null hypothesis, starting with one unit of wealth, and the null is only allowed to offer you fair bets. Your wealth process is then a non-negative martingale under the null with expectation one at all times. Ville's inequality says the probability that such a process ever reaches 1 over alpha is at most alpha, so reaching twenty means you may reject at the five percent level, no matter when you stop or how many times you looked. An e-value is a snapshot of that wealth: a non-negative statistic whose expectation under the null is at most one, and one over the e-value behaves like a conservative p-value.\n\nFor a Bernoulli outcome this is concrete. Testing whether the success rate is at most p0, pick an alternative p1 above it and multiply your wealth by p1 over p0 on each success and by one minus p1 over one minus p0 on each failure. That product is a test martingale. It has three properties a p-value does not: it composes by multiplication across independent batches, it can be reported mid-flight as a running strength of evidence, and it never punishes you for adding more data.",
  failureMode: "A team runs an agent regression suite nightly and applies a fresh test each morning against the same quality bar. Over a quarter that is ninety tests at five percent, so several alarms are pure noise and the team learns to ignore the alarm. The suite becomes a ritual that has been trained out of anyone's decision loop.",

  reflection: "Where in your delivery process do you currently re-test the same hypothesis on a schedule, and what would the wealth process for it look like instead?",

    q: "What is Ville's inequality and what does it buy you over a fixed-sample test?",
    a: "For a non-negative martingale that starts at one, the probability it ever reaches 1 over alpha is at most alpha. So a wealth process built from fair bets against the null can be monitored continuously and rejected whenever it crosses that level.\n\nThe fixed-sample test controls error at one pre-committed sample size only. The martingale controls it at every stopping time, which is what you need when someone will read the dashboard every morning regardless of what you asked them to do.",
  },
  deepDive: "Help me build a betting martingale for my agent eval pass rate, including how to choose the alternative rate and what wealth threshold to alert on."
