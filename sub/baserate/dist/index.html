{
  id: "failures-p-value-misreading",
  track: "failures", level: "core",
  title: "A p-value does not measure the probability that the hypothesis is true",
  source: "Ronald L. Wasserstein and Nicole A. Lazar, The ASA's Statement on p-Values: Context, Process, and Purpose, The American Statistician, 2016",
  idea: "A p-value measures how incompatible the data are with a specified model including the null, and nothing about the probability that the studied hypothesis is true or that the result matters.",
  why: "The ASA statement sets out six principles. P-values can indicate how incompatible the data are with a specified statistical model. P-values do not measure the probability that the studied hypothesis is true, nor the probability that the data were produced by chance alone. Scientific conclusions and business decisions should not be based only on whether a p-value passes a threshold. Proper inference requires full reporting and transparency. A p-value does not measure the size of an effect or the importance of a result. And by itself a p-value does not provide a good measure of evidence regarding a model or hypothesis.\n\nThe fourth principle is the one people skip and the one that matters most for the others. Cherry-picking promising findings, or reporting only the analyses that produced small p-values, renders the reported p-values uninterpretable. So the number is only as meaningful as the disclosure around it, which means a p-value in a Slack message with no protocol attached carries roughly zero information.",
  failureMode: "A dashboard shows the new retrieval strategy beat the old one at p equals 0.04 and the room reads that as a 96 percent chance the new strategy is better. It is not that. It is a statement that data this extreme would occur 4 percent of the time if the two strategies were identical and every modelling assumption held, which for a metric with a heavy tail and correlated sessions is already doubtful.",
  experiment: "Find a p-value in a document your team produced in the last month. Write, in one sentence, the exact statement it licenses, starting with the words if there were no difference. Then check whether the document's conclusion is stronger than that sentence.",

  recall: {
    q: "State what a p-value is, and name the ASA principle that makes most reported p-values uninterpretable.",
    a: "It is the probability, under a specified model including the null hypothesis, of data at least as extreme as what was observed. It is not the probability the hypothesis is true and it says nothing about effect size.\n\nThe principle about full reporting and transparency: selective reporting of analyses or outcomes destroys the interpretation of any p-value that survives the selection."
  },
  deepDive: "Take a significance claim I am about to present and rewrite it as a statement about effect size and uncertainty that does not lean on the threshold."

{
  id: "failures-file-drawer",
  track: "failures", level: "applied",
  title: "The studies you can see are a biased sample of the studies that were run",
  source: "Robert Rosenthal, The File Drawer Problem and Tolerance for Null Results, Psychological Bulletin, 1979",
  idea: "When null results go unpublished, the visible literature overstates every effect it contains, and the same mechanism runs inside a company through the experiments people remember.",
  why: "Rosenthal named the extreme case: journals filled with the five percent of studies that produced Type I errors while the ninety-five percent that found nothing sit in file drawers. His tolerance calculation asks how many unpublished null studies would be needed to push a summarised effect back to non-significance. If that fail-safe number is small, the finding is one filing cabinet away from disappearing.\n\nInside an organisation the filter is different but the shape is the same. Experiments that shipped get written up, get a launch post and get cited in the next planning doc. Experiments that came back flat get abandoned without a document, and the person who ran them moves on. Six months later the team's prior on whether this class of change works is built entirely from the surviving arm of the sample.",

    a: "It is the number of unpublished null studies that would have to exist to reduce a summarised significant effect to non-significance. A small fail-safe number means the finding is fragile to publication bias.\n\nInside a company the file drawer is the set of experiments that were run and never written up, usually because they found nothing, which makes the surviving record of what works systematically optimistic."

{
  id: "failures-outcome-switching",
  track: "failures", level: "applied",
  title: "Outcomes get swapped between protocol and publication more often than not",
  source: "An-Wen Chan, Asbjorn Hrobjartsson, Mette T. Haahr, Peter C. Gotzsche and Douglas G. Altman, Empirical Evidence for Selective Reporting of Outcomes in Randomized Trials, JAMA, 2004",
  idea: "Comparing what a study said it would measure against what it reported shows that most studies changed, added or dropped a primary outcome, and that significant outcomes were the ones that survived.",
  why: "Chan and colleagues obtained the protocols for a cohort of randomised trials and compared them with the published articles. Around half of efficacy outcomes and around two thirds of harm outcomes were incompletely reported per trial. Statistically significant results were substantially more likely to be fully reported than non-significant ones. And in roughly sixty percent of trials, at least one primary outcome had been changed, newly introduced or omitted between protocol and paper.\n\nThis is the empirical measurement of the mechanism the previous entries describe. It is not a simulation and it is not a theory about incentives. It is a direct audit of protocol against publication, and it shows the filter operating at the level of which outcome gets called primary. The reason preregistration works is that it makes exactly this comparison possible; without a protocol on record there is nothing to audit against.",
  failureMode: "The design doc for the agent launch names two success criteria: median task completion time and human escalation rate. The launch review reports task completion time, a new satisfaction proxy and nothing about escalations. Escalations went the wrong way. No one lied; the outcome set was quietly reshaped around what moved.",

{
  id: "failures-replication-rate",
  track: "failures", level: "core",
  title: "Replication rates are the empirical test of a field's methods",
  source: "Open Science Collaboration, Estimating the Reproducibility of Psychological Science, Science, 2015",
  idea: "When a hundred psychology findings were replicated with high-powered direct replications, about thirty-six percent produced significant results and the average effect size was roughly half the original.",

  experiment: "List every quality or performance improvement your team claimed in the last two quarters. Pick the three cheapest to re-measure and re-run their original measurement today, on fresh data, unchanged. Count how many still show the claimed effect. That is your replication rate, from a sample of three.",

{
  id: "failures-regression-to-mean",
  track: "failures", level: "applied",
  title: "Extreme measurements move back towards average without anyone doing anything",
  source: "Adrian G. Barnett, Jolieke C. van der Pols and Annette J. Dobson, Regression to the Mean: What It Is and How to Deal With It, International Journal of Epidemiology, 2005",
  cheat: "Judge a fix on the worst week against unselected weeks: at correlation 0.6, ten points below the mean rebounds four by itself.",
  idea: "Selecting the worst-performing week, tenant or model and then intervening guarantees an apparent improvement, because extreme values contain measurement noise that does not repeat.",
  why: "Barnett and colleagues give the arithmetic. If two measurements of the same unit correlate at r, and you select a unit whose first measurement sits d away from the mean, the expected second measurement sits r times d away from the mean. Any r below 1 pulls it in. The noisier the metric, the lower r, and the larger the free improvement you get for doing nothing.\n\nThe trap is that selection on the extreme is exactly how operational work starts. You do not investigate an average week; you investigate the bad one. So every intervention in operations is applied to a selected extreme, and every one of them shows improvement afterwards. Barnett's remedies are the ones you would expect: a randomised control group measured over the same period, or a prespecified comparison against the trend of the unselected population, or using a separate baseline measurement from the one used for selection.",
  failureMode: "P99 agent latency spikes in one week, you spend the sprint on a caching change, and next week P99 is down thirty percent. The caching change may have done nothing. Every other week that was not selected also drifted towards the mean, and you never looked at them, so you have no counterfactual and the caching work now has a fabricated track record.",

  reflection: "How much of the improvement after your worst weeks is reproduced by the random sample, which means it was never yours?",

    a: "About six points below the mean, so an apparent four-point improvement from nothing. The expected next value is the mean plus r times the deviation.\n\nThe only defences are a control group over the same period, a prespecified comparison against the unselected trend, or selecting on one measurement and evaluating on a different one."

{
  id: "failures-reusable-holdout",
  track: "failures", level: "advanced",
  title: "Reusing a holdout set repeatedly turns it into a training set",
  source: "Cynthia Dwork, Vitaly Feldman, Moritz Hardt, Toniann Pitassi, Omer Reingold and Aaron Roth, The Reusable Holdout: Preserving Validity in Adaptive Data Analysis, Science, 2015",
  idea: "A holdout set gives an unbiased estimate only for analyses chosen independently of it, and every decision you make after looking at it spends some of that guarantee.",
  why: "The standard argument for a holdout assumes the model was fixed before the holdout was touched. In practice you check the holdout, change something because of what you saw, and check again. Each round leaks information from the holdout into the model, so after enough rounds the holdout score is an optimistic training score wearing a different name. Dwork and colleagues show this is not a small effect: in their classification demonstration the naive holdout tracks a rising accuracy that is entirely illusory while true accuracy stays flat.\n\nTheir mechanism, Thresholdout, does two things. It compares the holdout answer to the training answer and only reports the holdout value when the two differ by more than a noisy threshold, otherwise returning the training value. And it charges a fixed budget each time the threshold is exceeded, refusing further queries once the budget is spent. The calibrated noise is what stops the analyst from reverse-engineering the holdout through many small queries, and the budget is what makes the remaining guarantee finite and stated rather than assumed.",

{
  id: "forecasting-brier-score",
  track: "forecasting", level: "core",
  title: "Brier's score is the mean of the squared difference between your probability and the outcome",
  source: "Glenn W. Brier, Verification of Forecasts Expressed in Terms of Probability, Monthly Weather Review, 1950",
  idea: "Score a probability forecast by taking the outcome as 1 if the event happened and 0 if it did not, squaring the gap between your probability and that number, and averaging over all your forecasts.",
  why: "Brier was solving a verification problem, not a psychology problem. Forecasters were issuing probabilities and nobody could say whether one office was better than another, because any single probabilistic forecast is unfalsifiable. Squared error over many forecasts fixes that. It is minimised at zero, it is bounded above at one in the binary case, and it punishes confident wrongness quadratically: saying 0.9 when the answer is no costs 0.81, while saying 0.6 and being wrong costs 0.36.\n\nTwo pieces of bookkeeping matter. First, Brier's original definition summed over all categories including the complement, so his numbers run from 0 to 2. Everyone now uses the half-Brier, the mean of (p minus outcome) squared over the binary case, which runs 0 to 1. Second, the number is meaningless in isolation. A Brier of 0.18 is excellent for coin-flip-hard questions and terrible for questions where the event happens 5 percent of the time. You always score against a baseline, and the baseline is the forecaster who ignores the question and says the base rate every time.",
  failureMode: "A team reports 'we were right about 8 of our last 10 calls'. That throws away every probability. The forecaster who said 0.51 on all eight and the one who said 0.95 get the same credit, and the one who said 0.95 and was wrong twice looks identical to the one who said 0.55 and was wrong twice. Accuracy on a rounded call is not a score of a probability.",
  experiment: "Two parts, both done today. First, open your Jira board and pull the last three completed sprints. Compute the fraction of committed tickets that actually closed inside the sprint. That fraction is your base rate, and the Brier score of the always-say-the-base-rate forecaster is base rate times one minus base rate. Write that number down; it is the bar. Second, open a spreadsheet and write a probability, to two decimals, that each ticket currently committed in this sprint will close by the end of it. Checkable output today: the baseline Brier number and a file of dated forecasts. Checkable output at sprint end: your Brier, and whether it is below the bar.",
  reflection: "What baseline Brier did the always-base-rate forecaster get on your board, and does that number surprise you in either direction?",
  recall: {
    q: "You forecast 0.8 on three events and 0.2 on one. The three at 0.8 happened, the one at 0.2 did not. What is your Brier score?",
    a: "Three terms of (0.8 minus 1) squared equals 0.04 each, and one term of (0.2 minus 0) squared equals 0.04. The mean of four values of 0.04 is 0.04.\n\nZero is perfect and 0.25 is what you get by saying 0.5 to everything, so 0.04 is strong. Whether it is skilful still depends on how predictable those four events were."
  },

{
  id: "forecasting-murphy-decomposition",
  track: "forecasting", level: "core",
  title: "Brier decomposes into reliability, resolution and uncertainty",
  source: "Allan H. Murphy, A New Vector Partition of the Probability Score, Journal of Applied Meteorology, 1973",
  cheat: "Calibration alone proves nothing, since always saying the base rate is perfectly calibrated; check resolution beats 10 percent of uncertainty.",
  idea: "Brier equals reliability minus resolution plus uncertainty, so calibration is only one of three things going on and it is the one that is cheapest to fake.",
  why: "Bin your forecasts by the probability you gave. Reliability is the weighted mean squared gap between the probability you said in a bin and the fraction of events that actually happened in that bin; it is calibration error and lower is better. Resolution is the weighted mean squared gap between each bin's observed frequency and the overall base rate; it measures how far you are willing to move away from the base rate and be right about it, so higher is better. Uncertainty is the base rate times one minus the base rate, the variance of the event itself, and it is a property of the questions, not of you.\n\nThe consequence is the point of the entry. A forecaster who says the base rate to every question has reliability zero, which is perfect, and resolution zero, so his Brier is exactly the uncertainty term. He is flawlessly calibrated and carries no information. Skill is the resolution term. Calibration is the licence to be believed; resolution is what you are actually paid for. When someone shows you a calibration plot as evidence their model is good, the plot cannot answer the question, because the useless forecaster produces the best plot in the room.",
  failureMode: "A risk review presents an incident-likelihood model, well calibrated, and everyone nods. Then you notice every prediction it emits sits between 0.06 and 0.11 and the historical incident rate is 0.08. The model has learned the base rate and nothing else. Its Brier beats a coin flip and its resolution is close to zero, so it has never once told anyone which week to worry about.",
  experiment: "Take any binary event you have history for in ClickHouse or Grafana - a given Temporal workflow type failing on a given day, say - over the last 90 days. Compute the base rate and the uncertainty term, base rate times one minus base rate. Now take whatever prediction you or a dashboard rule currently makes about that event, bin the predictions into five buckets, and compute the reliability and resolution terms by hand in a spreadsheet. Checkable output: three numbers that recombine to the Brier score, and specifically whether resolution is more than 10 percent of uncertainty. If it is not, the predictor is a base rate in a costume.",
  reflection: "For the predictor you decomposed, is the problem reliability or resolution? Those need completely different fixes, so name which one before you touch anything.",
  recall: {
    q: "A forecaster is perfectly calibrated and completely useless. Which term of the Murphy decomposition explains each half of that sentence?",
    a: "Reliability is zero, which is what perfect calibration means: in every bin the observed frequency matches the stated probability. Resolution is also zero, because every bin's observed frequency equals the overall base rate, so the forecasts never distinguish one case from another.\n\nBrier then equals the uncertainty term alone, which is the score you get for free by knowing nothing except how often the event happens."
  },
  forecast: { q: "When I decompose our current incident or failure predictor, will its resolution term come out below 10 percent of the uncertainty term?" },

{
  id: "forecasting-proper-rules",
  track: "forecasting", level: "advanced",
  title: "A scoring rule has to be proper or it rewards lying",
  source: "Tilmann Gneiting and Adrian E. Raftery, Strictly Proper Scoring Rules, Prediction, and Estimation, Journal of the American Statistical Association, 2007",
  idea: "A scoring rule is strictly proper when your expected score is optimised uniquely by reporting the probability you actually believe, and most home-made scoring schemes are not.",
  why: "Work the expectation. If you truly believe the probability is p and you report q, your expected Brier loss is p times (1 minus q) squared plus (1 minus p) times q squared. Differentiate and it is minimised at q equal to p, uniquely. That is what strictly proper means: honesty is not merely allowed, it is the only optimum. The log score, minus the log of the probability you assigned to what happened, has the same property. Gneiting and Raftery show these are essentially the two you want, and give the general characterisation that generates the rest.\n\nNow do the same for a rule that rounds at 0.5 and counts hits. If you believe p is 0.7, your expected score is 0.7 for any reported q above 0.5 and 0.3 for any q below it. The expectation is flat across the entire region, so the rule cannot tell 0.51 from 0.99 and gives you no reason to report the truth rather than the most extreme claim you can defend socially. Any scheme with a threshold, a bonus for boldness, or a cap on penalties has this defect somewhere, and the people being scored will find it faster than you will.",
  failureMode: "An agent eval scores the model's self-reported confidence by checking whether high-confidence answers are correct more often than low-confidence ones, with a threshold at 0.8. Within a quarter every confidence output is either 0.05 or 0.95, the metric looks better than ever, and the confidence signal is now worthless for routing or for deciding when to escalate to a human.",
  experiment: "One spreadsheet, ten minutes. Column A: reported q from 0 to 1 in steps of 0.05. Column B: expected Brier loss if your true belief is 0.7, that is 0.7 times (1 minus q) squared plus 0.3 times q squared. Column C: expected score under round-at-0.5 accuracy, which is 0.7 when q is above 0.5 and 0.3 otherwise. Checkable output: column B has a unique minimum at 0.70; column C is a step function with a flat top. Then go find every place your team scores a confidence or a likelihood and check which shape it has.",
  reflection: "Which metric that your team currently reports would a mildly cynical person game by becoming more extreme rather than more accurate?",
  recall: {
    q: "Why is 'percentage of calls where we were on the right side of 50 percent' an improper scoring rule, and what does that cost you?",
    a: "Expected score under that rule is constant for every report on the same side of the threshold, so reporting 0.99 pays exactly as well as reporting 0.51 when you believe 0.51. Truth-telling is not uniquely optimal, so the rule exerts no pressure towards it.\n\nThe cost is that the probabilities stop carrying information. Once forecasters drift to the extremes to look decisive, you can no longer use the number to size a bet, order a queue, or decide what to escalate."
  },

{
  id: "forecasting-sharpness",
  track: "forecasting", level: "advanced",
  title: "Maximise sharpness subject to calibration",
  source: "Tilmann Gneiting, Fadoua Balabdaoui and Adrian E. Raftery, Probabilistic Forecasts, Calibration and Sharpness, Journal of the Royal Statistical Society Series B, 2007",
  idea: "The goal of probabilistic forecasting is the tightest predictive distribution you can produce that is still honest, because calibration is a constraint and sharpness is the objective.",
  why: "Calibration is a joint property of forecasts and outcomes: over the long run, the things you called 30 percent happen 30 percent of the time, and your 80 percent intervals contain the truth 80 percent of the time. Sharpness is a property of the forecasts alone, with no reference to what happened: how concentrated the predictive distribution is. A wide interval and a narrow interval can both be calibrated; only one of them is useful.\n\nGneiting, Balabdaoui and Raftery state the paradigm as maximising sharpness subject to calibration, and it is the cleanest one-line brief you can give anyone building a forecasting system. It also tells you the order of operations. Do not optimise for narrow intervals first and repair coverage later, because narrow-and-wrong looks confident right up until it fails. Fix coverage, then compete on width. The same framing generalises the reliability-and-resolution split from the binary case to full distributions, which is what you need when the quantity you forecast is a latency or a cost rather than a yes or no.",
  failureMode: "A capacity forecast quotes a range so wide it always contains the outcome, and the team is proud of never having been wrong. The range spans a factor of four, so it cannot decide anything, and the actual provisioning decision is made off the point estimate that nobody scored.",
  experiment: "Pull 120 days of a daily metric you care about from Grafana or ClickHouse: agent runs per day, p95 latency, whatever you have. Build two 80 percent predictive intervals for each of the last 30 days using only prior data: one from the 10th and 90th percentiles of the full trailing history, one from the trailing 14 days. Checkable output: for each method, the empirical coverage over the 30 days and the mean interval width. You want the one with coverage nearest 0.8 and, among those, the narrower. If the wide one is the only one that covers, you have learned that your metric is less predictable than the dashboard implies.",
  reflection: "What is the widest interval you have quoted in the last month that nobody pushed back on, and what decision would it have had to be narrower to support?",
  recall: {
    q: "Two forecasters are both perfectly calibrated. What separates them, and which direction do you want it to go?",
    a: "Sharpness: how concentrated their predictive distributions are. Sharpness is measured from the forecasts alone and does not need outcomes.\n\nYou want more of it, but only under the calibration constraint. Optimising sharpness without checking coverage produces a confident forecaster who is quietly wrong."
  },
  forecast: { q: "For the metric I test this week, will the trailing-14-day interval achieve empirical coverage of at least 0.7 over the last 30 days?" },

{
  id: "forecasting-estimative-words",
  track: "forecasting", level: "applied",
  title: "Words like likely mean different numbers to different readers",
  source: "Sherman Kent, Words of Estimative Probability, Studies in Intelligence, 1964",
  idea: "Estimative phrases are read as wildly different probabilities by different readers, so a forecast that will be scored needs a number, a date and a named resolution source.",
  why: "Kent's example is a 1951 national estimate that said there was a serious possibility of a Soviet attack on Yugoslavia. He and his colleagues had meant something around 65 percent. When he polled readers on what the phrase conveyed, the answers ran from roughly 20 percent to roughly 80 percent. Every one of those readers thought they had understood the document. The estimate was unfalsifiable in both directions, which is precisely why the phrasing survives: it cannot be scored, so it cannot be wrong.\n\nKent's response was a table pinning phrases to ranges, with 'probable' at about 75 percent give or take 12 and 'chances about even' at 50 give or take 10. The table is less important than the discipline behind it. A question that will actually resolve needs three things a hedge word cannot supply: a quantity, a deadline, and the specific artefact that will be consulted to settle it. 'The migration will probably be fine' resolves to nothing. 'Fewer than 3 tenant-visible errors attributable to the migration in the 14 days after cutover, counted from the errors dashboard' resolves itself.",

  experiment: "Take one real sentence containing a hedge word from your most recent RFC or design review. Send it verbatim to eight colleagues with one question: what probability, as a number between 0 and 100, does this sentence convey to you? Do not explain why. Checkable output: the range and the standard deviation of the eight answers. Then rewrite the sentence with a number, a date and a resolution source, and send it again to check the spread collapses.",

{
  id: "forecasting-reference-class",
  track: "forecasting", level: "applied",
  title: "Start from the distribution of similar past projects, then adjust",
  source: "Bent Flyvbjerg, From Nobel Prize to Project Management: Getting Risks Right, Project Management Journal, 2006",
  idea: "Identify a class of comparable completed projects, use the distribution of their actual outcomes as your starting estimate, and adjust only for differences you can specifically name.",
  why: "Flyvbjerg's data on large infrastructure is a study in how bad the inside view is: rail projects overran cost by an average of around 45 percent, bridges and tunnels by around 34 percent, roads by around 20 percent, and the bias showed no improvement over decades of practice. The forecasts were not noisy around the truth, they were biased in one direction, which means better effort inside the same method does not help. Reference class forecasting was his operational answer, drawn from Kahneman and Tversky's outside view, and it has since been written into UK Treasury guidance as explicit optimism-bias uplifts.\n\nThe method is three steps. Choose a reference class of past cases similar enough to be informative and numerous enough to have a distribution. Establish that distribution of outcomes, not its mean. Then position your case within it, adjusting only for concrete, nameable differences. The reason it works is that it replaces a story with a frequency. Your plan is a narrative that describes one path through the project, and the narrative always describes the path where nothing surprising happens, because surprises are by construction not in the plan.",

{
  id: "forecasting-expert-confidence",
  track: "forecasting", level: "core",
  title: "Expert confidence and expert accuracy are close to unrelated",
  source: "Philip E. Tetlock, Expert Political Judgment: How Good Is It? How Can We Know?, 2005",
  idea: "Across twenty years of scored forecasts from several hundred experts, expertise bought almost no accuracy, media prominence was negatively related to accuracy, and the only reliable predictor of skill was cognitive style.",
  why: "Tetlock ran the study the field had been avoiding: he took specific, resolvable questions from working experts, held them for years, and scored them. The headline is that the experts barely outperformed crude extrapolation rules and were beaten by simple statistical models. Subject-matter depth was not the variable that mattered. Time spent on a region, access to classified material and academic seniority all failed to separate the good forecasters from the bad.\n\nWhat did separate them was Isaiah Berlin's distinction. Hedgehogs know one big thing and drive every question through a single organising theory; foxes hold several partial models at once and are comfortable that none of them is the whole story. Foxes scored better. Hedgehogs scored worse and were more confident, and the two facts are connected: a single theory generates extreme probabilities cheaply. The relationship with fame is the part to carry into your own building. Being invited to speak about a domain selects for confident, memorable, single-theory explanations, which is exactly the profile that scored worst.",

<script>
/*
 * A four-operator arithmetic evaluator over named profile fields.
 *
 * Entries declare their sum as a string, so something has to turn that string
 * into a number. Not eval, and not a Function constructor: this runs in a page
 * that holds the reader's own financial figures, and an expression is content
 * rather than code. The grammar is an allowlist - decimal numbers, declared
 * identifiers, the four operators, brackets, and a leading sign. Anything else
 * fails to tokenise, so a call, a subscript, a semicolon or a property access
 * never reaches an evaluator at all.
 *
 * Both halves of the toolchain use this. build.js compiles every expression at
 * build time and checks its identifiers against the declared profile, which is
 * what stops a typo from surfacing as a silent NaN months later on the one day
 * that entry comes up.
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.EXPR = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  var NUM = /^\d+(?:\.\d+)?/;
  var NAME = /^[A-Za-z_][A-Za-z0-9_]*/;
  var PREC = { '+': 1, '-': 1, '*': 2, '/': 2 };

  function tokenize(src) {
    var s = String(src), out = [], i = 0;
    while (i < s.length) {
      var rest = s.slice(i), c = rest.charAt(0), m;
      if (c === ' ' || c === '\t' || c === '\n') { i++; continue; }
      if ((m = NUM.exec(rest))) { out.push({ t: 'num', v: parseFloat(m[0]) }); i += m[0].length; continue; }
      if ((m = NAME.exec(rest))) { out.push({ t: 'name', v: m[0] }); i += m[0].length; continue; }
      if (c === '(' || c === ')') { out.push({ t: c }); i++; continue; }
      if (PREC[c]) { out.push({ t: 'op', v: c }); i++; continue; }
      throw new Error('unexpected "' + c + '" at position ' + i);
    }
    if (!out.length) throw new Error('empty expression');
    return out;
  }

  /* Shunting-yard. `expectOperand` is what rejects the shapes that tokenise
     cleanly but are not arithmetic: two values in a row, a doubled operator
     such as **, or a bracket opening straight after a value, which is how a
     function call would have to look. */
  function toRPN(tokens) {
    var out = [], ops = [], expectOperand = true, i, tk, top;
    for (i = 0; i < tokens.length; i++) {
      tk = tokens[i];
      if (tk.t === 'num' || tk.t === 'name') {
        if (!expectOperand) throw new Error('two values in a row near "' + tk.v + '"');
        out.push(tk);
        expectOperand = false;
      } else if (tk.t === 'op') {
        if (expectOperand) {
          if (tk.v !== '-' && tk.v !== '+') throw new Error('"' + tk.v + '" needs a value before it');
          out.push({ t: 'num', v: 0 });          // unary: -x becomes 0 - x
          ops.push(tk);
        } else {
          while (ops.length) {
            top = ops[ops.length - 1];
            if (top.t === 'op' && PREC[top.v] >= PREC[tk.v]) out.push(ops.pop());
            else break;
          }
          ops.push(tk);
        }
        expectOperand = true;
      } else if (tk.t === '(') {
        if (!expectOperand) throw new Error('a bracket cannot follow a value');
        ops.push(tk);
        expectOperand = true;
      } else {
        if (expectOperand) throw new Error('empty brackets');
        while (ops.length && ops[ops.length - 1].t !== '(') out.push(ops.pop());
        if (!ops.length) throw new Error('unbalanced brackets');
        ops.pop();
        expectOperand = false;
      }
    }
    if (expectOperand) throw new Error('expression ends with an operator');
    while (ops.length) {
      top = ops.pop();
      if (top.t === '(') throw new Error('unbalanced brackets');
      out.push(top);
    }
    return out;
  }

  function compile(src) { return toRPN(tokenize(src)); }

  function names(src) {
    var seen = {}, out = [];
    tokenize(src).forEach(function (tk) {
      if (tk.t === 'name' && !seen[tk.v]) { seen[tk.v] = 1; out.push(tk.v); }
    });
    return out;
  }

  /* Returns null rather than NaN for a missing field or a division by zero.
     A NaN would render as "NaN" and read as a computed answer. */
  function run(src, vars) {
    var rpn = compile(src), st = [], i, tk, a, b, v;
    for (i = 0; i < rpn.length; i++) {
      tk = rpn[i];
      if (tk.t === 'num') { st.push(tk.v); continue; }
      if (tk.t === 'name') {
        v = vars ? vars[tk.v] : undefined;
        if (typeof v !== 'number' || !isFinite(v)) return null;
        st.push(v);
        continue;
      }
      b = st.pop();
      a = st.pop();
      if (tk.v === '+') st.push(a + b);
      else if (tk.v === '-') st.push(a - b);
      else if (tk.v === '*') st.push(a * b);
      else if (b === 0) return null;
      else st.push(a / b);
    }
    v = st.pop();
    return (typeof v === 'number' && isFinite(v)) ? v : null;
  }

  return { compile: compile, names: names, run: run, tokenize: tokenize };
});

<script>
/* ==========================================================================
   Daily — the reader

   Speaks a rendered entry aloud through the browser's own synthesiser. Nothing
   is fetched and nothing is stored, which is the only way a corpus this size
   gets an audio track at all: narrated as files the shared corpus runs to tens
   of hours, and a built page has to stay one self-contained file that works
   offline.

   The reader is handed text and speaks it. It never reads the corpus itself,
   and that division is load-bearing. app.js hands it only blocks that are on
   screen, and a locked entry returns before its body is built, so gated prose
   is not withheld here - it does not exist to be read. The recall answer is
   never part of an entry at all. Neither rule is enforced in this file and
   neither needs to be.

   Every utterance is short. Chrome stops synthesising after roughly fifteen
   seconds of a single utterance, reports no error, and leaves the queue
   looking healthy, so a paragraph handed over whole goes quiet halfway and
   nothing says why. Splitting to sentences keeps every utterance well inside
   that limit, which fixes it without a timer fighting the browser for control.
   ========================================================================== */
(function () {
  'use strict';

  var API = window.speechSynthesis;
  var Utterance = window.SpeechSynthesisUtterance;
  var NAV = window.navigator;
  var AVAILABLE = !!(API && Utterance);

  /* Only ever asked in this direction. navigator.onLine reports whether a
     network interface exists, not whether anything is reachable, so a true is
     worth nothing: a captive portal, a router with no uplink and a dead
     endpoint all report it. A false is the one answer it gets right, and it is
     the only one needed here. Compared against false explicitly so a browser
     that does not implement the property reads as online rather than as
     permanently offline. */
  function offline() {
    return !!NAV && NAV.onLine === false;
  }

  /* Long enough that the splits fall on real sentence ends most of the time,
     short enough that even the slowest voice finishes one inside the limit. */
  var MAX_CHUNK = 200;

  var voice = null;
  var queue = [];
  var at = 0;
  var mode = 'idle';                    // idle | playing | paused
  var hooks = {};

  /* Bumped by everything that ends a read. A cancelled utterance still fires
     onend or onerror, and without this the handler advances a queue that has
     already been replaced, which starts the next entry reading itself. */
  var gen = 0;

  /* --- Splitting ---------------------------------------------------------- */
  function split(text) {
    var clean = String(text == null ? '' : text).replace(/\s+/g, ' ').trim();
    var out = [];
    if (!clean) return out;

    var re = /[^.!?]+[.!?]*/g;
    var m;
    while ((m = re.exec(clean)) !== null) {
      var s = m[0].trim();
      if (s) push(out, s);
    }
    return out;
  }

  /* A sentence long enough to trip the limit is broken again at its last
     clause boundary. Cutting mid-clause is audible as a stumble, so a sentence
     with nowhere good to break goes over whole: a rare long utterance beats a
     reliable wrong pause. */
  function push(out, s) {
    if (s.length <= MAX_CHUNK) { out.push(s); return; }

    var cut = -1;
    ['; ', ': ', ', ', ' - '].forEach(function (mark) {
      var found = s.lastIndexOf(mark, MAX_CHUNK);
      if (found !== -1 && found + mark.length > cut) cut = found + mark.length;
    });

    if (cut === -1) { out.push(s); return; }
    out.push(s.slice(0, cut).trim());
    push(out, s.slice(cut).trim());
  }

  /* --- Voice --------------------------------------------------------------
     Nothing in the API reports how good a voice sounds, so the name is the
     only evidence there is. The tiers matter more than they look: a Mac offers
     around forty-seven English voices, most of them the 1990s concatenative
     set and a dozen of them novelty toys, so taking the first of anything is a
     coin flip that can land on Zarvox.

     Neural voices say so in their names. macOS ships its good ones as Premium
     or Enhanced downloads, Chrome's network voices are the Google family, and
     Edge exposes Microsoft's as Natural or Online. Anything unmarked falls
     through to whatever the browser itself calls default, which is at least a
     choice rather than a stumble, and then to no preference at all. Guessing
     is what produces the toys, so the last tier declines to guess. */
  var TIERS = [
    /premium|enhanced|neural|natural/i,
    /^(google|microsoft)\b/i
  ];

  function pickVoice() {
    var all = API.getVoices() || [];
    if (!all.length) return;

    var en = all.filter(function (v) { return /^en([-_]|$)/i.test(v.lang); });
    /* A voice that is served over the network cannot work with the network
       down, so it is dropped from the running rather than chosen and then
       failed on. This is what keeps the tiers below from trading away the one
       property these pages are built on. */
    if (offline()) en = en.filter(function (v) { return v.localService; });
    if (!en.length) { voice = null; return; }

    /* Local wins inside a tier but never across one. A downloaded Premium beats
       a Google voice that needs the network, and a Google voice beats the local
       1990s set: these pages are built to work offline, but not at the price of
       sounding like a train announcement when something better is installed. */
    function best(pool) {
      var local = pool.filter(function (v) { return v.localService; });
      return (local.length ? local : pool)[0];
    }

    for (var i = 0; i < TIERS.length; i++) {
      var tier = en.filter(function (v) { return TIERS[i].test(v.name); });
      if (tier.length) { voice = best(tier); return; }
    }

    voice = en.filter(function (v) { return v.default; })[0] || null;
  }

  /* getVoices() is empty until the list loads, and browsers disagree about
     whether voiceschanged fires when it was already populated. Both paths ask. */
  if (AVAILABLE) {
    pickVoice();
    API.addEventListener('voiceschanged', pickVoice);
  }

  /* --- Queue --------------------------------------------------------------- */
  function announce(next) {
    mode = next;
    if (hooks.onState) hooks.onState(next);
  }

  function finish() {
    gen += 1;
    queue = [];
    at = 0;
    if (hooks.onPart) hooks.onPart(-1);
    announce('idle');
  }

  function step() {
    if (at >= queue.length) { finish(); return; }

    var mine = gen;
    var item = queue[at];
    if (at === 0 || item.part !== queue[at - 1].part) {
      if (hooks.onPart) hooks.onPart(item.part);
    }

    var u = new Utterance(item.text);
    if (voice) { u.voice = voice; u.lang = voice.lang; }
    u.onend = function () {
      if (gen !== mine) return;
      at += 1;
      step();
    };
    /* Cancellations arrive here too and the generation check has already
       swallowed those, so anything reaching the body is a voice that will not
       speak. The read ends rather than stuttering through the rest of the
       queue in silence, and the caller is told which kind of failure it was.

       Worth separating because only one of the two has anything the reader can
       act on. A network voice fails whenever the endpoint does not answer, and
       navigator.onLine cannot see most of the ways that happens - a captive
       portal reports itself as online - so this is where those cases surface
       rather than in the guard above. */
    u.onerror = function () {
      if (gen !== mine) return;
      var networked = !!(voice && !voice.localService);
      finish();
      if (hooks.onFail) hooks.onFail(networked ? 'network' : 'voice');
    };
    API.speak(u);
  }

  /* --- Public ------------------------------------------------------------ */
  function stop() {
    if (!AVAILABLE) return;
    gen += 1;
    queue = [];
    at = 0;
    API.cancel();
    if (mode !== 'idle') {
      if (hooks.onPart) hooks.onPart(-1);
      announce('idle');
    }
  }

  /* parts is [{ text }] in the order they should be heard. Anything else on
     those objects is the caller's and is passed back untouched by index.

     Returns false rather than starting where nothing would come out. A browser
     can carry the whole synthesis API and have no voice behind it - Chrome on
     a Linux box with no speech-dispatcher is the usual one - and in that state
     speak() is accepted, never finishes, and never errors. Left alone the
     button sits on Pause for a read that was never going to happen, so the
     caller is told instead. */
  function speak(parts, opts) {
    if (!AVAILABLE) return false;
    stop();
    if (!(API.getVoices() || []).length) return false;

    /* Re-chosen at the moment of use rather than watched for. Connectivity and
       the voice list can both have moved since boot, and one filter over a few
       dozen voices per click is cheaper than keeping online, offline and
       voiceschanged handlers honest between them. */
    pickVoice();

    hooks = opts || {};
    queue = [];
    (parts || []).forEach(function (p, i) {
      split(p.text).forEach(function (text) { queue.push({ text: text, part: i }); });
    });
    if (!queue.length) return false;

    at = 0;
    announce('playing');
    step();
    return true;
  }

  function pause() {
    if (mode !== 'playing') return;
    API.pause();
    announce('paused');
  }

  function resume() {
    if (mode !== 'paused') return;
    API.resume();
    announce('playing');
  }

  /* Chrome can restore a page with the synthesiser still parked in the paused
     state it was in when the page left, and every later speak() lands in it
     silently. Clearing on the way in and on the way out costs nothing. */
  if (AVAILABLE) {
    API.cancel();
    window.addEventListener('pagehide', stop);
  }

  window.SPEECH = {
    available: AVAILABLE,
    speak: speak,
    stop: stop,
    pause: pause,
    resume: resume,
    state: function () { return mode; },
    split: split,                       // exposed for the test harness only
    voice: function () { return voice; }
  };
})();

</script>
<script>
/* ==========================================================================
   Daily — shared engine

   One engine, many sites. Everything that differs between sites lives in
   window.SITE: the storage key, the tracks, the second facet, every string
   of visible copy, the review model, the commitment gate and whether the
   forecast book exists at all.

   State lives in localStorage under one versioned key. Nothing here talks to
   the network, so a built page works offline and forever.
   ========================================================================== */
(function () {
  'use strict';

  var SITE = window.SITE || {};
  var LESSONS = window.LESSONS || [];
  var EXPR = window.EXPR;                    // engine/expr.js, loaded before this
  var SPEECH = window.SPEECH;                // engine/speech.js, same

  var KEY = SITE.key;
  var TRACKS = SITE.tracks || [];
  var LEVELS = SITE.levels || {};
  var COPY = SITE.copy || {};
  var GATE = SITE.gate || null;
  var PROMPT = SITE.prompt || {};

  var HAS_REVIEW = SITE.review !== 'none';
  var HAS_EXPIRY = SITE.expiry === true;
  var HAS_FORECAST = SITE.forecastBook === true;
  var HAS_EVIDENCE = SITE.evidenceGate === true;
  /* Two ways to earn a cheatsheet row, because the sites disagree about what
     "worth acting on from memory" can even mean.

     Where the corpus carries a replication verdict, the filter is derived:
     `cheatsheet: { verdicts: ['replicated'] }` and the corpus decides. Nobody
     is exercising judgement, which is the point - Nomogram refuses to let the
     author grade their own evidence, and the cheatsheet must not be the hole
     in that.

     Where it does not, there is nothing to derive from, so the row is opt-in:
     `cheatsheet: true`, and an entry appears if the author wrote it a line.
     That is editorial and the page says so rather than dressing a selection up
     as a filter. */
  var CHEAT = SITE.cheatsheet || null;
  var CHEAT_VERDICTS = CHEAT && CHEAT.verdicts ? CHEAT.verdicts : null;
  var HAS_CHEAT = !!CHEAT && (!CHEAT_VERDICTS || HAS_EVIDENCE);

  function onCheatsheet(l) {
    return CHEAT_VERDICTS ? CHEAT_VERDICTS.indexOf(l.replication) !== -1 : !!l.cheat;
  }

  /* Expiry retires a claim the author already knew would rot. This retires the
     author's confidence in a claim they thought was settled, which is where
     checking actually finds the failures. Nothing leaves the sequence: a stale
     citation is still true more often than not, it is just no longer checked. */
  var REVERIFY_DAYS = SITE.reverifyDays || 0;

  function stale(l) {
    if (!REVERIFY_DAYS || !l.verifiedOn) return false;
    return shift(l.verifiedOn, REVERIFY_DAYS) < today();
  }

  function evidenceHTML(l) {
    var h = '<div class="evidence" data-rep="' + esc(l.replication) + '"' +
      (stale(l) ? ' data-stale="1"' : '') + '>';
    h += '<p class="block__label">' + esc(COPY.labelEvidence || 'The evidence') + '</p>';
    h += '<p class="evidence__cite" data-speak="evidence">' + esc(l.evidence) + '</p>';
    if (l.interval && typeof l.interval.lo === 'number' && typeof l.interval.hi === 'number') {
      h += '<p class="evidence__interval">' + esc(l.interval.measure || 'interval') + ' ' +
        l.interval.lo + ' to ' + l.interval.hi + '</p>';
    }
    h += '<p class="evidence__meta">';
    h += '<span class="rep-chip">' + esc(REP_LABEL[l.replication] || l.replication) + '</span>';
    if (l.replication === 'statute' && l.asAt) {
      h += '<span class="evidence__asat">as at ' + esc(shortDate(l.asAt)) + '</span>';
    }
    if (stale(l)) {
      h += '<span class="evidence__stale">' +
        esc(COPY.staleNote || 'not re-checked since ' + shortDate(l.verifiedOn)) + '</span>';
    }
    h += '</p></div>';
    return h;
  }

  var REP_LABEL = {
    replicated:  'Replicated',
    single:      'One study, never repeated',
    contested:   'Contested',
    failed:      'Failed to replicate',
    overclaimed: 'Real, but overclaimed',
    craft:       'Craft, no trial behind it',
    statute:     'Statute'
  };

  /* ------------------------------------------------------------------------
     THE POLICY DIAL

     This one function decides the whole rhythm of retention: how long an
     entry rests before it comes back, and how badly a miss sets you back.
     Leitner boxes, intervals from the site config.

     Three alternatives, if the default does not fit how you learn:

       Forgiving   — a miss drops you one box instead of all the way to 1.
                     Kinder, but genuinely-forgotten material resurfaces
                     slowly, which is the failure mode you care about.
       Aggressive  — intervals 1/2/4/8/16. Roughly twice the review load for
                     noticeably better recall. Costs you minutes a day.
       Long tail   — add a sixth box at 90 days so solid material still gets
                     checked twice a year rather than disappearing.

     Change the arithmetic here and the whole schedule follows; nothing else
     in the engine hardcodes an interval.
     --------------------------------------------------------------------- */
  var INTERVALS = SITE.intervals || [1, 3, 7, 16, 35];
  var MAX_BOX = INTERVALS.length;

  function reviewInterval(box, grade) {
    var next;
    if (grade === 'miss') next = 1;
    else if (grade === 'close') next = box;
    else next = Math.min(box + 1, MAX_BOX);
    return { box: next, days: INTERVALS[next - 1] };
  }

  /* --- Dates: local, not UTC. A logbook runs on the reader's clock. ------- */
  function dayKey(d) {
    var y = d.getFullYear();
    var m = String(d.getMonth() + 1).padStart(2, '0');
    var day = String(d.getDate()).padStart(2, '0');
    return y + '-' + m + '-' + day;
  }
  function today() { return dayKey(new Date()); }
  function parseKey(k) {
    var p = String(k).split('-');
    return new Date(+p[0], +p[1] - 1, +p[2], 12, 0, 0);
  }
  function shift(k, days) {
    var d = parseKey(k);
    d.setDate(d.getDate() + days);
    return dayKey(d);
  }
  function daysBetween(a, b) {
    return Math.round((parseKey(b) - parseKey(a)) / 86400000);
  }
  function longDate(k) {
    return parseKey(k).toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
  }
  function shortDate(k) {
    return parseKey(k).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
  }

  /* --- Expiry -------------------------------------------------------------
     Fast-moving material carries a date past which it is more likely to be
     folklore than fact. A lapsed entry leaves the sequence and the review
     deck rather than being quietly reinforced forever. It stays visible in
     the library, marked, because knowing what went stale is itself useful. */
  function lapsed(l) {
    return HAS_EXPIRY && !!l.expires && daysBetween(l.expires, today()) > 0;
  }
  function live() {
    return LESSONS.filter(function (l) { return !lapsed(l); });
  }

  /* --- Sequence -----------------------------------------------------------
     Round-robin across tracks, rotating the track order each cycle. Because
     each track file is ordered foundational first, the opening cycle serves
     the most foundational entry from every track before anything advanced. */
  function buildSequence() {
    var pool = live();
    var byTrack = TRACKS.map(function (t) {
      return pool.filter(function (l) { return l.track === t.id; });
    });
    var out = [];
    var cycle = 0;
    var guard = pool.length + TRACKS.length + 1;
    while (out.length < pool.length && cycle < guard) {
      for (var i = 0; i < TRACKS.length; i++) {
        var bucket = byTrack[(i + cycle) % TRACKS.length];
        var lesson = bucket[cycle];
        if (lesson) out.push(lesson.id);
      }
      cycle++;
    }
    // Anything a ragged track length left behind.
    pool.forEach(function (l) { if (out.indexOf(l.id) === -1) out.push(l.id); });
    return out;
  }

  var SEQ = buildSequence();
  var BY_ID = {};
  LESSONS.forEach(function (l) { BY_ID[l.id] = l; });

  /* --- State ------------------------------------------------------------- */
  var blank = {
    v: 1,
    startedOn: today(),
    log: {},
    days: {},
    streak: { count: 0, best: 0, lastOn: null },
    forecasts: {},
    profile: {},
    theme: null
  };

  /* Everything here depends on being able to write locally. If a browser or
     an embedding blocks storage, say so plainly rather than losing a month of
     someone's notes without telling them. */
  function storageWorks() {
    try {
      localStorage.setItem(KEY + '.probe', '1');
      localStorage.removeItem(KEY + '.probe');
      return true;
    } catch (e) {
      return false;
    }
  }

  var STORAGE_OK = storageWorks();
  var state = load();

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return clone(blank);
      var parsed = JSON.parse(raw);
      if (!parsed || parsed.v !== 1) return clone(blank);
      // Merge onto the blank so a partial or older record still boots.
      var s = clone(blank);
      Object.keys(parsed).forEach(function (k) { s[k] = parsed[k]; });
      s.log = parsed.log || {};
      s.days = parsed.days || {};
      s.streak = parsed.streak || clone(blank.streak);
      s.forecasts = parsed.forecasts || {};
      return s;
    } catch (e) {
      return clone(blank);
    }
  }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); }
    catch (e) { toast('Could not save — browser storage is full or blocked'); }
  }

  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  function record(id) {
    if (!state.log[id]) {
      state.log[id] = { box: 0, due: null, note: '', reviews: [], completedOn: null, gate: null, attempts: [] };
    }
    var r = state.log[id];
    if (!r.reviews) r.reviews = [];
    if (!r.attempts) r.attempts = [];
    return r;
  }

  /* --- The daily pick ----------------------------------------------------
     Written once per date, then read back. Stable across reloads, honest as
     a history, and a missed day pushes the corpus forward instead of
     silently dropping an entry. You cannot refresh to skip ahead, which is
     the property that makes a commitment mean anything. */
  function lessonForToday() {
    var t = today();
    if (state.days[t] && BY_ID[state.days[t]]) return BY_ID[state.days[t]];
    if (!SEQ.length) return null;

    var served = {};
    Object.keys(state.days).forEach(function (d) { served[state.days[d]] = true; });

    var pick = null;
    for (var i = 0; i < SEQ.length; i++) {
      if (!served[SEQ[i]]) { pick = SEQ[i]; break; }
    }
    // Corpus exhausted: begin a second pass from the top of the sequence.
    if (!pick) pick = SEQ[Object.keys(state.days).length % SEQ.length];

    state.days[t] = pick;
    save();
    return BY_ID[pick];
  }

  function entryNumber(id) {
    var n = SEQ.indexOf(id);
    return n === -1 ? '—' : String(n + 1).padStart(3, '0');
  }

  function dueList() {
    if (!HAS_REVIEW) return [];
    var t = today();
    return Object.keys(state.log)
      .filter(function (id) {
        var r = state.log[id];
        return BY_ID[id] && !lapsed(BY_ID[id]) && r.due && r.box > 0 && daysBetween(r.due, t) >= 0;
      })
      .sort(function (a, b) {
        var d = state.log[a].box - state.log[b].box;   // shakiest first
        return d !== 0 ? d : (state.log[a].due < state.log[b].due ? -1 : 1);
      });
  }

  function completedToday() {
    var t = today();
    var l = state.days[t];
    return !!(l && state.log[l] && state.log[l].completedOn === t);
  }

  function markComplete(id) {
    var t = today();
    var r = record(id);
    if (r.completedOn === t) return;
    r.completedOn = t;
    if (HAS_REVIEW && r.box === 0) { r.box = 1; r.due = shift(t, INTERVALS[0]); }

    var s = state.streak;
    if (s.lastOn === t) { /* already counted */ }
    else if (s.lastOn && daysBetween(s.lastOn, t) === 1) s.count += 1;
    else s.count = 1;
    s.lastOn = t;
    s.best = Math.max(s.best || 0, s.count);

    save();
  }

  function gradeCard(id, grade) {
    var r = record(id);
    var next = reviewInterval(r.box || 1, grade);
    r.box = next.box;
    r.due = shift(today(), next.days);
    r.reviews.push({ on: today(), grade: grade });
    save();
  }

  /* --- The gate -----------------------------------------------------------
     A commitment device. Where a site sets one, the body of the entry stays
     withheld until something has been written, and what was written is
     frozen the moment the answer appears. An editable answer is not a
     commitment, it is a draft, and the whole value is in being able to read
     back what you actually thought before you knew. */
  /* ------------------------------------------------------------------------
     THE ARITHMETIC GATE

     A text gate proves you thought about the question. This proves you did the
     sum. The site holds a small profile of your own figures, each entry
     declares its answer as an expression over them, and the entry stays shut
     until you have written your own number to be compared against.

     What it keeps is the signed gap rather than a right/wrong mark, because
     the useful quantity is which direction you are consistently wrong in. A
     reader who is reliably optimistic about their own tax position learns more
     from that than from a score. */

  var PROFILE = SITE.profile || null;
  var PROFILE_FIELDS = (PROFILE && PROFILE.fields) || [];

  function byId(id) {
    for (var i = 0; i < LESSONS.length; i++) {
      if (LESSONS[i].id === id) return LESSONS[i];
    }
    return null;
  }

  function profileField(id) {
    for (var i = 0; i < PROFILE_FIELDS.length; i++) {
      if (PROFILE_FIELDS[i].id === id) return PROFILE_FIELDS[i];
    }
    return null;
  }

  /* Which declared fields this entry's sum actually needs. Asking for the whole
     profile up front is how a settings page gets abandoned; asking for the two
     numbers today's entry needs is a question someone will answer. */
  /* No try/catch. build.js compiles every expression and checks every
     identifier against the declared profile, so a throw here means the page was
     assembled wrong - and a gate that silently asks for nothing would render as
     an entry that opens itself, which is the one outcome worth crashing over. */
  function computeNeeds(l) {
    if (!l || !l.compute || !l.compute.expr) return [];
    return EXPR.names(l.compute.expr).filter(function (n) { return !!profileField(n); });
  }

  function computeMissing(l) {
    return computeNeeds(l).filter(function (n) {
      return typeof state.profile[n] !== 'number';
    });
  }

  /* null rather than NaN when a field is missing or a divisor is zero. NaN
     would render as "NaN" and read as an answer. */
  function computeAnswer(l) {
    return EXPR.run(l.compute.expr, state.profile);
  }

  function saveProfile(vals) {
    var wrote = false;
    for (var k in vals) {
      var f = profileField(k);
      if (!f) continue;
      var n = parseFloat(vals[k]);
      if (!isFinite(n)) continue;
      if (typeof f.min === 'number' && n < f.min) continue;
      if (typeof f.max === 'number' && n > f.max) continue;
      state.profile[k] = n;
      wrote = true;
    }
    if (wrote) save();
    return wrote;
  }

  function commitCompute(id, raw) {
    var l = byId(id);
    if (!l || !l.compute) return false;
    if (computeMissing(l).length) return false;
    var r = record(id);
    if (r.compute) return false;                 // first number stands
    var yours = parseFloat(raw);
    if (!isFinite(yours)) return false;
    var computed = computeAnswer(l);
    if (computed === null) return false;
    r.compute = {
      yours: yours,
      computed: computed,
      gap: yours - computed,
      on: today()
    };
    save();
    return true;
  }

  function gapStats() {
    var gaps = [];
    for (var id in state.log) {
      var c = state.log[id].compute;
      if (c && typeof c.gap === 'number') gaps.push(c.gap);
    }
    if (!gaps.length) return { n: 0, medianAbs: null, signedMean: null };
    var abs = gaps.map(Math.abs).sort(function (a, b) { return a - b; });
    var mid = Math.floor(abs.length / 2);
    var medianAbs = abs.length % 2 ? abs[mid] : (abs[mid - 1] + abs[mid]) / 2;
    var mean = gaps.reduce(function (a, b) { return a + b; }, 0) / gaps.length;
    return { n: gaps.length, medianAbs: medianAbs, signedMean: mean };
  }

  function computeDone(id) {
    var r = state.log[id];
    return !!(r && r.compute);
  }

  function gateOpen(id) {
    var l = byId(id);
    if (l && l.compute) return computeDone(id);
    if (!GATE) return true;
    var r = state.log[id];
    return !!(r && r.gate && r.gate.answer);
  }

  function unlockGate(id, text) {
    var r = record(id);
    if (r.gate && r.gate.answer) return false;
    var body = String(text || '').trim();
    if (body.length < (GATE.minChars || 1)) return false;
    r.gate = { answer: body, on: today() };
    save();
    return true;
  }

  /* --- Small helpers ----------------------------------------------------- */
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function paras(text) {
    return String(text).split(/\n\n+/).map(function (p) { return '<p>' + esc(p) + '</p>'; }).join('');
  }
  function trackName(id) {
    var t = TRACKS.filter(function (x) { return x.id === id; })[0];
    return t ? t.name : id;
  }
  function readMinutes(l) {
    var words = [l.idea, l.why, l.failureMode, l.experiment, l.reflection].join(' ').split(/\s+/).length;
    return Math.max(3, Math.round(words / 200) + 2);
  }
  function el(id) { return document.getElementById(id); }

  var toastTimer = null;
  function toast(msg) {
    var t = el('toast');
    if (!t) return;
    t.textContent = msg;
    t.setAttribute('data-open', 'true');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.removeAttribute('data-open'); }, 2600);
  }

  /* --- Deep-dive prompt --------------------------------------------------
     Folds whatever was written into the prompt, so the conversation arrives
     already about a real situation rather than about the abstraction. This
     is the only bridge from a page with no model in it to one that has. */
  function deepDivePrompt(l) {
    var r = state.log[l.id] || {};
    var note = (r.note || '').trim();
    var lines = [
      PROMPT.intro || 'I am working through a daily entry and want to apply it to my actual situation.',
      '',
      'ENTRY: ' + l.title,
      'IDEA: ' + l.idea,
      'MECHANISM: ' + l.why,
      'FAILURE MODE: ' + l.failureMode
    ];
    if (GATE && r.gate && r.gate.answer) {
      lines.push('', 'WHAT I COMMITTED TO BEFORE READING IT (' + shortDate(r.gate.on) + '): ' + r.gate.answer);
    }
    lines.push('', l.deepDive, '',
      'MY SITUATION: ' + (note || '(I have not written this up yet — ask me for it first, one question at a time.)'),
      '',
      PROMPT.closing || 'Push back on my reasoning rather than agreeing with me. Name the thing I am avoiding. Be concrete and brief.');
    return lines.join('\n');
  }

  function copyText(text, okMsg) {
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      toast(ok ? okMsg : 'Copy blocked here — select the text below instead');
      return ok;
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast(okMsg); }, fallback);
    } else {
      fallback();
    }
  }

  /* ==========================================================================
     Forecast book

     The only self-scoring mechanic here. A site that cannot detect its own
     inertness will feel productive while teaching nothing; a Brier score
     going sideways for three months is the one signal that cannot be
     rationalised. Brier is the mean squared error of a probability against
     a binary outcome, so lower is better and an always-fifty-percent
     forecaster scores 0.25.
     ========================================================================== */
  function forecastList() {
    return Object.keys(state.forecasts).map(function (fid) {
      var f = state.forecasts[fid];
      return { id: fid, q: f.q, p: f.p, made: f.made, resolvesOn: f.resolvesOn, outcome: f.outcome, resolvedOn: f.resolvedOn, source: f.source || null };
    }).sort(function (a, b) { return a.resolvesOn < b.resolvesOn ? -1 : 1; });
  }

  function brier() {
    var resolved = forecastList().filter(function (f) { return f.outcome === 0 || f.outcome === 1; });
    if (!resolved.length) return null;
    var sum = resolved.reduce(function (n, f) { return n + Math.pow(f.p - f.outcome, 2); }, 0);
    return { score: sum / resolved.length, n: resolved.length };
  }

  function calibration() {
    var buckets = [];
    for (var i = 0; i < 10; i++) buckets.push({ lo: i / 10, hi: (i + 1) / 10, n: 0, hits: 0 });
    forecastList().forEach(function (f) {
      if (f.outcome !== 0 && f.outcome !== 1) return;
      var idx = Math.min(9, Math.floor(f.p * 10));
      buckets[idx].n += 1;
      buckets[idx].hits += f.outcome;
    });
    return buckets;
  }

  function addForecast(q, p, resolvesOn, source) {
    var fid = 'f' + Date.now().toString(36) + Math.floor(Math.random() * 1e4).toString(36);
    state.forecasts[fid] = {
      q: q, p: p, made: today(), resolvesOn: resolvesOn,
      outcome: null, resolvedOn: null, source: source || null
    };
    save();
    return fid;
  }

  function resolveForecast(fid, outcome) {
    var f = state.forecasts[fid];
    if (!f || f.outcome === 0 || f.outcome === 1) return;
    f.outcome = outcome;
    f.resolvedOn = today();
    save();
  }

  function calibrationSVG() {
    var b = calibration();
    var W = 320, H = 200, PAD = 34;
    var x = function (v) { return PAD + v * (W - PAD - 8); };
    var y = function (v) { return H - PAD - v * (H - PAD - 12); };

    var s = '<svg class="cal" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Calibration: predicted probability against observed frequency">';
    s += '<line class="cal__ref" x1="' + x(0) + '" y1="' + y(0) + '" x2="' + x(1) + '" y2="' + y(1) + '"/>';
    s += '<line class="cal__axis" x1="' + x(0) + '" y1="' + y(0) + '" x2="' + x(1) + '" y2="' + y(0) + '"/>';
    s += '<line class="cal__axis" x1="' + x(0) + '" y1="' + y(0) + '" x2="' + x(0) + '" y2="' + y(1) + '"/>';

    b.forEach(function (bk) {
      if (!bk.n) return;
      var mid = (bk.lo + bk.hi) / 2;
      var obs = bk.hits / bk.n;
      var r = Math.min(9, 3 + Math.sqrt(bk.n) * 1.6);
      s += '<circle class="cal__dot" cx="' + x(mid).toFixed(1) + '" cy="' + y(obs).toFixed(1) +
        '" r="' + r.toFixed(1) + '"><title>' + Math.round(bk.lo * 100) + '-' + Math.round(bk.hi * 100) +
        '%: ' + bk.hits + ' of ' + bk.n + ' happened</title></circle>';
    });

    s += '<text class="cal__t" x="' + x(0.5) + '" y="' + (H - 8) + '" text-anchor="middle">you said</text>';
    s += '<text class="cal__t" x="10" y="' + y(0.5) + '" text-anchor="middle" transform="rotate(-90 10 ' + y(0.5) + ')">it happened</text>';
    s += '</svg>';
    return s;
  }

  /* ==========================================================================
     Views
     ========================================================================== */
  var VIEWS = ['today', HAS_REVIEW ? 'review' : 'attempts', 'library'];
  if (HAS_CHEAT) VIEWS.push('cheatsheet');
  if (HAS_FORECAST) VIEWS.push('forecast');
  VIEWS.push('journal', 'progress');

  var VIEW_LABEL = {
    today: COPY.tabToday || 'Today',
    review: COPY.tabReview || 'Review',
    attempts: COPY.tabAttempts || 'Attempts',
    library: COPY.tabLibrary || 'Library',
    cheatsheet: COPY.tabCheatsheet || 'Cheatsheet',
    forecast: COPY.tabForecast || 'Forecasts',
    journal: COPY.tabJournal || 'Journal',
    progress: COPY.tabProgress || 'Progress'
  };

  var view = 'today';
  var reviewIdx = 0;
  var reviewQueue = [];
  var revealed = false;
  var libFilter = { q: '', track: null, level: null, lapsed: false };
  var libOpen = null;

  function mountShell() {
    el('wordmark').textContent = SITE.name || 'Daily';
    el('eyebrow').textContent = SITE.eyebrow || 'Logbook';
    el('spine-sub').textContent = SITE.tagline || '';

    }).join('');

        (v === 'today' ? '' : ' hidden') + '></section>';

  }

  function renderChrome() {
    var l = lessonForToday();
    el('stamp-num').textContent = l ? entryNumber(l.id) : '—';
    el('stamp-date').textContent = longDate(today());

    el('gauge-streak').textContent = state.streak.count || 0;
    el('gauge-logged').textContent = Object.keys(state.log).filter(function (id) {
      return state.log[id].completedOn;
    }).length;
    el('gauge-retained').textContent = HAS_REVIEW
      ? Object.keys(state.log).filter(function (id) { return state.log[id].box >= 4; }).length
      : Object.keys(state.log).reduce(function (n, id) { return n + (state.log[id].attempts || []).length; }, 0);

    if (HAS_REVIEW) {
      var due = dueList().length;
      var bR = el('badge-review');
