{
  id: "data-crd-conversion",
  track: "data", level: "mechanism",
  title: "Argo Workflows: a CRD schema change with no conversion path orphans the objects mid-flight",
  source: "Kubernetes documentation, CustomResourceDefinition versioning and conversion webhooks",
  gateIntro: "A controller upgrade is applied to a cluster running several thousand workflows. Workflows submitted after the upgrade run normally end to end. Workflows that were mid-flight when the upgrade landed stop advancing: their pods finish and exit zero, their objects stay in the cluster, and the controller logs nothing about them at all. Reconcile queue depth is flat, controller CPU is idle, and no error rate anywhere is elevated.",
  idea: "Custom resources are persisted at a stored version, so changing their shape without a conversion path leaves the controller unable to interpret the objects that already exist.",
  why: "A CRD is a database schema with a Kubernetes API in front of it. Objects are serialised into etcd at the CRD's designated storage version and stay in that encoding until something rewrites them. The API server will serve an object at a requested version, but with the default None conversion strategy all it does is rewrite the apiVersion field. It does not move data between differently shaped fields, and it does not tell you it declined to. So a controller that now expects a field somewhere else reads an object where that field is absent, and absent is not an error, it is a zero value.\n\nThis is the estate-local form of the unreadable-rollback problem, with two aggravations. The persisted objects are live state, not history: an in-flight Argo workflow's node status is the only record of where it got to, so a misread is not a stale row, it is a lost execution. And the rollback is worse than the roll forward, because objects written by the new controller are now in the store and the old controller has the same problem in reverse. The correct mechanism is a conversion webhook, or the discipline of only ever adding optional fields and never moving or repurposing an existing one.",
  failureMode: "Workflows submitted before the upgrade sit forever in a state the controller silently skips, their pods complete without anyone recording it, and the operator's instinct - roll the controller back - leaves the objects the new controller wrote equally unreadable in the other direction.",
  experiment: "For every CRD in your clusters, check whether spec.conversion.strategy is None and whether status.storedVersions lists more than one version. Any CRD with multiple stored versions and no webhook has objects in etcd that only one version of your code understands. Count them.",
  reflection: "Which of your operators would notice that it is skipping objects it cannot interpret, versus which would just go quiet on them?",
  recall: {
    q: "With the default conversion strategy, what does the API server actually do when a client requests a custom resource at a different version than it was stored in, and why is that dangerous for a controller?",
    a: "It rewrites the apiVersion field and nothing else. No data moves between fields that changed shape, and no error is raised.\n\nA controller reading a moved or renamed field therefore sees an absent field, which deserialises to a zero value rather than a failure. For in-flight workflow objects the persisted status is the only record of execution progress, so a silent zero value is lost state, not a stale read."
  },
  deepDive: "Audit our Argo and Temporal-related CRDs for stored version drift and tell me which schema changes we have made that needed a conversion webhook and did not get one."
},

{
  id: "data-poison-message",
  track: "data", level: "mechanism",
  title: "One message that cannot be processed stops the partition behind it",
  source: "Gregor Hohpe and Bobby Woolf, Enterprise Integration Patterns, Dead Letter Channel (2003)",
  gateIntro: "Consumer lag on one partition of a topic starts climbing at 03:00 and rises in a straight line all night. The other eleven partitions sit at zero. The consumer group is healthy, every member is alive and rebalancing normally, CPU is low. The consumer's reported per-message processing rate for the stuck partition reads as several hundred a second. No alert fires, because the service's own success rate is 100 percent and its error rate is zero.",
  idea: "Ordered consumption plus unbounded retry on a message that can never succeed means the queue never drains, and the fix is a bounded attempt count plus a channel for messages that cannot be processed.",
  why: "Hohpe and Woolf separate two cases that get conflated. An invalid message is one the receiver cannot interpret at all, and it goes to an Invalid Message Channel because it is a sender problem, not a delivery problem. A dead letter is a message the messaging system could not deliver. The engineering point common to both is that there must exist a terminal disposition other than success. A consumer whose only two outcomes are 'processed' and 'try again' has no way to make progress past a message that will fail deterministically for the rest of time.\n\nThe amplifier is ordering. On an unordered work queue a poison message burns a worker and the rest of the queue drains around it, which is a capacity problem. On an ordered partition it is a head-of-line block, so a single malformed record stops every message behind it for that key or partition, indefinitely, while every health signal reads normal. Worse, the retry loop often looks like throughput: the consumer really is processing hundreds of messages a second, all of them the same one.",
  failureMode: "A tenant emits one record with an unexpected null or an oversized field. Their partition stops draining at 03:00. Nothing pages, because lag alerting is set on the aggregate across partitions and eleven of twelve are at zero. The tenant discovers it at 09:00 when their data is six hours stale.",
  experiment: "Pick your busiest consumer and answer from the code: after how many attempts does a single message stop being retried, and where does it go. Then check whether your lag alert is on the maximum across partitions or the sum. If it is the sum, one stuck partition is invisible.",
  reflection: "Which of your ordered streams would hide a single stuck tenant behind an aggregate metric, and for how long?",
  recall: {
    q: "Why does a poison message on an ordered partition present with normal health metrics, and what two things must exist for the consumer to make progress past it?",
    a: "Because the consumer is not failing. It is successfully attempting the same message repeatedly, so its throughput, CPU and error rate all look healthy while lag climbs on that partition alone. Aggregate lag alerting hides it when the other partitions are fine.\n\nProgress requires a bounded attempt count and a terminal disposition other than success: an invalid message channel or dead letter channel that takes the record out of the stream and makes its existence loud."
  },
  deepDive: "Check our Temporal and Kafka consumers for bounded retry and a dead letter path, and tell me which lag alerts aggregate across partitions in a way that would hide one stuck tenant."
},

{
  id: "data-instapaper-table-ceiling",
  track: "data", level: "mechanism",
  title: "Instapaper, February 2017: a silent per-table ceiling inherited from an old instance",
  source: "Brian Donohue, Instapaper Outage Cause and Recovery (2017)",
  gateIntro: "In early February 2017 Instapaper stopped accepting writes. There was no traffic spike, no deploy, no configuration change and no alert in advance of it. Reads continued for a period and then the service went down entirely. Recovery required moving the data onto a new database instance, and the service was unavailable or degraded for more than a day while that happened.",
  idea: "A table's growth curve is a resource with a ceiling, and if nobody owns the curve the ceiling arrives as an outage rather than as an alert.",
  why: "Instapaper's database ran on an RDS MySQL instance created years earlier, before RDS supported the file system configuration that lifts the per-table file size limit. Instances created before that change carried a 2 TB ceiling per table, and the bookmarks table reached it. The property that made this an outage rather than a maintenance ticket is that the limit was not visible from anywhere: it was not a documented attribute of the running instance, RDS exposed no metric for per-table file size, and the first signal of any kind was writes failing at the moment the limit was hit.\n\nThe general shape is that inherited infrastructure carries constraints from the conditions of its creation, and those constraints do not migrate into your monitoring just because the workload did. Recovery was slow for the corresponding reason: the remedy is to move the data to an instance without the limit, and a dump and reload of a table that size takes many hours whether or not you are down.",
  failureMode: "A table nobody owns grows monotonically for years against a limit nobody knows about. The alert you would have wanted is not 'the table is large', it is 'the table will reach a boundary in 60 days', and that alert cannot exist because nobody has written down what the boundary is.",
  experiment: "List your five largest tables and, for each, get the current size and the size 30 days ago. Extrapolate to the nearest hard limit you can name for that engine and instance: file size, partition count, key range, disk. If you cannot name a limit for a table, that is the finding.",
  reflection: "What in your estate is still running on infrastructure created under conditions nobody currently on the team remembers?",
  recall: {
    q: "Why did Instapaper get no warning before writes stopped, and what class of alert would have caught it?",
    a: "The ceiling was an attribute of how the RDS instance had been created years earlier rather than of the workload, so it appeared in no metric and no documentation the team was watching. The first observable was writes failing at the boundary.\n\nThe alert that catches it is not one on table size, it is one on projected time to a named limit: growth rate extrapolated against a boundary someone has written down for that engine and that instance. Without the boundary recorded, the alert cannot be expressed."
  },
  deepDive: "For our largest ClickHouse and Postgres tables, work out the growth rate and the nearest hard engine or instance limit, and give me a projected date for each."
},

{
  id: "data-txid-wraparound",
  track: "data", level: "mechanism",
  title: "Postgres transaction IDs are a counter that runs out if vacuum falls behind",
  source: "PostgreSQL documentation, Routine Vacuuming: Preventing Transaction ID Wraparound Failures",
  gateIntro: "A Postgres cluster that has run for four years starts refusing writes at 04:50, returning the same error on every connection that attempts one. Reads are entirely unaffected. Disk is 40 percent free, connection count is normal, CPU is near idle, and there has been no deploy for nine days. Restarting the primary changes nothing. Disk, connections and lock contention are all ruled out inside ten minutes and the team has no fourth hypothesis.",
  idea: "Transaction IDs are a finite circular space, and if freezing falls behind the write rate the database will stop accepting writes to protect itself from silently losing the past.",
  why: "Postgres row visibility is decided by comparing a row's inserting transaction ID against the current one in a 32-bit circular space, which means only about two billion transactions are visible in each direction. Autovacuum's freeze job marks old rows as unconditionally visible so their transaction IDs can be reused. When the oldest unfrozen transaction age approaches the wraparound point, the database refuses new transactions rather than allow rows that are in the past to be reinterpreted as being in the future, which would present as data silently vanishing.\n\nWhat makes this a 2am problem is the combination of causes and the shape of the remedy. Anything that holds an old transaction horizon blocks freezing: a long-running analytics query, an idle-in-transaction connection someone left open, an abandoned replication slot, a prepared transaction nobody committed. Meanwhile the write rate keeps consuming the counter. The database gives you a metric for this well in advance, and almost nobody alerts on it. The recovery is a vacuum freeze that is single threaded per table and reads every unfrozen page, so its duration is a function of table size, and you are already down for the whole of it.",
  failureMode: "A replication slot left behind by a decommissioned consumer, or an idle-in-transaction connection from a service that crashed without closing, pins the horizon for weeks. Nobody notices because the only symptom until the very end is that autovacuum keeps running and never advances anything.",
  experiment: "Run a query for the maximum age of datfrozenxid across your databases and compare it to autovacuum_freeze_max_age. Then list every replication slot and every connection sitting in the idle in transaction state. If you cannot produce that first number today, you have no alert on it either.",
  reflection: "Which finite counters in your systems, not just this one, have no alert on their consumption rate?",
  recall: {
    q: "What causes a Postgres cluster to refuse writes on transaction ID wraparound, what blocks the freeze that would have prevented it, and why is the recovery slow?",
    a: "Transaction IDs live in a 32-bit circular space and visibility is a comparison within it, so if the oldest unfrozen transaction gets close to two billion behind, the database refuses new transactions rather than let past rows be reinterpreted as future ones.\n\nFreezing is blocked by anything pinning an old transaction horizon: long-running queries, idle-in-transaction sessions, abandoned replication slots, uncommitted prepared transactions. Recovery is a vacuum freeze that scans every unfrozen page and runs single threaded per table, so its duration scales with table size and it happens while you are already down."
  },
  deepDive: "Write me the queries and alert thresholds for transaction ID age, replication slot lag and idle-in-transaction sessions across our Postgres fleet."
},

{
  id: "data-argo-etcd-size",
  track: "data", level: "mechanism",
  title: "Argo workflow objects grow until etcd refuses them",
  source: "Argo Workflows documentation, node status offloading and etcd size limits",
  gateIntro: "A fan-out workflow with several thousand parallel steps runs normally for about 40 minutes. Its steps keep completing and their pods keep exiting zero, but the workflow's own reported status stops advancing and the controller starts logging the same error against that one object, repeatedly. Every other workflow in the cluster is unaffected. Deleting and resubmitting reproduces it at roughly the same point each time. Node pressure, etcd latency and API server error rate are all normal.",
  idea: "Storing per-step status inside a single custom resource makes the object's size a function of workflow shape, so a wide enough fan-out exceeds the backing store's value size limit regardless of cluster load.",
  why: "Argo Workflows keeps the status of every node in the DAG inside the status field of one Workflow object. etcd enforces a maximum size per value, around 1.5 MiB by default, and the API server rejects any update that would exceed it. So the controller can execute the workflow perfectly and still be unable to record that it did, at which point the object's persisted state stops tracking reality and the workflow stalls with all of its actual work succeeding.\n\nThe reason this is a distinct shape worth recognising is that the trigger is the workflow's topology, not the cluster's load. A wide fan-out over a tenant with more objects than the others hits it while an identical template over a smaller tenant never will, which makes it look tenant-specific and load-independent and sends people looking at the wrong layer. Argo's mitigations are compressing the node status and offloading it to a SQL persistence layer so the object stays small, both of which have to be enabled deliberately. The general lesson generalises past Argo: any design that accumulates per-item state in a single record has a maximum item count, and you should know what it is before a customer finds it.",
  failureMode: "The biggest tenant's largest scheduled job fails at 40 minutes in, every time, while the same template passes in staging and for every other tenant. The failure is reproducible, which makes it look like a bug in the workflow rather than a ceiling in the store.",
  experiment: "Query your workflow objects for their serialised size and find the 99th percentile and the maximum. Compare the maximum against your etcd value limit and work out the fan-out width that reaches it. Then check whether node status offloading is enabled.",
  reflection: "Where else in your estate does per-item state accumulate inside a single record, and what is the item count that breaks it?",
  recall: {
    q: "Why does a large Argo fan-out workflow stall while all of its pods succeed, and why does the failure look tenant-specific rather than load-related?",
    a: "Argo stores every node's status inside one Workflow object, and etcd rejects updates beyond a per-value size limit of roughly 1.5 MiB. The steps execute fine, but the controller cannot persist the record of it, so the workflow's state stops advancing.\n\nThe trigger is workflow topology rather than cluster load, so the same template breaks for a tenant with a wide fan-out and passes everywhere else, reproducibly, with every cluster health signal normal."
  },
  deepDive: "Measure the size distribution of our Argo workflow objects, tell me the fan-out width that hits the etcd limit, and say whether offloading would change the answer."
},

{
  id: "data-clickhouse-mutations",
  track: "data", level: "mechanism",
  title: "ClickHouse deletes are asynchronous mutations that rewrite parts",
  source: "ClickHouse documentation, ALTER TABLE DELETE and mutations",
  gateIntro: "A tenant offboarding runs at 21:00 as a single statement against a large ClickHouse table. The statement returns in under a second and the operator closes the ticket. Over the next four hours, ingest lag on unrelated tables in the same cluster climbs from seconds to over an hour, disk IO saturates, and merges back up behind it. Nobody connects the two events, because the only action anyone took that evening was reported as finished before any of the symptoms began.",
  idea: "A logical row deletion in ClickHouse is a background rewrite of every affected part, so a compliance deletion or a tenant offboarding is an hours-long IO event competing with ingest rather than a metadata change.",
  why: "ClickHouse stores data in immutable parts. There is no in-place row deletion, so ALTER TABLE DELETE is a mutation: for every part containing a matching row, the server writes a new version of that part without those rows and then swaps it in. The cost is proportional to the data volume in the affected parts, not to the number of rows deleted, so a predicate that removes a handful of rows spread thinly across a year of data rewrites a year of data. The statement itself is asynchronous, returning as soon as the mutation is accepted, with real progress visible only in system.mutations.\n\nTwo consequences follow. Operationally, the deletion competes for exactly the resources ingest and merges need, on the same disks, and it does so long after the operator who started it has moved on. Semantically, the return of the statement is not the completion of the deletion, which matters when the deletion is a legal obligation and someone is going to ask when the data was actually gone. Lightweight deletes change the immediate experience by masking rows rather than rewriting parts, but the physical removal still has to happen eventually.",
  failureMode: "An offboarding or a GDPR erasure is run in business hours as if it were a DELETE against Postgres. Hours later, tenants who have nothing to do with the offboarded one see stale dashboards, and the incident timeline starts at the symptom because the cause was recorded as complete.",
  experiment: "Query system.mutations on your ClickHouse cluster for anything not yet done, and for the elapsed time of the last few that finished. Then take your standard tenant offboarding statement and work out from part sizes how much data it will rewrite. Compare that to how long the person running it thinks it takes.",
  reflection: "Which of your routine operations return immediately and then do hours of work that nobody is watching?",
  recall: {
    q: "Why is the cost of a ClickHouse ALTER TABLE DELETE proportional to something other than the number of rows deleted, and what is the operational trap in the statement returning quickly?",
    a: "Parts are immutable, so deletion rewrites every part containing a matching row. Cost scales with the volume of the affected parts, which means a predicate matching a few rows scattered across a year rewrites a year of data.\n\nThe statement is asynchronous and returns on acceptance, so the operator records the task as done while hours of IO contention with ingest and merges are still ahead. Real progress is only in system.mutations, and for a compliance deletion the completion time is the number that matters."
  },
  deepDive: "Work out the real cost and duration of our tenant offboarding deletion in ClickHouse, and propose a partitioning scheme that turns it into a partition drop."
},

{
  id: "data-plan-flip",
  track: "data", level: "mechanism",
  title: "An index stops being used the moment the planner's estimate changes",
  source: "Markus Winand, Use The Index, Luke and SQL Performance Explained",
  gateIntro: "A dashboard query that has run in under 50 ms for a year starts taking 30 seconds. There has been no deploy in six days, no schema change, no unusual data load, and the query text is byte-identical to what it has always been. It is slow for some tenants and fast for others. Restarting the application does not help and neither does restarting the database. Overnight it goes fast again on its own, then slow again the next afternoon.",
  idea: "Plan choice is a runtime decision made from statistics and parameter values, so a query can flip from an index scan to a sequential scan with no deploy and no schema change to blame it on.",
  why: "Winand's core point is that an index is not something a query uses, it is something the optimiser chooses. That choice is a cost comparison built on estimates: how many rows the predicate will match, how correlated the data is with the index order, how much of the table is cached. When the estimated selectivity of a predicate crosses the threshold where a sequential scan looks cheaper, the plan flips, and the plan flips atomically rather than degrading. A query does not get gradually slower. It is fast, and then it is a different query.\n\nEverything that moves those estimates moves without a deploy. A statistics refresh after enough churn. Data growth changing the distribution. A histogram that no longer represents the values being queried. Most awkwardly, in a multi-tenant table, parameter values themselves: a plan cached or chosen for a tenant with a thousand rows is the wrong plan for the tenant with ten million, and which one you get depends on which query happened to run first. That is why the same statement is fast for some tenants and slow for others with no code difference anywhere.",
  failureMode: "A multi-tenant table where tenant_id is the leading predicate. The planner's estimate is an average across tenants, so the plan is wrong at both ends of the distribution, and the largest customer is the one who gets the sequential scan.",
  experiment: "Take your three slowest queries from the last week and run EXPLAIN with real production parameter values for your largest tenant and for a small one. Compare the plans. If they differ, that query's performance is a property of who is asking, not of the query.",
  reflection: "Which of your queries have only ever been explained with a developer's test tenant as the parameter?",
  recall: {
    q: "Why can a query flip from fast to slow with no deploy and no schema change, and why does it often affect only some tenants?",
    a: "The plan is chosen at runtime from statistics and parameter values, and the choice between index and sequential scan is a cost threshold. When estimated selectivity crosses it the plan flips atomically, so the query does not degrade, it becomes a different query. Statistics refreshes, growth and distribution shifts all move that estimate without any code change.\n\nIn a multi-tenant table the parameter value itself changes the right answer. A plan appropriate for a tenant with a thousand rows is wrong for one with ten million, so the same statement is fast for some tenants and slow for others."
  },
  deepDive: "Explain our top dashboard queries with parameters from our largest and smallest tenants and tell me which ones have plans that depend on who is asking."
},

{
  id: "data-referential-assumption",
  track: "data", level: "mechanism",
  title: "Referential integrity enforced only by application code is an assumption, not a constraint",
  source: "Scott Ambler and Pramod Sadalage, Refactoring Databases: Evolutionary Database Design (2006)",
  gateIntro: "A nightly aggregation job that has run for two years without a failure starts throwing null dereferences on about 0.4 percent of rows. Every affected row references a parent record that the application's own code guarantees must exist, and the code is right: there is no path through the application that could produce these rows. A migration onto a replacement service has been running in the background for three weeks. Nothing in the application logs shows any write matching them.",
  idea: "A constraint the database does not enforce is a claim about every writer that will ever touch the data, including the ones that do not exist yet.",
  why: "Ambler and Sadalage's framing is that a database with more than one application is the normal case, not the degenerate one, and that integrity has to live where all writers meet. Application-level referential integrity is a statement about one code path. It holds exactly as long as that code path is the only writer, and the set of writers grows without anyone deciding to grow it: a backfill script, an admin console, a data-fix run during an incident, a support tool, an ETL job writing back, a replacement service during a migration, a replication stream from somewhere else.\n\nThe migration case is the sharpest because it is the moment you deliberately add a second writer to the same data, usually one written by people who read the schema rather than the application code. The schema does not say the relationship is mandatory, so the new writer does not know. And unlike a constraint violation, which fails loudly at write time at the point of the bug, an orphan row fails quietly at read time, somewhere else, later, in a job whose stack trace points at the reader.",
  failureMode: "Deletes are the common source. A parent row is removed by an admin script or a cleanup job that does not know it is a parent, the children survive, and the failure surfaces weeks later in an aggregation or an export where the reader assumed the join would always match.",
  experiment: "Pick one relationship your application code treats as mandatory and run the anti-join today: count child rows whose parent does not exist. If the count is not zero, you have already found the writers you did not know about. If it is zero, add the foreign key or a scheduled check before your next migration adds a writer.",
  reflection: "How many distinct processes write to your most important table, and when did you last enumerate them rather than estimate?",
  recall: {
    q: "Why does application-enforced referential integrity fail specifically during migrations, and why is the resulting bug hard to trace?",
    a: "A migration deliberately introduces a second writer to the same data, usually one built from the schema rather than from the application code, and the schema does not encode a relationship that only exists as a convention. Backfills, admin scripts and data fixes add writers the same way, without a decision.\n\nThe bug is hard to trace because an orphan row does not fail at write time at the point of the defect. It fails later, at read time, in a different job, with a stack trace pointing at the innocent reader."
  },
  deepDive: "Run the anti-join checks across our core tenant tables for every relationship the code treats as mandatory but the schema does not enforce, and rank what we found by blast radius."
},

{
  id: "data-atlassian-2022-delete",
  track: "data", level: "amplifier",
  title: "Atlassian, April 2022: the script was correct and the input list was wrong",
  source: "Atlassian, Post-Incident Review of the April 2022 outage",
  gateIntro: "On 5 April 2022 a set of Atlassian cloud customers found their Jira, Confluence and Opsgenie sites gone: not erroring, not degraded, absent, along with the URLs that reached them. The affected set was small against the customer base and nobody else was touched. Atlassian's platform monitoring reported healthy throughout, and the company learned of it from customers. The count it published first was later revised upward to 775 sites, and some customers were not fully restored until 18 April, fourteen days in.",
  idea: "A deletion executed intentionally at the storage layer is indistinguishable from correct behaviour to everything downstream, so nothing between the command and the data will stop it.",
  why: "A maintenance routine was deactivating a legacy standalone app whose functionality had been folded into the product. The script ran correctly. It was given a list of identifiers for the wrong kind of entity - cloud site IDs rather than app IDs - against an endpoint that accepted both, and it was run in a mode that permanently deleted rather than marking for deletion. Two independent defects had to line up: the ambiguity in the interface, and a runbook that specified the destructive mode where it did not need to.\n\nThe amplifier worth taking away is that nothing downstream had any reason to object. Every guard rail that catches accidental data loss is built to detect anomaly, and an authorised maintenance job issuing a valid permanent delete against valid identifiers is not anomalous. The rate limits, the audit trail, the monitoring and the replication all behaved exactly as designed. Recovery was then slow for a structurally separate reason: Atlassian could restore the whole multi-tenant environment quickly, but restoring individual sites back into a running environment shared with unaffected customers was not an automated capability, so it had to be done semi-manually, in batches, which is where the fourteen days went.",
  failureMode: "The blast radius is decided by the input list, and the input list is the least reviewed artifact in the change. The runbook, the script and the approval all get scrutiny. The identifiers get pasted.",
  experiment: "Find every runbook or job in your estate that can permanently delete tenant-scoped data. For each, answer: is there a soft-delete mode, is it the default, and what validates that the identifiers are of the right entity type before anything executes. Then check how long a single-tenant restore into a live shared environment takes, if it is possible at all.",
  reflection: "Can you restore one tenant without disturbing the others, and have you ever done it?",
  recall: {
    q: "Why did no downstream control stop the Atlassian deletion, and why did restoration take two weeks when the backups were intact?",
    a: "Because the deletion was authorised, valid and intentional at the storage layer. Controls that catch data loss look for anomaly, and a maintenance job issuing a legitimate permanent delete against legitimate identifiers is not anomalous. The two defects were an endpoint that accepted the wrong entity type of identifier and a runbook specifying permanent rather than soft delete.\n\nRestoration was slow because restoring the whole shared environment was fast but restoring individual sites into a live environment holding unaffected customers was not an automated capability, so it ran semi-manually in batches."
  },
  deepDive: "Audit our tenant-scoped destructive operations for soft-delete defaults and entity-type validation on the input list, and tell me whether we can restore a single tenant into a live cluster."
},

{
  id: "data-cloudbleed-tenant-leak",
  track: "data", level: "amplifier",
  title: "Cloudflare, February 2017: a memory bug in a shared process leaks every tenant's data",
  source: "John Graham-Cumming, Incident report on memory leak caused by Cloudflare parser bug (2017)",
  gateIntro: "On 17 February 2017 an external security researcher contacted Cloudflare with fragments of other people's HTTP traffic - cookies, POST bodies, private messages, credentials - which he had found sitting in ordinary public web search results. The data had passed through Cloudflare's edge. There had been no intrusion and no unauthorised access, no elevated error rate, no customer report, and nothing anomalous in Cloudflare's own metrics for the period, which turned out to have started months earlier.",
  idea: "When many tenants share one address space, a memory safety bug does not corrupt one customer's request, it emits fragments of every other customer's traffic to whoever asked.",
  why: "The proximate defect was a pointer check in a Ragel-generated HTML parser that tested for equality with the end of the buffer rather than for having passed it, so a particular malformed input walked past the end. That code had been latent for a long time; introducing a new parser changed the buffering conditions in a way that started exercising it. When the parser ran off the end it kept emitting bytes, and the bytes adjacent in memory were whatever else that process had been handling.\n\nThe amplifier is the tenancy model, not the bug. In a shared edge process the neighbouring memory is other customers' requests and responses, so a memory error converts into a cross-tenant data disclosure with no privilege boundary crossed. Then the output was returned as page content, which meant search engine crawlers fetched and cached it, and the leaked data outlived the fix by an unbounded amount in third-party systems Cloudflare did not control. Fixing the parser took hours. Cleanup meant working with Google, Bing and Yahoo to purge caches, and by construction it could never be proven complete. Cloudflare's estimate was that roughly one in every 3,300,000 requests through their network could have leaked memory, and the highest-impact window was about five days.",
  failureMode: "The detection path is the tell. Nothing internal fired, because from inside the system every request succeeded. The first signal came from outside, from someone finding your customers' data somewhere it should not be, which means your time to detection is set by a stranger's curiosity.",
  experiment: "Identify every place in your estate where more than one tenant's data occupies one process, one buffer pool, one cache namespace or one temporary directory. For the top three, ask what an off-by-one or a missing key prefix would emit, and whether any internal signal would show it. Write down which ones would only be found by an outsider.",
  reflection: "Which of your shared components could return one tenant's data to another with every metric green, and who would tell you?",
  recall: {
    q: "What turned a memory safety bug into a cross-tenant disclosure at Cloudflare, and why did the cleanup extend beyond Cloudflare's own systems?",
    a: "Shared tenancy in a single process. The bytes adjacent to the overrun were other customers' in-flight requests and responses, so a parser walking past the end of a buffer emitted other tenants' data without any privilege boundary being crossed and without any error being raised.\n\nThe leaked bytes were served as page content, so search engine crawlers fetched and cached them. Remediation required purging third-party caches, and completeness could never be established. Detection came from an external researcher because internally every request had succeeded."
  },

  gateIntro: "From 17:45 UTC on 28 February 2012 a cloud platform began failing to bring up newly created virtual machines in one cluster. The platform read those failures as faulty hardware and relocated the workloads, which then failed on the new hardware too. Inside about ninety minutes enough nodes had been marked bad that the cluster stopped accepting work, and the same pattern started in other clusters. Management operations for the whole service were unavailable into the next day. A fix deployed during recovery contained the wrong version of a component and took out a further set of clusters.",

{

{
  id: "time-negative-duration",
  track: "time", level: "mechanism",
  title: "Cloudflare, 1 January 2017: time went backwards and the arithmetic had no case for it",
  source: "John Graham-Cumming, How and why the leap second affected Cloudflare DNS (Cloudflare, 2017)",
  gateIntro: "Shortly after 00:00 UTC on 1 January 2017 a small percentage of DNS queries to a large public resolver started returning errors. The failures were spread thinly across the whole fleet rather than concentrated in one location. Query volume was normal, no upstream was down, and nothing had been deployed over the holiday period. The errors persisted until an engineer wrote a patch and it was rolled out.",
  idea: "Subtracting two wall-clock timestamps produces a signed number, and code that assumes it is positive is one clock correction away from an arithmetic error in a hot path.",
  why: "The resolver measured how long an upstream took by subtracting one wall-clock reading from another. Go's time.Now returned wall time only at the version in use, so across the inserted second the subtraction produced a negative duration. That value flowed into the logic that chose which upstream to use, where a negative input was not a case anybody had written, and the result was errors returned to real queries. The fix was to clamp the value; the durable fix was Go gaining a monotonic reading.\n\nWall clock is not monotonic and never was. NTP steps it, leap seconds shift it, a live migration moves it, a resumed VM lands somewhere else entirely, and a container inherits whatever the host decided. Any duration reconstructed from two wall-clock reads can be negative or enormous. Use a monotonic source for elapsed time and a wall clock only for instants you intend to display or compare across machines, and even then decide in advance what you do when the comparison comes out backwards.",
  failureMode: "Negative durations poison three things quietly. Latency histograms get a negative sample and your p99 is now a lie. Timeout arithmetic computes deadline minus now, goes negative, and the call either fires instantly or waits forever depending on the sign handling. Rate limiters accrue tokens as elapsed times rate, so negative elapsed removes tokens and the limiter locks out traffic. In Go, time.Since is monotonic, but the monotonic reading is stripped the moment a timestamp is serialised, so a Temporal activity comparing its own now against a scheduled time from the workflow history is back to comparing two machines' wall clocks.",
  experiment: "Run one query. In ClickHouse, compute the distribution of activity start time minus scheduled time for the last day of workflow executions and look at the minimum, not the median. A negative minimum means clock skew between your Temporal service and your workers, and it means you have already been recording negative latencies somewhere. Then grep the Go and Python code for any subtraction where one operand came off the wire rather than out of a local monotonic read.",

{
  id: "time-lease-needs-a-fence",
  track: "time", level: "mechanism",
  title: "A lease is only as safe as your bound on clock skew and process pauses",
  source: "Martin Kleppmann, How to do distributed locking (2016)",
  gateIntro: "A scheduler guarantees that at most one worker runs a given tenant's sync at a time, using a lock with a timeout. In production two workers occasionally write conflicting output for the same tenant inside the same second. Both workers' logs show them holding the lock, neither logs an error, and the lock service shows exactly one holder at every point in its own history. The problem is rare, it correlates with nothing in the input, and it is more common on the busiest nodes.",
  idea: "A lease provides mutual exclusion only if the resource itself rejects writes from an expired holder, because the holder cannot tell a pause from an instant.",
  why: "Lease correctness rests on the holder noticing expiry before it acts. Between the check and the write there can be a garbage collection pause, hypervisor steal, a page fault storm, CPU throttling in a cgroup, or a clock jump. The lock service expires the lease on its own clock and hands it to somebody else. The paused process resumes and completes a write it correctly believed was protected when it checked. No component behaved incorrectly and no log line is wrong.\n\nThe fix is not a longer timeout, because a longer timeout only makes the window rarer, and rarer means you will meet it during an incident when pauses are longest. The fix is a monotonically increasing token issued with the lease and checked by the resource on every write, where the resource rejects any token lower than the highest it has already accepted. That converts the safety property from a timing assumption into an ordering one. If the resource cannot check a token, you do not have a lock, you have a probability.",
  failureMode: "CPU limits make pauses routine. A throttled pod stalls for hundreds of milliseconds at a time in normal operation, and a heap collection under memory pressure goes much further. So the estate that most needs fencing is exactly the one where the lease TTLs were chosen assuming processes run continuously. Look at leader election in custom operators, the Argo controller, and anything whose shape is check the lock, then write to object storage or ClickHouse, where the destination accepts every write it is offered.",
  experiment: "Pick one lock and answer whether the resource it protects checks anything at write time. If it does not, reproduce the failure today: SIGSTOP the holder for longer than the lease TTL, let a second worker acquire the lease, then SIGCONT the first and see whether its write lands. If it lands, you have measured the guarantee you actually have rather than the one in the design document.",

  recall: {

    a: "A longer TTL shrinks the window but does not remove it, and the pauses that hit the window are longest exactly when the system is degraded, so the failure concentrates in incidents.\n\nSafety has to be enforced at the resource: a monotonically increasing fencing token, checked on every write, with anything lower rejected. Ordering is checkable, timing is not."

{
  id: "time-bound-the-uncertainty",
  track: "time", level: "mechanism",
  title: "Spanner makes clock uncertainty explicit and waits it out",
  source: "Corbett et al., Spanner: Google's Globally-Distributed Database, OSDI 2012",
  gateIntro: "A globally distributed database offers external consistency: any transaction beginning after another has committed observes its writes, across continents, with no consensus round in the read path for that guarantee. Its commit latency contains a deliberate wait of a few milliseconds that performs no work and cannot be optimised away. The operators install GPS receivers and atomic clocks in every data centre and treat the resulting hardware as a production dependency.",
  idea: "You either bound your clock error, expose the bound and pay for it in latency, or assume it is zero and pay for it in silently wrong ordering.",
  why: "TrueTime returns an interval rather than an instant: a pair guaranteed to contain the true time, with a width derived from drift since the last synchronisation against GPS and atomic references. Because the width is known, the system can reason about it. After choosing a commit timestamp, the coordinator waits until the interval has moved past it, so no later transaction can be assigned an earlier timestamp. Uncertainty is paid as commit latency, and the investment in clock hardware exists to keep that payment small.\n\nEvery system that orders events by timestamp has the same dependency. The difference is whether the dependency is named. Last-write-wins conflict resolution keyed on a wall-clock timestamp makes exactly the same assumption as Spanner, with no bound, no measurement and no wait. The right question about any timestamp-ordered system is: what maximum clock error does this assume, who measures the actual error, and what is the observable when it is exceeded.",
  failureMode: "Last-write-wins on a wall-clock column is the common case and it fails silently. A ClickHouse ReplacingMergeTree deduplicating on a version column populated with an ingestion timestamp keeps the row with the larger value, so if two writers are skewed, the older write wins permanently at merge time and nothing errors. Same for an upsert path that keeps the larger updated_at. The lost write is not logged, is not retried, and surfaces months later as a value that will not stay corrected.",

  deepDive: "Find every place in my estate where a wall-clock timestamp decides which of two writes wins, and tell me what skew would have to exist for the wrong one to win."

{
  id: "time-wall-clock-schedules",
  track: "time", level: "mechanism",
  title: "A daily schedule in a zone with daylight saving runs twice or not at all",
  source: "Noah Sussman, Falsehoods programmers believe about time (2012), and the IANA time zone database",
  gateIntro: "Two tenant reports, seven months apart, about the same nightly reconciliation scheduled for 02:30 local. The first tenant says the job produced its output twice for a single date and the downstream ledger double counted. The second says there was no output at all for a single date, with no failed run recorded anywhere: the scheduler simply has no execution for that day. No configuration changed for either tenant, both are in the same country, and tenants elsewhere saw nothing.",
  idea: "A schedule expressed as a wall-clock time in a zone with daylight saving will run twice on one day of the year and not at all on another.",
  why: "Cron semantics are: fire when the local wall clock reads this. At the autumn transition 02:30 occurs twice, and at the spring transition it does not occur at all. Schedulers resolve that ambiguity differently and none of them is wrong: some skip, some run once, some run twice, some fire the missing run at the transition instant. So the behaviour you get is a property of the specific scheduler implementation, not of cron.\n\nMulti-tenant makes it worse in two ways. The transition dates differ per zone, the southern hemisphere is offset by roughly six months from the northern, plenty of zones have no transition at all, and the tz database changes several times a year when a government moves its rules, sometimes with weeks of notice. That means the correct UTC instant for a future local time is not knowable in advance. Store the zone identifier and the local time and resolve at fire time, never a precomputed instant, and make the job idempotent so it survives whichever way the ambiguity resolves.",
  failureMode: "Argo CronWorkflow takes an IANA timezone. Temporal schedules take a calendar spec with a time zone name. Both therefore inherit the ambiguity, and nothing guarantees the two resolve it identically. During a migration from one to the other that difference is a silent behavioural change on two days a year per zone, with no ticket, no diff in the schedule definition, and a symptom that appears months after the cutover as either a duplicated side effect or a missing run.",
  experiment: "Take one non-UTC schedule and compute its next 400 days of fire times with each scheduler's own library, Argo's and Temporal's, then diff the two lists. Any date where the lists disagree is a behavioural change your cutover is carrying. Then count, across the estate, how many schedules have a non-UTC zone and group them by zone, so you know how many tenants are exposed and on which dates.",
  reflection: "How many of your scheduled workloads are expressed in a zone that has a transition, and are any of them non-idempotent?",

  },
  deepDive: "Compare how Argo CronWorkflow and Temporal schedules resolve a duplicated and a skipped local time, and tell me which of my tenant schedules would change behaviour on the cutover."

{
  id: "time-date-packed-into-an-int",
  track: "time", level: "mechanism",
  title: "Microsoft Exchange, 1 January 2022: a date packed into a signed 32-bit integer overflowed",
  source: "Microsoft, Email Stuck in Exchange On-premises Transport Queues (January 2022)",
  gateIntro: "At the local midnight ending 31 December 2021, on-premises mail servers worldwide stopped delivering mail and messages piled up in transport queues. Every version, patch level and hardware configuration failed the same way at the same local moment. Servers untouched for months behaved identically to freshly patched ones. There was no common network, no common load and no common administrator, and the vendor's interim guidance was to disable a component rather than to roll anything back.",
  idea: "A date encoded as a number inside a fixed-width field has a cliff at one specific calendar instant, and the entire installed base crosses it together.",
  why: "The scanning component derived its update version number from the date, so 1 January 2022 produced a value beginning 2201010001. That exceeds the maximum signed 32-bit integer, 2147483647. The update could not be loaded, and the component's failure stopped the transport queue. Note that the date was never compared to anything: it was packed into an integer as decimal digits, so the cliff was not a meaningful time boundary like 2038, it was the arbitrary instant at which the digit string outgrew the field.\n\nThis class has three properties worth memorising. Zero correlation with load, change or topology. Simultaneity across the whole installed base. And immunity to rollback, because the older version has the same cliff. That combination is diagnostic: when a failure appears everywhere at once and going back a version does not help, you are looking at an absolute-time trigger rather than anything you did.",
  failureMode: "The estate versions of this are dull and everywhere. Seconds in a signed 32-bit column, which is 2038. Milliseconds in a 32-bit field, which overflows about 24 days after its epoch and therefore breaks immediately. Dates written as YYYYMMDD integers in a type too small for them. And the analytics one: ClickHouse DateTime is 32-bit unsigned seconds and stops in 2106, which is invisible for ingestion timestamps and not invisible at all when somebody stores a contract end date or a retention horizon in that column.",
  experiment: "In ClickHouse, list every column of type DateTime rather than DateTime64, and every integer column whose name contains time, date, ts or epoch. For each integer column take min and max and work out its unit and epoch from the magnitude. Anything holding milliseconds in a 32-bit type, anything holding a date as packed digits, and any DateTime column that receives a future business date gets recorded against its table with the date it fails.",

{

  track: "time", level: "mechanism",

  source: "Kubernetes documentation, ServiceAccount token volume projection and bound token expiry",
  gateIntro: "A batch job that takes between forty minutes and six hours succeeds in staging and fails in production, but only for the largest tenants. It runs for hours and then fails on its final write with an authorisation error. Rerunning it succeeds whenever the tenant is small. The service account has the right permissions, the same permissions work for every short job in the same namespace, and nothing in the failure correlates with data content.",

  idea: "A statically stable system continues doing what it was already doing when its control plane is unavailable, because continuing requires no control plane calls at all.",

  gateIntro: "Late on 19 October 2025 Pacific time, a managed database service in one US region began failing nearly all requests. Within the hour, failures appeared in services that do not obviously use it: new compute instances would not launch, load balancer health checks started failing and removing healthy targets, and a long list of higher-level services degraded. Consumer applications worldwide went down. The database service itself was restored well before the dependent services were, and the recovery of instance launches took many more hours with throttles in place.",

  gateIntro: "At 15:39 UTC on 4 October 2021, traffic to every property one company operates went to zero within minutes: the main app, the photo app, the messaging platform, the developer APIs. Employees reported that internal tooling, conference rooms and building access systems had also stopped working. There was no attack claim, no capacity event and no deploy in flight. Service was restored after roughly six hours, and the restoration itself was reported as slow and physically difficult.",

  gateIntro: "At 11:43 UTC on 2 November 2023, a provider's dashboard and APIs stopped working. The global network kept passing customer traffic normally and caches kept serving, so most end users saw nothing. Logging and analytics stopped. The provider had two other facilities intended to take over. Partial restoration was announced, then walked back, then re-announced; the control plane was not fully healthy again until 4 November, and analytics backfill continued after that.",

{
  id: "dependency-conntrack-dns-timeout",
  track: "dependency", level: "mechanism",
  title: "Kubernetes DNS lookups fail for five seconds because of a conntrack race",
  source: "Martynas Pumputis, Racy conntrack and DNS lookup timeouts, Weaveworks (2017)",
  gateIntro: "A Go service in a Kubernetes cluster calls an internal peer a few thousand times a minute. The p50 is 4ms. Roughly one call in several hundred takes 5.0 seconds, almost exactly, and then succeeds. The peer's own latency histogram shows nothing above 20ms in the same window. The pattern does not correlate with load, node, namespace or time of day, and it survives a restart of both sides.",
  idea: "A latency distribution with a hard spike at exactly five seconds and no matching spike on the callee is a resolver timeout, not a slow dependency.",
  why: "The C resolver sends the A and AAAA queries in parallel from the same source socket. Both UDP packets traverse the kernel's connection tracking layer at nearly the same moment, and the insert of the conntrack entry is not atomic with respect to the lookup. Under DNAT to a service IP, two packets racing to create the same tuple can result in one of them being dropped, so one of the two replies never comes back. The resolver waits out its timeout, which defaults to five seconds, then retries and succeeds.\n\nThe Kubernetes amplifier is ndots. The default resolv.conf has a search path of several suffixes and ndots set to 5, so a name like an external API hostname is tried against every search domain before the absolute form. Each attempt is another pair of racing packets, which multiplies the number of chances to lose the race by roughly the length of the search path. The tells are the exact five second figure, the absence of any corresponding latency on the callee, and the fact that it scales with query volume rather than with request complexity.",
  failureMode: "You spend a week hunting for a slow dependency that is not slow. Or worse, you raise client timeouts to ten seconds to stop the errors, which converts a rare five second stall into a queue of held connections and turns a resolver artefact into a saturation event on your own side.",
  experiment: "Query your latency histogram for any internal caller and check whether the bucket boundaries around 5s and 10s hold a small but non-zero count while the callee's histogram is clean. Then read resolv.conf inside one of those pods and count the search domains. If a hot external hostname is being queried without a trailing dot and ndots is 5, count the extra lookups per call: that multiplier is how much you have amplified your own exposure.",
  reflection: "Which of my services resolve a high-volume external hostname on every request rather than caching it, and what is their search path length?",
  recall: {
    q: "What produces almost exactly five second stalls in a Kubernetes pod's outbound calls, and what makes them more frequent?",
    a: "Parallel A and AAAA queries from the same socket can race in the kernel connection tracking layer under DNAT, and one reply is lost, so the resolver waits out its timeout and retries. Five seconds is the default resolver timeout, which is why the number is so precise.\n\nThe ndots search path multiplies it: each unqualified lookup is tried against every search domain, so a single logical resolution becomes several chances to lose the race."
  },
  deepDive: "Check my pods' resolv.conf and the DNS query rate per request, and tell me whether the five second buckets in my latency histograms are consistent with this mechanism."

{

  title: "When the Kubernetes control plane is down the cluster runs until something needs to change",
  source: "Kubernetes documentation, cluster architecture, kubelet behaviour and etcd operations",
  gateIntro: "During a cluster upgrade the API server becomes unavailable for forty minutes. Tenant request rates and error rates are flat throughout and no customer has complained. The on-call declares a Sev2 anyway. Two things are pushing that decision: the change that triggered the upgrade needs reverting, and one node in an affected pool has started reporting memory pressure.",
  idea: "Without a control plane a Kubernetes cluster keeps serving but cannot change, so the only question during the incident is whether your remediation requires a control plane write.",

{

{

  gateIntro: "A node pool rotation on a multi-tenant cluster is scheduled into a 30 minute maintenance window. Six hours later, three nodes are still cordoned and not empty. The drain command has not returned an error and is not retrying; it is simply still running. The pods that remain on those nodes all belong to the same workload class. Meanwhile the autoscaler has added replacement capacity that it cannot remove, and the cluster is running at roughly double its intended node count.",

  why: "A drain evicts pods subject to two constraints. PodDisruptionBudget caps how many pods of a workload may be unavailable at once, so eviction blocks until the budget allows it. terminationGracePeriodSeconds caps how long a pod gets after SIGTERM before it is killed, so a pod doing long work either finishes inside that window or is killed mid-work. The two interact: a workload with a long grace period and a tight budget drains one pod at a time, each taking the full grace period.\n\nThe unbounded case is when the budget can never be satisfied. A single-replica deployment with minAvailable of one, or a workload whose replacement pod cannot schedule because the node pool is cordoned, means the eviction API refuses forever and the drain never completes. This is why node rotation on a cluster running hour-long tenant workflows is not a maintenance task, it is a capacity project: you either wait out the work, checkpoint it so it can be killed and resumed, or accept killing it.",

  gateIntro: "On 28 October 2021 Roblox player numbers began to fall and by the evening the platform was entirely unavailable. It stayed down for 73 hours. There had been no release and no configuration change that correlated with the onset, and load was not unusual for the time of year. The investigation moved through a sequence of hypotheses over the first two days, several of which were pursued and abandoned, and the eventual cause was found only after engineers began inspecting low-level internals of one infrastructure component directly.",

{
  id: "recovery-crowdstrike-manual-touch",

  title: "CrowdStrike, 19 July 2024: a recovery that needs a human at each machine does not scale",
  source: "CrowdStrike, remediation guidance and External Technical Root Cause Analysis (2024)",
  gateIntro: "On 19 July 2024, beginning at 04:09 UTC, Windows hosts running a widely deployed endpoint agent began bugchecking and entering boot loops. Airlines, hospitals, broadcasters and payment networks were affected within the hour. The offending content was withdrawn at 05:27 UTC, 78 minutes after publication, and no machine that had not already received it was affected afterwards. Machines that had received it continued to fail. Recovery ran for days and in some organisations for more than a week.",

  failureMode: "You ship a DaemonSet or a node image change that fails on boot. The nodes never join, so no controller can reach them, and the mechanism that would roll the change back is a Kubernetes API interaction with nodes that are not in the cluster. Recovery is now per-node console work through your cloud provider, multiplied by every node in every tenant cluster.",
  experiment: "For every component that runs on the node boot path in your clusters - CNI, CSI, node agents, DaemonSets with hostNetwork, custom AMIs or node images - answer one question: if this ships broken, can it be fixed without console access to each node? Count the ones where the answer is no, and check whether their rollout is staged or global.",

  gateIntro: "On 29 December 2022 a CircleCI customer alerted the company to suspicious GitHub OAuth activity on their account. On 4 January 2023 CircleCI published a notice telling all customers to rotate any secrets stored in the platform. The build platform itself remained fully available throughout and there was no service degradation at any point. CircleCI cut off the intruder's access and completed its own remediation comparatively quickly. The incident nevertheless remained open, with active customer guidance, for weeks afterwards.",

  gateIntro: "A team reviews a quarter of incidents and finds their median repair time is stubborn. Every write-up ends with an action item about the fix being faster: a scripted rollback, a pre-warmed standby, a runbook rewrite. The next quarter the median has not moved.",

  why: "The three intervals have completely different levers. Repair is engineering: automation, rehearsal, a tested rollback. Diagnosis is observability and familiarity. Detection is almost entirely a question of whether a signal exists and whether anyone is looking at it, which is cheap to improve and easy to leave alone because nobody writes an action item about the forty minutes before the page.\n\nThe reason repair gets all the attention is that it is the part the write-up describes in detail. The timeline starts when the incident was declared, so the interval before that is invisible in the document that drives the follow-up work. Measuring from first customer impact rather than from declaration is a one-line change to the template that reallocates a quarter of engineering effort.",
  failureMode: "An incident where the fix took four minutes once someone understood the problem, and the ticket that produced the action item records a two hour outage. The action item is about the four minutes.",

  recall: {
    q: "Recovery time decomposes into which three intervals, and which one do teams systematically underinvest in?",

{
  id: "human-alert-precision",
  track: "human", level: "amplifier",
  title: "A low-precision alert is a base rate problem wearing a pager",
  source: "Rob Ewaschuk, My Philosophy on Alerting, appendix to Site Reliability Engineering",
  gateIntro: "A service has thorough alerting: forty rules, most of them firing a few times a week. During a real degradation the correct alert fires within ninety seconds. Nobody acts on it for twenty five minutes.",
  idea: "An alert that is usually wrong trains the responder to be slow, and the training is rational.",
  why: "This is conditional probability with a human attached. If a rule fires thirty times a month and two of those are real, the responder's posterior on any given page is about seven percent, so the correct individual response is to finish what they are doing and look in a minute. Every one of those decisions is locally reasonable and the aggregate is a team that cannot respond quickly to anything.\n\nThe damage is not confined to the noisy rule. Precision is learned at the level of the pager, not the rule, so one high-volume low-precision alert degrades response time for every other alert that shares the channel. That is why deleting alerts is usually a bigger availability win than adding them, and why it feels wrong to everyone."

  recall: {
    q: "Why does a noisy alert slow down response to unrelated alerts?",
    a: "Precision is learned at the level of the pager rather than per rule. A responder's prior that any page is real is set by the whole stream, so one high-volume low-precision rule raises the response latency of every alert sharing the channel.\n\nDeleting alerts is therefore often a larger availability improvement than adding them."

{
  id: "human-symptom-not-cause",
  track: "human", level: "mechanism",
  title: "Page on what the user is feeling, not on what you think causes it",
  source: "Rob Ewaschuk, My Philosophy on Alerting, appendix to Site Reliability Engineering",
  gateIntro: "Alerts exist for queue depth, replica lag, pod restarts, cache hit rate and CPU on every tier. During a two hour degradation in which requests were failing for a subset of tenants, none of them fired.",
  idea: "Alert on the symptom the user experiences, and treat cause-based signals as diagnosis rather than as detection.",
  why: "Cause-based alerts encode a hypothesis about how the system will fail, so they cover the failures you already imagined and miss the ones you did not. Symptom-based alerts have no such dependency: if error rate or latency for a real user journey is bad, something is wrong regardless of which of your hypotheses was right.\n\nThe secondary effect matters as much. Cause-based rules multiply, because every new subsystem brings its own set, and each one is individually plausible. That is how you arrive at forty rules with poor precision. A small number of symptom alerts with good precision, backed by rich cause-level metrics that you look at after being paged, is both more sensitive and quieter."
,
  failureMode: "Full coverage of every internal component and no alert on the thing the customer actually noticed, which is that their syncs stopped completing.",
  experiment: "Write down the three user journeys your service exists to serve. For each, name the single metric that would go bad if it were broken, and check whether an alert exists on it. Count how many of your current rules are causes rather than symptoms.",
  reflection: "How many of your alert rules would still be correct if the architecture changed next quarter?",
  recall: {
    q: "What is the difference between a symptom alert and a cause alert, and why does the distinction affect coverage?",
    a: "A symptom alert fires on what a user experiences; a cause alert fires on an internal condition you believe leads to that. Cause alerts encode a hypothesis, so they cover only the failure modes you already imagined.\n\nCause rules also multiply per subsystem, which is the usual route to a large low-precision alert set. Keep causes as diagnosis and alert on symptoms."
  },
  deepDive: "Help me pick the symptom metrics for a multi-tenant workflow execution service, and identify which of my existing alerts should become dashboards instead."

{
  id: "human-local-rationality",
  track: "human", level: "mechanism",
  title: "Everything the responder did made sense from inside the incident",
  source: "Sidney Dekker, The Field Guide to Understanding Human Error",
  gateIntro: "A postmortem records that an engineer restarted a service that did not need restarting, which cleared a cache and extended the outage by an hour. The write-up lists the restart as a contributing factor and the action item is a runbook warning.",
  idea: "People act on the situation as it appeared to them, so the useful question is what made the wrong action look right, not why they chose wrongly.",
  why: "Dekker's central move is to reconstruct the unfolding view rather than judge against the final one. From outside, after the fact, the responder had the whole picture and picked badly. From inside they had a partial, contradictory, time-pressured picture in which the action was the obvious one, and every other competent engineer on the team would have done the same.\n\nThis is not generosity, it is diagnostic technique. If the action was locally rational, then the thing to fix is whatever made it look right: an ambiguous dashboard, a runbook that did not mention the cache, a metric that had gone stale without saying so. A warning in a runbook fixes nothing, because the responder was not short of warnings. They were short of the information that would have made the warning apply to them."

  failureMode: "An action item that reads \"remind the team not to restart the service during an incident\", written about an engineer who had no way to know that this time was different.",
  experiment: "Take a decision from your last incident that turned out wrong. Write down only what was visible on screen at that moment, with no later knowledge. Then ask what would have had to be different on that screen for the other choice to look obvious.",
  reflection: "Where in your last write-up did you describe a decision using information the person did not have at the time?",
  recall: {
    q: "What does local rationality mean, and what does it change about an action item?",
    a: "People act sensibly given the information available to them at the time, so a wrong action indicates the situation looked different from inside than it does in hindsight.\n\nThe action item therefore has to change what was visible - a dashboard, a signal, a default - rather than tell people to be more careful, because they were not short of care."
  },

{
  id: "human-complex-systems-fail",
  track: "human", level: "mechanism",
  title: "Your system is already running in degraded mode right now",
  source: "Richard I. Cook, How Complex Systems Fail",
  gateIntro: "A service has run without incident for eight months. In the week after a routine dependency upgrade it fails twice in three days, in two apparently unrelated ways.",
  idea: "Complex systems run continuously in a partially broken state, and an incident is when several of those latent faults line up rather than when one thing breaks.",
  why: "Cook's argument is that catastrophe requires multiple contributors, each insufficient alone. That has an uncomfortable corollary: the system was already carrying most of the faults involved in today's incident yesterday, and the day before, while it appeared healthy. Apparent health is the system's defences absorbing faults, not the absence of faults.\n\nThis reframes two things. Root cause becomes the wrong shape of question, because there is no single point whose removal prevents the outcome; you are choosing which of several necessary contributors to name. And it explains why change so often precedes failure without being the cause: a change does not usually introduce all the contributors, it removes one of the defences that was quietly absorbing the others."

  recall: {
    q: "Why is root cause the wrong shape of question in a complex system?",
    a: "Catastrophe requires several contributors, each insufficient on its own, so there is no single point whose removal would have prevented the outcome. Naming one root cause is choosing which necessary contributor to write down.\n\nIt also explains why change precedes failure so often: change usually removes a defence that was absorbing faults already present rather than introducing every contributor."
  },

{
  id: "human-hindsight-bias",
  track: "human", level: "amplifier",
  title: "The write-up reads as obvious because you already know the ending",
  source: "Baruch Fischhoff, Hindsight is not equal to Foresight, 1975",
  gateIntro: "A review meeting for a four hour outage keeps returning to the same point: the signal was on the dashboard the whole time. Several people say some version of how did nobody see it. The engineer who was on call says very little.",
  idea: "Knowing the outcome makes the path to it look inevitable, which systematically corrupts both the analysis and the action items.",
  why: "Fischhoff called it creeping determinism: once an outcome is known, people cannot recover their own prior uncertainty, and they overestimate how predictable it was. In an incident review this does specific damage. The signal that mattered is obvious now because you know which of the forty signals mattered; at the time it was one of forty, most of which were also anomalous.\n\nThe practical consequence is that hindsight-driven action items are almost always some form of look harder, which cannot be implemented. Worse, the bias falls on a person who is in the room, so the review teaches the team that being on call during a bad incident is professionally expensive. That is the mechanism by which a nominally blameless process still suppresses reporting."

  recall: {
    q: "What is creeping determinism and what does it do to incident action items?",
    a: "Fischhoff's finding that knowing an outcome makes it seem more predictable than it was, and that people cannot recover their own prior uncertainty.\n\nIt produces action items of the form look harder, which cannot be implemented, and it concentrates implied blame on whoever was on call, which suppresses future reporting even in a nominally blameless process."

{
  id: "human-dashboard-ambiguity",
  track: "human", level: "amplifier",
  title: "A signal that stops when the situation worsens teaches the wrong lesson",
  source: "BEA, Final Report on the accident to Airbus A330-203 flight AF 447, 2012",
  gateIntro: "Air France 447, 1 June 2009, over the Atlantic. Airspeed indications became briefly unreliable and the autopilot disengaged, handing an aircraft in cruise to the crew. During the descent that followed, a warning that was correctly indicating the aircraft's condition ceased whenever the crew moved the controls toward the recovery action, and resumed when they moved them back.",
  idea: "An indicator whose validity logic silences it in the extreme case can invert the feedback a responder is learning from.",
  why: "The stall warning on the A330 is suppressed when measured airspeed falls below a validity threshold, on the reasonable ground that the sensors cannot be trusted at very low airspeed. At the extreme angle of attack the aircraft reached, that condition was met, so the warning stopped. Pushing the nose down restored valid airspeed and the warning resumed. Every correct input was followed by the alarm returning, and every incorrect input by silence.\n\nThe transferable point is not about aviation. Any signal with a validity gate can go quiet in exactly the regime where it matters most, and a responder cannot distinguish quiet-because-fine from quiet-because-unmeasurable. A metric that disappears when a service is fully down looks identical to a metric that is healthy, and dashboards render both as an absence."

{
  id: "human-fixation",
  track: "human", level: "amplifier",
  title: "Three people on the interesting problem and nobody on the boring one",
  source: "NTSB, Aircraft Accident Report AAR-73-14, Eastern Air Lines Flight 401, 1972",
  gateIntro: "Eastern Air Lines 401, 29 December 1972, approaching Miami at night. A single indicator lamp for the nose landing gear failed to illuminate. The aircraft was placed in a hold at two thousand feet while the crew investigated the lamp. All three flight crew and a jump-seat occupant became involved in the investigation.",
  idea: "A team that converges on one salient problem stops monitoring the state that was previously safe, and nobody notices the handoff because nobody made one.",
  why: "The Everglades crash is the standard case because the presenting fault was trivial and entirely survivable: a burnt-out bulb. What killed the aircraft was that the autopilot was inadvertently disengaged and a slow descent went unobserved while every qualified person present was looking at the same small thing. Attention had been silently reallocated without anyone deciding to reallocate it.\n\nIncidents produce exactly this geometry. The interesting hypothesis attracts everyone, partly because it is interesting and partly because being on it is visibly useful. The unglamorous work of watching whether the overall situation is getting worse is nobody's job unless it is explicitly somebody's job, which is the entire reason incident command separates the commander from the investigators."

{

  idea: "Automating the routine cases leaves humans responsible for exactly the rare, hard cases, while removing the practice that would have made them competent at those cases.",

{

  title: "The signal did not get missed, it got reclassified as normal",
  source: "Diane Vaughan, The Challenger Launch Decision, 1996",
  gateIntro: "A metric that was defined as an alert condition two years ago now exceeds that threshold most weeks. The threshold has been raised twice. Nobody has ever decided that the underlying condition is acceptable; each individual adjustment was reasonable given the data at the time.",
