<title>Least Authority - systems that act on untrusted input</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* ==========================================================================
   Practicum — a daily logbook for management practice

   Identity: an engineering lab notebook. Pale technical paper stock, a 28px
   graph field locked to the prose baseline, drafting blue for structure and
   oxide red-pen for anything that asks you to act.

   Theming is token-level. Components read tokens and never reach inside a
   media query, so the viewer's explicit toggle can win in both directions.
   ========================================================================== */

/* --- Light tokens (the default ground) ----------------------------------- */
:root {
  --paper:        #F5F6F3;
  --paper-raised: #FFFFFF;
  --paper-sunk:   #EBEEE8;

  --grid:         rgba(20, 26, 34, 0.055);
  --grid-major:   rgba(20, 26, 34, 0.10);
  --rule:         #DBDFD7;
  --rule-strong:  #B6BEB4;

  --ink:          #141A22;
  --ink-muted:    #545F6A;
  --ink-faint:    #8B949D;

  --accent:       #1D4E80;
  --accent-ink:   #163D66;
  --accent-soft:  rgba(29, 78, 128, 0.09);
  --accent-line:  rgba(29, 78, 128, 0.30);

  --action:       #9E3A26;
  --action-soft:  rgba(158, 58, 38, 0.075);
  --action-line:  rgba(158, 58, 38, 0.32);

  --solid:        #2F6B4F;
  --shaky:        #8A6A1F;

  --shadow-card:  0 1px 0 rgba(20, 26, 34, 0.05), 0 8px 22px -14px rgba(20, 26, 34, 0.30);
  --shadow-lift:  0 1px 0 rgba(20, 26, 34, 0.06), 0 16px 34px -18px rgba(20, 26, 34, 0.38);

  /* Type roles. No CDN fonts: the Artifact CSP blocks font hosts, and a
     linked webfont would fail silently, so every role resolves locally. */
  --face-display: Superclarendon, Rockwell, "Bookman Old Style", "Roboto Slab", Georgia, serif;
  --face-text:    Charter, "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --face-ui:      "Helvetica Neue", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  --face-mono:    "SF Mono", SFMono-Regular, Menlo, "Cascadia Mono", Consolas, monospace;

  /* 28px baseline. The graph field is a 28px minor / 140px major multiple of
     it, so body lines land on grid lines rather than near them. */
  --lead:  28px;
  --u:     7px;
  --rail:  17rem;
  --measure: 66ch;
}

/* --- Dark tokens: a negative blueprint under lamplight -------------------
   Retuned rather than inverted. The blue lifts to hold contrast on a dark
   ground; the red-pen warms so it still reads as ink, not as an error state. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper:        #101418;
    --paper-raised: #171D24;
    --paper-sunk:   #0B0E12;

    --grid:         rgba(158, 190, 214, 0.055);
    --grid-major:   rgba(158, 190, 214, 0.085);
    --rule:         #232C34;
    --rule-strong:  #37444E;

    --ink:          #DCE3E9;
    --ink-muted:    #96A2AD;
    --ink-faint:    #68737D;

    --accent:       #6EA8D4;
    --accent-ink:   #9AC4E4;
    --accent-soft:  rgba(110, 168, 212, 0.13);
    --accent-line:  rgba(110, 168, 212, 0.34);

    --action:       #D9755C;
    --action-soft:  rgba(217, 117, 92, 0.12);
    --action-line:  rgba(217, 117, 92, 0.36);

    --solid:        #63B08A;
    --shaky:        #C9A651;

    --shadow-card:  0 1px 0 rgba(0, 0, 0, 0.4), 0 8px 22px -14px rgba(0, 0, 0, 0.7);
    --shadow-lift:  0 1px 0 rgba(0, 0, 0, 0.45), 0 16px 34px -18px rgba(0, 0, 0, 0.8);
  }
}

:root[data-theme="dark"] {
  --paper:        #101418;
  --paper-raised: #171D24;
  --paper-sunk:   #0B0E12;

  --grid:         rgba(158, 190, 214, 0.055);
  --grid-major:   rgba(158, 190, 214, 0.085);
  --rule:         #232C34;
  --rule-strong:  #37444E;

  --ink:          #DCE3E9;
  --ink-muted:    #96A2AD;
  --ink-faint:    #68737D;

  --accent:       #6EA8D4;
  --accent-ink:   #9AC4E4;
  --accent-soft:  rgba(110, 168, 212, 0.13);
  --accent-line:  rgba(110, 168, 212, 0.34);

  --action:       #D9755C;
  --action-soft:  rgba(217, 117, 92, 0.12);
  --action-line:  rgba(217, 117, 92, 0.36);

  --solid:        #63B08A;
  --shaky:        #C9A651;

  --shadow-card:  0 1px 0 rgba(0, 0, 0, 0.4), 0 8px 22px -14px rgba(0, 0, 0, 0.7);
  --shadow-lift:  0 1px 0 rgba(0, 0, 0, 0.45), 0 16px 34px -18px rgba(0, 0, 0, 0.8);
}

/* --- Ground -------------------------------------------------------------- */
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--face-text);
  font-size: 17px;
  line-height: var(--lead);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

h1, h2, h3, h4, p, ul, ol, dl, dd, dt, figure, blockquote {
  margin: 0;
  padding: 0;
}
ul, ol { list-style: none; }
button { font: inherit; color: inherit; }

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
  border-radius: 1px;
}

.skip {
  position: absolute;
  left: -9999px;
  top: 0;
  z-index: 50;
  padding: var(--u) calc(var(--u) * 2);
  background: var(--accent);
  color: #fff;
  font-family: var(--face-ui);
  font-size: 0.8125rem;
  text-decoration: none;
}
.skip:focus { left: var(--u); top: var(--u); }

/* --- Shared type roles --------------------------------------------------- */
.eyebrow {
  font-family: var(--face-ui);
  font-size: 0.6875rem;
  font-weight: 600;
  letter-spacing: 0.13em;
  text-transform: uppercase;
  color: var(--ink-faint);
}

.num { font-family: var(--face-mono); font-variant-numeric: tabular-nums; }

/* ==========================================================================
   Layout: a bound page. Spine rail carries identity and position; the field
   is the paper itself.
   ========================================================================== */
.logbook {
  display: grid;
  grid-template-columns: var(--rail) minmax(0, 1fr);
  min-height: 100vh;
}

/* --- Spine --------------------------------------------------------------- */
.spine {
  position: sticky;
  top: 0;
  align-self: start;
  height: 100vh;
  display: flex;
  flex-direction: column;
  gap: calc(var(--u) * 4);
  padding: calc(var(--u) * 5) calc(var(--u) * 4);
  background: var(--paper-sunk);
  border-right: 1px solid var(--rule);
  overflow-y: auto;
}

.spine__head { display: flex; flex-direction: column; gap: calc(var(--u) * 0.5); }

.wordmark {
  font-family: var(--face-display);
  font-size: 1.75rem;
  font-weight: 400;
  letter-spacing: -0.015em;
  line-height: 1.1;
}

.spine__sub {
  font-family: var(--face-ui);
  font-size: 0.75rem;
  line-height: 1.45;
  color: var(--ink-muted);
  max-width: 15ch;
}

/* The entry stamp: position in the sequence, set like a plate number. */
.stamp {
  display: flex;
  flex-direction: column;
  padding-top: calc(var(--u) * 2);
  border-top: 2px solid var(--ink);
}
.stamp__label {
  font-family: var(--face-ui);
  font-size: 0.625rem;
  font-weight: 600;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--ink-faint);
}
.stamp__num {
  font-family: var(--face-mono);
  font-variant-numeric: tabular-nums;
  font-size: 2.75rem;
  line-height: 1.05;
  letter-spacing: -0.03em;
  color: var(--accent);
}
.stamp__date {
  font-family: var(--face-mono);
  font-size: 0.6875rem;
  letter-spacing: 0.04em;
  color: var(--ink-muted);
  text-transform: uppercase;
}

/* --- Nav ----------------------------------------------------------------- */
.nav { display: flex; flex-direction: column; }

.nav__item {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--u);
  width: 100%;
  padding: calc(var(--u) * 1.4) 0;
  background: none;
  border: 0;
  border-bottom: 1px solid var(--rule);
  font-family: var(--face-ui);
  font-size: 0.875rem;
  text-align: left;
  color: var(--ink-muted);
  cursor: pointer;
  transition: color 0.12s ease;
}
.nav__item:first-child { border-top: 1px solid var(--rule); }
.nav__item:hover { color: var(--ink); }
.nav__item[aria-current="page"] {
  color: var(--ink);
  font-weight: 600;
  box-shadow: inset 2px 0 0 var(--accent);
  padding-left: var(--u);
}

.nav__badge {
  font-family: var(--face-mono);
  font-variant-numeric: tabular-nums;
  font-size: 0.6875rem;
  padding: 1px 6px;
  border-radius: 2px;
  background: var(--action);
  color: #fff;
}

/* --- Gauge: the small instrument panel ---------------------------------- */
.gauge {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: var(--u);
  margin-top: auto;
}
.gauge__cell { display: flex; flex-direction: column; gap: 2px; }
.gauge dt {
  font-family: var(--face-ui);
  font-size: 0.5625rem;
  font-weight: 600;
  letter-spacing: 0.11em;
  text-transform: uppercase;
  color: var(--ink-faint);
}
.gauge dd {
  font-family: var(--face-mono);
  font-variant-numeric: tabular-nums;
  font-size: 1.125rem;
  color: var(--ink);
}

.spine__foot { padding-top: calc(var(--u) * 1.5); border-top: 1px solid var(--rule); }

.ghost {
  padding: calc(var(--u) * 0.7) var(--u);
  background: none;
  border: 1px solid var(--rule-strong);
  border-radius: 2px;
  font-family: var(--face-ui);
  font-size: 0.75rem;
  color: var(--ink-muted);
  cursor: pointer;
  transition: border-color 0.12s ease, color 0.12s ease;
}
.ghost:hover { border-color: var(--ink-muted); color: var(--ink); }

/* --- Field: the graph paper ---------------------------------------------- */
.field {
  padding: calc(var(--u) * 8) calc(var(--u) * 7) calc(var(--u) * 14);
  background-color: var(--paper);
  background-image:
    linear-gradient(to right,  var(--grid-major) 0 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid-major) 0 1px, transparent 1px),
    linear-gradient(to right,  var(--grid) 0 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid) 0 1px, transparent 1px);
  background-size: 140px 140px, 140px 140px, 28px 28px, 28px 28px;
  background-position: 0 0;
}
.field:focus { outline: none; }

.view { display: flex; flex-direction: column; gap: calc(var(--u) * 5); max-width: 78ch; }

/* ==========================================================================
   Entry: the daily lesson
   ========================================================================== */
.entry { display: flex; flex-direction: column; gap: calc(var(--u) * 4); }

.entry__head { display: flex; flex-direction: column; gap: calc(var(--u) * 2); }

.tags { display: flex; flex-wrap: wrap; gap: var(--u); align-items: center; }

.tag {
  font-family: var(--face-ui);
  font-size: 0.625rem;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 3px 7px;
  border-radius: 2px;
  background: var(--accent-soft);
  color: var(--accent-ink);
}
.tag--level {
  background: none;
  border: 1px solid var(--rule-strong);
  color: var(--ink-muted);
}
.tag--time {
  background: none;
  color: var(--ink-faint);
  font-family: var(--face-mono);
  letter-spacing: 0.04em;
  text-transform: none;
  padding-left: 0;
}

.entry__title {
  font-family: var(--face-display);
  font-size: clamp(2.125rem, 4.6vw, 3.125rem);
  font-weight: 400;
  line-height: 1.07;
  letter-spacing: -0.022em;
  text-wrap: balance;
  max-width: 26ch;
}

/* The one orchestrated moment: the rule under the title draws itself. */
.entry__rule {
  height: 2px;
  background: var(--ink);
  transform-origin: left;
  animation: draw 0.55s cubic-bezier(0.22, 0.61, 0.36, 1) both;
}
@keyframes draw { from { transform: scaleX(0); } to { transform: scaleX(1); } }

.entry__source {
  font-family: var(--face-ui);
  font-size: 0.8125rem;
  color: var(--ink-muted);
}
.entry__source em { font-style: italic; }

/* --- Prose blocks -------------------------------------------------------- */
.block { display: flex; flex-direction: column; gap: calc(var(--u) * 1.5); }

.block__label {
  font-family: var(--face-ui);
  font-size: 0.6875rem;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-faint);
}

.block__body { max-width: var(--measure); display: flex; flex-direction: column; gap: var(--lead); }
.block__body p { line-height: var(--lead); }

.lead { font-size: 1.1875rem; line-height: 32px; }
.lead strong { font-weight: 600; }

/* Failure mode gets a quiet sunk panel — it is a warning, not an action. */
.block--failure .block__body {
  padding: calc(var(--u) * 2.5) calc(var(--u) * 3);
  background: var(--paper-sunk);
  border-left: 2px solid var(--rule-strong);
}

/* --- The experiment: a stamped action item in red pen -------------------- */
.experiment {
  display: flex;
  flex-direction: column;
  gap: calc(var(--u) * 1.5);
  padding: calc(var(--u) * 3.5);
  background: var(--action-soft);
  border: 1px solid var(--action-line);
  border-left: 3px solid var(--action);
  border-radius: 2px;
}
.experiment__label {
  font-family: var(--face-ui);
  font-size: 0.6875rem;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--action);
}
.experiment__body { max-width: var(--measure); }

/* --- Reflection: a ruled writing surface --------------------------------- */
.reflect { display: flex; flex-direction: column; gap: calc(var(--u) * 1.5); }
.reflect__prompt {
  max-width: var(--measure);
  font-style: italic;
  color: var(--ink-muted);
}

.reflect__field {
  display: block;
  width: 100%;
  max-width: var(--measure);
  min-height: calc(var(--lead) * 4);
  padding: 0 calc(var(--u) * 1.5);
  border: 0;
  border-radius: 0;
  background-color: var(--paper-raised);
  background-image: linear-gradient(to bottom, transparent calc(var(--lead) - 1px), var(--rule) calc(var(--lead) - 1px));
  background-size: 100% var(--lead);
  box-shadow: inset 0 0 0 1px var(--rule);
  color: var(--ink);
  font-family: var(--face-text);
  font-size: 17px;
  line-height: var(--lead);
  resize: vertical;
}
.reflect__field:focus { box-shadow: inset 0 0 0 1px var(--accent-line); outline: none; }
.reflect__field::placeholder { color: var(--ink-faint); font-style: italic; }

.reflect__state {
  font-family: var(--face-mono);
  font-size: 0.6875rem;
  color: var(--ink-faint);
  min-height: var(--lead);
}

/* --- Actions row --------------------------------------------------------- */
.actions {
  display: flex;
  flex-wrap: wrap;
  gap: calc(var(--u) * 1.5);
  align-items: center;
  padding-top: calc(var(--u) * 2);
  border-top: 1px solid var(--rule);
}

.btn {
  padding: calc(var(--u) * 1.3) calc(var(--u) * 2.5);
  background: var(--ink);
  border: 1px solid var(--ink);
  border-radius: 2px;
  font-family: var(--face-ui);
  font-size: 0.8125rem;
  font-weight: 600;
  color: var(--paper);
  cursor: pointer;
  transition: opacity 0.12s ease;
}
.btn:hover { opacity: 0.86; }
.btn[disabled] { opacity: 0.4; cursor: default; }

.btn--quiet {
  background: none;
  border-color: var(--rule-strong);
  color: var(--ink-muted);
  font-weight: 500;
}
.btn--quiet:hover { border-color: var(--ink-muted); color: var(--ink); opacity: 1; }

.btn--done {
  background: var(--accent-soft);
  border-color: var(--accent-line);
  color: var(--accent-ink);
}

/* --- Deep dive ----------------------------------------------------------- */
.deepdive {
  display: flex;
  flex-direction: column;
  gap: calc(var(--u) * 1.5);
  padding: calc(var(--u) * 3);
  border: 1px dashed var(--accent-line);
  border-radius: 2px;
}
.deepdive__note {
  max-width: var(--measure);
  font-size: 0.9375rem;
  color: var(--ink-muted);
}
.deepdive__text {
  max-width: var(--measure);
  max-height: 40vh;
  overflow: auto;
  padding: calc(var(--u) * 2);
  background: var(--paper-sunk);
  border: 1px solid var(--rule);
  font-family: var(--face-mono);
  font-size: 0.8125rem;
  line-height: 1.6;
  white-space: pre-wrap;
  overflow-wrap: break-word;
}

/* ==========================================================================
   Review: index cards
   ========================================================================== */
.card {
  display: flex;
  flex-direction: column;
  gap: calc(var(--u) * 2);
  max-width: 62ch;
  padding: calc(var(--u) * 4);
  background: var(--paper-raised);
  border: 1px solid var(--rule);
  border-top: 3px solid var(--accent);
  border-radius: 2px;
  box-shadow: var(--shadow-card);
}

.card__meta {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: var(--u);
  font-family: var(--face-mono);
  font-size: 0.6875rem;
  color: var(--ink-faint);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.card__q {
  font-family: var(--face-display);
  font-size: 1.4375rem;
  font-weight: 400;
  line-height: 1.28;
  letter-spacing: -0.01em;
  text-wrap: balance;
}

.card__a {
  padding-top: calc(var(--u) * 2);
  border-top: 1px solid var(--rule);
  animation: settle 0.28s ease both;
}
@keyframes settle { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

.grades { display: flex; flex-wrap: wrap; gap: var(--u); }
.grade {
  flex: 1 1 auto;
  padding: calc(var(--u) * 1.3) calc(var(--u) * 2);
  background: none;
  border: 1px solid var(--rule-strong);
  border-radius: 2px;
  font-family: var(--face-ui);
  font-size: 0.8125rem;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.12s ease, border-color 0.12s ease;
}
.grade__hint {
  display: block;
  font-weight: 400;
  font-size: 0.6875rem;
  color: var(--ink-faint);
}
.grade--miss:hover  { border-color: var(--action); background: var(--action-soft); }
.grade--close:hover { border-color: var(--shaky); background: color-mix(in srgb, var(--shaky) 9%, transparent); }
.grade--got:hover   { border-color: var(--solid); background: color-mix(in srgb, var(--solid) 9%, transparent); }

/* ==========================================================================
   Library
   ========================================================================== */
.filters { display: flex; flex-wrap: wrap; gap: var(--u); align-items: center; }

.search {
  flex: 1 1 18ch;
  min-width: 0;
  padding: calc(var(--u) * 1.2) calc(var(--u) * 1.5);
  background: var(--paper-raised);
  border: 1px solid var(--rule);
  border-radius: 2px;
  color: var(--ink);
  font-family: var(--face-ui);
  font-size: 0.875rem;
}
.search:focus { border-color: var(--accent-line); outline: none; }

.chip {
  padding: calc(var(--u) * 0.8) calc(var(--u) * 1.4);
  background: none;
  border: 1px solid var(--rule-strong);
  border-radius: 2px;
  font-family: var(--face-ui);
  font-size: 0.75rem;
  color: var(--ink-muted);
  cursor: pointer;
}
.chip[aria-pressed="true"] {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--paper);
}

.shelf { display: flex; flex-direction: column; }

.shelf__row {
  display: grid;
  grid-template-columns: 4.5ch minmax(0, 1fr) auto;
  gap: calc(var(--u) * 2);
  align-items: baseline;
  width: 100%;
  padding: calc(var(--u) * 1.7) var(--u);
  background: none;
  border: 0;
  border-bottom: 1px solid var(--rule);
  text-align: left;
  cursor: pointer;
  transition: background 0.1s ease;
}
.shelf__row:hover { background: var(--accent-soft); }
.shelf__num {
  font-family: var(--face-mono);
  font-variant-numeric: tabular-nums;
  font-size: 0.75rem;
  color: var(--ink-faint);
}
.shelf__title { font-family: var(--face-text); font-size: 1rem; line-height: 1.4; }
.shelf__track {
  font-family: var(--face-ui);
  font-size: 0.625rem;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-faint);
}

.pip {
  display: inline-block;
  width: 6px;
  height: 6px;
  margin-right: var(--u);
  border-radius: 50%;
  background: var(--rule-strong);
  vertical-align: 1px;
}
.pip--logged { background: var(--accent); }
.pip--solid  { background: var(--solid); }
.pip--shaky  { background: var(--shaky); }

/* ==========================================================================
   Journal
   ========================================================================== */
.note {
  display: flex;
  flex-direction: column;
  gap: var(--u);
  max-width: var(--measure);
  padding-bottom: calc(var(--u) * 3);
  border-bottom: 1px solid var(--rule);
}
.note__meta {
  display: flex;
  flex-wrap: wrap;
  gap: calc(var(--u) * 1.5);
  align-items: baseline;
  font-family: var(--face-mono);
  font-size: 0.6875rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--ink-faint);
}
.note__title { font-family: var(--face-display); font-size: 1.1875rem; font-weight: 400; line-height: 1.3; }
.note__body { white-space: pre-wrap; }

/* ==========================================================================
   Progress
   ========================================================================== */
.readout {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(11rem, 1fr));
  gap: 1px;
  background: var(--rule);
  border: 1px solid var(--rule);
  border-radius: 2px;
}
.readout__cell {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: calc(var(--u) * 2.5);
  background: var(--paper-raised);
}
.readout__label {
  font-family: var(--face-ui);
  font-size: 0.625rem;
  font-weight: 600;
  letter-spacing: 0.11em;
  text-transform: uppercase;
  color: var(--ink-faint);
}
.readout__value {
  font-family: var(--face-mono);
  font-variant-numeric: tabular-nums;
  font-size: 1.875rem;
  line-height: 1.15;
  letter-spacing: -0.02em;
}
.readout__unit { font-family: var(--face-ui); font-size: 0.75rem; color: var(--ink-muted); }

.coverage { display: flex; flex-direction: column; gap: calc(var(--u) * 2); }
.cov { display: grid; grid-template-columns: minmax(9rem, 14rem) minmax(0, 1fr) 5ch; gap: calc(var(--u) * 2); align-items: center; }
.cov__name { font-family: var(--face-ui); font-size: 0.8125rem; }
.cov__bar { height: 8px; background: var(--paper-sunk); box-shadow: inset 0 0 0 1px var(--rule); }
.cov__fill { height: 100%; background: var(--accent); }
.cov__n {
  font-family: var(--face-mono);
  font-variant-numeric: tabular-nums;
  font-size: 0.75rem;
  color: var(--ink-muted);
  text-align: right;
}

/* ==========================================================================
   Shared furniture
   ========================================================================== */
.section__head {
  display: flex;
  flex-direction: column;
  gap: var(--u);
  padding-bottom: calc(var(--u) * 2);
  border-bottom: 2px solid var(--ink);
}
.section__title {
  font-family: var(--face-display);
  font-size: 1.875rem;
  font-weight: 400;
  line-height: 1.15;
  letter-spacing: -0.018em;
}
.section__note { max-width: var(--measure); font-size: 0.9375rem; color: var(--ink-muted); }

.empty {
  max-width: var(--measure);
  padding: calc(var(--u) * 5) 0;
  color: var(--ink-muted);
  font-style: italic;
}

.toast {
  position: fixed;
  bottom: calc(var(--u) * 3);
  left: 50%;
  transform: translate(-50%, calc(100% + var(--u) * 6));
  z-index: 40;
  padding: calc(var(--u) * 1.4) calc(var(--u) * 3);
  background: var(--ink);
  color: var(--paper);
  border-radius: 2px;
  font-family: var(--face-ui);
  font-size: 0.8125rem;
  box-shadow: var(--shadow-lift);
  transition: transform 0.24s cubic-bezier(0.22, 0.61, 0.36, 1);
}
.toast[data-open="true"] { transform: translate(-50%, 0); }

/* ==========================================================================
   Narrow: the spine unbinds into a top bar
   ========================================================================== */
@media (max-width: 60rem) {
  .logbook { grid-template-columns: minmax(0, 1fr); }

  .spine {
    position: static;
    height: auto;
    gap: calc(var(--u) * 3);
    padding: calc(var(--u) * 3.5) calc(var(--u) * 3);
    border-right: 0;
    border-bottom: 1px solid var(--rule);
    overflow: visible;
  }
  .spine__sub { display: none; }
  .spine__head { flex-direction: row; align-items: baseline; gap: calc(var(--u) * 2); }

  .stamp { flex-direction: row; align-items: baseline; gap: calc(var(--u) * 1.5); padding-top: var(--u); }
  .stamp__num { font-size: 1.75rem; }

  .nav { flex-direction: row; overflow-x: auto; gap: calc(var(--u) * 2.5); }
  .nav__item { width: auto; flex: 0 0 auto; border: 0; padding: var(--u) 0; }
  .nav__item:first-child { border-top: 0; }
  .nav__item[aria-current="page"] {
    box-shadow: inset 0 -2px 0 var(--accent);
    padding-left: 0;
  }

  .gauge { margin-top: 0; grid-template-columns: repeat(3, auto); gap: calc(var(--u) * 3); }
  .spine__foot { border-top: 0; padding-top: 0; }

  .field { padding: calc(var(--u) * 5) calc(var(--u) * 3) calc(var(--u) * 12); }
  .cov { grid-template-columns: minmax(0, 1fr) 5ch; }
  .cov__bar { grid-column: 1 / -1; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

/* ==========================================================================
   Daily — components the base sheet does not carry

   Everything here belongs to a mechanic that only some sites turn on: the
   commitment gate, expiry, the attempts log, the forecast book. Tokens only,
   no literal colours, so a site theme retunes these along with everything
   else.
   ========================================================================== */

/* --- The gate ------------------------------------------------------------
   Deliberately heavy. It is the one thing on the page that stops you, and a
   stop that looks like a form field gets skipped. */
.gate {
  max-width: var(--measure);
  margin: calc(var(--u) * 4) 0;
  padding: calc(var(--u) * 3);
  background: var(--action-soft);
  border: 1px solid var(--action-line);
  border-left-width: 3px;
  border-radius: 2px;
}
.gate--done {
  background: var(--paper-sunk);
  border-color: var(--rule);
  border-left-color: var(--rule-strong);
}
.gate__intro {
  margin-bottom: calc(var(--u) * 2);
  padding-bottom: calc(var(--u) * 2);
  border-bottom: 1px solid var(--action-line);
}
.gate__intro p + p { margin-top: var(--lead); }
.gate__prompt {
  font-family: var(--face-display);
  font-size: 1.25rem;
  line-height: 1.35;
  margin-bottom: calc(var(--u) * 2);
}
.gate__field { min-height: calc(var(--lead) * 4); }
.gate__note {
  margin-top: var(--u);
  font-family: var(--face-ui);
  font-size: 0.8125rem;
  color: var(--ink-muted);
}
.gate__stamp {
  font-family: var(--face-mono);
  font-size: 0.6875rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-faint);
  margin-bottom: var(--u);
}
.gate__answer { white-space: pre-wrap; color: var(--ink-muted); font-style: italic; }
.gate__answer p + p { margin-top: var(--lead); }

.gate__fallback { margin-bottom: calc(var(--u) * 2); }
.gate__fallback summary {
  cursor: pointer;
  font-family: var(--face-ui);
  font-size: 0.8125rem;
  color: var(--ink-muted);
}
.gate__fallbacktext {
  margin: var(--u) 0;
  padding: calc(var(--u) * 2);
  background: var(--paper-raised);
  border: 1px dashed var(--rule-strong);
  font-size: 0.9375rem;
}

.gate__curtain {
  max-width: var(--measure);
  padding: calc(var(--u) * 4) 0;
  font-family: var(--face-ui);
  font-size: 0.9375rem;
  color: var(--ink-faint);
  border-top: 1px dashed var(--rule-strong);
}

/* --- Worked example ------------------------------------------------------ */
/* Sits directly under the failure mode, and has to read as the answer to it
   rather than as one more block of commentary. The accent rule and the raised
   stock do that; the first paragraph is the repair itself, so it gets the
   weight and the rest of the block stays quiet. */
.worked {
  max-width: var(--measure);
  margin: calc(var(--u) * 4) 0;
  padding: calc(var(--u) * 3);
  background: var(--paper-raised);
  border: 1px solid var(--rule);
  border-left: 3px solid var(--accent);
  border-radius: 2px;
}
.worked__body {
  margin-top: var(--u);
}
.worked__body p + p {
  margin-top: var(--lead);
}
/* The repair. Set in the reading face at full size so it can be compared
   against the specimen without the eye having to change gear. */
.worked__body p:first-child {
  font-size: 1.0625rem;
  line-height: 1.6;
  color: var(--ink);
}
/* What it changed, and what it cost. */
.worked__body p:last-child:not(:first-child) {
  font-family: var(--face-ui);
  font-size: 0.875rem;
  line-height: 1.55;
  color: var(--ink-muted);
  padding-top: calc(var(--u) * 1.5);
  border-top: 1px solid var(--rule);
}

/* --- Arithmetic gate ----------------------------------------------------- */
/* Same visual weight as the text gate, because it does the same job one notch
   harder. The gap is the only part that earns colour: over and under are
   different mistakes and the reader should be able to see which one they keep
   making without reading the number. */
.compute {
  max-width: var(--measure);
  margin: calc(var(--u) * 4) 0;
  padding: calc(var(--u) * 3);
  background: var(--action-soft);
  border: 1px solid var(--action-line);
  border-left-width: 3px;
  border-radius: 2px;
}
.compute--done {
  background: var(--paper-sunk);
  border-color: var(--rule);
  border-left-color: var(--rule-strong);
}
.compute__q {
  margin-top: var(--u);
  font-size: 1.0625rem;
  line-height: 1.5;
}
.compute__note {
  margin-top: var(--u);
  font-family: var(--face-ui);
  font-size: 0.8125rem;
  color: var(--ink-faint);
}
.compute__fields {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  gap: var(--u) calc(var(--u) * 2);
  margin: calc(var(--u) * 2) 0;
}
.compute__lab {
  font-family: var(--face-ui);
  font-size: 0.875rem;
  color: var(--ink-muted);
}
.compute__unit { color: var(--ink-faint); }
.compute__row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: calc(var(--u) * 2);
  margin: calc(var(--u) * 2) 0;
}
.compute__input {
  font-family: var(--face-mono);
  font-size: 1rem;
  font-variant-numeric: tabular-nums;
  padding: calc(var(--u) * 1.25) calc(var(--u) * 1.5);
  background: var(--paper-raised);
  color: var(--ink);
  border: 1px solid var(--rule-strong);
  border-radius: 2px;
  min-width: 10ch;
}
.compute__input:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}
.compute__result {
  margin-top: calc(var(--u) * 1.5);
  font-variant-numeric: tabular-nums;
}
.compute__gap {
  margin-top: var(--u);
  font-family: var(--face-ui);
  font-size: 0.875rem;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.compute__gap[data-dir="exact"] { color: var(--solid); }
.compute__gap[data-dir="over"],
.compute__gap[data-dir="under"] { color: var(--action); }

/* --- Evidence gate ------------------------------------------------------- */
/* Seven verdicts, four colours. The colour answers only "how much weight does
   this carry", which is the question the reader is actually asking; the label
   carries the distinction between, say, never-repeated and disputed. Giving
   each verdict its own hue would imply seven degrees of trust and there are
   not seven. */
.evidence {
  max-width: var(--measure);
  margin: calc(var(--u) * 3) 0;
  padding: calc(var(--u) * 2) calc(var(--u) * 2.5);
  background: var(--paper-sunk);
  border-left: 3px solid var(--rule-strong);
}
.evidence__cite {
  margin: calc(var(--u) * 0.75) 0 0;
  font-family: var(--face-mono);
  font-size: 0.875rem;
  line-height: 1.5;
  color: var(--ink);
}
.evidence__interval {
  margin: calc(var(--u) * 0.5) 0 0;
  font-family: var(--face-mono);
  font-size: 0.8125rem;
  font-variant-numeric: tabular-nums;
  color: var(--ink-muted);
}
.evidence__meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: calc(var(--u) * 1.5);
  margin: calc(var(--u) * 1.5) 0 0;
}
.rep-chip {
  font-family: var(--face-ui);
  font-size: 0.6875rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 2px 7px;
  border: 1px solid currentColor;
  color: var(--ink-muted);
}
.evidence__asat,
.evidence__stale {
  font-family: var(--face-ui);
  font-size: 0.75rem;
  color: var(--ink-faint);
}

.evidence[data-rep="replicated"] { border-left-color: var(--solid); }
.evidence[data-rep="replicated"] .rep-chip { color: var(--solid); }

.evidence[data-rep="single"],
.evidence[data-rep="contested"] { border-left-color: var(--shaky); }
.evidence[data-rep="single"] .rep-chip,
.evidence[data-rep="contested"] .rep-chip { color: var(--shaky); }

.evidence[data-rep="failed"],
.evidence[data-rep="overclaimed"] { border-left-color: var(--action); }
.evidence[data-rep="failed"] .rep-chip,
.evidence[data-rep="overclaimed"] .rep-chip { color: var(--action); }

.evidence[data-rep="statute"] { border-left-color: var(--accent); }
.evidence[data-rep="statute"] .rep-chip { color: var(--accent); }

/* Staleness is about the check, not the claim, so it marks the block without
   overriding the verdict colour the claim earned. */
.evidence[data-stale="1"] { border-left-style: dashed; }
.evidence[data-stale="1"] .evidence__stale { color: var(--action); }

/* --- Expiry -------------------------------------------------------------- */
.tag--lapsed {
  background: none;
  border: 1px solid var(--action-line);
  color: var(--action);
}
.pip--lapsed {
  background: none;
  border: 1px solid var(--rule-strong);
  width: 5px;
  height: 5px;
}

/* --- Attempts log -------------------------------------------------------- */
.attempt {
  display: flex;
  flex-direction: column;
  gap: var(--u);
  max-width: var(--measure);
  padding-bottom: calc(var(--u) * 3);
  margin-bottom: calc(var(--u) * 3);
  border-bottom: 1px solid var(--rule);
}
.attempt__past {
  padding-left: calc(var(--u) * 2);
  border-left: 2px solid var(--accent-line);
  white-space: pre-wrap;
}
.attempt__past span {
  font-family: var(--face-mono);
  font-size: 0.6875rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--ink-faint);
  margin-right: var(--u);
}
.attempt__new { display: flex; flex-direction: column; gap: var(--u); align-items: flex-start; }
.attempt__field { min-height: calc(var(--lead) * 2); }

/* --- Journal, gated entries --------------------------------------------- */
.note__label {
  font-family: var(--face-ui);
  font-size: 0.6875rem;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-faint);
}
.note__body--gate {
  color: var(--ink-muted);
  font-style: italic;
  padding-left: calc(var(--u) * 2);
  border-left: 2px solid var(--action-line);
}

/* --- Forecast seed, inside an entry -------------------------------------- */
.fc-seed {
  max-width: var(--measure);
  margin: calc(var(--u) * 4) 0;
  padding: calc(var(--u) * 3);
  background: var(--paper-sunk);
  border: 1px solid var(--rule);
  border-radius: 2px;
}
.fc-seed__q {
  font-family: var(--face-display);
  font-size: 1.125rem;
  line-height: 1.35;
  margin-bottom: calc(var(--u) * 2);
}
.fc-seed__row {
  display: flex;
  flex-wrap: wrap;
  gap: calc(var(--u) * 2);
  align-items: center;
}
.fc-seed__lab {
  font-family: var(--face-ui);
  font-size: 0.8125rem;
  color: var(--ink-muted);
  display: inline-flex;
  align-items: center;
  gap: var(--u);
}
.fc-seed__p, .fc-seed__d {
  font-family: var(--face-mono);
  font-size: 0.875rem;
  padding: 5px 7px;
  color: var(--ink);
  background: var(--paper-raised);
  border: 1px solid var(--rule-strong);
  border-radius: 2px;
}
.fc-seed__p { width: 4.5rem; }

/* --- Forecast book ------------------------------------------------------- */
.fc-group {
  max-width: var(--measure);
  margin-bottom: calc(var(--u) * 5);
  display: flex;
  flex-direction: column;
  gap: var(--u);
}
.fc-new__q { min-height: calc(var(--lead) * 2); }
.fc-row {
  display: flex;
  flex-wrap: wrap;
  gap: calc(var(--u) * 2);
  justify-content: space-between;
  align-items: flex-start;
  padding: calc(var(--u) * 2);
  background: var(--paper-raised);
  border: 1px solid var(--rule);
  border-left: 3px solid var(--rule-strong);
  border-radius: 2px;
}
.fc-row--ripe { border-left-color: var(--action); background: var(--action-soft); }
.fc-row--good { border-left-color: var(--solid); }
.fc-row--mid  { border-left-color: var(--shaky); }
.fc-row--bad  { border-left-color: var(--action); }
.fc-row__body { flex: 1 1 18rem; }
.fc-row__q { line-height: 1.4; }
.fc-row__meta {
  margin-top: 4px;
  font-family: var(--face-mono);
  font-size: 0.75rem;
  color: var(--ink-faint);
}
.fc-row__acts { display: flex; gap: var(--u); flex-wrap: wrap; }

/* --- Calibration plot ----------------------------------------------------
   Inline SVG because the CSP blocks every chart library, and because a
   ten-bucket scatter against a diagonal does not need one. */
.calwrap {
  max-width: var(--measure);
  margin-bottom: calc(var(--u) * 5);
}
.cal {
  display: block;
  width: 100%;
  max-width: 22rem;
  height: auto;
  margin: calc(var(--u) * 2) 0;
}
.cal__ref { stroke: var(--rule-strong); stroke-width: 1; stroke-dasharray: 3 3; }
.cal__axis { stroke: var(--rule-strong); stroke-width: 1; }
.cal__dot { fill: var(--accent); fill-opacity: 0.75; }
.cal__t {
  fill: var(--ink-faint);
  font-family: var(--face-ui);
  font-size: 9px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

/* --- Cheatsheet ----------------------------------------------------------
   Inverted from every other list in the engine. The shelf leads with the
   claim because you are choosing what to read; here you have already read it,
   so the row leads with what to do and demotes the claim to the line that
   justifies it. The solid rule down the left is the same one the evidence
   block uses for a replicated verdict, because that is the only verdict on
   this page and the colour should mean the same thing in both places. */
.cheat { margin-bottom: calc(var(--u) * 5); }
.cheat__track {
  font-family: var(--face-ui);
  font-size: 0.625rem;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-faint);
  padding-bottom: var(--u);
  border-bottom: 1px solid var(--rule);
}
.cheat__row {
  display: flex;
  flex-direction: column;
  gap: calc(var(--u) * 0.75);
  width: 100%;
  padding: calc(var(--u) * 2) calc(var(--u) * 2);
  background: none;
  border: 0;
  border-left: 2px solid var(--solid);
  border-bottom: 1px solid var(--rule);
  text-align: left;
  cursor: pointer;
  transition: background 0.1s ease;
}
.cheat__row:hover { background: var(--accent-soft); }
.cheat__do {
  font-family: var(--face-text);
  font-size: 1.0625rem;
  line-height: 1.45;
  color: var(--ink);
  max-width: var(--measure);
}
.cheat__claim {
  font-family: var(--face-text);
  font-size: 0.875rem;
  line-height: 1.45;
  font-style: italic;
  color: var(--ink-muted);
  max-width: var(--measure);
}
.cheat__meta {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: calc(var(--u) * 1.5);
  margin-top: calc(var(--u) * 0.5);
}
.cheat__interval {
  font-family: var(--face-mono);
  font-variant-numeric: tabular-nums;
  font-size: 0.75rem;
  color: var(--solid);
}
.cheat__source,
.cheat__stale {
  font-family: var(--face-ui);
  font-size: 0.6875rem;
  color: var(--ink-faint);
}

/* A row carries the same colour its verdict earns in the evidence block, so
   the meaning of the rule is one thing across the whole site. Sites with no
   verdicts keep the default solid rule set above. */
.cheat__row[data-rep="statute"] { border-left-color: var(--accent); }
.cheat__row[data-rep="statute"] .cheat__interval,
.cheat__row[data-rep="statute"] .rep-chip { color: var(--accent); }
.cheat__row[data-rep="replicated"] .rep-chip { color: var(--solid); }

/* Same convention as the evidence block: staleness marks the check, not the
   claim, so the row keeps the verdict colour and changes only the rule. */
.cheat__row[data-stale="1"] { border-left-style: dashed; }
.cheat__row[data-stale="1"] .cheat__stale { color: var(--action); }

/* Least Authority - theme tokens, generated from the palette in site.js */
:root {
  --paper: #F3F5F2;
  --paper-raised: #FFFFFF;
  --paper-sunk: #E6EAE4;
  --grid: rgba(20, 30, 26, 0.055);
  --grid-major: rgba(20, 30, 26, 0.1);
  --rule: #D6DCD3;
  --rule-strong: #AFB8AB;
  --ink: #141A17;
  --ink-muted: #4F5A54;
  --ink-faint: #858E88;
  --accent: #2C5347;
  --accent-ink: #214238;
  --accent-soft: rgba(44, 83, 71, 0.085);
  --accent-line: rgba(44, 83, 71, 0.3);
  --action: #BE5320;
  --action-soft: rgba(190, 83, 32, 0.085);
  --action-line: rgba(190, 83, 32, 0.3);
  --solid: #2F6B4F;
  --shaky: #8A6A1F;
  --face-display: "SF Mono", SFMono-Regular, Menlo, "Cascadia Mono", Consolas, monospace;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0D110F;
    --paper-raised: #141A17;
    --paper-sunk: #080B09;
    --grid: rgba(165, 200, 180, 0.055);
    --grid-major: rgba(165, 200, 180, 0.085);
    --rule: #1F2723;
    --rule-strong: #333E38;
    --ink: #DAE2DC;
    --ink-muted: #93A099;

{

{
  id: "principles-eight-from-1975",

{

  why: "You cannot test your way to confidence in a protection mechanism, because a bug in enforcement usually shows up only under an input the attacker chooses and you did not. The only technique that scales is inspection, and inspection has a hard ceiling set by how much code a competent reviewer can hold in their head. Past that ceiling the review still happens, it just stops finding things.\n\nThis is why the metric is the size of the trusted computing base and not the size of the system. A large application with a small, sharply bounded enforcement core is reviewable. A small application where every module can reach the credential store is not, no matter how few lines it has in total.",

{
  id: "principles-fail-safe-defaults",
  track: "principles", level: "classical",
  title: "Fail-safe defaults make the absence of permission the answer",

  why: "The two designs differ in what a mistake looks like. Under deny by default, a gap in the rules breaks a legitimate workflow, and someone files a ticket within the hour. Under allow by default, the same gap opens an unintended path, and nothing at all happens until an attacker finds it. One error mode is self-reporting and the other is silent, and over a system's life you will make many of these errors.\n\nThe subtle version is the error path rather than the rule set. Code that returns allow when the policy service times out, when the tenant id is null, when the tool name is unrecognised, or when an exception is swallowed has a deny-by-default rule set and an allow-by-default failure mode, which is the one that matters during an incident.",

{

  track: "principles", level: "classical",
  title: "Complete mediation dies the moment you cache an authorisation decision",
  source: "Saltzer and Schroeder, The Protection of Information in Computer Systems, 1975",
  idea: "Every access to every object must be checked against current authority, and every performance shortcut around that check is a window in which revoked permission still works.",
  why: "Authorisation is a claim about the present, and a cached decision is a claim about the past presented as the present. The gap between the two is the staleness window, and its length is not an implementation detail, it is the answer to the question your customer will ask after they fire someone: how long until that person stops being able to act.\n\nAgents make this worse in a specific way. A human session is short and mostly synchronous; an agent run can hold a decision made at planning time and spend it minutes or hours later across dozens of tool calls, sometimes after the run has been resumed from a checkpoint. The authority that authorised the plan and the authority present when the plan executes are two different things.",

  reflection: "Is that number one you would put in a customer-facing document, and if not, which cache would you shorten first?",
  recall: {
    q: "What is the concrete cost of caching an authorisation decision, stated as a number?",
    a: "The revocation latency: the worst-case time between a permission being removed and the system actually refusing the access. It is the sum of every cache in the path, including token lifetime, policy TTL, session state and any checkpointed identity.\n\nAgents stretch it further than human sessions do, because a plan authorised at start can execute tool calls long afterwards, including after a resume."

{
  id: "principles-open-design",
  track: "principles", level: "classical",
  title: "Open design puts the secret in the key, not the blueprint",
  source: "Saltzer and Schroeder, The Protection of Information in Computer Systems, 1975",
  idea: "A design that only holds while its details stay unpublished has no security argument, only a delay.",
  why: "Secrecy of mechanism fails on both ends. It fails at the start because you cannot get review from people who are not allowed to see the design, so the flaws stay in. It fails at the end because mechanism leaks continuously through job ads, error messages, conference talks, decompiled clients, departing staff and support transcripts, and unlike a key it cannot be rotated when it does.\n\nThe practical form of the principle is a question you can ask of any control: if I published the full design tomorrow and changed nothing else, what would break? Anything that would break is a dependency on secrecy, and you should either convert it into a key or accept that its protection value is a delay rather than a boundary.",
  failureMode: "An agent's guardrail is a set of undisclosed regex patterns for dangerous instructions. The list leaks in a stack trace surfaced in an error message. There is no rotation procedure because a pattern list is not a credential, so the fix is to write new patterns and hope, which is the same position as before with less time.",
  experiment: "Take one security control your team owns and write the paragraph you would publish about it in customer documentation. Where you hit something you cannot write down, that is a secrecy dependency. Note-shaped, but the output is checkable: a list of the specific items you would not publish, and for each one whether it can be rotated.",
  reflection: "Of the items you could not publish, how many are genuine keys and how many are just mechanism you would rather not explain?",

  },
  deepDive: "Take one of my guardrails and tell me exactly what an attacker gains from reading its implementation, so I can see whether its protection is a boundary or a delay."

{
  id: "principles-kerckhoffs-prompt-not-key",
  track: "principles", level: "classical",
  title: "Kerckhoffs says your system prompt is not a key",
  source: "Auguste Kerckhoffs, La cryptographie militaire, Journal des sciences militaires, 1883",

  why: "The value of two conditions is the product of two probabilities, and that multiplication is only valid when the events are independent. Where the two share a cause, you have paid the full cost of the control for a fraction of the protection, and you have bought a story that makes the residual risk harder to see rather than easier.\n\nShared causes are usually mundane rather than exotic: both approvers authenticate with the same identity provider, both signing keys sit in the same HSM partition, both reviewers read the same summary generated by the tool being reviewed, or both approvals are granted by the same person holding two roles because the on-call roster was thin that week. The question to ask is not are there two approvals, it is name the single event that produces both.",

{
  id: "principles-least-privilege-unit",
  track: "principles", level: "classical",
  title: "Least privilege needs a unit of privilege you can actually name",
  source: "Saltzer and Schroeder, The Protection of Information in Computer Systems, 1975",
  idea: "The principle is trivial to state and hard to apply because most systems have no granularity below the whole identity, so the first piece of work is inventing the unit.",
  why: "Least privilege is a comparative: less than what, measured in what. If your system's smallest expressible grant is a service account with a role attached, then every reduction you make is a reduction between coarse buckets and the phrase means very little. The engineering work is not tightening the policy, it is creating a unit fine enough for the policy to say something, whether that is a per-run credential, a scoped token, a capability handle or a per-tool subject.\n\nAgent runtimes make the unit question unavoidable, because the natural granularity is neither the service nor the user. It is the run: this plan, for this user, over this set of assets, for this many minutes. A runtime that can mint authority at run granularity can express least privilege; one that shares a single warehouse credential across all runs cannot, regardless of how carefully the policy document is worded.",

  experiment: "Take one tool your runtime exposes and write two columns: what this call needs, and what the credential it uses can actually do. Express both in units your IAM or connector layer can express today. The gap between the columns is your over-grant, and if you cannot write the left column in the same units as the right, you have found the missing unit.",
  reflection: "What is the smallest unit of authority your runtime can mint today, and what would it take to make that unit the run rather than the tenant?",

    a: "Because it is a comparative that needs a unit, and most systems cannot express anything finer than a whole identity with a role. Reductions between coarse buckets barely say anything.\n\nFor an agent runtime the useful unit is the run: this plan, this user, these assets, this time window. Without run-scoped authority, every run inherits the union of every use case."

  deepDive: "Help me design a run-scoped credential for one tool in my runtime, including how it is minted, bounded and revoked."

{
  id: "principles-least-common-mechanism",
  track: "principles", level: "classical",
  title: "Least common mechanism says every shared resource is a channel",

  idea: "Anything two principals both depend on becomes a path between them, whether or not you designed it as one.",
  why: "Sharing creates coupling in both directions. One direction is influence: if tenant A can change the state of something tenant B reads, A can write to B. The other is observation: if A can measure the resource, A can read what B did to it, through timing, eviction, error rates, quota exhaustion or sequence numbers. Neither direction requires a bug, only a shared thing.\n\nThis is the principle that makes multi-tenancy expensive and it is the one most often traded away for cost, usually correctly and usually without writing down what was traded. The discipline is not to eliminate sharing, it is to enumerate the shared mechanisms and decide for each one whether the channel it creates is acceptable, so that the decision exists somewhere other than in the head of whoever chose the cache key format.",

{

  title: "The access matrix is the one model of authority worth memorising",

  why: "The matrix is not an implementation. Nobody materialises it, because it is sparse and enormous. Its value is that it is the ground truth every real design approximates, so you can ask of any system: which slice of the matrix does this actually store, and what queries can it therefore answer cheaply?\n\nOnce you hold the matrix in your head, most authority arguments collapse into bookkeeping. A permissions table on the object is a column. A token in a request is a row fragment. A role is a factored intermediate. A network policy is a matrix over hosts. The interesting question is never whether a design is 'secure', it is which cells the design can enumerate, which cells it can only test one at a time, and which cells nobody can name at all.",

{
  id: "authority-acl-vs-capability",

  idea: "An access control list is the matrix stored by column and a capability set is the matrix stored by row, and that single storage decision determines which security questions are one lookup and which are a full scan.",
  why: "Store by column and each object carries the list of subjects permitted to touch it. Per-object audit is trivial: read the list. Per-subject reasoning is a scan of every object in the system, which is why nobody can tell you what a service account can actually reach. Store by row and each subject holds a set of references it can exercise. Now the subject's total authority is enumerable by construction, and the per-object question becomes the expensive one.\n\nThe second consequence matters more. Column storage requires that a request name its target, and the system then decides using the requester's identity. That naming step is the seam where the confused deputy lives. Row storage passes the reference itself, so the request cannot name something the caller does not already hold. The tradeoff is not about strength - both can express the same matrix - it is about which mistakes each layout makes easy to write and which it makes impossible to express.",

{

  track: "authority", level: "classical",
  title: "Ambient authority is why code does things nobody asked it to",

  idea: "Authority is ambient when a subject can exercise it merely by naming a target rather than by holding a reference, and ambient authority is the precondition for almost every confused-deputy bug ever written.",
  why: "In an ambient system, a request is just a string: a path, a URL, a table name, an object id. The runtime resolves that string against the caller's identity and applies whatever the identity is permitted to do. The code that constructed the string and the authority that executes it are completely decoupled. Nothing in the call site records the intent to touch that particular object, so nothing can check it.\n\nThat decoupling is what makes injection profitable. If a piece of untrusted text can influence the string, it inherits the caller's full identity for free. This is not a bug in the caller's logic, it is the system working as designed: `open('/etc/shadow')` and `open('./scratch')` are the same operation with different bytes. Object capability discipline removes the seam by removing the string. You cannot ask for what you were not handed.",
  failureMode: "Your agent runtime authenticates once to a tenant's warehouse and then passes model-generated table names into the query path. A customer-authored column description says to summarise the payroll table. The model produces the name, the runtime resolves it under the tenant credential, and every access check passes because the identity genuinely is allowed to read payroll.",

{

  track: "authority", level: "classical",

  },

{
  id: "authority-designation-carries-authority",
  track: "authority", level: "classical",
  title: "Designation and authority must travel in the same message",
  source: "Norm Hardy, The Confused Deputy, ACM SIGOPS Operating Systems Review 22(4), 1988",
  cheat: "Do not harden a name-taking tool with another blocklist; price the version whose argument is a handle minted upstream.",
  idea: "The fix for the confused deputy is not more validation of the name, it is passing a reference that already carries the permission, so there is no name left for anyone to forge.",

{

{

{

{

{

{

  track: "confinement", level: "classical",
  title: "Confinement is the problem of a program that must not leak",

  recall: {

    a: "Storage the program writes, legitimate channels such as the returned result and the billing or metering data, and covert channels arising from observable shared state like timing and load.\n\nThe forgotten one is almost always legitimate channels. Storage gets locked down because it is visible in review, and covert channels get dismissed as exotic, while the response body and the log line carry arbitrary attacker-chosen content by design."

  why: "Denning's model is a set of security classes, a partial order saying which class may flow to which, and a join operator giving the class of any combination of two values. The lattice requirement is not decoration. It guarantees that any set of inputs has a unique least upper bound, so a computation over many inputs has one well-defined output label rather than an ambiguous set of candidates.\n\nThat is the difference between a policy you can check by hand on a whiteboard and one a compiler or an interpreter can check on every operation. Concatenating tenant-public text with tenant-confidential text yields confidential, not a debate. The whole apparatus of taint tracking, label propagation and information flow type systems is downstream of this one algebraic move.",
  failureMode: "Labels defined as an unordered tag set with no join. Two tainted values get combined and the code picks the first tag, or the last one, or drops both. The result is a value that is confidential in fact and public by label, and the mislabelling propagates silently from there.",
  experiment: "Write your runtime's actual security classes on paper and draw the arrows: which may flow to which. Then check the two lattice properties on your drawing - is there a top, and does every pair have a unique least upper bound. If a pair does not, you have found the case your propagation code is currently guessing.",
  reflection: "Where does your drawing have two incomparable classes that code treats as interchangeable?",
  recall: {
    q: "What does the lattice requirement buy you that a plain list of security labels does not?",
    a: "A unique least upper bound for every set of labels, so the output of a computation over multiple inputs has one defined label rather than several candidates.\n\nWithout it, combination is ambiguous and every implementation invents its own tie-break, which is where under-labelling gets in."
  },
  deepDive: "Take the data classes my agent runtime handles and tell me whether they form a lattice or whether I have incomparable pairs my code is silently resolving."
},
{
  id: "confinement-static-certification",
  track: "confinement", level: "classical",
  title: "Static certification checks flows before the program runs",
  source: "Denning and Denning, Certification of Programs for Secure Information Flow, Communications of the ACM 20(7), 1977",
  idea: "Flow policy can be verified at compile time across both explicit assignments and implicit control-dependent flows, and it is the implicit ones that hand-written checks miss.",
  why: "An explicit flow is an assignment: low gets high, obviously illegal. An implicit flow is a branch on a high value that changes what a low observer sees, even though the high value is never assigned anywhere. Branch on a secret and write different public values in each arm and you have moved the secret without ever copying it. The Dennings' certification mechanism handles this by attaching a label to the program counter itself: inside a branch on a value of class C, every write must be to a class at or above C.\n\nThis is the check no reviewer performs reliably by eye, because the illegal flow has no line of code where the two values touch. It is spread across the shape of the control graph.",
  failureMode: "A guard that refuses to include a confidential field in a response, but chooses between two response templates based on whether the field is empty. No confidential byte crosses the boundary and the attacker learns the answer anyway, one bit per request.",
  experiment: "Find one place in your codebase where a branch condition reads sensitive state and both arms write to something a less-privileged caller observes: a status code, a log level, a retry, a cache hit. One example is enough. Write down how many bits per request it carries.",
  reflection: "Does your code review checklist contain anything that would have caught that, or does it only look at assignments?",
  recall: {
    q: "What is an implicit flow, and why does labelling variables alone fail to catch it?",
    a: "An implicit flow is leakage through control dependence: a branch taken on a high value changes what a low observer sees, without the high value ever being assigned to a low variable.\n\nVariable labels only constrain assignments. Catching implicit flows requires a label on the program counter, so that everything written inside a high branch is itself constrained to high."
  },
  deepDive: "Look for implicit flows in this handler: places where a branch on sensitive state changes something an unprivileged caller can observe."
},
{
  id: "confinement-noninterference",
  track: "confinement", level: "classical",
  title: "Non-interference defines leakage as observable difference",
  source: "Goguen and Meseguer, Security Policies and Security Models, IEEE Symposium on Security and Privacy, 1982",
  idea: "A system is non-interfering if varying the high inputs makes no difference to what a low observer sees, which lets you state that a leak occurred without having to name the channel it went through.",
  why: "Every earlier definition of leakage was channel-shaped: this file, that pipe, this timing signal. Goguen and Meseguer made it extensional. Run the system twice with everything low held fixed and the high inputs changed. If the low-visible traces differ, information flowed, and it does not matter through what.\n\nThat inversion is what makes testing possible. You do not need to have imagined the attacker's channel in advance to detect that one exists, and you can no longer defend a design by saying the enumerated channels are all closed. It is also why the definition is too strong to hold literally: real systems leak something, and the practical work is quantifying the difference rather than eliminating it.",
  failureMode: "The security argument is a list of closed channels. Someone finds a new one, the list grows by an entry, and the same argument is presented again next quarter. Nothing in the method could ever have found the channel, because the method only checks the channels already on the list.",
  experiment: "Pick one agent endpoint. Construct two inputs identical in everything unprivileged and differing only in one privileged field, send both, and diff everything you can observe as an unprivileged caller: body, status, headers, timing, token counts, log lines. If the diff is non-empty you have a flow. Write down how wide it is.",
  reflection: "What did the diff contain that you would not have listed as a channel beforehand?",
  recall: {
    q: "State non-interference, and say what it gives you that an enumeration of channels does not.",
    a: "Varying high inputs must produce no change in what a low observer sees. It defines leakage by observable difference rather than by mechanism.\n\nThat means you can detect a leak you never anticipated, and a defence cannot be argued from a list of closed channels alone."
  },
  deepDive: "Design a two-run differential test for one of my agent endpoints that would detect a flow from privileged input to unprivileged output."
},
{
  id: "confinement-covert-versus-side",
  track: "confinement", level: "classical",
  title: "A covert channel is built, a side channel is found",
  source: "John Wray, An Analysis of Covert Timing Channels, IEEE Symposium on Security and Privacy, 1991; Paul Kocher, Timing Attacks on Implementations of Diffie-Hellman, RSA, DSS, and Other Systems, CRYPTO 1996",
  idea: "A covert channel needs a cooperating sender inside the boundary deliberately modulating a shared resource, a side channel needs only a victim behaving normally, and defending one does not defend the other.",
  why: "Wray's analysis shows how slippery the internal taxonomy is: whether a given channel counts as storage or timing depends on where you place the observer's clock, so the storage-versus-timing line is a matter of viewpoint rather than physics. What survives as a real distinction is who is at the sending end. Kocher's timing attacks extract keys from an implementation that has no sender at all, only a data-dependent execution time.\n\nThe practical consequence is that the two demand different defences. Covert channels are addressed by not running attacker-controlled code inside the boundary, or by making the shared resource unmodulable. Side channels are addressed by making the victim's own behaviour independent of the secret. Constant-time comparison does nothing about a malicious insider process, and process isolation does nothing about a leaky comparison.",
  failureMode: "A threat model that says no untrusted code runs in our process, therefore no covert channels, therefore we are done. Meanwhile the retrieval layer's cache hit and miss latencies differ by an order of magnitude and tell a caller which other tenant's documents are warm.",
  experiment: "For one shared resource in your runtime - a cache, a connection pool, a rate limiter - answer two questions in writing. Could attacker-influenced code inside the boundary modulate it deliberately? And does its normal behaviour vary with data the caller should not know? The two answers have different owners.",
  reflection: "Which of your shared resources answered yes to the second question, and would anyone have looked for it?",
  recall: {
    q: "What is the distinction between a covert channel and a side channel, and why does it change the defence?",
    a: "A covert channel requires a cooperating sender inside the boundary that deliberately modulates a shared resource. A side channel requires no sender, only a victim whose observable behaviour varies with a secret.\n\nCovert channels are countered by keeping hostile code out and making resources unmodulable. Side channels are countered by making the victim's own timing and resource use independent of the secret. Neither defence covers the other case."
  },
  deepDive: "Take the caching layer in my agent runtime and separate its covert channel exposure from its side channel exposure."
},
{
  id: "confinement-channel-bandwidth",
  track: "confinement", level: "classical",
  title: "Channel bandwidth is the number that decides whether you care",
  source: "US Department of Defense, Trusted Computer System Evaluation Criteria (DoD 5200.28-STD), 1985",
  idea: "The Orange Book made covert channel analysis a quantitative exercise by asking for bits per second, which is the move that turns an unbounded worry into a risk decision someone can sign.",
  why: "The criteria required covert channel analysis at the higher assurance levels and, crucially, required the bandwidth to be estimated and documented rather than the channel merely noted. Its guidance on covert channels treats rates above roughly a hundred bits per second as high bandwidth and rates under about one bit per second as tolerable in most environments, with auditing expected for anything in between.\n\nWhatever you think of the specific figures, the reframing is the durable contribution. An enumerated channel with no rate attached generates either panic or dismissal, and both are guesses. A rate lets you multiply: bits per second times seconds of attacker access, against the size of the thing worth stealing. A one bit per second channel and a ten thousand row credential table is a very different conversation from the same channel and a single boolean.",
  failureMode: "A finding filed as potential information disclosure via response timing with no measurement. It sits at medium severity for two years because nobody can argue it up or down, and the one channel on the same page that actually carries kilobytes per second is filed identically.",
  experiment: "Take the widest channel you found in the non-interference experiment and measure it: how many distinct outcomes can an attacker distinguish per request, and how many requests per second will your rate limiter allow. Multiply. Write the bits per second on the ticket.",
  reflection: "Given that number and your rate limits, how long would extracting something that actually matters take, and is that longer than your detection window?",
  recall: {
    q: "What did quantifying covert channel bandwidth change about how the problem is managed?",
    a: "It converted an open-ended worry into an arithmetic risk decision. A rate can be multiplied by attacker access time and compared against the size of the asset.\n\nIt also creates a defensible acceptance threshold and makes rate limiting and noise injection measurable countermeasures rather than gestures."

  deepDive: "Help me estimate bits per second for this channel and turn it into a risk statement with my rate limits as an input."

{
  id: "confinement-language-based-flow",
  track: "confinement", level: "classical",
  title: "Language based information flow puts the policy in the type system",
  source: "Sabelfeld and Myers, Language-Based Information-Flow Security, IEEE Journal on Selected Areas in Communications 21(1), 2003",
  idea: "When labels are part of the type of a value, the compiler gives you an end-to-end confidentiality argument about the whole program instead of a per-call access decision.",
  why: "Access control answers whether this caller may perform this operation now. It says nothing about where the returned bytes go afterwards. Once a value has crossed a permitted access check it is unlabelled and free, which is exactly why access-controlled systems leak: every individual check passed. A flow-typed language keeps the label attached through assignment, arithmetic, structure construction and control dependence, so the property proved is about the program's whole behaviour rather than one gate in it.\n\nThe cost is real and worth stating plainly. You need labelled types everywhere, including libraries, and the checker rejects programs that are safe but not provably so. Sabelfeld and Myers' survey is the honest map of that trade-off, and the reason most teams end up with a partial dynamic version instead.",
  failureMode: "Every access check in the request path passes, and the confidential field still ends up in a debug log that ships to a third-party aggregator. No single call was unauthorised. The path as a whole was never examined because nothing in the system represents paths.",
  experiment: "Pick one confidential field and trace it by hand from the point it enters memory to every terminal it reaches. Do not reason about it, grep for it. Count the terminals. Compare against the one destination the access check was defending.",
  reflection: "How many of those terminals were added by someone who never saw the access check?",
  recall: {
    q: "Why does an access check give you a weaker property than a flow type?",
    a: "An access check constrains a single operation at a single moment. Once the value has been handed over it carries no restriction, so a chain of individually authorised operations can move data anywhere.\n\nA flow type keeps the label attached to the value through the whole computation, so the guarantee is about every path the data can take, not about one gate."
  },
  deepDive: "Trace one confidential field through this codebase and list every terminal it can reach, so I can compare that against what the access check assumes."

{
  id: "confinement-dynamic-taint",
  track: "confinement", level: "modern",
  title: "Dynamic taint tracking trades soundness for coverage",
  source: "Newsome and Song, Dynamic Taint Analysis for Automatic Detection, Analysis, and Signature Generation of Exploits on Commodity Software, NDSS 2005",
  idea: "Runtime tainting finds real flows through code you did not write and cannot analyse, and it loses them at implicit flows, serialisation boundaries and any hop outside the instrumented runtime.",
  why: "Newsome and Song's contribution was showing that marking untrusted bytes at the input and propagating the mark through execution catches exploits in binaries with no source, no annotations and no cooperation from the author. That is the trade: you give up the completeness a static analysis offers and you get coverage of the ninety percent of your process that you did not write.\n\nThe losses are specific and predictable, which is what makes the technique usable if you know them. Data-dependent control flow moves information without moving a tainted byte. Serialising to JSON and back through a queue reconstitutes the value with a clean label unless you carry the label in the envelope. Anything that leaves the instrumented runtime, into a database, a cache, another service, comes back untainted. A taint system that does not document its own blind spots will be trusted as though it has none.",
  failureMode: "Tenant text is tainted at ingest and the taint survives right up to the point where the value is written to Redis and read back by the next hop. The second hop sees a clean string and passes it to a tool that takes a resource identifier.",
  experiment: "If you have taint or provenance tracking, take one tainted value and push it through every boundary in one request path: a queue, a cache write and read, a database round trip, a subprocess. Log the label at each step and find the first place it disappears. If you have no tracking, write the list of boundaries instead - that list is the design constraint for building one.",
  reflection: "Was the label lost at a boundary you own, or at one you would have to negotiate with another team to change?",
  recall: {
    q: "Name the three places dynamic taint tracking predictably loses a label.",
    a: "Implicit flows, where a branch on tainted data changes untainted output without copying a tainted byte. Serialisation, where a value written out and read back returns with a clean label unless the envelope carries it. And any hop outside the instrumented runtime, such as a database, cache or separate service.\n\nThe technique is still worth having. It is only dangerous when its blind spots are undocumented, because then coverage gaps read as clean results."
  },
  deepDive: "Map the boundaries in my request path where a taint label would be lost, and tell me which ones I can carry a label across."
},
{
  id: "confinement-declassification",
  track: "confinement", level: "classical",
  title: "Declassification is where the real policy lives",
  source: "Sabelfeld and Sands, Dimensions and Principles of Declassification, IEEE Computer Security Foundations Workshop, 2005",
  cheat: "Grep your redaction and toPublic helpers; the number of call sites is the real size of your confidentiality trusted base.",
  idea: "Every useful system deliberately releases some labelled data, so the policy is not the labels, it is the four questions of what is released, who may release it, where in the system, and when.",
  why: "Non-interference forbids all flow from high to low, and no shipping system satisfies it. Password checking releases one bit about a secret. Aggregate statistics release a function of confidential rows. An agent that summarises a customer's private records for that customer releases the lot, correctly. The moment you admit a declassification primitive, the security property is entirely determined by the constraints on that primitive, and Sabelfeld and Sands' four dimensions are the axes those constraints run along.\n\nMost systems fail on who and where. What gets released is usually documented. The fact that any component holding the label can perform the release, at any point, is usually not, which means an attacker who reaches any of them has reached the declassifier. Concentrating release in a small number of named points is the whole discipline.",
  failureMode: "A redaction helper importable from anywhere in the codebase. Twenty call sites, four of them in retry paths added later, one inside a code path reachable from tenant-authored text. The policy document describes what may be released and is silent on the fact that anything may release it.",
  experiment: "Grep for your declassification primitives: the redaction helpers, the toPublic and toResponse converters, the log sanitisers, the anything-to-string functions on sensitive types. Count the call sites. That number is the size of your actual trusted computing base for confidentiality.",
  reflection: "Of those call sites, how many were added by someone who knew they were writing a declassifier?",
  recall: {
    q: "What are the four dimensions of declassification, and which two do real systems usually get wrong?",
    a: "What is released, who may release it, where in the system release happens, and when it may happen.\n\nWhat is normally documented. Who and where are normally not, so any component holding the data can declassify it from anywhere, which makes every one of those call sites part of the trusted base."
  },
  deepDive: "Find every declassification point in this codebase, the places a labelled value is converted to something releasable, and tell me how many are reachable from untrusted input."

{
  id: "confinement-flume-os-abstractions",
  track: "confinement", level: "modern",
  title: "Flume shows information flow control working on ordinary OS abstractions",
  source: "Krohn et al., Information Flow Control for Standard OS Abstractions, SOSP 2007",
  idea: "Labels can attach to processes, pipes and files rather than to program variables, which is the version of information flow control an infrastructure team can actually operate.",
  why: "Language-level flow control demands a labelled type system and a rewrite. Flume put the labels one level down, on processes and their communication endpoints, and enforced them at the system call boundary. An unmodified program runs inside a labelled process, and the kernel monitor refuses any send whose destination label does not dominate the sender's. The application does not have to be trusted or even aware.\n\nThe part worth carrying over is the shape, not the implementation. A small trusted monitor, coarse labels on units of execution you already have, enforcement at a boundary every message must cross. For an agent runtime that maps directly: the labelled unit is the tool invocation or the sub-agent, the monitor is the orchestrator, and the enforcement point is the call it makes on the tool's behalf. You get a weaker guarantee than flow-typed code and you get it without rewriting anything.",
  failureMode: "Flow policy defined as a coding standard: handlers are expected to check labels before egress. It holds for a year, then a new service is written by a team that never read the standard, and there is no monitor to notice because enforcement lived in the convention rather than at a boundary.",
  experiment: "Identify the single chokepoint every outbound tool call in your runtime passes through. If there is exactly one, you have somewhere to put a monitor - name the file. If there is more than one, list them, because that list is the work before any flow policy can be enforced rather than merely written down.",
  reflection: "Is your enforcement point a place in the code or a paragraph in a document?",
  recall: {
    q: "What does moving information flow control from program variables to OS abstractions cost you, and what does it buy?",
    a: "It costs precision: labels sit on whole processes and channels rather than individual values, so it over-approximates and cannot see inside a process.\n\nIt buys enforcement over unmodified, untrusted programs, with a small trusted monitor at a boundary every message must cross. That is deployable by an infrastructure team without rewriting the applications."
  },
  deepDive: "Sketch a Flume-style monitor for my agent runtime: what the labelled unit is, where the enforcement point sits, and what the labels would be."
