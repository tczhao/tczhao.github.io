{
  id: "tracker-single-night-error",
  track: "sleep",
  level: "core",
  title: "Your watch's average sleep error is small and its single-night error is not",
  source: "Schyvens et al., Sleep Advances 6(2), 2025, zpaf021",
  evidence: "Single-night in-laboratory validation of six commercial wrist wearables against level-1 polysomnography, n = 62 adults (52 male, 10 female, mean age 46.0 +/- 12.6 years). Each participant wore only two to four of the six devices, so per-device n ran from 20 to 41 (Apple Watch Series 8 n = 20, Garmin Vivosmart 4 n = 25, Fitbit Sense n = 37, Fitbit Charge 5 n = 39, Whoop 4.0 n = 40, Withings Scanwatch n = 41). Sensitivity for detecting sleep ran 91.68% to 96.27%; specificity for detecting wake ran 29.39% to 52.15% (Garmin Vivosmart 4 lowest at 29.39%, Apple Watch Series 8 highest at 52.15%). All six devices overestimated total sleep time, by 6.31 to 39.87 minutes; four of the six reached significance. The Apple Watch Series 8 had the narrowest limits of agreement of the six at 115.9 minutes wide - bias +19.60 minutes, 95% limits of agreement -38.35 to +77.55 minutes - against 160 to 262 minutes for the other five.",
  interval: { lo: -38.35, hi: 77.55, measure: "minutes, 95% limits of agreement for Apple Watch Series 8 total sleep time against polysomnography, n = 20" },
  replication: "single",
  gateIntro: "You wear your usual wrist tracker into a sleep lab and get wired to polysomnography at the same time. Overnight, both systems score the same night. Before you read the number: on that one night, how far apart could the two totals be, in minutes, in each direction? Write down your range.",
  idea: "Wrist wearables are very good at recognising sleep and very bad at recognising wake. Across six current devices scored against polysomnography, sensitivity for sleep sat between roughly 92% and 96% while specificity for wake sat between roughly 29% and 52%, and all six overestimated total sleep time. That asymmetry means quiet wakefulness gets scored as sleep, and on a single night your total sleep time can be an hour out in either direction.",
  why: "The classifier is solving an easy problem badly. Inside a sleep opportunity window, most epochs really are sleep. A model that leans towards calling everything sleep therefore scores a high sensitivity almost for free, and the metric that would catch it out - specificity, the ability to correctly call a wake epoch wake - is the one that collapses. Between roughly 48% and 71% of wake epochs get labelled sleep across these six devices. The sensor stack makes this worse rather than better: an accelerometer sees a still body, and photoplethysmography sees a resting heart rate, and neither of those distinguishes lying awake in the dark from stage 2 sleep.\n\nEvery derived number inherits the error and some amplify it. Total sleep time is a count of sleep epochs, so misclassified wake inflates it directly - which is why all six devices here overestimated it. Sleep efficiency is total sleep time over time in bed, so it inflates in the same direction. Wake after sleep onset is the number that should expose the problem and it is precisely the number that gets suppressed. You cannot cross-check the device against itself, because all four headline figures are functions of the same faulty epoch labels.\n\nThe distinction that matters for you as an engineer is bias against limits of agreement. The device with the narrowest limits of agreement in this study had a mean bias of about twenty minutes, which reads as tolerable. But its 95% limits of agreement ran from thirty-eight minutes under to seventy-eight minutes over - a window 116 minutes wide, and that was the tightest of the six. The other five sat between 160 and 262 minutes wide. Bias is what survives averaging across many nights and many people. Limits of agreement are what you actually face tonight. Reporting the first and acting on the second is the same category error as quoting a p50 latency and paging on a p50 SLO.\n\nTwo caveats on how thin the ground is. That narrowest window rests on the twenty participants who happened to wear that device, not on the study's 62 - each person wore only two to four of the six, so every per-device figure here comes from a subsample. And the error is not evenly distributed across people. Someone who sleeps solidly has few wake epochs to misclassify, so the device looks accurate. Someone with fragmented sleep - a shift worker, a new parent, an athlete on the night before a race - has many, and every one of them is a chance for the device to add sleep that did not happen. The measurement degrades exactly in the population that most wants the measurement.",
  failureMode: "You wake up, see 5 h 42 m, and cut your long run to an easy 40 minutes. The lab-grade truth for that night might have been 5 h 04 m or 6 h 20 m, and the swing between those is larger than the difference between a good week and a bad one. Over a season you end up training a random number generator: the sessions you drop are not the sessions you were actually under-recovered for, and you develop a confident-feeling story about your sleep responsiveness built entirely on classifier noise.",
  experiment: "Export the last sixty nights of total sleep time from your device and compute the standard deviation. Then set that number next to the roughly 116-minute width of the limits-of-agreement window above - the narrowest of the six devices tested. If your night-to-night spread is smaller than the device's own single-night measurement error against polysomnography, you have no basis for treating any individual night as signal. Then do it properly for one week: note the clock time whenever you are actually awake in the night, and compare your log against what the device reported for wake after sleep onset.",
  reflection: "Which training or work decision have you actually changed on the basis of a single night's sleep score, and would you have made the same call if that number had arrived with a plus-or-minus one hour attached?",
  recall: {
    q: "A wrist tracker has about 94% sensitivity for sleep and about 40% specificity for wake. What does that combination do to your reported total sleep time, sleep efficiency and wake after sleep onset, and why does the group-level bias still look acceptable?",
    a: "High sensitivity with low specificity means the device correctly labels almost all real sleep as sleep, but labels roughly half to seven-tenths of real wake as sleep too. Total sleep time is inflated because misclassified wake epochs get added to the sleep count - every one of the six devices in this study overestimated it. Sleep efficiency is inflated for the same reason, since it is total sleep time over time in bed. Wake after sleep onset is deflated, because the wake it should be counting has been reassigned. All three numbers move together and none of them can be used to audit the others, since they are all functions of the same epoch labels.\n\nGroup-level bias looks acceptable because averaging across nights and people cancels a lot of the variance and leaves only the systematic component, which was between 6 and 40 minutes across these devices. That is the mean bias. What you face on any given night is the limits of agreement, which even for the tightest device in this study ran from thirty-eight minutes under to seventy-eight minutes over, on a subsample of twenty people. Reporting the bias and then acting on a single night is treating a population-level summary as an individual-level guarantee."
  },
  deepDive: "Show me the arithmetic of how sensitivity and specificity translate into total sleep time error when the base rate of sleep inside my sleep opportunity window is around 90%, and work it through with my own device's reported nightly numbers."
},
{
  id: "pooled-tracker-bias-is-not-staging",
  track: "sleep",
  level: "applied",
  title: "The pooled tracker-versus-lab difference covers four parameters and none of them is a sleep stage",
  source: "Lee et al., Journal of Clinical Sleep Medicine 21(3), 2025, 573-582",
  evidence: "Meta-analysis of 24 studies, 798 participants, comparing consumer wrist-worn sleep tracking devices with polysomnography. Four continuous parameters pooled: total sleep time, mean difference -16.854 minutes (95% CI -26.332 to -7.375); sleep efficiency, -4.691% (95% CI -7.079 to -2.302); sleep onset latency, 2.574 minutes (95% CI 0.606 to 4.542); wake after sleep onset, 13.255 minutes (95% CI 4.522 to 21.988). No publication bias was detected for total sleep time or sleep efficiency. Sleep staging accuracy is not among the pooled outcomes and the abstract does not define the sign convention for the mean differences.",
  interval: { lo: -26.332, hi: -7.375, measure: "minutes, pooled mean difference in total sleep time between consumer wrist devices and polysomnography" },
  replication: "replicated",
  gateIntro: "A meta-analysis pools two dozen validations of consumer wrist trackers against polysomnography. Before you look at it: how large do you expect the pooled disagreement on total sleep time to be, and how much do you expect that paper to tell you about how accurately your watch scores REM and deep sleep?",
  cheat: "Read tracker sleep totals as a monthly trend, about seventeen minutes off pooled, and ignore its REM and deep minutes: staging was never pooled.",
  idea: "The pooled disagreement on total sleep time is about seventeen minutes in magnitude, with a confidence interval that excludes zero. The paper covers four continuous parameters - total sleep time, sleep efficiency, sleep onset latency and wake after sleep onset - and stage accuracy is not one of them. Any claim about REM or deep sleep accuracy attributed to this meta-analysis is a number that is not in it.",
  why: "Seventeen minutes sounds like a rounding error and in one sense it is. Pooled across twenty-four studies and 798 people, the systematic component of the disagreement is small relative to how much your own sleep varies night to night. That is genuinely useful: for cohort-level work, for comparing a group before and after an intervention, or for tracking a trend over months, a bias of this size does not sink the analysis. It is what a mean difference is for.\n\nThe trap is what gets read into it. Sleep staging - the hypnogram, the REM and deep and light minutes your app puts on a coloured chart - is a categorical classification problem, judged by per-stage sensitivity, specificity and Cohen's kappa. It is a different question with different metrics and it was not pooled here. Those figures live in the device-level validation literature, where the picture is much worse: a six-device in-lab validation found wake specificity between about 29% and 52%. Citing a mean-difference meta-analysis as evidence about staging is the sleep-science equivalent of quoting a regression's R-squared to defend a classifier's precision.\n\nThere is a second thing to notice, and it is a lesson about reading papers rather than about sleep. The abstract reports signed mean differences but does not state whether the sign is device minus polysomnography or the reverse. All four signs are internally consistent under either reading. That means you cannot take the direction of the effect from the abstract alone, and anyone who tells you confidently that this paper shows devices overestimate or underestimate sleep is reading in a convention that is not stated there. Take the magnitude, take the interval, and get the direction from the device-level studies that state it - which, in the six-device validation above, is unambiguously overestimation.\n\nBoth things can be true and both matter. The systematic bias is small enough to ignore at the group level. The per-night error is large enough that nothing you read off the watch this morning is actionable. A parameter can be well calibrated on average and useless as an individual measurement, and confusing those two states is the most common mistake made with this class of device.",
  failureMode: "You cite this meta-analysis in a work-adjacent context - a health platform spec, a wellbeing dashboard, an internal argument about which wearable to standardise on - to justify a claim about staging accuracy. Someone checks. The number is not in the paper, the paper explicitly pools four continuous parameters, and now every other figure in your document is suspect. In personal terms the cost is smaller but the same shape: you optimise your evening around getting your deep sleep minutes up, on the basis of an output whose accuracy nobody has told you.",
  experiment: "Open your own device manufacturer's published validation white paper. Check which of the four continuous parameters they report, whether they report epoch-level specificity for wake, and whether they report per-stage kappa. Then check what sample size the staging figures are based on and whether the population resembles you. Most of the time the staging section either does not exist or is based on a few dozen laboratory nights.",
  reflection: "When you last quoted a study to support a decision, did you check that the specific number you needed was actually one of the study's outcomes, or did you check only that the study was about the right topic?",
  recall: {
    q: "Why can a sleep tracker meta-analysis report a pooled total sleep time difference of under twenty minutes while individual-night accuracy remains poor, and why does that meta-analysis say nothing about stage accuracy?",
    a: "A pooled mean difference estimates the systematic component of the error after averaging across studies and participants. Random error largely cancels in that average, so a small pooled bias is compatible with very large errors on any individual night. It is a statement about the centre of the error distribution, not its width, and the width is what determines whether the number is usable tonight.\n\nStage accuracy is a categorical classification problem measured by per-stage sensitivity, specificity and kappa, not by mean differences in minutes. A meta-analysis that pools total sleep time, sleep efficiency, sleep onset latency and wake after sleep onset has not evaluated staging at all. Those figures come from device-level validation studies, and when you go and read them the picture is considerably less flattering than the mean differences suggest."
  },
  deepDive: "Find the device-level validation studies for the specific wearable I own and tell me what they report for wake specificity and per-stage agreement, with sample sizes."
},
{
  id: "acute-sleep-loss-performance-cost",
  track: "sleep",
  level: "core",
  title: "Acute sleep loss costs roughly eight percent of physical performance and mostly in the afternoon",
  source: "Craven et al., Sports Medicine 52(11), 2022, 2669-2690",
  evidence: "Systematic review and meta-analysis of 69 publications, 959 participants, 89% male. Pooled mean change in exercise performance following acute sleep loss: -7.56% (95% CI -11.9 to -3.13, p = 0.001), I2 = 98.1%. Negative effects appeared across all exercise categories tested and were most pronounced for tasks performed in the afternoon, while morning tasks were largely unaffected. The pattern of sleep loss was an important moderator: consistent negative effects were observed only with deprivation and late-restriction protocols, not with early-restriction protocols, and performance declined by roughly 0.4% per additional hour awake before exercise.",
  interval: { lo: -11.9, hi: -3.13, measure: "% change in exercise performance following acute sleep loss" },
  replication: "replicated",
  gateIntro: "You get four hours instead of eight. That can happen two ways - you go to bed at your usual time and the alarm goes at 2am, or you stay up until 3am and get up as normal. Then you have a session or a race the next day. Before you read the pooled figure: what percentage of your physical performance do you expect to lose, does it matter which of those two nights you had, and does it matter whether you go at 7am or 4pm?",
  cheat: "After an early wake, move hard sessions to the morning: performance fell about 7.6%, 3% to 12%, and another 0.4% per hour awake.",
  idea: "Pooled across 69 studies and 959 participants, acute sleep loss reduced exercise performance by about 7.6%, with a confidence interval running from roughly 3% to 12%. The effect concentrated in afternoon tasks and scaled with time awake, at roughly 0.4% per hour before exercise. Consistent impairment showed up under total deprivation and under late restriction - sleep cut from the end of the night - but not under early restriction, where the night is shortened by a later bedtime.",
  why: "The time-of-day pattern is the most useful thing in this paper and it is the part people skip. If you are sleep deprived and you test at 7am, you are close to the point where you woke up and you have not yet accumulated much time-on-task. By late afternoon you have been awake far longer than you would have been on a normal day, and the homeostatic sleep pressure that has built up since waking is stacked on top of the deficit you started with. The paper puts a number on that: about 0.4% of performance per hour awake before exercise. The deficit does not sit still; it compounds through the day, and the same mechanism explains why late restriction - waking early, then being awake all day - hurt consistently while a later bedtime did not.\n\nThe magnitude is worth sitting with. Eight percent is enormous in racing terms. On a 40-minute 10k that is more than three minutes. That is not a taper-week refinement, it is the difference between a personal best and a bad day, and it comes from one night. Compare it against the effect sizes you see for supplements later in this corpus, where the honest numbers are one to three percent.\n\nThe interval is wide and the heterogeneity statistic tells you why that matters. I2 was 98.1%. Almost all of the variation between the pooled studies is genuine difference between them rather than sampling noise, which means the pooled figure is a summary across a family of different phenomena rather than an estimate of one quantity. Add that 89% of participants were male, that the protocols mixed total deprivation with partial restriction, and that most of it happened in laboratories, and 7.6% is a rough central tendency, not your personal expected loss.\n\nNote what this study does and does not tell you. It is about acute sleep loss - one or a few bad nights - not chronic mild restriction, which is the condition most working runners are actually in. Extrapolating a one-night effect to a habitual seven-hours-instead-of-eight pattern is an extra step the data do not support.",
  failureMode: "You race on four hours of sleep and read the result as a fitness verdict. You conclude your build was wrong, tear up a training plan that was working, and spend a block correcting a problem that was one night of sleep. The reverse costs just as much: you schedule the hardest session of the week for late afternoon after a night on call, then interpret the poor numbers as a signal to add more volume.",
  experiment: "Look back through the last three months of your training log and find every session that followed a night you know was short. Note the time of day for each, and note whether the night was short because you went to bed late or because you got up early. Compare the afternoon sessions against the morning ones. You will probably not have enough data for anything conclusive, and that is the point - the useful move is to start recording it, and to schedule your quality sessions before lunch on the days after a bad night rather than trying to push through at 5pm.",
  reflection: "In the last month, how many of your key sessions were scheduled in the afternoon following a night of short sleep, and what did you attribute the bad ones to at the time?",
  recall: {
    q: "Acute sleep loss reduced exercise performance by about 7.6% on average. Why did the effect concentrate in the afternoon, and what does the width of the confidence interval tell you about applying that number to yourself?",
    a: "By afternoon you have been awake far longer than a normal day would have you, and the meta-analysis found performance declining by roughly 0.4% for each additional hour awake before exercise. Early morning testing catches you close to wake time, before that pressure has built, so morning performance after a short night looks close to normal. The same logic explains the pattern moderator: consistent impairment appeared with total deprivation and with late restriction, where the night is cut short by an early wake and the day that follows is long, and not with early restriction, where the night is shortened by a later bedtime.\n\nThe interval from about -12% to -3% is wide, and I2 was 98.1%. At that level almost all of the between-study variation is real heterogeneity rather than sampling error, which makes the pooled point estimate close to uninterpretable as a single quantity. So 7.6% is a central tendency across a family of scenarios - different protocols, different sports, 89% male, mostly laboratory - not a personal prediction. And it says nothing about chronic mild restriction, which is a different exposure entirely."
  },
  deepDive: "Find the studies within this meta-analysis that used endurance running or cycling time trials specifically, and tell me what the effect looked like in that subset."
},
{
  id: "short-sleep-mortality-is-not-a-doubling",
  track: "sleep",
  level: "core",
  title: "Short sleep raises mortality risk by about a tenth, not by a multiple",
  source: "Cappuccio et al., Sleep 33(5), 2010, 585-592",
  evidence: "Systematic review and meta-analysis of prospective cohort studies: 16 studies with 27 cohort samples, 1,382,999 participants, 112,566 deaths, follow-up 4 to 25 years. Short sleep duration: pooled relative risk for all-cause mortality 1.12 (95% CI 1.06 to 1.18, p < 0.01), heterogeneity P = 0.02, with no evidence of publication bias. Long sleep duration: pooled relative risk 1.30 (95% CI 1.22 to 1.38, p < 0.0001), heterogeneity P < 0.0001.",
  interval: { lo: 1.06, hi: 1.18, measure: "relative risk of all-cause mortality, short versus normal sleep duration" },
  replication: "overclaimed",
  gateIntro: "The popular sleep literature tells you that short sleep is catastrophic for your lifespan. Before you look at the pooled epidemiology: by what factor do you think all-cause mortality risk rises for habitual short sleepers, and what do you expect the number to be for long sleepers?",
  idea: "Pooled across sixteen studies and nearly 1.4 million people, habitual short sleep carried a 12% higher relative risk of death, with a confidence interval from 6% to 18%. Long sleep carried a larger risk, 30% higher. The relationship is U-shaped and the short-sleep arm is the smaller of the two effects - which is close to the opposite of how the claim is usually sold.",
  why: "Take the popular version first. Matthew Walker's Why We Sleep asserts that the shorter your sleep the shorter your lifespan, and that sleeping under six or seven hours a night more than doubles your risk of cancer. Alexey Guzey's essay documenting factual and citation problems in that book, first published November 2019 and revised since, catalogues those and other claims and the sourcing behind them. You do not need to adjudicate that dispute, because the underlying epidemiology is public and it does not support a doubling of anything.\n\nA relative risk of 1.12 on all-cause mortality is a real effect on a population of 1.38 million and a marginal one for an individual. Whether it is worth anything to you depends entirely on your baseline hazard, which for a fit forty-something in Australia is low. Twelve percent more of a small number is a small number. This is the same arithmetic as an alert that fires 12% more often on a service that was already almost never failing.\n\nThe long-sleep arm is where the honest reading gets uncomfortable for everyone. Sleeping long carries a relative risk of 1.30, substantially larger than short sleep, and nobody seriously believes that lying in bed for nine hours kills you. The obvious explanation is reverse causation and confounding: undiagnosed illness, depression and frailty all lengthen sleep and all raise mortality. But that explanation is available symmetrically. Shift work, chronic pain, sleep apnoea and stress shorten sleep and also raise mortality. Once you accept the reverse-causation account for the larger arm you cannot refuse it for the smaller one.\n\nAnd the heterogeneity flag applies to both arms, including the one this entry is built on: P = 0.02 for short sleep, P < 0.0001 for long. Different cohorts, different definitions of short and long, different adjustment sets, different populations. When the studies disagree that much, the pooled point estimate is a summary of a disagreement rather than a measurement of a quantity - which is a reason to hold the 1.12 loosely too, not only the 1.30.",
  failureMode: "You internalise a dramatic version of this literature and it makes your sleep worse. Anxiety about not hitting eight hours is itself a well-recognised route into insomnia, and the mechanism has a name in the clinical literature - orthosomnia, when the pursuit of a perfect sleep metric degrades the sleep. The second cost is credibility: repeat the doubles-your-cancer-risk line at work or to a training group, get asked for the source, and find the source does not say it.",
  experiment: "Pick one dramatic sleep claim you currently believe - the eight-hour requirement, the cancer doubling, the WHO epidemic declaration - and spend twenty minutes tracing it to a primary source with a sample size and an interval. Not a book, not a podcast, not a review that cites a review. If you cannot land on a paper with numbers, that belief is decoration.",
  reflection: "Which health claim are you currently acting on where you have never seen the effect size, only the direction?",
  recall: {
    q: "Short sleep carries a pooled relative risk of 1.12 for all-cause mortality and long sleep carries 1.30. Why does that pattern undermine the popular reading rather than support it?",
    a: "If the causal story were simply that less sleep kills you, the risk should rise monotonically as sleep shortens. Instead the curve is U-shaped, and the arm with the larger effect is the long-sleep arm. Almost nobody argues that spending nine hours in bed is directly harmful, so the standard explanation for the long-sleep arm is reverse causation and confounding - illness, depression and frailty lengthen sleep and independently raise mortality.\n\nOnce you have accepted that explanation for the larger arm you cannot decline it for the smaller one. Shift work, sleep apnoea, chronic pain and stress shorten sleep and independently raise mortality. So the short-sleep relative risk of 1.12, already modest in absolute terms for a low-baseline-hazard individual and pooled across cohorts that disagreed significantly with each other, is at least partly a marker of the conditions that shorten sleep rather than a measure of what short sleep does. That is a very long way from doubling anything."
  },
  deepDive: "Trace the primary sources behind the specific claim that sleeping under six hours doubles cancer risk, and tell me what those sources actually report with sample sizes and intervals."
},
{
  id: "chronic-poor-sleep-injury-thin-signal",
  track: "sleep",
  level: "applied",
  title: "Poor sleep raises adolescent injury odds, on an interval that nearly reaches 1.0",
  source: "Gao et al., Journal of Pediatric Orthopaedics, 2019 (PMID 30888337)",
  evidence: "Systematic review and random-effects meta-analysis. 907 articles screened, 7 met inclusion criteria (studies published 1997 to 2017, athletes aged 19 or younger). Adolescents who chronically slept poorly had higher odds of sports or musculoskeletal injury: pooled odds ratio 1.58 (95% CI 1.05 to 2.37, p = 0.03). Five of the seven studies individually reported a significant association for chronic poor sleep. Two studies examined acute sleep loss; one found a significant association and one did not.",
  interval: { lo: 1.05, hi: 2.37, measure: "odds ratio for sports or musculoskeletal injury, chronic poor sleepers versus good sleepers" },
  replication: "replicated",
  gateIntro: "You have heard that poor sleep increases injury risk in athletes. Before you see the pooled figure: how much higher do you think the odds of injury are for chronically poor sleepers, and how confident do you think the evidence base is - how many studies, and in what population?",
  cheat: "Keep the 1.58 injury odds for chronic poor sleepers out of adult planning: 7 studies, athletes 19 or younger, and a 1.05 lower bound.",
  idea: "Seven studies in adolescent athletes pool to an odds ratio of 1.58 for injury among chronic poor sleepers. The lower bound of the confidence interval is 1.05, which is close enough to no effect that a single additional null study could move the conclusion. It is a real signal and a thin one, and the population is teenagers, not adult recreational runners.",
  why: "Start with what would have to be true for this to be a clean finding. You would want objectively measured sleep, prospectively collected injury data with a hard case definition, and adjustment for training exposure. What you get instead is mostly self-reported sleep from questionnaires, injury definitions that vary between studies, and seven studies total. The pooled estimate is doing a lot of work on a small and heterogeneous base.\n\nThe confounding is structural and it points in the direction of the observed result. In adolescent athletes, the ones sleeping badly are disproportionately the ones training hardest, travelling to competition, carrying the heaviest school load, and specialising early in a single sport. Every one of those independently raises injury risk. Sleep is a marker for a lifestyle, and separating the marker from the mechanism needs a design these studies do not have.\n\nCausation can run backwards here too, and it does so more plausibly than usual. Pain wakes people up. An athlete carrying an early-stage bone stress injury or a grumpy tendon sleeps worse because of it, and if the sleep questionnaire is administered anywhere near the injury window you have measured the consequence and called it the cause. The prospective studies mitigate this but do not eliminate it, because injuries in runners rarely announce themselves on a single day.\n\nThen there is the transfer problem, which is yours specifically. These are athletes aged nineteen and under, in mostly team and school sports, with adolescent physiology and adolescent sleep architecture. You are an adult recreational distance runner. The finding may well transfer. Nothing in this paper demonstrates that it does.",
  failureMode: "You treat 1.58 as though it were a well-established multiplier and start making training decisions off your sleep score, which - per the tracker entries in this track - you cannot measure accurately on a single night anyway. Two shaky layers stacked: an odds ratio whose interval nearly includes 1, applied to a measurement whose single-night error exceeds an hour. The output is confident-feeling and worthless. The opposite failure is cheaper but still real: dismissing sleep entirely because the interval is thin, when the point estimate is not small and the mechanism is plausible.",
  experiment: "Go through your last twelve months and list every running injury or niggle that cost you more than a week. For each, write down what your sleep was like in the four weeks before onset - from your log or your calendar, not your memory. Then write down your weekly volume, your travel, and your work load over the same window. If sleep never separates from the other three, you have learned the actual shape of the problem in your own data.",
  reflection: "When your sleep is bad, what else is true about that period - and could that other thing be the injury risk you are attributing to sleep?",
  recall: {
    q: "A pooled odds ratio of 1.58 with a lower bound of 1.05 from seven studies of adolescent athletes. What are the two strongest reasons not to act on this as though it were an established causal effect in an adult runner?",
    a: "The first is confounding by the things that co-occur with poor sleep. In young athletes, bad sleep travels with heavy training, competition travel, school load and early sport specialisation, and each of those independently raises injury risk. Sleep is functioning as a marker for a demanding lifestyle, and the study designs cannot separate the marker from any mechanism. Reverse causation compounds this, because a developing injury disturbs sleep before it becomes a diagnosis.\n\nThe second is that the evidence base is seven studies with mostly self-reported sleep and inconsistent injury definitions, in a population aged nineteen and under. The lower confidence bound of 1.05 means the pooled result is one null study away from crossing the null. Transferring that to an adult recreational runner adds an extrapolation the paper never tested. The mechanism is plausible and the point estimate is not small, so the honest position is to take sleep seriously without pretending a number this fragile licenses a specific decision."
  },
  deepDive: "Find whether any prospective study in adult recreational distance runners has tested sleep as an injury risk factor with objective sleep measurement, and tell me what it found."
},
{
  id: "sleep-regularity-versus-duration",
  track: "sleep",
  level: "applied",
  title: "Sleep regularity tracks mortality at least as strongly as sleep duration does",
  source: "Windred et al., Sleep 47(1), 2024, zsad253",
  evidence: "Prospective cohort using UK Biobank accelerometry: 60,977 participants (mean age 62.8 +/- 7.8 years, 55.0% female), over 10 million hours of recording, median Sleep Regularity Index 81.0 (IQR 73.8 to 86.3). 1,859 deaths over a mean 6.30 +/- 0.83 years of follow-up. All-cause mortality, most regular versus least regular SRI quintile: fully adjusted HR 0.70 (95% CI 0.59 to 0.83); minimally adjusted HR 0.52 (95% CI 0.45 to 0.60). Sleep duration, longest versus shortest quintile: fully adjusted HR 0.76 (95% CI 0.65 to 0.89). Hierarchical model comparison found that adding sleep duration to an SRI-only model did not improve fit (likelihood ratio test, minimally adjusted X2(4) = 6.88, p = 0.14; fully adjusted X2(4) = 5.94, p = 0.20), which the authors take as evidence that duration explains no mortality risk beyond regularity.",
  interval: { lo: 0.59, hi: 0.83, measure: "hazard ratio for all-cause mortality, most versus least regular sleep quintile, fully adjusted" },
  replication: "single",
  gateIntro: "Two people both average seven hours a night. One goes to bed within twenty minutes of the same time every night. The other swings by three hours between weekdays and weekends. Before you read on: do you expect their mortality risk to differ, and if so, which of the two variables - the average or the consistency - would you bet is the stronger predictor?",
  idea: "In 60,977 UK Biobank participants with accelerometer-measured sleep, the most regular sleepers had a fully adjusted hazard ratio for all-cause mortality of 0.70 against the least regular. The equivalent comparison for sleep duration was 0.76. The two intervals overlap across most of their range, and the paper's case for regularity being the stronger predictor rests on a non-significant likelihood ratio test, so the defensible claim is that regularity matters at least as much as duration, not that it beats it.",
  why: "Regularity is measured here by the Sleep Regularity Index, which is the probability that you are in the same state - asleep or awake - at the same clock time on two consecutive days. It is a percentage, not a duration, and it captures something duration cannot: the alignment between your sleep and your circadian system. A person averaging seven hours with a three-hour weekend shift is asking their internal clock to re-entrain twice a week, which is a small dose of jet lag on a repeating schedule.\n\nThe headline framing of this paper is that regularity is the stronger predictor, and the abstract says so. The evidence offered for it is a hierarchical model comparison: adding sleep duration to an SRI-only model did not improve fit, at p = 0.14 minimally adjusted and p = 0.20 fully adjusted. The authors read that as duration contributing nothing beyond regularity. Read it the way you would read any non-significant test - failing to reject a null is weak evidence for the null, and it is weakest exactly where power is limited, which with 1,859 deaths spread across quintiles it is. Then set it against the confidence intervals: 0.59 to 0.83 for regularity, 0.65 to 0.89 for duration, overlapping across most of their range. The point estimate for regularity is lower. That is suggestive, and it is not the demonstration the title implies.\n\nThe gap between the minimally adjusted hazard ratio of 0.52 and the fully adjusted 0.70 is the most informative number in the study. Roughly a third of the crude association vanished once sociodemographic, lifestyle and health factors were added. That is a large sensitivity to the adjustment set in a single observational cohort, and it tells you how much of what remains might be absorbed by covariates nobody measured. UK Biobank participants are also healthier, whiter and more affluent than the general population, and the cohort's mean age here is sixty-three.\n\nWhat makes this worth knowing anyway is that regularity is actionable in a way duration often is not. You can rarely decide to sleep an extra hour. You can almost always decide to get up at the same time. And it is a variable your wearable measures far more robustly than the ones it gets wrong - bedtime and wake time are clock events, not epoch classifications, so they do not inherit the sleep-wake specificity problem that ruins total sleep time.",
  failureMode: "You spend your effort chasing total sleep time - the metric your device measures worst and you control least - while your bedtime swings by two hours across the week and your long-run mornings are on a different schedule to your work mornings. The predictable outcome is that Saturday's key session lands in the middle of a self-inflicted circadian shift, and you attribute the flat legs to training load.",
  experiment: "Pull thirty days of your device's bed time and wake time - just the clock times, not the sleep scores, because those are the numbers it gets right. Compute the standard deviation of each in minutes. If either exceeds about sixty minutes, you have a regularity problem that no amount of chasing a nightly sleep score will fix. Fix wake time first: it is the anchor the circadian system actually uses.",
  reflection: "What is the actual spread between your earliest and latest wake time across a normal week, and which of those days do you schedule your hardest running on?",

  gateIntro: "A widely used training metric divides your recent workload by your longer-term workload and flags you when the ratio goes outside a safe range. Before you read on: if a researcher swapped the denominator for a randomly generated number, what do you expect would happen to the metric's association with injury?",
  idea: "When researchers replaced the chronic workload in the denominator with a fixed constant, and then with random numbers, the association with injury largely survived. The predictive contribution comes from the numerator - acute load - not from the ratio. And even acute load barely discriminates: a c-statistic of 0.574 against a coin flip's 0.5.",
  why: "The mechanism is mathematical coupling and rescaling. Dividing acute load by chronic load produces a variable that is still dominated by acute load, because the denominator varies far less than the numerator across athletes. What the division does is shrink the variance and inflate the coefficient on the resulting variable, so the odds ratio looks impressive. The random-denominator test is the cleanest possible demonstration: if a variable's predictive power survives replacing half of it with noise, that half was not doing the work.\n\nThe c-statistic is the part that should stop you. 0.574 means that if you pick one athlete who got injured and one who did not, the metric ranks them correctly about 57% of the time. A coin does 50%. In any other domain you would not ship a classifier with that discrimination, let alone build a squad management policy on it. An odds ratio of 2.45 and a c-statistic of 0.574 are not in tension - a variable can shift group-level odds meaningfully while being close to useless at ranking individuals - and confusing those two is precisely how this metric spread.\n\nThe deeper issue is that the ratio was never a mechanism, it was a summary statistic that got promoted to a theory. Once it became a theory, the safe-zone thresholds followed, and thresholds get enforced. This is a familiar shape if you have watched a dashboard metric become a target: the number was descriptive, someone drew a line on it, and the line acquired more authority than the measurement ever had.\n\nFile this as overclaimed rather than failed. The underlying signal is real - acute load carries some information about injury risk, and training a lot more than usual is genuinely riskier than not. What is overclaimed is the ratio as a construct. It is redundant with the acute load you already measured, and dressing it up as a ratio buys you nothing but a bigger-looking coefficient.",

{
  id: "weekly-progression-rule-origins",
  track: "load",

  title: "The weekly progression rule rests on a hazard ratio whose interval includes no effect",
  source: "Nielsen et al., Journal of Orthopaedic & Sports Physical Therapy, 2014 (PMID 25155475)",
  evidence: "Prospective cohort of 874 novice runners with GPS-measured running distance followed for one year; 202 sustained a running-related injury. Runners were grouped by weekly distance progression over a two-week period: less than 10% (or regression), 10 to 30%, and more than 30%. Across all injury types, Cox regression found no significant difference between the three groups. For distance-related injuries specifically (patellofemoral pain, iliotibial band syndrome, medial tibial stress syndrome and others), progressing more than 30% versus less than 10% gave a hazard ratio of 1.59 (95% CI 0.96 to 2.66, p = 0.07).",
  interval: { lo: 0.96, hi: 2.66, measure: "hazard ratio for distance-related running injury, >30% versus <10% weekly distance progression" },
  replication: "overclaimed",
  gateIntro: "You have almost certainly been told not to increase your weekly mileage by more than some fixed percentage. Before you read on: what do you think the primary evidence for that rule looks like - what study design, what sample size, and was the key result statistically significant?",
  idea: "The most-cited cohort behind weekly progression limits followed 874 novice runners for a year. Across all injury types there was no significant difference between progression groups. The one result that supports the rule - a hazard ratio of 1.59 for distance-related injuries at over 30% progression - has a confidence interval running from 0.96 to 2.66 and a p value of 0.07. The interval includes no effect.",
  why: "Look at what had to happen for this result to exist. The overall analysis was null. The signal appears only after splitting injuries into distance-related and not-distance-related subtypes, which is a defensible biological hypothesis and also a subgroup analysis. The subgroup that supports the rule returns p = 0.07. None of this makes the finding wrong. It makes it a hypothesis with supportive but inconclusive data, which is a very different object from a rule you follow.\n\nThe hazard ratio itself is not small. 1.59 is a substantial effect if real, and the lower bound of 0.96 is very close to 1 rather than deep in null territory. The honest reading is not that progression does not matter - it is that this study, with 874 runners and 202 injuries over a year, was not able to establish that it does. That is a statement about the power and design of the evidence, not a refutation.\n\nWhat got built on top is the problem. The specific thresholds - 10%, 30% - are cut points the researchers chose to define exposure groups. They are not a discovered biological boundary. Yet they now appear in coaching guidance, running apps and physiotherapy advice as though somebody had found the line where tissue tolerance breaks. A cut point chosen to make a cohort analysis tractable has been reified into a physiological law.\n\nThere is also a definitional issue that the same research group has written about extensively: what counts as workload, and how many workload exposures a study actually captures. Weekly distance ignores pace, surface, elevation, cumulative history, and the interval between sessions. A 30% increase from 20 km to 26 km on flat road is not the same exposure as 30% from 60 km to 78 km with two of those weeks having a hard session. The exposure variable is coarse enough that a null result would not be surprising even if the underlying mechanism were real.",

  reflection: "Which of your training rules do you follow as a physiological fact when it is actually a cut point somebody chose to make an analysis tractable?",

{
  id: "volume-versus-intensity-unresolved",
  track: "load",
  level: "applied",
  title: "A randomised trial could not separate progressing volume from progressing intensity",
  source: "Ramskov et al., BMJ Open Sport & Exercise Medicine, 2018 (PMID 29527322)",
  evidence: "Randomised trial (Run Clever). 839 healthy recreational runners were randomised at baseline to a running-intensity progression schedule or a running-volume progression schedule. After an initial 8-week preconditioning phase, 447 participants entered the 16-week training period, with GPS data collection and real-time individualised feedback. 80 runners sustained a running-related injury following preconditioning (36 intensity, 44 volume). Cumulative incidence in the volume group: 4.6% at 2 weeks, 8.2% at 4 weeks, 13.2% at 8 weeks, 28.0% at 16 weeks. Risk differences between schedules: +2.9% at 2 weeks (95% CI -5.7 to 11.6), +1.8% at 4 weeks (95% CI -9.1 to 12.8), -4.7% at 8 weeks (95% CI -17.5 to 8.1), -14.0% at 16 weeks (95% CI -36.9 to 8.9).",
  interval: { lo: -36.9, hi: 8.9, measure: "percentage-point risk difference in running-related injury at 16 weeks, intensity progression versus volume progression" },
  replication: "single",
  gateIntro: "Two training schedules, one progressing weekly volume and one progressing intensity, randomised across 839 recreational runners, of whom 447 reach the sixteen-week training period. Before you read on: which do you expect to injure more runners, and how confident do you expect a trial of that size to be about the answer?",
  idea: "The trial found a risk difference of -14.0 percentage points at sixteen weeks, favouring the intensity schedule, with a confidence interval running from -36.9 to +8.9. That interval spans a large benefit, no difference, and a moderate harm. The conclusion is not that the two are equivalent - it is that the trial could not tell them apart.",
  why: "Read the interval as a range of futures the data are compatible with, not as a failed significance test. A risk difference of -36.9 percentage points would be one of the largest injury prevention effects ever measured in running. A risk difference of +8.9 would mean the intensity schedule is meaningfully worse. Both are inside the interval. The trial randomised 839 runners, 447 of whom reached the training period, and observed 80 injuries after preconditioning, and 80 events is simply not enough to resolve a question of this shape. This is the sports injury field's structural problem: the trials that get run are large by the standards of their funding and small by the standards of the question.\n\nThen there is compliance, and it is worse than you would guess. The same research group later documented adherence across eight large running injury trials. In Run Clever, 0 of 839 runners were fully compliant with the intervention at 24-week follow-up. In the companion ProjectRun21 study, 0 of 612 were fully compliant at 14 weeks. Zero. By contrast, shoe-based interventions in the same review achieved 68% to 90% compliance, because wearing a shoe is a thing you can comply with and following a prescribed weekly progression for four months is not.\n\nThat compliance figure reframes what the trial measured. An intention-to-treat analysis of two schedules that nobody followed is an estimate of the effect of being assigned to a schedule, which is a real and policy-relevant quantity but not the one you want. You want to know what happens if you progress intensity rather than volume. The trial can tell you what happens if someone hands you a plan to do that.\n\nThe practical implication is not nihilism. It is that the volume-versus-intensity question, which occupies an enormous amount of coaching argument, has one randomised trial behind it and that trial is uninformative. Anyone stating the answer confidently is stating a preference. Hold yours loosely.",
  failureMode: "You commit hard to one side of this - all your progression goes into volume, or all of it into intensity - on the strength of a coach's conviction or a podcast, and structure a year of training around it. If the effect exists at all it is smaller than the noise you can perceive in your own training, so you will never get feedback that corrects you. The cost is not a specific injury, it is a year spent optimising a variable that the best available evidence cannot resolve while ignoring the ones you can control, like session spacing and whether you actually take easy days easy.",
  experiment: "Look at your own last twelve months and classify each block by what you were progressing: distance, intensity, or both at once. The last category is usually the biggest and is the actual finding. Then pick one block ahead and progress only one of the two, deliberately, and write down beforehand what you expect to notice. The value is not in the result, it is in discovering how hard it is to comply with your own plan for even eight weeks - which is the same finding the trial made.",
  reflection: "When you last increased both your weekly volume and your session intensity in the same block, what were you going to attribute an injury to if one had happened?",
  recall: {

    a: "The interval is compatible with a very large benefit of the intensity schedule, with no difference at all, and with a moderate harm. With 839 randomised, 447 reaching the sixteen-week training period and 80 injury events, the trial did not have the resolution to separate these. The correct conclusion is that the question is unresolved, not that the two schedules are equivalent - an inconclusive trial is not evidence of no difference, and reporting it as such is one of the most common errors in reading this literature.\n\nThe compliance figure changes what the estimate even means. With zero runners fully adherent, an intention-to-treat analysis estimates the effect of being assigned a progression schedule, not the effect of following one. That is a legitimate and policy-relevant quantity, but it is not the biological question. It also explains something structural: interventions people can actually comply with, such as wearing a particular shoe, achieved 68% to 90% adherence in the same set of trials, which is why those trials can answer their questions and progression trials cannot."

  cheat: "Don't build shin-splint rehab around a screen: cases and controls differ by 0.79 kg/m2 BMI and 1.19 mm navicular drop, too small to act on.",
  idea: "Pooled across 21 studies, the statistically significant risk factors for medial tibial stress syndrome separate cases from controls by 0.79 kg/m2 of BMI, 1.19 mm of navicular drop, 5.94 degrees of ankle plantarflexion and 3.95 degrees of hip external rotation. Every one of those intervals excludes zero. Every one of them is also far too small to tell one runner apart from another, because the case and control distributions sit almost on top of each other.",
  why: "Take BMI first, because it is the one where the objection is purely distributional. A weighted mean difference of 0.79 kg/m2 is measured perfectly well - height and weight are not the problem. The problem is that BMI in a running population has a standard deviation of several units, so a 0.79 gap between group means describes two distributions that are nearly identical in shape and position. This is the difference between a risk factor and a screening test, and it is the whole point of the entry. Two distributions can have different means and overlap almost completely. If you screened runners on BMI you would misclassify almost everyone, in exactly the way a classifier with a c-statistic near 0.5 does.\n\nNavicular drop adds a second problem on top of the first. It is measured with a ruler against a bony landmark on a standing foot, by hand, on a person who is shifting their weight. Hamstra-Wright et al. do not report the reliability of that measurement, so treat this as an inference rather than a finding from the paper - but a pooled group difference of 1.19 mm is the sort of magnitude a hand-held ruler struggles to resolve. Whatever the exact reliability figure turns out to be, a single clinical measurement cannot place you meaningfully on a scale where the entire case-control difference is about a millimetre.\n\nThe negative results deserve more attention than they get. Ankle dorsiflexion range and quadriceps angle were clearly not risk factors, and both have been the target of years of clinical intervention. A field where the null results are this clean and the positive results are this small is telling you something about the underlying model: static anatomical measurements taken at rest are not capturing what loads a tibia during a run.\n\nWhat this does not mean is that the paper is useless. It is a well-executed synthesis and it correctly reports small effects as small. The problem is downstream, where a statistically significant pooled difference becomes clinical guidance to correct navicular drop, and the effect size never travels with the recommendation.",

  experiment: "Next time a clinician gives you a measurement as an explanation for an injury, ask two questions: what is the typical difference on this measure between people who get this injury and people who do not, and how much do the two groups overlap on it. If the answer to the first is small relative to the spread within either group, the measurement is not carrying information about you - regardless of how precisely it was taken.",

{

  evidence: "Clinical commentary on the management and prevention of bone stress injuries in long-distance runners. The paper carries its own evidence grading: Therapy, level 5 - the lowest rung, expert opinion. Its recommendations include a period of modified loading followed by progressive return to running, reducing impact through cueing runners to run softer and increasing stride rate, and strengthening local musculature such as the calf for tibial injuries and the foot intrinsics for metatarsal injuries. No controlled trial establishes the specific rate of progression.",
  replication: "craft",
  gateIntro: "You have a diagnosed bone stress injury and you are handed a return-to-run plan: so many weeks off, then walk-run intervals of a given length, progressing on a given schedule. Before you read on: what level of evidence do you think sits behind those specific numbers?",
  idea: "The most-cited clinical guidance on bone stress injuries in runners grades its own recommendations as level 5 - expert opinion. The progression schedules that circulate in clinics and forums are craft knowledge, refined by practitioners over decades and never tested against a control condition. That does not make them wrong. It means the specific numbers in your plan carry no more authority than the experience of whoever wrote them.",
  why: "Understand why the trial does not exist. To test a return-to-run progression you would need to randomise people with confirmed bone stress injuries to different progression rates, follow them for months, and use reinjury as the endpoint. Recruitment is slow because the injuries are relatively uncommon, the imaging to confirm grade is expensive, the follow-up is long, and the ethics of deliberately assigning someone to a faster progression are awkward. So the field runs on accumulated clinical experience, and it is honest enough to label it as such.\n\nCraft knowledge is not the same as no knowledge, and it deserves better treatment than either credulity or dismissal. The underlying biology is well characterised: bone responds to loading with a remodelling process that transiently weakens it before strengthening it, and the transient weakening is why progression has to be gradual. What is not established is the rate. Whether the right unit is two weeks or six, whether walk-run intervals should progress by time or distance, whether pain during is acceptable and pain after is not - these are conventions.\n\nTreat conventions accordingly. The value of a documented progression is that it is a pre-committed plan made when you were thinking clearly, which protects you from the decision you will want to make in week three when it feels fine. That is a real and substantial benefit and it does not require the schedule to be optimal. It requires it to be written down and followed.\n\nThe risk in labelling this craft is that someone takes it as permission to improvise. It is the opposite. When the evidence base is expert opinion, the sensible response is to follow one coherent expert's opinion rather than assembling a plan from four sources with different assumptions, which is what happens when you decide the schedule is arbitrary.",
  failureMode: "You read that return-to-run progressions are not evidence-based and conclude you can go by feel. Bone stress injuries have a high recurrence rate and the pain resolves well before the bone has remodelled, so feel is systematically optimistic in exactly the window where you are most likely to reinjure. The concrete cost is a second stress injury at the same site, which typically means a longer layoff than the first and a real question about whether you can keep racing the distance.",
  experiment: "Take whatever return-to-run plan you have been given or would use, and write next to each step what would have to happen for you to stop and go back a stage. Do it now, before you need it. Then find out where your plan came from - which clinician, which paper, which forum post - and whether the person who wrote it stated their reasoning or just the numbers.",
  reflection: "When a clinician gives you a specific number of weeks, do you ask whether it comes from a trial or from their experience, and would you follow it differently if you knew?",

al does exclude no effect and the paper reports it as a real difference at moderate certainty. The reason to be careful with it is not statistical. It is that a 3 g/day gap in fibre is a secondary outcome from nine pooled studies of self-reported diet, and the most economical explanation is total food volume: a runner eating 303 kcal/day less is eating less of everything, fibre included. Expect this one to leave the paper as a headline about fibre being protective, which is a claim the study did not test.",

<script>
/* ==========================================================================
   Daily — the reader

   Speaks a rendered entry aloud through the browser's own synthesiser. Nothing
   is fetched and nothing is stored, which is the only way a corpus this size
   gets an audio track at all: narrated as files the shared corpus runs to tens
   of hours, and a built page has to stay one self-contained file that works
   offline.

   The reader is handed text and speaks it. It never reads the corpus itself,
   and that division is load-bearing. app.js hands it only blocks that are on
   screen, and a locked entry returns before its body is built, so gated prose
   is not withheld here - it does not exist to be read. The recall answer is
   never part of an entry at all. Neither rule is enforced in this file and
   neither needs to be.

   Every utterance is short. Chrome stops synthesising after roughly fifteen
   seconds of a single utterance, reports no error, and leaves the queue
   looking healthy, so a paragraph handed over whole goes quiet halfway and
   nothing says why. Splitting to sentences keeps every utterance well inside
   that limit, which fixes it without a timer fighting the browser for control.
   ========================================================================== */

  'use strict';

     network interface exists, not whether anything is reachable, so a true is
     worth nothing: a captive portal, a router with no uplink and a dead
     endpoint all report it. A false is the one answer it gets right, and it is
     the only one needed here. Compared against false explicitly so a browser
     that does not implement the property reads as online rather than as
     permanently offline. */
  function offline() {
    return !!NAV && NAV.onLine === false;
  }

  /* Long enough that the splits fall on real sentence ends most of the time,
     short enough that even the slowest voice finishes one inside the limit. */
  var MAX_CHUNK = 200;

  var voice = null;
  var queue = [];
  var at = 0;
  var mode = 'idle';                    // idle | playing | paused
  var hooks = {};

  /* Bumped by everything that ends a read. A cancelled utterance still fires
     onend or onerror, and without this the handler advances a queue that has
     already been replaced, which starts the next entry reading itself. */
  var gen = 0;

  /* --- Splitting ---------------------------------------------------------- */
  function split(text) {
    var clean = String(text == null ? '' : text).replace(/\s+/g, ' ').trim();
    var out = [];

    var re = /[^.!?]+[.!?]*/g;

     clause boundary. Cutting mid-clause is audible as a stumble, so a sentence
     with nowhere good to break goes over whole: a rare long utterance beats a
     reliable wrong pause. */
  function push(out, s) {
    if (s.length <= MAX_CHUNK) { out.push(s); return; }

    var cut = -1;
    ['; ', ': ', ', ', ' - '].forEach(function (mark) {
      var found = s.lastIndexOf(mark, MAX_CHUNK);
      if (found !== -1 && found + mark.length > cut) cut = found + mark.length;

    out.push(s.slice(0, cut).trim());

     Nothing in the API reports how good a voice sounds, so the name is the
     only evidence there is. The tiers matter more than they look: a Mac offers
     around forty-seven English voices, most of them the 1990s concatenative
     set and a dozen of them novelty toys, so taking the first of anything is a
     coin flip that can land on Zarvox.

     Neural voices say so in their names. macOS ships its good ones as Premium
     or Enhanced downloads, Chrome's network voices are the Google family, and
     Edge exposes Microsoft's as Natural or Online. Anything unmarked falls
     through to whatever the browser itself calls default, which is at least a
     choice rather than a stumble, and then to no preference at all. Guessing

<script>
/* ==========================================================================
   Daily — shared engine

   One engine, many sites. Everything that differs between sites lives in
   window.SITE: the storage key, the tracks, the second facet, every string
   of visible copy, the review model, the commitment gate and whether the
   forecast book exists at all.

   State lives in localStorage under one versioned key. Nothing here talks to
   the network, so a built page works offline and forever.
   ========================================================================== */

  'use strict';

  var SITE = window.SITE || {};

  var EXPR = window.EXPR;                    // engine/expr.js, loaded before this
  var SPEECH = window.SPEECH;                // engine/speech.js, same

  var KEY = SITE.key;
  var TRACKS = SITE.tracks || [];
  var LEVELS = SITE.levels || {};
  var COPY = SITE.copy || {};
  var GATE = SITE.gate || null;
  var PROMPT = SITE.prompt || {};

  var HAS_REVIEW = SITE.review !== 'none';
  var HAS_EXPIRY = SITE.expiry === true;
  var HAS_FORECAST = SITE.forecastBook === true;

     is exercising judgement, which is the point - Nomogram refuses to let the
     author grade their own evidence, and the cheatsheet must not be the hole
     in that.

     `cheatsheet: true`, and an entry appears if the author wrote it a line.
     That is editorial and the page says so rather than dressing a selection up
     as a filter. */

  var CHEAT_VERDICTS = CHEAT && CHEAT.verdicts ? CHEAT.verdicts : null;

  function onCheatsheet(l) {
    return CHEAT_VERDICTS ? CHEAT_VERDICTS.indexOf(l.replication) !== -1 : !!l.cheat;
  }

  /* Expiry retires a claim the author already knew would rot. This retires the
     author's confidence in a claim they thought was settled, which is where
     checking actually finds the failures. Nothing leaves the sequence: a stale
     citation is still true more often than not, it is just no longer checked. */

  function stale(l) {
    if (!REVERIFY_DAYS || !l.verifiedOn) return false;
    return shift(l.verifiedOn, REVERIFY_DAYS) < today();
  }

  function evidenceHTML(l) {
    var h = '<div class="evidence" data-rep="' + esc(l.replication) + '"' +
      (stale(l) ? ' data-stale="1"' : '') + '>';
    h += '<p class="block__label">' + esc(COPY.labelEvidence || 'The evidence') + '</p>';
    h += '<p class="evidence__cite" data-speak="evidence">' + esc(l.evidence) + '</p>';
    if (l.interval && typeof l.interval.lo === 'number' && typeof l.interval.hi === 'number') {
      h += '<p class="evidence__interval">' + esc(l.interval.measure || 'interval') + ' ' +
        l.interval.lo + ' to ' + l.interval.hi + '</p>';
    }
    h += '<p class="evidence__meta">';
    h += '<span class="rep-chip">' + esc(REP_LABEL[l.replication] || l.replication) + '</span>';
    if (l.replication === 'statute' && l.asAt) {
      h += '<span class="evidence__asat">as at ' + esc(shortDate(l.asAt)) + '</span>';
    }

      h += '<span class="evidence__stale">' +
        esc(COPY.staleNote || 'not re-checked since ' + shortDate(l.verifiedOn)) + '</span>';
    }

  var REP_LABEL = {
    replicated:  'Replicated',
    single:      'One study, never repeated',
    contested:   'Contested',
    failed:      'Failed to replicate',
    overclaimed: 'Real, but overclaimed',
    craft:       'Craft, no trial behind it',
    statute:     'Statute'
  };

  /* ------------------------------------------------------------------------
     THE POLICY DIAL

     This one function decides the whole rhythm of retention: how long an
     entry rests before it comes back, and how badly a miss sets you back.
     Leitner boxes, intervals from the site config.

     Three alternatives, if the default does not fit how you learn:

       Forgiving   — a miss drops you one box instead of all the way to 1.
                     Kinder, but genuinely-forgotten material resurfaces
                     slowly, which is the failure mode you care about.
       Aggressive  — intervals 1/2/4/8/16. Roughly twice the review load for
                     noticeably better recall. Costs you minutes a day.

    d.setDate(d.getDate() + days);
    return dayKey(d);

  function longDate(k) {
    return parseKey(k).toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
  }
  function shortDate(k) {
    return parseKey(k).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
  }

  /* --- Expiry -------------------------------------------------------------
     Fast-moving material carries a date past which it is more likely to be
     folklore than fact. A lapsed entry leaves the sequence and the review
     deck rather than being quietly reinforced forever. It stays visible in
     the library, marked, because knowing what went stale is itself useful. */
  function lapsed(l) {
    return HAS_EXPIRY && !!l.expires && daysBetween(l.expires, today()) > 0;
  }
  function live() {
    return LESSONS.filter(function (l) { return !lapsed(l); });
  }

  /* --- Sequence -----------------------------------------------------------
     Round-robin across tracks, rotating the track order each cycle. Because
     each track file is ordered foundational first, the opening cycle serves
     the most foundational entry from every track before anything advanced. */
  function buildSequence() {
    var pool = live();
    var byTrack = TRACKS.map(function (t) {
      return pool.filter(function (l) { return l.track === t.id; });
    });
    var out = [];
    var cycle = 0;
    var guard = pool.length + TRACKS.length + 1;
    while (out.length < pool.length && cycle < guard) {
      for (var i = 0; i < TRACKS.length; i++) {
        var bucket = byTrack[(i + cycle) % TRACKS.length];
        var lesson = bucket[cycle];
        if (lesson) out.push(lesson.id);
      }
      cycle++;
    }
    // Anything a ragged track length left behind.
    pool.forEach(function (l) { if (out.indexOf(l.id) === -1) out.push(l.id); });
    return out;
  }

  var SEQ = buildSequence();
  var BY_ID = {};
  LESSONS.forEach(function (l) { BY_ID[l.id] = l; });

  /* --- State ------------------------------------------------------------- */
  var blank = {
    v: 1,
    startedOn: today(),
    log: {},
    days: {},
    streak: { count: 0, best: 0, lastOn: null },
    forecasts: {},
    profile: {},
    theme: null,
    autoplay: false
  };

  /* Everything here depends on being able to write locally. If a browser or
     an embedding blocks storage, say so plainly rather than losing a month of
     someone's notes without telling them. */
  function storageWorks() {
    try {
      localStorage.setItem(KEY + '.probe', '1');
      localStorage.removeItem(KEY + '.probe');
      return true;
    } catch (e) {
      return false;
    }
  }

  var STORAGE_OK = storageWorks();
  var state = load();

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return clone(blank);
      var parsed = JSON.parse(raw);
      if (!parsed || parsed.v !== 1) return clone(blank);
      // Merge onto the blank so a partial or older record still boots.
      var s = clone(blank);
      Object.keys(parsed).forEach(function (k) { s[k] = parsed[k]; });
      s.log = parsed.log || {};
      s.days = parsed.days || {};
      s.streak = parsed.streak || clone(blank.streak);
      s.forecasts = parsed.forecasts || {};
      return s;
    } catch (e) {
      return clone(blank);

    try { localStorage.setItem(KEY, JSON.stringify(state)); }
    catch (e) { toast('Could not save — browser storage is full or blocked'); }
