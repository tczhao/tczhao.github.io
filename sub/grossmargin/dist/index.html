<title>Gross Margin - the architecture decisions a CFO later reports</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* ==========================================================================
   Practicum — a daily logbook for management practice

   Identity: an engineering lab notebook. Pale technical paper stock, a 28px
   graph field locked to the prose baseline, drafting blue for structure and
   oxide red-pen for anything that asks you to act.

   Theming is token-level. Components read tokens and never reach inside a
   media query, so the viewer's explicit toggle can win in both directions.
   ========================================================================== */

/* --- Light tokens (the default ground) ----------------------------------- */
:root {
  --paper:        #F5F6F3;
  --paper-raised: #FFFFFF;
  --paper-sunk:   #EBEEE8;

  --grid:         rgba(20, 26, 34, 0.055);
  --grid-major:   rgba(20, 26, 34, 0.10);
  --rule:         #DBDFD7;
  --rule-strong:  #B6BEB4;

  --ink:          #141A22;
  --ink-muted:    #545F6A;
  --ink-faint:    #8B949D;

  --accent:       #1D4E80;
  --accent-ink:   #163D66;
  --accent-soft:  rgba(29, 78, 128, 0.09);
  --accent-line:  rgba(29, 78, 128, 0.30);

  --action:       #9E3A26;
  --action-soft:  rgba(158, 58, 38, 0.075);
  --action-line:  rgba(158, 58, 38, 0.32);

  --solid:        #2F6B4F;
  --shaky:        #8A6A1F;

  --shadow-card:  0 1px 0 rgba(20, 26, 34, 0.05), 0 8px 22px -14px rgba(20, 26, 34, 0.30);
  --shadow-lift:  0 1px 0 rgba(20, 26, 34, 0.06), 0 16px 34px -18px rgba(20, 26, 34, 0.38);

  /* Type roles. No CDN fonts: the Artifact CSP blocks font hosts, and a
     linked webfont would fail silently, so every role resolves locally. */
  --face-display: Superclarendon, Rockwell, "Bookman Old Style", "Roboto Slab", Georgia, serif;
  --face-text:    Charter, "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --face-ui:      "Helvetica Neue", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  --face-mono:    "SF Mono", SFMono-Regular, Menlo, "Cascadia Mono", Consolas, monospace;

  /* 28px baseline. The graph field is a 28px minor / 140px major multiple of
     it, so body lines land on grid lines rather than near them. */
  --lead:  28px;
  --u:     7px;
  --rail:  17rem;
  --measure: 66ch;
}

/* --- Dark tokens: a negative blueprint under lamplight -------------------
   Retuned rather than inverted. The blue lifts to hold contrast on a dark
   ground; the red-pen warms so it still reads as ink, not as an error state. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper:        #101418;
    --paper-raised: #171D24;
    --paper-sunk:   #0B0E12;

    --grid:         rgba(158, 190, 214, 0.055);
    --grid-major:   rgba(158, 190, 214, 0.085);
    --rule:         #232C34;
    --rule-strong:  #37444E;

    --ink:          #DCE3E9;
    --ink-muted:    #96A2AD;
    --ink-faint:    #68737D;

    --accent:       #6EA8D4;
    --accent-ink:   #9AC4E4;
    --accent-soft:  rgba(110, 168, 212, 0.13);
    --accent-line:  rgba(110, 168, 212, 0.34);

    --action:       #D9755C;
    --action-soft:  rgba(217, 117, 92, 0.12);
    --action-line:  rgba(217, 117, 92, 0.36);

    --solid:        #63B08A;
    --shaky:        #C9A651;

    --shadow-card:  0 1px 0 rgba(0, 0, 0, 0.4), 0 8px 22px -14px rgba(0, 0, 0, 0.7);
    --shadow-lift:  0 1px 0 rgba(0, 0, 0, 0.45), 0 16px 34px -18px rgba(0, 0, 0, 0.8);
  }
}

:root[data-theme="dark"] {
  --paper:        #101418;
  --paper-raised: #171D24;
  --paper-sunk:   #0B0E12;

  --grid:         rgba(158, 190, 214, 0.055);
  --grid-major:   rgba(158, 190, 214, 0.085);
  --rule:         #232C34;
  --rule-strong:  #37444E;

  --ink:          #DCE3E9;
  --ink-muted:    #96A2AD;
  --ink-faint:    #68737D;

  --accent:       #6EA8D4;
  --accent-ink:   #9AC4E4;
  --accent-soft:  rgba(110, 168, 212, 0.13);
  --accent-line:  rgba(110, 168, 212, 0.34);

  --action:       #D9755C;
  --action-soft:  rgba(217, 117, 92, 0.12);
  --action-line:  rgba(217, 117, 92, 0.36);

  --solid:        #63B08A;
  --shaky:        #C9A651;

  --shadow-card:  0 1px 0 rgba(0, 0, 0, 0.4), 0 8px 22px -14px rgba(0, 0, 0, 0.7);
  --shadow-lift:  0 1px 0 rgba(0, 0, 0, 0.45), 0 16px 34px -18px rgba(0, 0, 0, 0.8);
}

/* --- Ground -------------------------------------------------------------- */
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--face-text);
  font-size: 17px;
  line-height: var(--lead);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

h1, h2, h3, h4, p, ul, ol, dl, dd, dt, figure, blockquote {
  margin: 0;
  padding: 0;
}
ul, ol { list-style: none; }
button { font: inherit; color: inherit; }

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
  border-radius: 1px;
}

.skip {
  position: absolute;
  left: -9999px;
  top: 0;
  z-index: 50;
  padding: var(--u) calc(var(--u) * 2);
  background: var(--accent);
  color: #fff;
  font-family: var(--face-ui);
  font-size: 0.8125rem;
  text-decoration: none;
}
.skip:focus { left: var(--u); top: var(--u); }

/* --- Shared type roles --------------------------------------------------- */
.eyebrow {
  font-family: var(--face-ui);
  font-size: 0.6875rem;
  font-weight: 600;
  letter-spacing: 0.13em;
  text-transform: uppercase;
  color: var(--ink-faint);
}

.num { font-family: var(--face-mono); font-variant-numeric: tabular-nums; }

/* ==========================================================================
   Layout: a bound page. Spine rail carries identity and position; the field
   is the paper itself.
   ========================================================================== */
.logbook {
  display: grid;
  grid-template-columns: var(--rail) minmax(0, 1fr);
  min-height: 100vh;
}

/* --- Spine --------------------------------------------------------------- */
.spine {
  position: sticky;
  top: 0;
  align-self: start;
  height: 100vh;
  display: flex;
  flex-direction: column;
  gap: calc(var(--u) * 4);
  padding: calc(var(--u) * 5) calc(var(--u) * 4);
  background: var(--paper-sunk);
  border-right: 1px solid var(--rule);
  overflow-y: auto;
}

.spine__head { display: flex; flex-direction: column; gap: calc(var(--u) * 0.5); }

.wordmark {
  font-family: var(--face-display);
  font-size: 1.75rem;
  font-weight: 400;
  letter-spacing: -0.015em;
  line-height: 1.1;
}

.spine__sub {
  font-family: var(--face-ui);
  font-size: 0.75rem;
  line-height: 1.45;
  color: var(--ink-muted);
  max-width: 15ch;
}

/* The entry stamp: position in the sequence, set like a plate number. */
.stamp {
  display: flex;
  flex-direction: column;
  padding-top: calc(var(--u) * 2);
  border-top: 2px solid var(--ink);
}
.stamp__label {
  font-family: var(--face-ui);
  font-size: 0.625rem;
  font-weight: 600;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--ink-faint);
}
.stamp__num {
  font-family: var(--face-mono);
  font-variant-numeric: tabular-nums;
  font-size: 2.75rem;
  line-height: 1.05;
  letter-spacing: -0.03em;
  color: var(--accent);
}
.stamp__date {
  font-family: var(--face-mono);
  font-size: 0.6875rem;
  letter-spacing: 0.04em;
  color: var(--ink-muted);
  text-transform: uppercase;
}

/* --- Nav ----------------------------------------------------------------- */
.nav { display: flex; flex-direction: column; }

.nav__item {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--u);
  width: 100%;
  padding: calc(var(--u) * 1.4) 0;
  background: none;
  border: 0;
  border-bottom: 1px solid var(--rule);
  font-family: var(--face-ui);
  font-size: 0.875rem;
  text-align: left;
  color: var(--ink-muted);
  cursor: pointer;
  transition: color 0.12s ease;
}
.nav__item:first-child { border-top: 1px solid var(--rule); }
.nav__item:hover { color: var(--ink); }
.nav__item[aria-current="page"] {
  color: var(--ink);
  font-weight: 600;
  box-shadow: inset 2px 0 0 var(--accent);
  padding-left: var(--u);
}

.nav__badge {
  font-family: var(--face-mono);
  font-variant-numeric: tabular-nums;
  font-size: 0.6875rem;
  padding: 1px 6px;
  border-radius: 2px;
  background: var(--action);
  color: #fff;
}

/* --- Gauge: the small instrument panel ---------------------------------- */
.gauge {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: var(--u);
  margin-top: auto;
}
.gauge__cell { display: flex; flex-direction: column; gap: 2px; }
.gauge dt {
  font-family: var(--face-ui);
  font-size: 0.5625rem;
  font-weight: 600;
  letter-spacing: 0.11em;
  text-transform: uppercase;
  color: var(--ink-faint);
}
.gauge dd {
  font-family: var(--face-mono);
  font-variant-numeric: tabular-nums;
  font-size: 1.125rem;
  color: var(--ink);
}

.spine__foot { padding-top: calc(var(--u) * 1.5); border-top: 1px solid var(--rule); }

.ghost {
  padding: calc(var(--u) * 0.7) var(--u);
  background: none;
  border: 1px solid var(--rule-strong);
  border-radius: 2px;
  font-family: var(--face-ui);
  font-size: 0.75rem;
  color: var(--ink-muted);
  cursor: pointer;
  transition: border-color 0.12s ease, color 0.12s ease;
}
.ghost:hover { border-color: var(--ink-muted); color: var(--ink); }

/* --- Field: the graph paper ---------------------------------------------- */
.field {
  padding: calc(var(--u) * 8) calc(var(--u) * 7) calc(var(--u) * 14);
  background-color: var(--paper);
  background-image:
    linear-gradient(to right,  var(--grid-major) 0 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid-major) 0 1px, transparent 1px),
    linear-gradient(to right,  var(--grid) 0 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid) 0 1px, transparent 1px);
  background-size: 140px 140px, 140px 140px, 28px 28px, 28px 28px;
  background-position: 0 0;
}
.field:focus { outline: none; }

.view { display: flex; flex-direction: column; gap: calc(var(--u) * 5); max-width: 78ch; }

/* ==========================================================================
   Entry: the daily lesson
   ========================================================================== */
.entry { display: flex; flex-direction: column; gap: calc(var(--u) * 4); }

.entry__head { display: flex; flex-direction: column; gap: calc(var(--u) * 2); }

.tags { display: flex; flex-wrap: wrap; gap: var(--u); align-items: center; }

.tag {
  font-family: var(--face-ui);
  font-size: 0.625rem;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 3px 7px;
  border-radius: 2px;
  background: var(--accent-soft);
  color: var(--accent-ink);
}
.tag--level {
  background: none;
  border: 1px solid var(--rule-strong);
  color: var(--ink-muted);
}
.tag--time {
  background: none;
  color: var(--ink-faint);
  font-family: var(--face-mono);
  letter-spacing: 0.04em;
  text-transform: none;
  padding-left: 0;
}

.entry__title {
  font-family: var(--face-display);
  font-size: clamp(2.125rem, 4.6vw, 3.125rem);
  font-weight: 400;
  line-height: 1.07;
  letter-spacing: -0.022em;
  text-wrap: balance;
  max-width: 26ch;
}

/* The one orchestrated moment: the rule under the title draws itself. */
.entry__rule {
  height: 2px;
  background: var(--ink);
  transform-origin: left;
  animation: draw 0.55s cubic-bezier(0.22, 0.61, 0.36, 1) both;
}
@keyframes draw { from { transform: scaleX(0); } to { transform: scaleX(1); } }

.entry__source {
  font-family: var(--face-ui);
  font-size: 0.8125rem;
  color: var(--ink-muted);
}
.entry__source em { font-style: italic; }

/* --- Prose blocks -------------------------------------------------------- */
.block { display: flex; flex-direction: column; gap: calc(var(--u) * 1.5); }

.block__label {
  font-family: var(--face-ui);
  font-size: 0.6875rem;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-faint);
}

.block__body { max-width: var(--measure); display: flex; flex-direction: column; gap: var(--lead); }
.block__body p { line-height: var(--lead); }

.lead { font-size: 1.1875rem; line-height: 32px; }
.lead strong { font-weight: 600; }

/* Failure mode gets a quiet sunk panel — it is a warning, not an action. */
.block--failure .block__body {
  padding: calc(var(--u) * 2.5) calc(var(--u) * 3);
  background: var(--paper-sunk);
  border-left: 2px solid var(--rule-strong);
}

/* --- The experiment: a stamped action item in red pen -------------------- */
.experiment {
  display: flex;
  flex-direction: column;
  gap: calc(var(--u) * 1.5);
  padding: calc(var(--u) * 3.5);
  background: var(--action-soft);
  border: 1px solid var(--action-line);
  border-left: 3px solid var(--action);
  border-radius: 2px;
}
.experiment__label {
  font-family: var(--face-ui);
  font-size: 0.6875rem;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--action);
}
.experiment__body { max-width: var(--measure); }

/* --- Reflection: a ruled writing surface --------------------------------- */
.reflect { display: flex; flex-direction: column; gap: calc(var(--u) * 1.5); }
.reflect__prompt {
  max-width: var(--measure);
  font-style: italic;
  color: var(--ink-muted);
}

.reflect__field {
  display: block;
  width: 100%;
  max-width: var(--measure);
  min-height: calc(var(--lead) * 4);
  padding: 0 calc(var(--u) * 1.5);
  border: 0;
  border-radius: 0;
  background-color: var(--paper-raised);
  background-image: linear-gradient(to bottom, transparent calc(var(--lead) - 1px), var(--rule) calc(var(--lead) - 1px));
  background-size: 100% var(--lead);
  box-shadow: inset 0 0 0 1px var(--rule);
  color: var(--ink);
  font-family: var(--face-text);
  font-size: 17px;
  line-height: var(--lead);
  resize: vertical;
}
.reflect__field:focus { box-shadow: inset 0 0 0 1px var(--accent-line); outline: none; }
.reflect__field::placeholder { color: var(--ink-faint); font-style: italic; }

.reflect__state {
  font-family: var(--face-mono);
  font-size: 0.6875rem;
  color: var(--ink-faint);
  min-height: var(--lead);
}

/* --- Actions row --------------------------------------------------------- */
.actions {
  display: flex;
  flex-wrap: wrap;
  gap: calc(var(--u) * 1.5);
  align-items: center;
  padding-top: calc(var(--u) * 2);
  border-top: 1px solid var(--rule);
}

.btn {
  padding: calc(var(--u) * 1.3) calc(var(--u) * 2.5);
  background: var(--ink);
  border: 1px solid var(--ink);
  border-radius: 2px;
  font-family: var(--face-ui);
  font-size: 0.8125rem;
  font-weight: 600;
  color: var(--paper);
  cursor: pointer;
  transition: opacity 0.12s ease;
}
.btn:hover { opacity: 0.86; }
.btn[disabled] { opacity: 0.4; cursor: default; }

.btn--quiet {
  background: none;
  border-color: var(--rule-strong);
  color: var(--ink-muted);
  font-weight: 500;
}
.btn--quiet:hover { border-color: var(--ink-muted); color: var(--ink); opacity: 1; }

.btn--done {
  background: var(--accent-soft);
  border-color: var(--accent-line);
  color: var(--accent-ink);
}

/* --- Deep dive ----------------------------------------------------------- */
.deepdive {
  display: flex;
  flex-direction: column;
  gap: calc(var(--u) * 1.5);
  padding: calc(var(--u) * 3);
  border: 1px dashed var(--accent-line);
  border-radius: 2px;
}
.deepdive__note {
  max-width: var(--measure);
  font-size: 0.9375rem;
  color: var(--ink-muted);
}
.deepdive__text {
  max-width: var(--measure);
  max-height: 40vh;
  overflow: auto;
  padding: calc(var(--u) * 2);
  background: var(--paper-sunk);
  border: 1px solid var(--rule);
  font-family: var(--face-mono);
  font-size: 0.8125rem;
  line-height: 1.6;
  white-space: pre-wrap;
  overflow-wrap: break-word;
}

/* ==========================================================================
   Review: index cards
   ========================================================================== */
.card {
  display: flex;
  flex-direction: column;
  gap: calc(var(--u) * 2);
  max-width: 62ch;
  padding: calc(var(--u) * 4);
  background: var(--paper-raised);
  border: 1px solid var(--rule);
  border-top: 3px solid var(--accent);
  border-radius: 2px;
  box-shadow: var(--shadow-card);
}

.card__meta {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: var(--u);
  font-family: var(--face-mono);
  font-size: 0.6875rem;
  color: var(--ink-faint);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.card__q {
  font-family: var(--face-display);
  font-size: 1.4375rem;
  font-weight: 400;
  line-height: 1.28;
  letter-spacing: -0.01em;
  text-wrap: balance;
}

.card__a {
  padding-top: calc(var(--u) * 2);
  border-top: 1px solid var(--rule);
  animation: settle 0.28s ease both;
}
@keyframes settle { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

.grades { display: flex; flex-wrap: wrap; gap: var(--u); }
.grade {
  flex: 1 1 auto;
  padding: calc(var(--u) * 1.3) calc(var(--u) * 2);
  background: none;
  border: 1px solid var(--rule-strong);
  border-radius: 2px;
  font-family: var(--face-ui);
  font-size: 0.8125rem;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.12s ease, border-color 0.12s ease;
}
.grade__hint {
  display: block;
  font-weight: 400;
  font-size: 0.6875rem;
  color: var(--ink-faint);
}
.grade--miss:hover  { border-color: var(--action); background: var(--action-soft); }
.grade--close:hover { border-color: var(--shaky); background: color-mix(in srgb, var(--shaky) 9%, transparent); }
.grade--got:hover   { border-color: var(--solid); background: color-mix(in srgb, var(--solid) 9%, transparent); }

/* ==========================================================================
   Library
   ========================================================================== */
.filters { display: flex; flex-wrap: wrap; gap: var(--u); align-items: center; }

.search {
  flex: 1 1 18ch;
  min-width: 0;
  padding: calc(var(--u) * 1.2) calc(var(--u) * 1.5);
  background: var(--paper-raised);
  border: 1px solid var(--rule);
  border-radius: 2px;
  color: var(--ink);
  font-family: var(--face-ui);
  font-size: 0.875rem;
}
.search:focus { border-color: var(--accent-line); outline: none; }

.chip {
  padding: calc(var(--u) * 0.8) calc(var(--u) * 1.4);
  background: none;
  border: 1px solid var(--rule-strong);
  border-radius: 2px;
  font-family: var(--face-ui);
  font-size: 0.75rem;
  color: var(--ink-muted);
  cursor: pointer;
}
.chip[aria-pressed="true"] {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--paper);
}

.shelf { display: flex; flex-direction: column; }

.shelf__row {
  display: grid;
  grid-template-columns: 4.5ch minmax(0, 1fr) auto;
  gap: calc(var(--u) * 2);
  align-items: baseline;
  width: 100%;
  padding: calc(var(--u) * 1.7) var(--u);
  background: none;
  border: 0;
  border-bottom: 1px solid var(--rule);
  text-align: left;
  cursor: pointer;
  transition: background 0.1s ease;
}
.shelf__row:hover { background: var(--accent-soft); }
.shelf__num {
  font-family: var(--face-mono);
  font-variant-numeric: tabular-nums;
  font-size: 0.75rem;
  color: var(--ink-faint);
}
.shelf__title { font-family: var(--face-text); font-size: 1rem; line-height: 1.4; }
.shelf__track {
  font-family: var(--face-ui);
  font-size: 0.625rem;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-faint);
}

.pip {
  display: inline-block;
  width: 6px;
  height: 6px;
  margin-right: var(--u);
  border-radius: 50%;
  background: var(--rule-strong);
  vertical-align: 1px;
}
.pip--logged { background: var(--accent); }
.pip--solid  { background: var(--solid); }
.pip--shaky  { background: var(--shaky); }

/* ==========================================================================
   Journal
   ========================================================================== */
.note {
  display: flex;
  flex-direction: column;
  gap: var(--u);
  max-width: var(--measure);
  padding-bottom: calc(var(--u) * 3);
  border-bottom: 1px solid var(--rule);
}
.note__meta {
  display: flex;
  flex-wrap: wrap;
  gap: calc(var(--u) * 1.5);
  align-items: baseline;
  font-family: var(--face-mono);
  font-size: 0.6875rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--ink-faint);
}
.note__title { font-family: var(--face-display); font-size: 1.1875rem; font-weight: 400; line-height: 1.3; }
.note__body { white-space: pre-wrap; }

/* ==========================================================================
   Progress
   ========================================================================== */
.readout {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(11rem, 1fr));
  gap: 1px;
  background: var(--rule);
  border: 1px solid var(--rule);
  border-radius: 2px;
}
.readout__cell {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: calc(var(--u) * 2.5);
  background: var(--paper-raised);
}
.readout__label {
  font-family: var(--face-ui);
  font-size: 0.625rem;
  font-weight: 600;
  letter-spacing: 0.11em;
  text-transform: uppercase;
  color: var(--ink-faint);
}
.readout__value {
  font-family: var(--face-mono);
  font-variant-numeric: tabular-nums;
  font-size: 1.875rem;
  line-height: 1.15;
  letter-spacing: -0.02em;
}
.readout__unit { font-family: var(--face-ui); font-size: 0.75rem; color: var(--ink-muted); }

.coverage { display: flex; flex-direction: column; gap: calc(var(--u) * 2); }
.cov { display: grid; grid-template-columns: minmax(9rem, 14rem) minmax(0, 1fr) 5ch; gap: calc(var(--u) * 2); align-items: center; }
.cov__name { font-family: var(--face-ui); font-size: 0.8125rem; }
.cov__bar { height: 8px; background: var(--paper-sunk); box-shadow: inset 0 0 0 1px var(--rule); }
.cov__fill { height: 100%; background: var(--accent); }
.cov__n {
  font-family: var(--face-mono);
  font-variant-numeric: tabular-nums;
  font-size: 0.75rem;
  color: var(--ink-muted);
  text-align: right;
}

/* ==========================================================================
   Shared furniture
   ========================================================================== */
.section__head {
  display: flex;
  flex-direction: column;
  gap: var(--u);
  padding-bottom: calc(var(--u) * 2);
  border-bottom: 2px solid var(--ink);
}
.section__title {
  font-family: var(--face-display);
  font-size: 1.875rem;
  font-weight: 400;
  line-height: 1.15;
  letter-spacing: -0.018em;
}
.section__note { max-width: var(--measure); font-size: 0.9375rem; color: var(--ink-muted); }

.empty {
  max-width: var(--measure);
  padding: calc(var(--u) * 5) 0;
  color: var(--ink-muted);
  font-style: italic;
}

.toast {
  position: fixed;
  bottom: calc(var(--u) * 3);
  left: 50%;
  transform: translate(-50%, calc(100% + var(--u) * 6));
  z-index: 40;
  padding: calc(var(--u) * 1.4) calc(var(--u) * 3);
  background: var(--ink);
  color: var(--paper);
  border-radius: 2px;
  font-family: var(--face-ui);
  font-size: 0.8125rem;
  box-shadow: var(--shadow-lift);
  transition: transform 0.24s cubic-bezier(0.22, 0.61, 0.36, 1);
}
.toast[data-open="true"] { transform: translate(-50%, 0); }

/* ==========================================================================
   Narrow: the spine unbinds into a top bar
   ========================================================================== */
@media (max-width: 60rem) {
  .logbook { grid-template-columns: minmax(0, 1fr); }

  .spine {
    position: static;
    height: auto;
    gap: calc(var(--u) * 3);
    padding: calc(var(--u) * 3.5) calc(var(--u) * 3);
    border-right: 0;
    border-bottom: 1px solid var(--rule);
    overflow: visible;
  }
  .spine__sub { display: none; }
  .spine__head { flex-direction: row; align-items: baseline; gap: calc(var(--u) * 2); }

  .stamp { flex-direction: row; align-items: baseline; gap: calc(var(--u) * 1.5); padding-top: var(--u); }
  .stamp__num { font-size: 1.75rem; }

  .nav { flex-direction: row; overflow-x: auto; gap: calc(var(--u) * 2.5); }
  .nav__item { width: auto; flex: 0 0 auto; border: 0; padding: var(--u) 0; }
  .nav__item:first-child { border-top: 0; }
  .nav__item[aria-current="page"] {
    box-shadow: inset 0 -2px 0 var(--accent);
    padding-left: 0;
  }

  .gauge { margin-top: 0; grid-template-columns: repeat(3, auto); gap: calc(var(--u) * 3); }
  .spine__foot { border-top: 0; padding-top: 0; }

  .field { padding: calc(var(--u) * 5) calc(var(--u) * 3) calc(var(--u) * 12); }
  .cov { grid-template-columns: minmax(0, 1fr) 5ch; }
  .cov__bar { grid-column: 1 / -1; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

/* ==========================================================================
   Daily — components the base sheet does not carry

   Everything here belongs to a mechanic that only some sites turn on: the
   commitment gate, expiry, the attempts log, the forecast book. Tokens only,
   no literal colours, so a site theme retunes these along with everything
   else.
   ========================================================================== */

/* --- The gate ------------------------------------------------------------
   Deliberately heavy. It is the one thing on the page that stops you, and a
   stop that looks like a form field gets skipped. */
.gate {
  max-width: var(--measure);
  margin: calc(var(--u) * 4) 0;
  padding: calc(var(--u) * 3);
  background: var(--action-soft);
  border: 1px solid var(--action-line);
  border-left-width: 3px;
  border-radius: 2px;
}
.gate--done {
  background: var(--paper-sunk);
  border-color: var(--rule);
  border-left-color: var(--rule-strong);
}
.gate__intro {
  margin-bottom: calc(var(--u) * 2);
  padding-bottom: calc(var(--u) * 2);
  border-bottom: 1px solid var(--action-line);
}
.gate__intro p + p { margin-top: var(--lead); }
.gate__prompt {
  font-family: var(--face-display);
  font-size: 1.25rem;
  line-height: 1.35;
  margin-bottom: calc(var(--u) * 2);
}
.gate__field { min-height: calc(var(--lead) * 4); }
.gate__note {
  margin-top: var(--u);
  font-family: var(--face-ui);
  font-size: 0.8125rem;
  color: var(--ink-muted);
}
.gate__stamp {
  font-family: var(--face-mono);
  font-size: 0.6875rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-faint);
  margin-bottom: var(--u);
}
.gate__answer { white-space: pre-wrap; color: var(--ink-muted); font-style: italic; }
.gate__answer p + p { margin-top: var(--lead); }

.gate__fallback { margin-bottom: calc(var(--u) * 2); }
.gate__fallback summary {
  cursor: pointer;
  font-family: var(--face-ui);
  font-size: 0.8125rem;
  color: var(--ink-muted);
}
.gate__fallbacktext {
  margin: var(--u) 0;
  padding: calc(var(--u) * 2);
  background: var(--paper-raised);
  border: 1px dashed var(--rule-strong);
  font-size: 0.9375rem;
}

.gate__curtain {
  max-width: var(--measure);
  padding: calc(var(--u) * 4) 0;
  font-family: var(--face-ui);
  font-size: 0.9375rem;
  color: var(--ink-faint);
  border-top: 1px dashed var(--rule-strong);
}

/* --- Worked example ------------------------------------------------------ */
/* Sits directly under the failure mode, and has to read as the answer to it
   rather than as one more block of commentary. The accent rule and the raised
   stock do that; the first paragraph is the repair itself, so it gets the
   weight and the rest of the block stays quiet. */
.worked {
  max-width: var(--measure);
  margin: calc(var(--u) * 4) 0;
  padding: calc(var(--u) * 3);
  background: var(--paper-raised);
  border: 1px solid var(--rule);
  border-left: 3px solid var(--accent);
  border-radius: 2px;
}
.worked__body {
  margin-top: var(--u);
}
.worked__body p + p {
  margin-top: var(--lead);
}
/* The repair. Set in the reading face at full size so it can be compared
   against the specimen without the eye having to change gear. */
.worked__body p:first-child {
  font-size: 1.0625rem;
  line-height: 1.6;
  color: var(--ink);
}
/* What it changed, and what it cost. */
.worked__body p:last-child:not(:first-child) {
  font-family: var(--face-ui);
  font-size: 0.875rem;
  line-height: 1.55;
  color: var(--ink-muted);
  padding-top: calc(var(--u) * 1.5);
  border-top: 1px solid var(--rule);
}

/* --- Arithmetic gate ----------------------------------------------------- */
/* Same visual weight as the text gate, because it does the same job one notch
   harder. The gap is the only part that earns colour: over and under are
   different mistakes and the reader should be able to see which one they keep
   making without reading the number. */
.compute {
  max-width: var(--measure);
  margin: calc(var(--u) * 4) 0;
  padding: calc(var(--u) * 3);
  background: var(--action-soft);
  border: 1px solid var(--action-line);
  border-left-width: 3px;
  border-radius: 2px;
}
.compute--done {
  background: var(--paper-sunk);
  border-color: var(--rule);
  border-left-color: var(--rule-strong);
}
.compute__q {
  margin-top: var(--u);
  font-size: 1.0625rem;
  line-height: 1.5;
}
.compute__note {
  margin-top: var(--u);
  font-family: var(--face-ui);
  font-size: 0.8125rem;
  color: var(--ink-faint);
}
.compute__fields {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  gap: var(--u) calc(var(--u) * 2);
  margin: calc(var(--u) * 2) 0;
}
.compute__lab {
  font-family: var(--face-ui);
  font-size: 0.875rem;
  color: var(--ink-muted);
}
.compute__unit { color: var(--ink-faint); }
.compute__row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: calc(var(--u) * 2);
  margin: calc(var(--u) * 2) 0;
}
.compute__input {
  font-family: var(--face-mono);
  font-size: 1rem;
  font-variant-numeric: tabular-nums;
  padding: calc(var(--u) * 1.25) calc(var(--u) * 1.5);
  background: var(--paper-raised);
  color: var(--ink);
  border: 1px solid var(--rule-strong);
  border-radius: 2px;
  min-width: 10ch;
}
.compute__input:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}
.compute__result {
  margin-top: calc(var(--u) * 1.5);
  font-variant-numeric: tabular-nums;
}
.compute__gap {
  margin-top: var(--u);
  font-family: var(--face-ui);
  font-size: 0.875rem;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.compute__gap[data-dir="exact"] { color: var(--solid); }
.compute__gap[data-dir="over"],
.compute__gap[data-dir="under"] { color: var(--action); }

/* --- Evidence gate ------------------------------------------------------- */
/* Seven verdicts, four colours. The colour answers only "how much weight does
   this carry", which is the question the reader is actually asking; the label
   carries the distinction between, say, never-repeated and disputed. Giving
   each verdict its own hue would imply seven degrees of trust and there are
   not seven. */
.evidence {
  max-width: var(--measure);
  margin: calc(var(--u) * 3) 0;
  padding: calc(var(--u) * 2) calc(var(--u) * 2.5);
  background: var(--paper-sunk);
  border-left: 3px solid var(--rule-strong);
}
.evidence__cite {
  margin: calc(var(--u) * 0.75) 0 0;
  font-family: var(--face-mono);
  font-size: 0.875rem;
  line-height: 1.5;
  color: var(--ink);
}
.evidence__interval {
  margin: calc(var(--u) * 0.5) 0 0;
  font-family: var(--face-mono);
  font-size: 0.8125rem;
  font-variant-numeric: tabular-nums;
  color: var(--ink-muted);
}
.evidence__meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: calc(var(--u) * 1.5);
  margin: calc(var(--u) * 1.5) 0 0;
}
.rep-chip {
  font-family: var(--face-ui);
  font-size: 0.6875rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 2px 7px;
  border: 1px solid currentColor;
  color: var(--ink-muted);
}
.evidence__asat,
.evidence__stale {
  font-family: var(--face-ui);
  font-size: 0.75rem;
  color: var(--ink-faint);
}

.evidence[data-rep="replicated"] { border-left-color: var(--solid); }
.evidence[data-rep="replicated"] .rep-chip { color: var(--solid); }

.evidence[data-rep="single"],
.evidence[data-rep="contested"] { border-left-color: var(--shaky); }
.evidence[data-rep="single"] .rep-chip,
.evidence[data-rep="contested"] .rep-chip { color: var(--shaky); }

.evidence[data-rep="failed"],
.evidence[data-rep="overclaimed"] { border-left-color: var(--action); }
.evidence[data-rep="failed"] .rep-chip,
.evidence[data-rep="overclaimed"] .rep-chip { color: var(--action); }

.evidence[data-rep="statute"] { border-left-color: var(--accent); }
.evidence[data-rep="statute"] .rep-chip { color: var(--accent); }

/* Staleness is about the check, not the claim, so it marks the block without
   overriding the verdict colour the claim earned. */
.evidence[data-stale="1"] { border-left-style: dashed; }
.evidence[data-stale="1"] .evidence__stale { color: var(--action); }

/* --- Expiry -------------------------------------------------------------- */
.tag--lapsed {
  background: none;
  border: 1px solid var(--action-line);
  color: var(--action);
}
.pip--lapsed {
  background: none;
  border: 1px solid var(--rule-strong);
  width: 5px;
  height: 5px;
}

/* --- Attempts log -------------------------------------------------------- */
.attempt {
  display: flex;
  flex-direction: column;
  gap: var(--u);
  max-width: var(--measure);
  padding-bottom: calc(var(--u) * 3);
  margin-bottom: calc(var(--u) * 3);
  border-bottom: 1px solid var(--rule);
}
.attempt__past {
  padding-left: calc(var(--u) * 2);
  border-left: 2px solid var(--accent-line);
  white-space: pre-wrap;
}
.attempt__past span {
  font-family: var(--face-mono);
  font-size: 0.6875rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--ink-faint);
  margin-right: var(--u);
}
.attempt__new { display: flex; flex-direction: column; gap: var(--u); align-items: flex-start; }
.attempt__field { min-height: calc(var(--lead) * 2); }

/* --- Journal, gated entries --------------------------------------------- */
.note__label {
  font-family: var(--face-ui);
  font-size: 0.6875rem;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-faint);
}
.note__body--gate {
  color: var(--ink-muted);
  font-style: italic;
  padding-left: calc(var(--u) * 2);
  border-left: 2px solid var(--action-line);
}

/* --- Forecast seed, inside an entry -------------------------------------- */
.fc-seed {
  max-width: var(--measure);
  margin: calc(var(--u) * 4) 0;
  padding: calc(var(--u) * 3);
  background: var(--paper-sunk);
  border: 1px solid var(--rule);
  border-radius: 2px;
}
.fc-seed__q {
  font-family: var(--face-display);
  font-size: 1.125rem;
  line-height: 1.35;
  margin-bottom: calc(var(--u) * 2);
}
.fc-seed__row {
  display: flex;
  flex-wrap: wrap;
  gap: calc(var(--u) * 2);
  align-items: center;
}
.fc-seed__lab {
  font-family: var(--face-ui);
  font-size: 0.8125rem;
  color: var(--ink-muted);
  display: inline-flex;
  align-items: center;
  gap: var(--u);
}
.fc-seed__p, .fc-seed__d {
  font-family: var(--face-mono);
  font-size: 0.875rem;
  padding: 5px 7px;
  color: var(--ink);
  background: var(--paper-raised);
  border: 1px solid var(--rule-strong);
  border-radius: 2px;
}
.fc-seed__p { width: 4.5rem; }

/* --- Forecast book ------------------------------------------------------- */
.fc-group {
  max-width: var(--measure);
  margin-bottom: calc(var(--u) * 5);
  display: flex;
  flex-direction: column;
  gap: var(--u);
}
.fc-new__q { min-height: calc(var(--lead) * 2); }
.fc-row {
  display: flex;
  flex-wrap: wrap;
  gap: calc(var(--u) * 2);
  justify-content: space-between;
  align-items: flex-start;
  padding: calc(var(--u) * 2);
  background: var(--paper-raised);
  border: 1px solid var(--rule);
  border-left: 3px solid var(--rule-strong);
  border-radius: 2px;
}
.fc-row--ripe { border-left-color: var(--action); background: var(--action-soft); }
.fc-row--good { border-left-color: var(--solid); }
.fc-row--mid  { border-left-color: var(--shaky); }
.fc-row--bad  { border-left-color: var(--action); }
.fc-row__body { flex: 1 1 18rem; }
.fc-row__q { line-height: 1.4; }
.fc-row__meta {
  margin-top: 4px;
  font-family: var(--face-mono);
  font-size: 0.75rem;
  color: var(--ink-faint);
}
.fc-row__acts { display: flex; gap: var(--u); flex-wrap: wrap; }

/* --- Calibration plot ----------------------------------------------------
   Inline SVG because the CSP blocks every chart library, and because a
   ten-bucket scatter against a diagonal does not need one. */
.calwrap {
  max-width: var(--measure);
  margin-bottom: calc(var(--u) * 5);
}
.cal {
  display: block;
  width: 100%;
  max-width: 22rem;
  height: auto;
  margin: calc(var(--u) * 2) 0;
}
.cal__ref { stroke: var(--rule-strong); stroke-width: 1; stroke-dasharray: 3 3; }
.cal__axis { stroke: var(--rule-strong); stroke-width: 1; }
.cal__dot { fill: var(--accent); fill-opacity: 0.75; }
.cal__t {
  fill: var(--ink-faint);
  font-family: var(--face-ui);
  font-size: 9px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

<script>
/* Gross Margin - the architecture decisions a CFO later reports.
 *
 * The rule that keeps this honest is in the corpus, not the engine: every
 * entry cites a filing, a paper, or a benchmark with a stated n. The failure
 * mode for this subject is 150 days of confident heuristics with nothing
 * behind them, and it fails invisibly because the prose reads authoritative. */
window.SITE = {
  key: 'grossmargin.v1',
  slug: 'grossmargin',
  name: 'Gross Margin',
  eyebrow: 'Ledger',

{

  track: "pnl", level: "read",

{
  id: "pnl-bookings-billings-revenue",

  why: "ASC 606 sets out five steps: identify the contract, identify the performance obligations in it, determine the transaction price, allocate that price to the obligations, and recognise revenue when or as each obligation is satisfied. A hosted subscription is satisfied over time, so the revenue is recognised across the service period rather than at signature.\n\nThat produces three separate clocks. Bookings move the day the contract is signed and are a sales metric, not an accounting one. Billings move on the invoicing schedule, which may be annual up front. Revenue moves rateably as you deliver. A three-year deal signed today with an annual prepay is a large booking today, a large cash receipt today, and roughly one thirty-sixth of the contract value on this month's top line.",
  failureMode: "An announcement says the company just closed the biggest deal in its history and engineering sizes next year's capacity against that number. The bookings figure includes years two and three, which have no infrastructure cost yet and no revenue yet. Or the inverse: a team is told revenue is flat and concludes demand is flat, when billings and bookings both grew and the recognition just has not caught up.",
  experiment: "Read the revenue recognition policy note in Datadog's latest Form 10-K. Write down every performance obligation it names and mark each one as satisfied over time or at a point in time. Then take one real contract your service is on and state, in dollars, what it contributed to bookings, to billings and to revenue this month. Checkable output: three different numbers for one contract.",

{
  id: "pnl-gross-profit-your-service",
  track: "pnl", level: "model",
  title: "Gross profit is the only P and L line your architecture moves directly",
  source: "Berman and Knight, Financial Intelligence, Part Two; Datadog Form 10-K, consolidated statements of operations",
  idea: "Architecture changes the cost of delivering a unit of service, which is exactly the cost of revenue line, and therefore moves gross profit and nothing else on the income statement directly.",
  why: "Every architectural decision that changes production infrastructure cost lands in cost of revenue. Compaction strategy, storage tiering, per-tenant isolation, instance families, replication factor, retention defaults. Each one changes the numerator of your cost of revenue for a given amount of delivered service, and gross profit is what is left after that subtraction.\n\nEverything else your team does lands below gross profit. The engineers writing the change are R and D. The account team selling it is sales and marketing. Those lines move too, but not because of the architecture, and not on the timescale of a deploy. Gross profit is the one subtotal where a design review shows up in the numbers within a quarter.",

{
  id: "pnl-margin-points-vs-dollars",
  track: "pnl", level: "model",
  title: "Gross margin percentage and gross profit dollars answer different questions",
  source: "Berman and Knight, Financial Intelligence, Part Five (Ratios: Learning What the Numbers Are Really Telling You)",

  why: "The percentage is a ratio, so it moves for three distinct reasons: unit cost fell, price rose, or the mix shifted towards higher-margin business. Dollars move with volume as well. That means a growing product line with below-average margins adds gross profit dollars every month while dragging the percentage down, and a shrinking one does the opposite.\n\nWhich one you should optimise depends on what is scarce. If capital is scarce and you are being valued on margin structure, points matter. If you are trying to fund a team out of the business you generate, dollars matter. The mistake is not picking wrongly, it is not noticing there was a choice and quoting whichever number happens to look better.",

{
  id: "pnl-contribution-margin-per-tenant",
  track: "pnl", level: "model",
  title: "Contribution margin per tenant is not gross margin per tenant",
  source: "Berman and Knight, Financial Intelligence, Part Five; Storment and Fuller, Cloud FinOps, the unit economics chapter",
  idea: "Gross margin per tenant divides shared cost across tenants by some allocation rule, while contribution margin counts only the cost that actually disappears when the tenant does.",
  why: "Allocated cost is an accounting convention. If your control plane, your observability stack and your baseline node pool exist whether you have ninety tenants or ninety-one, then dividing their cost by tenant count produces a per-tenant number that is correct for reporting and wrong for every marginal decision. Contribution margin asks the only question a pricing meeting cares about: revenue from this tenant minus the cost that would go away if they left.\n\nThe gap between the two numbers is a direct readout of your architecture. In a fully shared multi-tenant plane, marginal cost per tenant is close to zero and contribution margin approaches the price. In a dedicated-namespace or dedicated-cluster model, the baseline nodes, the per-tenant control plane components and the per-tenant observability floor are all genuinely incremental, and contribution margin collapses towards gross margin. That gap is the number nobody else in the company can compute, because finance does not know the deployment topology and engineering does not read the P and L.",
  failureMode: "Sales asks whether they can discount thirty percent to win a dedicated-instance deal. You quote the blended per-tenant gross margin, which is healthy because it is dominated by shared-plane tenants, and the deal is approved. The tenant lands on a dedicated cluster whose incremental cost was never in that average, and the deal contributes nothing.",
  experiment: "Pick one tenant on your heaviest deployment model. List every cost line attributable to them and mark each one avoidable within ninety days of their departure or not. Sum the avoidable set. Divide it into their monthly revenue for contribution margin, then compute gross margin the allocated way for the same tenant. Checkable output: two percentages that differ, and the size of the gap in dollars.",
  reflection: "How large was the gap between allocated gross margin and contribution margin for that tenant, and what part of the architecture explains it?",

{

{

  track: "pnl", level: "decide",
  title: "Where an engineer's salary is booked changes reported gross margin",

{
  id: "pnl-cash-vs-accrual",
  track: "pnl", level: "read",
  title: "Cash accounting and accrual accounting disagree by design",
  source: "Berman and Knight, Financial Intelligence, Part Four (Cash Is King)",
  idea: "Profit and cash diverge because accrual accounting deliberately matches revenue and cost to the period the work happened, not the period the money moved.",
  why: "There are three structural sources of divergence. Revenue can be recognised before or after cash arrives, which produces deferred revenue on one side and accounts receivable on the other. Costs can be paid now and expensed later, which is what capitalisation and depreciation do. And some expenses never involve cash at all, share-based compensation being the largest one in software.\n\nFor an infrastructure team the sharpest example is a multi-year prepaid commitment. Pay three years of reserved capacity up front and the cash leaves this month, but the expense is spread across thirty-six months as the prepaid asset is consumed. The cash statement and the income statement will disagree about that decision for three years, and both will be right.",
  failureMode: "You negotiate a large prepaid commitment, present the full discount as a saving in the month you signed, and finance points out the income statement shows one thirty-sixth of it. Worse, treasury was not consulted and the cash outflow landed in a quarter where cash was the constrained resource, so a decision that improved profit over three years made the immediate position worse.",

  reflection: "For the commitment you charted, in which month is the gap between cash out and expense recognised the widest, and did anyone plan for it?",

{
  id: "pnl-deferred-revenue",
  track: "pnl", level: "read",
  title: "Deferred revenue is a liability that means the cash already arrived",
  source: "Datadog Form 10-K, deferred revenue note and consolidated balance sheets",
  idea: "Deferred revenue is a liability recording service you have been paid for and not yet delivered, so a growing balance is a customer-funded business rather than a risk.",
  why: "When a customer prepays annually, you take the cash and take on an obligation. Accounting records the obligation as a liability and releases it into revenue as you deliver, month by month. It is the cleanest single window into how accrual mechanics work, because you can watch a cash receipt sit on the balance sheet and then walk onto the income statement over the following year.\n\nIt also encodes your billing terms. Annual up front builds deferred revenue and funds operations with customer cash. Monthly in arrears builds accounts receivable instead, and the same ARR produces a very different cash profile. Deferred revenue does not capture contracted amounts that have not been invoiced yet, which is why registrants also disclose remaining performance obligations. If you want to know what infrastructure demand is already contracted, the remaining performance obligation disclosure is a better forward signal than revenue.",
  failureMode: "An engineer reads a rising liability line as leverage or debt and concludes the company is in trouble. Or, more expensively, capacity planning is driven off recognised revenue while the deferred revenue and remaining performance obligation disclosures both show a step change in contracted commitments landing next quarter that nobody in engineering has read.",
  experiment: "In Datadog's latest Form 10-K, find the deferred revenue note and the consolidated balance sheets. Record the current and non-current deferred revenue balances and the disclosure of how much of the opening balance was recognised as revenue during the year. Then ask your own finance team what fraction of your service's contracts bill annually up front. Checkable output: the two balances, the recognition figure, and one percentage for your own book.",
  reflection: "Does your service's billing mix build deferred revenue or accounts receivable, and who chose that?",

    a: "Because you have been paid for service you have not yet delivered, so you owe the customer performance. It sits on the balance sheet and releases into revenue as delivery occurs.\n\nGrowth in the balance means more customers paying up front, which funds the business with customer cash rather than with capital, and signals contracted revenue that has not hit the income statement yet."

{
  id: "pnl-balance-sheet-four-lines",

  title: "Four balance sheet lines move when an infrastructure team changes something",
  source: "Snowflake Form 10-K, consolidated balance sheets and the leases and commitments notes; FASB ASC 842, Leases",
  idea: "Property and equipment, capitalised internal-use software, accrued expenses, and lease and purchase commitments are the four places infrastructure decisions show up outside the income statement.",
  why: "Buying hardware or building out a facility creates property and equipment, an asset depreciated over its useful life rather than expensed at purchase. Capitalised internal-use software works the same way and amortises into cost of revenue. Your unpaid cloud bill at period end sits in accrued expenses, which is why a change in payment terms moves the balance sheet without touching profit at all. And multi-year committed spend agreements with cloud providers appear as purchase obligations in the commitments note, while colocation and facility leases appear as right-of-use assets and lease liabilities under ASC 842.\n\nThe reason this matters to you and not just to accounting is that the largest infrastructure decisions are often invisible on the income statement in the period they are made. Signing a three-year committed spend agreement changes no expense line this month and creates a disclosed obligation that every investor reads.",

{
  id: "pnl-free-cash-flow",
  track: "pnl", level: "model",
  title: "Free cash flow starts at net income and adds back what was never cash",
  source: "Snowflake Form 10-K, consolidated statements of cash flows and the non-GAAP free cash flow reconciliation",
  idea: "The indirect method walks from net income to operating cash flow by adding back non-cash expenses and working capital movements, and free cash flow is that figure less capital expenditure and capitalised software.",
  why: "The reconciliation is short and worth doing by hand once. Start at net income or loss. Add back share-based compensation, depreciation and amortisation, and any other non-cash charge, because they reduced profit and never touched cash. Then adjust for working capital: an increase in deferred revenue adds cash because you collected before you delivered, an increase in receivables subtracts it because you delivered before you collected. That gives net cash provided by operating activities. Subtract purchases of property and equipment and capitalised internal-use software, and you have free cash flow as most software registrants define it in their non-GAAP tables.\n\nOnce you have walked it, you can classify your own decisions. Reducing an accrued cloud cost hits both profit and cash. Capitalising development work reduces this year's expense but not this year's cash outflow. Share-based compensation reduces profit and never touches cash, which is how a company posts a large net loss and positive free cash flow in the same year.",
  failureMode: "A programme is reported to the board as having improved cash generation. What it actually did was move spend from expensed to capitalised, which improved reported operating income and left cash exactly where it was. Anyone reading the cash flow statement sees it immediately, and the credibility cost is larger than the number.",
  experiment: "Open Snowflake's latest Form 10-K, take the consolidated statements of cash flows, and recompute free cash flow from the line items using their stated definition in the non-GAAP reconciliation. Note the two largest add-backs. Then take your three largest cost decisions this year and classify each as hits profit only, hits cash only, or hits both. Checkable output: your free cash flow figure matches the filing, plus a three-row classification of your own decisions.",
  reflection: "Which of your cost decisions this year moved profit without moving cash, and did anyone describe it as a cash saving?",
  recall: {
    q: "Starting from net income, what are the main steps to free cash flow, and why can a loss-making company be free cash flow positive?",
    a: "Add back non-cash charges such as share-based compensation and depreciation and amortisation, adjust for working capital including deferred revenue and receivables, which gives operating cash flow, then subtract capital expenditure and capitalised software.\n\nA company can be loss-making and free cash flow positive because share-based compensation is a large non-cash expense and customer prepayments increase deferred revenue, both of which add cash back to a negative starting point."

{
  id: "pnl-non-gaap-margin",
  track: "pnl", level: "read",
  title: "Non-GAAP margin is management stating what it thinks is not the business",
  source: "Datadog Form 10-K and quarterly results Form 8-K, GAAP to non-GAAP reconciliation tables",
  idea: "Every non-GAAP adjustment is an editorial claim that a real cost is not part of the ongoing business, and the list of adjustments tells you what management wants you to ignore.",
  why: "Registrants are required to reconcile any non-GAAP measure back to the nearest GAAP one, so the argument is always printed. The usual exclusions in software are share-based compensation and the employer payroll taxes on it, amortisation of acquired intangibles, acquisition and integration costs, and restructuring. Each has a defence and each has a counter. Share-based compensation is the contested one, because it is unambiguously a cost of employing people, just not a cash one, and excluding it flatters both margin and profitability for a company that pays a large share of compensation in equity.\n\nThis reaches you directly. Non-GAAP gross margin typically excludes the share-based compensation allocated to cost of revenue and the amortisation of acquired intangibles that sits there. So the gross margin number quoted at your all hands is likely a point or two above the GAAP one, and if you benchmark your internally computed service margin against a competitor's headline figure you are comparing two different measures.",
  failureMode: "You compute your service's gross margin on a full GAAP basis, including allocated share-based compensation for the support engineers, and compare it to a peer's non-GAAP headline. You conclude your architecture is uncompetitive and propose a migration. The gap was measurement, not architecture, and you find out after the design doc is circulated.",

  recall: {

{
  id: "pnl-write-your-own",

{
  id: "cogs-four-components",
  track: "cogs", level: "read",

{
  id: "cogs-focus-schema",
  track: "cogs", level: "read",
  title: "FOCUS gives every cloud bill one schema and one set of column names",
  source: "FinOps Foundation, FOCUS specification version 1.0",
  idea: "FOCUS is an open specification that defines a common schema, column names and allowed values for billing data, which is what makes cross-provider cost analysis a query rather than a project.",
  why: "Before FOCUS, every provider exported its own billing file with its own column names, its own words for the same concept and its own treatment of commitments and credits. Any cross-provider report meant writing and maintaining a bespoke normaliser per provider, which is why most organisations never had one. FOCUS defines required columns with defined semantics, including BilledCost and EffectiveCost, ListCost and ContractedCost, ChargeCategory, ServiceCategory, resource and SKU identifiers, quantities and units, and charge period timestamps.\n\nThe pair worth internalising is BilledCost against EffectiveCost. BilledCost is what appeared on the invoice for that charge period. EffectiveCost amortises commitment purchases across the period they cover, so a three year prepayment stops appearing as one enormous month. Report a unit cost trend on BilledCost and it will jump on the month you bought a commitment; report it on EffectiveCost and it reflects the economics. Which column you picked is the first question anyone competent will ask about your chart.",

  recall: {
    q: "What is the difference between BilledCost and EffectiveCost in FOCUS, and when does it matter?",

{
  id: "cogs-allocation-model",
  track: "cogs", level: "model",
  title: "A bill becomes a cost only after allocation",
  source: "Storment and Fuller, Cloud FinOps, cost allocation chapter",
  idea: "A provider invoice is organised around the provider's billing constructs, so nothing on it is attributable to a tenant, a team or a feature until you push it through an allocation model you can explain out loud.",
  why: "The bill is grouped by account, service, region and SKU because that is how the provider sells. Your business is organised by tenant, product line and team. Allocation is the mapping function between those two shapes, and every per-tenant number you ever quote is a claim about that function rather than a reading off an invoice. If you cannot describe the mapping in three sentences, you do not have a number, you have an output.\n\nThe useful discipline is to force the allocation into three buckets that must sum to the invoice. Directly attributable spend carries a tenant or team identifier on the resource. Shared but allocable spend is real shared infrastructure with a defensible driver, such as a control plane or a shared cluster. Unattributable spend is everything else. Reconciling to the invoice to the dollar is what stops the model quietly dropping charge types nobody mapped, which is the most common way a cost model ends up confidently wrong.",
  failureMode: "A per-tenant cost model built from tagged compute reports total tenant cost 40 per cent below the invoice. Nobody notices, because the model was never reconciled to the bill. The missing spend was support charges, data transfer and an untagged managed database, and the margin conclusion drawn from it was wrong in the direction that flattered the team.",
  experiment: "Take last month's invoice total for one account. Produce three subtotals: directly attributable, shared but allocable, unattributable. Check they sum to the invoice within a dollar. If they do not, the difference is a charge type your model does not know exists, and finding it is today's work.",

{
  id: "cogs-tag-taxonomy",
  track: "cogs", level: "decide",
  title: "A tag taxonomy is negotiated before it is designed",
  source: "FinOps Foundation, FinOps Framework Allocation capability; Storment and Fuller, Cloud FinOps, tagging and metadata chapter",
  idea: "The hard part of tagging is agreeing whose budget owns a resource, which is a political decision that happens to have a technical artefact as its output.",

{
  id: "cogs-shared-cost-rule",
  track: "cogs", level: "model",
  title: "Shared cost needs an allocation rule you can defend in a room",
  source: "FinOps Foundation, Allocation guidance on even split, proportional and fixed-rate shared cost methods",
  idea: "Shared infrastructure gets allocated by even split, proportional to a usage driver, or at a fixed rate, and the choice changes which of your tenants looks unprofitable.",
  why: "Even split divides shared cost equally across consumers. It is simple, it survives audit, and it makes your smallest tenants look catastrophic because a trial account carries the same share of the control plane as your largest enterprise. Proportional allocation spreads cost by a usage driver such as compute hours, storage or request count. It tracks reality better but only if the driver is causally related to the shared cost, and picking a driver is where most of the argument lives. Fixed-rate allocation charges a rate agreed in advance per unit, so consumers get a predictable number and the shared pool absorbs the variance.\n\nThe point of computing all three is that it converts an argument about fairness into a table. Once people can see that their per-tenant cost moves by a factor of four depending on the method, the conversation stops being about whether the platform team is padding its numbers and starts being about which driver best describes what actually consumes the control plane.",

{
  id: "cogs-commitment-duration-bet",
  track: "cogs", level: "model",
  title: "Committed use discounts are a duration bet, not a discount",

  idea: "A commitment exchanges a rate discount for an obligation to pay for a fixed term regardless of usage, so price it as an instrument with a break-even and a downside rather than as free money.",
  why: "There is a clean identity here. If the commitment gives you a discount of d against on-demand, and you commit to quantity Qc but only consume Qu, the commitment beats on-demand exactly when Qu divided by Qc exceeds 1 minus d. That is your break-even utilisation, and it is computable the moment the provider tells you the discount for the term and payment option you are considering. Read the discount off the provider's own pricing page for your term rather than assuming a number.\n\nWhat you are buying with that discount is term risk. Demand can fall, a tenant can churn, a rearchitecture can move you off the instance family or the service entirely, and a provider migration or a region change can strand the commitment. Longer terms carry larger discounts precisely because they carry more of this risk. The right analysis is not \"can we afford the commitment\" but \"what is the probability-weighted cost of the scenarios where we do not use it\", and the engineering roadmap is the best evidence anyone has about those scenarios. That evidence lives with you, not with finance, which is why you should be in the meeting.",
  failureMode: "Finance buys a three year commitment on a compute family in month one of a two year plan to move that workload to a managed service. The migration lands, the commitment keeps billing, and the saved engineering cost is offset by stranded capacity for eighteen months. Nobody was wrong individually; the roadmap and the purchase never met.",
  experiment: "Get the discount percentage the provider publishes for the term and payment option you are being offered. Compute break-even utilisation as one minus that discount. Then pull the last twelve months of your baseline usage for the resource in question and count how many months fell below that break-even line. Write down the number of months and take it to whoever signs the commitment.",
  reflection: "How many of the last twelve months would have failed the break-even test, and what on your roadmap could push a future month below it?",
  recall: {
    q: "State the break-even condition for a committed use discount and say what you are actually buying.",
    a: "With a discount d and a committed quantity Qc, the commitment beats on-demand when consumed quantity Qu divided by Qc is greater than 1 minus d. Below that utilisation you have paid more than on-demand would have cost.\n\nWhat you buy is a rate discount in exchange for term risk: churn, demand decline, rearchitecture or migration can all strand the commitment, and the engineering roadmap is the best available evidence on those scenarios."

  source: "Wang and Casado, The Cost of Cloud, a Trillion Dollar Paradox (Andreessen Horowitz, 2021)",
  idea: "Gross margin on an infrastructure product is decided in a handful of design reviews and merely measured at the close.",
  why: "Cost of revenue for a hosted product is mostly cloud spend, and cloud spend is a function of a short list of design choices: the tenant isolation model, the idle floor you cannot scale away, the replication factor, the default data retention, and how much traffic crosses a billed boundary. Every one of those is chosen in engineering, written into contracts and client behaviour, and expensive to reverse. Finance has two levers by comparison: raise price, and negotiate a committed-use discount. Both are worth single-digit points. An isolation model is worth a multiple.\n\nWang and Casado's argument runs the causation in that direction deliberately. They take public software companies, look at what cloud spend does to cost of revenue as those companies scale, and put a market value number on the aggregate effect across the top fifty. Read it for the direction rather than the headline: infrastructure design is treated as the independent variable and reported margin as the output.",
  failureMode: "The margin conversation starts when a CFO flags cost of revenue in a board deck, which is roughly two years after the isolation model was chosen. By then the per-tenant database, the per-tenant cluster and the ninety day retention default are all in signed agreements, so the only fix anyone can execute this quarter is a discount negotiation worth three points against a design decision that was worth thirty.",
  experiment: "Open last month's cloud bill and sort by spend. Take the top five line items. For each one, name the architecture decision that created it and the date that decision was taken. Output is a five row table with a date in every row. Any row where you cannot name a decision is spend that nobody chose.",
  reflection: "Which of your top five cost lines came from a decision that was never written down, and who would you have had to convince at the time?",
  recall: {
    q: "Why can finance not fix gross margin on an infrastructure product, and what can it actually move?",
    a: "Because the cost side is set by isolation model, idle floor, replication, retention and data movement, all chosen in engineering and locked in by contracts and client behaviour. Finance can move price and negotiate committed-use discounts.\n\nThose are worth a few points. Architecture choices are worth multiples of that, which is why the design review is the real margin meeting."
  },
  deepDive: "Here are my top five cloud cost lines and the architecture decision behind each; help me work out which ones are still reversible and what reversing them would cost in engineering months."

{
  id: "architecture-silo-pool-bridge",
  track: "architecture", level: "read",
  title: "Silo, pool and bridge are the three tenant isolation models",
  source: "AWS Well-Architected SaaS Lens, tenant isolation; AWS SaaS Factory isolation guidance",
  idea: "There is a published taxonomy for multi-tenant isolation and naming which one you run is the precondition for costing it.",
  why: "The SaaS Lens splits isolation into three models. Silo gives each tenant dedicated resources, so cost scales with tenant count regardless of how much any tenant uses. Pool shares resources across tenants and enforces the boundary in code and policy, so cost scales with aggregate usage. Bridge mixes the two, typically siloing the storage tier and pooling compute, or siloing the largest tenants and pooling the rest.\n\nThe taxonomy matters because these three have different cost functions, not different cost levels. Silo is a per-tenant fixed cost with a slope near zero. Pool is a near-zero fixed cost with a usage slope. Bridge is the sum. You cannot compare two designs, or forecast what a hundred more tenants does to your bill, until you know which function you are on. Most teams run bridge and describe themselves as multi-tenant, which is the vaguest possible answer.",
  failureMode: "An engineer says 'we are multi-tenant' in a cost review and the room hears 'pooled'. The actual shape is a shared compute plane and a database per tenant, so every new tenant adds a fixed monthly cost before they run a single query. The forecast built in that meeting assumes cost grows with usage and it grows with logo count instead, which is exactly wrong for a company signing small tenants.",
  experiment: "Draw your request path from ingress to storage. Label each tier silo, pool or bridge. Then, for each silo tier, write the monthly cost of one empty tenant on that tier. Output is a labelled diagram plus one dollar figure per silo tier. If you have no silo tiers, check the storage layer again.",
  reflection: "Which tier of yours is silo for reasons that were about isolation, and which is silo because it was simply easier to build that way?",
  recall: {
    q: "Name the three isolation models in the AWS SaaS Lens and the cost function each implies.",
    a: "Silo means dedicated resources per tenant, so cost is a fixed amount per tenant with almost no usage slope. Pool means shared resources with the boundary enforced in code, so cost has a near-zero fixed term and scales with aggregate usage.\n\nBridge mixes them per tier and carries both terms. Knowing which one you are on is what lets you forecast the bill against tenant count rather than guessing."

{
  id: "architecture-isolation-margin-points",
  track: "architecture", level: "model",
  title: "Per-tenant isolation costs a countable number of margin points",
  source: "AWS Well-Architected SaaS Lens, tenant isolation; your own cloud bill and tenant count",
  idea: "The gap between your isolation model and a pooled alternative converts directly into gross margin points once you divide it by revenue.",
  why: "The arithmetic is short. Take the monthly cost of every resource that exists because tenants are separated: dedicated namespaces, databases, brokers, load balancers, node pools, the control plane per cluster. Call that S. Estimate what the same workloads cost pooled, call that P. The annual difference is twelve times S minus P. Divide that by annual revenue and multiply by a hundred and you have the number of gross margin points your isolation model costs. That is a sentence a CFO can act on and an engineer can defend.\n\nThe reason nobody computes it is that it needs both halves. Finance has revenue and cost of revenue but cannot tell you which resources exist for isolation reasons. Engineering knows exactly which resources those are but does not have the revenue denominator or the habit of expressing anything as a margin point. The intersection is one afternoon of work and it is currently unowned.",
  failureMode: "The team defends per-tenant isolation on security grounds without ever pricing it, so the choice never gets tested. Then a competitor prices twenty per cent below you on the same workload and nobody in the building can say whether that is a better cost structure or venture-funded discounting, because your own number was never computed.",
  experiment: "Tag or filter your bill to isolate every resource that is per-tenant. Sum it for last month, that is S. Estimate the pooled equivalent by taking aggregate utilisation across those resources and sizing for peak plus headroom, that is P. Get annual revenue from your finance business partner, this is the one number you cannot derive. Output: one number, in margin points, with your working shown.",
  reflection: "What is your isolation model costing in margin points, and is that number small enough that you would put it in a board deck yourself?",
  recall: {
    q: "How do you convert an isolation decision into margin points, and which input has to come from finance?",
    a: "Sum the monthly cost of every resource that exists only because tenants are separated, estimate the pooled equivalent, annualise the difference, then divide by annual revenue and multiply by a hundred.\n\nRevenue is the only input you cannot derive from your own bill. Ask your finance business partner for the recognised revenue figure for the same period, so the numerator and denominator cover the same months."
  },
  deepDive: "I will paste my per-tenant resource list and monthly costs; help me build the pooled counterfactual honestly, including what I would have to build to make pooling safe."

{
  id: "architecture-database-tenancy-shapes",
  track: "architecture", level: "model",
  title: "Database multi-tenancy has three shapes and three cost curves",
  source: "AWS Well-Architected SaaS Lens, data partitioning guidance; PostgreSQL documentation on schemas, databases and connections",
  idea: "Shared schema, schema per tenant and database per tenant differ mainly in fixed overhead per tenant, and that overhead dominates the bill when tenants are small.",
  why: "Shared schema puts a tenant identifier on every row, so the marginal cost of a tenant is the bytes they store plus the query load they generate. Schema per tenant multiplies the object count in one catalogue: every tenant brings its own tables, indexes and statistics, and planning, autovacuum and migration all scale with that object count. Database per tenant multiplies whole instances or at minimum whole catalogues, each with its own connection pool, background workers and backup schedule.\n\nThe curve crossing point is what matters. At a hundred large tenants, per-tenant databases are defensible and the operational isolation is genuinely worth something. At ten thousand small tenants, the fixed overhead per tenant swamps the data itself and you are paying to run empty machinery. Migrations make it worse in a way that never shows on the cloud bill: a schema change against one shared table is one statement, and against ten thousand schemas it is a rollout with its own failure budget and engineer weeks attached.",
  failureMode: "A team picks database per tenant for a product sold to enterprises, then launches a self-serve tier on the same architecture. Free trials each provision a database. Six months later the largest single cost line is idle databases belonging to tenants who never converted, and the tenant offboarding job that was meant to reclaim them was never written.",
  experiment: "Count your tenants and split them into deciles by stored bytes. For the bottom five deciles, compute total infrastructure cost divided by tenant count and compare it to their stored bytes at your provider's per-gigabyte rate. Output: the ratio of what a small tenant costs you to what their data alone would cost. Anything above five means you are paying for structure, not storage.",
  reflection: "At what tenant size does your current database tenancy model stop making sense, and how many of your tenants are already below that line?",
  recall: {
    q: "Why does schema per tenant get expensive in a way that is invisible on the storage line?",
    a: "The cost is object count rather than bytes. Every tenant adds tables, indexes and statistics to one catalogue, so planning, autovacuum and backup work all scale with tenant count independent of how much data anyone stores.\n\nThe worst part lands in engineering time rather than the bill: a migration that is one statement on a shared table becomes a staged rollout across thousands of schemas with its own failure modes."
  },
  deepDive: "My tenancy model at the database tier is X and my tenant size distribution is Y; help me find the crossing point where the model stops paying for itself."

{
  id: "architecture-namespace-vs-cluster",
  track: "architecture", level: "model",
  title: "Namespace per tenant and cluster per tenant differ mostly in control plane cost",
  source: "Kubernetes documentation, Multi-tenancy; Kubernetes SIG Multitenancy guidance; your provider's managed control plane pricing page",
  idea: "Cluster per tenant buys a harder boundary and pays for it in a fixed monthly cost multiplied by cluster count, most of which is spent before any tenant workload runs.",
  why: "The Kubernetes multi-tenancy documentation is explicit that namespaces are a soft boundary. They partition names and give you a place to hang quotas, network policy and RBAC, but the control plane, the nodes, the kernel and the CNI are shared. Cluster per tenant makes the boundary hard and duplicates everything below it.\n\nPrice the duplication rather than arguing about it. Per cluster you pay a managed control plane fee, a minimum node count that can never be zero because system daemons have to land somewhere, one copy of every cluster-scoped agent you run for logging, metrics, policy, service mesh and secrets, and at least one load balancer. Multiply that by cluster count and you have the floor. Then divide by tenants per cluster, which for cluster per tenant is one, and you have a per-tenant fixed cost that no amount of usage growth dilutes.",
  failureMode: "A cluster per tenant design is approved on isolation grounds, and the observability agents get added later without anyone re-running the cost model. Each cluster now runs a metrics agent, a log shipper, a policy controller and a mesh control plane, all sized by defaults written for a large shared cluster. The agents cost more than the tenant workload, and because they are the same in every cluster the waste is perfectly proportional to the number of tenants you win.",
  experiment: "Pick your smallest tenant cluster. Sum: the managed control plane fee, the cost of the minimum node set, every DaemonSet and cluster-scoped controller running on it, and its load balancers. That total is your per-cluster floor. Multiply by cluster count. Output: two numbers, the floor per cluster and the total, plus that total as a percentage of your monthly infrastructure spend.",
  reflection: "What fraction of your compute bill is being spent on clusters before a single tenant request arrives, and would you have approved that number if it had been on the design doc?",
  recall: {
    q: "What exactly do you pay extra for when you move from namespace per tenant to cluster per tenant?",
    a: "A managed control plane fee per cluster, a non-zero minimum node set because system daemons must be scheduled, one copy of every cluster-scoped agent for logging, metrics, policy and mesh, and at least one load balancer.\n\nAll of it is fixed cost per cluster, so with one tenant per cluster it becomes a fixed cost per tenant that usage growth never dilutes."
  },
  deepDive: "Here is the agent and DaemonSet list from one of my clusters with resource requests; help me compute the true per-cluster floor and which of those agents could run centrally instead."
