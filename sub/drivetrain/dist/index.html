<script>
/* Track: Outcome first. Ordered foundational first. */
(window.LESSONS = window.LESSONS || []).push(
{
  id: "outcome-problem-approach-impact",
  track: "outcome",
  title: "Problem, approach, impact - and the impact has a number",
  source: "Standard staff-work practice",
  gatePrompt: "Take the last technical update you posted, or the one you are about to. Rewrite it in three parts - the problem in business terms with a number, the approach in one sentence, the impact with a number - and move every remaining mechanism behind a link or delete it.",
  fallback: "Update on workflow reliability: I've added a dead-letter queue for failed Temporal activities. Activities that exhaust their retry policy (exponential backoff, max 10 attempts) are now written to a DLQ table with the full payload and error, and there's a replay CLI to re-enqueue them once the root cause is fixed. Also added a Grafana panel for DLQ depth and an alert at 50 items. PR is merged, rolling to prod tomorrow.",
  cheat: "Problem with a number, approach in one sentence, impact with a number, and the mechanism last or behind a link.",
  idea: "Open with the problem in the reader's terms and a number, give the approach in one sentence, and close with the impact as a number. The mechanism is the part you are proudest of and the part the reader needs least.",
  why: "Leaders read an update to decide whether to worry, decide or move on. A mechanism-first update makes them reconstruct the problem from the fix, and most will not; they file it as engineering housekeeping. The same work, introduced by what was going wrong for customers and what it cost, reads as risk removed - something they track, and repeat to the people they report to.\n\nThe order is also a test of you. If you cannot write the problem line without the words queue, retry or table, you may not yet know which business problem the work solved. Finding that out before the update goes out is far cheaper than finding out when someone in the meeting asks so what.",
  failureMode: "A careful update about dead-letter queues, retry policies and a replay tool goes to a leadership channel. It collects two emoji and no questions. Three weeks later a customer escalation about silently lost jobs reaches the same people, and nobody connects it to the fix that already prevents it, because the update never said that was what it was for.",
  worked: "Problem: about 1 in 400 customer workflow runs fails after its retries and goes unnoticed - roughly 30 jobs a week across 12 customers, each discovered only when a customer notices missing data and opens a ticket. Approach: failed runs are now kept, alerted on, and replayable once the cause is fixed. Impact: from tomorrow's rollout no failed run goes unnoticed, and the 6 to 8 lost-job tickets support handles each week should fall to near zero. I will post the actual count in two weeks. Mechanism and PR linked for anyone who wants them.\n\nThe dead-letter queue, the retry policy and the alert all survived, as one link. What it cost is that every number had to be found: the failure rate came from workflow history, the ticket count from support, and the two took an afternoon. That afternoon was the real work of the update. If the numbers cannot be found, the update is not ready, and it is better to learn that before posting than in the meeting.",
  experiment: "Before you post your next update, write its problem line first, in words your head of sales would use, with one number. If you cannot finish the line without a technical noun, find out what the work protects before you send anything.",
  reflection: "Of your last three updates, how many opened with a mechanism, and what would each first line have been if it had opened with the problem?",
  recall: {
    q: "What order does a platform update take, and what does writing the problem line first test?",
    a: "The problem in business terms with a number, the approach in one sentence, the impact with a number. The mechanism goes last or behind a link.\n\nIf you cannot write the problem line without a technical noun, you may not yet know which business problem the work solved."
  },
  deepDive: "Here is a technical update I am about to send. Rewrite only its first line as a business problem with a number, and list the numbers I need to go and find for the rest."
},
{
  id: "outcome-which-means",
  track: "outcome",
  title: "Keep saying 'which means' until the sentence ends in a customer or a dollar",
  source: "Standard product-marketing practice",
  gatePrompt: "Pick one line in your latest update that describes a mechanism: a retry policy, a scaling rule, a queue. Write it down, then add 'which means' and finish the sentence, and repeat. Stop when the last clause names something a customer sees or a dollar figure. If a link feels forced, write down where the chain broke.",
  fallback: "Platform update: connector retries now use exponential backoff with jitter (10s base, 5 min cap, 15 attempts, previously 5 attempts at a fixed 10s). Also raised the agent gateway upstream timeout from 30s to 60s and moved vector index compaction to 02:00 UTC. All three are merged and roll out behind flags this week.",
  idea: "Say 'which means' after a mechanism, and again after each answer, until the sentence lands on a customer's experience or a dollar figure. Every link has to change what a person sees, does or pays. A link that only restates the mechanism in other technical words is a synonym, and you are still describing the mechanism.",
  why: "Every mechanism sits several steps upstream of anything a customer notices, and you have climbed those steps so often that they feel like one. The listener has not climbed them and will not: they hear 'retry policy', file it as plumbing and move on. Salespeople are taught the same move as feature to benefit. The feature is what the thing is, the benefit is what changes for the buyer, and only the benefit gets repeated in a meeting you are not in.\n\nSaying 'which means' works because it makes each step small enough to check. A link has to change what some person sees, does or pays. 'More resilient' and 'better utilisation' fail that test, because nobody can see either. The chain also shows you where your knowledge ends. The step where you start guessing about customers is the step to go and measure, or the sign that the work is housekeeping and should be called that.",
  failureMode: "The update says 'exponential backoff with jitter' and a director replies 'nice'. Six weeks later a customer escalates a failed nightly sync. The account manager asks what platform did about retries, the director remembers something about backoff, and the customer is told retries were improved. Nobody can say that a sync now retries for fifty minutes, and that this one failed because the customer's own system was down for ninety minutes.",
  worked: "The line repaired is 'exponential backoff with jitter, 10 second base, 5 minute cap, 15 attempts'. Which means a sync that hits a failing source system keeps retrying for about fifty minutes, where it used to give up after five attempts in forty seconds. Which means a customer's nightly sync rides out a source system that is down for twenty minutes instead of failing within a minute. Which means they open their dashboard to fresh data, not a failed-sync email. Workflow history and support's tickets say 60 of last month's 85 failed syncs succeeded when re-run by hand within half an hour. The update line: 'A failing customer sync now retries for about fifty minutes, not forty seconds. Last month that would have saved roughly 60 of 85 failed syncs.'\n\nJitter stayed in the PR. Its chain ran 'which means retries from different tenants do not arrive together' and stopped, because no customer has yet seen that pile-up. Finding the 60 and the 85 cost two hours across workflow history and support's ticket tags. Its last link is a prediction that next month can prove wrong, and the update says backoff only covers outages shorter than fifty minutes.",
  experiment: "Write the 'which means' chain under every mechanism line in this week's update. Mark any chain that stalls before a customer or a dollar, and find the one number its last link needs, such as ticket tags, a billing line or workflow history. Replace the mechanism with that sentence, or label the line housekeeping.",
  reflection: "Which of your recent changes stalls before it reaches a customer or a dollar: is it housekeeping, or do you not yet know what it protects?",
  recall: {
    q: "What makes a 'which means' link a consequence rather than a synonym, and where does the chain stop?",
    a: "A consequence changes what some person sees, does or pays. A synonym restates the mechanism in other technical words. The chain stops at the first clause naming a customer's experience or a dollar figure.\n\nA chain that stalls before then is a finding: the work is housekeeping, or there is a number to go and find."
  },
  deepDive: "Here are the mechanism lines from an update I am about to send. Write the 'which means' chain under each one, mark the links that are guesses I would have to measure, and tell me where each chain should stop."
},
{
  id: "outcome-before-after",
  track: "outcome",
  title: "Show the change as a before and after, in the customer's terms",
  source: "Standard copywriting practice",
  gatePrompt: "Take a change you have shipped or are about to ship. Write two sentences about one customer on one bad day: before, what they saw and who found out first; after, the same day with your change and what we now do. Use the customer's verbs and leave out every component name.",
  fallback: "Release notes, agent platform 4.12: added a regression gate to the prompt release pipeline. On every prompt change the evaluation service runs 300 golden questions through the candidate, scores the answers with an LLM judge on faithfulness and completeness, and blocks promotion if either mean score drops more than 0.05 against the production prompt. Scores are on the eval Grafana board and posted to the release channel.",
  idea: "Describe one customer on one bad day, then the same day with your change. Hold the failure constant and change who finds out first and what happens next, because platform work rarely stops the failure and usually changes who notices. Build both sentences the same way, so the only thing that moves is the change.",
  why: "A number says how much and a pair says what it felt like. 'Failed runs down 90 per cent' asks the listener to supply the scene, and most will not. A before and after supplies it with one thing changed, so the difference is the whole message. The before also works as recognition: leaders have usually lived that day as an escalation or a renewal call, and the after earns credit by contrast with a day they remember.\n\nThe form is honest only when the failure stays constant. Most platform work does not stop things breaking; it changes who finds out first and how long that takes. 'It no longer fails' is a claim you cannot keep, and the first failure ends the credit. 'The same failure, found by us in twenty minutes instead of by a customer in nine days' survives the next incident. The before has to be a dated event too, because a hypothetical before invites the question of whether it has ever happened.",
  failureMode: "The release note says 'regression gate' and 'LLM judge', and leadership reads that as no more bad prompt changes. Two months later a customer's agent starts refusing questions after a prompt change in an area the 300 questions never covered. The account team had mentioned the gate to that customer a month earlier, and the customer asks what it was for. The gate worked as built. Nobody had described the day it changes, so everyone supplied their own.",
  worked: "The release note described a gate and a judge but no day a customer would recognise. Before: after a prompt change in March, a customer's support agent began refusing questions it used to answer. The customer noticed on day nine and opened a ticket, and we rolled the change back the next day. After: a change like that, on any behaviour our test questions cover, is stopped within twenty minutes of being made, the author is told which questions broke, and no customer sees it. The failure is the same in both. What changed is who finds out first, and when.\n\nThe pair demanded three things. The March day had to be found in ticket history, an hour's work that produced the nine days. The after had to be rehearsed: I pushed a deliberately bad prompt through the pipeline on staging and watched the gate fail it in eighteen minutes, because an after I had not seen would be a guess. And the after had to carry its limit, which is why it says 'on any behaviour our test questions cover'. 'A bad prompt can no longer reach a customer' is a bigger promise than the gate can keep.",
  experiment: "Find one real day from the last quarter when the problem your latest change addresses reached a customer: a ticket, an escalation, a missed sync. Write the before from that day, then the after for the same day, naming who finds out first in each. Put the pair at the top of the update or the PR.",
  reflection: "In the pair you wrote, who found out first before and who finds out first now, and does your update say so?",
  recall: {
    q: "What should stay constant between the before and the after, and why does holding it constant make the claim safer?",
    a: "The failure. Platform work seldom stops things breaking; it changes who finds out first and what happens next, so the same failure in both halves is a claim the next incident will confirm.\n\nThe before should be a dated event rather than a hypothetical, so nobody can dismiss it as something that never happens."
  },
  deepDive: "Here is a change I am about to announce. Help me find the real before, a specific day it hurt a customer, and write the pair so that only who finds out and what happens next differ."
},
{
  id: "outcome-three-floors",
  track: "outcome",
  title: "Prepare the update at three floors, and pitch at the one your listener stands on",
  source: "Gregor Hohpe, The Software Architect Elevator",
  gatePrompt: "Take the last change you shipped. Write it three times in one sitting: one line a vice president could repeat in a corridor, one paragraph a director could forward unedited, and a title and link for the engineers' document. Then check that the document backs every claim in the paragraph, and the paragraph every claim in the line.",
  fallback: "Sandbox provisioning now draws from a warm pool instead of creating a vcluster per request. A controller keeps six pre-built vclusters ready and refills the pool when fewer than three remain. A claimed vcluster is reset in place rather than rebuilt. Median time to a usable sandbox went from 41 minutes to 3. The pool costs about $1,400 a month in idle nodes. Merged to main, rolling to prod Thursday.",
  idea: "Prepare every change at three floors: one line for the executive, a paragraph for the director, the document for engineers. Each floor has its own vocabulary and its own question. Pitch at the floor your listener stands on, go down a floor only when they ask, and make sure each floor can defend the one above it.",
  why: "Hohpe's picture is an elevator between the engine room, where systems are built, and the penthouse, where the company's direction and budget are set. The floors differ in more than detail: each speaks its own language and asks a different question. The executive asks whether anything they have promised is now at risk, the director whether this changes the plan and what you need from them, the engineer how it works and what could break. Someone has to carry the message between floors without losing it, and only someone who understands the engine room can do that honestly.\n\nYou cannot choose which floor you will be asked on. A vice president asks in a corridor and gives you ten seconds, a director asks in a one-to-one and gives you two minutes, an engineer asks in a review and gives you an hour. Preparing all three before anyone asks lets you answer at the listener's floor. Writing them together also keeps them honest: a line its paragraph cannot defend is a slogan, and a paragraph its document cannot back is a promise.",
  failureMode: "A vice president asks in the lift how the sandbox work is going. You give the version you gave the engineers on Tuesday: warm pool, reset in place, refill threshold. The doors open before you reach anything about customers. In the next leadership meeting the work is described as 'platform tuning the sandbox pool', and the sales director who needed to know that demos can now start in the first call never hears it.",
  worked: "The PR described a warm pool, a controller and a reset, and nothing a customer would recognise. Executive line: 'Customer sandboxes now open in 3 minutes instead of 41, so a demo can start in the first call.' Director paragraph: 'Sales engineering requests about 30 sandboxes a week, and each used to take 41 minutes, so most demos were booked for the next day. A pool of pre-built environments now hands one over in a median of 3 minutes, for about $1,400 a month in idle capacity. More than six requests in an hour drains it and falls back to 41 minutes. Nothing is needed from you unless you want it bigger: each extra six environments costs about the same again.' Engineers' document: the controller design and reset procedure, linked.\n\nEach floor now defends the one above: the line's 3 minutes is the median the paragraph reports, and the paragraph's six-an-hour limit comes from a test in the document. What it cost: one question to the head of sales engineering, a public commitment to 'a demo in the first call' in front of the people who run demos, and three versions that must change together when the pool size does. The document owns the numbers and the other two copy them.",
  experiment: "Pick the director who will hear about your next change and ask them, or someone on their team, one question: what do you see when this area goes wrong? Write the three versions before you tell anyone, building the paragraph around that answer. Keep all three in one document, with the numbers in only one place.",
  reflection: "Which floor do you default to when someone senior asks about your work, and which floor were they standing on?",
  recall: {
    q: "Why prepare an update at three floors instead of one good version, and what must hold between the floors?",
    a: "You cannot choose which floor you are asked on, and each floor has its own vocabulary and its own question, so one version fits none of them.\n\nEach floor must defend the one above: a line its paragraph cannot back is a slogan, and a paragraph its document cannot back is a promise."
  },
  deepDive: "Here is a change I shipped this month. Write the one-line, one-paragraph and document-title versions for a vice president, a director of support and my own team, and mark any claim the lower floors cannot back."
},
{
  id: "outcome-outsider-test",
  track: "outcome",
  title: "Test the update on someone outside the team before it goes up",
  source: "Chip Heath and Dan Heath, Made to Stick",
  gatePrompt: "Paste the update you are about to post. Below it, write the sentence you predict a person in sales or support would say if asked what changed for customers, and your confidence from 0 to 100 that they would get it right. If someone is within reach, ask them now and write their exact words too.",
  fallback: "Status, week 46. Platform cost: enabled KEDA scale-to-zero on idle tenant worker pools (15 min cooldown, cold start p95 38s) and applied VPA recommendations to the rest. Estimated saving $9k/month once prod is done. Beta and staging done, preprod and prod next week. No open risks.",
  idea: "You cannot read your own update as an outsider does, because the mechanism fills in every gap for you. Before it goes up, hand it cold to one person outside the team and ask them to say back what changed for a customer. Edit at the first place they stall, then try a second person.",
  why: "The Heaths describe an experiment in which people tapped out well-known songs on a table while listeners tried to name the tune. Elizabeth Newton, who ran it, asked the tappers to predict how many listeners would get it. They said about half, and about one in forty did. A tapper hears the song while tapping and cannot stop hearing it. You are the tapper: when you write 'scale-to-zero', the consequence plays in your head, and your reader hears only the taps.\n\nThat is why rereading your own draft proves nothing: it uses the same head. The check has to be a person who lacks the knowledge, and what you ask them for matters. 'Does this make sense?' usually gets a polite yes. 'What changed for a customer?' shows what arrived. Someone who repeats your nouns back has parsed the update, not understood it.",
  failureMode: "The update says 'cold start p95 38s' and 'no open risks', and the team reads it as a clean cost saving. The head of support reads 'scale-to-zero' as workers switched off at night and asks, in the leadership channel, whether customers' overnight jobs still run. Four replies later the saving is remembered as the post that raised a worry, and nobody has said what a cold start is.",
  worked: "The line at risk was 'cold start p95 38s'. I gave the update to the head of support with no briefing and asked what changed for a customer. She said we had switched off workers overnight to save money, and asked whether overnight jobs still ran. She had read it closely, and nothing in it told her a cold start is the delay on the first job after a quiet spell. The rewrite: 'Idle customer workers now shut down after fifteen minutes and start on the next job. That saves about $9,000 a month. The cost is that the first job after a quiet spell starts about 40 seconds late.' A solutions engineer, asked the same question, repeated the saving and the delay in their own words, then asked whether any customer demos live on these pools.\n\nThe test cost ten minutes each from two people and a day's delay on the post. It demanded that the 40-second delay be written in plain words next to the saving, which weakens the headline. It also produced a question I could not answer on the spot, and the answer was that two accounts do demo live on these pools. I kept their pools warm, so the number in the update is $8,400 a month, not $9,000.",
  experiment: "Before your next update goes up, hand it to one person outside the team with no briefing and ask: what changed for a customer? Write down their exact words and the first thing they ask about, without correcting them. Edit the update at that point, then give the new version to a second person.",
  reflection: "What did the outsider say back that you had not predicted, and which words in your update can you no longer hear?",
  recall: {
    q: "Why can rereading never tell you whether your update is clear, and what should you ask an outsider for?",
    a: "Rereading uses the same head that supplies the missing context, so the draft reads as clear to you whatever it does to anyone else.\n\nAsk for a restatement of what changed for a customer, not an opinion. Someone who repeats your nouns has parsed it; someone who names the consequence has understood it."
  },
  deepDive: "Here is an update I am about to send. Read it as a head of support with no platform background, say back in two sentences what changed for a customer, and list every term you had to guess at."
},
{
  id: "outcome-investment-ask",
  track: "outcome",
  title: "Ask for platform investment as situation, complication, question and priced options",
  source: "Barbara Minto, The Pyramid Principle",
  gatePrompt: "Take a piece of platform work you want funded, or the last proposal you sent. Write four parts: the situation your listener already accepts, the complication as a customer count or a date, the question it hands them, and every option with its price, doing nothing included. Mark any part you cannot yet fill.",
  fallback: "Proposal: we need two engineers for two quarters to re-architect the workflow engine's persistence layer. The current Postgres-backed history store is hitting scaling limits and vacuum is increasingly a problem. We would shard history by tenant group, move to partitioned tables and add a separate read path for visibility queries. This removes the main scalability risk on the platform and lets us onboard enterprise customers without worrying about load.",
  cheat: "Situation they would already sign, complication as a customer count and a date, the question it hands them, then every option priced in one unit, doing nothing included.",
  idea: "Frame the ask in four parts: a situation your listener would sign, a complication stated as a customer count and a date, the decision that creates, and options with their prices, doing nothing included. Say what each option lets you remove, so the ask reads as a trade rather than an addition.",
  why: "Minto's introduction runs situation, complication, question, answer. An ask that opens with 'we need two engineers' asks the listener to fund a problem they have not yet felt. The four parts fix that, and each has a job. The situation holds only what they would already sign, such as customers and growth. The complication is the one new fact they must accept, so make it checkable: at 600 customers the workflow engine breaks, and at current growth that is thirteen months away. The question is the decision that fact hands them, with a date on it.\n\nThe answer is where engineers usually offer one option. A single option leaves the listener two moves, fund it or refuse it, and refusing looks free because nobody has written down its price. A menu with prices, doing nothing included, lets them say yes to the cheapest option that holds, which is a smaller yes and an easier one. Saying what each option removes, a chore, a bill or a risk, shows what the money buys back.",
  failureMode: "The proposal asks for two engineers for two quarters to fix the persistence layer, with a price on no alternative. The director cannot weigh it against the rest of the roadmap, so asks whether there is a cheaper version. There is, but nobody costed it, so the answer is 'let's revisit next quarter'. That is the do-nothing option, chosen by silence, with its price never stated and nobody holding the date it comes due.",
  worked: "The specimen asked for two engineers for two quarters, with one option, no number and no date. Rebuilt: the platform has 410 customers and adds about 15 a month. A load test puts the workflow engine's limit at about 600 customers, roughly thirteen months away, and past it every customer's scheduled runs start late. So what do we fund before then? Option A, partitioning the history tables by tenant group, is 10 engineer-weeks, carries us to about 1,500 customers and retires a manual vacuum and rebalance that costs 2 engineer-weeks a quarter. Option B, the original rewrite, is 52 engineer-weeks (two engineers, two quarters) and carries past 5,000. Doing nothing costs nothing until month thirteen, then late runs and option A's 10 engineer-weeks spent mid-incident. I recommend A now.\n\nWhat it cost: the original ask became option B, about five times the price of the option that holds, so the rewrite we wanted is no longer the recommendation. All of it can now be wrong in public: the ceiling comes from one load test, the growth rate is borrowed from sales, and the engineer-weeks are estimates. And pricing do-nothing hands the listener a legitimate way to choose it. If they do, the thirteenth month is on their calendar as well as ours.",
  experiment: "Take one platform investment you would like funded and find the number behind its complication: the customer count or date at which the current design stops working. Get growth from whoever owns the sales forecast, then write the four parts with every option priced in engineer-weeks, doing nothing included. Take it to the person who would sign it and ask which option they would pick.",
  reflection: "In your last funding request, how many options did the listener see, and what did refusing it cost them that you never wrote down?",
  recall: {
    q: "Why should an investment ask price doing nothing, and what does saying what each option removes add?",
    a: "A single option leaves the listener only fund or refuse, and refusal looks free until its price is written. A priced menu lets them approve the cheapest option that holds.\n\nWhat each option removes, a chore, a bill or a risk, shows what the money buys back and makes the ask read as a trade."
  },
  deepDive: "Here is a proposal for platform investment that I am about to send. Rewrite it as situation, complication, question and priced options, and tell me which numbers I must find before it can go to the person who decides."
}
);

</script>
<script>
/* Track: Pick the channel. Ordered foundational first. */
(window.LESSONS = window.LESSONS || []).push(
{
  id: "channel-message-doc-or-meeting",
  track: "channel",
  title: "Send the update as a message and keep the meeting for a decision that needs live debate",
  source: "Standard staff-work practice",
  gatePrompt: "Take the next meeting you are about to run or present at, and list its agenda items. Beside each one write message, doc or live decision: information goes in a message, anything that must outlive the conversation goes in a doc, and only a real debate needs a room. Count how many items still need the room.",
  fallback: "Quarterly platform review, Thursday, 45 minutes. Invited: 14 people from engineering, support, solutions engineering, product and finance. Agenda: vector search index migration, where we are (slides, 15 min); new evaluation gates for AI features, what changes for each team (10 min); how to request a dedicated worker pool (5 min); whether the two largest tenants move to their own search shards (10 min); Q&A (5 min). No pre-read, I will walk through everything live.",
  idea: "Sort what you were going to present before you book the room. Information goes in a message written to be read without you. Anything that must outlive the conversation goes in a doc. A meeting is for the one decision where people arguing live will change the answer. Each item gets one channel; the default is a message.",
  why: "A meeting buys one thing that messages and docs do not: an exchange fast enough for people to change a decision while they are still talking. Everything else it does, it does at the speaker's pace and at the sum of everyone's time. A read-out to fourteen people for 45 minutes spends 10.5 hours of attention on content a reader could take in alone in three minutes, skipping what they already know.\n\nThe second cost lands on you. People take an invitation as your estimate of what their time is worth, and each meeting that turns out to be a walkthrough teaches them that yours are optional. When you need the live argument, because two teams want different things and you have to broker it, the people you need send a delegate.",
  failureMode: "The quarterly platform review is booked for 45 minutes and runs an hour. The migration walkthrough takes 30 minutes against the 15 planned, and the room asks two questions. The one real decision, whether the two largest tenants get their own search shards, gets the last six minutes and ends with 'let's take it offline'. By next quarter three invitees send delegates, including the owner of the shard budget.",
  worked: "The invite's key line is 'No pre-read, I will walk through everything live', for five items and fourteen people. Sorted, the migration status and the new evaluation gates are information, so they become one message: the migration as 31 of 40 indexes moved with the rest due by 11 December, the gate changes as a line per team. How to request a worker pool has to outlive the conversation, so it is a docs page the message links. Only the shard question turns on an argument, because the head of solutions engineering wants the latency and the finance partner wants the bill held down. That becomes 20 minutes with four people and a one-paragraph pre-read. The Q&A becomes replies under the message.\n\nFourteen people for 45 minutes was 10.5 hours of attention. The sorted version is fourteen three-minute reads and a 20 minute meeting for four, about two hours. The cost is that the message took an hour to write well enough to stand without you, and ten people are now outside a decision they might have wanted a say in. The invite to the four says who is in the room and why, and anyone who disagrees can reply.",
  experiment: "Pick the meeting on your calendar this week where you talk and most people listen. Label each agenda item message, doc or live decision, and work out the person-minutes in the invite against the person-minutes of the sorted version. Send the message part a day before and see whether the meeting shrinks or loses an item.",
  reflection: "Which meeting on your calendar has you as the main speaker, and what would the room actually lose if you sent the same content as a message?",
  recall: {
    q: "What can a meeting do that a message cannot, and what does using it for a read-out cost you?",
    a: "A meeting lets people change a decision while it is being made, at the speed they talk. Information and records do not need that.\n\nA read-out spends everyone's attention at the speaker's pace and teaches the room your invitations are optional, so the right people are missing the day you need the argument."
  },
  deepDive: "Here is the agenda for a meeting I am about to run. Sort each item into message, doc or live decision, and tell me which people the live decision actually needs in the room."
},
{
  id: "channel-graduate-the-idea",
  track: "channel",
  title: "Graduate an idea: 1:1, small group, written proposal, then broadcast",
  source: "Standard staff-work practice",
  gatePrompt: "Take an idea of yours that has only been said aloud, or the one you are about to post. Name the rung it is on - 1:1, small group, written proposal or broadcast - and write the one thing that must be true before it moves up. If you cannot name one, it is not ready.",
  fallback: "Random thought, not a proposal: what if the agent gateway cached tool results across tenants, keyed on the request? We pay for the same web search and docs lookups over and over, and I think it could cut a decent chunk of our LLM and API bill. Haven't looked at isolation or invalidation yet. Thoughts? Posting in the main platform channel so everyone can weigh in.",
  idea: "Widen the audience only after the idea has survived the narrower one. Test it on the person most likely to find the flaw, then on the few who would build or pay for it, then as a short written proposal, and only then in front of everyone. An unfinished idea posted early gets a verdict instead of help.",
  why: "A broadcast asks a question you did not mean to ask. Posted to a channel, an idea is answered as a proposal: people agree or disagree, and the first reply sets the frame for the rest. You wanted help finding the flaw and you get a vote. The weak part of an unfinished idea is the part you have not worked out, so it is what the first reply attacks, and the version that would have survived never gets argued.\n\nEach rung is a cheaper place to be wrong than the next. One person can name the fatal flaw without an audience watching them do it. The few people with a stake in building or funding it can price it. A written proposal has to stand without you in the room. By the time it is public, the objections that kill an idea for a bad reason have been answered, and you know where its weak points are.",
  failureMode: "You post the gateway caching idea in the platform channel, with isolation marked as not yet looked at. Within ten minutes a senior engineer replies that sharing results across tenants is a data leak, and four people add a thumbs-up. The tenant-scoped version, which is safe and would have saved about a fifth of tool-call spend, is never discussed. The idea is now known as the leaky cache, and it is yours.",
  worked: "The specimen's key line is 'Haven't looked at isolation or invalidation yet. Thoughts?', posted to the whole platform channel. Run it as a ladder instead. Rung one is ten minutes with the security engineer, asking only what would make a cache unsafe. The idea moves up once that answer is in it, and the answer, never share across tenants, makes it a per-tenant cache. Rung two is the gateway owner and the finance partner. It moves up when one query on the gateway logs shows how many tool calls repeat, which turns out to be about one in five within a tenant in a day. Rung three is a one-page proposal that reads without you. Rung four is that page, posted with a date for objections.\n\nWhat this gives up is speed and company. A post takes five minutes and this took nine days, because three busy people needed slots, and nobody outside the circle could suggest a better idea on the way. You also lose the cover of 'just a thought': a proposal with your name on it has to be finished or visibly withdrawn. What you gain is that the first public reply is about a scoped, measured design, not the leak.",
  experiment: "Write down the rung your current idea is on and the one thing that must be true to move it up. Then have that conversation this week with the person most likely to say it will not work, asking only what would make it fail. Record what they said and whether it changed the idea.",
  reflection: "What was the first reply to the last idea you posted early, and which version of the idea did it make impossible to discuss?",
  recall: {
    q: "Why does an unfinished idea posted to a channel get a verdict rather than help, and what is the fix?",
    a: "A channel answers whatever it is shown as a proposal, and the first reply frames the rest. The weakest part of the idea is what gets attacked.\n\nWiden the audience in steps - one person who will find the flaw, the few who would build or pay, a written proposal, then everyone - so the public version has its weak points answered."
  },
  deepDive: "Here is an idea I have only discussed in a 1:1 so far. Tell me who I should test it on first, what I should ask them, and what would have to be true before I take it to a small group."
},
{
  id: "channel-prewire-the-decision",
  track: "channel",
  title: "Pre-wire the decision, and let each conversation change the proposal",
  source: "Jeffrey Liker, The Toyota Way",
  gatePrompt: "Take the next decision you plan to put in a meeting. List everyone who will have to act on it or pay for it, and beside each name write when you last heard their view and what, if anything, they changed in your proposal. Every blank is a person you are about to discover in the room.",
  fallback: "Decision meeting Thursday 3pm: delete customer sandbox environments after 14 days idle instead of 60, which saves about 11,000 dollars a month. Proposal doc linked, shared this morning. Invited: platform, solutions engineering, support, sales operations, security. I will walk through the design and we will vote at the end. If there are no objections the change ships Monday.",
  cheat: "Before a decision meeting, every person who must act or pay has seen the proposal and said what they would change. A blank beside a name is a discovery waiting in the room.",
  idea: "Before a decision meeting, take a one-page proposal to each person who will carry it out or pay for it. Ask what it costs them and what they would change, change it, and show them the revised version. The meeting then ratifies something every attendee has already seen and shaped, instead of discovering objections live.",
  why: "Liker presents nemawashi as the groundwork behind a Toyota decision: everyone affected is consulted early, their ideas are collected, and agreement is built before anything is formally decided. The slow part comes first so the rollout can be fast. The point is not to win votes. The person who runs the demo environments, or owns the trial contract, knows something about your proposal that you do not, and a 1:1 is the cheapest place to hear it.\n\nA meeting that discovers cannot resolve what it finds. Each objection arrives without time, data or the right people, so it becomes a debate with an audience and the decision slips. A meeting that ratifies has little left to do. There is a second payoff after it: a team that changed the plan carries it out as its own, while a team shown it for the first time disputes it during the rollout.",
  failureMode: "You put the sandbox clean-up on the agenda with the doc shared that morning. Solutions engineering says its proofs of concept run 90 days, support wants 30 days for repro environments, and security asks where deletions are logged. The hour runs out and the decision slips a month. Pressed to show the saving, you ship the original 14 days, and the first deletion run removes a customer's environment in the middle of a 90-day proof of concept.",
  worked: "The specimen's key line is 'we will vote at the end', on a proposal shared that morning. The four other invitees became four conversations of 20 minutes, each with the one-page proposal and one question: what does this cost you, and what would you change? Solutions engineering needed an exemption for 90-day proofs of concept. Support asked for 30 days instead of 14. Sales operations pointed to trial terms that promise 30 days. Security wanted deletions logged. The proposal became 30 days idle, an exemption tag with an owner and an expiry date, and a deletion log, and each person got the revised page back. The agenda item changed from 'vote' to 'ratify'.\n\nThe saving fell from 11,000 dollars a month to about 7,500, because 30 days idle catches fewer sandboxes than 14. The round took four working days and under an hour and a half of conversations, so the decision landed a week after the date you first booked. You also gave up the proposal as you wrote it: it now carries four people's changes. The meeting took ten minutes. Had a new objection appeared, you would have said so and not decided that day.",
  experiment: "Before your next decision meeting, build the list from the gate: everyone who must act or pay, when you last heard their view, what they changed. Hold the conversations first, send each person the revised version, and mark the agenda item ratify or discuss. Afterwards note how many minutes it took and how many objections were new.",
  reflection: "In your last decision meeting, which objection did you hear for the first time in the room, and who could have told you a week earlier?",
  recall: {
    q: "Why does a meeting that ratifies finish faster than one that discovers, and what must happen in each prior conversation?",
    a: "Objections found in the room arrive without time, data or the right people, so they become debates. Found in advance, they are inputs to the proposal.\n\nEach conversation has to change the proposal, and the person has to see the revised version. Otherwise it is lobbying, and the meeting still discovers."
  },
  deepDive: "Here is a decision I plan to take to a meeting. List the people who must act on it or pay for it, and for each one write the question I should ask in the 1:1."
},
{
  id: "channel-weekly-update-five-lines",
  track: "channel",
  title: "Run the weekly update in five fixed lines: metric, change, why, next step, risk or ask",
  source: "Standard staff-work practice",
  gatePrompt: "Take this week's update, or the one you owe. Write the metric your work is meant to move, today's figure and last week's, then one sentence each on why it changed, the next step, and the risk or ask. If you cannot find last week's figure, that is the finding.",
  fallback: "Platform weekly update. This week: continued work on connector worker scaling, moved three large tenants onto the new worker pool, fixed two flaky sync tests, investigated rate limiting from one customer's source API, reviewed six PRs. Next week: move the remaining two large tenants, start the retry-policy cleanup, keep looking at rate limits. Blockers: none. Happy to answer questions.",
  cheat: "Weekly update in the same order every time: the metric, change since last week, why, next step, risk or ask. If last week's figure is missing, find it before you send.",
  idea: "Send the same five lines every week, in the same order: the metric your work is meant to move, how it changed since last week, why, the next step, and the risk or ask. The fixed form lets the reader find the change in seconds, and makes you carry one number and its cause from week to week.",
  why: "An activity list gives the reader nothing to carry over. Each week is new text, so they must work out what matters, and after a month they cannot say whether the thing you are working on is better. A fixed form turns the updates into a series. By the third week the reader goes straight to the change line, and a flat or worse number stands out because the format never varies.\n\nEach slot also constrains the writer. Change since last week needs last week's number, so you cannot quietly re-baseline. Why forces a cause every week, including the weeks the number is flat, and a wrong cause is corrected in front of people who can see it. Next step makes the following update a check on this one. The last line is the only one that asks anything of the reader, so it stays easy to find.",
  failureMode: "Your weekly update lists work done: scaling changes, flaky tests, six reviews. Leadership reads the first line and files it. Three weeks later a large customer complains that its data is an hour behind, and the director asks how long that has been happening. The sync delay had been creeping up for a month, but no update had ever put a number on it, so nobody can say.",
  worked: "The specimen's key line is its list of work, ending 'Blockers: none'. Underneath it sits one number, the p95 sync delay for the five largest tenants, which their contracts put at 30 minutes. The update becomes: 'Metric: sync delay for the five largest tenants, 47 minutes at p95 against a 30 minute commitment. Change: down 15 minutes from 62 last week. Why: three of the five moved onto the new worker pool on Wednesday. Next step: the other two move by Thursday. Risk or ask: one tenant's source API throttles us at peak, which holds its delay near 40 minutes whatever we do, so I need the account owner to ask that customer to raise the limit, by Friday.'\n\nThe cost was the figure itself. It had to be pulled from sync logs and defined once, p95 over the five largest tenants, the same query every week. That took an hour and now takes ten minutes. The number is also on the record: if it rises next week, that is the first line. The old update could never be wrong. This one commits to a cause and to a date for the next step, and next week's update will check both.",
  experiment: "Write this week's update in the five lines, using a metric definition you could repeat next week. Find last week's figure from your own data. Send it to your manager and ask which line they read first. If you cannot produce last week's figure, build the query now and note how long it took.",
  reflection: "Asked whether your area is better than a month ago, which figure would your manager quote, and did you give it to them?",
  recall: {
    q: "What does a fixed weekly format do for the reader, and what does it force on the writer?",
    a: "The reader learns where to look, so the change is found in seconds and a bad week stands out, because the form never varies.\n\nThe writer must carry last week's number, give a cause each week even when it is flat, and set a next step that the following update will check."
  },
  deepDive: "Here is my last weekly update. Find the one metric underneath the work, rewrite it in the five lines, and list the figures I would have to go and find to fill each slot."
},
{
  id: "channel-one-picture-one-argument",
  track: "channel",
  title: "Pick the one picture the argument needs: a crossing, a comparison or a before and after",
  source: "Standard staff-work practice",
  gatePrompt: "Take the next dashboard screenshot you were going to paste into an update. Write the one decision it should change, then choose the one picture that shows it: two lines that cross, options side by side, or a before and after. Describe that picture and its title in words, and name the panels you would cut.",
  fallback: "Workflow platform update: shipped the queue-depth scaling change last Tuesday. Attaching the capacity dashboard, six panels on the default 30-day view, titled Task queue backlog, Worker CPU, Worker memory, Pods by deployment, Start latency p50 and Start latency p95. Things look better on most of them. Let me know if you want me to drill into any of the panels.",
  idea: "Choose the picture from the question, not from the dashboard. A crossing answers 'will it run out', bars side by side answer 'which is cheaper', and a before and after answers 'did it work'. Send one chart per message, and make its title the conclusion, because the chart will travel without your words.",
  why: "A dashboard is built for the person operating the system, who needs everything at once. A decision-maker needs one relationship, and some relationships are shapes: demand climbing toward a ceiling, one bar towering over another, a line stepping down on the day of a change. The eye takes a shape in at a glance, where a table or a sentence makes the reader do arithmetic they may not do. That is the case for a picture. It is also the case for one, because a reader shown six panels follows whichever looks most alarming, and that may not be yours.\n\nThe title does one more job. A chart is pasted into a thread, screenshotted into a slide and forwarded, and the title is the one sentence inside the image, so it travels when your message does not. Choosing one picture also forces the choice you were avoiding, which is what the message is arguing. If two charts seem necessary, you have two arguments and two messages.",
  failureMode: "You send leadership the capacity dashboard, six panels, with 'things look better on most of them'. The director opens the screenshot, notices the memory panel climbing, and replies asking whether memory is a problem. The thread is now about memory. The one panel that showed what you shipped, a drop in start latency, goes unmentioned, and an update meant to show a fix is read as a warning.",
  worked: "The specimen's key line is the six-panel screenshot offered as evidence that a scaling change worked. The question is 'did it work', so the shape is a before and after: p95 start latency as one line, 14 daily points on one axis, flat near 8.2 seconds for a week, then flat near 3.1 seconds from the day the change shipped, with that day marked and a dashed line at the 5 second target. The title says: 'Nineteen in twenty workflows now start within 3.1 seconds, down from 8.2, since the scaling change'. The other five panels go behind a link. Had the question been whether the pool survives next year's plan, the picture would be a crossing instead: demand against the tested limit, with the crossing date in the title.\n\nThe cost is a choice you can be held to. Before dropping the memory panel you have to look at it, and it shows worker memory up by a third since the change, which is not a footnote. It becomes a second message with its own picture. The title also commits you to a causal claim, that the change did it, which anyone can test against the marked deploy day.",
  experiment: "Before you open the dashboard for your next update, sketch on paper the one chart you expect to need: its shape, any marker or reference line, and a title with a number in it. Then build it from the real data. If the data does not support the title you sketched, write down whether the title or the claim has to change.",
  reflection: "Which chart in your last update would a reader still remember a week later, and what question was it built to answer?",
  recall: {
    q: "Why send one chart per message, and how do you choose which picture it is?",
    a: "Several panels let the reader follow whichever looks most alarming, which may not be yours, and two charts usually mean two arguments. Choose the shape from the question: a crossing for 'will it run out', side by side for 'which is cheaper', before and after for 'did it work'.\n\nTitle it with the conclusion, since the title is what travels."
  },
  deepDive: "Here is the dashboard I usually screenshot for leadership and the question they last asked me. Tell me which of the three pictures it calls for, what the one chart should show, and which panels I must check before I cut them."
},
{
  id: "channel-write-it-to-be-forwarded",
  track: "channel",
  title: "Write it so your manager can forward it without you: context, a number and the ask",
  source: "Standard staff-work practice",
  gatePrompt: "Take the message you are about to send your manager, or the last one you sent. Replace every phrase that points outside it - 'as discussed', 'the thread', 'last time', a weekday, an option letter - with the thing it pointed at. Then check it still holds a number and a dated ask.",
  fallback: "Hi - following up on Tuesday. As discussed, we need the window before the cutoff, otherwise the export thing will bite those two again. Can you check with CS about notifying them? Same as last time. Details are in the thread and I'd go with option 2. Let me know if that works for you.",
  idea: "Write each message as if your manager will forward it upward and you will not be there to explain. It carries its own context, the number that sizes the problem, and the ask with an owner and a date. Anything that needs another message to make sense gets replaced by what it pointed at.",
  why: "Shared context lives in the people, not in the text. You and your manager know what Tuesday was, what option 2 is and what the cutoff is, so the message reads as precise. A forward keeps the words and drops the people. The reader three steps up meets a message whose every reference points at a conversation they were not in, and you are not there to repair it.\n\nYour manager then has three poor choices: forward it as it is and field the questions that come back, rewrite it in their own words and risk bending your number, or sit on it, in which case the ask dies. A message that stands alone makes the forward a ten-second act, and your figure and framing reach the person who can act on them unchanged. That person usually has the least context, so write for them.",
  failureMode: "You send a two-line note ending 'as discussed, we need the window before the cutoff'. Your manager forwards it to the head of customer success with 'see below'. Nothing in it says which window, which cutoff or which customers, so the reply is a question. A day passes, the notice period shrinks, and two enterprise customers hear about the maintenance with less warning than they were promised.",
  worked: "The specimen's key line is 'As discussed, we need the window before the cutoff, otherwise the export thing will bite those two again'. Rewritten, the message opens: 'Approval needed by 18 November for a 30-minute maintenance window overnight on 5 December to upgrade the workflow database. If approved, customer success needs to notify two enterprise customers by 20 November. Until we upgrade, their nightly exports miss the morning deadline about one night in four. Together they hold about 1.2 million dollars of annual contract value and both renew in March. Vendor support for the current version ends on 31 January.'\n\nEvery pointer became a fact that had to be found: the failure rate from the export logs, the contract value from sales operations, the support date from the vendor. That took a morning, and it exposes you, because the ask can now be refused on its merits and the one night in four can be checked. Your manager can forward it unchanged. What you lose is 'as discussed': if you and your manager only half agreed in that conversation, the message now shows it.",
  experiment: "Search your last five messages to your manager for phrases that point outside the message: 'as discussed', 'the thread', 'same as last time', weekday names, option letters. Count them. Rewrite the next message with each one replaced by what it pointed at, show it to your manager and ask whether they would forward it as it is, and note whether they change a word.",
  reflection: "The last time your manager forwarded something of yours upward, what did they add or change, and what does that tell you the message was missing?",
  recall: {
    q: "Why does a forwarded message lose meaning even when no word in it has changed?",
    a: "Its meaning depended on context held by the sender and first reader, not in the text. A forward keeps the words and drops that context.\n\nSo the message carries its own: what the system is and why it matters, the number, and the ask with an owner and a date."
  },
  deepDive: "Here is a message to my manager that I expect to be forwarded. List every phrase that depends on context outside it, then rewrite it so a reader who has never seen the thread could say what is being asked, by when and why."
}
);
