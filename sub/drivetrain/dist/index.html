{
  id: "reach-four-routes",
  track: "reach",
  title: "Platform work reaches the business by four routes - work that names none is a finding",
  source: "Standard staff-work practice",
  gatePrompt: "List the five biggest items on your team's plan this quarter. Beside each, name the route it travels to the business - room to grow (the customer ceiling), retention (reliability and trust), margin (cost to serve) or velocity (how fast product teams ship) - and one number for how far it moves it. Leave blanks where you cannot.",
  fallback: "Platform plan for next quarter, draft for Thursday's review. Six items: the Temporal server and SDK upgrade, worker deployments onto KEDA ScaledObjects, resource quotas on each tenant vcluster, a re-shard of the vector index, request tracing through the agent gateway, and a replacement for the connector retry library. Each is three to six engineer-weeks. Owners to be assigned. Ordered by when it came up in the backlog.",
  cheat: "For every plan item, name its route - room to grow, retention, margin or velocity - and one number for how far it moves it. An item that cannot is a finding.",
  idea: "Before any piece of platform work gets scheduled, say which of four routes it travels to the business - room to grow, retention, margin or velocity - and roughly how far it moves the business along that route. Work that cannot name a route has no business case yet, and that is a finding to report.",
  why: "Each route ends at a number the business already follows. Room to grow is the customer ceiling set against the sales plan. Retention is reliability and trust, which the business sees as renewals and churn. Margin is the cost to serve, which finance reports. Velocity is how fast product teams ship, which shows up as delivery time and engineer hours spent waiting. Naming the route tells a listener which of their own numbers your work moves, and who to ask for its baseline.\n\nSizing is the other half. A route with no size is only a direction, and the size is what lets a director weigh your item against another team's: a two per cent move and a twenty per cent move are different decisions. An item that names no route is the real finding. It is either insurance, which can be sized another way, or work with no business case yet.",
  failureMode: "A quarterly plan with fourteen items goes to a planning review, each justified by its mechanism. Headcount is cut by a fifth. The director asks which items can go, and nobody can say what business outcome any of them protects, so the cuts fall on whichever items have the quietest sponsors. The in-flight KEDA work, whose saving nobody had written down, goes first. By the next quarter the cloud bill has grown and nobody can say what that work would have removed.",
  worked: "The plan has six items and none says what it is for. Asked to name a route for each, the author finds four. Tenant quotas travel retention: a noisy neighbour slowed two enterprise tenants, together worth $400,000 a year, twice this year, and both renew next quarter. The vector re-shard travels room to grow: search degrades past about 400 tenants, the platform has 340 and adds 8 a month, so the ceiling is under eight months away. Moving workers onto KEDA travels margin: idle workers cost about $11,000 a month and scale-to-zero should remove roughly half. Tracing travels velocity, but the author has no figure yet. The Temporal upgrade and the retry library name no route at all.\n\nThree blanks are the result: one missing number and two items with no route. The upgrade is probably insurance against an unsupported version, which has its own sizing, and the retry library may have no business case at all. The cost was numbers that were on no dashboard - renewal dates and contract values from customer success, tenant growth from sales operations, idle spend from finance - and a plan with two items you must now defend on different terms or drop.",
  experiment: "Take your team's current plan and add two columns, route and number, to the planning doc itself. Fill every cell you can in an hour and send the table, blanks included, to your manager with one line: these are the items I cannot yet connect to the business. Record how many blanks there were.",
  reflection: "Which item on your plan names no route, and what would you say to a director who asked why it is there?",
  recall: {
    q: "Why does naming the route make a platform item easier to weigh, and what does an item with no route tell you?",
    a: "A route ties the item to a number the business already tracks and someone already owns: the customer ceiling, renewals, cost to serve, or delivery time. That puts items from different teams on one scale, and sizing shows how far each moves it.\n\nAn item that names no route has no business case yet. It is either insurance, to be sized another way, or work to question."
  },
  deepDive: "Here is my team's plan for this quarter. For each item, tell me which of the four routes it most plausibly travels, what number I would need to size it, and who in the business owns that number."
},
{
  id: "reach-drivetrain-order",
  track: "reach",
  title: "Start with the objective, then the levers, then the data - the model comes last",
  source: "Jeremy Howard, Margit Zwemer and Mike Loukides, Designing great data products",
  gatePrompt: "Take a proposal you are writing or about to start. Write four lines in this order: the business objective with a number; every lever you control that could move it, not only the one you plan to build; the data you would need; and a rough model of how far each lever moves the objective.",
  fallback: "Proposal: semantic caching in the agent gateway. Agents often send similar prompts, so we will embed each request, look up near-duplicates in the vector store, and return the stored completion above a similarity threshold. This reduces LLM spend and cuts latency. The cache is tenant-scoped, with a configurable TTL. Effort: six engineer-weeks across two engineers. We will tune the threshold with a benchmark once the lookup path is built. Seeking approval to start.",
  idea: "Build the case for a piece of platform work in a fixed order: the objective with a number, then every lever you control that could move it, then the data you can collect, and only then the model of how far the levers move the objective. The mechanism you wanted to build is one lever among several.",
  why: "Howard, Zwemer and Loukides made this argument about data products, in a 2012 article on O'Reilly Radar, and called their method the Drivetrain Approach. Their complaint was that a predictive model says what will happen without saying what to do about it. Their fix is an order of work: define the objective, specify the inputs you can control, work out what new data you would need to collect, and only then build the models that link those inputs to the objective. Their examples included search ranking and insurance pricing; for insurance the objective was long-run profit per customer, and price was one lever among several.\n\nApplying the order to platform work is an adaptation, not something the article says. Platform proposals often arrive mechanism first, with the objective inferred from it. Reversed, the objective gives you a number to be wrong about, and the lever list shows the mechanism you wanted is one of several. The data step turns 'we will benchmark during the build' into something you can query this week. The model comes last because by then it is small, often one sum.",
  failureMode: "Two engineers spend three weeks building the semantic cache. It works, hits 3 per cent of requests, and saves about $1,400 a month against a $48,000 bill, because nobody measured how often prompts repeat before the build. The benchmark that would have said so was scheduled for 'once the lookup path is built'. The saving that mattered sat in a lever the proposal never listed, because it had already chosen its own.",
  worked: "The specimen proposes semantic caching in the agent gateway and opens with a mechanism and an assumption: that agents 'often send similar prompts'. In drivetrain order, the objective is to bring LLM spend, now $48,000 a month and 12 per cent of agent revenue, back under the 10 per cent the pricing assumed, without lowering eval scores. That needs about $8,000 a month off. The levers are the cache, shorter system prompts, routing classification steps to a smaller model, and per-tenant token budgets. The data is spend by step and the share of requests that repeat an earlier one, near-duplicates included: one query over a week of gateway logs, which shows 3 per cent. The model is arithmetic: a cache cannot remove more than the repeat share of spend, and 3 per cent of $48,000 is about $1,400 a month, under a fifth of the target.\n\nThe author wanted to build the cache, and the model says it cannot reach the target. What the order cost: a request to finance for agent revenue, a day of log queries before any approval, and a proposal that must now be rewritten around a lever the author never listed. It also made a claim that can fail: if the repeat rate holds at 3 per cent, nobody should build the cache this quarter.",
  experiment: "Take the next proposal you will write and, before drafting any of it, list at least three levers you control that could move the objective, including one that needs no build. Find one number for the objective and one dataset you can query this week. Put the lever list and the query result at the top of the doc, above the mechanism.",
  reflection: "In your last proposal, which lever did you choose before you had listed the others, and what number would have told you it was the wrong one?",
  recall: {
    q: "In what order do you build a case for a piece of platform work, and why does the model come last?",
    a: "Objective with a number, the levers you control, the data you can collect, then the model. By the time you reach the model it is small, often one sum linking the levers to the objective.\n\nThe order stops you building the one lever you thought of first, and turns a benchmark you planned after the build into a query you can run before it."
  },
  deepDive: "Here is a design proposal I am about to write. Rewrite its opening as objective, levers, data and model, and tell me which lever I have not considered and which data I could collect this week."
},
{
  id: "reach-cost-to-serve",
  track: "reach",
  title: "Cost to serve only means something next to what the customer pays",
  source: "Standard unit-economics practice",
  gateIntro: "Your cloud bill is a big number and everyone in engineering knows it. In a cost review a director asks whether it is big for the business, and the room turns to you. Before you answer, take your own platform's figures and turn the bill into something you can set beside what a customer pays.",
  compute: { question: "What does one customer cost in cloud spend each month?", expr: "cloudMonthly / customers", unit: "dollars a month" },
  idea: "Divide the monthly cloud bill by paying customers, then set the result beside what one customer pays each month. The bill describes the platform. The ratio describes the business, and it tells you how much margin any cloud saving can possibly move.",
  why: "A bill in dollars has no scale for anyone outside engineering. Seventy-five thousand a month sounds large to one director and small to a finance partner who signs contracts in the millions, and neither knows which reaction is right. Per customer, set against the monthly contract value, it becomes a share: of every dollar a customer pays, this many cents go to the cloud. Finance already thinks in shares of revenue, and this one caps the prize. Removing the bill entirely would add that many points of margin and no more, which tells you how much the margin route can ever be worth.\n\nTwo cautions keep the figure honest. It is an average, and tenants are rarely average: a few large ones often carry most of the bill, so the figure is where you start and the spread is the next question. And cloud is only part of what a customer costs to serve. Support and licences sit beside it, and Gross Margin covers how finance counts them. Use this figure for the part you can move.",
  failureMode: "An engineer proposes a quarter of work to cut the cloud bill by a fifth and leads with the $75,000 monthly figure. The director hears a big number and approves. Later, finance divides the saving by revenue and finds one point of margin. Nobody had set the bill beside what customers pay, so the project was sized by how large the bill sounded.",
  worked: "A platform with 250 paying customers has a monthly cloud bill of $75,000. Divided by customers, that is $300 a customer a month. Average contract value is $72,000 a year, so $6,000 a month, and the cloud takes 5 per cent of it. The update says: 'Cloud costs us $300 a customer each month, 5 per cent of the $6,000 each pays. The autoscaling work should cut the bill by a fifth, which is $60 a customer and one point of margin. Removing the whole bill would be worth 5 points at most, so this is a modest route and I am sizing the work to match.'\n\nThe sentence has two places it can now be wrong. 'Paying customers' had to exclude trials and internal tenants, which took a message to finance, and the $72,000 had to be the contract value finance reports, not the list price. The larger cost is the conclusion: at 5 per cent, cloud work can add five points of margin at most, and the quarter you wanted for it may be worth more on another route.",
  experiment: "Take your paying-customer count and last month's cloud bill and divide. Ask finance for the monthly contract value of a typical customer and write the two figures as one share. Put one sentence - cost per customer, fee per customer, share - in front of whoever sizes your team's work, and note the first question it draws.",
  reflection: "Which cost-saving claim in your last two updates would shrink if you set it beside what a customer pays?",
  recall: {
    q: "Why divide the cloud bill by customers and set it beside the monthly fee, instead of quoting the bill?",
    a: "The bill has no scale for anyone outside engineering. Per customer, beside the monthly fee, it becomes a share of what the customer pays, which finance already thinks in.\n\nThat share is also the ceiling on the margin route: removing the whole bill would move margin by that share and no more."
  },
  deepDive: "Here are my platform's monthly cloud bill, paying customer count and typical contract value. Compute cost to serve as a share of the fee, then tell me which kinds of tenant are likely to sit far above the average and how I would find them."
},
{
  id: "reach-churn-reasons",
  track: "reach",
  title: "Reliability protects only the share of churn that customers blamed on it",
  source: "Standard SaaS retention practice",
  gateIntro: "A reliability proposal is headed for the planning review with one line in its rationale: 'protects revenue'. Finance already reports annual churn, and the line will be heard as a claim on that whole figure. Before anyone argues about the claim, work out from your platform's own numbers how large that figure is.",
  compute: { question: "How much annual contract value walks out each year, if the customers you lose are average-sized?", expr: "customers * churnPct / 100 * acv", unit: "dollars a year" },
  cheat: "Before saying reliability work protects revenue, get customer success's churn reasons and claim only the share of lost contract value that names reliability.",
  idea: "Churn is the retention number finance already tracks, so start from its size: customers lost times contract value. Before you claim reliability work protects any of it, get the churn reasons from customer success, and claim only the slice the reasons support.",
  why: "Finance has the churn figure and the room knows it, so a claim that reliability 'protects revenue' is taken to cover all of it. Listeners discount a claim that large by an amount you cannot see, and it is usually more than the honest slice. Customers leave for many reasons: budgets, acquisitions, a champion who moved on, a competitor, and sometimes outages. Customer success often records a reason when an account leaves. Claiming the share that names reliability, and no more, gives you a smaller number that survives questions.\n\nThe formula prices every lost customer at the average contract, and the customers who leave are rarely average, so ask finance for the dollar figure and use this one as the first estimate. Reasons are also a person's summary, coded after the fact: read them for the pattern and say how many accounts they rest on. If reliability barely appears, that is the finding, and what the reasons do name is a problem nobody has picked up.",
  failureMode: "A reliability proposal opens with 'we lose $1.2 million a year to churn'. In the review, the head of customer success says last year's losses were mostly budget cuts and acquisitions, with reliability named twice. The proposal's other numbers are now read with the same suspicion, and it is approved at half its scope with the revenue line removed from the rationale. The work was sound. The claim attached to it was eight times too large.",
  worked: "A platform has 200 customers, loses 8 per cent a year and averages $75,000 a contract. That is 16 customers, and 16 times $75,000 is $1.2 million a year. Customer success has a reason on file for each: seven budget cuts, four acquisitions or departed champions, three product gaps and two outages. Two of 16 is an eighth of the pool, about $150,000. The update says: 'We lose about $1.2 million a year to churn. Customer success records outages as the reason for two of 16 losses, roughly $150,000. This project targets those, and I will report reliability-coded losses each quarter.'\n\nThe claim shrank from $1.2 million to $150,000 before anyone else could shrink it. What it cost: a conversation with customer success to learn whether reasons were recorded at all, a sample of 16 that makes the 2 a rough figure rather than a measurement, and the loss of the bigger story. If the three product gaps were the real problem, you have also found one nobody assigned.",
  experiment: "Ask customer success for the recorded reason behind each customer lost in the last twelve months. Count how many name reliability or performance, and what share of that year's lost contract value those accounts held. Write the claim for your reliability work as that share, with the number of accounts it rests on, and put it where your current claim sits.",
  reflection: "Which of your last proposals said it protected revenue, and what fraction of the churn reasons on file would have supported that?",
  recall: {
    q: "Why get the churn reasons from customer success before claiming that reliability work protects revenue?",
    a: "A claim on the whole churn figure is discounted by an amount you cannot see, usually more than the honest slice. The reasons tell you what share of lost accounts named reliability.\n\nClaim that share and no more. The number is smaller and it survives questions, and the other reasons show where the next problem is."
  },
  deepDive: "Here is my reliability proposal and the churn reasons customer success sent me. Work out which share of the lost contract value the reasons support, and rewrite the revenue line to claim only that."
},
{
  id: "reach-velocity-price",
  track: "reach",
  title: "Velocity has a price once you name whose time it is",
  source: "Standard staff-work practice",
  gateIntro: "A product director says the platform feels slow to work with and cannot say how slow. You have a rough count of the engineers whose daily work runs on it and a CI queue that sometimes backs up. Fifteen minutes a day over a 48-week year of five-day weeks is 60 hours, which is 1.5 forty-hour weeks.",
  compute: { question: "If each of those engineers loses fifteen minutes a day waiting on the platform, what does that cost a year?", expr: "engineers * 1.5 * engWeek", unit: "dollars a year" },
  idea: "Give velocity a price by naming whose time is lost: the engineers who build on the platform, not the team that runs it. Multiply their number by the minutes they wait and their loaded cost, and report the answer as a ceiling, since waiting is not all lost time.",
  why: "'The platform is slow' is a feeling until someone is named as bearing it. Naming whose time is lost does two jobs. It sets the multiplier, since fifteen minutes is nothing to one engineer and a large number across everyone who builds on the platform. And it tells you whose budget the cost falls on, which is usually product engineering's rather than yours. Their leads have to agree the minutes are real before the number means anything, so they are your first reader and your best check.\n\nTreat the result as a ceiling. Waiting is not all lost: engineers fill part of a long wait with other work. Measure the wait from CI and environment logs rather than asking people, and ask a team lead how much of it is idle. The DORA research (Forsgren, Humble and Kim, Accelerate) uses survey data to link software delivery performance to organisational performance, which is a reason to care how fast teams ship. It gives no price per minute, so the sum has to be yours.",
  failureMode: "The platform team ships a faster CI cache and reports that median build time fell by 30 per cent. In the next planning review a director asks what that is worth. The answer is that engineers are happier. Priorities go to a customer-facing feature with a revenue estimate attached, and the follow-up work on test sharding is dropped. Nobody multiplied the minutes saved by the number of engineers waiting, so the room only ever heard the feature's number.",
  worked: "A platform has 120 engineers whose daily work runs on it, and finance puts an engineer-week at $4,000. Fifteen minutes a day over 48 five-day weeks is 60 hours, so each engineer loses at most 1.5 weeks a year. 120 times 1.5 is 180 engineer-weeks, and 180 times $4,000 is $720,000 a year. The update says: 'Waiting on CI and environment spin-up costs the 120 engineers who build on the platform at most $720,000 a year. I am pulling queue times to say how much of that is real, and I will report the number before we pick a fix.'\n\nThe sentence says 'at most' because a product director can fairly answer that engineers switch to other work during a wait. What the move cost: queue times from CI and environment logs, which took a day to pull, and one team lead willing to say how much of the wait is idle. With both, the claim can narrow to the idle share, with that lead's name behind it. Without them the $720,000 is a ceiling nobody has tested.",
  experiment: "Pick the wait your platform imposes most often, such as a CI queue, an environment spin-up or a review gate, and pull a week of its durations from logs. Work out the yearly ceiling from the median wait per engineer per day, then ask one of their team leads how much of that time is idle. Write the ceiling and the lead's answer side by side.",
  reflection: "Whose time does your most recent platform improvement save, how many people is that, and has any of them confirmed the minutes are real?",
  recall: {
    q: "Why is the cost of waiting on the platform a ceiling, and what two things narrow it?",
    a: "Waiting is not all lost: engineers fill part of a long wait with other work. Engineers times minutes waited times loaded cost per minute gives the most the wait can cost.\n\nQueue times measured from your own logs, and a team lead saying how much of the wait is idle, narrow it towards the real figure."
  },
  deepDive: "Here is the wait I think my platform imposes on product teams, with a rough count of the engineers who hit it. Help me turn it into a ceiling in dollars, and list the questions a product director would ask to push it down."
},
{
  id: "reach-insurance-sizing",
  track: "reach",
  title: "Some platform work is insurance - size it as likelihood times impact, or drop it",
  source: "Standard risk-assessment practice",
  gatePrompt: "Pick one item on your plan that you justify with 'in case' - backups, a failover region, a dependency upgrade. Write the event it covers, how often you think that event happens, and what one occurrence costs the business. Leave a blank wherever you only have a feeling, and write what would fill it.",
  fallback: "PLAT-3388: Multi-region failover for the workflow engine. A regional outage today would stop all tenant workflows until we rebuild in another region, which we estimate at 8 to 12 hours. Add a standby Temporal cluster and a Postgres replica in a second region and document the cutover. Rationale: resilience best practice, and enterprise security questionnaires ask about it. Effort: three engineers for a quarter. Standby infrastructure is extra, cost TBD. Priority: Medium.",
  idea: "Some platform work reaches the business only as insurance against an event. Say so in the plan, then size it: how often the event happens in a year times what one occurrence costs, set against the cost of the cover. If you cannot put a number on either, drop the item.",
  why: "Insurance is the one kind of work whose benefit is an absence. If the cover works, nothing happens, so there is no before and after to point at, and the usual evidence is missing. What the business can weigh is two numbers: the expected annual loss, which is how often the event happens times what one occurrence costs, and the premium, which here is your engineering time plus running cost. Cover that costs more than the loss it removes needs a different reason.\n\nTwo honest limits apply. A business may rationally pay more than the expected loss to cap an event that could end it, but that is a choice for leadership to make with your two numbers in front of them. And the likelihood is often unknown: a backup that has never been restored has an unknown chance of working, so the first piece of work is the restore test, which turns that unknown into something you can size.",
  failureMode: "A team spends a quarter on multi-region failover because it is best practice. At the next budget review the standby costs $96,000 a year and nobody can say which event it covers or how often that event happens. Meanwhile the nightly backups have never been restored. The first real restore, after a failed migration, takes thirty hours and finds the most recent backup incomplete.",
  worked: "The ticket's rationale is 'resilience best practice', which names no event. Sized as insurance, the event is a regional outage long enough to stop tenant workflows for ten hours. Our incident log and the provider's published history show one that long in five years, so call it 0.2 a year. One occurrence costs about $150,000 in service credits, a tenth of a month's $5,000 fee for each of 300 customers, plus perhaps three customers who leave at $60,000 each: $330,000 in all. Expected loss is 0.2 times $330,000, about $66,000 a year. The cover costs about $156,000 to build, three engineers for 13 weeks at $4,000 an engineer-week, and $96,000 a year to run the standby. Counted as insurance alone, the premium is larger than the loss it covers.\n\nThe ticket's second reason, security questionnaires, is a different route with its own number: how many deals asked, and how many stalled. If none stalled, the honest options are a cheaper cover, such as a rehearsed rebuild that shortens the outage, or dropping the item. The cost of the move is a likelihood from a thin five-year history, an impact that needed contract terms from finance and a guess from customer success, and an answer that may be 'do not build'.",
  experiment: "Pick the insurance item on your plan that costs the most. Count how often its event has happened, from your own incident log and any public history of it, then ask finance or customer success what one occurrence would cost. Write the sum - occurrences per year times cost - beside the cost of the cover, and mark which of the two numbers you trust less.",
  reflection: "Which item on your plan are you defending with 'best practice' or 'in case', and what event would have to happen for it to pay back?",
  recall: {
    q: "Why can insurance work not be justified by what changed after it shipped, and what do you compare instead?",
    a: "Its benefit is an absence: if it works, nothing happens, so there is no before and after. Compare expected annual loss, which is events per year times cost per event, with the cost of the cover.\n\nIf the cover costs more, it needs another reason, or leadership must choose to pay for it."
  },
  deepDive: "Here is an item on my plan that I justify as resilience. Help me name the event it covers, find a defensible yearly likelihood and a cost per occurrence, and tell me whether the cover costs more than the loss."
}
);

{
  id: "numbers-headroom-is-a-date",
  track: "numbers",
  title: "Headroom is a date, not a percentage",
  source: "Standard capacity-planning practice",
  gateIntro: "A director stops you after the platform review and asks whether the workflow cluster will cope with next year's sales plan. Your dashboard says the cluster runs at about 60 per cent of the load where tail latency starts to climb. Before you answer, put in your own platform's figures and work out what they are really asking.",
  compute: { question: "At your current growth, how many months until the platform reaches the number of customers you think it can carry?", expr: "(ceiling - customers) / newPerMonth", unit: "months" },
  cheat: "Report headroom as the month you run out, with its range and the growth assumption behind it, never as a percentage full.",
  idea: "Say how long until the platform runs out, not how full it is. A utilisation figure asks the listener to do arithmetic they lack the inputs for; a date tells them at once whether it collides with the sales plan.",
  why: "Sixty per cent full is a statement about the system. It cannot be laid against anything the business plans in - quarters, hiring, deals, renewals. To act on it the listener needs the growth rate and the breaking point, which you have and they do not. Converting it yourself costs one division. Leaving it unconverted means the number is heard as reassurance, and nothing is decided until it is too late to be cheap.\n\nThe date also surfaces the assumptions worth arguing about. Growth may be lumpy, with one large customer bringing the load of thirty. The ceiling may be soft, with latency degrading gradually rather than falling off a cliff. A date with its range - twelve months if growth holds, nine if the two big deals close - turns a capacity report into a planning input and invites the people who know the pipeline to correct the half you cannot see.",
  failureMode: "The platform review shows the workflow cluster at 60 per cent utilisation, in green. Nobody asks how fast it is climbing. Five months later two large customers onboard in the same fortnight, workflow latency triples, and the re-architecture that needed a calm quarter is now an incident. The number was accurate the whole time. It was never once a date.",
  worked: "A platform with 420 customers adds about 18 a month. A load test puts the workflow cluster's breaking point at roughly 640 customers' worth of traffic. Headroom is 220 customers, which at 18 a month is about twelve months. The update says: 'At current growth we reach the workflow cluster's limit in about twelve months. If the two large deals in the pipeline close, each carrying the load of about thirty typical customers, it is closer to nine. The fix is a quarter of work, so starting it in the next three to four months keeps margin even in the faster case.'\n\nThe listener can now hold the platform against their own calendar without asking a follow-up. The cost is exposure: you have committed in public to a ceiling you measured once and a growth rate you borrowed, and both will be questioned. That is the point. A number that can be wrong in front of people is one they will help you correct.",
  experiment: "Find the one capacity number your platform reports as a percentage. Get the growth rate from whoever owns the sales forecast rather than from your own dashboards, convert the percentage into a month, and put the month and its range in your next update.",
  reflection: "Which capacity figure do you report that nobody has ever turned into a date, and what changes if the date is sooner than you assumed?",
  recall: {
    q: "Why report headroom as a date rather than as utilisation?",
    a: "Utilisation needs the growth rate and the breaking point to mean anything, and only you have both. A date can be laid against the sales and hiring plans without a follow-up question.\n\nGive it with its range and its assumptions, so the people who know the pipeline can correct the part you cannot see."
  },
  deepDive: "Help me turn my platform's current capacity figure into a date with a range, and list the assumptions someone in sales or finance would challenge first."
},
{
  id: "numbers-price-a-week-of-delay",
  track: "numbers",
  title: "Price a week of delay, then say whether the deals wait or walk",
  source: "Donald Reinertsen, The Principles of Product Development Flow",
  gateIntro: "A change to the workflow platform needs new-customer onboarding paused for a week. The engineering plan is sound and the change is reversible, so the team calls it low risk. The head of sales asks what the week costs. Before you answer, put in your own platform's figures.",
  compute: { question: "If the platform blocked onboarding for one week, how much annual contract value would be pushed back? Assume new customers start at an even pace, so a week's worth is a month's new customers times 12, divided by 52, each carrying the average contract value.", expr: "newPerMonth * 12 / 52 * acv", unit: "dollars of annual contract value" },
  idea: "Put a price on a delay in the unit the business counts, before you argue for or against it. For platform work that is contract value pushed back, per week. Then say which you are claiming: deferral, where the same customers start later, or loss, where they walk. Only a loss costs the whole contract.",
  why: "Reinertsen's argument is that time has a price in product work, the cost of delay, and that most organisations cannot state theirs. Without it every delay looks free and every request looks equally urgent, so schedule disputes go to whoever argues hardest. With a figure per week, the argument is about a number that can be checked, not about who sounds most certain.\n\nFor platform work the figure has two parts, and listeners hear them as one. The amount pushed back is the contract value that would have started that week. What it costs depends on the customers. If they wait, and they are billed from go-live, a week of billing moves to a later period. If a go-live date is fixed, by an audit or a launch, and they go elsewhere, the loss is the whole contract. Say which you mean, or the room assumes the worse reading and discounts you when it turns out wrong.",
  failureMode: "At the planning review the platform lead says the one-week onboarding freeze 'puts about $190,000 of contract value at risk'. The head of sales hears a loss and asks which customers. Nobody knows who was due that week or whether any date is fixed. The figure is waved off as a worst case, and for the rest of the quarter every number the platform team brings is discounted before it is discussed.",
  worked: "A platform that bills from go-live adds 18 customers a month at an average annual contract value of $45,000. A week of new customers is 18 x 12 / 52, about 4.15, so a week with onboarding blocked pushes back about 4.15 x $45,000, roughly $187,000 of annual contract value. The sentence for the update: 'The one-week onboarding freeze pushes about $187,000 of annual contract value back by a week. I am claiming deferral, not loss: sales confirms none of the four customers due that week has a date it cannot move, so the cost is a week of their billing, about $3,600, landing in a later period. If any of them does have one, that customer's $45,000 of annual contract value is the loss.'\n\nThe sum needed two figures engineers rarely hold, the new-customer rate and the contract value, and the claim needed a third thing only sales has, the start dates. What it cost is exposure. Once you say deferral, a customer who walks makes you wrong in public. The bare $187,000 would have been safer to say and worse to hear: with no claim attached, a listener assumes loss, then discounts you when the customers turn out to wait.",
  experiment: "Pick the next freeze, migration or maintenance window that touches onboarding or customer-facing work. Ask sales which customers are due to start in it and whether any has a date it cannot miss. Then write the sentence: the contract value pushed back, whether you are claiming deferral or loss, and which customers would change the answer.",
  reflection: "When did you last call a delay small, or at risk, without a figure, and what would a priced version have said?",
  recall: {
    q: "A week of blocked onboarding pushes contract value back. What decides whether that is a deferral or a loss, and who holds the answer?",
    a: "Whether the customers wait. If they start a week later, a week of billing moves to a later period. If a fixed date makes them walk, you lose the whole contract.\n\nSales knows which dates are fixed, so ask them, then say which one you are claiming."
  },
  deepDive: "Here is a freeze or migration window I am planning. Work out the contract value it pushes back from the figures I give you, then list what sales would have to confirm before I can call it a deferral rather than a loss."
},
{
  id: "numbers-ranges-not-points",
  track: "numbers",
  title: "Give a range you would bet on, and the one assumption that moves it",
  source: "Douglas Hubbard, How to Measure Anything",
  gatePrompt: "Take a number you were about to state as a single figure: a delivery date, a saving, a cost, a customer count. Rewrite it as a range you would bet nine to one contains the real value, then name the one assumption that moves either end furthest and what you could check first to narrow it.",
  fallback: "Proposal: move the nightly connector sync workers onto spot capacity. This saves $9,000 a month on the platform cloud bill. The work is two engineers for three weeks, so it pays back in about three months. Syncs already retry on interruption, so the risk is low. Unless anyone objects I will start Monday.",
  cheat: "Give the range you would bet nine to one on, plus the one assumption that moves it most, instead of a single figure.",
  idea: "State an estimate as a range you would bet nine to one contains the real value, and name the single assumption that moves it most. A point estimate looks precise and hides the one thing the decision depends on, which is how wrong it could be.",
  why: "Hubbard defines a measurement as an observation that reduces uncertainty, and he wants the uncertainty stated, as a range with a confidence attached. A range is calibrated when it holds as often as you say it does, and his test is a bet: would you sooner back your range, or a spinner that pays nine times in ten? If you would take the spinner, the range is too narrow, as most first attempts are.\n\nFor the listener a range does what a point cannot. They can lay it against their own threshold, a payback period, a launch date, a budget line, and see at a glance whether the decision depends on your uncertainty at all. The named assumption tells them where the next hour of checking pays most, because a range that straddles the threshold can only be narrowed by learning about the input that moves it.",
  failureMode: "A proposal says the spot migration saves $9,000 a month and pays back in three months, and it is approved on that. Six weeks in, the largest syncs turn out to restart from scratch when a worker is reclaimed. The saving lands at $4,500 and payback stretches past five months. The story told upward is that the platform team missed its estimate. It never gave one: it gave a point, and nobody saw where the point could fall.",
  worked: "Behind the proposal's $9,000 a month sit three inputs: $30,000 of monthly sync worker spend, the 60 per cent of hours assumed safe to interrupt, and a 50 per cent spot discount. The spend is on the bill, and a 40 to 60 per cent discount moves the answer by only a fifth. The 60 per cent is the guess: it depends on how many long syncs resume from a checkpoint after a worker is reclaimed and how many restart from zero. With the others held, at 30 per cent the saving is $4,500 and at 70 per cent it is $10,500. The rewrite: 'Saves $4,500 to $10,500 a month, depending mostly on how many long syncs survive interruption. I will test the three largest in staging first. The work is six engineer-weeks, about $24,000, so payback is roughly two to five months.'\n\nThe point estimate had a decision hiding in it. If the bar is payback inside three months, the proposal needs $8,000 a month, so it clears the bar only in the upper part of the range, and a test on the large syncs is the cheapest way to find where it sits. What it cost: the reviewer now knows the saving may be half what the proposal said, and you owe the test.",
  experiment: "Take an estimate you gave this month as a single figure. Rewrite it as a range you would bet nine to one on, find the one input that moves it most, and spend an hour measuring that input instead of refining the others. Post the range, the input and what you measured in the thread where you first gave the number.",
  reflection: "Which of your estimates is now being treated as a commitment, and what range would you have given if anyone had asked for one?",
  recall: {
    q: "Why does a nine-in-ten range with one named assumption help a listener more than a single figure?",
    a: "The range lets them test it against their own threshold and see whether the decision depends on your uncertainty at all. The named assumption shows where checking pays most.\n\nA point reads as precise, hides both, and turns the first miss into a missed commitment."
  },
  deepDive: "Here is a cost saving I am about to propose. Turn it into a nine-in-ten range, find the assumption that moves it most, and tell me whether the decision changes anywhere inside the range."
},
{
  id: "numbers-decompose-before-you-ask",
  track: "numbers",
  title: "Break the unknown into factors you can look up before you ask for data",
  source: "Fermi estimation",
  gatePrompt: "Take a number you are about to ask someone to pull or run a query for. Before you send the request, write it as the product of three to five factors you could each look up or bound, give each a rough range, and mark the factor whose range is widest.",
  fallback: "Hi data team - for the capacity review I need to know how many workflow executions a day we will run when the customer count triples. Could you export every workflow execution from the last twelve months, with tenant, connector type, start time and status? I will build the model from that. The review is Thursday, so anything by Wednesday works. I think it is mostly connector syncs but have not checked.",
  idea: "Before asking anyone for data, write the unknown as a product of three to five factors you could each look up or bound, with a range on each. The factor whose range is widest dominates the answer, so it is the one worth chasing, and often the only one.",
  why: "A number you cannot look up is usually a product of numbers you can: how many customers, how many connectors each, how often each syncs, how much work one sync creates. Most of those you can bound within a factor of two from memory or one lookup, and independent misses in opposite directions partly cancel, so the product is usually closer than a direct guess at the total. This is Fermi estimation, and it needs no data to start.\n\nIt also shows where the uncertainty lives. Because the factors multiply, the width of the answer is mostly set by the factor you know least, not the largest one. A customer count you know exactly adds no doubt however big it is, while a fan-out that varies tenfold sets the whole range. Asking for raw history first buys an export and a week of waiting. Decomposing first buys the one query worth running.",
  failureMode: "An engineer asks the data team for twelve months of execution history, by tenant, to model three times the customers. The export arrives after the review and runs to tens of millions of rows. In the meeting the answer was 'about three times today's load', which assumes every other factor stays fixed. The new customers lean towards a connector type with ten times the fan-out, and nobody looked.",
  worked: "The request wants a year of history to model three times the customers. As factors, executions a day is customers x connectors per customer x syncs per connector per day x executions per sync. At 3 x 420 = 1,260 customers, six connectors each, two syncs per connector a day and about 30 executions per sync, that is 1,260 x 6 x 2 x 30, roughly 450,000 a day. The sales plan, billing and connector config give the first three factors in an hour. Executions per sync, sampled from ten recent syncs, ran from 10 to 90, while neither connectors per customer nor syncs per connector varies by twofold, so it dominates. Holding the others, the answer runs from about 150,000 to 1.4 million a day.\n\nThe request shrinks from a year of history to one query: executions per sync, by connector type. What it cost is a stated range that spans nine times, which can sound like not knowing, and a structure you must now defend. The factors are not independent, since large customers have more connectors and more fan-out, so multiplying typical values runs low. You also did the lookups yourself, an afternoon, rather than waiting for someone else's export.",
  experiment: "Find a number you are about to request or compute from raw data. Before you ask, write it as three to five factors, give each a low, a middle and a high, and multiply the middles. Circle the factor with the widest spread and ask only for that one. Keep the sheet: it is your estimate if the data never arrives.",
  reflection: "Which number are you waiting on data for right now, and which of its factors would you have bet was the biggest?",
  recall: {
    q: "Why does the factor with the widest range, rather than the largest value, tell you where to spend your next hour on data?",
    a: "Because the factors multiply, the width of the answer comes mostly from whichever one you know least. A customer count you know exactly adds no doubt, however large it is.\n\nOne query on the widest factor narrows the answer more than a year of history on all of them."
  },
  deepDive: "Here is a number I have been asked for and the data request I was about to send. Break it into factors I can look up, give each a range, and tell me which one to chase first."
},
{
  id: "numbers-denominator-the-listener-counts",
  track: "numbers",
  title: "Choose the denominator your listener counts in",
  source: "Standard staff-work practice",
  gatePrompt: "Take the last reliability or incident number you reported, a count of failed jobs, errors or alerts. Restate it three ways: as a rate of the thing it happened to, as a share of customers, and as dollars of annual contract value exposed. Then circle the one your listener counts in.",
  fallback: "Weekly reliability: 30 failed jobs this week, down from 34 last week. That is 0.25% of runs, inside our 0.5% error budget. The top cause was connector timeouts against customer sources, and we have raised the retry ceiling for those. Dashboard linked. No action needed from leadership.",
  idea: "The same failure has a different size in each denominator: 30 jobs, 1 run in 400, 12 of 420 customers. Quote it in the unit your listener counts in, which for leadership is customers and dollars, and give your own unit second so the choice can be checked.",
  why: "A count with no denominator has no size. Thirty failed jobs is a crisis if the platform runs fifty and a rounding error if it runs a million. Each denominator answers a different question. Per run measures how reliable the system is, which is your question. Per customer measures how many people were let down, and per dollar how much is at stake, which are the questions of whoever decides whether to act.\n\nThe listener cannot convert for themselves. They do not know how many runs a customer generates or what a typical customer pays, so given your unit they pick a reading: the run rate sounds like rounding error, the job count like a crisis. Converting costs you a join between failures and contracts. It puts the number beside things leadership already tracks, renewals and revenue, where it can be compared and acted on.",
  failureMode: "The weekly update says 30 failed jobs, 0.25 per cent of runs, inside budget, and collects a thumbs-up. Two weeks later a top-ten customer, due to renew next quarter, escalates: five of those jobs were the customer's own. The update was accurate and gave nobody a reason to look. It counted jobs, and the people who read it count accounts.",
  worked: "The update to repair reports 30 failed jobs, 0.25 per cent of runs, inside the error budget. The same week can be stated as 30 jobs, 1 run in 400, or 12 of 420 customers, about 1 in 35. Joining failures to the contract table adds dollars: those 12 customers carry $900,000 of the $18.9 million of annual contract value, about 5 per cent, and two are top-ten accounts renewing this quarter. The rewrite: 'Twelve of our 420 customers, about 5 per cent of contract value, had a job fail this week, including two top-ten accounts that renew this quarter. Across all runs it is 1 in 400, inside budget.'\n\nThe listener can now hold the number against renewals, and the engineering rate is still there, second, so no one can say you chose the frightening figure. What it cost: a join between failure logs and contract data that engineering does not own, one request to finance and a day. And a commitment, because the update has to use customers and contract value next week as well, including the week it gets worse.",
  experiment: "Take your last reliability or incident figure. Join the failures to your customer list and to contract value, and write the same event as jobs, runs, customers and annual contract value. Then ask one person in sales or finance which of the four they would repeat to their own boss, and lead with that one next time, engineering rate second.",
  reflection: "Which number in your last update could a head of sales repeat to their own boss, and which would they have to ask you to translate?",
  recall: {
    q: "Why is 12 of 420 customers a better thing to tell leadership than 1 in 400 runs, when both describe the same failures?",
    a: "They answer different questions. The run rate shows how reliable the system is, which is your concern. The customer share and the contract value behind it show who was let down and what is at stake, which is theirs.\n\nQuote both, theirs first, so the choice of unit can be checked."
  },
  deepDive: "Here is a reliability figure I report every week. Tell me what join I need between failures and customer records to restate it as customers and contract value, and which restatement would sound alarmist if I led with it."
},
{
  id: "numbers-measure-your-own-elasticity",
  track: "numbers",
  title: "Do not borrow someone else's elasticity - measure your own",
  source: "Standard measurement practice",
  gatePrompt: "Find a claim in your own proposal, deck or ticket that ties performance to money, such as a latency target 'protecting revenue' or faster syncs 'improving retention'. Write down where the number behind it came from: whose users, which outcome, measured how, and when. Then write what you could measure on your own tenants.",
  fallback: "Motivation: p95 latency on tenant vector search is 1.2 seconds, against a 500 ms target. Industry data shows that every 100 ms of latency costs roughly 1% of revenue, so the extra 700 ms is worth about 7% of revenue, or roughly $1.3 million a year. Search latency is therefore the highest-value item on the platform roadmap and should come before the tenant isolation work.",
  idea: "Do not carry a latency-to-revenue figure from another product into your own case. It was measured on other people's users, for a different kind of revenue, and rarely with a method you can inspect. Measure the relationship on your own tenants, or write that it is unmeasured.",
  why: "An elasticity belongs to a product, an audience and the way money changes hands, not to latency. The figures that circulate, a share of sales lost for each hundred milliseconds, come from very large consumer sites running experiments on their own users, and mostly reached the rest of us as conference talks and slides, not as papers that state the method. On a consumer site a slower click can cost a sale within the session.\n\nYour platform differs on each count. Revenue is contractual and moves at renewal, months later. Much of the traffic is agents and scheduled jobs, which have no patience to lose until they hit a timeout. And with a few hundred customers you could not detect a one per cent revenue effect in an experiment even if it were real. What you can measure is usage, each tenant's slow weeks against its own fast ones, and that is evidence a finance review can check.",
  failureMode: "The search proposal reaches review with a benefit of $1.3 million a year attached. The head of finance asks which tenants have ever cut usage or churned over speed. Nobody can name one. The $1.3 million comes off the page, the proposal is left with no benefit line, and it ranks below a $90,000 cost saving that someone had actually measured.",
  worked: "The claim to repair is 'Industry data shows that every 100 ms of latency costs roughly 1% of revenue.' It has no source, and figures of this kind come from consumer sites measuring their own users. The rewrite: 'p95 search latency is 1.2 seconds against a 500 ms target. We have not measured what that costs us. Over 26 weeks p95 ranged from 0.8 to 1.9 seconds by tenant-week, so we will compare each tenant's query volume in its slow weeks with its own fast weeks, counting only weeks a deploy or upstream incident made it slow. If that is inconclusive, we ship the fix to nine tenants in ten and hold it back from a random tenth for a month.'\n\nThe $1.3 million is gone, and the proposal has no benefit line until the comparison runs, which takes a week and may show nothing. That is a weaker pitch and a true one. The clause about deploys and incidents carries the weight: a busy tenant is both slow and active, so a naive correlation of latency with usage points the wrong way, and you could report the opposite of what is happening.",
  experiment: "Find one place where an argument for performance work rests on a figure from outside your product. Write down whose users it came from, what outcome it measured and when. Then pull weekly p95 latency and weekly usage for ten of your tenants over 26 weeks, mark the weeks a deploy or incident made them slow, and see whether usage fell.",
  reflection: "Which performance claim in your last pitch rested on someone else's measurement, and what would you say if finance asked for your own?",
  recall: {
    q: "Why do latency-to-revenue figures from big consumer sites fail to transfer to a B2B platform, and what do you measure instead?",
    a: "The elasticity belongs to the product and the way money moves. Consumer sales move within a session, contract revenue moves at renewal, and a few hundred tenants cannot show a one per cent revenue effect.\n\nMeasure your own usage against your own latency, using slow weeks the tenant's own load did not cause, or hold an improvement back from a random few."
  },
  deepDive: "Here is a proposal that justifies performance work with a figure from outside my product. Help me work out what I can measure on my own tenants instead, and which confounders would make my latency and usage numbers mislead."
}
);
