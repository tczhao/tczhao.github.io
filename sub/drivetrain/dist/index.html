{
  id: "room-know-the-distinctions",
  track: "room",
  title: "Know the distinctions cold: one sentence each, then what the customer sees",
  source: "Standard staff-work practice",
  gatePrompt: "Pick the distinctions you will be asked about - start with schema versus data migration, availability versus durability, latency versus throughput, at-least-once versus exactly-once. For each, write one sentence a director could repeat, then what a customer would see. Leave blank any pair you cannot finish.",
  fallback: "Director: Is this a schema migration or a data migration, and what is the risk to customers?\n\nEngineer: Sort of both. There's an Alembic revision that adds the column, then a backfill job that goes through the table in batches of 5,000. I've set a lock timeout, and the replica might lag a bit while it runs. We tried it on staging, which has about a tenth of the production rows, so I'd say it should be fine.",
  idea: "For each distinction you are likely to be asked about, hold one sentence that says what it is and a second that says what a customer would see. Four come up constantly: schema versus data migration, availability versus durability, latency versus throughput, at-least-once versus exactly-once. Say both sentences, then go back to the outcome.",
  why: "A director cannot check your answer against the system, so they judge it by how it sounds. A pair told apart in one sentence, ending in what a customer would see, sounds like command. These four come up because each pair separates two different harms, and the questioner is working out which one is in play.\n\nA schema migration changes the structure of the database and usually shows at once, as failing requests while it applies; a data migration changes the rows and can show late, as wrong values a customer finds first. Availability is whether customers can use the system now, durability whether what they saved is still there, and a system can be down and lose nothing, or be up and quietly drop writes. Latency is the wait for one request, which a person at a dashboard feels; throughput is work finished per hour, which a customer with a ten-million-row sync feels. At-least-once never loses a task but may run it twice, so a customer can see a duplicate; exactly-once means one effect, which in practice is at-least-once plus dropping the repeat.",
  failureMode: "A director asks whether the tenant-data change is a schema migration or a data migration. The engineer starts with the migration tool, moves to the lock timeout, then the batch size. Ninety seconds in, the director asks again, more slowly, and then turns to someone else. The change was safe and well run. The director leaves believing the team could not say what kind of change it was, and the next change from this team gets a second reviewer.",
  worked: "The director asked which kind of migration this was and what it risked for customers, and the first answer ('sort of both... it should be fine') neither separated the two nor named a risk. The repair is the answer, one sentence for each side, then the risk, then the outcome: 'Both, in that order. A schema migration changes the structure of the database, and this one adds a column, which takes a brief lock and finishes in seconds. A data migration changes the rows themselves, and this one fills that column for every tenant over about four hours. The risk is in the second: dashboards could be slower or slightly stale while it runs, and a bad fill would show as wrong figures, so we compare counts before anything reads the new column. No customer sees a wrong figure.'\n\nWhat changed is that the answer commits. 'Both', 'about four hours' and 'no wrong figure' are claims that can now be wrong. The four hours had to be found: staging holds a tenth of the production rows, so the engineer timed a batch on a production-sized copy, which cost an afternoon. The revision file, the lock timeout and the batch size are all still true and now sit behind a link for anyone who asks.",
  experiment: "Write the four pairs on one page: a sentence for each side, then what a customer would see. Mark every sentence you could not finish without looking something up. Read the page aloud to the engineer who owns that area and ask them to fix any word that is nearly right. Keep the corrected page open for your next review.",
  reflection: "Which of the four could you not have finished in one breath while a director waited, and what would they have concluded from the pause?",
  recall: {
    q: "Why does a sentence ending in what a customer would see answer a director better than a correct definition?",
    a: "They cannot check the system, so they judge by the sound of the answer. Each pair separates two harms, and a definition does not say which one a customer would meet.\n\nThe customer sentence is the answer; the definition only shows you hold it."
  },
  deepDive: "Here are my one-sentence answers to the distinctions my director is most likely to ask about. Tell me which are wrong or only nearly right, and what a customer would actually see in each case."
},
{
  id: "room-answer-then-stop",
  track: "room",
  title: "Answer the question that was asked - yes, no or a number first - then stop",
  source: "Standard staff-work practice",
  gatePrompt: "Take the last direct question a director or VP put to you in a meeting, or one you expect next. Write your answer in two sentences at most: the first word yes, no or a number, then one line of why. Write nothing after that.",
  fallback: "Director: Can we tell the retail customer their connector will be live on the 14th?\n\nEngineer: It depends on a few things. The OAuth flow is done and the sync workers scale fine in staging. Schema mapping is about 80 per cent there, and then their admin has to approve the app in their console, which has taken a while before, and I haven't fully tested against their API rate limits. So it's possible, I think, if the approval comes through this week.",
  cheat: "First word yes, no or a number, then one line of why, then stop. The follow-up question is theirs to choose.",
  idea: "When someone asks you a direct question, open with the answer in its smallest form - yes, no or a number - then give the one line of why that decides it, and stop. Everything further is an answer to a question nobody has asked yet, and the asker should be the one to choose it.",
  why: "A listener in a room cannot skim or reread. They hold your words in order, and the first one tells them how to hear the rest. After a yes or a no, everything that follows is a reason, and they can stop listening whenever they have enough. After 'it depends', everything that follows is a search for the answer, and they have to do the searching.\n\nA narrow question is narrow because the asker is about to make a call, and an exact answer lets them make it. Adding true things you happen to know hands the room new surfaces to ask about, so you have chosen the next question for them, usually the one you are least ready for. One line of why is enough to survive the obvious follow-up. The rest is yours to give when they ask, which is a stronger position than having given it unasked.",
  failureMode: "The director asks whether the retail customer can have the 14th. Ninety seconds of OAuth, scaling and rate limits later, the director says 'so, no?' and the engineer says 'well, possibly'. The account team hears possibly and tells the customer the date is on track. The customer's admin approval, which decided the whole question, was in the third sentence, and nobody who could have chased it heard that it was the blocker.",
  worked: "The line being repaired is 'it depends on a few things', said to a director who asked whether the retail customer's connector could be live on the 14th. The repair: 'No. The earliest I would stand behind is the 21st: their admin has to approve the app before we can start syncing, that took nine days last time, and the request goes out tomorrow, the 9th.' Then stop. Nine days from the 9th is the 18th, and the first full sync takes three more: the 21st. The follow-up, 'what would make it the 14th?', is the director's to ask and has its own one-line answer: their admin approving by the 11th, which is not ours to control. The OAuth work, the 80 per cent mapping and the rate-limit worry were all true, and none of them was the answer.\n\nWhat changed is that the answer commits. 'No' and 'the 21st' are on the record and can be wrong, and 'nine days' had to come from the ticket history of the last approval rather than from memory, which took twenty minutes. The ramble also bought cover: having mentioned the rate limits, you could say later you had warned them. The short answer gives that up, so the rate-limit test has to be finished before anyone asks.",
  experiment: "Over your next three meetings, write down each direct question you are asked and the first word of your answer. Count how many started with yes, no or a number. For each that did not, write the answer you could have opened with, and note whether the asker had to ask again.",
  reflection: "In your last review, which question did you answer with 'it depends', and what would the first word have been if you had had to commit?",
  recall: {
    q: "A director asks a direct question and you know the answer. What goes first, what follows, and who chooses what comes next?",
    a: "The answer in its smallest form - yes, no or a number - then the one line of why that decides it. Then stop.\n\nThe asker chooses what comes next, so anything more you add is a question you picked for them."
  },
  deepDive: "Here is a question I was asked in a review and the answer I gave. Rewrite my answer so it opens with yes, no or a number, and tell me which true things I should hold back for the follow-up."
},
{
  id: "room-say-you-do-not-know",
  track: "room",
  title: "Say you do not know, name the day, then post the answer where the room can see it",
  source: "Standard staff-work practice",
  gatePrompt: "Think of a number a director asked you for in a review that you could not state exactly. Write what you said, then what you would say now: that you do not know, what you do know about it, a day, and where you will post the answer.",
  fallback: "Director: How many enterprise tenants are still on the old connector, and what is their combined annual contract value?\n\nEngineer: Around thirty, I'd say, so maybe six or seven million in contract value. Could be a few more, but it's roughly that. I can check the registry if it matters.",
  idea: "When you do not have the number, say so first, then give what you do know about it - a range only if you would bet on it - and name a day and a place for the answer. On the day, post it where the question was asked, figure first, so the room sees you close it.",
  why: "A number said in a review leaves the room without you. The director repeats it in a planning meeting, someone copies it onto a slide, and by the time it is wrong nobody can say who first said it. A guess and a measurement sound identical in your voice, so the room cannot tell which one it is carrying. Saying you do not know, with a range only where you would bet on one, keeps a guess from passing as a measurement.\n\nIt also makes your other answers worth something. If every question gets a confident reply, confidence tells the room nothing about which replies you checked. A dated 'I do not know' that lands on the day shows how you sort the two, and your next confident answer is easier to believe. The delivery is half the move: said to a room and answered in a private message, the debt is paid to one listener while the others still remember the gap.",
  failureMode: "A director asks how many enterprise tenants are still on the old connector, and the engineer says around thirty. The director repeats thirty in the quarterly plan with a contract value built on it. The real count is 52. The migration is sized, staffed and promised for thirty, the overrun shows in week five, and the engineer is the only person who knows the number started as a guess.",
  worked: "The line being repaired is 'around thirty, so maybe six or seven million', said to a director who will carry it into a plan. The repair has three parts: 'I do not know either number. I would bet the count is between 25 and 60, and I cannot bound the contract values at all. I will post both in the review channel by Thursday noon: the count from the connector registry, the values from sales operations, who hold them.' On Thursday the post opens with the director's question as asked, then the answer: 52 tenants and $9.4 million a year, with sources, and one line on what it changes: about ten engineer-weeks of migration, not the six the plan assumed.\n\nWhat it cost: you said 'I do not know' about two numbers in front of colleagues and committed to a day, so the answer can now be late. The count took ten minutes against the registry; the contract values took two days of waiting on sales operations, which is why Thursday and not tomorrow. The count was 52, inside the range and 73 per cent above the plan's thirty. It is now posted in the channel where the plan was discussed.",
  experiment: "Before you look up the next figure you cannot state, write down the guess you would have given. Then say you do not know, name a day, and post the answer in the same channel on that day. Record how far the guess was from the figure.",
  reflection: "What figure did you last state in a review without having counted it, and where has it been repeated since?",
  recall: {
    q: "Why is a confident guess about a number worse than a dated 'I do not know', and where should the answer go?",
    a: "The guess leaves the room as a measurement, repeated by people who cannot tell the difference, and it makes your confident answers carry less.\n\nPost the answer where the question was asked, so the whole room sees the gap close."
  },
  deepDive: "Here is a number I was asked for in a review and the answer I gave on the spot. Help me write the 'I do not know' version, and the post that closes it, with the answer in the first line."
},
{
  id: "room-bridge-back",
  track: "room",
  title: "Answer the mechanism question in one sentence, then bridge back to the decision",
  source: "Standard media-training practice",
  gatePrompt: "Think of a review where a technical question took the room away from the decision. Write the one sentence that answers it truthfully, then the sentence that returns to the decision and says what the mechanism means for it. Neither may run past a single line.",
  fallback: "Setup: a head of customer success is waiting on a yes or no to onboard the retail customer's 400 sub-accounts this month.\n\nStaff engineer, another team: Why a task queue per tenant instead of one shared queue?\n\nEngineer: Good question. A shared queue gives you head-of-line blocking, and per-queue backlog is a cleaner autoscaling signal, and then there's the sticky cache and how worker versions interact with it, and we looked at priorities too, which...",
  cheat: "One true sentence for the question, then 'for the decision, that means', then your answer to the decision. Offer the detail after the meeting, with a time.",
  idea: "When a mechanism question pulls the room away from the decision, answer it in one true sentence, then say what that means for the decision on the table. Offer the detail afterwards, with a time. The answer must be real, and the bridge goes back to the decision, not away from the question.",
  why: "A mechanism question is usually asked for one of two reasons: the asker wants to know you weighed the alternative, or they are curious. One true sentence settles the first and does not starve the second, because it can be followed up. A full answer is rarely what either needs, and the people who cannot follow it cannot interrupt it either, because they cannot tell where it has stopped being relevant.\n\nThe bridge is the part that does the work. It names the decision the room came to make and says what the mechanism means for it, so the detail becomes evidence for the decision rather than a detour from it. Refusing the question is the other way to lose the room, since declining reads as hiding something and the questioner, who asked in good faith, will ask again. A real answer, a bridge and a named time afterwards leave nobody without what they came for.",
  failureMode: "The head of customer success is waiting on a yes for the retail onboarding. A staff engineer asks about queue design, the platform engineer answers with real enthusiasm for three minutes, and two more questions grow out of the answer. The meeting ends with the decision moved to next week's review, and the go-live date being negotiated with the retail customer slips a week with it.",
  worked: "The line being repaired is the engineer's three-minute answer to why each tenant has its own task queue, given while a head of customer success waited on a yes or no for onboarding the retail customer's 400 sub-accounts. The repair is two sentences, and the first is a real answer: 'So that one tenant enqueuing a hundred thousand tasks backs up its own queue and workers, not everyone else's.' Then the bridge, which names the decision rather than the topic: 'For the retail onboarding, that means the 400 sub-accounts load only that customer's queue and workers, so nobody else slows down and the answer for this month is yes. I will take the autoscaling and cache detail with you after this meeting.' The cache, autoscaler and priorities detail survive, at a named time.\n\nWhat changed is that the room got an answer in one breath and a decision a minute later, instead of an answer in three minutes and a decision next week. The cost is the one sentence, which you can only write if you understand the mechanism well enough to compress it without making it false, and a questioner who may feel passed over until the detail conversation happens. That conversation is now a commitment with a time on it.",
  experiment: "In your next review, answer the first mechanism question in one sentence and bridge back to the decision. Within the hour, ask the person who asked whether your sentence answered them, and write down what they say. If it did not, the sentence was wrong or too thin, and that is the fact you came for.",
  reflection: "In your last review, how long was the longest stretch on something the decision-maker could not follow, and what had to wait because of it?",
  recall: {
    q: "A staff engineer asks a mechanism question while a director waits on a decision. What are your two sentences, and what does each do?",
    a: "The first answers the question truthfully in one sentence, which settles whether you weighed the alternative. The second names the decision and says what the mechanism means for it.\n\nOffer the detail afterwards with a time. Refusing the question and answering it in full both lose the room."
  },
  deepDive: "Here is a design choice I am often asked to justify. Help me write the one-sentence true answer and the bridge to a decision, and tell me what the sentence leaves out that a sharp questioner would press on."
},
{
  id: "room-premortem-the-presentation",
  track: "room",
  title: "Write the five questions you hope nobody asks, then prepare an answer for each",
  source: "Gary Klein, Performing a Project Premortem (Harvard Business Review, 2007)",
  gatePrompt: "Take the presentation you give next, or the plan you are about to put to someone. Imagine it has just gone badly and the last question was one you could not answer. Write the five questions you most hope nobody asks, in the asker's words, and the first word of your answer to each.",
  fallback: "Thursday review. Proposal: move the connector sync workers from fixed pools to KEDA scaling on task queue backlog. Expected result: sync worker spend down about 30 per cent, no change in sync freshness. Rollout starts with three tenants next sprint, then the rest over two sprints. Ask: approval to start, and one engineer for six weeks. Audience: director of engineering, head of customer success, a finance partner.",
  idea: "Before you present, assume the review has gone badly and write the five questions that did it, in the asker's own words. Give each an answer whose first word is yes, no, a number, or 'I do not know' with a day. The questions you hope nobody asks are the ones to prepare first.",
  why: "Klein's premortem rests on prospective hindsight: if you assume a plan has already failed and ask why, the reasons come more easily than when you ask what could go wrong. His version is a team exercise on a project. The same switch is available to you alone, on a talk, because the questions you hope nobody asks are ones you have already noticed and chosen not to prepare for. You carry them as a vague unease, and unease does not get an answer drafted.\n\nWriting them in the asker's words turns each into an item: an answer, a number to find, or an honest gap. It also sorts them, and the question you cannot answer yet is the one to work on first. To find five, try these kinds: the figure you do not have, the cheaper option you did not price, the customer or team the plan leaves out, the date that depends on someone else, and what it costs to go back. Alone, you only find what you can imagine, so show the list to one colleague.",
  failureMode: "The review goes well until the director asks what 30 per cent is in dollars. The engineer has the percentage from a test and no bill to apply it to. While the figure is found the approval slips a sprint, and in the second review the finance partner asks why the team did not just buy reserved capacity. Nobody had priced it. The engineer had half-thought of it the night before and not written it down.",
  worked: "The proposal was to scale the sync workers on queue backlog instead of fixed pools, for a 30 per cent saving. These are the five questions its author hoped nobody would ask, each with the answer as it would be said. 'What is 30 per cent in dollars?' Answer: '$11,400 a month, off a $38,000 bill.' 'What happens to freshness when a burst hits a scaled-down fleet?' Answer: 'Four minutes late at worst, against a fifteen-minute promise.' 'Why not buy reserved capacity and skip the engineering?' Answer: 'I do not know; I will price it by Tuesday.' 'Does this add an on-call burden?' Answer: 'No: the alerts go to the existing sync rota.' 'Can we go back if it goes wrong?' Answer: 'Yes: one flag per tenant restores the fixed pool in minutes.'\n\nEach answer cost something. The $11,400 meant asking finance for the sync fleet's bill, which nobody had broken out. The four minutes meant a load test and a day's work. The reserved-capacity question was the one the author most wanted to skip, and it is the real competitor: Tuesday's number may decide whether the proposal should be made at all. Answering 'I do not know' commits the author to Tuesday, in front of the room, for a figure that may end the proposal.",
  experiment: "Write the five questions for your next presentation on one page, each with the first word of your answer and the figure that backs it. Find the one with no figure and get it before the meeting. Then show the page to a colleague who has sat in that room and ask for the sixth question. Note which kind it was, because that is the kind you do not see.",
  reflection: "Which question about your current plan have you already noticed and chosen not to prepare for, and what would you have to find out to answer it?",
  recall: {
    q: "Why write the questions as if the presentation has already gone badly, rather than asking what might go wrong?",
    a: "Assuming the failure has happened turns what might go wrong into what went wrong, which is easier to answer, and it brings out the questions you have been avoiding.\n\nEach one then becomes an answer, a figure to find or an honest gap."
  },
  deepDive: "Here is the summary of a presentation I give next week. Play a sceptical director and ask me the five questions that would hurt most, then tell me which of my answers would not survive a second question."
},
{
  id: "room-repair-after-the-room",
  track: "room",
  title: "When a senior colleague answers for you, send the crisp version afterwards",
  source: "Standard staff-work practice",
  gatePrompt: "Think of a question aimed at your area that someone senior answered for you in the last month. Write the follow-up you would send the asker, with the senior person copied: open by agreeing, give the crisp answer with its number, and name one thing still open with a date. Four lines at most.",
  fallback: "Head of sales: Can the platform take the retail customer's peak season?\n\nDirector of engineering: Yes, the platform team has been load testing and we're in good shape.\n\nAccount plan, afterwards: Retail peak - platform ready.\n\nYour own notes from the load test: 2.5 times last year's peak orders per hour, held for 30 minutes, sync tier slowest. Their forecast is 2.2 times.",
  idea: "When someone senior answers a question meant for you, send the asker a short follow-up the same day. Open by agreeing, give the figure or date that makes the answer usable, and name what is still open with a day. It adds to their answer rather than correcting it.",
  why: "When a senior person answers first, their answer becomes the room's record. Your silence is read as agreement, and the asker acts on what was said at the altitude it was said: 'in good shape' goes into the plan as 'ready'. The senior was not wrong. They gave the best summary they held, and the figure that makes it usable was in your notes, not theirs. That gap does not close by itself, and every day it stays open the vague version hardens into the shared one.\n\nThe repair works because it adds rather than corrects. A correction makes the senior choose, in public, between you and their own answer. An addition lets them keep what they said and gain a number, and a sentence to reuse next time the question comes. It also puts your name on the figure, which is how a number you produce starts to be a number you own. Send it the same day, short enough to read in one pass, with the answer in the first line. If their answer was wrong rather than thin, tell them first, before the asker.",
  failureMode: "The head of sales writes 'platform ready' in the account plan. Six weeks later the retail customer revises its forecast up to 3 times last year's peak, and nobody reopens the plan, because it already says ready. The load test's real result, 2.5 times, sits in your notes. The margin first becomes visible during the peak, when the sync tier is the slowest part and the customer is on the phone.",
  worked: "The line being repaired is 'platform ready' in an account plan, built on a director's answer of 'in good shape' to a head of sales who asked whether the platform could take the retail customer's peak. The follow-up goes to the head of sales that afternoon, with the director copied: 'That matches what the load test showed, and here is the figure behind it. We tested at 2.5 times last year's peak orders per hour and held it for thirty minutes; their forecast is 2.2 times, so we are about 14 per cent above it. For the customer you can say tested above forecast. The sync tier was the slowest part, and a second test at 3 times is on the 20th; I will post the result here.'\n\nWhat changed is that the plan now holds a number the head of sales can repeat and a date when it gets firmer, and the director has a sentence to reuse next time, not a correction. The cost is a visible second answer to a question that felt closed, a commitment to the 20th, and a figure that can now be argued with: the customer may fairly ask whether 14 per cent is enough for their worst day.",
  experiment: "Find a question from the last two weeks that someone senior answered in your area, where you hold a figure or date they did not. Write the follow-up in four lines or fewer, opening with agreement, and send it today. A week later, check whether your line appears in their next update.",
  reflection: "Which answer given on behalf of your area in the last month would have changed if the person answering had held your one figure?",
  recall: {
    q: "A senior colleague answers for you, correctly but without your figure. What should the follow-up do, and what must it avoid?",
    a: "Add the figure and a sentence they can reuse, opening with agreement, the same day.\n\nDo not correct them: a correction makes them choose between you and their own answer in front of others."
  },
  deepDive: "Here is an exchange from a review where my director answered a question meant for me, and the figure I hold that they did not. Draft the four-line follow-up that opens with agreement and gives the asker something usable."
}
);

<script>

(window.LESSONS = window.LESSONS || []).push(
{
  id: "metric-own-the-outcome",
  track: "metric",
  title: "Own an outcome, not a workstream - say it as a rate that can get worse",
  source: "Josh Seiden, Outcomes Over Output",
  gatePrompt: "Write one sentence saying what you own, as you would say it to your director. Then rewrite it as a rate: a share of something your customers do or receive, with a denominator, that could get worse next month. If you cannot name the denominator, write down who would know.",
  fallback: "What I own: the workflow engine migration. This half I moved 14 of the 22 workflow types from the legacy cron scheduler onto Temporal, rewrote the worker deployment, wrote the cutover runbook and built the replay tooling. Status: 64 per cent complete, on track for end of Q4. Risks: two connector workflows pin a library we have not upgraded. Next: migrate the remaining 8 workflow types and decommission the cron paths.",
  cheat: "Say what you own as the share of customer runs, requests or jobs that end well with nobody stepping in, and have last month's figure ready.",
  idea: "State what you own as a rate that can get worse, not as a project that can only finish. A project is on track, late or done. A rate has a denominator and a direction, so it tells you each month whether the work changed anything. The migration becomes one way to move it.",
  why: "What you say you own decides what people ask you about. 'I own the migration' invites questions about the schedule, because a project can only finish. 'I own the share of customer runs that finish without anyone stepping in' invites the question your director is paid to ask, which is whether the number moved. Seiden draws the same line between output, what a team makes, and outcome, a change in what people do that moves a result the business cares about.\n\nA rate also stays yours after the project ships, which is when a project statement stops telling anyone anything. It can fall for reasons you did not cause, such as a customer's misconfigured connector or another team's deploy, and being the person who notices and explains is what ownership means here. It also frees the choice of fix. Once the number is yours, the migration is one candidate for moving it, to be dropped if something cheaper appears.",
  failureMode: "At the half-year review you report the migration: all 22 workflow types moved, on schedule, cron paths removed. Your director asks whether customers noticed, and you do not know. Support's weekly count of runs someone had to restart is where it was in March, because the failures were never in the scheduler. The project closes as a success and the problem it was meant to fix is still handled by hand.",
  worked: "The line being repaired is 'What I own: the workflow engine migration'. Asking what the migration was for turned up the answer: runs stalling on the old scheduler and being restarted by hand. So the thing to own is the share of customer runs that finish with nobody stepping in, meaning no manual retry, replay or support ticket. Joining support's restart log to run history gave 4,310 interventions in 181,000 runs last month. The new line reads: 'I own the share of customer workflow runs that complete without anyone intervening. It was 97.6 per cent in October, about 1 run in 42 needing a person. The migration is how I expect to move it.'\n\nWhat it cost: the denominator took two days and a favour, because manual restarts lived in a support tool nobody had joined to run history. The migration also stops being the story. It can finish on time and leave the number at 97.6, in which case you have learned the scheduler was not the main cause, and you have to say so. And the figure also moves when a customer misconfigures a connector, so you will be asked about it long after the migration has nothing left to report.",
  experiment: "Pick the system you are asked about most. Define one rate for it, the share of attempts that end well with no human step, and find last month's figure, taking the human steps from support or on-call records rather than your own metrics. Write the sentence 'I own the share of ...' with that figure and show it to your manager.",
  reflection: "Which of the things you say you own can only be done or late, and what would customers see get worse if it went wrong?",
  recall: {
    q: "Why is an owned rate a better answer to 'what do you own?' than the name of a project?",
    a: "A project can only be on track, late or done, so questions about it stay on the schedule. A rate has a denominator and a direction, so it says whether customers got anything for the work.\n\nIt also stays yours after the project ships, which is when a project would stop telling anyone anything."
  },
  deepDive: "Here is how I describe what I own in my review doc. Help me find the customer-facing rate behind it, and tell me what I would have to count to work out last month's figure."
},
{
  id: "metric-outcome-and-inputs",
  track: "metric",
  title: "Hang two or three inputs you can move under the one outcome you cannot",
  source: "Amplitude, North Star Framework",
  gatePrompt: "Write the outcome you own at the top of a page. Under it, list the two or three things that, if they moved, would move it, and mark which your team could change this quarter. Cross out any you cannot tie to a piece of work you could start on Monday.",
  fallback: "Platform KPIs for Q1: workflow success rate, p99 workflow start latency, worker pod restarts, KEDA scale-up time, task queue backlog, activity retry rate, Postgres connection saturation, monthly cloud spend, deploys per week, on-call pages per week. Owner: platform team. Review: monthly in the platform sync. Targets to be set once we have a baseline for each.",
  idea: "Name the one outcome and keep it at the top, then split what stops it reaching target into two or three inputs your team can move directly, ideally as parts that add up to the shortfall. The outcome tells you whether you are winning. The inputs tell you what to do on Monday.",
  why: "Amplitude's North Star framework puts one metric at the top, the one that captures the value customers get, and hangs a handful of input metrics beneath it that teams can act on directly. The structure earns its place because an outcome moves slowly, with noise, and partly for reasons outside your control. A team watching only the outcome cannot tell whether last week's work did anything, and a team given only inputs optimises them without knowing why they matter.\n\nThis entry adds one check. If the inputs are the parts of the shortfall, so that all of them at target would put the outcome at target, the list is complete and each input has a size. An input that can improve while the outcome stays put is a number you can raise without helping anyone. A flat list of ten metrics has neither property, and when two of them disagree nothing says which one wins.",
  failureMode: "The platform plan lists ten KPIs, all at the same level. At the quarterly review pod restarts are down 30 per cent and p99 start latency is up 12 per cent, and the room spends twenty minutes on which matters more. Nothing on the page says. The team ends up talking about the number that improved, and stuck runs, which none of the ten measures, arrive a month later as three customer escalations.",
  worked: "The situation being repaired is a quarterly plan that lists ten platform metrics at one level, with no outcome above them. The outcome worth owning is the share of customer runs that complete with no one stepping in, 97.6 per cent last month, so 2.4 per cent of runs needed a person. Reading 200 of last month's interventions and scaling up split that 2.4 into three causes: 1.3 points from runs that exhausted their retries, 0.7 from runs that stalled with no alert, and 0.4 from runs stranded by a deploy or a worker restart. Those are the three inputs, and each has work attached: error classification, a stuck-run alert, draining workers on deploy. Retry rate, pod restarts and queue backlog become diagnostics under them. The other six metrics move to other pages or come off.\n\nWhat it cost: two days reading interventions, and the sampling error that comes with 200 of them, up to 0.2 points on each input. That is enough to choose where to work and not enough to prove a small gain. The move also commits you in public. If the three inputs reach 0.9, 0.2 and 0.2 and the outcome does not reach 98.7, the split is wrong, and you will have to say so.",
  experiment: "Take the last 20 times your outcome missed, whether runs, deploys or requests, and sort each into the single cause that made it a miss. Keep the three biggest causes as your inputs and write each as a rate you could compute. Put the table where your team will see it, and note which input you have never measured.",
  reflection: "Which metric on your page could improve this month without the outcome moving, and why is it still there?",
  recall: {
    q: "How can you check that a set of input metrics really drives an outcome before you build work around it?",
    a: "Ask whether all the inputs at target would put the outcome at target. Best case they are the parts of its shortfall and add up to it.\n\nIf they would not, the list is missing an input, and an input that can move without the outcome moving is a number worth dropping."
  },
  deepDive: "Here is the outcome I own and the metrics I report today. Help me split the outcome's shortfall into two or three inputs, and tell me which of my current metrics sit under none of them."
},
{
  id: "metric-baseline-before-merge",
  track: "metric",
  title: "No before-number, no claim - capture it before the first PR merges",
  source: "Standard improvement-project practice",
  gatePrompt: "Take the next change you will ship to make something better. Before its PR merges, write down the number it should move: the value today, the query or panel that produced it, the date range, and how much that number normally swings from one week to the next.",
  fallback: "PLAT-3104: Rework activity retry policy for connector sync workflows. Replace the fixed policy (5 attempts, 30 seconds apart) with exponential backoff, and classify errors so non-retryable ones fail fast instead of burning attempts. Expected result: fewer failed syncs. PR #4812 is ready for review. Will check the dashboard once it has rolled out and report back.",
  idea: "Before the first change merges, record the metric's current value with the query that produced it, the date range and its normal week-to-week swing. After the change the old behaviour no longer exists to measure, and a claim with no before-number is a story.",
  why: "A result is a difference, and the before half of the difference is the half that disappears. Once the change ships, production no longer behaves the old way, so you can only reconstruct the baseline from history that may define the metric differently, cover less of the system, or have been stitched together after the fact. Anyone who wants to dispute your result will dispute that reconstruction first, because it is the softest part of it.\n\nComputing the baseline first also tests the metric. The events you need may only have been emitted since March, or the manual replays may sit in a tool the run history never sees, and you find that out while you can still add the instrumentation. The weekly swing matters as much as the value. A rate that normally wanders by a point cannot show you a half-point gain, and knowing that before you ship stops you announcing one.",
  failureMode: "Three months after a retry rework the director asks what it bought. You remember the completion rate being around 96. The panel you would use was created in the same sprint as the change, and run history before that keeps no record of manual replays. You say about two points. Support says it felt the same. Neither of you can check, and the work is now a claim.",
  worked: "The line being repaired is 'Will check the dashboard once it has rolled out', which names no before and no bar. Before the PR merges, work out the share of connector sync runs that finish with no manual replay, week by week for the previous eight weeks. The eight-week figure is 96.4 per cent and the weekly values ran from 95.8 to 97.1, so the normal swing is 1.3 points. The ticket gets a new line: 'Baseline, eight weeks to end of October: 96.4 per cent, weekly range 95.8 to 97.1, query linked. Success is above 97.1 for three weeks running.'\n\nWhat it cost: half a day, and a surprise. The first query returned 98.9 per cent, because replays run through the on-call CLI were not counted, and the corrected 96.4 came from joining the support log. The PR merged a day late. It also set a bar the work can fail. If the rate settles at 97.0, inside the old range, the honest report is no detectable change, and that sentence now has to be said.",
  experiment: "Pick the next change you will merge. Before it merges, write the baseline into the ticket: the value, the query, the date range and the weekly low and high. If you cannot compute it, write down what you would have to instrument first. Then send the ticket link to whoever will ask what the change achieved.",
  reflection: "For the last improvement you shipped, could you prove the before-number to a sceptic today, and if not, what should you have saved?",
  recall: {
    q: "Why capture the baseline before the change merges, and what besides the value goes in the record?",
    a: "Afterwards the old behaviour is gone, and a rebuilt baseline rests on history that may define or cover the metric differently. Record the value, the query, the date range and the normal weekly range.\n\nThe range sets how large a move must be to count as a result."
  },
  deepDive: "Here is a change I am about to merge and the metric it should move. Help me write its baseline entry: the query, the window, the weekly range, and what I would have to instrument if the history is missing."
},
{
  id: "metric-three-that-pull-apart",
  track: "metric",
  title: "Pick three numbers that pull against each other: room to grow, reliability, cost",
  source: "Andy Grove, High Output Management",
  gatePrompt: "Take the metric you are most often asked for. Write the cheapest change that would improve it while making your platform worse on room to grow, reliability or cost, then name the number on your page that would show it. If there is none, add one.",
  fallback: "Q4 platform goal: cut cloud cost per tenant by 25 per cent, from $300 to $225 a month. Plan: drop each worker pool from six idle replicas to two, move the batch queues to spot nodes, and tighten pod requests using VPA recommendations. Tracking: monthly cloud bill divided by active tenants, on the cost dashboard. Review: end of quarter.",
  cheat: "Report room to grow in months, reliability and cost on one line every time, so any trade between them is visible with its price.",
  idea: "Report three numbers together, one for room to grow, one for reliability and one for cost, chosen so that the cheap way to improve any one of them moves another. A trade then shows up as a trade with its price, instead of as a saving now and an incident later.",
  why: "Spare capacity is the dial all three numbers share. Turn it down and cost falls, room to grow shrinks and reliability thins at the next spike. Turn it up and the reverse happens. So a target on any single number will eventually be met by turning that dial, and a single-number report cannot show which way it was turned. Goodhart, writing about monetary targets, and Campbell, about social indicators, described the same drift: lean on one number and the behaviour behind it reorganises around the number.\n\nGrove's rule was to pair each indicator with a second one that watches for the damage the first invites. A platform has three corners to trade between, so the pair becomes three. With all three on one line, every change lands on a number someone is already reading, and a real saving can be told apart from a purchase of risk. That protects the owner as much as the reader: a cost cut shown beside two numbers that held is a result you can defend.",
  failureMode: "The cost goal is met in October: cloud spend per tenant down 25 per cent, reported in green. In November two large tenants onboard in the same fortnight, the trimmed worker pools saturate, and 3 per cent of runs stall for a day. The spare capacity removed in October was what would have absorbed that spike. The saving was real, the incident was its price, and the report only ever showed the first.",
  worked: "The goal read 'cut cloud cost per tenant by 25 per cent', tracked by one number. Its cheapest route, dropping each pool's idle replicas from six to two and moving the batch queues to spot nodes, is paid for out of the other two numbers. A load test of the trimmed pools puts the ceiling at 520 tenants, down from 640, so at 400 tenants and 20 new a month, room to grow falls from twelve months to six. A two-week spot trial took unaided completion, the share of runs finishing with no one stepping in, from 97.6 to 96.9 per cent. On one line the saving reads as what it is: cost $225, room to grow six months, completion 96.9. Right-sizing pod requests alone reaches $273 with both others unchanged.\n\nWhat it cost: the goal got smaller. The 25 per cent was in someone's budget, and the honest version is 9 per cent for free, with the remaining $48 per tenant priced at six months of room to grow and 0.7 points of completion. That is now a decision the director has to take on the record, and may refuse. You also took on two numbers to keep current: the ceiling needs a load test each quarter, and completion needs a count of human steps from support.",
  experiment: "Write your three: one number for room to grow, one for reliability, one for cost, each with today's value. For each pair, write the cheapest change that improves one and worsens the other, and check that a number on the page would show it. Put all three on one line in your next update, even if one reads badly.",
  reflection: "When did you last cut cost or add capacity on your platform, and which of the other two numbers moved without anyone watching it?",
  recall: {
    q: "Why report room to grow, reliability and cost on one line instead of picking the most important one?",
    a: "Spare capacity is the dial all three share, so the cheap way to improve any one moves another. One number cannot show which way the dial was turned.\n\nOn one line a trade is visible with its price, and a free saving can be told apart from a bought one."
  },
  deepDive: "Here is a goal I have been given with a single target. Help me find the cheapest way to hit it that would hurt room to grow, reliability or cost, and tell me which numbers I would need on the page to catch it."
},
{
  id: "metric-cloud-spend-share",
  track: "metric",
  title: "Report cloud spend as a share of revenue - monthly, with its trend",
  source: "Standard SaaS-finance practice",
  gateIntro: "In a budget review a finance partner asks how the platform's cloud spend compares with what customers pay. Your dashboards show cost per tenant, utilisation and latency, and none of them answers that. Count a year as twelve months of the bill against a year of what customers pay, and a hundred turns the ratio into a per cent.",
  compute: { question: "What share of revenue does your platform's cloud bill take?", expr: "cloudMonthly * 12 * 100 / (customers * acv)", unit: "per cent of revenue" },
  idea: "Take the cost number your finance partner already reads, cloud spend as a share of revenue, and report it every month with its trend and the reason it moved. Owning a metric means being the person who explains each month's change, not the person who worked it out once.",
  why: "A cloud bill in dollars rises with the business and says little on its own. As a share of revenue it says whether cost is keeping pace with what customers pay, in the terms a CFO already uses to read cost, so it needs no translation. Your engineering dashboards answer other questions well. This one answers the question the person who sets the platform's budget is asking.\n\nThe number becomes yours through the monthly report. A figure worked out once is a fact. A figure you explain every month is a metric you own. The trend has two causes, your bill moving or revenue moving, and they are easy to confuse. The share falls when sales close deals while the bill sits flat, with no engineering involved, and an owner who takes credit for that has misreported. Say which of the two moved it, and by how many points.",
  failureMode: "At the budget review the CFO asks for 10 per cent off the infrastructure line. You argue from cost per tenant and a utilisation chart. The CFO has the finance pack open: cloud spend is 7.5 per cent of revenue and has risen 0.2 points a quarter for a year, and that is the figure the 10 per cent was taken from. You are arguing from numbers nobody in the room reads against one that everybody does.",
  worked: "A platform has 400 customers at an average of $60,000 a year, so revenue is $24 million. The cloud bill is $150,000 a month, $1.8 million a year, which is 7.5 per cent of revenue. Three months earlier it was 380 customers, the same contract value and a $132,000 bill, which is 6.9 per cent. The update reads: 'Cloud spend was 7.5 per cent of revenue in October, up from 6.9 in July. The bill added 0.9 points, mostly dedicated workers for two export-heavy tenants, and revenue growth took back 0.3. I expect it to hold near 7.5 until the pools are right-sized in December, and I will report November on the same basis.'\n\nWhat it cost: an input you had to dig out and two commitments. Contract value came from sales operations, because the planning slide's figure was a list price. You also chose between customers times contract value and finance's recognised revenue, and you now use the same one every month. And the sentence commits you to a December forecast that can prove wrong. The first month the share rises for reasons unrelated to your work, it still goes in the update.",
  experiment: "Get the three figures from the people who hold them: customers and contract value from sales operations or finance, the cloud bill from whoever owns your cloud accounts. Work out the share for each of the last three months and write a two-line update with the trend, saying whether the bill or revenue moved it. Send it to your manager before anyone asks.",
  reflection: "Which of the three figures did you have to ask someone for, and what does it say that you did not already hold it?",
  recall: {
    q: "Your cloud spend share fell this month. What do you check before reporting it as an improvement?",
    a: "Whether the bill or revenue moved it. The share falls when sales close deals while the bill stays flat, with no engineering involved.\n\nSplit the change into the part from the bill and the part from revenue, and report both."
  },
  deepDive: "Here are my customer count, contract value and cloud bill for the last three months. Work out the share and its trend, split each month's change into the bill's effect and revenue's effect, and draft the two-line update."
},
{
  id: "metric-report-the-miss",
  track: "metric",
  title: "Report the miss as loudly as the hit, because that is why your next number is believed",
  source: "Standard staff-work practice",
  gatePrompt: "Take your last metric report or update and mark each number hit or miss against its target. Rewrite the first two lines so the biggest miss comes first, in the same words and format you would use if it had hit, with how far it missed, why, and the date you will report it again.",
  fallback: "Platform metrics, October. Unaided completion 97.9 per cent (target 98.2), up 0.3 on September. Room to grow 11 months at current growth (floor 9). Cloud spend flat month on month. Highlights: stuck-run alert shipped, support has adopted the replay CLI. Other: runs interrupted by deploys were 0.6 per cent (target 0.4). Next: design review for drain-on-deploy.",
  idea: "Put the miss in the same place, the same words and the same format as a hit, with its size, its cause and the date you will report it again. The reader cannot audit your numbers, so they believe the hits only as far as they have seen you report misses.",
  why: "A reader of your metric report cannot check most of what is in it, so they judge the numbers by the pattern of the report. A report that never shows a miss is either perfect or filtered, and perfect is rare. They conclude it is filtered and discount every hit by whatever they suspect was left out. A hit only carries information if the same report would have shown a miss.\n\nA miss usually reaches the reader by another route, from support, a customer or someone else's dashboard. When it does, the damage is not to that one number. Every earlier report becomes one the reader now suspects, and you have lost the chance to attach the cause and the plan. Reported first, in your words, the same miss reads as an owner doing the job, and the credibility it earns is what makes the next number believed.",
  failureMode: "The October report leads with the good news and files the missed deploy-interruption target under 'other'. In the November review the director opens support's dashboard, sees the same interruptions and asks why the report never mentioned them. Your hits stop reading as good news and start reading as a selection, and you spend the meeting defending numbers that were fine.",
  worked: "The line being repaired is the opening one, 'Unaided completion 97.9 per cent (target 98.2), up 0.3 on September', which reports a miss as progress while its cause sits further down under 'Other'. The report now opens: 'Unaided completion, the share of customer runs finishing with no one stepping in, missed its October target: 97.9 per cent against 98.2, though up from 97.6. Two thirds of the gap, 0.2 points, is runs interrupted by deploys, 0.6 per cent against a target of 0.4. The cause is deploys that do not drain workers. The design review is on the 20th and I expect the input back at target in December.' The hits follow in the same format: room to grow 11 months against a floor of nine, stuck-run alert shipped.\n\nWhat it cost: the month's headline is now a miss on a number the director tracks, where before it read as progress. Splitting the 0.3-point gap into its inputs took a morning, and you needed it, because the first question would be why. You also committed to December for the input, and the next report will show whether you kept it. In return, the November hits arrive from someone the reader has already watched report a miss.",
  experiment: "Open your last three metric reports and mark each number hit or miss against its target. Count how many misses sat in the first two lines with a cause attached. Then ask one regular reader which numbers in them they assumed were left out, and write down the answer.",
  reflection: "If your reader learned of the last miss you did not report from someone else, what would they conclude about all your other numbers?",
  recall: {
    q: "Why does a report that shows only hits make the hits less believable?",
    a: "A reader who cannot audit the numbers judges them by the pattern, and a report that never misses is either perfect or filtered. They assume filtered and discount every hit.\n\nA miss reported in the same place and words as a hit makes each hit informative, because the report would have shown a miss."
  },
  deepDive: "Here is my latest metric update, with the number that missed its target. Rewrite it so the miss comes first with its size, cause and next step, and tell me what a sceptical director would ask."
}
);
