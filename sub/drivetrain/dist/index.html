{
  id: "unassigned-read-the-bets",
  track: "unassigned",
  title: "Read the bets for the two or three numbers leadership is staring at",
  source: "Richard Rumelt, Good Strategy Bad Strategy",
  gatePrompt: "Open your company's current OKRs and the latest board update or all-hands deck. List every number that appears in more than one of them, and beside each write the sentence that says what is in the way. Then write one line per number on how your platform moves it, or that it does not.",
  fallback: "OKRs, H2: cut median time to first production workflow from 47 days to 30; lift net revenue retention from 106 to 115 per cent; hold gross margin. Board update, Q3: ARR $61M, up 34 per cent; net retention 106 per cent; gross margin 69 per cent, down from 72 on AI inference spend; two churned logos cited slow rollout. All-hands slide: time to first workflow 47 days, 11 new enterprise logos, 99.95 per cent uptime.",
  idea: "Before you look for problems, find out what leadership is trying to move. Read the OKRs, the board update, the strategy memo and the all-hands slides, and take the two or three numbers that recur. Beside each, copy the sentence that names the obstacle, then write how your platform touches it.",
  why: "Rumelt's argument is that a strategy starts with a diagnosis, a plain statement of what is making the goal hard, and that much of what gets called strategy skips it. Such documents give a target and a list of initiatives and leave the obstacle unnamed. A leadership document therefore holds two kinds of sentence: the number, and, rarely, the sentence beside it that says why the number is not already where they want it. That second sentence tells you where work is needed.\n\nA number that recurs across the OKRs, the board update and the all-hands is one somebody senior reviews on a schedule and will fund work to change. A target with no stated cause is an open question, and you may be the only person who knows the mechanism that connects it to your platform. Nobody assigned you that problem because nobody upstream has traced the gap down to the platform.",
  failureMode: "A platform team spends a quarter moving the workflow cluster to a new task-queue layout and cuts p99 latency by a third. It is clean work. The board update that quarter has three numbers on its front page: net retention, time to first production workflow and gross margin, and the migration moves none of them. At planning the head of product asks what the platform team is doing about time to value, and the answer is a latency graph.",
  worked: "Three figures recur across the three excerpts: time to first production workflow (47 days against a target of 30, on the OKRs and the all-hands slide), net retention (106 per cent against 115, on the OKRs and the board update) and gross margin (69 per cent, down three points, on the OKRs and the board update). The causes sit beside them: two churned logos cited slow rollout, which ties retention to the first figure, and margin fell on AI inference spend. Those are the bets. ARR growth, new logos and uptime appear once each, with no target. Mapping the platform: it sets time to first workflow through tenant provisioning and connector setup, margin through inference cost per run, and retention only through the first.\n\nThe cost is that the mapping is a guess made in writing, and it can be wrong. Nobody yet knows how the 47 days split between provisioning and the customer's own delays, and the Postgres upgrade planned for next quarter touches none of the three: fine for work that has to be done, but better known on paper than discovered at planning. The three lines go to a manager with one question: which is wrong?",
  experiment: "Pick the number from your list that your platform touches most. Find the person who presents it to leadership and ask two questions: what moved it last quarter, and what do they think is stopping it now? Write their answer down word for word and set it against your one-line mapping.",
  reflection: "Which number on your company's last all-hands slide does your current project move, and how would you show that to the person presenting it?",
  recall: {
    q: "Why read a leadership document for the sentence beside the number, and what does a target with no stated cause offer you?",
    a: "The sentence beside a number says why it has not moved, and that is where work is needed; the target alone is only a goal. Repeated numbers are the ones being watched.\n\nA target nobody has explained is an open diagnosis. If you know the mechanism linking it to your platform, you can supply what nobody upstream has written."
  },
  deepDive: "Here are my company's OKRs and the summary of the last board update. Pull out the two or three figures that recur, find the sentence near each that explains the gap, and tell me where my mapping to the platform is too generous."
},
{
  id: "unassigned-shadow-customer-calls",
  track: "unassigned",
  title: "Sit in on the calls where customers hesitate, complain and reach for a spreadsheet",
  source: "Standard product-discovery practice",
  gatePrompt: "Open the recording or notes from one customer session you did not run: a sales call, an onboarding or a support escalation. List each moment anyone hesitated, each complaint, and each workaround outside the product. Circle the one a platform change could remove, and write the question that would show how common it is.",
  fallback: "Onboarding call notes, tenant-c (large financial services customer), 50 minutes. Their data lead asked twice whether the nightly sync 'definitely finishes before 7am'. Each Monday an analyst exports the failed-run list to a spreadsheet and sends it to their director. The admin said that when a connector broke last month they 'just reran everything'. Their security team wants to know which agent touched which dataset. Wants SSO before rolling out to 300 users. Otherwise happy, signing the order form Friday.",
  idea: "Sit in on a sales call, an onboarding and a support escalation, and only listen. Write down where anyone hesitates, what the customer complains about unprompted, and what they do outside the product, especially an export to a spreadsheet. Those moments mark problems nobody has filed, because the customer found a way round them.",
  why: "A queue records the problems somebody cared enough to file. A customer who has a workaround files nothing: the Monday spreadsheet works, the rerun-everything habit works, and the pain goes on without ever reaching a ticket. Hesitation is the other quiet signal. When a solutions engineer says they will check, or a customer asks twice whether something always finishes, you have found a question the platform cannot answer with confidence, and somebody is deciding on the strength of the answer.\n\nThe people on the call hear the problem but cannot see the mechanism, and you can see the mechanism but never hear the problem. 'Slow on Mondays' is a complaint to them and a specific collision between two jobs to you. Asking to listen is also a small request, which makes it easy to grant, and it keeps you from proposing a fix before you understand the problem.",
  failureMode: "The platform roadmap is built from the ticket queue and from what the head of sales asks for. Meanwhile three enterprise tenants each export their failed runs to a spreadsheet every Monday, and a solutions engineer tells prospects 'we will check' whenever they ask how fast a new tenant comes up. None of it is a ticket. The clearest sign of a renewal at risk sits in a spreadsheet nobody on the platform team has seen.",
  worked: "The notes call it a happy call, but four lines are not. 'Definitely finishes before 7am', asked twice, is hesitation: the customer does not trust the nightly sync. The Monday export of failed runs is a spreadsheet standing in for a view the product lacks. 'Just reran everything' is a workaround with a cost nobody has counted, and the security team's question about which agent touched which dataset is a request for an audit trail. SSO is a real request, but somebody already owns it. The one to circle is the Monday export, because it recurs, crosses the customer's organisation and is probably not unique to this tenant. The next question, for the account owner: how many tenants run it, and who reads it?\n\nThe cost is discipline and a smaller conclusion than you wanted. You listen and offer no fix on the call, because a fix offered live becomes a promise. One call proves nothing, so what you leave with is four hypotheses and a reason to ask a solutions engineer how often they hear each. And you now know about problems you cannot fix this quarter.",
  experiment: "Ask a solutions engineer or support lead to let you listen in on one session this week, or open a recording of one. Take notes in three columns: hesitation, complaints, workarounds. Then send them your two strongest lines and ask how often they hear each one.",
  reflection: "When did you last hear a customer describe their problem in their own words, and what were they doing about it in the meantime?",
  recall: {
    q: "Why will a platform problem customers have learned to live with never reach your ticket queue, and where does it show up instead?",
    a: "A customer with a workaround files nothing. The problem shows up as hesitation, an unprompted complaint, or work done outside the product, such as a weekly export to a spreadsheet.\n\nWhoever is on the call hears it but cannot see the mechanism. You can, and that pairing turns a remark into a platform problem."
  },
  deepDive: "Here are my notes from a customer call I sat in on. Sort every line into hesitation, complaint, workaround or noise, and for each real signal tell me what question to put to whoever owns the account."
},
{
  id: "unassigned-count-the-queue",
  track: "unassigned",
  title: "Group the queue by cause, not symptom, and count before you propose anything",
  source: "Standard problem-management practice",
  gatePrompt: "Export the last 90 days of tickets and incidents that reached your team, with each resolution note. Group them by cause rather than title. For each group count the tickets, the different customers and the hours spent, then write the biggest group that one platform change would remove as one sentence with all three counts.",
  fallback: "Platform queue, last 30 days, title then resolution. 'New upload not searchable' (tenant-a): index job behind a bulk load, ran later. 'Scheduled run did not start' (tenant-b): schedule paused by deploy, resumed. 'Agent cites deleted doc' (tenant-d): delete not yet in index, re-ran job. 'Agent timeout on large result set' (tenant-c): raised timeout. 'Search results out of date' (tenant-f): index job behind a bulk load, ran later. 'Upload fails over 200 MB' (tenant-e): raised limit. 'Doc updated, answer unchanged' (tenant-a): index lag, re-ran job. 'Search missing yesterday's pages' (tenant-g): index job behind a bulk load, ran later.",
  idea: "Pull a quarter of tickets and incidents, read the resolution notes, and group by cause. Count tickets, distinct customers and hours spent in each group. A group that one platform change would remove for everyone is your candidate, and its three counts are the number the proposal opens with.",
  why: "Symptoms vary and causes repeat. One stale index arrives as an upload nobody can find, a deleted document still cited and an answer that ignores an edit, filed by different customers, triaged by different people on different days, so each looks like a one-off. Operations practice separates the incident, which is closed by restoring service, from the problem, which is the cause behind one or more incidents. Support closes its ticket and on-call closes its incident, so nobody's job is to add the cause up.\n\nCounting before proposing ranks candidates by what they cost rather than by which one annoyed you most recently, and the dull cluster often beats the vivid incident. It gives the proposal its opening line: tickets, customers and hours are figures a director can lay against a headcount ask. And the test that one change removes the group for everyone separates a platform problem from a pile of customer-specific fixes.",
  failureMode: "After a vivid night of pages, an engineer proposes rewriting the retry layer in the agent gateway. The queue says otherwise: that incident was one of three in ninety days, while tickets that all came down to a stale search index, filed under four different titles by seven customers, came to 38. Nobody had added them up, because each had been closed correctly by whoever caught it. The rewrite takes a quarter, and the 38 keep coming.",
  worked: "The titles read as eight problems: an upload not searchable, a skipped schedule, a deleted doc still cited, a timeout. The resolution notes group them differently. Five of the eight - 'new upload not searchable', 'agent cites deleted doc', 'search results out of date', 'doc updated, answer unchanged' and 'search missing yesterday's pages' - ended with the index running behind, across four of the seven tenants listed. The opening line of a proposal follows: five of eight tickets this month, four tenants, one cause, a search index that falls behind and is noticed by customers first. Support's time log gives about 40 minutes a ticket, so the five cost under four hours, and the case rests on who the four tenants are.\n\nThe work was reading eight resolution notes instead of eight titles, and it has to be repeated over ninety days before the count can carry a proposal. Two of the five tickets came from tenant-a, so the honest customer count is four, and a sceptic can shrink it further. The count can also demote a favourite: the agent timeout that looked worst is one ticket in eight.",
  experiment: "Take your top group to the person who closes most of those tickets. Ask what they do each time, how long it takes, and what single change in the platform would make them stop. Write down the minutes and the change in their words, then multiply by your count.",
  reflection: "Which recurring problem in your queue are you sure about without having counted it, and what would you guess the count is?",
  recall: {
    q: "Why does one cause hide in a queue read ticket by ticket, and what do you count once you group by cause?",
    a: "Titles describe symptoms, which vary by customer and by day, so one cause hides as several unrelated tickets. Cause groups show the repeat.\n\nCount tickets, distinct customers and hours spent. A group is platform-shaped if one change in the platform removes it for everyone."
  },
  deepDive: "Here is an export of my team's recent tickets with their resolution notes. Group them by underlying cause, count tickets and distinct customers in each group, and tell me which group a single platform change would remove."
},
{
  id: "unassigned-one-page-proposal",
  track: "unassigned",
  title: "The one-page proposal answers five questions, and the last is when you would stop",
  source: "Standard staff-work practice",
  gatePrompt: "Write the proposal for a problem you have counted on one page, in five labelled parts: the problem and its number, two or three fixes with a cost each, your recommendation, what you ask this reader to do, and the result that would make you stop. Write 'unknown' for any gap, and who could fill it.",
  fallback: "Proposal: streaming indexing pipeline. Search results are sometimes stale after uploads and edits. We should rebuild indexing as a streaming pipeline with change data capture, per-tenant partitions and an index freshness dashboard. This will make search more reliable, reduce support load and improve the customer experience. I think it is about a quarter of work for two engineers. Let me know what you think and whether we can fit it in.",
  cheat: "One page, in order: the problem with a number, two or three options each with a cost, your recommendation, the ask in one sentence, and the result at which you would stop.",
  idea: "Put the proposal on one page in a fixed order: the problem with a number, two or three options each with a cost, your recommendation, the ask in one sentence, and the result at which you would stop. Each part answers a question the reader would otherwise ask, or answer against you.",
  why: "A decider reading a proposal is silently asking five things: is this real, is it the only way, what do you think we should do, what do you want from me, and what happens if it does not work. Each missing part leaves a question open, and an open question is answered against you. The last is the most often missed: without a stop, yes is an open-ended commitment, and the cautious reader says no or says later.\n\nAmazon's working-backwards practice, as Bryar and Carr describe it, has the author write the press release and the FAQ before anything is built, so an idea has to survive being read before it gets engineers. One page for unassigned work borrows that discipline at a smaller scale. The stop condition is an addition, and it is what lets a decider say yes to something nobody asked for.",
  failureMode: "A clear, well-written paragraph proposing a streaming indexing pipeline goes to a director, who replies 'interesting, let's discuss at planning'. At planning it is one of nine items, there is no number to rank it by, and 'let me know what you think' asks for an opinion, not a decision. It is neither approved nor rejected. Three months later two more tenants report stale search results, and the proposal is still 'interesting'.",
  worked: "The draft proposed a streaming indexing pipeline: one option, no number, a cost with no basis, and an ask that was a request for opinions. Rebuilt, the page says: 'Problem: five of the eight tickets that reached the platform team last month, from four tenants, were the search index running behind, because incremental jobs queue behind bulk loads. Support spent about 40 minutes on each, and one tenant renews in March. Options: do nothing, under four hours of support time a month and the renewal exposed; give incremental indexing its own queue ahead of bulk loads, plus a lag alert, 2 engineer-weeks; rebuild as a streaming pipeline, about 24 engineer-weeks. Recommendation: the queue and the alert. Ask: 2 engineer-weeks from the next sprint, approved today. Stop: if p95 index lag is not under five minutes after a month, I stop and say why.'\n\nThe page cost numbers that had to be found: the ticket count from the queue, the minutes from support's log, the renewal month from the account team. It also cost a commitment the page can now lose on, since the stop line can fire. And it gave up the draft's ambition: the streaming pipeline becomes a later decision, made from a month of lag data.",
  experiment: "Send your one-page proposal to the person who could say yes, and name the date by which you need an answer. When they reply, write down the first question they ask. It points at whichever of the five parts was weakest, and that part is what you rewrite before the next one.",
  reflection: "Which of the five questions did your last stalled proposal leave open, and who ended up answering it for you?",
  recall: {
    q: "Why does a proposal with a stop condition get approved more easily than the same proposal without one?",
    a: "Without one, saying yes commits the decider to an open-ended cost, so a cautious decider answers no or later. A stop condition bounds the downside to a named result and date.\n\nEvery part of the page does the same job: it settles a question before the reader can settle it against you."
  },
  deepDive: "Here is a proposal I am about to send. Check it against the five questions a decider will silently ask, and tell me which one it leaves open and what number I would need to close it."
},
{
  id: "unassigned-size-the-first-step",
  track: "unassigned",
  title: "A first step that can get a yes has a date, a price and a stop",
  source: "Ryan Singer, Shape Up",
  gatePrompt: "Take your proposal, or the programme you wish someone would fund. Cut it to the smallest first step that produces a real number. Write its end date, its cost in engineer-weeks, how you would switch it off, and the result that would make you stop.",
  fallback: "Ask: approve a four-month programme to build an audit trail for agent actions. Scope: event capture in the agent gateway, an append-only store with retention controls, a query UI for tenant admins and a scheduled export for security reviews. Two engineers. Benefits: unblock enterprise security reviews, support compliance questionnaires, give customers visibility. We need a decision this month to land before the next review cycle.",
  idea: "Size the first step to what one decider can approve without asking anyone else: a fixed date, a price in engineer-weeks, a way to switch it off, and the result at which it stops by default. Make it the part that tests the claim the whole programme depends on, not a slice of the build.",
  why: "Shape Up gives two ideas that fit unassigned work. An appetite is a time budget fixed before the design, so the work is shaped to fit what it is worth, where an estimate starts from a design and arrives at a number. A circuit breaker is the rule that work missing its deadline stops by default, and an extension needs a fresh decision. Together they cap what the decider can lose at a known number of weeks.\n\nUnassigned work is hard to approve, because it has no sponsor and no slack in anyone's plan. A programme asks the decider to bet quarters on a causal story they cannot check. A first step asks for weeks and answers the question the programme depends on, so the number it produces earns the second ask. Reversible matters as much as small: a read-only report or a feature flag can be abandoned on any day at no cost.",
  failureMode: "A proposal for two engineers for four months of audit-trail work reaches a director who agrees it matters and cannot say yes alone. It goes to planning and sits behind four funded programmes. Eight weeks later it is cut to 'investigate' with no date. A two-week logging step, with a CSV for the security reviews already open, would have been approved in a corridor and would by now have said whether the programme was worth building.",
  worked: "The ask was two engineers for four months to build an audit trail for agent actions, about 32 engineer-weeks, as one decision, with benefits arriving only at the end. The claim it depends on is that customers' security reviews need a query UI, and nothing in it tests that. The first step: from the gateway, log each agent tool call - tenant, agent, dataset, time - into an append-only table, and give the three tenants with open security reviews a CSV on request. One engineer, two weeks, so two engineer-weeks. Switching it off means turning off one logging flag. Read-out on the Friday of week three. Stop: the step ends there unless someone decides to continue, and if all three reviews close on the CSV alone, the UI is never proposed. If two or more insist on it, the programme comes back with their names behind it.\n\nThe cost is two checks before a promise: asking the three security teams what would close their reviews, and getting security to approve access to a table of dataset names before the first row is written. The result can go the uncomfortable way, too: if the CSV is enough, the programme the original ask wanted is never built.",
  experiment: "Show your first step to the person who would have to approve it and ask one question: could you say yes to this today without asking anyone else? If not, ask who else has to agree and what size of step they could approve alone. Write that size down in engineer-weeks.",
  reflection: "Which of your proposals could be approved in one conversation, and which can only go to a committee because of how you sized it?",
  recall: {

  fallback: "Hi, I saw 'scheduled agent runs' is on the Q1 roadmap, scoped as a calendar service. The platform team would like to be involved earlier in scoping, since we often only hear about requirements once the spec is final and by then it is hard to change anything. Could we be added to the planning meetings for new features? Happy to join whenever suits.",

<script>
/*
 * A four-operator arithmetic evaluator over named profile fields.
 *
 * Entries declare their sum as a string, so something has to turn that string
 * into a number. Not eval, and not a Function constructor: this runs in a page
 * that holds the reader's own financial figures, and an expression is content
 * rather than code. The grammar is an allowlist - decimal numbers, declared
 * identifiers, the four operators, brackets, and a leading sign. Anything else
 * fails to tokenise, so a call, a subscript, a semicolon or a property access
 * never reaches an evaluator at all.
 *
 * Both halves of the toolchain use this. build.js compiles every expression at
 * build time and checks its identifiers against the declared profile, which is
 * what stops a typo from surfacing as a silent NaN months later on the one day
 * that entry comes up.
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.EXPR = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  var NUM = /^\d+(?:\.\d+)?/;
  var NAME = /^[A-Za-z_][A-Za-z0-9_]*/;
  var PREC = { '+': 1, '-': 1, '*': 2, '/': 2 };

  function tokenize(src) {
    var s = String(src), out = [], i = 0;
    while (i < s.length) {
      var rest = s.slice(i), c = rest.charAt(0), m;
      if (c === ' ' || c === '\t' || c === '\n') { i++; continue; }
      if ((m = NUM.exec(rest))) { out.push({ t: 'num', v: parseFloat(m[0]) }); i += m[0].length; continue; }
      if ((m = NAME.exec(rest))) { out.push({ t: 'name', v: m[0] }); i += m[0].length; continue; }
      if (c === '(' || c === ')') { out.push({ t: c }); i++; continue; }
      if (PREC[c]) { out.push({ t: 'op', v: c }); i++; continue; }
      throw new Error('unexpected "' + c + '" at position ' + i);
    }
    if (!out.length) throw new Error('empty expression');
    return out;
  }

  /* Shunting-yard. `expectOperand` is what rejects the shapes that tokenise
     cleanly but are not arithmetic: two values in a row, a doubled operator
     such as **, or a bracket opening straight after a value, which is how a
     function call would have to look. */
  function toRPN(tokens) {
    var out = [], ops = [], expectOperand = true, i, tk, top;
    for (i = 0; i < tokens.length; i++) {
      tk = tokens[i];
      if (tk.t === 'num' || tk.t === 'name') {
        if (!expectOperand) throw new Error('two values in a row near "' + tk.v + '"');
        out.push(tk);
        expectOperand = false;
      } else if (tk.t === 'op') {
        if (expectOperand) {
          if (tk.v !== '-' && tk.v !== '+') throw new Error('"' + tk.v + '" needs a value before it');
          out.push({ t: 'num', v: 0 });          // unary: -x becomes 0 - x
          ops.push(tk);
        } else {
          while (ops.length) {
            top = ops[ops.length - 1];
            if (top.t === 'op' && PREC[top.v] >= PREC[tk.v]) out.push(ops.pop());
            else break;
          }
          ops.push(tk);
        }
        expectOperand = true;
      } else if (tk.t === '(') {
        if (!expectOperand) throw new Error('a bracket cannot follow a value');
        ops.push(tk);
        expectOperand = true;
      } else {
        if (expectOperand) throw new Error('empty brackets');
        while (ops.length && ops[ops.length - 1].t !== '(') out.push(ops.pop());
        if (!ops.length) throw new Error('unbalanced brackets');
        ops.pop();
        expectOperand = false;
      }
    }
    if (expectOperand) throw new Error('expression ends with an operator');
    while (ops.length) {
      top = ops.pop();
      if (top.t === '(') throw new Error('unbalanced brackets');
      out.push(top);
    }
    return out;
  }

  function compile(src) { return toRPN(tokenize(src)); }

  function names(src) {
    var seen = {}, out = [];
    tokenize(src).forEach(function (tk) {
      if (tk.t === 'name' && !seen[tk.v]) { seen[tk.v] = 1; out.push(tk.v); }
    });
    return out;
  }

  /* Returns null rather than NaN for a missing field or a division by zero.
     A NaN would render as "NaN" and read as a computed answer. */
  function run(src, vars) {
    var rpn = compile(src), st = [], i, tk, a, b, v;
    for (i = 0; i < rpn.length; i++) {
      tk = rpn[i];
      if (tk.t === 'num') { st.push(tk.v); continue; }
      if (tk.t === 'name') {
        v = vars ? vars[tk.v] : undefined;
        if (typeof v !== 'number' || !isFinite(v)) return null;
        st.push(v);
        continue;
      }
      b = st.pop();
      a = st.pop();
      if (tk.v === '+') st.push(a + b);
      else if (tk.v === '-') st.push(a - b);
      else if (tk.v === '*') st.push(a * b);
      else if (b === 0) return null;
      else st.push(a / b);
    }
    v = st.pop();
    return (typeof v === 'number' && isFinite(v)) ? v : null;
  }

  return { compile: compile, names: names, run: run, tokenize: tokenize };
});
