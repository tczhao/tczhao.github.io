<script>
/* Track: The cheapest thing that works. Ordered foundational first. */
(window.LESSONS = window.LESSONS || []).push(
{
  id: "cheapest-no-code-options-first",
  track: "cheapest",
  title: "List the options that write no code before you design the one that does",
  source: "Standard staff-work practice",
  gatePrompt: "Take the next thing you were about to build and ask: if we could not write code for a month, how would the business cope? Then list the no-code options - change a process, configure what exists, buy, do it by hand, do nothing - with a rough cost for each.",
  fallback: "PLAT-3178: Build a notification service for connector failures. When a tenant's connector fails three syncs in a row, email the tenant admins with the error and a link to the connector page. Needs per-tenant notification preferences, templating and an opt-out. Requested by: Support, after tenants noticed stale data. Estimate: two engineers, six weeks. Alternatives considered: put it in the connector service, or in a new service.",
  cheat: "List what writes no code first: change a process, configure what exists, buy, do it by hand, do nothing. Price each before you price the build.",
  idea: "Before you design the thing that needs code, list the options that do not: change a process, configure something you already run, buy, do it by hand for a while, or do nothing. Price each. The build then has to beat a real alternative instead of a blank page.",
  why: "An engineer asked to solve a problem reaches for the option they can control and price, which is code. The other options belong to other people - a process lives with support or sales, a purchase with finance - so they feel like someone else's decision, and the alternatives section of a design doc fills up with other designs. The approver is left choosing between this build and an unexamined status quo, and the build wins by default.\n\nA priced list changes the question from whether to build this to whether it beats the cheapest alternative. The month without code is the forcing question because it makes the business's existing workaround visible, and that workaround is your baseline, your fallback and often your answer. The cheap options also teach: a process change or a manual run shows the real volume before you commit weeks of engineering to it.",
  failureMode: "A notification service ships after seven weeks. In its first quarter it sends eleven emails. Each is correct, and each could have been written by a support agent from a template within the hour, since the failure alert already reached the on-call channel. The team now patches, upgrades and carries the pager for a service whose whole job is one routing rule and one email.",
  worked: "The ticket's only alternatives are two places to put the code. Asked how the business would cope for a month without code, Support said they would want the failure alert engineering already gets and would email tenants themselves. Do nothing: eleven stale-data tickets a quarter at about two hours each. Change a process: Support owns the follow-up and emails from a template, fifteen minutes a failure. Configure what exists: route the alert into the support queue, an afternoon. Buy: a notification product needs procurement and an integration, slower than the problem. By hand: until the routing exists, an engineer emails affected tenants and counts the real volume. The build is twelve engineer-weeks, about 48,000 dollars at 4,000 each. The update says: 'From this week failed-sync alerts reach Support, who email the tenant within the hour. If that costs them more than an hour a day, I will bring back the notification service.'\n\nWhat it cost: you proposed a manual step for another team, which holds only if Support agrees it has the hours, so the first job was asking them. You also named a trigger anyone can check you against, and your team's output this month is a routing rule, not a service.",
  experiment: "Pick the next ticket you would start. Before opening a design doc, write five no-code options for it with a rough cost each, and ask the person who filed it what the business would do for a month if you could not build it. Put the list above the design.",
  reflection: "Think of your last design doc: how many of its alternatives could have been run without writing any code?",
  recall: {
    q: "Why ask how the business would cope for a month without code, and what does the answer give you?",
    a: "It surfaces the workaround the business already runs, which is your baseline, your fallback and often the cheapest answer.\n\nThe no-code options are a process change, configuration of what exists, a purchase, doing it by hand and doing nothing. The build has to beat the best of them, priced."
  },
  deepDive: "Here is a design doc I am about to write. List the no-code options I have not considered, and for each one tell me which number I would need to find to compare it with the build."
},
{
  id: "cheapest-rigour-by-cost-of-failure",
  track: "cheapest",
  title: "Set rigour by what failure and waiting cost, not by what you would defend in review",
  source: "Beyer et al., Site Reliability Engineering (O'Reilly, 2016), Embracing Risk",
  gatePrompt: "Take a change you are shipping this week. Write down what a week of delay costs the business and what one failure costs, including whether it can be undone. Then list the rigour you are applying - tests, review, staged rollout, alerting - and mark what the numbers do not justify, and what they demand that is missing.",
  fallback: "Status: the agent latency dashboard is slipping about ten weeks. Before launch I'm adding a 10x load test, multi-region failover and a full rollback runbook, since we shouldn't ship anything half-done. About 30 engineers use it today. Separately, the new metering export that feeds invoices went out on Tuesday after a quick local test, and I'll keep an eye on the totals this week.",
  idea: "Rigour is bought with weeks, so buy it where failure is expensive. Price a week of delay and one failure, including whether it can be undone. Where waiting costs more than a mistake, ship the rough version and say what you skipped. Where a mistake cannot be undone, the thorough version is the cheap one.",
  why: "Engineers set quality by what they would be comfortable defending in review, which treats rigour as a property of the work rather than a purchase paid for in weeks. It also arrives as one dial, so a dashboard and an invoice get the same standard. Unbundled, it is a menu with very different prices: a reconciliation check costs days and guards against wrong numbers, multi-region failover costs weeks and guards against an outage. An item earns its place only if the failure it prevents is expensive.\n\nThe Site Reliability Engineering book treats reliability as something to spend, not maximise: past a point more of it costs speed and features and no user can tell, because the rest of their path is less reliable than the service, so the target is whatever the business is willing to bear. Failure cost has two parts, how many people it reaches and whether it can be reversed. The second is what makes billing different: a wrong chart is fixed by a deploy, but a wrong invoice has already been sent.",
  failureMode: "The dashboard slips ten weeks for failover that 30 internal users will never need. In that time a latency regression in the agent gateway goes unseen for nine days, because the six engineers still compare numbers by hand, and the customer who hit it tells their account team before anyone on the platform knows. The wait was never priced, so nobody can say what the rigour cost.",
  worked: "The update announced a ten-week slip for an internal dashboard, to add a load test, failover and a rollback runbook, while the invoice metering export had shipped after a quick local test. Without the dashboard six engineers spend two hours each a week comparing latency by hand, 1,200 dollars a week at 100 dollars an hour, so the slip costs about 12,000 dollars, and a failure is a wrong chart for a day that a redeploy undoes. The export is the reverse. Waiting costs almost nothing, but a wrong total on 400 invoices already sent takes half an hour each to correct, about 20,000 dollars, and cannot be unsent. The update becomes: 'Dashboard ships on its original date with a manual rollback and no failover. The metering export gets a reconciliation against raw usage before every invoice run.'\n\nWhat changed: the dashboard ships ten weeks earlier and the export gets checking it never had, both set by prices rather than habit. What it cost: three numbers from outside your team - the hours of hand comparison, the invoices a bad run reaches, finance's time per correction - and a public statement that the dashboard has no failover, so an outage in week one is a risk you named in advance.",
  experiment: "Pick one change in flight and one that shipped recently. For each, write the weekly cost of delay and the cost of one failure, with whether it can be undone, and note the rigour you applied. Find the pair where rigour and cost disagree most, get the delay number from whoever is waiting, and take it to your team.",
  reflection: "Which of your current checks exists because failing would feel bad, rather than because failing would cost something you could name?",
  recall: {
    q: "What two prices set how much rigour a change gets, and what makes a failure dear beyond how many people it reaches?",
    a: "A week of delay and one failure. Where waiting costs more, ship rough and say what you skipped; where a failure is dear, buy the rigour.\n\nFailure also costs more when it cannot be undone: a wrong chart is fixed by a deploy, a wrong invoice has already been sent."
  },
  deepDive: "Here is a change I am shipping, with its tests, rollout plan and alerting. Tell me which of them the cost of failure does not justify, and which it demands that I have left out."
},
{
  id: "cheapest-do-it-by-hand-first",
  track: "cheapest",
  title: "Do it by hand first - the log you keep is the spec",
  source: "Eric Ries, The Lean Startup",
  gatePrompt: "Pick something you are about to build or automate. Write the by-hand version: the steps a person would take to deliver the outcome for one customer tomorrow, how long it would take, and the four columns of the log you would keep - who asked, what they needed, minutes spent, what they did with the result.",
  fallback: "PLAT-3412: Customer-facing agent quality report. A self-serve page where tenant admins see pass rate, latency percentiles and regressions for each of their agents, plus a weekly email digest and CSV export. Requested by: Sales, for three enterprise renewals. Design: new reporting service reading eval results from the warehouse, per-tenant access control, scheduled digest job. Estimate: two engineers, eight weeks.",
  idea: "Before building a feature or automating a process, deliver the outcome by hand to a few real customers and keep a log. Each case records what they asked for, what they used and what it took. The log becomes the specification, and the manual version costs almost nothing to abandon.",
  why: "Ries describes a concierge version of a minimum viable product: instead of building the service, you deliver it by hand, personally, starting with a single customer. The point is not saving money or time. It buys information about whether the outcome is wanted, at the price of one person's hours, before any engineering is committed to guessing the answer.\n\nA requirements meeting records what people say they want. A by-hand run records what they do: which numbers they quote back, which part they ignore, what they ask for that nobody listed. It also exposes the exceptions that will eat the build, because the person doing the work meets every one. And it gives you the cost per case, the figure any automation has to beat. The limit is volume. By hand is the right tool at a few cases a week and the wrong one at fifty, so set the number at which you stop before you start.",
  failureMode: "Two engineers spend eight weeks on a self-serve quality report. It launches with latency percentiles, a CSV export and a weekly digest. Of the three renewing customers, two read only the pass rate and ask what changed since last month, which the page does not show, and none opens the latency chart. An engineer could have emailed them what they actually used, by hand, in 45 minutes each.",
  worked: "The ticket asks for a self-serve quality report for three renewing customers. Instead, at month end an engineer runs the eval suite against each customer's agents, writes a one-page summary of pass rate and regressions and emails it, 45 minutes each, logging four things: who asked, what they needed, minutes spent, what they did with it. After six reports, two customers had replied, both quoting the pass rate on their own test cases and asking what changed since last month, and nobody mentioned latency percentiles, one of the three metrics on the planned page. The log's spec is a monthly digest per agent, one engineer for three weeks instead of two for eight. The update says: 'Three customers have had a manual quality report for two months, and the self-serve version will be the monthly digest they used.'\n\nWhat it cost: six reports at 45 minutes is four and a half hours, nothing against the build. More seriously, you promised three customers a monthly delivery in public, so a late report would have been noticed, and three may not stand for the forty enterprise tenants. So the stop rule is set first: when manual reports pass ten a month, build the digest.",
  experiment: "This week, offer whoever asked for a feature the by-hand version instead: you deliver the outcome manually, once a week for a month, and tell them it is a manual pilot. Send the offer, agree the first delivery date, and start the four-column log. Write at the top the number of cases a week at which you stop and build.",
  reflection: "What did you build for a request that three by-hand cases would have shown to be smaller, different or unwanted?",
  recall: {
    q: "What does delivering a feature by hand to a few customers tell you that a requirements meeting does not, and what limits it?",
    a: "It records what customers do, not what they say: what they use, ignore and ask for, the exceptions, and the cost per case.\n\nVolume limits it. By hand suits a few cases a week, so fix the number at which you stop before you begin."
  },
  deepDive: "Here is a feature request I am about to estimate. Help me design the by-hand version: the steps, the four-column log, and the number of cases after which I should stop and build."
},
{
  id: "cheapest-price-the-people",
  track: "cheapest",
  title: "Price the people, not just the bill, before you compare managed with self-hosted",
  source: "Standard total-cost-of-ownership practice",
  gateIntro: "A proposal lands to move the workflow engine off a managed service, because its invoice looks large next to the cluster it would run on. The comparison on the table is bill against bill. Nobody has put a price on the engineers who would run it, so start there, using your own cost of an engineer-week.",
  compute: { question: "If running a system yourselves takes one engineer-week a month in upgrades, tuning and incidents, what does that cost a year?", expr: "12 * engWeek", unit: "dollars a year" },
  idea: "A managed service shows its price on an invoice. A self-hosted one hides its price in engineers' weeks. Before comparing the two, add the people: upgrades, tuning, incidents and on-call, priced at your own engineer-week. The honest comparison is infrastructure plus people plus on-call against the managed fee, over the same year.",
  why: "The two options are priced in different places. A managed service arrives as an invoice, where every director can see it and ask why it is so large. A self-hosted one arrives as infrastructure on the cloud bill and as time in salaries that nobody attributes to it. The cluster looks cheaper because much of its cost is booked elsewhere, and comparing invoice with invoice makes the cheaper-looking option win by construction.\n\nCount what the work is: version upgrades, tuning its databases, incident follow-up, patching, capacity reviews. Each is a week not spent on anything that moves a customer metric. Priced at your own engineer-week, they turn into a line a finance partner can read. On-call is the line people forget: a pager costs broken evenings, which show up as attrition or time off in lieu, and it is paid whether or not the system pages.",
  failureMode: "A director sees the managed workflow engine at 9,000 dollars a month and asks whether it can be cheaper. The team moves it onto its own cluster at 3,500 a month and announces a saving of 66,000 a year. Over the next twelve months one engineer-week a month goes on upgrades and database tuning, two weekend incidents land on the team, and nobody sums any of it, so the move is remembered as a saving.",
  worked: "Take a platform paying 9,000 dollars a month for a managed workflow offering, 108,000 a year, against a self-hosted cluster and its databases at 3,500 a month, 42,000 a year. On the invoice, self-hosting saves 66,000. Now the people. One engineer-week a month at 4,000 dollars is 48,000 a year, and the extra on-call rotation, in allowances and recovery time, is about 20,000. All in, self-hosting costs 110,000 against 108,000, so on cost alone it is a draw. The update says: 'Self-hosting the workflow engine costs about 110,000 a year all in, against 108,000 managed. It is not a saving, so any case for moving rests on control or data residency.'\n\nWhat changed: a 66,000 dollar saving became a 2,000 dollar cost, and the discussion moved from the invoice to what control is worth. What it cost: two figures from outside your team, the engineer-week from finance and the on-call allowance from the people team, and a third that is yours, one engineer-week a month, which your team will check against how last year really went.",
  experiment: "Find what one engineer-week costs from finance, not from a guess. Then take one system your team runs that a vendor also sells. List the hours your team spent on it last quarter from the tickets and the pager history, price them, and add them to its infrastructure bill. Put the all-in figure next to the managed price and send both to whoever owns the budget.",
  reflection: "Think of a system you run yourselves that a vendor also sells: what did its upgrades, tuning and incidents cost last year in engineer-weeks?",
  recall: {
    q: "Why does comparing a managed invoice with a self-hosted cluster bill favour self-hosting, and which lines correct it?",
    a: "The invoice shows the managed price in full, while much of the self-hosted cost sits in salaries and on-call that nobody attributes to it.\n\nCompare like with like: infrastructure plus people plus on-call, over the same year, priced at your own engineer-week."
  },
  deepDive: "Here are the infrastructure bill, the managed price and my estimate of the hours we spend on a system we run ourselves. Check that I have counted upgrades, tuning, incidents and on-call, and tell me which line a sceptical finance partner would challenge first."
},
{
  id: "cheapest-payback-in-months",
  track: "cheapest",
  title: "Say payback in months, and say what it becomes if the saving halves",
  source: "Standard investment-appraisal practice",
  gateIntro: "A cost-saving idea has come up at two planning meetings without anyone deciding. The cloud bill is on a dashboard and engineer time sits in a spreadsheet, but nobody has put the two in one sentence. Use your own figures and work out how long this one takes to earn its keep.",
  compute: { question: "A change that takes six engineer-weeks and cuts the cloud bill by ten per cent - how many months until it pays for itself?", expr: "6 * engWeek / (cloudMonthly * 0.1)", unit: "months" },
  cheat: "State payback in months, then again with the saving halved. If the halved figure still clears the bar, ask for the yes; if not, measure the saving first.",
  idea: "Give the case as months until it pays for itself, not as a return percentage. Months can be laid against the plan the listener already holds. Then say what the figure becomes if the saving arrives at half, which doubles it, and say whether the answer is still yes.",
  why: "A return percentage answers a question the listener has not asked. It needs a horizon and a baseline before it means anything, so the first thing a room does with 800 per cent is argue about what it is a percentage of. Months until payback needs no agreement. It is one division, and anyone can set it against what they already hold in their heads: the planning cycle, the contract term, how long the system will live. That is why it tends to get the quicker yes.\n\nThe half-saving case is the useful part. Payback is effort divided by monthly saving, so it moves with the saving in inverse proportion: effort that overruns by half lifts payback by half, but a saving that arrives at half doubles it. Savings are the figure you are least sure of, since they rest on traffic and pricing you do not control. If the answer is still yes at half, nothing more needs analysing. If it flips, measure the saving before anyone builds. Payback says nothing about what comes after the break-even, so it suits a saving that starts at once.",
  failureMode: "You pitch the right-sizing work as a three-year return of several hundred per cent. The finance partner asks what it is measured against and whether the saving holds for all three years, and the meeting spends ten minutes on your assumptions. The decision moves to next quarter's planning. Had you said it pays for itself in four months, eight if the saving is half, the question would have been whether four months is good enough, and it is.",
  worked: "Take a platform with a 60,000 dollar monthly cloud bill and an engineer-week that costs 4,000 dollars. A right-sizing change takes six engineer-weeks, 24,000 dollars, and cuts the bill by ten per cent, 6,000 dollars a month. Payback is 24,000 divided by 6,000, four months. If the saving arrives at half, 3,000 a month, it is eight months; if the work overruns by half, to nine weeks, it is six. The update says: 'Right-sizing the worker pools pays for itself in four months, and in eight if the saving comes in at half. We replan in twelve months, so I am asking for six weeks from this sprint.'\n\nWhat changed is the question the approver has to answer: not whether a percentage is good, but whether eight months in a bad case is acceptable. What it cost: you had to get the engineer-week figure from finance rather than guess it, and find which part of the bill the saving applies to, since spend you have committed to is billed whether or not you use it. You have also said in public that the saving can come in at half, so a result below that makes your number wrong.",
  experiment: "Take a cost or efficiency idea you have mentioned but never pitched. Work out its payback in months from your own bill and engineer-week, then again with the saving halved, and write both in one sentence. Send it this week to whoever approves the work, and ask whether either figure would change their answer.",
  reflection: "Which saving have you claimed that you could not defend at half its size, and what would you measure to find out?",
  recall: {
    q: "Why does a saving that comes in at half hurt payback more than an effort overrun of half?",
    a: "Payback is effort divided by monthly saving. An overrun of half in effort multiplies it by 1.5; a saving at half divides the denominator by two and doubles it.\n\nSavings are the less certain figure, so quote payback at plan and at half, and check whether the answer survives."
  },
  deepDive: "Here is a cost-saving change I want to pitch, with my estimates of effort and saving. Check my payback sum, find which part of the bill the saving really applies to, and tell me which assumption to test first."
},
{
  id: "cheapest-subtract-before-you-add",
  track: "cheapest",
  title: "Subtract before you add - the cheapest workload is the one you delete",
  source: "Leidy Klotz, Subtract: The Untapped Science of Less",
  gatePrompt: "Take the last capacity, cost or reliability fix you proposed or were asked for. Before the add, list what already runs on the system, ranked by what it costs and by who would notice if it stopped for a week. Name the one thing you could delete or move off first, and the evidence you would use.",
  fallback: "PLAT-3107: Scale the workflow cluster for peak load. Workflow actions (starts, activities, timers and signals) are up 40 per cent in two quarters, and history service CPU and persistence latency now spike at peak. Proposal: add three history nodes and move the persistence database up two instance sizes. Cost: about 9,000 dollars a month. Requested by: on-call. Priority: High.",
  idea: "Before approving or writing an addition, rank what already runs by cost and by who would notice if it stopped. The cheapest workload is the one you delete. Delete what nobody uses, and move what does not need the expensive guarantee off the expensive system. Only then add capacity for what remains.",
  why: "Klotz and his co-authors ran studies in which people were asked to improve a design, a plan or a piece of writing, and found they defaulted to adding something and overlooked taking something away, even when removal was cheaper. The default got stronger when attention was loaded and weaker when the task cued subtraction. A capacity ticket is that setup: a pager, a latency chart and a request to make the system bigger.\n\nThe move works by supplying the cue that engineers are not given. A ranking by cost and by who would notice turns 'what should we add' into 'what is running that nobody would miss', and the answers come from data you already hold: actions per workflow type, last-used dates, calls per feature per month. Deletion also compounds. A removed workload stops costing compute and storage, but also stops needing upgrades, alerts, runbooks and a place on someone's mind. An addition does the reverse: it solves the load you have and creates the maintenance you will have.",
  failureMode: "The workflow cluster gets its three history nodes and a bigger database. Latency recovers for a quarter, then starts climbing again. Nobody had looked at which workflows were generating the actions: a health check run every minute for every tenant, and a nightly rollup feeding a dashboard page nobody opens, were between them 60 per cent of workflow actions. The bigger cluster now runs them faster.",
  worked: "The ticket proposes three history nodes and a bigger database for a 40 per cent rise in workflow actions. Ranking workflow types by actions a day and by who reads the output gave another list. A health check run every minute for each of 400 tenants is two actions a run, 1.15 million a day, 48 per cent of the 2.4 million total, and needs no history or replay, so the monitoring stack's own probes can do it. A nightly rollup feeds a dashboard page nobody has opened in 90 days and accounts for 288,000 actions, 12 per cent. Moving the first and retiring the second removes 60 per cent of actions. The update says: 'Workflow actions fall about 60 per cent next week with no new capacity, so the 9,000 dollar a month scale-up is deferred and I will re-measure in a month.'\n\nWhat changed: the ask went from adding capacity to removing most of the load first. What it cost: a day in workflow metadata and the warehouse to build the ranking, and a message with a date on it to the team that built the page. The probes need an owner and an alert, and if the cluster still struggles after the cut, the ticket was right and you have delayed it a month.",
  experiment: "Pull the last 30 days of actions or calls by type from your busiest system: workflow types, endpoints, features. Rank them by volume and by when anyone last read the output. For the top three, write whether anyone would notice if it stopped for a week, and ask the owner of the one you doubt most. Record who answers and what they say.",
  reflection: "Which of your last three capacity or cost fixes began with adding something, and what would a ranking by who would notice have shown?",
  recall: {
    q: "Why do engineers reach for adding capacity first, and which two-part ranking supplies the missing prompt to subtract?",
    a: "People default to adding and overlook removing, more so under load, unless something cues subtraction.\n\nRank what runs by cost and by who would notice if it stopped. Delete the unused and move what does not need the expensive guarantee, then add capacity for what remains."
  },
  deepDive: "Here is the list of workloads on my system with their daily volume and the date each was last read. Help me rank them by cost and by who would notice, and draft the message that asks the owner of the top candidate whether it can go."
}
);
