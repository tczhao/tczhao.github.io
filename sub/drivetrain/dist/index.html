<title>Drivetrain - how platform work reaches the business</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* ==========================================================================
   Practicum — a daily logbook for management practice

   Identity: an engineering lab notebook. Pale technical paper stock, a 28px
   graph field locked to the prose baseline, drafting blue for structure and
   oxide red-pen for anything that asks you to act.

   Theming is token-level. Components read tokens and never reach inside a
   media query, so the viewer's explicit toggle can win in both directions.
   ========================================================================== */

/* --- Light tokens (the default ground) ----------------------------------- */
:root {
  --paper:        #F5F6F3;
  --paper-raised: #FFFFFF;
  --paper-sunk:   #EBEEE8;

  --grid:         rgba(20, 26, 34, 0.055);
  --grid-major:   rgba(20, 26, 34, 0.10);
  --rule:         #DBDFD7;
  --rule-strong:  #B6BEB4;

  --ink:          #141A22;
  --ink-muted:    #545F6A;
  --ink-faint:    #8B949D;

  --accent:       #1D4E80;
  --accent-ink:   #163D66;
  --accent-soft:  rgba(29, 78, 128, 0.09);
  --accent-line:  rgba(29, 78, 128, 0.30);

  --action:       #9E3A26;
  --action-soft:  rgba(158, 58, 38, 0.075);
  --action-line:  rgba(158, 58, 38, 0.32);

  --solid:        #2F6B4F;
  --shaky:        #8A6A1F;

  --shadow-card:  0 1px 0 rgba(20, 26, 34, 0.05), 0 8px 22px -14px rgba(20, 26, 34, 0.30);
  --shadow-lift:  0 1px 0 rgba(20, 26, 34, 0.06), 0 16px 34px -18px rgba(20, 26, 34, 0.38);

  /* Type roles. No CDN fonts: the Artifact CSP blocks font hosts, and a
     linked webfont would fail silently, so every role resolves locally. */
  --face-display: Superclarendon, Rockwell, "Bookman Old Style", "Roboto Slab", Georgia, serif;
  --face-text:    Charter, "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --face-ui:      "Helvetica Neue", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  --face-mono:    "SF Mono", SFMono-Regular, Menlo, "Cascadia Mono", Consolas, monospace;

  /* 28px baseline. The graph field is a 28px minor / 140px major multiple of
     it, so body lines land on grid lines rather than near them. */
  --lead:  28px;
  --u:     7px;
  --rail:  17rem;
  --measure: 66ch;
}

/* --- Dark tokens: a negative blueprint under lamplight -------------------
   Retuned rather than inverted. The blue lifts to hold contrast on a dark
   ground; the red-pen warms so it still reads as ink, not as an error state. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper:        #101418;
    --paper-raised: #171D24;
    --paper-sunk:   #0B0E12;

    --grid:         rgba(158, 190, 214, 0.055);
    --grid-major:   rgba(158, 190, 214, 0.085);
    --rule:         #232C34;
    --rule-strong:  #37444E;

    --ink:          #DCE3E9;
    --ink-muted:    #96A2AD;
    --ink-faint:    #68737D;

    --accent:       #6EA8D4;
    --accent-ink:   #9AC4E4;
    --accent-soft:  rgba(110, 168, 212, 0.13);
    --accent-line:  rgba(110, 168, 212, 0.34);

    --action:       #D9755C;
    --action-soft:  rgba(217, 117, 92, 0.12);
    --action-line:  rgba(217, 117, 92, 0.36);

    --solid:        #63B08A;
    --shaky:        #C9A651;

    --shadow-card:  0 1px 0 rgba(0, 0, 0, 0.4), 0 8px 22px -14px rgba(0, 0, 0, 0.7);
    --shadow-lift:  0 1px 0 rgba(0, 0, 0, 0.45), 0 16px 34px -18px rgba(0, 0, 0, 0.8);
  }
}

:root[data-theme="dark"] {
  --paper:        #101418;
  --paper-raised: #171D24;
  --paper-sunk:   #0B0E12;

  --grid:         rgba(158, 190, 214, 0.055);
  --grid-major:   rgba(158, 190, 214, 0.085);
  --rule:         #232C34;
  --rule-strong:  #37444E;

  --ink:          #DCE3E9;
  --ink-muted:    #96A2AD;
  --ink-faint:    #68737D;

  --accent:       #6EA8D4;
  --accent-ink:   #9AC4E4;
  --accent-soft:  rgba(110, 168, 212, 0.13);
  --accent-line:  rgba(110, 168, 212, 0.34);

  --action:       #D9755C;
  --action-soft:  rgba(217, 117, 92, 0.12);
  --action-line:  rgba(217, 117, 92, 0.36);

  --solid:        #63B08A;
  --shaky:        #C9A651;

  --shadow-card:  0 1px 0 rgba(0, 0, 0, 0.4), 0 8px 22px -14px rgba(0, 0, 0, 0.7);
  --shadow-lift:  0 1px 0 rgba(0, 0, 0, 0.45), 0 16px 34px -18px rgba(0, 0, 0, 0.8);
}

/* --- Ground -------------------------------------------------------------- */
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--face-text);
  font-size: 17px;
  line-height: var(--lead);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

h1, h2, h3, h4, p, ul, ol, dl, dd, dt, figure, blockquote {
  margin: 0;
  padding: 0;
}
ul, ol { list-style: none; }
button { font: inherit; color: inherit; }

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
  border-radius: 1px;
}

.skip {
  position: absolute;
  left: -9999px;
  top: 0;
  z-index: 50;
  padding: var(--u) calc(var(--u) * 2);
  background: var(--accent);
  color: #fff;
  font-family: var(--face-ui);
  font-size: 0.8125rem;
  text-decoration: none;
}
.skip:focus { left: var(--u); top: var(--u); }

/* --- Shared type roles --------------------------------------------------- */
.eyebrow {
  font-family: var(--face-ui);
  font-size: 0.6875rem;
  font-weight: 600;
  letter-spacing: 0.13em;
  text-transform: uppercase;
  color: var(--ink-faint);
}

.num { font-family: var(--face-mono); font-variant-numeric: tabular-nums; }

/* ==========================================================================
   Layout: a bound page. Spine rail carries identity and position; the field
   is the paper itself.
   ========================================================================== */
.logbook {
  display: grid;
  grid-template-columns: var(--rail) minmax(0, 1fr);
  min-height: 100vh;
}

/* --- Spine --------------------------------------------------------------- */
.spine {
  position: sticky;
  top: 0;
  align-self: start;
  height: 100vh;
  display: flex;
  flex-direction: column;
  gap: calc(var(--u) * 4);
  padding: calc(var(--u) * 5) calc(var(--u) * 4);
  background: var(--paper-sunk);
  border-right: 1px solid var(--rule);
  overflow-y: auto;
}

.spine__head { display: flex; flex-direction: column; gap: calc(var(--u) * 0.5); }

.wordmark {
  font-family: var(--face-display);
  font-size: 1.75rem;
  font-weight: 400;
  letter-spacing: -0.015em;
  line-height: 1.1;
}

.spine__sub {
  font-family: var(--face-ui);
  font-size: 0.75rem;
  line-height: 1.45;
  color: var(--ink-muted);
  max-width: 15ch;
}

/* The entry stamp: position in the sequence, set like a plate number. */
.stamp {
  display: flex;
  flex-direction: column;
  padding-top: calc(var(--u) * 2);
  border-top: 2px solid var(--ink);
}
.stamp__label {
  font-family: var(--face-ui);
  font-size: 0.625rem;
  font-weight: 600;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--ink-faint);
}
.stamp__num {
  font-family: var(--face-mono);
  font-variant-numeric: tabular-nums;
  font-size: 2.75rem;
  line-height: 1.05;
  letter-spacing: -0.03em;
  color: var(--accent);
}
.stamp__date {
  font-family: var(--face-mono);
  font-size: 0.6875rem;
  letter-spacing: 0.04em;
  color: var(--ink-muted);
  text-transform: uppercase;
}

/* --- Nav ----------------------------------------------------------------- */
.nav { display: flex; flex-direction: column; }

.nav__item {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--u);
  width: 100%;
  padding: calc(var(--u) * 1.4) 0;
  background: none;
  border: 0;
  border-bottom: 1px solid var(--rule);
  font-family: var(--face-ui);
  font-size: 0.875rem;
  text-align: left;
  color: var(--ink-muted);
  cursor: pointer;
  transition: color 0.12s ease;
}
.nav__item:first-child { border-top: 1px solid var(--rule); }
.nav__item:hover { color: var(--ink); }
.nav__item[aria-current="page"] {
  color: var(--ink);
  font-weight: 600;
  box-shadow: inset 2px 0 0 var(--accent);
  padding-left: var(--u);
}

.nav__badge {
  font-family: var(--face-mono);
  font-variant-numeric: tabular-nums;
  font-size: 0.6875rem;
  padding: 1px 6px;
  border-radius: 2px;
  background: var(--action);
  color: #fff;
}

/* --- Gauge: the small instrument panel ---------------------------------- */
.gauge {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: var(--u);
  margin-top: auto;
}
.gauge__cell { display: flex; flex-direction: column; gap: 2px; }
.gauge dt {
  font-family: var(--face-ui);
  font-size: 0.5625rem;
  font-weight: 600;
  letter-spacing: 0.11em;
  text-transform: uppercase;
  color: var(--ink-faint);
}
.gauge dd {
  font-family: var(--face-mono);
  font-variant-numeric: tabular-nums;
  font-size: 1.125rem;
  color: var(--ink);
}

.spine__foot { padding-top: calc(var(--u) * 1.5); border-top: 1px solid var(--rule); }

.ghost {
  padding: calc(var(--u) * 0.7) var(--u);
  background: none;
  border: 1px solid var(--rule-strong);
  border-radius: 2px;
  font-family: var(--face-ui);
  font-size: 0.75rem;
  color: var(--ink-muted);
  cursor: pointer;
  transition: border-color 0.12s ease, color 0.12s ease;
}
.ghost:hover { border-color: var(--ink-muted); color: var(--ink); }

/* --- Field: the graph paper ---------------------------------------------- */
.field {
  padding: calc(var(--u) * 8) calc(var(--u) * 7) calc(var(--u) * 14);
  background-color: var(--paper);
  background-image:
    linear-gradient(to right,  var(--grid-major) 0 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid-major) 0 1px, transparent 1px),
    linear-gradient(to right,  var(--grid) 0 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid) 0 1px, transparent 1px);
  background-size: 140px 140px, 140px 140px, 28px 28px, 28px 28px;
  background-position: 0 0;
}
.field:focus { outline: none; }

.view { display: flex; flex-direction: column; gap: calc(var(--u) * 5); max-width: 78ch; }

/* ==========================================================================
   Entry: the daily lesson
   ========================================================================== */
.entry { display: flex; flex-direction: column; gap: calc(var(--u) * 4); }

.entry__head { display: flex; flex-direction: column; gap: calc(var(--u) * 2); }

.tags { display: flex; flex-wrap: wrap; gap: var(--u); align-items: center; }

.tag {
  font-family: var(--face-ui);
  font-size: 0.625rem;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 3px 7px;
  border-radius: 2px;
  background: var(--accent-soft);
  color: var(--accent-ink);
}
.tag--level {
  background: none;
  border: 1px solid var(--rule-strong);
  color: var(--ink-muted);
}
.tag--time {
  background: none;
  color: var(--ink-faint);
  font-family: var(--face-mono);
  letter-spacing: 0.04em;
  text-transform: none;
  padding-left: 0;
}

.entry__title {
  font-family: var(--face-display);
  font-size: clamp(2.125rem, 4.6vw, 3.125rem);
  font-weight: 400;
  line-height: 1.07;
  letter-spacing: -0.022em;
  text-wrap: balance;
  max-width: 26ch;
}

/* The one orchestrated moment: the rule under the title draws itself. */
.entry__rule {
  height: 2px;
  background: var(--ink);
  transform-origin: left;
  animation: draw 0.55s cubic-bezier(0.22, 0.61, 0.36, 1) both;
}
@keyframes draw { from { transform: scaleX(0); } to { transform: scaleX(1); } }

.entry__source {
  font-family: var(--face-ui);
  font-size: 0.8125rem;
  color: var(--ink-muted);
}
.entry__source em { font-style: italic; }

/* --- Prose blocks -------------------------------------------------------- */
.block { display: flex; flex-direction: column; gap: calc(var(--u) * 1.5); }

.block__label {
  font-family: var(--face-ui);
  font-size: 0.6875rem;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-faint);
}

.block__body { max-width: var(--measure); display: flex; flex-direction: column; gap: var(--lead); }
.block__body p { line-height: var(--lead); }

.lead { font-size: 1.1875rem; line-height: 32px; }
.lead strong { font-weight: 600; }

/* Failure mode gets a quiet sunk panel — it is a warning, not an action. */
.block--failure .block__body {
  padding: calc(var(--u) * 2.5) calc(var(--u) * 3);
  background: var(--paper-sunk);
  border-left: 2px solid var(--rule-strong);
}

/* --- The experiment: a stamped action item in red pen -------------------- */
.experiment {
  display: flex;
  flex-direction: column;
  gap: calc(var(--u) * 1.5);
  padding: calc(var(--u) * 3.5);
  background: var(--action-soft);
  border: 1px solid var(--action-line);
  border-left: 3px solid var(--action);
  border-radius: 2px;
}
.experiment__label {
  font-family: var(--face-ui);
  font-size: 0.6875rem;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--action);
}
.experiment__body { max-width: var(--measure); }

/* --- Reflection: a ruled writing surface --------------------------------- */
.reflect { display: flex; flex-direction: column; gap: calc(var(--u) * 1.5); }
.reflect__prompt {
  max-width: var(--measure);
  font-style: italic;
  color: var(--ink-muted);
}

.reflect__field {
  display: block;
  width: 100%;
  max-width: var(--measure);
  min-height: calc(var(--lead) * 4);
  padding: 0 calc(var(--u) * 1.5);
  border: 0;
  border-radius: 0;
  background-color: var(--paper-raised);
  background-image: linear-gradient(to bottom, transparent calc(var(--lead) - 1px), var(--rule) calc(var(--lead) - 1px));
  background-size: 100% var(--lead);
  box-shadow: inset 0 0 0 1px var(--rule);
  color: var(--ink);
  font-family: var(--face-text);
  font-size: 17px;
  line-height: var(--lead);
  resize: vertical;
}
.reflect__field:focus { box-shadow: inset 0 0 0 1px var(--accent-line); outline: none; }
.reflect__field::placeholder { color: var(--ink-faint); font-style: italic; }

.reflect__state {
  font-family: var(--face-mono);
  font-size: 0.6875rem;
  color: var(--ink-faint);
  min-height: var(--lead);
}

/* --- Actions row --------------------------------------------------------- */
.actions {
  display: flex;
  flex-wrap: wrap;
  gap: calc(var(--u) * 1.5);
  align-items: center;
  padding-top: calc(var(--u) * 2);
  border-top: 1px solid var(--rule);
}

.btn {
  padding: calc(var(--u) * 1.3) calc(var(--u) * 2.5);
  background: var(--ink);
  border: 1px solid var(--ink);
  border-radius: 2px;
  font-family: var(--face-ui);
  font-size: 0.8125rem;
  font-weight: 600;
  color: var(--paper);
  cursor: pointer;
  transition: opacity 0.12s ease;
}
.btn:hover { opacity: 0.86; }
.btn[disabled] { opacity: 0.4; cursor: default; }

.btn--quiet {
  background: none;
  border-color: var(--rule-strong);
  color: var(--ink-muted);
  font-weight: 500;
}
.btn--quiet:hover { border-color: var(--ink-muted); color: var(--ink); opacity: 1; }

.btn--done {
  background: var(--accent-soft);
  border-color: var(--accent-line);
  color: var(--accent-ink);
}

/* --- The reader ----------------------------------------------------------
   Sits under the source line, in the header rather than in the actions row at
   the foot: it is an offer about how to take the entry in, so it has to be
   there before you have read it. */
.reader {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--u);
  margin-top: var(--u);
}

.reader__btn {
  padding: calc(var(--u) * 0.8) calc(var(--u) * 1.6);
  font-size: 0.75rem;
}

.reader__note {
  font-family: var(--face-ui);
  font-size: 0.75rem;
  color: var(--ink-faint);
}

/* The tint is bled outwards with a spread shadow rather than padding, so the
   block being spoken lights up without the prose reflowing under it. */
[data-reading] {
  background: var(--accent-soft);
  box-shadow: 0 0 0 6px var(--accent-soft);
  border-radius: 1px;
  transition: background 0.2s ease;
}

/* --- Library pager -------------------------------------------------------
   Two equal columns so the next entry keeps the right-hand side whether or not
   there is a previous one to balance it. auto-fit rather than a breakpoint:
   the titles are clipped to one line, and below roughly 14rem a column shows
   too few characters of a title to be worth reading, so it stacks instead. */
.pager {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr));
  gap: calc(var(--u) * 1.5);
  margin-top: calc(var(--u) * 4);
}

.pager__btn {
  display: flex;
  flex-direction: column;
  gap: calc(var(--u) * 0.5);
  min-width: 0;
  padding: calc(var(--u) * 1.5) calc(var(--u) * 2);
  background: none;
  border: 1px solid var(--rule-strong);
  border-radius: 2px;
  cursor: pointer;
  text-align: left;
  transition: border-color 0.12s ease, background 0.12s ease;
}
.pager__btn:hover { border-color: var(--ink-muted); background: var(--accent-soft); }
.pager__btn--next { align-items: flex-end; text-align: right; }

.pager__dir {
  font-family: var(--face-ui);
  font-size: 0.625rem;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-faint);
}

/* One line, clipped. A long title wrapping to three lines turns a navigation
   control into the largest thing on the screen after the entry itself. */
.pager__title {
  max-width: 100%;
  overflow: hidden;
  font-family: var(--face-text);
  font-size: 0.9375rem;
  line-height: 1.3;
  color: var(--ink);
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* Holds the column so a missing neighbour does not slide the other button
   across, and says which end you reached rather than leaving a gap. */
.pager__end {
  display: flex;
  align-items: center;
  padding: calc(var(--u) * 1.5) calc(var(--u) * 2);
  font-family: var(--face-ui);
  font-size: 0.625rem;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-faint);
}
.pager__end:last-child { justify-content: flex-end; }

/* --- Deep dive ----------------------------------------------------------- */
.deepdive {
  display: flex;
  flex-direction: column;
  gap: calc(var(--u) * 1.5);
  padding: calc(var(--u) * 3);
  border: 1px dashed var(--accent-line);
  border-radius: 2px;
}
.deepdive__note {
  max-width: var(--measure);
  font-size: 0.9375rem;
  color: var(--ink-muted);
}
.deepdive__text {
  max-width: var(--measure);
  max-height: 40vh;
  overflow: auto;
  padding: calc(var(--u) * 2);
  background: var(--paper-sunk);
  border: 1px solid var(--rule);
  font-family: var(--face-mono);
  font-size: 0.8125rem;
  line-height: 1.6;
  white-space: pre-wrap;
  overflow-wrap: break-word;
}

/* ==========================================================================
   Review: index cards
   ========================================================================== */
.card {
  display: flex;
  flex-direction: column;
  gap: calc(var(--u) * 2);
  max-width: 62ch;
  padding: calc(var(--u) * 4);
  background: var(--paper-raised);
  border: 1px solid var(--rule);
  border-top: 3px solid var(--accent);
  border-radius: 2px;
  box-shadow: var(--shadow-card);
}

.card__meta {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: var(--u);
  font-family: var(--face-mono);
  font-size: 0.6875rem;
  color: var(--ink-faint);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.card__q {
  font-family: var(--face-display);
  font-size: 1.4375rem;
  font-weight: 400;
  line-height: 1.28;
  letter-spacing: -0.01em;
  text-wrap: balance;
}

.card__a {
  padding-top: calc(var(--u) * 2);
  border-top: 1px solid var(--rule);
  animation: settle 0.28s ease both;
}
@keyframes settle { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

.grades { display: flex; flex-wrap: wrap; gap: var(--u); }
.grade {
  flex: 1 1 auto;
  padding: calc(var(--u) * 1.3) calc(var(--u) * 2);
  background: none;
  border: 1px solid var(--rule-strong);
  border-radius: 2px;
  font-family: var(--face-ui);
  font-size: 0.8125rem;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.12s ease, border-color 0.12s ease;
}
.grade__hint {
  display: block;
  font-weight: 400;
  font-size: 0.6875rem;
  color: var(--ink-faint);
}
.grade--miss:hover  { border-color: var(--action); background: var(--action-soft); }
.grade--close:hover { border-color: var(--shaky); background: color-mix(in srgb, var(--shaky) 9%, transparent); }
.grade--got:hover   { border-color: var(--solid); background: color-mix(in srgb, var(--solid) 9%, transparent); }

/* ==========================================================================
   Library
   ========================================================================== */
.filters { display: flex; flex-wrap: wrap; gap: var(--u); align-items: center; }

.search {
  flex: 1 1 18ch;
  min-width: 0;
  padding: calc(var(--u) * 1.2) calc(var(--u) * 1.5);
  background: var(--paper-raised);
  border: 1px solid var(--rule);
  border-radius: 2px;
  color: var(--ink);
  font-family: var(--face-ui);
  font-size: 0.875rem;
}
.search:focus { border-color: var(--accent-line); outline: none; }

.chip {
  padding: calc(var(--u) * 0.8) calc(var(--u) * 1.4);
  background: none;
  border: 1px solid var(--rule-strong);
  border-radius: 2px;
  font-family: var(--face-ui);
  font-size: 0.75rem;
  color: var(--ink-muted);
  cursor: pointer;
}
.chip[aria-pressed="true"] {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--paper);
}

.shelf { display: flex; flex-direction: column; }

.shelf__row {
  display: grid;
  grid-template-columns: 4.5ch minmax(0, 1fr) auto;
  gap: calc(var(--u) * 2);
  align-items: baseline;
  width: 100%;
  padding: calc(var(--u) * 1.7) var(--u);
  background: none;
  border: 0;
  border-bottom: 1px solid var(--rule);
  text-align: left;
  cursor: pointer;
  transition: background 0.1s ease;
}
.shelf__row:hover { background: var(--accent-soft); }
.shelf__num {
  font-family: var(--face-mono);
  font-variant-numeric: tabular-nums;
  font-size: 0.75rem;
  color: var(--ink-faint);
}
.shelf__title { font-family: var(--face-text); font-size: 1rem; line-height: 1.4; }
.shelf__track {
  font-family: var(--face-ui);
  font-size: 0.625rem;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-faint);
}

.pip {
  display: inline-block;
  width: 6px;
  height: 6px;
  margin-right: var(--u);
  border-radius: 50%;
  background: var(--rule-strong);
  vertical-align: 1px;
}
.pip--logged { background: var(--accent); }
.pip--solid  { background: var(--solid); }
.pip--shaky  { background: var(--shaky); }

/* ==========================================================================
   Journal
   ========================================================================== */
.note {
  display: flex;
  flex-direction: column;
  gap: var(--u);
  max-width: var(--measure);
  padding-bottom: calc(var(--u) * 3);
  border-bottom: 1px solid var(--rule);
}
.note__meta {
  display: flex;
  flex-wrap: wrap;
  gap: calc(var(--u) * 1.5);
  align-items: baseline;
  font-family: var(--face-mono);
  font-size: 0.6875rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--ink-faint);
}
.note__title { font-family: var(--face-display); font-size: 1.1875rem; font-weight: 400; line-height: 1.3; }
.note__body { white-space: pre-wrap; }

/* ==========================================================================
   Progress
   ========================================================================== */
.readout {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(11rem, 1fr));
  gap: 1px;
  background: var(--rule);
  border: 1px solid var(--rule);
  border-radius: 2px;
}
.readout__cell {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: calc(var(--u) * 2.5);
  background: var(--paper-raised);
}
.readout__label {
  font-family: var(--face-ui);
  font-size: 0.625rem;
  font-weight: 600;
  letter-spacing: 0.11em;
  text-transform: uppercase;
  color: var(--ink-faint);
}
.readout__value {
  font-family: var(--face-mono);
  font-variant-numeric: tabular-nums;
  font-size: 1.875rem;
  line-height: 1.15;
  letter-spacing: -0.02em;
}
.readout__unit { font-family: var(--face-ui); font-size: 0.75rem; color: var(--ink-muted); }

.coverage { display: flex; flex-direction: column; gap: calc(var(--u) * 2); }
.cov { display: grid; grid-template-columns: minmax(9rem, 14rem) minmax(0, 1fr) 5ch; gap: calc(var(--u) * 2); align-items: center; }
.cov__name { font-family: var(--face-ui); font-size: 0.8125rem; }
.cov__bar { height: 8px; background: var(--paper-sunk); box-shadow: inset 0 0 0 1px var(--rule); }
.cov__fill { height: 100%; background: var(--accent); }
.cov__n {
  font-family: var(--face-mono);
  font-variant-numeric: tabular-nums;
  font-size: 0.75rem;
  color: var(--ink-muted);
  text-align: right;
}

/* ==========================================================================
   Shared furniture
   ========================================================================== */
.section__head {
  display: flex;
  flex-direction: column;
  gap: var(--u);
  padding-bottom: calc(var(--u) * 2);
  border-bottom: 2px solid var(--ink);
}
.section__title {
  font-family: var(--face-display);
  font-size: 1.875rem;
  font-weight: 400;
  line-height: 1.15;
  letter-spacing: -0.018em;
}
.section__note { max-width: var(--measure); font-size: 0.9375rem; color: var(--ink-muted); }

.empty {
  max-width: var(--measure);
  padding: calc(var(--u) * 5) 0;
  color: var(--ink-muted);
  font-style: italic;
}

.toast {
  position: fixed;
  bottom: calc(var(--u) * 3);
  left: 50%;
  transform: translate(-50%, calc(100% + var(--u) * 6));
  z-index: 40;
  padding: calc(var(--u) * 1.4) calc(var(--u) * 3);
  background: var(--ink);
  color: var(--paper);
  border-radius: 2px;
  font-family: var(--face-ui);
  font-size: 0.8125rem;
  box-shadow: var(--shadow-lift);
  transition: transform 0.24s cubic-bezier(0.22, 0.61, 0.36, 1);
}
.toast[data-open="true"] { transform: translate(-50%, 0); }

/* ==========================================================================
   Chinese

   Chinese has no italic. A browser asked for one slants the glyphs by a fixed
   angle, which reads as a rendering fault rather than as emphasis, so on a
   page whose language is Chinese every italic in these sheets stands upright,
   and so do em and i, which the browser italicises on its own. :lang() reads
   the html tag the build writes, so a page that declares no language never
   matches. Each selector carries it, which also outranks the rule being undone
   wherever that rule sits, components.css included.
   ========================================================================== */
em:lang(zh),
i:lang(zh),
.entry__source em:lang(zh),
.reflect__prompt:lang(zh),
.reflect__field:lang(zh)::placeholder,
.empty:lang(zh),
.gate__answer:lang(zh),
.note__body--gate:lang(zh),
.cheat__claim:lang(zh) { font-style: normal; }

/* ==========================================================================
   Narrow: the spine unbinds into a top bar
   ========================================================================== */
@media (max-width: 60rem) {
  .logbook { grid-template-columns: minmax(0, 1fr); }

  .spine {
    position: static;
    height: auto;
    gap: calc(var(--u) * 3);
    padding: calc(var(--u) * 3.5) calc(var(--u) * 3);
    border-right: 0;
    border-bottom: 1px solid var(--rule);
    overflow: visible;
  }
  .spine__sub { display: none; }
  .spine__head { flex-direction: row; align-items: baseline; gap: calc(var(--u) * 2); }

  .stamp { flex-direction: row; align-items: baseline; gap: calc(var(--u) * 1.5); padding-top: var(--u); }
  .stamp__num { font-size: 1.75rem; }

  .nav { flex-direction: row; overflow-x: auto; gap: calc(var(--u) * 2.5); }
  .nav__item { width: auto; flex: 0 0 auto; border: 0; padding: var(--u) 0; }
  .nav__item:first-child { border-top: 0; }
  .nav__item[aria-current="page"] {
    box-shadow: inset 0 -2px 0 var(--accent);
    padding-left: 0;
  }

  .gauge { margin-top: 0; grid-template-columns: repeat(3, auto); gap: calc(var(--u) * 3); }
  .spine__foot { border-top: 0; padding-top: 0; }

  .field { padding: calc(var(--u) * 5) calc(var(--u) * 3) calc(var(--u) * 12); }
  .cov { grid-template-columns: minmax(0, 1fr) 5ch; }
  .cov__bar { grid-column: 1 / -1; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

/* ==========================================================================
   Daily — components the base sheet does not carry

   Everything here belongs to a mechanic that only some sites turn on: the
   commitment gate, expiry, the attempts log, the forecast book. Tokens only,
   no literal colours, so a site theme retunes these along with everything
   else.
   ========================================================================== */

/* --- The gate ------------------------------------------------------------
   Deliberately heavy. It is the one thing on the page that stops you, and a
   stop that looks like a form field gets skipped. */
.gate {
  max-width: var(--measure);
  margin: calc(var(--u) * 4) 0;
  padding: calc(var(--u) * 3);
  background: var(--action-soft);
  border: 1px solid var(--action-line);
  border-left-width: 3px;
  border-radius: 2px;
}
.gate--done {
  background: var(--paper-sunk);
  border-color: var(--rule);
  border-left-color: var(--rule-strong);
}
.gate__intro {
  margin-bottom: calc(var(--u) * 2);
  padding-bottom: calc(var(--u) * 2);
  border-bottom: 1px solid var(--action-line);
}
.gate__intro p + p { margin-top: var(--lead); }
.gate__prompt {
  font-family: var(--face-display);
  font-size: 1.25rem;
  line-height: 1.35;
  margin-bottom: calc(var(--u) * 2);
}
.gate__field { min-height: calc(var(--lead) * 4); }
.gate__note {
  margin-top: var(--u);
  font-family: var(--face-ui);
  font-size: 0.8125rem;
  color: var(--ink-muted);
}
.gate__stamp {
  font-family: var(--face-mono);
  font-size: 0.6875rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-faint);
  margin-bottom: var(--u);
}
.gate__answer { white-space: pre-wrap; color: var(--ink-muted); font-style: italic; }
.gate__answer p + p { margin-top: var(--lead); }

.gate__fallback { margin-bottom: calc(var(--u) * 2); }
.gate__fallback summary {
  cursor: pointer;
  font-family: var(--face-ui);
  font-size: 0.8125rem;
  color: var(--ink-muted);
}
.gate__fallbacktext {
  margin: var(--u) 0;
  padding: calc(var(--u) * 2);
  background: var(--paper-raised);
  border: 1px dashed var(--rule-strong);
  font-size: 0.9375rem;
}

.gate__curtain {
  max-width: var(--measure);
  padding: calc(var(--u) * 4) 0;
  font-family: var(--face-ui);
  font-size: 0.9375rem;
  color: var(--ink-faint);
  border-top: 1px dashed var(--rule-strong);
}

/* --- Worked example ------------------------------------------------------ */
/* Sits directly under the failure mode, and has to read as the answer to it
   rather than as one more block of commentary. The accent rule and the raised
   stock do that; the first paragraph is the repair itself, so it gets the
   weight and the rest of the block stays quiet. */
.worked {
  max-width: var(--measure);
  margin: calc(var(--u) * 4) 0;
  padding: calc(var(--u) * 3);
  background: var(--paper-raised);
  border: 1px solid var(--rule);
  border-left: 3px solid var(--accent);
  border-radius: 2px;
}
.worked__body {
  margin-top: var(--u);
}
.worked__body p + p {
  margin-top: var(--lead);
}
/* The repair. Set in the reading face at full size so it can be compared
   against the specimen without the eye having to change gear. */
.worked__body p:first-child {
  font-size: 1.0625rem;
  line-height: 1.6;
  color: var(--ink);
}
/* What it changed, and what it cost. */
.worked__body p:last-child:not(:first-child) {
  font-family: var(--face-ui);
  font-size: 0.875rem;
  line-height: 1.55;
  color: var(--ink-muted);
  padding-top: calc(var(--u) * 1.5);
  border-top: 1px solid var(--rule);
}

/* --- Arithmetic gate ----------------------------------------------------- */
/* Same visual weight as the text gate, because it does the same job one notch
   harder. The gap is the only part that earns colour: over and under are
   different mistakes and the reader should be able to see which one they keep
   making without reading the number. */
.compute {
  max-width: var(--measure);
  margin: calc(var(--u) * 4) 0;
  padding: calc(var(--u) * 3);
  background: var(--action-soft);
  border: 1px solid var(--action-line);
  border-left-width: 3px;
  border-radius: 2px;
}
.compute--done {
  background: var(--paper-sunk);
  border-color: var(--rule);
  border-left-color: var(--rule-strong);
}
.compute__q {
  margin-top: var(--u);
  font-size: 1.0625rem;
  line-height: 1.5;
}
.compute__note {
  margin-top: var(--u);
  font-family: var(--face-ui);
  font-size: 0.8125rem;
  color: var(--ink-faint);
}
.compute__fields {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  gap: var(--u) calc(var(--u) * 2);
  margin: calc(var(--u) * 2) 0;
}
.compute__lab {
  font-family: var(--face-ui);
  font-size: 0.875rem;
  color: var(--ink-muted);
}
.compute__unit { color: var(--ink-faint); }
.compute__row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: calc(var(--u) * 2);
  margin: calc(var(--u) * 2) 0;
}
.compute__input {
  font-family: var(--face-mono);
  font-size: 1rem;
  font-variant-numeric: tabular-nums;
  padding: calc(var(--u) * 1.25) calc(var(--u) * 1.5);
  background: var(--paper-raised);
  color: var(--ink);
  border: 1px solid var(--rule-strong);
  border-radius: 2px;
  min-width: 10ch;
}
.compute__input:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}
.compute__result {
  margin-top: calc(var(--u) * 1.5);
  font-variant-numeric: tabular-nums;
}
.compute__gap {
  margin-top: var(--u);
  font-family: var(--face-ui);
  font-size: 0.875rem;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.compute__gap[data-dir="exact"] { color: var(--solid); }
.compute__gap[data-dir="over"],
.compute__gap[data-dir="under"] { color: var(--action); }

/* --- Evidence gate ------------------------------------------------------- */
/* Seven verdicts, four colours. The colour answers only "how much weight does
   this carry", which is the question the reader is actually asking; the label
   carries the distinction between, say, never-repeated and disputed. Giving
   each verdict its own hue would imply seven degrees of trust and there are
   not seven. */
.evidence {
  max-width: var(--measure);
  margin: calc(var(--u) * 3) 0;
  padding: calc(var(--u) * 2) calc(var(--u) * 2.5);
  background: var(--paper-sunk);
  border-left: 3px solid var(--rule-strong);
}
.evidence__cite {
  margin: calc(var(--u) * 0.75) 0 0;
  font-family: var(--face-mono);
  font-size: 0.875rem;
  line-height: 1.5;
  color: var(--ink);
}
.evidence__interval {
  margin: calc(var(--u) * 0.5) 0 0;
  font-family: var(--face-mono);
  font-size: 0.8125rem;
  font-variant-numeric: tabular-nums;
  color: var(--ink-muted);
}
.evidence__meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: calc(var(--u) * 1.5);
  margin: calc(var(--u) * 1.5) 0 0;
}
.rep-chip {
  font-family: var(--face-ui);
  font-size: 0.6875rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 2px 7px;
  border: 1px solid currentColor;
  color: var(--ink-muted);
}
.evidence__asat,
.evidence__stale {
  font-family: var(--face-ui);
  font-size: 0.75rem;
  color: var(--ink-faint);
}

.evidence[data-rep="replicated"] { border-left-color: var(--solid); }
.evidence[data-rep="replicated"] .rep-chip { color: var(--solid); }

.evidence[data-rep="single"],
.evidence[data-rep="contested"] { border-left-color: var(--shaky); }
.evidence[data-rep="single"] .rep-chip,
.evidence[data-rep="contested"] .rep-chip { color: var(--shaky); }

.evidence[data-rep="failed"],
.evidence[data-rep="overclaimed"] { border-left-color: var(--action); }
.evidence[data-rep="failed"] .rep-chip,
.evidence[data-rep="overclaimed"] .rep-chip { color: var(--action); }

.evidence[data-rep="statute"] { border-left-color: var(--accent); }
.evidence[data-rep="statute"] .rep-chip { color: var(--accent); }

/* Staleness is about the check, not the claim, so it marks the block without
   overriding the verdict colour the claim earned. */
.evidence[data-stale="1"] { border-left-style: dashed; }
.evidence[data-stale="1"] .evidence__stale { color: var(--action); }

/* --- Expiry -------------------------------------------------------------- */
.tag--lapsed {
  background: none;
  border: 1px solid var(--action-line);
  color: var(--action);
}
.pip--lapsed {
  background: none;
  border: 1px solid var(--rule-strong);
  width: 5px;
  height: 5px;
}

/* --- Attempts log -------------------------------------------------------- */
.attempt {
  display: flex;
  flex-direction: column;
  gap: var(--u);
  max-width: var(--measure);
  padding-bottom: calc(var(--u) * 3);
  margin-bottom: calc(var(--u) * 3);
  border-bottom: 1px solid var(--rule);
}
.attempt__past {
  padding-left: calc(var(--u) * 2);
  border-left: 2px solid var(--accent-line);
  white-space: pre-wrap;
}
.attempt__past span {
  font-family: var(--face-mono);
  font-size: 0.6875rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--ink-faint);
  margin-right: var(--u);
}
.attempt__new { display: flex; flex-direction: column; gap: var(--u); align-items: flex-start; }
.attempt__field { min-height: calc(var(--lead) * 2); }

/* --- Journal, gated entries --------------------------------------------- */
.note__label {
  font-family: var(--face-ui);
  font-size: 0.6875rem;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-faint);
}
.note__body--gate {
  color: var(--ink-muted);
  font-style: italic;
  padding-left: calc(var(--u) * 2);
  border-left: 2px solid var(--action-line);
}

/* --- Forecast seed, inside an entry -------------------------------------- */
.fc-seed {
  max-width: var(--measure);
  margin: calc(var(--u) * 4) 0;
  padding: calc(var(--u) * 3);
  background: var(--paper-sunk);
  border: 1px solid var(--rule);
  border-radius: 2px;
}
.fc-seed__q {
  font-family: var(--face-display);
  font-size: 1.125rem;
  line-height: 1.35;
  margin-bottom: calc(var(--u) * 2);
}
.fc-seed__row {
  display: flex;
  flex-wrap: wrap;
  gap: calc(var(--u) * 2);
  align-items: center;
}
.fc-seed__lab {
  font-family: var(--face-ui);
  font-size: 0.8125rem;
  color: var(--ink-muted);
  display: inline-flex;
  align-items: center;
  gap: var(--u);
}
.fc-seed__p, .fc-seed__d {
  font-family: var(--face-mono);
  font-size: 0.875rem;
  padding: 5px 7px;
  color: var(--ink);
  background: var(--paper-raised);
  border: 1px solid var(--rule-strong);
  border-radius: 2px;
}
.fc-seed__p { width: 4.5rem; }

/* --- Forecast book ------------------------------------------------------- */
.fc-group {
  max-width: var(--measure);
  margin-bottom: calc(var(--u) * 5);
  display: flex;
  flex-direction: column;
  gap: var(--u);
}
.fc-new__q { min-height: calc(var(--lead) * 2); }
.fc-row {
  display: flex;
  flex-wrap: wrap;
  gap: calc(var(--u) * 2);
  justify-content: space-between;
  align-items: flex-start;
  padding: calc(var(--u) * 2);
  background: var(--paper-raised);
  border: 1px solid var(--rule);
  border-left: 3px solid var(--rule-strong);
  border-radius: 2px;
}
.fc-row--ripe { border-left-color: var(--action); background: var(--action-soft); }
.fc-row--good { border-left-color: var(--solid); }
.fc-row--mid  { border-left-color: var(--shaky); }
.fc-row--bad  { border-left-color: var(--action); }
.fc-row__body { flex: 1 1 18rem; }
.fc-row__q { line-height: 1.4; }
.fc-row__meta {
  margin-top: 4px;
  font-family: var(--face-mono);
  font-size: 0.75rem;
  color: var(--ink-faint);
}
.fc-row__acts { display: flex; gap: var(--u); flex-wrap: wrap; }

/* --- Calibration plot ----------------------------------------------------
   Inline SVG because the CSP blocks every chart library, and because a
   ten-bucket scatter against a diagonal does not need one. */
.calwrap {
  max-width: var(--measure);
  margin-bottom: calc(var(--u) * 5);
}
.cal {
  display: block;
  width: 100%;
  max-width: 22rem;
  height: auto;
  margin: calc(var(--u) * 2) 0;
}
.cal__ref { stroke: var(--rule-strong); stroke-width: 1; stroke-dasharray: 3 3; }
.cal__axis { stroke: var(--rule-strong); stroke-width: 1; }
.cal__dot { fill: var(--accent); fill-opacity: 0.75; }
.cal__t {
  fill: var(--ink-faint);
  font-family: var(--face-ui);
  font-size: 9px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

/* --- Cheatsheet ----------------------------------------------------------
   Inverted from every other list in the engine. The shelf leads with the
   claim because you are choosing what to read; here you have already read it,
   so the row leads with what to do and demotes the claim to the line that
   justifies it. The solid rule down the left is the same one the evidence
   block uses for a replicated verdict, because that is the only verdict on
   this page and the colour should mean the same thing in both places. */
.cheat { margin-bottom: calc(var(--u) * 5); }
.cheat__track {
  font-family: var(--face-ui);
  font-size: 0.625rem;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-faint);
  padding-bottom: var(--u);
  border-bottom: 1px solid var(--rule);
}
.cheat__row {
  display: flex;
  flex-direction: column;
  gap: calc(var(--u) * 0.75);
  width: 100%;
  padding: calc(var(--u) * 2) calc(var(--u) * 2);
  background: none;
  border: 0;
  border-left: 2px solid var(--solid);
  border-bottom: 1px solid var(--rule);
  text-align: left;
  cursor: pointer;
  transition: background 0.1s ease;
}
.cheat__row:hover { background: var(--accent-soft); }
.cheat__do {
  font-family: var(--face-text);
  font-size: 1.0625rem;
  line-height: 1.45;
  color: var(--ink);
  max-width: var(--measure);
}
.cheat__claim {
  font-family: var(--face-text);
  font-size: 0.875rem;
  line-height: 1.45;
  font-style: italic;
  color: var(--ink-muted);
  max-width: var(--measure);
}
.cheat__meta {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: calc(var(--u) * 1.5);
  margin-top: calc(var(--u) * 0.5);
}
.cheat__interval {
  font-family: var(--face-mono);
  font-variant-numeric: tabular-nums;
  font-size: 0.75rem;
  color: var(--solid);
}
.cheat__source,
.cheat__stale {
  font-family: var(--face-ui);
  font-size: 0.6875rem;
  color: var(--ink-faint);
}

/* A row carries the same colour its verdict earns in the evidence block, so
   the meaning of the rule is one thing across the whole site. Sites with no
   verdicts keep the default solid rule set above. */
.cheat__row[data-rep="statute"] { border-left-color: var(--accent); }
.cheat__row[data-rep="statute"] .cheat__interval,
.cheat__row[data-rep="statute"] .rep-chip { color: var(--accent); }
.cheat__row[data-rep="replicated"] .rep-chip { color: var(--solid); }

/* Same convention as the evidence block: staleness marks the check, not the
   claim, so the row keeps the verdict colour and changes only the rule. */
.cheat__row[data-stale="1"] { border-left-style: dashed; }
.cheat__row[data-stale="1"] .cheat__stale { color: var(--action); }

<script>
/* Drivetrain - how platform work reaches the business.
 *
 * The siblings already cover the parts. Gross Margin teaches the finance
 * vocabulary, Compositor the sentence, Parallax how a message lands, Practicum
 * management. None of them drills the translation itself: a ticket traced back
 * to the problem it was written for, the problem priced, the cheapest fix
 * chosen on business terms, and the result said outcome first to someone who
 * does not run the system.
 *
 * The gate carries the method. Every entry hands over a specimen from platform
 * work - a ticket, a draft update, a question from a director - and stays shut
 * until you have done the move, ideally on something of your own from this
 * week. The worked answer then shows the move done once, and what doing it
 * cost. Reading the answer first is the one way to learn nothing here.
 *
 * The profile is the other half. Leading with a number is only possible if you
 * know the numbers, and most engineers cannot state their own company's
 * contract value or customer count. Entries that declare a sum ask for the
 * figures they need at the moment they need them, so the first exercise is
 * often finding out. */

<script>
/* Track: The problem behind the ticket. Ordered foundational first. */
(window.LESSONS = window.LESSONS || []).push(
{
  id: "problem-ticket-is-a-solution",
  track: "problem",
  title: "Every ticket is a solution - find the problem it was written for",
  source: "Melissa Perri, Escaping the Build Trap",
  gatePrompt: "Take the next ticket in your queue. Before you think about how to build it, write three lines: who is in pain today, what they do instead, and how you would know two weeks after shipping that it worked. Leave a line blank rather than guess - a blank is a finding.",
  fallback: "PLAT-2291: Add per-tenant rate limiting to the agent gateway. Limits configurable per tenant (requests per second and burst). Return 429 with a Retry-After header when a tenant exceeds its limit. Expose current usage in the admin API. Requested by: Solutions Engineering. Priority: High.",
  cheat: "Before designing, answer three questions: who is in pain, what they do instead today, and how you will know in two weeks that it worked.",
  idea: "A ticket arrives with the problem already converted into a solution, usually by someone who will not maintain it. Recover the problem before you design anything: who is hurting, what they do instead today, and how you will know it worked. The cheapest fix is often not the one in the ticket.",
  why: "By the time a request reaches your queue it has been translated several times. A customer described a messy situation to an account team, the account team compressed it into a request, and someone wrote the request up as a feature. Each step dropped context, and the last one swapped a problem for one particular solution. Perri calls the company-wide version of this the build trap: an organisation that measures itself by what it ships rather than by what changed for customers. Output rises and outcomes do not move.\n\nThe three questions work because each is cheap to ask and hard to fake. Who is in pain names a person rather than a system. The workaround tells you what the problem costs today, which is your baseline. The two-week test fixes a measurable outcome before anyone commits to a design. If nobody can answer them, you have learned the ticket is a guess - worth knowing before you build it well.",
  failureMode: "The gateway ships per-tenant rate limits, well tested and on time. The tenant whose nightly batch of agent runs was slowing everyone else now gets 429s at 2am, its batch fails, and its admins open a severity-one ticket. The complaint behind the ticket - other tenants' agents crawling during that batch - could have been fixed by moving batch traffic to its own workers, for less effort and without refusing a paying customer's requests.",
  worked: "Three questions to the solutions engineer who filed the ticket recovered the problem. Two enterprise tenants see agent responses take 20 to 40 seconds between 1am and 3am, and both renew this quarter. The cause is one tenant's nightly batch of agent runs sharing gateway workers with interactive traffic. The workaround is support asking that tenant to start its batch later, four times this month. Success in two weeks: other tenants' p95 agent response back under eight seconds in that window, and no new tickets about it.\n\nWith the problem in hand, rate limiting is one option of three. A separate worker pool for batch traffic fixes the slowdown without refusing anyone's requests. A per-tenant concurrency cap is cheaper still if only the batch is heavy. Rate limits are the right answer when the load is unpredictable, and nothing here says it is. Asking cost a day and a message that implied the ticket might be wrong. It returned a smaller build, two renewals with a specific promise attached, and a number to report when the work lands.",
  experiment: "Pick one ticket you will start this week and find the person who asked for it, not the person who wrote it up. Send three lines: what you are about to build, that you want it to fit their case, and what the user does today instead. Write down the answer before you open an editor.",
  reflection: "Which of the three questions can you not answer about the work you are doing right now, and who would know?",
  recall: {
    q: "What three questions recover the problem from a ticket that arrived as a solution?",
    a: "Who is in pain today, what they do instead, and how you will know two weeks after shipping that it worked.\n\nThe workaround is your baseline and your price; the two-week test is the outcome you will report. A question nobody can answer means the ticket is a guess."
  },
  deepDive: "Here is a ticket I have been given. Help me write the three questions for the person who requested it, and tell me which cheaper fixes each possible answer would open up."
},
{
  id: "problem-ask-about-the-last-time",
  track: "problem",
  title: "Ask about the last time it happened, not what they would want",
  source: "Rob Fitzpatrick, The Mom Test",
  gatePrompt: "Take the questions you plan to ask a requester about your next ticket, or the ones you already asked. Cross out any that ask what they would want, use or value. Replace each with a question about the last time the problem happened: when it was, who was involved, what they did next, and how long it took.",
  fallback: "Prep for Thursday with Support. Goal: validate letting customers tune search relevance themselves. Would customers want control over how results are ranked? How important is adjusting ranking, from one to five? Would you prefer a boost setting per field, a synonym list or a relevance dashboard? Would it cut your ticket volume? Is there anything else you would want in it?",
  idea: "Ask about the last time the problem happened, in order: when, who was involved, what they did next, how long it took. A story about a real event is evidence. An answer about what they would want or use is a guess about the future, and it is easy to give as a polite yes.",
  why: "Fitzpatrick's argument is that most conversations about an idea produce compliments, hypotheticals and feature requests, none of which cost the speaker anything. Asked whether they would use something, a requester pictures a better version of their week, says yes and moves on. Saying yes is pleasant and costs nothing, and the answer cannot be checked. Asked about last Tuesday, the same person can only report what happened.\n\nA real event also carries the details that decide a design and that nobody thinks to volunteer: who got interrupted, which tool was opened first, what was pasted where, how many minutes the wait added. You learn whether the problem happens at all, too, and some requests describe a case that has never occurred, which is the cheapest finding there is. Two or three recent cases are enough to show whether they look alike.",
  failureMode: "You take the questions to Support. Everyone on the call agrees customers would love relevance controls, and each person rates the idea four or higher. You build per-field boost settings over six weeks. Customers barely open the page. What they do is email their account manager when a search looks wrong, and the account manager still asks an engineer to change a boost, which takes three days. Ticket volume does not move, and nobody can say why the votes were wrong.",
  worked: "The draft for the Support call has five questions, and all of them ask for an opinion about the future: whether customers would want control over ranking, how important adjusting it is from one to five, and which of three features Support would prefer. Each invites a polite yes. The rewrite asks about the past instead: \"Tell me about the last time a customer said search results were wrong. When was it, who raised it, and who did they raise it with? What did you do first, and what next? How long until the customer had an answer?\" A reply might run: Tuesday morning a customer's analyst said invoice searches returned last year's documents first, the account manager asked in Slack, an engineer changed a recency boost, and the fix landed on Friday.\n\nNow the answers are dates, roles and days, and the Tuesday story points somewhere the draft questions never would: the wait is for an engineer to change a setting, which Support might do itself. The cost is that the call produces no score to report afterwards. You may also hear a last time from three months ago, which says the problem is rare, and one team's story is one case, so ask for a second before it counts as a pattern.",
  experiment: "Before your next conversation with a requester, write the three questions you plan to ask and cross out any with would, could or how important in them. Replace each with a question about the last time it happened. Afterwards write down the date, the people involved and the minutes it took, then ask for a second case and compare the two.",
  reflection: "For the last feature you built on someone's yes, when did the requester last hit the problem, and how do you know?",
  recall: {
    q: "Why does a story about the last time a problem happened tell you more than asking whether someone would use a fix?",
    a: "A real event carries details nobody thinks to volunteer and cannot be answered politely. A question about the future costs the speaker nothing, so the answer is a guess or a compliment.\n\nAsk for two or three recent cases and compare them, because one story is one case."
  },
  deepDive: "Here are the questions I plan to ask the team that requested my next ticket. Rewrite each one as a question about the last time the problem happened, and flag any that still ask for an opinion."
},
{
  id: "problem-ask-as-rework-risk",
  track: "problem",
  title: "Put the question in terms of rework, so asking is not heard as pushback",
  source: "Patterson, Grenny, McMillan and Switzler, Crucial Conversations",
  gatePrompt: "Take the question you are about to put to a requester, or one you sent that got a defensive reply. Rewrite it in two sentences: first the cost to both of you if you guess the scenario wrong, then one request to be walked through a real recent case. Cut anything that starts with why.",
  fallback: "Request from Customer Success: \"Can we add a restore button to the admin console so a tenant's workflows go back to yesterday's state?\" Your draft reply: \"Before I look at this, what is the use case? Rolling back is hard because the activities have already written to the customer's systems, so I need to understand why this is needed rather than re-running the workflows. It sounds like a big lift. Can you justify the urgency?\"",
  cheat: "Put your risk before the question: 'So we do not build something we have to redo, walk me through one real case.' Do not open with why.",
  idea: "Before asking a requester why they need something, say what you are protecting: the two of you building the wrong thing and redoing it. Then ask them to walk you through one real case. People defend against a question that looks like a gate, and they describe what happened when asked to tell it.",
  why: "Patterson and his co-authors argue that people turn defensive less because of your words than because of what they conclude about your intent: whether you share their purpose and respect them. Once they decide you do not, they stop sharing information and start protecting themselves. A platform engineer is badly placed for this. You hold the queue, so a question about a request can always be a veto, and the requester cannot tell curiosity from gatekeeping. They answer the worse reading with a priority label, a customer's name or a message to their director.\n\nRework is a purpose you actually share, because a wrong guess costs you a second build and the requester a second wait. Saying so first restores the common goal before the question lands. So does saying plainly what you are not doing, which is doubting the need, a move the authors call contrasting. What you ask for matters as much as the framing. A justification is something to defend, while a story is just something to tell, and it carries the details that decide the design.",
  failureMode: "You reply in the ticket thread asking why it is needed. The requester reads a refusal and answers with a priority label and the name of a large customer, and a director asks in stand-up why the ticket is blocked on questions. You build the restore button as written. The case behind it was one tenant needing one failed workflow reset after a bad deploy, which a runbook would have covered in an afternoon.",
  worked: "Customer Success asked for a restore button, and the draft reply's two weakest lines are \"what is the use case\" and \"can you justify the urgency\", which make the requester argue for the request before anyone has looked at it. The rewrite is two sentences: \"I want to get this right the first time rather than rework it after launch, and I am not questioning that it is needed. Can you walk me through one recent case where a customer needed a rollback: what went wrong, what they wanted back, and what you did instead?\" The first sentence names a risk you share and says what the question is not. The second asks for a story rather than a defence.\n\nThe rewrite costs three things. You admit you do not know the scenario, which gives up the posture of the person who already has the answer. You commit to acting on what you hear, so if the walk-through shows the need is real and the design obvious, you build it as asked. And it only works if it is true. If you are really trying to say no, say no and give the reason, because a frame used as a pretext is recognised the second time.",
  experiment: "Find a question you owe a requester this week that currently begins with why. Rewrite it as one sentence naming the rework you both want to avoid, then one request to be walked through a real case. Send it, and note whether the first reply is a defence or a story, and how many concrete details it holds.",
  reflection: "When you last asked a requester why, what came back, and would it have differed if you had said what you were protecting?",
  recall: {
    q: "Why does a bare 'why do you need this?' draw a defence, and which two moves in the reframed question lower it?",
    a: "The requester cannot tell curiosity from a veto, so they protect themselves with priority labels and escalation. Naming a purpose you share, rework, restores the common goal.\n\nAsking for a walk through one real case replaces a justification to defend with a story to tell."
  },
  deepDive: "Here is the question I am about to send to a requester. Rewrite it so it names the rework we both want to avoid and asks for a real case, and flag any line that still reads as a refusal."
},
{
  id: "problem-work-around-the-feature",
  track: "problem",
  title: "The work around a feature decides its design - ask what leads into it and what follows",
  source: "Clayton Christensen, Taddy Hall, Karen Dillon and David Duncan, Competing Against Luck",
  gatePrompt: "Take the next feature request in your queue. Before you design anything, write two lines: what the user does in the minute before they reach this feature, and what they do with its output in the hour after. If you cannot write either line, that is the question to ask.",
  fallback: "PLAT-3187: Add a webhook that fires when an evaluation run completes. Payload: run id, suite name, pass rate and a link to the results page. Retry delivery up to five times with backoff. Requested by: ML Product. Priority: Medium. Note from requester: the team wants to know as soon as a run finishes.",
  idea: "A feature is one step in someone else's sequence, and the steps on either side set its inputs and what its output must be good for. Ask what the user does in the minute before they need it and in the hour after they have it, and design to that sequence rather than to the step.",
  why: "Christensen and his co-authors build their account of jobs to be done on one observation: people do not buy products, they hire them to make progress in a particular circumstance, and the same person hires different things in different circumstances. What matters is the situation around the moment of use, which cannot be seen from inside the product. A ticket describes the step. It says nothing about what led someone to need it or what they will do next.\n\nThe step before tells you what the user arrives with: the state they are in, the identifiers they hold, how rushed they are, and whether an alert pushed them or they chose to come. The step after tells you what progress the output is for. A result that is correct but lands in a format, place or moment the next step cannot use is a feature that works and a job that is still not done. Either step may also be removable, which designing the feature itself will never show you.",
  failureMode: "The platform ships the webhook, documented and retried, on time. The ML engineers still open the evaluation dashboard when a run finishes, check the pass rate against the baseline by eye, and type both numbers into the pull request by hand. The webhook posts into a channel nobody reads. The request was met, and the manual comparison is still done on every pull request.",
  worked: "The ticket asks for a webhook when an evaluation run completes, and its key line is \"the team wants to know as soon as a run finishes\", which describes a notification. Asking one ML engineer what happens either side of it gave a longer sequence. Before: they change a prompt, open a pull request, CI starts a 400-case evaluation run, and they move on to other work for about 25 minutes. After: they open the dashboard, compare the pass rate with the main branch by eye, decide whether to merge, and paste both numbers into the pull request. The job is deciding whether to merge with evidence in the pull request, not learning that a run finished. That points at a pass-or-fail status on the pull request itself, baseline comparison included, and the webhook becomes one way to carry it rather than the feature.\n\nGetting there cost a twenty-minute conversation and a warning to the requester that the webhook may not be what ships. It also rests on one engineer's Tuesday, so ask a second team before you design for all of them. What it bought is a design aimed at the paste-the-numbers step instead of at the notification.",
  experiment: "Ask for ten minutes on a screen share with one user of the feature you are building next. Have them do what they did just before they needed it and what they do with the result, and write down every tool they open and every value they copy from one place to another. Circle any step the feature could make unnecessary.",
  reflection: "Which feature did you ship last quarter without knowing what its users did next with the output?",
  recall: {
    q: "Why do the steps before and after a feature tell you more about its design than the feature's own requirements do?",
    a: "The user arrives in some state and leaves with an output meant for a next step, and both are visible only outside the feature. Those neighbours decide what goes in and what the output must be good for.\n\nA neighbour may turn out to be removable, and designing only the feature never shows that."
  },
  deepDive: "Here is a feature request I have been given. Help me write the two questions about what comes before and after, and tell me what each plausible answer would change in the design."
},
{
  id: "problem-workaround-holds-the-requirements",
  track: "problem",
  title: "The workaround holds the requirements the ticket left out - ask to see it",
  source: "Standard product-discovery practice",
  gatePrompt: "Take a ticket where someone does the job by hand today. List every column, filter and manual step in their spreadsheet, script or checklist that the ticket does not mention, plus the people and hours a month it takes. If you have never seen it, write the first three things you would ask to see.",
  fallback: "PLAT-3104: Auto-delete customer sandboxes 30 days after creation to cut cloud spend. Add a ttl field, a nightly cleanup job and a delete endpoint. Requested by: Support. Context: Support tracks sandboxes in a spreadsheet and emails owners by hand on Mondays. Columns: tenant, created, owner, extended, warned, notes. Notes holds entries like 'POC to the 15th' and 'renewal demo'. Priority: Medium.",
  idea: "When people cope by hand, the spreadsheet or script they built is a specification written by whoever pays for every mistake. Read it like one: each column, filter and manual step exists because something happened once. Then count the people and hours it takes, which sizes the problem in units you can measure today.",
  why: "A ticket is written once, from memory, often by someone relaying the problem. A workaround is maintained by the person who has the problem, every time it runs, under their own time pressure. Each column was added because a case went wrong, each filter because a case should have been skipped, each manual step because no tool did it. That makes the sheet or script a record of the exceptions, which are exactly what a requester forgets to mention because they stopped noticing them long ago.\n\nIt also shows who is involved. The person who runs it, the person who reads its output and the person who fixes it when it breaks are often three people, and only the first tends to be on the ticket. And it sizes the problem without any estimating. A sheet two people spend forty minutes on every Monday is a cost you can state in hours today, while a problem with no workaround at all suggests nobody hurts enough to have built one.",
  failureMode: "The cleanup job ships as specified. On day 30 it deletes a prospect's sandbox in the middle of a proof of concept, because the note saying the proof of concept runs to the 15th lived in a spreadsheet column the ticket never mentioned. The sales engineer finds out from the prospect. Support goes back to checking by hand on Mondays, now with a delete job to work around as well.",
  worked: "The ticket says to delete sandboxes 30 days after creation and mentions, as context, that Support tracks them in a spreadsheet. Read as a spec, that sheet says more. The 'extended' column means owners ask for more time, so the job needs an extension path. The 'warned' column means an owner is emailed before anything is deleted, so it needs a notice step and a record that it was sent. The 'notes' column holds entries like 'POC to the 15th' and 'renewal demo', so some sandboxes must be exempt for reasons the platform cannot see. Asking Support's lead for the size returned two people, about 40 minutes each, every Monday: roughly 70 hours a year between them.\n\nThe ticket grew in two places. The deletion job is the easy part. The warning email and the exemption flag are the real work, and the ticket mentioned neither. The move cost an hour of Support's time to walk through the sheet and a changed estimate, since a one-line cleanup job became a small notification feature. It also put the ticket itself at risk: had the sheet taken ten minutes a month, the honest finding would have been that the ticket is not worth building.",
  experiment: "Find one thing in your own area that people do by hand every week or month: a sheet, a script on someone's laptop, a checklist. Ask the owner to walk you through it, and write down its inputs, its exceptions, the people who touch it and the minutes it takes. Send the owner the list to correct.",
  reflection: "Which spreadsheet or script is holding up something your platform is supposed to do, and what does it handle that your roadmap does not?",
  recall: {
    q: "Why does a workaround describe the requirement better than the ticket does, and what two sizes does it give you?",
    a: "It is maintained by the person with the problem, so every column and step exists because a real case went wrong. The ticket is written once, from memory, and drops the exceptions.\n\nIt also sizes the problem without estimating: how many people touch it, and how many hours it takes."
  },
  deepDive: "Here is a ticket where someone currently does the job by hand, with a description of the spreadsheet or script they use. Read that artefact as a spec and tell me which requirements the ticket leaves out and what I should ask to see next."
},
{
  id: "problem-no-component-in-the-statement",
  track: "problem",
  title: "If the problem statement names your system, it is still a solution",
  source: "Teresa Torres, Continuous Discovery Habits",
  gatePrompt: "Take the problem statement from your latest design doc or ticket. Underline every component, service or feature it names. Rewrite it so a colleague outside engineering could read it with nothing underlined, then list two different fixes that would each make your new statement false.",
  fallback: "Problem: The connector framework has no support for parallel backfill. Initial syncs for large sources run through a single Temporal activity worker and can take nine hours. We need a parallel backfill mode in the framework, with a configurable worker count per tenant, so that large initial syncs complete faster. Proposed design below.",
  idea: "Write the problem as something a person cannot do, or waits for, with no component of yours in it. Then check it: name two different fixes that would each make the statement false. If you can name only one, the statement has already chosen the design, and the design doc has nothing left to compare.",
  why: "Torres separates the opportunities a team could pursue, which are customer needs, pain points and desires, from the solutions it might build for them, and she asks for more than one candidate solution against the opportunity the team has chosen, so it has something to compare. The usual way to blur the two in an engineering doc is to write the problem as the absence of a solution: we have no parallel backfill, we lack a quota API. That statement can only be closed by building the thing it names, so it ends the comparison before it starts.\n\nA component in the problem also drags the reader into the engine room. The argument becomes whether the framework should support the feature, and the person waiting nine hours drops off the page. A statement about what someone cannot do, or how long they wait, can be checked against a customer, measured before and after, and met by any of several designs. The two-fixes test is a cheap way of checking that you wrote one.",
  failureMode: "The design review spends forty minutes on how many workers the backfill mode should start and whether the framework should own that setting. Nobody asks why a customer waits nine hours for a first report. Parallel backfill ships after a quarter and first syncs drop to four hours, still a lost afternoon. A cheaper option, loading the last thirty days first, was never on the page, because the statement had already picked.",
  worked: "The design doc's problem statement says \"we need a parallel backfill mode\", which is a solution sitting where the problem should be. Underlining finds connector framework, backfill, activity worker and mode, so a colleague outside engineering could not read it. The rewrite says who waits and for what: \"A new customer who connects a large source waits up to nine hours before any data appears in the product, and last quarter six onboarding calls ended with an empty screen.\" Two different fixes would each make that false: parallel backfill, as drafted, or syncing the most recent 30 days first so the first report works while the history fills in behind it. The old statement admitted only the first.\n\nThe cost is a statement that is harder to write and easier to attack. The six calls had to be counted with sales, and both that count and the nine hours can now be wrong in a review. The design doc also loses its comfortable first paragraph. The problem no longer implies a design, so the doc has to compare fixes instead of describing one.",
  experiment: "Open the problem statement of a design doc you are writing or reviewing. Underline every component it names, then rewrite it as who is waiting or cannot do what, with one number. Write two fixes that would each make it false. If you can only write one, rewrite again, then show it to the person who feels the problem and ask whether it describes their week.",
  reflection: "Which problem statement in a doc you wrote this quarter would still read as a problem if you deleted the name of your own system from it?",
  recall: {
    q: "Why does naming a component in the problem statement end the comparison of fixes, and how do you test for it?",
    a: "A statement that names a component, or the absence of one, can only be closed by building that thing, so it picks the design before anyone compares.\n\nTest it: can two unlike fixes each make the statement stop being true? If only one comes to mind, you wrote a solution."
  },
  deepDive: "Here is the problem statement from a design doc I am writing. Strip out every component, rewrite it as who is waiting or cannot do what, and list the fixes my old wording ruled out."
}
);
