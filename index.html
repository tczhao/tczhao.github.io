<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tianchu Zhao</title>
<meta name="description" content="Standalone things that live at their own URL.">
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spline+Sans+Mono:wght@400;500&display=swap">
<style>
  :root {
    --hall-bg: #0c0b09;
    --hall-ink: #e9e3d6;
    --hall-dim: #7a7362;
    --hall-line: rgba(233,227,214,0.16);
    --mono: 'Spline Sans Mono', ui-monospace, monospace;
    --header-h: 58px;
    --ease-row: cubic-bezier(0.22, 0.8, 0.25, 1);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100dvh;
    background: var(--hall-bg);
    color: var(--hall-ink);
    font-family: var(--mono);
    display: flex;
    flex-direction: column;
  }

  .masthead {
    min-height: var(--header-h);
    flex: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px 24px;
    padding: 0 22px;
    border-bottom: 1px solid var(--hall-line);
    animation: fade 0.6s ease both 0.15s;
  }
  .wordmark {
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.38em;
    text-transform: uppercase;
    color: var(--hall-ink);
    text-decoration: none;
    white-space: nowrap;
  }
  .links {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px 18px;
    font-size: 11.5px;
    letter-spacing: 0.04em;
    color: var(--hall-dim);
    white-space: nowrap;
  }
  .links a {
    color: inherit;
    text-decoration: none;
    transition: color 0.25s;
  }
  .links a:hover, .links a:focus-visible { color: var(--hall-ink); }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  /* Rows share the screen while there are few of them and hold their minimum
     height once there are many, so the page scrolls rather than squeezing. */
  .row {
    --ac: var(--hall-ink);
    flex: 1 0 auto;
    min-height: 260px;
    position: relative;
    overflow: hidden;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-content: center;
    align-items: center;
    gap: 32px 56px;
    padding: 36px clamp(22px, 6vw, 88px);
    text-decoration: none;
    border-bottom: 1px solid rgba(0,0,0,0.55);
    transition: filter 0.45s ease;
    animation: rise 0.65s var(--ease-row) both;
    animation-delay: min(var(--i) * 95ms, 570ms);
  }
  .row:last-child { border-bottom: none; }
  .row:focus-visible {
    outline: 2px solid var(--ac);
    outline-offset: -8px;
  }

  @media (hover: hover) {
    main:has(.row:is(:hover,:focus-visible)) .row:not(:hover,:focus-visible) {
      filter: brightness(0.72) saturate(0.82);
    }
    .row:is(:hover,:focus-visible) .row-title { transform: scale(1.05); }
  }

  .copy {
    display: block;
    max-width: 62ch;
  }
  .eyebrow {
    display: block;
    margin-bottom: 18px;
    font-size: 10.5px;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    text-wrap: balance;
    color: var(--ac);
  }
  .row-title {
    display: block;
    font-size: clamp(34px, 4.2vw, 60px);
    line-height: 1.04;
    margin-bottom: 14px;
    transform-origin: left bottom;
    transition: transform 0.55s var(--ease-row);
  }
  .desc {
    display: block;
    font-size: 12.5px;
    line-height: 1.7;
    letter-spacing: 0.01em;
  }
  .enter {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    margin-top: 18px;
    font-size: 11.5px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ac);
  }
  .enter .arrow { transition: transform 0.3s var(--ease-row); }
  .row:is(:hover,:focus-visible) .enter .arrow { transform: translateX(5px); }

  .scene {
    display: flex;
    justify-content: center;
  }

  /* Practicum: the site's own graph paper, in its dark palette */
  .row--practicum {
    --ac: #6ea8d4;
    color: #dce3e9;
    background:
      linear-gradient(to right,  rgba(158,190,214,0.085) 0 1px, transparent 1px) 0 0 / 140px 140px,
      linear-gradient(to bottom, rgba(158,190,214,0.085) 0 1px, transparent 1px) 0 0 / 140px 140px,
      linear-gradient(to right,  rgba(158,190,214,0.055) 0 1px, transparent 1px) 0 0 / 28px 28px,
      linear-gradient(to bottom, rgba(158,190,214,0.055) 0 1px, transparent 1px) 0 0 / 28px 28px,
      linear-gradient(180deg, #171d24 0%, #0b0e12 100%);
  }
  .row--practicum .desc { color: #96a2ad; }
  .row--practicum .row-title {
    font-family: Superclarendon, Rockwell, 'Bookman Old Style', 'Roboto Slab', Georgia, serif;
    font-weight: 400;
    letter-spacing: -0.022em;
  }
  .logbook {
    position: relative;
    display: grid;
    gap: 17px;
    width: 236px;
    padding: 22px 22px 24px 50px;
    border: 1px solid rgba(158,190,214,0.22);
    border-radius: 4px;
    background: #171d24;
    box-shadow: 0 16px 34px -18px rgba(0,0,0,0.7);
  }
  .logbook::before {
    content: '';
    position: absolute;
    top: 0;
    bottom: 0;
    left: 38px;
    width: 1px;
    background: rgba(217,117,92,0.36);
  }
  .entry {
    position: relative;
    display: block;
    width: var(--w);
    height: 2px;
    border-radius: 1px;
    background: rgba(220,227,233,0.45);
  }
  .entry::before {
    content: '';
    position: absolute;
    top: -4px;
    left: -34px;
    width: 10px;
    height: 10px;
    border-radius: 2px;
    background: var(--ac);
  }
  /* Every earlier day is already logged; hovering writes today's entry. */
  .entry.today {
    width: 0;
    transition: width 0.9s var(--ease-row);
  }
  .entry.today::before {
    background: transparent;
    box-shadow: inset 0 0 0 1.5px rgba(217,117,92,0.75);
    transition: background 0.45s ease, box-shadow 0.45s ease;
  }
  .row--practicum:is(:hover,:focus-visible) .entry.today { width: var(--w); }
  .row--practicum:is(:hover,:focus-visible) .entry.today::before {
    background: #d9755c;
    box-shadow: 0 0 12px rgba(217,117,92,0.6);
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(26px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fade {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  @media (max-width: 700px) {
    .masthead {
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      padding: 16px 20px;
    }
    .row {
      grid-template-columns: minmax(0, 1fr);
      padding: 28px 20px 30px;
    }
    .scene { justify-content: flex-start; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation: none !important;
      transition: none !important;
    }
  }
</style>
</head>
<body>

<header class="masthead">
  <a class="wordmark" href="/">Tianchu Zhao</a>
  <div class="links">
    <a href="https://github.com/tczhao" target="_blank" rel="noopener noreferrer">GitHub</a>
    <a href="https://au.linkedin.com/in/tczhao" target="_blank" rel="noopener noreferrer">LinkedIn</a>
    <a href="https://wklytech.medium.com/" target="_blank" rel="noopener noreferrer">Medium</a>
    <a href="https://www.kaggle.com/tobycat" target="_blank" rel="noopener noreferrer">Kaggle</a>
    <span>&copy; 2026</span>
  </div>
</header>

<main>
  <a class="row row--practicum" href="sub/practicum/dist/" style="--i:0">
    <span class="copy">
      <span class="eyebrow">logbook &middot; management practice &middot; one day at a time</span>
      <span class="row-title">Practicum</span>
      <span class="desc">152 entries from the management canon, tagged by level from running one team to leading across an org. Each day brings an experiment to run at work.</span>
      <span class="enter">Enter <span class="arrow">&rarr;</span></span>
    </span>
    <span class="scene">
      <span class="logbook">
        <span class="entry" style="--w:84%"></span>
        <span class="entry" style="--w:62%"></span>
        <span class="entry" style="--w:92%"></span>
        <span class="entry" style="--w:48%"></span>
        <span class="entry today" style="--w:72%"></span>
      </span>
    </span>
  </a>
</main>

</body>
</html>
